<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finished Chatbot Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Text&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Same tokens and player shell as the Template B explorer: rail on top, one card on a tinted stage, Back and Next below. */
:root{
  --bg:#FFFFFF;--stage:#FAFAFA;--surface:#FFFFFF;--text:#000000;--text-2:#666666;
  --purple:#3D1FBC;--action:#2550D0;--action-hover:#14369C;--on-action:#FFFFFF;
  --tint:#E5E0FA;--tint-2:#D2CAF5;--peri:#DCE1FF;--line:#DDDDDD;--line-soft:#EEEEEE;--line-strong:#C9C6C5;
  --note-bg:#F3F0FD;--note-line:#D2CAF5;--icode-bg:#EFEBFC;--icode-text:#2A1590;
  --code-bg:#17142C;--code-head:#1F1B3A;--code-line:#2E2954;--code-text:#ECE9FF;--code-muted:#9590B5;--code-str:#AFC0FF;
  --focus:#2550D0;--end-bg:#EEF0FF;--end-text:#4D5380;
  --f-display:"DM Serif Text", Georgia, "Times New Roman", serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line-soft);padding:9px 16px 7px}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:5px;background:none;border:0;padding:3px 2px 1px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.pg i{display:block;height:4px;border-radius:2px;background:var(--line)}
.pg.is-done i{background:var(--purple)}
.pg.is-cur i{background:var(--purple);height:6px;margin:-1px 0}
.pg-label{font-size:12px;font-weight:500;line-height:1.2;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--purple)}
.pg.is-cur .pg-label{color:var(--text);font-weight:600}

/* Stage and card */
.stage{flex:1 1 auto;min-height:0;background:var(--stage);padding:12px 16px;display:flex}
.card{flex:1;min-width:0;min-height:0;overflow-y:auto;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:clamp(16px,3vw,28px)}
.inner{display:flex;flex-direction:column;gap:14px;max-width:820px;margin:0 auto}
.inner.anim{animation:in .28s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(22px,1.5vw + 14px,30px);line-height:1.15}
.p{margin:0;font-size:clamp(14.5px,.5vw + 12px,16px);line-height:1.58}
.p b{font-weight:600}
code{font-family:var(--f-mono);font-size:.86em;background:var(--icode-bg);color:var(--icode-text);padding:0 .3em;border-radius:5px;overflow-wrap:anywhere}

/* Mock Gradio window */
.win{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#FFFFFF}
.win-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--stage);border-bottom:1px solid var(--line-soft);font-size:12.5px;color:var(--text-2);min-width:0}
.dots{display:flex;gap:5px;flex:none}.dots span{width:9px;height:9px;border-radius:50%;background:var(--line)}
.win-url{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono);font-size:12px}
.win-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.app-h{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.drop{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line-strong);border-radius:10px;padding:12px;min-width:0}
.drop svg{width:22px;height:22px;flex:none;color:var(--purple)}
.fname{font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 18px;border-radius:999px;border:1px solid var(--action);background:var(--action);color:var(--on-action);font-weight:600;font-size:14px;cursor:pointer;align-self:flex-start}
.gbtn:hover{background:var(--action-hover)}
.gbtn.sec{background:#FFFFFF;color:var(--action)}
.gbtn.sec:hover{background:var(--note-bg)}
.gbtn:disabled{opacity:.5;cursor:default}
.info{background:var(--note-bg);border:1px solid var(--note-line);border-radius:10px;padding:12px 14px;font-size:14px}
.info b{font-weight:600}
.info ul{margin:6px 0 0;padding-left:18px}
.info li{margin:2px 0}
.hint{font-size:13px;color:var(--text-2);margin:0}

/* Placeholders: clearly marked, never real output */
.ph{display:inline;background:var(--note-bg);border:1px dashed var(--note-line);border-radius:5px;padding:0 4px;white-space:nowrap}
.bub .ph{white-space:normal}
.scroll-hint{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;font-weight:500;color:var(--purple)}
.scroll-hint svg{width:14px;height:14px}
.scroll-hint[hidden]{display:none}
.ph-tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--purple);background:var(--tint);border-radius:999px;padding:1px 8px;margin-bottom:6px}

/* Structure list */
.docs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.docs li{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;min-width:0}
.docs .dt{font-weight:600;min-width:0}
.docs .pp{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--text-2)}
@media (max-width:519px){.docs{grid-template-columns:minmax(0,1fr)}}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:60px}
.bub{max-width:92%;border-radius:14px;padding:10px 13px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.bub.user{align-self:flex-end;background:var(--action);color:var(--on-action);border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:var(--stage);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.bot ul{margin:4px 0 6px;padding-left:18px}
.bub.bot .meta{font-style:italic;color:var(--text-2)}
.typing{align-self:flex-start;color:var(--text-2);font-size:13px}
.ask{display:flex;gap:8px;flex-wrap:wrap}
.log{background:var(--code-bg);color:var(--code-text);border-radius:10px;overflow:hidden}
.log-h{padding:6px 12px;background:var(--code-head);border-bottom:1px solid var(--code-line);font-size:12px;color:var(--code-muted)}
.log pre{margin:0;padding:10px 12px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}

/* Checklist */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px}
.checks .ck{width:24px;height:24px;border-radius:7px;background:var(--tint);color:var(--purple);display:grid;place-items:center}
.checks .ck svg{width:14px;height:14px}
.checks li.yours{border-color:var(--purple);background:var(--note-bg)}
.tag{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:600;color:var(--purple);background:#FFFFFF;border:1px solid var(--tint-2);border-radius:999px;padding:0 8px;vertical-align:1px}

/* Footer */
.foot{flex:none;border-top:1px solid var(--line-soft);padding:8px 16px;display:flex;align-items:center;gap:12px}
.btn-back{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:8px 16px 8px 12px;font-size:14px;font-weight:500;cursor:pointer}
.btn-back:disabled{opacity:.4;cursor:default}
.btn-back svg,.btn-next svg{width:15px;height:15px;flex:none}
.where{flex:1;min-width:0;text-align:center;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.btn-next{display:inline-flex;align-items:center;gap:8px;background:var(--action);color:var(--on-action);border:1px solid var(--action);border-radius:999px;padding:8px 16px 8px 20px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-next:hover{background:var(--action-hover)}
.btn-next.end{background:var(--end-bg);border-color:var(--end-bg);color:var(--end-text);cursor:default}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <h1 class="sr-only">See the Finished Chatbot Work</h1>
  <header class="top"><nav class="rail" id="rail" aria-label="Cards"></nav></header>
  <main class="stage"><section class="card" id="card" aria-live="polite"></section></main>
  <footer class="foot">
    <button type="button" class="btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="where" id="where">Card 1 of 4</div>
    <button type="button" class="btn-next" id="next"><span id="next-label">Next</span><svg id="next-ic" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var URL_BAR = '<div class="win-bar"><span class="dots" aria-hidden="true"><span></span><span></span><span></span></span><span class="win-url">https://&lt;your-link&gt;.gradio.live</span></div>';
  var FILE_IC = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3.5h7l4 4v11.5c0 .8-.7 1.5-1.5 1.5h-9.5c-.8 0-1.5-.7-1.5-1.5v-14c0-.8.7-1.5 1.5-1.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3.5v4h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  var DOWN = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v9.5M4 8.5l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var CHECK = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* Real values from the team notebook's saved run (STEP 11 log): 10 pages, 8 documents, 8 chunks. */
  var DOCS = [
    ["Cover Letter","0-0"],["Certificate Of Quality","1-1"],["Certificate Of Quality","2-2"],["Packaging Specification","3-4"],
    ["Bse/Tse Declaration","5-5"],["Material Description","6-6"],["Supplier Qualification","7-8"],["Chain Of Custody","9-9"]
  ];

  var VIEWS = [
    { label:"Upload", render:function(){
      return '<h2 class="title">1. Upload the Supplier PDF</h2>' +
        '<p class="p">A supplier sends Pfizer one big PDF with many documents inside it. In the finished app, you drop that PDF into the upload box. Press <b>Process Document</b> to see what the app does with it.</p>' +
        '<div class="win">' + URL_BAR + '<div class="win-body">' +
          '<p class="app-h">Pharmaceutical Document Q&amp;A System</p>' +
          '<div class="drop">' + FILE_IC + '<span class="fname">pharma-blob-sample.pdf</span></div>' +
          '<button type="button" class="gbtn" id="proc">Process Document</button>' +
          '<div id="info" class="info" hidden>' +
            '<b>Successfully Processed:</b><ul>' +
            '<li>File: pharma-blob-sample.pdf</li><li>Pages: 10</li><li>Documents Found: 8</li><li>Chunks Created: 8</li>' +
            '<li>Time: <span class="ph">[time from your run]</span></li></ul></div>' +
          '<p class="hint" id="proc-hint" hidden>These numbers come from the team\'s real test run. A <b>chunk</b> is a small piece of text the app can search.</p>' +
        '</div></div>';
    }, wire:function(){
      var b = document.getElementById("proc");
      b.addEventListener("click", function(){
        b.disabled = true; b.textContent = "Processing...";
        setTimeout(function(){
          document.getElementById("info").hidden = false;
          document.getElementById("proc-hint").hidden = false;
          b.textContent = "Processed";
        }, 700);
      });
    }},
    { label:"Read", render:function(){
      var li = DOCS.map(function(d){ return '<li><span class="dt">' + d[0] + '</span><span class="pp">Pages ' + d[1] + '</span></li>'; }).join("");
      return '<h2 class="title">2. See What It Found Inside</h2>' +
        '<p class="p">The app reads every page and works out where one document ends and the next begins. In the team\'s run, it found <b>8 documents</b> inside the 10 pages, of <b>7 different types</b>.</p>' +
        '<ul class="docs">' + li + '</ul>' +
        '<p class="hint">Page numbers start at 0 because Python counts from 0, so "Pages 0-0" means the first page.</p>';
    }},
    { label:"Ask", render:function(){
      return '<h2 class="title">3. Ask a Question in Plain Words</h2>' +
        '<p class="p">Now anyone can ask a question, just like texting a friend. Press the example button the team built into the app.</p>' +
        '<p class="scroll-hint" id="scroll-hint" hidden>' + DOWN + 'Scroll down to see the answer</p>' +
        '<div class="win">' + URL_BAR + '<div class="win-body">' +
          '<div class="chat" id="chat"></div>' +
          '<div class="ask"><button type="button" class="gbtn sec" id="ask">Find lot numbers</button></div>' +
        '</div></div>' +
        '<div class="log" id="log" hidden><div class="log-h">Colab log from the team\'s saved run (real)</div><pre>Query routing error: Expecting value: line 1 column 1 (char 0)\nQuery routed to: Other (confidence: 0.00)</pre></div>' +
        '<p class="hint" id="log-hint" hidden>This log line looks scary but is harmless: the app could not guess the document type, so it searched every chunk instead. Answers still come back.</p>';
    }, wire:function(){
      var b = document.getElementById("ask"), chat = document.getElementById("chat");
      b.addEventListener("click", function(){
        b.disabled = true;
        chat.innerHTML = '<div class="bub user">What lot numbers or batch numbers are mentioned in these documents?</div><div class="typing">Thinking...</div>';
        setTimeout(function(){
          chat.innerHTML = '<div class="bub user">What lot numbers or batch numbers are mentioned in these documents?</div>' +
            '<div class="bub bot"><span class="ph-tag">Placeholder: paste a real answer from a test run</span><br>' +
            '<span class="ph">[The answer your model writes, naming the document types it used]</span><br><br>' +
            '<b>Sources:</b><ul>' +
            '<li><span class="ph">[Document type]</span> (Pages <span class="ph">[a-b]</span>) - Relevance: <span class="ph">[xx.xx%]</span></li>' +
            '<li><span class="ph">[Document type]</span> (Pages <span class="ph">[a-b]</span>) - Relevance: <span class="ph">[xx.xx%]</span></li></ul>' +
            '<span class="meta">Confidence: <span class="ph">[xx.x%]</span> | Filter: <span class="ph">[filter used]</span></span></div>';
          document.getElementById("log").hidden = false;
          document.getElementById("log-hint").hidden = false;
          /* The answer can sit below the fold on a phone: show the hint and scroll the card to it */
          var bot = chat.querySelector(".bub.bot"), cr = card.getBoundingClientRect();
          if (bot && bot.getBoundingClientRect().bottom > cr.bottom) {
            document.getElementById("scroll-hint").hidden = false;
            var top = card.scrollTop + bot.getBoundingClientRect().top - cr.top - 12;
            if (card.scrollTo) card.scrollTo({ top: top, behavior: REDUCE ? "auto" : "smooth" }); else card.scrollTop = top;
          }
        }, 900);
      });
    }},
    { label:"Check", render:function(){
      return '<h2 class="title">4. What Your Chatbot Must Show</h2>' +
        '<p class="p">Ana wants to trust every answer, so each reply needs four things. The team\'s app already shows three. You add the fourth.</p>' +
        '<ul class="checks">' +
          '<li><span class="ck">' + CHECK + '</span><span><b>An answer</b> written only from the PDF</span></li>' +
          '<li><span class="ck">' + CHECK + '</span><span><b>Sources:</b> the document type and pages</span></li>' +
          '<li><span class="ck">' + CHECK + '</span><span><b>Confidence:</b> how closely the chunks matched the question</span></li>' +
          '<li class="yours"><span class="ck">' + CHECK + '</span><span><b>Chunks used:</b> how many pieces of text it read<span class="tag">You add this</span></span></li>' +
        '</ul>' +
        '<p class="p">And one big change: yours answers with an <b>open-source model</b>, not Gemini.</p>';
    }}
  ];

  var i = 0, rail = document.getElementById("rail"), card = document.getElementById("card");
  var back = document.getElementById("back"), next = document.getElementById("next");
  var where = document.getElementById("where"), nl = document.getElementById("next-label"), ni = document.getElementById("next-ic");

  VIEWS.forEach(function(v, k){
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.innerHTML = '<i></i><span class="pg-label">' + v.label + '</span>';
    b.setAttribute("aria-label", "Card " + (k + 1) + ": " + v.label);
    b.addEventListener("click", function(){ go(k); });
    rail.appendChild(b);
  });

  function go(k){
    i = k;
    card.innerHTML = '<div class="inner anim">' + VIEWS[i].render() + '</div>';
    if (VIEWS[i].wire) VIEWS[i].wire();
    card.scrollTop = 0;
    Array.prototype.forEach.call(rail.children, function(b, n){
      b.classList.toggle("is-done", n < i); b.classList.toggle("is-cur", n === i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    where.textContent = "Card " + (i + 1) + " of " + VIEWS.length;
    back.disabled = i === 0;
    var last = i === VIEWS.length - 1;
    next.classList.toggle("end", last);
    nl.textContent = last ? "Now build yours" : "Next";
    ni.style.display = last ? "none" : "";
  }
  back.addEventListener("click", function(){ if (i > 0) go(i - 1); });
  next.addEventListener("click", function(){ if (i < VIEWS.length - 1) go(i + 1); });
  go(0);
})();
</script>
</body></html>
