<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Summary Would Ray Act On?</title>
<!--
  vCISO P5 Step 2, Module 6, interactive: Which Summary Would Ray Act On?
  Built from the Extern deck shell, matched to the house look of
  09-assets/final/vciso-p5-m1-whats-missing-from-the-deck.html and
  vciso-p5-m2-two-risks-one-score.html.
  Governing authority: output/programs/vciso/VCISO-STYLE-GUIDE.md section 6.
  Source: Doc from SME/SME drop 2026-09-25/P5 Sample Pack/
  Interactive content sets - P5.md, P5-6, and Shared Tools/
  Executive summary template.docx, "The one rule".

  Spec rules kept here:
  - Two whole summaries, side by side, for the same assessment. A reaches
    its conclusion in the third paragraph; B opens with it (P5-6).
  - Same facts, only the order differs (P5 README, "Where the prose is
    doing the most work", point 4). Every paragraph is Chaitanya's own
    sentence: the template's activity opening (its first sentence only,
    cut before "Section 1 covers", because there is no report), the five
    areas in P5-5's order, and his model sentence B, verbatim.
  - Answer: B. Picking a card is the commit. The pick locks at once.
  - Not in this deck, because the module prose carries it right after
    the embed: "Did you pick B?", the rule "Conclusion first. Method
    second. Detail never." and what conclusion, method and detail mean.

  Verify before shipping, both gates, every time:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs   this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  /* ===============================================================
     The palette. The Extern five, plus the vCISO per-slide tint ramp
     (VCISO-STYLE-GUIDE.md 6b, listed in 09-assets/deck-palette.json).
     Tint carries no meaning. Every tint of navy is an rgba() of
     #001D69. No state is ever signalled by colour alone: every
     coloured state also carries a glyph or a label.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, borders, fills      */
    --bg:#FDF8F8;           /* canvas background, and text on navy */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t2 h1{font-size:25px;margin-bottom:7px}
  body.t2 .kick{margin-bottom:2px}

  /* ---- the 960x540 canvas, scaled down only, never up ----
     flex:0 0 auto is load bearing: the canvas always holds 960 in layout
     and the transform does all of the fitting. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}

  /* The line above the heading on slide 2: what the student picked. */
  .kick{flex:0 0 auto;font-size:16px;line-height:1.4;color:var(--body);margin-bottom:4px}
  .kick b{color:var(--title);font-weight:600}
  .kick .gl{display:inline-block;width:1.1em;font-weight:700;color:var(--on-highlight)}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
  .intro{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px;max-width:74ch}
  .intro p{font-size:17px;line-height:1.5}
  .intro p b{color:var(--title);font-weight:600}
  p.lead{flex:0 0 auto;font-size:17px;line-height:1.45;color:var(--body);margin-top:-4px;max-width:82ch}
  button.jump{font-family:inherit;font-size:15px;font-weight:600;color:var(--on-highlight);align-self:flex-start;
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:7px;padding:8px 15px;cursor:pointer}
  button.jump:hover{background:var(--tint2)}
  button.jump:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  svg.ic{width:28px;height:28px;flex:0 0 auto;fill:none;stroke:var(--on-highlight);stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}

  /* ---- slide 1: two summary cards, side by side ----
     Both cards look the same until one is picked. */
  .cards{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .scard{min-height:0;display:flex;flex-direction:column;gap:7px;
    background:var(--bg);border:1.5px solid var(--on-highlight);border-left-width:6px;border-radius:12px;
    padding:10px 16px 12px;transition:opacity var(--t-fast) var(--ease-out)}
  .scard .sh{display:flex;align-items:center;gap:10px}
  .scard .ib{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--on-highlight);
    background:var(--highlight);display:flex;align-items:center;justify-content:center}
  .scard .ib svg.ic{width:18px;height:18px}
  .scard .sl{font-size:18px;line-height:1.25;font-weight:600;color:var(--title)}
  .scard .doc{display:flex;flex-direction:column;gap:6px}
  .scard .doc p{font-size:15px;line-height:1.38;color:var(--body)}
  .scard .sp{flex:1 1 auto}
  .scard.is-off{opacity:.5}

  button.ans{font-family:inherit;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 14px;
    background:var(--bg);color:var(--title);border:2px solid var(--on-highlight);border-radius:10px;
    transition:background var(--t-fast) var(--ease-out),color var(--t-fast) var(--ease-out),opacity var(--t-fast) var(--ease-out)}
  button.ans:hover:not(:disabled){background:var(--highlight)}
  button.ans:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.ans:disabled{cursor:default}
  button.ans .bk{flex:0 0 auto;width:30px;height:28px;border-radius:6px;border:1.5px solid var(--on-highlight);
    background:var(--highlight);font-size:15px;font-weight:600;color:var(--on-highlight);
    display:flex;align-items:center;justify-content:center}
  button.ans .al{flex:1 1 auto;font-size:17px;font-weight:600;line-height:1.25}
  button.ans .tg{flex:0 0 auto;font-size:13px;font-weight:600;white-space:nowrap}
  /* After the pick. The right answer is always the filled one, with a
     tick. A wrong pick gets a cross, a struck label and a dashed edge.
     Glyph and words every time, never colour alone. */
  button.ans.is-right{background:var(--on-highlight);color:var(--bg)}
  button.ans.is-right .bk{background:var(--bg);border-color:var(--bg)}
  button.ans.is-wrong{border-style:dashed;background:transparent}
  button.ans.is-wrong .al{text-decoration:line-through;text-decoration-thickness:1.5px;font-weight:400;color:var(--body)}
  button.ans.is-wrong .tg{color:var(--body)}

  /* ---- slide 2: what Ray reads properly, and what he skims ---- */
  .reveal{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px}
  .reveal .cards{flex:0 0 auto}
  .rcard{min-height:0;display:flex;flex-direction:column;gap:5px;
    background:var(--bg);border:1.5px solid var(--on-highlight);border-left-width:6px;border-radius:12px;padding:8px 14px 10px}
  .rcard .sh{display:flex;align-items:center;gap:10px}
  .rcard .sl{font-size:16px;line-height:1.25;font-weight:600;color:var(--title)}
  .rcard .tag{margin-left:auto;font-size:13px;font-weight:600;white-space:nowrap;color:var(--on-highlight);
    background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;padding:2px 9px}
  .rk{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .read{background:var(--highlight);border-radius:0 8px 8px 0;border-left:4px solid var(--on-highlight);padding:5px 10px;
    display:flex;flex-direction:column;gap:2px}
  .read p{font-size:14px;line-height:1.33;color:var(--title)}
  .skim{border:1.5px dashed var(--line);border-radius:8px;padding:4px 10px 5px;display:flex;flex-direction:column;gap:2px}
  .skim .rk{color:var(--body)}
  .skim p{font-size:13px;line-height:1.3;color:var(--body);opacity:.8}

  /* The blue lead bar: the line that explains the answer. */
  .why{flex:0 0 auto;border-radius:0 10px 10px 0;border-left:4px solid var(--on-highlight);background:var(--highlight);
    padding:6px 16px 7px;display:flex;flex-direction:column;gap:3px}
  .why .wr{font-size:16px;line-height:1.4;color:var(--body)}
  .why .wh{font-size:17px;line-height:1.3;font-weight:600;color:var(--title)}
  .reveal.in{animation:rin var(--t-reveal) var(--ease-over) both}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* ---- the bar ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:12px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  .endline{align-self:center;font-size:14px;font-weight:600;color:var(--title)}
  #hint{flex:1 1 auto;min-width:0;height:44px;overflow-y:auto;font-size:13px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .segs i{width:14px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .intro p,p.lead{font-size:16px}
    .kick{font-size:16px}
    .cards{grid-template-columns:1fr;gap:14px}
    .scard{padding:14px 14px}
    .scard .sl{font-size:18px}
    .scard .doc p{font-size:16px}
    .scard .sp{display:none}
    button.ans .al{font-size:17px}
    .rcard{padding:12px 12px}
    .rcard .sl{font-size:17px}
    .rcard .sh{flex-wrap:wrap;row-gap:6px}
    .rcard .sl{flex:1 1 100%}
    .rcard .tag{margin-left:0}
    .rk{font-size:12px}
    .read p{font-size:16px}
    .skim p{font-size:15px}
    .why{padding:14px 16px}
    .why .wr{font-size:16px}
    .why .wh{font-size:18px}
    button.jump{font-size:16px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    .endline{flex:1 1 100%;font-size:15px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Which summary does Ray act on?">

    <div class="top">
      <span class="prog" id="prog">1 of 2</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
    </div>

    <p class="kick" id="kick" hidden></p>
    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Continue</button>
      <button class="nav ghost" id="again" type="button" hidden>Start again</button>
      <span class="endline" id="endline" hidden>Go back to the module and keep reading.</span>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}

  <div class="nsf">
    <h2>Which summary does Ray act on?</h2>
    <p>Both are about the same Cumberland assessment. Pick the one that you think Ray would act on, and write it down before you read on.</p>
    <h3>Summary A</h3>
    <p>This assessment was carried out over eight weeks across five areas of the business, referencing the NIST Cybersecurity Framework 2.0.</p>
    <p>It covered scope, then exposure, then vulnerabilities, then controls, then evidence.</p>
    <p>Cumberland cannot currently evidence four of the eight security claims it makes to its largest customer, and runs patient systems on software its vendor no longer supports.</p>
    <h3>Summary B</h3>
    <p>Cumberland cannot currently evidence four of the eight security claims it makes to its largest customer, and runs patient systems on software its vendor no longer supports.</p>
    <p>This assessment was carried out over eight weeks across five areas of the business, referencing the NIST Cybersecurity Framework 2.0.</p>
    <p>It covered scope, then exposure, then vulnerabilities, then controls, then evidence.</p>
    <h3>Ray acts on Summary B.</h3>
    <div class="box">
      <p>Both summaries say the same three things, in a different order. Ray reads the first paragraph properly and skims the rest, so only B tells him where Cumberland stands.</p>
      <p><strong>Both are true. Only one gets acted on.</strong></p>
    </div>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ================ content ================
     P5-6 and the Executive summary template, verbatim sentences.
     P_METHOD: the template's activity opening, first sentence only.
     P_AREAS:  the five areas, in P5-5's order of discovery.
     P_CONCL:  the template's model opening, Chaitanya's sentence B.
     Both summaries hold the same three paragraphs. Only the order differs. */
  var P_METHOD = "This assessment was carried out over eight weeks across five areas of the business, referencing the NIST Cybersecurity Framework 2.0.";
  var P_AREAS  = "It covered scope, then exposure, then vulnerabilities, then controls, then evidence.";
  var P_CONCL  = "Cumberland cannot currently evidence four of the eight security claims it makes to its largest customer, and runs patient systems on software its vendor no longer supports.";

  var SUMS = [
    { id:"a", key:"A", label:"Summary A", paras:[P_METHOD, P_AREAS, P_CONCL] },
    { id:"b", key:"B", label:"Summary B", paras:[P_CONCL, P_METHOD, P_AREAS] }
  ];
  var RIGHT = "b";
  var PICK_BTN = "Ray acts on this one";
  var READ_TAG = "Ray reads this properly";
  var SKIM_TAG = "Ray skims this";
  var WHY_1 = "Both summaries say the same three things, in a different order.";
  var WHY_2 = "Ray reads the first paragraph properly and skims the rest, so only B tells him where Cumberland stands.";
  var WHY_3 = "Both are true. Only one gets acted on.";

  var S = [
    { id:"pick",   kind:"pick",   label:"Your pick", h1:"Which summary does Ray act on?",
      lead:"Both are about the same Cumberland assessment. Pick the one that you think Ray would act on." },
    { id:"reveal", kind:"reveal", label:"The answer", h1:"Ray acts on Summary B." }
  ];

  /* Inline SVG icons, Phosphor style: one weight, outline, navy. */
  var ICON = {
    file:'<path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5"/><path d="M8.5 12.5h7"/><path d="M8.5 16h7"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICON[k] + "</svg>"; }
  var GLYPH = { out:"✕", ok:"✓" };

  /* ================ state ================
     Wrapped: a blocked storage API degrades silently, and the deck works
     from a clean state with nothing saved. */
  var KEY = "vciso-p5-m6-conclusion-first-v1";
  function sumOf(id){ for(var k=0;k<SUMS.length;k++) if(SUMS[k].id === id) return SUMS[k]; return null; }
  function fresh(){ return { pick:null }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!raw || typeof raw !== "object" || Array.isArray(raw)) return fresh();
      return { pick: sumOf(raw.pick) ? raw.pick : null };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Data validation, at load, loud. */
  (function validate(){
    var problems = [], ids = {};
    S.forEach(function(s, n){
      if(!s.id) problems.push("slide " + (n+1) + " has no id");
      if(ids[s.id]) problems.push('duplicate slide id "' + s.id + '"');
      ids[s.id] = 1;
    });
    if(!sumOf(RIGHT)) problems.push("the right answer is not one of the summaries");
    /* Same facts, only the order: both summaries must hold the same paragraphs. */
    var a = SUMS[0].paras.slice().sort().join("|"), b = SUMS[1].paras.slice().sort().join("|");
    if(a !== b) problems.push("the two summaries do not hold the same paragraphs");
    if(SUMS[0].paras[2] !== P_CONCL) problems.push("summary A must reach the conclusion in its third paragraph");
    if(SUMS[1].paras[0] !== P_CONCL) problems.push("summary B must open with the conclusion");
    if(problems.length){
      document.getElementById("board").innerHTML =
        '<div class="intro"><p><b>This deck has authoring errors and will not behave correctly:</b></p>' +
        '<ul style="font-size:13px;line-height:1.6;padding-left:18px">' +
        problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul></div>";
      throw new Error("deck data invalid: " + problems.join("; "));
    }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), kick:document.getElementById("kick"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    again:document.getElementById("again"), endline:document.getElementById("endline"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function say(m){ el.live.textContent = m; }
  function toTop(){
    try{ el.frame.focus({preventScroll:true}); }catch(e){ el.frame.focus(); }
    try{ window.scrollTo(0, 0); }catch(e){}
  }

  /* Resume: a saved pick opens on the answer. */
  var i = st.pick ? 1 : 0;

  /* ================ chrome ================ */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;
    el.back.disabled = (i === 0);
    el.again.hidden = !st.pick;
    /* The last slide has no Continue. A plain line says where to go next. */
    var end = (i === S.length-1);
    el.next.hidden = end;
    el.next.textContent = "Continue";
    el.next.disabled = end || !st.pick;
    el.endline.hidden = !(end && st.pick);
  }

  function render(anim){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.h1.textContent = s.h1;
    el.kick.hidden = true; el.kick.innerHTML = "";
    el.hint.textContent = "";
    if(s.kind === "pick") renderPick();
    else if(s.kind === "reveal") renderReveal(anim);
    else el.board.innerHTML = '<div class="intro"><p><b>Unhandled slide kind "' + esc(String(s.kind)) + '".</b></p></div>';
    el.frame.setAttribute("aria-label", el.h1.textContent);
    header();
  }

  /* ================ slide 1: two summaries, one pick ================
     Picking is the commit: both buttons lock once one is pressed. */
  function cardHTML(m){
    var pick = st.pick, done = !!pick, mine = pick === m.id;
    var cls = "ans", tag = "", sr = "";
    if(done){
      if(m.id === RIGHT){
        cls += " is-right";
        tag = GLYPH.ok + (mine ? " Your pick" : " Right answer");
        sr = mine ? " Your pick. Right answer." : " The right answer.";
      } else if(mine){
        cls += " is-wrong";
        tag = GLYPH.out + " Your pick";
        sr = " Your pick. Not quite.";
      }
    }
    return '<div class="scard' + (done && m.id !== RIGHT && !mine ? " is-off" : "") + '" role="group" aria-labelledby="sl-' + m.id + '">' +
      '<div class="sh"><span class="ib">' + icon("file") + '</span><p class="sl" id="sl-' + m.id + '">' + esc(m.label) + "</p></div>" +
      '<div class="doc">' + m.paras.map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("") + "</div>" +
      '<span class="sp" aria-hidden="true"></span>' +
      '<button class="' + cls + '" type="button" data-sum="' + m.id + '"' + (done ? " disabled" : "") + ">" +
        '<span class="bk" aria-hidden="true">' + m.key + "</span>" +
        '<span class="al">' + esc(PICK_BTN) + "</span>" +
        (tag ? '<span class="tg" aria-hidden="true">' + tag + "</span>" : "") +
        (sr ? '<span class="sr">' + sr + "</span>" : "") +
      "</button></div>";
  }

  function renderPick(){
    el.board.innerHTML = '<p class="lead">' + esc(S[0].lead) + "</p>" +
      '<div class="cards">' + SUMS.map(cardHTML).join("") + "</div>";
    Array.prototype.forEach.call(el.board.querySelectorAll("button.ans"), function(b){
      b.addEventListener("click", function(){ choose(b.dataset.sum); });
    });
    if(st.pick) el.hint.innerHTML = "<span><b>Your pick is in.</b> Press <b>Continue</b> to see why.</span>";
    else el.hint.innerHTML = "<span>Read both, then pick one. Your pick is final. On a keyboard, press A or B.</span>";
  }

  function choose(id){
    if(st.pick || !sumOf(id)) return;
    st.pick = id; save(st);
    render(false);
    try{ el.next.focus({preventScroll:true}); }catch(e){ el.next.focus(); }
    say("Your pick: " + sumOf(id).label + ". " + (id === RIGHT ? "Right." : "Not right. The right answer: " + sumOf(RIGHT).label + ".") +
      " Press Continue to see why.");
  }

  /* ================ slide 2: the answer ================
     The first paragraph of each summary is what Ray reads properly; the
     other two are what he skims. Label and border every time, never colour alone. */
  function readHTML(m){
    var right = m.id === RIGHT;
    return '<div class="rcard" role="group" aria-labelledby="rl-' + m.id + '">' +
      '<div class="sh"><p class="sl" id="rl-' + m.id + '">' + esc(m.label) + "</p>" +
        (right ? '<span class="tag"><span aria-hidden="true">' + GLYPH.ok + " </span>Ray acts on this one</span>" : "") +
        (st.pick === m.id ? '<span class="tag">● Your pick</span>' : "") + "</div>" +
      '<div class="read"><span class="rk">' + esc(READ_TAG) + '</span><p>' + esc(m.paras[0]) + "</p></div>" +
      '<div class="skim"><span class="rk">' + esc(SKIM_TAG) + "</span>" +
        m.paras.slice(1).map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("") + "</div>" +
      "</div>";
  }

  function renderReveal(anim){
    if(!st.pick){
      el.h1.textContent = "Make your pick first.";
      el.board.innerHTML = '<div class="intro"><p>Make your pick first. The answer shows here once you do.</p>' +
        '<button class="jump" type="button" id="topick">Go to the two summaries</button></div>';
      el.board.querySelector("#topick").addEventListener("click", function(){ i = 0; render(false); toTop(); });
      return;
    }
    var right = st.pick === RIGHT;
    el.kick.hidden = false;
    el.kick.innerHTML = 'You picked <b>' + esc(sumOf(st.pick).label) + '</b>. <span class="gl" aria-hidden="true">' +
      (right ? GLYPH.ok : GLYPH.out) + "</span>" + (right ? "Right." : "Not right.");
    el.board.innerHTML =
      '<div class="reveal' + (anim && !reduce ? " in" : "") + '" id="rv">' +
        '<div class="cards">' + SUMS.map(readHTML).join("") + "</div>" +
        '<div class="why"><p class="wr">' + esc(WHY_1) + " " + esc(WHY_2) + '</p><p class="wh">' + esc(WHY_3) + "</p></div>" +
      "</div>";
  }

  /* ================ start again ================ */
  function resetAll(){ st = fresh(); save(st); i = 0; render(false); }
  el.again.addEventListener("click", function(){
    resetAll(); toTop();
    say("Cleared. Back to the two summaries. Pick the one that you think Ray would act on.");
  });

  /* ================ navigation ================ */
  function announce(){
    if(S[i].kind === "reveal" && st.pick){
      return "Slide 2 of 2. You picked " + sumOf(st.pick).label + ". " + (st.pick === RIGHT ? "Right. " : "Not right. ") +
        S[1].h1 + " " + WHY_1 + " " + WHY_2 + " " + WHY_3;
    }
    return "Slide " + (i+1) + " of " + S.length + ". " + el.h1.textContent;
  }
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    if(d > 0 && !st.pick){
      el.hint.innerHTML = "<span><b>Pick one summary first.</b> Then you can go on.</span>";
      return;
    }
    i = n; render(d > 0); toTop();
    say(announce());
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return true;
    var r = node.getAttribute && node.getAttribute("role");
    return r === "slider" || r === "textbox" || r === "spinbutton" || r === "listbox";
  }

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(i === 0 && !st.pick && !e.metaKey && !e.ctrlKey && !e.altKey){
      var k = String(e.key).toLowerCase();
      if(k === "a" || k === "b"){ e.preventDefault(); choose(k); }
    }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    if(ownsKeys(e.target)){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* ================ scale the fixed canvas down to fit, never up ================ */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render(false);
  fit();

  /* ================ the QA hook ================
     measure-fit.mjs steps through the deck with this. goto ignores the
     pick-first lock, on purpose, so every slide can be measured. */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(false); return true;
    },
    slides:S.length,
    pick:function(id){ i = 0; render(false); choose(id); return st.pick === id; },
    reset:function(){ resetAll(); },
    state:function(){ return { i:i, pick:st.pick }; }
  };
})();
</script>
</body>
</html>
