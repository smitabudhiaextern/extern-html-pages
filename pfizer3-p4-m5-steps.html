<!-- Get Ready: the file, Claude, and his 4 criteria (from his "Learn How to Compare OCR Engines" page) -->
<template id="g1">
  <p class="p">You've seen all three engines run on the same pharmaceutical SDF, Page 4, and you've looked at how each one draws boxes, reads text, and (sometimes) makes mistakes. Now you'll run them on a page none of them has seen yet: Page 6.</p>
  <div class="links">{{OPEN:FILE:Open Page 6 (Dosimetry Record)}}</div>
  <p class="p">Download it to your computer with the download arrow at the top right. Then look at it yourself before any code does:</p>
  <ul class="list">
    <li><b>It's sideways.</b> The page was scanned turned a quarter turn, so almost all its text runs from the bottom of the page to the top. The approval stamp along the bottom is upside down, and it stays sideways even after you turn the page.</li>
    <li><b>It's a dosimetry record:</b> a record of the radiation dose measured at different spots while STERIS sterilized products with gamma rays. It belongs to the same run as Page 4: both say Process Run ID 129708B.</li>
    <li><b>Most of it is one dense table</b> of 20 rows. Each row has a barcode ID, such as 0CA600091814, and a dose in kGy (kilogray, the unit for a radiation dose).</li>
  </ul>
  <p class="p">Small details, like a zero that looks like the letter O, are exactly where OCR engines differ. Keep the page open next to your notebooks.</p>
</template>

<template id="g2">
  <p class="p">If you don't understand anything, I think you should use Claude. Here are two sample prompts:</p>
  {{PROMPT:I'm learning to compare three OCR engines, Tesseract, PaddleOCR and EasyOCR, on a scanned PDF in Google Colab. My task says: [paste the slide's instruction]. Explain in simple words what I need to do and give me one hint, but don't write the code for me.}}
  {{PROMPT:Here's my code and the error I got: [paste both]. Explain in plain English what's going wrong and give me one hint, but don't fix it for me.}}
</template>

<template id="g3">
  <p class="p">In the real world, you're not picking the "best" tool. You're picking the one that works best for your workflow. And for us? That workflow is for pharmaceutical supplier documents.</p>
  <p class="p">So the real question becomes: which tool actually helps us extract the right info, clearly, accurately, and consistently? Let's keep it simple. You want four things:</p>
  <ol class="list">
    <li><b>Accuracy:</b> Are important terms like the Process Run ID, the Date Prepared, the barcode IDs and the dose values detected properly?</li>
    <li><b>Layout Awareness:</b> Does the output reflect how the document is visually structured (laid out on the page)? Are blocks of text kept together? Are labels aligned with their values?</li>
    <li><b>Ease of Use:</b> Was the tool easy to install and run in Colab? Did it require weird workarounds or crash on certain pages?</li>
    <li><b>Output Quality:</b> Does the tool give structured output like JSON or bounding boxes? Is it something you could pass directly to an AI model or post-processing script (code that works on the text after OCR)?</li>
  </ol>
  <p class="p">If you're pulling data from pharmaceutical SDFs at scale, you need more than just text. You need structure, precision, and something you can feed into models.</p>
  <p class="p">Keep these four in mind while you run each engine. You'll write your comparison under them at the end.</p>
</template>
