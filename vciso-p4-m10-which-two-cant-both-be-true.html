      + '<p class="yours back">' + icon("doc") + "<span>Now go back to the module and add any rows you need. Come back for Question 2 once you have written your two gaps in your tab.</span></p>"
      + "</div>";
  }

  /* ---- question 2 ---- */
  function optState(sc){
    var q2 = st.q2;
    if(has(q2.ok, sc.id)) return { cls:"ok", ico:"check", tag:"Right" };
    if(q2.done === "shown" && has(ANS2, sc.id)) return { cls:"ok", ico:"check", tag:"Right answer" };
    if(has(q2.bad, sc.id)) return { cls:"no", ico:"x", tag:"Not quite" };
    if(q2.done) return { cls:"idle", ico:"", tag:"" };
    if(has(q2.sel, sc.id)) return { cls:"sel", ico:"dot", tag:"Your pick" };
    return { cls:"", ico:"", tag:"" };
  }
  function optHTML(sc){
    var s = optState(sc);
    var off = !!st.q2.done || s.cls === "ok" || s.cls === "no";
    return '<button class="opt' + (s.cls ? " " + s.cls : "") + '" type="button" data-s="' + sc.id + '"'
      + (off ? ' disabled aria-disabled="true"' : (s.cls === "sel" ? ' aria-pressed="true"' : ' aria-pressed="false"')) + ">"
      + '<span class="oi">' + icon(sc.ic) + "</span>"
      + '<span class="ot"><span class="on">' + esc(sc.name) + '</span><span class="od">' + esc(sc.def) + "</span></span>"
      + '<span class="mk"><span class="g" aria-hidden="true">' + (s.ico ? icon(s.ico) : "") + "</span>"
      +   (s.tag ? '<span class="lb">' + s.tag + "</span>" : "") + "</span>"
      + "</button>";
  }
  function renderQ2(){
    el.board.innerHTML = '<div class="q2"><div class="opts" role="group" aria-label="The five sections of the note">'
      + SECS.map(optHTML).join("")
      + '</div><div class="panel" id="panel" tabindex="-1"></div></div>';
    paintQ2Panel(false);
    Array.prototype.forEach.call(el.board.querySelectorAll("button.opt:not(:disabled)"), function(b){
      b.addEventListener("click", function(){ pickSec(b.dataset.s); });
    });
  }
  function names(ids){ return ids.map(function(id){ return sec(id).name; }); }
  function paintQ2Panel(animate){
    var p = el.board.querySelector("#panel");
    if(!p) return;
    var q2 = st.q2, L = q2.last;
    if(q2.done === "right"){
      p.className = "panel ok";
      p.innerHTML = '<span class="fh">' + icon("okc") + "Right</span>"
        + '<p class="rp">' + (q2.wrongs ? "You got there on your second try." : "You picked both on your first try.")
        + " The two gaps sit in What happened and Lessons learned.</p>"
        + '<p class="nx">Press Next to see what each gap is.</p>';
    }
    else if(L && L.bad.length){
      p.className = "panel no";
      var r = [];
      if(L.ok.length) r.push("One of your two is right: " + list(names(L.ok)) + ".");
      r.push("Neither of the two gaps we mean sits in " + orList(names(L.bad)) + ".");
      if(q2.done !== "shown") r.push("Read the other sections again and ask: what would I still want to know that this report does not tell me?");
      r.push("If the gap you wrote sits there, keep it in your tab. Other gaps can count too, where you can say what is missing.");
      p.innerHTML = '<span class="fh">' + icon("noc") + "Not quite</span>"
        + r.map(function(t){ return '<p class="rp">' + esc(t) + "</p>"; }).join("")
        + '<p class="nx">' + (q2.done === "shown"
            ? "The right sections are marked green, “Right answer”. Press Next to see what each gap is."
            : (q2.ok.length ? "Pick one more section and press Check." : "Pick two other sections and press Check.")) + "</p>";
    }
    else {
      p.className = "panel empty";
      p.innerHTML = '<p class="pe">A gap is something a complete report should hold that this one leaves out or leaves vague. This report has two of them. <b>Write yours in your tab first.</b></p>'
        + '<p class="pe">Then pick the two sections that you think your gaps sit in, and press <b>Check</b>.</p>'
        + '<p class="pe">If a pick is not right, you can try again. After two tries, we show you the right sections.</p>';
    }
    if(animate && !reduce){ p.classList.remove("in"); void p.offsetWidth; p.classList.add("in"); }
  }
  function pickSec(id){
    var q2 = st.q2;
    if(q2.done || has(q2.ok, id) || has(q2.bad, id)) return;
    document.documentElement.classList.add("fresh");
    if(has(q2.sel, id)) q2.sel.splice(q2.sel.indexOf(id), 1);
    else if(q2.sel.length + q2.ok.length >= 2){ el.hint.textContent = "You have already picked two. Click one of them to undo it first."; say(el.hint.textContent); return; }
    else q2.sel.push(id);
    save();
    renderQ2();
    header();
    var b = el.board.querySelector('button.opt[data-s="' + id + '"]');
    if(b) b.focus({ preventScroll:true });
    say((has(q2.sel, id) ? "Picked. " : "Unpicked. ") + (q2.sel.length + q2.ok.length) + " of 2 picked.");
  }
  function checkQ2(){
    var q2 = st.q2;
    if(q2.done || !q2.sel.length || q2.sel.length + q2.ok.length !== 2) return;
    var L = { ok:[], bad:[] };
    q2.sel.forEach(function(id){
      if(has(ANS2, id)){ q2.ok.push(id); L.ok.push(id); }
      else { q2.bad.push(id); L.bad.push(id); }
    });
    /* Keep the right sections found earlier in the reply, so it reads in full. */
    q2.ok.forEach(function(id){ if(!has(L.ok, id) && L.bad.length) L.ok.unshift(id); });
    q2.last = L;
    q2.sel = [];
    if(L.bad.length) q2.wrongs++;
    if(q2.ok.length === 2) q2.done = "right";
    else if(q2.wrongs >= MAXWRONG) q2.done = "shown";
    save();
    renderQ2();
    paintQ2Panel(true);
    header();
    afterCheck();
  }

  /* ---- question 2 answer ---- */
  function renderA2(){
    var q2 = st.q2, line;
    if(!q2.done) line = icon("question") + "<span>You have not checked your sections yet. You can go back and pick before you read this.</span>";
    else if(q2.done === "right" && !q2.wrongs) line = icon("check") + "<span>You picked <b>What happened</b> and <b>Lessons learned</b> on your first try. That is right.</span>";
    else if(q2.done === "right") line = icon("check") + "<span>You got there on your second try: the gaps sit in <b>What happened</b> and <b>Lessons learned</b>.</span>";
    else line = icon("info") + "<span>The two gaps sit in <b>What happened</b> and <b>Lessons learned</b>.</span>";
    el.board.innerHTML = '<div class="closewrap">'
      + '<p class="yours">' + line + "</p>"
      + '<div class="two">'
      +   '<div class="card"><div class="ch"><span class="bi">' + icon("clock") + '</span><span class="when">What happened</span></div>'
      +     '<span class="gt">The four days before anyone noticed</span>'
      +     "<p>The drive was connected on 25 November. Nobody acted until 29 November. The report records both dates and never asks why nobody saw it sooner.</p></div>"
      +   '<div class="card"><div class="ch"><span class="bi">' + icon("bulb") + '</span><span class="when">Lessons learned</span></div>'
      +     '<span class="gt">A lesson with no owner</span>'
      +     '<span class="gd">An owner here means a named person who makes sure it happens.</span>'
      +     "<p>It says “Staff to be reminded”, but not by whom, by when, or how. The antivirus report from the previous module ends in the same empty way.</p></div>"
      + "</div>"
      + '<div class="statement">'
      +   '<p class="big">Other gaps are fair to raise too, where you can say what is missing.</p>'
      +   "<p>Now go back to the module.</p>"
      + "</div></div>";
  }

  function afterCheck(){
    var p = el.board.querySelector("#panel");
    if(p) say(Array.prototype.map.call(p.querySelectorAll(".fh,p"), function(n){
      return n.textContent.replace(/\s*$/, "").replace(/([^.?])$/, "$1.");
    }).join(" "));
    var ph = phone();
    var fo = ph ? { preventScroll:true } : undefined;
    if(!el.next.disabled) el.next.focus(fo);
    else if(p) p.focus(fo);
    if(ph && p) p.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block:"start" });
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    if(d > 0 && !canLeave(S[i])) return;
    i = n; render(); if(phone()) window.scrollTo(0,0); el.frame.focus({ preventScroll:true });
  }
  function startOver(){
    st = fresh(); save(); i = 0; render();
    if(phone()) window.scrollTo(0,0);
    el.frame.focus({ preventScroll:true });
    say("Started over. Question 1 of " + NQ + ".");
  }
  el.back.addEventListener("click", function(){
    if(confirming){ confirming = false; header(); el.next.focus(); return; }
    go(-1);
  });
  el.next.addEventListener("click", function(){
    var s = S[i];
    if(s.kind === "q1" && !st.q1.done){ checkQ1(); return; }
    if(s.kind === "q2" && !st.q2.done){ checkQ2(); return; }
    if(s.kind === "a2"){
      if(!confirming){ confirming = true; header(); say(el.hint.textContent); el.back.focus(); return; }
      startOver(); return;
    }
    go(1);
  });

  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(canLeave(S[i]) && i < S.length-1) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); if(!confirming) go(-1); }
  });

  /* A cursor resting where new content lands must not tint an option (as in m11, m12). */
  var lastPt = null;
  document.addEventListener("pointermove", function(e){
    var pt = e.clientX + "," + e.clientY;
    if(lastPt !== null && pt !== lastPt) document.documentElement.classList.remove("fresh");
    lastPt = pt;
  }, true);

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive:true });
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(canLeave(S[i]) && i < S.length-1) go(1); } else if(!confirming) go(-1);
    }
    tx = null; ty = null;
  }, { passive:true });

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; i = n; render(); return true; },
    slides:S.length,
    reset:function(){ st = fresh(); save(); i = 0; render(); },
    state:function(){ return JSON.parse(JSON.stringify({ i:i, st:st })); }
  };
})();
</script>
</body>
</html>
