<!DOCTYPE html>
<!--
  EIC II — Value-Chain Market Map (TEACHING SAMPLE).

  Purpose: show students the STRUCTURE of EIC's gold-standard "deep dive" market
  map (page-37 geothermal value chain) on a DIFFERENT topic (Data Centers), so
  they see the shape without copying content into their own upstream oil & gas
  focus-area map. A market map = value chain -> sub-categories -> the companies
  playing in each cell.

  Companies named below are REAL, recognizable, illustrative examples only.
  They are NOT an EIC portfolio and carry no endorsement.

  Notion-embeddable 960x540 canvas (Mode A) + mandatory scale-to-fit script.
  Static map, no interaction.

  HOW TO SWAP CONTENT: edit ONLY the `MAP` config block below. Each stage sets
  its own header color + tint; sub-categories and company cells render from data,
  so nothing in the layout needs to change to reskin it for another topic.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Value Chain: The Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
  :root {
    --color-bg: #FDF8F8;
    --color-surface-highlight: #DCE1FF;
    --color-accent: #001D69;
    --color-title: #1C1B1B;
    --color-body: #484646;
    --color-white: #FFFFFF;
    --color-border: #E7E3EC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #EFEAF0;
    font-family: 'Inter', sans-serif;
  }
  #stage {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; align-items: flex-start; justify-content: center;
  }
  #deck-wrapper {
    width: 960px; height: 540px;
    position: relative; overflow: hidden;
    background: var(--color-bg);
  }

  .map-root {
    width: 960px; height: 540px;
    padding: 20px 24px 14px;
    display: flex; flex-direction: column;
  }

  /* ---- title bar ---- */
  .titlebar { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 9px; }
  .titlebar .tb-left { display: flex; align-items: center; gap: 11px; }
  .titlebar .tb-icon {
    width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
    background: var(--color-surface-highlight); color: var(--color-accent);
    display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .titlebar h1 { font-size: 19px; font-weight: 800; color: var(--color-title); line-height: 1.1; }
  .titlebar .tb-sub { font-size: 11px; font-weight: 600; color: var(--color-body); margin-top: 2px; }
  .titlebar .tb-tag {
    font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: var(--color-accent); background: var(--color-surface-highlight);
    padding: 5px 10px; border-radius: 6px; white-space: nowrap;
  }

  /* ---- topic band ---- */
  .topic-band {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--color-accent); color: #fff; border-radius: 8px;
    padding: 8px 14px; margin-bottom: 11px;
  }
  .topic-band .tick { font-size: 10px; font-weight: 600; opacity: .72; letter-spacing: .05em; }
  .topic-band .topic-name { font-size: 15px; font-weight: 800; letter-spacing: .02em; }
  .topic-band i { font-size: 15px; opacity: .8; }

  /* ---- the value chain (4 stage columns, left -> right) ---- */
  .chain { flex: 1; display: flex; gap: 11px; min-height: 0; }
  .stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .stage-head {
    display: flex; align-items: center; gap: 7px;
    border-radius: 8px 8px 0 0; padding: 7px 10px; color: #fff;
    position: relative;
  }
  .stage-head i.s-ico { font-size: 15px; flex-shrink: 0; }
  .stage-head .s-name { font-size: 12px; font-weight: 800; line-height: 1.08; }
  /* left-to-right flow arrow between stages */
  .stage-head .s-flow {
    position: absolute; right: -9px; top: 50%; transform: translateY(-50%);
    z-index: 5; font-size: 15px; color: var(--color-accent);
  }
  .stage:last-child .stage-head .s-flow { display: none; }

  .stage-body {
    flex: 1; display: flex; flex-direction: column; gap: 6px;
    background: rgba(255,255,255,.55); border: 1px solid var(--color-border);
    border-top: none; border-radius: 0 0 8px 8px; padding: 7px;
    min-height: 0;
  }

  .subcat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .subcat-label {
    font-size: 9.5px; font-weight: 800; letter-spacing: .02em;
    padding: 3px 7px; border-radius: 5px; margin-bottom: 4px;
    line-height: 1.12;
  }
  .cells { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .company {
    background: var(--color-white); border: 1px solid var(--color-border);
    border-radius: 5px; padding: 3px 7px;
    font-size: 10.5px; font-weight: 700; color: var(--color-title);
    line-height: 1.15; display: flex; align-items: center;
    flex: 1; min-height: 0;
  }

  /* ---- footer caption ---- */
  .foot {
    display: flex; align-items: center; gap: 7px;
    margin-top: 10px; font-size: 10.5px; color: var(--color-body); line-height: 1.3;
  }
  .foot i { font-size: 13px; color: var(--color-accent); flex-shrink: 0; }
  .foot b { color: var(--color-title); font-weight: 700; }
</style>
</head>
<body>
<div id="stage">
  <div id="deck-wrapper">
    <div class="map-root">

      <!-- title bar -->
      <div class="titlebar">
        <div class="tb-left">
          <div class="tb-icon"><i class="ph-bold ph-tree-structure"></i></div>
          <div>
            <h1>Value Chain: The Technologies</h1>
            <div class="tb-sub">Read it left to right: stages &rarr; sub-categories &rarr; the technologies in each</div>
          </div>
        </div>
        <div class="tb-tag">Sample map</div>
      </div>

      <!-- topic band -->
      <div class="topic-band">
        <span class="tick">TOPIC</span>
        <i class="ph-bold ph-database"></i>
        <span class="topic-name" id="topicName">Data Centers</span>
      </div>

      <!-- the chain (rendered from MAP config) -->
      <div class="chain" id="chain"></div>

      <!-- footer -->
      <div class="foot">
        <i class="ph-bold ph-info"></i>
        <span><b>Sample map: you'll build one like this for your focus area.</b>
        Each cell is a technology approach in that part of the chain, not a company.</span>
      </div>

    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — edit ONLY this block to swap content.
   Each stage: its own header color + tint, an icon, and a list
   of sub-categories; each sub-category holds example companies.
   ============================================================ */
const TOPIC = "Data Centers";

const MAP = [
  {
    name: "Energy Supply",
    icon: "ph-lightning",
    color: "#7C3AED", tint: "#EDE9FE",       /* purple */
    subs: [
      { label: "On-site Generation",  companies: ["Fuel cells", "Small modular reactors", "On-site gas turbines"] },
      { label: "Grid & Interconnection", companies: ["Microgrids", "Behind-the-meter supply"] },
      { label: "Storage & Backup",    companies: ["Lithium-ion storage", "Iron-air batteries", "Flywheel UPS"] }
    ]
  },
  {
    name: "Facility & Cooling",
    icon: "ph-thermometer-cold",
    color: "#2563EB", tint: "#DBEAFE",       /* blue */
    subs: [
      { label: "Modular / Prefab Build", companies: ["Prefab modular halls", "Containerized DCs"] },
      { label: "Liquid & Immersion Cooling", companies: ["Direct-to-chip liquid", "Single-phase immersion", "Two-phase immersion"] },
      { label: "Heat Reuse",          companies: ["District heat capture", "Absorption cooling"] }
    ]
  },
  {
    name: "Compute",
    icon: "ph-cpu",
    color: "#EA580C", tint: "#FED7AA",       /* orange */
    subs: [
      { label: "AI Accelerators",     companies: ["GPUs", "Custom ASICs", "Wafer-scale chips"] },
      { label: "Optical Interconnect", companies: ["Silicon photonics", "Co-packaged optics"] },
      { label: "Servers & Networking", companies: ["High-density servers", "Liquid-cooled racks"] }
    ]
  },
  {
    name: "Operations & Software",
    icon: "ph-gauge",
    color: "#0EA5A4", tint: "#CCFBF1",       /* teal */
    subs: [
      { label: "DCIM & Monitoring",   companies: ["Digital twins", "Real-time telemetry"] },
      { label: "Workload & Energy Optimization", companies: ["AI workload scheduling", "Dynamic power capping"] },
      { label: "Sustainability Reporting", companies: ["Carbon accounting", "Grid-aware scheduling"] }
    ]
  }
];

/* ============================================================
   RENDER — no need to edit below this line.
   ============================================================ */
document.getElementById('topicName').textContent = TOPIC;

const chain = document.getElementById('chain');
MAP.forEach(stage => {
  const col = document.createElement('div');
  col.className = 'stage';

  const subsHtml = stage.subs.map(sub => `
    <div class="subcat">
      <div class="subcat-label" style="background:${stage.tint};color:${stage.color};">${sub.label}</div>
      <div class="cells">
        ${sub.companies.map(c => `<div class="company">${c}</div>`).join('')}
      </div>
    </div>`).join('');

  col.innerHTML = `
    <div class="stage-head" style="background:${stage.color};">
      <i class="ph-bold ${stage.icon} s-ico"></i>
      <span class="s-name">${stage.name}</span>
      <i class="ph-bold ph-caret-right s-flow"></i>
    </div>
    <div class="stage-body">${subsHtml}</div>`;

  chain.appendChild(col);
});

/* ---- MANDATORY viewport scale-to-fit (Notion embeds are 700-900px wide) ---- */
function scaleDeck() {
  const wrapper = document.getElementById('deck-wrapper');
  const scaleX = window.innerWidth / 960;
  const scaleY = window.innerHeight / 540;
  const scale = Math.min(scaleX, scaleY, 1);   // scale DOWN only
  wrapper.style.transform = `scale(${scale})`;
  wrapper.style.transformOrigin = 'top center';
}
window.addEventListener('resize', scaleDeck);
scaleDeck();
</script>
</body>
</html>
