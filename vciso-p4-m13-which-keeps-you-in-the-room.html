<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Keeps You in the Room?</title>
<!--
  vCISO P4 Step 3, Module 13: Build Slides 7 and 8.
  Build spec in 06-content/project-04/step-03/module-13-internal.md (Build Note).
  Governing authority: output/programs/vciso/CLAUDE.md section 6. Look, navigation,
  scale-to-fit, phone layout and state handling match
  vciso-p2-m12-day-8-why-is-it-still-spreading.html and
  vciso-p2-m11-is-cumberland-actually-affected.html.

  Sources for every fact:
  - Sentence A and Sentence B, word for word: P4 Sample Pack/Interactive content sets - P4.md,
    P4-12 ("Shape"), repeated in the build spec.
  - Answer (B), the trap (A feels more honest because it is blunter) and the reveal:
    P4-12 ("Both true, neither softer. The reveal: the second keeps you in the room, it
    frames the finding as work to do rather than a verdict") and the build spec. "The second"
    is named as Sentence B.
  - Reply lines by pick: the build spec's ("ours, for approval").
  - Plain-words glosses added after QA (no new facts, ours, for approval): what "verdict",
    "blunter", "neither is softer" and "the alternative was Meridian finding it" mean, and
    "questionnaire" as the list of security questions Meridian asked Cumberland to answer (P4 README).
  - Ray Okafor, COO, holds the budget and the Meridian relationship: vciso CLAUDE.md, the cast.
  - "The client" is Cumberland and "the customer" is Meridian: the P4 scenario.
  No scope picker: the fact is company-wide (spec, "Per-scope data: none").
  Not shown, per spec: any Cumberland finding text, severity or slide wording.

  There is a right answer, so the P2 right/wrong pattern applies: the right pick turns
  green with a tick and "Right"; a wrong pick turns red with a cross and "Not quite",
  with a short reason, and the student tries again. With two options, one wrong try
  leaves only the right one, so the "after two wrong tries" step can never be reached.
  The spec's Check button is replaced by click-to-answer, as in the reference builds.
  One question, so one slide: there is no Back, and Start over clears the answer.
  Green #146C2E on #E6F4EA (5.7:1), red #B3261E on #FCE8E6 (5.6:1).
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    /* right and wrong states only, always paired with an icon and a word */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-reveal:520ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}

  h1{font-size:27px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:6px}
  .lead{flex:0 0 auto;font-size:15.5px;line-height:1.4;color:var(--body);margin-bottom:10px}
  .lead b{color:var(--title);font-weight:600}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- the two sentences, side by side ---- */
  .opts{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  button.opt{font-family:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--title);
    border:1.5px solid var(--on-highlight);border-radius:12px;padding:10px 14px 11px 14px;
    display:flex;flex-direction:column;gap:6px;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  @media (hover:hover){ button.opt:hover:not(:disabled){background:var(--highlight)}
    html.fresh button.opt:hover:not(:disabled){background:var(--bg)} }
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt:disabled{cursor:default}
  button.opt .oh{display:flex;align-items:center;gap:9px;min-height:30px}
  button.opt .oi{width:30px;height:30px;border-radius:9px;background:var(--highlight);color:var(--on-highlight);
    border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  button.opt .oi svg.ic{width:18px;height:18px}
  button.opt .ol{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  button.opt .on{font-size:17px;font-weight:600;line-height:1.35;color:var(--title)}
  button.opt .od{font-size:13.5px;line-height:1.35;color:var(--body);border-top:1.5px dashed var(--line);padding-top:6px}
  button.opt .mk{margin-left:auto;display:flex;flex-direction:row-reverse;align-items:center;gap:7px}
  button.opt .lb{font-size:14px;font-weight:700;line-height:1.15}
  /* The state marker. Empty ring when not chosen. Never filled until clicked. */
  button.opt .g{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;background:transparent}
  button.opt .g svg.ic{width:14px;height:14px;stroke-width:2.6}
  /* Right: green, tick, "Right". */
  button.opt.ok{background:var(--ok-tint);border:2px solid var(--ok)}
  button.opt.ok .g{background:var(--ok);border-color:var(--ok);color:var(--bg)}
  button.opt.ok .lb{color:var(--ok)}
  button.opt.ok .oi{background:var(--bg);border-color:var(--ok);color:var(--ok)}
  /* Wrong: red, cross, "Not quite". */
  button.opt.no{background:var(--no-tint);border:2px solid var(--no)}
  button.opt.no .g{background:var(--no);border-color:var(--no);color:var(--bg)}
  button.opt.no .lb{color:var(--no)}
  button.opt.no .oi{background:var(--bg);border-color:var(--no);color:var(--no)}
  /* Not picked, question finished: dashed, so it does not look clickable. */
  button.opt.idle:disabled{border-style:dashed;border-color:var(--line)}
  button.opt.idle:disabled .g{border-color:var(--line)}

  /* ---- the feedback panel ---- */
  .panel{flex:1 1 auto;min-height:0;border-radius:12px;padding:12px 18px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
  .panel.empty{background:var(--tint);border:1.5px dashed var(--line);justify-content:center;gap:8px}
  .panel.ok{background:var(--ok-tint);border-left:6px solid var(--ok)}
  .panel.no{background:var(--no-tint);border-left:6px solid var(--no)}
  .panel .pe{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.42;color:var(--body)}
  .panel .pe svg.ic{width:20px;height:20px;color:var(--on-highlight);flex:0 0 auto;margin-top:1px}
  .panel .pe b{color:var(--title);font-weight:600}
  .panel .fh{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;flex:0 0 auto;flex-wrap:wrap;white-space:nowrap}
  .panel.ok .fh{color:var(--ok)}
  .panel.no .fh{color:var(--no)}
  .panel .fh svg.ic{width:24px;height:24px;stroke-width:2}
  .panel .fh .pt{font-size:15px;font-weight:600;color:var(--title);margin-left:4px}
  .panel p.rp{font-size:15.5px;line-height:1.42;color:var(--title)}
  .panel p.rp b{font-weight:700}
  .panel p.sm{font-size:14px;line-height:1.38;color:var(--body)}
  .panel p.nx{font-size:15px;line-height:1.4;font-weight:600;color:var(--title);border-top:1.5px solid rgba(28,27,27,.18);padding-top:7px}
  .panel.tight{gap:5px}
  .panel.tight p.rp{font-size:14.5px;line-height:1.36}
  .panel.tight p.sm{font-size:13px}
  /* Second step, only if tight still overflows: compact the cards and the panel. */
  .board.tighter{gap:8px}
  .board.tighter button.opt{padding:7px 14px 8px;gap:4px}
  .board.tighter button.opt .on{font-size:16px;line-height:1.3}
  .board.tighter button.opt .od{font-size:13px;padding-top:4px}
  .board.tighter .panel{padding:9px 18px;gap:4px}
  .board.tighter .panel p.rp{font-size:14px;line-height:1.33}
  .panel.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .panel:focus{outline:none}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:52px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;min-height:40px;font-size:13.5px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .board{flex:0 0 auto}
    .opts{grid-template-columns:1fr;gap:12px}
    button.opt{padding:12px 12px 12px 12px}
    button.opt .od{font-size:15px}
    .panel{flex:0 0 auto;overflow:visible;scroll-margin:16px}
    .panel .pe{font-size:16px}
    .panel p.rp,.panel.tight p.rp{font-size:16px;line-height:1.45}
    .panel p.sm,.panel.tight p.sm{font-size:15px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{min-height:0;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Which Keeps You in the Room?">

    <div class="top">
      <span class="prog" id="prog">Question 1 of 1</span>
    </div>

    <h1 id="h1">Which Sentence Would You Say to Ray?</h1>
    <p class="lead" id="lead">Both sentences below state the same fact about the eight answers Cumberland gave on Meridian’s questionnaire, the list of security questions Meridian asked Cumberland to answer. Pick the one that you think you would say to <b>Ray</b>.</p>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="again" type="button">Start over</button>
      <div id="hint"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:18px;color:#1C1B1B;margin:22px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:8px}
    .nsf li span{display:block;font-size:15.5px}
    .nsf strong{color:#1C1B1B}
    .nsf .box{background:#DCE1FF;border-left:4px solid #001D69;padding:12px 16px;margin:14px 0;color:#1C1B1B}
  </style>
  <div class="nsf">
    <h2>Which Sentence Would You Say to Ray?</h2>
    <p>Both sentences below state the same fact about the eight answers Cumberland gave on Meridian’s questionnaire, the list of security questions Meridian asked Cumberland to answer. Ray is Cumberland’s COO (chief operating officer). He holds the budget and looks after the relationship with Meridian.</p>
    <ul>
      <li><strong>Sentence A: "The client could not support four of its eight questionnaire answers."</strong><span>The client is Cumberland. Could not support means it could not show proof that those answers were true.</span></li>
      <li><strong>Sentence B: "Four of the client’s eight answers need evidence attached before the customer asks for them."</strong><span>The customer is Meridian. Evidence attached means the proof goes along with each answer.</span></li>
    </ul>
    <p>Before you read on, write down the one that you think you would say to Ray.</p>
    <h3>The answer</h3>
    <div class="box">
      <p>Sentence B is the right answer.</p>
      <p>Both are true, and neither is softer. Sentence B keeps you in the room: it frames the finding as work to do, not a verdict. Finding this now is good news. The alternative was Meridian finding it.</p>
      <p>Neither is softer means Sentence B does not hide the problem: four answers still cannot be fully proven. And it is better that you spot that now than that Meridian does.</p>
      <p>Sentence A is accurate. It reads as a verdict, and a verdict ends the conversation. A verdict is a final judgment, like the one at the end of a trial. Sentence A tells Ray what went wrong. Sentence B tells him what to do next.</p>
      <p>Keeps you in the room means Ray keeps listening and keeps working with you, instead of ending the talk.</p>
      <p>Now go back to the module.</p>
    </div>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ---------------- icons ----------------
     Inline SVG drawn to the Phosphor outline style: one weight, uniform size,
     #001D69 through currentColor. No icon font, no network request. */
  var IC = {
    chat:'<path d="M4.5 5.5h15a1 1 0 0 1 1 1v9.5a1 1 0 0 1-1 1H10l-4.5 3.5V17h-1a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/>',
    user:'<circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/>',
    check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    x:'<path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>',
    okc:'<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8 5.4-5.6"/>',
    noc:'<circle cx="12" cy="12" r="9"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/>',
    info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2M12 7.8v.2"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }

  /* ---------------- content ----------------
     The two sentences: P4-12, word for word. Answer: B (P4-12, spec).
     "def" is the plain-words line under each sentence: what it means, no new facts.
     Replies: the spec's reply lines, plus the P4-12 reveal on the right pick. */
  var ANSWER = "b";
  var OPTS = [
    { id:"a", label:"Sentence A",
      text:"The client could not support four of its eight questionnaire answers.",
      def:"The client is Cumberland. Could not support means it could not show proof that those answers were true." },
    { id:"b", label:"Sentence B",
      text:"Four of the client’s eight answers need evidence attached before the customer asks for them.",
      def:"The customer is Meridian. Evidence attached means the proof goes along with each answer." }
  ];
  var EMPTY = [
    ["user", "<b>Ray</b> is Cumberland’s COO (chief operating officer). He holds the budget and looks after the relationship with Meridian."],
    ["info", "There is one right answer here. If your pick is not quite right, you can try the other one."]
  ];
  var REPLY = {
    a:{ rp:["Sentence A is accurate. But it reads as a verdict, and a verdict ends the conversation.",
            "It can feel more honest because it is blunter, which means more direct. Both sentences are equally true, though."],
        sm:"A verdict is a final judgment, like the one at the end of a trial. Sentence A tells Ray what went wrong. Sentence B tells him what to do next." },
    b:{ rp:["It is the same fact, framed as the work that comes next.",
            "Both are true, and neither is softer. Sentence B <b>keeps you in the room</b>: it frames the finding as work to do, not a verdict. Finding this now is good news. The alternative was Meridian finding it.",
            "Neither is softer means Sentence B does not hide the problem: four answers still cannot be fully proven. And it is better that you spot that now than that Meridian does."],
        sm:"A verdict is a final judgment, like the one at the end of a trial. Keeps you in the room means Ray keeps listening and keeps working with you, instead of ending the talk." }
  };
  var AGAIN = "Try the other sentence.";
  var CLOSE = "Now go back to the module.";

  /* ---------------- state ----------------
     out = the wrong sentences picked; done = true once the right one is picked. */
  var KEY = "vciso-p4-m13-which-keeps-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function validId(v){ return OPTS.some(function(o){ return o.id === v; }); }
  function fresh(){ return { out:[], done:false }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var s = fresh();
      if(Array.isArray(raw.out)) raw.out.forEach(function(k){
        if(validId(k) && k !== ANSWER && s.out.indexOf(k) < 0) s.out.push(k);
      });
      s.done = raw.done === true;
      return s;
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var el = {
    frame:document.getElementById("frame"), board:document.getElementById("board"),
    again:document.getElementById("again"), hint:document.getElementById("hint"),
    live:document.getElementById("live")
  };

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = m; }
  function opt(id){ var r = null; OPTS.forEach(function(o){ if(o.id === id) r = o; }); return r; }
  function phone(){ return window.matchMedia("(max-width:599px)").matches; }

  /* ---------------- chrome ---------------- */
  function bar(){
    el.again.disabled = !st.out.length && !st.done;
    if(st.done) el.hint.innerHTML = "<b>" + CLOSE + "</b> Start over clears your answer.";
    else if(st.out.length) el.hint.textContent = "Pick Sentence B to see why it works.";
    else el.hint.textContent = "Pick one sentence.";
  }

  /* ---------------- render ---------------- */
  function render(){
    document.documentElement.classList.add("fresh");
    el.board.innerHTML = '<div class="opts" role="group" aria-label="Which sentence would you say to Ray?">'
      + OPTS.map(optHTML).join("") + "</div>"
      + '<div class="panel" id="panel" tabindex="-1"></div>';
    paintPanel(false);
    Array.prototype.forEach.call(el.board.querySelectorAll("button.opt:not(:disabled)"), function(b){
      b.addEventListener("click", function(){ choose(b.dataset.o); });
    });
    bar();
  }
  function stateOf(o){
    if(o.id === ANSWER && st.done) return { cls:"ok", ico:"check", tag:"Right" };
    if(st.out.indexOf(o.id) >= 0) return { cls:"no", ico:"x", tag:"Not quite" };
    if(st.done) return { cls:"idle", ico:"", tag:"" };
    return { cls:"", ico:"", tag:"" };
  }
  function optHTML(o){
    var s = stateOf(o);
    var off = !!s.cls || st.done;
    var sr = s.cls === "ok" ? "Right. You picked this one." : s.cls === "no" ? "Not quite. You picked this one." : "";
    return '<button class="opt' + (s.cls ? " " + s.cls : "") + '" type="button" data-o="' + o.id + '"'
      + (off ? ' disabled aria-disabled="true"' : "") + ">"
      + '<span class="oh"><span class="oi">' + icon("chat") + '</span><span class="ol">' + esc(o.label) + "</span>"
      +   '<span class="mk"><span class="g" aria-hidden="true">' + (s.ico ? icon(s.ico) : "") + "</span>"
      +   (s.tag ? '<span class="lb" aria-hidden="true">' + s.tag + "</span>" : "") + "</span></span>"
      + '<span class="on">“' + esc(o.text) + "”</span>"
      + '<span class="od">' + esc(o.def) + "</span>"
      + (sr ? '<span class="sr">' + sr + "</span>" : "")
      + "</button>";
  }
  function paintPanel(animate){
    var p = el.board.querySelector("#panel");
    if(!p) return;
    p.classList.remove("tight");
    el.board.classList.remove("tighter");
    if(!st.out.length && !st.done){
      p.className = "panel empty";
      p.innerHTML = EMPTY.map(function(t){ return '<p class="pe">' + icon(t[0]) + "<span>" + t[1] + "</span></p>"; }).join("");
      return;
    }
    var good = st.done;
    var o = good ? opt(ANSWER) : opt(st.out[st.out.length-1]);
    var r = REPLY[o.id];
    var lines = r.rp.slice();
    if(good) lines[0] = "Yes. " + lines[0];
    p.className = "panel " + (good ? "ok" : "no");
    p.innerHTML = '<span class="fh">' + icon(good ? "okc" : "noc") + (good ? "Right" : "Not quite") + " "
      + '<span class="pt">You picked ' + esc(o.label) + ".</span></span>"
      + lines.map(function(t){ return '<p class="rp">' + t + "</p>"; }).join("")
      + '<p class="sm">' + esc(r.sm) + "</p>"
      + (good ? "" : '<p class="nx">' + esc(AGAIN) + "</p>");
    if(!phone() && p.scrollHeight > p.clientHeight + 1) p.classList.add("tight");
    if(!phone() && p.scrollHeight > p.clientHeight + 1) el.board.classList.add("tighter");
    if(animate && !reduce){ p.classList.remove("in"); void p.offsetWidth; p.classList.add("in"); }
  }
  function choose(id){
    document.documentElement.classList.add("fresh");
    if(!opt(id) || st.done || st.out.indexOf(id) >= 0) return;
    if(id === ANSWER) st.done = true;
    else st.out.push(id);
    save(st);
    render();
    paintPanel(true);
    var p = el.board.querySelector("#panel");
    if(p) say(Array.prototype.map.call(p.querySelectorAll(".fh,p"), function(n){
      return n.textContent.replace(/\s*$/, "").replace(/([^.])$/, "$1.");
    }).join(" "));
    var ph = phone();
    var tgt = st.done ? p : (el.board.querySelector("button.opt:not(:disabled)") || p);
    if(tgt) tgt.focus(ph ? { preventScroll:true } : undefined);
    if(ph && p) p.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"});
  }

  el.again.addEventListener("click", function(){
    st = fresh(); save(st); render();
    if(phone()) window.scrollTo(0,0);
    el.frame.focus({preventScroll:true});
    say("Started over. Question 1 of 1.");
  });

  /* A cursor resting where new content lands must not tint an option. */
  var lastPt = null;
  document.addEventListener("pointermove", function(e){
    var pt = e.clientX + "," + e.clientY;
    if(lastPt !== null && pt !== lastPt) document.documentElement.classList.remove("fresh");
    lastPt = pt;
  }, true);

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", function(){ fit(); paintPanel(false); });

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    slides:1,
    reset:function(){ st = fresh(); save(st); render(); },
    state:function(){ return JSON.parse(JSON.stringify(st)); }
  };
})();
</script>
</body>
</html>
