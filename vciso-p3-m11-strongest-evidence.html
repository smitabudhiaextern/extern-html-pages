<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strongest Evidence</title>
<!--
  vCISO P3 Step 3, Module 11, interactive: Which evidence is strongest?
  Built from the Extern deck shell (.claude/skills/build-html-slides/assets/deck-shell.html),
  matched to the house look of the P3 Step 1 decks (vciso-p3-m2-control-or-written-rule.html,
  vciso-p3-m3-guess-the-date.html, vciso-p3-m4-one-stolen-password.html). Restyled 8 Oct 2026:
  Phosphor outline icons on the cards, "Right." / "Not right." feedback, the house reveal
  heading, Start again only after a check, a plain end line in place of Continue.
  Governing authority: output/programs/vciso/VCISO-STYLE-GUIDE.md section 6, which
  sets the larger type scale and the per-slide tint ramp used here.
  Spec: 06-content/project-03/step-03/module-11-internal.md, "Build note".
  Answer: P3 Sample Pack/Interactive content sets - P3.md, P3-11 (SME drop 2026-09-25).

  One deck serves all four scopes. The live-site doc says that on every scope's
  page exactly two of the three policy claims fail and one holds, so nothing
  here changes by scope.

  Verify before shipping, both gates, every time:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs   this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  /* ===============================================================
     The palette. The Extern five, plus the vCISO per-slide tint ramp
     (VCISO-STYLE-GUIDE.md 6b, listed in 09-assets/deck-palette.json).
     Tint carries no meaning. Every tint of navy is an rgba() of
     #001D69. No state is ever signalled by colour alone: every
     coloured state also carries a glyph or a label.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, borders, fills      */
    --bg:#FDF8F8;           /* canvas background, and text on navy */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;    /* UI feedback: hover, press, focus, select */
    --t-frame:300ms;   /* movement between slides                  */
    --t-reveal:560ms;  /* a value or an answer resolving           */
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);  /* the slight overshoot */
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    /* System stack, no webfont. A deck makes no network request. */
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. Shared with every
     vCISO deck, so slide 2 here is the same colour as slide 2 elsewhere. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t3{background:#F2E3D2}

  /* the 960x540 canvas, scaled down only, never up
     flex:0 0 auto is load bearing: the canvas must always hold 960 in
     layout and let the transform do all of the fitting. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* header. Progress is visible from first paint. */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}

  /* vCISO 6a: heading 28px at 600. */
  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  .intro{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px;max-width:74ch}
  .intro p{font-size:17px;line-height:1.5}
  .intro p b{color:var(--title);font-weight:600}
  button.jump{font-family:inherit;font-size:15px;font-weight:600;color:var(--on-highlight);align-self:flex-start;
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:7px;padding:8px 15px;cursor:pointer}
  button.jump:hover{background:var(--tint2)}
  button.jump:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  /* the instruction strip. Its height is fixed, so picking and checking
         change its words, never its size. */
  .how{flex:0 0 auto;display:flex;align-items:center;gap:12px;min-height:54px;background:var(--highlight);color:var(--title);
    border-left:4px solid var(--on-highlight);border-radius:6px;padding:4px 6px 4px 14px;font-size:16px;line-height:1.35}
  .how .ht{flex:1 1 auto;min-width:0}
  .how b{font-weight:600}
  .how .gl{display:inline-flex;vertical-align:-4px;margin-right:6px}

  /* Inline SVG icons, Phosphor style: one weight, outline, navy. */
  svg.ic{width:26px;height:26px;flex:0 0 auto;fill:none;stroke:var(--on-highlight);stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .how svg.ic{width:20px;height:20px;stroke-width:2}

  /* slide 1 board. The Check button sits after the grid in the DOM, so Tab
     reaches the six cards first and Check last. On the canvas, CSS lays it
     back over the right end of the instruction strip; under 600px it stays
     where the DOM puts it, right under the cards. */
  .board.pickb{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);gap:10px 0}
  .pickb .how{grid-column:1 / -1;grid-row:1}
  .pickb .how.pre{padding-right:150px}
  .pickb .grid{grid-column:1 / -1;grid-row:2}
  .pickb .chkw{grid-column:2;grid-row:1;align-self:center;z-index:1;padding-right:6px}
  .chkw button.nav{padding:7px 16px}

  /* slide 1: six cards, one pick
     Every card starts identical: same edge, same fill, same badge. Nothing
     looks chosen until the student chooses it. */
  .grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(2,minmax(0,1fr));gap:10px 12px}
  button.ev{font-family:inherit;cursor:pointer;text-align:left;min-width:0;min-height:0;position:relative;
    display:flex;flex-direction:column;gap:5px;padding:11px 16px 8px;
    background:var(--bg);color:var(--title);border:1.5px solid var(--line);border-radius:12px;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out),opacity var(--t-fast) var(--ease-out)}
  @media (hover:hover){
    button.ev:hover:not(:disabled){border-color:var(--on-highlight)}
  }
  button.ev:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.ev:disabled{cursor:default}
  .ev .eh{display:flex;align-items:flex-start;gap:10px}
  .ev .bk{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .ev .en{flex:1 1 auto;min-width:0;font-size:18px;line-height:1.2;font-weight:600}
  .ev .es{font-size:16px;line-height:1.42;color:var(--body)}
  /* The state tag ("Your pick", "The strongest") sits on the card's top
     edge as a small label, so it takes no line of its own: the card copy
     keeps 16px type and still fits the canvas. Empty until a pick. */
  .ev .tg{position:absolute;top:-10px;right:12px;padding:1px 8px;border-radius:10px;background:var(--bg);
    border:1.5px solid var(--on-highlight);font-size:13px;font-weight:600;line-height:1.2;color:var(--on-highlight);white-space:nowrap}
  .ev .tg:empty{display:none}
  /* Picked, not yet checked: filled with the highlight and ringed, and the
     words "Your pick". No tick: nothing has been judged yet. */
  button.ev.sel{background:var(--highlight);border-color:var(--on-highlight);box-shadow:inset 0 0 0 1.5px var(--on-highlight)}
  /* Checked. The strongest card is the filled one, with a tick and the word
     Strongest. A wrong pick gets a cross, a struck name and a dashed edge.
     The rest step back. Glyph and words every time, never colour alone. */
  button.ev.is-right{background:var(--on-highlight);border-color:var(--on-highlight);box-shadow:none;color:var(--bg)}
  button.ev.is-right svg.ic{stroke:var(--bg)}
  button.ev.is-right .es{color:var(--bg)}
  button.ev.is-wrong{background:transparent;border:2px dashed var(--on-highlight);box-shadow:none}
  button.ev.is-wrong .en{text-decoration:line-through;text-decoration-thickness:1.5px;font-weight:400;color:var(--body)}
  button.ev.is-wrong .tg{color:var(--title)}
  button.ev.is-other{opacity:.55}
  /* The card entry moves transform only. An opacity keyframe held by
     fill-mode would pin the stepped-back cards at full opacity after a live
     Check, so they would only fade on a reload. */
  button.ev.in{animation:rinc var(--t-reveal) var(--ease-over) both}
  @keyframes rinc{from{transform:translateY(-6px)}to{transform:none}}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* slide 2: the strongest one, and your pick */
  .win{flex:0 0 auto;display:flex;gap:22px;align-items:center;
    background:var(--highlight);border:1.5px solid var(--on-highlight);border-left-width:6px;border-radius:0 12px 12px 0;
    padding:24px 26px}
  .win .gm{flex:0 0 auto;display:flex}
  .win .gm svg.ic{width:52px;height:52px;stroke-width:1.6}
  .win .wb{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:10px}
  .win .wr{font-size:20px;line-height:1.5;color:var(--title);max-width:62ch}
  .win .wr b{color:var(--title);font-weight:600}
  .mine{flex:0 0 auto;display:flex;align-items:flex-start;gap:14px;background:var(--bg);
    border:1.5px solid var(--on-highlight);border-radius:10px;padding:12px 18px}
  .mine.miss{border:2px dashed var(--on-highlight)}
  .mine .gl{flex:0 0 auto;display:flex}
  .mine .gl svg.ic{width:30px;height:30px}
  .mine .mb{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
  .mine .mh{font-size:17px;line-height:1.35;font-weight:600;color:var(--title)}
  .mine .mr{font-size:16px;line-height:1.45;color:var(--body)}
  .win.in,.mine.in,.wk.in{animation:rin var(--t-reveal) var(--ease-over) both}

  /* slide 3: why the other five are weaker */
  .lead{flex:0 0 auto;font-size:17px;line-height:1.4;color:var(--body);margin-top:-4px}
  .lead b{color:var(--title);font-weight:600}
  /* Row flow, so the two cards in a row share one height and the five read
     in card order, left to right. */
  .weak{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-auto-rows:auto;gap:7px 16px;align-content:start}
  .wk{min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:6px 14px 7px;
    display:flex;flex-direction:column;gap:2px}
  .wk.mine-row{border:2px dashed var(--on-highlight)}
  .wk .wh{display:flex;align-items:baseline;gap:8px;font-size:16px;line-height:1.3;font-weight:600;color:var(--title)}
  .wk .wh .n{flex:1 1 auto;min-width:0}
  .wk .wh svg.ic{width:20px;height:20px;align-self:center}
  .wk .wh .yp{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--on-highlight);white-space:nowrap}
  .wk .wt{font-size:16px;line-height:1.42;color:var(--body)}

  /* the bar. margin-top:auto plus flex:0 0 auto means overflow above
         can never displace this row. */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:10px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:44px;overflow-y:auto;font-size:13px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}
  /* the end pointer, shown on the last slide in place of Continue */
  .endline{flex:1 1 auto;min-width:0;align-self:center;font-size:14px;line-height:1.36;font-weight:600;color:var(--title)}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* under 600px: a portrait restack, not a shrunken slide */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .board{gap:12px}
    .intro p{font-size:16px}
    .how{flex-wrap:wrap;font-size:16px;padding:10px 12px}
    .grid{grid-template-columns:1fr;grid-template-rows:none;gap:10px}
    .board.pickb{display:flex;flex-direction:column}
    .pickb .how.pre{padding-right:12px}
    .pickb .how.done{order:2}
    .pickb .chkw{padding-right:0;align-self:stretch}
    .chkw button.nav{width:100%;padding:13px 20px}
    button.ev{padding:14px 14px 12px}
    .ev .en{font-size:18px}
    .ev .es{font-size:16px;line-height:1.45}
    .ev .tg{font-size:14px;top:-11px}
    .win{flex:0 0 auto;flex-direction:column;align-items:flex-start;gap:12px;padding:16px}
    .win .gm svg.ic{width:40px;height:40px}
    .win .wr{font-size:17px}
    .mine{padding:12px 14px}
    .mine .mh{font-size:17px}
    .mine .mr{font-size:16px;line-height:1.5}
    .lead{font-size:16px}
    .weak{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}
    .wk .wh{font-size:17px}
    .wk .wt{font-size:16px;line-height:1.5}
    button.jump{font-size:16px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
    .endline{flex:1 1 100%;font-size:15px;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Which evidence is strongest?">

    <div class="top">
      <span class="prog" id="prog">1 of 3</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Continue</button>
      <button class="nav ghost" id="again" type="button" hidden>Start again</button>
      <span class="endline" id="endline" hidden></span>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:17px;color:#1C1B1B;margin:20px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ol,.nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:6px}
    .nsf strong{color:#1C1B1B}
    .nsf .box{background:#DCE1FF;border-left:4px solid #001D69;padding:12px 16px;margin:16px 0;color:#1C1B1B}
  </style>
  <div class="nsf">
    <h2>Which is the strongest evidence in the whole project?</h2>
    <p>There are six things you made in this project that we are going to show you. Pick the one that you think is the strongest evidence, and write it down before you read on.</p>
    <ol>
      <li><strong>The controls list.</strong> Every rule the policy claims, and whether you saw it happen.</li>
      <li><strong>The three live checks.</strong> Three promises from the policy, checked on Cumberland's real website.</li>
      <li><strong>The inherent risk score.</strong> How risky Cumberland's line of work is, from twelve questions.</li>
      <li><strong>The current and target profile.</strong> Cumberland's security scored 0 to 4 in six areas, for today and for where it should be.</li>
      <li><strong>The gap heatmap.</strong> Your profile, drawn as a chart of colors.</li>
      <li><strong>The nine questionnaire answers.</strong> Your answers to Meridian's nine questions.</li>
    </ol>

    <h3>Did you pick the three live checks? That is the right answer.</h3>
    <!-- SME P3-11 says 'the places where the policy and the live system disagree'; dropped because one of three claims holds (P3-5). Ask Chaitanya to review. -->
    <div class="box"><p>You checked three promises from the policy on Cumberland's real website. Anyone can open the same page and see the same thing. Everything else is a score someone could argue with; <strong>that one is proof.</strong></p></div>

    <h3>Why the other five are weaker</h3>
    <p>All five are still evidence. Each one is weaker than a check anyone can repeat.</p>
    <ul>
      <li><strong>The controls list.</strong> These rows come straight from the policy. Most say unverified, which means you never saw them happen, so they cannot prove anything either way.</li>
      <li><strong>The inherent risk score.</strong> You chose each score yourself, so someone could argue for a different one. It also describes the business, not its security.</li>
      <li><strong>The current and target profile.</strong> You picked all twelve scores yourself, so someone else could score them differently.</li>
      <li><strong>The gap heatmap.</strong> It is your profile turned into colors, so it is only as strong as your scores.</li>
      <li><strong>The nine questionnaire answers.</strong> Each answer points back at evidence from somewhere else, so it is only as strong as that evidence.</li>
    </ul>
    <p><strong>Keep your Live Checks tab open. Go back to the module and keep going: you will use it on slide 5.</strong></p>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /*  content 
     The six items, their order and the answer are Chaitanya's: P3-11,
     "Interactive content sets - P3.md" (SME drop 2026-09-25), which lists
     controls list, three verification results, inherent risk score,
     profile, heatmap, nine answers, and names the three live verification
     results as the answer.
     `name` follows the module 11 spec card labels. `sub` is a plain-words
     reminder of what each one is, ours. `why` is the explanation: the live
     checks reason follows P3-11 and P3-5; the five others are our draft
     wording from the SME facts, pending owner approval (module-11-internal
     flag). */
  var CARDS = [
    { id:"controls", n:1, ok:false, ico:"list", name:"The controls list",
      sub:"Every rule the policy claims, and whether you saw it happen.",
      why:"These rows come straight from the policy. Most say unverified, which means you never saw them happen, so they cannot prove anything either way." },
    /* The last sentence of this `why` is the SME line from P3-11, verbatim,
       with his bold on "that one is proof." Do not reword it. */
    /* SME P3-11 also says "the places where the policy and the live system
       disagree". Dropped, see the HTML comment on the noscript reveal. */
    { id:"live", n:2, ok:true, ico:"globe", name:"The three live checks",
      sub:"Three promises from the policy, checked on Cumberland's real website.",
      why:"You checked three promises from the policy on Cumberland's real website. Anyone can open the same page and see the same thing. Everything else is a score someone could argue with; <b>that one is proof.</b>" },
    { id:"risk", n:3, ok:false, ico:"gauge", name:"The inherent risk score",
      sub:"How risky Cumberland's line of work is, from twelve questions.",
      why:"You chose each score yourself, so someone could argue for a different one. It also describes the business, not its security." },
    { id:"profile", n:4, ok:false, ico:"bars", name:"The current and target profile",
      sub:"Cumberland's security scored 0 to 4 in six areas, for today and for where it should be.",
      why:"You picked all twelve scores yourself, so someone else could score them differently." },
    { id:"heatmap", n:5, ok:false, ico:"grid", name:"The gap heatmap",
      sub:"Your profile, drawn as a chart of colors.",
      why:"It is your profile turned into colors, so it is only as strong as your scores." },
    { id:"answers", n:6, ok:false, ico:"clip", name:"The nine questionnaire answers",
      sub:"Your answers to Meridian's nine questions.",
      why:"Each answer points back at evidence from somewhere else, so it is only as strong as that evidence." }
  ];
  /* The close line, shown in the bar on the last slide in place of
     Continue. Owner wording after QA, 2 October 2026. */
  var CLOSE = "Keep your Live Checks tab open. Go back to the module and keep going: you will use it on slide 5.";

  var S = [
    { id:"pick",  kind:"pick",  label:"Pick one", h1:"Which is the strongest evidence in the whole project?" },
    { id:"best",  kind:"best",  label:"The strongest", h1:"Did you pick the three live checks? That is the right answer." },
    { id:"weak",  kind:"weak",  label:"The other five", h1:"Why the other five are weaker" }
  ];

  /*  state 
     localStorage is wrapped: a blocked storage API must degrade silently. */
  var KEY = "vciso-p3-m11-strongest-evidence-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { pick:null, checked:false }; }
  function cardOf(id){ for(var k=0;k<CARDS.length;k++) if(CARDS[k].id === id) return CARDS[k]; return null; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw) || !cardOf(raw.pick)) return fresh();
      return { pick:raw.pick, checked:raw.checked === true };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var GLYPH = { out:"✕", ok:"✓" };
  /* Inline SVG icons, Phosphor style: one weight, outline, navy. */
  var ICON = {
    list:'<path d="M10.5 6.5h10M10.5 12h10M10.5 17.5h10"/><path d="M3.5 6.5l1.6 1.6 3-3M3.5 12l1.6 1.6 3-3M3.5 17.5l1.6 1.6 3-3"/>',
    globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/>',
    gauge:'<path d="M3.5 17a8.5 8.5 0 1 1 17 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1.4"/>',
    bars:'<path d="M3.5 20.5h17"/><rect x="5" y="11" width="3.5" height="9.5" rx=".6"/><rect x="10.25" y="5.5" width="3.5" height="15" rx=".6"/><rect x="15.5" y="13.5" width="3.5" height="7" rx=".6"/>',
    grid:'<rect x="4" y="4" width="16" height="16" rx="1.6"/><path d="M12 4v16M4 12h16"/>',
    clip:'<rect x="5" y="4.5" width="14" height="16.5" rx="1.8"/><path d="M9 4.5V3h6v1.5"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/>',
    okc:'<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8 5.4-5.6"/>',
    noc:'<circle cx="12" cy="12" r="9"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICON[k] + "</svg>"; }

  /* Data validation, at load, loud. */
  (function validate(){
     var problems = [], ids = {}, cids = {}, right = 0;
     S.forEach(function(s, n){
       if(!s.id) problems.push("slide " + (n+1) + " has no id");
       if(ids[s.id]) problems.push('duplicate slide id "' + s.id + '"');
       ids[s.id] = 1;
     });
     CARDS.forEach(function(c){
       if(cids[c.id]) problems.push('duplicate card id "' + c.id + '"');
       cids[c.id] = 1;
       if(c.ok) right++;
       if(!c.why || !c.name || !c.sub || !ICON[c.ico]) problems.push('card "' + c.id + '" is missing a name, a line, an icon or a reason');
     });
     if(right !== 1) problems.push("exactly one card must be the strongest, found " + right);
     if(problems.length){
       document.getElementById("board").innerHTML =
         '<div class="intro"><p><b>This deck has authoring errors and will not '
         + 'behave correctly:</b></p><ul style="font-size:13px;line-height:1.6;padding-left:18px">'
         + problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul></div>";
       throw new Error("deck data invalid: " + problems.join("; "));
     }
  })();
  var BEST = CARDS.filter(function(c){ return c.ok; })[0];

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    again:document.getElementById("again"), endline:document.getElementById("endline"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function plain(html){ return String(html).replace(/<[^>]+>/g, ""); }
  function say(m){ el.live.textContent = m; }
  function gotRight(){ return st.checked && st.pick === BEST.id; }
  /* "the gap heatmap" reads inside a sentence; the card name starts with "The". */
  function lower(name){ return name.charAt(0).toLowerCase() + name.slice(1); }

  /*  chrome  */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    el.back.disabled = (i === 0);
    /* Start again shows once a pick is checked. On the last slide Continue
       gives way to a plain line pointing back to the module. */
    el.again.hidden = !st.checked;
    var last = (i === S.length-1);
    el.next.hidden = last;
    el.hint.hidden = last;
    el.endline.hidden = !(last && st.checked);
    el.endline.textContent = CLOSE;
    el.next.disabled = !st.checked;
    el.next.textContent = "Continue";
  }

  function render(focusSel){
    var s = S[i];
    document.body.className = "t" + (i+1);
    /* Before a pick is checked, slides 2 and 3 must not show their headings:
       slide 2's heading is the answer. */
    var gated = s.kind !== "pick" && !st.checked;
    el.h1.textContent = gated ? "Pick one first." : s.h1;
    el.frame.setAttribute("aria-label", el.h1.textContent);
    el.hint.textContent = "";
    el.board.className = "board";
    if(s.kind === "pick") renderPick(focusSel);
    else if(!st.checked) renderGate();
    else if(s.kind === "best") renderBest();
    else if(s.kind === "weak") renderWeak();
    else {
      el.board.innerHTML = '<div class="intro"><p><b>Unhandled slide kind "' + esc(String(s.kind)) + '".</b></p></div>';
    }
    header();
  }

  /*  slide 1: pick one 
     Tap a card to pick it, tap another to change your mind, then Check.
     After Check the cards lock and show the answer. */
  function cardHTML(c, anim){
    var done = st.checked, mine = st.pick === c.id;
    var cls = "ev", tag = "", sr = "";
    if(done){
      if(c.ok){
        cls += " is-right";
        tag = GLYPH.ok + (mine ? " Your pick" : " Right answer");
        sr = mine ? " Your pick. Right." : " The right answer.";
      } else if(mine){
        /* Never a tick on a wrong pick: a cross, a struck name, a dashed edge. */
        cls += " is-wrong";
        tag = GLYPH.out + " Your pick";
        sr = " Your pick. Not right.";
      } else cls += " is-other";
      cls += anim;
    } else if(mine){
      cls += " sel";
      tag = "Your pick";
      sr = " Your pick.";
    }
    return '<button class="' + cls + '" type="button" data-c="' + c.id + '"' +
      (done ? " disabled" : ' aria-pressed="' + (mine ? "true" : "false") + '"') + ">" +
      '<span class="eh"><span class="bk" aria-hidden="true">' + icon(c.ico) + "</span>" +
      '<span class="en">' + esc(c.name) + "</span></span>" +
      '<span class="es">' + esc(c.sub) + "</span>" +
      '<span class="tg" aria-hidden="true">' + tag + "</span>" +
      (sr ? '<span class="sr">' + sr + "</span>" : "") + "</button>";
  }

  function renderPick(focusSel, animate){
    var done = st.checked;
    var anim = animate && !reduce ? " in" : "";
    var how;
    if(!done){
      how = '<div class="how pre"><span class="ht">There are six things you made in this project that we are going to show you. Pick the one that you think is the strongest evidence.</span></div>';
    } else {
      how = '<div class="how done"><span class="ht"><span class="gl" aria-hidden="true">' + icon(gotRight() ? "okc" : "noc") + "</span>" +
        (gotRight() ? "<b>Right.</b> The three live checks are the strongest. Continue to see why."
                    : "<b>Not right.</b> The three live checks are the strongest. Continue to see why.") + "</span></div>";
    }
    /* Check comes after the grid in the DOM, so Tab reaches it after the
       cards. CSS puts it back on the strip on the canvas. */
    var chk = done ? "" : '<div class="chkw"><button class="nav" id="chk" type="button"' + (st.pick ? "" : " disabled") + ">Check my pick</button></div>";
    el.board.className = "board pickb";
    el.board.innerHTML = how + '<div class="grid" role="group" aria-label="Six pieces of evidence" aria-describedby="kbhelp">' +
      CARDS.map(function(c){ return cardHTML(c, anim); }).join("") + "</div>" + chk +
      '<span class="sr" id="kbhelp">On a keyboard, press 1 to 6 to pick a card, or Tab to a card and press Enter. Then Tab to Check my pick.</span>';
    el.hint.textContent = "";
    if(!done){
      Array.prototype.forEach.call(el.board.querySelectorAll("button.ev"), function(b){
        b.addEventListener("click", function(){ pick(b.dataset.c); });
      });
      el.board.querySelector("#chk").addEventListener("click", check);
      el.hint.innerHTML = st.pick
        ? "<span><b>Your pick: " + esc(lower(cardOf(st.pick).name)) + ".</b> You can still change it. When you are sure, press <b>Check my pick</b>.</span>"
        : "<span>Pick a card. You can change it until you press <b>Check my pick</b>.</span>";
    }
    if(focusSel){ var f = el.board.querySelector(focusSel); if(f) f.focus(); }
  }

  function pick(id){
    if(st.checked || !cardOf(id)) return;
    st.pick = id; save(st);
    renderPick('.ev[data-c="' + id + '"]');
    header();
    say("Your pick: " + cardOf(id).name + ". Press Check my pick when you are sure.");
  }

  function check(){
    if(st.checked || !st.pick) return;
    st.checked = true; save(st);
    renderPick(null, true);
    header();
    try{ el.next.focus({preventScroll:true}); }catch(e){ el.next.focus(); }
    say((gotRight() ? "Right. " : "Not right. ") + "The three live checks are the strongest. Continue to see why.");
  }

  /*  slides 2 and 3 before a pick is checked  */
  function renderGate(){
    el.board.innerHTML = '<div class="intro"><p>Pick one card on the first slide and press <b>Check my pick</b>. The answer shows here once you do.</p>' +
      '<button class="jump" type="button" id="topick">Go to the six cards</button></div>';
    el.board.querySelector("#topick").addEventListener("click", function(){ i = 0; render(); toTop(); });
  }

  /*  slide 2: the strongest, and your pick  */
  function renderBest(){
    var anim = reduce ? "" : " in";
    var mine = cardOf(st.pick), right = gotRight();
    var panel = right
      ? '<div class="mine' + anim + '"><span class="gl" aria-hidden="true">' + icon("okc") + "</span>" +
          '<div class="mb"><div class="mh">Right. You picked this one.</div>' +
          '<div class="mr">The next slide shows why the other five are weaker.</div></div></div>'
      : '<div class="mine miss' + anim + '"><span class="gl" aria-hidden="true">' + icon("noc") + "</span>" +
          '<div class="mb"><div class="mh">You picked ' + esc(lower(mine.name)) + ". Here is why it is weaker.</div>" +
          '<div class="mr">' + mine.why + "</div></div></div>";
    el.board.innerHTML =
      '<div class="win' + anim + '"><span class="gm" aria-hidden="true">' + icon("okc") + "</span>" +
        '<div class="wb"><div class="wr">' + BEST.why + "</div></div></div>" + panel;
  }

  /*  slide 3: the other five  */
  function renderWeak(){
    var anim = reduce ? "" : " in";
    var rest = CARDS.filter(function(c){ return !c.ok; });
    el.board.innerHTML =
      '<p class="lead"><b>All five are still evidence.</b> Each one is weaker than a check anyone can repeat.</p>' +
      '<div class="weak">' + rest.map(function(c){
        var mine = st.pick === c.id;
        return '<div class="wk' + (mine ? " mine-row" : "") + anim + '">' +
          '<div class="wh">' + icon(c.ico) + '<span class="n">' + esc(c.name) + "</span>" +
          (mine ? '<span class="yp">' + GLYPH.out + " Your pick</span>" : "") + "</div>" +
          '<div class="wt">' + c.why + "</div></div>";
      }).join("") + "</div>";
  }

  /*  navigation  */
  function toTop(){
    try{ el.frame.focus({preventScroll:true}); }catch(e){ el.frame.focus(); }
    try{ window.scrollTo(0, 0); }catch(e){}
  }
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    if(d > 0 && !st.checked){
      if(S[i].kind === "pick") el.hint.innerHTML = "<span><b>Pick one and check it first.</b> Then the answer opens.</span>";
      return;
    }
    i = n; render(); toTop();
    say("Slide " + (i+1) + " of " + S.length + ". " + el.h1.textContent + ".");
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });
  el.again.addEventListener("click", function(){
    st = fresh(); save(st); i = 0; render(); toTop();
    say("Started again. No card is picked.");
  });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return true;
    var r = node.getAttribute && node.getAttribute("role");
    return r === "slider" || r === "textbox" || r === "spinbutton" || r === "listbox";
  }

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(S[i].kind !== "pick" || st.checked) return;
    var n = "123456".indexOf(e.key);
    if(n >= 0 && CARDS[n]){ e.preventDefault(); pick(CARDS[n].id); }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    if(ownsKeys(e.target)){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /*  scale the fixed canvas down to fit, never up  */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /*  the QA hook 
     measure-fit.mjs steps through the deck with this. Keep it on every deck.
     goto ignores the check-first lock, on purpose, so every slide can be
     measured. pick and check let a QA run reach the answered states. */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    pick:function(id){ i = 0; render(); pick(id); return st.pick === id; },
    check:function(){ check(); return st.checked; },
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    state:function(){ return { i:i, pick:st.pick, checked:st.checked }; }
  };
})();
</script>
</body>
</html>
