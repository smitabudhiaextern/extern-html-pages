<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-reveal:460ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);

  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .dots{display:flex;gap:7px;align-items:center}
  .dots i{display:block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--on-highlight);background:transparent}
  .dots i.on{background:var(--on-highlight)}
  .dots i.here{background:var(--on-highlight);width:12px;height:12px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--on-highlight)}

  h1{font-size:25px;line-height:1.22;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  .lead{font-size:16px;line-height:1.48;color:var(--body);max-width:96ch}
  .lead b{color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- slide 1: six cards, one pick ---------- */
  .opts{min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto;gap:8px 12px}
  button.opt{font-family:inherit;text-align:left;color:var(--title);min-width:0;width:100%;
    background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;
    padding:7px 12px 8px;cursor:pointer;display:flex;gap:10px;align-items:center;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  button.opt .g{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;background:var(--highlight)}
  button.opt .g svg.ic{width:17px;height:17px}
  button.opt .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
  button.opt .lr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
  button.opt .ol{font-size:16px;font-weight:700;line-height:1.25;color:var(--title);min-width:0}
  button.opt .om{font-size:14px;line-height:1.34;color:var(--body)}
  button.opt .tg{flex:0 0 auto;font-size:13px;font-weight:700;white-space:nowrap}
  button.opt .kn{flex:0 0 auto;min-width:22px;height:22px;padding:0 5px;border-radius:5px;border:1.5px solid var(--line);
    font-size:12.5px;font-weight:600;line-height:19px;text-align:center;color:var(--on-highlight);background:var(--bg)}

  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt:disabled{cursor:default}
  button.opt.idle:disabled{border-style:dashed;border-color:var(--line)}
  button.opt.idle:disabled .g{border-color:var(--line);color:var(--body);background:transparent}
  button.opt.idle:disabled .ol{color:var(--body)}
  button.opt.ok{background:var(--ok-tint);border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
  button.opt.ok .g{background:var(--ok);border-color:var(--ok);color:var(--bg)}
  button.opt.ok .g svg.ic{stroke-width:2.6}
  button.opt.ok .tg{color:var(--ok)}
  button.opt.no{background:var(--no-tint);border-color:var(--no);box-shadow:0 0 0 1px var(--no)}
  button.opt.no .g{background:var(--no);border-color:var(--no);color:var(--bg)}
  button.opt.no .g svg.ic{stroke-width:2.6}
  button.opt.no .tg{color:var(--no)}

  .fb.ok{background:var(--ok-tint);border-color:var(--ok)}
  .fb.no{background:var(--no-tint);border-color:var(--no)}
  .fb .fh{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:700}
  .fb.ok .fh{color:var(--ok)}
  .fb.no .fh{color:var(--no)}
  .fb .fh svg.ic{width:20px;height:20px;stroke-width:2}
  .fb .ft{font-size:14.5px;line-height:1.42;color:var(--title)}
  .fb .ft b{font-weight:700}
  .fb.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .fb:focus{outline:none}

  /* ---------- slide 2: why the other five are weaker ---------- */
  .weak{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-rows:auto;gap:9px 16px;align-content:start}
  .wk{min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px 9px;
    display:flex;flex-direction:column;gap:3px}
  .wk.mine{border:2px dashed var(--on-highlight)}
  .wk .wh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px;line-height:1.3;font-weight:700;color:var(--title)}

  .wk .wh svg.ic{width:20px;height:20px;color:var(--on-highlight);flex:0 0 auto}
  .wk .wh .yp{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--on-highlight);white-space:nowrap}
  .wk .wt{font-size:15px;line-height:1.42;color:var(--body)}
  .wk.in{animation:rin var(--t-reveal) var(--ease-over) both}

  /* the bar */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:52px;padding-top:9px}
  button.nav{font-family:inherit;font-size:15px;font-weight:600;padding:9px 20px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.36;color:var(--body)}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* under 600px: a portrait restack, not a shrunken slide */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .board{flex:0 0 auto;gap:14px}
    .opts{grid-template-columns:1fr;gap:10px}
    button.opt{padding:11px 12px 12px}
    button.opt .ol{font-size:17px}
    button.opt .om{font-size:15px}
    button.opt .kn{display:none}
    .fb .ft{font-size:15.5px}
    .fb{scroll-margin:16px}
    .weak{grid-template-columns:1fr}
    .wk .wh{font-size:17px}
    .wk .wt{font-size:16px;line-height:1.5}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{font-size:15px;flex:1 1 100%;margin-top:4px}
    #hint .kb{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

    <h2>Which do you think is the strongest evidence in the whole project?</h2>
    <p>Here are six things you made in this project. Pick the one that you think is the strongest evidence, and write it down before you open the answer.</p>

  var CARDS = [

    var c = cardOf(id);
    if(!c || A.done || A.out[id]) return;
    if(c.ok) A.done = "right";
    else {
      A.out[id] = 1; A.last = id;
      if(Object.keys(A.out).length >= 2) A.done = "shown";
    }
    render();
    var fb = el.board.querySelector("#fb");
    if(fb && !reduce){ fb.classList.remove("in"); void fb.offsetWidth; fb.classList.add("in"); }
    if(fb) say(plain(fb.textContent).replace(/^(Right|Not quite|Here is the right answer: the three live checks)/, "$1. "));
    var ph = phone(), opt = ph ? { preventScroll:true } : undefined;
    if(A.done) el.next.focus(opt);
    else { var f = el.board.querySelector(".opts button.opt:not(:disabled)"); if(f) f.focus(opt); }
    if(fb && ph) fb.scrollIntoView({ block:"nearest", behavior: reduce ? "auto" : "smooth" });
  }

  /* ---------- slide 2: the other five ---------- */
  function sWeak(){
    var anim = reduce ? "" : " in";
    return '<p class="lead"><b>All five are still evidence.</b> Each one is weaker than a check anyone can repeat.</p>'
      + '<div class="weak">' + CARDS.filter(function(c){ return !c.ok; }).map(function(c){
        var mine = !!A.out[c.id];
        return '<div class="wk' + (mine ? " mine" : "") + anim + '">'
          + '<div class="wh">' + icon(c.ic) + '<span class="n">' + esc(c.name) + "</span>"
          + (mine ? '<span class="yp">You picked this one</span>' : "") + "</div>"
          + '<div class="wt">' + esc(c.why) + "</div></div>";
      }).join("") + "</div>";
  }

  var S = [
    { label:"Pick one", h1:"Which do you think is the strongest evidence in the whole project?", r:sPick, pick:true },
    { label:"The other five", h1:"Why the other five are weaker", r:sWeak }
  ];
  var i = 0;

  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k === i ? "here" : k < i ? "on" : "") + "'></i>";
    el.segs.innerHTML = h;
    el.back.disabled = (i === 0);
    el.next.hidden = false; el.next.disabled = false; el.again.hidden = true;
    el.hint.textContent = "";
    if(s.pick){
      if(A.done) el.hint.textContent = "Press Next to see why the other five are weaker.";
      else {
        el.next.disabled = true;
        el.hint.innerHTML = (Object.keys(A.out).length ? "Pick another one." : "Pick the one you think is strongest.")
          + '<span class="kb"> You can also press the number on a card, 1 to 6.</span>';
      }
    } else {
      el.next.hidden = true;
      el.again.hidden = false;
      el.hint.innerHTML = "<b>" + esc(CLOSE) + "</b>";
    }
  }

  function render(){
    var s = S[i];
    el.h1.textContent = s.h1;
    el.board.innerHTML = s.r();
    Array.prototype.forEach.call(el.board.querySelectorAll(".opts button.opt:not(:disabled)"), function(b){
      b.addEventListener("click", function(){ pick(b.dataset.c); });
    });
    el.frame.setAttribute("aria-label", s.h1);
    header();
  }

  function focusTop(){
    var ph = phone();
    el.frame.focus(ph ? { preventScroll:true } : undefined);
    if(ph) window.scrollTo(0, 0);
  }
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    if(d > 0 && (el.next.disabled || el.next.hidden)) return;
    i = n; render(); focusTop();
    say(el.prog.textContent + ". " + S[i].h1);
  }
  function resetAll(){ A = fresh(); i = 0; render(); }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });
  el.again.addEventListener("click", function(){ resetAll(); focusTop(); say("Cleared. Back to the start."); });

  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(S[i].pick && /^[1-6]$/.test(e.key)){ e.preventDefault(); pick(CARDS[+e.key - 1].id); }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* scale the fixed canvas down to fit, never up */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()) stage.style.transform = "";
    else {
      var sc = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
      stage.style.transform = "scale(" + sc + ")";
    }
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* the QA hook */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    pick:function(id){ i = 0; render(); pick(id); return A; },
    reset:function(){ resetAll(); },
    state:function(){ return { i:i, answers:A }; }
  };
})();
</script>
</body>
</html>
