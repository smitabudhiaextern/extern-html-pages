<title>What Do the Failures Have in Common?</title>
<!--
  vCISO P4 Step 2, Module 8: Grade the Client's Eight Claims, and Read the Pattern.
  Build spec in 06-content/project-04/step-02/module-08-internal.md (Build Note).
  Governing authority: output/programs/vciso/CLAUDE.md section 6. Look, navigation,
  state handling, scale-to-fit and phone layout match
  vciso-p2-m11-is-cumberland-actually-affected.html and
  vciso-p2-m12-day-8-why-is-it-still-spreading.html.

  Sources for every fact:
  - The eight claims, rows and grades: P4 Sample Pack, "Prior questionnaire and
    evidence - answer key.md" section 1, and "Interactive content sets - P4.md",
    P4-7. Grades are identical in every scope, so there is no scope picker.
  - File or gap text per claim: the spec's screen 2 list (P4-7 table, 25 Sep, and
    key section 1). Claim 5 is the cell text Chaitanya approved (25 Sep, item 10b).
    Claim 4's extra line is the lead writer's L3 pointer from the spec.
    Firewall file name per Chaitanya 25 Sep, item 10e.
  - The pattern: P4-7 and key section 2, verbatim apart from dashes.
  - Grade definitions under each option: module 5 (P4-5 and key section 4).
  - Plain-words lines for MFA and Entra ID reuse P3 module 4's definitions.
    The firewall line reuses vciso-p2-m11.

  Owner rules applied (Project 2, 1 October 2026), in place of the spec's
  "enter all eight, then check" screen: one claim per slide, "Question N of 8".
  A right pick turns green with a tick and "Right"; a wrong pick turns red with
  a cross and "Not quite", with a short reason, then try again. After two wrong
  tries the right grade is shown green, "Right answer". The first pick on each
  claim is kept as "Your first pick" and compared on the summary slide
  (Matches in green, Differs in navy, never red), which is the spec's
  Matches or Differs label. The pattern question has no single right answer,
  says so, and never shows red. "Governance item" is not used (spec).
  Not shown, per spec: MEDFLOW-TEST in claim 3, host lists, restore tests.
  Green #146C2E on #E6F4EA (5.7:1), red #B3261E on #FCE8E6 (5.6:1).

  Ask Chaitanya to review: claim 3, a filtered export graded Proven against
  the claim's "all servers and workstations" (answer key: "Installed today is
  real evidence for the claim as written"). The grade is unchanged; only the
  explanation under the card says why it still counts.
  "Form row" (chip and summary column) is the module's "Question" column,
  renamed here so that "Question N of 8" means only the slide count.
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    /* right and wrong states only, always paired with an icon and a word */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-reveal:460ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto;background:var(--bg)}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:6px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  h1{font-size:24px;line-height:1.22;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:6px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px;overflow-y:auto;padding:4px 6px;margin:-4px -6px}
  .lead{flex:0 0 auto;font-size:15px;line-height:1.45;color:var(--body)}
  .lead b{color:var(--title);font-weight:600}
  .sub{flex:0 0 auto;font-size:14px;line-height:1.4;color:var(--body)}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- a claim slide ---- */
  .pick{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1.12fr;gap:16px}
  .opts{display:flex;flex-direction:column;gap:8px;min-height:0}
  button.opt{font-family:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--title);
    border:1.5px solid var(--on-highlight);border-radius:10px;padding:6px 8px 6px 12px;flex:1 1 auto;min-height:0;
    display:grid;grid-template-columns:36px 1fr 66px;gap:10px;align-items:center;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  @media (hover:hover){ button.opt:hover:not(:disabled){background:var(--highlight)}
    html.fresh button.opt:hover:not(:disabled){background:var(--bg)} }
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt:disabled{cursor:default}
  button.opt .oi{width:36px;height:36px;border-radius:10px;background:var(--highlight);color:var(--on-highlight);
    border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center}
  button.opt .oi svg.ic{width:22px;height:22px}
  button.opt .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
  button.opt .on{font-size:16.5px;font-weight:600;line-height:1.25;color:var(--title)}
  button.opt .od{font-size:13.5px;line-height:1.32;color:var(--body)}
  button.opt .mk{display:flex;flex-direction:column;align-items:center;gap:3px;justify-self:center}
  button.opt .lb{font-size:12.5px;font-weight:700;line-height:1.15;text-align:center}
  /* The state marker: an empty ring until clicked. Never filled before a pick. */
  button.opt .g{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;background:transparent}
  button.opt .g svg.ic{width:14px;height:14px;stroke-width:2.6}
  button.opt.ok{background:var(--ok-tint);border:2px solid var(--ok)}
  button.opt.ok .g{background:var(--ok);border-color:var(--ok);color:var(--bg)}
  button.opt.ok .lb{color:var(--ok)}
  button.opt.ok .oi{background:var(--bg);border-color:var(--ok);color:var(--ok)}
  button.opt.no{background:var(--no-tint);border:2px solid var(--no)}
  button.opt.no .g{background:var(--no);border-color:var(--no);color:var(--bg)}
  button.opt.no .lb{color:var(--no)}
  button.opt.no .oi{background:var(--bg);border-color:var(--no);color:var(--no)}
  button.opt.idle{border-style:dashed;border-color:var(--line)}
  button.opt.idle .g{border-color:var(--line)}
  button.opt.idle .on{color:var(--body)}

  .panel{min-height:0;border-radius:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
  .panel:focus{outline:none}
  .panel.empty{background:var(--tint);border:1.5px dashed var(--line);padding:16px 18px;justify-content:center;gap:12px}
  .panel .pe{font-size:16px;line-height:1.45;color:var(--body)}
  .panel .pe b{color:var(--title);font-weight:600}

  .fb{flex:0 0 auto;border-radius:10px;padding:8px 14px 9px;border-left:6px solid;display:flex;flex-direction:column;gap:4px}
  .fb.ok{background:var(--ok-tint);border-color:var(--ok)}
  .fb.no{background:var(--no-tint);border-color:var(--no)}
  .fb .fh{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
  .fb.ok .fh{color:var(--ok)}
  .fb.no .fh{color:var(--no)}
  .fb .fh svg.ic{width:22px;height:22px;stroke-width:2}
  .fb .ft{font-size:14.5px;line-height:1.4;color:var(--title)}
  .fb .ft b{font-weight:700}
  .fb.in,.ev.in{animation:rin var(--t-reveal) var(--ease-over) both}

  .ev{flex:0 0 auto;background:var(--highlight);border-radius:10px;padding:9px 14px 10px;display:flex;flex-direction:column;gap:5px}
  .ev .el{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .ev .el svg.ic{width:18px;height:18px}
  .fn{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;
    color:var(--title);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px;word-break:break-all}
  .fns{display:flex;flex-wrap:wrap;gap:5px}
  .ev p{font-size:14px;line-height:1.4;color:var(--title)}
  .ev p.gl{font-size:13px;line-height:1.36;color:var(--body)}
  .ev p.x3{font-size:13.5px;border-top:1.5px solid var(--line);padding-top:5px}
  .tagrow{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.3;color:var(--body)}
  .tag{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.03em;
    text-transform:uppercase;color:var(--on-highlight);background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:20px;padding:1px 9px}
  .tag svg.ic{width:13px;height:13px;stroke-width:2.2}

  /* ---- the summary table ---- */
  .ctab{flex:0 0 auto;width:100%;border-collapse:collapse;table-layout:fixed;background:var(--bg);
    font-size:13.5px;line-height:1.3;color:var(--title)}
  .ctab th{background:var(--on-highlight);color:var(--bg);text-align:left;font-size:11px;font-weight:600;
    letter-spacing:.03em;text-transform:uppercase;padding:6px 8px;vertical-align:bottom;line-height:1.25}
  .ctab th:nth-child(1){width:4%} .ctab th:nth-child(2){width:9.5%} .ctab th:nth-child(3){width:46.5%}
  .ctab th:nth-child(4){width:14%} .ctab th:nth-child(5){width:14%} .ctab th:nth-child(6){width:12%}
  .ctab td{padding:5px 8px;border-bottom:1.5px solid var(--line);vertical-align:middle}
  .ctab td.n{font-weight:700}
  .ctab td.cg{font-weight:700}
  .mk2{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .mk2 svg.ic{width:15px;height:15px;stroke-width:2.6;flex:0 0 auto}
  .mk2.ok{color:var(--ok)}
  .mk2.df{color:var(--on-highlight)}
  .lead .mk2{vertical-align:-2px}
  .statement{flex:0 0 auto;background:var(--highlight);border-left:5px solid var(--on-highlight);
    border-radius:0 10px 10px 0;padding:9px 18px}
  .statement p{font-size:16px;line-height:1.4;font-weight:700;color:var(--title)}
  .statement p.sm{font-size:14.5px;line-height:1.4;font-weight:400;color:var(--body);margin-top:3px}
  .statement span.sm{font-size:14.5px;font-weight:400;color:var(--body);margin-left:6px}

  /* ---- the two columns ---- */
  .cols{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .col{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:12px;padding:9px 14px 10px;
    display:flex;flex-direction:column;gap:6px;min-width:0}
  .col .chd{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;color:var(--title);line-height:1.25;
    padding-bottom:6px;border-bottom:1.5px solid var(--line)}
  .col .chd .bi{width:32px;height:32px;border-radius:9px;background:var(--highlight);border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .col .chd .bi svg.ic{width:19px;height:19px}
  .col ul{list-style:none;display:flex;flex-direction:column;gap:5px}
  .col li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;font-size:13.5px;line-height:1.33;color:var(--title)}
  .col li .cn{font-weight:700;color:var(--on-highlight)}
  .col li .lw{display:flex;flex-direction:column;gap:1px}
  .col li .lw b{font-weight:700}
  .col li .lw span{font-size:12.5px;line-height:1.3;color:var(--body)}
  .col.in{animation:rin var(--t-reveal) var(--ease-over) both}

  .ask{flex:0 0 auto;display:flex;flex-direction:column;gap:5px}
  .ask label{font-size:15px;font-weight:600;color:var(--title)}
  .ask textarea{font-family:inherit;font-size:15px;line-height:1.4;color:var(--title);background:var(--bg);
    border:1.5px solid var(--on-highlight);border-radius:10px;padding:8px 12px;resize:none;height:62px;width:100%}
  .ask textarea::placeholder{color:var(--body);opacity:1}
  .ask textarea:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  .yours{flex:0 0 auto;background:var(--bg);border:1.5px dashed var(--on-highlight);border-radius:10px;padding:8px 14px;
    display:flex;flex-direction:column;gap:3px}
  .yours .yl{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .yours .yl svg.ic{width:17px;height:17px}
  .yours .yh{display:flex;align-items:center;gap:4px 14px;flex-wrap:wrap}
  .yours .yq{font-size:13.5px;line-height:1.35;color:var(--body)}
  .yours p{font-size:14.5px;line-height:1.4;color:var(--title);white-space:pre-wrap;word-break:break-word}

  .gate{flex:0 0 auto;background:var(--highlight);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
  .gate p{font-size:15px;line-height:1.45;color:var(--title)}
  button.go{font-family:inherit;font-size:15px;font-weight:600;padding:9px 17px;border-radius:8px;cursor:pointer;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);align-self:flex-start}
  button.go:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}

  /* Added by render() only when a screen would not fit the 540px canvas
     (desktop only): slightly tighter spacing, nothing hidden. */
  .frame.tight .board{gap:6px}
  .frame.tight .ev{gap:3px;padding:7px 13px 8px}
  .frame.tight .ev p{font-size:13.5px;line-height:1.36}
  .frame.tight .fb{padding:6px 14px 7px;gap:2px}
  .frame.tight .fb .ft{font-size:14px;line-height:1.35}
  .frame.tight .panel{gap:6px}
  .frame.tight .ctab td{padding-top:4px;padding-bottom:4px}
  .frame.tight .col{gap:4px;padding-top:7px;padding-bottom:8px}
  .frame.tight .col ul{gap:3px}
  .frame.tight .statement{padding:7px 16px}
  .frame.tight .statement p{font-size:15px;line-height:1.36}
  .frame.tight .col .chd{font-size:15px;padding-bottom:4px}
  .frame.tight .col li .lw span{font-size:12px;line-height:1.25}
  .frame.tight .col li{line-height:1.28}
  .frame.tight .col .chd .bi{width:28px;height:28px}
  .frame.tight .yours{padding:6px 14px}
  .frame.tight .yours p{font-size:14px;line-height:1.32}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:52px;padding-top:9px}
  button.nav{font-family:inherit;font-size:15px;font-weight:600;padding:9px 20px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.36;color:var(--body)}
  .bar.asking #hint{order:-1;color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .segs i{width:18px}
    .chip{margin-left:0;font-size:13px;white-space:normal}
    h1{font-size:21px}
    .lead{font-size:16px}
    .sub{font-size:15px}
    .board{flex:0 0 auto;overflow:visible}
    .pick{grid-template-columns:1fr}
    button.opt{flex:0 0 auto;padding:12px 10px 12px 12px;grid-template-columns:36px 1fr 62px}
    button.opt .od{font-size:15px}
    .panel{overflow:visible;scroll-margin:16px}
    .panel.empty{padding:14px 16px}
    .fb .ft,.ev p{font-size:15.5px}
    .ev p.gl,.ev p.x3{font-size:15px}
    .tagrow{font-size:15px}
    .fn{font-size:13px}
    .ctab,.ctab tbody,.ctab tr,.ctab td{display:block;width:100%}
    .ctab thead{display:none}
    .ctab{font-size:15px;background:transparent}
    .ctab tr{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 0}
    .ctab td{border:0;padding:3px 12px}
    .ctab td::before{content:attr(data-l);display:block;font-size:12.5px;font-weight:600;letter-spacing:.04em;
      text-transform:uppercase;color:var(--on-highlight)}
    .ctab td.n,.ctab td.qr{display:inline-block;width:auto;padding-right:0;color:var(--on-highlight);font-weight:700}
    .ctab td.n::before,.ctab td.qr::before,.ctab td.cl::before{display:none}
    .ctab td.n::after{content:" \00B7";}
    .ctab td.fp,.ctab td.cg{display:inline-block;width:50%;vertical-align:top}
    .ctab tr{padding:8px 0}
    .mk2{font-size:14px}
    .statement p{font-size:18px}
    .statement p.sm{font-size:15.5px}
    .statement span.sm{display:block;margin:4px 0 0;font-size:15.5px}
    .cols{grid-template-columns:1fr}
    .col li{font-size:15.5px}
    .col li .lw span{font-size:14.5px}
    .ask label{font-size:16px}
    .ask textarea{font-size:16px;height:110px}
    .yours p{font-size:16px}
    .yours .yq{font-size:15px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0;scroll-margin-bottom:16px}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{font-size:15px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

<div id="stage">

<noscript>

  <div class="nsf">
    <h2>What Do the Failures Have in Common?</h2>

      h += '<div class="fb no" id="fb"><span class="fh">' + icon("noc") + "Not quite</span>"
        + '<p class="ft">' + esc(c.why[last]) + "</p>"
        + '<p class="ft"><b>' + (a.done === "shown" ? "The right answer is " + esc(GRADES[c.ok].name) + ", marked green." : AGAIN) + "</b></p></div>";
    }
    if(a.done) h += evHTML(c);
    return h + "</div>";
  }
  function renderQ(k){
    var c = CLAIMS[k], a = ans(c);
    el.board.innerHTML = '<p class="sub">' + esc(c.gl) + "</p>"
      + '<div class="pick">'
      +   '<div class="opts" role="group" aria-label="Grades">' + G_ORDER.map(function(g){ return optHTML(c, a, g); }).join("") + "</div>"
      +   panelHTML(c, a)
      + "</div>";
    if(!a.done) Array.prototype.forEach.call(el.board.querySelectorAll("button.opt:not(:disabled)"), function(b){
      b.addEventListener("click", function(){ choose(k, b.dataset.g); });
    });
    return esc(q(c.text));
  }
  function choose(k, g){
    var c = CLAIMS[k];
    var a = st.a[c.n] || (st.a[c.n] = { first:null, out:[], done:null });
    if(a.done || a.out.indexOf(g) >= 0 || !GRADES[g]) return;
    if(!a.first) a.first = g;
    if(g === c.ok) a.done = "right";
    else { a.out.push(g); if(a.out.length >= MAXWRONG) a.done = "shown"; }
    save(st);
    render();
    var fb = el.board.querySelector("#fb"), ev = el.board.querySelector("#ev");
    if(!reduce){ [fb, ev].forEach(function(n){ if(n){ n.classList.remove("in"); void n.offsetWidth; n.classList.add("in"); } }); }
    var p = el.board.querySelector("#panel");
    if(p) say(strip(p.innerHTML.replace(/<\/p>/g, " ").replace(/<\/span>/g, ". ")).replace(/\.\s*\./g, "."));
    var ph = phone(), fo = ph ? { preventScroll:true } : undefined;
    if(a.done) el.next.focus(fo);
    else { var f = el.board.querySelector("button.opt:not(:disabled)"); if(f) f.focus(fo); }
    if(ph && p) (a.done ? el.bar : p).scrollIntoView({ block: a.done ? "end" : "start", behavior: reduce ? "auto" : "smooth" });
  }

  /* ---- the summary ---- */
  function mark(match){
    return '<span class="mk2 ' + (match ? "ok" : "df") + '">' + icon(match ? "check" : "info") + (match ? "Matches" : "Differs") + "</span>";
  }
  function renderSum(){
    function cell(l, v, cls){ return '<td data-l="' + l + '"' + (cls ? ' class="' + cls + '"' : "") + ">" + v + "</td>"; }
    var rows = CLAIMS.map(function(c){
      var a = ans(c), first = a.first || c.ok;
      return "<tr>" + cell("#", c.n, "n") + cell("Form row", c.row, "qr") + cell("Claim", esc(c.text), "cl")
        + cell("Your first pick", esc(GRADES[first].name), "fp")
        + cell("Checked grade", esc(GRADES[c.ok].name), "cg")
        + cell("Result", mark(first === c.ok), "rs") + "</tr>";
    }).join("");
    el.board.innerHTML = '<p class="lead">' + mark(true) + " means your first pick was the checked grade, the grade the files actually support. " + mark(false) + " means it was not.</p>"
      + '<table class="ctab"><thead><tr><th scope="col">#</th><th scope="col">Form row</th><th scope="col">Claim</th>'
      + '<th scope="col">Your first pick</th><th scope="col">Checked grade</th><th scope="col">Result</th></tr></thead><tbody>'
      + rows + "</tbody></table>"
      + '<div class="statement"><p>Proven: 4. Partly proven: 2. Can\'t be proven: 2. <span class="sm">In row 11 you guessed how many claims you could back up with a file. Four came out fully Proven. How close was your guess?</span></p></div>';
    return "Your Eight Grades, Checked";
  }

  /* ---- the two columns ---- */
  function colHTML(head, ic, items, anim){
    return '<div class="col' + (anim ? " in" : "") + '"><span class="chd"><span class="bi">' + icon(ic) + "</span>" + head + "</span><ul>"
      + items.map(function(it){ return "<li>" + it + "</li>"; }).join("") + "</ul></div>";
  }
  function renderCommit(){
    function item(c){
      return '<span class="cn">' + c.n + '</span><span class="lw"><b>' + esc(c.text) + "</b></span>"
        + (c.tag ? '<span class="tag">' + icon(TAGS[c.tag].ic) + TAGS[c.tag].name + "</span>" : "<span></span>");
    }
    el.board.innerHTML = '<p class="lead">Here are the eight claims again, split by their checked grade. Look at the four that are not Proven. There is no single right answer to the question below, so write what you see.</p>'
      + '<div class="cols">'
      + colHTML("Proven", "proven", CLAIMS.slice(0,4).map(item))
      + colHTML("Partly proven or Can't be proven", "partly", CLAIMS.slice(4).map(item))
      + "</div>"
      + '<div class="ask"><label for="txt">What do you think the four that are not Proven have in common?</label>'
      + '<textarea id="txt" maxlength="280" placeholder="Paste your sentence from row 17 of your Scoreboard tab, or write a new one."></textarea></div>';
    var ta = el.board.querySelector("#txt");
    ta.value = st.txt || "";
    ta.addEventListener("input", function(){
      st.txt = ta.value; save(st);
      var ok = hasTxt();
      el.next.disabled = !ok;
      el.hint.textContent = ok ? "" : "Write a sentence to carry on.";
    });
    return "What Do the Four That Failed Have in Common?";
  }

  function renderReveal(){
    function item(it){
      var c = CLAIMS[it.n-1];
      return '<span class="cn">' + it.n + '</span><span class="lw"><b>' + esc(it.l) + "</b><span>" + esc(it.s) + "</span></span>"
        + (c.tag ? '<span class="tag">' + icon(TAGS[c.tag].ic) + TAGS[c.tag].name + "</span>" : "<span></span>");
    }
    el.board.innerHTML = '<div class="cols">'
      + colHTML(esc(REVEAL.left.h), REVEAL.left.ic, REVEAL.left.items.map(item), !reduce)
      + colHTML(esc(REVEAL.right.h), REVEAL.right.ic, REVEAL.right.items.map(item), !reduce)
      + "</div>"
      + '<p class="sub">Unproven here means Partly proven or Can\'t be proven.</p>'
      + '<div class="statement"><p>' + esc(PATTERN) + "</p></div>"
      + '<div class="yours"><div class="yh"><span class="yl">' + icon("pencil") + "What you wrote</span>"
      +   '<span class="yq">There is no single right answer. Read the split next to what you wrote. Did you see the same thing?</span></div>'
      +   "<p>" + esc(st.txt.trim().replace(/\s+/g, " ")) + "</p></div>";
    return "What the Failures Have in Common";
  }

  /* ---------------- navigation ---------------- */
  function focusTop(){
    var ph = phone();
    el.frame.focus(ph ? { preventScroll:true } : undefined);
    if(ph) window.scrollTo(0, 0);
  }
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; var t = render(); focusTop();
    say(el.prog.textContent + ". " + strip(t));
  }
  function startOver(){
    st = fresh(); save(st); i = 0; render(); focusTop();
    say("Your answers are cleared. Question 1 of " + NQ + ".");
  }
  el.back.addEventListener("click", function(){
    if(confirming){ confirming = false; header(); el.next.focus(); say("Your answers are kept."); return; }
    go(-1);
  });
  el.next.addEventListener("click", function(){
    if(i !== S.length-1){ go(1); return; }
    if(!confirming){ confirming = true; header(); el.next.focus(); say(el.hint.textContent); return; }
    startOver();
  });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }
  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled && i < S.length-1) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); if(!confirming) go(-1); }
  });

  /* A cursor resting where new content lands must not tint an option. */
  var lastPt = null;
  document.addEventListener("pointermove", function(e){
    var p = e.clientX + "," + e.clientY;
    if(lastPt !== null && p !== lastPt) document.documentElement.classList.remove("fresh");
    lastPt = p;
  }, true);

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    if(ownsKeys(e.target)){ tx = null; return; }
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled && i < S.length-1) go(1); } else if(!confirming) go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", function(){ fit(); fitTight(); });

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; i = n; render(); return true; },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    state:function(){ return { i:i, a:JSON.parse(JSON.stringify(st.a)), txt:st.txt, tight:el.frame.classList.contains("tight") }; }
  };
})();
</script>
</body>
</html>
