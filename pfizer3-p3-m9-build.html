<template id="s1">
  <p class="p">This challenge is optional. It's for you if you want to write the code yourself, not paste it from the steps.</p>
  <p class="p"><b>Your goal:</b> "Starting from a blank cell, I can find the table on page 3 of the supplier file and print each of its rows, reading one cell at a time."</p>
  <ol class="list">
    <li>Open your own notebook from the earlier challenges, the one you started in the "Write the Setup Code" challenge. If Colab disconnected, run your setup cells again.</li>
    <li>Add a blank code cell at the bottom with <b>+ Code</b>.</li>
    <li>Write code that opens the supplier file, finds the table on page 3 and goes through it row by row, reading the text inside each cell's box.</li>
    <li>Print each row as a list of its cells.</li>
  </ol>
  <p class="p">Skipped those challenges? Open a new notebook with <b>File → New notebook in Drive</b>. Set it up first: run <code>!pip install pymupdf</code>, then upload <code>sample-sdf-document.pdf</code> with <code>files.upload()</code>.</p>
  <p class="p">Don't copy from the steps. You already ran them, so you know what the output should look like.</p>

<template id="s2">
  <p class="p">Open this hint if you don't know where to start. It names the tools you need.</p>
  {{REVEAL:h1:Show Hint 1}}
  <ul class="list">
    <li><code>page.find_tables()</code> looks for tables on one page. The tables it finds are in <code>.tables</code>, a list, so <code>[0]</code> gives you the first one.</li>
    <li>A table's <code>.rows</code> holds its rows from top to bottom. Each row's <code>.cells</code> holds the box of each cell, from left to right.</li>
    <li><code>page.get_text("text", clip=box)</code> reads only the text inside one box. <code>.strip()</code> removes the line break at the end.</li>
    <li>Python counts pages from 0, so page 3 is <code>doc[2]</code>.</li>
    <li>A list holds many items in order. <code>[]</code> makes an empty list, and <code>append()</code> adds one item to its end.</li>
  </ul>
  {{/REVEAL}}
</template>

<template id="s3">
  <p class="p">Open this hint if you know which tools to use, but not how to write them.</p>
  {{REVEAL:h2:Show Hint 2}}
  <p class="p">Both pages below come from PyMuPDF's official guide, written by the people who made it.</p>
  <div class="links stack">
    {{OPEN:FIND:PyMuPDF: Page.find_tables}}
    {{OPEN:ROWS:PyMuPDF: Table.rows}}
  </div>
  <p class="p">The first page explains <code>find_tables()</code> and what it gives back. The second shows what a table's rows hold: each row has a <code>cells</code> list with one box for each cell.</p>
  <p class="p">The guide shows what the table holds. You need to loop through its rows and cells and read the text inside each cell's box.</p>
  {{/REVEAL}}
</template>

<template id="s4">
  <p class="p">Open this hint only if the first two weren't enough. It shows the code with blanks, and each blank is one word or one number.</p>

<template id="s5">
  <p class="p">Try the challenge first. Then open the solution to compare it with what you wrote.</p>
  {{REVEAL:sol:Show the Solution}}
  {{CODE:python:Python:import pymupdf
doc = pymupdf.open("sample-sdf-document.pdf")
page = doc[2]
tables = page.find_tables()
table = tables.tables[0]

for row in table.rows:
    row_data = []
    for cell_bbox in row.cells:
        cell_text = page.get_text("text", clip=cell_bbox).strip()
        row_data.append(cell_text)
    print(row_data)}}
  {{/REVEAL}}
</template>

<template id="s7">

  <p class="p">There's no error, but it's the wrong table. Page 1 has a small product table, and <code>find_tables()</code> finds it, so <code>table</code> is that table. Your loop then prints its 3 rows:</p>
  {{CODE:plain:Output:['Description', 'Part Number', 'Operating Temperature']

<template id="s8">
  <p class="p">You might work out each cell's number from its row and column:</p>
  {{CODE:python:Python:for row_num in range(table.row_count):
    row_data = []
    for col_num in range(table.col_count):
        cell_idx = row_num * table.col_count + col_num
        cell_bbox = table.cells[cell_idx]
        row_data.append(page.get_text("text", clip=cell_bbox).strip())
    print(row_data)}}
  {{CODE:plain:Output:['Description', 'Autoclave - Pump tubing', 'Gamma Irradiation - Inlets']
['Flow Rate Test', 'Pressure Integrity', 'Visual Inspection']
...}}
  <p class="p">The columns are scrambled. <code>table.cells</code> lists the cells down each column in turn, not across each row, so this code reads 3 descriptions as one "row". <code>table.rows</code> and <code>row.cells</code> keep each row together.</p>
</template>

    { group: "Why", label: "WHY &middot; PART 2 OF 2", title: 'What Doesn\'t Work: Cell <span class="hl">Numbers</span>', plain: "What Doesn't Work: Cell Numbers", tpl: "s8" },
    { group: "Check", label: "CHECK", title: 'Check Your <span class="hl">Result</span>', plain: "Check Your Result", tpl: "s9" }
  ];
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the challenge. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  /* The fixed stage: pick the wide or narrow design size, then scale the whole deck to fit the window and centre it. */
  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var W = narrow ? 420 : 760, H = narrow ? 940 : 760;
    var k = Math.min(window.innerWidth / W, window.innerHeight / H);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", g.name + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + g.name + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + body(s.tpl) + '</div>';
  }

  function wire() {
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });
    Array.prototype.forEach.call(card.querySelectorAll("[data-reveal]"), function (b) {
      b.addEventListener("click", function () {
        var key = b.getAttribute("data-reveal"), box = $("rv-" + key);
        shown[key] = true;
        b.setAttribute("aria-expanded", "true"); b.hidden = true; box.hidden = false;
        var first = box.querySelector("a,button,pre"); if (first) first.focus({ preventScroll: true });
      });
    });
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    wire();

    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() { donemsg.textContent = DONE_MSG; }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  /* Left and Right arrow keys move between slides */
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", scaleStage);
  scaleStage();
  render(false);
})();
</script>
</body>
</html>
