<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Screen | HP Tech Ventures</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #EFE9E9; }
  body { font-family: "Inter", -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }

  #outer { width: 100%; overflow: hidden; }
  #deck-wrapper {
    width: 960px;
    height: 540px;
    flex-shrink: 0;
    transform-origin: top left;
  }

  #stage {
    width: 960px;
    height: 540px;
    background: #FDF8F8;
    padding: 24px 44px 20px 44px;
    color: #484646;
    overflow: hidden;
  }

  /* ---------- 1. header strip ---------- */
  .hdr {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid #E4DFDF;
    margin-bottom: 26px;
  }
  .hdr-l {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: #001D69;
    line-height: 15px;
  }
  .hdr-r {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 1.9px;
    text-transform: uppercase;
    color: #6B6868;
    line-height: 15px;
  }

  /* ---------- 2. funnel strip ---------- */
  .funnel {
    display: flex;
    align-items: stretch;
    gap: 14px;
    margin-bottom: 30px;
  }
  .funnel-cap {
    flex: 0 0 98px;
    border-right: 1px solid #E4DFDF;
    padding-right: 14px;
    display: flex;
    align-items: center;
  }
  .funnel-cap span {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    color: #6B6868;
    line-height: 13px;
  }
  .chips { flex: 1; display: flex; gap: 10px; min-width: 0; }
  .chip {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border-radius: 5px;
    background: #fff;
    border: 1px solid #E4DFDF;
  }
  .chip.on {
    background: #DCE1FF;
    border: 1.5px solid #001D69;
    padding: 8.5px 11.5px;
  }
  .chip-top { display: flex; align-items: center; gap: 7px; }
  .chip-name {
    font-size: 13px;
    font-weight: 600;
    color: #6B6868;
    line-height: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip.on .chip-name { font-weight: 800; color: #1C1B1B; }
  .chip-sub {
    margin-top: 2px;
    font-size: 11px;
    font-weight: 500;
    color: #6B6868;
    line-height: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip.on .chip-sub { color: #001D69; font-weight: 700; }
  .ic { flex: 0 0 auto; display: block; }

  /* ---------- 3 + 4. two-column body ---------- */
  .main { display: flex; gap: 28px; align-items: flex-start; margin-top: 18px; }
  .col-l { flex: 0 0 360px; width: 360px; }
  .col-r { flex: 1; min-width: 0; }

  .co-name {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.7px;
    color: #1C1B1B;
    line-height: 34px;
  }
  .co-url {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: #001D69;
    line-height: 16px;
  }
  .co-desc {
    margin-top: 12px;
    font-size: 12.5px;
    line-height: 18px;
    color: #484646;
    max-width: 348px;
  }
  .facts {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid #E4DFDF;
    display: flex;
    gap: 14px;
  }
  .fact { min-width: 0; }
  .fact.f1 { flex: 118 1 0; }
  .fact.f2 { flex: 128 1 0; }
  .fact.f3 { flex: 86 1 0; }
  .fact-k {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #6B6868;
    line-height: 12px;
  }
  .fact-v {
    margin-top: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: #1C1B1B;
    line-height: 17px;
  }

  /* verdict table */
  .t-head {
    display: flex;
    padding-bottom: 8px;
    border-bottom: 1px solid #E4DFDF;
  }
  .t-head div {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #6B6868;
    line-height: 12px;
  }
  .t-row {
    display: flex;
    align-items: flex-start;
    padding: 15px 0;
    border-bottom: 1px solid #E4DFDF;
  }
  .t-row:last-child { border-bottom: 0; }
  .c1 { flex: 0 0 182px; padding-right: 12px; }
  .c2 { flex: 1; min-width: 0; padding-right: 10px; }
  .c3 { flex: 0 0 72px; text-align: right; }
  .r-name {
    font-size: 13px;
    font-weight: 700;
    color: #1C1B1B;
    line-height: 16px;
  }
  .r-test {
    margin-top: 2px;
    font-size: 10px;
    line-height: 12.5px;
    color: #6B6868;
  }
  .r-found {
    font-size: 12px;
    line-height: 16px;
    color: #484646;
    padding-top: 1px;
  }
  .r-found b { font-weight: 700; color: #1C1B1B; }
  .verdict {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.9px;
    text-transform: uppercase;
    line-height: 12px;
    margin-top: 2px;
  }
  .verdict.pass { background: #DCE1FF; color: #001D69; padding: 3px 8px 3px 6px; }
  .verdict.fail { background: #EFE9E9; color: #1C1B1B; border: 1px solid #E4DFDF; padding: 2px 7px 2px 5px; }

  .summary {
    margin-top: 22px;
    padding: 9px 12px;
    border: 1px solid #E4DFDF;
    border-left: 3px solid #1C1B1B;
    border-radius: 3px;
    background: #fff;
    font-size: 11.5px;
    line-height: 15px;
    color: #484646;
  }
  .summary b { font-weight: 700; color: #1C1B1B; }

</style>
</head>
<body>

<div id="outer">
  <div id="deck-wrapper">
    <div id="stage">

      <!-- 1. header -->
      <div class="hdr">
        <div class="hdr-l" id="hdrLeft"></div>
        <div class="hdr-r" id="hdrRight"></div>
      </div>

      <!-- 2. funnel -->
      <div class="funnel">
        <div class="funnel-cap"><span id="funnelCap"></span></div>
        <div class="chips" id="chips"></div>
      </div>

      <!-- 3 + 4. selected company and verdict table -->
      <div class="main">
        <div class="col-l">
          <div class="co-name" id="coName"></div>
          <div class="co-url" id="coUrl"></div>
          <div class="co-desc" id="coDesc"></div>
          <div class="facts" id="facts"></div>
        </div>

        <div class="col-r">
          <div class="t-head">
            <div class="c1" id="ruleColLabel"></div>
            <div class="c2">What the sheet says</div>
            <div class="c3">Result</div>
          </div>
          <div id="rows"></div>
          <div class="summary" id="summary"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
/* ==================================================================
   All swappable content lives in this one object.
   SHORTLIST rows mirror the nine Crunchbase export columns exactly,
   so the card can later be populated straight from the sheet.
================================================================== */
var DATA = {

  docLabel:   "Deal Screen",
  firm:       "HP Tech Ventures",
  ruleColumn: "Screening rule",

  columns: [
    "Organization Name",
    "Company Website URL",
    "Amount Raised",
    "Description",
    "Last Funding Date",
    "Last Funding Type",
    "Number of Employees",
    "Industries",
    "Headquarters Location"
  ],

  shortlist: [
    {
      "Organization Name":     "Natrx",
      "Company Website URL":   "natrx.io",
      "Amount Raised":         "3.8M",
      "Description":           "Natrx delivers advanced technologies for nature-based resilience and restoration.",
      "Last Funding Date":     "Oct 11, 2023",
      "Last Funding Type":     "Seed",
      "Number of Employees":   "11-50",
      "Industries":            "Artificial Intelligence (AI), Infrastructure, Manufacturing",
      "Headquarters Location": "Raleigh, North Carolina, United States",
      advanced: false
    },
    {
      "Organization Name":     "My3dMeta (Formerly My3dselfie)",
      "Company Website URL":   "www.my3dselfie.com",
      "Amount Raised":         "2.2M",
      "Description":           "My3DSelfie leverages machine learning and 3D technology to create close to 90 percent accurate 3D prints.",
      "Last Funding Date":     "Nov 10, 2022",
      "Last Funding Type":     "Seed",
      "Number of Employees":   "11-50",
      "Industries":            "3D Printing, 3D Technology, Machine Learning",
      "Headquarters Location": "Guwahati, Assam, India",
      advanced: false
    },
    {
      "Organization Name":     "Vitro3D",
      "Company Website URL":   "www.vitro3d.com/",
      "Amount Raised":         "5.2M",
      "Description":           "Vitro3D develops volumetric 3D printing solutions producing dental aligners and scaffolds for 3D cell growth.",
      "Last Funding Date":     "May 8, 2024",
      "Last Funding Type":     "Seed",
      "Number of Employees":   "1-10",
      "Industries":            "3D Printing, 3D Technology, Manufacturing",
      "Headquarters Location": "Boulder, Colorado, United States",
      advanced: true
    }
  ],

  /* Each rule reads its evidence out of the sheet row it is testing. */
  tier1: [
    {
      rule:  "Where",
      test:  "US-based, or global doing business with the US",
      field: "Headquarters Location",
      evidence: function (row) { return emph(row["Headquarters Location"], 2); },
      pass:  true
    },
    {
      rule:  "Size",
      test:  "Raised $1M to $40M, valued under about $200M",
      field: "Amount Raised",
      evidence: function (row) {
        return "<b>" + money(row["Amount Raised"]) + "</b> raised, " +
               row["Last Funding Type"] + " round";
      },
      pass:  true
    },
    {
      rule:  "Fit",
      test:  "Builds technology in one of the fund's focus areas",
      field: "Industries",
      evidence: function (row) { return row["Industries"]; },
      pass:  true
    }
  ],
};

/* ---------------- small formatters ---------------------------------- */
function money(v) { return "$" + v; }                       /* "5.2M" -> "$5.2M" */
function tidyUrl(v) { return v.replace(/\/+$/, ""); }       /* drop trailing slash */
function shortName(v) { return v.replace(/\s*\(.*\)\s*$/, ""); }
function monthYear(v) {                                     /* "May 8, 2024" -> "May 2024" */
  var m = v.match(/^([A-Za-z]+)\s+\d+,\s*(\d{4})$/);
  return m ? m[1] + " " + m[2] : v;
}
function emph(v, n) {                                       /* bold first n comma parts */
  var p = v.split(", ");
  return "<b>" + p.slice(0, n).join(", ") + "</b>" +
         (p.length > n ? ", " + p.slice(n).join(", ") : "");
}
function list(a) {
  if (a.length === 1) return a[0];
  if (a.length === 2) return a[0] + " and " + a[1];
  return a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
}

/* ---------------- inline SVG icons ---------------------------------- */
function checkIcon(color, size, stroke) {
  return '<svg class="ic" width="' + size + '" height="' + size + '" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
         '<circle cx="8" cy="8" r="7" stroke="' + color + '" stroke-width="' + stroke + '"/>' +
         '<path d="M4.9 8.2 L7 10.3 L11.1 5.9" stroke="' + color + '" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>' +
         '</svg>';
}
function crossIcon(color, size, stroke) {
  return '<svg class="ic" width="' + size + '" height="' + size + '" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
         '<circle cx="8" cy="8" r="7" stroke="' + color + '" stroke-width="' + stroke + '"/>' +
         '<path d="M5.7 5.7 L10.3 10.3 M10.3 5.7 L5.7 10.3" stroke="' + color + '" stroke-width="1.6" stroke-linecap="round"/>' +
         '</svg>';
}

/* ---------------- render -------------------------------------------- */
(function render() {
  var d   = DATA;
  var pick = d.shortlist.filter(function (r) { return r.advanced; })[0];
  var out  = d.shortlist.filter(function (r) { return !r.advanced; });

  document.getElementById('hdrLeft').textContent      = d.docLabel;
  document.getElementById('hdrRight').textContent     = d.firm;
  document.getElementById('ruleColLabel').textContent = d.ruleColumn;
  document.getElementById('funnelCap').textContent    =
    'Screened ' + d.shortlist.length + ', advanced ' + (d.shortlist.length - out.length);

  /* --- funnel chips: passed-on first, advanced last --- */
  var chips = out.map(function (c) {
    return '<div class="chip">' +
             '<div class="chip-top">' + crossIcon('#6B6868', 13, 1.2) +
               '<div class="chip-name">' + shortName(c["Organization Name"]) + '</div>' +
             '</div>' +
             '<div class="chip-sub">' + money(c["Amount Raised"]) + ' raised, passed on</div>' +
           '</div>';
  }).join('');
  chips += '<div class="chip on">' +
             '<div class="chip-top">' + checkIcon('#001D69', 14, 1.4) +
               '<div class="chip-name">' + shortName(pick["Organization Name"]) + '</div>' +
             '</div>' +
             '<div class="chip-sub">' + money(pick["Amount Raised"]) + ' raised, advanced</div>' +
           '</div>';
  document.getElementById('chips').innerHTML = chips;

  /* --- selected company --- */
  document.getElementById('coName').textContent = shortName(pick["Organization Name"]);
  document.getElementById('coUrl').textContent  = tidyUrl(pick["Company Website URL"]);
  document.getElementById('coDesc').textContent = pick["Description"];

  var facts = [
    { k: 'Round / raised', v: pick["Last Funding Type"] + ', ' + money(pick["Amount Raised"]) +
                              ', ' + monthYear(pick["Last Funding Date"]) },
    { k: 'Headquarters',   v: pick["Headquarters Location"] },
    { k: 'Team size',      v: pick["Number of Employees"] + ' employees' }
  ];
  document.getElementById('facts').innerHTML = facts.map(function (f, i) {
    return '<div class="fact f' + (i + 1) + '"><div class="fact-k">' + f.k + '</div>' +
           '<div class="fact-v">' + f.v + '</div></div>';
  }).join('');

  /* --- Tier 1 verdict rows --- */
  document.getElementById('rows').innerHTML = d.tier1.map(function (r) {
    var badge = r.pass
      ? '<span class="verdict pass">' + checkIcon('#001D69', 11, 1.4) + 'Pass</span>'
      : '<span class="verdict fail">' + crossIcon('#1C1B1B', 11, 1.4) + 'Fail</span>';
    return '<div class="t-row">' +
             '<div class="c1"><div class="r-name">' + r.rule + '</div>' +
               '<div class="r-test">' + r.test + '</div></div>' +
             '<div class="c2"><div class="r-found">' + r.evidence(pick) + '</div></div>' +
             '<div class="c3">' + badge + '</div>' +
           '</div>';
  }).join('');

  /* --- summary line, generated from the verdicts above --- */
  var failed = d.tier1.filter(function (r) { return !r.pass; }).map(function (r) { return r.rule; });
  var passed = d.tier1.filter(function (r) { return r.pass;  }).map(function (r) { return r.rule; });
  var name   = shortName(pick["Organization Name"]);
  var text;
  if (failed.length === 0) {
    text = '<b>' + name + ' clears all ' + d.tier1.length + ' screening rules.</b> ' +
           'Advancing to due diligence.';
  } else {
    text = '<b>' + name + ' does not clear screening.</b> It passes ' + list(passed) +
           ', and fails ' + list(failed) + ', so on this thesis it stops here.';
  }
  document.getElementById('summary').innerHTML = text;

})();

/* ---------------- scale to container -------------------------------- */
(function () {
  var outer = document.getElementById('outer');
  var wrap  = document.getElementById('deck-wrapper');
  function fit() {
    var cw = outer.clientWidth;
    var scale = Math.min(1, cw / 960);
    wrap.style.transform = 'translateX(' + ((cw - 960 * scale) / 2) + 'px) scale(' + scale + ')';
    outer.style.height = (540 * scale) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
