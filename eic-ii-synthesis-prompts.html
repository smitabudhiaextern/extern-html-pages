<!-- EIC-II P4 Step 3 : Copy-ready synthesis prompts, New vs Continuing chat (interactive, PPT-size 16:9) -->
<div class="cpy-root">
  <div class="cpy-stage">
    <div class="cpy-head">
      <div class="cpy-kicker">Investment View</div>
      <h2 class="cpy-title">Copy your synthesis prompts</h2>
      <p class="cpy-sub">Draft in order: Risks, Diligence, then Synergy. Pick your chat type, upload the PDFs listed, copy the prompt.</p>
    </div>

    <div class="cpy-controls">
      <div class="cpy-tabs" role="tablist">
        <button class="cpy-tab is-active" data-tab="risks">Risks</button>
        <button class="cpy-tab" data-tab="dili">Diligence</button>
        <button class="cpy-tab" data-tab="synergy">Synergy</button>
      </div>
      <div class="cpy-modes" role="tablist">
        <button class="cpy-mode is-active" data-mode="new">New chat</button>
        <button class="cpy-mode" data-mode="cont">Continuing chat</button>
      </div>
    </div>

    <div class="cpy-body">
      <div class="cpy-upload">
        <span class="cpy-uplabel">Upload first:</span>
        <span class="cpy-uptext" id="cpy-uptext"></span>
      </div>
      <div class="cpy-box"><pre class="cpy-pre" id="cpy-pre"></pre></div>
      <button class="cpy-btn" id="cpy-btn" type="button">Copy prompt</button>
    </div>
  </div>
</div>

<script id="cpy-data" type="application/json">
{
  "risks": {
    "new": {
      "upload": "Your Company Research Doc (PDF) &nbsp;·&nbsp; the Phaidra worked sample (PDF)",
      "prompt": "You are a VC analyst writing the Risk Areas section of an investment memo for [company name]. I've attached the Phaidra worked sample; see its Risk Areas section for the shape and tone I want. Start from my attached Company Research Doc, then do a quick internet check for anything public that could be a real risk for this company or its market (a competitor move, an industry downturn, a regulatory change). Label every risk clearly as either \"(from research)\" or \"(from a quick web check)\", never blend the two. Group the risks into these five categories: Market, Execution, Technical, Team, and Regulatory. Under each category, list the specific risks, one per line, each in a single clear sentence. Name the actual risk, not a general worry. Any performance figure the company promotes stays labeled as the company's own claim, not a settled fact. If a category has no real risk, leave it out rather than inventing one."
    },
    "cont": {
      "upload": "Nothing new. Your Company Research Doc and the Phaidra sample are already in this chat.",
      "prompt": "Same company. Now write the Risk Areas section of the investment memo, in the shape of the Phaidra worked sample already in this chat. Working from my Company Research Doc above, do a quick internet check for anything public that could be a real risk for this company or its market (a competitor move, an industry downturn, a regulatory change). Label every risk clearly as either \"(from research)\" or \"(from a quick web check)\", never blend the two. Group the risks into these five categories: Market, Execution, Technical, Team, and Regulatory. Under each category, list the specific risks, one per line, each in a single clear sentence. Name the actual risk, not a general worry. Any performance figure the company promotes stays labeled as the company's own claim, not a settled fact. If a category has no real risk, leave it out rather than inventing one."
    }
  },
  "dili": {
    "new": {
      "upload": "Your Company Research Doc (PDF) &nbsp;·&nbsp; the Phaidra worked sample (PDF)",
      "prompt": "You are a VC analyst preparing diligence questions for [company name]. I've attached the Phaidra worked sample; see its Areas for Further Diligence section for the shape and tone I want. Work only from my attached Company Research Doc. List what it could NOT confirm, phrased as questions to verify. Split it into two parts: 1. Areas to diligence further: the open topics, grouped (for example revenue model, unit economics, IP and defensibility, competitive response). Under each, the specific things we could not confirm, written as questions. 2. Specific questions to ask the team when we meet them: the direct questions you would put to the founders, grouped by theme. Frame every gap as a question, never as a weakness or a judgment. If my research already answers something, leave it out."
    },
    "cont": {
      "upload": "Nothing new. Your Company Research Doc and the Phaidra sample are already in this chat.",
      "prompt": "Same company. Now prepare the Areas for Further Diligence section, in the shape of the Phaidra worked sample already in this chat. Working only from my Company Research Doc above, list what it could NOT confirm, phrased as questions to verify. Split it into two parts: 1. Areas to diligence further: the open topics, grouped (for example revenue model, unit economics, IP and defensibility, competitive response). Under each, the specific things we could not confirm, written as questions. 2. Specific questions to ask the team when we meet them: the direct questions you would put to the founders, grouped by theme. Frame every gap as a question, never as a weakness or a judgment. If my research already answers something, leave it out."
    }
  },
  "synergy": {
    "new": {
      "upload": "Heritage's investment thesis (PDF, from Project 1) &nbsp;·&nbsp; your Company Research Doc &nbsp;·&nbsp; your Risk report &nbsp;·&nbsp; your Areas for Further Diligence report",
      "prompt": "You are an investor at EIC Heritage. I've attached Heritage's investment thesis, my Company Research Doc, and my risk and diligence reports on [company name]. Work only from what I've attached. Evaluate how well this company fits Heritage's thesis. Organize the assessment under these six categories, one short paragraph each: (1) Thesis Synergy, does what they do and the problem they solve map to Heritage's focus; (2) Market Synergy, does the market they're in match where Heritage wants exposure; (3) Technology Synergy, is their technical edge the kind Heritage backs; (4) Business-Model Synergy, does the model match how Heritage likes companies to scale; (5) Team Synergy, do the founders have credibility on this exact problem; (6) Stage & Signal Synergy, is the stage right and are there strong external signals. Not every category will argue strongly, and that's fine: name the ones that come up thin rather than forcing them. Where a figure is the company's own claim, keep it labeled as a claim."
    },
    "cont": {
      "upload": "Heritage's investment thesis (PDF, from Project 1). Your research, risk report, and diligence report are already in this chat.",
      "prompt": "Same company. You are now assessing fit for EIC Heritage. Using my Company Research Doc, risk report, and diligence report already in this chat, plus the attached Heritage investment thesis, evaluate how well this company fits Heritage's thesis. Organize the assessment under these six categories, one short paragraph each: (1) Thesis Synergy, does what they do and the problem they solve map to Heritage's focus; (2) Market Synergy, does the market they're in match where Heritage wants exposure; (3) Technology Synergy, is their technical edge the kind Heritage backs; (4) Business-Model Synergy, does the model match how Heritage likes companies to scale; (5) Team Synergy, do the founders have credibility on this exact problem; (6) Stage & Signal Synergy, is the stage right and are there strong external signals. Not every category will argue strongly, and that's fine: name the ones that come up thin rather than forcing them. Where a figure is the company's own claim, keep it labeled as a claim."
    }
  }
}
</script>

<script>
  (function(){
    var root = document.querySelector('.cpy-root');
    if(!root) return;
    var data = JSON.parse(document.getElementById('cpy-data').textContent);
    var tabs = root.querySelectorAll('.cpy-tab');
    var modes = root.querySelectorAll('.cpy-mode');
    var upEl = document.getElementById('cpy-uptext');
    var preEl = document.getElementById('cpy-pre');
    var btn = document.getElementById('cpy-btn');
    var curTab = 'risks', curMode = 'new';

    function render(){
      var d = data[curTab][curMode];
      upEl.innerHTML = d.upload;
      preEl.textContent = d.prompt;
      btn.textContent = 'Copy prompt';
      btn.classList.remove('is-copied');
    }
    tabs.forEach(function(t){
      t.addEventListener('click', function(){
        curTab = t.getAttribute('data-tab');
        tabs.forEach(function(x){ x.classList.toggle('is-active', x === t); });
        render();
      });
    });
    modes.forEach(function(m){
      m.addEventListener('click', function(){
        curMode = m.getAttribute('data-mode');
        modes.forEach(function(x){ x.classList.toggle('is-active', x === m); });
        render();
      });
    });

    function showCopied(){
      btn.textContent = 'Copied!';
      btn.classList.add('is-copied');
      setTimeout(function(){ btn.textContent = 'Copy prompt'; btn.classList.remove('is-copied'); }, 1500);
    }
    function fallback(text){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta);
    }
    btn.addEventListener('click', function(){
      var text = preEl.textContent;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(showCopied, function(){ fallback(text); showCopied(); });
      } else { fallback(text); showCopied(); }
    });

    render();
  })();
</script>
