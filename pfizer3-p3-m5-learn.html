<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyMuPDF Words and Boxes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Card player copied from pfizer3-p3-m2-learn.html:
   a rail with "Card X of N" on top, one card at a time, Back and Next below.
   Code blocks and Copy buttons copied from the P3 module 2 and 3 decks (code has a Copy button, output has none).
   P3 module 5 Learn cards: "Learn How to Extract Text and Bounding Boxes with PyMuPDF" (4 cards, rebuilt 10 November 2026).
   1 See What PyMuPDF Sees (unchanged). 2 Text Alone vs. Words with Boxes: a two-button switch shows the SME's get_text("text")
   part or his get_text("words") part, each with the same page 1 picture shown that way, then his searchable-PDF note.
   3 Read One Row: the real Cytiva row as clickable parts; each part marks the zoomed page and lights its row in his table,
   which holds his table meanings and his worked example together. 4 Do It for Every Page: his page count and loop,
   with 3 page pictures that light up in turn.
   Text: the SME's (Chaitanya's) module 5 page, verbatim, on page 1 of the supplier file and the word "Cytiva".
   Fixed stage: laid out once on a 760 x 1120 design stage (set the Notion embed height to 1045 px at the 708 px wide
   Notion column), then scaled as one piece to fit the embed frame and centred. Nothing scrolls, and Back and Next never move.
   Every output and every box is the real output of the code, run on sample-sdf-document.pdf with PyMuPDF 1.26.5.
   Outputs marked "trimmed" keep only some lines.
   Pictures: pfizer3-p3-m5-page1-words.png (cards 1 and 2), pfizer3-p3-m5-row-zoom.png (card 3, page 1 clipped to
   x 430 to 590, y 80 to 140), pfizer3-p3-m5-loop-page1/2/3.png (card 4). All rendered with PyMuPDF from the supplier file. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600); --icon:var(--extern-black); --connector:var(--extern-black);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --space-1:4px; --space-2:8px; --space-3:14px; --space-4:18px; --space-5:26px; --space-6:40px; --space-7:56px;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage-w:760px; --stage-h:1120px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
[hidden]{display:none !important}

/* The design stage. JavaScript sets the scale and position; until it runs, the stage sits at full size. */
.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}
.pg-label{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-muted);white-space:nowrap}
.pg-label::after{content:attr(data-text);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:600}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:20px 28px;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.inner{display:flex;flex-direction:column;gap:12px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:2px}
.hl{color:var(--highlight)}
.why{margin:-6px 0 0;font-size:17px;line-height:1.45;font-weight:600;color:var(--ink)}
.p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty}
.p b{font-weight:600;color:var(--ink)}
.p code,.tbl code,.bul code,.note code,.sw code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink);white-space:nowrap}
.hint{margin:0;font-size:14px;line-height:1.4;font-weight:600;color:var(--step-label)}

/* Bullets */
.bul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.bul li{font-size:16px;line-height:1.55;color:var(--ink-muted)}
.bul b{font-weight:600;color:var(--ink)}
.bul li > .cols{margin-top:8px}

/* Two columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-3);align-items:start}
.cols > *{min-width:0}

/* Table */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-icon)}
.tbl table{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.45}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:7px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--card-text);transition:background-color .2s ease}
.tbl tr:last-child td{border-bottom:0}
.tbl td.w,.tbl td.n{font-family:var(--font-mono);font-size:13.5px;color:var(--ink);white-space:nowrap}
.tbl td b{font-weight:600;color:var(--ink)}
.tbl tr.grp td{background:var(--surface-card);font-size:13px;line-height:16px;font-weight:600;color:var(--step-label);padding:6px 12px}
.tbl tr.on td{background:var(--surface-card)}
.tbl tr.on td:first-child{box-shadow:inset 4px 0 0 var(--highlight)}
.fmt{margin:0;font-family:var(--font-mono);font-size:14px;line-height:1.5;color:var(--ink);background:var(--gray-50);border-radius:var(--radius-xs);padding:7px 12px}

/* Code block with a Copy button; output blocks have no Copy button */
.run{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-icon)}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:4px 8px 4px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:7px 14px;font-family:var(--font-mono);font-size:13px;line-height:1.45;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit;white-space:inherit;background:none;padding:0;border-radius:0}
.run.out{border-color:var(--blue-200)}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;line-height:1.42}
/* Each output line is its own block: a long row that wraps is indented under its first line, so rows stay easy to tell apart */
.run.out pre .ln{display:block;padding-left:2ch;text-indent:-2ch}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:3px 10px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}

/* Card 1: the page picture with PyMuPDF's word boxes drawn over it (an SVG in PDF points, scaled to the picture) */
.see-bar{display:flex;align-items:center;gap:var(--space-4)}
.see-bar .p{flex:1 1 auto}
.see-btn{flex:none;min-width:186px}
.see{position:relative;margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);line-height:0}
.see img{display:block;width:100%;height:auto}
.see-boxes{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .2s ease}
.see-boxes.on{opacity:1}
.see-boxes rect{fill:none;stroke:var(--highlight);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.see-boxes rect.first{fill:var(--highlight);fill-opacity:.15;stroke-width:2.5px}
.see-out{display:flex;flex-direction:column;gap:8px}

/* Card 2: the two-button switch, and the same picture clipped to the top of page 1 */
.sw-bar{display:flex;align-items:center;gap:var(--space-4)}
.sw{display:inline-flex;flex:none;border:1.5px solid var(--ink);border-radius:var(--radius-xs);overflow:hidden}
.sw button{border:0;background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;font-family:var(--font-mono);font-size:14px;line-height:1.2;font-weight:600;white-space:nowrap}
.sw button + button{border-left:1.5px solid var(--ink)}
.sw button[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.pane{display:flex;flex-direction:column;gap:10px}
.clip{position:relative;margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);line-height:0;aspect-ratio:564 / 124}
.clip img{position:absolute;top:0;left:0;display:block;width:100%;height:auto;transition:opacity .2s ease}
.clip svg{position:absolute;inset:0;width:100%;height:100%}
.clip svg rect{fill:none;stroke:var(--highlight);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.clip.as-text img{opacity:.12}
.clip .txt{position:absolute;top:5px;bottom:0;left:10px;margin:0;padding:3px 10px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:var(--radius-xs) var(--radius-xs) 0 0;font-family:var(--font-mono);font-size:12px;line-height:14.5px;color:var(--ink);white-space:pre}
.note{border:1.5px solid var(--ink);border-radius:var(--radius-sm);padding:8px 14px}
.note .num{display:block;margin-bottom:3px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.note p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink-muted)}
.note p + p{margin-top:3px}
.note b{font-weight:600;color:var(--ink)}

/* Card 3: the row as clickable parts, and the zoomed page */
.row-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--space-4);align-items:center}
.row{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:8px;font-family:var(--font-mono);font-size:15px;color:var(--ink)}
.row .pun{padding:7px 1px 0;line-height:1.3}
.part{display:inline-flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer}
.part .v{display:block;border:1.5px solid var(--ink);border-radius:var(--radius-xs);padding:5px 7px;font-family:var(--font-mono);font-size:15px;line-height:1.3;background:var(--surface);white-space:nowrap}
.part .f{display:block;font-family:var(--font-text);font-size:12px;line-height:1.2;font-weight:600;color:var(--ink-muted)}
.part[aria-pressed="true"] .v{background:var(--action);color:var(--on-action);border-color:var(--action)}
.part[aria-pressed="true"] .f{color:var(--ink)}
.zoom{position:relative;margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);line-height:0}
.zoom img{display:block;width:100%;height:auto}
.zoom svg{position:absolute;inset:0;width:100%;height:100%}
.zoom .bx{fill:none;stroke:var(--highlight);stroke-width:2px;vector-effect:non-scaling-stroke}
.zoom .bx.fill{fill:var(--highlight);fill-opacity:.18}
.zoom .bx.dim{stroke:var(--blue-200);stroke-width:1.5px}
.zoom .gd{stroke:var(--pfizer-blue);stroke-width:1.5px;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.zoom .dot{fill:var(--pfizer-blue);stroke:var(--surface);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.zoom .tag{font-family:var(--font-text);font-size:5px;font-weight:600;fill:var(--highlight)}
.zoom .tag.dim{fill:var(--pfizer-blue);font-weight:500}
.zoom .badge{fill:var(--pfizer-blue)}
.zoom .badge.on{fill:var(--highlight)}
.zoom .badge-t{font-family:var(--font-text);font-size:3.6px;font-weight:700;fill:var(--on-action);text-anchor:middle;dominant-baseline:central}
.concl{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:12px 18px;font-size:16px;line-height:1.55;color:var(--card-text)}
.concl b{font-weight:600;color:var(--card-title)}

/* Card 4: the 3 pages light up one by one */
.loop{display:grid;grid-template-columns:124px minmax(0,1fr);gap:var(--space-3);align-items:center;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 12px}
.loop-go{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.loop-go .p{font-size:14px;line-height:1.45}
.pages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.pgx{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0}
.pgx .tagl{font-family:var(--font-mono);font-size:11px;white-space:nowrap;line-height:16px;color:var(--ink);visibility:hidden}
.pgx img{display:block;width:74px;height:auto;border:2px solid var(--blue-200);border-radius:4px;background:var(--surface);opacity:.45;transition:opacity .25s ease,border-color .25s ease}
.pgx .cnt{font-size:13px;line-height:16px;font-weight:600;color:var(--ink);visibility:hidden}
.pgx.lit img{opacity:1;border-color:var(--pfizer-blue)}
.pgx.cur img{border-color:var(--highlight)}
.pgx.lit .tagl,.pgx.lit .cnt{visibility:visible}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.btn-sm{padding:9px 14px;font-size:14px}
.btn-sm:disabled{opacity:.5;cursor:default}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="How to get every word and its box with PyMuPDF: four cards">
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where"><span id="where-count">Card 1 of 4</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Card"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-next" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var IC_COPY = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5V3.3c0-.7-.6-1.3-1.3-1.3H3.8c-.7 0-1.3.6-1.3 1.3v5.4c0 .7.6 1.3 1.3 1.3H4" stroke="currentColor" stroke-width="1.4"/></svg>';
  var NS = "http://www.w3.org/2000/svg";

  function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  /* lang "plain" is an output block, with no Copy button */
  function code(lang, label, lines) {
    var out = lang === "plain";
    return '<figure class="run' + (out ? ' out' : '') + '"><div class="code-head"><span class="code-lang">' + label + '</span>' +
      (out ? '' : '<button type="button" class="copy" data-copy aria-label="Copy ' + label + ' code">' + IC_COPY + '<span>Copy</span></button>') + '</div>' +
      '<pre tabindex="0"><code>' + (out ? lines.map(function (l) { return '<span class="ln">' + (l ? esc(l) : ' ') + '</span>'; }).join("") : esc(lines.join("\n"))) + '</code></pre></figure>';
  }
  function svgEl(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }

  /* The real page.get_text("words") boxes for page 1 of sample-sdf-document.pdf (PyMuPDF 1.26.5), 203 words,
     each as [x0, y0, width, height] in PDF points (the page is 612 x 792). The picture is the same page cropped to
     CROP, so the SVG uses CROP as its viewBox and every box lands on its word. Words below the crop are drawn but clipped. */
  var CROP = [24, 78, 564, 213.6];

        '<p class="fmt">(x0, y0, x1, y1, word, block_no, line_no, word_no)</p>' +
        '<p class="p">Each value represents:</p>' +
        '<div class="row-wrap"><div style="display:flex;flex-direction:column;gap:10px">' +
          '<p class="hint">Click a part of the "Cytiva" row.</p>' +
          '<div class="row" role="group" aria-label="The Cytiva row">' +
            '<span class="pun">(</span>' +
            '<button type="button" class="part" data-part="xy0"><span class="v">547.44, 87.59</span><span class="f">x0, y0</span></button><span class="pun">,&nbsp;</span>' +
            '<button type="button" class="part" data-part="xy1"><span class="v">576.01, 98.43</span><span class="f">x1, y1</span></button><span class="pun">,&nbsp;</span>' +
            '<button type="button" class="part" data-part="word"><span class="v">\'Cytiva\'</span><span class="f">word</span></button><span class="pun">,&nbsp;</span>' +
            '<button type="button" class="part" data-part="block"><span class="v">0</span><span class="f">block_no</span></button><span class="pun">,&nbsp;</span>' +
            '<button type="button" class="part" data-part="line"><span class="v">0</span><span class="f">line_no</span></button><span class="pun">,&nbsp;</span>' +
            '<button type="button" class="part" data-part="wordno"><span class="v">0</span><span class="f">word_no</span></button>' +
            '<span class="pun">)</span>' +
          '</div></div>' +
          '<figure class="zoom"><img src="pfizer3-p3-m5-row-zoom.png" width="800" height="300" alt="A close-up of the top right corner of page 1: Cytiva, 100 Results Way, Marlborough, MA 01752, United States.">' +
            '<svg id="zoom-svg" aria-hidden="true" preserveAspectRatio="none"></svg></figure>' +
        '</div>' +
        '<p class="p">Let\'s analyze the position of "Cytiva" from the table:</p>' +
        '<div class="tbl" role="region" aria-label="What each value in the Cytiva row means"><table>' +
          '<thead><tr><th scope="col">Field</th><th scope="col">Value</th><th scope="col">Meaning</th></tr></thead>' +
          '<tbody>' +
            '<tr class="grp"><td colspan="3">1. Bounding Box (Coordinates)</td></tr>' +
            '<tr data-part="xy0"><td class="w">x0, y0</td><td class="n">547.44, 87.59</td><td><b>Top-left corner</b> of the word</td></tr>' +
            '<tr data-part="xy1"><td class="w">x1, y1</td><td class="n">576.01, 98.43</td><td><b>Bottom-right corner</b> of the word. This means "Cytiva" appears at these coordinates on the page.</td></tr>' +
            '<tr class="grp"><td colspan="3">2. Text Information</td></tr>' +
            '<tr data-part="word"><td class="w">word</td><td class="n">"Cytiva"</td><td>The extracted text</td></tr>' +
            '<tr data-part="block"><td class="w">block_no</td><td class="n">0</td><td>The <b>text block</b> (a chunk of text, like a paragraph) where this word is found. This means "Cytiva" is in the <b>first</b> text block.</td></tr>' +
            '<tr data-part="line"><td class="w">line_no</td><td class="n">0</td><td>The <b>line number</b> within the block. It is on the <b>first</b> line within that block.</td></tr>' +
            '<tr data-part="wordno"><td class="w">word_no</td><td class="n">0</td><td>The <b>word\'s position</b> in the line. It is the <b>first</b> word in that line.</td></tr>' +
          '</tbody></table></div>' +
        '<p class="concl"><b>Conclusion:</b> "Cytiva" is the first word of the first line of the first block, appearing at the given coordinates on the PDF page.</p>',
      init: initRow },

    { label: "Every Page", eyebrow: "All 3 pages",
      html: '<h2 class="title">Do It for <span class="hl">Every</span> Page</h2>' +
        '<p class="why">The date you need is on page 2, so read all 3 pages.</p>' +
        '<p class="p">Most PDFs have multiple pages, so we need to extract text from all of them, not just the first one. Instead of manually going page by page, we automate the process using a <b>loop</b> (code that repeats once for each page):</p>' +
        '<div class="cols" style="grid-template-columns:minmax(0,1fr) 210px"><div style="display:flex;flex-direction:column;gap:12px">' +
          code("python", "Python", [
            '# Loop through all pages and extract text',
            'for page_num in range(len(doc)):',
            '    page = doc[page_num]',
            '    text = page.get_text("text")',
            '    print(f"--- Page {page_num + 1} ---")',
            '    print(text)'
          ]) +
          '<div class="loop"><div class="loop-go"><p class="p">Click the button to run the loop.</p>' +
            '<button type="button" class="btn btn-next btn-sm" id="loop-btn">Run the loop</button></div>' +
            '<div class="pages">' + pageFig(1) + pageFig(2) + pageFig(3) + '</div></div>' +
          '</div>' +
          code("plain", "Output (trimmed)", ['--- Page 1 ---', 'Cytiva', '...', '--- Page 2 ---', 'Certificate of Quality', '...', '--- Page 3 ---', 'Cytiva', '...']) +
        '</div>' +
        '<p class="p"><b>What\'s happening here?</b></p>' +
        '<ul class="bul">' +
          '<li><code>len(doc)</code>: Finds how many pages are in the PDF.' +
            '<div class="cols" style="grid-template-columns:minmax(0,1fr) 180px">' +
              code("python", "Python", [
                'import pymupdf',
                '',
                '# Load the PDF',
                'doc = pymupdf.open("sample-sdf-document.pdf")',
                '',
                '# Print the number of pages',
                'print(f"Total Pages: {doc.page_count}")'
              ]) +
              code("plain", "Output", ['Total Pages: 3']) +
            '</div></li>' +
          '<li><code>page = doc[page_num]</code>: Gets each page one by one.</li>' +
          '<li><code>get_text("text")</code>: Extracts plain text from the page.</li>' +
          '<li>We print everything neatly, so we can see which text belongs to which page.</li>' +
        '</ul>' +
        '<p class="p"><b>Why this matters:</b> If you\'re dealing with <b>multi-page PDFs</b> (like reports, contracts, or research papers), this lets you extract text from the entire document instead of doing it manually.</p>',
      init: initLoop }
  ];
  var END_LABEL = "Done";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the cards. Scroll down to the next part of the page.";

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }

  CARDS.forEach(function (c, n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + c.label);
    b.innerHTML = '<span class="seg"></span><span class="pg-label" data-text="' + c.label + '">' + c.label + '</span>';
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function titleOf(n) { var m = CARDS[n].html.match(/<h2[^>]*>(.*?)<\/h2>/); return m ? m[1].replace(/<[^>]+>/g, "") : ""; }

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function render(anim) {
    var c = CARDS[i];
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.eyebrow + '</p>' + c.html + '</div>';
    if (c.init) c.init(card);
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });
    Array.prototype.forEach.call(rail.children, function (b, n) {
      b.classList.toggle("is-cur", n === i);
      b.classList.toggle("is-done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("where-count").textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + titleOf(i + 1) + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n < 0 || n >= CARDS.length || n === i) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i === CARDS.length - 1) {
      donemsg.textContent = DONE_MSG;
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "extern-deck-done" }, "*");
      return;
    }
    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.closest && e.target.closest(".row, .sw")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", fit);
  fit();
  render(false);
})();
</script>
</body>
