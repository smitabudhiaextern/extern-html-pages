<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyMuPDF Words and Boxes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Card player copied from pfizer3-p3-m2-learn.html:
   a rail with "Card X of N" on top, one card at a time, Back and Next below.
   Code blocks and Copy buttons copied from the P3 module 2 and 3 decks (code has a Copy button, output has none).
   P3 module 5 Learn cards: "Learn How to Extract Text and Bounding Boxes with PyMuPDF" (9 cards).
   Fixed stage: laid out once on a 760 x 880 design stage (set the Notion embed height to 880 px), then scaled as one piece
   to fit the embed frame and centred. Nothing scrolls, and Back and Next never move.
   Every output is the real output of the code on the card, run on sample-sdf-document.pdf with PyMuPDF 1.26.5,
   in the card order (so page and words carry over from card to card). Outputs marked "trimmed" keep only some lines.
   The page 3 picture is the real page rendered with PyMuPDF at 300 dpi; its boxes are the real get_text("words") boxes. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600); --icon:var(--extern-black); --connector:var(--extern-black);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --space-1:4px; --space-2:8px; --space-3:14px; --space-4:18px; --space-5:26px; --space-6:40px; --space-7:56px;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage-w:760px; --stage-h:880px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* The design stage. JavaScript sets the scale and position; until it runs, the stage sits at full size. */
.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}
.pg-label{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-muted);white-space:nowrap}
.pg-label::after{content:attr(data-text);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:600}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:22px 28px;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.inner{display:flex;flex-direction:column;gap:16px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:2px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:16px;line-height:1.6;color:var(--ink-muted);text-wrap:pretty;max-width:68ch}
.p b{font-weight:600;color:var(--ink)}
.p code,.tbl code,.tile h3 code,.tile p code,.fact code,.bul code,.ana code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink);white-space:nowrap}
.tile h3 code,.tile p code,.fact code,.ana code{background:var(--surface-icon)}

/* Tiles on surface-card */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.tile{background:var(--surface-card);border-radius:var(--radius-md);padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:8px}
.tile h3{margin:0;font-size:17px;line-height:1.3;font-weight:600;color:var(--card-title)}
.tile p{margin:0;font-size:15px;line-height:1.5;color:var(--card-text)}
.tile .num{display:block;font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.tile b{font-weight:600;color:var(--card-title)}
.tile .run{margin-top:auto}

.fact{border:1.5px solid var(--ink);border-radius:var(--radius-md);padding:14px 20px}
.fact .num{display:block;margin-bottom:4px;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.fact p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-muted)}
.fact b{font-weight:600;color:var(--ink)}

/* Worked analysis, on surface-card */
.ana{background:var(--surface-card);border-radius:var(--radius-md);padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.ana h3{margin:0;font-size:17px;line-height:1.3;font-weight:600;color:var(--card-title)}
.ana ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.ana li,.ana p{margin:0;font-size:16px;line-height:1.55;color:var(--card-text)}
.ana b{font-weight:600;color:var(--card-title)}
.ana .concl{border-top:1px solid var(--blue-200);padding-top:12px}

/* Bullets */
.bul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.bul li{font-size:16px;line-height:1.55;color:var(--ink-muted)}
.bul b{font-weight:600;color:var(--ink)}

/* Picture with boxes */
.shot{margin:0;display:flex;flex-direction:column;gap:6px}
.shot .frame{background:var(--surface-icon);border:1px solid var(--line);border-radius:var(--radius-xs);overflow:hidden;line-height:0}
.shot img,.shot svg{display:block;width:100%;height:auto}
.cap{margin:0;font-size:13px;line-height:1.4;color:var(--gray-600)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;line-height:1.3;color:var(--gray-600)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:10px;border-radius:2px}
.legend .k{border:2px solid var(--pfizer-blue)}

/* Two columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-3);align-items:start}
.cols > div{display:flex;flex-direction:column;gap:10px;min-width:0}

/* Table */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-icon)}
.tbl table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.4}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:8px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--card-text)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.w{font-family:var(--font-mono);font-size:14px;color:var(--ink);white-space:nowrap}
.tbl td.n{font-family:var(--font-mono);font-size:14px;color:var(--ink);white-space:nowrap}
.fmt{margin:0;font-family:var(--font-mono);font-size:14px;line-height:1.5;color:var(--ink);background:var(--gray-50);border-radius:var(--radius-xs);padding:8px 12px}

/* Code block with a Copy button; output blocks have no Copy button */
.run{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-icon)}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:5px 8px 5px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:9px 14px;font-family:var(--font-mono);font-size:13px;line-height:1.5;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit;white-space:inherit;background:none;padding:0;border-radius:0}
.run.out{border-color:var(--blue-200)}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);white-space:pre-wrap;overflow-wrap:anywhere}
/* Each output line is its own block: a long row that wraps is indented under its first line, so rows stay easy to tell apart */
.run.out pre .ln{display:block;padding-left:2ch;text-indent:-2ch}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:4px 10px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="How to get every word and its box with PyMuPDF: nine cards">
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where"><span id="where-count">Card 1 of 9</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Card"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-next" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

          '<li>This means "Expiration" appears at these coordinates on the page: about 54 points in from the left edge, and about 154 points down from the top.</li></ul>' +
          '<h3>2. Text Information</h3>' +
          '<ul><li><b>Word:</b> "Expiration" (the actual extracted text)</li>' +
          '<li><b>Block Number, <code>block_no</code>: 8.</b> This means "Expiration" is in text block 8. Counting starts at 0, so that\'s the <b>ninth</b> text block on the page.</li>' +
          '<li><b>Line Number, <code>line_no</code>: 1.</b> It is on the <b>second</b> line within that block.</li>' +
          '<li><b>Word Number, <code>word_no</code>: 0.</b> It is the <b>first</b> word in that line.</li></ul>' +
          '<p class="concl"><b>Conclusion:</b> "Expiration" is the first word of the second line of the ninth block, appearing at the given coordinates on the PDF page.</p>' +
        '</div>' },

    { label: "Two Words", eyebrow: "Why the label splits",
      html: '<h2 class="title">Why "Expiration Date:" Comes Back as <span class="hl">Two</span> Words</h2>' +
        '<p class="p">Now print the row for Expiration and the 2 rows after it:</p>' +
        code("python", "Python", ['for word in words[104:107]:', '    print(word)']) +
        code("plain", "Output", [
          "(53.64154052734375, 153.71876525878906, 96.03092956542969, 165.86985778808594, 'Expiration', 8, 1, 0)",
          "(98.36155700683594, 153.71876525878906, 120.82115936279297, 165.86985778808594, 'Date:', 8, 1, 1)",
          "(125.39865112304688, 153.71876525878906, 165.79605102539062, 165.86985778808594, '20230126', 8, 1, 2)"
        ]) +
        '<p class="p">PyMuPDF splits a line into words wherever there\'s a space. So the label "Expiration Date:" comes back as two rows, <b>Expiration</b> and <b>Date:</b>, and the colon stays stuck to "Date:". Dates with spaces split too: the date at the top of the letter on page 1 comes back as 3 words, "3", "June," and "2022".</p>' +
        '<p class="p">All three rows are in block 8, line 1, with word numbers 0, 1 and 2: one word after another on the same line. The date, 20230126, is the very next word after the label.</p>' +
        '<div class="fact"><span class="num">WATCH OUT</span><p>If you search the list for "Expiration Date:", you\'ll find nothing, because no single row holds both words. Look for "Expiration" and "Date:" one after the other instead.</p></div>' },

    { label: "Page 3", eyebrow: "Page 3",
      html: '<h2 class="title">On Page 3, the Same <span class="hl">Top</span> Means the Same Line</h2>' +
        '<p class="p">On page 3, "Date of Manufacture:" and its date, 20240315, sit on the same line, in two columns. Here they are, with PyMuPDF\'s box around each word:</p>' +
        '<figure class="shot"><div class="frame">' + cropFigure() + '</div>' +
          '<div class="legend"><span><i class="k"></i>The box PyMuPDF gives each word</span></div></figure>' +
        '<div class="cols" style="grid-template-columns:220px minmax(0,1fr)">' +
          '<div><p class="p">But plain text, <code>page.get_text("text")</code>, puts the date on the next line:</p>' +
            code("plain", "Output (trimmed)", ['...', 'Date of Manufacture:', '20240315', '...']) + '</div>' +
          '<div><p class="p">The boxes show where each word really sits. This prints each word with its top:</p>' +
            code("python", "Python", ['page = doc[2]  # page 3', 'words = page.get_text("words")', 'for word in words[52:56]:', '    print(word[4], "top:", word[1])']) +
            code("plain", "Output", ['Date top: 203.25', 'of top: 203.25', 'Manufacture: top: 203.25', '20240315 top: 203.25']) + '</div>' +
        '</div>' +
        '<p class="p"><code>word[4]</code> is the word and <code>word[1]</code> is its top, because counting starts at 0. All 4 words have the same top, <b>203.25</b>, so on the page they sit on the same line, and the date belongs to its label.</p>' },

    { label: "Every Page", eyebrow: "All 3 pages",
      html: '<h2 class="title">Read <span class="hl">Every</span> Page with a Loop</h2>' +
        '<p class="p">Most PDFs have multiple pages, so we need to extract the words from all of them, not just one. Instead of going page by page by hand, we automate the process using a <b>loop</b>, code that repeats once for each page:</p>' +
        '<div class="cols" style="grid-template-columns:minmax(0,1fr) 200px">' +
          code("python", "Python", [
            '# Loop through all pages and extract the words',
            'for page_num in range(len(doc)):',
            '    page = doc[page_num]',
            '    words = page.get_text("words")',
            '    print(f"--- Page {page_num + 1} ---")',
            '    print(len(words), "words")'
          ]) +
          code("plain", "Output", ['--- Page 1 ---', '203 words', '--- Page 2 ---', '201 words', '--- Page 3 ---', '213 words']) +
        '</div>' +
        '<p class="p"><b>What\'s happening here?</b></p>' +
        '<ul class="bul">' +
          '<li><code>len(doc)</code>: Finds how many pages are in the PDF (3). <code>range</code> turns that into the numbers 0, 1 and 2, one per page.</li>' +
          '<li><code>page = doc[page_num]</code>: Gets each page one by one.</li>' +
          '<li><code>get_text("words")</code>: Extracts every word on the page, with its box. Step 4 in this reading\'s notebook uses <code>get_text("text")</code> instead, so it prints each page\'s text.</li>' +
          '<li><code>page_num + 1</code>: <code>page_num</code> counts from 0, so adding 1 prints the page numbers you see on paper, 1, 2 and 3. That way you can see which words belong to which page.</li>' +
        '</ul>' +
        '<p class="p"><b>Why this matters:</b> with a multi-page PDF, this lets you extract the words from the entire document instead of doing it by hand.</p>' }
  ];
  var END_LABEL = "Done";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the cards. Scroll down to the next part of the page.";

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }

  CARDS.forEach(function (c, n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + c.label);
    b.innerHTML = '<span class="seg"></span><span class="pg-label" data-text="' + c.label + '">' + c.label + '</span>';
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function titleOf(n) { var m = CARDS[n].html.match(/<h2[^>]*>(.*?)<\/h2>/); return m ? m[1].replace(/<[^>]+>/g, "") : ""; }

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function render(anim) {
    var c = CARDS[i];
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.eyebrow + '</p>' + c.html + '</div>';
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });
    Array.prototype.forEach.call(rail.children, function (b, n) {
      b.classList.toggle("is-cur", n === i);
      b.classList.toggle("is-done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("where-count").textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + titleOf(i + 1) + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n < 0 || n >= CARDS.length || n === i) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i === CARDS.length - 1) {
      donemsg.textContent = DONE_MSG;
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "extern-deck-done" }, "*");
      return;
    }
    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", fit);
  fit();
  render(false);
})();
</script>
