<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reverse-engineer the rails</title>
<style>
  /* ===============================================================
     Extern design system. These five values are the entire palette.
     Do not add a sixth. Every tint below is an rgba() of #001D69,
     not a new hue. No state is ever signalled by colour alone: every
     coloured state also carries a glyph or a label.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, the thing THEY did  */
    --bg:#FDF8F8;           /* canvas background, negative space   */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;    /* UI feedback              */
    --t-frame:300ms;   /* between-slide movement   */
    --t-reveal:560ms;  /* the reveal resolving     */
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- the 960x540 canvas, scaled down only, never up ----
     flex:0 0 auto is load bearing. As a shrinkable flex item the canvas
     laid out at the viewport width between 600 and 899px and the JS
     transform then scaled it a second time, double shrinking the design.
     The canvas must always hold 960 in layout and let the transform do
     all of the fitting. getComputedStyle(stage).width must read 960px. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  /* the frame takes programmatic focus so a screen reader announces a new
     slide. It is not a control, so it draws no ring of its own. Every real
     control keeps its own visible ring. */
  .frame{position:absolute;inset:0;padding:20px 44px 16px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header: progress, visible from first paint ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{
    display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out);
  }
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{
    margin-left:auto;flex:0 0 auto;background:var(--highlight);border-radius:20px;
    padding:3px 10px;font-size:11.5px;font-weight:600;color:var(--on-highlight);white-space:nowrap;
  }

  h1{font-size:22px;line-height:1.22;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:5px}
  h1 .tag{
    display:inline-block;vertical-align:2px;margin-left:8px;
    font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    background:var(--on-highlight);color:var(--bg);border-radius:4px;padding:3px 7px;
  }

  /* ---- the board. Two columns on a deal slide, one on the others ---- */
  .board{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 380px;gap:18px}
  .board.one{grid-template-columns:1fr}

  .coll{min-width:0;min-height:0;display:flex;flex-direction:column}
  .colr{min-width:0;min-height:0;display:flex;flex-direction:column}

  /* ---- the fixed field furniture. Same three labels, same order, every
         deal slide. Labels run in, so a field costs no extra line. ---- */
  .fields{flex:0 0 auto}
  .fld{font-size:14px;line-height:1.5;margin-bottom:7px}
  .fld:last-child{margin-bottom:0}
  .fld b.lab{color:var(--title);font-weight:600}
  .fld q{quotes:"\201C" "\201D"}

  /* ---- evidence card. "Where this comes from" is the same card with a
         different label and a different icon. It is NOT a warning state.
         There is nothing wrong with an unpublished fact. ---- */
  .ev{
    margin-top:auto;flex:0 0 auto;background:var(--highlight);border-radius:10px;
    padding:9px 12px;font-size:11.5px;line-height:1.42;color:var(--body);
  }
  .ev .evh{
    display:flex;align-items:center;gap:6px;margin-bottom:4px;
    font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight);
  }
  .ev .evh svg{width:14px;height:14px;flex:0 0 auto;display:block}
  .ev a{color:var(--on-highlight)}
  .ev .no{color:var(--on-highlight);font-weight:600}

  /* ---- the question, which stays visible through the reveal ---- */
  .q{
    flex:0 0 auto;font-size:14.5px;line-height:1.35;font-weight:600;color:var(--title);
    margin-bottom:9px;
  }

  /* ---- options. Real buttons, Tab and Enter, no custom key protocol ---- */
  .opts{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
  button.opt{
    font-family:inherit;font-size:12px;line-height:1.4;text-align:left;color:var(--title);
    background:var(--bg);border:1.5px solid var(--line);border-radius:9px;
    padding:7px 10px;cursor:pointer;display:flex;gap:7px;align-items:flex-start;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out);
  }
  button.opt .g{
    flex:0 0 auto;width:15px;height:15px;border-radius:50%;margin-top:1px;
    border:1.5px solid var(--on-highlight);color:var(--on-highlight);
    font-size:10px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  button.opt:hover:not(:disabled){background:var(--highlight);border-color:var(--on-highlight)}
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt:disabled{cursor:default}
  /* ruled out: glyph plus a struck label plus the border going dashed.
     Three signals, none of them colour on its own. */
  button.opt.out{background:transparent;border-style:dashed;border-color:var(--line);opacity:.9}
  button.opt.out .txt{text-decoration:line-through;text-decoration-thickness:1px}
  button.opt.out .g{border-style:dashed}
  button.opt.picked{background:var(--on-highlight);border-color:var(--on-highlight);color:var(--bg)}
  button.opt.picked .g{border-color:var(--bg);color:var(--bg)}

  /* fixed height, reserved from first paint. A min-height box grew on the
     first wrong answer and pushed the options the reader was mid way
     through down the panel. Nothing here reflows, ever. */
  .note{
    flex:0 0 auto;height:52px;overflow-y:auto;margin-top:9px;
    font-size:11.5px;line-height:1.4;color:var(--body);
  }
  /* the worked slide's note is one sentence, not a discrimination note, so
     it gets the shorter reserved slot and hands 16px back to the reveal */
  .note.short{height:36px}
  .note b{color:var(--title);font-weight:600}
  .note .nm{color:var(--on-highlight);font-weight:600}

  /* ---- the reveal. Two parts, and the second one is the payload. ---- */
  .reveal{
    flex:1 1 auto;min-height:0;overflow-y:auto;
    background:var(--highlight);border-radius:11px;padding:11px 13px;
    display:flex;flex-direction:column;gap:9px;
  }
  .reveal:focus{outline:3px solid var(--on-highlight);outline-offset:2px}
  .reveal.in{animation:rin var(--t-reveal) var(--ease-over) both}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .rb{min-width:0}
  .rl{
    font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--on-highlight);margin-bottom:3px;display:flex;align-items:center;gap:6px;
  }
  .rl svg{width:14px;height:14px;flex:0 0 auto;display:block}
  .rt{font-size:12.5px;line-height:1.46;color:var(--body)}
  .rt b{color:var(--title);font-weight:600}
  .rt a{color:var(--on-highlight)}
  .rb.pay .rt{color:var(--title)}
  .rlead{font-size:11.5px;font-weight:600;color:var(--on-highlight);flex:0 0 auto}

  /* ---- the orientation slide and the list slide ---- */
  .intro{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px;max-width:66ch}
  .intro p{font-size:15px;line-height:1.55}
  .intro p b{color:var(--title);font-weight:600}
  .credit{
    margin-top:auto;flex:0 0 auto;font-size:11.5px;line-height:1.45;
    border-top:1.5px solid var(--highlight);padding-top:8px;
  }

  .listwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .lintro{flex:0 0 auto;font-size:13px;line-height:1.45;margin-bottom:8px}
  .rules{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .row{
    display:grid;grid-template-columns:84px 196px 1fr;gap:12px;align-items:center;
    background:var(--highlight);border-radius:8px;padding:5px 10px;
  }
  .row .nm{font-size:12.5px;font-weight:600;color:var(--title);line-height:1.28}
  .row .st{font-size:11px;font-weight:600;color:var(--on-highlight);line-height:1.28}
  .row .rr{font-size:12.5px;line-height:1.36;color:var(--body)}
  .row .rr b{color:var(--title);font-weight:600}
  .row.open{background:var(--tint)}
  button.jump{
    font-family:inherit;font-size:11.5px;font-weight:600;color:var(--on-highlight);
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:6px;
    padding:4px 9px;cursor:pointer;
  }
  button.jump:hover{background:var(--tint2)}
  button.jump:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  .sizebar{
    flex:0 0 auto;margin-top:8px;font-size:11.5px;line-height:1.42;
    border-top:1.5px solid var(--highlight);padding-top:7px;
  }
  .sizebar b{color:var(--title);font-weight:600}

  /* ---- glossary. Terms are real buttons, so hover, tap, and keyboard all
         reach them. The definition lands in the bar, which is already
         reserved space, so no slot anywhere grows on a hover. ---- */
  button.gl{
    font:inherit;color:var(--on-highlight);font-weight:600;cursor:help;
    background:none;border:0;padding:0 1px;
    border-bottom:2px dotted var(--on-highlight);
  }
  button.gl:hover{background:var(--highlight)}
  button.gl:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.gl[aria-expanded="true"]{background:var(--on-highlight);color:var(--bg);border-bottom-color:var(--bg)}

  /* ---- the bar. margin-top:auto plus flex:0 0 auto means overflow above
         scrolls inside its own region and can never displace this row.
         This is the rule that keeps a Continue button on the canvas. ---- */
  .bar{
    margin-top:10px;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;
    min-height:44px;
  }
  button.nav{
    font-family:inherit;font-size:13.5px;font-weight:600;padding:10px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);
    transition:opacity var(--t-fast) var(--ease-out);
  }
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{
    flex:1 1 auto;min-width:0;height:44px;overflow-y:auto;
    font-size:11.5px;line-height:1.38;color:var(--body);
    display:flex;flex-direction:column;justify-content:center;
  }
  #hint .term{font-weight:600;color:var(--on-highlight)}
  #hint b{color:var(--title);font-weight:600}
  #hint.live{
    background:var(--highlight);border-radius:8px;padding:5px 10px;color:var(--title);
  }

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    /* Drop flex on the body. As a flex item #stage inherits min-width:auto
       and refuses to shrink below its content width, which pushed the board
       off screen. Block layout removes that floor. */
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{
      width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important;
    }
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    h1 .tag{font-size:11px}
    .board{grid-template-columns:1fr;gap:18px;align-items:start}
    .fld{font-size:16px;line-height:1.5}
    .ev{margin-top:14px;font-size:14px;padding:12px 14px}
    .ev .evh{font-size:12.5px}
    .q{font-size:17px}
    button.opt{font-size:15px;padding:11px 13px}
    button.opt .g{width:18px;height:18px;font-size:11px}
    .note{height:auto;overflow:visible;font-size:14px;margin-top:12px}
    .reveal{flex:0 0 auto;overflow:visible;padding:14px 15px}
    .rl{font-size:12.5px}
    .rt{font-size:15px;line-height:1.5}
    .rlead{font-size:14px}
    .intro p{font-size:16px}
    .credit{font-size:13.5px}
    .lintro{font-size:15px}
    .rules{overflow:visible}
    .row{grid-template-columns:1fr;gap:4px;padding:11px 13px}
    .row .nm{font-size:15px}
    .row .st{font-size:12.5px}
    .row .rr{font-size:15px}
    button.jump{font-size:13px;padding:6px 11px}
    .sizebar{font-size:13.5px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:13.5px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Reverse-engineer the rails">

    <div class="top">
      <span class="prog" id="prog">1 of 8</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
      <span class="chip" id="chip">0 of 5 called</span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board">

      <div class="coll" id="coll">
        <div class="fields" id="fields"></div>
        <div class="ev" id="ev"></div>
      </div>

      <div class="colr" id="colr">
        <p class="q" id="q"></p>
        <div id="ask">
          <div class="opts" id="opts" role="group" aria-label="Pick one"></div>
          <div class="note" id="note" role="status" aria-live="polite"></div>
        </div>
        <div class="reveal" id="reveal" hidden tabindex="-1" role="group" aria-label="The reveal"></div>
      </div>

    </div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Continue</button>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <!-- This style block has to sit INSIDE noscript so it lands after the main
       sheet and wins on source order. Three things must happen: the dead
       canvas is hidden, the flex centred body goes back to block flow so this
       text is not laid out as a narrow strip beside a 960px canvas, and links
       are pinned to the palette so the browser default blue never appears as
       a sixth colour. -->
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h1{font-size:26px;line-height:1.2;color:#1C1B1B;margin-bottom:10px}
    .nsf h2{font-size:19px;line-height:1.25;color:#1C1B1B;margin:22px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:8px}
    .nsf strong{color:#1C1B1B}
    .nsf a{color:#001D69}
    .nsf .src{font-size:14px}
    .nsf .rule{background:#DCE1FF;border-radius:9px;padding:10px 13px;margin:0 0 14px}
    .nsf .rule strong{color:#001D69}
  </style>
  <div class="nsf">
    <h1>Six things this team has already tried</h1>
    <p>Six entries. Some ran for years, one of them is still running, and most of them close something off. Each one is followed by the rule it gives you, which is the part you carry into Project 3. Compiled by Wes Okafor, Strategic Partnerships Manager, from what Sarah Thaler, Ed.D., Senior Strategic Partnerships Manager, has told the team.</p>

    <h2>1. A competing assessment</h2>
    <p><strong>Who they are.</strong> College Board is the non-profit that owns the SAT, which almost every US college applicant sits. <strong>What the partnership was.</strong> Announced in 2014 and launched in 2015, Official SAT Practice put College Board&rsquo;s own test material on Khan Academy, free. The 2015 announcement described the practice as available &ldquo;exclusively on Khan Academy&rdquo;. <strong>What happened to it.</strong> Nothing. This is the one entry still running, and that is exactly why it closes a door.</p>
    <p class="rule"><strong>The rule this gives you.</strong> Being someone&rsquo;s official practice partner spends the slot. Before you pitch, ask what a live partnership has already promised. A deal can be dead because of a deal that is alive.</p>
    <p class="src">Khan Academy Help Center, &ldquo;Helping your students prepare for the Digital SAT on Khan Academy&rdquo;, updated 11 August 2026: &ldquo;Khan Academy is still the official partner of College Board and is here to provide you with redesigned tools to prepare students for success on the digital SAT.&rdquo; <a href="https://support.khanacademy.org/hc/en-us/articles/23298985511821">Help Center</a> &middot; <a href="https://blog.khanacademy.org/official-sat-practice-now-available-for-free/">Khan Academy blog, 2 June 2015</a> &middot; <a href="https://satsuite.collegeboard.org/k12-educators/khan-academy-districts">College Board, Khan Academy Districts</a>. Which way money moves in this relationship is not published by either side, and it is not what makes this a rail.</p>

    <h2>2. Selling to a named district</h2>
    <p><strong>Who they are.</strong> Nobody. There is no partner on this one, and nothing was tried and abandoned. It is a line between two teams. <strong>What the partnership was.</strong> There was never one. Khan Academy Districts is a product, and the sales team sells it. <strong>What happened to it.</strong> Nothing happened to it. The ideas that hit this line rarely look like sales. They look like one big regional deal with a lot of schools inside it.</p>
    <p class="rule"><strong>The rule this gives you.</strong> If the partner would mostly just be buying the product, you are holding a sale, not a partnership. Size does not change that. Forty schools is still a sale.</p>
    <p class="src">Evidence: none to link. This is an internal division of labour, not an announcement.</p>

    <h2>3. Higher education</h2>
    <p><strong>Who they are.</strong> No single partner. This was a market the team looked at rather than a deal it signed: colleges and universities instead of the K-12 schools Khan Academy already served. <strong>What the partnership was.</strong> An attempt to get Khan Academy working inside higher-education institutions the way it works inside a school district. <strong>What happened to it.</strong> Rostering and other technical integration problems made it impractical, and the team stopped looking for higher-education partnership deals.</p>
    <p class="rule"><strong>The rule this gives you.</strong> This team is not shopping for higher-education partnership deals, so a candidate whose users are undergraduates is not one to bring. Read the scope exactly: it is about which partnership candidates this team wants, not about anything else Khan Academy is doing. Khan Academy does have higher-education work. On 14 April 2026 it announced the <a href="https://blog.khanacademy.org/introducing-the-khan-ted-institute-a-new-approach-to-higher-education/">Khan TED Institute</a> with TED and ETS, &ldquo;a new approach to higher education designed for a changing world&rdquo;, still in development, with a price point and a waitlist. Both are true at once. If you go looking you will find that post, and you found it here first.</p>
    <p class="src">Where this comes from: Sarah told the team. There is no announcement and no press release about the higher-education attempt or about what this team looks for, so there is no link under either. That is normal. Most of what a partnerships team knows is not published, and part of the job is being straight about which is which. The announcement is public: <a href="https://blog.khanacademy.org/introducing-the-khan-ted-institute-a-new-approach-to-higher-education/">Khan Academy blog, 14 April 2026</a>.</p>

    <h2>4. The learning-management integration</h2>
    <p><strong>Who they are.</strong> A major learning management system: the software a school runs its classes through. Khan Academy has never named which one, and neither will this page. Most of the districts Khan Academy already worked with were inside it every day. <strong>What the partnership was.</strong> Khanmigo teacher tools, Khan Academy&rsquo;s own AI tools for teachers, built directly inside that platform so a teacher never had to leave it. <strong>What happened to it.</strong> Adoption of the platform stayed high. Adoption of Khan Academy&rsquo;s tools inside it did not, and the integration was switched off.</p>
    <p class="rule"><strong>The rule this gives you.</strong> Khan Academy does not rebuild its own tools inside someone else&rsquo;s platform. When a pitch offers reach, ask what the partner&rsquo;s users would have to start doing differently. Distribution is not usage, and a partner can only hand you the first one.</p>
    <p class="src">Where this comes from: Sarah told the team. Neither side ever published a shutdown, and what is public still shows the integration announced and promoted. So this one is relayed, not published, and the honest version says so.</p>

    <h2>5. Praxis</h2>
    <p><strong>Who they are.</strong> ETS is the testing company behind the Praxis exams, the tests most US states require before they will license a new teacher. <strong>What the partnership was.</strong> Announced in June 2018 and live from 2019, Official Praxis Core Prep was built by the two together: ETS&rsquo;s test, Khan Academy&rsquo;s practice. It reached more than 2.3 million aspiring teachers. <strong>What happened to it.</strong> On 27 February 2024, ETS announced a new Praxis prep partnership with Study.com. Khan Academy removed Official Praxis Core Prep on 30 April 2024.</p>
    <p class="rule"><strong>The rule this gives you.</strong> If a partner could eventually own the asset without us, assume some of them will. Ask it before you build, not after: what is still ours in five years if this partner walks?</p>

    <h2>6. The assessment-data partnership</h2>
    <p><strong>Who they are.</strong> NWEA makes MAP Growth, a test tens of thousands of US schools give a few times a year to see where each student actually is. It is an assessment partner: its product is a test, and a score from that test can point a student at what to practise next. <strong>What the partnership was.</strong> NWEA&rsquo;s scores flowed into Khan Academy, Khan Academy turned them into personalised maths paths, and NWEA sold the result to schools. <strong>What happened to it.</strong> The selling changed hands. The product is now Learning Paths informed by MAP Growth, a paid add-on that Khan Academy sells itself inside a Districts partnership.</p>

              '<span class="nm">'+r.nm+'</span>' +
              (open
                ? '<span><button class="jump" type="button" data-j="'+r.id+'">Make the call to see this rule</button></span>'
                : '<span class="rr">'+r.r+'</span>') +
            '</div>';
          }).join("") + '</div>' +
          '<p class="sizebar">'+s.size+'</p>' +
        '</div></div>';
      Array.prototype.slice.call(el.board.querySelectorAll("button.jump")).forEach(function(b){
        b.addEventListener("click", function(){
          var t = b.getAttribute("data-j");
          for(var k=0;k<S.length;k++){ if(S[k].id === t){ i = k; render(false); el.frame.focus(); return; } }
        });
      });
    }
    else if(s.kind === "worked"){
      el.board.innerHTML =
        '<div class="coll"><div class="fields">'+fieldsHTML(s)+'</div>'+evHTML(s)+'</div>' +
        '<div class="colr">' +
          '<p class="q">'+s.q+'</p>' +
          '<div class="opts"><button class="opt picked" type="button" disabled aria-disabled="true">' +
            '<span class="g" aria-hidden="true">✓</span><span class="txt">'+R[s.answer]+'</span></button></div>' +
          '<div class="reveal">'+revealHTML(s, s.lead)+'</div>' +
          '<div class="note short">'+s.after+'</div>' +
        '</div>';
    }
    else {
      /* an ask slide. The reveal replaces the options in place, in the
         same column, so nothing grows below it and the bar cannot move. */
      var done = !!st.calls[s.id];
      var outIds = st.out[s.id] || [];
      el.board.innerHTML =
        '<div class="coll"><div class="fields">'+fieldsHTML(s)+'</div>'+evHTML(s)+'</div>' +
        '<div class="colr">' +
          '<p class="q">'+s.q+'</p>' +
          '<div id="ask"' + (done ? ' hidden' : '') + '>' +
            '<div class="opts" id="opts" role="group" aria-label="Pick one">' +
              s.opts.map(function(id,n){
                var isOut = outIds.indexOf(id) > -1;
                return '<button class="opt'+(isOut?" out":"")+'" type="button" data-r="'+id+'"' +
                  (isOut ? ' disabled aria-disabled="true"' : '') + '>' +
                  '<span class="g" aria-hidden="true">'+(isOut ? "✕" : "ABCD".charAt(n))+'</span>' +
                  '<span class="txt">'+R[id]+'</span></button>';
              }).join("") +
            '</div>' +
            '<div class="note" id="note" role="status" aria-live="polite">' +
              (outIds.length ? s.wrong[outIds[outIds.length-1]]
                             : 'Pick one. Every wrong option is the real reason a different entry on this list died.') +
            '</div>' +
          '</div>' +
          '<div class="reveal"' + (done ? '' : ' hidden') + ' tabindex="-1" role="group" aria-label="The reveal">' +
            (done ? revealHTML(s, st.calls[s.id] === "right" ? "You called it." : "Here it is.") : "") +
          '</div>' +
        '</div>';
      wireOpts(s);
      if(focusReveal){
        var rv = el.board.querySelector(".reveal");
        if(rv){ if(!reduce) rv.classList.add("in"); rv.focus(); }
      }
    }

    wireG();
    header();
    if(!focusReveal) say("Slide " + (i+1) + " of " + S.length + ". " + s.label + ".");
  }

  /* ---------------- committing an answer ---------------- */
  function wireOpts(s){
    Array.prototype.slice.call(el.board.querySelectorAll("button.opt")).forEach(function(b){
      if(b.disabled) return;
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-r");
        if(id === s.answer){ commit(s, "right"); return; }

        /* wrong. Rule the option out, and say which entry that reason
           actually belongs to. A nudge that only says no teaches nothing. */
        var outIds = st.out[s.id] || [];
        if(outIds.indexOf(id) === -1) outIds.push(id);
        st.out[s.id] = outIds; save(st);

        b.classList.add("out");
        b.disabled = true; b.setAttribute("aria-disabled","true");
        b.querySelector(".g").textContent = "✕";

        var note = el.board.querySelector("#note");
        note.innerHTML = s.wrong[id];

        if(outIds.length >= 2){ commit(s, "shown"); return; }

        /* focus was on the button we just removed from the tab order.
           Move it somewhere deliberate: the first option still live. */
        var live = el.board.querySelector("button.opt:not(:disabled)");
        if(live) live.focus();
        say("Ruled out. " + note.textContent);
      });
    });
  }

  function commit(s, how){
    if(!st.calls[s.id]) st.calls[s.id] = how;
    save(st);
    var ask = el.board.querySelector("#ask");
    var rv  = el.board.querySelector(".reveal");
    rv.innerHTML = revealHTML(s, how === "right" ? "You called it." : "Here it is.");
    ask.hidden = true;
    rv.hidden = false;
    if(!reduce){ rv.classList.remove("in"); void rv.offsetWidth; rv.classList.add("in"); }
    rv.focus();                 /* the activated button is gone, so land here */
    header();
    say((how === "right" ? "Correct. " : "") + "Why it died here, and the rule this gives you.");
  }

  /* ---------------- navigation. Plain buttons, Tab and Enter ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(false); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  clearG();
  render(false);
  fit();

  /* exposed for render QA only: lets a headless run force a state */
  window.__ex = {
    goto:function(n){ i = n; render(false); },
    pick:function(id){
      var b = el.board.querySelector('button.opt[data-r="'+id+'"]:not(:disabled)');
      if(b) b.click(); return !!b;
    },
    slides:S.length,
    reset:function(){ st = {calls:{},out:{}}; save(st); },
    state:function(){ return {i:i, calls:st.calls, out:st.out}; }
  };
})();
</script>
</body>
</html>
