<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four deals this team has already tried</title>
<style>
  /* ===============================================================
     Extern design system. These five values are the entire palette.
     Do not add a sixth. Every tint below is an rgba() of #001D69,
     not a new hue. No state is ever signalled by colour alone: every
     coloured state also carries a glyph or a label.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, the thing THEY did  */
    --bg:#FDF8F8;           /* canvas background, negative space   */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;    /* UI feedback              */
    --t-frame:300ms;   /* between-slide movement   */
    --t-reveal:560ms;  /* the reveal resolving     */
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- the 960x540 canvas, scaled down only, never up ----
     flex:0 0 auto is load bearing. As a shrinkable flex item the canvas
     laid out at the viewport width between 600 and 899px and the JS
     transform then scaled it a second time, double shrinking the design.
     The canvas must always hold 960 in layout and let the transform do
     all of the fitting. getComputedStyle(stage).width must read 960px. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  /* the frame takes programmatic focus so a screen reader announces a new
     slide. It is not a control, so it draws no ring of its own. Every real
     control keeps its own visible ring. */
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header: progress, visible from first paint ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:7px}
  .prog{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{
    display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out);
  }
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{
    margin-left:auto;flex:0 0 auto;background:var(--highlight);border-radius:20px;
    padding:3px 10px;font-size:11.5px;font-weight:600;color:var(--on-highlight);white-space:nowrap;
  }

  h1{font-size:21px;line-height:1.22;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:5px}
  h1 .tag{
    display:inline-block;vertical-align:2px;margin-left:8px;
    font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    background:var(--on-highlight);color:var(--bg);border-radius:4px;padding:3px 7px;
  }

  /* ---- the board. Two columns on a deal slide, one on the others ---- */
  .board{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 404px;gap:18px}
  .board.one{grid-template-columns:1fr}

  .coll{min-width:0;min-height:0;display:flex;flex-direction:column}
  .colr{min-width:0;min-height:0;display:flex;flex-direction:column}

  /* ---- her sentence, at the top of every deal slide. This is the source
         the whole slide is checked against, so it sits above the summary
         rather than under it, and it is never paraphrased. ---- */
  .quote{
    flex:0 0 auto;background:var(--highlight);border-radius:10px;
    padding:9px 12px;margin-bottom:10px;
  }
  .quote .qh{
    display:flex;align-items:center;gap:6px;margin-bottom:4px;
    font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight);
  }
  .quote .qh svg{width:14px;height:14px;flex:0 0 auto;display:block}
  .quote .qt{font-size:13px;line-height:1.44;color:var(--title)}
  .quote .qt q{quotes:"\201C" "\201D"}

  /* ---- the fixed field furniture. Same three labels, same order, every
         deal slide. Labels run in, so a field costs no extra line. ---- */
  .fields{flex:0 0 auto}
  .fld{font-size:14px;line-height:1.5;margin-bottom:6px}
  .fld:last-child{margin-bottom:0}
  .fld b.lab{color:var(--title);font-weight:600}

  /* ---- the question, which stays visible through the reveal ---- */
  .q{
    flex:0 0 auto;font-size:14.5px;line-height:1.35;font-weight:600;color:var(--title);
    margin-bottom:8px;
  }

  /* ---- options. Real buttons, Tab and Enter, no custom key protocol.
         The same four, in the same order, on every slide. ---- */
  .opts{flex:0 0 auto;display:flex;flex-direction:column;gap:5px}
  button.opt{
    font-family:inherit;font-size:12px;line-height:1.35;text-align:left;color:var(--title);
    background:var(--bg);border:1.5px solid var(--line);border-radius:9px;
    padding:6px 10px;cursor:pointer;display:flex;gap:7px;align-items:flex-start;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out);
  }
  button.opt .g{
    flex:0 0 auto;width:15px;height:15px;border-radius:50%;margin-top:0;
    border:1.5px solid var(--on-highlight);color:var(--on-highlight);
    font-size:10px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  button.opt:hover:not(:disabled){background:var(--highlight);border-color:var(--on-highlight)}
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt:disabled{cursor:default}
  /* ruled out: glyph plus a struck label plus the border going dashed.
     Three signals, none of them colour on its own. */
  button.opt.out{background:transparent;border-style:dashed;border-color:var(--line);opacity:.9}
  button.opt.out .txt{text-decoration:line-through;text-decoration-thickness:1px}
  button.opt.out .g{border-style:dashed}
  button.opt.rest{background:transparent;border-color:var(--line);opacity:.72}
  button.opt.picked{background:var(--on-highlight);border-color:var(--on-highlight);color:var(--bg)}
  button.opt.picked .g{border-color:var(--bg);color:var(--bg)}

  /* fixed height, reserved from first paint. A min-height box grew on the
     first wrong answer and pushed the options the reader was mid way
     through down the panel. Nothing here reflows, ever. */
  .note{
    flex:0 0 auto;height:52px;overflow-y:auto;margin-top:8px;
    font-size:11.5px;line-height:1.4;color:var(--body);
  }
  .note b{color:var(--title);font-weight:600}

  /* ---- the reveal. Two parts, and the second one is the payload. ---- */
  /* flex:0 1 auto, not 1 1: the panel hugs its own copy, and only starts
     shrinking and scrolling if a wider font stack ever makes it taller than
     the column. Either way the bar below it cannot be pushed off canvas. */
  .reveal{
    flex:0 1 auto;min-height:0;overflow-y:auto;
    background:var(--highlight);border-radius:11px;padding:9px 12px;
    display:flex;flex-direction:column;gap:7px;
  }
  .reveal:focus{outline:3px solid var(--on-highlight);outline-offset:2px}
  .reveal.in{animation:rin var(--t-reveal) var(--ease-over) both}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .rb{min-width:0}
  .rl{
    font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--on-highlight);margin-bottom:3px;display:flex;align-items:center;gap:6px;
  }
  .rl svg{width:14px;height:14px;flex:0 0 auto;display:block}
  .rt{font-size:12.5px;line-height:1.44;color:var(--body)}
  .rt b{color:var(--title);font-weight:600}
  .rt i{font-style:italic}
  .rb.pay .rt{color:var(--title)}
  .rlead{font-size:11.5px;font-weight:600;color:var(--on-highlight);flex:0 0 auto}

  /* ---- the orientation slide and the closing list ---- */
  .intro{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;max-width:74ch}
  .intro p{font-size:15px;line-height:1.55}
  .intro p b{color:var(--title);font-weight:600}
  .listwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .lintro{flex:0 0 auto;font-size:13px;line-height:1.45;margin-bottom:8px}
  .rules{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  .row{
    display:grid;grid-template-columns:96px 150px 1fr;gap:12px;align-items:center;
    background:var(--highlight);border-radius:8px;padding:9px 12px;
  }
  .row .nm{font-size:12.5px;font-weight:600;color:var(--title);line-height:1.28}
  .row .st{font-size:11px;font-weight:600;color:var(--on-highlight);line-height:1.28}
  .row .rr{font-size:12.5px;line-height:1.36;color:var(--body)}
  .row .rr b{color:var(--title);font-weight:600}
  .row.open{background:var(--tint)}
  button.jump{
    font-family:inherit;font-size:11.5px;font-weight:600;color:var(--on-highlight);
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:6px;
    padding:4px 9px;cursor:pointer;
  }
  button.jump:hover{background:var(--tint2)}
  button.jump:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  .sizebar{
    flex:0 0 auto;margin-top:8px;font-size:11.5px;line-height:1.42;
    border-top:1.5px solid var(--highlight);padding-top:7px;
  }
  .sizebar b{color:var(--title);font-weight:600}

  /* ---- glossary. Terms are real buttons, so hover, tap, and keyboard all
         reach them. The definition lands in the bar, which is already
         reserved space, so no slot anywhere grows on a hover. Every
         definition is labelled as ours, not hers. ---- */
  button.gl{
    font:inherit;color:var(--on-highlight);font-weight:600;cursor:help;
    background:none;border:0;padding:0 1px;
    border-bottom:2px dotted var(--on-highlight);
  }
  button.gl:hover{background:var(--highlight)}
  button.gl:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.gl[aria-expanded="true"]{background:var(--on-highlight);color:var(--bg);border-bottom-color:var(--bg)}

  /* ---- the bar. margin-top:auto plus flex:0 0 auto means overflow above
         scrolls inside its own region and can never displace this row.
         This is the rule that keeps a Continue button on the canvas. ---- */
  .bar{
    margin-top:9px;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;
    min-height:56px;
  }
  button.nav{
    font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);
    transition:opacity var(--t-fast) var(--ease-out);
  }
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{
    flex:1 1 auto;min-width:0;height:56px;overflow-y:auto;
    font-size:11.5px;line-height:1.36;color:var(--body);
    display:flex;flex-direction:column;justify-content:center;
  }
  #hint .term{font-weight:600;color:var(--on-highlight)}
  #hint b{color:var(--title);font-weight:600}
  #hint .glab{
    display:block;font-size:9.5px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;color:var(--on-highlight);
  }
  #hint.live{
    background:var(--highlight);border-radius:8px;padding:4px 10px;color:var(--title);
  }

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    /* Drop flex on the body. As a flex item #stage inherits min-width:auto
       and refuses to shrink below its content width, which pushed the board
       off screen. Block layout removes that floor. */
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{
      width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important;
    }
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    h1 .tag{font-size:11px}
    /* align-content, not just align-items. A stretched one column grid
       hands its leftover height to the auto rows, which opened a dead band
       between the two stacked panels on a tall phone. */
    .board{grid-template-columns:1fr;gap:18px;align-items:start;align-content:start}
    .quote{margin-bottom:14px;padding:12px 14px}
    .quote .qh{font-size:12.5px}
    .quote .qt{font-size:15px;line-height:1.5}
    .fld{font-size:16px;line-height:1.5}
    .q{font-size:17px}
    button.opt{font-size:15px;padding:11px 13px}
    button.opt .g{width:18px;height:18px;font-size:11px}
    .note{height:auto;overflow:visible;font-size:14px;margin-top:12px}
    .reveal{flex:0 0 auto;overflow:visible;padding:14px 15px}
    .rl{font-size:12.5px}
    .rt{font-size:15px;line-height:1.5}
    .rlead{font-size:14px}
    .intro p{font-size:16px}
    .lintro{font-size:15px}
    .rules{overflow:visible}
    .row{grid-template-columns:1fr;gap:4px;padding:11px 13px}
    .row .nm{font-size:15px}
    .row .st{font-size:12.5px}
    .row .rr{font-size:15px}
    button.jump{font-size:13px;padding:6px 11px}
    .sizebar{font-size:13.5px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:13.5px;flex:1 1 100%;margin-top:4px}
    #hint .glab{font-size:11px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Four deals this team has already tried">

    <div class="top">
      <span class="prog" id="prog">1 of 6</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
      <span class="chip" id="chip">0 of 3 called</span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Continue</button>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <!-- This style block has to sit INSIDE noscript so it lands after the main
       sheet and wins on source order. Three things must happen: the dead
       canvas is hidden, the flex centred body goes back to block flow so this
       text is not laid out as a narrow strip beside a 960px canvas, and links
       are pinned to the palette so the browser default blue never appears as
       a sixth colour. -->
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h1{font-size:26px;line-height:1.2;color:#1C1B1B;margin-bottom:10px}
    .nsf h2{font-size:19px;line-height:1.25;color:#1C1B1B;margin:22px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:8px}
    .nsf strong{color:#1C1B1B}
    .nsf a{color:#001D69}
    .nsf .src{background:#DCE1FF;border-radius:9px;padding:10px 13px;margin:0 0 12px}
    .nsf .src strong{color:#001D69}
    .nsf .rule{background:#DCE1FF;border-radius:9px;padding:10px 13px;margin:0 0 14px}
    .nsf .rule strong{color:#001D69}
    .nsf .foot{font-size:14px}
  </style>
  <div class="nsf">
    <h1>Four deals this team has already tried</h1>
    <p>Everything on the next four slides comes from one note Sarah Thaler, Senior Strategic Partnerships Manager, sent to the team. Her sentence sits on each slide, so you can check every claim against her words without leaving this screen.</p>
    <p>Each slide gives you who the partner was, what the deal put in place, and where it stands. Then you say what happened to it, and you get a question to carry into your own pitches. <strong>The question is the part you keep.</strong></p>
    <p>The same four options appear on every slide. Each one is the real reason a different deal here ended, so guessing by feel does not work. You have to tell them apart.</p>
    <ul>
      <li>Usage was low</li>
      <li>Rostering and other technical issues</li>
      <li>The partner now owns it</li>
      <li>Nothing stopped it</li>
    </ul>
    <p>One of these four did not end at all. The first slide is worked for you, and it is that one, so you know what to look for.</p>

    <h2>NWEA</h2>
    <p class="src"><strong>From Sarah&rsquo;s note.</strong> &ldquo;We have already had a partnership with NWEA where we received student MAP Growth scores via API and personalized learning paths are created for the student. NWEA used to sell the Learning Paths product for us. We still have the API; however, our Sales team now includes this in our KA District Partnership offering.&rdquo;</p>
    <p><strong>Who the partner was.</strong> NWEA. <strong>What the deal put in place.</strong> Student MAP Growth scores received via API, and personalized learning paths created for the student. NWEA sold the Learning Paths product for Khan Academy. <strong>Where it stands.</strong> The API is still in place. The Sales team now includes this in the KA District Partnership offering.</p>
    <p><strong>Sarah&rsquo;s note says what happened to this one. Which is it?</strong> Nothing stopped it.</p>
    <p>Read her three sentences in order. NWEA <em>used to</em> sell the Learning Paths product. Khan Academy <em>still has</em> the API. What changed is who does the selling, not whether any of it runs. A past tense in a sentence is not the same as a deal that ended.</p>
    <p class="rule"><strong>What to carry from this one.</strong> Before you file anything as off the table, ask which part of it actually stopped. If the only thing that changed is who does the selling, it is still running.</p>

    <h2>Khanmigo Teacher Tools in Canvas</h2>
    <p class="src"><strong>From Sarah&rsquo;s note.</strong> &ldquo;We had a partnership with Instructure to put Khanmigo Teacher Tools in Canvas. Usage was incredibly low even though Canvas usage is high amongst districts, so this has been sunset.&rdquo;</p>
    <p><strong>Who the partner was.</strong> Instructure. <strong>What the deal put in place.</strong> Khanmigo Teacher Tools, inside Canvas. <strong>Where it stands.</strong> Sunset.</p>
    <p><strong>Sarah gives one reason this ended. Which is it?</strong> Usage was low.</p>
    <p>Read her sentence again, both halves of it. Canvas usage is high amongst districts. Usage of Khanmigo Teacher Tools inside Canvas was incredibly low. Those are two different numbers, and only one of them was ours.</p>
    <p class="rule"><strong>What to carry from this one.</strong> When a pitch offers you a partner&rsquo;s reach, ask whose usage would have to go up. Theirs is already high. Yours is the number that has to move.</p>

    <h2>Higher education</h2>
    <p class="src"><strong>From Sarah&rsquo;s note.</strong> &ldquo;We have also tried to get into higher education, but there are rostering and other technical issues that made this difficult, so we&rsquo;re staying in K-12.&rdquo;</p>
    <p><strong>Who the partner was.</strong> Her note names no partner on this one. <strong>What the deal put in place.</strong> Nothing yet. This was an attempt to get into higher education. <strong>Where it stands.</strong> Staying in K-12.</p>
    <p><strong>Sarah gives one reason this did not work out. Which is it?</strong> Rostering and other technical issues.</p>
    <p>Her words exactly: rostering and other technical issues that made this difficult. Nobody in her sentence objected to the idea. The plumbing decided it.</p>
    <p class="rule"><strong>What to carry from this one.</strong> Ask what would have to connect before anyone signs anything. A deal nobody objects to can still fail on plumbing.</p>

    <h2>Praxis</h2>
    <p class="src"><strong>From Sarah&rsquo;s note.</strong> &ldquo;We had test prep for Praxis from ETS. ETS now owns their own practice materials.&rdquo;</p>
    <p><strong>Who the partner was.</strong> ETS. <strong>What the deal put in place.</strong> Test prep for Praxis, from ETS. <strong>Where it stands.</strong> ETS now owns their own practice materials.</p>
    <p><strong>Sarah gives one reason this is no longer running. Which is it?</strong> The partner now owns it.</p>
    <p>Her second sentence is the whole answer: ETS now owns their own practice materials. The Praxis exam was ETS&rsquo;s, and so are the practice materials now.</p>
    <p class="rule"><strong>What to carry from this one.</strong> On a partner&rsquo;s own product, ask what is still yours if the partner decides to do it themselves. The exam was never ours to keep.</p>

    <h2>The four, and the question each one leaves you</h2>
    <p>Three of these four are off the table. One is running. This screen stays here, and Project 3 sends you back to it with your own candidates on the table instead of someone else&rsquo;s.</p>
    <ul>
      <li><strong>NWEA.</strong> Still running. Ask which part of a deal actually stopped. If it is only who does the selling, it did not stop.</li>
      <li><strong>Canvas.</strong> Ask whose usage has to go up. A partner&rsquo;s high usage is not yours.</li>
      <li><strong>Higher education.</strong> Ask what would have to connect before anyone signs.</li>
      <li><strong>Praxis.</strong> Ask what is still yours if the partner decides to do it themselves.</li>
    </ul>

    <h2>Plain definitions</h2>
    <ul>
      <li><strong>Canvas.</strong> Software a school or district runs its classes through. Teachers post assignments and grades in it, and students hand work in through it. Instructure makes it.</li>
      <li><strong>Khanmigo Teacher Tools.</strong> Khan Academy&rsquo;s AI tools built for teachers rather than students.</li>
      <li><strong>API.</strong> A connection that lets one company&rsquo;s software send data straight into another&rsquo;s, with nobody having to type it in.</li>
      <li><strong>MAP Growth.</strong> A test NWEA makes. Schools use it to see where a student currently is.</li>
      <li><strong>Rostering.</strong> Getting the list of who teaches which students into the software, and keeping it right as classes and enrolments change.</li>
      <li><strong>Sunset.</strong> Switched off for good, rather than left running unused.</li>
      <li><strong>Praxis.</strong> The exams US states require before they will license a new teacher.</li>
      <li><strong>KA District Partnership.</strong> Khan Academy&rsquo;s paid offering for school districts.</li>
    </ul>

    <p class="foot">Everything on these slides is Sarah&rsquo;s account of what happened, relayed to you, not published by Khan Academy or by any partner named here.</p>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ===============================================================
     Icons. Phosphor style, line weight only, one stroke width, 14px
     everywhere, colour always #001D69 by inheritance.
     =============================================================== */
  var I = {
    say:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-8 8H8.5L4 22.5V17A8 8 0 0 1 12 4a8 8 0 0 1 8 8z"/><path d="M9 10h6M9 14h4"/></svg>',
    look:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.2"/><path d="M15.6 15.6 21 21"/></svg>',
    flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 21V3.5"/><path d="M5.5 3.5h12l-2.4 4.6 2.4 4.6h-12"/></svg>'
  };

  /* ===============================================================
     THE FOUR OPTIONS. The same four, in the same order, on every
     slide. Each one is the real answer to a different slide, so a
     student cannot answer by feel. They have to tell them apart.
     =============================================================== */
  var OPTS = ["low","rost","owns","none"];
  var R = {
    low:  "Usage was low",
    rost: "Rostering and other technical issues",
    owns: "The partner now owns it",
    none: "Nothing stopped it"
  };

  /* ===============================================================
     Glossary. Plain definitions of what a thing is. None of them
     describes a deal. These definitions are authored, not Sarah's,
     but the panel no longer says so: the owner removed that label on
     19 August 2026. Do not reinstate it without asking.
     =============================================================== */
  var G = {
    canvas:{t:"Canvas", d:"Software a school or district runs its classes through. Teachers post assignments and grades in it, and students hand work in through it. Instructure makes it."},
    ktt:{t:"Khanmigo Teacher Tools", d:"Khan Academy’s AI tools built for teachers rather than students."},
    api:{t:"API", d:"A connection that lets one company’s software send data straight into another’s, with nobody having to type it in."},
    map:{t:"MAP Growth", d:"A test NWEA makes. Schools use it to see where a student currently is."},
    rostering:{t:"Rostering", d:"Getting the list of who teaches which students into the software, and keeping it right as classes and enrolments change."},
    sunset:{t:"Sunset", d:"Switched off for good, rather than left running unused."},
    praxis:{t:"Praxis", d:"The exams US states require before they will license a new teacher."},
    kadp:{t:"KA District Partnership", d:"Khan Academy’s paid offering for school districts."}
  };
  var GLAB = "Plain definition";
  function gl(key,label){
    return '<button class="gl" type="button" data-g="'+key+'" aria-expanded="false">'+label+'</button>';
  }

  var HINT_DEFAULT = 'Tab moves, Enter picks. Nothing is scored. You can <b>Continue</b> without answering and come back.';

  /* ===============================================================
     THE SIX SLIDES.
     Every student-facing sentence about Khan Academy or a partner on
     a deal slide is Sarah's, or points at hers. The two authored
     categories are "What to carry from this one" and the glossary
     definitions. Only the first is still labelled on screen.
     =============================================================== */
  var S = [

  /* ---------- 1. orientation ---------- */
  {
    id:"intro", kind:"intro", label:"Orientation",
    title:"Four deals this team has already tried",
    body:[
      "Everything on the next four slides comes from one note Sarah Thaler, Senior Strategic Partnerships Manager, sent to the team. Her sentence sits on each slide, so you can check every claim against her words without leaving this screen.",
      "Each slide gives you who the partner was, what the deal put in place, and where it stands. Then you say what happened to it, and you get a question to carry into your own pitches. <b>The question is the part you keep.</b>",
      "The same four options appear on every slide. Each one is the real reason a different deal here ended, so guessing by feel does not work. You have to tell them apart.",
      "One of these four did not end at all. The first slide is worked for you, and it is that one, so you know what to look for."
    ]
  },

  /* ---------- 2. NWEA. WORKED EXAMPLE ---------- */
  {
    id:"nwea", kind:"worked", label:"NWEA",
    title:"NWEA", tag:"Worked for you",
    quote:"We have already had a partnership with NWEA where we received student MAP Growth scores via API and personalized learning paths are created for the student. NWEA used to sell the Learning Paths product for us. We still have the API; however, our Sales team now includes this in our KA District Partnership offering.",
    fields:[
      ["Who the partner was.","NWEA."],
      ["What the deal put in place.","Student "+gl("map","MAP Growth")+" scores received via "+gl("api","API")+", and personalized learning paths created for the student. NWEA sold the Learning Paths product for Khan Academy."],
      ["Where it stands.","The API is still in place. The Sales team now includes this in the "+gl("kadp","KA District Partnership")+" offering."]
    ],
    q:"Sarah’s note says what happened to this one. Which is it?",
    answer:"none",
    lead:"This is what a good answer looks like.",
    why:"Read her three sentences in order. NWEA <i>used to</i> sell the Learning Paths product. Khan Academy <i>still has</i> the API. What changed is who does the selling, not whether any of it runs. A past tense in a sentence is not the same as a deal that ended.",
    carry:"Before you file anything as off the table, ask which part of it actually stopped. If the only thing that changed is who does the selling, it is still running.",
    after:"On the next three you pick. Every wrong option is the real reason a different deal here ended."
  },

  /* ---------- 3. Khanmigo Teacher Tools in Canvas ---------- */
  {
    id:"canvas", kind:"ask", label:"Canvas",
    title:"Khanmigo Teacher Tools in Canvas",
    quote:"We had a partnership with Instructure to put Khanmigo Teacher Tools in Canvas. Usage was incredibly low even though Canvas usage is high amongst districts, so this has been sunset.",
    fields:[
      ["Who the partner was.","Instructure."],
      ["What the deal put in place.",gl("ktt","Khanmigo Teacher Tools")+", inside "+gl("canvas","Canvas")+"."],
      ["Where it stands.",gl("sunset","Sunset")+"."]
    ],
    q:"Sarah gives one reason this ended. Which is it?",
    answer:"low",
    why:"Read her sentence again, both halves of it. Canvas usage is high amongst districts. Usage of Khanmigo Teacher Tools inside Canvas was incredibly low. Those are two different numbers, and only one of them was ours.",
    wrong:{
      rost:"That is what Sarah says about higher education. Nothing in this sentence says anything broke.",
      owns:"That is what Sarah says about ETS and Praxis. Instructure did not take Khanmigo Teacher Tools over. Her sentence says this was sunset.",
      none:"Her sentence ends: so this has been sunset."
    },
    carry:"When a pitch offers you a partner’s reach, ask whose usage would have to go up. Theirs is already high. Yours is the number that has to move."
  },

  /* ---------- 4. higher education ---------- */
  {
    id:"highered", kind:"ask", label:"Higher education",
    title:"Higher education",
    quote:"We have also tried to get into higher education, but there are rostering and other technical issues that made this difficult, so we’re staying in K-12.",
    fields:[
      ["Who the partner was.","Her note names no partner on this one."],
      ["What the deal put in place.","Nothing yet. This was an attempt to get into higher education."],
      ["Where it stands.","Staying in K-12."]
    ],
    q:"Sarah gives one reason this did not work out. Which is it?",
    answer:"rost",
    why:"Her words exactly: "+gl("rostering","rostering")+" and other technical issues that made this difficult. Nobody in her sentence objected to the idea. The plumbing decided it.",
    wrong:{
      low:"Usage is what Sarah says about Canvas. This sentence does not mention usage at all.",
      owns:"That is ETS and Praxis. Her sentence here names no partner.",
      none:"Her sentence ends: so we’re staying in K-12."
    },
    carry:"Ask what would have to connect before anyone signs anything. A deal nobody objects to can still fail on plumbing."
  },

  /* ---------- 5. Praxis ---------- */
  {
    id:"praxis", kind:"ask", label:"Praxis",
    title:"Praxis",
    quote:"We had test prep for Praxis from ETS. ETS now owns their own practice materials.",
    fields:[
      ["Who the partner was.","ETS."],
      ["What the deal put in place.","Test prep for "+gl("praxis","Praxis")+", from ETS."],
      ["Where it stands.","ETS now owns their own practice materials."]
    ],
    q:"Sarah gives one reason this is no longer running. Which is it?",
    answer:"owns",
    why:"Her second sentence is the whole answer: ETS now owns their own practice materials. The Praxis exam was ETS’s, and so are the practice materials now.",
    wrong:{
      low:"Usage is what Sarah says about Canvas. She says nothing about how much this was used.",
      rost:"That is higher education. Nothing in this sentence is technical.",
      none:"Her sentence starts: we <i>had</i> test prep for Praxis. Past tense, and ETS owns the materials now."
    },
    carry:"On a partner’s own product, ask what is still yours if the partner decides to do it themselves. The exam was never ours to keep."
  },

  /* ---------- 6. the closing list ---------- */
  {
    id:"list", kind:"list", label:"The closing list",
    title:"The four, and the question each one leaves you",
    intro:"Three of these four are off the table. One is running. This screen stays here, and Project 3 sends you back to it with your own candidates on the table instead of someone else’s.",
    rows:[
      {id:"nwea", nm:"NWEA", r:"Still running. Ask which part of a deal actually stopped. If it is only who does the selling, it did not stop."},
      {id:"canvas", nm:"Canvas", r:"Ask whose usage has to go up. A partner’s high usage is not yours."},
      {id:"highered", nm:"Higher education", r:"Ask what would have to connect before anyone signs."},
      {id:"praxis", nm:"Praxis", r:"Ask what is still yours if the partner decides to do it themselves."}
    ],
    foot:"Everything on these slides is Sarah’s account of what happened, relayed to you, not published by Khan Academy or by any partner named here."
  }
  ];

  var ASKS = ["canvas","highered","praxis"];

  /* ===============================================================
     state. Keyed by slug, never by slide position, so a reorder can
     never restore an answer onto the wrong slide. v4 because the
     option pool changed: a stored ruled-out id from an earlier pool
     no longer exists and would have rendered its note as "undefined".
     =============================================================== */
  var KEY = "ka-p1-rails-v4";
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();
  st.calls = st.calls || {};   /* slug -> "right" | "shown"        */
  st.out   = st.out   || {};   /* slug -> array of ruled out ids   */

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var i = 0;                    /* current slide index */
  var el = {};
  ["frame","prog","segs","chip","h1","board","back","next","hint","live"]
    .forEach(function(k){ el[k] = document.getElementById(k); });

  function say(m){ el.live.textContent = m; }
  function called(){
    var n = 0;
    ASKS.forEach(function(s){ if(st.calls[s]) n++; });
    return n;
  }

  /* ---------------- glossary ---------------- */
  var pinned = null;
  function showG(k){
    var g = G[k]; if(!g) return;
    el.hint.classList.add("live");
    el.hint.innerHTML = '<span><span class="glab">'+GLAB+'</span><span class="term">'+g.t+'.</span> '+g.d+'</span>';
  }
  function clearG(){
    el.hint.classList.remove("live");
    el.hint.innerHTML = '<span>'+(S[i].after || HINT_DEFAULT)+'</span>';
  }
  function unpin(){ if(pinned){ pinned.setAttribute("aria-expanded","false"); pinned = null; } }
  function wireG(root){
    Array.prototype.slice.call((root || el.board).querySelectorAll("button.gl")).forEach(function(b){
      var k = b.getAttribute("data-g");
      b.addEventListener("mouseenter", function(){ if(!pinned) showG(k); });
      b.addEventListener("mouseleave", function(){ if(!pinned) clearG(); });
      b.addEventListener("focus", function(){ if(!pinned) showG(k); });
      b.addEventListener("blur", function(){ if(!pinned) clearG(); });
      b.addEventListener("click", function(){
        if(pinned === b){ unpin(); clearG(); return; }
        unpin(); pinned = b; b.setAttribute("aria-expanded","true"); showG(k);
      });
    });
  }
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && pinned){ unpin(); clearG(); }
  });

  /* ---------------- header ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var out = "";
    for(var k=0;k<S.length;k++){
      out += '<i class="' + (k === i ? "here" : (k < i ? "on" : "")) + '"></i>';
    }
    el.segs.innerHTML = out;
    el.chip.textContent = called() + " of 3 called";
    el.back.disabled = (i === 0);
    el.next.disabled = (i === S.length - 1);
    el.next.textContent = (i === S.length - 1) ? "You are at the end" : "Continue";
  }

  /* ---------------- the fixed furniture on a deal slide ---------------- */
  function quoteHTML(s){
    return '<div class="quote"><div class="qh">'+I.say+'<span>From Sarah’s note</span></div>' +
           '<p class="qt"><q>'+s.quote+'</q></p></div>';
  }
  function fieldsHTML(s){
    return '<div class="fields">' + s.fields.map(function(f){
      return '<p class="fld"><b class="lab">'+f[0]+'</b> '+f[1]+'</p>';
    }).join("") + '</div>';
  }
  function revealHTML(s, lead){
    return '<p class="rlead">'+lead+'</p>' +
      '<div class="rb"><div class="rl">'+I.look+'<span>Why this is the answer</span></div><div class="rt">'+s.why+'</div></div>' +
      '<div class="rb pay"><div class="rl">'+I.flag+'<span>What to carry from this one</span></div><div class="rt">'+s.carry+'</div></div>';
  }
  function optsHTML(s, outIds, frozen){
    return OPTS.map(function(id,n){
      var isOut = outIds.indexOf(id) > -1;
      var isPick = frozen && id === s.answer;
      var cls = "opt" + (isOut ? " out" : "") + (isPick ? " picked" : "") +
                (frozen && !isPick ? " rest" : "");
      var dis = (isOut || frozen) ? ' disabled aria-disabled="true"' : '';
      var g = isPick ? "✓" : (isOut ? "✕" : "ABCD".charAt(n));
      return '<button class="'+cls+'" type="button" data-r="'+id+'"'+dis+'>' +
        '<span class="g" aria-hidden="true">'+g+'</span>' +
        '<span class="txt">'+R[id]+'</span></button>';
    }).join("");
  }

  /* ---------------- render one slide ---------------- */
  function render(focusReveal){
    var s = S[i];
    el.h1.innerHTML = s.title + (s.tag ? ' <span class="tag">'+s.tag+'</span>' : "");
    el.board.className = "board" + (s.kind === "intro" || s.kind === "list" ? " one" : "");
    unpin();

    if(s.kind === "intro"){
      el.board.innerHTML =
        '<div class="coll"><div class="intro">' +
          s.body.map(function(p){ return '<p>'+p+'</p>'; }).join("") +
        '</div></div>';
    }
    else if(s.kind === "list"){
      el.board.innerHTML =
        '<div class="coll"><div class="listwrap">' +
          '<p class="lintro">'+s.intro+'</p>' +
          '<div class="rules">' + s.rows.map(function(r){
            var mark, open = false;
            if(r.id === "nwea"){ mark = "Worked for you"; }
            else if(st.calls[r.id] === "right"){ mark = "✓ You called it"; }
            else if(st.calls[r.id] === "shown"){ mark = "✓ You worked it out"; }
            else { mark = "○ Not called yet"; open = true; }
            return '<div class="row'+(open?" open":"")+'">' +
              '<span class="st">'+mark+'</span>' +
              '<span class="nm">'+r.nm+'</span>' +
              (open
                ? '<span><button class="jump" type="button" data-j="'+r.id+'">Make the call to see this question</button></span>'
                : '<span class="rr">'+r.r+'</span>') +
            '</div>';
          }).join("") + '</div>' +
          '<p class="sizebar">'+s.foot+'</p>' +
        '</div></div>';
      Array.prototype.slice.call(el.board.querySelectorAll("button.jump")).forEach(function(b){
        b.addEventListener("click", function(){
          var t = b.getAttribute("data-j");
          for(var k=0;k<S.length;k++){ if(S[k].id === t){ i = k; render(false); el.frame.focus(); return; } }
        });
      });
    }
    else if(s.kind === "worked"){
      /* the four options are here too, with the right one already marked.
         The student sees the set before ever being asked to sort it. */
      el.board.innerHTML =
        '<div class="coll">'+quoteHTML(s)+fieldsHTML(s)+'</div>' +
        '<div class="colr">' +
          '<p class="q">'+s.q+'</p>' +
          '<div class="opts" role="group" aria-label="Pick one">'+optsHTML(s, [], true)+'</div>' +
          '<div class="reveal">'+revealHTML(s, s.lead)+'</div>' +
        '</div>';
    }
    else {
      /* an ask slide. The reveal replaces the options in place, in the
         same column, so nothing grows below it and the bar cannot move. */
      var done = !!st.calls[s.id];
      var outIds = st.out[s.id] || [];
      el.board.innerHTML =
        '<div class="coll">'+quoteHTML(s)+fieldsHTML(s)+'</div>' +
        '<div class="colr">' +
          '<p class="q">'+s.q+'</p>' +
          '<div id="ask"' + (done ? ' hidden' : '') + '>' +
            '<div class="opts" id="opts" role="group" aria-label="Pick one">' +
              optsHTML(s, outIds, false) +
            '</div>' +
            '<div class="note" id="note" role="status" aria-live="polite">' +
              (outIds.length ? s.wrong[outIds[outIds.length-1]]
                             : 'Pick one. Every wrong option is the real reason a different deal here ended.') +
            '</div>' +
          '</div>' +
          '<div class="reveal"' + (done ? '' : ' hidden') + ' tabindex="-1" role="group" aria-label="The answer">' +
            (done ? revealHTML(s, st.calls[s.id] === "right" ? "You called it." : "Here it is.") : "") +
          '</div>' +
        '</div>';
      wireOpts(s);
      if(focusReveal){
        var rv = el.board.querySelector(".reveal");
        if(rv){ if(!reduce) rv.classList.add("in"); rv.focus(); }
      }
    }

    wireG();
    clearG();
    header();
    if(!focusReveal) say("Slide " + (i+1) + " of " + S.length + ". " + s.label + ".");
  }

  /* ---------------- committing an answer ---------------- */
  function wireOpts(s){
    Array.prototype.slice.call(el.board.querySelectorAll("button.opt")).forEach(function(b){
      if(b.disabled) return;
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-r");
        if(id === s.answer){ commit(s, "right"); return; }

        /* wrong. Rule the option out, and point at the slide that reason
           really belongs to. A nudge that only says no teaches nothing. */
        var outIds = st.out[s.id] || [];
        if(outIds.indexOf(id) === -1) outIds.push(id);
        st.out[s.id] = outIds; save(st);

        b.classList.add("out");
        b.disabled = true; b.setAttribute("aria-disabled","true");
        b.querySelector(".g").textContent = "✕";

        var note = el.board.querySelector("#note");
        note.innerHTML = s.wrong[id];

        /* three wrong options per slide. Rule out all three and the answer
           resolves itself, so nobody can get stuck holding one guess. */
        if(outIds.length >= 3){ commit(s, "shown"); return; }

        /* focus was on the button we just removed from the tab order.
           Move it somewhere deliberate: the first option still live. */
        var live = el.board.querySelector("button.opt:not(:disabled)");
        if(live) live.focus();
        say("Ruled out. " + note.textContent);
      });
    });
  }

  function commit(s, how){
    if(!st.calls[s.id]) st.calls[s.id] = how;
    save(st);
    var ask = el.board.querySelector("#ask");
    var rv  = el.board.querySelector(".reveal");
    rv.innerHTML = revealHTML(s, how === "right" ? "You called it." : "Here it is.");
    wireG(rv);                  /* a gloss inside the reveal did not exist at render time */
    ask.hidden = true;
    rv.hidden = false;
    if(!reduce){ rv.classList.remove("in"); void rv.offsetWidth; rv.classList.add("in"); }
    rv.focus();                 /* the activated button is gone, so land here */
    header();
    say((how === "right" ? "Correct. " : "") + "Why this is the answer, and what to carry from this one.");
  }

  /* ---------------- navigation. Plain buttons, Tab and Enter ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(false); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render(false);
  fit();

  /* exposed for render QA only: lets a headless run force a state */
  window.__ex = {
    goto:function(n){ i = n; render(false); },
    pick:function(id){
      var b = el.board.querySelector('button.opt[data-r="'+id+'"]:not(:disabled)');
      if(b) b.click(); return !!b;
    },
    slides:S.length,
    reset:function(){ st = {calls:{},out:{}}; save(st); },
    state:function(){ return {i:i, calls:st.calls, out:st.out}; }
  };
})();
</script>
</body>
</html>
