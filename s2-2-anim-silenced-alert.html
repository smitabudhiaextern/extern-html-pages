<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The warning that never arrived</title>
<!--
  Vault micro-animation: "silenced-alert" (rebuilt, no bell).
  A red LEAK alert slides along the wire from the sensor toward the OPERATOR screen.
  A MUTE command drops midway and kills it, the alert dies before it arrives.
  The operator screen stays calmly green the whole time: it never heard the warning.
  Teaching beat: silence the alert and the operator never knows to respond.
  Night Ops palette; self-contained SVG, no raster GIF; ~4.6s loop.
-->
<style>
  :root{
    --bg:#0B1D2A; --panel:#10283A; --line:#1E3A4F;
    --teal:#2EC4B6; --amber:#F5A623; --red:#E4573D; --good:#3ECF8E; --ink:#EAF4F4; --muted:#8FB0BC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink)}
  #deck-wrapper{width:700px;height:270px;overflow:hidden;position:relative;flex-shrink:0;
    background:var(--panel);border:1px solid var(--line);border-radius:16px}
  .wrap{width:700px;height:270px;padding:14px 18px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .top .t{font-size:14px;font-weight:800}
  .readout{font-size:13px;font-weight:800;font-family:'Consolas',monospace}
  .readout .k{color:var(--muted);font-weight:600}
  .readout .v{color:var(--red)}
  .readout.silenced .v{color:var(--muted)}
  svg{width:100%;flex:1}
  .status{font-size:13px;font-weight:800;text-align:center;height:18px}
  .status.firing{color:var(--red)} .status.silenced{color:var(--good)}

  /* the LEAK alert badge slides right toward the operator (no position attribute,
     so CSS transform is safe), then is killed midway. */
  .alert{transform:translateX(0);opacity:1;transition:transform 1.2s linear, opacity .4s ease}
  .alert.travel{transform:translateX(150px)}
  .alert.killed{opacity:0}

  /* red X blocking mark at the kill point */
  .block{opacity:0;transition:opacity .25s}
  .block.on{opacity:1}

  /* MUTE command drops from the top (children at natural coords, transform is safe) */
  .cmd{opacity:0}
  .cmd.travel{animation:drop .6s ease forwards}
  @keyframes drop{0%{opacity:0;transform:translateY(-42px)}30%{opacity:1}100%{opacity:1;transform:translateY(0)}}

  /* red truth caption appears after the mute */
  .truth{opacity:0;transition:opacity .4s}
  .truth.on{opacity:1}

  /* leak dot on the sensor pulses */
  .leakdot{animation:pulse 1s ease-in-out infinite alternate}
  @keyframes pulse{0%{opacity:1}100%{opacity:.3}}
</style>
</head>
<body>
<div id="deck-wrapper">
  <div class="wrap" id="stage">
    <div class="top">
      <div class="t">The warning that never arrived.</div>
      <div class="readout" id="readout"><span class="k">ALERT&nbsp;</span><span class="v" id="alertval">FIRING</span></div>
    </div>

    <svg viewBox="0 0 664 170" preserveAspectRatio="xMidYMid meet">
      <!-- sensor (left) -->
      <rect x="8" y="56" width="92" height="62" rx="10" fill="#14344A" stroke="#2A4D66" stroke-width="1.6"/>
      <text x="54" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#CFE6E6">SENSOR</text>
      <text x="54" y="100" text-anchor="middle" font-size="12" fill="#8FB0BC">leak line</text>
      <circle class="leakdot" cx="90" cy="66" r="5" fill="var(--red)"/>

      <!-- wire from sensor toward operator -->
      <line x1="100" y1="88" x2="484" y2="88" stroke="#2A4D66" stroke-width="1.5" stroke-dasharray="5 6"/>

      <!-- OPERATOR screen (right), stays calmly green throughout -->
      <g transform="translate(492 34)">
        <rect x="0" y="0" width="156" height="100" rx="10" fill="#12331F" stroke="#2A4D66" stroke-width="1.6"/>
        <text x="78" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#8FB0BC">OPERATOR</text>
        <circle cx="78" cy="52" r="13" fill="none" stroke="var(--good)" stroke-width="3"/>
        <path d="M72 52 l4 5 l9 -11" fill="none" stroke="var(--good)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="78" y="86" text-anchor="middle" font-size="13" font-weight="800" fill="var(--good)">&#9679; ALL NORMAL &#10003;</text>
      </g>

      <!-- the travelling LEAK alert (killed midway) -->
      <g class="alert" id="alert">
        <rect x="112" y="70" width="104" height="34" rx="9" fill="#2A1520" stroke="var(--red)" stroke-width="1.6"/>
        <text x="164" y="92" text-anchor="middle" font-size="13" font-weight="800" fill="#FF9A88">&#9888; LEAK</text>
      </g>

      <!-- blocked X at the kill point -->
      <g class="block" id="block">
        <line x1="300" y1="76" x2="326" y2="100" stroke="var(--red)" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="326" y1="76" x2="300" y2="100" stroke="var(--red)" stroke-width="3.5" stroke-linecap="round"/>
      </g>

      <!-- MUTE command drops onto the wire midway -->
      <g class="cmd" id="cmd">
        <rect x="276" y="6" width="74" height="26" rx="8" fill="#2A1520" stroke="var(--red)" stroke-width="1.5"/>
        <text x="313" y="24" text-anchor="middle" font-size="12" font-weight="800" fill="#FF9A88">&#9889; MUTE</text>
      </g>

      <!-- truth caption -->
      <text class="truth" id="truth" x="230" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="var(--red)">the leak is real. the operator was never told.</text>
    </svg>

    <div class="status firing" id="status">&#9888; leak alert heading to the operator</div>
  </div>
</div>

<script>
const stage=document.getElementById('stage');
const alertEl=document.getElementById('alert');
const cmd=document.getElementById('cmd');
const block=document.getElementById('block');
const truth=document.getElementById('truth');
const alertval=document.getElementById('alertval');
const readout=document.getElementById('readout');
const status=document.getElementById('status');

function reset(){
  alertEl.classList.remove('travel','killed');
  cmd.classList.remove('travel');
  block.classList.remove('on');
  truth.classList.remove('on');
  readout.classList.remove('silenced');
  alertval.textContent='FIRING';
  status.className='status firing';
  status.textContent='⚠ leak alert heading to the operator';
}
function startTravel(){ alertEl.classList.add('travel'); }             // alert slides right
function fireMute(){ cmd.classList.remove('travel'); void cmd.offsetWidth; cmd.classList.add('travel'); }
function kill(){
  alertEl.classList.add('killed');   // alert fades where it stopped
  block.classList.add('on');         // red X flashes at the kill point
  truth.classList.add('on');
  readout.classList.add('silenced');
  alertval.textContent='SILENCED';
  status.className='status silenced';
  status.textContent='● operator sees all normal. the alert never arrived.';
}
function cycle(){
  reset();
  setTimeout(startTravel, 150);
  setTimeout(fireMute, 1250);
  setTimeout(kill, 1950);
}
cycle();
setInterval(cycle, 4600);

const wrapper=document.getElementById('deck-wrapper');
function scaleDeck(){const s=Math.min(window.innerWidth/700,window.innerHeight/270,1);wrapper.style.transform='scale('+s+')';wrapper.style.transformOrigin='top left';}
window.addEventListener('resize',scaleDeck);scaleDeck();
</script>
</body>
</html>
