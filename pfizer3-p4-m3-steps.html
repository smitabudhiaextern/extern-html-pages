:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* The design stage, scaled and centred by the script at the end */
.app{position:absolute;left:50%;top:50%;width:760px;height:1014px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: step rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:13px;font-weight:500;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}
.narrow .top{grid-template-columns:minmax(0,1fr);row-gap:8px}
.narrow .where{order:0}

/* Slide area and slide */
.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}
.narrow .stage{padding:10px 0}
.narrow .card{padding:18px 16px;border-left:0;border-right:0;border-radius:0}
.inner{flex:none;display:flex;flex-direction:column;gap:var(--space-3);width:100%}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding-bottom:3px;color:var(--ink);text-wrap:balance}
.narrow .title{font-size:28px;line-height:34px}
.hl{color:var(--highlight)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none}

/* Run card: the code with a Copy button; output blocks have no Copy button */

.run pre{margin:0;padding:12px 14px;font-family:var(--font-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out{border-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}

.narrow .run pre{font-size:13px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.narrow .run.out pre{font-size:12px}
/* Prompt box (19 November 2026): the code block look with plain text that wraps */
.run.prompt pre,.narrow .run.prompt pre{font-family:var(--font-text);font-size:15px;line-height:22px;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 14px}

/* Done message and foot */

.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}

@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }

/* A short list in two columns on wide frames (slide 10's field list) */
.app:not(.narrow) .list.cols{display:block;columns:2;column-gap:28px}

</style>

<div class="app" id="app">
  <h1 class="sr-only">Analyze a Scanned PDF: What to Do</h1>
  <header class="top">
    <nav class="rail" id="rail" aria-label="Steps"></nav>

    <div class="upnext" id="upnext"></div>

  </footer>

<!-- Slide bodies. {{PROMPT:...}} is a sample prompt for Claude with a Copy button. {{OPEN:KEY:label}} is a button.
     {{SHOT:name}} is "What you'll see in Colab:" and the picture pfizer3-p4-m3-name.png: an output-only crop of A1's Colab
     run on Page 2, or (task-p2-*) a crop of the picture Colab made with the notebook's own cells. A "run out" figure is
     A1's exact output text. No slide shows code. -->

<!-- Get Ready: the SME's intro, his field list, the document, and his first two bullets -->
<template id="g1">
  <p class="p">In this task, you'll work with Page 2 of a pharmaceutical Supporting Documentation File (SDF) to extract critical information. Page 2 is an <b>Animal Origin Statement</b>: a one-page scanned letter from the supplier about whether the materials in one of its products come from animals.</p>
  <div class="links">{{OPEN:FILE:Open Page 2 (Animal Origin Statement)}}</div>
  <p class="p">Download it to your computer with the download arrow at the top right. Then find these fields on it by eye:</p>
  <ul class="list">
    <li><b>Vendor name</b> (Cytiva): the company that makes and sells the product, at the top of the page.</li>
    <li><b>Product name and code</b>, in the table.</li>
    <li><b>Document type</b> (Animal Origin Statement), the big heading.</li>
    <li><b>Signature date</b>, in the box at the bottom.</li>
    <li><b>Signatory name and title</b>: the person who signed and their job, in the same box.</li>
    <li><b>Document reference number</b>, the small code at the very bottom.</li>
  </ul>
  <p class="p">Your code will look for each of these on the next slides.</p>
</template>

<template id="g2">
  <p class="p">If you don't understand anything, I think you should use Claude. Here are two sample prompts:</p>
  {{PROMPT:I'm learning to read a scanned PDF with Tesseract OCR in Google Colab. My task says: [paste the slide's instruction]. Explain in simple words what I need to do and give me one hint, but don't write the code for me.}}
  {{PROMPT:Here's my code and the error I got: [paste both]. Explain in plain English what's going wrong and give me one hint, but don't fix it for me.}}
</template>

<template id="g3">
  <p class="p">Open your copy of the notebook from the Tesseract reading, the one you saved to your Drive. You'll run the same cells again, this time on Page 2.</p>
  <div class="links">{{OPEN:NOTEBOOK:Extracting Text and Bounding Boxes from Scanned PDFs (Colab notebook)}}</div>
  <p class="p">Each code cell starts with a gray comment that names it, such as "STEP 3: Upload Your Pharmaceutical SDF". These slides name the cells by that STEP number.</p>
  <p class="p"><b>First, delete the cells you added yourself in Try It Yourself.</b> They work on Page 4, and your Task notebook has to run from top to bottom on Page 2.</p>
  <ul class="list">
    <li>Keep every cell whose gray comment at the top names a <b>STEP</b> (STEP 1 to STEP 15) or the <b>BONUS STEP</b>. These are the notebook's own cells.</li>
    <li>Delete every other cell: the code you pasted from the reading (such as the cell that pulls the Gamma Process Run ID, the lot numbers and the doses out of Page 4, and the 3 rotate lines), and any challenge cells. Click a cell, then click the trash can icon at its top right.</li>
    <li>To find each cell you pasted, click a blank spot outside the cells, press Ctrl+F (Cmd+F on a Mac) and type each of these lines in turn. Each one is in only one of the cells you pasted:
      <ul class="list cols finds"><li><code class="nw"># Remove excessive newlines</code></li><li><code class="nw"># Remove unwanted symbols</code></li><li><code class="nw"># Extract Gamma Process Run ID</code></li><li><code class="nw"># Extract bounding box data</code></li><li><code class="nw"># Convert image to OpenCV BGR</code></li><li><code class="nw"># Define key fields to highlight</code></li><li><code class="nw"># Initialize an empty dictionary</code></li><li><code class="nw"># Rotate 90 degrees clockwise</code> (if you did the Bonus)</li></ul>
    </li>
  </ul>
</template>

<template id="g4">
  <p class="p">Now run the first cells on Page 2:</p>
  <ol class="list">
    <li>Run the <b>STEP 1</b> and <b>STEP 2</b> cells to install and load the tools.</li>
    <li>Run the <b>STEP 3</b> cell. When the upload box appears, click <b>Choose Files</b> and pick <code class="nw">pharmaceutical-sdf-page2-animal-origin.pdf</code>, the file you just downloaded.</li>
    <li>Run the <b>STEP 4</b> and <b>STEP 5</b> cells.</li>
  </ol>
  <p class="p">You did this in the Tesseract reading, on Page 4.</p>
  {{SHOT:task-s01-upload}}
  <p class="p">That's under STEP 3. Under STEP 4, you'll see <code>[EMPTY] - No text found!</code> Page 2 holds only a picture of text, so you need OCR (reading text from a picture).</p>
</template>

<!-- Read the Text: his preprocessing bullet (one copy), rotation correction, Tesseract OCR, cleaning -->
<template id="r1">
  <p class="p">Improve OCR accuracy using image pre-processing techniques like thresholding, noise reduction, and rotation correction. Start with the first two.</p>
  <p class="p">Run the 4 cells from <b>STEP 6</b> to <b>STEP 9</b>, in order:</p>
  <ol class="list">
    <li><b>Grayscale:</b> takes the color out.</li>
    <li><b>Thresholding:</b> makes the text black and the background white.</li>
    <li><b>Noise reduction:</b> smooths away specks that OCR could mistake for letters.</li>
    <li><b>Resize:</b> doubles the size, so small letters are easier to read.</li>
  </ol>
  <p class="p">You did these in the Tesseract reading.</p>
  {{SHOT:task-p2-cleaned-top}}
  <p class="p">That's the top of the cleaned page STEP 9 shows. Above it, STEP 9 prints the new size: 5100x6600 pixels, twice as wide and twice as tall as before.</p>
</template>

<template id="r2">
  <p class="p">Rotation correction turns a sideways page upright before OCR. Page 2 is already upright, so it needs no rotation.</p>
  <p class="p">Only one thing on it is sideways: the approval stamp on the left edge, printed from bottom to top. Here it is, turned so you can read it:</p>
  <figure class="fig"><img src="pfizer3-p4-m3-stamp.png" width="1674" height="157" alt="The sideways stamp on the left edge of Page 2, turned to read: 090177e19abdfceb\Approved\Approved On: 13-Jul-2022 20:47 (GMT)"><figcaption>The left edge of Page 2, turned on its side</figcaption></figure>
  <p class="p">This step is optional. To read the stamp with code, run the <b>BONUS STEP</b> cell, which makes <code>rotate_image()</code>. Then, in a new code cell, turn the picture 90 degrees clockwise and keep it under a new name, <code>rotated_gray</code>, as that cell's own example shows. Run Tesseract on <code>rotated_gray</code>, as in the STEP 10 cell, and look for the "Approved On" line. Do this after you run STEP 10 on the next slide, because the STEP 10 cell makes <code>custom_config</code>, the setting your new cell copies from it.</p>
  <p class="p see"><b>What you'll see in Colab:</b> among the lines Tesseract prints, this one.</p>
  <figure class="run out"><div class="code-head"><span class="code-lang">Output</span></div><pre tabindex="0"><code>090177e19abdfceb\Approved\Approved On</code></pre></figure>
  <p class="p">Turned upright, Tesseract reads the stamp's code right. On the next slide, you'll see that STEP 10 reads the stamp even without turning, date included, with one stray <code>/</code> in the code.</p>
  <p class="p">Keep using <code>gray</code>, the upright picture, for the rest of the task.</p>
</template>

<template id="r3">
  <p class="p">Now apply Tesseract OCR to extract text from the scanned pharmaceutical document. Run the <b>STEP 10</b> cell. Tesseract reads your cleaned picture and prints every piece of text it finds.</p>
  <p class="p">You did this in the Tesseract reading.</p>
  {{SHOT:task-s03-out}}
  <p class="p">Colab cuts the longest lines off at the right edge. Some words come out wrong, such as <code>Wey</code> for Way in the address. You'll fix what you can on the next slide.</p>
</template>

<template id="r4">
  <p class="p">Clean the OCR output to fix formatting issues and correct common OCR misreads. Run the <b>STEP 11</b> cell. It puts all the text on one line with single spaces, and fixes misreads like <code>L0T</code> (with a zero) with <code>re.sub()</code>, which finds a piece of text and replaces it.</p>
  <p class="p">Then read the cleaned text next to Page 2. If you spot a word Tesseract misread, add one more <code>re.sub()</code> line for it in that cell, in the same shape as the others, and run the cell again.</p>
