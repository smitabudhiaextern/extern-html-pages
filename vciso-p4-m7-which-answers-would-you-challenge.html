<!--
  vCISO P4 Step 1, Module 7: Critique a Real Questionnaire. Build note in
  06-content/project-04/step-01/module-07-internal.md ("Build Note").
  Governing authority: output/programs/vciso/CLAUDE.md section 6. Look, nav,
  scale-to-fit, phone layout and state handling match
  vciso-p2-m11-is-cumberland-actually-affected.html.

  What it does: the student ticks the rows they marked Yes in the Challenge?
  column of their Questionnaire Critique tab, one form section per screen
  (six screens, zero ticks allowed). "Check my marks" then shows the three row
  groups the reveal names (D1 to D3, B3, F1), one per screen, each marked
  against the student's ticks, then a summary.

  Sources for every fact:
  - Row IDs, questions (verbatim) and Ray's answers: Prior signed
    questionnaire (Cumberland to Meridian).docx, 25 Sep Drive version
    (id 1WebLe_OSJHM9XAnIhIimivmTT_ejhEt3), with "authorization".
  - The three groups and their text: Interactive content sets - P4.md, P4-6,
    25 Sep Drive version (id 1_j92QievPmDJbVtUKILqWRNm95AyvjDX), as the build
    note words it: D card with "From P2 you know" replaced by the pointer to
    Nate's list ("Win Svr 2012 R2 - needs replacing", SYSTEM LIST - CCS
    (Nate's copy)); B3 first two sentences only, bracketed writer note left
    out, no admintimeout; dashes restructured.
  - F1 per-scope text: the build note's proposed wording (ours), because the
    content set's "without telling Cumberland" is not in any file a student
    holds. Ask Chaitanya to review. Inventory rows: Environment Record
    (SME drop 2026-09-25) S4 "Ridgeline IT remote access", scopes A to D,
    owner none recorded; A10 "MedFlow vendor support access", owner none
    recorded.
  - Short row labels on the summary screen: the build note's table (ours).
  - Plain-words lines under rows: definitions only, ours, no client facts.
    "Production systems" uses the module's own definition.

  Judgement calls (see the agent's return note):
  - Full question wording is shown on the tick screens instead of short forms
    with a hover, because one section per screen leaves room for it.
  - Ticking has no right or wrong (navy only). On the reveal, a challenged row
    is green, tick, "Right"; a row let stand is red, cross, "Not quite". No
    second try: the ticks copy marks already committed in the student's tab.
    A row let stand also shows green "Right answer: challenge it". After
    Check my marks the ticks lock until Start over (QA, 2 Oct 2026; owner
    may reverse).
  - The scope picker sits on the F1 screen only, as the build note says.
    Ticks are saved once, not per scope: they copy one student's tab and do
    not change with scope. The chosen scope is saved.
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    /* right and wrong states only, always paired with an icon and a word */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-reveal:460ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto;background:var(--bg)}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:6px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:26px;height:4px;border-radius:2px;background:var(--tint2)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  h1{font-size:25px;line-height:1.22;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:8px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:4px 6px;margin:-4px -6px}
  .lead{flex:0 0 auto;font-size:15.5px;line-height:1.45;color:var(--body);max-width:86ch}
  .lead b{color:var(--title);font-weight:600}
  .sub{flex:0 0 auto;font-size:14px;line-height:1.4;color:var(--body)}
  .sub b{color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  .rid{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 6px;
    border-radius:6px;background:var(--highlight);color:var(--on-highlight);font-size:13px;font-weight:700;letter-spacing:.02em}
  .ray{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--body);white-space:nowrap;
    border:1px solid var(--line);border-radius:14px;padding:2px 9px;background:var(--bg)}
  .ray b{color:var(--title);font-weight:700}

  /* ---- tick rows ---- */
  .rows{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
  button.row{font-family:inherit;text-align:left;cursor:pointer;width:100%;color:var(--title);
    background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;padding:7px 12px;
    display:flex;align-items:center;gap:11px;min-height:46px;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  button.row:not(.on):hover{background:var(--tint)}
  button.row:not(.on):hover .rid{background:var(--bg)}
  button.row.locked{cursor:default}
  button.row.locked:not(.on):hover{background:var(--bg)}
  button.row.locked:not(.on):hover .rid{background:var(--highlight)}
  html.fresh button.row:not(.on):hover{background:var(--bg)}
  button.row:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.row .box{flex:0 0 auto;width:22px;height:22px;border-radius:5px;border:1.8px solid var(--on-highlight);

  button.row .box svg.ic{width:15px;height:15px;stroke-width:2.8}

  button.row .qm{font-size:13px;line-height:1.32;color:var(--body)}
  button.row .side{flex:0 0 auto;width:150px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  button.row .tg{font-size:12.5px;font-weight:700;color:var(--on-highlight);white-space:nowrap}
  button.row.on{background:var(--highlight);border:2px solid var(--on-highlight)}
  button.row.on .box{background:var(--on-highlight)}
  button.row.on .rid{background:var(--bg)}
  button.row.on .ray{background:var(--bg)}

  /* ---- reveal ---- */
  .verdict{flex:0 0 auto;border-radius:10px;padding:7px 16px;border-left:6px solid;display:flex;flex-wrap:wrap;align-items:center;gap:3px 14px}
  .verdict.ok{background:var(--ok-tint);border-color:var(--ok)}
  .verdict.no{background:var(--no-tint);border-color:var(--no)}
  .verdict .fh{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
  .verdict.ok .fh{color:var(--ok)}
  .verdict.no .fh{color:var(--no)}
  .verdict .fh svg.ic{width:22px;height:22px;stroke-width:2}
  .verdict .ft{font-size:14px;line-height:1.38;color:var(--title)}
  .verdict.in{animation:rin var(--t-reveal) var(--ease-over) both}

  .qs{flex:0 0 auto;display:flex;flex-direction:column;gap:5px}
  .qline{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:6px 12px}
  .qline .qq{flex:1 1 auto;min-width:0;font-size:14.5px;line-height:1.3;color:var(--title);font-weight:600}
  .mk{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;white-space:nowrap;
    border-radius:14px;padding:2px 9px 2px 6px;border:1.5px solid}
  .mk svg.ic{width:14px;height:14px;stroke-width:2.6;flex:0 0 auto}
  .mk.ok{color:var(--ok);background:var(--ok-tint);border-color:var(--ok)}
  .mk.no{color:var(--no);background:var(--no-tint);border-color:var(--no)}
  .mks{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .ctab .mks{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:4px}
  .mk.nv{color:var(--on-highlight);background:var(--highlight);border-color:var(--on-highlight)}

  .why{flex:0 0 auto;background:var(--highlight);border-left:5px solid var(--on-highlight);border-radius:0 10px 10px 0;
    padding:9px 16px;display:flex;flex-direction:column;gap:5px}
  .why .wl{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .why .wl svg.ic{width:18px;height:18px}
  .why p{font-size:15px;line-height:1.42;color:var(--title)}
  .why p b{font-weight:700}
  .plain{flex:0 0 auto;font-size:13.5px;line-height:1.4;color:var(--body);display:flex;gap:7px;align-items:flex-start}
  .plain svg.ic{width:17px;height:17px;color:var(--on-highlight);flex:0 0 auto;margin-top:1px}
  .plain b{color:var(--title);font-weight:600}

  /* scope picker on the F1 screen */
  .scwrap{flex:0 0 auto;display:flex;flex-direction:column;gap:5px}
  .scwrap .sl{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .scrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  button.sc{font-family:inherit;cursor:pointer;font-size:13px;font-weight:600;color:var(--on-highlight);white-space:nowrap;
    background:var(--bg);border:1.5px dashed var(--on-highlight);border-radius:20px;padding:4px 10px 4px 7px;
    display:inline-flex;align-items:center;gap:6px;transition:background var(--t-fast) var(--ease-out)}
  button.sc svg.ic{width:17px;height:17px}
  button.sc:not(.on):hover{background:var(--tint)}
  html.fresh button.sc:not(.on):hover{background:var(--bg)}
  button.sc:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.sc.on{background:var(--on-highlight);color:var(--bg);border:1.5px solid var(--on-highlight)}
  .wait{font-size:15px;line-height:1.42;color:var(--body);font-style:italic}

  /* summary */
  .ctab{flex:0 0 auto;width:100%;border-collapse:collapse;table-layout:fixed;background:var(--bg);font-size:14px;line-height:1.35;color:var(--title)}
  .ctab th{background:var(--on-highlight);color:var(--bg);text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.03em;
    text-transform:uppercase;padding:6px 10px}
  .ctab th:nth-child(1){width:8%} .ctab th:nth-child(2){width:41%} .ctab th:nth-child(3){width:13%} .ctab th:nth-child(4){width:38%}
  .ctab td{padding:6px 10px;border-bottom:1.5px solid var(--line);vertical-align:middle}
  .ctab td:first-child{font-weight:700}
  .extra{flex:0 0 auto;font-size:14px;line-height:1.45;color:var(--body);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .extra b{color:var(--title);font-weight:600}
  .statement{flex:0 0 auto;background:var(--highlight);border-left:5px solid var(--on-highlight);border-radius:0 10px 10px 0;padding:9px 16px}
  .statement p{font-size:16px;line-height:1.38;font-weight:700;color:var(--title)}

  .gate{flex:0 0 auto;background:var(--highlight);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
  .done{font-size:15px;line-height:1.45;color:var(--title)}
  button.go{font-family:inherit;font-size:15px;font-weight:600;padding:9px 17px;border-radius:8px;cursor:pointer;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);align-self:flex-start}
  button.go:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}

  /* Added by render() only when a screen would not fit the 540px canvas
     (desktop only): slightly tighter spacing, nothing hidden. */
  .frame.tight .board{gap:5px}
  .frame.tight .rows{gap:4px}
  .frame.tight button.row{padding-top:5px;padding-bottom:5px;min-height:42px}
  .frame.tight .lead{line-height:1.36}
  .frame.tight .why{padding:7px 16px;gap:3px}
  .frame.tight .why p{line-height:1.34;font-size:14.5px}
  .frame.tight .plain{line-height:1.34}
  .frame.tight .verdict{padding-top:5px;padding-bottom:5px}
  .frame.tight .qline{padding-top:4px;padding-bottom:4px}
  .frame.tight .ctab td{padding-top:4px;padding-bottom:4px}
  .frame.tight h1{margin-bottom:5px}
  .frame.tight .bar{min-height:48px;padding-top:6px}
  .frame.tight .mks{gap:2px}
  .frame.tight .mk{padding-top:1px;padding-bottom:1px}
  /* second step, only if the first still does not fit */
  .frame.tight2{padding-top:14px}
  .frame.tight2 button.row{padding-top:4px;padding-bottom:4px}
  .frame.tight2 .rows{gap:3px}
  .frame.tight2 button.row .qm{line-height:1.26}
  .frame.tight2 .qline{padding-top:3px;padding-bottom:3px}
  .frame.tight2 .why p{font-size:14px;line-height:1.3}
  .frame.tight2 .plain{font-size:13px;line-height:1.3}
  .frame.tight2 .lead{font-size:15px;line-height:1.3}
  .frame.tight2 .board{gap:4px}
  .frame.tight2 .why{padding:6px 16px}
  .frame.tight2 .verdict{padding-top:4px;padding-bottom:4px}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:52px;padding-top:9px}
  button.nav{font-family:inherit;font-size:15px;font-weight:600;padding:9px 20px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.36;color:var(--body)}
  #hint b{color:var(--title);font-weight:600}
  .bar.ask #hint{order:-1;color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .segs i{width:22px}
    .chip{margin-left:0;font-size:13px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .sub{font-size:15px}
    .board{flex:0 0 auto;overflow:visible}
    button.row{flex-wrap:wrap;padding:10px 12px;align-items:flex-start}
    button.row .qt{flex:1 1 calc(100% - 80px)}
    button.row .qq{font-size:16px}
    button.row .qm{font-size:14.5px}
    button.row .side{width:auto;flex:1 1 100%;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px;padding-left:33px}
    .qline{flex-wrap:wrap}
    .qline .qq{flex:1 1 calc(100% - 50px);font-size:15.5px}
    .qline .ray{margin-left:44px}
    .qline .mks{margin-left:44px;flex:1 1 calc(100% - 44px);min-width:0;flex-direction:row;flex-wrap:wrap;align-items:center}
    .why p{font-size:16px}
    .plain{font-size:15px}
    .verdict .ft{font-size:15.5px}
    .ctab,.ctab tbody,.ctab tr,.ctab td{display:block;width:100%}
    .ctab thead{display:none}
    .ctab{font-size:15px;background:transparent}
    .ctab tr{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 0}
    .ctab td{border:0;padding:4px 12px}
    .ctab td::before{content:attr(data-l);display:block;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--on-highlight)}
    .extra{font-size:15px}
    .statement p{font-size:18px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{font-size:15px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

  var FIRST_REVEAL = SECTIONS.length;

  /* ---------------- state ---------------- */
  var KEY = "vciso-p4-m7-which-answers-would-you-challenge-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { ticks:{}, checked:false, scope:null }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var t = {};
      if(isPlain(raw.ticks)) ALL.forEach(function(id){ if(raw.ticks[id] === true) t[id] = true; });
      return { ticks:t, checked:raw.checked === true, scope:(ORDER.indexOf(raw.scope) >= 0) ? raw.scope : null };

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Data validation, at load, loud. */
  (function validate(){
    var p = [];

  var el = {

  /* ---------------- chrome ---------------- */
  function header(){

  /* ---- a tick screen: one section of the form ---- */

    say("Your ticks are cleared. Start again with Section A.");
  }
  el.back.addEventListener("click", function(){
    if(confirming){ confirming = false; header(); el.next.focus(); say("Your ticks are kept."); return; }
    go(-1);
  });
  el.next.addEventListener("click", function(){
    if(i === FIRST_REVEAL - 1){ st.checked = true; save(); go(1); return; }
    if(i !== S.length - 1){ go(1); return; }
    if(!confirming){ confirming = true; header(); el.next.focus(); say("This clears all your ticks. Do you want to start over?"); return; }
    startOver();
  });

  var lastPt = null;
  document.addEventListener("pointermove", function(e){
    var p = e.clientX + "," + e.clientY;
    if(lastPt !== null && p !== lastPt) document.documentElement.classList.remove("fresh");
    lastPt = p;
  }, true);
  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled && i < S.length - 1) el.next.click(); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); if(!confirming) go(-1); }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled && i < S.length - 1) el.next.click(); } else if(!confirming) go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; i = n; confirming = false; render(); return true; },
    slides:S.length,
    reset:function(){ st = fresh(); save(); i = 0; confirming = false; render(); },
    state:function(){ return { i:i, ticks:st.ticks, checked:st.checked, scope:st.scope }; }
  };
})();
</script>
</body>
</html>
