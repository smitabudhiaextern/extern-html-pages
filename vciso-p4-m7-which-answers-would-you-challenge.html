    <h2>Which Answers Would You Challenge?</h2>
    <p>This page needs JavaScript to run. Without it, here is every answer in the form that Ray returned to Meridian, section by section, and whether it should be challenged.</p>
    <p>Ticked one of the other answers? That’s fine. If you hold a file that shows a problem with it, it is fair to challenge it.</p>

    <h3>Section A: Governance</h3>
    <p><strong>Nothing in Section A needs to be challenged.</strong></p>
    <ul>
      <li>A1: Do you maintain documented information security policies? Ray’s answer: Yes. Not one of the main problems.</li>
      <li>A2: Do you maintain a list of every system that holds patient data? Ray’s answer: Yes. Not one of the main problems.</li>
      <li>A3: Do all staff complete security awareness training at least annually? Ray’s answer: Yes. Not one of the main problems.</li>
      <li>A4: Do you carry out a security risk assessment periodically? Ray’s answer: Yes. Not one of the main problems.</li>
    </ul>

    <h3>Section B: Access control</h3>
    <p><strong>In Section B, B3 should be challenged. B1, B2 and B4 are not the main problems.</strong></p>
    <ul>
      <li>B1: Is multi-factor authentication required for administrative access? Ray’s answer: Yes. Not one of the main problems.</li>
      <li>B2: Are staff required to use individual, named user accounts? Ray’s answer: Yes. Not one of the main problems.</li>
      <li>B3: Do user sessions time out automatically after a period of inactivity? Ray’s answer: Yes. <strong class="ch">Should be challenged.</strong></li>
      <li>B4: Is a staff member’s system access removed the same day they leave? Ray’s answer: Yes. Not one of the main problems.</li>
    </ul>
    <div class="box">
      <p><strong>Why B3 should be challenged.</strong></p>
      <p><strong>Ray answered Yes to B3.</strong></p>
      <p>A confident Yes with nothing behind it. Challenge it because nothing shows it’s true, the same reason you challenge any unevidenced claim.</p>
      <p><strong>Unevidenced</strong> means nothing on file backs it up.</p>
    </div>

    <h3>Section C: Data protection</h3>
    <p><strong>Nothing in Section C needs to be challenged.</strong></p>
    <ul>
      <li>C1: Is patient data backed up daily? Ray’s answer: Yes. Not one of the main problems.</li>
      <li>C2: Is backed-up data held in a separate location from the live systems? Ray’s answer: Yes. Not one of the main problems.</li>
      <li>C3: Is patient data encrypted when it is transmitted outside your network? Ray’s answer: Yes. Not one of the main problems.</li>
    </ul>

    <h3>Section D: Operations and maintenance</h3>
    <p><strong>In Section D, D1, D2 and D3 should be challenged. D4, D5 and D6 are not the main problems.</strong></p>
    <ul>
      <li>D1: Are all operating systems vendor-supported and receiving security updates? Ray’s answer: Yes. <strong class="ch">Should be challenged.</strong></li>
      <li>D2: Are security patches applied within 30 days of release? Ray’s answer: Yes. <strong class="ch">Should be challenged.</strong></li>
      <li>D3: Is end-of-life software kept off systems that handle patient data? Ray’s answer: Yes. <strong class="ch">Should be challenged.</strong></li>
      <li>D4: Is anti-malware protection installed on all servers and workstations? Ray’s answer: Yes. Not one of the main problems.</li>
      <li>D5: Is a network firewall in place between your systems and the internet? Ray’s answer: Yes. Not one of the main problems.</li>
      <li>D6: Are firewall rules reviewed on a regular schedule? Ray’s answer: Yes. Not one of the main problems.</li>
    </ul>
    <div class="box">
      <p><strong>Why D1, D2 and D3 should be challenged.</strong></p>
      <p><strong>An out-of-date state recorded as fine three separate times:</strong> D1, D2 and D3 all say Yes, in different ways.</p>
      <p>Nate’s system list says “Win Svr <span style="white-space:nowrap">2012 R2 - needs</span> replacing”. Windows Server 2012 R2 has been out of support since October 2023, which made D1 false when Ray signed on 9 May 2025 (Windows 10 support has since lapsed too), and patching is far behind.</p>
      <p><strong>OS</strong> means operating system, the main software that runs a computer, such as Windows. Windows Server 2012 R2 is an older Windows made for server computers. <strong>Out of support</strong>, also called end-of-life, means the maker no longer sends security fixes for it. <strong>Lapsed</strong> means ended. <strong>Patching</strong> means putting those fixes in. Nate’s system list is the list of Cumberland’s machines that you used in Project 1.</p>
    </div>

    <h3>Section E: Incidents</h3>
    <p><strong>Nothing in Section E needs to be challenged.</strong></p>
    <ul>
      <li>E1: Do you have a documented incident response process? Ray’s answer: Yes. Not one of the main problems.</li>
      <li>E2: Have you experienced a security incident in the last 24 months? Ray’s answer: No. Not one of the main problems.</li>
    </ul>

    <h3>Section F: Suppliers</h3>
    <p><strong>In Section F, F1 should be challenged. F2 is not one of the main problems.</strong></p>
    <ul>
      <li>F1: Do third-party suppliers require your authorization before changing production systems? Ray’s answer: Yes. <strong class="ch">Should be challenged.</strong></li>
      <li>F2: Are third parties assessed for security before you engage them? Ray’s answer: Yes. Not one of the main problems.</li>
    </ul>
    <div class="box">
      <p><strong>Why F1 should be challenged.</strong></p>
      <p><strong>Ray answered Yes to F1.</strong></p>
      <p>What your Inventory tab shows depends on your scope.</p>

        <li><strong>Scope A: Claims Intake.</strong> Your Inventory tab shows two outside companies with standing access to Cumberland’s systems, Ridgeline IT and the MedFlow vendor, and no owner recorded for either. Nothing you hold shows anyone authorizing their changes.</li>
        <li><strong>Scope B: Payments and Remittance, Scope C: Patient Records and Archive, and Scope D: Remote and Corporate.</strong> Your Inventory tab shows an outside company, Ridgeline IT, with standing access to Cumberland’s systems and no owner recorded. Nothing you hold shows anyone authorizing its changes.</li>
      </ul>
      <p><strong>Standing access</strong> means access that is always switched on, not granted one visit at a time. Ridgeline IT is Cumberland’s part-time outside IT provider. The MedFlow vendor is the company behind MedFlow, Cumberland’s billing and claims platform. <strong>No owner recorded</strong> means no one at Cumberland is named as in charge of that access. <strong>Authorizing</strong> means giving permission.</p>

  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.key === "Escape" && confirming){ e.preventDefault(); cancelOver(); return; }
    if(confirming) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled && !el.next.hidden) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null || confirming) { tx = null; return; }
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled && !el.next.hidden) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", function(){ fit(); scrollHint(); });

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; i = n; confirming = false; render(); return true; },
    slides:S.length,
    data:{ SECTIONS:SECTIONS, GROUPS:GROUPS },
    reset:function(){ st = fresh(); i = 0; confirming = false; render(); },
    state:function(){ return { i:i, ticks:st.ticks, scope:st.scope, confirming:confirming }; }
  };
})();
</script>
</body>
</html>
