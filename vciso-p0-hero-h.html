<!DOCTYPE html>
<html lang="en" class="nojs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security is what you can prove</title>
<style>
/* ===================================================================
   vCISO externship, orientation hero. Four beat loop.

   BUILD NOTE ON COMMENTS. This program bans the em dash AND the two
   hyphen sequence everywhere in the file. HTML comment syntax is built
   out of two hyphens, so this file carries no HTML comments at all.
   Every note lives in a CSS or JS block comment instead, and the CSS
   custom property syntax (also two hyphens) is avoided: the five
   palette hex values are written out literally each time.

   PALETTE, the whole system, no sixth value:
     #DCE1FF  highlight container
     #001D69  on highlight: the caret, the question, the dashed panel
     #FDF8F8  background, the canvas
     #484646  body and subtle copy
     #1C1B1B  titles and primary text

   THE FOUR BEATS, and why this order. A company makes a claim. The
   supervisor asks the one question this program is built on. The
   evidence panel arrives and it is empty, which is the whole point:
   the claim is true and still cannot be shown. Then the idea, stated.
   =================================================================== */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  background:radial-gradient(circle at 46% 44%,#FDF8F8 0%,#FDF8F8 36%,#DCE1FF 100%);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#484646;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* 960 x 540 canvas. Scaled down to fit, never up. flex:0 0 auto stops
   the canvas being shrunk by the flex container and then scaled again. */
#stage{
  width:960px;height:540px;position:relative;
  transform-origin:center center;flex:0 0 auto;
}

/* VERTICAL BUDGET, measured at 960x540. Claim runs to two lines at
   96px, question 32, evidence label 18, evidence panel 92, closing 26,
   plus the gaps below. Total content 348px inside 404px of usable
   height, so the composed state never touches the frame. */
#frame{
  position:absolute;inset:0;
  padding:74px 68px 62px;
  display:flex;flex-direction:column;justify-content:center;
}

/* ===== beat 1, the claim ===== */
/* The quotation marks are part of the copy, not decoration: the line
   is something a company said, and it has to read as speech. */
.claim{
  font-size:38px;line-height:1.26;font-weight:600;color:#1C1B1B;
  max-width:820px;min-height:96px;
  letter-spacing:-0.01em;
}
.caret{
  display:inline-block;width:2px;height:0.92em;
  background:#001D69;vertical-align:-0.12em;margin-left:3px;
  animation:blink 1s steps(1,end) infinite;
}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
.caret.off{display:none}

/* ===== beats 2 to 4, each rises into place ===== */
/* One shared class. Nothing fades alone: every element travels a short
   distance as it arrives, so the sequence reads as one movement. */
.beat{
  opacity:0;transform:translateY(14px);
  transition:opacity 520ms cubic-bezier(.2,.7,.3,1),
             transform 520ms cubic-bezier(.2,.7,.3,1);
}
.beat.in{opacity:1;transform:none}

.question{
  margin-top:26px;
  font-size:24px;line-height:1.4;color:#001D69;font-weight:500;
}

.evidence{margin-top:30px;max-width:560px}
.elabel{
  display:block;
  font-size:12px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:#001D69;
  margin-bottom:8px;
}
/* Deliberately empty, and it has to read that way rather than as a
   panel still loading. A dashed edge says "nothing was ever put here",
   where a solid edge with a spinner would say "wait". */
.ebox{
  height:92px;border-radius:10px;
  border:1.5px dashed #001D69;
  background:#FDF8F8;
}

.closing{
  margin-top:34px;
  font-size:19px;line-height:1.5;color:#484646;
}
.closing strong{color:#1C1B1B;font-weight:600}

/* ===== portrait layout, under 600px ===== */
/* Not a shrunken slide. Type steps down, the canvas gives up its fixed
   height, and the page itself scrolls. Dropping flex on body removes
   the min-width floor that would stop the canvas shrinking. */
@media (max-width:599px){
  body{display:block;overflow:visible;overflow-x:hidden}
  #stage{
    width:100%!important;max-width:100%!important;min-width:0!important;
    height:auto!important;transform:none!important;
  }
  #frame{position:relative;inset:auto;padding:34px 20px 40px;min-height:118vw}
  .claim{font-size:25px;min-height:0;max-width:none}
  .question{font-size:18px;margin-top:20px}
  .evidence{margin-top:24px;max-width:none}
  .ebox{height:70px}
  .closing{font-size:16px;margin-top:26px}
}

/* ===== reduced motion: no sequence, no loop, everything at rest ===== */
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .beat{opacity:1;transform:none}
  .caret{display:none}
}

/* ===== no script: the composed state as a plain document ===== */
/* The canvas is a fixed 540px box that only the fit() script can size,
   so with scripting off it is replaced by a scrollable page carrying
   all four lines at once. */
.nojs #stage{display:none}
.nojs,.nojs body{height:auto;display:block;overflow:visible}
.fallback{max-width:640px;margin:0 auto;padding:34px 22px 44px}
.fallback .claim{font-size:26px;min-height:0;max-width:none}
.fallback .beat{opacity:1;transform:none}
.fallback .evidence{max-width:none}
</style>
<script>
/* Runs before the body paints, so the static fallback never flashes for
   a reader who does have JavaScript. */
document.documentElement.className="";
</script>
</head>
<body>

<div id="stage">
  <div id="frame" role="img" aria-label="A company says: we review our firewall settings every quarter. The question back is: how would you prove that? The evidence panel is empty. Security is what you can prove, not what you claim.">

    <p class="claim" aria-hidden="true"><span id="typed"></span><span class="caret" id="caret"></span></p>

    <p class="question beat" id="b2" aria-hidden="true">"How would you prove that?"</p>

    <div class="evidence beat" id="b3" aria-hidden="true">
      <span class="elabel">Evidence</span>
      <div class="ebox"></div>
    </div>

    <p class="closing beat" id="b4" aria-hidden="true">Security is <strong>what you can prove</strong>, not what you claim.</p>

  </div>
</div>

<noscript>
  <div class="fallback">
    <p class="claim">"We review our firewall settings every quarter."</p>
    <p class="question beat">"How would you prove that?"</p>
    <div class="evidence beat">
      <span class="elabel">Evidence</span>
      <div class="ebox"></div>
    </div>
    <p class="closing beat">Security is <strong>what you can prove</strong>, not what you claim.</p>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  var CLAIM = '"We review our firewall settings every quarter."';

  var typed  = document.getElementById("typed");
  var caret  = document.getElementById("caret");
  var beats  = [document.getElementById("b2"),
                document.getElementById("b3"),
                document.getElementById("b4")];

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Reduced motion gets the composed state and no timers at all. The
     loop is the thing that would be uncomfortable, not the fade. */
  if (reduce){
    typed.textContent = CLAIM;
    beats.forEach(function(el){ el.classList.add("in"); });
    fitOnce();
    return;
  }

  /* THE TIMELINE, in milliseconds from the top of each cycle.
     Typing runs 34ms per character, so the claim lands at about 1600.
     Everything after it is spaced far enough apart to be read, and the
     cycle holds on the full composed state for two seconds before it
     resets. Total 11200. */
  var TYPE_STEP = 34;
  var AT_QUESTION = 2150;
  var AT_EVIDENCE = 3500;
  var AT_CLOSING  = 6100;
  var CYCLE       = 11200;

  var timers = [];

  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }

  function clearTimers(){
    timers.forEach(function(t){ clearTimeout(t); });
    timers = [];
  }

  function type(i){
    if (i > CLAIM.length) { caret.classList.add("off"); return; }
    typed.textContent = CLAIM.slice(0, i);
    at(TYPE_STEP, function(){ type(i + 1); });
  }

  function cycle(){
    clearTimers();
    typed.textContent = "";
    caret.classList.remove("off");
    beats.forEach(function(el){ el.classList.remove("in"); });

    type(0);
    at(AT_QUESTION, function(){ beats[0].classList.add("in"); });
    at(AT_EVIDENCE, function(){ beats[1].classList.add("in"); });
    at(AT_CLOSING,  function(){ beats[2].classList.add("in"); });
    at(CYCLE, cycle);
  }

  /* Scale the fixed canvas down to fit its container, never up. The
     portrait layout under 600px opts out entirely. */
  var stage = document.getElementById("stage");
  var portrait = window.matchMedia("(max-width:599px)");

  function fit(){
    if (portrait.matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  function fitOnce(){ window.addEventListener("resize", fit); fit(); }

  fitOnce();
  cycle();
})();
</script>
</body>
</html>
