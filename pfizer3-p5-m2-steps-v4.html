<head>

<title>P5 Gemini Chatbot Steps</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap">
<style>
/* P5 module 2, "Try It Yourself": run Chaitanya's notebook "Build a Simple Chatbot with LlamaIndex" (Drive
   1YkZ7eKaVCkpN3SjKYd505B2_48DnaDP9, his original, unchanged: Smita's decision 9, p5-decisions.md), STEP 1 to STEP 6.
   Built by m2-steps-build.py (06-content/project-05/source/) from the real Colab run in a2-notebook-and-runs.md.
   Shell (stage, rail, Back and Next, spacing) copied from the P4 module 2 Try deck. No Copy buttons: every cell is
   already in his notebook. Short slides sit centred in the card (fix round 1, 22 Nov 2026).
   Code blocks equal his notebook cells exactly; text is his Notion page (6411) for each step. Ours: titles, labels,
   "What this code does" bullets, "now holds" notes, click instructions, notes on the real output, the API tip.
   Fixed stage 760 x 1140 (frames under 560 px wide: 450 x 1240), scaled as one piece so nothing scrolls.
   Look: Pfizer x Extern Core, Light format; every color, size, radius and font comes from design-system/tokens.json. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* The design stage, scaled and centred by the script at the end */
.app{position:absolute;left:50%;top:50%;width:760px;height:1140px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: step rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:13px;font-weight:500;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}
.narrow .top{grid-template-columns:minmax(0,1fr);row-gap:8px}
.narrow .where{order:0}
.narrow .pg-word{display:none}
.narrow .pg.pg-fit{flex:none}

/* Slide area and slide */
.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}
.narrow .stage{padding:10px 0}
.narrow .card{padding:18px 16px;border-left:0;border-right:0;border-radius:0}
.inner{flex:none;display:flex;flex-direction:column;gap:var(--space-3);width:100%}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding-bottom:3px;color:var(--ink);text-wrap:balance}
.narrow .title{font-size:28px;line-height:34px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:15px;line-height:22px;color:var(--ink);text-wrap:pretty}
.p b{font-weight:600}
.p code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.p code.nw,.list code.nw{white-space:nowrap}
.list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:22px;text-wrap:pretty}
.list b{font-weight:600}
.list code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.list li::marker{color:var(--step-label);font-weight:600}
.see{margin-top:4px}

/* Buttons (design system Button, Light) */
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* Run card: a notebook cell (no Copy button: the cells are already in the notebook), or the one cell students add (Copy button) */
.run{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin:0}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:6px 8px 6px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:12px 14px;font-family:var(--font-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out{border-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:6px 12px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}
.narrow .run pre{font-size:13px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.narrow .run.out pre{font-size:12px}

/* The Colab screenshot: the full width of the card (edge to edge), opens full size in a new tab.
   Under 560 px the card itself runs edge to edge, so the picture is as wide as the frame. */
.shot{margin:0 calc(-1 * var(--space-5));border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;line-height:0;background:var(--surface)}
.narrow .shot{margin:0 -16px}
.shot a{display:block}
.shot img{display:block;width:100%;height:auto}
.shot-cap{margin:-6px 0 0;font-size:13px;line-height:18px;color:var(--gray-600)}

/* A picture of the page (slide 14: the table in foo.pdf): framed like the output blocks, as wide as the text */
.pagepic{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;line-height:0;background:var(--surface)}
.pagepic a{display:block}
.pagepic img{display:block;width:100%;height:auto}

/* Table and analysis box (from the Learn deck) */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.4}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:6px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--card-text)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.m{font-family:var(--font-mono);font-size:13px;color:var(--ink);white-space:nowrap}
.tbl td code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .tbl table{font-size:13px}
.narrow .tbl td,.narrow .tbl th{padding:5px 8px}
.concl{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px;font-size:15px;line-height:22px;color:var(--card-text)}
.concl b{font-weight:600;color:var(--card-title)}
.concl p{margin:0}
.concl p + p{margin-top:6px}
.concl code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}


/* A smaller code font for the long function in Step 3 (from the 11 November module 9 steps deck) */
.run.small pre{font-size:12px;line-height:1.32;padding:8px 14px}
.narrow .run.small pre{font-size:10.5px;line-height:1.35}

/* Tip box (from the 11 November module 9 Learn deck): pale-blue card, Pfizer blue bulb in a white square */
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px}
.tip-icon{flex:none;width:30px;height:30px;border-radius:var(--radius-xs);background:var(--surface);display:grid;place-items:center;color:var(--pfizer-blue)}
.tip-icon svg{width:18px;height:18px}
.tip p{margin:0;font-size:15px;line-height:22px;color:var(--card-text);text-wrap:pretty}
.tip b{font-weight:600;color:var(--card-title)}

/* Last slide: his closing line and Key Takeaway (takeaway box copied from the module 7 cheat sheet slide) */
.inner.end-slide{gap:var(--space-4)}
.end-slide .p{font-size:17px;line-height:1.55}
.take{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:14px 18px;font-size:17px;line-height:1.55;color:var(--card-text)}
.take b{font-weight:700;color:var(--card-title)}
.take code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .take{font-size:15px;padding:12px 16px}
.narrow .end-slide .p{font-size:16px}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:22px;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.foot .btn{padding:10px 16px;font-size:15px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
.narrow .upnext{visibility:hidden}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }

/* Added for P4 module 2 (copied from the P3 module 8 Try deck): "now holds" note, the SME's callout box, the Quick Recap size */
.holds{margin:0;display:flex;align-items:center;gap:8px;background:var(--surface-card);border-left:4px solid var(--pfizer-blue);border-radius:var(--radius-xs);padding:7px 12px;font-size:14px;line-height:20px;font-weight:600;color:var(--card-title)}
.holds code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px}
.holds svg{width:16px;height:16px;flex:none;color:var(--pfizer-blue)}
.note{border:1.5px solid var(--ink);border-radius:var(--radius-sm);padding:9px 14px}
.note .num{display:block;margin-bottom:3px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.note p{margin:0;font-size:15px;line-height:1.48;color:var(--ink-muted)}
.note b{font-weight:600;color:var(--ink)}
.recap-slide .list{font-size:17px;line-height:1.55;gap:14px}
.recap-slide .list ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.recap-slide .list ul li::marker{color:var(--ink-muted)}
.narrow .recap-slide .list{font-size:15.5px;gap:10px}
/* Many steps in the rail: numbers only */
.pg-word{display:none}
.pg-label{text-align:center}
.pg.pg-fit{flex:none}
.pg.pg-fit .pg-label{text-align:left}
/* Under 560 px there is no room for the 7 group labels: the rail shows only the progress bars, and "Step N" sits beside the count */
.narrow .pg-label{display:none}
.narrow .pg.pg-fit{flex:1 1 0}
/* Code and output: Project 3's size (fix pass, 22 November 2026: 14 px on the 760 stage, 13 px at the 708 px column; 13 px on
   the narrow stage). Long lines wrap, so nothing scrolls; long cells and outputs are cut over more slides instead */
.run pre{white-space:pre-wrap;overflow-wrap:anywhere}
.run.out pre{font-size:14px;line-height:1.5}
.narrow .run pre,.narrow .run.out pre{font-size:13px}
/* F02: zoomed crops of one strip of the page, before and after a step */
.zoom{margin:0;display:flex;flex-direction:column;gap:6px}
.zoom a{display:block;line-height:0}
.zoom img{display:block;height:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--radius-xs)}
/* The STEP 15 JSON: the 3 heading lines across the top, the JSON in two columns (same text, same order) */
.run.out.json pre.head{padding-bottom:0}
.run.out.json pre.cols{column-count:2;column-gap:24px;padding-top:4px}
.narrow .run.out.json pre.cols{column-gap:12px;font-size:10.5px}
/* A page picture from Colab (tall): shown smaller and centred, so the slide stays short; opens full size */
.shot.tall{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.shot.tall img{width:auto;max-width:100%;height:var(--pic-h,480px);margin:0 auto}
.narrow .shot.tall{margin:0}
.narrow .shot.tall img{height:var(--pic-hn,520px)}
/* q3 Proposal A: two Colab page pictures side by side (STEP 6 + 7, STEP 8 + 9), each with its own notes under it */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.half{display:flex;flex-direction:column;gap:8px;min-width:0}
.half-head{margin:0;font-size:13px;line-height:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label)}
.half .p{margin:0}
.half .list{font-size:14.5px;line-height:1.45;gap:4px}
.half code{overflow-wrap:anywhere}
.pair-slide .shot.tall img{width:auto;height:auto;max-width:100%;max-height:330px}
.narrow .pair{gap:10px}
.narrow .pair-slide .shot.tall img{height:auto;max-height:300px}
.narrow .half .list{font-size:13.5px}
.pic-sm .shot.tall img{height:435px}

/* Fix round 1: each code line is its own block, so a wrapped line keeps a hanging indent (its own indent plus 2) */
.run pre code{display:block}
.run pre .ln{display:block;padding-left:calc(var(--i) + 2ch);text-indent:calc(-1 * (var(--i) + 2ch))}
.run pre .ln:empty::before{content:"\200b"}
/* P5 m2: pictures of Colab parts (pop-up, Secrets panel) shown at a readable size, centred, opening full size */
.shot.pic{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm)}
.shot.pic img{width:auto;max-width:100%;max-height:var(--pic-max,500px);margin:0 auto}
.narrow .shot.pic img{max-height:var(--pic-max-n,360px)}
.p a{color:var(--pfizer-blue);text-underline-offset:2px}
.list a{color:var(--pfizer-blue);text-underline-offset:2px}
</style>
</head>

<div class="app" id="app">
  <h1 class="sr-only">Your First Gemini Chatbot: The Steps</h1>
  <header class="top">
    <nav class="rail" id="rail" aria-label="Steps"></nav>
    <div class="where"><b id="where-section">Start</b><span aria-hidden="true">&middot;</span><span id="where-count">Slide 1</span></div>
  </header>
  <main class="stage" aria-label="Slide"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-secondary" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-primary" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>

<template id="t1">
<p class="p">In this section, we'll <b>set up a simple chatbot</b> using <b>LlamaIndex + Gemini</b>.</p><ul class="list"><li>This chatbot will <b>not</b> use document retrieval yet, just basic question-answering.</li><li>We'll first set up our API keys and then write a basic chatbot in Python.</li></ul><p class="p">All the code discussed in this section is available in this Colab file:</p><div class="links"><a class="btn btn-secondary" href="https://colab.research.google.com/drive/1YkZ7eKaVCkpN3SjKYd505B2_48DnaDP9" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Build a Simple Chatbot with LlamaIndex (Colab notebook)</span><span class="sr-only"> (opens in a new tab)</span></a></div><ol class="list"><li>Open the notebook and click <b>File &rarr; Save a copy in Drive</b>. Work in the copy that opens.</li><li>Run the cells in order, from top to bottom. Each one starts with a comment (a note after <code>#</code>), such as <code class="nw"># STEP 1</code>.</li><li>Every code block on these slides is already in your notebook, so you don't copy or type any code. Just press <b>Run</b> on each cell when a slide asks you to.</li></ol>
</template>

<template id="t2">
<p class="p"><b>Step 1: Install Required Libraries:</b> Before we start coding, we need to install the necessary libraries. Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 1</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 1: Install Required Libraries</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Installing the tools (libraries) we need to build our chatbot.</span><span class="ln" style="--i:0ch"># Think of this like downloading apps before you can use them.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># LlamaIndex helps AI find and use information from documents.</span><span class="ln" style="--i:0ch"># Gemini is Google&#x27;s AI model that will power our chatbot&#x27;s responses.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># A bunch of download progress bars — that&#x27;s normal! Wait until it finishes.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">!pip install -q llama-index==0.14.25 llama-index-llms-google-genai==0.11.3</span><span class="ln" style="--i:0ch">!pip install -q nest_asyncio</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>!pip install</code> downloads a library into your Colab session. The <code>!</code> sends the line to Colab's command line instead of to Python.</li><li><code>==0.14.25</code> and <code>==0.11.3</code> pick exact versions, the ones this notebook was tested with.</li><li><code>-q</code> means quiet: pip prints only errors, not every download.</li><li><code>nest_asyncio</code> is a small helper library that Step 3 switches on.</li></ul>

<template id="t4">
<p class="p"><b>Step 2: Set Up API Keys:</b> To use <b>Gemini</b>, we need to set up an API key.</p><ul class="list"><li><b>Why?</b> You're setting up an API key because it's like a password that lets your chatbot talk to <b>Gemini</b>. Without it, your chatbot won't be able to ask Gemini questions or get responses. The API key tells Google that <b>you have permission</b> to use their AI services.</li><li>Think of it like getting a Wi-Fi password. Without it, you can't connect to the internet!</li></ul><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p>API stands for Application Programming Interface: the door one program uses to talk to another. Here, your notebook talks to Gemini through Google's API.</p></div>
</template>

<template id="t7">
<p class="p">Run the cell below. Your notebook can now use the key without it ever appearing in your code. Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 2</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 2: Set Up Your Gemini API Key</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Giving our program the &quot;password&quot; (API key) it needs to talk to Google&#x27;s Gemini AI.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Without an API key, Gemini won&#x27;t respond to our requests.</span><span class="ln" style="--i:0ch"># It&#x27;s like needing a library card before you can borrow books.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output — that&#x27;s expected! The key is saved silently.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># TROUBLESHOOTING:</span><span class="ln" style="--i:0ch"># - If you get &quot;API key not valid&quot; later, double-check your key at</span><span class="ln" style="--i:0ch">#   https://aistudio.google.com/app/apikey</span><span class="ln" style="--i:0ch"># - Make sure there are no extra spaces in your key</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">import os</span><span class="ln" style="--i:0ch">from google.colab import userdata</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Reads your key from Colab Secrets (the key icon in the left sidebar).</span><span class="ln" style="--i:0ch"># Never paste your key into a code cell.</span><span class="ln" style="--i:0ch">os.environ[&quot;GOOGLE_API_KEY&quot;] = userdata.get(&#x27;GEMINI_API_KEY&#x27;)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>userdata.get('GEMINI_API_KEY')</code> reads your key from Colab Secrets.</li><li><code>os.environ["GOOGLE_API_KEY"] = ...</code> saves it where the Gemini library looks for a key.</li></ul>
</template>

<template id="t10">
<p class="p"><b>Create a Simple Chatbot.</b> Now, let's <b>initialize the chatbot</b> using <b>LlamaIndex + Gemini</b>. Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 3</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 3: Import the Tools We Need</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Loading the specific parts of LlamaIndex we&#x27;ll use — the Gemini</span><span class="ln" style="--i:0ch"># connection and the chat message format.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Python needs you to explicitly load each tool before using it,</span><span class="ln" style="--i:0ch"># like pulling specific tools out of a toolbox.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output — imports are silent unless there&#x27;s an error.</span><span class="ln" style="--i:0ch"># If you see &quot;ModuleNotFoundError&quot;, go back and re-run Step 1.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">from llama_index.llms.google_genai import GoogleGenAI</span><span class="ln" style="--i:0ch">from llama_index.core.llms import ChatMessage</span><span class="ln" style="--i:0ch">import nest_asyncio</span><span class="ln" style="--i:0ch">nest_asyncio.apply()</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>GoogleGenAI</code> is LlamaIndex's connection to Gemini.</li><li><code>ChatMessage</code> holds one message in the chat, with who said it (<code>role</code>) and what they said (<code>content</code>).</li><li><code>nest_asyncio.apply()</code> lets LlamaIndex's chat calls run inside Colab's notebook.</li></ul>
</template>

<template id="t12">
<p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 4</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 4: Connect to the Gemini AI Model</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Creating a connection to Google&#x27;s Gemini 3.5 Flash-Lite model.</span><span class="ln" style="--i:0ch"># This is the AI &quot;brain&quot; that will generate our chatbot&#x27;s responses.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Gemini Flash is fast and free — perfect for learning and experimenting.</span><span class="ln" style="--i:0ch"># In a real company, you might use a more powerful (and expensive) model.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output — the model is ready and waiting for questions.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">llm = GoogleGenAI(model=&quot;gemini-3.5-flash-lite&quot;)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>GoogleGenAI(model="gemini-3.5-flash-lite")</code> picks the Gemini model that will answer. It uses the key you saved in Step 2.</li><li><code>llm</code> is short for large language model, the kind of AI behind chatbots.</li></ul>
</template>

<template id="t14">
<p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 5</code>. Here is the top of the cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 5: Build the Chatbot Function</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Creating the main chatbot — a loop that takes your questions,</span><span class="ln" style="--i:0ch"># sends them to Gemini, and prints the AI&#x27;s response.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># This is the core of any chatbot! The conversation history (messages list)</span><span class="ln" style="--i:0ch"># lets the AI remember what you talked about earlier in the conversation.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># Nothing yet — we&#x27;re just defining the function. We&#x27;ll run it in the next step.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">def simple_chatbot():</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    A simple interactive chatbot using Gemini with LlamaIndex.</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    print(&quot;Simple Gemini Chatbot&quot;)</span><span class="ln" style="--i:4ch">    print(&quot;Type &#x27;exit&#x27; to end the conversation&quot;)</span><span class="ln" style="--i:4ch">    print(&quot;-&quot; * 50)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Initialize chat history — this stores the conversation so far</span><span class="ln" style="--i:4ch">    messages = []</span><span class="ln" style="--i:0ch"></span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>def simple_chatbot():</code> defines a function (a named block of code you can run later). Nothing runs yet.</li><li><code>messages = []</code> starts an empty list. It will hold the whole chat, so Gemini can see what you talked about earlier.</li></ul>
</template>

<template id="t15">
<p class="p">Here's the middle of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; middle of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:4ch">    while True:</span><span class="ln" style="--i:8ch">        # Get user input</span><span class="ln" style="--i:8ch">        user_input = input(&quot;\nYou: &quot;)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:8ch">        # Check for exit command</span><span class="ln" style="--i:8ch">        if user_input.lower() in [&quot;exit&quot;, &quot;quit&quot;, &quot;bye&quot;]:</span><span class="ln" style="--i:12ch">            print(&quot;\nChatbot: Goodbye! Have a great day!&quot;)</span><span class="ln" style="--i:12ch">            break</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:8ch">        # Handle empty input</span><span class="ln" style="--i:8ch">        if not user_input.strip():</span><span class="ln" style="--i:12ch">            print(&quot;(Please type a question, or type &#x27;exit&#x27; to quit.)&quot;)</span><span class="ln" style="--i:12ch">            continue</span><span class="ln" style="--i:0ch"></span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>while True:</code> repeats until <code>break</code>. Each time, <code>input()</code> waits for you to type a question.</li><li><code>exit</code>, <code>quit</code> or <code>bye</code> ends the chat. An empty line asks you to type again.</li></ul>
</template>

<template id="t16">
<p class="p">And here's the end of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; end of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:8ch">        # Add user message to history</span><span class="ln" style="--i:8ch">        messages.append(ChatMessage(role=&quot;user&quot;, content=user_input))</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:8ch">        try:</span><span class="ln" style="--i:12ch">            # Send the full conversation to Gemini and get a response</span><span class="ln" style="--i:12ch">            response = llm.chat(messages)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:12ch">            # Print the response</span><span class="ln" style="--i:12ch">            print(f&quot;\nChatbot: {response.message.content}&quot;)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:12ch">            # Add assistant response to history so it remembers this exchange</span><span class="ln" style="--i:12ch">            messages.append(ChatMessage(role=&quot;assistant&quot;, content=response.message.content))</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:8ch">        except Exception as e:</span><span class="ln" style="--i:12ch">            print(f&quot;\nError: {e}&quot;)</span><span class="ln" style="--i:12ch">            print(&quot;Please try again or check your API key&quot;)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>llm.chat(messages)</code> sends the whole chat to Gemini. Its answer is printed and added to the list.</li><li><code>try</code> and <code>except</code> catch any error, print it and keep the chat going.</li></ul><p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot"><a href="pfizer3-p5-m2-try-s5-out.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p5-m2-try-s5-out.png" width="1096" height="158" alt="The STEP 5 cell in Colab after it ran: a green tick and no output."><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure><p class="p">Nothing yet. We're just defining the function. We'll run it in the next step.</p><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span><code>simple_chatbot</code> now holds: the chatbot, ready to start in Step 6.</span></p>

<template id="t17">

<script>
(function () {
  "use strict";
  var CELLS = {"step1": "# ============================================\n# STEP 1: Install Required Libraries\n# ============================================\n#\n# WHAT WE'RE DOING:\n# Installing the tools (libraries) we need to build our chatbot.\n# Think of this like downloading apps before you can use them.\n#\n# WHY THIS MATTERS:\n# LlamaIndex helps AI find and use information from documents.\n# Gemini is Google's AI model that will power our chatbot's responses.\n#\n# WHAT YOU'LL SEE:\n# A bunch of download progress bars \u2014 that's normal! Wait until it finishes.\n# ============================================\n!pip install -q llama-index==0.14.25 llama-index-llms-google-genai==0.11.3\n!pip install -q nest_asyncio", "step2": "# ============================================\n# STEP 2: Set Up Your Gemini API Key\n# ============================================\n#\n# WHAT WE'RE DOING:\n# Giving our program the \"password\" (API key) it needs to talk to Google's Gemini AI.\n#\n# WHY THIS MATTERS:\n# Without an API key, Gemini won't respond to our requests.\n# It's like needing a library card before you can borrow books.\n#\n# WHAT YOU'LL SEE:\n# No output \u2014 that's expected! The key is saved silently.\n#\n# TROUBLESHOOTING:\n# - If you get \"API key not valid\" later, double-check your key at\n#   https://aistudio.google.com/app/apikey\n# - Make sure there are no extra spaces in your key\n# ============================================\nimport os\nfrom google.colab import userdata\n\n# Reads your key from Colab Secrets (the key icon in the left sidebar).\n# Never paste your key into a code cell.\nos.environ[\"GOOGLE_API_KEY\"] = userdata.get('GEMINI_API_KEY')", "step3": "# ============================================\n# STEP 3: Import the Tools We Need\n# ============================================\n#\n# WHAT WE'RE DOING:\n# Loading the specific parts of LlamaIndex we'll use \u2014 the Gemini\n# connection and the chat message format.\n#\n# WHY THIS MATTERS:\n# Python needs you to explicitly load each tool before using it,\n# like pulling specific tools out of a toolbox.\n#\n# WHAT YOU'LL SEE:\n# No output \u2014 imports are silent unless there's an error.\n# If you see \"ModuleNotFoundError\", go back and re-run Step 1.\n# ============================================\nfrom llama_index.llms.google_genai import GoogleGenAI\nfrom llama_index.core.llms import ChatMessage\nimport nest_asyncio\nnest_asyncio.apply()", "step4": "# ============================================\n# STEP 4: Connect to the Gemini AI Model\n# ============================================\n#\n# WHAT WE'RE DOING:\n# Creating a connection to Google's Gemini 3.5 Flash-Lite model.\n# This is the AI \"brain\" that will generate our chatbot's responses.\n#\n# WHY THIS MATTERS:\n# Gemini Flash is fast and free \u2014 perfect for learning and experimenting.\n# In a real company, you might use a more powerful (and expensive) model.\n#\n# WHAT YOU'LL SEE:\n# No output \u2014 the model is ready and waiting for questions.\n# ============================================\nllm = GoogleGenAI(model=\"gemini-3.5-flash-lite\")", "step5": "# ============================================\n# STEP 5: Build the Chatbot Function\n# ============================================\n#\n# WHAT WE'RE DOING:\n# Creating the main chatbot \u2014 a loop that takes your questions,\n# sends them to Gemini, and prints the AI's response.\n#\n# WHY THIS MATTERS:\n# This is the core of any chatbot! The conversation history (messages list)\n# lets the AI remember what you talked about earlier in the conversation.\n#\n# WHAT YOU'LL SEE:\n# Nothing yet \u2014 we're just defining the function. We'll run it in the next step.\n# ============================================\ndef simple_chatbot():\n    \"\"\"\n    A simple interactive chatbot using Gemini with LlamaIndex.\n    \"\"\"\n    print(\"Simple Gemini Chatbot\")\n    print(\"Type 'exit' to end the conversation\")\n    print(\"-\" * 50)\n\n    # Initialize chat history \u2014 this stores the conversation so far\n    messages = []\n\n    while True:\n        # Get user input\n        user_input = input(\"\\nYou: \")\n\n        # Check for exit command\n        if user_input.lower() in [\"exit\", \"quit\", \"bye\"]:\n            print(\"\\nChatbot: Goodbye! Have a great day!\")\n            break\n\n        # Handle empty input\n        if not user_input.strip():\n            print(\"(Please type a question, or type 'exit' to quit.)\")\n            continue\n\n        # Add user message to history\n        messages.append(ChatMessage(role=\"user\", content=user_input))\n\n        try:\n            # Send the full conversation to Gemini and get a response\n            response = llm.chat(messages)\n\n            # Print the response\n            print(f\"\\nChatbot: {response.message.content}\")\n\n            # Add assistant response to history so it remembers this exchange\n            messages.append(ChatMessage(role=\"assistant\", content=response.message.content))\n\n        except Exception as e:\n            print(f\"\\nError: {e}\")\n            print(\"Please try again or check your API key\")", "step6": "# ============================================\n# STEP 6: Run Your Chatbot!\n# ============================================\n#\n# WHAT WE'RE DOING:\n# Starting the chatbot so you can have a conversation with Gemini.\n#\n# WHY THIS MATTERS:\n# This is the moment of truth \u2014 you're running your first AI chatbot!\n#\n# WHAT YOU'LL SEE:\n# A \"You: \" prompt where you can type questions.\n# Type any question and press Enter to get a response.\n# Type \"exit\" to stop the chatbot.\n#\n# TRY THESE QUESTIONS:\n# - \"What is artificial intelligence?\"\n# - \"Explain RAG in simple terms\"\n# - \"What is a pharmaceutical SDF document?\"\n# ============================================\nif __name__ == \"__main__\":\n    simple_chatbot()"};

    {"group": "Step 2", "label": "STEP 2 &middot; PART 2 OF 6: GET YOUR KEY", "title": "Get a Free Gemini API <span class=\"hl\">Key</span>", "plain": "Step 2. Get a Free Gemini API Key (Part 2 of 6)", "tpl": "t5", "cls": "end-slide"},
    {"group": "Step 2", "label": "STEP 2 &middot; PART 3 OF 6: SAVE YOUR KEY", "title": "Store Your Key in Colab <span class=\"hl\">Secrets</span>", "plain": "Step 2. Store Your Key in Colab Secrets (Part 3 of 6)", "tpl": "t6"},
    {"group": "Step 2", "label": "STEP 2 &middot; PART 4 OF 6: RUN IT", "title": "Give the Notebook Your <span class=\"hl\">Key</span>", "plain": "Step 2. Give the Notebook Your Key (Part 4 of 6)", "tpl": "t7"},
    {"group": "Step 2", "label": "STEP 2 &middot; PART 5 OF 6: SEE IT", "title": "Let the Notebook Read Your <span class=\"hl\">Secret</span>", "plain": "Step 2. Let the Notebook Read Your Secret (Part 5 of 6)", "tpl": "t8"},
    {"group": "Step 2", "label": "STEP 2 &middot; PART 6 OF 6: KEEP IT SAFE", "title": "Keep Your Key <span class=\"hl\">Private</span>", "plain": "Step 2. Keep Your Key Private (Part 6 of 6)", "tpl": "t9", "cls": "end-slide"},
    {"group": "Step 3", "label": "STEP 3 &middot; PART 1 OF 2: RUN IT", "title": "Import the <span class=\"hl\">Tools</span>", "plain": "Step 3. Import the Tools", "tpl": "t10"},
    {"group": "Step 3", "label": "STEP 3 &middot; PART 2 OF 2: SEE IT", "title": "Check That the Imports <span class=\"hl\">Worked</span>", "plain": "Step 3. Check That the Imports Worked (Part 2 of 2)", "tpl": "t11", "cls": "end-slide"},
    {"group": "Step 4", "label": "STEP 4 &middot; PART 1 OF 2: RUN IT", "title": "Connect to <span class=\"hl\">Gemini</span>", "plain": "Step 4. Connect to Gemini", "tpl": "t12"},

    {"group": "Step 5", "label": "STEP 5 &middot; PART 1 OF 3: RUN IT", "title": "Build the Chatbot <span class=\"hl\">Function</span>", "plain": "Step 5. Build the Chatbot Function", "tpl": "t14"},

    {"group": "Step 5", "label": "STEP 5 &middot; PART 3 OF 3: RUN IT AND SEE IT", "title": "Send the Chat to <span class=\"hl\">Gemini</span>", "plain": "Step 5. Send the Chat to Gemini (Part 3 of 3)", "tpl": "t16"},
    {"group": "Step 6", "label": "STEP 6 &middot; PART 1 OF 4: RUN IT", "title": "Run Your <span class=\"hl\">Chatbot</span>", "plain": "Step 6. Run Your Chatbot", "tpl": "t17"},
    {"group": "Step 6", "label": "STEP 6 &middot; PART 2 OF 4: TYPE A QUESTION", "title": "Ask Your First <span class=\"hl\">Question</span>", "plain": "Step 6. Ask Your First Question (Part 2 of 4)", "tpl": "t18"},
    {"group": "Step 6", "label": "STEP 6 &middot; PART 3 OF 4: SEE IT", "title": "Read Gemini's <span class=\"hl\">Answer</span>", "plain": "Step 6. Read Gemini's Answer (Part 3 of 4)", "tpl": "t19"},

  ];
  var STAGE = { wide: [760, 1140], narrow: [450, 1240] };
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of this reading.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var sz = narrow ? STAGE.narrow : STAGE.wide;
    app.style.width = sz[0] + "px"; app.style.height = sz[1] + "px";
    var k = Math.min(window.innerWidth / sz[0], window.innerHeight / sz[1]);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  var GROUP_LABEL = { "Regex": "Find" };
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    var isStep = g.name.indexOf("Step ") === 0;
    b.type = "button"; b.className = "pg" + (isStep ? "" : " pg-fit");
    var shown = GROUP_LABEL[g.name] || g.name;
    b.setAttribute("aria-label", (g.name === "Regex" ? "Find Values" : shown) + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    var word = isStep ? '<span class="pg-word">Step </span>' + g.name.replace("Step ", "") : shown;
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + word + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span"), orig = label.textContent;
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = orig; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner' + (s.cls ? " " + s.cls : "") + '"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + document.getElementById(s.tpl).innerHTML + '</div>';
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);

    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
    space();
    Array.prototype.forEach.call(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a slide. Spare height widens the gaps
     between blocks, up to 2x. */
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = ""; inner.style.marginTop = "";
    var cs = getComputedStyle(card);
    var avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var base = parseFloat(getComputedStyle(inner).rowGap) || 14;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (base + Math.min(base, spare / gaps)) + "px";
    /* P5 m2 fix round 1: what is still spare after the gaps widen is split above and below, so a short slide sits in
       the middle of the card instead of leaving one big empty area at the bottom */
    var left = avail - inner.offsetHeight;
    if (left > 1) inner.style.marginTop = Math.floor(left / 2) + "px";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;

    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #slide=N opens slide N directly */
  var hm = location.hash.match(/slide=(\d+)/);

  window.addEventListener("resize", function () { scaleStage(); space(); });
  scaleStage();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
