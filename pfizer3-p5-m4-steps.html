<template id="t9">

b>What this code does:</b></p><ul class="list"><li><code>def upload_pdf():</code> defines a function (a named block of code you can run later). Nothing runs yet.</li><li><code>files.upload()</code> shows a <b>Choose files</b> button. A PDF is saved in the <code>sample_docs</code> folder and its path comes back. Any other file gets "is not a PDF".</li></ul>

<template id="t12">
<p class="p">Press <b>Run</b> on the STEP 4 cell (its heading says <code class="nw"># STEP 4</code>).</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 4: Define Text Extraction Function</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Creating a function to extract text from PDF pages using PyMuPDF.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Before AI can search a PDF, we need to convert it from a visual format to text.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output yet — we&#x27;re just defining the function.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">def extract_text_from_pdf(pdf_path):</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;Extract text from a PDF file using PyMuPDF.&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    doc = fitz.open(pdf_path)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Extract text from all pages</span><span class="ln" style="--i:4ch">    text = &quot;\n&quot;.join([page.get_text() for page in doc])</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Print some stats</span><span class="ln" style="--i:4ch">    print(f&quot;PDF: {pdf_path}&quot;)</span><span class="ln" style="--i:4ch">    print(f&quot;Number of pages: {len(doc)}&quot;)</span><span class="ln" style="--i:4ch">    print(f&quot;Extracted {len(text.split())} words from the PDF.&quot;)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Close the document</span><span class="ln" style="--i:4ch">    doc.close()</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    return text</span></code></pre></figure><p class="p"><b>What this code does:</b> <code>page.get_text()</code> reads the words on each page, and <code>"\n".join(...)</code> puts all the pages into one long text.</p>

<template id="t14">
<p class="p">Press <b>Run</b> on the STEP 6 cell (its heading says <code class="nw"># STEP 6</code>).</p><p class="p"><b>Integrating PyMuPDF with LlamaIndex</b><br>Now let's set up a custom loader to integrate PyMuPDF with LlamaIndex:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 6: Define LlamaIndex Document Loader</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Creating a function that converts PDF pages into LlamaIndex Document objects.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># LlamaIndex needs documents in a specific format to index and search them.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output yet — we&#x27;re just defining the function.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">from llama_index.core import Document</span><span class="ln" style="--i:0ch">from typing import List</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">def load_pdf_with_pymupdf(pdf_path: str) -&gt; List[Document]:</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;Load a PDF and convert it to LlamaIndex Document format using PyMuPDF.&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    # Open the PDF</span><span class="ln" style="--i:4ch">    doc = fitz.open(pdf_path)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Extract text from each page</span><span class="ln" style="--i:4ch">    documents = []</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    for i, page in enumerate(doc):</span><span class="ln" style="--i:8ch">        text = page.get_text()</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:8ch">        # Skip empty pages</span><span class="ln" style="--i:8ch">        if not text.strip():</span><span class="ln" style="--i:12ch">            continue</span></code></pre></figure>
</template>

<template id="t15">
<p class="p">And here's the end of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; end of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:8ch">        # Create Document object with metadata</span><span class="ln" style="--i:8ch">        documents.append(</span><span class="ln" style="--i:12ch">            Document(</span><span class="ln" style="--i:16ch">                text=text,</span><span class="ln" style="--i:16ch">                metadata={</span><span class="ln" style="--i:20ch">                    &quot;file_name&quot;: os.path.basename(pdf_path),</span><span class="ln" style="--i:20ch">                    &quot;page_number&quot;: i + 1,</span><span class="ln" style="--i:20ch">                    &quot;total_pages&quot;: len(doc)</span><span class="ln" style="--i:16ch">                }</span><span class="ln" style="--i:12ch">            )</span><span class="ln" style="--i:8ch">        )</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Close the document</span><span class="ln" style="--i:4ch">    doc.close()</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Print stats</span><span class="ln" style="--i:4ch">    print(f&quot;Processed {pdf_path}:&quot;)</span><span class="ln" style="--i:4ch">    print(f&quot;Extracted {len(documents)} pages with content&quot;)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    return documents</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>It makes one <code>Document</code> for each page and skips empty pages.</li><li><code>metadata</code> means extra labels kept with the text. Here they are the file name, the page number and the number of pages.</li></ul>
</template>

<template id="t16">
<p class="p">Press <b>Run</b> on the STEP 7 cell (its heading says <code class="nw"># STEP 7</code>).</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 7: Load PDF into LlamaIndex Format</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Loading the PDF into LlamaIndex format.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># How many pages with content were extracted.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Example usage:</span><span class="ln" style="--i:0ch">pdf_docs = load_pdf_with_pymupdf(pdf_path)</span></code></pre></figure><p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot pic slot" style="--pic-max:110px;--pic-max-n:110px"><a href="pfizer3-p5-m4-try-s6.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p5-m4-try-s6.png" width="1740" height="131" alt="The output under the STEP 7 cell: Processed sample_docs/sample-sdf-document (Project 5).pdf: and Extracted 3 pages with content."><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span><code>pdf_docs</code> now holds: 3 LlamaIndex documents, one for each page of the supplier file.</span></p>
</template>

<template id="t17">
<p class="p">Press <b>Run</b> on the STEP 8 cell (its heading says <code class="nw"># STEP 8</code>).</p><p class="p"><b>Indexing and Processing PDFs</b><br>Let's create the indexing infrastructure first:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 8: Set Up AI Models and Indexing Function</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Setting up the AI models and creating a searchable index from our PDF.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># The index is like a smart table of contents that lets AI find relevant sections instantly.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># Confirmation that Gemini and the embedding model are ready.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">from llama_index.llms.google_genai import GoogleGenAI</span><span class="ln" style="--i:0ch">from llama_index.core import Settings</span><span class="ln" style="--i:0ch">from llama_index.core import VectorStoreIndex</span><span class="ln" style="--i:0ch">from llama_index.embeddings.huggingface import HuggingFaceEmbedding</span></code></pre></figure>
</template>

<template id="t18">
<p class="p">And here's the end of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; end of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># Initialize Gemini LLM</span><span class="ln" style="--i:0ch">llm = GoogleGenAI(model=&quot;gemini-3.5-flash-lite&quot;)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">Settings.llm = llm</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Initialize embedding model</span><span class="ln" style="--i:0ch">embed_model = HuggingFaceEmbedding(model_name=&quot;sentence-transformers/all-MiniLM-L6-v2&quot;)</span><span class="ln" style="--i:0ch">Settings.embed_model = embed_model</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">def process_and_index_pdf(pdf_path):</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;Process a PDF and create both vector and keyword indices.&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    # Load documents</span><span class="ln" style="--i:4ch">    documents = load_pdf_with_pymupdf(pdf_path)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Create vector index</span><span class="ln" style="--i:4ch">    vector_index = VectorStoreIndex.from_documents(documents)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    print(f&quot;Indexed {len(documents)} document chunks&quot;)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    return vector_index</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>You already know Gemini (<code>gemini-3.5-flash-lite</code>) and the embedding model <code>all-MiniLM-L6-v2</code> from earlier in this project.</li><li><code>process_and_index_pdf</code> loads the PDF with STEP 6 and builds the index. It runs in STEP 9.</li></ul>
</template>

<template id="t20">
<p class="p">Press <b>Run</b> on the STEP 9 cell (its heading says <code class="nw"># STEP 9</code>).</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 9: Index the PDF</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Indexing the PDF — this converts it into searchable vector embeddings.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># Confirmation showing how many document chunks were indexed.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">index = process_and_index_pdf(pdf_path)</span></code></pre></figure><p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot pic slot" style="--pic-max:120px;--pic-max-n:120px"><a href="pfizer3-p5-m4-try-s8.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p5-m4-try-s8.png" width="1740" height="166" alt="The output under the STEP 9 cell: Processed sample_docs/sample-sdf-document (Project 5).pdf:, Extracted 3 pages with content, Indexed 3 document chunks."><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p>Where would your chunking choice from the last reading go? Into STEP 8, at <code>VectorStoreIndex.from_documents(documents)</code> inside <code>process_and_index_pdf</code>. This notebook passes no chunking setting there, so LlamaIndex splits with its default size (1,024 tokens, where a token is a word or part of a word). Each page of the supplier file is shorter than that, so each page stays one chunk: 3 pages, 3 chunks.</p></div><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span><code>index</code> now holds: the searchable index of the supplier file.</span></p>

<template id="t21">
<p class="p">Press <b>Run</b> on the STEP 10 cell (its heading says <code class="nw"># STEP 10</code>).</p><p class="p"><b>Implement Query Expansion &amp; Rewriting</b><br>Query expansion helps improve retrieval by adding relevant terms to the original query.</p><p class="p"><i>What is Query Expansion?</i> When users <b>phrase queries differently</b> from how the document is written, <b>retrieval may fail</b>. We'll use <b>Gemini</b> to <b>rewrite queries</b> for better document matching!</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 10: Define Query Expansion Function</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Creating a function that rewrites queries to improve search results.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Users often phrase questions differently from how documents are written.</span><span class="ln" style="--i:0ch"># Query expansion adds related terms so the search finds more relevant results.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output yet — we&#x27;re defining the function.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Gemini was already configured in STEP 8 above</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Simple query expansion function using Gemini</span></code></pre></figure>
</template>

<template id="t22">
<p class="p">And here's the end of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; end of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">def expand_query(query: str, num_expansions: int = 3) -&gt; list:</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;Expand a query to include related terms using Gemini.&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    prompt = f&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    I need to search a pharmaceutical quality document with this query: &quot;{query}&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Please help me expand this query by generating {num_expansions} alternative versions that:</span><span class="ln" style="--i:4ch">    1. Use different but related terminology</span><span class="ln" style="--i:4ch">    2. Include relevant pharmaceutical/quality terms that might appear in a certificate or SDF</span><span class="ln" style="--i:4ch">    3. Cover similar concepts but phrased differently</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Format your response as a list of alternative queries only, with no additional text.</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    response = llm.complete(prompt)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Extract the expanded queries</span><span class="ln" style="--i:4ch">    expanded_queries = [line.strip() for line in response.text.split(&#x27;\n&#x27;) if line.strip()]</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Add the original query if needed</span><span class="ln" style="--i:4ch">    if query not in expanded_queries:</span><span class="ln" style="--i:8ch">        expanded_queries = [query] + expanded_queries</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    return expanded_queries</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>llm.complete(prompt)</code> sends the prompt to Gemini and asks for 3 other ways to ask your question.</li><li>Each line of Gemini's answer becomes one query, and your own question goes first in the list.</li></ul>
</template>

<template id="t23">
<p class="p">Press <b>Run</b> on the STEP 11 cell (its heading says <code class="nw"># STEP 11</code>).</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 11: Test Query Expansion</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Testing query expansion with a sample pharmaceutical question.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># The original query plus expanded versions with related terms.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Example usage:</span><span class="ln" style="--i:0ch">expanded = expand_query(&quot;What test methods were used for quality control?&quot;)</span><span class="ln" style="--i:0ch">for i, q in enumerate(expanded):</span><span class="ln" style="--i:4ch">    print(f&quot;{i+1}. {q}&quot;)</span></code></pre></figure><p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot pic slot" style="--pic-max:170px;--pic-max-n:170px"><a href="pfizer3-p5-m4-try-s9.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p5-m4-try-s9.png" width="1740" height="201" alt="The output under the STEP 11 cell: 4 numbered queries. 1 is What test methods were used for quality control?, and 2 to 4 are Gemini&#x27;s new versions. The long lines run past the right edge of the cell."><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure><p class="p"><b>What to observe:</b> AI adds relevant terms to improve search accuracy.</p><p class="p">In the run shown here, Gemini wrote 3 new ways to ask, with words like "release testing" and "lot release". Yours will be worded differently, because Gemini writes them fresh each time.</p>
</template>

<template id="t24">
<p class="p">Press <b>Run</b> on the STEP 12 cell (its heading says <code class="nw"># STEP 12</code>).</p><p class="p"><b>Creating a Query Expansion Engine</b><br>Now let's implement a more structured query expansion using LlamaIndex's built-in functionality:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 12: Build Query Expansion Engine</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Building a more advanced query engine that automatically expands queries.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># QueryFusionRetriever generates multiple versions of your question and combines results.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output — the engine is ready to use.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">from llama_index.core.query_engine import RetrieverQueryEngine</span><span class="ln" style="--i:0ch">from llama_index.core.retrievers import QueryFusionRetriever</span></code></pre></figure>
</template>

<template id="t25">
<p class="p">And here's the end of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; end of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># Function to create a query engine that uses query expansion</span><span class="ln" style="--i:0ch">def create_query_expansion_engine(index):</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;Create a query engine that uses query expansion.&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    # First create multiple retrievers (base retriever)</span><span class="ln" style="--i:4ch">    base_retriever = index.as_retriever(similarity_top_k=2)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Create a query fusion retriever</span><span class="ln" style="--i:4ch">    fusion_retriever = QueryFusionRetriever(</span><span class="ln" style="--i:8ch">        retrievers=[base_retriever],</span><span class="ln" style="--i:8ch">        llm=llm,</span><span class="ln" style="--i:8ch">        similarity_top_k=2,</span><span class="ln" style="--i:8ch">        num_queries=3,  # Generate 3 queries per original query</span><span class="ln" style="--i:8ch">        mode=&quot;reciprocal_rerank&quot;  # Use reciprocal rank fusion</span><span class="ln" style="--i:4ch">    )</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Create the query engine with the fusion retriever</span><span class="ln" style="--i:4ch">    query_engine = RetrieverQueryEngine.from_args(</span><span class="ln" style="--i:8ch">        retriever=fusion_retriever,</span><span class="ln" style="--i:8ch">        llm=llm,</span><span class="ln" style="--i:8ch">        verbose=True</span><span class="ln" style="--i:4ch">    )</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    return query_engine</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>num_queries=3</code> means 3 questions in all: yours, plus 2 that Gemini writes.</li><li><code>reciprocal_rerank</code> is reciprocal rank fusion: a way to merge lists that gives each result points for ranking high in any of them. <code>similarity_top_k=2</code> keeps the 2 best chunks.</li></ul>
</template>

<template id="t26">

<template id="t29">
<p class="p">Press <b>Run</b> on the STEP 15 cell (its heading says <code class="nw"># STEP 15</code>).</p><p class="p"><b>Implement Hybrid Retrieval (Keyword + Vector Search)</b><br>Hybrid retrieval combines embedding-based semantic search with keyword-based retrieval for better results.</p><p class="p"><i>Why Hybrid Retrieval?</i></p><ul class="list"><li><b>Keyword-based search</b> (BM25) finds <b>exact phrase matches</b>.</li><li><b>Vector-based retrieval</b> (embeddings) finds <b>conceptually similar</b> matches.</li><li>Hybrid retrieval combines both for the most accurate search results!</li></ul><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 15: Build Hybrid Retriever</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Building a hybrid retriever that combines vector search (meaning) + keyword search (exact matches).</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Neither method alone is perfect — combining them gives the best of both worlds.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output — the function is ready to use.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">from llama_index.core import VectorStoreIndex</span><span class="ln" style="--i:0ch">from llama_index.retrievers.bm25 import BM25Retriever</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">def create_hybrid_retriever(index, query, top_k=2):</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;Create a hybrid retrieval approach combining vector and keyword search.&quot;&quot;&quot;</span></code></pre></figure>
</template>

<template id="t30">
<p class="p">Here's the middle of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; middle of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:4ch">    # Method 1: Vector retrieval (semantic search)</span><span class="ln" style="--i:4ch">    vector_retriever = index.as_retriever(similarity_top_k=top_k)</span><span class="ln" style="--i:4ch">    vector_nodes = vector_retriever.retrieve(query)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Method 2: BM25 retrieval (keyword-based search)</span><span class="ln" style="--i:4ch">    # Get all nodes from the index</span><span class="ln" style="--i:4ch">    nodes = [node for node in index.docstore.docs.values()]</span><span class="ln" style="--i:4ch">    bm25_retriever = BM25Retriever.from_defaults(</span><span class="ln" style="--i:8ch">        nodes=nodes,</span><span class="ln" style="--i:8ch">        similarity_top_k=top_k</span><span class="ln" style="--i:4ch">    )</span><span class="ln" style="--i:4ch">    keyword_nodes = bm25_retriever.retrieve(query)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Combine results (simple approach)</span><span class="ln" style="--i:4ch">    all_nodes = []</span><span class="ln" style="--i:4ch">    all_nodes.extend(vector_nodes)</span><span class="ln" style="--i:4ch">    all_nodes.extend(keyword_nodes)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>Each search keeps its own top 2 chunks (<code>top_k</code>), and both lists go into one list.</li></ul>
</template>

<template id="t31">
<p class="p">And here's the end of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; end of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:4ch">    # Remove duplicates</span><span class="ln" style="--i:4ch">    unique_nodes = []</span><span class="ln" style="--i:4ch">    seen_ids = set()</span><span class="ln" style="--i:4ch">    for node in all_nodes:</span><span class="ln" style="--i:8ch">        if node.node_id not in seen_ids:</span><span class="ln" style="--i:12ch">            unique_nodes.append(node)</span><span class="ln" style="--i:12ch">            seen_ids.add(node.node_id)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Sort by score (higher is better)</span><span class="ln" style="--i:4ch">    sorted_nodes = sorted(unique_nodes, key=lambda x: x.score if hasattr(x, &#x27;score&#x27;) else 0.0, reverse=True)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Limit to top results</span><span class="ln" style="--i:4ch">    top_nodes = sorted_nodes[:top_k]</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    return top_nodes</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>When both searches find the same chunk, it keeps the vector search copy, because that list comes first.</li><li>It then sorts by the raw scores and keeps the top 2. BM25 scores and vector scores use different scales, so this simple merge compares numbers that don't mean the same thing.</li></ul>
</template>

<template id="t32">
<p class="p">Press <b>Run</b> on the STEP 16 cell (its heading says <code class="nw"># STEP 16</code>).</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 16: Test Hybrid Retrieval</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Testing hybrid retrieval with a pharmaceutical question.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># Retrieved text passages from the PDF, ranked by relevance score.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Example usage:</span><span class="ln" style="--i:0ch">hybrid_nodes = create_hybrid_retriever(index, &quot;What are the storage conditions for this product?&quot;)</span><span class="ln" style="--i:0ch">for i, node in enumerate(hybrid_nodes):</span><span class="ln" style="--i:4ch">    print(f&quot;Result {i+1} (Score: {node.score:.4f}):&quot;)</span><span class="ln" style="--i:4ch">    print(node.get_text())</span><span class="ln" style="--i:4ch">    print(&quot;-&quot; * 40)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>It asks your hybrid retriever "What are the storage conditions for this product?" and prints each result with its score.</li></ul>
</template>

<template id="t35">
<p class="p">Here's the middle of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; middle of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:4ch">    # Keyword retrieval (BM25)</span><span class="ln" style="--i:4ch">    nodes = [node for node in index.docstore.docs.values()]</span><span class="ln" style="--i:4ch">    keyword_retriever = BM25Retriever.from_defaults(</span><span class="ln" style="--i:8ch">        nodes=nodes,</span><span class="ln" style="--i:8ch">        similarity_top_k=top_k</span><span class="ln" style="--i:4ch">    )</span><span class="ln" style="--i:4ch">    keyword_nodes = keyword_retriever.retrieve(query)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Hybrid retrieval</span><span class="ln" style="--i:4ch">    hybrid_nodes = create_hybrid_retriever(index, query, top_k)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Create a comparison dataframe</span><span class="ln" style="--i:4ch">    results = []</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    for method, nodes in [</span><span class="ln" style="--i:8ch">        (&quot;Vector (Semantic)&quot;, vector_nodes),</span><span class="ln" style="--i:8ch">        (&quot;Keyword (BM25)&quot;, keyword_nodes),</span><span class="ln" style="--i:8ch">        (&quot;Hybrid&quot;, hybrid_nodes)</span><span class="ln" style="--i:4ch">    ]:</span><span class="ln" style="--i:8ch">        for i, node in enumerate(nodes):</span><span class="ln" style="--i:12ch">            results.append({</span><span class="ln" style="--i:16ch">                &quot;Method&quot;: method,</span><span class="ln" style="--i:16ch">                &quot;Rank&quot;: i + 1,</span><span class="ln" style="--i:16ch">                &quot;Score&quot;: node.score if hasattr(node, &#x27;score&#x27;) else 0.0,</span><span class="ln" style="--i:16ch">                &quot;Content&quot;: node.get_text()[:200] + &quot;...&quot;,  # First 200 chars</span><span class="ln" style="--i:16ch">                &quot;Page&quot;: node.metadata.get(&quot;page_number&quot;, &quot;Unknown&quot;) if hasattr(node, &#x27;metadata&#x27;) else &quot;Unknown&quot;</span><span class="ln" style="--i:12ch">            })</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    results_df = pd.DataFrame(results)</span><span class="ln" style="--i:4ch">    display(results_df)</span></code></pre></figure>

<template id="t36">

de>plt.bar</code> draws a bar for each score.</li></ul>

<template id="t37">

<template id="t39">
<p class="p">Press <b>Run</b> on the STEP 19 cell (its heading says <code class="nw"># STEP 19</code>).</p><p class="p"><b>Implement Reranking for More Accurate Results</b><br>Reranking helps prioritize the most relevant results after initial retrieval.</p><p class="p"><i>Why is Reranking Needed?</i> Even after retrieval, <b>some results are more relevant than others</b>. Reranking:</p><ul class="list"><li>Sorts retrieved results by relevance.</li><li>Filters out irrelevant or redundant text.</li></ul><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 19: Demonstrate Reranking</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Using a reranker to re-sort retrieved results by true relevance.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Initial retrieval may rank results poorly — reranking fixes the order.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># Before and after comparison showing how reranking changes result ordering.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">from llama_index.core.postprocessor import SentenceTransformerRerank</span><span class="ln" style="--i:0ch">from llama_index.core.schema import NodeWithScore</span></code></pre></figure>
</template>

<template id="t40">
<p class="p">Here's the next part of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; middle of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># Create a reranker</span><span class="ln" style="--i:0ch">def rerank_results(nodes, query, top_n=2):</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;Rerank retrieved nodes using the Sentence Transformer reranker.&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    # Create the reranker</span><span class="ln" style="--i:4ch">    reranker = SentenceTransformerRerank(</span><span class="ln" style="--i:8ch">        model=&quot;cross-encoder/ms-marco-MiniLM-L-6-v2&quot;,</span><span class="ln" style="--i:8ch">        top_n=top_n</span><span class="ln" style="--i:4ch">    )</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Rerank the nodes</span><span class="ln" style="--i:4ch">    reranked_nodes = reranker.postprocess_nodes(</span><span class="ln" style="--i:8ch">        nodes,</span><span class="ln" style="--i:8ch">        query_str=query</span><span class="ln" style="--i:4ch">    )</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    return reranked_nodes</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>It uses a specialized cross-encoder model to score query-chunk pairs. A cross-encoder is a small model that reads your question and one chunk together and gives a score for how well they match. It isn't one of the three reranking methods on the Learn cards: it's a fourth kind, a small model, not an LLM like Gemini.</li><li><code>top_n=2</code> keeps only the 2 best chunks after reranking.</li></ul>
</template>

<template id="t41">
<p class="p">Here's the next part of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; middle of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># Function to demonstrate the reranking process</span><span class="ln" style="--i:0ch">def demonstrate_reranking(index, query, top_k=3):</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;Demonstrate the reranking process on retrieval results.&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    # First retrieve more nodes than we need</span><span class="ln" style="--i:4ch">    retriever = index.as_retriever(similarity_top_k=top_k)</span><span class="ln" style="--i:4ch">    nodes = retriever.retrieve(query)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    print(f&quot;Query: {query}&quot;)</span><span class="ln" style="--i:4ch">    print(&quot;\nOriginal Retrieval Order:&quot;)</span><span class="ln" style="--i:4ch">    for i, node in enumerate(nodes):</span><span class="ln" style="--i:8ch">        print(f&quot;{i+1}. (Score: {node.score:.4f}) - {node.get_text()[:100]}...&quot;)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Now rerank them</span><span class="ln" style="--i:4ch">    reranked_nodes = rerank_results(nodes, query, top_n=2)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    print(&quot;\nAfter Reranking:&quot;)</span><span class="ln" style="--i:4ch">    for i, node in enumerate(reranked_nodes):</span><span class="ln" style="--i:8ch">        print(f&quot;{i+1}. (Score: {node.score:.4f}) - {node.get_text()[:100]}...&quot;)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>It first retrieves 3 chunks with vector search (<code>top_k=3</code>) and prints them with their scores.</li><li>Then it reranks them with <code>rerank_results</code> and prints the 2 it kept.</li></ul>
</template>

<template id="t42">
<p class="p">And here's the end of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; end of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:4ch">    # Create comparison dataframe</span><span class="ln" style="--i:4ch">    results = []</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Original ranking</span><span class="ln" style="--i:4ch">    for i, node in enumerate(nodes):</span><span class="ln" style="--i:8ch">        results.append({</span><span class="ln" style="--i:12ch">            &quot;Stage&quot;: &quot;Original Retrieval&quot;,</span><span class="ln" style="--i:12ch">            &quot;Rank&quot;: i + 1,</span><span class="ln" style="--i:12ch">            &quot;Score&quot;: node.score,</span><span class="ln" style="--i:12ch">            &quot;Content&quot;: node.get_text()[:150] + &quot;...&quot;,</span><span class="ln" style="--i:12ch">            &quot;Page&quot;: node.metadata.get(&quot;page_number&quot;, &quot;Unknown&quot;)</span><span class="ln" style="--i:8ch">        })</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Reranked</span><span class="ln" style="--i:4ch">    for i, node in enumerate(reranked_nodes):</span><span class="ln" style="--i:8ch">        results.append({</span><span class="ln" style="--i:12ch">            &quot;Stage&quot;: &quot;After Reranking&quot;,</span><span class="ln" style="--i:12ch">            &quot;Rank&quot;: i + 1,</span><span class="ln" style="--i:12ch">            &quot;Score&quot;: node.score,</span><span class="ln" style="--i:12ch">            &quot;Content&quot;: node.get_text()[:150] + &quot;...&quot;,</span><span class="ln" style="--i:12ch">            &quot;Page&quot;: node.metadata.get(&quot;page_number&quot;, &quot;Unknown&quot;)</span><span class="ln" style="--i:8ch">        })</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    results_df = pd.DataFrame(results)</span><span class="ln" style="--i:4ch">    display(results_df)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    return results_df</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Example usage:</span><span class="ln" style="--i:0ch">reranking_demo = demonstrate_reranking(index, &quot;What sterilization method was used?&quot;, top_k=3)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>It makes a table with the original order and the order after reranking.</li><li>The last line runs it all on the question "What sterilization method was used?".</li></ul>
</template>

<template id="t44">
<p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot pic slot" style="--pic-max:300px;--pic-max-n:300px"><a href="pfizer3-p5-m4-try-s16.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p5-m4-try-s16.png" width="1740" height="391" alt="The table under the STEP 19 output: columns Stage, Rank, Score, Content and Page, 5 rows. Original Retrieval: pages 3, 2 and 1. After Reranking: pages 3 and 2."><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure><p class="p">In the table, the "Original Retrieval" rows also show the reranker's scores (around -11), not the first scores, because the reranker changed the scores on those same results before the table was made. The first scores are in the list printed above the table (0.2104, 0.2027, 0.1796).</p><p class="p">Why negative? A cross-encoder's scores don't run from 0 to 1 like the first scores. They can be below zero, and a higher score still means more relevant, so a score of -5 would be a closer match than -11.</p><p class="p"><b>What to observe:</b> Better ranking leads to more accurate responses in document-based AI.</p>

<template id="t45">
<p class="p">Press <b>Run</b> on the STEP 20 cell (its heading says <code class="nw"># STEP 20</code>).</p><p class="p"><b>Complete End-to-End Example: Building an Advanced RAG Pipeline</b><br>Now let's combine all these techniques into an advanced RAG pipeline:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 20: Build Complete RAG Pipeline</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Building the complete RAG pipeline combining hybrid retrieval + reranking.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># This is the final product — a production-quality document search system.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output — the pipeline function is defined and ready.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">from llama_index.core.query_engine import RetrieverQueryEngine</span><span class="ln" style="--i:0ch">from llama_index.core.postprocessor import SentenceTransformerRerank</span><span class="ln" style="--i:0ch">from llama_index.retrievers.bm25 import BM25Retriever</span><span class="ln" style="--i:0ch">from llama_index.core.retrievers import BaseRetriever</span><span class="ln" style="--i:0ch">from llama_index.core.schema import NodeWithScore, QueryBundle</span></code></pre></figure>
</template>

<template id="t46">
<p class="p">Here's the next part of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; middle of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">def build_rag_pipeline(index):</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;Build a simple but effective RAG pipeline with hybrid retrieval and reranking.&quot;&quot;&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Get all nodes from the index&#x27;s docstore</span><span class="ln" style="--i:4ch">    nodes = list(index.docstore.docs.values())</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Determine safe top_k value (number of nodes to retrieve)</span><span class="ln" style="--i:4ch">    # Must be at least 1 and no more than the number of available nodes</span><span class="ln" style="--i:4ch">    num_nodes = len(nodes)</span><span class="ln" style="--i:4ch">    safe_top_k = min(2, max(1, num_nodes))</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    print(f&quot;Index contains {num_nodes} nodes, using top_k={safe_top_k}&quot;)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Step 1: Create a hybrid retriever combining vector and keyword search</span><span class="ln" style="--i:4ch">    # First, get the vector retriever (for semantic understanding)</span><span class="ln" style="--i:4ch">    vector_retriever = index.as_retriever(</span><span class="ln" style="--i:8ch">        similarity_top_k=safe_top_k  # Retrieve top 2 most similar chunks</span><span class="ln" style="--i:4ch">    )</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>safe_top_k</code> is 2, or fewer if the index has fewer chunks.</li><li>It makes a vector retriever that keeps the top 2 chunks.</li></ul>
</template>

<template id="t47">
<p class="p">Here's the next part of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; middle of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:4ch">    # Next, create a BM25 retriever (for keyword matching)</span><span class="ln" style="--i:4ch">    bm25_retriever = BM25Retriever.from_defaults(</span><span class="ln" style="--i:8ch">        nodes=nodes,</span><span class="ln" style="--i:8ch">        similarity_top_k=safe_top_k  # Retrieve top 2 most similar chunks</span><span class="ln" style="--i:4ch">    )</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Create a proper hybrid retriever class</span><span class="ln" style="--i:4ch">    class HybridRetriever(BaseRetriever):</span><span class="ln" style="--i:8ch">        &quot;&quot;&quot;Hybrid retriever that combines vector and keyword search results.&quot;&quot;&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:8ch">        def __init__(self, vector_retriever, keyword_retriever, top_k=2):</span><span class="ln" style="--i:12ch">            &quot;&quot;&quot;Initialize with vector and keyword retrievers.&quot;&quot;&quot;</span><span class="ln" style="--i:12ch">            self.vector_retriever = vector_retriever</span><span class="ln" style="--i:12ch">            self.keyword_retriever = keyword_retriever</span><span class="ln" style="--i:12ch">            self.top_k = top_k</span><span class="ln" style="--i:12ch">            super().__init__()</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>It makes a BM25 retriever, then starts <code>HybridRetriever</code>, a class (a blueprint for a tool) that holds both retrievers.</li></ul>
</template>

<template id="t48">
<p class="p">Here's the next part of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; middle of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:8ch">        def _retrieve(self, query_bundle, **kwargs):</span><span class="ln" style="--i:12ch">            &quot;&quot;&quot;Retrieve from both retrievers and combine results.&quot;&quot;&quot;</span><span class="ln" style="--i:12ch">            # Get results from both retrievers</span><span class="ln" style="--i:12ch">            vector_nodes = self.vector_retriever.retrieve(query_bundle)</span><span class="ln" style="--i:12ch">            keyword_nodes = self.keyword_retriever.retrieve(query_bundle)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:12ch">            # Combine all nodes</span><span class="ln" style="--i:12ch">            all_nodes = list(vector_nodes) + list(keyword_nodes)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:12ch">            # Remove duplicates (by node_id)</span><span class="ln" style="--i:12ch">            unique_nodes = {}</span><span class="ln" style="--i:12ch">            for node in all_nodes:</span><span class="ln" style="--i:16ch">                if node.node_id not in unique_nodes:</span><span class="ln" style="--i:20ch">                    unique_nodes[node.node_id] = node</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:12ch">            # Sort by score (higher is better)</span><span class="ln" style="--i:12ch">            sorted_nodes = sorted(</span><span class="ln" style="--i:16ch">                unique_nodes.values(),</span><span class="ln" style="--i:16ch">                key=lambda x: x.score if hasattr(x, &#x27;score&#x27;) else 0.0,</span><span class="ln" style="--i:16ch">                reverse=True</span><span class="ln" style="--i:12ch">            )</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:12ch">            return sorted_nodes[:self.top_k]  # Return top results</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>_retrieve</code> does the same merge as STEP 15, written so LlamaIndex's query engine can use it.</li></ul>
</template>

<template id="t49">
<p class="p">And here's the end of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; end of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:4ch">    # Create our hybrid retriever instance</span><span class="ln" style="--i:4ch">    hybrid_retriever = HybridRetriever(</span><span class="ln" style="--i:8ch">        vector_retriever=vector_retriever,</span><span class="ln" style="--i:8ch">        keyword_retriever=bm25_retriever,</span><span class="ln" style="--i:8ch">        top_k=safe_top_k</span><span class="ln" style="--i:4ch">    )</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Step 2: Create a reranker to prioritize the most relevant chunks</span><span class="ln" style="--i:4ch">    if num_nodes &gt; 1:</span><span class="ln" style="--i:8ch">        reranker = SentenceTransformerRerank(</span><span class="ln" style="--i:12ch">            model=&quot;cross-encoder/ms-marco-MiniLM-L-6-v2&quot;,</span><span class="ln" style="--i:12ch">            top_n=min(2, num_nodes)  # Keep only top 2 results after reranking</span><span class="ln" style="--i:8ch">        )</span><span class="ln" style="--i:8ch">        node_postprocessors = [reranker]</span><span class="ln" style="--i:4ch">    else:</span><span class="ln" style="--i:8ch">        node_postprocessors = []</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Step 3: Build the query engine</span><span class="ln" style="--i:4ch">    query_engine = RetrieverQueryEngine.from_args(</span><span class="ln" style="--i:8ch">        retriever=hybrid_retriever,</span><span class="ln" style="--i:8ch">        llm=llm,</span><span class="ln" style="--i:8ch">        node_postprocessors=node_postprocessors</span><span class="ln" style="--i:4ch">    )</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    return query_engine</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>It adds the cross-encoder reranker from STEP 19, keeping the top 2.</li><li><code>RetrieverQueryEngine</code> joins it all: hybrid search, then reranking, then Gemini writes the answer.</li></ul>
</template>

<template id="t50">
<p class="p">Press <b>Run</b> on the STEP 21 cell (its heading says <code class="nw"># STEP 21</code>).</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 21: Run the Complete RAG Pipeline</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Running the complete RAG pipeline on your PDF with a real question.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># The AI&#x27;s answer based on information retrieved from your pharmaceutical document.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Example usage:</span><span class="ln" style="--i:0ch"># NOTE: The PDF was already uploaded in Step 3 above. No need to upload again.</span><span class="ln" style="--i:0ch"># If you want to use a different PDF, uncomment the next line:</span><span class="ln" style="--i:0ch"># pdf_path = upload_pdf()</span><span class="ln" style="--i:0ch">index = process_and_index_pdf(pdf_path)</span><span class="ln" style="--i:0ch">rag_engine = build_rag_pipeline(index)</span><span class="ln" style="--i:0ch">response = rag_engine.query(&quot;What test methods were used for quality control?&quot;)</span><span class="ln" style="--i:0ch">print(&#x27;\nFinal Response:\n ---------------------- \n&#x27;)</span><span class="ln" style="--i:0ch">print(response)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>It indexes the PDF again, builds the pipeline from STEP 20 and asks "What test methods were used for quality control?".</li></ul>

<p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot pic slot" style="--pic-max:260px;--pic-max-n:260px"><a href="pfizer3-p5-m4-try-s17.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p5-m4-try-s17.png" width="1740" height="480" alt="The output under the STEP 21 cell: Processed ..., Extracted 3 pages with content, a DEBUG line, Indexed 3 document chunks, Index contains 3 nodes, using top_k=2, a Loading weights bar, then Final Response: and Gemini&#x27;s one-line answer."><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure><p class="p">In the run shown here, the full pipeline answered in one line, shorter than STEP 13's answer. Gemini writes each answer fresh, so yours may be longer or shorter.</p><p class="p"><b>Why are the retrieved pages so alike?</b> On this 3-page file, each page is one chunk, so every method picks from the same 3 pieces. Both STEP 13 and STEP 21 hand Gemini at most 2 pages, so the shorter answer comes from which 2 pages reach Gemini and how Gemini words it. A fuller pipeline doesn't promise a fuller answer. Query expansion, hybrid retrieval and reranking matter on long files with many chunks, where the search has far more pieces to choose from.</p><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p>Next, scroll down to If You're Stuck if anything went wrong, or to the Challenge.</p></div>

(function () {
