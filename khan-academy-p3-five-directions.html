  /* ===============================================================
     THE PALETTE. Extern's five, from KHAN-ACADEMY-STYLE-GUIDE.md
     section 7. No sixth colour anywhere in this file.

       #DCE1FF  highlight container
       #001D69  accent
       #FDF8F8  background
       #484646  body and subtle copy
       #1C1B1B  titles

     of the five plays ground, which plays ink, and which plays the

     =============================================================== */
  :root{

       light surface, so what sits inside it is always the same. */

    --panel-strong:#1C1B1B; /* bold inside the panel                   */
    --panel-line:rgba(0,29,105,.26);

    --t-fast:160ms;    /* UI feedback: hover, press, focus          */
    --t-frame:300ms;   /* movement between slides, and the ground   */
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-io:cubic-bezier(.4,0,.2,1);

  /* ---- theme: paper. The default, and the one a no-script or
         pre-script paint lands on. ---- */
  body{

    --panel:#DCE1FF; --panel-ink:#484646;
    --mark:#001D69; --line:rgba(0,29,105,.26);
  }
  /* ---- theme: deep. Reversed. The accent is the ground here, so the
         mark inverts to the pale value. ---- */
  body[data-t="deep"]{
    --ground:#001D69; --ink:#FDF8F8; --ink2:#DCE1FF;
    --panel:#DCE1FF; --panel-ink:#484646;
    --mark:#DCE1FF; --line:#DCE1FF;
  }
  /* ---- theme: wash. The panel goes off-white, because a #DCE1FF panel
         on a #DCE1FF ground is not a panel. ---- */
  body[data-t="wash"]{
    --ground:#DCE1FF; --ink:#1C1B1B; --ink2:#484646;
    --panel:#FDF8F8; --panel-ink:#484646;
    --mark:#001D69; --line:rgba(0,29,105,.26);
  }
  /* ---- theme: slate. Reversed. ---- */
  body[data-t="slate"]{
    --ground:#484646; --ink:#FDF8F8; --ink2:#DCE1FF;
    --panel:#DCE1FF; --panel-ink:#484646;
    --mark:#DCE1FF; --line:#DCE1FF;
  }
  /* ---- theme: ink. Reversed. The close. ---- */
  body[data-t="ink"]{
    --ground:#1C1B1B; --ink:#FDF8F8; --ink2:#DCE1FF;
    --panel:#DCE1FF; --panel-ink:#484646;
    --mark:#DCE1FF; --line:#DCE1FF;
  }

  html,body{height:100%}
  [hidden]{display:none!important}
  html{background:#FDF8F8}
  body{

    /* The ground crossfades rather than snapping, because a whole viewport
       changing colour instantly reads as a glitch. It is a transition and not
       an animation, so a throttled embed cannot strand it part way. */
    transition:background var(--t-frame) var(--ease-io);
    /* System stack, no webfont. A font that blocks first paint is worse
       than any font choice, and a deck makes no network request. */
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink2);

  #stage{

  }
  .frame{position:absolute;inset:0;padding:16px 40px 12px;display:flex;flex-direction:column}

  .segs{display:flex;gap:4px}
  /* One colour, two opacities. On a dark ground an rgba() tint of the accent
     is invisible, and the palette has no light tint to reach for, so the
     difference is carried by opacity instead of by a sixth value. */
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--mark);opacity:.28;

  .segs i.here{opacity:1;height:6px;margin-top:-1px}

  /* The heading and the board compose as one block and that block sits in the
     vertical middle of the frame. Top-aligning them instead left every short
     card hugging the ceiling with a band of bare ground under it, which reads
     as unfinished rather than as space. A slide centres. */
  .stack{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center}
  /* One measured column, centred in the canvas. The body is held near 60
     characters a line, which on a 960 wide frame leaves about 300px over. That

     column with a margin reads as a composition and a column with an empty
     half beside it reads as a missing panel. The heading shares the column so

  .board{flex:0 1 auto;min-height:0;display:flex;flex-direction:column}

         960 wide and the body must not run across it: past about 75 the eye
         loses its place returning to the left edge. ---- */
  .intro{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:13px}
  .intro p{font-size:19px;line-height:1.58;color:var(--ink2)}
  .intro p b{color:var(--ink);font-weight:600}

  .recall{display:flex;flex-direction:column;gap:7px;margin:8px 0 10px}
  .recall .tr{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:baseline;

  .recall .tv{font-size:13.5px;line-height:1.4;color:var(--panel-ink)}
  .closeq{font-size:15.5px;line-height:1.45;color:var(--ink);font-weight:600}
  .closeq span{display:block;font-size:13.5px;font-weight:400;color:var(--ink2);margin-bottom:3px}

  /* ---- the bar. margin-top:auto plus flex:0 0 auto means overflow above
         scrolls inside its own region and can never displace this row.
         Outlined, never filled: nothing on these slides is a primary action
         and a solid navy block would claim to be one. ---- */
  .bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:52px;padding-top:10px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:10px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--mark);display:flex;align-items:center;gap:7px;
    background:transparent;color:var(--mark);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav svg{width:14px;height:14px;flex:0 0 auto;display:block}
  button.nav.ghost{border-width:1.5px;color:var(--ink2);border-color:var(--line)}

  button.nav:disabled{opacity:.42;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--mark);outline-offset:3px}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}

    /* 16px is the body floor. Never below it. */
    h1,.board{max-width:none}
    .intro{overflow:visible}
    /* More specific than .board.close .intro p, or the close slide's lead
       paragraph stays at 15.5px and breaks the 16px mobile floor. */
    .board.close .intro p{font-size:16px;line-height:1.55}
    .intro p{font-size:16px;line-height:1.55}
    .stack{justify-content:flex-start}
    .board{grid-template-columns:1fr;gap:20px;align-items:start;align-content:start}
    .ev{max-height:none;overflow:visible;padding:14px 15px}

    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}

  <div class="nsf">
    <h2>Five directions worth thinking about</h2>
    <p>Five directions are open. They are not equal. Read them in order.</p>

    <h3>1. A company pays to put Khan Academy's lessons inside a product it sells.</h3>
    <p>Khan Academy has thousands of lessons and exercises, and it knows a lot
      about how students work through them. Another company wants that inside
      its own product, the one it sells to customers, and pays Khan Academy for
      it. Say a company is building an AI tutor that parents pay for. An AI can
      already give you the answer. What it has to learn is how to walk a student
      through the steps, and to learn that it needs thousands of worked
      examples, meaning questions with all the working written out. Building
      that from scratch would take years. Khan Academy already has it.</p>

    <h3>2. A large technology company pays to build AI features with Khan Academy.</h3>
    <p>A technology company is putting a tutor inside software that schools
      already use. It has the engineering. What it does not have is the lessons,
      and it does not have the practice questions that sit under them, meaning
      the questions a student works through until the idea holds. Khan Academy
      has both. Building an AI tutor for school looks like one job. It is two,
      and only one of them is code.</p>

    <h3>3. A company pays for a free course in a subject Khan Academy has not covered.</h3>
    <p>A company wants young people to understand something, and Khan Academy
      does not teach it yet. The company pays for the course to be built. Then
      the course sits on the site for free, the same as everything else on it,
      and anyone can take it. The company does not get a customer out of that.
      It gets a subject it cares about taught to a lot of people.</p>

    <h3>4. Somebody other than a school district pays so that schools get access.</h3>
    <p>A school district can pay for Khan Academy across the schools it runs.
      Some districts cannot afford it, and those are often the districts whose
      students would gain most. So somebody else pays instead. A state, a
      foundation, a group of libraries, an employer buying access for the
      families of the people who work for it. The school still gets the thing.
      The bill goes to a different address.</p>

    <h3>5. Free official practice for a qualification that is not a college entrance exam.</h3>
    <p>Khan Academy already builds the free official practice for one college
      entrance exam, meaning the test students sit to get into university.
      Plenty of qualifications are not that. A certificate that says you can
      wire a house, or keep a set of accounts, or look after a ward. The same
      argument seems to carry across. Somebody owns the test, the practice for
      it ought to be free, and Khan Academy knows how to build practice.</p>

    <h3>The five directions, and what is behind each one.</h3>
    <ol>
      <li><b>Lessons inside a product.</b> A published figure. $8.3 million, 13
        customers, year to 30 June 2025.</li>
      <li><b>AI features, built together.</b> A named deal. No figure published.</li>
      <li><b>A funded free course.</b> A published figure. Over 10.7 million
        students since 2019, and the seat occupied.</li>
      <li><b>Somebody else pays for schools.</b> A real shape. Nobody named on
        this page.</li>
      <li><b>Practice for a certificate.</b> An inference. No payment behind it.</li>
    </ol>
    <p>Not now. Later, when you open your own search.
      <span class="v">Which of these would you go looking in first?</span></p>

     or a theme name with no CSS behind it all look fine on screen while being
     wrong, so they are caught here rather than by a student. */
  (function validate(){
     var problems = [];
     var ids = {};
     S.forEach(function(s, n){
       if(!s.id) problems.push("slide " + (n+1) + " has no id");
       if(ids[s.id]) problems.push('duplicate slide id "' + s.id + '"');
       ids[s.id] = 1;
       if(!s.theme || !THEMES[s.theme]) problems.push('slide "' + s.id + '" has no known theme');
       if(n > 0 && S[n-1].theme === s.theme) problems.push('slides "' + S[n-1].id + '" and "' + s.id + '" share a ground');
       if(s.kind === "card"){
         if(!s.body || !s.body.length) problems.push('slide "' + s.id + '" has no body');
       } else if(s.kind === "close"){
         if(!s.rows || !s.rows.length) problems.push('slide "' + s.id + '" has no rows');
         if(!s.tail) problems.push('slide "' + s.id + '" has no closing question');
       }
     });
     if(problems.length){
       document.getElementById("board").innerHTML =
         '<div class="intro"><p><b>This deck has authoring errors and will not '
         + 'behave correctly:</b></p><ul style="font-size:13px;line-height:1.6;padding-left:18px">'
         + problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul></div>";
       throw new Error("deck data invalid: " + problems.join("; "));
     }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), h1:document.getElementById("h1"),
    board:document.getElementById("board"), back:document.getElementById("back"),
    next:document.getElementById("next"), nextlab:document.getElementById("nextlab"),
    live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = m; }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    /* Segments generate from S.length. Never hardcode a slide count. */
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    /* Plain navigation. Nothing gates anything, so the only disabled states
       are the two ends of the deck, and the last slide says so rather than
       offering a button that does nothing. */
    el.back.disabled = (i === 0);
    /* The span, never the button: setting textContent on the button would wipe
       the chevron out of it. */
    if(i === S.length-1){ el.next.disabled = true; el.nextlab.textContent = "You are at the end"; }
    else { el.next.disabled = false; el.nextlab.textContent = "Continue"; }
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);
    el.frame.classList.toggle("wide", s.kind === "close");
    document.body.setAttribute("data-t", s.theme);

    if(s.kind === "card") renderCard(s);
    else if(s.kind === "close") renderClose(s);
    else {
      el.board.innerHTML = '<div class="intro"><p><b>Unhandled slide kind "'
        + esc(String(s.kind)) + '".</b></p><p>This deck ships card and close. '
        + 'A new kind needs its own render case rather than reusing one of these.</p></div>';
    }

    header();
    say("Slide " + (i+1) + " of " + S.length + ". " + s.h1 + ".");
  }

  function renderCard(s){
    el.board.className = "board";
    el.board.innerHTML =
      '<div class="intro">' +
        (s.body || []).map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("") +
      "</div>";
  }

  function renderClose(s){
    el.board.className = "board close";
    var rows = (s.rows || []).map(function(r){
      return '<div class="tr"><div class="tn">' + esc(r.name) + "</div>" +
             '<div class="tv">' + esc(r.ev) + "</div></div>";
    }).join("");
    el.board.innerHTML = '<div class="intro" style="max-width:none">' +
      "<p>" + esc(s.lead) + "</p>" +
      '<div class="recall">' + rows + "</div>" +
      '<div class="closeq"><span>' + esc(s.askLater) + "</span>" + esc(s.tail) + "</div></div>";
  }

  /* ---------------- navigation ----------------
     Three input methods: visible buttons, keyboard arrows, and swipe. Nothing
     blocks forward movement. */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  /* One predicate, used by both the key handler and the swipe handler, so they
     can never drift apart about what owns an interaction. */
  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return true;
    var r = node.getAttribute && node.getAttribute("role");
    return r === "slider" || r === "textbox" || r === "spinbutton" || r === "listbox";
  }

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    if(ownsKeys(e.target)){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    /* Horizontal dominance required, or a thumb-flick down the portrait layout
       skips a slide. */
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ----------------
     measure-fit.mjs steps through the deck with this. Without it only slide 1
     can be measured, which is exactly how an overflowing slide ships. */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    /* Nothing persists, because nothing is collected. Reset means back to the
       first slide, which is the whole of a first visit's state. */
    reset:function(){ i = 0; render(); },
    state:function(){ return { i:i, theme:S[i].theme }; }
  };
})();
</script>
</body>
</html>
