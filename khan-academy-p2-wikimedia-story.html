<style>
  /* ===============================================================
     Extern design system. These five values are the entire palette.
     Do not add a sixth. Every tint below is an rgba() of #001D69, not
     a new hue. No state is signalled by colour alone: every state also
     carries a label or a glyph.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, figure tiles        */
    --on-highlight:#001D69; /* accents, icons, arrows, links      */
    --bg:#FDF8F8;           /* canvas background, negative space  */
    --body:#484646;         /* body copy, captions                */
    --title:#1C1B1B;        /* headings, primary text             */

    /* the one tint in the build: the unreached progress segments. Same ink,
       low alpha, not a sixth colour. It is decorative only, and the frame
       count next to it carries the same information in words. */
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;    /* UI feedback            */
    --t-frame:300ms;   /* between-frame movement */
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- the 960x540 canvas, scaled down only, never up ----
     flex:0 0 auto is load bearing. As a shrinkable flex item the canvas
     lays out at the viewport width between 600 and 899px and the JS
     transform then scales it a second time, double shrinking the design.
     The canvas always holds 960 in layout and the transform does all of
     the fitting. getComputedStyle(stage).width must read 960px. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  /* the frame takes programmatic focus so a screen reader announces a new
     frame. It is not a control, so it draws no ring of its own. */
  .frame{position:absolute;inset:0;padding:16px 40px 12px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:5px}
  .prog{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:26px;height:4px;border-radius:2px;background:var(--tint2)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{
    margin-left:auto;flex:0 0 auto;background:var(--highlight);border-radius:20px;
    padding:3px 10px;font-size:11.5px;font-weight:600;color:var(--on-highlight);white-space:nowrap;
  }

  h1{font-size:21px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:7px}

  /* ---- the diagram band. Three slots, left to right in the order the
         three things actually appeared. A slot arrives on its own frame
         and then stays put: nothing already on screen moves. ---- */
  .dia{flex:0 0 auto;display:flex;align-items:stretch;gap:0;min-height:0}
  /* Slots that have not arrived yet still hold their column, invisibly. That
     is why a card never moves or changes width as the story builds: the
     layout on frame 1 is already the layout on frame 3. */
  .card.ghost,.conn.ghost{visibility:hidden}
  .card{
    flex:1 1 0;min-width:0;background:var(--highlight);border-radius:12px;
    padding:10px 13px 11px;display:flex;flex-direction:column;
  }
  /* an earlier slot, still fully legible. Not dimmed: the fill drops to the
     page background and a border carries the edge, so no text sits under an
     opacity layer. */
  .card.prior{background:transparent;border:1.5px solid var(--on-highlight)}
  .card .lab{
    font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--on-highlight);margin-bottom:3px;
  }
  .card h2{font-size:15.5px;line-height:1.2;font-weight:600;color:var(--title);margin-bottom:4px}
  .card .sub{font-size:12.5px;line-height:1.38;color:var(--body);margin-bottom:5px}
  .card ul{list-style:none;margin:0;padding:0}
  .card li{
    font-size:12.5px;line-height:1.36;color:var(--body);
    display:flex;gap:6px;margin-bottom:3px;
  }
  .card li:last-child{margin-bottom:0}
  .card li b{color:var(--title);font-weight:600}
  .card li .bul{flex:0 0 auto;color:var(--on-highlight);font-weight:700;line-height:1.36}

  /* the connector between two slots. Arrow plus a two word label, so the
     relationship is on screen and not only in the prose below. */
  .conn{
    flex:0 0 auto;width:78px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;padding:0 4px;
  }
  .conn svg{width:44px;height:14px;display:block;color:var(--on-highlight)}
  .conn span{
    font-size:11.5px;line-height:1.2;font-weight:600;color:var(--on-highlight);text-align:center;
  }

  /* ---- frame 4: the figures, then the question ---- */
  .figs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:0 0 auto}
  .fig{background:var(--highlight);border-radius:11px;padding:9px 11px 10px}
  /* the four tiles arrive in sequence. The delays are on the container's
     children, so nothing is hidden before its animation starts: the
     keyframes only move opacity, and with motion off all four are simply
     there. */
  .figs.fin .fig:nth-child(1){animation:fin var(--t-frame) var(--ease-out) both}
  .figs.fin .fig:nth-child(2){animation:fin var(--t-frame) var(--ease-out) 90ms both}
  .figs.fin .fig:nth-child(3){animation:fin var(--t-frame) var(--ease-out) 180ms both}
  .figs.fin .fig:nth-child(4){animation:fin var(--t-frame) var(--ease-out) 270ms both}
  /* three recap tiles, not four figure tiles. No figure appears on this
     build at all: the numbers live in the module. */
  .figs.three{grid-template-columns:repeat(3,1fr)}
  .fig .fk{font-size:14px;line-height:1.22;font-weight:600;color:var(--on-highlight);margin-bottom:4px}
  .fig .fv{font-size:23px;line-height:1.1;font-weight:600;color:var(--on-highlight);margin-bottom:3px}
  .fig .fl{font-size:11.5px;line-height:1.32;color:var(--body)}
  .fig .fl b{color:var(--title);font-weight:600}

  .freebar{
    flex:0 0 auto;margin-top:9px;border:1.5px solid var(--on-highlight);border-radius:11px;
    padding:8px 12px;display:flex;align-items:flex-start;gap:8px;
  }
  .freebar svg{width:16px;height:16px;flex:0 0 auto;display:block;color:var(--on-highlight);margin-top:1px}
  .freebar p{font-size:13.5px;line-height:1.38;color:var(--title)}

  /* ---- the strip under the diagram ---- */
  .strip{flex:0 0 auto;margin-top:9px;max-width:96ch}
  /* on the closing frame the question panel is the thing that grows */
  /* a floor, not a fixed height. A floor can never clip: a wider font
     stack just makes the panel taller. */
  .strip.grow{flex:0 0 auto;display:flex;flex-direction:column}
  .strip.grow .ask{flex:0 0 auto;min-height:104px;align-items:center}
  .slab{
    font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--on-highlight);margin-bottom:3px;
  }
  .stext{font-size:13.5px;line-height:1.44;color:var(--body)}
  .stext b{color:var(--title);font-weight:600}

  .ask{
    background:var(--highlight);border-radius:12px;padding:10px 14px;
    display:flex;align-items:flex-start;gap:10px;
  }
  .ask svg{width:22px;height:22px;flex:0 0 auto;display:block;color:var(--on-highlight);margin-top:2px}
  .ask .q{font-size:22px;line-height:1.18;font-weight:600;color:var(--title);margin-bottom:3px}
  .ask .qs{font-size:13px;line-height:1.4;color:var(--body)}

  .src{flex:0 0 auto;margin-top:7px;font-size:11.5px;line-height:1.38}
  .src a{color:var(--on-highlight)}

  /* ---- motion. A slot arrives, the prose crossfades, a figure counts.
         Nothing moves that is not new information. ---- */
  @keyframes cin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .cin{animation:cin var(--t-frame) var(--ease-out) both}
  @keyframes fin{from{opacity:0}to{opacity:1}}
  .fin{animation:fin var(--t-frame) var(--ease-out) both}
  @keyframes tin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .tfade{animation:tin var(--t-frame) var(--ease-io) both}

  /* ---- controls. margin-top:auto plus flex:0 0 auto means anything above
         can grow without ever pushing this row off the canvas. ---- */
  .bar{
    margin-top:auto;padding-top:8px;flex:0 0 auto;
    display:flex;align-items:center;gap:11px;flex-wrap:wrap;min-height:48px;
  }
  button.nav{
    font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);
    transition:opacity var(--t-fast) var(--ease-out);
  }
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:hover{opacity:.9}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  .hint{font-size:11.5px;line-height:1.36;max-width:62ch;color:var(--body)}
  .hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    /* Drop flex on the body. As a flex item #stage inherits min-width:auto
       and refuses to shrink below its content width, which pushes the
       diagram off screen. Block layout removes that floor. */
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{
      width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important;
    }
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px;margin-bottom:14px}
    .dia{display:block}
    .card{margin-bottom:0;padding:13px 14px}
    .card .lab{font-size:12px}
    .card h2{font-size:18px}
    .card .sub{font-size:16px;line-height:1.5}
    .card li{font-size:16px;line-height:1.5;margin-bottom:6px}
    /* the connector turns vertical and keeps its label, so the reading order
       stays Wikipedia, then the Foundation, then Enterprise */
    .conn{width:auto;flex-direction:row;justify-content:flex-start;gap:9px;padding:11px 4px}
    .conn svg{width:16px;height:34px}
    .conn span{font-size:14px;text-align:left}
    .figs{display:block}
    .fig{margin-bottom:10px;padding:12px 14px}
    .fig .fv{font-size:26px}
    .fig .fk{font-size:18px}
    .figs.three{display:block}
    .fig .fl{font-size:15px;line-height:1.45}
    .freebar{margin-top:6px;padding:12px 14px}
    .freebar p{font-size:16px;line-height:1.5}
    /* portrait: a reserved column has nothing to reserve, so it goes away */
    .card.ghost,.conn.ghost{display:none}
    .strip.grow{display:block}
    .strip.grow .ask{min-height:0;align-items:flex-start}
    .strip{margin-top:16px;max-width:none}
    .slab{font-size:12px}
    .stext{font-size:16px;line-height:1.5}
    .ask{padding:14px 15px}
    .ask .q{font-size:23px}
    .ask .qs{font-size:15px}
    .src{font-size:14px;margin-top:14px}
    .bar{margin-top:20px;padding-top:0}
    button.nav{font-size:16px;padding:13px 20px}
    .hint{font-size:13.5px;flex:1 1 100%}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

  <div class="nsf">
    <h1>Wikipedia, the Foundation, and Enterprise</h1>
    <p>Three things get treated as one thing, and they are not. Here they are separately, in the order they appeared, and then the question they leave you with.</p>

    <h2>1. Wikipedia, the encyclopedia</h2>
    <p>Wikipedia is the encyclopedia itself. It is free to read and free to edit, and it has never charged a reader to open a page.</p>
    <p>Source: Wikipedia was launched on 15 January 2001, <a href="https://en.wikipedia.org/wiki/Wikipedia">en.wikipedia.org/wiki/Wikipedia</a>.</p>

    <h2>2. The Wikimedia Foundation, the nonprofit that runs it</h2>
    <p>The Wikimedia Foundation is the nonprofit organisation behind Wikipedia. It hosts the encyclopedia and keeps it running, and it is funded overwhelmingly by small donations from readers.</p>
    <p class="box"><strong>Hold this distinction.</strong> The encyclopedia and the organisation that keeps it running are two different things. Wikipedia is the encyclopedia. The Wikimedia Foundation is the nonprofit with the staff, the budget and the revenue. When you read a figure about money, it belongs to the Foundation, not to the encyclopedia.</p>
    <p>Source: the Foundation was founded in 2003, <a href="https://wikimediafoundation.org/about/">wikimediafoundation.org/about</a>.</p>

    <h2>3. Wikimedia Enterprise, a paid product</h2>
    <p>Wikimedia Enterprise came after both of the above. It is a paid product the Foundation runs, and it is neither the encyclopedia nor the organisation. It is one product inside the organisation.</p>
    <p>Its first paying customer was Google. The Internet Archive was announced alongside Google and receives the service free, so the precise phrasing matters: Google was the first <strong>paying</strong> customer.</p>
    <p>Source: <a href="https://wikimediafoundation.org/news/2022/06/21/wikimedia-enterprise-announces-google-and-internet-archive-first-customers/">Wikimedia Foundation announcement of its first Enterprise customers</a>.</p>

    <h2>4. The question this leaves you</h2>
    <p>Everything on Wikipedia is still free to everyone. Nothing above changed that. The encyclopedia is free to read and free to edit. The Foundation is funded overwhelmingly by small donations from readers. And Enterprise is a paid product sold to commercial customers, with nothing on Wikipedia moved behind a payment.</p>
    <div class="ask"><p>So who is paying, and what for?</p></div>
    <p>Stop on that question and hold it. The reading that follows this screen answers it. Work out what you would guess first, then check yourself against what you read next.</p>

    <p class="foot">No revenue figure, customer count or growth rate appears on this screen, on purpose. They are all in the reading, with the period each one belongs to attached. Wikimedia&rsquo;s fiscal year ends on 30 June, which does not line up with the calendar years other companies in this project report on.</p>
  </div>

  ];

  /* ===============================================================
     THE FOUR FRAMES. One beat each. The last one is a question and it
     stays a question: there is no fifth frame and no answer here.
     =============================================================== */
  var F = [
    {
      seg:"Wikipedia",
      chip:"1 of 3 things",
      h1:"Start with the encyclopedia",
      slots:["wp"],
      arrive:"wp",
      slab:"What this frame establishes",
      strip:"<b>Wikipedia is the encyclopedia.</b> Anyone can read it, and anyone can edit it. No reader has ever been charged to open a page. Hold on to that, because it stays true through every frame that follows.",
      src:'Source: Wikipedia was launched on 15 January 2001, <a href="https://en.wikipedia.org/wiki/Wikipedia" target="_blank" rel="noopener">en.wikipedia.org/wiki/Wikipedia</a>.',
      say:"Frame 1 of 4. Wikipedia, the encyclopedia. Free to read, free to edit, and it has never charged a reader.",
      hint:"Arrow keys move through the four frames, or use the buttons."
    },
    {
      seg:"The Foundation",
      chip:"2 of 3 things",
      h1:"The organisation behind it is a separate thing",
      slots:["wp","wmf"],
      arrive:"wmf",
      slab:"The distinction to hold",
      strip:"<b>The encyclopedia and the organisation that keeps it running are two different things.</b> Wikipedia is the encyclopedia. The Wikimedia Foundation is the nonprofit behind it, and it is the one with staff, a budget and revenue. Almost all of that money arrives as small donations from readers. So when you meet a figure about money later, check which of the two it belongs to.",
      src:'Source: the Foundation was founded in 2003, <a href="https://wikimediafoundation.org/about/" target="_blank" rel="noopener">wikimediafoundation.org/about</a>.',
      say:"Frame 2 of 4. The Wikimedia Foundation, the nonprofit that runs Wikipedia, funded overwhelmingly by small donations from readers. The encyclopedia and the organisation are two different things.",
      hint:"Arrow keys move through the four frames, or use the buttons."
    },
    {
      seg:"Enterprise",
      chip:"3 of 3 things",
      h1:"And a paid product arrived later",
      slots:["wp","wmf","ent"],
      arrive:"ent",
      slab:"Read the wording carefully",
      strip:"<b>Wikimedia Enterprise is a third thing.</b> Not the encyclopedia, not the organisation, but one paid product the organisation runs. Its first paying customer was Google. The Internet Archive was announced at the same time and pays nothing for it, so name both, or say <b>first paying</b> and mean it. Getting that phrasing loose is how a true fact turns into a wrong one.",
      src:'Source: <a href="https://wikimediafoundation.org/news/2022/06/21/wikimedia-enterprise-announces-google-and-internet-archive-first-customers/" target="_blank" rel="noopener">Wikimedia Foundation announcement of its first Enterprise customers</a>.',
      say:"Frame 3 of 4. Wikimedia Enterprise, a paid product the Foundation launched later. Google was the first paying customer. The Internet Archive was announced alongside it and receives the service free.",
      hint:"Arrow keys move through the four frames, or use the buttons."
    },
    {
      seg:"The question",
      chip:"The question",
      h1:"Everything on Wikipedia is still free to everyone",
      kind:"close",
      free:"Nothing on the last three frames changed that. Not one page moved behind a payment.",
      slab:"So here is the question to carry into the next screen",
      q:"So who is paying, and what for?",
      qs:"Work out what you would guess, then read on and check yourself. The answer is on the next screen, not on this one.",
      src:'No revenue figure, customer count or growth rate appears on this screen, on purpose. They are in the reading, each one with the period it belongs to. Wikimedia&rsquo;s fiscal year ends on 30 June, which does not line up with the calendar years other companies in this project report on.',
      say:"Frame 4 of 4. Everything on Wikipedia is still free to everyone. The encyclopedia is free to read and free to edit. The Foundation is funded overwhelmingly by small donations. Enterprise is a paid product sold to commercial customers, and not one page moved behind a payment. So who is paying, and what for?",
      hint:"<b>Stop on the question.</b> Go back with Back or the left arrow key if you want to reread a frame."
    }
  ];

  /* the three columns, always in this order, and the connector that appears
     between each pair once the slot on its right has arrived */
  var ORDER = ["wp","wmf","ent"];
  var CONN = {
    wmf:{needs:"wmf", dir:"L", lab:"runs it"},
    ent:{needs:"ent", dir:"R", lab:"sells this"}
  };

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cur = 0;

  var el = {};
  ["frame","prog","segs","chip","h1","dia","strip","src","prev","next","hint","live"]
    .forEach(function(k){ el[k] = document.getElementById(k); });

  function portrait(){ return window.matchMedia("(max-width:599px)").matches; }

  /* ---------------- builders ---------------- */

  function cardHTML(key, isPrior, animate){
    var s = SLOTS[key];
    var cls = "card" + (isPrior ? " prior" : "") + (animate ? " cin" : "");
    var out = '<div class="' + cls + '" data-slot="' + key + '">' +
      '<span class="lab">' + s.lab + '</span>' +
      '<h2>' + s.h + '</h2>' +
      '<p class="sub">' + s.sub + '</p><ul>';
    for(var i = 0; i < s.li.length; i++){
      out += '<li><span class="bul" aria-hidden="true">&bull;</span><span>' + s.li[i] + '</span></li>';
    }
    return out + '</ul></div>';
  }

  function connHTML(c, animate){
    /* portrait turns the row into a column, so the arrow turns with it */
    var glyph = portrait() ? I.arrowD : (c.dir === "L" ? I.arrowL : I.arrowR);
    return '<div class="conn' + (animate ? " fin" : "") + '">' +
      glyph + '<span>' + c.lab + '</span></div>';
  }

  function recapHTML(r){
    return '<div class="fig">' +
      '<div class="fk">' + r.k + '</div>' +
      '<div class="fl">' + r.lab + '</div></div>';
  }

  /* No figure and therefore no counter. The earlier version of this build
     printed four figures here and the module then asked the student to
     guess two of them, so the figures were removed outright on
     24 August 2026 rather than animated more carefully. If a number is ever
     wanted on this screen again, the module's guess has to go first. */

  /* ---------------- render ---------------- */

  function render(animate){
    var f = F[cur];

    /* header */
    el.prog.textContent = (cur + 1) + " of " + F.length + " · " + f.seg;
    var segs = "";
    for(var k = 0; k < F.length; k++){
      segs += '<i class="' + (k === cur ? "here" : (k < cur ? "on" : "")) + '"></i>';
    }
    el.segs.innerHTML = segs;
    el.chip.textContent = f.chip;
    el.h1.textContent = f.h1;

    /* the diagram band */
    if(f.kind === "close"){
      var figs = '<div class="figs three' + (animate ? " fin" : "") + '">';
      for(var i = 0; i < RECAP.length; i++) figs += recapHTML(RECAP[i]);
      figs += '</div>';
      figs += '<div class="freebar' + (animate ? " fin" : "") + '">' + I.globe +
              '<p><b>Everything on Wikipedia is still free to everyone.</b> ' + f.free + '</p></div>';
      /* .dia is a flex row in landscape; the closing frame stacks instead */
      el.dia.style.display = "block";
      el.strip.classList.add("grow");
      el.dia.innerHTML = figs;
    } else {
      el.dia.style.display = "";
      el.strip.classList.remove("grow");
      var out = "";
      for(var s = 0; s < ORDER.length; s++){
        var key = ORDER[s];
        var here = f.slots.indexOf(key) > -1;
        out += here ? cardHTML(key, key !== f.arrive, animate && key === f.arrive)
                    : '<div class="card ghost" aria-hidden="true"></div>';
        var c = (s === 0) ? CONN.wmf : (s === 1 ? CONN.ent : null);
        if(c){
          out += (f.slots.indexOf(c.needs) > -1)
            ? connHTML(c, animate && f.arrive === c.needs)
            : '<div class="conn ghost" aria-hidden="true"></div>';
        }
      }
      el.dia.innerHTML = out;
    }

    /* the strip */
    if(f.kind === "close"){
      el.strip.innerHTML =
        '<div class="slab">' + f.slab + '</div>' +
        '<div class="ask">' + I.ask +
          '<div><p class="q">' + f.q + '</p><p class="qs">' + f.qs + '</p></div></div>';
    } else {
      el.strip.innerHTML =
        '<div class="slab">' + f.slab + '</div>' +
        '<p class="stext">' + f.strip + '</p>';
    }
    el.src.innerHTML = f.src;
    el.hint.innerHTML = f.hint;

    if(animate && !reduce){
      ["strip","src"].forEach(function(k){
        el[k].classList.remove("tfade");
        void el[k].offsetWidth;
        el[k].classList.add("tfade");
      });
    }

    /* Controls. A disabled or hidden button that still holds focus drops
       activeElement to BODY and strands the keyboard, so focus is moved
       off a button BEFORE that button is taken out of the tab order. */
    var first = (cur === 0), last = (cur === F.length - 1);
    var active = document.activeElement;
    var losing = (first && active === el.prev) || (last && active === el.next);
    /* the button that is about to be available has to be visible before it
       can take focus. Focusing a still hidden button silently fails and
       drops activeElement to BODY. */
    if(!first){ el.prev.hidden = false; el.prev.disabled = false; }
    if(!last){  el.next.hidden = false; el.next.disabled = false; }
    if(losing){ try{ (first ? el.next : el.prev).focus(); }catch(e){} }
    if(first){ el.prev.hidden = true; el.prev.disabled = true; }
    if(last){  el.next.hidden = true; el.next.disabled = true; }

    /* whatever happened above, focus must end on a real element */
    var a = document.activeElement;
    if(!a || a === document.body || a.hidden){ el.frame.focus(); }

    el.live.textContent = f.say;
  }

  function show(i, animate){
    if(i < 0 || i >= F.length) return;
    cur = i;
    render(animate);
  }

  /* ---------------- navigation ---------------- */
  el.prev.addEventListener("click", function(){ if(cur > 0) show(cur - 1, true); });
  el.next.addEventListener("click", function(){ if(cur < F.length - 1) show(cur + 1, true); });

  document.addEventListener("keydown", function(e){
    var tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
    if(tag === "input" || tag === "textarea") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === "ArrowRight" || e.key === "ArrowDown"){
      e.preventDefault(); if(cur < F.length - 1) show(cur + 1, true);
    } else if(e.key === "ArrowLeft" || e.key === "ArrowUp"){
      e.preventDefault(); if(cur > 0) show(cur - 1, true);
    } else if(e.key === "Home"){
      e.preventDefault(); show(0, true);
    } else if(e.key === "End"){
      e.preventDefault(); show(F.length - 1, true);
    }
  });

  var tx = 0, ty = 0, tracking = false;
  document.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1){ tracking = false; return; }
    tracking = true; tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(!tracking || !e.changedTouches.length) return;
    tracking = false;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    if(dx < 0 && cur < F.length - 1) show(cur + 1, true);
    if(dx > 0 && cur > 0) show(cur - 1, true);
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  var wasPortrait = portrait();
  function fit(){
    var p = portrait();
    if(p){ stage.style.transform = ""; }
    else {
      var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
      stage.style.transform = "scale(" + s + ")";
    }
    /* a layout flip is not a beat change, so it must not replay the motion,
       but the arrows have to be redrawn in the other orientation */
    if(p !== wasPortrait){ wasPortrait = p; render(false); }
  }
  window.addEventListener("resize", fit);

  render(false);
  fit();

  /* exposed for render QA only: lets a headless run force a state */
  window.__wm = {
    go:function(i){ show(i, true); },
    jump:function(i){ show(i, false); },
    count:F.length,
    state:function(){ return { i:cur }; }
  };
})();
</script>
</body>
</html>
