<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What counts as an asset?</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#FDF8F8;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
color:#484646;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#w{position:absolute;top:0;left:0;width:960px;height:540px;overflow:hidden;transform-origin:top left}
.slide{position:absolute;top:0;left:0;width:960px;height:540px;
padding:24px 72px 20px;display:grid;grid-template-rows:20px 14px 402px 16px 44px;
background:#FDF8F8;text-align:left}
.slide[hidden]{display:none}
.t1{background:#FDF8F8}
.t2{background:#F6F4EE}
.t3{background:#F1F5F1}
.t4{background:#F5F1F9}
.t5{background:#EFF2F8}
.t6{background:#FBF1F2}
.hd{grid-row:1;display:flex;align-items:center;justify-content:space-between;
font-size:13px;line-height:20px;color:#484646}
.hd .rh{font-weight:500}
.hd .pos{font-variant-numeric:tabular-nums}
.bd{grid-row:3;height:402px}
.sa .bd{display:flex;flex-direction:column;justify-content:center}
.sb .bd{display:flex;flex-direction:column;justify-content:center}
.sc .bd{display:flex;flex-direction:column;justify-content:center}
.sd .bd{display:flex;flex-direction:column;justify-content:flex-start;padding-top:4px}
.ab{grid-row:5;height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.abl,.abr{display:flex;align-items:center;gap:12px}
h1,h2{font-weight:600;color:#1C1B1B}
h1{font-size:30px;line-height:1.18;width:fit-content;max-width:100%}
h2{font-size:28px;line-height:1.2;width:fit-content;max-width:100%}
h1:focus,h2:focus,h1.fx,h2.fx{outline:3px solid #001D69;outline-offset:4px;border-radius:2px}
.h-sort{font-size:22px}
.h-four{font-size:26px}
.prompt{font-size:18px;line-height:1.5;color:#1C1B1B;margin-top:14px;max-width:700px}
.sub{font-size:15px;line-height:1.5;color:#484646;margin-top:10px}
.cnt{font-size:13px;line-height:1.4;color:#484646;font-variant-numeric:tabular-nums}

/* sort board */
.grp{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.item{border:1px solid rgba(0,29,105,0.55);border-radius:8px;padding:3px 10px;
display:flex;align-items:center;gap:10px;min-height:32px;background:transparent}
.item .n{flex:0 0 16px;font-size:15px;font-weight:500;color:#001D69;
font-variant-numeric:tabular-nums;text-align:right}
.item .c{flex:1 1 auto;font-size:15px;font-weight:500;line-height:1.3;color:#1C1B1B}
.seg{flex:0 0 auto;display:flex;gap:6px}
.opt{font-family:inherit;font-size:14px;font-weight:500;line-height:1;height:24px;padding:0 9px;
display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(0,29,105,0.55);
border-radius:999px;background:transparent;color:#001D69;cursor:pointer;white-space:nowrap}
.opt[aria-checked="true"]{background:#DCE1FF;border-color:#001D69;box-shadow:inset 0 0 0 1px #001D69}
.opt[aria-checked="true"] .ic{animation:pop .28s cubic-bezier(.2,.8,.3,1) both}
.opt:focus-visible{outline:3px solid #001D69;outline-offset:2px}
.item.done{border-color:#001D69}
/* completion meter: how many placed, never how many right */
.meter{height:3px;width:100%;max-width:300px;border-radius:999px;
background:rgba(0,29,105,0.22);margin-top:14px;overflow:hidden}
.meter i{display:block;height:100%;width:0%;background:#001D69;border-radius:999px;
transition:width .34s cubic-bezier(.2,.7,.3,1)}

/* reveal */
.ban{background:#DCE1FF;border-left:4px solid #001D69;border-radius:0 10px 10px 0;
padding:11px 18px;display:flex;align-items:center;gap:10px}
.banh{font-size:24px;font-weight:600;line-height:1.2;color:#1C1B1B}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;margin-top:12px}
.col>.ch{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;font-family:inherit;
line-height:1.4;color:#484646;margin-bottom:6px}
.col.key{border-left:3px solid #001D69;padding-left:16px;margin-left:-19px}
.col.key>.ch{color:#001D69}
.rlist{display:flex;flex-direction:column;gap:2px}
.rrow{display:flex;align-items:center;gap:8px;min-height:24px}
.rrow .n{flex:0 0 16px;font-size:14px;color:#001D69;font-variant-numeric:tabular-nums;text-align:right}
.rrow .c{flex:1 1 auto;font-size:14px;font-weight:500;line-height:1.3;color:#1C1B1B}
.rrow .ci{flex:0 0 auto;line-height:0}
.you{font-size:13px;line-height:1.4;color:#484646;white-space:nowrap;flex:0 0 auto}
.gcap{font-size:13px;line-height:1.45;color:#484646;margin-top:7px}

/* the four */
.four{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.fcard{background:#DCE1FF;border-left:4px solid #001D69;border-radius:0 10px 10px 0;
padding:8px 16px;display:flex;align-items:flex-start;gap:11px}
.fcard .ci{flex:0 0 auto;line-height:0;padding-top:2px}
.fcard .ft{font-size:16px;font-weight:500;line-height:1.3;color:#1C1B1B}
.fcard .fr{font-size:14px;line-height:1.45;color:#484646;margin-top:3px}
.end{font-size:17px;line-height:1.5;color:#484646;text-align:right}
.close{font-size:30px;font-weight:600;line-height:1.28;color:#1C1B1B;max-width:800px}

.ic{display:block;width:18px;height:18px;fill:none;stroke:#001D69;stroke-width:1.8;
stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px}
.ic.lg{width:22px;height:22px}
.btn{font-family:inherit;font-size:15px;font-weight:500;line-height:1;height:40px;
padding:0 20px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
border:1px solid #001D69;background:#001D69;color:#FDF8F8}
.btn .ic{stroke:#FDF8F8}
.btn.sec{background:transparent;color:#001D69}
.btn.sec .ic{stroke:#001D69}
.btn:disabled{background:transparent;border-color:#484646;color:#484646;cursor:default}
.btn:disabled .ic{stroke:#484646}
.btn:focus-visible{outline:3px solid #001D69;outline-offset:2px}
.btn.ready{animation:ready .4s ease-out 1}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.55)}62%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes ready{0%{box-shadow:0 0 0 0 rgba(0,29,105,.34)}100%{box-shadow:0 0 0 9px rgba(0,29,105,0)}}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.13)}100%{transform:scale(1)}}
.slide:not([hidden]) .an{animation:rise .36s cubic-bezier(.2,.7,.3,1) both;
animation-delay:calc(var(--i,0) * 42ms)}
.bumped{animation:bump .3s cubic-bezier(.2,.8,.3,1) both}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* portrait */
#w.pm{width:540px;height:720px}
#w.pm .slide{width:540px;height:720px;padding:24px 32px 20px;
grid-template-rows:20px 14px 582px 16px 44px}
#w.pm .bd{height:582px}
#w.pm h1,#w.pm .close{font-size:22px;line-height:1.26}
#w.pm h2,#w.pm .h-sort,#w.pm .h-four{font-size:22px;line-height:1.24}
#w.pm .prompt{font-size:16px;max-width:100%}
#w.pm .sub,#w.pm .ln{font-size:16px}
#w.pm .cols{grid-template-columns:1fr;gap:16px 0}
#w.pm .col.key{margin-left:0;padding-left:13px}
#w.pm .banh{font-size:20px}
#w.pm .item{min-height:0;padding:6px 9px;gap:8px;align-items:flex-start}
#w.pm .item .c{font-size:15px;line-height:1.3;padding-top:2px}
#w.pm .item .n{padding-top:3px}
#w.pm .seg{gap:5px;flex-wrap:nowrap;padding-top:1px}
#w.pm .opt{font-size:13px;padding:0 8px;height:23px}
#w.pm .grp{gap:5px}
#w.pm .rrow{min-height:0;align-items:flex-start;gap:6px}
#w.pm .rrow .c{font-size:14px}
#w.pm .you{font-size:13px}
#w.pm .rlist{gap:4px}
#w.pm .gcap{margin-top:10px}
#w.pm .fcard .ft{font-size:15px}
#w.pm .end{font-size:13px}
</style>
</head>
<body>
<div id="w">
<section class="slide sa t1" id="sl1" role="group" aria-label="Slide 1 of 6">
<div class="hd" aria-hidden="true"><span class="rh">What counts as an asset?</span><span class="pos">1 of 6</span></div>
<div class="bd">
<div>
<h1 class="an" tabindex="-1" id="h1">Ten Things Cumberland Owns</h1>
<p class="prompt an" style="--i:1">Ten things Cumberland Claims Services owns. Which of them count as assets, worth protecting and worth writing down?</p>
<p class="sub an" style="--i:2">No definition yet, on purpose. Sort all ten, then find out.</p>
</div>
</div>
<div class="ab"><div class="abl"></div><div class="abr">
<button class="btn" type="button" id="go0">Start<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><line x1="4" y1="12" x2="18.5" y2="12"/><polyline points="13 6.5 18.5 12 13 17.5"/></svg></button>
</div></div>
</section>
</div>
<script>
(function(){
var ITEM=[
"The server the billing platform runs on",
"The billing platform itself",
"The database holding the claims",
"The web portal clinics submit through",
"A laptop belonging to a claims clerk",
"The file transfer server",
"A web address the company registered years ago",
"A connection an outside supplier uses to reach Cumberland&rsquo;s systems",
"A file the billing platform exports every month",
"A cloud account nobody logs into any more"];
var LBL=["Asset","Not an asset"];
var REASON=[
"Every public address the company has hangs off it.",
"It is a way in, and it belongs to somebody who does not work here.",
"It is a copy of the data, sitting somewhere nobody maintains.",
"Still paid for, and it holds credentials nobody has changed since the day it was opened."];
var BAN="All ten. Every one of them.";
var CAP6="Nobody argues about these six.";
var CAP4="Easy to leave off";
var GCAP="You were not told what an asset was before you sorted. That was the point.";
var F_H="These Four Are the Ones People Leave Off";
var F_SUB="Not because they are hard. Because they do not look like equipment.";
var CLOSE="A forgotten server is exposed from the day it is switched on, not from the day somebody notices it.";
var TINT=["#FDF8F8","#F6F4EE","#F1F5F1","#F5F1F9","#EFF2F8","#FBF1F2"];
var RUNHEAD="What counts as an asset?";
var N=6;
var P={
off:'<circle cx="12" cy="12" r="8.2"/>',
on:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.6" fill="#001D69" stroke="none"/>',
ok:'<circle cx="12" cy="12" r="9"/><polyline points="7.7 12.3 10.6 15.2 16.3 8.8"/>',
dot:'<circle cx="12" cy="12" r="3.4" fill="#001D69" stroke="none"/>',
eye:'<path d="M2.6 12S6 5.9 12 5.9 21.4 12 21.4 12 18 18.1 12 18.1 2.6 12 2.6 12Z"/><circle cx="12" cy="12" r="3.1"/>',
box:'<path d="M4.2 8.1 12 4.2l7.8 3.9v7.8L12 19.8l-7.8-3.9Z"/><polyline points="4.2 8.1 12 12 19.8 8.1"/><line x1="12" y1="12" x2="12" y2="19.8"/>',
back:'<line x1="20" y1="12" x2="5.5" y2="12"/><polyline points="11 6.5 5.5 12 11 17.5"/>',
next:'<line x1="4" y1="12" x2="18.5" y2="12"/><polyline points="13 6.5 18.5 12 13 17.5"/>'};
function ic(d,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+d+'</svg>';}
function hdr(n){return '<div class="hd" aria-hidden="true"><span class="rh">'+RUNHEAD+'</span><span class="pos">'+n+' of '+N+'</span></div>';}

var w=document.getElementById('w');
var slides=[document.getElementById('sl1')];
var heads=[document.getElementById('h1')];
var pick=[null,null,null,null,null,null,null,null,null,null];
var rows=[],cur=0,revealed=false,built=false;
var boards=[];  /* {grp,meter,cnt,btn,from,to} one per board of five */
var prevOf={};  /* explicit back targets, so the sort cannot be re-entered after Check */
var seen={};    /* entrance cascade plays once per slide, never on a back-navigation */

function armHead(h){if(!h){return;}h.addEventListener('blur',function(){h.classList.remove('fx');});}

function mk(n,bodyHtml,extraCls,leftBtn,rightBtn){
  var s=document.createElement('section');
  s.className='slide '+extraCls+' t'+n;
  s.setAttribute('role','group');
  s.setAttribute('aria-label','Slide '+n+' of '+N);
  s.hidden=true;
  s.innerHTML=hdr(n)+'<div class="bd">'+bodyHtml+'</div>'+
    '<div class="ab"><div class="abl">'+leftBtn+'</div><div class="abr">'+rightBtn+'</div></div>';
  w.appendChild(s);
  slides.push(s);
  var h=s.querySelector('h1,h2');
  heads.push(h);
  armHead(h);
  return s;
}
function backBtn(){return '<button class="btn sec" type="button" data-nav="-1">'+ic(P.back)+'Back</button>';}
function nextBtn(label){return '<button class="btn" type="button" data-nav="1">'+label+ic(P.next)+'</button>';}

/* ---------- slides 2 and 3: the sort, five items per board ---------- */
function buildBoards(){
  for(var b=0;b<2;b++){(function(b){
    var from=b*5,to=from+5,n=b+2,last=(b===1);
    var s=mk(n,
      '<h2 class="an h-sort" tabindex="-1">'+(last?'And the Last Five':'Sort the First Five')+'</h2>'+
      '<div class="grp" id="grp'+b+'"></div>'+
      '<div class="meter" role="presentation"><i id="mf'+b+'"></i></div>',
      'sb',
      backBtn(),
      '<span class="cnt" id="cnt'+b+'" role="status" aria-live="polite">5 left to place</span>'+
      '<button class="btn" type="button" id="btn'+b+'" disabled>'+(last?'Check':'Next')+ic(P.next)+'</button>');
    var bo={grp:s.querySelector('#grp'+b),meter:s.querySelector('#mf'+b),
            cnt:s.querySelector('#cnt'+b),btn:s.querySelector('#btn'+b),from:from,to:to};
    boards.push(bo);
    for(var i=from;i<to;i++){(function(i){
      var r=document.createElement('div');
      r.className='item an';
      r.style.setProperty('--i',String(i-from+1));
      r.innerHTML='<span class="n">'+(i+1)+'</span><p class="c" id="c'+i+'">'+ITEM[i]+'</p>'+
        '<div class="seg" role="radiogroup" aria-labelledby="c'+i+'">'+
        '<button class="opt" type="button" role="radio" aria-checked="false" tabindex="0" data-v="0">'+
        ic(P.off,'sm')+LBL[0]+'</button>'+
        '<button class="opt" type="button" role="radio" aria-checked="false" tabindex="-1" data-v="1">'+
        ic(P.off,'sm')+LBL[1]+'</button></div>';
      bo.grp.appendChild(r);
      rows[i]=r;
      var opts=r.querySelectorAll('.opt');
      for(var v=0;v<2;v++){(function(v){
        opts[v].addEventListener('click',function(){place(i,v);});
        opts[v].addEventListener('keydown',function(e){keyOpt(e,i,v);});
      })(v);}
    })(i);}
    bo.btn.addEventListener('click',function(){
      if(!full(b)){return;}
      if(last){reveal();}else{show(2);}
    });
  })(b);}
  prevOf[2]=1;prevOf[3]=2;
}
function full(b){
  var bo=boards[b];
  for(var i=bo.from;i<bo.to;i++){if(pick[i]===null){return false;}}
  return true;
}
function place(i,v){
  if(revealed){return;}
  pick[i]=v;
  var opts=rows[i].querySelectorAll('.opt');
  for(var q=0;q<2;q++){
    var on=q===v;
    opts[q].setAttribute('aria-checked',on?'true':'false');
    opts[q].setAttribute('tabindex',on?'0':'-1');
    opts[q].innerHTML=ic(on?P.on:P.off,'sm')+LBL[q];
  }
  rows[i].classList.add('done');
  count(i<5?0:1);
}
function keyOpt(e,i,v){
  if(revealed){return;}
  var k=e.key,nx=null;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowUp'){nx=(v+1)%2;}
  if(k==='Home'){nx=0;}
  if(k==='End'){nx=1;}
  if(nx!==null){
    e.preventDefault();e.stopPropagation();
    place(i,nx);
    rows[i].querySelectorAll('.opt')[nx].focus();
  }
}
function count(b){
  var bo=boards[b],done=0,i;
  for(i=bo.from;i<bo.to;i++){if(pick[i]!==null){done++;}}
  bo.meter.style.width=(done*20)+'%';
  var was=bo.btn.disabled;
  if(done===5){
    bo.cnt.textContent='All five placed.';
    bo.btn.disabled=false;
    if(was){bo.btn.classList.remove('ready');void bo.btn.offsetWidth;bo.btn.classList.add('ready');}
  }else{
    bo.cnt.textContent=(5-done)+' left to place';
    bo.btn.disabled=true;
  }
  bo.cnt.classList.remove('bumped');void bo.cnt.offsetWidth;bo.cnt.classList.add('bumped');
}

/* ---------- slide 3: reveal ---------- */
function youMark(i){
  return '<span class="you">you said: '+LBL[pick[i]]+'</span>';
}
function revealCols(){
  var a='<div class="col" role="group" aria-labelledby="cap6"><h3 class="ch" id="cap6">'+ic(P.dot,'sm')+CAP6+'</h3><div class="rlist">';
  for(var i=0;i<6;i++){
    a+='<div class="rrow an" style="--i:'+(i+2)+'"><span class="n">'+(i+1)+'</span>'+
       '<span class="c">'+ITEM[i]+'</span>'+youMark(i)+'</div>';
  }
  a+='</div></div>';
  var b='<div class="col key" role="group" aria-labelledby="cap4"><h3 class="ch" id="cap4">'+ic(P.eye,'sm')+CAP4+'</h3><div class="rlist">';
  for(var j=6;j<10;j++){
    b+='<div class="rrow an" style="--i:'+(j+2)+'"><span class="ci">'+ic(P.box,'sm')+'</span>'+
       '<span class="n">'+(j+1)+'</span><span class="c">'+ITEM[j]+'</span>'+youMark(j)+'</div>';
  }
  b+='</div></div>';
  return '<div class="cols">'+a+b+'</div>';
}
function buildReveal(){
  mk(4,
    '<div class="ban an"><span class="ci">'+ic(P.ok,'lg')+'</span>'+
    '<h2 class="banh" tabindex="-1" id="banp">'+BAN+'</h2></div>'+
    revealCols()+
    '<p class="gcap an" style="--i:11">'+GCAP+'</p>',
    'sc','',nextBtn('The four'));
  var s=slides[slides.length-1];
  heads[heads.length-1]=s.querySelector('#banp');
  armHead(heads[heads.length-1]);
}

/* ---------- slide 4: the four ---------- */
function buildFour(){
  var h='<div class="four">';
  for(var j=6;j<10;j++){
    h+='<div class="fcard an" style="--i:'+(j-4)+'"><span class="ci">'+ic(P.box)+'</span>'+
       '<div><p class="ft">'+ITEM[j]+'</p><p class="fr">Asset. '+REASON[j-6]+'</p></div></div>';
  }
  h+='</div>';
  mk(5,
    '<h2 class="an h-four" tabindex="-1">'+F_H+'</h2>'+
    '<p class="sub an" style="--i:1">'+F_SUB+'</p>'+h,
    'sd',backBtn(),nextBtn('Next'));
}

/* ---------- slide 5: close ---------- */
function buildClose(){
  mk(6,'<div><h2 class="close an" tabindex="-1">'+CLOSE+'</h2></div>','sa',backBtn(),
    '<p class="end">That is the end of this activity. Go back to the module to keep reading.</p>');
}

function buildAfter(){
  if(built){return;}
  built=true;
  buildReveal();
  buildFour();
  buildClose();
}
function reveal(){
  for(var q=0;q<10;q++){if(pick[q]===null){return;}}
  revealed=true;
  for(var i=0;i<10;i++){
    var seg=rows[i].querySelector('.seg');
    if(seg){
      var p=document.createElement('p');
      p.className='you';
      p.innerHTML='you said: '+LBL[pick[i]];
      seg.parentNode.replaceChild(p,seg);
    }
  }
  for(var b=0;b<2;b++){boards[b].btn.disabled=true;boards[b].btn.innerHTML='Checked'+ic(P.ok);}
  buildAfter();
  prevOf[5]=4;prevOf[6]=5;
  show(3);
}

function show(i){
  slides[cur].hidden=true;
  cur=i;
  var s=slides[cur];
  s.hidden=false;
  if(!seen[cur]){
    seen[cur]=1;
    var an=s.querySelectorAll('.an');
    for(var q=0;q<an.length;q++){
      var el=an[q],cls=el.className;
      el.className=cls.replace(/\ban\b/,'');
      void el.offsetWidth;
      el.className=cls;
    }
  }
  document.body.style.background=TINT[cur];
  for(var k=0;k<heads.length;k++){if(heads[k]){heads[k].classList.remove('fx');}}
  if(heads[cur]){heads[cur].classList.add('fx');heads[cur].focus();}
  fit();
}
function nav(d){
  var t;
  if(d<0){
    t=prevOf[cur+1];
    if(t===undefined){return;}
    t=t-1;
  }else{
    t=cur+1;
  }
  if(t<0||t>slides.length-1){return;}
  show(t);
}

document.getElementById('go0').addEventListener('click',function(){
  if(!boards.length){buildBoards();}
  show(1);
});
w.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-nav]'):null;
  if(b&&!b.disabled){nav(parseInt(b.getAttribute('data-nav'),10));}
});
document.addEventListener('keydown',function(e){
  if(cur<3){return;}
  if(e.key==='ArrowRight'){e.preventDefault();nav(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();nav(-1);}
});

function fit(){
  var pm=window.innerWidth<600;
  if(pm){w.classList.add('pm');}else{w.classList.remove('pm');}
  var cw=pm?540:960,ch=pm?720:540;
  var s=Math.min(window.innerWidth/cw,window.innerHeight/ch,1);
  w.style.transform='scale('+s+')';
  w.style.left=Math.max(0,(window.innerWidth-cw*s)/2)+'px';
  w.style.top=Math.max(0,(window.innerHeight-ch*s)/2)+'px';
}
window.addEventListener('resize',fit);
window.addEventListener('load',fit);
armHead(heads[0]);
document.body.style.background=TINT[0];
fit();
}());
