<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's Missing From the Deck?</title>
<!--
  vCISO P5 Step 1, Module 1: What's Missing From the Deck?
  Built from the Extern deck shell (.claude/skills/build-html-slides/assets/deck-shell.html),
  matched to the house look of 09-assets/final/vciso-p3-m2-control-or-written-rule.html,
  vciso-p3-m3-guess-the-date.html and vciso-p3-m4-one-stolen-password.html.
  Governing authority: output/programs/vciso/VCISO-STYLE-GUIDE.md section 6.
  Source: Chaitanya, P5-1, in P5 Sample Pack/Interactive content sets - P5.md.
  Slide titles 01 to 08: 09-assets/cumberland-deck-template/template_spec.py
  (slide 05 has no title there, so its eyebrow, THE CONTROL GAP, is used).

  Spec rules kept here:
  - Three slides: the strip, the pick, the closing strip (a picture only).
  - Three answers in the SME's order, (b) is right. The pick locks at once.
  - Not on screen, because the module prose carries it right after the
    embed: the reveal paragraph, the client's own gap, where the program
    stops, the checkpoint and the walk-away list. The words "consolidated
    risk picture" are never used, and nothing says the slides are out of order.
  - Same in every scope. No per-scope data.
  - No storage. A reload starts again at slide 1.

  Verify before shipping, both gates, every time:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs   this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  /* ===============================================================
     The palette. The Extern five, plus the vCISO per-slide tint ramp
     (VCISO-STYLE-GUIDE.md 6b, listed in 09-assets/deck-palette.json).
     Tint carries no meaning. Every tint of navy is an rgba() of
     #001D69. No state is ever signalled by colour alone: every
     coloured state also carries a glyph or a label.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, borders, fills      */
    --bg:#FDF8F8;           /* canvas background, and text on navy */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t3{background:#F2E3D2}

  /* ---- the 960x540 canvas, scaled down only, never up ----
     flex:0 0 auto is load bearing: the canvas always holds 960 in layout
     and the transform does all of the fitting. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:12px}

  /* ---- the board ---- */
  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px}
  .intro{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;max-width:74ch}
  .intro p{font-size:17px;line-height:1.5}
  .intro p b{color:var(--title);font-weight:600}

  svg.ic{width:28px;height:28px;flex:0 0 auto;fill:none;stroke:var(--on-highlight);stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}

  /* ---- the strip: ten small slide cards, in build order ---- */
  .strip{flex:0 0 auto;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
  .sl{min-width:0;border-radius:8px;padding:9px 5px 10px 6px;display:flex;flex-direction:column;gap:6px;min-height:150px}
  .sl .sn{font-size:15px;font-weight:700;color:var(--on-highlight);font-variant-numeric:tabular-nums}
  .sl .st{font-size:11.5px;line-height:1.3;font-weight:600;color:var(--title);overflow-wrap:normal;word-break:normal}
  .sl.done{background:var(--highlight);border:1.5px solid var(--on-highlight)}
  .sl.blank{background:var(--tint);border:2px dashed var(--on-highlight)}
  .sl.blank .sn{color:var(--body)}
  .sl.blank .qm{flex:1 1 auto;display:flex;align-items:center;justify-content:center}
  .sl.blank .qm svg.ic{width:34px;height:34px}
  .sl.blank .bl{font-size:12px;font-weight:600;color:var(--body);text-align:center}
  .under{flex:0 0 auto;font-size:17px;line-height:1.45;color:var(--title);font-weight:600}

  /* The blue lead bar: the prompt the student carries into slide 2. */
  .leadbar{flex:0 0 auto;background:var(--highlight);border-left:5px solid var(--on-highlight);border-radius:0 10px 10px 0;
    padding:14px 20px;display:flex;align-items:flex-start;gap:14px}
  .leadbar svg.ic{width:30px;height:30px;margin-top:1px}
  .leadbar p{font-size:19px;line-height:1.45;color:var(--title)}
  .leadbar p b{font-weight:600}

  /* ---- slide 2: three answers, one pick ---- */
  .ans-col{flex:0 0 auto;display:flex;flex-direction:column;gap:12px}
  button.ans{font-family:inherit;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:14px;min-height:62px;padding:10px 16px;
    background:var(--bg);color:var(--title);border:2px solid var(--on-highlight);border-radius:10px;
    transition:background var(--t-fast) var(--ease-out),color var(--t-fast) var(--ease-out),opacity var(--t-fast) var(--ease-out)}
  button.ans:hover:not(:disabled){background:var(--highlight)}
  button.ans:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.ans:disabled{cursor:default}
  button.ans .bk{flex:0 0 auto;width:30px;height:28px;border-radius:6px;border:1.5px solid var(--on-highlight);
    background:var(--highlight);font-size:15px;font-weight:600;color:var(--on-highlight);
    display:flex;align-items:center;justify-content:center}
  button.ans .al{flex:1 1 auto;font-size:20px;font-weight:600;line-height:1.25}
  button.ans .tg{flex:0 0 auto;font-size:14px;font-weight:600;white-space:nowrap}
  /* After the pick. The right answer is always the filled one, with a
     tick. A wrong pick gets a cross, a struck label and a dashed edge.
     The third button fades. Glyph and words every time, never colour alone. */
  button.ans.is-right{background:var(--on-highlight);color:var(--bg)}
  button.ans.is-right .bk{background:var(--bg);border-color:var(--bg)}
  button.ans.is-wrong{border-style:dashed;background:transparent}
  button.ans.is-wrong .al{text-decoration:line-through;text-decoration-thickness:1.5px;font-weight:400;color:var(--body)}
  button.ans.is-wrong .tg{color:var(--body)}
  button.ans.is-other{opacity:.45}

  .fb{flex:0 0 auto;min-height:92px;border-radius:0 10px 10px 0;
    border-left:4px solid var(--on-highlight);background:var(--highlight);padding:14px 18px;
    display:flex;flex-direction:column;justify-content:center;gap:6px}
  .fb.wait{background:var(--tint);border:1.5px dashed var(--line);border-radius:10px}
  .fb.wait p{font-size:17px;line-height:1.45;color:var(--title);font-weight:600}
  .fb:focus{outline:3px solid var(--on-highlight);outline-offset:2px}
  .fb .fh{font-size:21px;font-weight:600;line-height:1.25;color:var(--title)}
  .fb .fh .gl{display:inline-block;width:1.2em;color:var(--on-highlight)}
  .fb .fr{font-size:18px;line-height:1.45;color:var(--body)}
  .fb.in{animation:rin var(--t-reveal) var(--ease-over) both}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* ---- slide 3: the closing strip, a picture only ---- */
  .strip.close{flex:0 0 auto;height:300px;margin-top:10px}
  .strip.close .sl{min-height:0}
  .strip.close .st{flex:1 1 auto}
  .wt{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;
    border-top:1.5px solid var(--on-highlight);padding-top:8px;text-align:center}
  .wt svg.ic{width:22px;height:22px}
  .wt span{font-size:12px;line-height:1.25;font-weight:700;color:var(--on-highlight)}
  /* Slides 09 and 10 together: one filled block, one shared label. */
  .pair{grid-column:span 2;min-width:0;border-radius:8px;background:var(--on-highlight);color:var(--bg);
    border:1.5px solid var(--on-highlight);display:flex;flex-direction:column;padding:9px 12px 14px;gap:10px}
  .pair .pn{display:flex;justify-content:space-between;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .pair .pb{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
  .pair svg.ic{width:36px;height:36px;stroke:var(--bg)}
  .pair .pl{font-size:20px;line-height:1.3;font-weight:600}
  .strip.in{animation:rin var(--t-reveal) var(--ease-over) both}

  /* ---- the bar ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:12px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled,button.nav[aria-disabled="true"]{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:44px;overflow-y:auto;font-size:13px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .strip{grid-template-columns:1fr 1fr;gap:8px}
    .sl{min-height:0;flex-direction:row;align-items:center;gap:10px;padding:10px 10px}
    .sl .sn{flex:0 0 auto;width:24px}
    .sl .st{font-size:14px}
    .sl.blank .qm{flex:0 0 auto}
    .sl.blank .qm svg.ic{width:26px;height:26px}
    .sl.blank .bl{text-align:left}
    .under{font-size:16px}
    .leadbar{padding:12px 14px;gap:10px}
    .leadbar svg.ic{width:24px;height:24px}
    .leadbar p{font-size:17px}
    button.ans{min-height:58px;flex-wrap:wrap;row-gap:6px}
    button.ans .al{font-size:18px;flex:1 1 0;min-width:0}
    button.ans .tg{flex:1 1 100%;padding-left:44px}
    .fb{min-height:0}
    .fb .fh{font-size:19px}
    .fb .fr{font-size:16px}
    .strip.close{margin-top:0;height:auto}
    .strip.close .sl{flex-direction:column;align-items:flex-start;gap:6px}
    .strip.close .wt{align-self:stretch;flex-direction:row;justify-content:flex-start;gap:6px;padding-top:6px}
    .strip.close .wt span{font-size:13px}
    .pair{grid-column:1 / -1;padding:12px 14px 16px}
    .pair .pl{font-size:19px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
    #hint .kb{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="What's Missing From the Deck?">

    <div class="top">
      <span class="prog" id="prog">1 of 3</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Next</button>
      <button class="nav ghost" id="again" type="button" hidden>Start again</button>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:17px;color:#1C1B1B;margin:20px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ol,.nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:6px}
    .nsf strong{color:#1C1B1B}
  </style>
  <div class="nsf">
    <h2>Your deck so far</h2>
    <ol>
      <li>Engagement scope</li>
      <li>What the internet sees</li>
      <li>What the scan shows</li>
      <li>Ranked technical priorities</li>
      <li>The control gap</li>
      <li>The profile heatmap</li>
      <li>Claims versus evidence</li>
      <li>Readiness for the evidence test</li>
      <li>(not filled in yet)</li>
      <li>(not filled in yet)</li>
    </ol>
    <p>Slides 1 to 8 are done. Slides 9 and 10 are not filled in yet.</p>
    <p>Read your deck the way Meridian, Cumberland's biggest customer, would. What does a stranger still not know after slide 8?</p>
    <h3>What should the last two slides do?</h3>
    <ul>
      <li><strong>A.</strong> Explain the findings again in more detail</li>
      <li><strong>B.</strong> Show how serious each risk is and where the company stands overall</li>
      <li><strong>C.</strong> Show the tools and methods used</li>
    </ul>
    <p>Pick one before you read on.</p>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ---------------- content ----------------
     Slide titles: the deck template, 01 to 08 (template_spec.py).
     Answers and the right answer: Chaitanya, P5-1, in his order.
     Feedback lines: the agreed spec for this build. Nothing else. */
  var SLIDES = [
    { n:"01", t:"Engagement scope" },
    { n:"02", t:"What the internet sees" },
    { n:"03", t:"What the scan shows" },
    { n:"04", t:"Ranked technical priorities" },
    { n:"05", t:"The control gap" },
    { n:"06", t:"The profile heatmap" },
    { n:"07", t:"Claims versus evidence" },
    { n:"08", t:"Readiness for the evidence test" }
  ];
  var BLANKS = ["09", "10"];
  var CHOICES = [
    { id:"a", key:"A", label:"Explain the findings again in more detail",
      fb:"Slides 1 to 8 already explain the findings." },
    { id:"b", key:"B", label:"Show how serious each risk is and where the company stands overall",
      fb:"" },
    { id:"c", key:"C", label:"Show the tools and methods used",
      fb:"A stranger needs to know how serious things are, not which tools you used." }
  ];
  var RIGHT = "b";
  var WRONG_TAG = "What is wrong";
  var PAIR_LABEL = "How serious it all is, taken together";

  var S = [
    { id:"strip", kind:"strip", label:"Your deck so far", h1:"Your deck so far" },
    { id:"pick",  kind:"pick",  label:"Your pick",        h1:"What should the last two slides do?" },
    { id:"close", kind:"close", label:"The whole deck",   h1:"Your deck, slide by slide" }
  ];

  /* Inline SVG icons, Phosphor style: one weight, outline, navy. */
  var ICON = {
    question:'<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.2.9-1.2 1.7v.5"/><circle cx="12" cy="16.9" r=".6" fill="#001D69" stroke="none"/>',
    eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3.2"/>',
    warning:'<path d="M12 4 21 19.5H3z"/><path d="M12 10v4.2"/><circle cx="12" cy="16.9" r=".6" fill="#001D69" stroke="none"/>',
    gauge:'<path d="M3.5 16.5a8.5 8.5 0 1 1 17 0"/><path d="M12 16.5 16 10.5"/><path d="M3.5 16.5h3M17.5 16.5h3M12 8V10"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICON[k] + "</svg>"; }

  /* ---------------- state ----------------
     One pick, kept in memory only. A reload starts at slide 1. */
  var st = { pick:null };
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var GLYPH = { out:"✕", ok:"✓" };

  /* Data validation, at load, loud. */
  (function validate(){
    var problems = [], ids = {};
    S.forEach(function(s, n){
      if(!s.id) problems.push("slide " + (n+1) + " has no id");
      if(ids[s.id]) problems.push('duplicate slide id "' + s.id + '"');
      ids[s.id] = 1;
    });
    if(!choiceOf(RIGHT)) problems.push("the right answer is not one of the choices");
    CHOICES.forEach(function(c){
      if(c.id !== RIGHT && !c.fb) problems.push('choice "' + c.id + '" has no feedback line');
    });
    if(SLIDES.length + BLANKS.length !== 10) problems.push("the strip does not hold ten slides");
    if(problems.length){
      document.getElementById("board").innerHTML =
        '<div class="intro"><p><b>This deck has authoring errors and will not behave correctly:</b></p>' +
        '<ul style="font-size:13px;line-height:1.6;padding-left:18px">' +
        problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul></div>";
      throw new Error("deck data invalid: " + problems.join("; "));
    }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    again:document.getElementById("again"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function say(m){ el.live.textContent = m; }
  function topFocus(){
    try{ el.frame.focus({preventScroll:true}); }catch(e){ el.frame.focus(); }
    window.scrollTo(0, 0);
  }
  function choiceOf(id){ for(var k=0;k<CHOICES.length;k++) if(CHOICES[k].id === id) return CHOICES[k]; return null; }

  var i = 0;

  /* ---------------- chrome ---------------- */
  function canGo(n){
    if(n < 0 || n >= S.length) return false;
    if(n <= 1) return true;
    return st.pick !== null;
  }

  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    el.back.disabled = (i === 0);
    el.again.hidden = (i !== S.length - 1);
    el.next.removeAttribute("aria-disabled");
    el.next.disabled = false;
    if(i === S.length - 1){ el.next.disabled = true; el.next.textContent = "You are at the end"; if(st.pick !== null) el.hint.innerHTML = "<b>That is the whole deck.</b> Go back to the module and keep reading."; return; }
    el.next.textContent = "Next";
    /* No pick yet: Next looks disabled but still takes a click, so it can say why. */
    if(s.kind === "pick" && st.pick === null) el.next.setAttribute("aria-disabled", "true");
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.hint.textContent = "";
    el.h1.textContent = s.h1;

    if(s.kind === "strip") renderStrip();
    else if(s.kind === "pick") renderPick();
    else if(s.kind === "close") renderClose();
    else el.board.innerHTML = '<div class="intro"><p><b>Unhandled slide kind "' + esc(String(s.kind)) + '".</b></p></div>';

    el.frame.setAttribute("aria-label", el.h1.textContent);
    header();
  }

  /* ---------------- slide 1: the strip ---------------- */
  function cardDone(sl){
    return '<div class="sl done" role="listitem"><span class="sn"><span class="sr">Slide </span>' + sl.n + "</span>" +
      '<span class="st">' + esc(sl.t) + "</span></div>";
  }
  function renderStrip(){
    el.board.innerHTML =
      '<div class="strip" role="list" aria-label="Your ten slides, in build order">' +
        SLIDES.map(cardDone).join("") +
        BLANKS.map(function(n){
          return '<div class="sl blank" role="listitem"><span class="sn"><span class="sr">Slide </span>' + n + "</span>" +
            '<span class="qm">' + icon("question") + '</span><span class="bl">To do</span></div>';
        }).join("") +
      "</div>" +
      '<p class="under">Slides 1 to 8 are done. Slides 9 and 10 are not filled in yet.</p>' +
      '<div class="leadbar">' + icon("eye") +
        "<p>Read your deck the way Meridian, Cumberland's biggest customer, would. <b>What does a stranger still not know after slide 8?</b></p></div>";
  }

  /* ---------------- slide 2: the pick ----------------
     Pick one of three, or press A, B or C. The pick is marked at once and
     the three buttons lock. */
  function buttonHTML(c){
    var pick = st.pick, done = pick !== null;
    var cls = "ans", tag = "", sr = "";
    if(done){
      if(c.id === RIGHT){
        cls += " is-right";
        tag = GLYPH.ok + (pick === c.id ? " Your pick" : " Right answer");
        sr = pick === c.id ? " Your pick. Right answer." : " The right answer.";
      } else if(pick === c.id){
        cls += " is-wrong";
        tag = GLYPH.out + " Your pick";
        sr = " Your pick. Not quite.";
      } else {
        cls += " is-other";
      }
    }
    return '<button class="' + cls + '" type="button" data-choice="' + c.id + '"' + (done ? " disabled" : "") + ">" +
      '<span class="bk" aria-hidden="true">' + c.key + "</span>" +
      '<span class="al">' + esc(c.label) + "</span>" +
      (tag ? '<span class="tg" aria-hidden="true">' + tag + "</span>" : "") +
      (sr ? '<span class="sr">' + sr + "</span>" : "") + "</button>";
  }

  function feedbackHTML(){
    if(st.pick === null) return '<div class="fb wait" id="fb"><p>Pick the one that you think slides 9 and 10 should do.</p></div>';
    var c = choiceOf(st.pick), right = st.pick === RIGHT;
    var head = right
      ? '<span class="gl" aria-hidden="true">' + GLYPH.ok + "</span>Right."
      : '<span class="gl" aria-hidden="true">' + GLYPH.out + "</span>Not right.";
    return '<div class="fb" id="fb" tabindex="-1"><div class="fh">' + head + "</div>" +
      (right ? "" : '<div class="fr">' + esc(c.fb) + "</div>") + "</div>";
  }

  function renderPick(){
    el.board.innerHTML =
      '<div class="ans-col" role="group" aria-label="Your pick">' + CHOICES.map(buttonHTML).join("") + "</div>" +
      feedbackHTML();
    Array.prototype.forEach.call(el.board.querySelectorAll("button.ans"), function(btn){
      btn.addEventListener("click", function(){ choose(btn.dataset.choice); });
    });
    if(st.pick === null) el.hint.innerHTML = '<span class="kb">On a keyboard, press A, B or C.</span>';
  }

  function choose(id){
    if(st.pick !== null || !choiceOf(id)) return;
    st.pick = id;
    render();
    var fb = el.board.querySelector("#fb");
    if(fb && !reduce){ fb.classList.remove("in"); void fb.offsetWidth; fb.classList.add("in"); }
    try{ el.next.focus({preventScroll:true}); }catch(e){ el.next.focus(); }
    if(fb && fb.scrollIntoView && window.matchMedia("(max-width:599px)").matches){
      try{ fb.scrollIntoView({block:"nearest"}); }catch(e){}
    }
    var c = choiceOf(id);
    say(id === RIGHT ? "Your pick: " + c.label + ". Right."
      : "Your pick: " + c.label + ". Not right. " + c.fb + " The right answer: " + choiceOf(RIGHT).label + ".");
  }

  /* ---------------- slide 3: the closing strip, a picture only ---------------- */
  function renderClose(){
    if(st.pick === null){
      el.h1.textContent = "Make your pick first";
      el.board.innerHTML = '<div class="intro"><p>Pick what you think slides 9 and 10 should do. Then this slide opens.</p>' +
        '<p><button class="nav" type="button" id="topick">Go to your pick</button></p></div>';
      el.board.querySelector("#topick").addEventListener("click", function(){ i = 1; render(); topFocus(); });
      return;
    }
    el.board.innerHTML =
      '<div class="strip close" id="cs" role="list" aria-label="All ten slides">' +
        SLIDES.map(function(sl){
          return '<div class="sl done" role="listitem"><span class="sn"><span class="sr">Slide </span>' + sl.n + "</span>" +
            '<span class="st">' + esc(sl.t) + "</span>" +
            '<span class="wt">' + icon("warning") + "<span>" + WRONG_TAG + "</span></span></div>";
        }).join("") +
        '<div class="pair" role="listitem"><span class="pn" aria-hidden="true"><span>' + BLANKS[0] + "</span><span>" + BLANKS[1] + "</span></span>" +
          '<span class="sr">Slides ' + BLANKS[0] + " and " + BLANKS[1] + ". </span>" +
          '<span class="pb">' + icon("gauge") + '<span class="pl">' + PAIR_LABEL + "</span></span></div>" +
      "</div>";
  }

  /* ---------------- start over ---------------- */
  function resetAll(){ st = { pick:null }; i = 0; render(); }
  el.again.addEventListener("click", function(){ resetAll(); topFocus(); say("Cleared. Back to slide 1."); });

  /* ---------------- navigation ---------------- */
  function go(d){
    var s = S[i];
    if(d > 0 && s.kind === "pick" && st.pick === null){
      el.hint.innerHTML = "<b>Pick one first.</b> Then the next slide opens.";
      return;
    }
    var n = i + d;
    if(!canGo(n)) return;
    i = n; render(); topFocus();
    if(S[i].kind === "close" && !reduce){
      var cs = el.board.querySelector("#cs");
      if(cs){ cs.classList.remove("in"); void cs.offsetWidth; cs.classList.add("in"); }
    }
    say("Slide " + (i+1) + " of " + S.length + ". " + el.h1.textContent);
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return true;
    var r = node.getAttribute && node.getAttribute("role");
    return r === "slider" || r === "textbox" || r === "spinbutton" || r === "listbox";
  }

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(S[i].kind === "pick" && st.pick === null){
      var k = String(e.key).toLowerCase();
      if(k === "a" || k === "b" || k === "c"){ e.preventDefault(); choose(k); }
    }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    if(ownsKeys(e.target)){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ----------------
     measure-fit.mjs steps through the deck with this. goto ignores the
     pick-first lock, on purpose, so every slide can be measured. */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    pick:function(id){ i = 1; render(); choose(id); return st.pick === id; },
    reset:function(){ resetAll(); },
    state:function(){ return { i:i, pick:st.pick }; }
  };
})();
</script>
</body>
</html>
