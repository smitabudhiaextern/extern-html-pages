<template id="s2">
  <p class="p">Run the cell under <b>Step 6: Extracting Bounding Boxes for Specific Fields</b>, right below Step 5. It holds this code:</p>
  {{CODE:python:# Extract words with their bounding boxes
words = doc[0].get_text("words")

# Define the field we are looking for
# The date is split into three words ("3", "June,", "2022"), so we search for its last word, the year
target_word = letter_date.split()[-1]

# Search for the target word and retrieve its bounding box
for word in words:
    x0, y0, x1, y1, text, block, line, word_no = word  # Unpack correctly
    if target_word.lower() in text.lower():  # Case-insensitive match
        print(f"Found '{target_word}' at: ({x0}, {y0}, {x1}, {y1})")}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>get_text("words")</code> gives one row per word, so no row holds the whole date. <code>split()</code> cuts <code>letter_date</code>, the date the notebook's Step 5 cell found, at each space, and <code>[-1]</code> takes the last piece, the year.</li>
    <li>The line ending in <code># Unpack correctly</code> names the 8 values in each word's row. <code>.lower()</code> turns both words into small letters, so capitals don't matter.</li>
  </ul>
</template>

<template id="s3">
  <p class="p">Now tie a date to its label on page 3. Scroll to the bottom of your notebook, click the last cell, then click <b>+ Code</b> to add a new code cell. Paste this in and press <b>Run</b>:</p>
  {{CODE:python:words = doc[2].get_text("words")  # Get all words with their positions

for word in words:
    x0, y0, x1, y1, w_text, *_ = word
    if "20260315" in w_text:
        print(f"Found date at: ({x0}, {y0}, {x1}, {y1})")

    if "Expiration" in w_text:
        print(f"Found anchor phrase at: ({x0}, {y0}, {x1}, {y1})")}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>doc[2]</code> is page 3, because Python counts pages from 0.</li>
    <li><code>x0, y0, x1, y1, w_text, *_ = word</code> gives names to the first 5 values of each word's row. <code>w_text</code> is the word itself. <code>*_</code> collects the 3 numbers we don't need (block, line and word number), so they don't get in the way.</li>
    <li>The two <code>if</code> lines check every word twice: once for the date, and once for <code>"Expiration"</code>, the first word of the label. That label is your <b>anchor phrase</b>. <code>get_text("words")</code> gives one word at a time, so <code>"Expiration Date:"</code> would never match.</li>
  </ul>
</template>

<template id="s5">
  <ul class="list">
    <li><b>Start with a Visual Scan:</b> Always inspect the raw text first. Spot weird line breaks, awkward formatting, or missing data <i>before</i> writing any extraction logic.</li>
    <li><b>Use Regex for Precision:</b> Regex helps you find patterns (like phone numbers or dates) even when the layout is messy. It's your first defense against chaotic data.</li>
    <li><b>Locate Values with Coordinates:</b> Use bounding boxes to figure out exactly <i>where</i> a piece of text appears on the page. Layout gives context. Without it, meaning gets lost.</li>
    <li><b>Anchor Phrases = Smart Extraction:</b> Look for keywords near the data (like "Expiration Date:") to confirm or guide what you're extracting. Anchors + coordinates = human-like logic.</li>
    <li><b>Visualize to Debug:</b> Draw bounding boxes using OpenCV to confirm that your script is highlighting the right data in the right spot. Trust, verify and fix what doesn't align.</li>
  </ul>
</template>

    var W = narrow ? 420 : 760, H = narrow ? 1100 : 860;
    var k = Math.min(window.innerWidth / W, window.innerHeight / H);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", g.name + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + g.name + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + body(s.tpl) + '</div>';
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });

    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  /* Left and Right arrow keys move between slides */
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", scaleStage);
  scaleStage();
  render(false);
})();
</script>
</body>
</html>
