<template id="s2">
  <p class="p">Before you grab anything, <b>print the raw text</b> and scroll through it. Look for weird breaks, missing data or jumbled fields, so you don't write code based on the <i>wrong assumptions</i>.</p>
  <p class="p"><i>So how do you grab what you want, like dates, without relying on a clean layout?</i> Enter <b>regex</b>. You met it in the last reading. Your notebook already has a cell that uses it to find the letter's date, under the heading <b>Step 5: Extracting Key Information from a PDF</b>. To find it fast, click a blank spot outside the cells, press <b>Ctrl+F</b> (<b>Cmd+F</b> on a Mac) and type <code>Extracting Key Information</code>. Then press <b>Run</b> on the code cell under that heading. It holds this code:</p>
  {{CODE:python-grow:import re

# Extract raw text from the first page
text = doc[0].get_text("text")

# Use regex to find a date like "3 June, 2022" in the text
date_match = re.search(r"\d{1,2}\s+[A-Z][a-z]+,\s+\d{4}", text)

if date_match:
    letter_date = date_match.group()
    print(f"Letter Date: {letter_date}")
else:
    print("Date not found.")}}
</template>

<template id="s2b">
  {{SHOT:2}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>re.search()</code> looks through page 1's text for the first match of the date pattern from the last reading. <code>.group()</code> gives back the date it found, as text.</li>
  </ul>
  {{HOLDS:letter_date:the letter's date, which the next steps look for on the page}}
  <p class="concl">Regex is one of those tools that takes 10 minutes to learn and a lifetime to master, but for now, even a tiny bit can go a long way.</p>
</template>

<template id="s3">
  <p class="p">Regex helps you <b>find information</b>, like a phone number or a date, but sometimes you also need to know <b>where</b> it appeared on the PDF page. So far, you've used regex to find values like dates. But <b>where</b> is that date on the page?</p>
  <p class="p">Let's build on the date example. We've already found the date, now we want to find its location on the page. Press <b>Run</b> on the cell under <b>Step 6: Extracting Bounding Boxes for Specific Fields</b>, right below the Step 5 cell. It holds this code:</p>
  {{CODE:python:# Extract words with their bounding boxes
words = doc[0].get_text("words")

# Define the field we are looking for
# The date is split into three words ("3", "June,", "2022"), so we search for its last word, the year
target_word = letter_date.split()[-1]

# Search for the target word and retrieve its bounding box
for word in words:
    x0, y0, x1, y1, text, block, line, word_no = word  # Unpack correctly
    if target_word.lower() in text.lower():  # Case-insensitive match
        print(f"Found '{target_word}' at: ({x0}, {y0}, {x1}, {y1})")}}
  <p class="p">This finds the <b>location</b> of the date by comparing it to all the individual words on the page. If it finds a match, it prints its coordinates.</p>
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>letter_date.split()</code> cuts the date at each space, and <code>[-1]</code> takes the last piece. In Python, <code>-1</code> means the last item in a list.</li>
    <li>The line ending in <code># Unpack correctly</code> gives a name to each of the 8 values in a word's row. <code>.lower()</code> turns both words into small letters, so capitals don't matter.</li>
  </ul>
</template>

<template id="s3b">
  {{SHOT:3}}
  <div class="note"><span class="num">WHAT ABOUT THOSE COORDINATES?</span>
    <p>You already know the answer to that. They mean that the year "2022" was found in the document, and its <b>bounding box coordinates</b> are:</p>
    <ul><li><b>(71.33, 149.22)</b>: the <b>top-left corner</b> of "2022" (it <b>starts</b> at this position).</li>
      <li><b>(94.17, 160.79)</b>: the <b>bottom-right corner</b> of "2022" (it <b>ends</b> at this position).</li></ul>
    <p>These coordinates tell us exactly where the year appears on the page. This is useful when we need to <b>highlight, extract, or process specific fields</b> in structured documents like vendor letters, certificates, and specifications.</p></div>
  <p class="p">These coordinates, <code>(x0, y0)</code> and <code>(x1, y1)</code>, represent a bounding box: the exact spot the word takes up on the PDF.</p>
  <p class="p">Now you're not just finding text, you're finding <b>where</b> it lives. And that unlocks some very powerful tricks.</p>
</template>

import numpy as np
from PIL import Image

# Convert PDF page to an image
pix = doc[0].get_pixmap()
img = np.array(Image.frombytes("RGB", [pix.width, pix.height], pix.samples))

# Convert image to OpenCV BGR format
img = cv2.cvtColor(img, cv2.COLOR_RGB2BGR)

# Get the actual image height
img_height = img.shape[0]  # OpenCV uses (height, width, channels)

# Extract words and their bounding boxes
words = doc[0].get_text("words")

# Define the field we are looking for
target_word = "2022"  # The year in the letter date on page 1

# Flag to check if the word was found
word_found = False

# Search for the target word and retrieve its bounding box
for word in words:
    x0, y0, x1, y1, text, block, line, word_no = word  # Unpack correctly

    if target_word in text:  # Case-sensitive match (modify if needed)
        # PyMuPDF and OpenCV both measure y from the top of the page, so no conversion is needed.
        # Convert coordinates to integers
        x0, y0, x1, y1 = map(int, [x0, y0, x1, y1])

        # Draw a rectangle around the detected word
        cv2.rectangle(img, (x0, y0), (x1, y1), (0, 255, 0), 2)

        print(f"Found '{target_word}' at: ({x0}, {y0}, {x1}, {y1})")
        word_found = True

# Ensure an image is displayed even if no word is found
if not word_found:
    print(f"'{target_word}' not found in document.")

# Convert back to RGB for displaying in PIL
img_rgb = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)

# Display the image using PIL (works in Jupyter/Colab)
display(Image.fromarray(img_rgb))</template>

    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #slide=N opens slide N directly */
  var hm = location.hash.match(/slide=(\d+)/);
  if (hm) i = Math.min(SLIDES.length - 1, Math.max(0, +hm[1] - 1));
  window.addEventListener("resize", function () { scaleStage(); space(); });
  scaleStage();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
</body>
</html>
