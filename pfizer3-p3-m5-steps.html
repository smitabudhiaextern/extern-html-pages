.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}

/* Run card: the code with a Copy button; output blocks have no Copy button */
.run{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin:0}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:6px 8px 6px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}

.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}

.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}

<!-- Slide bodies. {{CODE:python:...}} is code with a Copy button. {{OUT:label:...}} is a real output, with no Copy button. -->
<template id="s1">
  <p class="p">This reading has its own Colab notebook, "Reading a Supporting Documentation File with PyMuPDF". Open it here. If Google asks you to sign in, use your Google account.</p>
  <div class="links">{{OPEN:NOTEBOOK:Reading a Supporting Documentation File with PyMuPDF (Colab notebook)}}</div>
  <p class="p">Then click <b>File → Save a copy in Drive</b>. Colab opens your own copy in a new tab, with "Copy of" at the start of its name. Work in that copy from now on, so your changes are saved.</p>
  <p class="p">The notebook is split into steps, each under its own heading. You'll run its Steps 1 to 4 now. Its Steps 5 and 6 come in later readings.</p>
</template>

<template id="s1b">
  <p class="p">In your copy, run each cell from the top, in order, down to the end of the notebook's Step 4. Press <b>Run</b> (the round play button on the left of the cell) and wait for each cell to finish before you run the next.</p>
  <p class="p">The notebook's <b>Step 1</b> installs PyMuPDF and uploads the supplier file. When the upload box appears, click <b>Choose Files</b> and pick <code>sample-sdf-document.pdf</code>, the file you downloaded earlier. It's usually in your Downloads folder. Can't find it? Download it again here.</p>
  <div class="links">{{OPEN:FILE:The Supplier File (sample-sdf-document.pdf)}}</div>
  <p class="p">Its <b>Step 2</b> opens the file and keeps it as <code>doc</code>, short for document. If the first line under that cell says <code class="nw">Total Pages: 3</code>, the file is open. Its <b>Steps 3 and 4</b> read the text on page 1, then on every page. Stop when you reach its Step 5.</p>
  <p class="p">Every cell on the next slides goes in a <b>new code cell</b>, right under the notebook's Step 4. To add one, click the cell you ran last, then click <b>+ Code</b> at the top. Colab adds an empty code cell under it.</p>
</template>

<template id="s2">
  <p class="p">Next, read every page, one word at a time. It's the same loop as the notebook's Step 4, with <code>get_text("words")</code> in place of <code>get_text("text")</code>. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:for page_num in range(len(doc)):
    page = doc[page_num]
    words = page.get_text("words")
    print("Page", page_num + 1, "has", len(words), "words")}}
  <p class="p">Python counts from 0, so <code>page_num</code> is 0, 1 and 2. <code>page_num + 1</code> turns those into the page numbers people use: 1, 2 and 3.</p>
  {{OUT:Output:Page 1 has 203 words
Page 2 has 201 words
Page 3 has 213 words}}
  <p class="p">All 3 pages are there. Together they hold 617 words.</p>
</template>

<template id="s3">
  <p class="p">Now save each word in one list. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:all_words = []

for page_num in range(len(doc)):
    page = doc[page_num]
    for word in page.get_text("words"):
        all_words.append({
            "text": word[4],
            "bbox": word[:4],
            "page": page_num + 1
        })}}
  <p class="p">Each word becomes a <b>dictionary</b>: a Python container where each value has a name, called a key. This one has 3 keys. <code>"text"</code> holds the word, which is <code>word[4]</code>, the fifth value in the row. <code>"bbox"</code> holds the box: <code>word[:4]</code> takes the first 4 values, which are left, top, right and bottom. <code>"page"</code> holds the page number.</p>
  <p class="p"><code>all_words = []</code> makes an empty list once, above the loop, so every page adds to the same list. <code>append</code> adds one dictionary to the end of it. This cell prints nothing. That's fine: Step 4 shows what's inside.</p>
</template>

<template id="s4">
  <p class="p">Check what you saved. <code>all_words[:5]</code> takes the first 5 items in the list, and <code>len(all_words)</code> counts every item. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:for item in all_words[:5]:
    print(item)

print("Total words:", len(all_words))}}
  {{OUT:Output:{'text': 'Cytiva', 'bbox': (547.4367065429688, 87.58555603027344, 576.0117797851562, 98.43190002441406), 'page': 1}
{'text': '100', 'bbox': (508.3149719238281, 99.96163940429688, 523.842529296875, 110.3996353149414), 'page': 1}
{'text': 'Results', 'bbox': (525.844482421875, 99.96163940429688, 556.0629272460938, 110.3996353149414), 'page': 1}
{'text': 'Way', 'bbox': (558.2142333984375, 99.96163940429688, 576.0225830078125, 110.3996353149414), 'page': 1}
{'text': 'Marlborough,', 'bbox': (477.1172790527344, 111.96411895751953, 532.1458740234375, 122.40211486816406), 'page': 1}
Total words: 617}}
  <p class="p">The total, 617, is 203 + 201 + 213 from Step 2.</p>
</template>

<template id="s5">
  <p class="p">Now search your list. You'll find the word "Expiration" on page 2, then print every word on the same line as it. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:for item in all_words:
    if item["page"] == 2 and item["text"] == "Expiration":
        top = item["bbox"][1]

for item in all_words:
    if item["page"] == 2 and item["bbox"][1] == top:
        print(item)}}
  <p class="p">The first loop looks for "Expiration" on page 2 and keeps its top as <code>top</code>. <code>item["bbox"][1]</code> is the second number in the box, the top, because counting starts at 0.</p>
  <p class="p">The second loop prints every page 2 word with that same top. Words with the same top sit on the same line of the page.</p>
</template>

<template id="s5b">
  <p class="p">You'll see 3 rows under the cell:</p>
  {{OUT:Output:{'text': 'Expiration', 'bbox': (53.64154052734375, 153.71876525878906, 96.03092956542969, 165.86985778808594), 'page': 2}
{'text': 'Date:', 'bbox': (98.36155700683594, 153.71876525878906, 120.82115936279297, 165.86985778808594), 'page': 2}
{'text': '20230126', 'bbox': (125.39865112304688, 153.71876525878906, 165.79605102539062, 165.86985778808594), 'page': 2}}}
  <p class="p">The label comes back as two words, <code>Expiration</code> and <code>Date:</code>, because <code>get_text("words")</code> splits text at every space.</p>
  <p class="p">All 3 rows have the same top, 153.71876525878906, so they sit on one line. That ties the date <code>20230126</code> to its label, Expiration Date.</p>
</template>

<template id="s6">
  <p class="p">This step is optional. <b>JSON</b> is a common text format for saving structured data, such as your list of dictionaries, so other tools can open it. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:import json

with open("all_words.json", "w") as f:
    json.dump(all_words, f, indent=2)

print("Saved", len(all_words), "words to all_words.json")}}
  <p class="p"><code>json</code> comes with Python, so you don't need to install it. <code>open("all_words.json", "w")</code> makes a new file to write into. <code>json.dump</code> writes your list into it, and <code>indent=2</code> puts each part on its own line, so it's easy to read.</p>
  {{OUT:Output:Saved 617 words to all_words.json}}
</template>

<template id="s6b">
  <p class="p">Take a look inside the file. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:!head -n 11 all_words.json}}
  <p class="p"><code>head -n 11</code> shows the first 11 lines of a file. The <code>!</code> runs it as a command, like the install line. You'll see the first word in the file:</p>
  {{OUT:Output:[
  {
    "text": "Cytiva",
    "bbox": [
      547.4367065429688,
      87.58555603027344,
      576.0117797851562,
      98.43190002441406
    ],
    "page": 1
  },}}
  <p class="p">In Python the box was a <b>tuple</b>: a fixed group of values in round brackets. JSON has no tuples, so <code>json.dump</code> saved it as a list, in square brackets. It's the same 4 numbers in the same order, so there's nothing to fix.</p>
</template>

    { group: "Step 6", label: "STEP 6 (OPTIONAL) &middot; PART 2 OF 2", title: 'Look Inside the JSON <span class="hl">File</span>', plain: "Step 6 (Optional). Look Inside the JSON File (Part 2 of 2)", tpl: "s6b" }
  ];
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of this reading.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  /* The fixed stage: pick the wide or narrow design size, then scale the whole deck to fit the frame and centre it. */
  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var W = narrow ? 420 : 760, H = narrow ? 1100 : 860;
    var k = Math.min(window.innerWidth / W, window.innerHeight / H);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", g.name + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + g.name + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + body(s.tpl) + '</div>';
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });

    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  /* Left and Right arrow keys move between slides */
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", scaleStage);
  scaleStage();
  render(false);
})();
</script>
</body>
</html>
