<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fields, Anchors and Boxes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Card player, code blocks, Copy buttons, the two-button switch
   and the picture overlays are copied from pfizer3-p3-m5-learn.html (the model Learn deck).
   P3 module 8 Learn cards: "Learn How to Extract Fields with Regex, Anchor Phrases & Bounding Boxes" (5 cards, 10 November 2026).
   1 Look at the Raw Text First: page 3 "On the page" vs "In the raw text" (the label and the date land on two lines).
   2 Find the Date, Then Find Where It Sits: his notebook's Step 5 (from the last reading) and Step 6, with the letter date's 3 word boxes.
   3 Let the Label Be Your Anchor: page 3, the 3 eight-digit numbers without and with the anchor, then his anchor code on page 3.
   4 Can You See It?: his Step 4 text, with a button that draws the box around "2022".
   5 Draw the Box with OpenCV: his corrected OpenCV cell (from his notebook), its output and the real picture it makes.
   Text: the SME's (Chaitanya's) module 8 page, verbatim where possible (about 80% of the words), on the supplier file.
   Fixed stage: laid out once on a 760 x 1160 design stage (set the Notion embed height to 1080 px at the 708 px wide
   Notion column), then scaled as one piece to fit the embed frame and centred. Nothing scrolls, and Back and Next never move.
   Every output and every box is the real output of the code, run on sample-sdf-document.pdf with PyMuPDF 1.26.5 and
   OpenCV 4.14 on 10 November 2026. Outputs marked "trimmed" keep only some lines.
   Pictures (all rendered with PyMuPDF from the supplier file): pfizer3-p3-m8-p3-labels.png (page 3 clipped to x 40 to 330,
   y 164 to 258), pfizer3-p3-m8-p1-date.png (page 1, x 28 to 208, y 138 to 172), pfizer3-p3-m8-p1-top.png (page 1,
   x 24 to 588, y 80 to 250), pfizer3-p3-m8-opencv-out.png (the real OpenCV output picture, top 200 points). */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --space-1:4px; --space-2:8px; --space-3:14px; --space-4:18px; --space-5:26px; --space-6:40px;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage-w:760px; --stage-h:1160px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
[hidden]{display:none !important}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}
.pg-label{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-muted);white-space:nowrap}
.pg-label::after{content:attr(data-text);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:600}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:18px 28px;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.inner{display:flex;flex-direction:column;gap:10px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:2px}
.hl{color:var(--highlight)}
.why{margin:-6px 0 0;font-size:17px;line-height:1.45;font-weight:600;color:var(--ink)}
.p{margin:0;font-size:15.5px;line-height:1.52;color:var(--ink-muted);text-wrap:pretty}
.p b{font-weight:600;color:var(--ink)}
.p code,.bul code,.note code,.cap code,.sw code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink);white-space:nowrap}
.hint{margin:0;font-size:14px;line-height:1.4;font-weight:600;color:var(--step-label)}
blockquote.q{margin:0;border-left:3px solid var(--pfizer-blue);padding:2px 0 2px 14px;font-size:16px;line-height:1.5;font-weight:600;color:var(--ink)}

/* Bullets */
.bul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.bul li{font-size:15.5px;line-height:1.5;color:var(--ink-muted)}
.bul b{font-weight:600;color:var(--ink)}

/* Code block with a Copy button; output blocks have no Copy button */
.run{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-icon)}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:4px 8px 4px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:7px 14px;font-family:var(--font-mono);font-size:13px;line-height:1.45;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit;white-space:inherit;background:none;padding:0;border-radius:0}
.run.small pre{font-size:11.6px;line-height:1.34;padding:6px 12px;white-space:pre-wrap}
.run.out{border-color:var(--blue-200)}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;line-height:1.42}
.run.out pre .ln{display:block;padding-left:2ch;text-indent:-2ch}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:3px 10px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}

/* Two-button switch (copied from the model deck) */
.sw-bar{display:flex;align-items:center;gap:var(--space-4)}
.sw{display:inline-flex;flex:none;border:1.5px solid var(--ink);border-radius:var(--radius-xs);overflow:hidden}
.sw button{border:0;background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;font-size:14px;line-height:1.2;font-weight:600;white-space:nowrap}
.sw button + button{border-left:1.5px solid var(--ink)}
.sw button[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.pane{display:flex;flex-direction:column;gap:11px}

/* Pictures with an SVG layer in PDF points */
.pic{position:relative;margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);line-height:0}
.pic img{display:block;width:100%;height:auto;transition:opacity .2s ease}
.pic svg{position:absolute;inset:0;width:100%;height:100%}
.pic .bx{fill:none;stroke:var(--highlight);stroke-width:2px;vector-effect:non-scaling-stroke}
.pic .bx.fill{fill:var(--highlight);fill-opacity:.16}
.pic .bx.dim{stroke:var(--blue-200);stroke-width:1.5px}
.pic .gd{stroke:var(--pfizer-blue);stroke-width:1.5px;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.pic .dot{fill:var(--pfizer-blue);stroke:var(--surface);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.pic .tag{font-family:var(--font-text);font-weight:700;fill:var(--pfizer-blue)}
.pic .tag.g{fill:var(--highlight)}
.pic .cover{fill:var(--surface-card);stroke:var(--blue-200);stroke-width:1px;vector-effect:non-scaling-stroke}
.pic.as-text img{opacity:.1}
.pic .txt{position:absolute;top:6px;bottom:0;left:12px;margin:0;padding:6px 12px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:var(--radius-xs) var(--radius-xs) 0 0;font-family:var(--font-mono);font-size:12.5px;line-height:17px;color:var(--ink);white-space:pre}
.pic .txt .on{background:var(--surface-card);box-shadow:inset 3px 0 0 var(--highlight);display:inline-block;padding:0 6px 0 4px;margin-left:-4px}
.cap{margin:0;font-size:14.5px;line-height:1.45;font-weight:600;color:var(--ink);min-height:21px}
.cap.res{font-family:var(--font-mono);font-weight:500;font-size:13px;color:var(--ink)}

/* Callout box (from the model deck's note) */
.note{border:1.5px solid var(--ink);border-radius:var(--radius-sm);padding:9px 14px}
.note .num{display:block;margin-bottom:3px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.note p{margin:0;font-size:14.5px;line-height:1.48;color:var(--ink-muted)}
.note p + p,.note p + ul,.note ul + p{margin-top:4px}
.note ul{margin:0;padding-left:20px}
.note li{font-size:14.5px;line-height:1.48;color:var(--ink-muted)}
.note b{font-weight:600;color:var(--ink)}
.concl{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:11px 18px;font-size:15.5px;line-height:1.52;color:var(--card-text)}
.concl b{font-weight:600;color:var(--card-title)}

/* Button bar over a picture */
.btn-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.btn-sm{padding:9px 14px;font-size:14px}
.btn-sec{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-sec[aria-pressed="true"]{background:var(--action);color:var(--on-action);border-color:var(--action)}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
  .pic .draw{stroke-dasharray:120;stroke-dashoffset:120;animation:draw .9s ease forwards} @keyframes draw{to{stroke-dashoffset:0}}
}
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="How to find a date, tie it to its label and see its box: five cards">
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where"><span id="where-count">Card 1 of 5</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Card"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-next" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var IC_COPY = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5V3.3c0-.7-.6-1.3-1.3-1.3H3.8c-.7 0-1.3.6-1.3 1.3v5.4c0 .7.6 1.3 1.3 1.3H4" stroke="currentColor" stroke-width="1.4"/></svg>';
  var NS = "http://www.w3.org/2000/svg";

  function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  /* lang "plain" is an output block, with no Copy button. extra "small" makes the code smaller (long cells). */
  function code(lang, label, lines, extra) {
    var out = lang === "plain";
    return '<figure class="run' + (out ? ' out' : '') + (extra ? ' ' + extra : '') + '"><div class="code-head"><span class="code-lang">' + label + '</span>' +
      (out ? '' : '<button type="button" class="copy" data-copy aria-label="Copy ' + label + ' code">' + IC_COPY + '<span>Copy</span></button>') + '</div>' +
      '<pre tabindex="0"><code>' + (out ? lines.map(function (l) { return '<span class="ln">' + (l ? esc(l) : ' ') + '</span>'; }).join("") : esc(lines.join("\n"))) + '</code></pre></figure>';
  }
  function svgEl(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function clear(svg) { while (svg.firstChild) svg.removeChild(svg.firstChild); }
  function rect(svg, b, cls, pad) {
    pad = pad || 0;
    svg.appendChild(svgEl("rect", { "class": cls, x: b[0] - pad, y: b[1] - pad, width: b[2] - b[0] + 2 * pad, height: b[3] - b[1] + 2 * pad, rx: 1 }));
  }
  /* A two-button (or more) switch: buttons carry data-view, panes carry data-pane */
  function wireSwitch(root, onPick) {
    var btns = root.querySelectorAll(".sw button");
    Array.prototype.forEach.call(btns, function (b) {
      b.addEventListener("click", function () {
        var v = b.getAttribute("data-view");
        Array.prototype.forEach.call(btns, function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
        Array.prototype.forEach.call(root.querySelectorAll("[data-pane]"), function (p) { p.hidden = p.getAttribute("data-pane") !== v; });
        if (onPick) onPick(v);
      });
    });
  }

  /* Real page.get_text("words") boxes, page 3 (index 2), PyMuPDF 1.26.5: [x0, y0, x1, y1] in PDF points */
  var P3 = {
    lot: [200.0, 167.25, 244.48, 180.99],
    mfg: [200.0, 203.25, 244.48, 216.99],
    exp: [200.0, 239.25, 244.48, 252.99],
    expLabel: [50.0, 239.25, 94.46, 252.99],
    dateWord: [97.24, 239.25, 121.14, 252.99]
  };
  var P3_CROP = [40, 164, 290, 94];
  /* The real page.get_text("text") lines for this part of page 3 */
  var P3_TEXT = ["Lot Number:", "18356721", "Product Article Number:", "28 9301 82", "Date of Manufacture:", "20240315",
    "Product Description:", "Low Flow Kit, AKTA ready", "Expiration Date:", "20260315"];

  /* Card 1: the page vs the raw text */
  function initRaw(root) {
    var fig = root.querySelector("#raw-fig"), svg = fig.querySelector("svg");
    svg.setAttribute("viewBox", P3_CROP.join(" "));
    var pre = document.createElement("pre"); pre.className = "txt"; pre.setAttribute("aria-hidden", "true");
    pre.innerHTML = P3_TEXT.map(function (l, n) { return n >= 8 ? '<span class="on">' + esc(l) + '</span>' : esc(l); }).join("\n");
    function show(v) {
      clear(svg);
      var asText = v === "text";
      fig.classList.toggle("as-text", asText);
      if (asText) { if (!pre.parentNode) fig.appendChild(pre); root.querySelector("#raw-cap").textContent = "In the raw text, the date sits on its own line, under its label."; return; }
      if (pre.parentNode) fig.removeChild(pre);
      rect(svg, [P3.expLabel[0], P3.expLabel[1], P3.dateWord[2], P3.dateWord[3]], "bx fill", 1.2);
      rect(svg, P3.exp, "bx fill", 1.2);
      svg.appendChild(svgEl("line", { "class": "gd", x1: P3.dateWord[2] + 4, y1: 246.1, x2: P3.exp[0] - 4, y2: 246.1 }));
      root.querySelector("#raw-cap").textContent = "On the page, the label and the date sit on one line.";
    }
    wireSwitch(root, show);
    show("page");
  }

  /* Card 2: the letter date's 3 words on page 1, from the real get_text("words") rows */
  var D_CROP = [28, 138, 180, 34];
  var DATE_WORDS = [[36.0, 149.22, 41.73, 160.79, "3"], [44.06, 149.22, 68.95, 160.79, "June,"], [71.33, 149.22, 94.17, 160.79, "2022"]];
  function initFind(root) {
    wireSwitch(root);
    var svg = root.querySelector("#date-svg"), cap = root.querySelector("#date-cap");
    svg.setAttribute("viewBox", D_CROP.join(" "));
    var bWhole = root.querySelector("#s-whole"), bYear = root.querySelector("#s-year");
    function words() { DATE_WORDS.forEach(function (w) { rect(svg, w, "bx dim", 0.6); }); }
    function pick(which) {
      clear(svg); words();
      bWhole.setAttribute("aria-pressed", which === "whole" ? "true" : "false");
      bYear.setAttribute("aria-pressed", which === "year" ? "true" : "false");
      if (which === "whole") {
        cap.className = "cap";
        cap.textContent = "Nothing prints. The page holds 3 separate words, and none of them is “3 June, 2022”.";
      } else {
        var w = DATE_WORDS[2];
        rect(svg, w, "bx fill", 0.6);
        svg.appendChild(svgEl("circle", { "class": "dot", cx: w[0], cy: w[1], r: 1.4 }));
        svg.appendChild(svgEl("circle", { "class": "dot", cx: w[2], cy: w[3], r: 1.4 }));
        cap.className = "cap res";
        cap.textContent = "Found '2022' at: (71.32679748535156, 149.2158203125, 94.16860961914062, 160.7857666015625)";
      }
    }
    var cs = root.querySelector("#corner-svg"), w = DATE_WORDS[2];
    cs.setAttribute("viewBox", D_CROP.join(" "));
    rect(cs, w, "bx fill", 0.6);
    cs.appendChild(svgEl("circle", { "class": "dot", cx: w[0], cy: w[1], r: 1.4 }));
    cs.appendChild(svgEl("circle", { "class": "dot", cx: w[2], cy: w[3], r: 1.4 }));
    cs.appendChild(svgEl("text", { "class": "tag", x: w[0] - 2, y: w[1] - 2.5, "font-size": 4.2, "text-anchor": "end" }, "(71.33, 149.22)"));
    cs.appendChild(svgEl("text", { "class": "tag", x: w[2] + 2.5, y: w[3] + 1.5, "font-size": 4.2 }, "(94.17, 160.79)"));
    bWhole.addEventListener("click", function () { pick("whole"); });
    bYear.addEventListener("click", function () { pick("year"); });
    words();
  }

  /* Card 4: draw the box around "2022" at the integer coordinates OpenCV used: (71, 149, 94, 160) */
  var T_CROP = [24, 80, 564, 170];
  function initSee(root) {
    var svg = root.querySelector("#see-svg"), btn = root.querySelector("#draw-btn"), cap = root.querySelector("#see-cap");
    svg.setAttribute("viewBox", T_CROP.join(" "));
    btn.addEventListener("click", function () {
      var on = btn.getAttribute("aria-pressed") !== "true";
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.textContent = on ? "Clear the box" : "Draw the box";
      clear(svg);
      if (on) {
        svg.appendChild(svgEl("rect", { "class": "bx draw", x: 71, y: 149, width: 23, height: 11, pathLength: 120 }));
        cap.textContent = "The box lands on the year, right where the date is printed.";
      } else cap.textContent = "";
    });
  }

  var CARDS = [
    { label: "Raw Text", eyebrow: "Step 1 · Review the raw text",
      html: `<h2 class="title">Look at the <span class="hl">Raw</span> Text First</h2>
        <p class="why">On page 3, the expiration date lands on a different line from its label, so look before you write code.</p>
        <p class="p">Before you write a single line of extraction logic (the code that pulls the values out), <b>look at what you're working with</b>.</p>

      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });
    Array.prototype.forEach.call(rail.children, function (b, n) {
      b.classList.toggle("is-cur", n === i);
      b.classList.toggle("is-done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("where-count").textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + titleOf(i + 1) + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n < 0 || n >= CARDS.length || n === i) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i === CARDS.length - 1) {
      donemsg.textContent = DONE_MSG;
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "extern-deck-done" }, "*");
      return;
    }
    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.closest && e.target.closest(".sw, .btn-row")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #card=3 opens a card directly */
  var m = location.hash.match(/card=(\d)/);
  if (m) i = Math.min(CARDS.length - 1, Math.max(0, +m[1] - 1));
  window.addEventListener("resize", fit);
  fit();
  render(false);
})();
</script>
</body>
</html>
