<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fields, Anchors and Boxes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Card player (rail, stage scaling, "Click me" pulse, spacing) copied
   from pfizer3-p3-m7-learn.html, the module 7 Learn deck Smita approved on 17 November 2026.
   P3 module 8 Learn cards: "Learn How to Extract Fields with Regex, Anchor Phrases & Bounding Boxes". Rebuilt 17 November
   2026 (Smita): ideas only, NO code. All code, and the SME's text that goes with it, is in the steps deck
   (pfizer3-p3-m8-steps.html). The old 5-card deck with code is kept at scratchpad/m8-learn-before.html.
   3 cards (the plan's card 1, "Look at the Raw Text First", is folded into the anchor card, Smita 17 November 2026):
   1 Find the Date, Then Find Where It Sits: the letter's date on page 1 as 3 word boxes. The student guesses which search
     finds the box ("3 June, 2022" finds nothing; "2022" lights up with its two corners).
   2 Let the Label Be Your Anchor: page 3 with the labels hidden; the student guesses which of the 3 eight-digit numbers is
     the expiration date, then the labels appear and "Expiration Date:" is joined to 20260315. Then "On the page" vs
     "In the raw text": in the text Python pulls out, the label and the date sit on separate lines.
   3 Can You See It?: page 1 with "Draw the box" (lands on 2022) and "Draw a box that's off" (the same numbers counted up
     from the bottom of the page, the mistake in the SME's first page version: it lands down by "Best regards,"), plus an
     "Up close" view and his three checks.
   QA pass, 17 November 2026: card 1's bounding-box definition is cut (module 5 in Step 1 taught it; the card says "You met
   bounding boxes in Step 1."); card 2's "In the raw text" result points back to the hidden line break module 7 taught,
   keeping the SME's sentences; card 2's "Click me" now sits beside the first clickable number, 18356721.
   Text: the SME's (Chaitanya's) module 8 page where he has the words. Card 1: "This matters because layout equals
   meaning." (the bounding box definition is ours; his sentence "These coordinates... represent a bounding box: the exact
   spot the word takes up on the PDF." stays in Try Step 3 only). Card 2: "Think about another question... That's where
   anchor phrases come in.", the anchor-phrase definition, "But just ... floating alone? You can't tell what it refers to
   unless you know where it sits.", "... is your anchor: you use its position to locate or validate (check) the value next
   to it.", "Before you write a single line of extraction logic, look at what you're working with.", "Looks innocent
   enough. But there's a catch: the label and the date are broken across lines." and "Tools like PyMuPDF ... They just see
   blocks of text and coordinates." Card 3: "Visual confirmation is one of the most powerful debugging tools you have. It
   answers a simple question: Did your code find the right thing in the right place?", "But what if that box is off? Or
   worse, it's in the completely wrong part of the page?", "This isn't just about aesthetics, it's about trust. When you
   visualize, you confirm:" and his 3 checks. His examples are swapped for the supplier file's, as in the old deck.
   Ours: titles, one bold why line per card, the bounding box and anchor lead-ins, hints, results and labels.
   Every box is real: page.get_text("words") and page.get_text("text") on sample-sdf-document.pdf with PyMuPDF 2.1 (what
   Colab installs), 17 November 2026. Page 1: "3" (36.0, 149.22, 41.73, 160.79), "June," (44.06, 149.22, 68.95, 160.79),
   "2022" (71.33, 149.22, 94.17, 160.79); OpenCV's whole-number box for 2022 is (71, 149, 94, 160); counted from the
   bottom of the 792-point page it becomes y 632 to 643, where "Best regards," sits (y 624.53 to 636.1). Page 3: lot
   18356721, manufacture 20240315 and expiration 20260315 at x 200.0 to 244.48, tops 167.25, 203.25 and 239.25;
   "Expiration" (50.0, 239.25, 94.46, 252.99), "Date:" (97.24, 239.25, 121.14, 252.99).
   New pictures (PyMuPDF 2.1 renders, crop in PDF points, zoom; source: scratchpad m8-learn3/render.py):
   pfizer3-p3-m8-l1-date.png (page 1, x 28 to 128, y 134 to 170, zoom 12), pfizer3-p3-m8-l2-p3.png (page 3, x 40 to 330,
   y 164 to 258, zoom 6), pfizer3-p3-m8-l3-page1.png (page 1, whole, zoom 2), pfizer3-p3-m8-l3-zoom-ok.png (page 1,
   x 28 to 140, y 134 to 172, zoom 8), pfizer3-p3-m8-l3-zoom-off.png (page 1, x 28 to 140, y 612 to 648, zoom 8).
   Fixed stage: laid out on a 760 x 810 design stage, then scaled as one piece to fit the embed frame and centred
   (Notion embed height 755 px at the 708 px wide column). Nothing scrolls. Spare height on a card first widens the gaps
   between blocks (up to 2x), then enlarges the card's main picture. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-600); --focus-ring:var(--pfizer-blue);
  --space-2:8px; --space-3:14px; --space-4:18px; --space-5:26px;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage-w:760px; --stage-h:810px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
[hidden]{display:none !important}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}
.pg-label{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-muted);white-space:nowrap}
.pg-label::after{content:attr(data-text);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:600}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:20px 28px;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.inner{display:flex;flex-direction:column;gap:12px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:2px}
.hl{color:var(--highlight)}
.why{margin:-6px 0 0;font-size:17px;line-height:1.45;font-weight:600;color:var(--ink)}
.p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty}
.p b{font-weight:600;color:var(--ink)}
.hint{margin:0;font-size:14px;line-height:1.4;font-weight:600;color:var(--step-label)}
.row{display:flex;align-items:center;gap:var(--space-4)}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.center{display:flex;justify-content:center}
.q{margin:0;font-size:16px;line-height:1.45;font-weight:600;color:var(--ink)}

/* Switch */
.sw{display:inline-flex;flex:none;border:1.5px solid var(--ink);border-radius:var(--radius-xs);overflow:hidden}
.sw button{border:0;background:var(--surface);color:var(--ink);padding:9px 15px;cursor:pointer;font-size:14.5px;line-height:1.2;font-weight:600;white-space:nowrap}
.sw button + button{border-left:1.5px solid var(--ink)}
.sw button[aria-pressed="true"]{background:var(--action);color:var(--on-action)}

.later{visibility:hidden}
.later.on{visibility:visible}

/* Click-me nudge: a soft pulsing outline and a small tag, both gone after the first click */
.nwrap{position:relative;display:inline-flex;flex:none}
.nudge{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(0,51,160,.55)}50%{box-shadow:0 0 0 7px rgba(0,51,160,.12)}}
.tap.static{position:static;transform:none;align-self:flex-start;margin-top:4px}
.tap{position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--surface-card);color:var(--pfizer-blue);border:1px solid var(--blue-200);border-radius:999px;padding:4px 11px;font-size:13px;line-height:1.2;font-weight:600;pointer-events:none;animation:tapx 1.6s ease-in-out infinite}
.tap.below{left:50%;top:calc(100% + 8px);transform:translateX(-50%)}
@keyframes tapx{0%,100%{margin-left:0}50%{margin-left:4px}}
@media (prefers-reduced-motion:reduce){ .nudge{animation:none;box-shadow:0 0 0 3px rgba(0,51,160,.5)} .tap{animation:none} }

/* Pictures with boxes drawn over them (an SVG in PDF points, viewBox = the picture's crop) */
.pic{position:relative;margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);line-height:0;flex:none}
.pic img{display:block;width:100%;height:auto;transition:opacity .25s ease}
.pic svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pic rect{fill:none;stroke-width:2.5px;vector-effect:non-scaling-stroke}
.pic rect.g{stroke:var(--highlight);fill:var(--highlight);fill-opacity:.16}
.pic rect.b{stroke:var(--pfizer-blue);fill:var(--pfizer-blue);fill-opacity:.12}
.pic rect.thin{stroke:var(--blue-200);stroke-width:1.5px;fill:none}
.pic rect.cover{fill:var(--surface-card);stroke:var(--blue-200);stroke-width:1px}
.pic rect.pop,.pic circle.pop,.pic line.pop,.pic text.pop{animation:pop .3s ease both}
@keyframes pop{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){ .pic .pop{animation:none} }
.pic .gd{stroke:var(--pfizer-blue);stroke-width:1.5px;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.pic .ring{fill:none;stroke:var(--pfizer-blue);stroke-width:2px;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.pic .dot{fill:var(--pfizer-blue);stroke:var(--surface);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.pic .tag{font-family:var(--font-text);font-weight:700;fill:var(--pfizer-blue)}
.pic .tag.k{fill:var(--gray-600)}
.cap{margin:6px 0 0;font-size:12.5px;line-height:1.3;font-weight:600;color:var(--gray-600);text-align:center}
.res{margin:0;font-size:16px;line-height:1.5;color:var(--ink-muted)}
.res b{font-weight:700;color:var(--ink)}

/* Card 2: the raw text, laid over the page picture */
.pic.as-text img{opacity:0}
.raw{position:absolute;inset:0;margin:0;padding:8px 18px;display:flex;flex-direction:column;justify-content:center;font-family:var(--font-mono);font-size:14px;line-height:20px;color:var(--ink);white-space:pre}
.raw span{align-self:flex-start;border-radius:4px;padding:0 4px}
.raw span.on{background:rgba(7,166,87,.16);box-shadow:0 0 0 1.5px var(--highlight)}
.numb{position:absolute;z-index:2;background:transparent;border:0;border-radius:6px;padding:0;cursor:pointer}
.numb:hover{background:rgba(0,51,160,.10)}
.tap.inpic{left:76.5%;top:10.8%;transform:translateY(-50%);z-index:3}
.slot{min-height:50px;display:flex;flex-direction:column;justify-content:center}
.slot .tap.static{align-self:center;margin-top:0;animation-name:taps}
@keyframes taps{0%,100%{transform:none}50%{transform:translateX(-4px)}}
.raw-h{position:absolute;top:10px;right:14px;font-family:var(--font-text);font-size:12.5px;line-height:1.3;font-weight:600;color:var(--pfizer-blue)}

/* Card 3: the page, the buttons and the close-up */
.see{display:flex;gap:22px;align-items:flex-start}
.see .col{flex:1 1 auto;gap:10px}
.draws{display:flex;gap:10px;flex-wrap:wrap;border-radius:var(--radius-xs)}
.btn.btn-sec{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.btn-sec[aria-pressed="true"]{background:var(--action);color:var(--on-action);border-color:var(--action)}
.up{position:relative;width:270px}
.up-l{position:absolute;top:6px;right:8px;font-size:11.5px;line-height:1.3;font-weight:600;letter-spacing:.06em;color:var(--pfizer-blue);background:var(--surface);padding:1px 5px;border-radius:4px}
.checks{display:flex;gap:10px}
.checks span{flex:1 1 0;display:flex;align-items:center;gap:8px;background:var(--surface-card);border-radius:var(--radius-sm);padding:9px 10px;font-size:14px;line-height:1.3;font-weight:600;color:var(--card-title)}
.checks svg{width:18px;height:18px;flex:none;color:var(--highlight)}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.btn-sm{padding:10px 16px;font-size:15px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="How to find where a date sits, tie it to its label and see its box: three cards">
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where"><span id="where-count">Card 1 of 3</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Card"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-next" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  var each = function (list, fn) { Array.prototype.forEach.call(list, fn); };
  var TICK = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor" opacity=".16"/><path d="M5.8 10.4 8.6 13l5.6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* A picture of part of a page, with an empty SVG over it in PDF points (crop = x, y, width, height) */
  function pic(id, src, w, h, crop, alt, attrs) {
    return '<figure class="pic" id="' + id + '"' + (attrs || '') + '><img src="' + src + '" width="' + w + '" height="' + h + '" alt="' + alt + '">' +
      '<svg aria-hidden="true" preserveAspectRatio="none" viewBox="' + crop.join(" ") + '"></svg></figure>';
  }
  function el(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function clear(svg) { while (svg.firstChild) svg.removeChild(svg.firstChild); }
  /* b = [x0, y0, x1, y1]; pad grows the box a little so it doesn't sit on the letters */
  function box(svg, b, cls, pad, pop) {
    pad = pad == null ? 1.2 : pad;
    svg.appendChild(el("rect", { "class": cls + (pop ? " pop" : ""), x: b[0] - pad, y: b[1] - pad, width: b[2] - b[0] + 2 * pad, height: b[3] - b[1] + 2 * pad, rx: 1.5 }));
  }

  /* Click-me nudges: a pulsing outline on the element and a "Click me" tag beside it, until it is first clicked */
  var tapped = {};
  function nudge(key, target, tagHost, cls) {
    if (tapped[key] || target.classList.contains("nudge")) return;
    target.classList.add("nudge");
    var tag = document.createElement("span");
    tag.className = "tap" + (cls ? " " + cls : ""); tag.setAttribute("aria-hidden", "true"); tag.textContent = "👆 Click me";
    (tagHost || target.parentNode).appendChild(tag);
    target.addEventListener("click", function () {
      tapped[key] = true;
      target.classList.remove("nudge");
      if (tag.parentNode) tag.parentNode.removeChild(tag);
    }, true);
  }

  /* Card 1: the letter's date on page 1 (crop x 28 to 128, y 134 to 170). Real get_text("words") boxes. */
  var DATE_WORDS = [[36.0, 149.22, 41.73, 160.79], [44.06, 149.22, 68.95, 160.79], [71.33, 149.22, 94.17, 160.79]];
  function initWhere(root) {
    var svg = root.querySelector("#c1-pic svg"), res = root.querySelector("#c1-res"), btns = root.querySelectorAll(".sw button");
    function words() { DATE_WORDS.forEach(function (w) { box(svg, w, "thin", 0.5); }); }
    function show(v) {
      each(btns, function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-view") === v ? "true" : "false"); });
      clear(svg); words();
      if (v === "whole") {
        res.innerHTML = '<b>Nothing found.</b> The page holds the date as 3 separate words, “3”, “June,” and “2022”, and none of them is “3 June, 2022”.';
        return;
      }
      var w = DATE_WORDS[2];
      box(svg, w, "g", 0.5, true);
      svg.appendChild(el("circle", { "class": "dot pop", cx: w[0], cy: w[1], r: 0.9 }));
      svg.appendChild(el("circle", { "class": "dot pop", cx: w[2], cy: w[3], r: 0.9 }));
      svg.appendChild(el("text", { "class": "tag pop", x: w[0] - 0.4, y: w[1] - 1.8, "font-size": 2.6 }, "top-left (71.33, 149.22)"));
      svg.appendChild(el("text", { "class": "tag pop", x: w[2] + 0.4, y: w[3] + 4.0, "font-size": 2.6, "text-anchor": "end" }, "bottom-right (94.17, 160.79)"));
      res.innerHTML = '<b>Found it.</b> The year is one word, so it has its own box, set by 2 corners. That\'s why you search for the date\'s last word, the year.';
    }
    each(btns, function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-view")); }); });
    words();
    nudge("c1", root.querySelector(".sw"), root.querySelector(".sw").parentNode, "below");
  }

  /* Card 2: page 3 (crop x 40 to 330, y 164 to 258). Real get_text("words") boxes and the real get_text("text") lines. */
  var P3 = {
    "18356721": { box: [200.0, 167.25, 244.48, 180.99], label: [50.0, 167.25, 105.02, 180.99], name: "the lot number" },
    "20240315": { box: [200.0, 203.25, 244.48, 216.99], label: [50.0, 203.25, 143.38, 216.99], name: "the date of manufacture" },
    "20260315": { box: [200.0, 239.25, 244.48, 252.99], label: [50.0, 239.25, 121.14, 252.99], name: "the expiration date" }
  };
  var RAW = ["Lot Number:", "18356721", "Product Article Number:", "28 9301 82", "Date of Manufacture:", "20240315",
    "Product Description:", "Low Flow Kit, AKTA ready", "Expiration Date:", "20260315"];
  function initAnchor(root) {
    var fig = root.querySelector("#c2-pic"), svg = fig.querySelector("svg"), res = root.querySelector("#c2-res");
    var ask = root.querySelector("#c2-q"), after = root.querySelector("#c2-after"), btns = after.querySelectorAll(".sw button");
    var raw = document.createElement("div");
    raw.className = "raw"; raw.setAttribute("aria-label", "The text Python pulls out of this part of page 3: each label and each value on its own line.");
    raw.innerHTML = '<span class="raw-h">IN THE RAW TEXT</span>' + RAW.map(function (l, n) { return '<span' + (n >= 8 ? ' class="on"' : '') + '>' + l + '</span>'; }).join("");
    var picked = null, pickMsg = "";
    /* The 3 numbers are buttons laid over the picture, on their real boxes (crop x 40 to 330, y 164 to 258) */
    var nums = Object.keys(P3).map(function (k) {
      var b = P3[k].box, n = document.createElement("button");
      n.type = "button"; n.className = "numb"; n.setAttribute("aria-label", k);
      n.style.left = ((b[0] - 2 - 40) / 290 * 100) + "%"; n.style.top = ((b[1] - 2 - 164) / 94 * 100) + "%";
      n.style.width = ((b[2] - b[0] + 4) / 290 * 100) + "%"; n.style.height = ((b[3] - b[1] + 4) / 94 * 100) + "%";
      n.addEventListener("click", function () { pick(k); });
      fig.appendChild(n);
      return n;
    });
    var tag = document.createElement("span");
    tag.className = "tap inpic"; tag.setAttribute("aria-hidden", "true"); tag.textContent = "👆 Click me";
    function hidden() {
      clear(svg);
      svg.appendChild(el("rect", { "class": "cover", x: 46, y: 165.5, width: 140, height: 91, rx: 3 }));
      svg.appendChild(el("text", { "class": "tag k", x: 116, y: 205, "font-size": 8, "text-anchor": "middle" }, "Labels hidden"));
      Object.keys(P3).forEach(function (k) {
        var b = P3[k].box;
        box(svg, b, "b", 1.2);
        svg.appendChild(el("text", { "class": "tag", x: b[2] + 5, y: b[3] - 2.5, "font-size": 12 }, "?"));
      });
      if (!tapped.c2) { nums.forEach(function (n) { n.classList.add("nudge"); }); fig.appendChild(tag); }
    }
    function page(pop) {
      fig.classList.remove("as-text");
      if (raw.parentNode) fig.removeChild(raw);
      clear(svg);
      if (picked !== "20260315") { box(svg, P3[picked].label, "b", 1.2, pop); box(svg, P3[picked].box, "b", 1.2, pop); }
      box(svg, P3["20260315"].label, "g", 1.2, pop);
      box(svg, P3["20260315"].box, "g", 1.2, pop);
      svg.appendChild(el("line", { "class": "gd" + (pop ? " pop" : ""), x1: 125, y1: 246.1, x2: 196, y2: 246.1 }));
      svg.appendChild(el("text", { "class": "tag" + (pop ? " pop" : ""), x: 170, y: 237.6, "font-size": 5.4, "text-anchor": "middle" }, "same top: 239.25"));
      res.innerHTML = pickMsg + ' But just “20260315” floating alone? You can\'t tell what it refers to unless you know where it sits. <b>“Expiration Date:” is your anchor:</b> you use its position to locate or validate (check) the value next to it.';
    }
    function text() {
      clear(svg);
      fig.classList.add("as-text");
      fig.appendChild(raw);
      res.innerHTML = '<b>Looks innocent enough. But there\'s a catch:</b> it\'s the same hidden line break you met in the last reading. Tools like PyMuPDF don\'t always “read” a layout the way you or I would. They just see blocks of text and coordinates.';
    }
    function pick(k) {
      if (picked) return;
      picked = k; tapped.c2 = true;
      nums.forEach(function (n) { n.parentNode.removeChild(n); });
      if (tag.parentNode) tag.parentNode.removeChild(tag);
      pickMsg = k === "20260315" ? '<b>Lucky guess!</b> Without the labels, nobody can tell.' : '<b>Not quite: ' + k + ' is ' + P3[k].name + '.</b>';
      ask.hidden = true; after.hidden = false;
      page(true);
      nudge("c2-raw", after.querySelector(".sw"), after, "static");
      space();
    }
    each(btns, function (b) {
      b.addEventListener("click", function () {
        var v = b.getAttribute("data-view");
        each(btns, function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
        if (v === "text") text(); else page(false);
      });
    });
    hidden();
  }

  /* Card 3: the whole of page 1 (viewBox 0 0 612 792). OpenCV's box for 2022 is (71, 149, 94, 160). Counted up from the
     bottom of the 792-point page instead of down from the top, the same numbers give y 632 to 643, on "Best regards,". */
  var DRAW = {
    ok: { box: [71, 149, 94, 160], up: "pfizer3-p3-m8-l3-zoom-ok.png", h: 304, crop: [28, 134, 112, 38],
      alt: "Up close: the date line of the letter, 3 June, 2022, with a green box on the year 2022.",
      res: '<b>The box lands right on 2022</b>, the year in the letter\'s date. In Try It Yourself, a library called OpenCV draws this box for you.' },
    off: { box: [71, 632, 94, 643], up: "pfizer3-p3-m8-l3-zoom-off.png", h: 288, crop: [28, 612, 112, 36],
      alt: "Up close: the words Best regards, near the bottom of page 1, with a green box on part of regards.",
      res: '<b>But what if that box is off? Or worse, it\'s in the completely wrong part of the page?</b> This box counts the same numbers up from the bottom of the page, not down from the top, so it lands down by “Best regards,”.' }
  };
  function initSee(root) {
    var svg = root.querySelector("#c3-pic svg"), res = root.querySelector("#c3-res"), btns = root.querySelectorAll(".draws button");
    var up = root.querySelector("#c3-up"), upImg = up.querySelector("img"), upSvg = up.querySelector("svg"), upWrap = root.querySelector("#c3-upwrap");
    function show(v) {
      each(btns, function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-v") === v ? "true" : "false"); });
      var D = DRAW[v], b = D.box;
      clear(svg);
      box(svg, b, "g", 0, true);
      svg.appendChild(el("circle", { "class": "ring pop", cx: (b[0] + b[2]) / 2, cy: (b[1] + b[3]) / 2, r: 30 }));
      upWrap.classList.add("on");
      upImg.src = D.up; upImg.setAttribute("height", D.h); upImg.alt = D.alt;
      upSvg.setAttribute("viewBox", D.crop.join(" "));
      clear(upSvg);
      box(upSvg, b, "g", 0, true);
      res.innerHTML = D.res;
      space();
    }
    each(btns, function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-v")); }); });
    nudge("c3", root.querySelector(".draws"), root.querySelector(".draws").parentNode, "below");
  }

  var CARDS = [
    { label: "Where It Sits", eyebrow: "Bounding boxes",
      html: '<h2 class="title">Find the Date, Then Find <span class="hl">Where</span> It Sits</h2>' +
        '<p class="why">Regex already found the letter\'s date for you: 3 June, 2022. To check that date against its label, or draw it on the page, you also need to know where it sits.</p>' +
        '<p class="p"><b>This matters because layout equals meaning.</b> You met bounding boxes in Step 1.</p>' +
        '<div class="row"><p class="q">Which search do you think finds the date\'s box?</p><div class="nwrap"><div class="sw" role="group" aria-label="Choose what to search for">' +
          '<button type="button" data-view="whole" aria-pressed="false">Search “3 June, 2022”</button>' +
          '<button type="button" data-view="year" aria-pressed="false">Search “2022”</button></div></div></div>' +
        '<div class="center"><div data-grow data-max="704" style="width:560px">' +
          pic("c1-pic", "pfizer3-p3-m8-l1-date.png", 1200, 432, [28, 134, 100, 36], "The date at the top of the letter on page 1 of the supplier file, 3 June, 2022, with a thin box around each of its 3 words. After a search, the year 2022 gets a green box with its two corners marked.") +
          '<p class="cap">The letter\'s date on page 1. Each thin box is one word.</p></div></div>' +
        '<p class="res" id="c1-res" aria-live="polite" style="min-height:48px"></p>',
      init: initWhere },

    { label: "Anchor", eyebrow: "Anchor phrases",
      html: '<h2 class="title">Let the Label Be Your <span class="hl">Anchor</span></h2>' +
        '<p class="why">In the Task you pull out the file\'s key dates. On page 3, three 8-digit numbers sit in one column, and only one of them is the expiration date.</p>' +
        '<p class="p">Think about another question: you have a number on a page, but it might as well be something different. Maybe what you think is a date is actually a lot number. What do you do then? That\'s where <b>anchor phrases</b> come in. An anchor phrase is a <b>word or phrase near the value you\'re looking for</b>.</p>' +
        '<div class="slot"><p class="q" id="c2-q">Which one do you think is the expiration date? Click a number on the page.</p>' +
          '<div class="row" id="c2-after" hidden><p class="p" style="flex:1 1 auto">Before you write a single line of extraction logic (the code that pulls values out), <b>look at what you\'re working with</b>.</p>' +
            '<div class="sw" role="group" aria-label="Choose how to see page 3">' +
              '<button type="button" data-view="page" aria-pressed="true">On the page</button>' +
              '<button type="button" data-view="text" aria-pressed="false">In the raw text</button></div></div></div>' +
        '<div>' + pic("c2-pic", "pfizer3-p3-m8-l2-p3.png", 1740, 564, [40, 164, 290, 94], "Part of page 3 of the supplier file: Lot Number 18356721, Product Article Number 28 9301 82, Date of Manufacture 20240315, Product Description Low Flow Kit, AKTA ready, and Expiration Date 20260315, each label on the same line as its value. At first the labels are hidden.") + '</div>' +
        '<p class="res" id="c2-res" aria-live="polite" style="min-height:72px"></p>',
      init: initAnchor },

    { label: "See It", eyebrow: "Visual verification",
      html: '<h2 class="title">Can You <span class="hl">See</span> It?</h2>' +
        '<p class="why">Numbers like (71, 149, 94, 160) are hard to check by eye. A box drawn on the page shows you at once whether your code found the right thing.</p>' +
        '<p class="p">Visual confirmation is one of the most powerful debugging tools (ways to find what\'s wrong in your code) you have. It answers a simple question:</p>' +
        '<div class="see"><div data-grow data-max="270" style="width:230px;flex:none">' +
            pic("c3-pic", "pfizer3-p3-m8-l3-page1.png", 1224, 1584, [0, 0, 612, 792], "Page 1 of the supplier file, the Cytiva letter. A green box, circled, shows where the chosen box lands.") +
            '<p class="cap">Page 1 of the supplier file</p></div>' +
          '<div class="col"><p class="q">Did your code find the right thing in the right place?</p>' +
            '<div class="nwrap" style="align-self:flex-start"><div class="draws" role="group" aria-label="Choose a box to draw">' +
              '<button type="button" class="btn btn-sm btn-sec" data-v="ok" aria-pressed="false">Draw the box</button>' +
              '<button type="button" class="btn btn-sm btn-sec" data-v="off" aria-pressed="false">Draw a box that\'s off</button></div></div>' +
            '<div class="later up" id="c3-upwrap">' +
              pic("c3-up", "pfizer3-p3-m8-l3-zoom-ok.png", 896, 304, [28, 134, 112, 38], "Up close: the date line of the letter, 3 June, 2022.") + '<span class="up-l">UP CLOSE</span></div>' +
            '<p class="res" id="c3-res" aria-live="polite" style="min-height:96px"></p>' +
          '</div></div>' +
        '<p class="p">This isn\'t just about aesthetics (how it looks), it\'s about <b>trust</b>. When you visualize, you confirm:</p>' +
        '<div class="checks"><span>' + TICK + 'Did I extract the right field?</span><span>' + TICK + 'Is it where I think it is?</span><span>' + TICK + 'Does it match the anchor?</span></div>',
      init: initSee }
  ];
  var END_LABEL = "Done";

  var i = 0;
  var app = $("app"), rail = $("rail"), stage = $("stage"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the cards. Scroll down to the next part of this reading.";

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a card. Spare height first widens the gaps
     between blocks, up to 2x; what is left enlarges the card's main picture. */
  var GAP = 12;
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = GAP + "px";
    var grow = null;
    each(inner.querySelectorAll("[data-grow]"), function (g) {
      if (!g.hasAttribute("data-base")) g.setAttribute("data-base", g.style.width || "");
      g.style.width = g.getAttribute("data-base");
      if (!grow && g.offsetHeight) grow = g;
    });
    var cs = getComputedStyle(stage);
    var avail = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) {
      var add = Math.min(GAP, spare / gaps);
      inner.style.gap = (GAP + add) + "px";
      spare = avail - inner.offsetHeight;
    }
    for (var j = 0; j < 4 && grow && spare < 0; j++) {
      var gw = grow.offsetWidth, gh = grow.offsetHeight;
      grow.style.width = Math.max(160, gw + spare * (gw / gh) - 1) + "px";
      spare = avail - inner.offsetHeight;
    }
    if (!grow || spare < 2) return;
    var max = +grow.getAttribute("data-max") || 704;
    for (var k = 0; k < 3 && spare >= 2; k++) {
      var w = grow.offsetWidth, h = grow.offsetHeight;
      if (!h || w >= max) break;
      grow.style.width = Math.min(max, w + spare * (w / h)) + "px";
      spare = avail - inner.offsetHeight;
      if (spare < 0) { grow.style.width = Math.max(0, grow.offsetWidth + spare * (w / h) - 1) + "px"; spare = avail - inner.offsetHeight; }
    }
  }

  CARDS.forEach(function (c, n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + c.label);
    b.innerHTML = '<span class="seg"></span><span class="pg-label" data-text="' + c.label + '">' + c.label + '</span>';
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function titleOf(n) { var m = CARDS[n].html.match(/<h2[^>]*>(.*?)<\/h2>/); return m ? m[1].replace(/<[^>]+>/g, "") : ""; }

  function render(anim) {
    var c = CARDS[i];
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.eyebrow + '</p>' + c.html + '</div>';
    each(rail.children, function (b, n) {
      b.classList.toggle("is-cur", n === i);
      b.classList.toggle("is-done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("where-count").textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + titleOf(i + 1) + "</b>";
    donemsg.textContent = "";
    if (c.init) c.init(card);
    space();
    each(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  function go(n) { if (n < 0 || n >= CARDS.length || n === i) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i === CARDS.length - 1) {
      donemsg.textContent = DONE_MSG;
      space();
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "extern-deck-done" }, "*");
      return;
    }
    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.closest && e.target.closest(".sw, .draws, .numb")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #card=N opens a card directly */
  var m = location.hash.match(/card=(\d)/);
  if (m) { i = Math.min(CARDS.length - 1, Math.max(0, +m[1] - 1)); }
  window.addEventListener("resize", function () { fit(); });
  fit();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
