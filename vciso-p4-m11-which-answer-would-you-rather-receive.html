<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Answer Would You Rather Receive?</title>
<!--
  vCISO P4 Step 3, Module 11: Rewrite the Client's Eight Answers So They Can Be Defended.
  Build spec in 06-content/project-04/step-03/module-11-internal.md (Build Note).
  Governing authority: output/programs/vciso/CLAUDE.md section 6. Look, navigation,
  scale-to-fit, phone layout and state handling match
  vciso-p2-m12-day-8-why-is-it-still-spreading.html and
  vciso-p2-m11-is-cumberland-actually-affected.html.

  Sources for every fact:
  - The question, D6, word for word: P4 Sample Pack/Shared/Prior signed questionnaire
    (Cumberland to Meridian).md, row D6 ("Are firewall rules reviewed on a regular schedule?").
  - Answer A and Answer B, word for word: P4 Sample Pack/Interactive content sets - P4.md, P4-10.
  - Answer (B to both), trap (the confident Yes as safer to send) and reveal:
    P4-10 and the build spec. The reveal wording is the spec's, with "the first" and
    "the second" named as Answer A and Answer B, and "the customer" named as Meridian.
  - "What Meridian would find": firewall-review-emails.pdf, identical in all four scope
    folders (14 March 2024 and 22 August 2024).
  - "Partly": Meridian's own instructions on the form ("Answer every question Yes / No /
    Partly ..."). The line under Answer B only says Partly is one of the three allowed
    answers; it does not say what Meridian asks of a Partly answer (module Step 3 does).
  - Firewall definition: the wording already used in 06-content.
  No scope picker: the question, both answers and the emails are company-wide (spec,
  "Per-scope data: none"; the four PDFs were read and match).

  Each question has a right answer, so the P2 right/wrong pattern applies: the right
  pick turns green with a tick and "Right"; a wrong pick turns red with a cross and
  "Not quite", with a short reason, and the student tries again. With two options,
  one wrong try leaves only the right one, so the "after two wrong tries" step can
  never be reached here; the student picks the other answer to finish.
  Order: the safer-to-send question comes first, so the trap (the confident Yes as
  safer) is picked before any reply explains anything (QA fix, 2 October 2026).
  Answer B is never called a model or a correct rewrite (DN16), and no line here
  claims every part of it is accurate: the module asks the student to check it.
  Green #146C2E on #E6F4EA (5.7:1), red #B3261E on #FCE8E6 (5.6:1).
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    /* right and wrong states only, always paired with an icon and a word */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-reveal:520ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}

  h1{font-size:27px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- the question on the form ---- */
  .plead{display:none}
  .qform{flex:0 0 auto;display:flex;gap:12px;align-items:flex-start;background:var(--highlight);
    border-left:5px solid var(--on-highlight);border-radius:0 12px 12px 0;padding:9px 16px}
  .qform .qi{color:var(--on-highlight);flex:0 0 auto;margin-top:2px}
  .qform .qi svg.ic{width:24px;height:24px}
  .qform .qt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .qform .ql{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .qform .qq{font-size:17px;font-weight:600;line-height:1.3;color:var(--title)}
  .qform .qd{font-size:13.5px;line-height:1.35;color:var(--body)}

  /* ---- the pick ---- */
  .pick{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  .opts{display:flex;flex-direction:column;gap:9px;min-height:0}
  button.opt{font-family:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--title);
    border:1.5px solid var(--on-highlight);border-radius:10px;padding:8px 8px 8px 12px;flex:1 1 auto;min-height:0;
    display:grid;grid-template-columns:36px 1fr 66px;gap:10px;align-items:center;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  @media (hover:hover){ button.opt:hover:not(:disabled){background:var(--highlight)}
    html.fresh button.opt:hover:not(:disabled){background:var(--bg)} }
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt:disabled{cursor:default}
  button.opt .oi{width:36px;height:36px;border-radius:10px;background:var(--highlight);color:var(--on-highlight);
    border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center}
  button.opt .oi svg.ic{width:22px;height:22px}
  button.opt .ot{display:flex;flex-direction:column;gap:3px;min-width:0}
  button.opt .ol{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  button.opt .on{font-size:16px;font-weight:600;line-height:1.3;color:var(--title)}
  button.opt .od{font-size:13px;line-height:1.32;color:var(--body)}
  button.opt .mk{display:flex;flex-direction:column;align-items:center;gap:3px;justify-self:center}
  button.opt .lb{font-size:12.5px;font-weight:700;line-height:1.15;text-align:center}
  /* The state marker. Empty ring when not chosen. Never filled until clicked. */
  button.opt .g{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;background:transparent}
  button.opt .g svg.ic{width:14px;height:14px;stroke-width:2.6}
  /* Right: green, tick, "Right". */
  button.opt.ok{background:var(--ok-tint);border:2px solid var(--ok)}
  button.opt.ok .g{background:var(--ok);border-color:var(--ok);color:var(--bg)}
  button.opt.ok .lb{color:var(--ok)}
  button.opt.ok .oi{background:var(--bg);border-color:var(--ok);color:var(--ok)}
  /* Wrong: red, cross, "Not quite". */
  button.opt.no{background:var(--no-tint);border:2px solid var(--no)}
  button.opt.no .g{background:var(--no);border-color:var(--no);color:var(--bg)}
  button.opt.no .lb{color:var(--no)}
  button.opt.no .oi{background:var(--bg);border-color:var(--no);color:var(--no)}

  .panel{min-height:0;border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .panel.empty{background:var(--tint);border:1.5px dashed var(--line);justify-content:center;align-items:flex-start;gap:12px}
  .panel.ok{background:var(--ok-tint);border-left:6px solid var(--ok)}
  .panel.no{background:var(--no-tint);border-left:6px solid var(--no)}
  .panel .pe{font-size:16px;line-height:1.45;color:var(--body)}
  .panel .pe b{color:var(--title);font-weight:600}
  .panel .fh{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;flex:0 0 auto}
  .panel.ok .fh{color:var(--ok)}
  .panel.no .fh{color:var(--no)}
  .panel .fh svg.ic{width:24px;height:24px;stroke-width:2}
  .panel .pt{font-size:15px;font-weight:600;color:var(--title);line-height:1.3}
  .panel p.rp{font-size:15.5px;line-height:1.45;color:var(--title)}
  .panel p.nx{font-size:15px;line-height:1.4;font-weight:600;color:var(--title);border-top:1.5px solid rgba(28,27,27,.18);padding-top:8px}
  .panel.tight{gap:6px}
  .panel.tight p.rp{font-size:14.5px;line-height:1.4}
  .panel.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .panel:focus{outline:none}

  /* ---- the last slide: what Meridian would find ---- */
  .closewrap{flex:1 1 auto;display:flex;flex-direction:column;gap:12px;min-height:0}
  .yours{flex:0 0 auto;display:flex;align-items:flex-start;line-height:1.4;gap:10px;font-size:15.5px;color:var(--body)}
  .yours b{color:var(--title);font-weight:600}
  .yours svg.ic{width:20px;height:20px;color:var(--on-highlight);flex:0 0 auto}
  .cards{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:12px;padding:12px 14px;
    display:flex;flex-direction:column;gap:8px}
  .card .ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card .bi{width:34px;height:34px;border-radius:10px;background:var(--highlight);border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .card .bi svg.ic{width:20px;height:20px}
  .card .cl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .card .cq{font-size:16px;font-weight:600;line-height:1.35;color:var(--title)}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--on-highlight);border-radius:20px;
    padding:2px 9px 2px 7px;font-size:12px;font-weight:600;color:var(--on-highlight);background:var(--highlight)}
  .tag svg.ic{width:13px;height:13px}
  .find{display:flex;gap:9px;align-items:flex-start;border-top:1.5px dashed var(--line);padding-top:8px}
  .find svg.ic{width:20px;height:20px;color:var(--on-highlight);flex:0 0 auto;margin-top:1px}
  .find p{font-size:14.5px;line-height:1.4;color:var(--title)}
  .find p b{font-weight:600}
  .statement{flex:0 0 auto;background:var(--highlight);border-left:5px solid var(--on-highlight);
    border-radius:0 12px 12px 0;padding:12px 20px}
  .statement p{font-size:17px;line-height:1.45;font-weight:600;color:var(--title)}
  .statement p + p{margin-top:4px}
  .statement p.sm{font-size:14.5px;font-weight:400;color:var(--body)}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:52px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;min-height:40px;font-size:13.5px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .board{flex:0 0 auto}
    .plead{display:block;font-size:16px;line-height:1.45;font-weight:600;color:var(--title)}
    .qform{padding:10px 12px}
    .qform .qd{font-size:15px}
    .pick{grid-template-columns:1fr}
    button.opt{flex:0 0 auto;padding:12px 10px 12px 12px;grid-template-columns:36px 1fr 60px}
    button.opt .od{font-size:15px}
    .panel{flex:0 0 auto;overflow:visible;scroll-margin:16px}
    .panel p.rp,.panel.tight p.rp{font-size:16px;line-height:1.45}
    .cards{grid-template-columns:1fr}
    .find p{font-size:15.5px}
    .statement{padding:12px 14px}
    .statement p{font-size:17px}
    .statement p.sm{font-size:15.5px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{min-height:0;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Which Answer Would You Rather Receive?">

    <div class="top">
      <span class="prog" id="prog">Question 1 of 2</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:18px;color:#1C1B1B;margin:22px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:8px}
    .nsf li span{display:block;font-size:15.5px}
    .nsf strong{color:#1C1B1B}
    .nsf .box{background:#DCE1FF;border-left:4px solid #001D69;padding:12px 16px;margin:14px 0;color:#1C1B1B}
  </style>
  <div class="nsf">
    <h2>Which Answer Would You Rather Receive?</h2>
    <p>This is question D6 on Meridian's form: <strong>"Are firewall rules reviewed on a regular schedule?"</strong> A firewall is the device between Cumberland's network and the internet. Its rules decide what traffic gets in.</p>
    <p>Here are the two answers:</p>
    <ul>
      <li><strong>Answer A: "Yes. Firewall rules are reviewed quarterly."</strong><span>Quarterly means every three months, so four times a year.</span></li>
      <li><strong>Answer B: "Partly. Reviews were carried out twice in 2024 and recorded in email at the time. There is no written process and no record for 2025."</strong><span>Partly is one of the three answers Meridian's form allows: Yes, No or Partly. A written process is a document that says how and when something should be done.</span></li>
    </ul>
    <p>Before you read on, write down two picks: first the one that you think is safer for Cumberland to send, then the one that you think you would rather receive if you were Meridian.</p>
    <h3>What Meridian would find</h3>
    <div class="box">
      <p>Answer B is the right pick for both questions.</p>
      <p>Answer A is the one that ends the contract. Meridian can check it, and it won't stand. Answer B can't be caught out, because it has already said what's missing.</p>
      <p>Ends the contract means Meridian could decide not to renew its contract with Cumberland. Won't stand means the proof Cumberland has does not back it up.</p>
      <p>If Meridian asked for proof of Answer A, it would find two emails saying the rules were looked at, on 14 March 2024 and 22 August 2024. That is not a review every three months.</p>
    </div>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ---------------- icons ----------------
     Inline SVG drawn to the Phosphor outline style: one weight, uniform size,
     #001D69 through currentColor. No icon font, no network request. */
  var IC = {
    form:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/>',
    chat:'<path d="M4.5 5.5h15a1 1 0 0 1 1 1v9.5a1 1 0 0 1-1 1H10l-4.5 3.5V17h-1a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/>',
    mail:'<rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="m4 6.5 8 6.5 8-6.5"/>',
    user:'<circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/>',
    check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    x:'<path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>',
    okc:'<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8 5.4-5.6"/>',
    noc:'<circle cx="12" cy="12" r="9"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/>',
    info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2M12 7.8v.2"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }

  /* ---------------- content ----------------
     The question: D6 on the prior signed questionnaire, word for word.
     The two answers: P4-10, word for word. Answer: B to both (P4-10, spec).
     "def" is the plain-words line under each answer: what it means, no new facts.
     Replies are reveal copy written at build. */
  var QFORM = {
    label:"Question D6 on Meridian's form",
    text:"Are firewall rules reviewed on a regular schedule?",
    def:"A firewall is the device between Cumberland's network and the internet. Its rules decide what traffic gets in."
  };
  var ANSWER = "b";
  var OPTS = [
    { id:"a", label:"Answer A",
      text:"Yes. Firewall rules are reviewed quarterly.",
      def:"Quarterly means every three months, so four times a year." },
    { id:"b", label:"Answer B",
      text:"Partly. Reviews were carried out twice in 2024 and recorded in email at the time. There is no written process and no record for 2025.",
      def:"Partly is one of the three answers Meridian's form allows: Yes, No or Partly. A written process is a document that says how and when something should be done." }
  ];

  var Q = {
    q1:{
      h1:"Which Answer Would You Rather Receive?",
      lead:["Now imagine you work at <b>Meridian</b>, and Cumberland sends you one of these two answers.",
            "Pick the one that you think you would rather receive."],
      plead:"Read both answers, then pick the one that you think you would rather receive.",
      reply:{
        a:["A plain Yes is quick to read, but it does not say where Meridian can see the reviews. Meridian would have to ask for proof.",
           "It also gives no sign that anything is missing, so Meridian could not tell what it would find."],
        b:["Answer B tells Meridian what was done, where it was recorded, and what is missing.",
           "So Meridian knows what it is getting before it decides anything."]
      }
    },
    q2:{
      h1:"Which Answer Is Safer for Cumberland to Send?",
      lead:["Imagine you work at <b>Cumberland</b>, and you have to send one of these two answers to Meridian.",
            "Pick the one that you think is safer for Cumberland to send."],
      plead:"Read both answers, then pick the one that you think is safer for Cumberland to send.",
      reply:{
        a:["Answer A sounds safer, because it admits nothing.",
           "But Meridian can ask to see a review for every three months, and Cumberland could not show them."],
        b:["Answer B tells Meridian about the gaps itself, before Meridian goes looking.",
           "Meridian may not like reading Partly, but it can't catch Cumberland claiming more than it can show."]
      }
    }
  };
  var AGAIN = "Try the other answer.";

  var S = [
    { id:"q2", kind:"pick", q:"q2", qno:1 },
    { id:"q1", kind:"pick", q:"q1", qno:2 },
    { id:"find", kind:"close", h1:"What Meridian Would Find" }
  ];
  var NQ = 2;

  /* ---------------- state ----------------
     Per question: out = the wrong answers picked, in order; done = true once the
     right one is picked. The first pick is out[0], or the answer if out is empty. */
  var KEY = "vciso-p4-m11-which-answer-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function validId(v){ return OPTS.some(function(o){ return o.id === v; }); }
  function freshQ(){ return { out:[], done:false }; }
  function fresh(){ return { q1:freshQ(), q2:freshQ() }; }
  function cleanQ(raw){
    var q = freshQ();
    if(!isPlain(raw)) return q;
    if(Array.isArray(raw.out)) raw.out.forEach(function(k){
      if(validId(k) && k !== ANSWER && q.out.indexOf(k) < 0) q.out.push(k);
    });
    q.done = raw.done === true;
    return q;
  }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var s = { q1:cleanQ(raw.q1), q2:cleanQ(raw.q2) };
      return s;
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = m; }
  function opt(id){ var r = null; OPTS.forEach(function(o){ if(o.id === id) r = o; }); return r; }
  function phone(){ return window.matchMedia("(max-width:599px)").matches; }
  function firstPick(q){ var a = st[q]; return a.out.length ? a.out[0] : (a.done ? ANSWER : null); }
  function titleOf(s){ return s.kind === "pick" ? Q[s.q].h1 : s.h1; }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = s.kind === "pick" ? "Question " + s.qno + " of " + NQ : "What it means";
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    el.back.disabled = (i === 0);
    el.next.textContent = "Continue";
    el.next.classList.remove("ghost");
    el.next.disabled = false;
    el.hint.textContent = "";
    if(i === S.length-1){
      el.next.textContent = "Start over";
      el.next.classList.add("ghost");
      el.hint.textContent = "That is the end. Start over clears your answers.";
    }
    else if(s.kind === "pick" && !st[s.q].done){
      el.next.disabled = true;
      el.hint.textContent = st[s.q].out.length ? "Try the other answer to carry on." : "Pick one answer to carry on.";
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    document.documentElement.classList.add("fresh");
    var s = S[i];
    el.h1.textContent = titleOf(s);
    el.frame.setAttribute("aria-label", titleOf(s));
    if(s.kind === "pick") renderPick();
    else renderClose();
    header();
    say((s.kind === "pick" ? "Question " + s.qno + " of " + NQ + ". " : "") + titleOf(s).replace(/([^.?!])$/, "$1."));
  }

  function qformHTML(){
    return '<div class="qform"><span class="qi">' + icon("form") + "</span>"
      + '<span class="qt"><span class="ql">' + esc(QFORM.label) + "</span>"
      + '<span class="qq">“' + esc(QFORM.text) + "”</span>"
      + '<span class="qd">' + esc(QFORM.def) + "</span></span></div>";
  }

  /* A question slide: the form question, two answers (none chosen on arrival), the panel. */
  function renderPick(){
    var s = S[i];
    el.board.innerHTML = '<p class="plead">' + esc(Q[s.q].plead) + "</p>"
      + qformHTML()
      + '<div class="pick">'
      +   '<div class="opts" role="group" aria-label="' + esc(Q[s.q].h1) + '">'
      +     OPTS.map(function(o){ return optHTML(o, s.q); }).join("")
      +   "</div>"
      +   '<div class="panel" id="panel" tabindex="-1"></div>'
      + "</div>";
    paintPanel(false);
    Array.prototype.forEach.call(el.board.querySelectorAll("button.opt:not(:disabled)"), function(b){
      b.addEventListener("click", function(){ choose(b.dataset.o); });
    });
  }
  function stateOf(o, q){
    if(o.id === ANSWER && st[q].done) return { cls:"ok", ico:"check", tag:"Right" };
    if(st[q].out.indexOf(o.id) >= 0) return { cls:"no", ico:"x", tag:"Not quite" };
    return { cls:"", ico:"", tag:"" };
  }
  function optHTML(o, q){
    var s = stateOf(o, q);
    var off = !!s.cls || st[q].done;
    var sr = s.cls === "ok" ? "Right. You picked this one." : s.cls === "no" ? "Not quite. You picked this one." : "";
    return '<button class="opt' + (s.cls ? " " + s.cls : "") + '" type="button" data-o="' + o.id + '"'
      + (off ? ' disabled aria-disabled="true"' : "") + ">"
      + '<span class="oi">' + icon("chat") + "</span>"
      + '<span class="ot"><span class="ol">' + esc(o.label) + '</span><span class="on">“' + esc(o.text) + "”</span>"
      +   '<span class="od">' + esc(o.def) + "</span></span>"
      + '<span class="mk"><span class="g" aria-hidden="true">' + (s.ico ? icon(s.ico) : "") + "</span>"
      +   (s.tag ? '<span class="lb" aria-hidden="true">' + s.tag + "</span>" : "") + "</span>"
      + (sr ? '<span class="sr">' + sr + "</span>" : "")
      + "</button>";
  }
  function paintPanel(animate){
    var p = el.board.querySelector("#panel");
    if(!p) return;
    var s = S[i], a = st[s.q], qd = Q[s.q];
    p.classList.remove("tight");
    if(!a.out.length && !a.done){
      p.className = "panel empty";
      p.innerHTML = qd.lead.map(function(t){ return '<p class="pe">' + t + "</p>"; }).join("")
        + '<p class="pe">If your pick is not quite right, you can try the other one.</p>';
      return;
    }
    var good = a.done;
    var o = good ? opt(ANSWER) : opt(a.out[a.out.length-1]);
    var r = qd.reply[o.id].slice();
    p.className = "panel " + (good ? "ok" : "no");
    p.innerHTML = '<span class="fh">' + icon(good ? "okc" : "noc") + (good ? "Right" : "Not quite") + "</span>"
      + '<span class="pt">You picked ' + esc(o.label) + ".</span>"
      + r.map(function(t){ return '<p class="rp">' + esc(t) + "</p>"; }).join("")
      + (good ? "" : '<p class="nx">' + esc(AGAIN) + "</p>");
    if(!phone() && p.scrollHeight > p.clientHeight + 1) p.classList.add("tight");
    if(animate && !reduce){ p.classList.remove("in"); void p.offsetWidth; p.classList.add("in"); }
  }
  function choose(id){
    document.documentElement.classList.add("fresh");
    var s = S[i];
    if(s.kind !== "pick") return;
    var a = st[s.q];
    if(!opt(id) || a.done || a.out.indexOf(id) >= 0) return;
    if(id === ANSWER) a.done = true;
    else a.out.push(id);
    save(st);
    renderPick();
    paintPanel(true);
    header();
    var p = el.board.querySelector("#panel");
    if(p) say(Array.prototype.map.call(p.querySelectorAll(".fh,.pt,p"), function(n){
      return n.textContent.replace(/\s*$/, "").replace(/([^.])$/, "$1.");
    }).join(" "));
    var ph = phone();
    var fo = ph ? { preventScroll:true } : undefined;
    if(a.done) el.next.focus(fo);
    else if(p) p.focus(fo);
    if(ph && p) p.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"});
  }

  /* The last slide: both answers, the student's first picks, and the reveal. */
  function renderClose(){
    var f1 = firstPick("q1"), f2 = firstPick("q2"), line;
    if(!st.q1.done || !st.q2.done){
      line = icon("info") + "<span>You have not answered both questions yet. You can go back and pick before you read this.</span>";
    } else if(f1 === ANSWER && f2 === ANSWER){
      line = icon("check") + "<span>You picked <b>Answer B</b> both times. That is the right pick for both questions.</span>";
    } else {
      line = icon("info") + "<span>Your first picks are marked below. <b>Answer B</b> is the right pick for both questions.</span>";
    }
    function tags(id){
      var t = [];
      if(f2 === id) t.push('<span class="tag">' + icon("user") + "Your pick as safer to send</span>");
      if(f1 === id) t.push('<span class="tag">' + icon("user") + "Your pick to receive</span>");
      return t.length ? '<span class="tags">' + t.join("") + "</span>" : "";
    }
    function card(o, extra){
      return '<div class="card"><div class="ch"><span class="bi">' + icon("chat") + '</span><span class="cl">' + esc(o.label) + "</span>"
        + tags(o.id) + "</div>"
        + '<p class="cq">“' + esc(o.text) + "”</p>"
        + (extra || "") + "</div>";
    }
    el.board.innerHTML = '<div class="closewrap">'
      + '<p class="yours">' + line + "</p>"
      + '<div class="cards">'
      +   card(opt("a"), '<div class="find">' + icon("mail")
      +     "<p><b>What Meridian would find if it asked for proof:</b> two emails saying the rules were looked at, on 14 March 2024 and 22 August 2024. That is not a review every three months.</p></div>")
      +   card(opt("b"), "")
      + "</div>"
      + '<div class="statement"><p>Answer A is the one that ends the contract. Meridian can check it, and it won\'t stand.</p>'
      +   "<p>Answer B can't be caught out, because it has already said what's missing.</p>"
      +   '<p class="sm">Ends the contract means Meridian could decide not to renew its contract with Cumberland. Won\'t stand means the proof Cumberland has does not back it up.</p></div>'
      + "</div>";
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(); if(phone()) window.scrollTo(0,0); el.frame.focus({preventScroll:true});
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){
    if(i === S.length-1){
      st = fresh(); save(st); i = 0; render();
      if(phone()) window.scrollTo(0,0);
      el.frame.focus({preventScroll:true});
      say("Started over. Question 1 of " + NQ + ".");
      return;
    }
    go(1);
  });

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled && i < S.length-1) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });
  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }

  /* A cursor resting where new content lands must not tint an option. */
  var lastPt = null;
  document.addEventListener("pointermove", function(e){
    var pt = e.clientX + "," + e.clientY;
    if(lastPt !== null && pt !== lastPt) document.documentElement.classList.remove("fresh");
    lastPt = pt;
  }, true);

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled && i < S.length-1) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    state:function(){ return { i:i, q1:JSON.parse(JSON.stringify(st.q1)), q2:JSON.parse(JSON.stringify(st.q2)) }; }
  };
})();
</script>
</body>
</html>
