/* The SME's lesson look (chaitanyabaweja/pfizer-lesson-templates, shared/styles.css), restyled to the
   Pfizer x Extern Core design system, Light format. Every colour, font, radius and shadow comes from
   output/programs/pfizer-3-0/design-system/tokens.json. His selectors, layout and spacing are kept.
   Changes beyond colour and type: the page is a fixed 760 px wide stage (height --stage-h) that
   stage.js scales to fit its iframe, so his width and height media queries are gone (the stage never
   changes size), and the textarea no longer resizes. The design system has no code font, so code uses
   the same system monospace stack as our Try engine. */
:root {
  /* design-system tokens (Light format) */
  --pfizer-blue: #0033a0;
  --blue-50: #e6ecf7;
  --blue-200: #b9c8e8;
  --extern-black: #000000;
  --extern-white: #ffffff;
  --green-600: #07a657;
  --gray-50: #f2f2f2;
  --gray-200: #e4e4e4;
  --gray-600: #666666;
  --gray-800: #333333;
  --surface: var(--extern-white);
  --surface-card: var(--blue-50);
  --surface-icon: var(--extern-white);
  --ink: var(--extern-black);
  --ink-muted: var(--gray-800);
  --card-title: var(--extern-black);
  --card-text: var(--gray-800);
  --step-label: var(--pfizer-blue);
  --action: var(--extern-black);
  --on-action: var(--extern-white);
  --line: var(--gray-200);
  --focus-ring: var(--pfizer-blue);
  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 14px;
  --radius-full: 9999px;
  --serif: "DM Serif Display", Georgia, serif;
  --sans: Inter, system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;
  --stage-h: 800px;
  /* The SME's code colours, kept exactly as he has them (Smita, 10 Nov 2026: keep his black
     Python code box). They are used only for code: code blocks, the code box and the output. */
  --code-bg: #1c1f26;
  --code-fg: #e6e8ee;
  --out-bg: #f2f4f8;
  --out-line: #dce1ea;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; overflow: hidden; }
body {
  height: 100%;
  overflow: hidden;
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 22px;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--pfizer-blue); }
a:hover { color: var(--ink); }
code {
  font-family: var(--mono);
  background: var(--surface-card);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 0.9em;
  overflow-wrap: anywhere;
}
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
[hidden] { display: none !important; }

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

/* ---- page frame: the fixed stage ---- */
/* stage.js sets one uniform scale and centres the stage in the frame. Header, tabs and the
   Back/Next bar never move; the step panel zooms its content down a little before it would scroll. */
.lesson {
  position: absolute;
  left: 0;
  top: 0;
  width: 760px;
  height: var(--stage-h);
  transform-origin: 0 0;
  padding: 16px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--surface);
}
.lesson-head, .tabs, .nav { flex-shrink: 0; }
.lesson-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.eyebrow {
  font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--step-label);
}
h1 { margin: 4px 0 0; font-family: var(--serif); font-size: 32px; font-weight: 400; line-height: 38px; color: var(--ink); }
.step-count { font-size: 13px; line-height: 16px; font-weight: 500; color: var(--ink-muted); white-space: nowrap; padding-bottom: 4px; }

/* ---- tabs ---- */
.tabs { display: grid; grid-template-columns: repeat(var(--tab-count, 5), minmax(0, 1fr)); gap: 8px; }
.tab {
  min-width: 0; min-height: 44px; padding: 6px 10px;
  border-radius: var(--radius-xs); border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink);
  font: 600 13px/1.15 var(--sans); text-align: left; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
}
.tab:hover { border-color: var(--ink); }
.tab-label { min-width: 0; overflow-wrap: break-word; }
.tab[aria-selected="true"] { background: var(--action); color: var(--on-action); border-color: var(--action); }
.tab-dot {
  width: 22px; height: 22px; border-radius: var(--radius-full); flex-shrink: 0;
  background: var(--surface-card); color: var(--step-label);
  font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;
}
.tab.done .tab-dot { background: var(--pfizer-blue); color: var(--extern-white); }
.tab[aria-selected="true"] .tab-dot { background: var(--extern-white); color: var(--ink); }

/* ---- panel card ---- */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 20px 24px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  overscroll-behavior: contain;
}
.panel.overflow { overflow-y: auto; } /* last resort only: stage.js zooms the content down first */
.stack { display: flex; flex-direction: column; gap: 16px; }
h2 { margin: 0; font-family: var(--serif); font-size: 24px; font-weight: 400; line-height: 28px; color: var(--ink); }
p { margin: 0; }
.lead { font-size: 16px; line-height: 24px; color: var(--ink-muted); max-width: 680px; }
.small-label {
  font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-muted);
}

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.mini-card { background: var(--surface-card); border-radius: var(--radius-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.mini-card b { font-size: 15px; line-height: 20px; font-weight: 600; color: var(--card-title); }
.mini-card span { font-size: 14px; color: var(--card-text); line-height: 21px; }
.mini-card code { background: var(--surface-icon); padding: 0 4px; }

pre {
  margin: 0; font-family: var(--mono); font-size: 13.5px; line-height: 1.6;
  white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--code-bg); color: var(--code-fg);
  border-radius: 10px; padding: 14px 18px;
  font-variant-ligatures: none;
}
pre.out { background: var(--out-bg); border: 1px solid var(--out-line); color: var(--ink); padding: 12px 18px; max-height: 230px; overflow-y: auto; }
.out-err { font-weight: 600; }

/* ---- example boxes ---- */
.boxes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.box { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.box-idx { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--step-label); }
.box-val {
  border: 1.5px solid var(--blue-200); background: var(--surface); border-radius: var(--radius-xs);
  padding: 14px 12px; font-size: 15px; font-weight: 600; text-align: center; overflow-wrap: anywhere;
}
.box.hl .box-val { border: 2px solid var(--pfizer-blue); background: var(--surface-card); }
/* Many boxes (one per character of a string): five to a row, so they take two rows, not four. */
.boxes:has(> .box:nth-child(7)) { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px 10px; }
.boxes:has(> .box:nth-child(7)) .box { gap: 4px; }
.boxes:has(> .box:nth-child(7)) .box-val { padding: 8px 10px; font-family: var(--mono); font-size: 16px; }
.caption { font-size: 15px; line-height: 23px; color: var(--ink-muted); }

/* ---- demo ---- */
.demo { display: flex; gap: 18px; }
.demo-list { display: flex; flex-direction: column; gap: 8px; width: 190px; flex-shrink: 0; }
.demo-main { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.demo-pick {
  min-height: 44px; text-align: left; padding: 9px 14px; border-radius: var(--radius-xs);
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: 500 14px/1.3 var(--sans); cursor: pointer;
}
.demo-pick:hover { border-color: var(--ink); }
.demo-pick[aria-pressed="true"] { border-color: var(--pfizer-blue); background: var(--surface-card); font-weight: 600; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.note { font-size: 13.5px; line-height: 20px; color: var(--ink-muted); flex: 1 1 200px; min-width: 0; }

/* ---- Pfizer x Extern: play first, name later (Smita, 10 Nov 2026; M1-S1-REWORK.md) ----
   Tab 1's play box and every demo are editable code boxes in the SME's black code style (the same
   textarea look as the Try editor), sized to their code, with Run and Reset. What Tab 1 says about
   the code, and each demo's note, fade in after the first Run. */
textarea.code-edit { min-height: 0; font-size: 13.5px; line-height: 1.55; padding: 12px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
textarea.code-edit[readonly] { cursor: default; }
.out-wrap, .run-status { display: flex; flex-direction: column; gap: 6px; }
.run-status { gap: 10px; }
.run-status:not(:has(> :not([hidden]))) { display: none; }
.play-prompt, .demo-prompt { color: var(--ink); font-weight: 500; }
.demo-prompt { font-size: 15px; line-height: 22px; }
.play-after { color: var(--ink); }
.demo-note { font-size: 14px; line-height: 21px; color: var(--ink-muted); }
/* Lesson text with line breaks: one line per row (Try it parts, one line per type in a demo note). */
.text-line { display: block; }
.text-line + .text-line { margin-top: 5px; }
.demo-note .text-line + .text-line { margin-top: 3px; }
/* Tab 1: the plain line shown when a run stops with an error (same look as "Not quite yet"). */
.play-error { background: var(--gray-50); border-left: 3px solid var(--gray-600); border-radius: var(--radius-xs); padding: 10px 14px; font-size: 15px; line-height: 23px; color: var(--ink); }
/* Try it: Python's own error line, small, after the plain-words hint. */
.feedback .fb-detail { font-size: 12.5px; line-height: 18px; color: var(--ink-muted); }
.feedback .fb-detail code { font-size: 12px; }
.reveal-in { animation: reveal-in 450ms ease-out both; }
@keyframes reveal-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---- Pfizer x Extern: Tab 1 as slides (Smita, 10 Nov 2026; M1-S1-SLIDES.md) ----
   One slide at a time. The slide's own Back / Slide N of M / Next bar sits at the bottom of the
   step panel on every slide (the panel and the Tab 1 section become flex columns that fill the
   panel), so Next never moves while the student clicks through. */
.panel:has(> section:not([hidden]) > .slides) { display: flex; flex-direction: column; }
.panel > section:not([hidden]):has(> .slides) { flex: 1 0 auto; display: flex; flex-direction: column; }
.slides { flex: 1 0 auto; display: flex; flex-direction: column; gap: 14px; }
.slides-track { flex: 1 0 auto; }
.slide-body { gap: 14px; }
.slide-nav {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 12px; background: var(--surface-card); border-radius: var(--radius-sm);
}
.slide-btn { min-height: 40px; padding: 0 18px; font-size: 14px; }
.slide-btn.btn-ghost { background: var(--surface); }
.slide-progress { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.slide-dots { display: flex; gap: 6px; }
.slide-dot { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--blue-200); }
.slide-dot.on { background: var(--pfizer-blue); }
.slide-count { font-size: 13px; line-height: 16px; font-weight: 600; color: var(--step-label); white-space: nowrap; }
.slide-fig { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.slide-fig .caption { text-align: center; font-size: 14px; line-height: 21px; }
.slide-img { display: block; max-width: 100%; max-height: 300px; width: auto; height: auto; border-radius: var(--radius-md); }
/* Two pictures on one slide, or a picture with a practice box: smaller, so the slide fits. */
.slide-body:has(.slide-fig ~ .slide-fig, .slide-row, .practice) > .slide-fig .slide-img { max-height: 210px; }
/* size "large" (QA, 10 Nov 2026): a slide picture that must be read closely (a diagram, a GIF with
   words in it) fills the panel width, up to the height the slide has room for. */
.slide-fig.large .slide-img { max-height: var(--slide-img-large-h, 470px); }
/* An {image} paragraph item beside the text that follows it. */
.slide-row { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 18px; align-items: center; }
.slide-row .slide-img { max-height: 220px; }
.slide-row-text { gap: 10px; }
.slide-img-missing {
  width: 100%; max-width: 520px; min-height: 150px; padding: 16px 20px;
  border: 2px dashed var(--blue-200); border-radius: var(--radius-md); background: var(--surface-card);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  text-align: center; font-size: 14px; line-height: 21px; color: var(--ink-muted);
}
.slide-img-missing .small-label { color: var(--step-label); }
.practice {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 16px; row-gap: 8px;
  grid-template-areas: "label label" "prompt prompt" "main side"; align-items: start;
}
.practice-label { grid-area: label; }
.practice-prompt { grid-area: prompt; font-size: 15px; line-height: 22px; color: var(--ink); font-weight: 500; }
.practice-main { grid-area: main; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.practice-side { grid-area: side; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.practice-main .btn-link { align-self: flex-start; }
.practice-side pre.out { max-height: 150px; }
.practice-side .answer { max-height: 150px; }
.practice-wait {
  border: 1.5px dashed var(--line); border-radius: var(--radius-xs); padding: 12px 14px;
  font-size: 14px; line-height: 21px; color: var(--ink-muted);
}
.practice-side:has(.out-wrap:not([hidden])) .practice-wait { display: none; }
.slide-after { color: var(--ink); }

/* ---- buttons: black primary, outlined secondary, radius-xs (Light format) ---- */
.btn {
  min-height: 44px; min-width: 44px; padding: 0 20px; border-radius: var(--radius-xs);
  border: 1.5px solid transparent; font: 600 15px/19px var(--sans); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
}
.btn-primary { background: var(--action); color: var(--on-action); }
.btn-primary:hover { background: var(--gray-800); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); padding: 0 18px; }
.btn-ghost:hover:not([disabled]), .btn-link:hover { background: var(--gray-50); }
.btn-link { background: transparent; color: var(--pfizer-blue); border-color: var(--pfizer-blue); padding: 0 18px; }
.btn-dark { background: var(--action); color: var(--on-action); padding: 0 22px; }
.btn[disabled] { opacity: 0.35; cursor: not-allowed; }

/* ---- try it ---- */
.try-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
textarea {
  display: block; width: 100%; min-height: 128px; resize: none;
  background: var(--code-bg); color: var(--code-fg); caret-color: var(--code-fg);
  border: 2px solid transparent; border-radius: 10px; padding: 12px 16px;
  font-family: var(--mono); font-size: 13px; line-height: 1.5; tab-size: 4;
  font-variant-ligatures: none;
}
textarea:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
.feedback { border-radius: var(--radius-xs); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.feedback.ok { background: var(--surface); border: 1.5px solid var(--green-600); }
.feedback.no { background: var(--gray-50); border-left: 3px solid var(--gray-600); }
.feedback .fb-title { font-weight: 600; font-size: 14px; color: var(--ink); }
.feedback.ok .fb-title::before {
  content: ""; display: inline-block; width: 9px; height: 5px; margin: 0 9px 3px 2px;
  border-left: 2.5px solid var(--green-600); border-bottom: 2.5px solid var(--green-600); transform: rotate(-45deg);
}
.feedback .fb-msg { font-size: 14px; line-height: 21px; color: var(--ink-muted); }
.feedback pre { background: transparent; border: 0; color: var(--ink); padding: 0; font-size: 13px; }
.answer-box { display: flex; flex-direction: column; gap: 6px; }

/* Long starters (more than 8 lines, class set by concept.js): the task, the buttons and the feedback
   on the left, the code box and the answer on the right, so the Try fits the stage.
   Pfizer x Extern (QA, 12 Nov 2026): the answer now shows in full (no max-height). To fit a 17-line
   answer under an 18-line code box at the stage's 0.8 zoom, the heading sits over the left column
   only, the buttons moved from under the code box to the left column, and code lines are 1.4 high. */
.stack.try-wide {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.75fr); column-gap: 18px; row-gap: 10px;
  grid-template-areas: "head label" "prompt code" "btns answer" "fb answer";
  grid-template-rows: auto auto auto 1fr; align-items: start; /* 1fr: the answer's extra height goes under the feedback, not between it and the buttons */
}
.try-wide > .try-head { grid-area: head; }
.try-wide > .lead { grid-area: prompt; font-size: 14px !important; line-height: 21px; }
.try-wide > label { grid-area: label; align-self: end; }
.try-wide > textarea { grid-area: code; font-size: 12.5px; line-height: 1.4; padding: 10px 12px; white-space: pre; overflow-wrap: normal; overflow-x: auto; } /* one code line = one row */
.try-wide > .row { grid-area: btns; gap: 8px !important; }
.try-wide > .row .btn { padding: 0 14px; font-size: 14px; }
.try-wide > #feedback { grid-area: fb; }
.try-wide > #answer { grid-area: answer; }
.try-wide .answer { font-size: 12.5px; line-height: 1.4; padding: 10px 12px; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
.try-wide .feedback pre { max-height: 150px; overflow-y: auto; }
.answer-box:focus { outline: none; }
.answer-box:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
.answer { background: var(--out-bg); color: var(--ink); border: 1px solid var(--out-line); font-size: 13px; line-height: 1.5; padding: 10px 16px; max-height: 260px; overflow-y: auto; } /* a code panel: may scroll */
/* Pfizer x Extern (QA, 12 Nov 2026): the Try answer shows in full, with no scrolling inside it; the
   stage zooms the panel down to fit it instead (stage.js). */
#answer > .answer { max-height: none; overflow-y: visible; }

/* ---- learn more ---- */
.learn { display: flex; gap: 18px; }
.video { width: 380px; flex-shrink: 0; }
.video-frame, .video-soon {
  display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: var(--radius-md); background: var(--surface-card);
}
.video-soon {
  color: var(--card-title); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px; font-size: 14px; font-weight: 600; text-align: center; padding: 12px;
}
.play { width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--action); display: flex; align-items: center; justify-content: center; }
.learn-side { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; min-width: 0; }
.learn-side a { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.learn-side .where { font-size: 14px; line-height: 21px; color: var(--ink-muted); }

/* ---- pick-one buttons (Templates B and C; kept so the shell stays shared) ---- */
.choice {
  min-height: 44px; padding: 8px 18px; border-radius: var(--radius-xs);
  border: 1.5px solid var(--blue-200); background: var(--surface); color: var(--ink);
  font: 600 14px var(--sans); text-align: left; cursor: pointer; overflow-wrap: anywhere;
}
.choice.mono { font: 400 13.5px/1.5 var(--mono); white-space: pre-wrap; } /* keep leading spaces: indentation is the answer */
.choice.ok { border-color: var(--green-600); border-width: 2px; }
.choice.no { border-color: var(--gray-600); background: var(--gray-50); }
.choices-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.choices-col { display: flex; flex-direction: column; gap: 8px; }
.choices-row { display: flex; flex-wrap: wrap; gap: 10px; }
.choices-row .choice { min-width: 96px; text-align: center; }
.code-text { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }

/* ---- footer nav ---- */
.nav { display: flex; justify-content: space-between; gap: 12px; }

.error-box {
  background: var(--gray-50); color: var(--ink-muted); border-left: 3px solid var(--gray-600);
  border-radius: var(--radius-xs); padding: 16px 18px; font-size: 15px; line-height: 22px;
}
.error-box b { color: var(--ink); }

.only-narrow { display: none; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } .reveal-in { animation: none; } }

:root{--stage-h:860px}

<body>
<div class="lesson" id="lesson" aria-live="off">
  <header class="lesson-head">
    <div>
      <span class="eyebrow" id="eyebrow">Concept lesson</span>
      <h1 id="title">Loading…</h1>
    </div>
    <span class="step-count" id="step-count"></span>
  </header>
  <div class="tabs" role="tablist" aria-label="Lesson steps" id="tabs"></div>
  <main class="panel" id="panels" tabindex="0" aria-label="Lesson content">
    <noscript>This lesson needs JavaScript. Please turn it on and reload.</noscript>
  </main>
  <nav class="nav" aria-label="Lesson navigation">
    <button type="button" class="btn btn-ghost" id="back">Back</button>
    <button type="button" class="btn btn-dark" id="next">Next</button>
  </nav>
</div>
<!-- The lesson (the SME's JSON schema). build_lesson.py writes it here. -->
<script type="application/json" id="lesson-data">
{
 "id": "strings",
 "template": "concept",
 "title": "Strings",
 "kicker": "Python for Supplier Files · Concept lesson",
 "what": {
  "slides": [
   {
    "heading": "Join Two Pieces of Text",
    "paragraphs": [

     "checks": [
      {

      },
      {
       "error": "SyntaxError",

      },
      {

      },
      {
       "error": "SyntaxError",
       "message": "^unterminated string literal",

      },
      {
       "error": "SyntaxError",
       "message": "^Missing parentheses in call to 'print'",
       "hint": "The brackets are missing. print needs ( ) around what it shows."
      },
      {

       "message": "was never closed",

      },
      {
       "error": "SyntaxError",
       "message": "^unmatched '\\)'",
       "hint": "There's one ) too many. Every ) needs a ( to match it, so delete the extra one."
      },
      {
       "error": "SyntaxError",
       "message": "^invalid character '[“”‘’]'",
       "hint": "Those are curly quote marks, and Python only reads straight ones. Delete them and type \" again in the code box."
      }
     ],
     "hint_default": "Something's not quite right yet. Check the quote marks around the text on each note and the + \" \" + between them, then press Run again.",
     "answer": "label = \"Date of Manufacture:\"\ndate = \"20240315\"\nprint(label + \" \" + date)",
     "done_msg": "That's the next line from page 3, exactly as it appears in the file. + joined the two notes, and \" \" put a space between them.",
     "wrong": [
      {
       "code": "label = \"Lot Number:\"\nlot = \"18356721\"\nprint(label + \" \" + lot)",
       "hint_contains": "still shows Lot Number"
      },
      {
       "code": "label = \"Lot Number:\"\nlot = \"20240315\"\nprint(label + \" \" + lot)",
       "hint_contains": "still shows Lot Number"
      },
      {
       "code": "label = \"Date of Manufacture:\"\nlot = \"18356721\"\nprint(label + \" \" + lot)",
       "hint_contains": "still shows the lot number"
      },
      {
       "code": "label = \"Date of Manufacture:\"\nlot = \"20240315\"\nprint(label + lot)",
       "hint_contains": "no space between them"
      },
      {
       "code": "label = \"Date of Manufacture:\"\nlot = \"20240315\"\nprint(label + \"\" + lot)",
       "hint_contains": "no space between them"
      },
      {

    async evalChecks(code, exprs, { timeoutMs = DEFAULT_TIMEOUT_MS } = {}) {
      return enqueue(code, exprs, timeoutMs);
    },
    close() {
      kill();
    },
  };
}

// Pfizer x Extern build: build_lesson.py inlines the worker (py-worker.js + py-core.js)
// in a <script type="text/plain" id="py-worker-src"> tag, so the page is one self-contained
// file. It starts from a Blob URL as a classic worker (it loads Pyodide with importScripts),
// because a module worker from a Blob URL fails on a page opened from file://.
// Without that tag (local preview), py-worker.js is used as before.
let workerBlobUrl = null;
function newWorker() {
  const src = typeof document !== "undefined" ? document.getElementById("py-worker-src") : null;
  if (!src) return new Worker(new URL("./py-worker.js", import.meta.url), { type: "module" });
  workerBlobUrl ??= URL.createObjectURL(new Blob([src.textContent], { type: "text/javascript" }));
  return new Worker(workerBlobUrl);
}

function browserWorker() {
  const raw = newWorker();
  return {
    post: (m) => raw.postMessage(m),
    onMessage: (cb) => {
      raw.onmessage = (e) => cb(e.data);
    },
    onFail: (cb) => {
      raw.onerror = (e) => cb(e);
      raw.onmessageerror = (e) => cb(e);
    },
    terminate: () => raw.terminate(),
  };
}

let browserRunner = null;
function shared() {
  return (browserRunner ??= createRunner(browserWorker));
}

// Browser entry points (lazy: no worker is created until first use).
const run = (code, opts) => shared().run(code, opts);
const evalChecks = (code, exprs, opts) => shared().evalChecks(code, exprs, opts);

// Node entry point for tests: same runner, worker_threads instead of a Web Worker.
async function createNodeRunner() {
  const { Worker } = await import("node:worker_threads");
  const { fileURLToPath } = await import("node:url");
  const file = fileURLToPath(new URL("./node-worker.js", import.meta.url));
  return createRunner(() => {
    const raw = new Worker(file);
    return {
      post: (m) => raw.postMessage(m),
      onMessage: (cb) => {
        raw.on("message", cb);
      },
      onFail: (cb) => {
        raw.on("error", cb);
        raw.on("exit", (code) => {
          if (code !== 0) cb(new Error(`worker exited with code ${code}`));
        });
      },
      terminate: () => raw.terminate(),
    };
  });
}

return { createRunner, run, evalChecks, createNodeRunner };
})();

// ---- shell.js ----
const __m_shell = (() => {
// The shell every lesson template shares: DOM helpers, the fit-to-box page
// (header, tabs, scrolling step panel, Back/Next), the Learn more tab, the
// "Python couldn't load" handling and the "lesson unavailable" page.
// concept.js, read-code.js and fix-error.js only supply their own panels.
//
// All lesson text goes in via textContent (never innerHTML); `inline()` turns
// `code` and **bold** in lesson text into real elements.
const { load, validate, LessonError } = __m_lesson_loader;
const { run } = __m_runner;
const { TIMEOUT_HINT } = __m_check;
const SVG_TAGS = new Set(["svg", "polygon"]);

function h(tag, attrs = {}, ...kids) {
  const el = SVG_TAGS.has(tag) ? document.createElementNS("http://www.w3.org/2000/svg", tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

// "Use `x` and **bold**" -> text + <code> + <strong> nodes.
function inline(text) {
  return String(text)
    .split(/(`[^`]+`|\*\*[^*]+\*\*)/)
    .filter((part) => part !== "")
    .map((part) => {
      if (part.startsWith("`")) return h("code", {}, part.slice(1, -1));
      if (part.startsWith("**")) return h("strong", {}, part.slice(2, -2));
      return part;
    });
}

// ---------- running Python (Review Focus 4: Python could not load) ----------

function loadFailureNode() {
  return h(
    "span",
    {},
    "Python couldn't load here. Open this lesson in a new tab: ",
    h("a", { href: location.href, target: "_blank", rel: "noopener" }, "Open lesson in a new tab")
  );
}

// The runner should never reject, but if it does (e.g. a browser quirk) the
// student still gets the "couldn't load" message instead of a stuck button.
const startFailed = (e) => ({
  ok: false,
  stdout: "",
  error: { type: "LoadError", message: String((e && e.message) || e), line: null },
  timedOut: false,
});
async function safeRun(code) {
  try {
    return await run(code);
  } catch (e) {
    return startFailed(e);
  }
}

function runErrorText(r) {
  if (r.timedOut) return TIMEOUT_HINT;
  if (r.error) return `${r.error.type}${r.error.message ? ": " + r.error.message : ""}`;
  return "";
}

// ---------- scrolling and focus inside the panel ----------

// Scroll the step panel (only) so `el` is visible. Deliberately not
// el.scrollIntoView(): Chrome also scrolls ancestor frames, which would move the
// Notion page around the embed.
function revealInPanel(el) {
  const panel = document.getElementById("panels");
  const p = panel.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  if (r.height > p.height || r.top < p.top) panel.scrollTop += r.top - p.top - 8;
  else if (r.bottom > p.bottom) panel.scrollTop += r.bottom - p.bottom + 8;
}

// Newly revealed content (e.g. the answer after its own button hid itself):
// move keyboard focus onto it so focus isn't lost, then scroll it into view.
function focusRevealed(el) {
  el.tabIndex = -1;
  el.focus({ preventScroll: true });
  revealInPanel(el);
}

// ---------- shared panel pieces ----------

// Green/orange message box used for every right/wrong answer.
function feedbackBox(ok, title, ...body) {
  return h("div", { class: "feedback " + (ok ? "ok" : "no") }, h("span", { class: "fb-title" }, title), ...body);
}

// A live region that holds one feedback message; `show()` swaps it in and keeps it visible.
function feedbackSlot() {
  const slot = h("div", { role: "status", "aria-live": "polite" });
  return {
    el: slot,
    show(ok, title, ...body) {
      slot.replaceChildren(feedbackBox(ok, title, ...body));
      revealInPanel(slot);
    },
    clear: () => slot.replaceChildren(),
  };
}

// A group of pick-one buttons. `mark(i, ok)` shows the picked one as right/wrong.
function choiceGroup(labels, { className, label, onPick, mono = false }) {
  const buttons = labels.map((text, i) =>
    h("button", { type: "button", class: "choice" + (mono ? " mono" : ""), "aria-pressed": "false", onclick: () => onPick(i) }, text)
  );
  return {
    el: h("div", { class: className, role: "group", "aria-label": label }, buttons),
    mark(i, ok) {
      buttons.forEach((b, j) => {
        b.setAttribute("aria-pressed", String(j === i));
        b.classList.toggle("ok", j === i && ok);
        b.classList.toggle("no", j === i && !ok);
      });
    },
  };
}

// The Learn more tab. `whereLabel` is the small heading above `learn.used_later`.
function learnPanel(l, whereLabel = "Where you'll use this") {
  const { video: vid, links, used_later: where } = l.learn;
  const id = vid.youtube_id;
  const video = id
    ? h("iframe", {

        loading: "lazy",
        allow: "accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen",
        allowfullscreen: true,
        referrerpolicy: "strict-origin-when-cross-origin",
      })
    : h(
        "div",
        { class: "video-soon", role: "img", "aria-label": "Video coming soon" },
        h(
          "div",
          { class: "play" },
          h("svg", { width: "22", height: "22", viewBox: "0 0 24 24", fill: "none", stroke: "#fff", "stroke-width": "2.5", "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" }, h("polygon", { points: "7 4 20 12 7 20 7 4" }))
        ),
        h("span", {}, "Video coming soon")
      );
  const shown = links.filter((x) => x.url);
  return h(
    "div",
    { class: "stack", style: "gap:16px" },
    h("h2", {}, "Learn more (optional)"),
    h(
      "div",
      { class: "learn" },
      h("div", { class: "video" }, video),
      h(
        "div",
        { class: "learn-side" },
        shown.length ? h("span", { class: "small-label" }, "Read or watch") : null,
        shown.map((x) => h("a", { href: x.url, target: "_blank", rel: "noopener noreferrer" }, x.label)),

// ---------- page ----------

// Fills the header, builds one panel per tab and wires tabs + Back/Next.
// opts: { labels: [tab names], builders: [l => node], kicker?: string }
function mountShell(l, { labels, builders, kicker }) {
  document.title = l.title;
  document.getElementById("eyebrow").textContent = kicker || l.kicker;
  document.getElementById("title").textContent = l.title;

  const panelsEl = document.getElementById("panels");
  const tabsEl = document.getElementById("tabs");
  const back = document.getElementById("back");
  const next = document.getElementById("next");
  const nav = back.closest(".nav");
  const stepCount = document.getElementById("step-count");
  let step = 0;

  const panels = builders.map((build, i) =>
    h("section", { role: "tabpanel", id: `panel-${i}`, "aria-labelledby": `tab-${i}`, hidden: true }, build(l))
  );
  panelsEl.replaceChildren(...panels);

  tabsEl.style.setProperty("--tab-count", String(labels.length));
  const tabs = labels.map((label, i) =>
    h(
      "button",
      { type: "button", role: "tab", class: "tab", id: `tab-${i}`, "aria-controls": `panel-${i}`, onclick: () => go(i) },
      h("span", { class: "tab-dot", "aria-hidden": "true" }, String(i + 1)),
      h("span", { class: "tab-label" }, label)
    )
  );
  tabsEl.replaceChildren(...tabs);
  tabsEl.addEventListener("keydown", (e) => {
    const keys = { ArrowRight: 1, ArrowLeft: -1 };
    if (e.key in keys) {
      e.preventDefault();
      go((step + keys[e.key] + tabs.length) % tabs.length, true);
    } else if (e.key === "Home" || e.key === "End") {
      e.preventDefault();
      go(e.key === "Home" ? 0 : tabs.length - 1, true);
    }
  });

  function go(i, focusTab = false) {
    step = Math.max(0, Math.min(tabs.length - 1, i));
    tabs.forEach((t, j) => {
      t.setAttribute("aria-selected", String(j === step));
      t.tabIndex = j === step ? 0 : -1;
      t.classList.toggle("done", j < step);
    });
    panels.forEach((p, j) => (p.hidden = j !== step));
    stepCount.replaceChildren(`Step ${step + 1} of ${tabs.length}`, h("span", { class: "only-narrow" }, ` · ${labels[step]}`));
    const hadFocus = document.activeElement;
    back.disabled = step === 0;
    next.disabled = step === tabs.length - 1;
    // Pfizer x Extern (QA, 10 Nov 2026): a tab with its own Back / Next (Tab 1 as slides) hides the
    // page's Back / Next, so only one Back / Next shows and Next can't skip the slides.
    nav.hidden = !!panels[step].querySelector(".slide-nav");
    // A button that just disabled or hid itself would drop keyboard focus: hand it to the active tab.
    if (focusTab || ((hadFocus === back || hadFocus === next) && (hadFocus.disabled || nav.hidden))) tabs[step].focus();
  }
  back.addEventListener("click", () => go(step - 1));
  next.addEventListener("click", () => go(step + 1));
  go(0);
}

function showProblem(err) {
  document.getElementById("title").textContent = "Lesson unavailable";
  document.getElementById("tabs").hidden = true;
  document.querySelector(".nav").hidden = true;
  document.getElementById("panels").replaceChildren(h("div", { class: "error-box", role: "alert" }, h("b", {}, "This lesson can't be shown. "), err.message));
}

// Entry point for every template page: `setup(lesson)` returns the mountShell options.
// Pfizer x Extern build: build_lesson.py inlines the lesson JSON in a
// <script type="application/json" id="lesson-data"> tag; it is checked with the same validate().
// Without that tag (local preview), the lesson is fetched from ?lesson=<id> as before.
function loadEmbedded(template) {
  const tag = document.getElementById("lesson-data");
  if (!tag) return load({ expectTemplate: template });
  return Promise.resolve().then(() => {
    let lesson;
    try {
      lesson = JSON.parse(tag.textContent);
    } catch {
      throw new LessonError("The lesson built into this page is not valid JSON.");
    }
    validate(lesson);
    if (lesson.template !== template) throw new LessonError(`This lesson uses the ${lesson.template} template, not ${template}.`);
    return lesson;
  });
}

function boot(template, setup) {
  loadEmbedded(template).then((l) => {
    mountShell(l, setup(l));
    document.dispatchEvent(new CustomEvent("lesson-ready"));
  }, showProblem);
}

return { h, inline, loadFailureNode, startFailed, safeRun, runErrorText, revealInPanel, focusRevealed, feedbackBox, feedbackSlot, choiceGroup, learnPanel, mountShell, showProblem, boot };
})();

// ---- concept.js ----
const __m_concept = (() => {
// Template A: concept lesson page. Reads ?lesson=<id>, renders 5 tabs:
// What is it? / Example / Demo / Try it / Learn more.
// All lesson text goes in via textContent (never innerHTML); `inline()` turns
// `code` and **bold** in lesson text into real elements.
const { evalChecks } = __m_runner;
const { judge, revealAllowed, isLoadFailure, friendlyError, judgePractice, practiceExprs } = __m_check;
const { h, inline, loadFailureNode, startFailed, safeRun, runErrorText, revealInPanel, focusRevealed, feedbackSlot, learnPanel, boot } = __m_shell;
const TAB_LABELS = ["What is it?", "Example", "Demo", "Try it", "Learn more (optional)"];

async function safeEval(code, exprs) {
  try {
    return await evalChecks(code, exprs);
  } catch (e) {
    return { run: startFailed(e), values: [] };
  }
}

// ---------- panels ----------

// Pfizer x Extern (Smita, 10 Nov 2026): lesson text with line breaks ("\n") shows one line per
// row, e.g. the Try it parts or one line per type in a demo note. Each line keeps inline markdown.
function lines(text) {
  return String(text)
    .split("\n")
    .map((line) => h("span", { class: "text-line" }, inline(line)));
}

// Pfizer x Extern (Smita, 10 Nov 2026: play first, name later; M1-S1-REWORK.md): an editable
// code box in the SME's black style with Run and Reset, used by Tab 1's `what.play` and by every
// demo. Errors show as in his demo: what printed first, then the bold error line.
function runIcon() {
  return h(
    "svg",
    { width: "14", height: "14", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.5", "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" },
    h("polygon", { points: "6 4 20 12 6 20 6 4" })
  );
}

function showOutput(outEl, r) {
  outEl.replaceChildren();
  if (isLoadFailure(r)) outEl.append(loadFailureNode());
  // Pfizer x Extern: a demo that stops with an error on purpose also keeps what it printed first.
  else if (r.timedOut || r.error) outEl.append(r.stdout ? r.stdout.trimEnd() + "\n" : "", h("span", { class: "out-err" }, runErrorText(r)));
  else outEl.append(r.stdout.trimEnd() || "(no output)");
}

// Pfizer x Extern (QA, 12 Nov 2026): a code box is as tall as its code really is, wrapped lines
// included, so no line is cut off or scrolls inside the box. `rows` starts at the line count and
// grows while the text is taller than the box (scrollHeight and clientHeight are in the same units,
// so the stage's zoom doesn't change the result). A box that is hidden keeps its line count and is
// sized when it shows (the ResizeObserver below). After a change, stage.js re-fits the panel.
function fitCodeBox(box) {
  const before = box.rows;
  let rows = Math.max(2, box.value.split("\n").length);
  if (box.getClientRects().length) {
    box.rows = rows;
    while (box.scrollHeight > box.clientHeight + 1 && rows < 200) box.rows = ++rows;
  } else if (box.rows !== rows) box.rows = rows;
  return box.rows !== before;
}
function sizeCodeBox(box) {
  if (fitCodeBox(box)) document.dispatchEvent(new CustomEvent("lesson-refit"));
}
// A box that becomes visible (its slide, tab or demo opens) or changes width is sized again. The
// work waits one frame, so changing the box's height never runs inside the observer's own callback.
const codeBoxObserver =
  typeof ResizeObserver === "function"
    ? new ResizeObserver((entries) => {
        const boxes = entries.map((e) => e.target);
        requestAnimationFrame(() => boxes.forEach(sizeCodeBox));
      })
    : null;

// codeRunner({id, label, onRun, onReset, exprs}) -> {box, buttons, status, setCode(code, editable), reset()}
// `onRun(r, code, values)` is called after each run whose output is shown, with the code that ran
// (Pfizer x Extern: with `exprs`, a list of Python expressions, each run also evaluates them after
// the code, as Try it does, and `values` holds their results);
// `onReset()` after Reset. setCode() starts a new "generation": a run still in flight for the old
// code is dropped instead of landing under the new code.
function codeRunner({ id, label, onRun, onReset, exprs = null }) {
  let original = "";
  let gen = 0;
  let busy = false;
  const box = h("textarea", { id, class: "code-edit", spellcheck: "false", autocomplete: "off", autocapitalize: "off", "aria-label": label });
  if (codeBoxObserver) codeBoxObserver.observe(box);
  const runBtn = h("button", { type: "button", class: "btn btn-primary" }, runIcon(), "Run");
  const resetBtn = h("button", { type: "button", class: "btn btn-ghost" }, "Reset");
  const outEl = h("pre", { class: "out" });
  const outWrap = h("div", { hidden: true, class: "out-wrap" }, h("span", { class: "small-label" }, "Output"), outEl);
  const status = h("div", { role: "status", "aria-live": "polite", class: "run-status" }, outWrap);

  function clearOut() {
    outEl.replaceChildren();
    outWrap.hidden = true;
  }
  function setCode(code, editable = true) {
    gen += 1;
    original = code;
    box.value = code;
    sizeCodeBox(box);
    box.readOnly = !editable;
    resetBtn.hidden = !editable;
    clearOut();
  }
  async function doRun() {
    if (busy) return;
    busy = true;
    const mine = gen;
    runBtn.disabled = true;
    const text = runBtn.lastChild;
    text.textContent = "Running…";
    const code = box.value;
    let r;
    let values = [];
    if (exprs) ({ run: r, values } = await safeEval(code, exprs));
    else r = await safeRun(code);
    text.textContent = "Run";
    runBtn.disabled = false;
    busy = false;
    if (mine !== gen) return; // the student switched demos while this ran
    showOutput(outEl, r);
    outWrap.hidden = false;
    if (onRun) onRun(r, code, values);
    revealInPanel(outWrap);
  }
  function reset() {
    gen += 1;
    box.value = original;
    sizeCodeBox(box);
    clearOut();
    if (onReset) onReset();
    box.focus();
  }

  runBtn.addEventListener("click", doRun);
  resetBtn.addEventListener("click", reset);
  // A line the student adds (or a line that grows long enough to wrap) shows in full instead of
  // scrolling inside the box.
  box.addEventListener("input", () => sizeCodeBox(box));
  box.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      doRun();
    }
  });
  return { box, status, setCode, buttons: h("div", { class: "row", style: "gap:10px" }, runBtn, resetBtn) };
}

// The SME's Tab 1 content: heading, paragraphs, cards, code. Each part may be left out when the
// lesson opens with `what.play` (validate() then only needs the play box).
function whatBody(w) {
  return [
    w.heading ? h("h2", {}, w.heading) : null,
    (w.paragraphs || []).map((text) => h("p", { class: "lead" }, inline(text))),
    w.points && w.points.length
      ? h(
          "div",
          { class: "cards" },
          w.points.map((c) => h("div", { class: "mini-card" }, h("b", {}, c.title), h("span", {}, inline(c.text))))
        )
      : null,
    w.code ? h("pre", {}, w.code) : null,
  ].flat();
}

// ---------- Tab 1 as slides (Pfizer x Extern, Smita, 10 Nov 2026; M1-S1-SLIDES.md) ----------
// `what.slides`: one slide at a time, with its own Back / Next and "Slide N of M" inside the tab.
// The last slide's Next opens the Example tab. A slide shows its heading, its image, its
// paragraphs (text, {code} or {image} items, in order), its static code, then its practice box.

// A picture, or a clear placeholder box with its alt text when the file isn't there (the build
// leaves src empty for a missing file; a picture that fails to load shows the same box).
function slideImage(img) {
  const missing = () =>
    h("div", { class: "slide-img-missing", role: "img", "aria-label": img.alt }, h("span", { class: "small-label" }, "Image coming soon"), h("span", {}, img.alt));
  // size "large" (Pfizer x Extern QA, 10 Nov 2026): the picture fills the panel width, as tall as fits.
  const fig = h("figure", { class: "slide-fig" + (img.size === "large" ? " large" : "") });
  if (!img.src) fig.append(missing());
  else {
    const el = h("img", { class: "slide-img", src: img.src, alt: img.alt, width: img.width, height: img.height, decoding: "async" });
    el.addEventListener("error", () => el.replaceWith(missing()));
    fig.append(el);
  }
  if (img.caption) fig.append(h("figcaption", { class: "caption" }, inline(img.caption)));
  return fig;
}

// The practice box: the SME's black code box with Run and Reset. Each Run also checks the code
// (check.js judgePractice) and shows "Correct!" or a plain hint under the output. "Show suggested
// answer" appears after the first wrong try and stays. `after` shows once the code is right.
function practiceBox(pr, i, afterEl) {
  const slot = feedbackSlot();
  slot.el.classList.add("practice-feedback");
  const revealBtn = h("button", { type: "button", class: "btn btn-link practice-reveal", hidden: true }, "Show suggested answer");
  const answer = h(
    "div",
    { class: "answer-box practice-answer", hidden: true },
    h("span", { class: "small-label" }, "Suggested answer"),
    h("pre", { class: "answer" }, pr.answer)
  );
  const runner = codeRunner({
    id: `slide-${i + 1}-code`,
    label: "Practice code you can change",
    exprs: practiceExprs(pr),
    onRun: (r, code, values) => {
      if (isLoadFailure(r)) return slot.clear(); // the output already says Python couldn't load
      const v = judgePractice(pr, r, values, code);
      if (v.ok) {
        slot.show(true, "Correct!", pr.done_msg ? h("span", { class: "fb-msg" }, inline(pr.done_msg)) : null);
        if (afterEl && afterEl.hidden) {
          afterEl.hidden = false;
          afterEl.classList.add("reveal-in");
        }
      } else {
        revealBtn.hidden = !answer.hidden; // after the first wrong try, until the answer shows
        slot.show(false, "Not quite yet", h("span", { class: "fb-msg" }, inline(v.hint)));
      }
    },
    onReset: () => slot.clear(),
  });
  runner.setCode(pr.code);
  revealBtn.addEventListener("click", () => {
    answer.hidden = false;
    revealBtn.hidden = true;
    focusRevealed(answer);
  });
  // Two columns so the tallest state still fits the stage: the code box, Run / Reset and the
  // suggested answer on the left, what Python showed and the check on the right.
  return h(
    "div",
    { class: "practice", "data-slide": String(i + 1) },
    h("span", { class: "small-label practice-label" }, "Your turn"),
    h("p", { class: "practice-prompt" }, lines(pr.prompt)),
    h("div", { class: "practice-main" }, runner.box, runner.buttons, revealBtn, answer),
    h("div", { class: "practice-side" }, h("p", { class: "practice-wait" }, "Press Run to see what Python shows."), runner.status, slot.el)
  );
}

// A slide's `paragraphs`, in order. An {image} item sits beside the text paragraphs right after it
// (picture left, text right), so a picture and its line share one row instead of stacking.
function slideItems(items) {
  const out = [];
  for (let k = 0; k < items.length; k++) {
    const item = items[k];
    if (typeof item === "string") out.push(h("p", { class: "lead" }, lines(item)));
    else if (item.code !== undefined) out.push(h("pre", {}, item.code));
    else {
      const text = [];
      while (typeof items[k + 1] === "string") text.push(h("p", { class: "lead" }, lines(items[++k])));
      const fig = slideImage(item.image);
      out.push(text.length ? h("div", { class: "slide-row" }, fig, h("div", { class: "stack slide-row-text" }, text)) : fig);
    }
  }
  return out;
}

function slideBody(s, i) {
  const after = s.after ? h("p", { class: "lead slide-after", hidden: true }, inline(s.after)) : null;
  return h(
    "div",
    { class: "stack slide-body" },
    h("h2", {}, s.heading),
    // Pfizer x Extern (10 Nov 2026): optional `intro` strings shown above the slide image.
    s.intro ? slideItems(s.intro) : null,
    s.image ? slideImage(s.image) : null,
    slideItems(s.paragraphs || []),
    s.code ? h("pre", {}, s.code) : null,
    s.practice ? practiceBox(s.practice, i, after) : null,
    after
  );
}

function slidesPanel(l) {
  const slides = l.what.slides;
  const n = slides.length;
  let cur = 0;
  const els = slides.map((s, i) =>
    h("section", { class: "slide", id: `slide-${i + 1}`, "aria-label": `Slide ${i + 1} of ${n}: ${s.heading}`, hidden: i !== 0 }, slideBody(s, i))
  );
  const count = h("span", { class: "slide-count", "aria-live": "polite" });
  const back = h("button", { type: "button", class: "btn btn-ghost slide-btn slide-back" }, "Back");
  const next = h("button", { type: "button", class: "btn btn-dark slide-btn slide-next" });
  // One dot per slide beside "Slide N of M", so the bar reads as the slides' own, not the page's.
  const dots = slides.map(() => h("span", { class: "slide-dot", "aria-hidden": "true" }));
  // The Example tab's own label, so the last slide says where Next goes.
  const nextTab = TAB_LABELS[1];

  function show(i, from) {
    cur = Math.max(0, Math.min(n - 1, i));
    els.forEach((el, j) => (el.hidden = j !== cur));
    count.textContent = `Slide ${cur + 1} of ${n}`;
    dots.forEach((d, j) => d.classList.toggle("on", j <= cur));
    back.disabled = cur === 0;
    next.textContent = cur === n - 1 ? `Next: ${nextTab}` : "Next";
    // Back just disabled itself on slide 1: keep keyboard focus on Next.
    if (from === back && back.disabled) next.focus();
    document.getElementById("panels")?.scrollTo?.(0, 0);
  }
  back.addEventListener("click", () => show(cur - 1, back));
  next.addEventListener("click", () => {
    if (cur < n - 1) return show(cur + 1, next);
    // The last slide leads into the Example tab (the focus goes with it: this button is now hidden).
    const tab = document.getElementById("tab-1");
    tab.click();
    tab.focus();
  });
  show(0);
  return h(
    "div",
    { class: "slides" },
    h("div", { class: "slides-track" }, els),
    h("div", { class: "slide-nav", role: "group", "aria-label": "Slides" }, back, h("div", { class: "slide-progress" }, h("div", { class: "slide-dots" }, dots), count), next)
  );
}

function whatPanel(l) {
  const w = l.what;
  if (w.slides) return slidesPanel(l);
  if (!w.play) return h("div", { class: "stack" }, whatBody(w));

  // Play first: the prompt, the code box, Run and Reset, the output. Everything else in `what`
  // (the `after` line first, then heading, paragraphs, cards, code) appears after the first Run
  // that works. A run that stops with an error shows a plain line instead (Smita, 10 Nov 2026):
  // the first matching `play.error_hints` entry, else `play.after_error`. It never shows `after`,
  // which describes a run that worked.
  const play = w.play;
  const reveal = h(
    "div",
    { class: "stack play-reveal", hidden: true, id: "play-reveal" },
    h("p", { class: "lead play-after" }, inline(play.after)),
    whatBody(w)
  );
  const errNote = h("p", { class: "play-error", id: "play-error", hidden: true });
  const runner = codeRunner({
    id: "play-code",
    label: "Code you can change",
    onRun: (r, code) => {
      if (isLoadFailure(r)) return; // the output already says Python couldn't load
      if (r.error || r.timedOut) {
        const text = (r.error && friendlyError(play.error_hints, r.error, code)) || play.after_error;
        errNote.hidden = !text;
        if (text) {
          errNote.replaceChildren(...inline(text));
          errNote.classList.remove("reveal-in");
          void errNote.offsetWidth; // restart the fade for a new error
          errNote.classList.add("reveal-in");
        }
        return;
      }
      errNote.hidden = true;
      if (!reveal.hidden) return;
      reveal.hidden = false;
      reveal.classList.add("reveal-in");
    },
    onReset: () => {
      errNote.hidden = true;
    },
  });
  runner.setCode(play.code);
  return h(
    "div",
    { class: "stack play-first", style: "gap:12px" },
    h("p", { class: "lead play-prompt" }, inline(play.prompt)),
    runner.box,
    runner.buttons,
    runner.status,
    errNote,
    reveal
  );
}

function examplePanel(l) {
  const ex = l.example;
  // Pfizer x Extern (QA, 12 Nov 2026): `highlight` may be one box number or a list of them.
  const hl = ex.visual ? [].concat(ex.visual.highlight) : [];
  return h(
    "div",
    { class: "stack" },
    h("h2", {}, ex.heading),
    // Pfizer x Extern (10 Nov 2026): optional `intro` lines above the code and `notes` lines below it.
    ex.intro ? slideItems(ex.intro) : null,
    h("pre", {}, ex.code),
    ex.notes ? slideItems(ex.notes) : null,
    ex.visual
      ? h(
          "div",
          { class: "boxes" },
          ex.visual.items.map((v, i) =>
            h(
              "div",
              { class: "box" + (hl.includes(i) ? " hl" : "") },
              h("span", { class: "box-idx" }, `${ex.visual.label}[${i}]`),
              h("div", { class: "box-val" }, v)
            )
          )
        )
      : null,
    ex.caption ? h("p", { class: "caption" }, inline(ex.caption)) : null
  );
}

function demoPanel(l) {
  // Pfizer x Extern: every demo is editable (unless `editable: false`) with Run and Reset, shows its
  // optional `prompt` above the code, and keeps its `note` hidden until that demo's first Run
  // (guess first, explanation after). Edits are kept per demo while the student switches demos.
  let current = 0;
  const edits = l.demos.map((d) => d.code);
  const ran = l.demos.map(() => false);
  const promptEl = h("p", { class: "demo-prompt" });
  const noteEl = h("div", { class: "demo-note", hidden: true });
  const runner = codeRunner({
    id: "demo-code",
    label: "Demo code you can change",
    onRun: () => {
      ran[current] = true;
      if (noteEl.hidden) {
        noteEl.hidden = false;
        noteEl.classList.add("reveal-in");
      }
    },
  });
  runner.status.append(noteEl);
  const picks = l.demos.map((d, i) =>
    h("button", { type: "button", class: "demo-pick", "aria-pressed": "false", onclick: () => select(i) }, d.label)
  );

  let shown = false;
  function select(i) {
    if (shown) edits[current] = runner.box.value;
    shown = true;
    current = i;
    const d = l.demos[i];
    picks.forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
    promptEl.replaceChildren(...(d.prompt ? inline(d.prompt) : []));
    promptEl.hidden = !d.prompt;
    runner.setCode(d.code, d.editable !== false);
    runner.box.value = edits[i];
    sizeCodeBox(runner.box);
    noteEl.replaceChildren(...lines(d.note));
    noteEl.classList.remove("reveal-in");
    noteEl.hidden = !ran[i];
  }

  select(0);
  return h(
    "div",
    { class: "stack", style: "gap:16px" },
    // Pfizer x Extern (Smita, 10 Nov 2026): every demo is editable, so the heading says so.
    h("h2", {}, "Change It and Run"),
    h(
      "div",
      { class: "demo" },
      h("div", { class: "demo-list", role: "group", "aria-label": "Demos" }, picks),
      h("div", { class: "demo-main" }, promptEl, runner.box, runner.buttons, runner.status)
    )
  );
}

function tryPanel(l) {
  const t = l.try;
  let attempts = 0;
  let wrong = 0;
  let solved = false;
  let revealed = false;
  let busy = false;

  const attemptsEl = h("span", { class: "small-label", style: "text-transform:none;letter-spacing:0;font-weight:400;font-size:12px" }, "Attempts: 0");
  // Pfizer x Extern: the code box is as tall as the starter code (at least his 6 rows), so a
  // three-part starter shows in full instead of scrolling inside a 6-row box.
  const rows = Math.max(6, String(t.starter).split("\n").length); // a starter ending in a newline gets its empty last row
  const box = h("textarea", { id: "code-box", spellcheck: "false", autocomplete: "off", autocapitalize: "off", rows: String(rows), style: `--rows:${rows}` });
  box.value = t.starter;
  // Pfizer x Extern (QA, 12 Nov 2026): like the other code boxes, the Try box grows and shrinks with
  // its code, wrapped or added lines included (fitCodeBox), and the stage re-fits after a change.
  sizeCodeBox(box);
  if (codeBoxObserver) codeBoxObserver.observe(box);
  box.addEventListener("input", () => sizeCodeBox(box));
  const checkBtn = h("button", { type: "button", class: "btn btn-primary" }, "Run & check");
  const resetBtn = h("button", { type: "button", class: "btn btn-ghost" }, "Start over");
  const revealBtn = h("button", { type: "button", class: "btn btn-link", hidden: true }, "Show answer");
  const slot = feedbackSlot();
  const feedback = slot.el;
  feedback.id = "feedback";
  const answer = h("div", { hidden: true, id: "answer", class: "answer-box" }, h("span", { class: "small-label" }, "One way to do it"), h("pre", { class: "answer" }, t.solution));

  function syncReveal() {
    revealBtn.hidden = !(revealAllowed(wrong) && !solved && !revealed);
  }
  // Keeps the new message visible inside the scrolling panel (never scrolls the page).
  const showFeedback = slot.show;

  async function onCheck() {
    if (busy) return;
    busy = true;
    checkBtn.disabled = true;
    checkBtn.textContent = "Running…";
    // Pfizer x Extern: only `expr` checks run in Python; a `code_not_matches` check reads the code (check.js).
    const exprs = t.checks.filter((c) => c.expr !== undefined).map((c) => c.expr);
    const code = box.value;
    const { run: r, values } = await safeEval(code, exprs);
    busy = false;
    checkBtn.disabled = false;
    checkBtn.textContent = "Run & check";

    if (isLoadFailure(r)) {
      // Not the student's fault: does not count as an attempt.
      showFeedback(false, "Python isn't ready", h("span", { class: "fb-msg" }, loadFailureNode()));
      return;
    }
    const verdict = judge(t, r, values, code);
    attempts += 1;
    attemptsEl.textContent = `Attempts: ${attempts}`;
    if (verdict.ok) solved = true;
    else wrong += 1;
    // Update the button row first: a newly shown "Show answer" button can wrap
    // onto a new line and push the feedback down.
    syncReveal();
    if (verdict.ok) {
      showFeedback(true, "Correct!", h("span", { class: "fb-msg" }, "That matches what we expected. Here is what printed:"), h("pre", {}, r.stdout.trimEnd()));
    } else {
      // Pfizer x Extern: a matched `error_hints` entry gives plain words first and Python's own
      // message after them in small text.
      // A hint that starts "Part N next" means the earlier parts are right (QA, 10 Nov 2026): it
      // shows under a neutral "Next step" heading instead of "Not quite yet".
      showFeedback(
        false,
        /^Part \d+ next\b/.test(verdict.hint) ? "Next step" : "Not quite yet",
        h("span", { class: "fb-msg" }, verdict.hint),
        verdict.detail ? h("span", { class: "fb-detail" }, "Python's message: ", h("code", {}, verdict.detail)) : null
      );
    }
  }

  checkBtn.addEventListener("click", onCheck);
  box.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      onCheck();
    }
  });
  resetBtn.addEventListener("click", () => {
    box.value = t.starter;
    sizeCodeBox(box);
    attempts = wrong = 0;
    solved = revealed = false;
    attemptsEl.textContent = "Attempts: 0";
    slot.clear();
    answer.hidden = true;
    syncReveal();
    box.focus();
  });
  revealBtn.addEventListener("click", () => {
    revealed = true;
    answer.hidden = false;
    syncReveal();
    // "Show answer" just hid itself: keep keyboard focus by moving it to the answer.
    focusRevealed(answer);
  });

  return h(
    "div",
    // Pfizer x Extern: "try-wide" puts a long starter (more than 8 lines) beside the task
    // (styles.css), so the whole Try fits the fixed embed stage. Same elements, same order.
    { class: "stack" + (rows > 8 ? " try-wide" : ""), style: "gap:12px" },
    h("div", { class: "try-head" }, h("h2", {}, "Try it yourself"), attemptsEl),
    h("p", { class: "lead", style: "font-size:15px" }, lines(t.prompt)),
    h("label", { for: "code-box", class: "small-label" }, "Your code"),
    box,
    h("div", { class: "row", style: "gap:10px" }, checkBtn, resetBtn, revealBtn),
    feedback,
    answer
  );
}

boot("concept", () => ({ labels: TAB_LABELS, builders: [whatPanel, examplePanel, demoPanel, tryPanel, (l) => learnPanel(l)] }));

return {  };
})();

// ---- stage.js ----
{
// Pfizer x Extern addition (not in the SME's engine): the fixed embed stage.
// The lesson is laid out on a fixed 760 px wide stage (height = --stage-h, set by
// build_lesson.py) and scaled as one piece to fit its iframe, like every other
// Pfizer 3.0 embed. Nothing scrolls: when a tab's content is taller than the step
// panel, the content zooms down a little (to ZOOM_MIN at most). Only if it still
// does not fit does the panel scroll, as the SME's original page always did.

const STAGE_W = 760;
const ZOOM_MIN = 0.8;

const root = document.documentElement;
const stage = document.getElementById("lesson");
const panels = document.getElementById("panels");

function stageH() {
  const v = parseFloat(getComputedStyle(root).getPropertyValue("--stage-h"));
  return Number.isFinite(v) && v > 0 ? v : 800;
}

function fitStage() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const H = stageH();
  const s = Math.min(w / STAGE_W, h / H);
  stage.style.transform = `translate(${(w - STAGE_W * s) / 2}px, ${(h - H * s) / 2}px) scale(${s})`;
}

function fitPanel() {
  const active = [...panels.children].find((el) => !el.hidden) || null;
  panels.classList.remove("overflow");
  if (!active) return;
  let z = 1;
  active.style.zoom = "1";
  while (panels.scrollHeight > panels.clientHeight + 1 && z > ZOOM_MIN) {
    z = Math.max(ZOOM_MIN, Math.round((z - 0.025) * 1000) / 1000);
    active.style.zoom = String(z);
  }
  if (panels.scrollHeight > panels.clientHeight + 1) panels.classList.add("overflow"); // last resort only
  else panels.scrollTop = 0;
  active.dataset.zoom = String(z);
}

let raf = 0;
function refit() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    fitStage();
    fitPanel();
  });
}

// Re-fit when the tab changes, when output or feedback appears, and when fonts arrive.
new MutationObserver(refit).observe(panels, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["hidden"] });
window.addEventListener("resize", refit);
// Pfizer x Extern: a slide picture changes the height when it finishes loading (load does not bubble).
panels.addEventListener("load", refit, true);
document.addEventListener("lesson-ready", refit);
// Pfizer x Extern (QA, 12 Nov 2026): a code box grew or shrank to fit its wrapped code (concept.js).
document.addEventListener("lesson-refit", refit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
fitStage();

}

</script>
