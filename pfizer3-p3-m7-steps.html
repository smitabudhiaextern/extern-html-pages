<template id="s2">
  <p class="p">First, set up regex in your notebook:</p>
  <ul class="list">
    <li><b>No Installation Needed:</b> Python comes with a built-in module called <code>re</code>, so there's nothing extra to install.</li>
    <li><b>Import the Regex Module:</b> simply import <code>re</code> at the top of your notebook. (Here, you'll put it at the top of your first new cell, at the bottom of the notebook.)</li>
    <li><b>Prepare Sample Text:</b> let's define a string we'll use throughout this reading: the text of all 3 pages of the supplier file.</li>
  </ul>
  <p class="p">Every cell in these steps goes in a <b>new code cell at the bottom</b> of the notebook. To add one, click the last cell in the notebook, then click <b>+ Code</b> at the top. Paste this in and press <b>Run</b>:</p>
  {{HOLDS:all 3 pages}}
  {{CODE:python:import re

# Put the text of all 3 pages into one string
text = ""
for page_num in range(len(doc)):
    text += doc[page_num].get_text("text")}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>import re</code> loads Python's regex tools, such as <code>re.search()</code> and <code>re.findall()</code>, so the cells after it can use them.</li>
    <li><code>text = ""</code> starts an empty string. The loop is the one from your notebook's Step 4: it goes through page numbers 0, 1 and 2 (Python counts from 0), and <code>+=</code> adds each page's text to the end of <code>text</code>.</li>
    <li>All 3 pages go into one string, so one search can look through the whole file at once.</li>
  </ul>
</template>

<template id="s3">
  <p class="p">Now that you've got text from a pharmaceutical SDF (Supporting Documentation File, the supplier file you opened in Step 1), the next step is to pull out specific information, like names, dates, or phone numbers, using <b>Regex</b>. In this section, we'll focus on finding data that's neatly placed on <b>a single line</b>. This is the easiest way to get started with Regex and builds the foundation for more complex use cases.</p>
  <p class="p">The simplest use of Regex is to search for exact words or phrases in your text using <code>re.search()</code> or <code>re.findall()</code>. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:# Search for a vendor name
match = re.search(r"Cytiva", text)
if match:
    print("Found:", match.group())}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>re.search()</code> gives back the first match, or <code>None</code> if there's none, so <code>if match:</code> prints only when it finds "Cytiva". The <code>r</code> keeps every backslash in the pattern as it is.</li>
  </ul>
  <p class="p"><b>Use Case:</b> Great for quick keyword spotting or rule-based classification (sorting documents into groups with fixed rules, such as "it names Cytiva, so it's from Cytiva").</p>
  {{SHOT:3}}
</template>

<template id="s4">
  <p class="p">Regex really shines when text follows a pattern. You can use <b>character classes</b> (a set of characters in square brackets, such as <code>[\w\.-]</code>, where any one of them can match) to match things like email addresses, dates, and phone numbers, even if the formatting varies a little. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:#Extract email
emails = re.findall(r"[\w\.-]+@[\w\.-]+\.\w+", text)
print("Emails:", emails)

# Extract phone numbers
phones = re.findall(r"\+?\d[\d\s().-]{9,}", text)
print("Phones:", phones)}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">

<template id="s7">
  <p class="p"><b>Capturing groups</b> are a feature in Regex that let you <b>extract specific parts</b> of a match. Here's a simple way to think about it: <i>you don't just want to find a pattern, you want to grab pieces of it.</i></p>
  <p class="p">Capturing groups are created using <b>parentheses <code>()</code></b> in your Regex pattern. Whatever is inside the parentheses gets "captured" and saved, so you can use it later in your code.</p>
  <p class="p">Go back to the bottom of the notebook, add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{STILL:page 1 only (from Step 6)}}
  {{CODE:python:# Extract the letter date's parts using groups
match = re.search(r"(\d{1,2})\s+([A-Z][a-z]+),\s+(\d{4})", text)

if match:
    day = match.group(1)    # '3'
    month = match.group(2)  # 'June'
    year = match.group(3)   # '2022'
    print(f"Day: {day}, Month: {month}, Year: {year}")}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li>Each pair of round brackets is one group. The next slide breaks down what each group catches.</li>
    <li><code>\s+</code> and <code>,\s+</code> (the comma and spaces) sit outside the brackets. They still have to match, but they aren't saved.</li>
    <li><code>match.group(1)</code> gives back what the first pair captured, and so on. The <code>f</code> before the quotes makes an <b>f-string</b>: Python puts the value of <code>day</code>, <code>month</code> and <code>year</code> where their names sit in curly brackets.</li>
  </ul>
</template>

<template id="s7b">
  {{SHOT:7}}
  <p class="p"><b>Breakdown of the Pattern:</b></p>
  <div class="tbl"><table><thead><tr><th scope="col">Part</th><th scope="col">Pattern</th><th scope="col">Meaning</th></tr></thead><tbody>
    <tr><td class="m">(\d{1,2})</td><td>1 or 2 digits, in a group</td><td>The day</td></tr>
    <tr><td class="m">\s+</td><td>One or more spaces</td><td>Gap</td></tr>
    <tr><td class="m">([A-Z][a-z]+)</td><td>A capital letter, then small letters, in a group</td><td>The month</td></tr>
    <tr><td class="m">,\s+</td><td>Comma and spaces</td><td>Delimiter (the mark that separates two parts)</td></tr>
    <tr><td class="m">(\d{4})</td><td>4 digits, in a group</td><td>The year</td></tr>
  </tbody></table></div>
  <div class="concl"><p>Let's analyze <code>"3 June, 2022"</code>: the first group, <b>3</b>, captures the day. The second group, <b>June</b>, captures the month. The third group, <b>2022</b>, captures the year. Together, you can separate and organize dates into structured fields.</p>
    <p><b>Conclusion:</b> Capturing groups are powerful when you need to split or label parts of complex data formats.</p></div>
</template>


<template id="s8r">
  <p class="p">In real life, the information you want to find in text doesn't always stay on one line. Things like names, addresses, or descriptions often spread across multiple lines, especially in emails, PDFs, or forms. In this step, you'll learn how to make Regex handle text that goes over several lines by using special <b>flags</b> (extra settings you give <code>re.search()</code>).</p>
  <p class="p">On page 3, the label and its date land on two lines of the text. If you try a basic pattern on page 3's text, it won't work, because there's a line break between <code>Date of Manufacture:</code> and <code>20240315</code>, so the output is <code>None</code>. <b>Solution: Match Across Line Breaks.</b> To match multiline text, use <code>.*</code> and the <code>re.DOTALL</code> flag.</p>
  <p class="p">This cell tries both: first the basic pattern, then the solution. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{HOLDS:page 3 only}}
  {{CODE:python:# Extract raw text from page 3
text = doc[2].get_text("text")

print(re.search(r"Date of Manufacture: 20240315", text))

match = re.search(r"Date of Manufacture:\s*(.*)\nProduct Description:",
                  text, re.DOTALL)

if match:
    print("Date of Manufacture:", match.group(1))}}
</template>

<template id="s8b">
  {{SHOT:8}}
  <p class="p">Here's what each part of the second pattern does:</p>
  <div class="tbl"><table><thead><tr><th scope="col">Pattern</th><th scope="col">Meaning</th></tr></thead><tbody>
    <tr><td class="m">\s*</td><td>Match any whitespace (including line breaks)</td></tr>
    <tr><td class="m">(.*)</td><td>Capture everything after <code>Date of Manufacture:</code> (the date itself)</td></tr>
    <tr><td class="m">re.DOTALL</td><td>Allows <code>.</code> to match newlines (<code>\n</code>) too. On page 3 it changes nothing: <code>\s*</code> already crosses the line break, so you get 20240315 with or without it.</td></tr>
  </tbody></table></div>
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>doc[2]</code> is page 3, because Python counts pages from 0. <code>print()</code> around the first search lets you see its <code>None</code>: on its own, a search that finds nothing shows nothing in Colab.</li>
    <li><code>*</code> means zero or more. <code>.</code> is any one character other than a line break, so <code>.*</code> is any run of characters. The <code>\nProduct Description:</code> after it marks where the date ends: at the line break before the next label.</li>
    <li><code>re.DOTALL</code> goes in as a third input to <code>re.search()</code>, after the pattern and <code>text</code>. <code>.</code> alone stops at a line break, but with <code>re.DOTALL</code> it keeps going. <code>match.group(1)</code> is the first group, as in Step 7.</li>
  </ul>
</template>

<template id="s8c">
  <p class="p"><b>Greedy vs. Non-Greedy.</b> By default, Regex is <b>greedy</b>. That means when you use <code>.*</code>, it tries to match <b>everything</b> until the <b>last</b> possible character that fits the pattern. To make it <b>non-greedy</b>, just add a <code>?</code>: use <code>.*?</code> instead of <code>.*</code>. This prevents overmatching (grabbing more text than you wanted), and it's safer if there are multiple sections like "Date of Manufacture:" and "Product Description:" later in the text.</p>
  <p class="p">Use non-greedy matching when you're working with nested or repeating tags (like HTML, the code behind a web page, or XML; tags are labels in angle brackets), when you want to avoid overmatching, or when you only need the <b>first</b> valid match, not the whole stretch. It's a small change with a <b>big impact on accuracy</b>. Want to see it? Add a new code cell, paste this in, and press <b>Run</b>. On page 3 there's only one of each label, so you get the same date:</p>
  {{CODE:python:match = re.search(r"Date of Manufacture:\s*(.*?)\nProduct Description:",
                  text, re.DOTALL)
print("Date of Manufacture:", match.group(1))}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>.*?</code> stops at the first <code>\nProduct Description:</code>, so it grabs as little as it can.</li>
  </ul>
  {{SHOT:8c}}
</template>

    { group: "Step 1", label: "STEP 1 &middot; PART 2 OF 2: SEE IT", title: 'Check That the File Is <span class="hl">Open</span>', plain: "Step 1. Check That the File Is Open (Part 2 of 2)", tpl: "s1b" },
    { group: "Step 2", label: "STEP 2 &middot; PART 1 OF 2: RUN IT", title: 'Import re and Put All 3 Pages in One <span class="hl">String</span>', plain: "Step 2. Import re and Put All 3 Pages in One String", tpl: "s2" },
    { group: "Step 2", label: "STEP 2 &middot; PART 2 OF 2: SEE IT", title: 'Check That the Cell <span class="hl">Ran</span>', plain: "Step 2. Check That the Cell Ran (Part 2 of 2)", tpl: "s2b" },
    { group: "Step 3", label: "STEP 3", title: 'Find an Exact <span class="hl">Word</span>', plain: "Step 3. Find an Exact Word", tpl: "s3" },
    { group: "Step 4", label: "STEP 4 &middot; PART 1 OF 2: RUN IT", title: 'Find Emails and Phone <span class="hl">Numbers</span>', plain: "Step 4. Find Emails and Phone Numbers", tpl: "s4" },
    { group: "Step 4", label: "STEP 4 &middot; PART 2 OF 2: SEE IT", title: 'See What Looks Like a <span class="hl">Phone</span> Number', plain: "Step 4. See What Looks Like a Phone Number (Part 2 of 2)", tpl: "s4b" },
    { group: "Step 5", label: "STEP 5 &middot; PART 1 OF 2: RUN IT", title: 'Find <span class="hl">Dates</span> in Different Formats', plain: "Step 5. Find Dates in Different Formats", tpl: "s5" },
    { group: "Step 5", label: "STEP 5 &middot; PART 2 OF 2: SEE IT", title: 'See Which <span class="hl">Dates</span> It Found', plain: "Step 5. See Which Dates It Found (Part 2 of 2)", tpl: "s5b" },
    { group: "Step 6", label: "STEP 6", title: 'Find the Letter\'s <span class="hl">Date</span>', plain: "Step 6. Find the Letter's Date", tpl: "s6" },
    { group: "Step 7", label: "STEP 7 &middot; PART 1 OF 2: RUN IT", title: 'Split the Date into <span class="hl">Groups</span>', plain: "Step 7. Split the Date into Groups", tpl: "s7" },
    { group: "Step 7", label: "STEP 7 &middot; PART 2 OF 2: SEE IT", title: 'See the Three <span class="hl">Pieces</span>', plain: "Step 7. See the Three Pieces (Part 2 of 2)", tpl: "s7b" },
    { group: "Step 8", label: "STEP 8 &middot; PART 1 OF 3: RUN IT", title: 'When Text Runs Over Two <span class="hl">Lines</span>', plain: "Step 8. When Text Runs Over Two Lines (Part 1 of 3)", tpl: "s8r" },
    { group: "Step 8", label: "STEP 8 &middot; PART 2 OF 3: SEE IT", title: 'Compare the Two <span class="hl">Searches</span>', plain: "Step 8. Compare the Two Searches (Part 2 of 3)", tpl: "s8b" },
    { group: "Step 8", label: "STEP 8 &middot; PART 3 OF 3: GREEDY VS. NON-GREEDY", title: 'Stop at the First <span class="hl">Match</span>', plain: "Step 8. Stop at the First Match (Part 3 of 3)", tpl: "s8c" },
    { group: "Step 9", label: "STEP 9 &middot; PART 1 OF 3: YOUR TURN", title: 'Test the Pattern on pdfplumber\'s <span class="hl">Date</span>', plain: "Step 9. Test the Pattern on pdfplumber's Date", tpl: "s9" },
    { group: "Step 9", label: "STEP 9 &middot; PART 2 OF 3: RUN IT", title: 'Make It Work <span class="hl">Both</span> Ways', plain: "Step 9. Make It Work Both Ways (Part 2 of 3)", tpl: "s9b" },
    { group: "Step 9", label: "STEP 9 &middot; PART 3 OF 3: SEE IT", title: 'Check Both <span class="hl">Results</span>', plain: "Step 9. Check Both Results (Part 3 of 3)", tpl: "s9c" },
    { group: "Cheat Sheet", label: "QUICK REFERENCE", title: 'Your Regex Cheat <span class="hl">Sheet</span>', plain: "Your Regex Cheat Sheet", tpl: "s10", cls: "sheet-slide" }
  ];
  /* Stage sizes: wide frames, and frames under 560 px wide */
  var STAGE = { wide: [760, 1035], narrow: [420, 1420] };
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of this reading.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  /* The fixed stage: pick the wide or narrow design size, then scale the whole deck to fit the frame and centre it. */
  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var sz = narrow ? STAGE.narrow : STAGE.wide;
    app.style.width = sz[0] + "px"; app.style.height = sz[1] + "px";
    var k = Math.min(window.innerWidth / sz[0], window.innerHeight / sz[1]);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg" + (g.name.indexOf("Step ") === 0 ? "" : " pg-fit");
    b.setAttribute("aria-label", g.name + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    var word = g.name.indexOf("Step ") === 0 ? '<span class="pg-word">Step </span>' + g.name.replace("Step ", "") : "Sheet";
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + word + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner' + (s.cls ? " " + s.cls : "") + '"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + body(s.tpl) + '</div>';
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });

    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
    space();
    Array.prototype.forEach.call(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a slide. Spare height widens the gaps
     between blocks, up to 2x. The Colab screenshots already run the full width of the card, so they don't grow. */
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = "";
    inner.classList.remove("tight");
    var cs = getComputedStyle(card);
    var avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    /* A slide that needs more room than the card has (the cheat sheet with the done message) tightens instead */
    if (spare < 0) { inner.classList.add("tight"); spare = avail - inner.offsetHeight; }
    var base = parseFloat(getComputedStyle(inner).rowGap) || 14;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (base + Math.min(base, spare / gaps)) + "px";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    space();
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  /* Left and Right arrow keys move between slides */
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #slide=N opens slide N directly */
  var hm = location.hash.match(/slide=(\d+)/);
  if (hm) i = Math.min(SLIDES.length - 1, Math.max(0, +hm[1] - 1));
  window.addEventListener("resize", function () { scaleStage(); space(); });
  scaleStage();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
</body>
