<template id="s2">
  <p class="p">First, get regex ready. Python comes with <code>re</code>, so there's nothing to install. This cell also puts the text of all 3 pages into one string, <code>text</code>. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:import re

# Put the text of all 3 pages into one string
text = ""
for page_num in range(len(doc)):
    text += doc[page_num].get_text("text")}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>import re</code> loads Python's regex tools, such as <code>re.search()</code> and <code>re.findall()</code>, so the cells after it can use them.</li>
    <li><code>text = ""</code> starts an empty string. The loop is the one from your notebook's Step 4: it goes through page numbers 0, 1 and 2 (Python counts from 0), and <code>+=</code> adds each page's text to the end of <code>text</code>.</li>
    <li>All 3 pages go into one string, so one search can look through the whole file at once.</li>
  </ul>
  <p class="p">This cell prints nothing. That's fine: the next steps search <code>text</code> and print what they find.</p>
</template>

<template id="s3">
  <p class="p">Search for an exact word, then for emails and phone numbers. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:# Search for a vendor name
match = re.search(r"Cytiva", text)
if match:
    print("Found:", match.group())

#Extract email
emails = re.findall(r"[\w\.-]+@[\w\.-]+\.\w+", text)
print("Emails:", emails)

# Extract phone numbers
phones = re.findall(r"\+?\d[\d\s().-]{9,}", text)
print("Phones:", phones)}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>re.search()</code> gives back the first match, or <code>None</code> if there's none, so <code>if match:</code> prints only when it finds "Cytiva". The <code>r</code> keeps every backslash in the pattern as it is.</li>
    <li><code>re.findall()</code> gives back every match, as a list. <code>[\w\.-]</code> is a <b>character class</b>: a set in square brackets. Here it means any letter, digit, _, dot or dash.</li>
    <li>The phone pattern is maybe a <code>+</code>, a digit, then 9 or more (<code>{9,}</code>) digits, spaces, line breaks, brackets, dots or dashes.</li>
  </ul>
</template>

<template id="s4">
  <p class="p">Now look for dates. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:# Extract dates (multiple formats)
dates_iso = re.findall(r"\d{4}-\d{2}-\d{2}", text)  # YYYY-MM-DD
dates_dmy = re.findall(r"\d{2}-[A-Za-z]{3}-\d{4}", text)  # DD-Mon-YYYY
dates_dmy2 = re.findall(r"\d{2}\s+[A-Z]{3}\s+\d{4}", text)  # DD MMM YYYY
print("Dates (ISO):", dates_iso)
print("Dates (DD-Mon-YYYY):", dates_dmy)
print("Dates (DD MMM YYYY):", dates_dmy2)

# Extract dates in YYYYMMDD format (no separators)
dates_yyyymmdd = re.findall(r"\d{8}", text)
print("Dates (YYYYMMDD):", dates_yyyymmdd)}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li>Each <code>#</code> comment names the format its pattern looks for. <code>YYYY-MM-DD</code> means year, month and day with dashes, like <code>2022-06-03</code>. <code>\d{4}</code> is exactly 4 digits.</li>
    <li><code class="nw">[A-Za-z]{3}</code> is 3 letters, capital or small, like <code>Jun</code>. <code>[A-Z]{3}</code> is 3 capital letters, like <code>JUN</code>. <code>\s+</code> is one or more whitespace characters: spaces, tabs or line breaks.</li>
    <li><code>\d{8}</code> is any 8 digits in a row, with nothing between them. As its comment says, this format is common in pharmaceutical documents like expiration dates: <code>20230126</code> is 26 January 2023.</li>
  </ul>
</template>

  <p class="p">The first 3 lists are empty because the supplier file doesn't use those formats. The last pattern finds 11 numbers, and 4 of them are certificate dates.</p>

<template id="s5b">
  <p class="p">Now split the letter's date into its pieces with groups. Go back to the bottom of the notebook, add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:# Extract the letter date's parts using groups
match = re.search(r"(\d{1,2})\s+([A-Z][a-z]+),\s+(\d{4})", text)

if match:
    day = match.group(1)    # '3'
    month = match.group(2)  # 'June'
    year = match.group(3)   # '2022'
    print(f"Day: {day}, Month: {month}, Year: {year}")}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li>Each pair of round brackets is one group. <code class="nw">(\d{1,2})</code> is 1 or 2 digits, the day. <code class="nw">([A-Z][a-z]+)</code> is a capital letter, then small letters, the month. <code class="nw">(\d{4})</code> is 4 digits, the year.</li>
    <li><code>\s+</code> and <code>,\s+</code> (the comma and spaces) sit outside the brackets. They still have to match, but they aren't saved.</li>
    <li><code>match.group(1)</code> gives back what the first pair captured, and so on. The <code>f</code> before the quotes makes an <b>f-string</b>: Python puts the value of <code>day</code>, <code>month</code> and <code>year</code> where their names sit in curly brackets.</li>
  </ul>
</template>

<template id="s5c">
  <p class="p">Under the cell, you'll see the day, the month and the year, each on its own:</p>
  {{OUT:Output:Day: 3, Month: June, Year: 2022}}
</template>

<template id="s6">
  <p class="p">On page 3, the label and its date land on two lines of the text. Try a plain pattern first, then the one that crosses the line break. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:# Extract raw text from page 3
text = doc[2].get_text("text")

print(re.search(r"Date of Manufacture: 20240315", text))

match = re.search(r"Date of Manufacture:\s*(.*)\nProduct Description:",
                  text, re.DOTALL)

if match:
    print("Date of Manufacture:", match.group(1))}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>doc[2]</code> is page 3, because Python counts pages from 0. <code>print()</code> around the first search lets you see its <code>None</code>: on its own, a search that finds nothing shows nothing in Colab.</li>
    <li><code>\s*</code> matches any whitespace (including line breaks). <code>(.*)</code> captures everything after <code>Date of Manufacture:</code> (the date itself), up to <code>\n</code>, the line break before the next label, <code>Product Description:</code>.</li>
    <li><code>re.DOTALL</code> allows <code>.</code> to match newlines (<code>\n</code>) too. On page 3 it changes nothing, because <code>\s*</code> already crosses the line break. <code>match.group(1)</code> is the first group, as in Step 5.</li>
  </ul>
</template>

<template id="s6b">
  <p class="p">Under the cell, you'll see:</p>
  {{OUT:Output:None
Date of Manufacture: 20240315}}
  <p class="p">The plain pattern prints <code>None</code>, because a space can't match the line break. <code>\s*</code> can, so the second pattern finds the date.</p>
</template>

<template id="s7">
  <p class="p">In the reading on pypdf, pdfplumber and PyMuPDF, pdfplumber read the letter's date as <code>3 June,2022</code>, with no space after the comma. Would your notebook's Step 5 pattern still find it? Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:print(re.search(r"\d{1,2}\s+[A-Z][a-z]+,\s+\d{4}", "3 June,2022"))}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li>This time <code>re.search()</code> searches a short string you type in, <code>"3 June,2022"</code>, in place of <code>text</code>. It's the date as pdfplumber read it, so you can test the pattern without running pdfplumber.</li>
    <li>The pattern is your notebook's Step 5 pattern, unchanged. <code>print()</code> shows <code>None</code> when nothing matches, as in Step 6.</li>
  </ul>
  {{OUT:Output:None}}
  <p class="p">It finds nothing. <code>,\s+</code> means a comma, then <b>one or more</b> spaces, and here there are none. You need <b>zero or more</b> spaces after the comma. Which symbol from the cards means "zero or more"? Make your guess, then go to the next slide.</p>
</template>

<template id="s7b">
  <p class="p">The answer is <code>*</code>, so <code>,\s*</code> matches a comma with or without spaces after it. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:# Extract raw text from the first page
text = doc[0].get_text("text")

pattern = r"\d{1,2}\s+[A-Z][a-z]+,\s*\d{4}"

# The date as PyMuPDF reads it
print("PyMuPDF:", re.search(pattern, text).group())

# The date as pdfplumber read it
print("pdfplumber:", re.search(pattern, "3 June,2022").group())}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>pattern = r"..."</code> saves the pattern under one name, so both searches use exactly the same one. It's the Step 5 pattern with <code>\s*</code> after the comma.</li>
