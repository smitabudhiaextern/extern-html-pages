      h1:"Why Is It Still Spreading?",
      chip:"Day 8, 10 February" },
    { id:"why", kind:"close", label:"What was happening",
      h1:"Why It Kept Spreading",
      chip:"Day 8, 10 February" }
  ];

  /* ---------------- state ---------------- */
  var KEY = "vciso-p2-m12-day-8-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function validId(v){ return OPTS.some(function(o){ return o.id === v; }); }
  function fresh(){ return { shown:1, pick:null, read:{}, cur:null }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var shown = (Number.isInteger(raw.shown) && raw.shown >= 1 && raw.shown <= DAYS.length) ? raw.shown : 1;
      var read = {};
      if(isPlain(raw.read)) Object.keys(raw.read).forEach(function(k){ if(validId(k)) read[k] = 1; });
      var pick = validId(raw.pick) ? raw.pick : null;
      if(!pick) return { shown:shown, pick:null, read:{}, cur:null };
      return { shown:DAYS.length, pick:pick, read:read, cur: validId(raw.cur) ? raw.cur : pick };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = m; }
  function opt(id){ var r = null; OPTS.forEach(function(o){ if(o.id === id) r = o; }); return r; }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    if(s.chip){ el.chip.hidden = false; el.chip.innerHTML = icon("calendar") + esc(s.chip); }
    else el.chip.hidden = true;

    el.back.disabled = (i === 0);
    el.next.textContent = "Continue";
    el.next.disabled = false;
    el.hint.textContent = "";
    if(i === S.length-1){ el.next.textContent = "Start again"; el.hint.textContent = "That is the end. Start again clears your pick and hides the days again."; }
    else if(s.kind === "count" && st.shown < DAYS.length){
      el.next.disabled = true;
      el.hint.textContent = "Show each day in turn to carry on.";
    }
    else if(s.kind === "pick" && !st.pick){
      el.next.disabled = true;
      el.hint.textContent = "Pick one reason to carry on.";
    }
    else if(s.kind === "pick"){
      var n = Object.keys(st.read).length;
      el.hint.textContent = n < OPTS.length
        ? "You can open the other three to read their replies too. Your pick stays marked."
        : "You have read all four replies.";
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);

    if(s.kind === "count") renderCount(false);
    else if(s.kind === "pick") renderPick();
    else renderClose();

    header();
    say("Slide " + (i+1) + " of " + S.length + ". " + s.h1 + ".");
  }

  /* Slide 1: day 1, then the count one day at a time. Nothing past day 8. */
  function dayRow(k, fresh){
    var x = DAYS[k];
    var last = (k === st.shown-1);
    var pct = Math.round(x.n / MAX * 1000) / 10;
    return '<div class="row' + (last ? " now" : "") + (fresh ? " in" : "") + '">'
      + '<div class="dn"><b>' + x.d + "</b><span>" + x.date + " 2025</span></div>"
      + '<div class="cnt"><span class="track" aria-hidden="true"><span class="fill" style="width:' + pct + '%"></span></span>'
      + '<span class="num">' + icon("shieldx") + x.n + " machines</span></div>"
      + '<span class="sr">' + x.n + " machines have no working antivirus.</span>"
      + "</div>";
  }
  function renderCount(animateLast){
    var rows = '<div class="row"><div class="dn"><b>Day 1</b><span>3 Feb 2025</span></div>'
      + "<p>A routine script was run to fix a Windows Update problem (Windows Update is the tool that installs Microsoft's fixes). It appears to work.</p></div>";
    for(var k=0;k<DAYS.length;k++){
      if(k < st.shown) rows += dayRow(k, animateLast && k === st.shown-1 && !reduce);
      else rows += '<div class="row wait"><div class="dn"><b>' + DAYS[k].d + "</b><span>" + DAYS[k].date + " 2025</span></div>"
        + "<p>Not yet. Show the next day to see it.</p></div>";
    }
    var done = st.shown >= DAYS.length;
    el.board.innerHTML =
        '<p class="lead">Each bar shows how many machines (the company\'s computers) have <b>no working antivirus</b> that day.</p>'
      + '<div class="tl">' + rows + "</div>"
      + (done
          ? '<div class="still' + (animateLast && !reduce ? " in" : "") + '">' + icon("hand")
            + "<p>Nobody has run anything on any of them since day 1.</p></div>"
          : '<button class="go solid" id="more" type="button">' + icon("plus") + "Show " + DAYS[st.shown].d.toLowerCase() + "</button>");
    var b = el.board.querySelector("#more");
    if(b) b.addEventListener("click", function(){
      st.shown += 1; save(st);
      renderCount(true); header();
      var x = DAYS[st.shown-1];
      say(x.d + ", " + x.date + ". " + x.n + " machines have no working antivirus."
        + (st.shown >= DAYS.length ? " Nobody has run anything on any of them since day 1." : ""));
      var nb = el.board.querySelector("#more");
      (nb || el.next).focus();
    });
  }

  /* Slide 2: four options, none chosen on arrival. */
  function renderPick(){
    el.board.innerHTML =
        '<div class="pick">'
      +   '<div class="opts" role="group" aria-label="Why it is still spreading">'
      +     OPTS.map(function(o){ return optHTML(o); }).join("")
      +   "</div>"
      +   '<div class="panel" id="panel" tabindex="-1" aria-live="polite"></div>'
      + "</div>";
    paintPanel(false);
    Array.prototype.forEach.call(el.board.querySelectorAll("button.opt"), function(b){
      b.addEventListener("click", function(){ choose(b.dataset.o); });
    });
  }
  function optHTML(o){
    var mine = st.pick === o.id, read = !!st.read[o.id], cur = st.cur === o.id;
    var cls = "opt" + (mine ? " mine" : read ? " read" : "") + (cur ? " cur" : "");
    var g = mine ? icon(o.id === ANSWER ? "check" : "x") : (read ? icon("eye") : "");
    var lb = "";
    if(st.pick && o.id === ANSWER) lb = '<span class="lb" aria-hidden="true">' + (mine ? "Right" : "The answer") + "</span>";
    else if(mine) lb = '<span class="lb" aria-hidden="true">Your pick</span>';
    var state = mine ? (o.id === ANSWER ? "Your pick. This is the answer." : "Your pick. Not the answer.")
      : (st.pick && o.id === ANSWER) ? "The answer." : read ? "Reply read." : "Not chosen.";
    return '<button class="' + cls + '" type="button" data-o="' + o.id + '" aria-pressed="' + mine + '">'
      + '<span class="oi">' + icon(o.ic) + "</span>"
      + '<span class="ot"><span class="on">' + esc(o.name) + '</span><span class="od">' + esc(o.def) + "</span></span>"
      + '<span class="mk"><span class="g" aria-hidden="true">' + g + "</span>" + lb + "</span>"
      + '<span class="sr">' + state + "</span>"
      + "</button>";
  }
  function paintPanel(animate){
    var p = el.board.querySelector("#panel");
    if(!p) return;
    if(!st.pick){
      p.className = "panel empty";
      p.innerHTML = '<p class="pe"><b>Nobody has run anything since day 1</b>, yet the count keeps climbing.</p><p class="pe">Nothing is chosen yet. Pick the one reason on the left you think explains it.</p>';
      return;
    }
    var o = opt(st.cur || st.pick);
    var mine = o.id === st.pick;
    var right = o.id === ANSWER;
    p.className = "panel";
    p.innerHTML = '<div class="ph">' + icon(o.ic) + '<span class="pt">' + esc(o.name) + "</span></div>"
      + '<div class="tags">'
      +   '<span class="tag">' + (mine ? icon(right ? "check" : "x") + "Your pick" : icon("eye") + "Another option") + "</span>"
      +   '<span class="tag">' + icon(right ? "check" : (o.trap ? "warn" : "x")) + esc(o.trap ? "Not this one: the trap" : o.verdict) + "</span>"
      + "</div>"
      + replyOf(o).map(function(t){ return '<p class="rp">' + esc(t) + "</p>"; }).join("")
      + (mine ? "" : '<p class="more">Your pick is still: <b>' + esc(opt(st.pick).name) + "</b>.</p>");
    if(animate && !reduce){ p.classList.remove("in"); void p.offsetWidth; p.classList.add("in"); }
  }
  /* "Yes." only opens the answer's reply when it is the student's own pick. */
  function replyOf(o){
    var r = o.reply.slice();
    if(o.id === ANSWER && o.id === st.pick) r[0] = "Yes. " + r[0];
    return r;
  }
  function choose(id){
    var o = opt(id);
    if(!o) return;
    var first = !st.pick;
    if(first) st.pick = id;
    st.read[id] = 1;
    st.cur = id;
    save(st);
    Array.prototype.forEach.call(el.board.querySelectorAll("button.opt"), function(b){
      var tmp = document.createElement("div");
      tmp.innerHTML = optHTML(opt(b.dataset.o));
      var nb = tmp.firstChild;
      b.className = nb.className;
      b.setAttribute("aria-pressed", nb.getAttribute("aria-pressed"));
      b.innerHTML = nb.innerHTML;
    });
    paintPanel(true);
    header();
    say((first ? "Your pick: " : "Another option: ") + o.name + ". "
      + (o.id === ANSWER ? "This is the answer. " : "Not this one. ") + replyOf(o).join(" "));
    if(window.matchMedia("(max-width:599px)").matches){
      var pn = el.board.querySelector("#panel");
      if(pn){ pn.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"}); pn.focus({preventScroll:true}); }
    }
  }

  /* Slide 3: the causal chain, told plainly. Days 11 and 12 stay on the page. */
  function renderClose(){
    var mine = st.pick ? opt(st.pick) : null;
    var line;
    if(!mine) line = icon("question") + "<span>You did not pick one. You can go back and choose before you read this.</span>";
    else if(mine.id === ANSWER) line = icon("check") + "<span>Your pick: <b>" + esc(mine.name) + "</b>. That is the answer.</span>";
    else line = icon("x") + "<span>Your pick: <b>" + esc(mine.name) + "</b>. The answer: <b>" + esc(opt(ANSWER).name) + "</b>.</span>";
    el.board.innerHTML = '<div class="closewrap">'
      + '<p class="yours">' + line + "</p>"
      + '<div class="chain">'
      +   '<div class="link"><div class="lh"><span class="bi">' + icon("script") + '</span><span class="when">Day 1</span></div>'
      +     "<p>The script switches off <b>a component the antivirus depended on</b>, a part it needs in order to work. Nothing looks wrong.</p></div>"
      +   '<div class="arrow">' + icon("right") + "</div>"
      +   '<div class="link"><div class="lh"><span class="bi">' + icon("power") + '</span><span class="when">Days later</span></div>'
      +     "<p>A machine <b>restarts</b>: it is turned off and on again. Each machine does this on its own day.</p></div>"
      +   '<div class="arrow">' + icon("right") + "</div>"
      +   '<div class="link"><div class="lh"><span class="bi">' + icon("shieldx") + '</span><span class="when">Straight after</span></div>'
      +     "<p>That machine's antivirus <b>stops working</b>. The count goes up by one.</p></div>"
      + "</div>"
      + '<div class="statement"><p>The damage spread at the speed people restarted their computers.</p>'
      +   "<p>That explains the shape of the count: 3, then 10, then 40, with nothing new run. It is also what made the cause so hard to see: the damage showed up days after the script ran, on machines nobody had touched.</p></div>"
      + "</div>";
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){
    if(i === S.length-1){ st = fresh(); save(st); i = 0; render(); el.frame.focus(); say("Started again. Slide 1 of " + S.length + "."); return; }
    go(1);
  });

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled && i < S.length-1) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled && i < S.length-1) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    state:function(){ return { i:i, shown:st.shown, pick:st.pick, read:st.read, cur:st.cur }; }
  };
})();
</script>
</body>
</html>
