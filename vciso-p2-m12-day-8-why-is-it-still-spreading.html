    el.next.textContent = "Continue";
    el.next.disabled = false;
    el.hint.textContent = "";
    if(i === S.length-1){ el.next.textContent = "Start again"; el.hint.textContent = "That is the end. Start again clears your answers."; }
    else if(s.kind === "pick" && !st.done){
      el.next.disabled = true;
      el.hint.textContent = st.out.length ? "Try another answer to carry on." : "Pick one reason to carry on.";
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    document.documentElement.classList.add("fresh");
    var s = S[i];
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);

    if(s.kind === "pick") renderPick();
    else renderClose();

    header();
    say("Slide " + (i+1) + " of " + S.length + ". " + s.h1 + ".");
  }

  /* Slide 1: four options, none chosen on arrival. */
  function renderPick(){
    el.board.innerHTML =
        '<div class="pick">'
      +   '<div class="opts" role="group" aria-label="Why it is still spreading">'
      +     OPTS.map(optHTML).join("")
      +   "</div>"
      +   '<div class="panel" id="panel" tabindex="-1"></div>'
      + "</div>";
    paintPanel(false);
    Array.prototype.forEach.call(el.board.querySelectorAll("button.opt:not(:disabled)"), function(b){
      b.addEventListener("click", function(){ choose(b.dataset.o); });
    });
  }
  /* The look of one option: ok (green), no (red), idle (finished, not picked) or open. */
  function stateOf(o){
    if(o.id === ANSWER && st.done) return { cls:"ok", ico:"check", tag: st.done === "right" ? "Right" : "Right answer" };
    if(st.out.indexOf(o.id) >= 0) return { cls:"no", ico:"x", tag:"Not quite" };
    if(st.done) return { cls:"idle", ico:"", tag:"" };
    return { cls:"", ico:"", tag:"" };
  }
  function optHTML(o){
    var s = stateOf(o);
    var off = !!(s.cls);
    var sr = s.cls === "ok" ? (st.done === "right" ? "Right. You picked this one." : "Right answer.")
      : s.cls === "no" ? "Not quite. You picked this one." : s.cls === "idle" ? "Not picked." : "";
    return '<button class="opt' + (s.cls ? " " + s.cls : "") + '" type="button" data-o="' + o.id + '"'
      + (off ? ' disabled aria-disabled="true"' : "") + ">"
      + '<span class="oi">' + icon(o.ic) + "</span>"
      + '<span class="ot"><span class="on">' + esc(o.name) + '</span><span class="od">' + esc(o.def) + "</span></span>"
      + '<span class="mk"><span class="g" aria-hidden="true">' + (s.ico ? icon(s.ico) : "") + "</span>"
      +   (s.tag ? '<span class="lb" aria-hidden="true">' + s.tag + "</span>" : "") + "</span>"
      + (sr ? '<span class="sr">' + sr + "</span>" : "")
      + "</button>";
  }
  /* The right side: nothing picked, the latest wrong pick, or the right pick. */
  function paintPanel(animate){
    var p = el.board.querySelector("#panel");
    if(!p) return;
    p.classList.remove("tight");
    if(!st.out.length && !st.done){
      p.className = "panel empty";
      p.innerHTML = '<p class="pe"><b>Nobody has run anything since day 1</b>, yet the number of machines with no working antivirus keeps climbing.</p>'
        + '<p class="pe">Pick the one reason that you think explains it.</p>'
        + '<p class="pe">If you pick a wrong answer, you can try again. After two wrong tries, we show you the right one.</p>';
      return;
    }
    var good = st.done === "right";
    var o = good ? opt(ANSWER) : opt(st.out[st.out.length-1]);
    var r = o.reply.slice();
    if(good) r[0] = "Yes. " + r[0];
    p.className = "panel " + (good ? "ok" : "no");
    p.innerHTML = '<span class="fh">' + icon(good ? "okc" : "noc") + (good ? "Right" : "Not quite") + "</span>"
      + '<span class="pt">' + esc(o.name) + "</span>"
      + r.map(function(t){ return '<p class="rp">' + esc(t) + "</p>"; }).join("")
      + (good ? "" : '<p class="nx">' + esc(st.done === "shown" ? SHOWN : AGAIN) + "</p>");
    if(!phone() && p.scrollHeight > p.clientHeight + 1) p.classList.add("tight");
    if(animate && !reduce){ p.classList.remove("in"); void p.offsetWidth; p.classList.add("in"); }
  }
  function choose(id){
    document.documentElement.classList.add("fresh");
    var o = opt(id);
    if(!o || st.done || st.out.indexOf(id) >= 0) return;
    if(id === ANSWER) st.done = "right";
    else {
      st.out.push(id);
      if(st.out.length >= MAXWRONG) st.done = "shown";
    }
    save(st);
    renderPick();
    paintPanel(true);
    header();
    var p = el.board.querySelector("#panel");
    if(p) say(Array.prototype.map.call(p.querySelectorAll(".fh,.pt,p"), function(n){
      return n.textContent.replace(/\s*$/, "").replace(/([^.])$/, "$1.");
    }).join(" "));
    var ph = phone();
    var fo = ph ? { preventScroll:true } : undefined;
    if(st.done) el.next.focus(fo);
    else if(p) p.focus(fo);
    if(ph && p) p.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"});
  }

  /* Slide 2: the causal chain, told plainly. Days 11 and 12 stay on the page. */
  function renderClose(){
    var a = opt(ANSWER), line;
    if(!st.done) line = icon("question") + "<span>You did not pick one. You can go back and choose before you read this.</span>";
    else if(st.done === "right" && !st.out.length) line = icon("check") + "<span>You picked <b>" + esc(a.name) + "</b>. That is the right answer.</span>";
    else if(st.done === "right") line = icon("check") + "<span>You got there on your second try: <b>" + esc(a.name) + "</b> is the right answer.</span>";
    else line = icon("info") + "<span>The right answer is <b>" + esc(a.name) + "</b>.</span>";
    el.board.innerHTML = '<div class="closewrap">'
      + '<p class="yours">' + line + "</p>"
      + '<div class="chain">'
      +   '<div class="link"><div class="lh"><span class="bi">' + icon("script") + '</span><span class="when">Day 1</span></div>'
      +     "<p>The script switches off <b>a component the antivirus depended on</b>, a part it needs in order to work. Nothing looks wrong.</p></div>"
      +   '<div class="arrow">' + icon("right") + "</div>"
      +   '<div class="link"><div class="lh"><span class="bi">' + icon("power") + '</span><span class="when">Days later</span></div>'
      +     "<p>A machine <b>restarts</b>: it is turned off and on again. Each machine does this on its own day.</p></div>"
      +   '<div class="arrow">' + icon("right") + "</div>"
      +   '<div class="link"><div class="lh"><span class="bi">' + icon("shieldx") + '</span><span class="when">Straight after</span></div>'
      +     "<p>That machine's antivirus <b>stops working</b>. The count goes up by one.</p></div>"
      + "</div>"
      + '<div class="statement"><p>The damage spread at the speed people restarted their computers.</p>'
      +   "<p>That explains the shape of the count: 3, then 10, then 40, with nothing new run. It is also what made the cause so hard to see: the damage showed up days after the script ran, on machines nobody had touched since day 1.</p></div>"
      + "</div>";
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(); if(phone()) window.scrollTo(0,0); el.frame.focus({preventScroll:true});
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){
    if(i === S.length-1){ st = fresh(); save(st); i = 0; render(); if(phone()) window.scrollTo(0,0); el.frame.focus({preventScroll:true}); say("Started again. Slide 1 of " + S.length + "."); return; }
    go(1);
  });

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled && i < S.length-1) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }

  /* A cursor resting where new content lands must not tint an option (as in m11). */
  var lastPt = null;
  document.addEventListener("pointermove", function(e){
    var pt = e.clientX + "," + e.clientY;
    if(lastPt !== null && pt !== lastPt) document.documentElement.classList.remove("fresh");
    lastPt = pt;
  }, true);

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled && i < S.length-1) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    state:function(){ return { i:i, out:st.out.slice(), done:st.done }; }
  };
})();
</script>
</body>
</html>
