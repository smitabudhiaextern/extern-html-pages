<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optional Reading Topics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Optional Reading for Project 3, module 2 (Know How
   Python Libraries Turn Documents into AI-Ready Data): one topic as a toggle. The closed toggle shows a
   statement title and a "Read this if..." hint so the student can choose.
   The toggle copies the shape, spacing, header layout, chevron and open and close behaviour of the
   frozen template accordions (same build as the Project 1 Optional Reading embeds); its colours come only
   from this design system's tokens.
   Fixed stage: laid out once on a 760 x 700 design stage (set the Notion embed height to 700 px), then
   scaled as one piece to fit the embed frame and centred. Nothing scrolls. The topic is one continuous
   piece of text (the old course text, kept close to its words). */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff;
  --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --stage-w:760px; --stage-h:700px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;overflow:hidden;background:var(--surface);padding:16px 20px}

/* Accordion: the shape, spacing, header layout and chevron of the frozen template accordions
   (one bordered box, hairlines between items, title left and chevron right), in this design system's colours. */
.toggles{max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.item{flex:none;display:flex;flex-direction:column;min-height:0}
.item+.item{border-top:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;margin:0;border:0;background:none;text-align:left;cursor:pointer;padding:18px 20px;transition:background-color .15s ease}
.head:hover{background:var(--surface-card)}
.head:focus-visible{outline-offset:-2px;border-radius:0}
.ht{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{margin:0;font-family:var(--font-text);font-size:16px;font-weight:600;line-height:1.45;color:var(--ink)}
.hint{font-size:14px;line-height:1.45;color:var(--ink-muted)}
.chev{flex:none;width:20px;height:20px;color:var(--gray-600);transition:transform .2s ease}
.item.open .chev{transform:rotate(180deg)}

/* The open topic's reading area: one continuous piece */
.body{display:none}
.item.open .body{display:block}
.pane{padding:2px 20px 18px;display:flex;flex-direction:column;gap:12px}
.pane p{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty}
.pane b{font-weight:600;color:var(--ink)}
.pane ul{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:8px}
.pane li{font-size:15.5px;line-height:1.55;color:var(--ink-muted);padding-left:2px;text-wrap:pretty}
.pane li::marker{color:var(--step-label)}

/* Tip callout, built from the design system's tokens (pale-blue card, Pfizer blue icon in a white square) */
.tip{display:flex;gap:14px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:14px 16px;margin-top:2px}
.tip-icon{flex:none;width:34px;height:34px;border-radius:var(--radius-xs);background:var(--extern-white);display:flex;align-items:center;justify-content:center;color:var(--pfizer-blue)}
.tip-icon svg{width:20px;height:20px}
.tip-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
.tip-text p{color:var(--card-text);font-size:15px}
@media (prefers-reduced-motion:no-preference){ .pane.anim{animation:in .22s ease} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
@media (prefers-reduced-motion:reduce){ .chev,.head{transition:none} }
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="Optional reading: one topic. Open it to read."><div class="toggles" id="toggles"></div></div>

<script>
(function () {
  "use strict";
  var CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5.5 7.75 4.5 4.5 4.5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var BULB = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* The old course text, used word for word as Smita approved it. */
  var TOPICS = [
    { title: "Here's why every AI model loves bounding boxes (and you should too)",
      hint: "Read this if you're curious how AI tools use bounding boxes.",
      body:
        '<p>Modern AI models, like Microsoft\'s LayoutLM, don\'t just read the text in a document. They also look at where each piece of text appears. LayoutLM is an AI model that learns from both the words on a page and their bounding boxes. This spatial awareness, knowing where things sit on the page, helps them understand the structure of the document, not just its content.</p>' +
        '<p>Bounding boxes play a key role in this by allowing AI to:</p>' +
        '<ul>' +
          '<li><b>Match labels with the right values</b>, like connecting "Date of Manufacture:" with "20240315" on page 3 of the supplier file, even if they\'re not directly next to each other in the extracted text.</li>' +
          '<li><b>Understand tables and columns</b> by recognizing how data is organized visually on the page.</li>' +
          '<li><b>Work with semi-structured documents</b>, where the layout varies from one page to another. A semi-structured document has some order, like labels and headings, but no fixed layout.</li>' +
        '</ul>' +
        '<div class="tip"><span class="tip-icon">' + BULB + '</span><div class="tip-text">' +
          '<p>Did you know that bounding boxes aren\'t just for text? They can also identify images, logos and handwritten notes, helping AI systems understand what they "see."</p>' +
          '<p>For example, when you deposit a check using your phone, bounding boxes help the app locate the amount and the signature, so it knows exactly what to process.</p>' +
        '</div></div>' }
  ];

  var app = document.getElementById("app"), list = document.getElementById("toggles");
  var open = -1;

  TOPICS.forEach(function (tp, n) {
    var item = document.createElement("div");
    item.className = "item";
    item.innerHTML =
      '<button type="button" class="head" id="h' + n + '" aria-expanded="false" aria-controls="b' + n + '">' +
        '<span class="ht"><span class="t">' + tp.title + '</span><span class="hint">' + tp.hint + '</span></span>' +
        CHEV +
      '</button>' +
      '<div class="body" id="b' + n + '" role="region" aria-labelledby="h' + n + '">' +
        '<div class="pane"></div>' +
      '</div>';
    item.querySelector(".head").addEventListener("click", function () { toggle(n); });
    list.appendChild(item);
  });

  function toggle(n) {
    open = open === n ? -1 : n;
    Array.prototype.forEach.call(list.children, function (item, k) {
      var on = k === open, pane = item.querySelector(".pane");
      item.classList.toggle("open", on);
      item.querySelector(".head").setAttribute("aria-expanded", on ? "true" : "false");
      pane.className = "pane" + (on ? " anim" : "");
      pane.innerHTML = on ? TOPICS[k].body : "";
    });
  }

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  /* Test hook: open the topic directly, for example #open=1. */
  var m = location.hash.match(/open=(\d)/);
  if (m) toggle(+m[1] - 1);
})();
</script>
</body>
</html>
