<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Essentials Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Card player copied from project-03/pfizer3-p3-m5-learn.html
   (rail on top, one card at a time, Back and Next below; code has a Copy button, output has none).
   "Your guess" blocks copied from project-01/pfizer3-p1-m3-concepts.html.
   The rail groups the 27 cards into the reading's 5 parts, so the labels stay readable.
   P2 module 1 Learn cards: "Know the Python Essentials" (27 cards). Revised 10 Nov 2026 (M1-REVISION.md): type conversion,
   reassigning a variable, the True/"True"/true trap, comparing text without capitals, split("-") and the SME's "where you'll
   use this" lines added from Chaitanya's (SME) Variables and Strings lessons; [::-1], startswith()/endswith() and join() moved
   to Optional Reading.
   Fixed stage: laid out once on a 760 x 880 design stage (set the Notion embed height to 880 px), then scaled as one piece
   to fit the embed frame and centred. Nothing scrolls, and Back and Next never move.
   Every output is the real output of the code on the card, run in Python 3.12.14 and 3.13.15 in card order (so variables
   carry over from card to card, as in a notebook). Old course text (the old "Know the Python Essentials" page, the old
   Data Structures notebook and the old Text Cleaning pages) is kept word for word, with only mistakes fixed. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600); --icon:var(--extern-black); --connector:var(--extern-black);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --space-1:4px; --space-2:8px; --space-3:14px; --space-4:18px; --space-5:26px; --space-6:40px; --space-7:56px;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage-w:760px; --stage-h:880px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* The design stage. JavaScript sets the scale and position; until it runs, the stage sits at full size. */
.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Rail: the 4 parts of the reading, each with one segment per card */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:end}
.where{min-width:94px;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:12px;min-width:0}
.grp{min-width:0;display:flex;flex-direction:column;gap:4px}
.grp-label{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp.is-cur .grp-label{color:var(--ink);font-weight:600}
.segs{display:flex;gap:3px}
.pg{flex:1 1 0;min-width:0;background:none;border:0;padding:5px 0;margin:0;cursor:pointer;border-radius:3px}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:20px 28px;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.inner{display:flex;flex-direction:column;gap:14px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:2px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty;max-width:70ch}
.p b{font-weight:600;color:var(--ink)}
.p code,.tile p code,.tile h3 code,.fact code,.bul code,.reveal code,.guess-q code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink);white-space:nowrap}
.tile p code,.tile h3 code{background:var(--surface-icon)}

/* Tiles on surface-card */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface-card);border-radius:var(--radius-md);padding:14px 18px;min-width:0;display:flex;flex-direction:column;gap:6px}
.tile h3{margin:0;font-size:17px;line-height:1.3;font-weight:600;color:var(--card-title)}
.tile p{margin:0;font-size:15px;line-height:1.5;color:var(--card-text)}
.tile b{font-weight:600;color:var(--card-title)}

.fact{border:1.5px solid var(--ink);border-radius:var(--radius-md);padding:12px 18px}
.fact .num{display:block;margin-bottom:4px;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.fact p{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-muted)}
.fact b{font-weight:600;color:var(--ink)}

/* Bullets */
.bul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.bul li{font-size:15.5px;line-height:1.5;color:var(--ink-muted)}
.bul b{font-weight:600;color:var(--ink)}

/* Two columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-3);align-items:start}
.cols > div{display:flex;flex-direction:column;gap:10px;min-width:0}

/* Positions of each character, for the indexing card */
.chars{display:grid;grid-template-columns:auto repeat(13,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-icon)}
.chars span{padding:5px 0;text-align:center;font-family:var(--font-mono);font-size:14px;line-height:1.3;color:var(--ink);border-left:1px solid var(--line)}
.chars .rh{padding:5px 10px;text-align:left;font-family:var(--font-text);font-size:12px;font-weight:600;color:var(--ink-muted);border-left:0;background:var(--gray-50);white-space:nowrap}
.chars .ch{font-size:17px;font-weight:600;background:var(--surface-card)}
.chars .ix{color:var(--step-label);font-size:13px}
.chars .row2{border-top:1px solid var(--line)}
.cap{margin:0;font-size:13px;line-height:1.4;color:var(--gray-600)}

/* Code block with a Copy button; output blocks have no Copy button */
.run{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-icon)}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:5px 8px 5px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:9px 14px;font-family:var(--font-mono);font-size:13.5px;line-height:1.5;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit;white-space:inherit;background:none;padding:0;border-radius:0}
.run.out{border-color:var(--blue-200)}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);white-space:pre-wrap;overflow-wrap:anywhere}
.run.out pre .ln{display:block;padding-left:2ch;text-indent:-2ch}
.run.err{border-color:var(--ink)}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:4px 10px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}

/* Your guess (from pfizer3-p1-m3-concepts.html) */
.guess{background:var(--surface-card);border-radius:var(--radius-sm);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.guess-q{margin:0;font-size:15.5px;line-height:1.45;font-weight:600;color:var(--ink)}
.guess-q code{background:var(--surface-icon)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:9px 16px;font-size:15px;line-height:1.2;font-weight:600;cursor:pointer;font-family:var(--font-text)}
.opt.mono{font-family:var(--font-mono);font-size:14px}
.opt[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.reveal{margin:0;display:flex;flex-direction:column;gap:10px}
.reveal[hidden]{display:none}
.reveal .say{margin:0;padding:10px 14px;border-left:3px solid var(--pfizer-blue);background:var(--surface);border-radius:0 var(--radius-xs) var(--radius-xs) 0;font-size:15px;line-height:1.5;color:var(--ink)}
.reveal .say b{font-weight:600}
.reveal .say code{background:var(--gray-50)}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="Know the Python essentials: 27 cards">
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where"><span id="where-count">Card 1 of 27</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Card"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-next" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var IC_COPY = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5V3.3c0-.7-.6-1.3-1.3-1.3H3.8c-.7 0-1.3.6-1.3 1.3v5.4c0 .7.6 1.3 1.3 1.3H4" stroke="currentColor" stroke-width="1.4"/></svg>';

  function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  /* py(): a code block with a Copy button. out(): an output block, with no Copy button. */
  function py(text) {
    return '<figure class="run"><div class="code-head"><span class="code-lang">Python</span>' +
      '<button type="button" class="copy" data-copy aria-label="Copy Python code">' + IC_COPY + '<span>Copy</span></button></div>' +
      '<pre tabindex="0"><code>' + esc(text) + '</code></pre></figure>';
  }
  function out(text, label, extra) {
    return '<figure class="run out' + (extra ? ' ' + extra : '') + '"><div class="code-head"><span class="code-lang">' + (label || "Output") + '</span></div>' +
      '<pre tabindex="0"><code>' + text.split("\n").map(function (l) { return '<span class="ln">' + (l ? esc(l) : ' ') + '</span>'; }).join("") + '</code></pre></figure>';
  }
  function cols(a, b, w) { return '<div class="cols"' + (w ? ' style="grid-template-columns:' + w + '"' : '') + '><div>' + a + '</div><div>' + b + '</div></div>'; }

  /* The positions of each character in "Hello, world!" */
  function charsGrid() {
    var s = "Hello, world!", h = '<div class="chars" role="img" aria-label="Hello, world! has 13 characters. Counting from the start, H is position 0 and ! is position 12. Counting from the end, ! is position -1 and H is position -13.">';
    h += '<span class="rh">Character</span>';
    for (var k = 0; k < s.length; k++) h += '<span class="ch">' + (s[k] === " " ? "&#9251;" : esc(s[k])) + '</span>';
    h += '<span class="rh row2">Position</span>';
    for (k = 0; k < s.length; k++) h += '<span class="ix row2">' + k + '</span>';
    h += '<span class="rh row2">From the end</span>';
    for (k = 0; k < s.length; k++) h += '<span class="ix row2">' + (k - s.length) + '</span>';
    return h + '</div>';
  }

  var GROUPS = [
    { name: "Variables", n: 3 },
    { name: "Data Types", n: 8 },
    { name: "f-Strings", n: 6 },
    { name: "String Methods", n: 6 },
    { name: "Slicing", n: 4 }
  ];

  var CARDS = [
    /* ---------- Part 1: Variables ---------- */
    { short: "Grammar", eyebrow: "Basic Python grammar",
      html: `<h2 class="title">Python Has Its Own <span class="hl">Grammar</span></h2>
        <p class="p">Python is a programming language, and like all languages, it has its own grammar. The grammar of Python will obviously differ from that of the English language, but it serves a similar purpose: it helps you construct a sentence, or in this case, code.</p>
        <p class="p">A <b>programming language</b> is a set of words and rules for giving a computer instructions. <b>Code</b> is the instructions you write in it. When you <b>run</b> code, the computer carries out each line, from the top down.</p>
        <p class="p">On every card, you'll see a few lines of code, then exactly what Python prints when you run them. Here's the shortest program there is:</p>
        ${cols(py(`print("Hello, World!")`), out(`Hello, World!`))}
        <p class="p"><code>print()</code> shows whatever is inside its round brackets, under the code. The quotes are not printed: they only tell Python where the text starts and ends.</p>` },

    { short: "Variables", eyebrow: "Variables",
      html: `<h2 class="title">Variables Store Your <span class="hl">Data</span></h2>
        <p class="p">Think of variables as containers storing data that your program can later retrieve, manipulate, or change. In Python, using variables is straightforward because Python is dynamically typed, which means you don't need to declare the type of variable ahead of time. Simply assign a value to a variable, and Python will automatically handle the rest.</p>
        <ul class="bul">
          <li>To <b>assign</b> a value is to put it in a variable with the <code>=</code> sign: the variable's name on the left, the value on the right.</li>
          <li>To <b>declare</b> a type is to tell the computer ahead of time what kind of value a variable will hold. Some languages make you do this. Python doesn't.</li>
          <li>Lines that start with <code>#</code> are <b>comments</b>: notes for people, which Python skips. Here they name each value's type: an <b>integer</b> is a whole number, a <b>floating point</b> number has a decimal point, and a <b>string</b> is text in quotes.</li>
        </ul>
        ${cols(py(`# An integer assignment
age = 45

# A floating point
salary = 1456.8

# A string
name = "John"

print(age)
print(salary)
print(name)`), out(`45
1456.8
John`), "minmax(0,1fr) 200px")}` },

    { short: "print()", eyebrow: "The print function",
      html: `<h2 class="title">The print() Function Shows Your <span class="hl">Results</span></h2>
        <p class="p">In Python programming, the <b>print function</b> (a <b>function</b> is a named command that does one job) is your primary means of interaction with the outside world. The <code>print()</code> function is used to output data to the screen. It allows you to display information to the user, whether it's the results of a calculation, error messages, or simple messages to guide the user. This tool is invaluable for debugging (finding and fixing mistakes in code): when something goes wrong, you can print out variables and messages to help track down issues. Imagine creating a user-friendly application where you provide real-time feedback to users; the print function makes this possible.</p>
        ${cols(py(`# The print function
name = "Alice"
age = 25
print("Name:", name)
print("Age:", age)
print("Hello, World!")`), out(`Name: Alice
Age: 25
Hello, World!`), "minmax(0,1fr) 200px")}
        <p class="p"><b>Explanation:</b></p>
        <ul class="bul">
          <li><code>print("Name:", name)</code>: Prints the string <code>"Name:"</code> followed by the value of the variable <code>name</code>. The comma between them prints as a space.</li>
          <li><code>print("Age:", age)</code>: Prints the string <code>"Age:"</code> followed by the value of the variable <code>age</code>.</li>
          <li><code>print("Hello, World!")</code>: Prints the string <code>"Hello, World!"</code>.</li>
        </ul>` },

    /* ---------- Part 2: Data types ---------- */
    { short: "Data types", eyebrow: "Data types",
      html: `<h2 class="title">Every Value Has a Data <span class="hl">Type</span></h2>
        <p class="p">Now that you have your variables, it's important to know what kind of data you're dealing with. Just like characters in a story can be heroes, villains, or sidekicks, data comes in various forms, known as <b>data types</b>. Knowing whether a piece of information is an integer (a whole number), a string (text), or a boolean (<code>True</code> or <code>False</code>) is essential because it dictates what you can do with that data. For example, you can perform arithmetic operations (math, like subtracting or dividing) on integers but not on strings. Python's ability to handle different data types easily allows you to build more complex and versatile applications.</p>
        <p class="p">Python supports several data types. Here are some common ones:</p>
        <div class="tiles">
          <div class="tile"><h3>Integer</h3><p>Whole numbers, including negative numbers and zero (e.g., <code>5</code>, <code>100</code>, <code>-2</code>)</p></div>
          <div class="tile"><h3>Float</h3><p>Decimal numbers (e.g., <code>5.5</code>, <code>3.14</code>)</p></div>
          <div class="tile"><h3>String</h3><p>A sequence of characters: letters, digits, spaces or symbols, inside quotes (e.g., <code>"Hello"</code>, <code>"Python"</code>)</p></div>
          <div class="tile"><h3>Boolean</h3><p>True or False values (e.g., <code>True</code>, <code>False</code>)</p></div>
        </div>` },

    { short: "type()", eyebrow: "Checking a type",
      html: `<h2 class="title">Ask Python for the <span class="hl">Type</span></h2>
        <p class="p"><b>Example:</b></p>
        ${cols(py(`# Different data types
a = 10          # Integer
b = 20.5        # Float
c = "Python"    # String
d = True        # Boolean
print(type(a))  # <class 'int'>
print(type(b))  # <class 'float'>
print(type(c))  # <class 'str'>
print(type(d))  # <class 'bool'>`), out(`<class 'int'>
<class 'float'>
<class 'str'>
<class 'bool'>`), "minmax(0,1fr) 190px")}
        <p class="p"><b>Explanation:</b></p>
        <ul class="bul">
          <li><code>type(variable)</code>: This function returns the type of the variable.</li>
          <li>A <b>function</b> is a named command that does one job. You use it by writing its name, then round brackets with a value inside. <b>Returns</b> means it hands back an answer, which <code>print()</code> then shows.</li>
          <li>In the output, <code>int</code> is short for integer, <code>str</code> for string and <code>bool</code> for boolean.</li>
        </ul>` },

    { short: "Change a value", eyebrow: "Changing a variable",
      html: `<h2 class="title">Assign Again to Change a <span class="hl">Value</span></h2>
        <p class="p">A variable can change while your code runs. That's why it's called a variable: its value can vary.</p>
        <p class="p">Say your code is looking for a date on a page. At the start, it hasn't found one, so <code>date_found</code> is <code>False</code>. Once it finds the date, you set <code>date_found</code> to <code>True</code>.</p>
        ${cols(py(`date_found = False
print(date_found)
date_found = True
print(date_found)`), out(`False
True`), "minmax(0,1fr) 200px")}
        <p class="p">Assigning again replaces the old value. The variable keeps the newest one, and the old <code>False</code> is gone.</p>` },

    { short: "True, not \"True\"", eyebrow: "Watch out",
      html: `<h2 class="title">True Needs a Capital T and No <span class="hl">Quotes</span></h2>
        <p class="p">A boolean is written <code>True</code> or <code>False</code>: a capital first letter, and no quotes. Two small slips turn it into something else.</p>
        <p class="p"><b>Slip 1: quotes.</b> Inside quotes, <code>"True"</code> is just four letters of text: a str, not a bool.</p>
        ${cols(py(`print(type(True))
print(type("True"))`), out(`<class 'bool'>
<class 'str'>`), "minmax(0,1fr) 200px")}
        <p class="p"><b>Slip 2: a small t.</b> Python reads <code>true</code> as the name of a variable. No variable has that name, so the code stops with an <b>error</b>: a message from Python that it couldn't run a line.</p>
        ${py(`date_found = true`)}
        ${out(`NameError: name 'true' is not defined`, "Output: the last line of the error")}
        <p class="p">You'll learn to read error messages like this one later in this step.</p>` },

    { short: "Lot number", eyebrow: "Your guess",
      html: `<h2 class="title">Is a Lot Number a Number or a <span class="hl">String</span>?</h2>
        <p class="p">Page 2 of the supplier file you opened in Project 1 has a <b>lot number</b>: 17242818. A lot number is the ID a supplier gives one batch of a product. Here it is twice: once without quotes, and once inside quotes.</p>
        ${py(`print(type(17242818))
print(type("17242818"))`)}
        <div class="guess" data-guess>
          <p class="guess-q">Your guess: what type does the second line print?</p>
          <div class="opts"><button type="button" class="opt" data-opt="int" aria-pressed="false">int</button><button type="button" class="opt" data-opt="str" aria-pressed="false">str</button></div>
          <div class="reveal" data-reveal hidden></div>
        </div>`,
      reveal: (function () {
        var o = out(`<class 'int'>
<class 'str'>`);
        var why = ' Quotes make any value a string, even if it is all digits. We keep lot numbers as strings, because they are labels, not amounts: you never add two lot numbers together. And some have letters, like <code>12657788Q0</code> in the 39-page file from your Project 1 Task.';
        return {
          str: o + '<p class="say"><b>You guessed right: it\'s a string.</b>' + why + '</p>',
          int: o + '<p class="say"><b>Good guess, but it\'s a string.</b>' + why + '</p>'
        };
      })() },

    { short: "Add or glue", eyebrow: "Your guess",
      html: `<h2 class="title">Does + Add or <span class="hl">Glue</span>?</h2>
        <p class="p">These two lines look almost the same. The first adds two numbers. The second uses the same digits, but inside quotes, so they are strings.</p>
        ${py(`print(14 + 1)
print("14" + "1")`)}
        <div class="guess" data-guess>
          <p class="guess-q">Your guess: what does the second line print?</p>
          <div class="opts"><button type="button" class="opt mono" data-opt="15" aria-pressed="false">15</button><button type="button" class="opt mono" data-opt="141" aria-pressed="false">141</button></div>
          <div class="reveal" data-reveal hidden></div>
        </div>`,
      reveal: (function () {
        var o = out(`15
141`);
        var why = ' With numbers, <code>+</code> adds. With text, <code>+</code> glues the pieces together, so <code>"14" + "1"</code> gives <code>"141"</code>. The type decides what <code>+</code> does.';
        return {
          "141": o + '<p class="say"><b>You guessed right.</b>' + why + '</p>',
          "15": o + '<p class="say"><b>Good guess, but it\'s 141.</b>' + why + '</p>'
        };
      })() },

    { short: "int(), str(), float()", eyebrow: "Type conversion",
      html: `<h2 class="title">int(), str() and float() Change a Value's <span class="hl">Type</span></h2>
        <p class="p">Text that looks like a number is still text, and Python won't do math with it. Add a number to it, and the code stops with an error. Its name, <b>TypeError</b>, says the two types don't fit together. (<b>Concatenate</b> means glue together.)</p>
        ${py(`print("14" + 1)`)}
        ${out(`TypeError: can only concatenate str (not "int") to str`, "Output: the last line of the error")}
        <p class="p">The fix is to <b>convert</b> the value: change it from one type into another.</p>
        ${cols(py(`pages_text = "14"
page_count = int(pages_text)
print(page_count + 1)
print("Pages: " + str(page_count))
print(float("2.5") + 1)`), out(`15
Pages: 14
3.5`), "minmax(0,1fr) 180px")}
        <ul class="bul">
          <li><code>int()</code> turns text into a whole number, so <code>page_count + 1</code> gives 15.</li>
          <li><code>str()</code> turns a number back into text, so it can be glued to <code>"Pages: "</code>.</li>
          <li><code>float()</code> works the same way for decimals: <code>"2.5"</code> becomes 2.5, and adding 1 gives 3.5.</li>
        </ul>` },

    { short: "Supplier facts", eyebrow: "Put it together",
      html: `<h2 class="title">Store Facts from a Supplier <span class="hl">File</span></h2>
        <p class="p">Here's the same idea with real facts from page 2 of the supplier file: the document's name, its lot number, the page it's on and its date of manufacture. <code>has_lot_number</code> is a boolean that says the page shows a lot number.</p>
        <p class="p">A variable's name can't have spaces, so we join the words with an underscore: <code>lot_number</code>.</p>
        ${cols(py(`document = "Certificate of Quality"
lot_number = "17242818"
page = 2
manufactured = "20210126"
has_lot_number = True
print(document)
print(lot_number)
print(page)
print(manufactured)
print(has_lot_number)`), out(`Certificate of Quality
17242818
2
20210126
True`), "minmax(0,1fr) 230px")}
        <p class="p">The date is a string too. It's written <code>20210126</code>: the year, the month, then the day, with nothing between them. At the end of these cards, you'll cut it into those three parts.</p>` },

    /* ---------- Part 3: f-strings ---------- */
    { short: "f-strings", eyebrow: "f-strings",
      html: `<h2 class="title">f-Strings Put Values Inside <span class="hl">Text</span></h2>
        <p class="p">Often you want one line of text that mixes words and values, like a summary of a document. An <b>f-string</b> does this. Put the letter <code>f</code> just before the opening quote, then write a variable's name inside curly braces, <code>{ }</code>, anywhere in the text. Python swaps each <code>{name}</code> for that variable's value: a seamless integration of text and data.</p>
        <p class="p">This uses the variables from the last card:</p>
        ${py(`summary = f"{document}, lot {lot_number}, page {page}"
print(summary)`)}
        ${out(`Certificate of Quality, lot 17242818, page 2`)}
        <p class="p">The number <code>2</code> slots into the text with no extra work, even though <code>page</code> holds an integer.</p>` },

    { short: "Forgot the f", eyebrow: "Your guess",
      html: `<h2 class="title">What If You Forget the <span class="hl">f</span>?</h2>
        <p class="p">This line is the same as the summary, but the <code>f</code> before the opening quote is missing.</p>
        ${py(`print("{document}, lot {lot_number}")`)}
        <div class="guess" data-guess>
          <p class="guess-q">Your guess: what does it print?</p>
          <div class="opts"><button type="button" class="opt mono" data-opt="filled" aria-pressed="false">Certificate of Quality, lot 17242818</button><button type="button" class="opt mono" data-opt="raw" aria-pressed="false">{document}, lot {lot_number}</button></div>
          <div class="reveal" data-reveal hidden></div>
        </div>`,
      reveal: (function () {
        var o = out(`{document}, lot {lot_number}`);
        var why = ' Without the <code>f</code>, it\'s an ordinary string, so Python prints the braces and names exactly as you typed them. There\'s no error message, so this mistake is easy to miss. When a name shows up in braces, check for the <code>f</code>.';
        return {
          raw: o + '<p class="say"><b>You guessed right.</b>' + why + '</p>',
          filled: o + '<p class="say"><b>Good guess, but no.</b>' + why + '</p>'
        };
      })() },

    { short: "Math in braces", eyebrow: "Math inside the braces",
      html: `<h2 class="title">Braces Can Hold a Little <span class="hl">Math</span></h2>
        <p class="p">The braces can hold more than a name. Python works out whatever is inside them first, then puts the answer in the text.</p>
        ${py(`print(f"The next page is page {page + 1}")`)}
        ${out(`The next page is page 3`)}
        <p class="p"><code>page</code> holds 2, so <code>{page + 1}</code> becomes 3. The variable itself doesn't change: it still holds 2.</p>
        <div class="fact"><span class="num">WHY IT HELPS</span><p>Computers often count from 0, while people count from 1. Adding 1 inside the braces prints the number a person expects, like the page number printed on the paper.</p></div>` },

    { short: "Triple quotes", eyebrow: "Text over several lines",
      html: `<h2 class="title">Triple Quotes Hold Several <span class="hl">Lines</span></h2>
        <p class="p">A string in single or double quotes has to fit on one line. To write text over several lines, put three quotes at the start and three at the end: <code>"""</code>. Every line break you type stays in the string. A line break is called a <b>newline</b>.</p>
        ${cols(py(`note = """Certificate of Quality
Lot Number: 17242818
Date of Manufacture: 20210126"""
print(note)`), out(`Certificate of Quality
Lot Number: 17242818
Date of Manufacture: 20210126`))}
        <p class="p">Inside ordinary quotes, Python writes a newline as <code>\\n</code>. So <code>"Expiration Date:\\n20260315"</code> is also two lines of text: <code>Expiration Date:</code>, then <code>20260315</code> under it.</p>` },

    { short: "Prompts", eyebrow: "Prompts for a chatbot",
      html: `<h2 class="title">Write a Chatbot Prompt with <span class="hl">Double</span> Braces</h2>
        <p class="p">A <b>prompt</b> is the instructions you type to a chatbot like Gemini. A multi-line f-string makes a good prompt, because you can drop facts straight in. Here, we ask for the answer in <b>JSON</b>: a way of writing data as text, with names and values inside curly braces, that both people and computers can read.</p>
        <p class="p">There's one catch. In an f-string, Python treats every curly brace as a place to fill in. To keep a real curly brace in the text, type it twice: <code>{{</code> prints <code>{</code>, and <code>}}</code> prints <code>}</code>.</p>
        ${py(`prompt = f"""Read this text from a supplier file:
{summary}
Date of Manufacture: {manufactured}

Reply only in JSON, like this:
{{"manufacture_date": "YYYY-MM-DD"}}"""
print(prompt)`)}
        ${out(`Read this text from a supplier file:
Certificate of Quality, lot 17242818, page 2
Date of Manufacture: 20210126

Reply only in JSON, like this:
{"manufacture_date": "YYYY-MM-DD"}`)}` },

    { short: "Single braces", eyebrow: "Watch out",
      html: `<h2 class="title">Single Braces Break the <span class="hl">Prompt</span></h2>
        <p class="p">If you forget to double the braces around the JSON example, Python tries to fill them in, and the cell (the box of code you run) stops with an error instead of printing.</p>
        ${py(`prompt = f"""Reply only in JSON, like this:
{"manufacture_date": "YYYY-MM-DD"}"""`)}
        ${out(`ValueError: Invalid format specifier ' "YYYY-MM-DD"' for object of type 'str'`, "Output: the last line of the error")}
        <p class="p">The Try It Yourself on this page shows the same error if you make this slip there. To fix it, double the braces you want to keep.</p>
        <div class="fact"><span class="num">WATCH OUT</span><p>Double only the braces you want to <b>see</b> in the text. <code>{summary}</code> stays single, because you want Python to fill it in.</p></div>` },

    /* ---------- Part 4: String methods ---------- */
    { short: "strip()", eyebrow: "String methods",
      html: `<h2 class="title">strip() Removes Extra <span class="hl">Spaces</span></h2>
        <p class="p">A <b>method</b> is a function that belongs to a value. You use it by writing a dot after the value, then the method's name and round brackets: <code>line.strip()</code>. Strings come with many methods for cleaning text.</p>
        <p class="p">Clinical trial reports, scanned documents, and user-generated text often contain <b>extra spaces and line breaks</b>, making data messy. So does text read out of a supplier file. Here's page 2's date line, as Python reads it, with a space and a newline at the end:</p>
        ${py(`line = "Date of Manufacture:  20210126 \\n"
print(f"[{line}]")
print(f"[{line.strip()}]")`)}
        ${out(`[Date of Manufacture:  20210126 
]
[Date of Manufacture:  20210126]`)}
        <p class="p">The square brackets are only there so you can see where the text starts and ends. <code>strip()</code> removed the space and the newline at the end. It only cleans the two ends: the double space in the middle stays.</p>
        <div class="fact"><span class="num">WHY IS THIS IMPORTANT?</span><p>Ensures proper word spacing for easier reading and analysis. Prevents AI models from misinterpreting text due to inconsistent spacing.</p></div>` },

    { short: "lower() and upper()", eyebrow: "Converting text to lowercase",
      html: `<h2 class="title">lower() and upper() Make Letters <span class="hl">Match</span></h2>
        <p class="p">Do you know that AI models treat uppercase and lowercase words differently? <code>Hello</code>, <code>hello</code>, and <code>HELLO</code> should be considered the same word, but sometimes they are not. Standardizing text to lowercase helps avoid confusion.</p>
        <p class="p"><b>Fix:</b> Convert text to <b>lowercase</b>. And <code>upper()</code> does the opposite: it makes every letter a capital.</p>
        ${cols(py(`text = "HELLO World!"
print(text.lower())
print(text.upper())`), out(`hello world!
HELLO WORLD!`))}
        <div class="fact"><span class="num">WHY IS THIS IMPORTANT?</span><p>Ensures consistent text representation across the dataset (the whole collection of text you're working with). Helps AI models better understand word patterns.</p></div>` },

    { short: "Compare text", eyebrow: "Your guess",
      html: `<h2 class="title">Compare Text Without Worrying About <span class="hl">Capitals</span></h2>
        <p class="p">Two equals signs, <code>==</code>, ask Python whether two values are the same. The answer is a boolean: <code>True</code> or <code>False</code>. (One <code>=</code> stores a value. Two <code>==</code> compare.)</p>
        <p class="p">Here, <code>found</code> holds a document name that your code found on a page, written in capitals.</p>
        ${py(`found = "COVER LETTER"
print(found == "Cover Letter")
print(found.lower() == "Cover Letter".lower())`)}
        <div class="guess" data-guess>
          <p class="guess-q">Your guess: what does the first <code>print()</code> show?</p>
          <div class="opts"><button type="button" class="opt mono" data-opt="True" aria-pressed="false">True</button><button type="button" class="opt mono" data-opt="False" aria-pressed="false">False</button></div>
          <div class="reveal" data-reveal hidden></div>
        </div>`,
      reveal: (function () {
        var o = out(`False
True`);
        var why = ' To Python, a capital C and a small c are different characters, so the first check is <code>False</code>. Lowering both sides before you compare them means capital letters no longer matter, so the second check is <code>True</code>.';
        return {
          "False": o + '<p class="say"><b>You guessed right.</b>' + why + '</p>',
          "True": o + '<p class="say"><b>Good guess, but it\'s False.</b>' + why + '</p>'
        };
      })() },

    { short: "replace()", eyebrow: "Swapping text",
      html: `<h2 class="title">replace() Swaps One Piece of Text for <span class="hl">Another</span></h2>
        <p class="p">In real-world text, the same concept can be written in different ways, and some text you don't need at all. <code>text.replace(old, new)</code> finds every copy of the old text and puts the new text in its place.</p>
        ${py(`line = "Date of Manufacture:  20210126 "
date = line.replace("Date of Manufacture:", "")
print(f"[{date}]")
print(f"[{date.strip()}]")
print("2025/08/28".replace("/", "-"))`)}
        ${out(`[  20210126 ]
[20210126]
2025-08-28`)}
        <ul class="bul">
          <li>Replacing the label with <code>""</code> (empty quotes: a string with nothing in it) deletes the label. Then <code>strip()</code> tidies the spaces around the date.</li>
          <li>The last line swaps every slash in a date for a dash.</li>
        </ul>` },

    { short: "split()", eyebrow: "Cutting text",
      html: `<h2 class="title">split() Cuts Text into <span class="hl">Pieces</span></h2>
        <p class="p"><code>split()</code> cuts a string wherever it finds a separator, and gives back the pieces. With nothing in the brackets, it cuts at the spaces, and skips any extra ones. With <code>":"</code> in the brackets, it cuts at the colon, and with <code>"-"</code>, it cuts at each dash, so a date like <code>2025-03-21</code> splits into its year, month and day.</p>
        ${py(`line = "Date of Manufacture:  20210126 "
print(line.split())
print(line.split(":"))
print("2025-03-21".split("-"))
print("Lot AB-4417  Exp 2027".split())`)}
        ${out(`['Date', 'of', 'Manufacture:', '20210126']
['Date of Manufacture', '  20210126 ']
['2025', '03', '21']
['Lot', 'AB-4417', 'Exp', '2027']`)}
        <p class="p">The square brackets in the output show a <b>list</b>: several values kept in order, separated by commas. You'll learn lists properly in a later reading.</p>
        <p class="p">Look at the second piece of the colon split: <code style="white-space:pre">'  20210126 '</code> still has its spaces, so you'd <code>strip()</code> it next. The last line shows that a double space doesn't matter: the lot, <code>AB-4417</code>, still comes out as one clean piece.</p>` },

    { short: "Keep the result", eyebrow: "Your guess",
      html: `<h2 class="title">A Method Doesn't Change the <span class="hl">Original</span></h2>
        <p class="p">This runs <code>strip()</code> on the date line, then prints the line.</p>
        ${py(`line = "Date of Manufacture:  20210126 "
line.strip()
print(f"[{line}]")`)}
        <div class="guess" data-guess>
          <p class="guess-q">Your guess: is the space at the end still there?</p>
          <div class="opts"><button type="button" class="opt" data-opt="yes" aria-pressed="false">Yes, it's still there</button><button type="button" class="opt" data-opt="no" aria-pressed="false">No, strip() removed it</button></div>
          <div class="reveal" data-reveal hidden></div>
        </div>`,
      reveal: (function () {
        var o = out(`[Date of Manufacture:  20210126 ]`);
        var why = ' A string can never be changed. A method gives back a <b>new</b> string, and here nothing kept it. To keep the result, save it in the variable again. You can also run methods one after another:';
        var fix = py(`line = line.strip().lower()
print(f"[{line}]")`) + out(`[date of manufacture:  20210126]`);

          yes: o + '<p class="say"><b>You guessed right: it\'s still there.</b>' + why + '</p>' + cols(fix.split('</figure>')[0] + '</figure>', fix.split('</figure>')[1] + '</figure>'),
          no: o + '<p class="say"><b>Good guess, but it\'s still there.</b>' + why + '</p>' + cols(fix.split('</figure>')[0] + '</figure>', fix.split('</figure>')[1] + '</figure>')
        };
      })() },

    /* ---------- Part 5: Slicing ---------- */
    { short: "Positions", eyebrow: "Positions",
      html: `<h2 class="title">Every Character Has a <span class="hl">Position</span></h2>
        <p class="p">Always remember that in programming languages the first element (item) is at position 0, not at 1. In a string, every character (a letter, digit, space or symbol) has a position, called its <b>index</b>. So if you call <code>my_string[0]</code>, this will return the first character in the string.</p>
        <p class="p">Interestingly, Python also provides something called negative indexing. Here we start with -1 for the last element and then move our way from right to left.</p>
        ${charsGrid()}
        <p class="cap">&#9251; stands for the space between the comma and the w.</p>
        ${cols(py(`my_string = "Hello, world!"
print(my_string[0])
print(my_string[1])
print(my_string[-1])
print(len(my_string))`), out(`H
e
!
13`), "minmax(0,1fr) 200px")}
        <p class="p"><code>len()</code> counts the characters. "Hello, world!" has 13, so its positions run from 0 to 12.</p>` },

    { short: "Slicing", eyebrow: "Slicing strings",
      html: `<h2 class="title">Slicing Cuts Out Part of a <span class="hl">String</span></h2>
        <p class="p">Slicing and indexing are very useful in Python, and it is important that you get used to them. A <b>slice</b> is written <code>[start:stop]</code>. It starts at position <code>start</code> and stops just <b>before</b> position <code>stop</code>. Leave out the start to begin at the first character. Leave out the stop to go to the end.</p>
        ${cols(py(`# String slicing
my_string = "Hello, world!"
print(my_string[7:12])  # Substring "world"
print(my_string[:5])    # Substring "Hello"
print(my_string[7:])    # Substring "world!"`), out(`world
Hello
world!`), "minmax(0,1fr) 170px")}
        <ul class="bul">
          <li>A <b>substring</b> is a piece of a string.</li>
          <li><code>[7:12]</code> takes positions 7 to 11: <code>w o r l d</code>. Position 12, the <code>!</code>, is left out.</li>
        </ul>` },

    { short: "The month", eyebrow: "Your guess",
      html: `<h2 class="title">Which Part of the Date Is the <span class="hl">Month</span>?</h2>
        <p class="p">The date of manufacture on page 2 is <code>20210126</code>. The year sits in positions 0 to 3, the month in positions 4 and 5, and the day in positions 6 and 7.</p>
        ${py(`manufactured = "20210126"
print(manufactured[4:6])`)}
        <div class="guess" data-guess>
          <p class="guess-q">Your guess: what does it print?</p>
          <div class="opts"><button type="button" class="opt mono" data-opt="012" aria-pressed="false">012</button><button type="button" class="opt mono" data-opt="01" aria-pressed="false">01</button><button type="button" class="opt mono" data-opt="26" aria-pressed="false">26</button></div>
          <div class="reveal" data-reveal hidden></div>
        </div>`,
      reveal: (function () {
        var o = out(`01`);
        var why = ' <code>[4:6]</code> starts at position 4 and stops just before position 6, so it takes positions 4 and 5: <code>01</code>, the month of January.';
        return {
          "01": o + '<p class="say"><b>You guessed right.</b>' + why + '</p>',
          "012": o + '<p class="say"><b>Good guess, but the slice stops one early.</b>' + why + '</p>',
          "26": o + '<p class="say"><b>Good guess, but 26 is the day.</b>' + why + '</p>'
        };
      })() },

    { short: "Slice the date", eyebrow: "Put it together",
      html: `<h2 class="title">Turn 20210126 into a Date People Can <span class="hl">Read</span></h2>
        <p class="p">Each slice goes into its own variable. Then an f-string puts the three parts back together with dashes between them.</p>

month = manufactured[4:6]

        ${cols(py(`file_name = "sample-sdf-document.pdf"
print(file_name[-4:])
print(file_name[:-4])`), out(`.pdf

    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }

  /* Build the grouped rail: one group per part, one segment per card */
  var segs = [], grps = [], n0 = 0;
  GROUPS.forEach(function (g) {
    var el = document.createElement("div");
    el.className = "grp"; el.style.flex = g.n + " 1 0";
    el.innerHTML = '<span class="grp-label">' + g.name + '</span><span class="segs"></span>';
    var row = el.querySelector(".segs");
    for (var k = 0; k < g.n; k++) {
      (function (n) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "pg";
        b.setAttribute("aria-label", "Card " + (n + 1) + ": " + CARDS[n].short);
        b.innerHTML = '<span class="seg"></span>';
        b.addEventListener("click", function () { go(n); });
        row.appendChild(b); segs.push(b);
      })(n0 + k);
    }
    grps.push({ el: el, from: n0, to: n0 + g.n - 1 });
    n0 += g.n;
    rail.appendChild(el);
  });

  function titleOf(n) { var m = CARDS[n].html.match(/<h2[^>]*>([\s\S]*?)<\/h2>/); return m ? m[1].replace(/<[^>]+>/g, "") : ""; }

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }
  function bindCopy(root) {
    Array.prototype.forEach.call(root.querySelectorAll("[data-copy]"), function (b) {
      if (b.dataset.bound) return; b.dataset.bound = "1";
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });
  }

  function render(anim) {
    var c = CARDS[i];
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.eyebrow + '</p>' + c.html + '</div>';
    bindCopy(card);
    var g = card.querySelector("[data-guess]");
    if (g) {
      var rev = g.querySelector("[data-reveal]");
      var show = function (k) {
        picks[i] = k;
        Array.prototype.forEach.call(g.querySelectorAll(".opt"), function (o) { o.setAttribute("aria-pressed", o.getAttribute("data-opt") === k ? "true" : "false"); });
        rev.innerHTML = c.reveal[k]; rev.hidden = false; bindCopy(rev);
      };
      Array.prototype.forEach.call(g.querySelectorAll(".opt"), function (o) {
        o.addEventListener("click", function () { show(o.getAttribute("data-opt")); });
      });
      if (picks[i]) show(picks[i]);
    }
    segs.forEach(function (b, n) {
      b.classList.toggle("is-cur", n === i);
      b.classList.toggle("is-done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    grps.forEach(function (gr) { gr.el.classList.toggle("is-cur", i >= gr.from && i <= gr.to); });
    $("where-count").textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + titleOf(i + 1) + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n < 0 || n >= CARDS.length || n === i) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i === CARDS.length - 1) {
      donemsg.textContent = DONE_MSG;
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "extern-deck-done" }, "*");
      return;
    }
    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", fit);
  fit();
  /* Test hook: open a card directly, for example #card=5 */
  var m = location.hash.match(/card=(\d+)/);
  if (m) i = Math.min(CARDS.length - 1, Math.max(0, +m[1] - 1));
  render(false);
})();
</script>
</body>
</html>
