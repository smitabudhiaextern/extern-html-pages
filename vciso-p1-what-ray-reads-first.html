<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Ray Reads First</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#FDF8F8;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
color:#484646;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#w{position:absolute;top:0;left:0;width:960px;height:540px;overflow:hidden;transform-origin:top left}
.slide{position:absolute;top:0;left:0;width:960px;height:540px;
padding:24px 72px 20px;display:grid;grid-template-rows:20px 14px 402px 16px 44px;
background:#FDF8F8;text-align:left}
.slide[hidden]{display:none}
.hd{grid-row:1;display:flex;align-items:center;justify-content:space-between;
font-size:13px;line-height:20px;color:#484646}
.hd .rh{font-weight:500}
.hd .pos{font-variant-numeric:tabular-nums}
.bd{grid-row:3;height:402px}
.sa .bd{display:flex;flex-direction:column;justify-content:center}
.sb .bd{display:flex;flex-direction:column;justify-content:center}
.ab{grid-row:5;height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.abl,.abr{display:flex;align-items:center;gap:12px}
h1,h2{font-weight:600;color:#1C1B1B}
h1{font-size:28px;line-height:1.2;max-width:790px}
h2{font-size:24px;line-height:1.22;width:fit-content;max-width:100%}
h1:focus,h2:focus,h1.fx,h2.fx{outline:3px solid #001D69;outline-offset:4px;border-radius:2px}
.prompt{font-size:18px;line-height:1.5;color:#1C1B1B;margin-top:12px;max-width:700px}
.sub{font-size:15px;line-height:1.5;color:#484646;margin-top:8px}
.cnt{font-size:13px;line-height:1.4;color:#484646;font-variant-numeric:tabular-nums}

/* slide 1: click to rank */
.grp{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.card{font-family:inherit;text-align:left;width:100%;cursor:pointer;
border:1px solid rgba(0,29,105,0.55);border-radius:10px;background:transparent;
padding:9px 14px;display:flex;align-items:center;gap:13px}
.card:focus-visible{outline:3px solid #001D69;outline-offset:2px}
.card[aria-pressed="true"]{background:#DCE1FF;border-color:#001D69;box-shadow:inset 0 0 0 1px #001D69}
.bg{flex:0 0 auto;width:28px;height:28px;border-radius:999px;border:1px solid rgba(0,29,105,0.55);
display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;
color:#001D69;font-variant-numeric:tabular-nums;background:transparent}
.card[aria-pressed="true"] .bg{background:#001D69;border-color:#001D69;color:#FDF8F8;
animation:pop .28s cubic-bezier(.2,.8,.3,1) both}
.cw{flex:1 1 auto;min-width:0}
.ct{display:block;font-size:16px;font-weight:500;line-height:1.3;color:#1C1B1B}
.cl{display:block;font-size:13px;line-height:1.4;color:#484646;margin-top:2px}
.meter{height:3px;width:100%;max-width:300px;border-radius:999px;
background:rgba(0,29,105,0.22);margin-top:14px;overflow:hidden}
.meter i{display:block;height:100%;width:0%;background:#001D69;border-radius:999px;
transition:width .34s cubic-bezier(.2,.7,.3,1)}

/* slide 2: the test */
.cols{display:grid;grid-template-columns:1fr 1.12fr;gap:0 30px;margin-top:12px}
.ch{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;
line-height:1.4;color:#484646;margin-bottom:7px}
.col.key{border-left:3px solid #001D69;padding-left:17px;margin-left:-20px}
.col.key>.ch{color:#001D69}
.rlist{display:flex;flex-direction:column;gap:7px}
.rrow{display:flex;align-items:flex-start;gap:9px}
.rrow .n{flex:0 0 18px;font-size:14px;font-weight:600;color:#001D69;
font-variant-numeric:tabular-nums;text-align:right;line-height:1.35}
.rrow .c{flex:1 1 auto;font-size:14px;font-weight:500;line-height:1.35;color:#1C1B1B}
.mk{display:flex;align-items:center;gap:6px;margin-top:4px;
font-size:12px;line-height:1.35;color:#484646}
.qb{background:#DCE1FF;border-left:4px solid #001D69;border-radius:0 9px 9px 0;
padding:8px 14px}
.qb+.qb{margin-top:8px}
.qq{font-size:13.5px;font-weight:500;line-height:1.35;color:#1C1B1B}
.qa{font-size:13px;line-height:1.4;color:#001D69;margin-top:4px}
.ln{font-size:16px;line-height:1.5;color:#1C1B1B;margin-top:15px;max-width:820px}
.ln2{font-size:14px;line-height:1.5;color:#484646;margin-top:9px;max-width:820px}

/* slide 3: the rule */
.rule{background:#DCE1FF;border-left:4px solid #001D69;border-radius:0 12px 12px 0;
padding:16px 22px;max-width:760px}
.rule:focus,.rule.fx{outline:3px solid #001D69;outline-offset:4px;border-radius:0 12px 12px 0}
.close{font-size:28px;font-weight:600;line-height:1.26;color:#1C1B1B}
.three{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:760px}
.trow{display:flex;align-items:flex-start;gap:10px}
.trow .ci{flex:0 0 auto;line-height:0;padding-top:4px}
.trow p{font-size:16px;line-height:1.45;color:#484646}
.quiet{border:1px solid rgba(0,29,105,0.45);border-radius:9px;padding:9px 14px;
margin-top:16px;max-width:760px;display:flex;align-items:center;gap:10px}
.quiet .ci{flex:0 0 auto;line-height:0}
.quiet p{font-size:14px;line-height:1.45;color:#484646}
.end{font-size:13px;line-height:1.4;color:#484646;text-align:right;max-width:420px}

.ic{display:block;width:18px;height:18px;fill:none;stroke:#001D69;stroke-width:1.8;
stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px}
.btn{font-family:inherit;font-size:15px;font-weight:500;line-height:1;height:40px;
padding:0 20px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
border:1px solid #001D69;background:#001D69;color:#FDF8F8}
.btn .ic{stroke:#FDF8F8}
.btn.sec{background:transparent;color:#001D69}
.btn.sec .ic{stroke:#001D69}
.btn:disabled{background:transparent;border-color:#484646;color:#484646;cursor:default}
.btn:disabled .ic{stroke:#484646}
.btn:focus-visible{outline:3px solid #001D69;outline-offset:2px}
.btn.ready{animation:ready .4s ease-out 1}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.55)}62%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes ready{0%{box-shadow:0 0 0 0 rgba(0,29,105,.34)}100%{box-shadow:0 0 0 9px rgba(0,29,105,0)}}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.13)}100%{transform:scale(1)}}
.slide:not([hidden]) .an{animation:rise .36s cubic-bezier(.2,.7,.3,1) both}
.bumped{animation:bump .3s cubic-bezier(.2,.8,.3,1) both}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* portrait */
#w.pm{width:540px;height:720px}
#w.pm .slide{width:540px;height:720px;padding:24px 32px 20px;
grid-template-rows:20px 14px 582px 16px 44px}
#w.pm .bd{height:582px}
#w.pm h1{font-size:22px;line-height:1.26;max-width:100%}
#w.pm h2{font-size:21px;line-height:1.24}
#w.pm .close{font-size:22px;line-height:1.26}
#w.pm .prompt{font-size:16px;max-width:100%}
#w.pm .sub{font-size:15px}
#w.pm .cols{grid-template-columns:1fr;gap:18px 0}
#w.pm .col.key{margin-left:0;padding-left:14px}
#w.pm .ct{font-size:15px}
#w.pm .ln{font-size:15px}
#w.pm .ln2{font-size:14px}
#w.pm .trow p{font-size:15px}
#w.pm .rule{padding:14px 18px}
#w.pm .three{gap:8px;margin-top:14px}
#w.pm .end{font-size:12px;max-width:300px}
</style>
</head>
<body>
<div id="w">
<section class="slide sa t1" id="sl1" role="group" aria-label="Slide 1 of 3">
<div class="hd" aria-hidden="true"><span class="rh">What Ray reads first</span><span class="pos">1 of 3</span></div>
<div class="bd">
<div>
<h1 class="an" tabindex="-1" id="h1">Ray reads the first paragraph properly and skims the rest.</h1>
<p class="prompt an" style="animation-delay:42ms">You have three findings. Which one does he read first?</p>
<p class="sub an" style="animation-delay:84ms">Click a finding to give it a number. Click it again to take the number back.</p>
<div class="grp" id="grp"></div>
<div class="meter" role="presentation"><i id="mf"></i></div>
</div>
</div>
<div class="ab"><div class="abl"></div><div class="abr">
<span class="cnt" id="cnt" role="status" aria-live="polite">3 left to place</span>
<button class="btn" type="button" id="go" disabled>Continue<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><line x1="4" y1="12" x2="18.5" y2="12"/><polyline points="13 6.5 18.5 12 13 17.5"/></svg></button>
</div></div>
</section>
</div>
<script>
(function(){
var N=3;
var FIND=[
 "Three intake questions Cumberland could not answer",
 "Assets with nobody answerable for them",
 "The two client records do not agree"];
var WHEN=[
 "you found this first, in module 6",
 "module 7",
 "module 7"];
/* whether Meridian Section 1 asks about this finding. From the questionnaire, not from us. */
var ASKED=[false,true,true];
var MK_YES="Meridian asks about this one";
var MK_NO="Meridian does not ask about this one in Section 1";
var Q=[
 {q:"1. Do you maintain an inventory of the hardware you manage?",
  a:"Answered: Partly. Several assets have no recorded owner."},
 {q:"4. Do you maintain an inventory of the services provided to you by suppliers?",
  a:"Answered: Partly. The two records have never been reconciled."}];
var S2_H="What Meridian Actually Asks";
var CAP_L="Your order";
var CAP_R="Meridian&rsquo;s Section 1, first two questions";
var LN1="Meridian&rsquo;s questionnaire is the thing that threatens the contract, and it asks about two of your three findings directly.";
var LN2="The intake questions are the work you did first. Nothing in Meridian&rsquo;s Section 1 asks about them.";
var RULE="The order you worked in is not the order anybody reads in.";
var THREE=[
 "Lead with what the customer is about to ask about.",
 "Everything else keeps.",
 "Ray will not reach the third one carefully. Decide now which one that is."];
var WORKED="Harlan Ridge did the intake sheet first and printed it last.";
var RUNHEAD="What Ray reads first";
var END="That is the end of this activity. Go back to the module and write section 1.";

var P={
 back:'<line x1="20" y1="12" x2="5.5" y2="12"/><polyline points="11 6.5 5.5 12 11 17.5"/>',
 next:'<line x1="4" y1="12" x2="18.5" y2="12"/><polyline points="13 6.5 18.5 12 13 17.5"/>',
 dot:'<circle cx="12" cy="12" r="3.4" fill="#001D69" stroke="none"/>',
 ring:'<circle cx="12" cy="12" r="8.4"/>',
 target:'<circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="3.4" fill="#001D69" stroke="none"/>',
 list:'<line x1="9" y1="7" x2="19.5" y2="7"/><line x1="9" y1="12" x2="19.5" y2="12"/><line x1="9" y1="17" x2="19.5" y2="17"/><circle cx="5" cy="7" r="1.3" fill="#001D69" stroke="none"/><circle cx="5" cy="12" r="1.3" fill="#001D69" stroke="none"/><circle cx="5" cy="17" r="1.3" fill="#001D69" stroke="none"/>',
 doc:'<path d="M6 3.4h7.4L18 8v12.6H6Z"/><polyline points="13.4 3.6 13.4 8.1 17.9 8.1"/><line x1="8.7" y1="12.4" x2="15.3" y2="12.4"/><line x1="8.7" y1="16" x2="15.3" y2="16"/>',
 book:'<path d="M4.4 5.2h5.1c1.4 0 2.5 1.1 2.5 2.5v11c0-1.1-.9-2-2-2H4.4Z"/><path d="M19.6 5.2h-5.1c-1.4 0-2.5 1.1-2.5 2.5v11c0-1.1.9-2 2-2h5.6Z"/>',
 replay:'<polyline points="3 5 3 10.5 8.5 10.5"/><path d="M5.3 15.2a7.6 7.6 0 1 0 1.8-7.9L3 10.5"/>'};

function ic(d,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+d+'</svg>';}
function hdr(n){return '<div class="hd" aria-hidden="true"><span class="rh">'+RUNHEAD+'</span><span class="pos">'+n+' of '+N+'</span></div>';}
function backBtn(){return '<button class="btn sec" type="button" data-nav="-1">'+ic(P.back)+'Back</button>';}
function nextBtn(label){return '<button class="btn" type="button" data-nav="1">'+label+ic(P.next)+'</button>';}
function strip(s){return s.replace(/&rsquo;/g,"'");}

var w=document.getElementById('w');
var grp=document.getElementById('grp');
var meter=document.getElementById('mf');
var cnt=document.getElementById('cnt');
var goBtn=document.getElementById('go');
var slides=[document.getElementById('sl1')];
var heads=[document.getElementById('h1')];
var cards=[];
var order=[];
var cur=0,built=false;
var seen={};

function armHead(h){if(!h){return;}h.addEventListener('blur',function(){h.classList.remove('fx');});}

function mk(n,bodyHtml,extraCls,leftBtn,rightBtn){
  var s=document.createElement('section');
  s.className='slide '+extraCls+' t'+n;
  s.setAttribute('role','group');
  s.setAttribute('aria-label','Slide '+n+' of '+N);
  s.hidden=true;
  s.innerHTML=hdr(n)+'<div class="bd">'+bodyHtml+'</div>'+
    '<div class="ab"><div class="abl">'+leftBtn+'</div><div class="abr">'+rightBtn+'</div></div>';
  w.appendChild(s);
  slides.push(s);
  var h=s.querySelector('h1,h2');
  heads.push(h);
  armHead(h);
  return s;
}

/* slide 1: click to rank */
function buildCards(){
  grp.innerHTML='';
  cards=[];
  for(var i=0;i<FIND.length;i++){(function(i){
    var b=document.createElement('button');
    b.type='button';
    b.className='card an';
    b.style.animationDelay=(126+i*42)+'ms';
    b.setAttribute('aria-pressed','false');
    b.innerHTML='<span class="bg" aria-hidden="true">'+ic(P.ring,'sm')+'</span>'+
      '<span class="cw"><span class="ct">'+FIND[i]+'</span>'+
      '<span class="cl">'+WHEN[i]+'</span></span>';
    b.addEventListener('click',function(){toggle(i);});
    grp.appendChild(b);
    cards[i]=b;
  })(i);}
  paint();
}
function toggle(i){
  var at=-1,k;
  for(k=0;k<order.length;k++){if(order[k]===i){at=k;}}
  if(at>=0){order.splice(at,1);}else{order.push(i);}
  paint();
}
function rankOf(i){
  for(var k=0;k<order.length;k++){if(order[k]===i){return k+1;}}
  return 0;
}
function paint(){
  for(var i=0;i<cards.length;i++){
    var r=rankOf(i),b=cards[i];
    var bg=b.querySelector('.bg');
    b.setAttribute('aria-pressed',r?'true':'false');
    bg.innerHTML=r?String(r):ic(P.ring,'sm');
    b.setAttribute('aria-label',strip(FIND[i])+', '+strip(WHEN[i])+'. '+
      (r?('Number '+r+' of 3. Press to remove the number.'):'No number yet. Press to make it number '+(order.length+1)+'.'));
  }
  meter.style.width=Math.round(order.length/FIND.length*100)+'%';
  var was=goBtn.disabled;
  if(order.length===FIND.length){
    cnt.textContent='All three placed.';
    goBtn.disabled=false;
    if(was){goBtn.classList.remove('ready');void goBtn.offsetWidth;goBtn.classList.add('ready');}
  }else{
    cnt.textContent=(FIND.length-order.length)+' left to place';
    goBtn.disabled=true;
  }
  cnt.classList.remove('bumped');void cnt.offsetWidth;cnt.classList.add('bumped');
}

/* slide 2: the test. nothing here is marked right or wrong */
function yourList(){
  var h='<div class="col" role="group" aria-labelledby="capL"><h3 class="ch" id="capL">'+
    ic(P.list,'sm')+CAP_L+'</h3><div class="rlist">';
  for(var k=0;k<order.length;k++){
    var i=order[k];
    h+='<div class="rrow an" style="animation-delay:'+(42+k*42)+'ms"><span class="n">'+(k+1)+'</span>'+
       '<span class="c">'+FIND[i];
    if(k===0){
      h+='<span class="mk">'+ic(ASKED[i]?P.target:P.ring,'sm')+
         (ASKED[i]?MK_YES:MK_NO)+'</span>';
    }
    h+='</span></div>';
  }
  h+='</div></div>';
  return h;
}
function meridianCol(){
  var h='<div class="col key" role="group" aria-labelledby="capR"><h3 class="ch" id="capR">'+
    ic(P.doc,'sm')+CAP_R+'</h3><div>';
  for(var k=0;k<Q.length;k++){
    h+='<div class="qb an" style="animation-delay:'+(126+k*42)+'ms"><p class="qq">'+Q[k].q+
       '</p><p class="qa">'+Q[k].a+'</p></div>';
  }
  h+='</div></div>';
  return h;
}
function buildTest(){
  mk(2,
    '<h2 class="an" tabindex="-1">'+S2_H+'</h2>'+
    '<div class="cols">'+yourList()+meridianCol()+'</div>'+
    '<p class="ln an" style="animation-delay:252ms">'+LN1+'</p>'+
    '<p class="ln2 an" style="animation-delay:294ms">'+LN2+'</p>',
    'sb',backBtn(),nextBtn('The rule'));
}

/* slide 3: the rule */
function buildRule(){
  var h='<div><div class="rule an" tabindex="-1" id="rl"><h2 class="close">'+RULE+'</h2></div><div class="three">';
  for(var k=0;k<THREE.length;k++){
    h+='<div class="trow an" style="animation-delay:'+(42+k*42)+'ms"><span class="ci">'+
       ic(P.dot,'sm')+'</span><p>'+THREE[k]+'</p></div>';
  }
  h+='</div><div class="quiet an" style="animation-delay:210ms"><span class="ci">'+ic(P.book,'sm')+
     '</span><p>'+WORKED+'</p></div></div>';
  mk(3,h,'sa',
    backBtn()+'<button class="btn sec" type="button" id="rp">'+ic(P.replay)+'Replay</button>',
    '<p class="end">'+END+'</p>');
  var s=slides[slides.length-1];
  heads[heads.length-1]=s.querySelector('#rl');
  armHead(heads[heads.length-1]);
  var b=document.getElementById('rp');
  b.addEventListener('click',replay);
}

function teardown(){
  while(slides.length>1){
    var s=slides.pop();
    heads.pop();
    if(s.parentNode){s.parentNode.removeChild(s);}
  }
  delete seen[1];delete seen[2];
  built=false;
}
function commit(){
  if(order.length!==FIND.length){return;}
  if(built){teardown();}
  built=true;
  buildTest();
  buildRule();
  show(1);
}
function replay(){
  slides[cur].hidden=true;
  cur=0;
  teardown();
  order=[];
  buildCards();
  delete seen[0];
  show(0);
}

function show(i){
  slides[cur].hidden=true;
  cur=i;
  var s=slides[cur];
  s.hidden=false;
  if(!seen[cur]){
    seen[cur]=1;
    var an=s.querySelectorAll('.an');
    for(var q=0;q<an.length;q++){
      var el=an[q],cls=el.className;
      el.className=cls.replace(/\ban\b/,'');
      void el.offsetWidth;
      el.className=cls;
    }
  }
  for(var k=0;k<heads.length;k++){if(heads[k]){heads[k].classList.remove('fx');}}
  if(heads[cur]){heads[cur].classList.add('fx');heads[cur].focus();}
  fit();
}
function nav(d){
  var t=cur+d;
  if(t<0||t>slides.length-1){return;}
  show(t);
}

goBtn.addEventListener('click',commit);
w.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-nav]'):null;
  if(b&&!b.disabled){nav(parseInt(b.getAttribute('data-nav'),10));}
});
document.addEventListener('keydown',function(e){
  if(cur<1){return;}
  if(e.key==='ArrowRight'){e.preventDefault();nav(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();nav(-1);}
});

function fit(){
  var pm=window.innerWidth<600;
  if(pm){w.classList.add('pm');}else{w.classList.remove('pm');}
  var cw=pm?540:960,ch=pm?720:540;
  var s=Math.min(window.innerWidth/cw,window.innerHeight/ch,1);
  w.style.transform='scale('+s+')';
  w.style.left=Math.max(0,(window.innerWidth-cw*s)/2)+'px';
  w.style.top=Math.max(0,(window.innerHeight-ch*s)/2)+'px';
}
window.addEventListener('resize',fit);
window.addEventListener('load',fit);
armHead(heads[0]);
buildCards();
fit();
}());
</script>
</body>
</html>
