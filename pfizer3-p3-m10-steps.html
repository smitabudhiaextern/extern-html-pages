<template id="s2b">
  <p class="p">Start with the vendor information from the document's header, the top part of a page where a company prints its name and address. The first piece of text on page 1 is the vendor's name. Add a new code cell, paste this in, and press <b>Run</b>:</p>

<template id="s2c">
  <p class="p">Now the date fields. You'll write one regex pattern for each kind of date and keep them in a dictionary, with the label as the key. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:import re

patterns = {
    "Letter Date": r"(\d{1,2}\s+[A-Z][a-z]+,\s*\d{4})",
    "Date of Manufacture": r"Date of Manufacture:\s*(\d{8})",
    "Expiration Date": r"Expiration Date:\s*(\d{8})",
}}}
  <ul class="list">
    <li>The <b>Letter Date</b> has no label, so its pattern describes the date's shape: 1 or 2 digits, a space, a word that starts with a capital letter, a comma, then 4 digits. It's the notebook's Step 5 pattern, with <code>,\s*</code> so it matches with or without a space after the comma.</li>
    <li>The other two start with their label, the anchor phrase. The file has 11 numbers with 8 digits, and only 4 are dates. The label picks out those 4.</li>
    <li><code>\s*</code> matches any spaces or line breaks. Page 2 puts two spaces after the colon, and page 3 puts the date on the next line of the text.</li>
    <li>The round brackets mark the part to keep: the date alone, without the label.</li>
  </ul>
  <p class="p">This cell prints nothing. The next one uses it.</p>
</template>

<template id="s2d">
  <p class="p">Search every page with every pattern. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:found = []

for page_num in range(len(doc)):
    text = doc[page_num].get_text("text")
    for label, pattern in patterns.items():
        match = re.search(pattern, text)
        if match:
            date = match.group(1)
            found.append((label, date, page_num + 1))
            print(f"{label}, {date}, page {page_num + 1}")}}
  <p class="p">The loop reads each page's text, as in the notebook's Step 4. <code>re.search</code> looks for one pattern in it. If it finds a match, <code>match.group(1)</code> keeps the part in round brackets. Each date is printed and saved in the list <code>found</code>, with its label and page, for the optional steps later.</p>
  {{OUT:Output:Letter Date, 3 June, 2022, page 1
Date of Manufacture, 20210126, page 2
Expiration Date, 20230126, page 2
Date of Manufacture, 20240315, page 3
Expiration Date, 20260315, page 3}}
</template>

<template id="s2g">
  <p class="p">This step is optional. Add the bounding box of each date: the 4 numbers for its left, top, right and bottom on the page. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:for label, date, page_number in found:

<template id="s2h">
  <p class="p">Also optional: draw a green box around each date on page 2 with OpenCV, a library for working with pictures. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:import cv2
import numpy as np
from PIL import Image

page_number = 2
page = doc[page_number - 1]
# Convert PDF page to an image
pix = page.get_pixmap()
img = np.array(Image.frombytes(
    "RGB", [pix.width, pix.height], pix.samples))

# Convert image to OpenCV BGR format
img = cv2.cvtColor(img, cv2.COLOR_RGB2BGR)

# PyMuPDF and OpenCV both measure y from the top of the page,
# so no conversion is needed.
for label, date, date_page in found:
    if date_page == page_number:
        x0, y0, x1, y1 = map(int, page.search_for(date)[0])
        cv2.rectangle(img, (x0, y0), (x1, y1), (0, 255, 0), 2)
        print(f"Found '{date}' at: ({x0}, {y0}, {x1}, {y1})")

# Convert back to RGB for displaying in PIL
img_rgb = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)
display(Image.fromarray(img_rgb))}}
</template>

<script>
(function () {
  "use strict";

  var LINKS = {
    NOTEBOOK: "https://colab.research.google.com/drive/1dZQRFFu6pizjQinuHpTHrq8r7-Zb9Ckd",
    FILE: "https://drive.google.com/file/d/1oOR50D8F3Deask7aT2HbXQZhw0u1hvcg/view"
  };

  function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function unesc(t) { return t.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&"); }

  function codeBlock(text) {
    return '<figure class="run"><div class="code-head"><span class="code-lang">Python</span>' +
      '<button type="button" class="copy" data-copy aria-label="Copy Python code">' + IC_COPY + '<span>Copy</span></button></div>' +
      '<pre tabindex="0"><code>' + esc(text) + '</code></pre></figure>';
  }
  /* Output block: no Copy button. */
  function outBlock(label, text) {
    return '<figure class="run out"><div class="code-head"><span class="code-lang">' + label + '</span></div>' +
      '<pre tabindex="0"><code>' + esc(text) + '</code></pre></figure>';
  }
  /* Fill the {{...}} markers in a slide template with buttons and code blocks */
  function body(id) {
    return document.getElementById(id).innerHTML
      .replace(/\{\{OPEN:(\w+):([^}]*)\}\}/g, function (m, k, label) { return openBtn(LINKS[k], label); })

  }

  var GROUPS = ["Step 1", "Step 2", "Step 3"];
  var SLIDES = [
    { group: "Step 1", label: "STEP 1 &middot; PART 1 OF 2", title: 'Identify Key Information from the <span class="hl">SDF</span>', plain: "Step 1. Identify Key Information from the SDF", tpl: "s1a" },
    { group: "Step 1", label: "STEP 1 &middot; PART 2 OF 2", title: 'Compare Your Fields with the Sample <span class="hl">Answer</span>', plain: "Step 1. Compare Your Fields with the Sample Answer", tpl: "s1b" },
    { group: "Step 2", label: "STEP 2 &middot; PART 1 OF 10", title: 'Open Your Notebook and Run Its <span class="hl">Setup</span> Again', plain: "Step 2. Open Your Notebook and Run Its Setup Again", tpl: "s2a" },
    { group: "Step 2", label: "STEP 2 &middot; PART 2 OF 10", title: 'Get the Vendor Name from the <span class="hl">Header</span>', plain: "Step 2. Get the Vendor Name from the Header", tpl: "s2b" },
    { group: "Step 2", label: "STEP 2 &middot; PART 3 OF 10", title: 'Write One Pattern for Each Kind of <span class="hl">Date</span>', plain: "Step 2. Write One Pattern for Each Kind of Date", tpl: "s2c" },
    { group: "Step 2", label: "STEP 2 &middot; PART 4 OF 10", title: 'Search Every Page and Print Each <span class="hl">Date</span>', plain: "Step 2. Search Every Page and Print Each Date", tpl: "s2d" },
    { group: "Step 2", label: "STEP 2 &middot; PART 5 OF 10", title: 'Check Each Date Against the <span class="hl">File</span>', plain: "Step 2. Check Each Date Against the File", tpl: "s2e" },
    { group: "Step 2", label: "STEP 2 &middot; PART 6 OF 10", title: 'Print the Table on Page 3 as <span class="hl">Rows</span>', plain: "Step 2. Print the Table on Page 3 as Rows", tpl: "s2f" },
    { group: "Step 2", label: "STEP 2 &middot; PART 7 OF 10 (OPTIONAL)", title: 'Add Each Date&rsquo;s Bounding <span class="hl">Box</span>', plain: "Step 2 (Optional). Add Each Date's Bounding Box", tpl: "s2g" },
    { group: "Step 2", label: "STEP 2 &middot; PART 8 OF 10 (OPTIONAL)", title: 'Draw a Box Around Each Date with <span class="hl">OpenCV</span>', plain: "Step 2 (Optional). Draw a Box Around Each Date with OpenCV", tpl: "s2h" },
    { group: "Step 2", label: "STEP 2 &middot; PART 9 OF 10 (OPTIONAL)", title: 'See the Boxes on <span class="hl">Page</span> 2', plain: "Step 2 (Optional). See the Boxes on Page 2", tpl: "s2i" },
    { group: "Step 2", label: "STEP 2 &middot; PART 10 OF 10", title: 'Check Your Notebook and Share the <span class="hl">Link</span>', plain: "Step 2. Check Your Notebook and Share the Link", tpl: "s2j" },
    { group: "Step 3", label: "STEP 3", title: 'Reflect: What Worked? What <span class="hl">Didn&rsquo;t</span>?', plain: "Step 3. Reflect: What Worked? What Didn't?", tpl: "s3" }
  ];
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the questions at the end of this task.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this task to answer its questions.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  /* The fixed stage: pick the wide or narrow design size, then scale the whole deck to fit the frame and centre it. */
  var WIDE_W = 760, WIDE_H = 960, NARROW_W = 420, NARROW_H = 1180;
  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var W = narrow ? NARROW_W : WIDE_W, H = narrow ? NARROW_H : WIDE_H;
    var k = Math.min(window.innerWidth / W, window.innerHeight / H);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", g.name + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + g.name + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + body(s.tpl) + '</div>';
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });

    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  /* Left and Right arrow keys move between slides */
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", scaleStage);
  scaleStage();
  render(false);
})();
</script>
