  <p class="p">Start with the vendor information from the document's header, the top part of a page where a company prints its name and address. The first word on page 1 is the vendor's name. Add a new code cell, paste this in, and press <b>Run</b>:</p>

<template id="s2c">
  <p class="p">Now the date fields. You'll write one regex pattern for each kind of date and keep them in a dictionary, with the label as the key (the name you look a value up by). Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:import re

patterns = {
    "Letter Date": r"(\d{1,2}\s+[A-Z][a-z]+,\s*\d{4})",
    "Date of Manufacture": r"Date of Manufacture:\s*(\d{8})",
    "Expiration Date": r"Expiration Date:\s*(\d{8})",
}}}
  {{DOES}}
  <ul class="list">
    <li>The letter's date has no label in front of it, so its pattern is the one you finished in the reading on regex, with <code>,\s*</code>.</li>
    <li>The other two start with their label, the anchor phrase, so other 8-digit numbers, like lot numbers, don't match. <code>\s*</code> lets the date sit after two spaces or on the next line.</li>
    <li>The round brackets keep the date alone, without its label.</li>
  </ul>
  {{SHOT:3}}
  <p class="p">This cell prints nothing. The next one uses <code>patterns</code>.</p>
</template>

<template id="s2d">
  <p class="p">Search every page with every pattern. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:found = []

for page_num in range(len(doc)):
    text = doc[page_num].get_text("text")
    for label, pattern in patterns.items():
        match = re.search(pattern, text)
        if match:
            date = match.group(1)
            found.append((label, date, page_num + 1))
            print(f"{label}, {date}, page {page_num + 1}")}}
  {{DOES}}
  <ul class="list">
    <li>For each page, it reads the text and tries every pattern on it. <code>.items()</code> hands over each label with its pattern.</li>
    <li><code>match.group(1)</code> is the date inside the round brackets. <code>page_num + 1</code> gives the page number you see.</li>
    <li><code>found</code> keeps each date with its label and page, for the optional steps.</li>
  </ul>
</template>

  <p class="p">You'll also see two dates your code didn't print: the "Approved On" stamps. Here's the one on page 1, turned so you can read it:</p>

<template id="s2h">
  <p class="p">Also optional: draw a green box around each date on page 2 with OpenCV. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:import cv2
import numpy as np
from PIL import Image

page_number = 2
page = doc[page_number - 1]
# Convert PDF page to an image
pix = page.get_pixmap()
img = np.array(Image.frombytes(
    "RGB", [pix.width, pix.height], pix.samples))

# Convert image to OpenCV BGR format
img = cv2.cvtColor(img, cv2.COLOR_RGB2BGR)

# PyMuPDF and OpenCV both measure y from the top of the page,
# so no conversion is needed.
for label, date, date_page in found:
    if date_page == page_number:
        x0, y0, x1, y1 = map(int, page.search_for(date)[0])
        cv2.rectangle(img, (x0, y0), (x1, y1), (0, 255, 0), 2)
        print(f"Found '{date}' at: ({x0}, {y0}, {x1}, {y1})")

# Convert back to RGB for displaying in PIL
img_rgb = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)
display(Image.fromarray(img_rgb))}}
