<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sort Six Actions</title>
<!--
  vCISO P2 Step 1, Module 3: What You May and May Not Do.
  Built from the Extern deck shell (.claude/skills/build-html-slides/assets/deck-shell.html).
  Governing authority: output/programs/vciso/VCISO-STYLE-GUIDE.md section 6, which
  sets the larger type scale and the per-slide tint ramp used here.

  Verify before shipping, both gates, every time:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs   this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  /* ===============================================================
     The palette. The Extern five, plus the vCISO per-slide tint ramp
     (VCISO-STYLE-GUIDE.md 6b, listed in 09-assets/deck-palette.json).
     Tint carries no meaning. Every tint of navy is an rgba() of
     #001D69. No state is ever signalled by colour alone: every
     coloured state also carries a glyph or a label.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, borders, fills      */
    --bg:#FDF8F8;           /* canvas background, and text on navy */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;    /* UI feedback: hover, press, focus, select */
    --t-frame:300ms;   /* movement between slides                  */
    --t-reveal:560ms;  /* a value or an answer resolving           */
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);  /* the slight overshoot */
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    /* System stack, no webfont. A font that blocks first paint is worse
       than any font choice, and a deck makes no network request. */
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. Shared with every
     vCISO deck, so slide 3 here is the same colour as slide 3 elsewhere. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t3{background:#F2E3D2}
  body.t4{background:#DEEBDA}
  body.t5{background:#F0E4EF}
  body.t6{background:#D0EEF1}
  body.t7{background:#EEDAD6}

  /* ---- the 960x540 canvas, scaled down only, never up ----
     flex:0 0 auto is load bearing. As a shrinkable flex item the canvas
     lays out at the viewport width between 600 and 899px, and the JS
     transform then scales it a second time, double shrinking the design.
     The canvas must always hold 960 in layout and let the transform do
     all of the fitting. getComputedStyle(stage).width must read 960px. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  /* The frame takes programmatic focus so a screen reader announces a new
     slide. It is not a control, so it draws no ring of its own. */
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header. Progress is visible from first paint. ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  /* vCISO 6a: heading 28px at 600. */
  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  /* ---- the board. One or two columns, set per slide. ---- */
  .board{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 440px;gap:20px}
  .board.one{grid-template-columns:1fr}
  .board.vd{grid-template-columns:1fr 360px}
  .col{min-width:0;min-height:0;display:flex;flex-direction:column}

  /* ---- prose. Max ~74ch: past that the eye loses the line. ---- */
  .intro{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;max-width:74ch}
  .intro p{font-size:17px;line-height:1.5}
  .intro p b{color:var(--title);font-weight:600}

  /* ---- a source panel. Never paraphrase what sits in here. Every
         #DCE1FF container carries a #001D69 edge (style guide 6b). ---- */
  .quote{flex:0 0 auto;background:var(--highlight);border-left:4px solid var(--on-highlight);
    border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:10px}
  .quote .qh{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;font-weight:600;
    letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .quote .qt{font-size:17px;line-height:1.5;color:var(--title)}
  .quote .qt + .qt{margin-top:10px}
  .quote .qn{font-weight:600;color:var(--on-highlight);margin-right:4px}
  .quote ul{padding-left:18px}
  .quote li + li{margin-top:8px}

  /* ---- the question. Stays visible through the reveal. ---- */
  .q{flex:0 0 auto;font-size:17px;line-height:1.35;font-weight:600;color:var(--title);margin-bottom:10px}

  /* ---- options. Real buttons: Tab and Enter, no custom key protocol. ---- */
  .opts{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
  button.opt{
    font-family:inherit;font-size:15px;line-height:1.35;text-align:left;color:var(--title);
    background:var(--bg);border:1.5px solid var(--line);border-radius:9px;
    padding:8px 12px;cursor:pointer;display:flex;gap:9px;align-items:flex-start;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out);
  }
  button.opt .g{flex:0 0 auto;width:18px;height:18px;margin-top:1px;border-radius:50%;
    border:1.5px solid var(--on-highlight);color:var(--on-highlight);
    font-size:10px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center}
  button.opt:hover:not(:disabled){background:var(--highlight);border-color:var(--on-highlight)}
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt:disabled{cursor:default}
  /* Ruled out carries three signals: a glyph, a struck label, a dashed
     border. None of them is colour on its own. */
  button.opt.out{background:transparent;border-style:dashed;border-color:var(--line);opacity:.9}
  button.opt.out .txt{text-decoration:line-through;text-decoration-thickness:1px}
  button.opt.out .g{border-style:dashed}
  button.opt.picked{background:var(--on-highlight);border-color:var(--on-highlight);color:var(--bg)}
  button.opt.picked .g{border-color:var(--bg);color:var(--bg)}

  /* Fixed height, reserved from first paint. Nothing here reflows, ever. */
  .note{flex:0 0 auto;height:66px;overflow-y:auto;margin-top:10px;font-size:14px;line-height:1.45;color:var(--body)}
  .note b{color:var(--title);font-weight:600}

  /* ---- the reveal. ---- */
  .reveal{flex:0 1 auto;min-height:0;overflow-y:auto;background:var(--highlight);
    border-left:4px solid var(--on-highlight);
    border-radius:0 11px 11px 0;padding:12px 16px;display:flex;flex-direction:column;gap:7px}
  .reveal:focus{outline:3px solid var(--on-highlight);outline-offset:2px}
  .reveal.in{animation:rin var(--t-reveal) var(--ease-over) both}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .rl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--on-highlight);margin-bottom:5px;display:flex;align-items:center;gap:6px}
  .rt{font-size:17px;line-height:1.5;color:var(--body)}
  .rt b{color:var(--title);font-weight:600}
  .rt p + p{margin-top:9px}
  .rt ul{padding-left:18px;margin-top:6px}
  .rt li + li{margin-top:6px}

  /* ---- the closing list ---- */
  .listwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .lintro{flex:0 0 auto;font-size:15px;line-height:1.45;margin-bottom:10px}
  .rules{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
  .row{display:grid;grid-template-columns:170px 104px 1fr auto;gap:12px;align-items:center;
    background:var(--highlight);border-left:4px solid var(--on-highlight);border-radius:0 8px 8px 0;padding:9px 12px}
  .row.open{background:var(--tint);border-left-style:dashed}
  .row .nm{font-size:14px;font-weight:600;color:var(--title);line-height:1.28}
  .row .st{font-size:13px;font-weight:600;color:var(--on-highlight);line-height:1.28}
  .row .rr{font-size:14px;line-height:1.4;color:var(--body)}
  button.jump{font-family:inherit;font-size:13px;font-weight:600;color:var(--on-highlight);
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:6px;padding:5px 10px;cursor:pointer}
  button.jump:hover{background:var(--tint2)}
  button.jump:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  /* ---- a plain card ---- */
  .card{background:var(--highlight);border-radius:10px;padding:9px 12px}

  /* ---- slide 1: the two-bin sort ----
     Cards never move. Placing one marks it with its column's number and
     adds it to that column, so nothing on the slide reflows mid sort. */
  .board.srt{grid-template-columns:1fr 330px;grid-template-rows:auto minmax(0,1fr);row-gap:10px}
  .how{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:var(--highlight);color:var(--title);border-left:4px solid var(--on-highlight);border-radius:6px;padding:6px 12px;font-size:15px;line-height:1.3}
  .how b{font-weight:600}
  .cards{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
  .scard{display:grid;grid-template-columns:26px 1fr 30px;gap:10px;align-items:center;
    background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:3px 10px;
    cursor:pointer;user-select:none;-webkit-user-select:none;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  .scard:hover:not(.locked){border-color:var(--on-highlight)}
  .scard:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  .scard.sel{background:var(--highlight);border-color:var(--on-highlight);box-shadow:inset 0 0 0 1.5px var(--on-highlight)}
  .scard.locked{cursor:default}
  .scard.bad{border-style:dashed;border-color:var(--on-highlight)}
  .scard .cn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums}
  .scard.sel .cn{background:var(--on-highlight);color:var(--bg)}
  .scard .ct{font-size:15px;line-height:1.32;color:var(--title)}
  /* The column mark: a dashed empty box until placed, then the column's
     number, then a tick or a cross once checked. Shape and glyph, never
     colour alone. */
  .scard .tg{width:28px;height:26px;border-radius:6px;border:1.5px dashed var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--on-highlight)}
  .scard .tg.on{border:1.5px solid var(--on-highlight);background:var(--highlight)}
  .scard .tg.x{border:1.5px dashed var(--on-highlight);background:transparent}
  .bins{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  button.bin{flex:1 1 auto;font-family:inherit;text-align:left;cursor:pointer;background:var(--tint);
    border:1.5px dashed var(--on-highlight);border-radius:10px;padding:10px 14px;
    display:flex;flex-direction:column;justify-content:flex-start;gap:6px;color:var(--title);
    transition:background var(--t-fast) var(--ease-out)}
  button.bin:hover,button.bin.over{background:var(--highlight);border-style:solid}
  button.bin:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.bin .bl{font-size:16px;font-weight:600;line-height:1.3;display:flex;align-items:flex-start;gap:8px}
  button.bin .bk{flex:0 0 auto;width:24px;height:22px;border-radius:5px;border:1.5px solid var(--on-highlight);
    background:var(--highlight);font-size:13px;font-weight:600;color:var(--on-highlight);
    display:flex;align-items:center;justify-content:center;margin-top:-1px}
  button.bin .bh{font-size:14px;line-height:1.4;color:var(--body)}
  .tally{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  .tbox{flex:1 1 auto;background:var(--tint);border:1.5px dashed var(--line);border-radius:9px;padding:12px 14px}
  .tbox.on{background:var(--highlight);border:1.5px solid var(--on-highlight)}
  .tbox .bl{font-size:16px;font-weight:600;line-height:1.3;color:var(--title)}
  .tbox .bh{font-size:14px;line-height:1.4;color:var(--body);margin-top:4px}
  .chk{flex:0 0 auto;display:flex;flex-direction:column;gap:5px}
  .chk .cc{font-size:13px;line-height:1.3;color:var(--body)}
  button.nav.full{width:100%}
  .res{flex:1 1 auto;min-height:0;overflow-y:auto;background:var(--highlight);border-left:4px solid var(--on-highlight);
    border-radius:0 10px 10px 0;padding:11px 14px;font-size:14px;line-height:1.45;color:var(--body);
    display:flex;flex-direction:column;gap:9px}
  .res:focus{outline:3px solid var(--on-highlight);outline-offset:2px}
  .res.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .res b{color:var(--title);font-weight:600}
  .res .sc{color:var(--title);font-weight:600;font-size:15px}

  /* ---- slide 4: the verdict quiz ---- */
  .cases{flex:0 0 auto;display:flex;flex-direction:column;gap:7px}
  .case{background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;
    display:flex;flex-direction:column;gap:6px}
  .case.done{border-color:var(--on-highlight)}
  .case.miss{border-style:dashed}
  .case .cx{font-size:15px;line-height:1.4;color:var(--title)}
  .case .vb{display:flex;gap:8px;min-height:32px;align-items:center}
  button.vbtn{font-family:inherit;font-size:14px;font-weight:600;color:var(--on-highlight);
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:7px;padding:5px 12px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px}
  button.vbtn:hover{background:var(--highlight)}
  button.vbtn:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.vbtn .k{font-size:11px;border:1.5px solid var(--on-highlight);border-radius:4px;padding:0 4px;line-height:14px}
  .vr{font-size:14px;line-height:1.35;font-weight:600;color:var(--on-highlight);display:flex;align-items:center;gap:7px}
  .vr .gl{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--on-highlight);
    display:flex;align-items:center;justify-content:center;font-size:10px}
  .vr.bad .gl{border-style:dashed}
  .vr s{font-weight:400;color:var(--body)}
  .side{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  .tally{flex:0 0 auto;font-size:14px;line-height:1.35;font-weight:600;color:var(--title)}
  .fb{flex:0 0 auto;font-size:14px;line-height:1.45;color:var(--body);border-left:3px solid var(--on-highlight);padding:2px 0 2px 11px}
  .fb b{color:var(--title);font-weight:600}
  .wait{flex:1 1 auto;min-height:0;border:1.5px dashed var(--line);border-radius:10px;padding:14px 16px;
    font-size:14px;line-height:1.45;color:var(--body);display:flex;align-items:center}
  .side .reveal{flex:1 1 auto}
  .side .rt{font-size:15.5px}

  /* ---- the bar. margin-top:auto plus flex:0 0 auto means overflow above
         scrolls inside its own region and can never displace this row.
         This is the rule that keeps a Continue button on the canvas. ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:56px;overflow-y:auto;font-size:13px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    .board,.board.vd{grid-template-columns:1fr;gap:18px;align-items:start;align-content:start}
    .quote{margin-bottom:14px;padding:12px 14px}
    .quote .qt{font-size:16px;line-height:1.5}
    .q{font-size:17px}
    .intro p{font-size:16px}
    button.opt{font-size:16px;padding:11px 13px}
    button.opt .g{width:18px;height:18px;font-size:11px}
    .note{height:auto;overflow:visible;font-size:15px;margin-top:12px}
    .reveal{flex:0 0 auto;overflow:visible;padding:14px 15px}
    .rt,.side .rt{font-size:16px;line-height:1.5}
    .rules{overflow:visible}
    .row{grid-template-columns:1fr;gap:4px;padding:11px 13px}
    .row .nm{font-size:16px}
    .row .st{font-size:13px}
    .row .rr{font-size:16px}
    .lintro{font-size:16px}
    button.jump{font-size:14px;padding:7px 12px;justify-self:start}
    .board.srt{grid-template-columns:1fr}
    .scard{padding:10px 12px}
    .scard .ct{font-size:16px}
    .bins{flex:0 0 auto}
    button.bin{padding:12px 14px;min-height:76px}
    button.bin .bl{font-size:16px}
    button.bin .bh{font-size:14px}
    .chk .cc{font-size:14px}
    .res{flex:0 0 auto;overflow:visible;font-size:16px}
    .case .cx{font-size:16px}
    button.vbtn{font-size:15px;padding:8px 14px}
    .vr,.fb,.tally,.wait{font-size:15px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Sort six actions">

    <div class="top">
      <span class="prog" id="prog">1 of 7</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
      <span class="chip" id="chip" hidden></span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Continue</button>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:17px;color:#1C1B1B;margin:20px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ol,.nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:6px}
    .nsf strong{color:#1C1B1B}
    .nsf .box{background:#DCE1FF;border-left:4px solid #001D69;padding:12px 16px;margin:16px 0;color:#1C1B1B}
    .nsf a{color:#001D69}
  </style>
  <div class="nsf">
    <h2>Sort six actions</h2>
    <p>Here are six things you might do while assessing a client. Put each one into one of two columns, <strong>fine to do</strong> or <strong>needs written permission first</strong>.</p>
    <ol>
      <li>Search the public certificate log for the client's domain.</li>
      <li>Look the client's domain up in a public breach database, to see which staff email addresses have turned up in other companies' break-ins.</li>
      <li>Read the client's DNS records, the entries that say which servers answer for their address.</li>
      <li>Run a port scan against the client's server. A port scan knocks on every door on a machine in turn to see which ones open.</li>
      <li>Send test phishing emails to the client's staff. Phishing emails are fake messages written to see who clicks.</li>
      <li>Paste the client's address into a free online scanner.</li>
    </ol>
    <p>Decide all six before you read on.</p>

    <h3>Check your six</h3>
    <p><strong>1, 2 and 3 are fine.</strong> All three are reading. Those records were published, by somebody, for anybody to read.</p>
    <p><strong>4 and 5 need permission.</strong> Number 4 sends traffic at their machines, and it shows up in their logs as somebody probing them. Number 5 sends fake email to their staff and records who fell for it, which is a test run on people.</p>
    <div class="box">
      <p><strong>Passive is reading what is already published. Active is making a client's systems or a client's people do something for you.</strong></p>
      <p>Passive needs nobody's permission. Active always needs it, in writing, before you touch anything.</p>
      <p>Opening their public web page in your browser stays on the passive side. You are asking one machine for one page, the way its owner published it to be asked.</p>
    </div>
    <p><strong>6 needs permission too.</strong> Go back to where you put it, and to the reason you gave yourself.</p>
    <p>Pasting an address into a website feels like reading. You typed into a box on your own screen and sent nothing anywhere. Except you did.</p>
    <ul>
      <li>You handed a stranger the name of your client's system and told them it was worth a look.</li>
      <li>You cannot ask what they will do with it, because you do not know who they are.</li>
      <li>Plenty of free scanners work by firing traffic at whatever address you give them. So the scan may have happened anyway, using somebody else's hands.</li>
    </ul>
    <p><strong>Who are you handing this to, and can you look them up?</strong> Before you type a client's name into any tool, find out who runs it.</p>
    <p>Every tool this project sends you to has a name behind it, and a reputation that name would rather keep. Some are government agencies, some are companies, and some are small operations run on donated time. What they have in common is that you can find out which.</p>
  </div>
</noscript>

<script>
(function(){

  /* ---------------- content ----------------

  var S = [

    { id:"share", kind:"ask", label:"1, 2 and 3",

      q:"What puts 4 and 5 in the second column?",
      opts:[
        { id:"a", txt:"They need tools a beginner would not have.", ok:false,
          why:"The tool is not the line. What matters is what the action does to the client's side, whoever's tool it is." },
        { id:"b", txt:"They look for weaknesses instead of reading facts.", ok:false,

        { id:"c", txt:"They make the client's machines or the client's people do something.", ok:true },
        { id:"d", txt:"They could break something on the client's systems.", ok:false,

      ],
      reveal:{ lab:"Why", txt:"<b>4 and 5 need permission.</b> Number 4 sends traffic at their machines, and it shows up in their logs as somebody probing them. Number 5 sends fake email to their staff and records who fell for it, which is a test run on people." } },

    { id:"passive", kind:"verdict", label:"Passive or active",
      h1:"Passive or active?",
      q:"Call each one. Passive is like 1, 2 and 3. Active is like 4 and 5.",
      verdicts:[ { id:"p", key:"1", label:"Passive" }, { id:"a", key:"2", label:"Active" } ],
      cases:[
        { id:"web", txt:"Open their public web page in your browser.", ok:"p",
          why:"You are asking one machine for one page, the way its owner published it to be asked." },
        { id:"scan", txt:"Run a port scan against their server.", ok:"a",
          why:"Number 4 sends traffic at their machines, and it shows up in their logs as somebody probing them." },
        { id:"dns", txt:"Read their DNS records.", ok:"p",

        { id:"phish", txt:"Send test phishing emails to their staff.", ok:"a",

      ],
      reveal:{ lab:"The rule", txt:"<p><b>Passive is reading what is already published. Active is making a client's systems or a client's people do something for you.</b></p><p>Passive needs nobody's permission. Active always needs it, in writing, before you touch anything.</p><p>Opening their public web page in your browser stays on the passive side. You are asking one machine for one page, the way its owner published it to be asked.</p>" } },

    { id:"six", kind:"ask", label:"Number 6",
      h1:"Number 6: did you send anything?",
      source:{ head:"Number 6", items:[ { n:6, t:A[5] } ],
        after:"Pasting an address into a website feels like reading. You typed into a box on your own screen and sent nothing anywhere." },
      q:"When you pasted the client's address into that box, did you send anything?",
      opts:[
        { id:"a", txt:"No. You only typed into a box on your own screen.", ok:false,
          why:"That is how it feels, and that is the trap. The box sits on your screen, but it belongs to a website, and what you type goes to whoever runs it." },
        { id:"b", txt:"No, because the address is already public.", ok:false,
          why:"The address being public is not the issue. Pasting it in told a stranger that this system is your client's and worth a look." },
        { id:"c", txt:"Yes. You handed a stranger the name of your client's system.", ok:true },
        { id:"d", txt:"Only if the scanner keeps a copy of what you type.", ok:false,
          why:"Keeping a copy is not the point. The moment it left your screen, a stranger had the name, whatever they do with it after." }
      ],
      reveal:{ lab:"Except you did", txt:"<p><b>6 needs permission too.</b></p><ul><li>You handed a stranger the name of your client's system and told them it was worth a look.</li><li>You cannot ask what they will do with it, because you do not know who they are.</li><li>Plenty of free scanners work by firing traffic at whatever address you give them. So the scan may have happened anyway, using somebody else's hands.</li></ul>" } },

    { id:"tool", kind:"ask", label:"Before you type",
      h1:"Before you type a client's address into a tool",
      source:{ head:"What number 6 handed over", bullets:[
        "You handed a stranger the name of your client's system and told them it was worth a look.",
        "You cannot ask what they will do with it, because you do not know who they are.",
        "Plenty of free scanners work by firing traffic at whatever address you give them. So the scan may have happened anyway, using somebody else's hands." ] },
      q:"Before you type a client's address into any free tool, what do you check first?",
      opts:[
        { id:"a", txt:"Whether it is free or paid.", ok:false,
          why:"Paying does not tell you who is on the other end. A paid tool you cannot trace to anyone has the same problem." },
        { id:"b", txt:"Whether the site looks professional.", ok:false,
          why:"Anyone can make a site look professional. It tells you nothing about who runs it or what they do with what you type." },
        { id:"c", txt:"Whether other people recommend it.", ok:false,
          why:"A recommendation tells you it is popular, not who you are handing your client's name to." },
        { id:"d", txt:"Who runs it, and whether you can look them up.", ok:true }
      ],
      reveal:{ lab:"Check this first", txt:"<p><b>Who are you handing this to, and can you look them up?</b> Before you type a client's name into any tool, find out who runs it.</p><p>Every tool this project sends you to has a name behind it, and a reputation that name would rather keep. Some are government agencies, some are companies, and some are small operations run on donated time. What they have in common is that you can find out which.</p>" } },

    { id:"close", kind:"list", label:"What you called",
      h1:"What you called",
      lintro:"One row for each call you made. Anything you skipped has a button back to it.",
      rows:[
        { slide:"sort", name:"Sort six actions", result:function(){ return sortScore() + " 1, 2 and 3 are fine to do. 4, 5 and 6 need written permission first."; } },
        { slide:"share", name:"What 1, 2 and 3 share", result:"All three are reading. Those records were published, by somebody, for anybody to read." },
        { slide:"active", name:"What 4 and 5 do", result:"Number 4 sends traffic at their machines. Number 5 is a test run on people." },
        { slide:"passive", name:"Passive or active", result:"Passive needs nobody's permission. Active always needs it, in writing, before you touch anything." },
        { slide:"six", name:"Number 6", result:"You handed a stranger the name of your client's system and told them it was worth a look." },
        { slide:"tool", name:"Before you type", result:"Who are you handing this to, and can you look them up?" }
      ] }
  ];

  /* ---------------- state ----------------
     localStorage is wrapped: a blocked storage API must degrade silently, not
     throw and take the deck down with it. */
  var KEY = "vciso-p2-m3-sort-six-actions-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { answers:{}, out:{}, place:{}, calls:{} }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      /* Anything not shaped right is discarded. */
      if(!isPlain(raw)) return fresh();
      return { answers: isPlain(raw.answers) ? raw.answers : {},
               out:     isPlain(raw.out)     ? raw.out     : {},
               place:   isPlain(raw.place)   ? raw.place   : {},
               calls:   isPlain(raw.calls)   ? raw.calls   : {} };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var GLYPH = { pick:"●", out:"✕", ok:"✓" };

  /* Data validation, at load, loud. */
  (function validate(){
     var problems = [];
     var ids = {};
     S.forEach(function(s, n){
       if(!s.id) problems.push("slide " + (n+1) + " has no id");
       if(ids[s.id]) problems.push('duplicate slide id "' + s.id + '"');
       ids[s.id] = 1;
       if(s.kind === "sort"){
         var cids = {};
         (s.cards || []).forEach(function(c){
           if(cids[c.id]) problems.push('slide "' + s.id + '" has duplicate card id "' + c.id + '"');
           cids[c.id] = 1;
           if(!c.why) problems.push('slide "' + s.id + '" card "' + c.id + '" has no why');
           if(!BINS.some(function(b){ return b.id === c.bin; })) problems.push('slide "' + s.id + '" card "' + c.id + '" has no valid bin');
         });
         return;
       }
       if(s.kind === "verdict"){
         (s.cases || []).forEach(function(c){
           if(!c.why) problems.push('slide "' + s.id + '" case "' + c.id + '" has no why');
           if(!s.verdicts.some(function(v){ return v.id === c.ok; })) problems.push('slide "' + s.id + '" case "' + c.id + '" has no valid answer');
         });
         return;
       }
       if(s.kind !== "ask") return;
       var oids = {}, ok = 0;
       (s.opts || []).forEach(function(o){
         if(oids[o.id]) problems.push('slide "' + s.id + '" has duplicate option id "' + o.id + '"');
         oids[o.id] = 1;
         if(o.ok) ok++;
         else if(!o.why) problems.push('slide "' + s.id + '" option "' + o.id + '" has no why');
       });
       if(ok !== 1) problems.push('slide "' + s.id + '" has ' + ok + ' correct options, needs exactly 1');
     });
     if(problems.length){
       document.getElementById("board").innerHTML =
         '<div class="intro"><p><b>This deck has authoring errors and will not '
         + 'behave correctly:</b></p><ul style="font-size:13px;line-height:1.6;padding-left:18px">'
         + problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul></div>";
       throw new Error("deck data invalid: " + problems.join("; "));
     }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = m; }
  function placeOf(id){ return st.place[id] === "fine" ? "fine" : "perm"; }
  function binOf(id){ for(var k=0;k<BINS.length;k++) if(BINS[k].id === id) return BINS[k]; return null; }
  function slideById(id){ for(var k=0;k<S.length;k++) if(S[k].id === id) return S[k]; return null; }
  function sortScore(){
    var s = slideById("sort"), right = 0;
    s.cards.forEach(function(c){ if(placeOf(c.id) === c.bin) right++; });
    return "You got " + right + " of " + s.cards.length + " right.";
  }

  /* ---------------- chrome ---------------- */
  var GATED = { ask:1, sort:1, verdict:1 };
  var GATE_HINT = {
    ask:"Make a call to carry on. Ruling out the options you can also gets you there.",
    sort:"Click a card again to unmark it. Press Check my answers when you are done.",
    verdict:"Call all four to carry on. Keys 1 and 2 call the next open one."
  };
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    el.back.disabled = (i === 0);
    if(i === S.length-1){ el.next.disabled = true; el.next.textContent = "You are at the end"; }
    else if(GATED[s.kind] && !st.answers[s.id]){
      el.next.disabled = true;
      el.next.textContent = "Continue";
      if(!el.hint.textContent) el.hint.textContent = GATE_HINT[s.kind];
    }
    else { el.next.disabled = false; el.next.textContent = "Continue"; }
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);
    el.board.className = "board" + (s.kind === "ask" ? "" : s.kind === "verdict" ? " vd" : s.kind === "sort" ? " srt" : " one");
    el.hint.textContent = "";
    el.hint.className = "";

    if(s.kind === "intro" || s.kind === "close") renderProse(s);
    else if(s.kind === "list") renderList(s);
    else if(s.kind === "ask") renderAsk(s);
    else if(s.kind === "sort") renderSort(s);
    else if(s.kind === "verdict") renderVerdict(s);
    else {
      el.board.className = "board one";
      el.board.innerHTML = '<div class="intro"><p><b>Unhandled slide kind "'
        + esc(String(s.kind)) + '".</b></p></div>';
    }

    header();
    say("Slide " + (i+1) + " of " + S.length + ". " + s.h1 + ".");
  }

  function renderProse(s){
    el.board.innerHTML = '<div class="intro">' +
      (s.body || []).map(function(p){ return "<p>" + p + "</p>"; }).join("") + "</div>";
  }

  /* A closing list: one row per thing the student called, with a jump back to
     anything they skipped. Nothing dead-ends and nothing is disabled. */
  function renderList(s){
    var rows = (s.rows || []).map(function(r){
      var done = st.answers[r.slide];
      var res = typeof r.result === "function" ? esc(r.result()) : esc(r.result);
      return '<div class="row' + (done ? "" : " open") + '">'
        + '<div class="nm">' + esc(r.name) + "</div>"
        + '<div class="st">' + (done ? "You called it" : "Not yet") + "</div>"
        + '<div class="rr">' + (done ? res : "") + "</div>"
        + (done ? "" : '<button class="jump" type="button" data-j="' + esc(r.slide) + '">Go to it</button>')
        + "</div>";
    }).join("");
    el.board.innerHTML = '<div class="listwrap">'
      + '<div class="lintro">' + esc(s.lintro || "") + "</div>"
      + '<div class="rules">' + rows + "</div></div>";
    Array.prototype.forEach.call(el.board.querySelectorAll("button.jump"), function(b){
      b.addEventListener("click", function(){
        for(var k=0;k<S.length;k++){ if(S[k].id === b.dataset.j){ i = k; render(); el.frame.focus(); return; } }
      });
    });
  }

  /* ---------------- ask ---------------- */
  function sourceHTML(src){
    var h = '<div class="quote"><div class="qh">' + esc(src.head) + '</div>';
    (src.items || []).forEach(function(it){
      h += '<div class="qt"><span class="qn">' + esc(it.n) + '.</span>' + esc(it.t) + "</div>";
    });
    if(src.bullets) h += '<div class="qt"><ul>' + src.bullets.map(function(b){ return "<li>" + esc(b) + "</li>"; }).join("") + "</ul></div>";
    if(src.after) h += '<div class="qt">' + esc(src.after) + "</div>";
    return h + "</div>";
  }

  function renderAsk(s){
    var answered = st.answers[s.id];
    var left = '<div class="col">' + (s.source ? sourceHTML(s.source) : "") + "</div>";
    var right = '<div class="col">' +
      '<div class="q">' + esc(s.q) + "</div>" +
      '<div id="ask"' + (answered ? " hidden" : "") + '>' +
        '<div class="opts">' + s.opts.map(function(o){
          var out = st.out[s.id] && st.out[s.id][o.id];
          return '<button class="opt' + (out ? " out" : "") + '" type="button" data-o="' + o.id + '"' +
            (out ? ' disabled aria-disabled="true"' : "") + '>' +
            '<span class="g" aria-hidden="true">' + (out ? GLYPH.out : GLYPH.pick) + "</span>" +
            '<span class="txt">' + esc(o.txt) + "</span></button>";
        }).join("") + "</div>" +
        '<div class="note" id="note" role="status" aria-live="polite">' + priorNote(s) + '</div>' +
      "</div>" +
      '<div class="reveal" tabindex="-1"' + (answered ? "" : " hidden") + '>' +
        (answered ? revealHTML(s) : "") + "</div>" +
      "</div>";
    el.board.innerHTML = left + right;
    if(!answered) wireOpts(s);
  }

  function priorNote(s){
    var out = st.out[s.id];
    if(!out) return "";
    var last = null;
    s.opts.forEach(function(o){ if(out[o.id]) last = o; });
    return last ? "<b>Not this one.</b> " + last.why : "";
  }

  function revealHTML(s){
    return '<div><div class="rl">' + esc(s.reveal.lab) + '</div><div class="rt">' + s.reveal.txt + "</div></div>";
  }

  function wireOpts(s){
    var note = el.board.querySelector("#note");
    Array.prototype.forEach.call(el.board.querySelectorAll("button.opt"), function(b){
      b.addEventListener("click", function(){
        var o = null, j;
        for(j=0;j<s.opts.length;j++) if(s.opts[j].id === b.dataset.o) o = s.opts[j];
        if(!o) return;

        if(o.ok){ commit(s, "right"); return; }

        b.classList.add("out");
        b.disabled = true;
        b.setAttribute("aria-disabled","true");
        b.querySelector(".g").textContent = GLYPH.out;
        note.innerHTML = "<b>Not this one.</b> " + o.why;
        if(!st.out[s.id]) st.out[s.id] = {};
        st.out[s.id][o.id] = 1;
        save(st);

        var wrong = 0;
        for(j=0;j<s.opts.length;j++) if(!s.opts[j].ok) wrong++;
        if(Object.keys(st.out[s.id]).length >= wrong){ commit(s, "shown"); return; }

        var live = el.board.querySelector("button.opt:not(:disabled)");
        if(live) live.focus();
        say("Ruled out. " + note.textContent);
      });
    });
  }

  function commit(s, how){
    if(!st.answers[s.id] || how === "right") st.answers[s.id] = how;
    save(st);
    var ask = el.board.querySelector("#ask");
    var rv = el.board.querySelector(".reveal");
    rv.innerHTML = revealHTML(s);
    ask.hidden = true;
    rv.hidden = false;
    if(!reduce){ rv.classList.remove("in"); void rv.offsetWidth; rv.classList.add("in"); }
    rv.focus();
    /* The gating hint no longer applies once the slide is answered. */
    el.hint.textContent = "";
    header();
    var body = rv.querySelector(".rt");
    say((how === "right" ? "Correct. " : "") + s.reveal.lab + ". " + (body ? body.textContent : ""));
  }

  /* ---------------- sort (click to mark) ----------------
     The student clicks every action that is fine to do. Anything left
     unmarked counts as needs written permission first. A click or Enter
     toggles a card until the sort is checked. Checking is an explicit
     button, and every card is then marked right or wrong. */
  function tagHTML(s, c, checked){
    var p = placeOf(c.id);
    if(!checked) return p === "fine" ? '<span class="tg on" aria-hidden="true">' + GLYPH.ok + "</span>" : '<span class="tg" aria-hidden="true"></span>';
    if(p === c.bin) return '<span class="tg on" aria-hidden="true">' + GLYPH.ok + "</span>";
    return '<span class="tg x" aria-hidden="true">' + GLYPH.out + "</span>";
  }

  function cardLabel(c, checked){
    var p = placeOf(c.id);
    var base = "Action " + c.n + ": " + c.txt + " ";
    if(checked){
      var you = p === "fine" ? "You marked it fine to do." : "You left it unmarked.";
      if(p === c.bin) return base + you + " Right. It is " + binOf(c.bin).label + ".";
      return base + you + " Not right. It is " + binOf(c.bin).label + ".";
    }
    return base + (p === "fine" ? "Marked fine to do. Press Enter to unmark it." : "Not marked. Press Enter to mark it fine to do.");
  }

  function markedList(s){
    return s.cards.filter(function(c){ return placeOf(c.id) === "fine"; }).map(function(c){ return c.n; });
  }

  /* After checking, every wrong card's reason is on screen at once, grouped
     where cards share a reason, so nothing hides behind a second click. */
  function resultHTML(s){
    var wrong = s.cards.filter(function(c){ return placeOf(c.id) !== c.bin; });
    var right = s.cards.length - wrong.length;
    if(!wrong.length){
      return '<div class="sc">' + GLYPH.ok + " All six are right.</div>" +
        "<div>Continue to work out what separates the two columns.</div>";
    }
    /* One group per column the wrong cards belong in, with each distinct
       reason once, in card order. */
    var groups = [];
    BINS.forEach(function(b){
      var cs = wrong.filter(function(c){ return c.bin === b.id; });
      if(!cs.length) return;
      var whys = [];
      cs.forEach(function(c){ if(whys.indexOf(c.why) < 0) whys.push(c.why); });
      groups.push({ bin:b.id, ns:cs.map(function(c){ return c.n; }), whys:whys });
    });
    function names(ns){
      if(ns.length === 1) return String(ns[0]);
      return ns.slice(0, -1).join(", ") + " and " + ns[ns.length-1];
    }
    return '<div class="sc">' + right + " of " + s.cards.length + " right.</div>" +
      groups.map(function(g){
        return "<div><b>" + GLYPH.out + " " + names(g.ns) + (g.bin === "fine" ? (g.ns.length > 1 ? " are fine to do" : " is fine to do") : (g.ns.length > 1 ? " need written permission first" : " needs written permission first")) + ".</b> " + g.whys.map(esc).join(" ") + "</div>";
      }).join("");
  }

  function renderSort(s, focusId){
    var checked = !!st.answers[s.id];

    var cards = s.cards.map(function(c){
      var isWrong = checked && placeOf(c.id) !== c.bin;
      var picked = !checked && placeOf(c.id) === "fine";
      return '<div class="scard' + (picked ? " sel" : "") + (checked ? " locked" : "") + (isWrong ? " bad" : "") + '"' +
        ' role="button" data-c="' + c.id + '"' +
        (checked ? ' tabindex="-1" aria-disabled="true"' : ' tabindex="0" aria-pressed="' + (picked ? "true" : "false") + '"') +
        ' aria-label="' + esc(cardLabel(c, checked)).replace(/"/g, "&quot;") + '">' +
        '<span class="cn" aria-hidden="true">' + c.n + '</span>' +
        '<span class="ct" aria-hidden="true">' + esc(c.txt) + '</span>' +
        tagHTML(s, c, checked) + "</div>";
    }).join("");

    var side;
    if(!checked){
      var m = markedList(s);
      side = '<div class="tally">' +
        '<div class="tbox' + (m.length ? " on" : "") + '"><div class="bl">' + GLYPH.ok + ' Fine to do</div><div class="bh">' +
          (m.length ? "You marked " + (m.length === 1 ? String(m[0]) : m.slice(0, -1).join(", ") + " and " + m[m.length-1]) + "." : "Nothing marked yet.") + "</div></div>" +
        '<div class="tbox"><div class="bl">Needs written permission first</div><div class="bh">Every card you leave unmarked.</div></div>' +
        '<div class="chk"><button class="nav full" id="chk" type="button">Check my answers</button></div></div>';
    } else {
      side = '<div class="res" id="res" tabindex="-1">' + resultHTML(s) + "</div>";
    }

    var how = checked ? "" : '<div class="how"><b>What to do:</b> click every action that is fine to do. Leave the ones that need written permission first.</div>';
    el.board.innerHTML = how + '<div class="col"><div class="cards" id="cards">' + cards + '</div></div><div class="col">' + side + "</div>";
    wireSort(s, checked);
    if(focusId){
      var f = el.board.querySelector(focusId);
      if(f) f.focus();
    }
  }

  function toggleCard(s, id){
    if(st.answers[s.id]) return;
    if(placeOf(id) === "fine") delete st.place[id]; else st.place[id] = "fine";
    save(st);
    renderSort(s, '.scard[data-c="' + id + '"]');
    say("Action " + id.slice(1) + (placeOf(id) === "fine" ? " marked fine to do." : " unmarked."));
  }

  function checkSort(s){
    var allRight = s.cards.every(function(c){ return placeOf(c.id) === c.bin; });
    st.answers[s.id] = allRight ? "right" : "shown";
    save(st);
    el.hint.textContent = "";
    renderSort(s);
    header();
    var r = el.board.querySelector("#res");
    if(r){
      if(!reduce){ r.classList.remove("in"); void r.offsetWidth; r.classList.add("in"); }
      r.focus();
      say(r.textContent);
    }
  }

  function wireSort(s, checked){
    var cards = el.board.querySelectorAll(".scard");
    Array.prototype.forEach.call(cards, function(card, idx){
      var id = card.dataset.c;
      if(checked) return;
      card.addEventListener("click", function(){ toggleCard(s, id); });
      card.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggleCard(s, id); }
        else if(e.key === "ArrowDown" || e.key === "ArrowUp"){
          e.preventDefault();
          var to = cards[(idx + (e.key === "ArrowDown" ? 1 : cards.length - 1)) % cards.length];
          if(to) to.focus();
        }
      });
    });
    var chk = el.board.querySelector("#chk");
    if(chk) chk.addEventListener("click", function(){ checkSort(s); });
  }

  /* ---------------- verdict quiz (pattern 12) ----------------
     Same two verdicts, same order, every case. Each call locks and marks the
     student's pick. A wrong call never gets a checkmark: it is struck, marked
     with a cross, and the right verdict is named beside it. */
  function vById(s, id){ for(var k=0;k<s.verdicts.length;k++) if(s.verdicts[k].id === id) return s.verdicts[k]; return null; }
  function callsFor(s){ return isPlain(st.calls[s.id]) ? st.calls[s.id] : {}; }
  var lastCall = null;

  function renderVerdict(s, focusSel){
    var calls = callsFor(s);
    var done = s.cases.filter(function(c){ return calls[c.id]; }).length;
    var all = done === s.cases.length;
    var right = s.cases.filter(function(c){ return calls[c.id] === c.ok; }).length;

    var rows = s.cases.map(function(c, n){
      var v = calls[c.id];
      var inner;
      if(!v){
        inner = s.verdicts.map(function(x){
          return '<button class="vbtn" type="button" data-case="' + c.id + '" data-v="' + x.id + '"' +
            ' aria-label="' + esc(c.txt) + " " + x.label + '"><span class="k" aria-hidden="true">' + x.key + "</span>" + esc(x.label) + "</button>";
        }).join("");
      } else if(v === c.ok){
        inner = '<span class="vr"><span class="gl" aria-hidden="true">' + GLYPH.ok + "</span>" + esc(vById(s, v).label) + "</span>";
      } else {
        inner = '<span class="vr bad"><span class="gl" aria-hidden="true">' + GLYPH.out + "</span>" +
          '<span><s>' + esc(vById(s, v).label) + "</s> It is " + esc(vById(s, c.ok).label.toLowerCase()) + ".</span></span>";
      }
      return '<div class="case' + (v ? " done" : "") + (v && v !== c.ok ? " miss" : "") + '">' +
        '<div class="cx"><span class="sr">Case ' + (n+1) + ". </span>" + esc(c.txt) + "</div>" +
        '<div class="vb">' + inner + "</div></div>";
    }).join("");

    var side;
    if(!all){
      var fb = "";
      if(lastCall){
        var lc = null; s.cases.forEach(function(c){ if(c.id === lastCall) lc = c; });
        if(lc && calls[lc.id]){
          fb = '<div class="fb" role="status">' + (calls[lc.id] === lc.ok ? "<b>" + GLYPH.ok + " " + esc(vById(s, lc.ok).label) + ".</b> " :
            "<b>" + GLYPH.out + " Not " + esc(vById(s, calls[lc.id]).label.toLowerCase()) + ".</b> ") + esc(lc.why) + "</div>";
        }
      }
      side = '<div class="side"><div class="tally">Called ' + done + " of " + s.cases.length + "</div>" + fb +
        '<div class="wait">The rule appears here once all four are called.</div></div>';
    } else {
      side = '<div class="side"><div class="tally">' + right + " of " + s.cases.length + " called right</div>" +
        '<div class="reveal" tabindex="-1">' + revealHTML(s) + "</div></div>";
    }

    el.board.innerHTML = '<div class="col"><div class="q">' + esc(s.q) + '</div><div class="cases">' + rows + "</div></div>" + side;
    Array.prototype.forEach.call(el.board.querySelectorAll("button.vbtn"), function(b){
      b.addEventListener("click", function(){ callVerdict(s, b.dataset["case"], b.dataset.v); });
    });
    if(focusSel){ var f = el.board.querySelector(focusSel); if(f) f.focus(); }
  }

  function callVerdict(s, caseId, v){
    var calls = callsFor(s);
    if(calls[caseId] || !vById(s, v)) return;
    calls[caseId] = v;
    st.calls[s.id] = calls;
    lastCall = caseId;
    var c = null; s.cases.forEach(function(x){ if(x.id === caseId) c = x; });
    var all = s.cases.every(function(x){ return calls[x.id]; });
    if(all){
      var allRight = s.cases.every(function(x){ return calls[x.id] === x.ok; });
      st.answers[s.id] = allRight ? "right" : "shown";
    }
    save(st);
    renderVerdict(s, all ? ".reveal" : "button.vbtn");
    header();
    var msg = (calls[caseId] === c.ok ? "Right. " + vById(s, c.ok).label + ". " : "Not " + vById(s, v).label.toLowerCase() + ". It is " + vById(s, c.ok).label.toLowerCase() + ". ") + c.why;
    if(all){
      el.hint.innerHTML = (calls[caseId] === c.ok ? "<b>" + GLYPH.ok + " " + esc(vById(s, c.ok).label) + ".</b> " :
        "<b>" + GLYPH.out + " Not " + esc(vById(s, v).label.toLowerCase()) + ".</b> ") + esc(c.why);
      var rv = el.board.querySelector(".reveal");
      if(rv && !reduce){ rv.classList.remove("in"); void rv.offsetWidth; rv.classList.add("in"); }
      var body = rv ? rv.querySelector(".rt") : null;
      msg += " " + s.reveal.lab + ". " + (body ? body.textContent : "");
    }
    say(msg);
  }

  /* ---------------- navigation ----------------
     Three input methods on every multi-slide deck: visible buttons, keyboard
     arrows, and swipe. */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; lastCall = null; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var s = S[i];
    /* Number keys 1 and 2 call the next open case on the verdict quiz. */
    if(s.kind === "verdict"){
      var v = null; s.verdicts.forEach(function(x){ if(x.key === e.key) v = x; });
      if(v){
        var calls = callsFor(s), open = null;
        for(var k=0;k<s.cases.length;k++){ if(!calls[s.cases[k].id]){ open = s.cases[k]; break; } }
        if(open){ e.preventDefault(); callVerdict(s, open.id, v.id); }
      }
    }
  });

  /* One predicate, used by both the key handler and the swipe handler, so
     they can never drift apart about what owns an interaction. */
  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return true;
    var r = node.getAttribute && node.getAttribute("role");
    return r === "slider" || r === "textbox" || r === "spinbutton" || r === "listbox";
  }

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    if(ownsKeys(e.target)){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ----------------
     measure-fit.mjs steps through the deck with this. Keep it on every deck. */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; lastCall = null; render(); return true;
    },
    slides:S.length,
    pick:function(id){
      var b = el.board.querySelector('button.opt[data-o="' + id + '"]:not(:disabled)');
      if(b) b.click();
      return !!b;
    },
    reset:function(){ st = fresh(); save(st); lastCall = null; i = 0; render(); },
    state:function(){ return { i:i, answers:st.answers, out:st.out, place:st.place, calls:st.calls }; }
  };
})();
</script>
</body>
</html>
