  <div class="nsf">
    <h2>Which Can You Already Answer?</h2>
    <p>These are the six questions in section 4 of Meridian's questionnaire. Read each one and decide whether you think you can already answer it from work you've done. There is no wrong pick here, because this is your honest guess. Count how many you would tick, and write the number down, before you read on.</p>
    <ol>
      <li value="22"><strong>Has your organization had an external security audit or assessment in the last two years?</strong><span>In plain words: In the last two years, has anyone from outside the company checked how well Cumberland protects its systems and data?</span></li>
      <li value="23"><strong>How long do you keep security records, such as logs, incident reports and review records, and could you produce one for a past date if asked?</strong><span>In plain words: How long does Cumberland hold on to records like these, and could it find one from an old date if someone asked? <strong>Logs</strong> are the notes computers keep automatically about what happened on them. An <strong>incident report</strong> is a write-up of something that went wrong, like the two you read. <strong>Review records</strong> are notes that prove someone checked something on a certain date.</span></li>
      <li value="24"><strong>Do you have a documented incident response process, and has it been followed in practice?</strong><span>In plain words: Does Cumberland have a written plan for what to do when something goes wrong with its security, and have people actually followed it?</span></li>
      <li value="25"><strong>Do you record security incidents and analyze them to find and fix the root cause?</strong><span>In plain words: When something goes wrong, does Cumberland write it down and work out what really caused it, so it can stop it from happening again?</span></li>
      <li value="26"><strong>Are you required to notify customers or regulators of a security incident affecting their data, and within what timeframe?</strong><span>In plain words: If something goes wrong with its customers' data, does Cumberland have to tell those customers or regulators, and how quickly? <strong>Regulators</strong> are the official bodies that check companies follow the rules.</span></li>
      <li value="27"><strong>Do you test your ability to restore data and operations after an incident, for example backup restore tests or tabletop exercises?</strong><span>In plain words: Does Cumberland practice getting its data and work running again after a problem, before a real emergency forces it to? A <strong>restore test</strong> means restoring a backup on purpose to check it works. A <strong>tabletop exercise</strong> is a meeting where people talk through what they would do if something went wrong.</span></li>
    </ol>
    <h3>How many of the six could you already answer from work you have done?</h3>
    <div class="box">
      <p><strong>Nearly all of them.</strong></p>
      <p>Your evidence hunt (when you checked Ray's eight claims against Nate's files) and the two incident reports you read have already produced the answers. This is assembly, not new work.</p>
      <p>Assembly means putting answers together from things you already have.</p>
      <p>Write down your number, then go back to the module.</p>
    </div>
  </div>

  var Q = [

  /* Slides: one per question, then the reveal. */
  var S = Q.map(function(q, k){ return { kind:"q", q:q, k:k }; });

  /* ---------------- state ----------------

  var KEY = "vciso-p4-m12-which-can-you-already-answer-v1";

  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }

  function pickOf(q){ return st.picks[String(q.n)] || null; }
  function allPicked(){ return Q.every(function(q){ return !!pickOf(q); }); }
  function firstOpen(){ for(var k=0;k<NQ;k++){ if(!pickOf(Q[k])) return k; } return -1; }

    }
    el.segs.innerHTML = h;
    el.chip.innerHTML = icon("list") + "Meridian’s questionnaire, section 4";

    el.back.disabled = (i === 0);
    el.next.disabled = false;
    if(s.kind === "reveal"){
      el.next.textContent = "Start over";
      el.hint.innerHTML = allPicked()
        ? "<span>That is the end. Write down your number first, because <b>Start over</b> clears your ticks.</span>"
        : "<span>Use <b>Back</b> to make your missing pick.</span>";
      return;
    }
    el.next.textContent = (s.k === NQ-1) ? "See how many you ticked" : "Next question";
    if(st.shown){
      el.hint.innerHTML = "<span>You have already seen the answer, so your picks are locked. Use <b>Start over</b> on the last screen to tick again.</span>";
    } else if(!pickOf(s.q)){
      el.next.disabled = true;
      el.hint.innerHTML = "<span>Pick one to carry on. It is marked <b>Your pick</b>.</span>";
    } else {
      el.hint.innerHTML = "<span>Your pick is saved. You can change it until you see how many you ticked.</span>";
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    document.documentElement.classList.add("fresh");
    var s = S[i];
    if(s.kind === "q") renderQ(s); else renderReveal();
    el.frame.setAttribute("aria-label", el.h1.textContent);
    header();
    say(el.prog.textContent + ". " + el.h1.textContent + (s.kind === "q" ? " " + s.q.text : ""));
  }

  function optHTML(o, q){
    var p = pickOf(q), mine = p === o.id, locked = st.shown;
    var cls = mine ? " mine" : (locked ? " idle" : "");
    return '<button class="opt' + cls + '" type="button" data-o="' + o.id + '"'
      + ' aria-pressed="' + (mine ? "true" : "false") + '"'
      + (locked ? ' disabled aria-disabled="true"' : "") + ">"
      + '<span class="oi">' + icon(o.ic) + "</span>"
      + '<span class="ot"><span class="on">' + esc(o.name) + '</span><span class="od">' + esc(o.def) + "</span></span>"
      + (mine ? '<span class="tg" aria-hidden="true">' + icon(locked ? "lock" : "target") + "Your pick</span>"
              + '<span class="sr">Your pick.</span>' : "")
      + "</button>";
  }

  /* A question slide: the question word for word, its plain-words line, then two options, none chosen on arrival. */
  function renderQ(s){
    var q = s.q;
    el.h1.textContent = "Can You Already Answer This One?";
    el.board.innerHTML =
        '<div class="qcard">'
      +   '<div class="qno" aria-hidden="true"><small>No.</small><b>' + q.n + "</b></div>"
      +   '<span class="qk">Meridian’s question ' + q.n + ' asks</span>'
      +   '<p class="qt">' + esc(q.text) + "</p>"
      +   '<p class="qp"><b>In plain words:</b> ' + q.plain + "</p>"
      + "</div>"
      + '<p class="lead">' + LEAD + "</p>"
      + '<div class="opts" role="group" aria-label="Can you already answer question ' + q.n + '?">'
      +   OPTS.map(function(o){ return optHTML(o, q); }).join("")
      + "</div>";
    Array.prototype.forEach.call(el.board.querySelectorAll("button.opt:not(:disabled)"), function(b){
      b.addEventListener("click", function(){ choose(q, b.dataset.o); });
    });
  }

  function choose(q, id){
    if(st.shown) return;
    document.documentElement.classList.add("fresh");
    st.picks[String(q.n)] = id;
    save(st);
    renderQ(S[i]);
    header();
    var o = OPTS.filter(function(x){ return x.id === id; })[0];
    say("Your pick for question " + q.n + ": " + o.name + " " + strip(el.hint.textContent));
    var b = el.board.querySelector('button.opt[data-o="' + id + '"]');
    if(b) b.focus(phone() ? { preventScroll:true } : undefined);
  }

  /* The reveal: the count, the six with the student's ticks, then the P4-11 line. */
  function renderReveal(){
    var done = allPicked();
    if(done && !st.shown){ st.shown = true; save(st); }
    var n = ticks();
    el.h1.textContent = done ? "You Ticked " + n + " of " + NQ : "You Have Not Finished Yet";
    if(!done){
      var k = firstOpen();
      el.board.innerHTML = '<div class="statement"><p>You still have to make a pick on question ' + Q[k].n
        + '. Go back and make it, then come back here.</p></div>';
      return;
    }
    var rows = Q.map(function(q){
      var tk = pickOf(q) === "yes";
      return '<li class="' + (tk ? "tk" : "") + '">'
        + '<span class="mk"><span class="g" aria-hidden="true">' + (tk ? icon("check") : "") + "</span>"
        + '<span class="lb" aria-hidden="true">' + (tk ? "Ticked" : "Not ticked") + "</span></span>"
        + '<span class="lt"><b>' + q.n + "</b>" + esc(q.text)
        + '<span class="sr"> ' + (tk ? "You ticked this one." : "You did not tick this one.") + "</span></span>"
        + "</li>";
    }).join("");
    el.board.innerHTML =
        '<ul class="list" aria-label="Your ticks">' + rows + "</ul>"
      + '<div class="statement in" id="reveal" tabindex="-1">'
      +   '<p class="ask">How many of the six could you already answer from work you have done?</p>'
      +   '<p class="big">Nearly all of them.</p>'
      +   "<p>Your evidence hunt (when you checked Ray’s eight claims against Nate’s files) and the two incident reports you read have already produced the answers. This is assembly, not new work.</p>"
      +   '<p class="plain">Assembly means putting answers together from things you already have.</p>'
      +   '<p class="go">' + icon("back") + "<span>Write down your number, " + n + " of " + NQ + ", then go back to the module.</span></p>"
      + "</div>";
    if(reduce){ var r = el.board.querySelector("#reveal"); if(r) r.classList.remove("in"); }
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(); if(phone()) window.scrollTo(0,0); el.frame.focus({preventScroll:true});
    if(S[i].kind === "reveal") say(el.h1.textContent + ". How many of the six could you already answer from work you have done? Nearly all of them. Your evidence hunt and the two incident reports you read have already produced the answers. This is assembly, not new work. Write down your number, " + ticks() + " of " + NQ + ", then go back to the module.");
  }
  function startOver(){
    st = fresh(); save(st); i = 0; render();
    if(phone()) window.scrollTo(0,0);
    el.frame.focus({preventScroll:true});
    say("Started over. Question 1 of " + NQ + ".");
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){
    if(S[i].kind === "reveal"){ startOver(); return; }
    if(!el.next.disabled) go(1);
  });

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled && i < S.length-1) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });
  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }

  /* A cursor resting where new content lands must not tint an option (as in P2 m11 and m12). */
  var lastPt = null;
  document.addEventListener("pointermove", function(e){
    var pt = e.clientX + "," + e.clientY;
    if(lastPt !== null && pt !== lastPt) document.documentElement.classList.remove("fresh");
    lastPt = pt;
  }, true);

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled && i < S.length-1) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    state:function(){ return { i:i, picks:JSON.parse(JSON.stringify(st.picks)), shown:st.shown }; }
  };
})();
</script>
</body>
</html>
