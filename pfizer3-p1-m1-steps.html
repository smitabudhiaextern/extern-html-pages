<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medicine Journey Steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Card player: a rail with "Card X of N" on top,
   one card at a time, Back and Next below.
   Fixed stage: the deck is laid out on a 760 x 800 design stage and scaled as one piece to fit the
   Notion embed frame, so nothing ever scrolls. Set the Notion embed height to 800 px. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600); --icon:var(--extern-black); --connector:var(--extern-black);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --space-1:4px; --space-2:8px; --space-3:14px; --space-4:18px; --space-5:26px; --space-6:40px; --space-7:56px;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --stage-w:760px; --stage-h:800px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* The frame fills the embed; the app is the fixed design stage, scaled and centred by the script */
.frame{position:fixed;inset:0;overflow:hidden;background:var(--surface)}
.app{position:absolute;left:0;top:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;background:var(--surface)}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}
.pg-label{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-muted);white-space:nowrap}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:24px 28px;display:flex;flex-direction:column}
.inner{display:flex;flex-direction:column;gap:16px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.12;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:4px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:16px;line-height:1.6;color:var(--ink-muted);text-wrap:pretty;max-width:68ch}
.p b{font-weight:600;color:var(--ink)}

/* Tiles on surface-card */
.tile{background:var(--surface-card);border-radius:var(--radius-md);padding:18px 20px;min-width:0}
.tile h3{margin:0;font-size:18px;line-height:1.3;font-weight:600;color:var(--card-title)}
.tile p{margin:4px 0 0;font-size:15px;line-height:1.5;color:var(--card-text)}
.tile .num{display:block;margin-bottom:6px;font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}

/* Timeline: one row per stretch of time, the current one in Pfizer blue */
.when{background:var(--surface-card);border-radius:var(--radius-md);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.when-head{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);align-items:center;gap:6px 14px;font-size:15px;line-height:1.35;color:var(--card-text)}
.tl .name{min-width:0}
.tl .track{display:flex;align-items:center;gap:10px;min-width:0}
.tl .bar{display:block;height:10px;border-radius:5px;background:var(--blue-200);flex:none}
.tl .dur{white-space:nowrap;font-variant-numeric:tabular-nums}
.tl li.cur{color:var(--card-title);font-weight:600}
.tl li.cur .bar{background:var(--pfizer-blue)}
.tl .bar.open{border-top-right-radius:0;border-bottom-right-radius:0;background-image:linear-gradient(90deg,transparent 70%,var(--blue-50))}
.tl li.cur .bar.open{background-image:linear-gradient(90deg,transparent 70%,var(--blue-50))}
.fact{border:1.5px solid var(--ink);border-radius:var(--radius-md);padding:18px 20px}
.fact h3{margin:0 0 3px;padding-bottom:3px;font-family:var(--font-serif);font-weight:400;font-size:26px;line-height:1.15;color:var(--ink)}
.fact p{margin:0;font-size:15px;line-height:1.55;color:var(--ink-muted)}

/* Done message, shown above Back and Next after the last Next */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{padding:0;border:0}

/* Foot */
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="frame">
<div class="app" id="app">
  <h1 class="sr-only">How a medicine reaches patients, in 5 steps</h1>
  <header class="top">
    <nav class="rail" id="rail" aria-label="Steps"></nav>
    <div class="where"><b id="where-label">Discovery</b> · <span id="where-count">Card 1 of 5</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Card"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-next" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>
</div>

<script>
(function () {
  "use strict";
  /* Timeline numbers: PhRMA (10 to 15 years in all; discovery and preclinical 3 to 6 years; trials 6 to 7 years)
     and FDA PDUFA review goals (about 10 months standard, 6 months priority). */
  var SPANS = [
    { name: "Discovery and preclinical testing", dur: "3 to 6 years", w: 34 },
    { name: "Clinical trials", dur: "6 to 7 years", w: 46 },
    { name: "FDA review", dur: "about 10 months", w: 7 },
    { name: "Manufacturing and distribution", dur: "ongoing", w: 16, open: true }
  ];
  function timeline(cur) {
    return '<div class="when"><p class="when-head">How long it takes</p><ol class="tl">' + SPANS.map(function (s, n) {
      return '<li class="' + (n === cur ? 'cur' : '') + '"' + (n === cur ? ' aria-current="step"' : '') + '><span class="name">' + s.name + '</span>' +
        '<span class="track"><span class="bar' + (s.open ? ' open' : '') + '" style="width:' + s.w + '%" aria-hidden="true"></span><span class="dur">' + s.dur + '</span></span></li>';
    }).join("") + '</ol></div>';
  }

  var CARDS = [
    { label: "Discovery", eyebrow: "Step 01",
      html: '<h2 class="title">Discovery: Find Something That Might Work</h2>' +
        '<p class="p">Every medicine starts with a question: what goes wrong in the body when someone gets sick? Scientists pick a <b>target</b>, a part of the body linked to a disease, such as a protein that helps a cancer grow. Then they test thousands of <b>compounds</b> (chemical substances that could become a medicine) to find the few that act on that target.</p>' +
        timeline(0) },

    { label: "Preclinical", eyebrow: "Step 02",
      html: '<h2 class="title">Preclinical Testing: Check It Is Safe to Try</h2>' +
        '<p class="p"><b>Preclinical</b> means "before the clinic", so before any person takes it. The best compounds are tested in the lab and in animals to see whether they are safe enough to try in people. If the results look good, the company asks the <b>FDA</b> (the US Food and Drug Administration, the government agency that checks that medicines are safe and work) for permission to start testing in humans.</p>' +
        '<p class="p">Discovery and preclinical testing share one stretch of time on the timeline below.</p>' +
        timeline(0) },

    { label: "Clinical Trials", eyebrow: "Step 03",
      html: '<h2 class="title">Clinical Trials: Test It in People, in 3 Phases</h2>' +
        '<p class="p">A <b>clinical trial</b> is a careful study that tests a medicine in people. Each phase is bigger than the last, and the medicine only moves on if it passes.</p>' +
        '<div class="phases">' +
          '<div class="tile"><span class="num">PHASE 1</span><h3>Is It Safe?</h3><p>Usually 20 to 100 people, to check safety and find the right dose</p></div>' +
          '<div class="tile"><span class="num">PHASE 2</span><h3>Does It Work?</h3><p>Up to a few hundred patients, to check it helps and watch for side effects</p></div>' +
          '<div class="tile"><span class="num">PHASE 3</span><h3>Does It Work for Many?</h3><p>About 300 to 3,000 patients, to confirm it works and is safe for lots of people</p></div>' +
        '</div>' +
        '<p class="p">Every trial needs the right medicine at the right hospital, on time, with the right papers. That is the job of <b>Clinical Supply</b>, the team you\'ll support in this externship.</p>' +
        timeline(1) },

    { label: "FDA Review", eyebrow: "Step 04",
      html: '<h2 class="title">FDA Review: Prove It to the Experts</h2>' +
        '<p class="p">The company sends the FDA everything it learned, from the first lab tests to the last trial, in one big application. FDA experts check whether the medicine\'s benefits are bigger than its risks, and whether the company can make it the same way every time.</p>' +
        '<p class="p">The FDA aims to finish a standard review in <b>about 10 months</b>. For a <b>priority</b> medicine, one that could be a big step forward for patients, it aims for <b>6 months</b>.</p>' +
        timeline(2) },

    { label: "Manufacturing", eyebrow: "Step 05",
      html: '<h2 class="title">Manufacturing and Distribution: Get It to Patients</h2>' +
        '<p class="p">Once the medicine is approved, factories make it by the millions, following <b>Good Manufacturing Practice</b> (GMP), the rules that make sure every batch is made safely and the same way every time. Supply teams ship it to hospitals and pharmacies, and the FDA keeps watching for side effects for as long as it is sold.</p>' +
        timeline(3) +
        '<div class="fact"><h3>About 1 in 5,000 to 10,000</h3><p>That\'s how many compounds found in the lab ever become an approved medicine. From first idea to approval usually takes 10 to 15 years, which is why making new medicines is one of the riskiest, and most important, kinds of work there is.</p></div>' }
  ];
  var END_LABEL = "Done. Now Watch Ana's Video";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of the page.";

  /* Fixed stage: the deck is laid out at 760 x 800 and scaled as one piece to fit the frame, then centred. */
  var STAGE_W = 760, STAGE_H = 800;
  function fit() {
    var w = window.innerWidth, h = window.innerHeight, s = Math.min(w / STAGE_W, h / STAGE_H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (w - STAGE_W * s) / 2) + "px";
    app.style.top = Math.max(0, (h - STAGE_H * s) / 2) + "px";
  }

  CARDS.forEach(function (c, n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    var plain = c.label.replace(/&amp;/g, "&");
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + plain);
    b.innerHTML = '<span class="seg"></span><span class="pg-label">' + c.label + '</span>';
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function titleOf(n) { var m = CARDS[n].html.match(/<h2[^>]*>(.*?)<\/h2>/); return m ? m[1].replace(/<[^>]+>/g, "") : ""; }

  function render(anim, nav) {
    var c = CARDS[i];
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.eyebrow + '</p>' + c.html + '</div>';
    Array.prototype.forEach.call(rail.children, function (b, n) {
      b.classList.toggle("is-cur", n === i);
      b.classList.toggle("is-done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("where-label").innerHTML = c.label;
    $("where-count").textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + titleOf(i + 1) + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n < 0 || n >= CARDS.length || n === i) return; i = n; render(true, true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i === CARDS.length - 1) {
      /* The message shows in the deck, above Back and Next. The postMessage is kept for pages that listen, but nothing needs it. */
      donemsg.textContent = DONE_MSG;
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "extern-deck-done" }, "*");
      return;
    }
    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", fit);

  fit();
  render(false);
})();
</script>
</body>
</html>
