<template id="s1">
  <p class="p">This challenge is optional. It's for you if you want to write the code yourself, not paste it from the steps.</p>
  <p class="p"><b>Your goal:</b> "Starting from a blank cell, I can write one pattern that finds the letter's date in page 1's text, and split it into the day, the month and the year."</p>
  <ol class="list">
    <li>Open your notebook from the last reading's challenge. It already opens the supplier file as <code>doc</code>. If Colab disconnected, run its cells again from the top.</li>
    <li>Add a blank code cell at the bottom with <b>+ Code</b>.</li>
    <li>Get page 1's text. Write a pattern that finds <code>3 June, 2022</code> in it, and also <code>3 June,2022</code>, with no space after the comma.</li>
    <li>Print the whole date, then the day, the month and the year on their own lines.</li>
  </ol>
  <p class="p">Skipped that challenge? Open a new notebook with <b>File → New notebook in Drive</b>. Set it up first: run <code>!pip install pymupdf</code>, upload <code>sample-sdf-document.pdf</code> with <code>files.upload()</code>, and open it as <code>doc</code> with <code>pymupdf.open()</code>.</p>
  <p class="p">Don't copy from the steps. Stuck? Each of the next three slides holds one hint.</p>
</template>

<template id="s2">
  <p class="p">Open this hint if you don't know where to start. It names the tools you need.</p>
  {{REVEAL:h1:Show Hint 1}}
  <ul class="list">
    <li><code>doc[0].get_text("text")</code> gives the text of page 1, the letter.</li>
    <li><code>re.search()</code> finds the first match of a pattern. Put an <code>r</code> before the pattern's quotes, so Python keeps every backslash.</li>
    <li><code>\d</code> is one digit. <code>{1,2}</code> means "1 or 2 of these", and <code>{4}</code> means "exactly 4".</li>
    <li><code>\s</code> is a space. <code>+</code> means "one or more", and <code>*</code> means "zero or more".</li>
    <li><code>[A-Z]</code> is one capital letter, and <code>[a-z]+</code> is one or more small letters.</li>
    <li>Round brackets make a group. <code>match.group(1)</code> gives back what the first group captured, and <code>match.group()</code> the whole match.</li>
  </ul>
  {{/REVEAL}}
</template>

<template id="s3">
  <p class="p">Open this hint if you know which tools to use, but not how to write them.</p>
  {{REVEAL:h2:Show Hint 2}}
  <p class="p">Both pages below come from Python's official documentation, written by the people who make Python.</p>
  <div class="links stack">
    {{OPEN:RE:Python: The re Module}}
    {{OPEN:HOWTO:Python: Regular Expression HOWTO}}
  </div>
  <p class="p">The first page lists every symbol a pattern can use, and what <code>re.search()</code> and <code>group()</code> do. The second is a gentle guide that builds patterns step by step, including groups.</p>
  {{/REVEAL}}
</template>

<template id="s4">
  <p class="p">Open this hint only if the first two weren't enough. It shows the code with blanks, and each blank is one word, one symbol or one number.</p>
  {{REVEAL:h3:Show Hint 3}}
  {{CODE:python:Python:import re

text = doc[_].get_text("____")

match = re.search(r"(\d{_,_})\s+([A-Z][a-z]_),\s_(\d{_})", text)

if match:
    print("Letter Date:", match.group())
    print("Day:", match.group(_))
    print("Month:", match.group(_))
    print("Year:", match.group(_))}}
  {{/REVEAL}}
</template>

<template id="s5">
  <p class="p">Try the challenge first. Then open the solution to compare it with what you wrote.</p>
  {{REVEAL:sol:Show the Solution}}
  {{CODE:python:Python:import re

text = doc[0].get_text("text")

match = re.search(r"(\d{1,2})\s+([A-Z][a-z]+),\s*(\d{4})", text)

if match:
    print("Letter Date:", match.group())
    print("Day:", match.group(1))
    print("Month:", match.group(2))
    print("Year:", match.group(3))}}
  <p class="p"><b>Why <code>re</code>?</b> It comes with Python, so there's nothing to install. <b>Why <code>re.search()</code>?</b> The letter has one date, and <code>re.search()</code> gives back one match with its groups. <code>re.findall()</code> would give back a list instead.</p>
  {{/REVEAL}}
</template>

<template id="s6">
  <p class="p">This is what the solution prints.</p>
  {{REVEAL:sol:Show the Solution}}
  {{CODE:plain:Output:Letter Date: 3 June, 2022
Day: 3
Month: June
Year: 2022}}
  <p class="p"><code>,\s*</code> matches the comma with any number of spaces after it, even none. So the same pattern also finds <code>3 June,2022</code>, the way pdfplumber read it.</p>
  {{/REVEAL}}
</template>

<template id="s7">
  <p class="p">You might write the day as exactly 2 digits, <code>\d{2}</code>, like this:</p>
  {{CODE:python:Python:print(re.search(r"(\d{2})\s+([A-Z][a-z]+),\s*(\d{4})", text))}}
  {{CODE:plain:Output:None}}
  <p class="p">It finds nothing, because the day in the letter is <code>3</code>, only 1 digit. <code>\d{1,2}</code> takes 1 or 2 digits, so it works for the 3rd and for the 30th.</p>
</template>

<template id="s8">
  <p class="p">You might find the date with no round brackets, then ask for a group:</p>
  {{CODE:python:Python:match = re.search(r"\d{1,2}\s+[A-Z][a-z]+,\s*\d{4}", text)
print("Letter Date:", match.group())
print("Day:", match.group(1))}}
  {{CODE:plain:Output:Letter Date: 3 June, 2022
...
IndexError: no such group}}
  <p class="p">The whole date prints, but there's no group 1, because only round brackets make a group. Put brackets around the day, the month and the year.</p>
</template>

<template id="s9">
  <p class="p">Run your cell. Then compare your output with what the Try It Yourself steps printed in your copy of this reading's notebook. Open that notebook only now, to check.</p>
  <ol class="list">
    <li>Check the whole date. It should be <code>3 June, 2022</code>, as the notebook's Step 5 printed.</li>
    <li>Check the pieces. The day, the month and the year should be <code>3</code>, <code>June</code> and <code>2022</code>, as in the steps' Step 5.</li>
    <li>Check the comma. Swap <code>text</code> for <code>"3 June,2022"</code> in your <code>re.search()</code> line and run it again. It should still find the date.</li>
  </ol>
  <p class="p">If you named things differently, that's fine. The date and its 3 pieces are what should match.</p>
  <p class="p">If all three match, you wrote a pattern for the letter's date and split it into its pieces, by yourself.</p>
</template>

    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", g.name + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + g.name + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + body(s.tpl) + '</div>';
  }

  function wire() {
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });
    Array.prototype.forEach.call(card.querySelectorAll("[data-reveal]"), function (b) {
      b.addEventListener("click", function () {
        var key = b.getAttribute("data-reveal"), box = $("rv-" + key);
        shown[key] = true;
        b.setAttribute("aria-expanded", "true"); b.hidden = true; box.hidden = false;
        var first = box.querySelector("a,button,pre"); if (first) first.focus({ preventScroll: true });
      });
    });
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    wire();

    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() { donemsg.textContent = DONE_MSG; }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  /* Left and Right arrow keys move between slides */
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", scaleStage);
  scaleStage();
  render(false);
})();
</script>
</body>
</html>
