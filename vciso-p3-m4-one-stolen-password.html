<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Stolen Password</title>
<!--
  vCISO P3 Step 1, Module 4: One stolen password.
  Built from the Extern deck shell (.claude/skills/build-html-slides/assets/deck-shell.html),
  matched to the house look of 09-assets/final/vciso-p3-m2-control-or-written-rule.html.
  Governing authority: output/programs/vciso/VCISO-STYLE-GUIDE.md section 6, which
  sets the larger type scale and the per-slide tint ramp used here.
  Spec: 06-content/project-03/step-01/module-04-internal.md, "Build note".
  Items, answers and reasons: P3 Sample Pack/Interactive content sets - P3.md, P3-4
  (SME drop 2026-09-25 copy, identical to the older copy for P3-4).

  Spec rules kept here:
  - Two buttons per place, In and Blocked, plus a free-text box,
    "What stops them, if anything?". The free text is never marked.
  - All five calls are made before any answer shows.
  - The reveal shows the SME reason beside what the student typed.
  - No closing panel. The module prose carries the synthesis and the
    definitions of authentication, authorization and MFA, so this deck
    defines none of the three.
  - VPN and administrator console carry a short plain definition on
    their own cards (QA fix, 2 October 2026), so the deck reads on its own.
  - Under four of the SME reasons sits our own "In plain words" line,
    visually secondary. The SME reasons themselves are kept verbatim.

  Not scope dependent: P3-4 is one item set for all four scopes.

  Verify before shipping, both gates, every time:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs   this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  /* ===============================================================
     The palette. The Extern five, plus the vCISO per-slide tint ramp
     (VCISO-STYLE-GUIDE.md 6b, listed in 09-assets/deck-palette.json).
     Tint carries no meaning. Every tint of navy is an rgba() of
     #001D69. No state is ever signalled by colour alone: every
     coloured state also carries a glyph or a label.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, borders, fills      */
    --bg:#FDF8F8;           /* canvas background, and text on navy */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t3{background:#F2E3D2}
  body.t4{background:#DEEBDA}
  body.t5{background:#F0E4EF}
  body.t6{background:#D0EEF1}
  body.t7{background:#EEDAD6}
  body.t8{background:#E6EADC}
  body.t9{background:#D1E2F1}
  body.t10{background:#EAD8E7}
  body.t11{background:#D4EEE5}
  body.t12{background:#F0D7D8}

  /* ---- the 960x540 canvas, scaled down only, never up ----
     flex:0 0 auto is load bearing: the canvas always holds 960 in layout
     and the transform does all of the fitting. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header ---- */
  /* min-height holds the row at the chip's height, so the h1 does not
     jump down when the score chip appears. */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:12px}

  /* ---- the board ---- */
  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
  .intro{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;max-width:74ch}
  .intro p{font-size:17px;line-height:1.5}
  .intro p b{color:var(--title);font-weight:600}

  svg.ic{width:28px;height:28px;flex:0 0 auto;fill:none;stroke:var(--on-highlight);stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}

  /* ---- slide 1: the five places, as a preview row ---- */
  .places{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px}
  .pl{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;padding:12px 10px;
    display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .pl .pn{font-size:12px;font-weight:600;color:var(--on-highlight)}
  .pl .pt{font-size:15px;line-height:1.3;font-weight:600;color:var(--title)}

  /* ---- slides 2 to 6: one place, a call, a few words ---- */
  .who{flex:0 0 auto;display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.35;color:var(--body);
    background:var(--tint);border:1.5px dashed var(--line);border-radius:9px;padding:6px 12px}
  .who svg.ic{width:22px;height:22px}
  .who b{color:var(--title);font-weight:600}
  .pcard{flex:0 0 auto;display:flex;align-items:center;gap:18px;
    background:var(--bg);border:1.5px solid var(--on-highlight);border-left-width:6px;border-radius:12px;
    padding:12px 22px}
  .pcard .ib{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:2px solid var(--on-highlight);
    background:var(--highlight);display:flex;align-items:center;justify-content:center}
  .pcard .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
  .pcard .pn{font-size:13px;font-weight:600;color:var(--on-highlight)}
  .pcard .ct{font-size:24px;line-height:1.25;font-weight:600;color:var(--title)}
  .pcard .gl{font-size:16px;line-height:1.4;color:var(--body)}

  .ans-row{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  button.ans{font-family:inherit;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 16px;
    background:var(--bg);color:var(--title);border:2px solid var(--on-highlight);border-radius:10px;
    transition:background var(--t-fast) var(--ease-out),color var(--t-fast) var(--ease-out),opacity var(--t-fast) var(--ease-out)}
  button.ans:hover:not(:disabled){background:var(--highlight)}
  button.ans:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.ans:disabled{cursor:default}
  button.ans .bk{flex:0 0 auto;width:28px;height:26px;border-radius:6px;border:1.5px solid var(--on-highlight);
    background:var(--highlight);font-size:14px;font-weight:600;color:var(--on-highlight);
    display:flex;align-items:center;justify-content:center}
  button.ans .lb{flex:1 1 auto;display:flex;flex-direction:column;gap:1px}
  button.ans .al{font-size:20px;font-weight:600;line-height:1.2}
  button.ans .sb{font-size:14px;line-height:1.3;color:var(--body)}
  button.ans .tg{flex:0 0 auto;font-size:13px;font-weight:600;white-space:nowrap}
  /* The student's current call: filled navy, a dot and the words
     "Your call". A dot, not a tick: nothing is marked yet. */
  button.ans.is-pick{background:var(--on-highlight);color:var(--bg)}
  button.ans.is-pick .sb{color:var(--bg)}
  button.ans.is-pick .bk{background:var(--bg);border-color:var(--bg)}
  button.ans.is-pick:hover:not(:disabled){background:var(--on-highlight)}
  button.ans.is-off{opacity:.45}

  .wr{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px}
  .wr .wl{display:flex;align-items:baseline;gap:12px}
  .wr label{font-size:17px;font-weight:600;color:var(--title)}
  .wr .wh{font-size:13px;color:var(--body)}
  .wr .wc{margin-left:auto;font-size:13px;color:var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
  textarea{font-family:inherit;font-size:16px;line-height:1.45;color:var(--title);background:var(--bg);
    border:1.5px solid var(--line);border-radius:9px;resize:none;display:block;width:100%;
    flex:1 1 auto;min-height:56px;padding:8px 11px}
  textarea:hover:not([readonly]){border-color:var(--on-highlight)}
  textarea:focus-visible{outline:3px solid var(--on-highlight);outline-offset:1px;border-color:var(--on-highlight)}
  textarea[readonly]{background:var(--tint);border-style:dashed}

  /* ---- slide 7: check your five calls ---- */
  .lead{flex:0 0 auto;font-size:17px;line-height:1.5;max-width:74ch}
  .lead b{color:var(--title);font-weight:600}
  .rows{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:8px}
  .rw{min-height:0;display:grid;grid-template-columns:36px minmax(0,1.25fr) minmax(0,1.6fr) auto;align-items:center;column-gap:14px;
    background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:9px;padding:6px 12px}
  .rw.open{border-style:dashed;background:var(--tint)}
  .rw .cn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--on-highlight);background:var(--highlight);
    color:var(--on-highlight);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .rw .rn{font-size:16px;line-height:1.25;font-weight:600;color:var(--title)}
  .rw .rc{font-size:15px;line-height:1.35;color:var(--body);min-width:0}
  .rw .rc b{color:var(--on-highlight);font-weight:600}
  .rw .rq{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
  .rw .mk{font-weight:600;color:var(--title)}
  .rows.in{animation:rin var(--t-reveal) var(--ease-over) both}
  button.jump{font-family:inherit;font-size:14px;font-weight:600;color:var(--on-highlight);
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:7px;padding:7px 13px;cursor:pointer;white-space:nowrap}
  button.jump:hover{background:var(--tint2)}
  button.jump:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  /* ---- slides 8 to 12: one answer each ---- */
  .verdict{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .vb{border-radius:10px;padding:7px 16px;display:flex;align-items:center;gap:14px;min-height:56px}
  .vb .vk{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .vb .vv{font-size:24px;font-weight:600;line-height:1.15}
  .vb .vs{font-size:15px;line-height:1.3}
  .vb .vt{display:flex;flex-direction:column;gap:2px}
  /* The big word and its caption share a line, to leave room for the
     reason and its plain-words line below. */
  .vb .vr{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 12px}
  .vb .gl{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:600}
  .vb.ans{background:var(--on-highlight);color:var(--bg)}
  .vb.ans .gl{background:var(--bg);color:var(--on-highlight)}
  .vb.you{background:var(--bg);border:2px solid var(--on-highlight);color:var(--title)}
  .vb.you .gl{border:2px solid var(--on-highlight);color:var(--on-highlight)}
  .vb.you .vk{color:var(--on-highlight)}
  .vb.you.wrong{border-style:dashed}
  .vb.you.wrong .vv{text-decoration:line-through;text-decoration-thickness:1.5px;font-weight:400;color:var(--body)}
  .side{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pane{min-height:0;border-radius:10px;padding:12px 18px;display:flex;flex-direction:column;gap:6px}
  .pane .ph{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--on-highlight)}
  .pane .pb{font-size:17px;line-height:1.5;color:var(--title)}
  .pane.mine{background:var(--bg);border:1.5px dashed var(--line)}
  .pane.mine .pb{color:var(--body);overflow-wrap:anywhere}
  .pane.mine .pb.none{font-style:italic}
  .pane.why{background:var(--highlight);border-left:5px solid var(--on-highlight);border-radius:0 10px 10px 0}
  /* Our plain-words line under the SME reason: smaller, body colour,
     set off by a hairline, so it reads as a gloss and not as the reason. */
  .pane .pw{font-size:15px;line-height:1.4;color:var(--body);border-top:1px solid var(--line);padding-top:5px}
  .pane .pw .pk{font-weight:600;color:var(--on-highlight)}
  /* Nothing written: the reason takes the full width. */
  .side.solo{grid-template-columns:1fr}
  .reveal.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .reveal{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px}
  /* The trail: all five places, with only the answers already shown.
     Status is always a word, never colour or border alone. */
  .trail{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
  .trail .tl{font-size:13px;font-weight:600;color:var(--on-highlight)}
  .trail .tg5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .tr{min-width:0;display:flex;align-items:center;gap:8px;padding:5px 10px;border:1.5px solid var(--on-highlight);
    border-radius:9px;background:var(--bg)}
  .tr svg.ic{width:22px;height:22px}
  .tr .tt{display:flex;flex-direction:column;min-width:0;gap:1px}
  .tr .tn{font-size:13px;line-height:1.25;font-weight:600;color:var(--title)}
  .tr .ts{font-size:13px;line-height:1.25;font-weight:600;color:var(--on-highlight)}
  .tr.here{background:var(--highlight);box-shadow:inset 0 0 0 1.5px var(--on-highlight)}
  .tr.later{border-style:dashed;border-color:var(--line);background:transparent}
  .tr.later .ts{font-weight:400;color:var(--body)}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* ---- the bar ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:12px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled,button.nav[aria-disabled="true"]{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:44px;overflow-y:auto;font-size:13px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px;min-height:52px;align-content:flex-start}
    .segs i{width:14px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    .intro p,.lead{font-size:16px}
    .places{grid-template-columns:1fr 1fr;gap:8px}
    .pl .pt{font-size:16px}
    .pcard{gap:14px;padding:14px 14px}
    .pcard .ct{font-size:20px}
    .ans-row{grid-template-columns:1fr;gap:10px}
    button.ans .al{font-size:18px}
    .wr .wl{flex-wrap:wrap;gap:4px 10px}
    .wr .wh{flex:1 1 100%;order:3;font-size:14px}
    textarea{flex:0 0 auto;height:110px}
    .rows{grid-template-rows:none;gap:10px}
    .rw{grid-template-columns:32px 1fr;row-gap:6px;padding:10px 12px}
    .rw .rc,.rw .ra{grid-column:2}
    .rw .ra{justify-self:start}
    .rw .rq{white-space:normal}
    .rw .rc,.rw .rq{overflow-wrap:anywhere}
    .pane .pw{font-size:16px}
    .verdict,.side{grid-template-columns:1fr;gap:10px}
    .pane .pb{font-size:16px}
    .trail .tg5{grid-template-columns:1fr;gap:6px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
    #hint .kb{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="One stolen password">

    <div class="top">
      <span class="prog" id="prog">1 of 12</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
      <span class="chip" id="chip" hidden></span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Start</button>
      <button class="nav ghost" id="again" type="button" hidden>Start again</button>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:17px;color:#1C1B1B;margin:20px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ol,.nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:6px}
    .nsf strong{color:#1C1B1B}
  </style>
  <div class="nsf">
    <h2>One stolen password</h2>
    <p>A stranger outside Cumberland has one staff member's password. There are five places they might try to reach.</p>
    <ol>
      <li>Staff webmail (internet-facing)</li>
      <li>Remote VPN (internet-facing)</li>
      <li>A shared network drive (internal)</li>
      <li>The billing platform (regular user)</li>
      <li>An administrator console</li>
    </ol>
    <p>For each place, decide whether you think the password gets the stranger <strong>in</strong>, or whether they are <strong>blocked</strong>. Then write down what stops them, if anything. Make all five calls before you read on.</p>

    <h3>The answers</h3>
    <!-- Plain-words lines are ours; SME reasons kept verbatim. Ask Chaitanya to review. -->
    <ul>
      <li><strong>1. Staff webmail: In.</strong> Password only. No MFA for staff.<br>In plain words: Cumberland does not ask ordinary staff for a second proof, like a code on their phone.</li>
      <li><strong>2. Remote VPN: In.</strong> Password only. And this is the key one: it opens the internal network.<br>In plain words: once on the VPN, the stranger is inside Cumberland's own network, where the other places sit.</li>
      <li><strong>3. A shared network drive: In.</strong> Not reachable from outside directly. But once the VPN lets them in, the password opens this too.<br>In plain words: the drive cannot be reached straight from the internet, but the VPN already put the stranger inside, and there the same password opens it.</li>
      <li><strong>4. The billing platform: In.</strong> Password only.</li>
      <li><strong>5. An administrator console: Blocked.</strong> Two reasons: a staff account isn't authorized as an admin in the first place, and admin logins also require a second factor.<br>In plain words: this staff account is not allowed into the console at all, and even a real administrator has to give a second proof, like a code on their phone.</li>
    </ul>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ---------------- content ----------------
     Place names, answers and reasons: P3-4 in
     P3 Sample Pack/Interactive content sets - P3.md, as written into the
     spec table in module-04-internal.md (US spelling "authorized", the
     SME's dashes turned into full stops and a colon). Order is the SME's.
     `gl` is our plain-words note on what each place is. It never says
     whether the password works there. */
  var CALLS = [
    { id:"in",      key:"1", label:"In",      sub:"The password gets them in" },
    { id:"blocked", key:"2", label:"Blocked", sub:"Something stops them" }
  ];
  /* `plain` is our own "In plain words" line, shown under the SME reason
     and visually secondary to it. Plain-words lines are ours; SME reasons
     kept verbatim. Ask Chaitanya to review. Billing needs none. */
  var PLACES = [
    { id:"webmail", n:1, ico:"mail", name:"Staff webmail (internet-facing)", short:"Staff webmail",
      gl:"Email that staff read in a web browser. Internet-facing means it can be reached from anywhere on the internet.",
      ans:"in",
      why:"Password only. No MFA for staff.",
      plain:"Cumberland does not ask ordinary staff for a second proof, like a code on their phone." },
    { id:"vpn", n:2, ico:"globe", name:"Remote VPN (internet-facing)", short:"Remote VPN",
      gl:"A private connection that lets staff working from home reach the office network as if they were in the building. Like webmail, anyone on the internet can reach it.",
      ans:"in",
      why:"Password only. And this is the key one: it opens the internal network.",
      plain:"once on the VPN, the stranger is inside Cumberland's own network, where the other places sit." },
    { id:"drive", n:3, ico:"folder", name:"A shared network drive (internal)", short:"A shared network drive",
      gl:"A folder on Cumberland's own network where staff save and share files. Internal means it sits inside that network.",
      ans:"in",
      why:"Not reachable from outside directly. But once the VPN lets them in, the password opens this too.",
      plain:"the drive cannot be reached straight from the internet, but the VPN already put the stranger inside, and there the same password opens it." },
    { id:"billing", n:4, ico:"receipt", name:"The billing platform (regular user)", short:"The billing platform",
      gl:"The software Cumberland's staff use to do the billing work. Regular user means the account belongs to an ordinary staff member, not an administrator.",
      ans:"in",
      why:"Password only." },
    { id:"admin", n:5, ico:"sliders", name:"An administrator console", short:"An administrator console",
      gl:"The screen where an administrator changes settings for everyone else.",
      ans:"blocked",
      why:"Two reasons: a staff account isn't authorized as an admin in the first place, and admin logins also require a second factor.",
      plain:"this staff account is not allowed into the console at all, and even a real administrator has to give a second proof, like a code on their phone." }
  ];
  var MAXLEN = 160;

  /* Inline SVG icons, Phosphor style: one weight, outline, navy. */
  var ICON = {
    mail:'<rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/>',
    globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/>',
    folder:'<path d="M3 7.5V18a1.5 1.5 0 0 0 1.5 1.5h15A1.5 1.5 0 0 0 21 18V9a1.5 1.5 0 0 0-1.5-1.5H12L9.8 5H4.5A1.5 1.5 0 0 0 3 6.5z"/>',
    receipt:'<path d="M5 3.5h14V21l-2.3-1.5L14.3 21 12 19.5 9.7 21l-2.4-1.5L5 21z"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/>',
    sliders:'<path d="M5 4v16M12 4v16M19 4v16"/><circle cx="5" cy="15" r="2.2" fill="#FDF8F8"/><circle cx="12" cy="8" r="2.2" fill="#FDF8F8"/><circle cx="19" cy="13" r="2.2" fill="#FDF8F8"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.4-3.8 4.4-5.8 8-5.8s6.6 2 8 5.8"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICON[k] + "</svg>"; }

  var S = [{ id:"start", kind:"intro", label:"Start", h1:"One stolen password" }];
  PLACES.forEach(function(p){
    S.push({ id:"call-" + p.id, kind:"call", place:p, label:"Place " + p.n + " of 5",
      h1:"Do you think the password gets the stranger in here?" });
  });
  S.push({ id:"check", kind:"check", label:"Your five calls", h1:"Check your five calls" });
  PLACES.forEach(function(p){
    S.push({ id:"ans-" + p.id, kind:"reveal", place:p, label:"Answer " + p.n + " of 5", h1:p.name });
  });
  var FIRST_CALL = 1, CHECK = 1 + PLACES.length, FIRST_ANS = CHECK + 1;

  /* ---------------- state ----------------
     Wrapped: a blocked storage API degrades silently, and the deck works
     from a clean state with nothing saved. */
  var KEY = "vciso-p3-m4-one-stolen-password-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { pick:{}, txt:{}, locked:false }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var o = fresh();
      PLACES.forEach(function(p){
        if(isPlain(raw.pick) && (raw.pick[p.id] === "in" || raw.pick[p.id] === "blocked")) o.pick[p.id] = raw.pick[p.id];
        if(isPlain(raw.txt) && typeof raw.txt[p.id] === "string") o.txt[p.id] = raw.txt[p.id].slice(0, MAXLEN);
      });
      o.locked = raw.locked === true && PLACES.every(function(p){ return !!o.pick[p.id]; });
      return o;
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var GLYPH = { out:"✕", ok:"✓", dot:"●" };

  /* Data validation, at load, loud. */
  (function validate(){
    var problems = [], ids = {};
    S.forEach(function(s, n){
      if(!s.id) problems.push("slide " + (n+1) + " has no id");
      if(ids[s.id]) problems.push('duplicate slide id "' + s.id + '"');
      ids[s.id] = 1;
    });
    PLACES.forEach(function(p){
      if(!p.why) problems.push('place "' + p.id + '" has no reason');
      if(!callOf(p.ans)) problems.push('place "' + p.id + '" has no valid answer');
    });
    if(problems.length){
      document.getElementById("board").innerHTML =
        '<div class="intro"><p><b>This deck has authoring errors and will not behave correctly:</b></p>' +
        '<ul style="font-size:13px;line-height:1.6;padding-left:18px">' +
        problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul></div>";
      throw new Error("deck data invalid: " + problems.join("; "));
    }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    again:document.getElementById("again"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function say(m){ el.live.textContent = m; }
  function topFocus(){
    try{ el.frame.focus({preventScroll:true}); }catch(e){ el.frame.focus(); }
    window.scrollTo(0, 0);
  }
  function callOf(id){ for(var k=0;k<CALLS.length;k++) if(CALLS[k].id === id) return CALLS[k]; return null; }
  function picked(p){ return !!st.pick[p.id]; }
  function allPicked(){ return PLACES.every(picked); }
  function firstOpen(){ for(var k=0;k<PLACES.length;k++) if(!picked(PLACES[k])) return k; return -1; }
  function score(){ return PLACES.filter(function(p){ return st.pick[p.id] === p.ans; }).length; }
  function txtOf(p){ return (st.txt[p.id] || "").trim(); }

  /* Resume: nothing saved starts at slide 1. */
  var i = 0;
  if(st.locked) i = FIRST_ANS;
  else if(firstOpen() > 0) i = FIRST_CALL + firstOpen();
  else if(allPicked()) i = CHECK;

  /* ---------------- chrome ---------------- */
  function canGo(n){
    if(n < 0 || n >= S.length) return false;
    if(n <= FIRST_CALL) return true;
    if(n <= CHECK){
      /* Forward through the places only past a place that has a call. */
      for(var k=0;k<n-FIRST_CALL && k<PLACES.length;k++) if(!picked(PLACES[k])) return false;
      return true;
    }
    return st.locked;
  }

  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    if(st.locked && i >= CHECK){ el.chip.hidden = false; el.chip.textContent = score() + " of 5 right"; }
    else el.chip.hidden = true;

    el.back.disabled = (i === 0);
    el.again.hidden = !(st.locked && (s.kind === "check" || i === S.length - 1));
    el.next.removeAttribute("aria-disabled");
    el.next.disabled = false;
    if(i === S.length-1){ el.next.disabled = true; el.next.textContent = "You are at the end"; return; }
    if(i === 0) el.next.textContent = "Start";
    else if(s.kind === "call") el.next.textContent = backToCheck(s) ? "Back to your five calls"
      : (s.place.n === PLACES.length) ? "Check my five calls" : "Next place";
    else if(s.kind === "check") el.next.textContent = st.locked ? "See the answers" : "Show me the answers";
    else el.next.textContent = "Next answer";
    /* A place with no call yet, or the check slide with calls missing:
       Next looks disabled but still takes a click, so it can say why. */
    var blocked = (s.kind === "check" && !st.locked) ? !allPicked()
      : (s.kind === "call" && !st.locked && !picked(s.place)) ? true : !canGo(i+1);
    var soft = (s.kind === "call" || s.kind === "check") && !st.locked;
    if(blocked){ if(soft) el.next.setAttribute("aria-disabled", "true"); else el.next.disabled = true; }
  }

  /* Reached through a Change button on the check slide: Next goes
     straight back there. Cleared by any other move. */
  var fromCheck = -1;
  function backToCheck(s){ return s.kind === "call" && !st.locked && fromCheck === i; }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.hint.textContent = "";
    el.h1.textContent = s.h1;

    if(s.kind === "intro") renderIntro();
    else if(s.kind === "call") renderCall(s.place);
    else if(s.kind === "check") renderCheck();
    else if(s.kind === "reveal") renderReveal(s.place);
    else el.board.innerHTML = '<div class="intro"><p><b>Unhandled slide kind "' + esc(String(s.kind)) + '".</b></p></div>';

    el.frame.setAttribute("aria-label", el.h1.textContent);
    header();
  }

  /* ---------------- slide 1 ---------------- */
  function renderIntro(){
    el.board.innerHTML =
      '<div class="intro">' +
        "<p>A stranger outside Cumberland has one staff member's password. There are five places they might try to reach.</p>" +
        "<p>We are going to show you the five places one at a time. For each one, decide whether you think the password gets the stranger <b>in</b>, or whether they are <b>blocked</b>. Then write what stops them, if anything.</p>" +
        "<p>Each place is explained when you reach it. Some words will be new, and that is fine.</p>" +
        "<p>You see the answers once you have made all five calls. What you write is never marked.</p>" +
      "</div>" +
      '<div class="places" role="list" aria-label="The five places">' +
      PLACES.map(function(p){
        return '<div class="pl" role="listitem">' + icon(p.ico) +
          '<span class="pn">Place ' + p.n + '</span><span class="pt">' + esc(p.name) + "</span></div>";
      }).join("") + "</div>";
  }

  /* ---------------- slides 2 to 6: one place ----------------
     Both buttons look the same until one is pressed. The call can be
     changed freely until the answers are shown, then it locks. */
  function callBtn(p, c){
    var pick = st.pick[p.id];
    var cls = "ans", tag = "";
    if(pick === c.id){ cls += " is-pick"; tag = GLYPH.dot + " Your call"; }
    else if(st.locked) cls += " is-off";
    return '<button class="' + cls + '" type="button" data-call="' + c.id + '" aria-pressed="' + (pick === c.id) + '"' +
      (st.locked ? " disabled" : "") + ">" +
      '<span class="bk" aria-hidden="true">' + c.key + "</span>" +
      '<span class="lb"><span class="al">' + esc(c.label) + '</span><span class="sb">' + esc(c.sub) + "</span></span>" +
      (tag ? '<span class="tg" aria-hidden="true">' + tag + "</span>" : "") + "</button>";
  }

  function renderCall(p){
    var t = st.txt[p.id] || "";
    el.board.innerHTML =
      '<div class="who">' + icon("user") + "<span>The stranger is <b>outside Cumberland</b> and holds <b>one staff member's password</b>. Nothing else.</span></div>" +
      '<div class="pcard"><span class="ib">' + icon(p.ico) + "</span>" +
        '<div class="tx"><span class="pn">Place ' + p.n + " of " + PLACES.length + '</span>' +
        '<p class="ct">' + esc(p.name) + '</p><p class="gl">' + esc(p.gl) + "</p></div></div>" +
      '<div class="ans-row" role="group" aria-label="Your call for ' + esc(p.short) + '">' +
        CALLS.map(function(c){ return callBtn(p, c); }).join("") + "</div>" +
      '<div class="wr"><div class="wl"><label for="why-' + p.id + '">What stops them, if anything?</label>' +
        '<span class="wh" id="wh-' + p.id + '">' + (st.locked ? "Your calls are locked now." : "A few words is enough. This part is not marked.") + "</span>" +
        '<span class="wc" id="wc" aria-hidden="true">' + t.length + " of " + MAXLEN + "</span></div>" +
        '<textarea id="why-' + p.id + '" maxlength="' + MAXLEN + '" spellcheck="true" aria-describedby="wh-' + p.id + '"' +
        (st.locked ? " readonly" : "") + ">" + esc(t) + "</textarea></div>";

    Array.prototype.forEach.call(el.board.querySelectorAll("button.ans"), function(btn){
      btn.addEventListener("click", function(){ choose(p, btn.dataset.call); });
    });
    var ta = el.board.querySelector("textarea");
    var wc = el.board.querySelector("#wc");
    ta.addEventListener("input", function(){
      if(st.locked) return;
      st.txt[p.id] = ta.value.slice(0, MAXLEN); save(st);
      wc.textContent = ta.value.length + " of " + MAXLEN;
    });
    ta.addEventListener("keydown", function(e){
      if(e.key === "Escape"){ e.preventDefault(); ta.blur(); topFocus(); }
    });
    if(st.locked){
      el.hint.innerHTML = '<b>Your calls are locked.</b> The answer for this place is on slide ' + (FIRST_ANS + p.n) + ".";
    } else if(!picked(p)){
      el.hint.textContent = "Pick In or Blocked to go on.";
    } else {
      el.hint.innerHTML = '<span class="kb">You can change your call until you see the answers.</span>';
    }
  }

  function choose(p, call){
    if(st.locked || !callOf(call)) return;
    var had = st.pick[p.id];
    st.pick[p.id] = call; save(st);
    render();
    var b = el.board.querySelector('button.ans[data-call="' + call + '"]');
    if(b) b.focus();
    say((had && had !== call ? "Changed. " : "") + "Your call for " + p.short + ": " + callOf(call).label + ".");
  }

  /* ---------------- slide 7: check, then lock ---------------- */
  function renderCheck(){
    var lead = st.locked
      ? "Here are your five calls beside the answers. Pick any one to see the reason."
      : (allPicked()
          ? "You can still change any call. When you <b>show the answers</b>, your five calls lock."
          : "Some places still need a call. Make all five, then you can see the answers.");
    el.board.innerHTML = '<p class="lead">' + lead + "</p>" +
      '<div class="rows" id="rows">' + PLACES.map(function(p){
        var pk = st.pick[p.id], t = txtOf(p), info, btn;
        if(!pk){
          info = '<span class="mk">No call yet</span>';
          btn = '<button class="jump ra" type="button" data-go="' + (FIRST_CALL + p.n - 1) + '">Make this call</button>';
        } else if(st.locked){
          var right = pk === p.ans;
          info = "<span>Answer: <b>" + esc(callOf(p.ans).label) + "</b></span> · " +
            '<span class="mk">' + (right ? GLYPH.ok + " You called it" : GLYPH.out + " You said " + esc(callOf(pk).label)) + "</span>";
          btn = '<button class="jump ra" type="button" data-go="' + (FIRST_ANS + p.n - 1) + '">See the reason</button>';
        } else {
          info = "<span>Your call: <b>" + esc(callOf(pk).label) + "</b></span>" +
            '<span class="rq">' + (t ? "“" + esc(t) + "”" : "You did not write anything.") + "</span>";
          btn = '<button class="jump ra" type="button" data-go="' + (FIRST_CALL + p.n - 1) + '">Change</button>';
        }
        return '<div class="rw' + (pk ? "" : " open") + (st.locked && pk !== p.ans ? " open" : "") + '">' +
          '<span class="cn" aria-hidden="true">' + p.n + "</span>" +
          '<span class="rn">' + esc(p.short) + '</span><span class="rc">' + info + "</span>" + btn + "</div>";
      }).join("") + "</div>";
    Array.prototype.forEach.call(el.board.querySelectorAll("button.jump"), function(b){
      b.addEventListener("click", function(){
        i = +b.dataset.go;
        fromCheck = (!st.locked && S[i].kind === "call") ? i : -1;
        render(); topFocus(); say(announce());
      });
    });
  }

  function lockAndShow(){
    if(!allPicked() || st.locked) return;
    st.locked = true; save(st);
    i = FIRST_ANS; render(); topFocus(); animateReveal();
    say("Your calls are locked. " + announce());
  }

  /* ---------------- slides 8 to 12: one answer each ---------------- */
  function renderReveal(p){
    if(!st.locked){
      el.board.innerHTML = '<div class="intro"><p>Make all five calls first. The answer for each place shows here once you do.</p>' +
        '<p><button class="jump" type="button" id="toopen">Go to your calls</button></p></div>';
      el.board.querySelector("#toopen").addEventListener("click", function(){
        i = allPicked() ? CHECK : FIRST_CALL + firstOpen(); render(); topFocus();
      });
      return;
    }
    var pk = st.pick[p.id], right = pk === p.ans, t = txtOf(p);
    var ansSub = p.ans === "in" ? "The password gets them in." : "They are blocked.";
    el.board.innerHTML =
      '<div class="reveal" id="rv">' +
      '<div class="verdict">' +
        '<div class="vb ans"><span class="gl" aria-hidden="true">' + GLYPH.ok + "</span>" +
          '<span class="vt"><span class="vk">The answer</span><span class="vr"><span class="vv">' + esc(callOf(p.ans).label) + '</span><span class="vs">' + ansSub + "</span></span></span></div>" +
        '<div class="vb you' + (right ? "" : " wrong") + '"><span class="gl" aria-hidden="true">' + (right ? GLYPH.ok : GLYPH.out) + "</span>" +
          '<span class="vt"><span class="vk">Your call</span><span class="vr"><span class="vv">' + esc(callOf(pk).label) + '</span><span class="vs">' +
          (right ? "You called it." : "Not this one.") + "</span></span></span></div>" +
      "</div>" +
      /* Nothing written: no empty box, the reason takes the full width. */
      '<div class="side' + (t ? "" : " solo") + '">' +
        (t ? '<div class="pane mine"><span class="ph">What you wrote</span><p class="pb">' + esc(t) + "</p></div>" : "") +
        '<div class="pane why"><span class="ph">The reason</span><p class="pb">' + esc(p.why) + "</p>" +
          (p.plain ? '<p class="pw"><span class="pk">In plain words:</span> ' + esc(p.plain) + "</p>" : "") + "</div>" +
      "</div>" + trailHTML(p) + "</div>";
    if(i === S.length - 1) el.hint.innerHTML = "<b>That is all five.</b> Go back to the module and keep reading.";
  }

  function trailHTML(cur){
    return '<div class="trail"><span class="tl" id="tl">How far the stranger got</span>' +
      '<div class="tg5" role="list" aria-labelledby="tl">' + PLACES.map(function(p){
        var shown = p.n <= cur.n;
        var stat = shown ? callOf(p.ans).label : "Not shown yet";
        return '<div class="tr' + (p.n === cur.n ? " here" : "") + (shown ? "" : " later") + '" role="listitem">' + icon(p.ico) +
          '<span class="tt"><span class="tn">' + esc(p.short) + '</span><span class="ts">' + stat + "</span></span></div>";
      }).join("") + "</div></div>";
  }

  function animateReveal(){
    if(reduce) return;
    var n = el.board.querySelector("#rv") || el.board.querySelector("#rows");
    if(n){ n.classList.remove("in"); void n.offsetWidth; n.classList.add("in"); }
  }

  function announce(){
    var s = S[i];
    if(s.kind === "reveal" && st.locked){
      var p = s.place;
      return "Slide " + (i+1) + " of " + S.length + ". " + p.name + ". The answer: " + callOf(p.ans).label +
        ". Your call: " + callOf(st.pick[p.id]).label + ". " + p.why +
        (p.plain ? " In plain words: " + p.plain : "");
    }
    if(s.kind === "call") return "Slide " + (i+1) + " of " + S.length + ". Place " + s.place.n + ". " + s.place.name + ".";
    return "Slide " + (i+1) + " of " + S.length + ". " + el.h1.textContent;
  }

  /* ---------------- start again ---------------- */
  function resetAll(){ st = fresh(); save(st); i = 0; fromCheck = -1; render(); }
  el.again.addEventListener("click", function(){ resetAll(); topFocus(); say("Cleared. Back to the start."); });

  /* ---------------- navigation ---------------- */
  function go(d){
    var s = S[i];
    if(d > 0 && s.kind === "check" && !st.locked){
      if(allPicked()) lockAndShow();
      else el.hint.innerHTML = "<b>Make all five calls first.</b> Then you can see the answers.";
      return;
    }
    if(d > 0 && s.kind === "call" && !st.locked && !picked(s.place)){
      el.hint.innerHTML = "<b>Make your call first.</b>";
      return;
    }
    var n = (d > 0 && backToCheck(s)) ? CHECK : i + d;
    if(!canGo(n)) return;
    fromCheck = -1;
    i = n; render(); topFocus();
    if(S[i].kind === "reveal") animateReveal();
    say(announce());
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return true;
    var r = node.getAttribute && node.getAttribute("role");
    return r === "slider" || r === "textbox" || r === "spinbutton" || r === "listbox";
  }

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var s = S[i];
    if(s.kind === "call" && !st.locked && (e.key === "1" || e.key === "2")){
      e.preventDefault(); choose(s.place, e.key === "1" ? "in" : "blocked");
    }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    if(ownsKeys(e.target)){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ----------------
     measure-fit.mjs steps through the deck with this. goto ignores the
     answer-first lock, on purpose, so every slide can be measured. fill
     reaches the locked, answered states by script. */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; fromCheck = -1; render(); return true;
    },
    slides:S.length,
    fill:function(picks, texts, lock){
      PLACES.forEach(function(p, k){
        if(picks && picks[k]) st.pick[p.id] = picks[k];
        if(texts && typeof texts[k] === "string") st.txt[p.id] = texts[k].slice(0, MAXLEN);
      });
      if(lock && allPicked()) st.locked = true;
      save(st); render(); return true;
    },
    reset:function(){ resetAll(); },
    state:function(){ return { i:i, pick:st.pick, txt:st.txt, locked:st.locked, score:score() }; }
  };
})();
</script>
</body>
</html>
