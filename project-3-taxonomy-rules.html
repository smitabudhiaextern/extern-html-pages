<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taxonomy: The Three Rules</title>
<style>
  :root {
    --bg: #FDF8F8;
    --highlight: #DCE1FF;
    --accent: #001D69;
    --title: #1C1B1B;
    --body: #484646;
    --white: #FFFFFF;
    --grey-text: #6E6E73;
    --grey-surface: #F1F1F4;
    --grey-border: #E2E2E6;
    --ok: #1B7A5A;
  }
  * { box-sizing: border-box; }
  html, body {
    background: transparent; margin: 0; padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--body); -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 14px; }
  .card {
    position: relative; background: var(--white);
    border: 1px solid #E8E8EC; border-radius: 18px;
    padding: 22px 26px; box-shadow: 0 6px 20px rgba(0,0,0,.06);
  }
  .eyebrow {
    display: inline-block; font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--accent); background: var(--highlight);
    padding: 5px 12px; border-radius: 999px; margin: 0 0 10px;
  }
  h1 { font-size: 1.24rem; font-weight: 800; color: var(--title); margin: 0 0 6px; line-height: 1.3; }
  .lead { font-size: 0.92rem; line-height: 1.6; color: var(--body); margin: 0 0 4px; }
  .lead b { color: var(--title); font-weight: 700; }

  /* inline referrer chips */
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.84em; background: var(--grey-surface);
    border: 1px solid var(--grey-border); border-radius: 6px;
    padding: 1px 6px; color: var(--accent); white-space: nowrap;
  }

  /* Tracker */
  .trackbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin: 0 0 16px; padding-bottom: 14px; border-bottom: 1px solid var(--grey-border);
  }
  .dots { display: flex; gap: 8px; }
  .dot {
    width: 11px; height: 11px; border-radius: 999px;
    background: var(--grey-surface); border: 1.5px solid var(--grey-border);
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .dot.done { background: var(--ok); border-color: var(--ok); }
  .dot.current { border-color: var(--accent); transform: scale(1.25); }
  .progress { font-size: 0.78rem; font-weight: 700; color: var(--grey-text); }
  .progress b { color: var(--accent); }

  /* Nav + buttons */
  .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; }
  .nav .hint { font-size: 0.78rem; color: var(--grey-text); }
  .btn {
    font-family: inherit; font-size: 0.86rem; font-weight: 700;
    padding: 9px 18px; border-radius: 10px; cursor: pointer;
    border: 1.5px solid var(--grey-border); background: var(--white); color: var(--title);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.08); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.ghost { visibility: hidden; }

  @media (prefers-reduced-motion: reduce) { .btn:hover, .dot { transition: none !important; transform: none !important; } }
</style>
</head>
<body>
  <div class="wrap"><div class="card" id="stage"></div></div>
  <script>
    // Taxonomy: The Three Rules — 4 slides, one rule per slide. Text verbatim.
    var SLIDES = [
      {
        kicker: '',
        heading: '',
        body: '"Grouping your referrers into channels" has a name: a taxonomy. It just means your chosen set of buckets and the rule for what goes in each. A good one follows three plain rules.'
      },
      {
        kicker: 'Rule 1',
        heading: 'Buckets should be worth telling apart.',
        body: 'Don\'t split hairs: <code>google</code> and <code>g.co</code> are both Google, so they go in one bucket. But don\'t over-merge either. Lumping Facebook ads (which you paid for) together with Google searches (which came in free) hides the one thing Mike cares about, which is whether the ad money worked. A good bucket is one you\'d actually want to see on its own line in a report.'
      },
      {
        kicker: 'Rule 2',
        heading: 'Every referrer gets a home.',
        body: 'All 421 referrers must land in exactly one bucket, none left out. An "Other" bucket for the odd long-tail ones is fine. A referrer that matches no bucket at all is not, because it silently vanishes from your totals.'
      },
      {
        kicker: 'Rule 3',
        heading: 'Build the buckets Mike will actually use.',
        body: 'The point is answering Mike\'s Q4 question. If he needs to compare money spent on Facebook against free traffic from search, those must be separate buckets. If a distinction doesn\'t help a decision, don\'t create it.'
      }
    ];

    var N = SLIDES.length; // 4
    var idx = 0;

    // Inert deep-link for QA: ?idx=2 (rev=1 accepted but has no reveal state here)
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.has('idx')) {
        idx = parseInt(q.get('idx'), 10) || 0;
        if (idx < 0) idx = 0;
        if (idx > N - 1) idx = N - 1;
      }
    })();

    var stage = document.getElementById('stage');

    function dots() {
      var h = '<div class="dots">';
      for (var i = 0; i < N; i++) {
        var c = 'dot';
        if (i < idx) c += ' done';
        if (i === idx) c += ' current';
        h += '<span class="' + c + '"></span>';
      }
      return h + '</div>';
    }

    function nav(label, showBack) {
      var back = showBack ? '<button class="btn" data-nav="back">&larr; Back</button>'
                          : '<button class="btn ghost">&larr; Back</button>';
      var next = label
        ? '<button class="btn primary" data-nav="next">' + label + '</button>'
        : '<button class="btn ghost">x</button>';
      return '<div class="nav">' + back + next + '</div>';
    }

    function render() {
      var s = SLIDES[idx];
      var h = '';
      if (s.kicker) h += '<span class="eyebrow">' + s.kicker + '</span>';
      h += '<div class="trackbar">' + dots() + '<span class="progress"><b>' + (idx + 1) + '</b> of ' + N + '</span></div>';
      if (s.heading) h += '<h1>' + s.heading + '</h1>';
      h += '<p class="lead">' + s.body + '</p>';
      var showBack = idx > 0;                 // slide 1 has no Back
      var label = (idx < N - 1) ? 'Next &rarr;' : null; // last slide has no Next
      h += nav(label, showBack);
      stage.innerHTML = h;
    }

    stage.addEventListener('click', function (e) {
      var n = e.target.closest ? e.target.closest('[data-nav]') : null;
      if (!n) return;
      var dir = n.getAttribute('data-nav');
      if (dir === 'next' && idx < N - 1) idx++;
      else if (dir === 'back' && idx > 0) idx--;
      render();
    });

    render();
  </script>
</body>
</html>
