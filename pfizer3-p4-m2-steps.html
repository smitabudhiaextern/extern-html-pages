   Structure, rail, Back and Next, code blocks, Copy buttons, screenshots, spacing code and CSS: copied from the P3 module 9
   Try deck (pfizer3-p3-m9-steps.html); the "now holds" note and the callout box from the P3 module 8 Try deck.
   Notebook: our fixed copy "Extracting Text and Bounding Boxes from Scanned PDFs (Pfizer 3.0)", Drive
   1n2-iMesweW8Y1olLFlqcmNtJOMhhIL3d (anyone with the link can view), copied from his original 13xzG36zV3AcXePzb4s2sKeZwQjRoBI6B,
   which was never edited. Only 3 cells differ: import fitz -> import pymupdf (STEP 2, and its comment), fitz.open ->
   pymupdf.open (STEP 3), get_pixmap() -> get_pixmap(dpi=300) (STEP 5). Code on "in your notebook" blocks equals the copy's
   cells exactly (no Copy button: students run them where they are). Sample: his Page 4, Drive 1UvYmChia7K90-xjCsHsGqhixmDrPfhHw.
   Order: his NOTEBOOK cells, STEP 1 to STEP 15 and the BONUS STEP, with his page text for each step. His page-only cells are
   added by students (Copy button) where his page puts them, in an order that keeps every shown output true:
     STEP 11 group: his page Step 7, part 1 (join/split) and part 2 (re.sub fixes) after the notebook's STEP 11 cell;
     Find Values group: his page Step 8 regex cell (A1's s17: the re-open and second OCR lines removed, so it reads ocr_text).
       It runs after his Step 7 cells here (A1 ran it before them); his 6 regexes give the same 6 values on the Step 7 text
       (checked in Python on A1's exact s19 output: 129708B, the 5 lot numbers, 25.0, 26.4, 40.0, 36.7).
     STEP 12 group: his page Step 9 (first 5 rows); STEP 13 group: his page Step 10 (green boxes with labels, unchanged);
     STEP 15 group: his page Step 11 (his 9-word key_fields list) and Step 12 (JSON without confidence), AFTER STEP 15,
       because his Step 11 replaces key_fields and would change STEP 15's output; Bonus group: his page's 3 cv2.rotate lines.
   Screenshots: pfizer3-p4-m2-try-sNN.png (code + output) and -out.png (output only), A1's real Colab run in the scratch copy
   16jA7rkekJfDYpka5bAH_IwyzYuDSC53q. s12-out, s16-out and s17-out were cropped by A6 from A1's raw shots with A1's crop_out
   rule. Where Colab cuts long lines (s01, s03, s10, s11, s18, s19), the slide shows the exact text A1 recorded instead of the
   shot. pfizer3-p4-m2-try-page6.png: PyMuPDF render (100 dpi) of his Page 6 sample, for his Bonus line "Here's what a
   rotated document looks like (this is a different sample)" (his own picture was not available).
   Layout pass (agent F3, 19 November 2026, QA q3 Proposal A, layout only, no SME change): 59 -> 54 slides. The Start slide
   and his Step 1 "Meet the Tools" text share one slide; STEP 2's Run It and See It share one (output-only crop
   pfizer3-p4-m2-try-s02-out.png, cut from A1's s02 shot); STEP 6 to STEP 9 keep their 4 Run It slides and their 4 See It
   slides become 2 (STEP 6 + 7, STEP 8 + 9, pictures side by side, every line kept); the two Quick Recap slides are one.
   Stage 760 x 1035 (P3 m7's height): STEP 10's output slides use the small output font, STEP 14's picture is 435 px, the STEP 4 and
   STEP 5 cells use the small code font, and our "And here is the rest:" line before STEP 10's second output is gone.
   Also: his pause line on STEP 4 names the steps (q3 FAIL 7, listed for Smita), STEP 5's size line reads as two numbers
   (FAIL 8), "Labeled" in US spelling.
   Proposal B (approved by Smita, 20 November 2026; agent F6): 54 -> 42 slides. His page's 7 alternative cells (Step 7's
   two smaller cleaning cells, Step 9's first 5 rows, Step 10's labelled green boxes, Step 11's 9-word key_fields list,
   Step 12's JSON without confidence, the Bonus's 3 cv2.rotate lines) moved off the main path into the optional linked deck
   pfizer3-p4-m2-more.html, each with his text, code and real Colab shot. The regex cell stays here, now added right under
   STEP 11, so it reads STEP 10's ocr_text exactly as in A1's run (A1 ran it as counter [17], before the Step 7 cells): its
   shown output (s17-out) is that run's. His two tips stay on the main path: "Pay attention to any OCR mistakes that
   remain..." on STEP 11 Part 3 (the cleaned text) and "If you're not sure how much to rotate..." on Bonus Part 4.
   key_fields is no longer replaced mid-Try, so STEP 14 and STEP 15 are the last cells to set it.
   Ours: titles, labels, lead-in and "Press Run" lines, "What this code does" bullets, "now holds" notes, one-line notes on
   the real output, and the first Quick Recap item's sub-line. Everything else is his text, word for word, except the
   changes listed for Smita in the A6 report (em dashes, merge wording, his numbering, fixes proven by the run).
   Fix pass (22 November 2026, P4 audit F01 to F06): code and output back at P3's size (14 px on the stage, 13 px at the
   708 px column), so long cells and outputs are cut over more slides (42 -> 63), every line kept in order; each cleaning
   step (STEP 6 to 9) has its own See It slide with zoomed crops of the same strip of Page 4 (the Run ID) before and
   after, from A1's full-size stage pictures (a1/learn-full), each linking to the whole Colab output; STEP 13 and STEP 14
   show zoomed crops of the top of the page so the boxes can be seen; STEP 12's printout is typed out from A1's run; his
   "But why?" and "Why Store the Data in JSON?" bullets have their own slides; his "What's Happening in the Code?" bullets
   sit on STEP 14's See It slide; the Bonus is no longer marked Optional (Step 2's Task needs it); the first slide is split
   into "Open the Notebook" and "Meet the Tools"; slide 37's question is answered on the slide; part numbers are set by
   number_parts().
   Final QA pass (22 November 2026, report p4qa/final-step1.md, moves 2 to 5 only): the output pictures that were too
   small to read (STEP 1, 2, 4, the regex cell, BONUS) are A1's recorded text in Output blocks (STEP 1 shows its last
   line, with a link to the whole Colab picture); STEP 5 shows its printed line and a readable crop of the top of A1's
   full-size STEP 5 picture (try-z-s5-top); the STEP 6 + 7 and STEP 8 + 9 See slides are paired again with the same zoom
   strips; STEP 10's text and STEP 15's JSON are one slide each, with a line saying the rest is under the cell (STEP 15
   adds a table of its 5 entries, from the same run); "Open the Notebook" and "Meet the Tools" share a slide, STEP 3, 5, 8 and 9 show the
   whole cell on one slide (STEP 3's Choose Files line moves to its See slide), STEP 14's first part ends after line 16, and the STEP 14 and STEP 15 "why" text sits
   with the top of the cell; code and output line height 1.35 (font size unchanged); the Quick Recap is tighter so the
   Done message no longer pushes it past the card. His header comments and the Bonus are unchanged (Smita decides).
   Every notebook line is still on the slides, in order (asserted by check_lines in this build).
   Fixed stage: one design stage that scales as a single piece to fit the frame, so nothing ever scrolls and Back and Next
   sit in the same place on every slide. Wide frames use a 760 x 1035 stage (Notion embed height 964 px at the 708 px
   column); frames under 560 px wide use a 420 x 1200 stage. Spare height widens the gaps between blocks, up to 2x.
   Look: Pfizer x Extern Core, Light format. Every color, size, radius and font comes from design-system/tokens.json. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-600);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* The design stage, scaled and centred by the script at the end */
.app{position:absolute;left:50%;top:50%;width:760px;height:1035px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: step rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:13px;font-weight:500;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}
.narrow .top{grid-template-columns:minmax(0,1fr);row-gap:8px}
.narrow .where{order:0}
.narrow .pg-word{display:none}
.narrow .pg.pg-fit{flex:none}

/* Slide area and slide */
.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}
.narrow .stage{padding:10px 0}
.narrow .card{padding:18px 16px;border-left:0;border-right:0;border-radius:0}
.inner{flex:none;display:flex;flex-direction:column;gap:var(--space-3);width:100%}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding-bottom:3px;color:var(--ink);text-wrap:balance}
.narrow .title{font-size:28px;line-height:34px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:15px;line-height:22px;color:var(--ink);text-wrap:pretty}
.p b{font-weight:600}
.p code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.p code.nw,.list code.nw{white-space:nowrap}
.list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:22px;text-wrap:pretty}
.list b{font-weight:600}
.list code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.list li::marker{color:var(--step-label);font-weight:600}
.see{margin-top:4px}

/* Buttons (design system Button, Light) */
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* Run card: a notebook cell (no Copy button: the cells are already in the notebook), or the one cell students add (Copy button) */
.run{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin:0}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:6px 8px 6px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:12px 14px;font-family:var(--font-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out{border-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:6px 12px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}
.narrow .run pre{font-size:13px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.narrow .run.out pre{font-size:12px}

/* The Colab screenshot: the full width of the card (edge to edge), opens full size in a new tab.
   Under 560 px the card itself runs edge to edge, so the picture is as wide as the frame. */
.shot{margin:0 calc(-1 * var(--space-5));border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;line-height:0;background:var(--surface)}
.narrow .shot{margin:0 -16px}
.shot a{display:block}
.shot img{display:block;width:100%;height:auto}
.shot-cap{margin:-6px 0 0;font-size:13px;line-height:18px;color:var(--gray-600)}

/* A picture of the page (slide 14: the table in foo.pdf): framed like the output blocks, as wide as the text */
.pagepic{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;line-height:0;background:var(--surface)}
.pagepic a{display:block}
.pagepic img{display:block;width:100%;height:auto}

/* Table and analysis box (from the Learn deck) */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.4}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:6px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--card-text)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.m{font-family:var(--font-mono);font-size:13px;color:var(--ink);white-space:nowrap}
.tbl td code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .tbl table{font-size:13px}
.narrow .tbl td,.narrow .tbl th{padding:5px 8px}
.concl{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px;font-size:15px;line-height:22px;color:var(--card-text)}
.concl b{font-weight:600;color:var(--card-title)}
.concl p{margin:0}
.concl p + p{margin-top:6px}
.concl code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}


/* A smaller code font for the long function in Step 3 (from the 11 November module 9 steps deck) */
.run.small pre{font-size:12px;line-height:1.32;padding:8px 14px}
.narrow .run.small pre{font-size:10.5px;line-height:1.35}

/* Tip box (from the 11 November module 9 Learn deck): pale-blue card, Pfizer blue bulb in a white square */
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px}
.tip-icon{flex:none;width:30px;height:30px;border-radius:var(--radius-xs);background:var(--surface);display:grid;place-items:center;color:var(--pfizer-blue)}
.tip-icon svg{width:18px;height:18px}
.tip p{margin:0;font-size:15px;line-height:22px;color:var(--card-text);text-wrap:pretty}
.tip b{font-weight:600;color:var(--card-title)}

/* Last slide: his closing line and Key Takeaway (takeaway box copied from the module 7 cheat sheet slide) */
.inner.end-slide{gap:var(--space-4)}
.end-slide .p{font-size:17px;line-height:1.55}
.take{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:14px 18px;font-size:17px;line-height:1.55;color:var(--card-text)}
.take b{font-weight:700;color:var(--card-title)}
.take code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .take{font-size:15px;padding:12px 16px}
.narrow .end-slide .p{font-size:16px}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:22px;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.foot .btn{padding:10px 16px;font-size:15px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
.narrow .upnext{visibility:hidden}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }

/* Added for P4 module 2 (copied from the P3 module 8 Try deck): "now holds" note, the SME's callout box, the Quick Recap size */
.holds{margin:0;display:flex;align-items:center;gap:8px;background:var(--surface-card);border-left:4px solid var(--pfizer-blue);border-radius:var(--radius-xs);padding:7px 12px;font-size:14px;line-height:20px;font-weight:600;color:var(--card-title)}
.holds code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px}
.holds svg{width:16px;height:16px;flex:none;color:var(--pfizer-blue)}
.note{border:1.5px solid var(--ink);border-radius:var(--radius-sm);padding:9px 14px}
.note .num{display:block;margin-bottom:3px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.note p{margin:0;font-size:15px;line-height:1.48;color:var(--ink-muted)}
.note b{font-weight:600;color:var(--ink)}
.recap-slide .list{font-size:17px;line-height:1.55;gap:14px}
.recap-slide .list ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.recap-slide .list ul li::marker{color:var(--ink-muted)}
.narrow .recap-slide .list{font-size:15.5px;gap:10px}
/* Many steps in the rail: numbers only */
.pg-word{display:none}
.pg-label{text-align:center}
.pg.pg-fit{flex:none}
.pg.pg-fit .pg-label{text-align:left}
/* Under 560 px there is no room for 19 labels: the rail shows only the progress bars, and "Step N" sits beside the count */
.narrow .pg-label{display:none}
.narrow .pg.pg-fit{flex:1 1 0}
/* Code and output: Project 3's size (fix pass, 22 November 2026: 14 px on the 760 stage, 13 px at the 708 px column; 13 px on
   the narrow stage). Long lines wrap, so nothing scrolls; long cells and outputs are cut over more slides instead */
.run pre{white-space:pre-wrap;overflow-wrap:anywhere}
.run.out pre{font-size:14px;line-height:1.5}
.narrow .run pre,.narrow .run.out pre{font-size:13px}
/* F02: zoomed crops of one strip of the page, before and after a step */
.zoom{margin:0;display:flex;flex-direction:column;gap:6px}
.zoom a{display:block;line-height:0}
.zoom img{display:block;height:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--radius-xs)}
/* The STEP 15 JSON: the 3 heading lines across the top, the JSON in two columns (same text, same order) */
.run.out.json pre.head{padding-bottom:0}
.run.out.json pre.cols{column-count:2;column-gap:24px;padding-top:4px}
.narrow .run.out.json pre.cols{column-gap:12px;font-size:10.5px}
/* A page picture from Colab (tall): shown smaller and centred, so the slide stays short; opens full size */
.shot.tall{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.shot.tall img{width:auto;max-width:100%;height:var(--pic-h,480px);margin:0 auto}
.narrow .shot.tall{margin:0}
.narrow .shot.tall img{height:var(--pic-hn,520px)}
/* q3 Proposal A: two Colab page pictures side by side (STEP 6 + 7, STEP 8 + 9), each with its own notes under it */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.half{display:flex;flex-direction:column;gap:8px;min-width:0}
.half-head{margin:0;font-size:13px;line-height:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label)}

<p class="p"><b>Steps to Prepare a Scanned PDF for Text Extraction</b></p><p class="p">Here is the sample pharmaceutical SDF that we are going to utilize, and the Colab notebook you'll use to follow along:</p><div class="links"><a class="btn btn-secondary" href="https://drive.google.com/file/d/1UvYmChia7K90-xjCsHsGqhixmDrPfhHw/view" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Sample Pharmaceutical SDF: Page 4 (Certificate of Processing)</span><span class="sr-only"> (opens in a new tab)</span></a><a class="btn btn-secondary" href="https://colab.research.google.com/drive/1n2-iMesweW8Y1olLFlqcmNtJOMhhIL3d" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Extracting Text and Bounding Boxes from Scanned PDFs (Colab notebook)</span><span class="sr-only"> (opens in a new tab)</span></a></div><ol class="list"><li>Open the notebook and click <b>File → Save a copy in Drive</b>. Work in the copy that opens.</li><li>Download Page 4. STEP 3 asks you to upload it.</li><li>Run the cells in order. Each starts with a comment (a note after <code>#</code>), such as <code class="nw"># STEP 1</code>.</li><li>One part, Find Values, asks you to add a cell of your own. Its slide has a <b>Copy Whole Cell</b> button.</li></ol><p class="p"><b>Setting Up Your Environment</b></p><p class="p">Before we start pulling text from scanned PDFs, we need to make sure we have the right tools. Since these PDFs contain images of text (not actual text), we'll use OCR for text recognition and bounding boxes for visualization. We'll be using the following libraries:</p><ul class="list"><li><b>Tesseract OCR</b>: To extract text from scanned images.</li><li><b>OpenCV</b>: Helps clean up images and draw boxes around detected text.</li></ul><p class="p">You already know PyMuPDF, Pillow (PIL) and NumPy from Project 3.</p><div class="note"><span class="num">IMPORTANT!</span><p class="">If you're using Google Colab, you <b>must</b> install Tesseract OCR manually because it's not included by default.</p></div>

<template id="t8">
<p class="p">Let's start by testing if we can extract text without OCR. If the PDF contains searchable text, we should get readable content. But if the PDF is just an image (like a scanned document), this method will likely fail, showing us why we need OCR.</p><p class="p"><i>What do you think will happen if we load our sample pharmaceutical SDF and inspect it? Let's find out.</i></p><p class="p">Load the PDF Using PyMuPDF: First, let's open the sample pharmaceutical document and try extracting text without OCR.</p><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 4</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code># ============================================
# STEP 4: Try Direct Text Extraction (This Will Fail!)
# ============================================
#
# WHAT WE'RE DOING:
# Attempting to extract text the "easy" way - without OCR.
#
# WHY THIS MATTERS:
# This demonstrates WHY we need OCR! Scanned PDFs are just pictures,
# so normal text extraction returns nothing or gibberish.
#
# WHAT YOU'LL SEE:
# Probably empty output or random characters - that's expected!
# ============================================</code></pre></figure>
</template>

<template id="t9">
<p class="p">Here's the rest of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code># Get the first page of our PDF
page = doc[0]

# Try to extract text the normal way
text = page.get_text("text")

print("Attempting direct text extraction (without OCR):")
print("-" * 50)
if text.strip():

# TIP: If you DO see text here, your PDF might be text-based, not scanned.

<template id="t11">
<p class="p"><b>Converting the PDF Page to an Image</b></p><p class="p">Since the text extraction failed, we now need to convert the PDF page into an image before we can use OCR. Here, we are converting the first page of the PDF.</p><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 5</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code># ============================================
# STEP 5: Convert PDF Page to an Image
# ============================================
#
# WHAT WE'RE DOING:
# Converting the PDF page into a picture that OCR can read.
#
# WHY THIS MATTERS:
# OCR tools work on images, not PDFs. Think of it like taking a
# screenshot of the document so the computer can "look" at it.
#
# WHAT YOU'LL SEE:
# Your pharmaceutical document displayed as an image!
# ============================================

# Convert the page to pixels (an image)
pix = page.get_pixmap(dpi=300)

# Convert to a format we can work with
img = np.array(Image.frombytes("RGB", [pix.width, pix.height], pix.samples))

# Display the original image
print("Here's your pharmaceutical document as an image:")
display(Image.fromarray(img))

# TIP: If the image looks rotated or upside down, we'll fix that later!</code></pre></figure>
</template>

<template id="t12">
<p class="p"><b>What this code does:</b></p><ul class="list"><li><code>page.get_pixmap(dpi=300)</code> turns the page into a picture with 300 pixels for each inch of the page (<b>dpi</b> means dots per inch). That gives Tesseract a sharp, detailed picture to read.</li><li>The next line turns the picture into a grid of numbers, one for each pixel, so OpenCV can work on it, and <code>display()</code> shows it under the cell.</li></ul><p class="p">Here's what the original pharmaceutical document looks like when converted to an image:</p><p class="p see"><b>What you'll see in Colab:</b></p><figure class="run out"><div class="code-head"><span class="code-lang">Output</span></div><pre tabindex="0"><code>Here's your pharmaceutical document as an image:</code></pre></figure><figure class="zoom"><p class="half-head">Then the page as a picture. Its top, zoomed in:</p><a href="pfizer3-p4-m2-try-s05-out.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p4-m2-try-z-s5-top.png" width="930" height="342" alt="The top of the STEP 5 picture, zoomed in: Certificate Of Processing, Prepared for GE HEALTHCARE, Gamma Process Run ID 129708B, and the heading Product Code." style="width:80%"><span class="sr-only"> (opens the whole Colab output picture in a new tab)</span></a></figure><p class="shot-cap">Click the picture to see the whole page as Colab shows it.</p><p class="p"><b>Why Convert to an Image?</b> OCR (Optical Character Recognition) can't work on PDFs directly. It needs an image of the text.</p><p class="p">Now that we have the image, let's clean it up to improve OCR accuracy!</p><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span><code>img</code> now holds: the picture of Page 4. STEP 6 starts from it.</span></p>
</template>

<template id="t13">
<p class="p"><b>Preprocessing the Image for Better OCR Accuracy</b></p><p class="p">Next come the 4 cleaning steps, one cell each. <b>Let's tackle them one by one.</b></p><p class="p"><b>Convert the Image to Grayscale:</b> Grayscale conversion simplifies OCR processing, making text easier to detect. First, we remove color information since OCR <b>only needs black and white text</b>.</p><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 6</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code># ============================================
# STEP 6: Preprocess - Convert to Grayscale
# ============================================
#
# WHAT WE'RE DOING:
# Removing color from the image - making it black and white.
#
# WHY THIS MATTERS:
# OCR works better on grayscale images because:
# - It's simpler (just light and dark, no colors to confuse it)
# - Text stands out more against the background
# - Processing is faster
#
# WHAT YOU'LL SEE:
# Your document in shades of gray (no color).
# ============================================

# Convert to grayscale (remove color)
gray = cv2.cvtColor(img, cv2.COLOR_RGB2GRAY)

print("Grayscale version (color removed):")
display(Image.fromarray(gray))

# TIP: Notice how the text still looks clear even without color!</code></pre></figure>
</template>

<template id="t14">
<p class="p"><b>Enhance Contrast with Adaptive Thresholding</b></p><p class="p">Some scanned documents have uneven lighting or faded text. This step boosts text visibility. To make the text <b>stand out</b>, we apply <b>adaptive thresholding</b>.</p><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 7</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code># ============================================
# STEP 7: Preprocess - Enhance Contrast (Thresholding)
# ============================================
#
# WHAT WE'RE DOING:
# Making the text MUCH darker and the background MUCH lighter.
#
# WHY THIS MATTERS:
# Scanned documents often have uneven lighting or faded text.
# Thresholding makes everything either pure black or pure white,
# which helps OCR see the text clearly.
#
# WHAT YOU'LL SEE:
# A high-contrast version where text is very dark on white background.
# ============================================</code></pre></figure>
</template>

<template id="t15">
<p class="p">Here's the rest of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code># Apply adaptive thresholding
# This automatically adjusts for different lighting in different areas
gray = cv2.adaptiveThreshold(
    gray,           # Input image
    255,            # Maximum value (white)
    cv2.ADAPTIVE_THRESH_MEAN_C,  # Method: use local mean
    cv2.THRESH_BINARY,           # Output: black or white only
    11,             # Block size (area to analyze)
    2               # Constant to subtract
)

print("After thresholding (high contrast):")
display(Image.fromarray(gray))

# TIP: If the text looks broken or spotty, try adjusting the block size (11)
# or the constant (2). Larger values = less sensitive to local variations.</code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>cv2.adaptiveThreshold(...)</code> takes <code>gray</code> and gives back a picture where every pixel is pure black or pure white. The comment next to each value says what it does.</li></ul>
</template>

<template id="t16">
<div class="pair"><div class="half"><p class="half-head">STEP 6: Gray</p><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>cv2.cvtColor(...)</code> turns the picture gray: one number per pixel (how dark it is) instead of three (red, green and blue).</li></ul><figure class="zoom"><p class="half-head">Before: the STEP 5 picture</p><a href="pfizer3-p4-m2-try-s05-out.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p4-m2-try-z-s5-id.png" width="690" height="180" alt="Before STEP 6: the Run ID 129708B near the top of Page 4, zoomed in." style="width:100%"><span class="sr-only"> (opens the whole Colab output picture in a new tab)</span></a></figure><figure class="zoom"><p class="half-head">After STEP 6</p><a href="pfizer3-p4-m2-try-s06-out.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p4-m2-try-z-s6-id.png" width="690" height="180" alt="After STEP 6: the Run ID 129708B near the top of Page 4, zoomed in. It looks the same as before." style="width:100%"><span class="sr-only"> (opens the whole Colab output picture in a new tab)</span></a></figure><p class="p">Page 4 was scanned without color, so the two pictures look the same. The change is inside the picture: one number per pixel instead of three.</p><p class="p"><b>Why Grayscale?</b></p><ul class="list"><li>Reduces unnecessary details.</li><li>Helps OCR focus on the <b>actual text</b>, not colors or backgrounds.</li></ul></div><div class="half"><p class="half-head">STEP 7: Black and White</p><p class="p">Take a look at what contrast enhancement can do to the images below:</p><figure class="zoom"><p class="half-head">Before: the STEP 6 picture</p><a href="pfizer3-p4-m2-try-s06-out.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p4-m2-try-z-s6-id.png" width="690" height="180" alt="Before STEP 7: the Run ID 129708B near the top of Page 4, zoomed in, with soft gray edges on the letters." style="width:100%"><span class="sr-only"> (opens the whole Colab output picture in a new tab)</span></a></figure><figure class="zoom"><p class="half-head">After STEP 7</p><a href="pfizer3-p4-m2-try-s07-out.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p4-m2-try-z-s7-id.png" width="690" height="180" alt="After STEP 7: the Run ID 129708B near the top of Page 4, zoomed in, every pixel now pure black or pure white." style="width:100%"><span class="sr-only"> (opens the whole Colab output picture in a new tab)</span></a></figure><p class="p">Look at the edges of the numbers: soft gray before, pure black after.</p><p class="p"><b>Why Contrast Enhancement?</b></p><ul class="list"><li>Makes faint text bolder for OCR.</li><li>Handles shadows and variations in lighting.</li></ul></div></div><p class="shot-cap">Zoomed in. Click a picture to see the whole page as Colab shows it.</p><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span><code>gray</code> now holds: the black and white picture from STEP 7. STEP 8 and STEP 9 change it again and keep the same name, <code>gray</code>.</span></p>

<template id="t17">
<p class="p"><b>Reduce Noise with Bilateral Filtering</b></p><p class="p">OCR can mistake noise for text, causing errors. Bilateral filtering smooths the background while keeping text sharp.</p><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 8</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code># ============================================
# STEP 8: Preprocess - Reduce Noise (Filtering)
# ============================================
#
# WHAT WE'RE DOING:
# Smoothing out tiny specks and dots that aren't part of the text.
#
# WHY THIS MATTERS:
# Scanned documents often have dust, scratches, or scanner artifacts.
# OCR might mistake these for letters! Filtering cleans them up
# while keeping the real text sharp.
#
# WHAT YOU'LL SEE:
# A cleaner image with less "noise" (random dots).
# ============================================

# Apply bilateral filtering
# This smooths the image while keeping edges (text) sharp
gray = cv2.bilateralFilter(
    gray,  # Input image
    9,     # Diameter of pixel neighborhood
    75,    # Filter sigma in the color space
    75     # Filter sigma in the coordinate space
)

print("After noise reduction (cleaner):")
display(Image.fromarray(gray))

# TIP: If you see the text getting blurry, reduce the filter values.
# If you still see lots of specks, increase them.</code></pre></figure>
</template>

<template id="t18">
<p class="p"><b>Resize the Image for Better OCR Accuracy</b></p><p class="p">If the scanned text is <b>too small</b>, OCR might miss details. We <b>scale up the image</b> to improve detection.</p><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 9</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code># ============================================
# STEP 9: Preprocess - Resize for Better OCR
# ============================================
#
# WHAT WE'RE DOING:
# Making the image bigger so small text becomes easier to read.
#
# WHY THIS MATTERS:
# Tesseract OCR works best when text is at least 12 pixels tall.
# Scanned documents often have tiny text that's hard to recognize.
# Scaling up by 200% (double size) helps OCR catch more details.
#
# WHAT YOU'LL SEE:
# A larger version of your document (you might need to scroll).
# ============================================

# Scale up the image by 200% (double the size)
scale_percent = 200
width = int(gray.shape[1] * scale_percent / 100)
height = int(gray.shape[0] * scale_percent / 100)

# Resize using high-quality interpolation

print(f"Resized to {width}x{height} pixels (200% of original):")
display(Image.fromarray(gray))

# TIP: If OCR is still missing small text, try scale_percent = 300!</code></pre></figure>
</template>

<template id="t23">
<p class="p"><b>Clean the OCR Output</b></p><p class="p">OCR text often contains errors, unnecessary spaces, or weird formatting. We need to clean it up to make it more readable and structured.</p><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 11</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code># ============================================
# STEP 11: Clean Up OCR Errors
# ============================================
#
# WHAT WE'RE DOING:
# Fixing common mistakes that OCR makes on pharmaceutical documents.
#
# WHY THIS MATTERS:
# OCR often confuses similar-looking characters:
# - "0" (zero) vs "O" (letter O)
# - "1" (one) vs "I" (letter I) vs "l" (lowercase L)
# In pharmaceutical docs, this can turn "LOT" into "L0T"!
#
# WHAT YOU'LL SEE:
# Cleaner text with common pharmaceutical terms fixed.
# ============================================

import re

# Step 11.1: Remove extra spaces and line breaks
ocr_text_clean = " ".join(ocr_text.split())</code></pre></figure>
</template>

<template id="t24">
<p class="p">Here's the rest of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code># Step 11.2: Fix common OCR errors in pharmaceutical documents
# These are words where OCR often mistakes numbers for letters
ocr_text_clean = re.sub(r'\bL0T\b', 'LOT', ocr_text_clean, flags=re.IGNORECASE)
ocr_text_clean = re.sub(r'\bC0A\b', 'COA', ocr_text_clean, flags=re.IGNORECASE)
ocr_text_clean = re.sub(r'\bCERT1FICATE\b', 'CERTIFICATE', ocr_text_clean, flags=re.IGNORECASE)
ocr_text_clean = re.sub(r'\bEXP1RATION\b', 'EXPIRATION', ocr_text_clean, flags=re.IGNORECASE)
ocr_text_clean = re.sub(r'\bPR0CESSING\b', 'PROCESSING', ocr_text_clean, flags=re.IGNORECASE)
ocr_text_clean = re.sub(r'\bMANUFACTUR1NG\b', 'MANUFACTURING', ocr_text_clean, flags=re.IGNORECASE)

# Step 11.3: Remove any weird symbols that aren't useful
ocr_text_clean = re.sub(r'[^a-zA-Z0-9\s,.%-/:]', '', ocr_text_clean)

print("=" * 50)
print("CLEANED OCR TEXT")
print("=" * 50)
print(ocr_text_clean)

# TIP: Add more re.sub() lines if you notice other common mistakes!</code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>re.sub(pattern, new, ocr_text_clean)</code> finds every match of the pattern and swaps it for the new word. <code>\b</code> marks the edge of a word, as in Project 3.</li><li><code>flags=re.IGNORECASE</code> matches capital and small letters alike, so <code>l0t</code> is fixed too.</li></ul>
</template>

<template id="t35">

<template id="t41">
<p class="p"><b>Structuring the Extracted Data for AI Models</b></p><p class="p">Now that we've successfully highlighted key fields in our scanned document, we need to organize this extracted information in a structured format.</p><p class="p">Most AI systems require structured data for further processing, classification, or training. To do this, we'll store our extracted key fields and their bounding box locations in JSON format.</p><p class="p"><b>Why Store the Data in JSON?</b></p><ul class="list"><li><b>Easy to read and process</b> → AI models work best with structured data.</li><li><b>Simple to search</b> → You can quickly extract "LOT" or "EXPIRATION" when needed.</li><li><b>Works well in automation</b> → JSON is widely used in AI, finance, and web applications.</li></ul><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 15</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code># ============================================

<template id="t47">
<p class="p">Here's the next part of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; next part of the cell</span></div><pre tabindex="0"><code>def rotate_image(image, angle):
    """
    Rotate an image by a specific angle.

    Args:
        image: The input image (numpy array)
        angle: Rotation angle (90, 180, or 270 degrees)

    Returns:
        Rotated image
    """
    if angle == 90:
        return cv2.rotate(image, cv2.ROTATE_90_CLOCKWISE)
    elif angle == 180:
        return cv2.rotate(image, cv2.ROTATE_180)
    elif angle == 270:
        return cv2.rotate(image, cv2.ROTATE_90_COUNTERCLOCKWISE)
    else:

    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #slide=N opens slide N directly */
  var hm = location.hash.match(/slide=(\d+)/);
  if (hm) i = Math.min(SLIDES.length - 1, Math.max(0, +hm[1] - 1));
  window.addEventListener("resize", function () { scaleStage(); space(); });
  scaleStage();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
</body>
</html>
