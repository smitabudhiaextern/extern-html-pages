:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* The design stage, scaled and centred by the script at the end */
.app{position:absolute;left:50%;top:50%;width:760px;height:1080px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: step rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:13px;font-weight:500;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}
.narrow .top{grid-template-columns:minmax(0,1fr);row-gap:8px}
.narrow .where{order:0}
.narrow .pg-word{display:none}
.narrow .pg.pg-fit{flex:none}

/* Slide area and slide */
.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}
.narrow .stage{padding:10px 0}
.narrow .card{padding:18px 16px;border-left:0;border-right:0;border-radius:0}
.inner{flex:none;display:flex;flex-direction:column;gap:var(--space-3);width:100%}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding-bottom:3px;color:var(--ink);text-wrap:balance}
.narrow .title{font-size:28px;line-height:34px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:15px;line-height:22px;color:var(--ink);text-wrap:pretty}
.p b{font-weight:600}
.p code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.p code.nw,.list code.nw{white-space:nowrap}
.list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:22px;text-wrap:pretty}
.list b{font-weight:600}
.list code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.list li::marker{color:var(--step-label);font-weight:600}
.see{margin-top:4px}

/* Buttons (design system Button, Light) */
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* Run card: a notebook cell (no Copy button: the cells are already in the notebook), or the one cell students add (Copy button) */
.run{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin:0}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:6px 8px 6px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:12px 14px;font-family:var(--font-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out{border-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:6px 12px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}

.narrow .run.out pre{font-size:12px}

/* The Colab screenshot: the full width of the card (edge to edge), opens full size in a new tab.

.shot{margin:0 calc(-1 * var(--space-5));border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;line-height:0;background:var(--surface)}
.narrow .shot{margin:0 -16px}
.shot a{display:block}

.shot-cap{margin:-6px 0 0;font-size:13px;line-height:18px;color:var(--gray-600)}

/* A picture of the page (slide 14: the table in foo.pdf): framed like the output blocks, as wide as the text */
.pagepic{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;line-height:0;background:var(--surface)}
.pagepic a{display:block}
.pagepic img{display:block;width:100%;height:auto}

/* Table and analysis box (from the Learn deck) */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.4}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:6px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}

.narrow .tbl td,.narrow .tbl th{padding:5px 8px}
.concl{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px;font-size:15px;line-height:22px;color:var(--card-text)}
.concl b{font-weight:600;color:var(--card-title)}
.concl p{margin:0}
.concl p + p{margin-top:6px}
.concl code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}


/* A smaller code font for the long function in Step 3 (from the 11 November module 9 steps deck) */
.run.small pre{font-size:12px;line-height:1.32;padding:8px 14px}
.narrow .run.small pre{font-size:10.5px;line-height:1.35}

/* Tip box (from the 11 November module 9 Learn deck): pale-blue card, Pfizer blue bulb in a white square */
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px}
.tip-icon{flex:none;width:30px;height:30px;border-radius:var(--radius-xs);background:var(--surface);display:grid;place-items:center;color:var(--pfizer-blue)}
.tip-icon svg{width:18px;height:18px}
.tip p{margin:0;font-size:15px;line-height:22px;color:var(--card-text);text-wrap:pretty}
.tip b{font-weight:600;color:var(--card-title)}

/* Last slide: his closing line and Key Takeaway (takeaway box copied from the module 7 cheat sheet slide) */
.inner.end-slide{gap:var(--space-4)}
.end-slide .p{font-size:17px;line-height:1.55}
.take{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:14px 18px;font-size:17px;line-height:1.55;color:var(--card-text)}
.take b{font-weight:700;color:var(--card-title)}
.take code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .take{font-size:15px;padding:12px 16px}
.narrow .end-slide .p{font-size:16px}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:22px;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.foot .btn{padding:10px 16px;font-size:15px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
.narrow .upnext{visibility:hidden}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }

/* Added for P4 module 2 (copied from the P3 module 8 Try deck): "now holds" note, the SME's callout box, the Quick Recap size */
.holds{margin:0;display:flex;align-items:center;gap:8px;background:var(--surface-card);border-left:4px solid var(--pfizer-blue);border-radius:var(--radius-xs);padding:7px 12px;font-size:14px;line-height:20px;font-weight:600;color:var(--card-title)}
.holds code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px}
.holds svg{width:16px;height:16px;flex:none;color:var(--pfizer-blue)}
.note{border:1.5px solid var(--ink);border-radius:var(--radius-sm);padding:9px 14px}
.note .num{display:block;margin-bottom:3px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.note p{margin:0;font-size:14.5px;line-height:1.48;color:var(--ink-muted)}
.note b{font-weight:600;color:var(--ink)}
.recap-slide .list{font-size:17px;line-height:1.55;gap:14px}
.recap-slide .list ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.recap-slide .list ul li::marker{color:var(--ink-muted)}
.narrow .recap-slide .list{font-size:15.5px;gap:10px}
/* Many steps in the rail: numbers only */
.pg-word{display:none}
.pg-label{text-align:center}
.pg.pg-fit{flex:none}
.pg.pg-fit .pg-label{text-align:left}
/* Under 560 px there is no room for 19 labels: the rail shows only the progress bars, and "Step N" sits beside the count */
.narrow .pg-label{display:none}
.narrow .pg.pg-fit{flex:1 1 0}
/* Code: these cells have long lines, so code wraps (nothing may scroll) and uses a slightly smaller font than P3 */
.run pre{font-size:12.5px;line-height:1.45;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.run.small pre{font-size:11.5px;line-height:1.36;padding:8px 14px}
.narrow .run pre{font-size:11px;padding:8px 10px}
.narrow .run.small pre{font-size:10.5px}
/* Code in long cells and outputs */
.run.out pre{font-size:12px;line-height:1.42}
.run.out.small pre{font-size:11px;line-height:1.38}
.narrow .run.out pre{font-size:11px}
.narrow .run.out.small pre{font-size:10px}
/* The STEP 15 JSON: the 3 heading lines across the top, the JSON in two columns (same text, same order) */
.run.out.json pre.head{padding-bottom:0}
.run.out.json pre.cols{column-count:2;column-gap:24px;padding-top:4px}
.narrow .run.out.json pre.cols{column-gap:12px;font-size:10.5px}
/* A page picture from Colab (tall): shown smaller and centred, so the slide stays short; opens full size */
.shot.tall{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.shot.tall img{width:auto;max-width:100%;height:var(--pic-h,480px);margin:0 auto}
.narrow .shot.tall{margin:0}
.narrow .shot.tall img{height:var(--pic-hn,520px)}

<template id="t1">
<p class="p">Here is the sample pharmaceutical SDF that we are going to utilize, and the Colab notebook you'll use to follow along:</p><div class="links"><a class="btn btn-secondary" href="https://drive.google.com/file/d/1UvYmChia7K90-xjCsHsGqhixmDrPfhHw/view" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Sample Pharmaceutical SDF: Page 4 (Certificate of Processing)</span><span class="sr-only"> (opens in a new tab)</span></a><a class="btn btn-secondary" href="https://colab.research.google.com/drive/1n2-iMesweW8Y1olLFlqcmNtJOMhhIL3d" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Extracting Text and Bounding Boxes from Scanned PDFs (Colab notebook)</span><span class="sr-only"> (opens in a new tab)</span></a></div><ol class="list"><li>Open the notebook, then click <b>File → Save a copy in Drive</b>. Your copy opens in a new tab. Work in that copy.</li><li>Download Page 4 to your computer. The notebook asks you to upload it in STEP 3.</li><li>Run the notebook's cells in order, from the top. Each cell starts with a comment (a note after <code>#</code>) such as <code class="nw"># STEP 1</code>, and the next slides take you through them one by one.</li><li>A few slides ask you to add a cell of your own. Those cells have a <b>Copy</b> button.</li></ol>

<template id="t2">
<p class="p">Before we start pulling text from scanned PDFs, we need to make sure we have the right tools. Since these PDFs contain images of text (not actual text), we'll use OCR for text recognition and bounding boxes for visualization. We'll be using the following libraries:</p><ul class="list"><li><b>Tesseract OCR</b>: To extract text from scanned images.</li><li><b>OpenCV</b>: Helps clean up images and draw boxes around detected text.</li></ul><p class="p">You already know PyMuPDF, Pillow (PIL) and NumPy from Project 3.</p><div class="note"><span class="num">IMPORTANT!</span><p class="">If you're using Google Colab, you <b>must</b> install Tesseract OCR manually because it's not included by default.</p></div>
</template>

<template id="t3">
<p class="p">Now, let's install everything and get started! Press <b>Run</b> on the first cell, the one that starts with <code class="nw"># STEP 1</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code># ============================================
# STEP 1: Install Dependencies
# ============================================

<template id="t15">
<p class="p"><b>Enhance Contrast with Adaptive Thresholding</b></p><p class="p">Some scanned documents have uneven lighting or faded text. This step boosts text visibility. To make the text <b>stand out</b>, we apply <b>adaptive thresholding</b>.</p><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 7</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code># ============================================
# STEP 7: Preprocess - Enhance Contrast (Thresholding)
# ============================================
#
# WHAT WE'RE DOING:
# Making the text MUCH darker and the background MUCH lighter.
#
# WHY THIS MATTERS:
# Scanned documents often have uneven lighting or faded text.
# Thresholding makes everything either pure black or pure white,
# which helps OCR see the text clearly.
#
# WHAT YOU'LL SEE:
# A high-contrast version where text is very dark on white background.
# ============================================

# Apply adaptive thresholding
# This automatically adjusts for different lighting in different areas
gray = cv2.adaptiveThreshold(
    gray,           # Input image
    255,            # Maximum value (white)
    cv2.ADAPTIVE_THRESH_MEAN_C,  # Method: use local mean
    cv2.THRESH_BINARY,           # Output: black or white only
    11,             # Block size (area to analyze)
    2               # Constant to subtract
)

print("After thresholding (high contrast):")
display(Image.fromarray(gray))

# TIP: If the text looks broken or spotty, try adjusting the block size (11)
# or the constant (2). Larger values = less sensitive to local variations.</code></pre></figure>
</template>

<template id="t16">
<p class="p"><b>What this code does:</b></p><ul class="list"><li><code>cv2.adaptiveThreshold(...)</code> takes <code>gray</code> and gives back a picture where every pixel is pure black or pure white. The comment next to each value says what it does.</li></ul><p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot tall"><a href="pfizer3-p4-m2-try-s07-out.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p4-m2-try-s07-out.png" width="1820" height="2034" alt="The output of STEP 7 in Colab: After thresholding (high contrast):, then Page 4 in pure black and white."><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure><p class="shot-cap">Click the picture to open it full size.</p><p class="p"><b>Why Contrast Enhancement?</b></p><ul class="list"><li>Makes faint text bolder for OCR.</li><li>Handles shadows and variations in lighting.</li></ul>
</template>

<template id="t17">
<p class="p"><b>Reduce Noise with Bilateral Filtering</b></p><p class="p">OCR can mistake noise for text, causing errors. Bilateral filtering smooths the background while keeping text sharp.</p><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 8</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code># ============================================
# STEP 8: Preprocess - Reduce Noise (Filtering)
# ============================================
#
# WHAT WE'RE DOING:
# Smoothing out tiny specks and dots that aren't part of the text.
#
# WHY THIS MATTERS:
# Scanned documents often have dust, scratches, or scanner artifacts.
# OCR might mistake these for letters! Filtering cleans them up
# while keeping the real text sharp.
#
# WHAT YOU'LL SEE:
# A cleaner image with less "noise" (random dots).
# ============================================

# Apply bilateral filtering
# This smooths the image while keeping edges (text) sharp
gray = cv2.bilateralFilter(
    gray,  # Input image
    9,     # Diameter of pixel neighborhood

    75     # Filter sigma in the coordinate space
)

print("After noise reduction (cleaner):")
display(Image.fromarray(gray))

# TIP: If you see the text getting blurry, reduce the filter values.
# If you still see lots of specks, increase them.</code></pre></figure>
</template>

<p class="p"><b>What this code does:</b></p><ul class="list"><li><code>cv2.bilateralFilter(...)</code> smooths each pixel with the pixels around it, but not across the sharp edges of the letters.</li></ul><p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot tall"><a href="pfizer3-p4-m2-try-s08-out.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p4-m2-try-s08-out.png" width="1820" height="2034" alt="The output of STEP 8 in Colab: After noise reduction (cleaner):, then Page 4 in black and white with fewer specks."><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure><p class="shot-cap">Click the picture to open it full size.</p><p class="p"><b>Why Noise Reduction?</b></p><ul class="list"><li>Removes unwanted specks that OCR might misinterpret.</li><li>Keeps text edges sharp, so characters don't blur.</li></ul>

<template id="t19">
<p class="p"><b>Resize the Image for Better OCR Accuracy</b></p><p class="p">If the scanned text is <b>too small</b>, OCR might miss details. We <b>scale up the image</b> to improve detection.</p><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 9</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code># ============================================
# STEP 9: Preprocess - Resize for Better OCR
# ============================================
#
# WHAT WE'RE DOING:
# Making the image bigger so small text becomes easier to read.
#
# WHY THIS MATTERS:
# Tesseract OCR works best when text is at least 12 pixels tall.
# Scanned documents often have tiny text that's hard to recognize.
# Scaling up by 200% (double size) helps OCR catch more details.
#
# WHAT YOU'LL SEE:
# A larger version of your document (you might need to scroll).

# Scale up the image by 200% (double the size)

height = int(gray.shape[0] * scale_percent / 100)

print(f"Resized to {width}x{height} pixels (200% of original):")
display(Image.fromarray(gray))

# TIP: If OCR is still missing small text, try scale_percent = 300!</code></pre></figure>
</template>

<template id="t24">
<p class="p">OCR text often contains errors, unnecessary spaces, or weird formatting. We need to clean it up to make it more readable and structured.</p><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 11</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code># ============================================
# STEP 11: Clean Up OCR Errors
# ============================================
#
# WHAT WE'RE DOING:
# Fixing common mistakes that OCR makes on pharmaceutical documents.
#
# WHY THIS MATTERS:
# OCR often confuses similar-looking characters:
# - "0" (zero) vs "O" (letter O)
# - "1" (one) vs "I" (letter I) vs "l" (lowercase L)
# In pharmaceutical docs, this can turn "LOT" into "L0T"!
#
# WHAT YOU'LL SEE:
# Cleaner text with common pharmaceutical terms fixed.
# ============================================

import re

# Step 11.1: Remove extra spaces and line breaks
ocr_text_clean = " ".join(ocr_text.split())</code></pre></figure>
</template>

<template id="t25">
<p class="p">Here's the rest of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code># Step 11.2: Fix common OCR errors in pharmaceutical documents
# These are words where OCR often mistakes numbers for letters
ocr_text_clean = re.sub(r'\bL0T\b', 'LOT', ocr_text_clean, flags=re.IGNORECASE)
ocr_text_clean = re.sub(r'\bC0A\b', 'COA', ocr_text_clean, flags=re.IGNORECASE)
ocr_text_clean = re.sub(r'\bCERT1FICATE\b', 'CERTIFICATE', ocr_text_clean, flags=re.IGNORECASE)
ocr_text_clean = re.sub(r'\bEXP1RATION\b', 'EXPIRATION', ocr_text_clean, flags=re.IGNORECASE)
ocr_text_clean = re.sub(r'\bPR0CESSING\b', 'PROCESSING', ocr_text_clean, flags=re.IGNORECASE)
ocr_text_clean = re.sub(r'\bMANUFACTUR1NG\b', 'MANUFACTURING', ocr_text_clean, flags=re.IGNORECASE)

# Step 11.3: Remove any weird symbols that aren't useful
ocr_text_clean = re.sub(r'[^a-zA-Z0-9\s,.%-/:]', '', ocr_text_clean)

print("=" * 50)
print("CLEANED OCR TEXT")
print("=" * 50)
print(ocr_text_clean)

# TIP: Add more re.sub() lines if you notice other common mistakes!</code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>re.sub(pattern, new, ocr_text_clean)</code> finds every match of the pattern and swaps it for the new word. <code>\b</code> marks the edge of a word, as in Project 3.</li><li><code>flags=re.IGNORECASE</code> matches capital and small letters alike, so <code>l0t</code> is fixed too.</li><li>The last <code>re.sub</code> deletes symbols that aren't letters, numbers or common punctuation.</li></ul>
</template>

<template id="t39">

# TIP: If you see boxes around noise/artifacts, increase confidence_threshold!</code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>continue</code> skips to the next word, so empty rows and words Tesseract is less than 40% sure of get no box.</li><li><code>cv2.rectangle(...)</code> draws each box, as in Project 3. <code>(0, 255, 0)</code> is green, because OpenCV lists the colors as blue, green, red.</li></ul>

<template id="t46">
<p class="p">Now that we've successfully highlighted key fields in our scanned document, we need to organize this extracted information in a structured format.</p><p class="p">Most AI systems require structured data for further processing, classification, or training. To do this, we'll store our extracted key fields and their bounding box locations in JSON format.</p><p class="p"><b>Why Store the Data in JSON?</b></p><ul class="list"><li><b>Easy to read and process</b> → AI models work best with structured data.</li><li><b>Simple to search</b> → You can quickly extract "LOT" or "EXPIRATION" when needed.</li><li><b>Works well in automation</b> → JSON is widely used in AI, finance, and web applications.</li></ul><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 15</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code># ============================================
# STEP 15: Export Key Fields to JSON
# ============================================
#
# WHAT WE'RE DOING:
# Saving the key pharmaceutical fields in a structured JSON format.
#
# WHY THIS MATTERS:
# JSON is the standard format for passing data to:
# - AI models for training or inference
# - Databases for storage
# - Other software for further processing
# This makes your extracted data actually USEFUL!
#
# WHAT YOU'LL SEE:
# A nicely formatted JSON output with key fields and their locations.
# ============================================</code></pre></figure>
</template>

<template id="t47">
<p class="p">Here's the rest of the same cell:</p><figure class="run small"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code>import json

# Create a dictionary to store our extracted data
extracted_data = {}

# Loop through and collect key fields
for i in range(len(ocr_data["text"])):
    word = ocr_data["text"][i].strip().upper()

    if word in key_fields:
        x = ocr_data["left"][i]
        y = ocr_data["top"][i]
        w = ocr_data["width"][i]
        h = ocr_data["height"][i]
        conf = ocr_data["conf"][i]

        extracted_data[word] = {
            "text": word,
            "bounding_box": [x, y, w, h],
            "confidence": conf
        }

# Convert to pretty JSON
json_output = json.dumps(extracted_data, indent=4)

print("=" * 50)
print("EXTRACTED KEY FIELDS (JSON FORMAT)")

print(json_output)

# TIP: You can save this to a file with:

#     f.write(json_output)</code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>extracted_data[word] = {...}</code> saves one entry for each key field: the word, its box and its confidence.</li><li><code>json.dumps(extracted_data, indent=4)</code> turns the dictionary into JSON text, each level indented by 4 spaces.</li></ul>
</template>

<template id="t55">
<p class="p">Here's the rest of the same cell:</p><figure class="run small"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code>def rotate_image(image, angle):
    """
    Rotate an image by a specific angle.

    Args:
        image: The input image (numpy array)
        angle: Rotation angle (90, 180, or 270 degrees)

    Returns:
        Rotated image
    """
    if angle == 90:
        return cv2.rotate(image, cv2.ROTATE_90_CLOCKWISE)
    elif angle == 180:
        return cv2.rotate(image, cv2.ROTATE_180)
    elif angle == 270:
        return cv2.rotate(image, cv2.ROTATE_90_COUNTERCLOCKWISE)
    else:
        return image

print("  rotated_gray = rotate_image(gray, 180)  # Rotate 180 degrees")
print("  rotated_gray = rotate_image(gray, 270)  # Rotate 270 degrees")

# TIP: If you're not sure how much to rotate, try all three and see

  ];
  var STAGE = { wide: [760, 1080], narrow: [420, 1240] };
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of this reading.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var sz = narrow ? STAGE.narrow : STAGE.wide;
    app.style.width = sz[0] + "px"; app.style.height = sz[1] + "px";
    var k = Math.min(window.innerWidth / sz[0], window.innerHeight / sz[1]);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  var GROUP_LABEL = { "Regex": "Find" };
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    var isStep = g.name.indexOf("Step ") === 0;
    b.type = "button"; b.className = "pg" + (isStep ? "" : " pg-fit");
    var shown = GROUP_LABEL[g.name] || g.name;
    b.setAttribute("aria-label", (g.name === "Regex" ? "Find Values" : shown) + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    var word = isStep ? '<span class="pg-word">Step </span>' + g.name.replace("Step ", "") : shown;
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + word + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span"), orig = label.textContent;
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = orig; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner' + (s.cls ? " " + s.cls : "") + '"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + document.getElementById(s.tpl).innerHTML + '</div>';
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(CELLS[b.getAttribute("data-copy")], b, pre); });
    });
    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.where || s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
    space();
    Array.prototype.forEach.call(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a slide. Spare height widens the gaps
     between blocks, up to 2x. */
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = "";
    var cs = getComputedStyle(card);
    var avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var base = parseFloat(getComputedStyle(inner).rowGap) || 14;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (base + Math.min(base, spare / gaps)) + "px";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    space();
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #slide=N opens slide N directly */
  var hm = location.hash.match(/slide=(\d+)/);
  if (hm) i = Math.min(SLIDES.length - 1, Math.max(0, +hm[1] - 1));
  window.addEventListener("resize", function () { scaleStage(); space(); });
  scaleStage();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
