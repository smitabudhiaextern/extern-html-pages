<div class="rpb-root">
<style>
  .rpb-root {
    container-type: inline-size;
    display: block;
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #484646;
    -webkit-font-smoothing: antialiased;
  }
  .rpb-root *, .rpb-root *::before, .rpb-root *::after { box-sizing: border-box; }
  .rpb-stage {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #FDF8F8;
    border: 1px solid #DCE1FF;
    border-radius: 16px;
    padding: 18px 22px;
    padding: 2.6cqw 3cqw;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .rpb-title {
    margin: 0;
    font-weight: 700;
    color: #1C1B1B;
    font-size: 22px;
    font-size: 2.5cqw;
    line-height: 1.15;
  }
  .rpb-sub {
    margin: 4px 0 0;
    margin: 0.6cqw 0 0;
    color: #484646;
    font-size: 13px;
    font-size: 1.45cqw;
    line-height: 1.35;
  }
  .rpb-inputs {
    display: flex;
    gap: 14px;
    gap: 1.8cqw;
    margin-top: 10px;
    margin-top: 1.6cqw;
  }
  .rpb-field { flex: 1; display: flex; flex-direction: column; }
  .rpb-field label {
    font-weight: 700;
    color: #001D69;
    font-size: 11px;
    font-size: 1.25cqw;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 4px;
    margin-bottom: 0.5cqw;
  }
  .rpb-field input {
    width: 100%;
    border: 1px solid #DCE1FF;
    border-radius: 8px;
    background: #fff;
    color: #1C1B1B;
    font: inherit;
    font-size: 14px;
    font-size: 1.55cqw;
    padding: 7px 10px;
    padding: 0.9cqw 1.2cqw;
  }
  .rpb-field input:focus { outline: 2px solid #001D69; outline-offset: 0; border-color: #001D69; }
  .rpb-field input::placeholder { color: #9a9797; }
  .rpb-tabs {
    display: flex;
    gap: 6px;
    gap: 0.8cqw;
    margin-top: 12px;
    margin-top: 1.6cqw;
  }
  .rpb-tab {
    flex: 1;
    border: 1px solid #DCE1FF;
    background: #fff;
    color: #001D69;
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    font-size: 1.55cqw;
    padding: 6px 8px;
    padding: 0.8cqw 1cqw;
    border-radius: 8px;
    cursor: pointer;
  }
  .rpb-tab.active { background: #001D69; color: #fff; border-color: #001D69; }
  .rpb-panel {
    flex: 1;
    min-height: 0;
    margin-top: 10px;
    margin-top: 1.4cqw;
    display: flex;
    flex-direction: column;
  }
  .rpb-hint {
    font-size: 11.5px;
    font-size: 1.3cqw;
    color: #001D69;
    background: #DCE1FF;
    border-radius: 6px;
    padding: 5px 9px;
    padding: 0.7cqw 1.1cqw;
    margin-bottom: 8px;
    margin-bottom: 1cqw;
    line-height: 1.3;
  }
  .rpb-body {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: stretch;
    gap: 10px;
    gap: 1.3cqw;
  }
  .rpb-prompt {
    flex: 1;
    overflow: hidden;
    background: #fff;
    border: 1px solid #DCE1FF;
    border-radius: 10px;
    padding: 10px 13px;
    padding: 1.3cqw 1.6cqw;
    color: #2f2e2e;
    font-size: 13px;
    font-size: 1.72cqw;
    line-height: 1.44;
  }
  .rpb-ph { background: #DCE1FF; color: #001D69; border-radius: 3px; padding: 0 3px; font-weight: 600; }
  .rpb-copy {
    align-self: flex-end;
    flex-shrink: 0;
    border: none;
    background: #001D69;
    color: #fff;
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    font-size: 1.5cqw;
    padding: 8px 14px;
    padding: 1cqw 1.7cqw;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .rpb-copy:hover { background: #00287f; }
</style>

<div class="rpb-stage">
  <div class="rpb-title">Research Prompt Builder</div>
  <div class="rpb-sub">Type your company name and website once. Pick a prompt, copy it, and run it in Perplexity (or Claude).</div>

  <div class="rpb-inputs">
    <div class="rpb-field">
      <label for="rpb-company">Company name</label>
      <input id="rpb-company" type="text" placeholder="e.g. Acme Downhole Systems" autocomplete="off" />
    </div>
    <div class="rpb-field">
      <label for="rpb-website">Company website</label>
      <input id="rpb-website" type="text" placeholder="e.g. https://www.acme.com" autocomplete="off" />
    </div>
  </div>

  <div class="rpb-tabs">
    <button class="rpb-tab active" type="button" data-t="p1">What they do</button>
    <button class="rpb-tab" type="button" data-t="p2">Funding</button>
    <button class="rpb-tab" type="button" data-t="p3">Founders</button>
  </div>

  <div class="rpb-panel">
    <div class="rpb-hint">Tip: your company's own website is the most important source, and it's built into every prompt.</div>
    <div class="rpb-body">
      <div class="rpb-prompt" id="rpb-out"></div>
      <button class="rpb-copy" id="rpb-copy" type="button">Copy prompt</button>
    </div>
  </div>
</div>

<script>
(function () {
  var root = document.currentScript.closest('.rpb-root');
  var tpl = {
    p1: "I'm a venture capital analyst running early-stage diligence on {C}. Start with the company's own website, {W}, as your primary source, then corroborate with independent public sources (press, product pages, technical write-ups, industry coverage). Give me a sourced brief covering: (1) what they do, in one plain sentence a non-expert could repeat; (2) the specific problem they solve and how that job is done today without them; (3) how their core technology actually works, in plain language, and what makes it different from the standard approach; (4) who exactly pays for it — for an oil & gas company, which kind of operator and why they'd buy. Put a source link right after each claim. Where the company promotes a performance number (efficiency, savings, recovery, speed), label it clearly as the company's own claim, not a verified fact. If something isn't public, write \"not found\" rather than guessing.",
    p2: "Continuing my diligence on {C} (website: {W}): give me a fully sourced funding history. For each round list the stage, amount, date, lead investor, and notable co-investors; then the total raised to date and the most recent valuation if it's public. Flag any investor that is also a customer or strategic partner — that's an important signal. Pull from the company site, Crunchbase, PitchBook, and reputable press, and put a source link next to each figure. If a number appears in only one source or a press release, say so. Write \"not found\" for anything not public rather than estimating.",
    p3: "Still researching {C} (website: {W}). Find primary-source material from or about the founders and executives: interviews, podcasts, conference talks, and substantial press profiles. Summarize what they themselves say about (1) the origin story and why they started it, (2) how the technology works and why it's hard to copy, (3) their market and customers, and (4) their traction and strategy so far. Link every source, and quote a sentence or two directly where it's especially revealing. If you can't find primary material on a topic, say so plainly."
  };
  var company = root.querySelector('#rpb-company');
  var website = root.querySelector('#rpb-website');
  var out = root.querySelector('#rpb-out');
  var copyBtn = root.querySelector('#rpb-copy');
  var tabs = root.querySelectorAll('.rpb-tab');
  var active = 'p1';

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function htmlFor(t) {
    var c = company.value.trim() ? esc(company.value.trim()) : '<span class="rpb-ph">[company name]</span>';
    var w = website.value.trim() ? esc(website.value.trim()) : '<span class="rpb-ph">[website]</span>';
    return esc(tpl[t]).replace(/\{C\}/g, c).replace(/\{W\}/g, w);
  }
  function textFor(t) {
    var c = company.value.trim() || '[company name]';
    var w = website.value.trim() || '[website]';
    return tpl[t].replace(/\{C\}/g, c).replace(/\{W\}/g, w);
  }
  function render() { out.innerHTML = htmlFor(active); }

  company.addEventListener('input', render);
  website.addEventListener('input', render);
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      active = b.getAttribute('data-t');
      tabs.forEach(function (x) { x.classList.toggle('active', x === b); });
      render();
    });
  });
  copyBtn.addEventListener('click', function () {
    var text = textFor(active);
    function done() { copyBtn.textContent = 'Copied!'; setTimeout(function () { copyBtn.textContent = 'Copy prompt'; }, 1500); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); done();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
  });

  render();
})();
</script>
</div>
