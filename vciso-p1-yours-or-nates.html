<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six tasks. Whose is it?</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: #FDF8F8;
  color: #484646;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  overflow-x: hidden;
}
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 28px 18px 48px;
}
h1 {
  color: #1C1B1B;
  font-size: 1.35rem;
  line-height: 1.3;
  margin: 0 0 8px;
}
.instr { margin: 0 0 20px; }
.count {
  color: #001D69;
  font-size: 0.95rem;
  font-weight: 700;
  margin: 0 0 8px;
}
.zone {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 62px;
  border: 1px dashed #484646;
  border-radius: 10px;
  padding: 10px;
}
.zone.over {
  border-style: solid;
  border-color: #001D69;
  background: #DCE1FF;
}
.cols {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 22px;
}
.col {
  border: 1px solid #484646;
  border-radius: 10px;
  padding: 12px;
  min-width: 0;
}
.col h2 {
  color: #001D69;
  font-size: 1rem;
  margin: 0 0 10px;
}
.col .zone { border: none; padding: 0; min-height: 54px; }
.col.over { background: #DCE1FF; border-color: #001D69; }
.card {
  background: #FDF8F8;
  border: 1px solid #484646;
  border-radius: 9px;
  padding: 11px 12px;
  min-width: 0;
}
.card.drag { border-color: #001D69; }
.card p { margin: 0; color: #1C1B1B; font-size: 0.98rem; }
.btns { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.btns button {
  font: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  color: #001D69;
  background: #FDF8F8;
  border: 1px solid #001D69;
  border-radius: 7px;
  padding: 4px 10px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.btns button[aria-pressed="true"] {
  background: #DCE1FF;
  box-shadow: inset 0 0 0 1px #001D69;
}
button:focus-visible { outline: 3px solid #001D69; outline-offset: 2px; }
svg.ic {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  display: block;
  fill: none;
  stroke: #001D69;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.rev { margin-top: 10px; }
.mk {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #001D69;
  font-size: 0.88rem;
  font-weight: 700;
  border: 1px solid #001D69;
  border-radius: 999px;
  padding: 2px 11px 2px 8px;
}
.rev p.why { margin: 8px 0 0; color: #484646; font-size: 0.95rem; }
/* A card the student put in the wrong column moves to the right one on
   reveal. The correction carries the fill, the icon and the column name.
   Their own placement is words only: no fill, no tick. */
.mk.fix {
  background: #001D69;
  color: #DCE1FF;
  font-size: 0.95rem;
  padding: 4px 12px 4px 9px;
}
.mk.fix svg.ic { stroke: #DCE1FF; }
.rev p.mypick { margin: 8px 0 0; color: #484646; font-size: 0.86rem; }
.held {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #484646;
  font-size: 0.88rem;
  font-weight: 600;
  border: 1px dashed #484646;
  border-radius: 999px;
  padding: 2px 11px 2px 8px;
}
.half {
  background: #DCE1FF;
  border: 1px solid #001D69;
  border-radius: 9px;
  padding: 11px 12px;
}
.half p { color: #001D69; font-weight: 600; }
.half.move { transition: transform 420ms ease-out; }
#conn {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: none;
  overflow: visible;
}
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.actions button {
  font: inherit;
  font-weight: 600;
  color: #FDF8F8;
  background: #001D69;
  border: 2px solid #001D69;
  border-radius: 8px;
  padding: 11px 24px;
  cursor: pointer;
}
.actions button[aria-disabled="true"] {
  color: #484646;
  background: #FDF8F8;
  border-color: #484646;
  cursor: default;
}
.sum {
  color: #001D69;
  font-size: 1.05rem;
  font-weight: 700;
  margin: 20px 0 0;
}
.panel {
  background: #DCE1FF;
  color: #001D69;
  border-radius: 10px;
  padding: 16px 18px;
  margin-top: 20px;
}
.panel p { margin: 0; }
.close {
  color: #1C1B1B;
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1.35;
  margin: 22px 0 0;
  padding-top: 16px;
  border-top: 1px solid #484646;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
@media (max-width: 640px) {
  .cols { grid-template-columns: 1fr; }
}
@media (max-width: 420px) {
  body { font-size: 16px; }
  main { padding: 20px 14px 40px; }
}
</style>
</head>
<body>
<main>
  <h1>Six tasks. Whose is it?</h1>
  <p class="instr">Place all six. Guess where you are unsure.</p>

  <p class="count" id="count" aria-live="polite">6 left to place</p>
  <div class="zone" id="tray" data-zone="tray"></div>

  <div class="cols" id="cols">
    <section class="col" id="col-yours" data-zone="yours">
      <h2 id="h-yours">Yours</h2>
      <div class="zone" data-zone="yours" aria-labelledby="h-yours"></div>
    </section>
    <section class="col" id="col-nates" data-zone="nates">
      <h2 id="h-nates">Nate&rsquo;s</h2>
      <div class="zone" data-zone="nates" aria-labelledby="h-nates"></div>
    </section>
    <svg id="conn" aria-hidden="true" focusable="false" hidden></svg>
  </div>

  <div class="actions">
    <button type="button" id="reveal" aria-disabled="true" aria-describedby="hint" title="Place all six cards first">Reveal</button>
    <span class="sr" id="hint">Place all six cards first</span>
    <button type="button" id="sixth" hidden>Show the sixth</button>
    <button type="button" id="reset" hidden>Start over</button>
  </div>

  <p class="sum" id="sum" role="status" aria-live="polite" hidden></p>
  <div class="panel" id="panel" hidden><p></p></div>
  <p class="close" id="close" hidden></p>
</main>

<script>
(function () {
  var ITEMS = [
    { text: "Decide whether the billing platform can go a weekend without a patch.", answer: "yours", why: "Yours. A risk decision with a business consequence attached. Somebody has to own the answer if the weekend goes badly." },
    { text: "Restore a file someone deleted by accident.", answer: "nates", why: "His. Operations. Something broke and needs to work again." },
    { text: "Decide whether the clearinghouse should be able to reach the claims database.", answer: "yours", why: "Yours. A risk decision about an outside party, and the answer has to survive being asked about later." },
    { text: "Reset an account that has locked itself out.", answer: "nates", why: "His. Operations. A request, actioned." },
    { text: "Work out what it would cost the business if the archive were encrypted by an attacker.", answer: "yours", why: "Yours. A risk judgment. Nobody can rank a risk without a view on what it would cost." },
    { text: "Renew a certificate before it expires.", answer: null, why: null }
  ];

  var SIXTH = 5;

  var ICON = {
    tick: '<polyline points="5 12.6 9.4 17 19 6.6"/>',
    ok: '<circle cx="12" cy="12" r="9"/><polyline points="8 12.3 11 15.2 16.3 9"/>',
    alert: '<path d="M12 4.4 21.2 19.6 2.8 19.6Z"/><line x1="12" y1="10" x2="12" y2="14"/><line x1="12" y1="16.5" x2="12" y2="16.7"/>',
    held: '<circle cx="12" cy="12" r="9"/><polyline points="12 7.5 12 12 15.4 14"/>'
  };

  var COLNAME = { yours: "Yours", nates: "Nate&rsquo;s" };

  function svg(paths) {
    return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + paths + "</svg>";
  }

  var tray = document.getElementById("tray");
  var cols = document.getElementById("cols");
  var conn = document.getElementById("conn");
  var count = document.getElementById("count");
  var revealBtn = document.getElementById("reveal");
  var hint = document.getElementById("hint");
  var sixthBtn = document.getElementById("sixth");
  var resetBtn = document.getElementById("reset");
  var sum = document.getElementById("sum");
  var panel = document.getElementById("panel");
  var closeLine = document.getElementById("close");

  var zones = {
    tray: tray,
    yours: document.querySelector('#col-yours .zone'),
    nates: document.querySelector('#col-nates .zone')
  };
  var colBoxes = {
    yours: document.getElementById("col-yours"),
    nates: document.getElementById("col-nates")
  };

  var placed = [];
  var cards = [];
  var stage = 0;
  var halves = null;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

  function build() {
    stage = 0;
    halves = null;
    placed = [];
    cards = [];
    tray.innerHTML = "";
    tray.hidden = false;
    count.hidden = false;
    zones.yours.innerHTML = "";
    zones.nates.innerHTML = "";
    sum.hidden = true;
    sum.textContent = "";
    panel.hidden = true;
    closeLine.hidden = true;
    closeLine.textContent = "";
    conn.hidden = true;
    conn.innerHTML = "";
    sixthBtn.hidden = true;
    resetBtn.hidden = true;
    revealBtn.hidden = false;

    ITEMS.forEach(function (item, i) {
      placed.push(null);
      var card = document.createElement("article");
      card.className = "card";
      card.draggable = true;
      card.dataset.i = String(i);
      card.innerHTML =
        "<p>" + item.text + "</p>" +
        '<div class="btns">' +
          '<button type="button" data-to="yours" aria-pressed="false">Yours</button>' +
          '<button type="button" data-to="nates" aria-pressed="false">Nate&rsquo;s</button>' +
          '<button type="button" data-to="tray" hidden>Tray</button>' +
        "</div>" +
        '<div class="rev" hidden></div>';
      card.addEventListener("dragstart", function (e) {
        if (stage > 0) { e.preventDefault(); return; }
        card.classList.add("drag");
        e.dataTransfer.setData("text/plain", String(i));
        e.dataTransfer.effectAllowed = "move";
      });
      card.addEventListener("dragend", function () { card.classList.remove("drag"); });
      Array.prototype.forEach.call(card.querySelectorAll(".btns button"), function (b) {
        b.addEventListener("click", function () { place(i, b.dataset.to); });
      });
      tray.appendChild(card);
      cards.push(card);
    });

    updateCount();
  }

  function place(i, to) {
    if (stage > 0) { return; }
    placed[i] = to === "tray" ? null : to;
    zones[to].appendChild(cards[i]);
    var btns = cards[i].querySelectorAll(".btns button");
    Array.prototype.forEach.call(btns, function (b) {
      if (b.dataset.to === "tray") {
        b.hidden = placed[i] === null;
      } else {
        b.setAttribute("aria-pressed", placed[i] === b.dataset.to ? "true" : "false");
        b.innerHTML = (placed[i] === b.dataset.to ? svg(ICON.tick) : "") + (b.dataset.to === "yours" ? "Yours" : "Nate&rsquo;s");
      }
    });
    updateCount();
  }

  function updateCount() {
    var left = placed.filter(function (p) { return p === null; }).length;
    count.textContent = left + " left to place";
    var ready = left === 0;
    revealBtn.setAttribute("aria-disabled", ready ? "false" : "true");
    if (ready) {
      revealBtn.removeAttribute("title");
      revealBtn.removeAttribute("aria-describedby");
    } else {
      revealBtn.setAttribute("title", hint.textContent);
      revealBtn.setAttribute("aria-describedby", "hint");
    }
  }

  ["tray", "yours", "nates"].forEach(function (key) {
    var target = key === "tray" ? tray : colBoxes[key];
    target.addEventListener("dragover", function (e) {
      if (stage > 0) { return; }
      e.preventDefault();
      target.classList.add("over");
    });
    target.addEventListener("dragleave", function () { target.classList.remove("over"); });
    target.addEventListener("drop", function (e) {
      e.preventDefault();
      target.classList.remove("over");
      if (stage > 0) { return; }
      var i = parseInt(e.dataTransfer.getData("text/plain"), 10);
      if (!isNaN(i)) { place(i, key); }
    });
  });

  revealBtn.addEventListener("click", function () {
    if (stage > 0 || revealBtn.getAttribute("aria-disabled") === "true") { return; }
    stage = 1;

    cards.forEach(function (card, i) {
      card.draggable = false;
      card.querySelector(".btns").remove();
      var rev = card.querySelector(".rev");
      rev.hidden = false;

      if (i === SIXTH) {
        rev.innerHTML = '<span class="held">' + svg(ICON.held) + "Held back on purpose</span>";
        return;
      }
      var mine = placed[i];
      var right = mine === ITEMS[i].answer;
      if (!right) { zones[ITEMS[i].answer].appendChild(card); }
      rev.innerHTML =
        (right
          ? '<span class="mk">' + svg(ICON.ok) + "Correct</span>"
          : '<span class="mk fix">' + svg(ICON.alert) + "Moved to " + COLNAME[ITEMS[i].answer] + "</span>") +
        '<p class="why">' + ITEMS[i].why + "</p>" +
        (right ? "" : '<p class="mypick">You put it under ' + COLNAME[mine] + ".</p>");
    });

    /* The empty tray and its stale number go. What is left on screen is the
       reveal and the one step still to come. */
    tray.hidden = true;
    count.hidden = true;

    sum.hidden = false;
    sum.textContent = "One more step.";
    revealBtn.hidden = true;
    sixthBtn.hidden = false;
    sixthBtn.focus();
  });

  sixthBtn.addEventListener("click", function () {
    if (stage !== 1) { return; }
    stage = 2;

    var card = cards[SIXTH];
    var from = card.getBoundingClientRect();
    card.remove();

    // Item 6 carries no correctness marker at all. Suppressed here on purpose.
    var a = document.createElement("div");
    a.className = "half";
    a.innerHTML = "<p>Doing the renewal.</p>";
    var b = document.createElement("div");
    b.className = "half";
    b.innerHTML = "<p>Making sure it can never silently lapse.</p>";
    zones.nates.appendChild(a);
    zones.yours.appendChild(b);
    halves = { a: a, b: b };

    if (!reduced.matches) {
      [a, b].forEach(function (el) {
        var to = el.getBoundingClientRect();
        var dx = (from.left + from.width / 2) - (to.left + to.width / 2);
        var dy = (from.top + from.height / 2) - (to.top + to.height / 2);
        el.style.transform = "translate(" + dx + "px, " + dy + "px)";
        requestAnimationFrame(function () {
          el.classList.add("move");
          el.style.transform = "translate(0, 0)";
        });
      });
    }

    sum.hidden = true;
    sum.textContent = "";

    panel.hidden = false;
    panel.querySelector("p").textContent = "Both. Renewing the certificate is his. Building the process that guarantees the renewal happens, and leaves a record that it happened, is yours. The task and the system that makes the task reliable are two different jobs.";

    closeLine.hidden = false;
    closeLine.textContent = "His job fails loudly. Yours fails silently, years earlier.";

    sixthBtn.hidden = true;
    resetBtn.hidden = false;

    conn.hidden = false;
    setTimeout(drawConn, reduced.matches ? 0 : 460);
    panel.focus();
  });

  function drawConn() {
    if (!halves || stage !== 2) { return; }
    var wrap = cols.getBoundingClientRect();
    var ra = halves.a.getBoundingClientRect();
    var rb = halves.b.getBoundingClientRect();
    var x1, y1, x2, y2;
    if (rb.right <= ra.left + 1) {
      x1 = rb.right; y1 = rb.top + rb.height / 2; x2 = ra.left; y2 = ra.top + ra.height / 2;
    } else if (ra.right <= rb.left + 1) {
      x1 = ra.right; y1 = ra.top + ra.height / 2; x2 = rb.left; y2 = rb.top + rb.height / 2;
    } else if (rb.bottom <= ra.top + 1) {
      x1 = rb.left + rb.width / 2; y1 = rb.bottom; x2 = ra.left + ra.width / 2; y2 = ra.top;
    } else {
      x1 = ra.left + ra.width / 2; y1 = ra.bottom; x2 = rb.left + rb.width / 2; y2 = rb.top;
    }
    conn.setAttribute("width", String(Math.round(wrap.width)));
    conn.setAttribute("height", String(Math.round(wrap.height)));
    conn.setAttribute("viewBox", "0 0 " + Math.round(wrap.width) + " " + Math.round(wrap.height));
    var ax = x1 - wrap.left, ay = y1 - wrap.top, bx = x2 - wrap.left, by = y2 - wrap.top;
    conn.innerHTML =
      '<line x1="' + ax + '" y1="' + ay + '" x2="' + bx + '" y2="' + by + '" stroke="#001D69" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>' +
      '<circle cx="' + ax + '" cy="' + ay + '" r="3.5" fill="none" stroke="#001D69" stroke-width="2"/>' +
      '<circle cx="' + bx + '" cy="' + by + '" r="3.5" fill="none" stroke="#001D69" stroke-width="2"/>';
  }

  window.addEventListener("resize", drawConn);

  resetBtn.addEventListener("click", function () {
    build();
    revealBtn.focus();
  });

  panel.setAttribute("tabindex", "-1");
  build();
}());
</script>
</body>
</html>
