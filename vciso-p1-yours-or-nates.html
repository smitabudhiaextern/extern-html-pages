<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six tasks. Whose is it?</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#FDF8F8;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
color:#484646;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#w{position:absolute;top:0;left:0;width:960px;height:540px;overflow:hidden;transform-origin:top left}
.slide{position:absolute;top:0;left:0;width:960px;height:540px;
padding:24px 72px 20px;display:grid;grid-template-rows:20px 14px 402px 16px 44px;
background:#FDF8F8;text-align:left}
.slide[hidden]{display:none}
.t1{background:#F2DAE0}
.t2{background:#DAEAE2}
.t3{background:#F2E3D2}
.t4{background:#DEEBDA}
.t5{background:#F0E4EF}
.t6{background:#D0EEF1}
.t7{background:#EEDAD6}
.t8{background:#E6EADC}
.t9{background:#D1E2F1}
.hd{grid-row:1;display:flex;align-items:center;justify-content:space-between;
font-size:13px;line-height:20px;color:#484646}
.hd .rh{font-weight:500}
.hd .pos{font-variant-numeric:tabular-nums}
.bd{grid-row:3;height:402px}
.s1 .bd{display:grid;grid-template-columns:264px 512px;gap:0 40px;align-content:center}
.s2 .bd{display:grid;grid-template-columns:300px 476px;gap:0 40px;align-content:center}
.se .bd{display:flex;flex-direction:column;justify-content:flex-start;padding-top:24px}
.sf .bd{display:flex;flex-direction:column;justify-content:center}
.ab{grid-row:5;height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.abl,.abr{display:flex;align-items:center;gap:12px}
h1,h2{font-weight:600;color:#1C1B1B}
h1:focus,h2:focus,h1.fx,h2.fx{outline:3px solid #001D69;outline-offset:4px;border-radius:2px}
h1{font-size:30px;line-height:1.16;width:fit-content}
.s2 h1{font-size:28px;line-height:1.2}
.prompt{font-size:17px;line-height:1.5;color:#1C1B1B;margin-top:12px}
.sub{font-size:13px;line-height:1.5;color:#484646;margin-top:8px}
.cnt{font-size:13px;line-height:1.4;color:#484646}
#grp{display:flex;flex-direction:column;gap:4px}
.item{border:1px solid rgba(0,29,105,0.55);border-radius:8px;padding:5px 10px;
display:flex;align-items:flex-start;gap:8px}
.item .n{flex:0 0 auto;font-size:15px;font-weight:500;line-height:1.4;color:#001D69;
font-variant-numeric:tabular-nums;padding-top:3px}
.item .c{flex:1 1 auto;font-size:15px;font-weight:500;line-height:1.4;color:#1C1B1B;padding-top:3px}
.seg{flex:0 0 auto;display:flex;gap:6px}
.opt{font-family:inherit;font-size:15px;font-weight:500;line-height:1;height:26px;padding:0 9px;
display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(0,29,105,0.55);
border-radius:999px;background:transparent;color:#001D69;cursor:pointer}
.opt[aria-checked="true"]{background:#DCE1FF;border-color:#001D69;box-shadow:inset 0 0 0 1px #001D69}
.opt:focus-visible{outline:3px solid #001D69;outline-offset:2px}
.placed{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:13px;line-height:1.4;
color:#484646;padding-top:4px}
.ln{font-size:17px;line-height:1.5;color:#484646;margin-top:12px}
.note{background:#DCE1FF;border-left:4px solid #001D69;border-radius:0 10px 10px 0;
padding:14px 18px;margin-top:18px}
.note .nt{font-size:17px;line-height:1.4;color:#1C1B1B}
.note .n{color:#001D69;font-variant-numeric:tabular-nums}
.note .nc{font-size:13px;line-height:1.5;color:#484646;margin-top:6px}
.note .rs{margin-top:8px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rc{display:flex;align-items:flex-start;gap:10px;font-size:15px;font-weight:500;
line-height:1.4;color:#1C1B1B}
.rc .n{flex:0 0 auto;color:#001D69;font-variant-numeric:tabular-nums}
.rs{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:5px}
.ymark{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:400;
line-height:1.5;color:#484646}
.rrow.bad{border-left:3px solid #8A3324;padding-left:12px;margin-left:-15px}
.wrong{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500;
line-height:1.3;color:#8A3324}
.se h2,.sf h2{font-size:28px;line-height:1.2;display:flex;align-items:baseline;gap:12px;
width:fit-content;max-width:100%}
.se h2 .hn{flex:0 0 auto;color:#001D69;font-variant-numeric:tabular-nums}
.hslot{min-height:68px}
.rule{height:1px;background:rgba(0,29,105,0.18);margin:16px 0 18px}
.two{display:grid;grid-template-columns:1fr;gap:14px 0}
.rail{display:flex;flex-direction:column;align-items:flex-start;align-self:start}
.rail.key{border-left:3px solid #001D69;padding-left:15px;margin-left:-18px}
.split{border-left:3px solid #001D69;padding-left:15px;margin-left:-18px;
display:flex;flex-direction:column;gap:12px;margin-top:16px}
.srow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stx{font-size:17px;line-height:1.4;color:#1C1B1B}
.chip{display:inline-flex;align-items:flex-start;gap:8px;font-size:15px;font-weight:500;
line-height:1.3;color:#001D69;border:1px solid #001D69;border-radius:999px;padding:5px 14px 5px 11px}
.chip.key{background:#DCE1FF}
.chip.mute{color:#484646}
.chip .ci{flex:0 0 auto;line-height:0;padding-top:1px}
.exp{font-size:18px;line-height:1.5;color:#484646;margin-top:16px}
.end{font-size:17px;line-height:1.5;color:#484646;text-align:right}
.ic{display:block;width:18px;height:18px;fill:none;stroke:#001D69;stroke-width:1.8;
stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}
.ic.er{stroke:#8A3324}
.btn{font-family:inherit;font-size:15px;font-weight:500;line-height:1;height:40px;
padding:0 20px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
border:1px solid #001D69;background:#001D69;color:#FDF8F8}
.btn .ic{stroke:#FDF8F8}
.btn.sec{background:transparent;color:#001D69}
.btn.sec .ic{stroke:#001D69}
.btn:disabled{background:transparent;border-color:#484646;color:#484646;cursor:default}
.btn:disabled .ic{stroke:#484646}
.btn:focus-visible{outline:3px solid #001D69;outline-offset:2px}
#w.pm{width:540px;height:720px}
#w.pm .slide{width:540px;height:720px;padding:24px 32px 20px;
grid-template-rows:20px 14px 582px 16px 44px}
#w.pm .bd{height:582px}
#w.pm .s1 .bd,#w.pm .s2 .bd{grid-template-columns:1fr;gap:0;align-content:start}
#w.pm #grp{margin-top:16px}
#w.pm .rlist{margin-top:12px;gap:5px}
#w.pm .chip{padding:4px 12px 4px 10px}
#w.pm .rrow.bad{margin-left:0;padding-left:12px}
#w.pm .se .bd{padding-top:18px}
#w.pm h1,#w.pm .s2 h1{font-size:22px;line-height:1.2}
#w.pm .se h2,#w.pm .sf h2{font-size:22px;line-height:1.24;gap:10px}
#w.pm .hslot{min-height:56px}
#w.pm .prompt,#w.pm .ln,#w.pm .stx,#w.pm .note .nt{font-size:16px}
#w.pm .exp{font-size:16px}
#w.pm .end{font-size:13px}
#w.pm .rule{margin:14px 0 16px}
#w.pm .note{margin-top:12px;padding:10px 14px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="w">
<section class="slide s1 t1" id="sl1" role="group" aria-label="Slide 1 of 9">
<div class="hd"><span class="rh"></span><span class="pos">1 of 9</span></div>
<div class="bd">
<div>
<h1 id="h1" tabindex="-1">Six tasks. Whose is it?</h1>
<p class="prompt">Place all six. Guess where you are unsure.</p>
<p class="sub">Patch: an update from a manufacturer that closes a known weakness in its own
product. Certificate: the file that lets a website prove it is really itself.</p>
</div>
<div id="grp"></div>
</div>
<div class="ab">
<div class="abl"><p class="cnt" id="cnt" aria-live="polite">6 left to place</p></div>
<div class="abr" id="bw" title="Place all six cards first">
<button class="btn" type="button" id="go1" disabled>Reveal</button></div>
</div>
</section>
</div>
<script>
(function(){
var ITEM=[
"Decide whether the billing platform can go a weekend without a patch.",
"Restore a file someone deleted by accident.",
"Decide whether the clearinghouse should be able to reach the claims database.",
"Reset an account that has locked itself out.",
"Work out what it would cost the business if the archive were encrypted by an attacker.",
"Renew a certificate before it expires."];
var LBL=["Yours","Nate&rsquo;s"];
var OWN=[0,1,0,1,0,-1];
var EXP=[
"A patch is an update from a manufacturer that closes a known weakness in its own product. Installing one takes the platform down for a while, so somebody has to weigh a weekend of stopped billing against a weekend with that weakness left open. That is a risk decision with a business consequence attached, and somebody has to own the answer if the weekend goes badly.",
"Operations. Something broke and needs to work again. The file has to come back today, and bringing it back is a task with a clear end, not a question about what the business can accept. Nobody needs a judgment call here, so this one is not yours.",
"The clearinghouse is an outside party. Deciding how far into the claims database it should reach is a risk decision about what the business can accept from an outsider, and the answer has to survive being asked about later. Nobody types anything into a system to settle it.",
"Operations again. A request, actioned. Somebody cannot get in and needs to be let in so the company can work today. Nothing here asks what the company can live with, so it belongs with the person keeping the systems running.",
"Encrypted by an attacker means locked so that Cumberland cannot open its own records. Working out what that would cost the business is a risk judgment, not a task. Nobody can rank a risk without a view on what it would cost, and reaching that view is yours to defend."];
var SUM="Five tasks, two columns. One left.";
var HOLDNOTE="Held back on purpose. Nothing has broken.";
var CERT="When a certificate expires, browsers stop trusting the site and it goes dark.";
var SPLIT=[[1,"Doing the renewal."],[0,"Making sure it can never silently lapse."]];
var SIXEXP="Both. Renewing the certificate is his. Building the process that guarantees the renewal happens, and leaves a record that it happened, is yours. The task and the system that makes the task reliable are two different jobs.";
var CLOSE="His job fails loudly. Yours fails silently, years earlier.";
var TINT=["#F2DAE0","#DAEAE2","#F2E3D2","#DEEBDA","#F0E4EF","#D0EEF1","#EEDAD6","#E6EADC","#D1E2F1"];
var RUNHEAD="Six tasks. Whose is it?";
var N=9;
var P={
off:'<circle cx="12" cy="12" r="8.2"/>',
on:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.6" fill="#001D69" stroke="none"/>',
ok:'<circle cx="12" cy="12" r="9"/><polyline points="7.7 12.3 10.6 15.2 16.3 8.8"/>',
key:'<circle cx="12" cy="12" r="9"/><line x1="12" y1="7" x2="12" y2="12.6"/><line x1="12" y1="16.3" x2="12" y2="16.4"/>',
hold:'<circle cx="12" cy="12" r="9"/><line x1="8" y1="12" x2="8" y2="12.1"/><line x1="12" y1="12" x2="12" y2="12.1"/><line x1="16" y1="12" x2="16" y2="12.1"/>',
mark:'<line x1="4" y1="12" x2="18.5" y2="12"/><polyline points="13 6.5 18.5 12 13 17.5"/>',
warn:'<path d="M12 4.4 21.5 19.6H2.5Z"/><line x1="12" y1="9.7" x2="12" y2="14.7"/><line x1="12" y1="17.4" x2="12" y2="17.5"/>',
back:'<line x1="20" y1="12" x2="5.5" y2="12"/><polyline points="11 6.5 5.5 12 11 17.5"/>',
next:'<line x1="4" y1="12" x2="18.5" y2="12"/><polyline points="13 6.5 18.5 12 13 17.5"/>'};
function ic(d,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+d+'</svg>';}
function hdr(n){return '<div class="hd"><span class="rh">'+(n>1?RUNHEAD:'')+'</span><span class="pos">'+n+' of '+N+'</span></div>';}

var w=document.getElementById('w');
var grp=document.getElementById('grp');
var go1=document.getElementById('go1');
var bw=document.getElementById('bw');
var cnt=document.getElementById('cnt');
var slides=[document.getElementById('sl1')];
var heads=[document.getElementById('h1')];
var rows=[],pick=[null,null,null,null,null,null],revealed=false,cur=0;

function armHead(h){if(!h){return;}h.addEventListener('blur',function(){h.classList.remove('fx');});}

for(var i=0;i<6;i++){(function(i){
  var r=document.createElement('div');
  r.className='item';
  r.innerHTML='<span class="n">'+(i+1)+'</span><p class="c" id="c'+i+'">'+ITEM[i]+'</p>'+
    '<div class="seg" role="radiogroup" aria-labelledby="c'+i+'">'+
    '<button class="opt" type="button" role="radio" aria-checked="false" tabindex="0" data-v="0">'+
    ic(P.off,'sm')+LBL[0]+'</button>'+
    '<button class="opt" type="button" role="radio" aria-checked="false" tabindex="-1" data-v="1">'+
    ic(P.off,'sm')+LBL[1]+'</button></div>';
  grp.appendChild(r);
  rows.push(r);
  var opts=r.querySelectorAll('.opt');
  for(var v=0;v<2;v++){(function(v){
    opts[v].addEventListener('click',function(){place(i,v);});
    opts[v].addEventListener('keydown',function(e){keyOpt(e,i,v);});
  })(v);}
})(i);}

function place(i,v){
  if(revealed){return;}
  pick[i]=v;
  var opts=rows[i].querySelectorAll('.opt');
  for(var q=0;q<2;q++){
    var on=q===v;
    opts[q].setAttribute('aria-checked',on?'true':'false');
    opts[q].setAttribute('tabindex',on?'0':'-1');
    opts[q].innerHTML=ic(on?P.on:P.off,'sm')+LBL[q];
  }
  count();
}
function keyOpt(e,i,v){
  if(revealed){return;}
  var k=e.key,nx=null;
  if(k==='ArrowRight'||k==='ArrowDown'){nx=(v+1)%2;}
  if(k==='ArrowLeft'||k==='ArrowUp'){nx=(v+1)%2;}
  if(k==='Home'){nx=0;}
  if(k==='End'){nx=1;}
  if(nx!==null){
    e.preventDefault();e.stopPropagation();
    place(i,nx);
    rows[i].querySelectorAll('.opt')[nx].focus();
  }
}
function count(){
  var left=0;
  for(var q=0;q<6;q++){if(pick[q]===null){left++;}}
  if(left===0){
    cnt.textContent='All six placed.';
    go1.disabled=false;
    bw.removeAttribute('title');
  }else{
    cnt.textContent=left+' left to place';
  }
}
function lock(){
  for(var i=0;i<6;i++){
    var seg=rows[i].querySelector('.seg');
    if(seg){seg.parentNode.removeChild(seg);}
    var p=document.createElement('p');
    p.className='placed';
    p.innerHTML=ic(P.mark,'sm')+'Your placement: '+LBL[pick[i]];
    rows[i].appendChild(p);
  }
}

function mk(n,bodyHtml,extraCls,leftBtn,rightBtn){
  var s=document.createElement('section');
  s.className='slide '+extraCls+' t'+n;
  s.setAttribute('role','group');
  s.setAttribute('aria-label','Slide '+n+' of '+N);
  s.hidden=true;
  s.innerHTML=hdr(n)+'<div class="bd">'+bodyHtml+'</div>'+
    '<div class="ab"><div class="abl">'+leftBtn+'</div><div class="abr">'+rightBtn+'</div></div>';
  w.appendChild(s);
  slides.push(s);
  var h=s.querySelector('h1,h2');
  heads.push(h);
  armHead(h);
  return s;
}
function backBtn(){return '<button class="btn sec" type="button" data-nav="-1">'+ic(P.back)+'Back</button>';}
function nextBtn(label){return '<button class="btn" type="button" data-nav="1">'+label+ic(P.next)+'</button>';}

function fiveList(){
  var h='<div class="rlist">';
  for(var i=0;i<5;i++){
    var right=pick[i]===OWN[i];
    var mark=right
      ?'<span class="ymark">'+ic(P.mark,'sm')+'Your placement: '+LBL[OWN[i]]+'. Correct.</span>'
      :'<span class="wrong">'+ic(P.warn,'er')+'You placed this in '+LBL[pick[i]]+'. It is '+
       (OWN[i]===0?'yours.':'Nate&rsquo;s.')+'</span>';
    h+='<div class="rrow'+(right?'':' bad')+'"><p class="rc"><span class="n">'+(i+1)+'</span><span class="c">'+ITEM[i]+'</span></p>'+
      '<p class="rs"><span class="chip"><span class="ci">'+ic(P.ok)+'</span>'+LBL[OWN[i]]+'</span>'+
      mark+'</p></div>';
  }
  return h+'</div>';
}
function heldNote(){
  return '<div class="note"><p class="nt"><span class="n">6</span> '+ITEM[5]+'</p>'+
    '<p class="rs"><span class="chip mute"><span class="ci">'+ic(P.hold)+'</span>Held back</span></p>'+
    '<p class="nc">'+HOLDNOTE+'</p></div>';
}
function build(){
  mk(2,
    '<div><h1 tabindex="-1" role="status" aria-live="polite">Five Settled, One Held Back</h1>'+
    '<p class="ln">'+SUM+'</p>'+heldNote()+'</div>'+fiveList(),
    's2',backBtn(),nextBtn('Why each one'));
  for(var i=0;i<5;i++){
    var n=i+3;
    mk(n,
      '<div class="hslot"><h2 tabindex="-1"><span class="hn">'+(i+1)+'</span><span>'+ITEM[i]+'</span></h2></div>'+
      '<div class="rule"></div>'+
      '<div class="two"><div class="rail"><span class="chip"><span class="ci">'+ic(P.ok)+'</span>'+
      LBL[OWN[i]]+'</span></div><p class="exp">'+EXP[i]+'</p></div>',
      'se',backBtn(),nextBtn(n===7?'Show the sixth':'Next'));
  }
  var sp='';
  for(var k=0;k<2;k++){
    sp+='<div class="srow"><span class="chip key"><span class="ci">'+ic(P.key)+'</span>'+
      LBL[SPLIT[k][0]]+'</span><span class="stx">'+SPLIT[k][1]+'</span></div>';
  }
  mk(8,
    '<div class="hslot"><h2 tabindex="-1"><span class="hn">6</span><span>'+ITEM[5]+'</span></h2></div>'+
    '<div class="rule"></div>'+
    '<p class="ln" style="margin-top:0">'+CERT+'</p>'+
    '<div class="split">'+sp+'</div>'+
    '<p class="exp">'+SIXEXP+'</p>',
    'se',backBtn(),nextBtn('Next'));
  mk(9,'<h2 tabindex="-1">'+CLOSE+'</h2>','sf',backBtn(),
    '<p class="end">That is the end of this activity. Go back to the module to keep reading.</p>');
  w.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('[data-nav]'):null;
    if(b&&!b.disabled){nav(parseInt(b.getAttribute('data-nav'),10));}
  });
}

function show(i){
  slides[cur].hidden=true;
  cur=i;
  slides[cur].hidden=false;
  document.body.style.background=TINT[cur];
  for(var q=0;q<heads.length;q++){if(heads[q]){heads[q].classList.remove('fx');}}
  if(heads[cur]){heads[cur].classList.add('fx');heads[cur].focus();}
}
function nav(d){
  if(!revealed){return;}
  var t=cur+d;
  if(t<0||t>slides.length-1){return;}
  show(t);
}

go1.addEventListener('click',function(){
  if(revealed){nav(1);return;}
  for(var q=0;q<6;q++){if(pick[q]===null){return;}}
  revealed=true;
  lock();
  build();
  go1.innerHTML='Next'+ic(P.next);
  show(1);
});

document.addEventListener('keydown',function(e){
  if(!revealed){return;}
  if(e.key==='ArrowRight'){e.preventDefault();nav(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();nav(-1);}
});

function fit(){
  var pm=window.innerWidth<600;
  if(pm){w.classList.add('pm');}else{w.classList.remove('pm');}
  var cw=pm?540:960,ch=pm?720:540;
  var s=Math.min(window.innerWidth/cw,window.innerHeight/ch,1);
  w.style.transform='scale('+s+')';
  w.style.left=Math.max(0,(window.innerWidth-cw*s)/2)+'px';
  w.style.top=Math.max(0,(window.innerHeight-ch*s)/2)+'px';
}
window.addEventListener('resize',fit);
window.addEventListener('load',fit);
armHead(heads[0]);
document.body.style.background=TINT[0];
count();
fit();
}());
</script>
</body>
</html>
