<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt builder: your money-model shortlist</title>
<!--
     WHAT THIS IS. Substep 2.2.2, step 3. The student has already written
     their shortlist in 2.2.1 step 4: two or three models, each with four
     parts. They paste those answers here,
     one to a screen, the build wraps them in a complete prompt, and one
     button puts the whole thing on the clipboard. They paste it into
     Claude and Claude builds their HTML.

     WHAT THIS IS NOT. It does not build, preview or render the student
     page. The copy button is the whole reason this build exists: an
     earlier interactive in this program was deleted for making the
     student type their findings twice.

     PALETTE. This is a program interactive, so the style guide section 7
     table governs with no exceptions. Five values, no sixth:
       #DCE1FF highlight container, #001D69 on highlight,
       #FDF8F8 background, #484646 body, #1C1B1B titles.
     The teal and coral of khan-academy-p2-sample-shortlist.html is
     approved for that sample only and none of it appears here.

     THE ASSEMBLED PROMPT deliberately tells Claude to use only what the
     student gave it and to add no facts, figures or links. That line is
     load bearing: without it Claude invents sources, which is the exact
     failure this program spends four modules teaching students to catch.

     THE REJECTED-MODEL SCREEN WAS REMOVED on owner instruction, 7 September
     2026 ("remove slide 4 that is not needed"). Three screens now: two
     required models and an optional third. The LEFT OFF block is gone from
     the assembled prompt and from the fallback. The student still writes the
     rejected model down in 2.2.1; it just does not go onto the HTML.

     DESIGN GUIDELINES were added to the prompt on owner instruction the same
     day. They are deliberately written as plain outcomes, two colours, near
     white ground, one 800px column, rounded sans, small-caps labels, phone
     legible, rather than as CSS, so Claude has room and the student can read
     what they are asking for. They do NOT name the house five values, because
     the student's page is their own artifact and not a program interactive.
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;
    --ink-14:rgba(0,29,105,.14);
    --ink-24:rgba(0,29,105,.24);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--body);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:10px;
  }
  .stage{
    width:100%;max-width:960px;aspect-ratio:16/9;
    display:flex;flex-direction:column;
    padding:clamp(12px,1.55vw,18px);
  }

  .top{display:flex;align-items:center;gap:clamp(8px,1vw,12px);margin-bottom:clamp(7px,.9vw,10px)}
  .dots{display:flex;gap:clamp(4px,.5vw,6px)}
  .dot{
    width:clamp(7px,.85vw,9px);height:clamp(7px,.85vw,9px);border-radius:50%;
    border:1.5px solid var(--on-highlight);background:transparent;
  }
  .dot.done{background:var(--on-highlight)}
  .pos{font-size:clamp(8.5px,1.05vw,10.5px);font-weight:700;letter-spacing:.06em;
       text-transform:uppercase;color:var(--on-highlight);margin-left:auto}

  .body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  h1{
    font-size:clamp(15px,2.35vw,23px);line-height:1.15;font-weight:700;
    color:var(--title);letter-spacing:-.02em;
  }
  .help{
    font-size:clamp(9px,1.28vw,12.5px);line-height:1.4;
    margin-top:clamp(3px,.38vw,5px);margin-bottom:clamp(6px,.8vw,9px);
  }
  .help b{color:var(--on-highlight)}

  textarea{
    flex:1 1 auto;min-height:0;width:100%;resize:none;
    font:inherit;font-size:clamp(9.5px,1.28vw,12.5px);line-height:1.45;color:var(--title);
    background:var(--bg);border:1.5px solid var(--ink-24);
    border-radius:clamp(5px,.62vw,7px);padding:clamp(7px,.9vw,11px);
  }
  textarea:focus{outline:none;border-color:var(--on-highlight)}
  textarea::placeholder{color:var(--body);opacity:.6}

  /* final screen */
  .out{
    flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,.65vw,8px);
  }
  pre{
    flex:1 1 auto;min-height:0;overflow:auto;
    background:var(--highlight);border-radius:clamp(5px,.62vw,7px);
    padding:clamp(7px,.9vw,11px);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:clamp(7.5px,1.02vw,10px);line-height:1.45;color:var(--title);
    white-space:pre-wrap;word-break:break-word;
  }

  .nav{display:flex;align-items:center;gap:clamp(5px,.7vw,8px);margin-top:clamp(7px,.9vw,10px)}
  button{
    font:inherit;font-size:clamp(9px,1.18vw,11.5px);font-weight:700;
    border-radius:999px;padding:clamp(5px,.65vw,8px) clamp(11px,1.4vw,17px);
    border:1.5px solid var(--on-highlight);cursor:pointer;
    background:transparent;color:var(--on-highlight);
  }
  button.primary{background:var(--on-highlight);color:var(--bg)}
  button:disabled{opacity:.35;cursor:default}
  button:focus-visible{outline:2px solid var(--on-highlight);outline-offset:2px}
  .hint{font-size:clamp(8px,1.05vw,10.5px);line-height:1.35;margin-left:auto;text-align:right;max-width:52%}
  .hint b{color:var(--on-highlight)}
</style>
</head>
<body>

<div class="stage">
  <div class="top">
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="pos" id="pos"></div>
  </div>

  <div class="body" id="screen"></div>

  <div class="nav">
    <button type="button" id="back">Back</button>
    <button type="button" class="primary" id="next">Next</button>
    <div class="hint" id="hint"></div>
  </div>
</div>

<noscript>
  <div style="max-width:840px;margin:0 auto;padding:18px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#484646;line-height:1.55">
    <h1 style="color:#1C1B1B;font-size:22px">Prompt builder: your money-model shortlist</h1>
    <p>This tool normally assembles your prompt for you. Without JavaScript, copy the prompt below by hand and fill in the parts in capitals with the answers you wrote in the last task.</p>
    <pre style="white-space:pre-wrap;background:#DCE1FF;padding:14px;border-radius:8px;font-size:12.5px">Build me a single web page. It is my money-model shortlist for Khan Academy, a nonprofit whose content library and learning platform are free and always will be.

Here are my models. Each one has four parts: the model, the real deal it is based on, what Khan Academy would get, and what could go wrong.

MODEL 1
PASTE YOUR FIRST ANSWER HERE

MODEL 2
PASTE YOUR SECOND ANSWER HERE

MODEL 3
PASTE YOUR THIRD ANSWER HERE, OR DELETE THESE TWO LINES

Build it like this.

One page that scrolls. Not slides.
A short section at the top saying what Khan Academy is and that its content library and learning platform stay free.
Then one section for each model. Use the model as the heading, then show the four parts as four separate labelled blocks, in the order above.
Make the facts that came from a real deal look different from my own opinions, and label my opinions as my own read.
Use only what I gave you. Do not add any fact, figure, company or link that is not in my answers.
Plain language. Someone aged thirteen should follow every sentence. No em dashes anywhere.

How it should look.

Pick two colours and use them the whole way through: one dark colour for headings and panels, one bright colour for accents and numbers. Nothing else.
A near-white background, not pure white. Dark text, never grey on grey.
One column, about 800 pixels wide, centred, with generous space around it.
A rounded sans-serif font. Big bold headings, and any number I gave you set large and in the accent colour.
Round the corners on every panel and give each one room to breathe.
Put a thin dividing line between one model and the next.
Label the four parts of each model in small capitals above the text.
It must read properly on a phone as well as a laptop.</pre>
  </div>
</noscript>

<script>
"use strict";

var FIELDS = [
  { key:"m1", required:true,
    title:"Your first model",
    help:"Paste what you wrote in the last task. All four parts: the model, the real deal it is based on, what Khan Academy would get, and what could go wrong.",
    ph:"Companies that need Khan Academy's content in bulk pay for reliable access, and learners still get everything free. Based on Wikimedia Enterprise..." },
  { key:"m2", required:true,
    title:"Your second model",
    help:"Same four parts again.",
    ph:"A company funds a whole course and its name goes on it. Based on Walmart and the Financial Literacy course, July 2023..." },
  { key:"m3", required:false,
    title:"Your third model",
    help:"Only if you picked three. <b>Leave this blank if you picked two.</b>",
    ph:"" }
];

var answers = { m1:"", m2:"", m3:"" };
var i = 0;                      // 0..FIELDS.length is the final screen
var LAST = FIELDS.length;

var elScreen = document.getElementById("screen");
var elDots   = document.getElementById("dots");
var elPos    = document.getElementById("pos");
var elBack   = document.getElementById("back");
var elNext   = document.getElementById("next");
var elHint   = document.getElementById("hint");

function buildPrompt(){
  var p = [];
  p.push("Build me a single web page. It is my money-model shortlist for Khan Academy, a nonprofit whose content library and learning platform are free and always will be.");
  p.push("");
  p.push("Here are my models. Each one has four parts: the model, the real deal it is based on, what Khan Academy would get, and what could go wrong.");
  p.push("");
  p.push("MODEL 1");
  p.push(answers.m1.trim());
  p.push("");
  p.push("MODEL 2");
  p.push(answers.m2.trim());
  if (answers.m3.trim()){
    p.push("");
    p.push("MODEL 3");
    p.push(answers.m3.trim());
  }
  p.push("");
  p.push("Build it like this.");
  p.push("");
  p.push("One page that scrolls. Not slides.");
  p.push("A short section at the top saying what Khan Academy is and that its content library and learning platform stay free.");
  p.push("Then one section for each model. Use the model as the heading, then show the four parts as four separate labelled blocks, in the order above.");
  p.push("Make the facts that came from a real deal look different from my own opinions, and label my opinions as my own read.");
  p.push("Use only what I gave you. Do not add any fact, figure, company or link that is not in my answers.");
  p.push("Plain language. Someone aged thirteen should follow every sentence. No em dashes anywhere.");
  p.push("");
  p.push("How it should look.");
  p.push("");
  p.push("Pick two colours and use them the whole way through: one dark colour for headings and panels, one bright colour for accents and numbers. Nothing else.");
  p.push("A near-white background, not pure white. Dark text, never grey on grey.");
  p.push("One column, about 800 pixels wide, centred, with generous space around it.");
  p.push("A rounded sans-serif font. Big bold headings, and any number I gave you set large and in the accent colour.");
  p.push("Round the corners on every panel and give each one room to breathe.");
  p.push("Put a thin dividing line between one model and the next.");
  p.push("Label the four parts of each model in small capitals above the text.");
  p.push("It must read properly on a phone as well as a laptop.");
  return p.join("\n");
}

function drawDots(){
  elDots.innerHTML = "";
  for (var d = 0; d <= LAST; d++){
    var s = document.createElement("span");
    s.className = "dot" + (d <= i ? " done" : "");
    elDots.appendChild(s);
  }
  elPos.textContent = (i < LAST) ? ("Question " + (i+1) + " of " + LAST) : "Your prompt";
}

function render(){
  drawDots();
  elScreen.innerHTML = "";

  if (i < LAST){
    var f = FIELDS[i];
    var h = document.createElement("h1"); h.textContent = f.title;
    var p = document.createElement("p");  p.className = "help"; p.innerHTML = f.help;
    var t = document.createElement("textarea");
    t.value = answers[f.key];
    t.placeholder = f.ph;
    t.setAttribute("aria-label", f.title);
    t.addEventListener("input", function(){
      answers[f.key] = t.value;
      elNext.disabled = f.required && !t.value.trim();
    });
    elScreen.appendChild(h); elScreen.appendChild(p); elScreen.appendChild(t);

    elNext.textContent = (i === LAST-1) ? "Build my prompt" : "Next";
    elNext.disabled = f.required && !answers[f.key].trim();
    elHint.innerHTML = f.required
      ? "This one is needed before you can go on."
      : "You can leave this blank and carry on.";
    t.focus();
  } else {
    var h2 = document.createElement("h1"); h2.textContent = "Copy this into Claude";
    var p2 = document.createElement("p"); p2.className = "help";
    p2.innerHTML = "Everything you wrote is in here, wrapped in instructions telling Claude how to lay the page out. <b>Do not edit it. Just copy it.</b>";
    var wrap = document.createElement("div"); wrap.className = "out";
    var pre = document.createElement("pre"); pre.id = "pre"; pre.textContent = buildPrompt();
    wrap.appendChild(pre);
    elScreen.appendChild(h2); elScreen.appendChild(p2); elScreen.appendChild(wrap);

    elNext.textContent = "Copy the whole prompt";
    elNext.disabled = false;
    elHint.innerHTML = "Then paste it into <b>claude.ai</b> and press send.";
  }

  elBack.disabled = (i === 0);
}

elBack.addEventListener("click", function(){ if (i > 0){ i--; render(); } });

elNext.addEventListener("click", function(){
  if (i < LAST){ i++; render(); return; }
  var text = buildPrompt();
  function done(ok){
    elHint.innerHTML = ok
      ? "<b>Copied.</b> Paste it into claude.ai and press send."
      : "Could not copy for you. Select the text above and copy it yourself.";
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(false); });
  } else {
    try {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      done(document.execCommand("copy")); document.body.removeChild(ta);
    } catch(e){ done(false); }
  }
});

document.addEventListener("keydown", function(e){
  if (e.target && e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowRight" && !elNext.disabled && i < LAST){ i++; render(); }
  if (e.key === "ArrowLeft"  && i > 0){ i--; render(); }
});

render();
</script>
</body>
</html>
