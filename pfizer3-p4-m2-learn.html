<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading a Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Card player, rail, "Click me" pulse, switches, tiles, pictures with
   boxes drawn over them and the spacing code: copied from pfizer3-p3-m9-learn.html (P3 module 9, the model Smita approved).
   P4 module 2 Learn cards: "Learn How to Read a Scanned PDF with Tesseract" (merges Chaitanya's 3 pages: Preprocess,
   Extract Text, Highlight Key Terms). Ideas only, NO code: all code is in the Try deck (pfizer3-p4-m2-steps.html).
   4 cards, placed as in project-04/step1-coverage-p4.md (Learn card rows A6, A11, A13, A14, A16, A17, A42, A43, B4, C4 to C6):
   1 See What Tesseract Finds on a Scan: switch "The scan" / "What Tesseract finds" on Page 4 (his A6, A11, A13, then
     his A14 and his whole A16 list, items 1 to 3, in his page's order; F1 fix, 19 Nov 2026: A16 had been left out).
   2 Clean the Picture So the Letters Stand Out: his A17 (preprocessing, restored in full by F1, 19 Nov 2026), A42, then
     his 4 light-bulb labels and lines (A43) as tiles over the real picture at each stage, with one-line definitions of
     ours. The tiles carry names only, no step numbers (the notebook calls these STEP 6 to STEP 9; F1, 19 Nov 2026).
     His Step 5 "Why" bullets stay in the Try (say everything once).
     A17 changes (SWAPS FOR SMITA): "across this module and the next two" to "across this reading"; "In this module,
     we'll focus" to "First, we'll focus"; "in the upcoming modules" to "in the upcoming steps"; em dash to a comma.
   3 Read the Text, Then Find Each Word's Box: his B4; switch "The text" (click a line, compare with what Tesseract read)
     / "The boxes" (10 word chips light their box, left, top, width, height and confidence).
   4 Box Only the Key Fields, Then Save Them as JSON: his C4, C5, C6 ("In this module" becomes "Next" / "In this
     reading"); the 5 JSON entries as rows that light their box on the cleaned page.
   Not here, because the Overview video already says it (p4-overview-video-script.md rows 3 to 5): a scan is a picture,
   get_text() finds 0 words, what OCR is. Ours: titles, eyebrows, one bold why line per card, hints, short definitions.
   SME text kept word for word, except: em dashes replaced (no em dashes rule); "developed by Google" fixed to "first
   built at HP and later developed by Google" (fact fix, Ask Chaitanya to review); "In this module" to "Next" / "In this
   reading" (3 pages merged into one).
   Real data. Page 4 = pharmaceutical-sdf-page4-certificate-processing.pdf (Drive 1UvYmChia7K90-xjCsHsGqhixmDrPfhHw).
   The deck matches the STUDENT COPY of his notebook made by agent A1 (Drive 1n2-iMesweW8Y1olLFlqcmNtJOMhhIL3d): his cells
   with import pymupdf and get_pixmap(dpi=300) instead of get_pixmap() (the dpi change waits for Smita's OK).
   Card 1 "The scan" picture: PyMuPDF render of Page 4 at 144 dpi (for the screen). Card 2 and card 3 "The text" pictures
   (-300.png): local run, 19 November 2026, PyMuPDF 1.26.5 + OpenCV 4.10, the copy's exact cells (get_pixmap(dpi=300),
   COLOR_RGB2GRAY, adaptiveThreshold MEAN_C 11 2, bilateralFilter 9 75 75, resize 200% INTER_CUBIC: 2550 x 3300, then
   5100 x 6600, as the Colab run printed). Script: project-04/images/m2-learn-crops-300-source.py. (At 72 dpi the same
   local script, m2-learn-crops-source.py, matches the pictures saved in his notebook pixel for pixel.)
   Card 1 "What Tesseract finds" picture (pfizer3-p4-m2-l1-boxes.png): his notebook's own saved Step 13 output (his Colab
   run, 72 dpi, Tesseract 4.1.1). TODO-A6: replace it with the Step 13 output of the student-copy run (300 dpi).
   Cards 3 and 4 text, boxes and confidence: agent A1's Colab run of the student copy, 19 November 2026 (Python 3.13,
   PyMuPDF 2.1, Tesseract 5.3.4, pytesseract 0.3.13, OpenCV 5.0, 300 dpi): card 3 lines = Step 10 output; card 3 boxes =
   Step 12 printout (first 10 words, 290 words in all); card 4 = Step 15 JSON (5 entries; Step 14 printed "Found 10 key
   pharmaceutical terms"). The boxes are drawn here as SVG over the real cleaned picture (-l4-top-300.png, -l5-page-300.png).
   If Smita keeps 72 dpi: the 72 dpi Colab values (his unchanged cells, A1's "SCRATCH dpi test" run) were Step 10 lines
   "Gamma Process Run ID %29708B", "Cytva {25.40 kGy) 17242816 a.", "Cytve (25-40 kGy) 17289079 1 ¢s", 289 words, Z=STERIS
   (880, 26, 242, 40) 84, JSON CERTIFICATE [50,26,166,26], PROCESSING [68,1272,90,16], LOT [604,158,31,28], STERIS
   [68,1294,62,14]; swap LINES, WORDS, KEYS and the pictures back (TODO-A6).
   Fixed stage: 760 x 840 at every width (Notion embed height 783 px), scaled as one piece to fit the frame and centred.
   Nothing scrolls. Spare height first widens the gaps between blocks (up to 2x), then enlarges the card's main picture. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --space-2:8px; --space-3:14px; --space-4:18px; --space-5:26px;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage-w:760px; --stage-h:840px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
[hidden]{display:none !important}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}
.pg-label{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-muted);white-space:nowrap}
.pg-label::after{content:attr(data-text);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:600}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:20px 28px;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.inner{display:flex;flex-direction:column;gap:12px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:2px}
.hl{color:var(--highlight)}
.why{margin:-6px 0 0;font-size:17px;line-height:1.45;font-weight:600;color:var(--ink)}
.p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty}
.p b{font-weight:600;color:var(--ink)}
.hint{margin:0;font-size:14px;line-height:1.4;font-weight:600;color:var(--step-label)}
.row{display:flex;align-items:center;gap:var(--space-4)}
.cols{display:flex;gap:22px;align-items:flex-start}
.cols > .side{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:12px}
code.c{font-family:var(--font-mono);font-size:.9em;background:var(--surface-card);color:var(--ink);padding:1px 5px;border-radius:5px;white-space:nowrap}

/* Switch */
.sw{display:inline-flex;flex:none;border:1.5px solid var(--ink);border-radius:var(--radius-xs);overflow:hidden}
.sw button{border:0;background:var(--surface);color:var(--ink);padding:9px 15px;cursor:pointer;font-size:14.5px;line-height:1.2;font-weight:600;white-space:nowrap}
.sw button + button{border-left:1.5px solid var(--ink)}
.sw button[aria-pressed="true"]{background:var(--action);color:var(--on-action)}

/* Click-me nudge: a soft pulsing outline and a small tag, both gone after the first click */
.nwrap{position:relative;display:inline-flex;flex:none}
.nudge{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(0,51,160,.55)}50%{box-shadow:0 0 0 7px rgba(0,51,160,.12)}}
.tap.inline{position:static;transform:none;display:inline-block;margin-left:10px;vertical-align:1px}
.tap{position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--surface-card);color:var(--pfizer-blue);border:1px solid var(--blue-200);border-radius:999px;padding:4px 11px;font-size:13px;line-height:1.2;font-weight:600;pointer-events:none;animation:tapx 1.6s ease-in-out infinite}
@keyframes tapx{0%,100%{margin-left:0}50%{margin-left:4px}}
@media (prefers-reduced-motion:reduce){ .nudge{animation:none;box-shadow:0 0 0 3px rgba(0,51,160,.5)} .tap{animation:none} }

/* Pictures with boxes drawn over them (an SVG in the picture's own units) */
.pic{position:relative;margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);line-height:0;flex:none}
.pic img{display:block;width:100%;height:auto;transition:opacity .45s ease}
.pic.px img{image-rendering:pixelated}
.pic img.over{position:absolute;left:0;top:0;opacity:0}
.pic.plain img.over{opacity:1}
.pic.plain img.base{opacity:0}
.pic svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pic rect{fill:none;stroke-width:2.5px;vector-effect:non-scaling-stroke}
.pic rect.g{stroke:var(--highlight);fill:var(--highlight);fill-opacity:.16}
.pic rect.gl{stroke:var(--highlight);fill:none;stroke-width:1.5px}
.pic rect.b{stroke:var(--pfizer-blue);fill:var(--pfizer-blue);fill-opacity:.10}
.pic rect.bl{stroke:var(--blue-200);fill:none;stroke-width:1.5px}
.pic rect.pop{animation:pop .3s ease both}
@keyframes pop{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){ .pic rect.pop{animation:none} }
.pic text{font-family:var(--font-text);font-weight:700;fill:var(--pfizer-blue)}
.pic text.g{fill:var(--highlight)}
.pic circle{fill:var(--pfizer-blue);stroke:var(--surface);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.cap{margin:6px 0 0;font-size:12.5px;line-height:1.3;font-weight:600;color:var(--gray-600);text-align:center}
.res{margin:0;font-size:16px;line-height:1.5;color:var(--ink-muted);text-wrap:pretty}
.res b{font-weight:700;color:var(--ink)}

.whyl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.whyl li{font-size:16px;line-height:1.5;color:var(--ink-muted);text-wrap:pretty}
.whyl li b{font-weight:600;color:var(--ink)}
.whyh{margin:0;font-size:15px;line-height:1.4;font-weight:600;color:var(--ink)}

/* Tiles (card 2) and chips (card 4) */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;border-radius:var(--radius-xs)}
.tile{display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--radius-xs);padding:7px 10px;cursor:pointer;min-height:50px}
.tile .n{font-size:12px;line-height:1.2;font-weight:600;color:var(--step-label)}
.tile .t{font-size:14px;line-height:1.25;font-weight:600;color:inherit}
.tile[aria-pressed="true"]{background:var(--action);color:var(--on-action);border-color:var(--action)}
.tile[aria-pressed="true"] .n{color:var(--blue-200)}
.chips{display:flex;flex-wrap:wrap;gap:7px;border-radius:var(--radius-xs)}
.chip{background:var(--surface);border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.panel{margin:0;border:1px solid var(--blue-200);border-radius:var(--radius-sm);background:var(--surface-card);padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.panel .ph{margin:0;font-size:16px;line-height:1.45;font-weight:600;color:var(--ink)}
.panel .pp{margin:0;font-size:15.5px;line-height:1.5;color:var(--card-text);text-wrap:pretty}
.panel .pp b{font-weight:600;color:var(--ink)}
.panel ul{margin:0;padding-left:20px}
.panel li{font-size:15.5px;line-height:1.5;color:var(--card-text)}
.panel.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);column-gap:20px;row-gap:6px;align-content:start}
.panel.two .ph{grid-column:1 / -1}
.panel.two .pw{display:flex;flex-direction:column;gap:4px}
.size{display:inline-block;font-size:13px;font-weight:600;color:var(--pfizer-blue);background:var(--surface);border:1px solid var(--blue-200);border-radius:999px;padding:2px 10px;margin-top:2px;align-self:flex-start}

/* Card 3: what the page says vs what Tesseract read */
.hits{position:absolute;inset:0}
.hit{position:absolute;margin:0;padding:0;border:0;background:transparent;border-radius:3px;cursor:pointer}
.hit:hover{background:rgba(0,51,160,.06)}
.cmp{margin:0;border:1px solid var(--blue-200);border-radius:var(--radius-sm);background:var(--surface-card);padding:10px 16px;display:grid;grid-template-columns:132px minmax(0,1fr);row-gap:6px;column-gap:12px;align-items:baseline}
.cmp dt{font-size:12.5px;line-height:1.3;font-weight:600;color:var(--pfizer-blue);letter-spacing:.02em}
.cmp dd{margin:0;font-family:var(--font-mono);font-size:15px;line-height:1.45;color:var(--ink);white-space:pre-wrap}
.cmp mark{background:var(--surface);color:var(--ink);border-radius:4px;padding:0 3px;box-shadow:0 0 0 1.5px var(--ink)}
.cmp .ok{font-family:var(--font-text);font-size:13px;color:var(--gray-600)}

/* Card 5: the key fields table */
.ktbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-icon)}
.ktbl table{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.35}
.ktbl th{text-align:left;font-size:12.5px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:7px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.ktbl td{padding:0;border-bottom:1px solid var(--line)}
.ktbl tr:last-child td{border-bottom:0}
.krow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);width:100%;border:0;background:var(--surface);text-align:left;padding:6px 12px;cursor:pointer;font-size:14.5px;line-height:1.35;color:var(--ink)}
.krow:hover{background:var(--surface-card)}
.krow[aria-pressed="true"]{background:var(--surface-card);box-shadow:inset 4px 0 0 var(--highlight)}
.krow .f{font-weight:600}
.krow .bx{font-family:var(--font-mono);font-size:13.5px}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="How Tesseract reads a scanned page: four cards">
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where"><span id="where-count">Card 1 of 4</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Card"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-next" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  var each = function (list, fn) { Array.prototype.forEach.call(list, fn); };

  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function clear(svg) { while (svg.firstChild) svg.removeChild(svg.firstChild); }
  /* boxes: [x0, y0, x1, y1, class, pad] in the SVG's own units */
  function draw(svg, boxes, pop) {
    clear(svg);
    boxes.forEach(function (b, n) {
      var pad = b[5] != null ? b[5] : 0;
      var r = document.createElementNS(NS, "rect");
      r.setAttribute("x", b[0] - pad); r.setAttribute("y", b[1] - pad);
      r.setAttribute("width", b[2] - b[0] + 2 * pad); r.setAttribute("height", b[3] - b[1] + 2 * pad);
      r.setAttribute("rx", 1.5);
      r.setAttribute("class", (b[4] || "g") + (pop ? " pop" : ""));
      if (pop) r.style.animationDelay = (n * 0.04) + "s";
      svg.appendChild(r);
    });
  }
  function text(svg, x, y, s, size, anchor, cls) {
    var t = document.createElementNS(NS, "text");
    t.setAttribute("x", x); t.setAttribute("y", y); t.setAttribute("font-size", size);
    if (anchor) t.setAttribute("text-anchor", anchor);
    if (cls) t.setAttribute("class", cls);
    t.textContent = s; svg.appendChild(t); return t;
  }
  function dot(svg, x, y, r) {
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r || 4); svg.appendChild(c);
  }

  /* Click-me nudges: a pulsing outline on the element and a "Click me" tag beside it, until it is first clicked */
  var tapped = {};
  function nudge(key, target, tagHost, cls) {
    if (tapped[key] || target.classList.contains("nudge")) return;
    target.classList.add("nudge");
    var tag = document.createElement("span");
    tag.className = "tap" + (cls ? " " + cls : ""); tag.setAttribute("aria-hidden", "true"); tag.textContent = "👆 Click me";
    (tagHost || target.parentNode).appendChild(tag);
    target.addEventListener("click", function () {
      tapped[key] = true;
      target.classList.remove("nudge");
      if (tag.parentNode) tag.parentNode.removeChild(tag);
    }, true);
  }

  /* ---------- Data (all real; see the note at the top) ---------- */

  /* Card 2 and 3 crop: Page 4, x 20 to 400, y 52 to 172 in PDF points (the pictures are that area of the 300 dpi picture). */
  var CROP = [20, 52, 380, 120];
  /* Card 3, "The text": the text lines on the page (their rows in PDF points) and what Tesseract read for each one (the
     student copy's Step 10 output, Colab, 300 dpi). "bad" lists the words Tesseract got wrong, to mark them. The crop
     ends at x 400, so the Quantity and UOM columns sit outside the picture. */
  var LINES = [
    { y: [57, 68], page: "Gamma Process Run ID 129708B", ocr: "Gamma Process Run ID 129708B", bad: [] },

    if (spare > 0 && gaps > 0) {

    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.closest && e.target.closest(".sw, .tiles, .hits, .chips, .ktbl")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #card=N opens a card directly */
  var m = location.hash.match(/card=(\d)/);
  if (m) { i = Math.min(CARDS.length - 1, Math.max(0, +m[1] - 1)); }
  window.addEventListener("resize", function () { fit(); });
  fit();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
</body>
</html>
