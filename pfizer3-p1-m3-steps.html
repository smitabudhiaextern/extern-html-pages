<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot Reading Steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core, Light format. Colors, type, spacing and radius come only from design-system/tokens.json.
   Card player: rail and "Card X of N" on top, one card at a time, Back and Next below.
   Fixed stage: the deck is laid out once on a 760 x STAGE_H design stage, then scaled as a whole to fit
   whatever frame Notion gives it. Nothing scrolls, and Back and Next sit in the same place on every card. */
:root{
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --extern-black:#000000;
  --extern-white:#ffffff;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:var(--extern-white);
  --surface-card:var(--blue-50);
  --surface-icon:var(--extern-white);
  --ink:var(--extern-black);
  --ink-muted:var(--gray-800);
  --card-title:var(--extern-black);
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --icon:var(--extern-black);
  --connector:var(--extern-black);
  --action:var(--extern-black);
  --on-action:var(--extern-white);
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* The design stage: fixed size, scaled and centred by fitStage() below */
.app{position:absolute;left:50%;top:50%;width:760px;height:830px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: rail and where-you-are line */
.top{flex:none;padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center;border-bottom:1px solid var(--line)}
.where{order:2;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.seg{flex:1 1 0;min-width:0;height:24px;display:flex;align-items:center;background:none;border:0;padding:0;margin:0;cursor:pointer;border-radius:4px}
.seg i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line)}
.seg.done i{background:var(--blue-200)}
.seg.cur i{background:var(--pfizer-blue);height:6px;border-radius:3px}

/* Slide area and card */
.stage{flex:1 1 auto;min-height:0;padding:14px 16px;display:flex;flex-direction:column}
.card{flex:1 1 auto;min-height:0;background:var(--surface-card);border-radius:var(--radius-md);padding:22px}
.inner{display:flex;flex-direction:column;gap:var(--space-3)}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.27;color:var(--card-title);text-wrap:balance}
.hl{color:var(--highlight)}
.p{margin:0;font-size:16px;line-height:1.55;color:var(--card-text)}
.p b{font-weight:600;color:var(--card-title)}
.key{margin:0;padding:12px 16px;background:var(--surface-icon);border-radius:var(--radius-sm);font-size:16px;line-height:1.5;font-weight:600;color:var(--card-title)}
.key span{display:block;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label);margin-bottom:4px}

/* Guess */
.guess{background:var(--surface-icon);border-radius:var(--radius-sm);padding:16px;display:flex;flex-direction:column;gap:12px}
.guess-q{margin:0;font-size:15.5px;line-height:1.5;font-weight:600;color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:10px 16px;font-size:15px;line-height:1.2;font-weight:600;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.reveal{margin:0;padding:12px 14px;border-left:3px solid var(--pfizer-blue);background:var(--gray-50);border-radius:0 var(--radius-xs) var(--radius-xs) 0;font-size:15px;line-height:1.55;color:var(--ink)}
.reveal b{font-weight:600}

/* Three-step flow (StepCard and ProcessFlow from the design system, Light format) */
.flow{display:flex;flex-direction:row;align-items:stretch;gap:var(--space-3)}
.step{flex:1 1 0;background:var(--surface-icon);border-radius:var(--radius-sm);padding:16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:var(--space-4);min-width:0}
.badge{width:56px;height:56px;flex:none;border-radius:var(--radius-sm);background:var(--surface-card);color:var(--icon);display:grid;place-items:center}
.badge svg{width:32px;height:32px;display:block}
.step .txt{min-width:0}
.step .n{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.step h3{margin:4px 0 0;font-size:19px;line-height:1.3;font-weight:600;color:var(--card-title)}
.step p{margin:2px 0 0;font-size:15px;line-height:1.5;color:var(--card-text)}
.arrow{display:flex;justify-content:center;align-items:center;color:var(--connector)}
.arrow svg{width:30px;height:20px}

/* Real output block */
.out{background:var(--surface-icon);border-radius:var(--radius-sm)}
.out-head{padding:8px 14px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted);border-bottom:1px solid var(--line)}
.out pre{margin:0;padding:12px 14px;font-family:var(--font-mono);font-size:13.5px;line-height:1.5;color:var(--ink);white-space:pre}
.later{margin:0;display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5;color:var(--card-text)}
.later b{color:var(--card-title);font-weight:600}
.later .pill{flex:none;font-size:12px;line-height:16px;font-weight:600;padding:3px 8px;margin-top:2px;border-radius:var(--radius-xs);background:var(--action);color:var(--on-action);white-space:nowrap}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:c}
.checks li{background:var(--surface-icon);border-radius:var(--radius-sm);padding:12px 14px 12px 52px;position:relative;font-size:15px;line-height:1.55;color:var(--card-text);counter-increment:c}
.checks li::before{content:counter(c);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--surface-card);color:var(--step-label);font-weight:700;font-size:13px;display:grid;place-items:center}
.checks b{color:var(--card-title);font-weight:600}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{padding:0;border:0}
.foot{flex:none;padding:4px 16px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:17px;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-secondary:disabled{opacity:.35;cursor:default}
.btn-primary{background:var(--action);color:var(--on-action)}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app">
  <h1 class="sr-only">How Our Chatbot Reads a Document, in 3 Steps</h1>
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where" id="where">Card 1 of 5</div>
  </header>
  <main class="stage" id="stage" aria-label="Slide"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-secondary" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-primary" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var IC_DOC = '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M13 6h15l9 9v27H13z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M28 6v9h9M19 24h12M19 30h12M19 36h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var IC_FIND = '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="21" cy="21" r="11" stroke="currentColor" stroke-width="2"/><path d="m29 29 11 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 21h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  var IC_REPLY = '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 11h32v21H21l-9 7v-7H8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15 19h18M15 25h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  var ARROW = '<div class="arrow" aria-hidden="true"><svg viewBox="0 0 36 20" fill="none"><path d="M2 10h30M25 3l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  function step(n, icon, title, desc) { return '<div class="step"><span class="badge">' + icon + '</span><div class="txt"><span class="n">' + n + '</span><h3>' + title + '</h3><p>' + desc + '</p></div></div>'; }
  function later(proj, text) { return '<p class="later"><span class="pill">' + proj + '</span><span>' + text + '</span></p>'; }
  var SEARCH = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="2"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  var CARDS = [
    { label: "START", short: "The question",
      title: 'Follow One Question Through Our Chatbot\'s 3 <span class="hl">Steps</span>',
      body:
        '<p class="p">Let\'s follow one real question through the kind of chatbot you\'ll build in this externship. The question is about the Cytiva supplier file you opened in the Task.</p>' +
        '<p class="key"><span>THE QUESTION</span>When was lot 17242818 made?</p>' +
        '<p class="p">To answer it, our chatbot does the same 3 things every time:</p>' +
        '<div class="flow">' +
          step("01", IC_DOC, "Get the Text", "Pulling the words out of the PDF") + ARROW +
          step("02", IC_FIND, "Find the Answer", "Searching for the part that matches") + ARROW +
          step("03", IC_REPLY, "Reply", "Writing the answer in plain words") +
        '</div>' },

    { label: "01", short: "Get the text",
      title: 'Step 1: Get the <span class="hl">Text</span> Out of the PDF',
      body:
        '<p class="p">Our chatbot can\'t look at a page the way you do. First, it has to pull the words out of the PDF. You already know the Cytiva file is a text PDF, so its words come straight out, with no OCR needed.</p>' +
        '<p class="p">Here\'s part of what comes out of page 2:</p>' +
        '<div class="out"><div class="out-head">REAL OUTPUT · PART OF PAGE 2 OF THE CYTIVA FILE</div><pre aria-label="Real output from page 2">Product: ÄKTA™ ready Gradient Flow Section With Inlets\nLot Number: 17242818 \nProduct Article Number:   29 1846 12 \nDate of Manufacture:  20210126 </pre></div>' +
        '<p class="p">Notice that the words come out as plain lines. The chatbot now has the text, but it doesn\'t yet know which line matters.</p>' +
        later("Project 3", "You\'ll pull text out of PDFs yourself with a Python tool called <b>PyMuPDF</b>. Project 4 covers OCR for scanned pages.") },

    { label: "02", short: "Find the answer",
      title: 'Step 2: Find the Answer by Searching Every <span class="hl">Page</span>',
      body:
        '<p class="p">You already know the Cytiva file has 3 pages: a letter, then 2 Certificates of Quality. The chatbot searches all 3 pages for the part that best matches the question.</p>' +
        '<div class="guess" data-guess="page">' +
          '<p class="guess-q">Your guess: which page holds lot 17242818?</p>' +
          '<div class="opts"><button type="button" class="opt" data-opt="p1" aria-pressed="false">Page 1: the letter</button><button type="button" class="opt" data-opt="p2" aria-pressed="false">Page 2: Certificate 1</button><button type="button" class="opt" data-opt="p3" aria-pressed="false">Page 3: Certificate 2</button></div>' +
          '<p class="reveal" data-reveal hidden></p>' +
        '</div>' +
        later("Project 5", "You\'ll build this search with a method called <b>RAG (retrieval-augmented generation)</b>. It means: find the right piece of the document first, then write the answer from that piece.") ,
      reveal: {
        p1: '<b>Not this time. It\'s page 2.</b> The letter on page 1 is dated 3 June, 2022 and lists part numbers, not lot numbers. Lot 17242818 appears only in Certificate 1, on page 2.',
        p2: '<b>You guessed right: page 2.</b> Lot 17242818 appears only in Certificate 1. Page 3 has a different lot, 18356721, and picking the wrong certificate is one of the easiest mistakes to make.',
        p3: '<b>Close, but it\'s page 2.</b> Page 3 is a different certificate for a different lot, 18356721. That\'s exactly the mix-up a chatbot can make, too.'
      } },

    { label: "03", short: "Reply",
      title: 'Step 3: Reply With the Right <span class="hl">Date</span>',
      body:
        '<p class="p">Now an <b>LLM (large language model)</b>, the kind of AI behind chatbots like Gemini, reads the piece it found and writes an answer in plain words. To get this one right, it has to do 2 things:</p>' +
        '<ol class="checks">' +
          '<li><b>Pick the right date.</b> You already know Certificate 1 has 2 dates: the Date of Manufacture, the day the lot was made, and the Expiration Date, the last day it should be used. The question asks when the lot was made, so the right one is the Date of Manufacture, 20210126.</li>' +
          '<li><b>Read the date.</b> Just as you did in the Task, split it into year, month and day: 2021, 01, 26. That\'s 26 January 2021.</li>' +
        '</ol>' +
        '<p class="p">A good reply says the lot was made on 26 January 2021 and names the Date of Manufacture, so you can check it.</p>' +
        later("Project 8", "You\'ll put all 3 steps behind a chat window that people can type questions into.") },

    { label: "WATCH OUT", short: "Mistakes",
      title: 'Where Each Step Can Go <span class="hl">Wrong</span>',
      body:
        '<p class="p">Each of the 3 steps can slip. Here\'s how each one could go wrong on the Cytiva file:</p>' +
        '<div class="flow">' +
          step("01", IC_DOC, "Get the Text", "It can miss words. The sideways “Approved On” stamps on pages 1 and 2 are drawn as shapes, so their 2 dates never come out as text.") + ARROW +
          step("02", IC_FIND, "Find the Answer", "It can pick page 3, lot 18356721, by mistake.") + ARROW +
          step("03", IC_REPLY, "Reply", "It can use the expiration date, or read the lot number as a date.") +
        '</div>' +
        '<p class="p">That\'s why you always check the answer against the page. Next, you\'ll watch it done on the Cytiva file, and then you\'ll try it with Gemini yourself.</p>' }
  ];
  var END_LABEL = "Done. Now watch it done";
  var END_TARGET = "see";

  /* The design stage. Keep STAGE_W and STAGE_H in step with .app's width and height in the CSS. */
  var STAGE_W = 760, STAGE_H = 830;

  var i = 0, picks = {};
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), where = $("where");
  var donemsg = $("donemsg");
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of the page.";
  var embedded = window.parent && window.parent !== window;

  /* Scales the whole stage to fit the frame, keeping its shape, and centres it. */
  function fitStage() {
    var s = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
    app.style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }

  CARDS.forEach(function (c, n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "seg";
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + c.short);
    b.innerHTML = "<i></i>";
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function render(anim) {
    var c = CARDS[i];
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.label + '</p><h2 class="title">' + c.title + '</h2>' + c.body + '</div>';
    var g = card.querySelector("[data-guess]");
    if (g) {
      var rev = g.querySelector("[data-reveal]");
      var show = function (k) {
        picks[i] = k;
        Array.prototype.forEach.call(g.querySelectorAll(".opt"), function (o) { o.setAttribute("aria-pressed", o.getAttribute("data-opt") === k ? "true" : "false"); });
        rev.innerHTML = c.reveal[k]; rev.hidden = false;
      };
      Array.prototype.forEach.call(g.querySelectorAll(".opt"), function (o) {
        o.addEventListener("click", function () { show(o.getAttribute("data-opt")); });
      });
      if (picks[i]) show(picks[i]);
    }
    Array.prototype.forEach.call(rail.children, function (b, n) {
      b.classList.toggle("cur", n === i);
      b.classList.toggle("done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    where.innerHTML = "<b>" + c.short + "</b> · Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + CARDS[i + 1].short + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n === i || n < 0 || n >= CARDS.length) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i < CARDS.length - 1) { go(i + 1); return; }
    /* Works on its own: the message shows in the deck. The postMessage is kept for pages that listen, but nothing needs it. */
    donemsg.textContent = DONE_MSG;
    if (embedded) window.parent.postMessage({ type: "extern-deck-done", target: END_TARGET }, "*");
  });
  document.addEventListener("keydown", function (e) {
    var t = e.target && e.target.tagName;
    if (e.altKey || e.ctrlKey || e.metaKey || t === "INPUT" || t === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", fitStage);
  fitStage();
  render(false);
})();
</script>
</body>
</html>
