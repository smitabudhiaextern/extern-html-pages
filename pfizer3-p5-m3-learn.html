<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chunking and Embeddings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer 3.0, Project 5, module 3 Learn deck: "Chunking and Embeddings" reading.
   Merges Chaitanya's (SME) concept pages "Understanding Embeddings" (Notion 8c21d028...) and "Understanding Chunking"
   (0601d028...) into one Learn deck. Ideas only, NO code: the code is in the Try (nb2, Chunking & Embeddings notebook).
   Built 23 November 2026 from source/m3-learn-build.py (+ m3-learn-style.css, m3-learn-player.js). Never hand-patch this
   file: change the source and rebuild. Card plan: step2-fitcheck-m3.md Part 2; coverage: step2-coverage-m3.md.
   SME text word for word, except the swaps in p5-decisions.md 26 to 41 and step2-coverage-m3.md Group B (B1 to B33).
   Kept by Smita's call: "Not all chunking strategies are created equal." (full stop, B17).
   REAL DATA: the 3 practice files from nb2 STEP 2 (read from the notebook at build time; each bar is one real line,
   its length the line's length in characters), STEP 4/5/6 chunk boundaries (saved run; the 6-chunk split reproduced
   with llama-index-core 0.14.25 and Colab-style metadata, average lengths 349.33 and 388.83 match the saved STEP 7
   table exactly), Experiment 1 counts (6, 3, 3), Experiment 2 scores (0.6275, 0.6206, 0.3161), Experiment 4 first
   5 MiniLM values and 384 dimensions. His own examples (King/Queen/Apple, the expiration-date line, hiking chunks,
   the policy line, the sterilization question) are drawn from his numbers and words, labelled "Example" where drawn.
   No text is drawn over a screenshot. No card shows an answer to a Step 3 Task prompt. */

/* Pfizer x Extern Core design system, Light format. Tokens, card player, rail, "Click me" pulse, switches and pictures
   copied from pfizer3-p4-m2-learn.html (P4 module 2, rebuilt 22 November 2026: body text 18 css px). */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-600); --focus-ring:var(--pfizer-blue);
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage-w:760px; --stage-h:800px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
[hidden]{display:none !important}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:20px;align-items:center}
.where{order:2;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:5px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 1px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:18px 28px;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.inner{display:flex;flex-direction:column;gap:12px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:2px}
.hl{color:var(--highlight)}
.why{margin:-6px 0 0;font-size:19px;line-height:1.4;font-weight:600;color:var(--ink)}
.p{margin:0;font-size:18px;line-height:1.5;color:var(--ink-muted);text-wrap:pretty}
.p b,.li b{font-weight:600;color:var(--ink)}
.hint{margin:0;font-size:15.5px;line-height:1.4;font-weight:600;color:var(--step-label)}
.ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:2px}
.ul li{font-size:18px;line-height:1.5;color:var(--ink-muted)}
.ul li b{font-weight:600;color:var(--ink)}
.q{font-style:italic}
.mono{font-family:var(--font-mono);font-size:.9em;white-space:nowrap}

/* Switch */
.sw{display:inline-flex;flex:none;border:1.5px solid var(--ink);border-radius:var(--radius-xs);overflow:hidden}
.sw button{border:0;background:var(--surface);color:var(--ink);padding:9px 15px;cursor:pointer;font-size:15.5px;line-height:1.2;font-weight:600;white-space:nowrap}
.sw button + button{border-left:1.5px solid var(--ink)}
.sw button[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.row{display:flex;align-items:center;gap:16px}

/* Click-me nudge: a soft pulsing outline and a small tag, both gone after the first click */
.nwrap{position:relative;display:inline-flex;flex:none}
.nudge{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(0,51,160,.55)}50%{box-shadow:0 0 0 7px rgba(0,51,160,.12)}}
.tap{position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--surface-card);color:var(--pfizer-blue);border:1px solid var(--blue-200);border-radius:999px;padding:4px 11px;font-size:13px;line-height:1.2;font-weight:600;pointer-events:none;animation:tapx 1.6s ease-in-out infinite}
.tap.inline{position:static;transform:none;display:inline-block;margin-left:10px;vertical-align:1px}
@keyframes tapx{0%,100%{margin-left:0}50%{margin-left:4px}}
.tap.inline{animation:none}
@media (prefers-reduced-motion:reduce){ .nudge{animation:none;box-shadow:0 0 0 3px rgba(0,51,160,.5)} .tap{animation:none} }

/* Pictures with boxes drawn over them */
.pic{position:relative;margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);line-height:0;flex:none;padding:8px 10px}
.pic img{display:block;width:100%;height:auto}
.pic .ov{position:absolute;inset:8px 10px;pointer-events:none}
.pic svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pic rect{fill:none;vector-effect:non-scaling-stroke}
.pic rect.g{stroke:var(--highlight);fill:var(--highlight);fill-opacity:.16;stroke-width:3px}
.pic rect.pop{animation:pop .3s ease both}
@keyframes pop{from{opacity:0}to{opacity:1}}
.pic .blank{position:absolute;inset:0;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:72px;line-height:1;color:var(--blue-200)}
.cap{margin:6px 0 0;font-size:15px;line-height:1.35;font-weight:600;color:var(--gray-600);text-align:left}
.cap b{color:var(--ink)}
.picwrap{display:flex;gap:18px;align-items:center}
.picwrap .pic{width:300px}
.picwrap .cap{flex:1;margin:0;font-size:18px}

/* Clickable rows (text always visible; a click only changes the picture) */
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:10px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer;font-size:18px;line-height:1.45;color:var(--ink-muted)}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--surface-card);color:var(--pfizer-blue);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step b{font-weight:600;color:var(--ink)}
.step:hover{border-color:var(--blue-200)}
.step[aria-pressed="true"]{border-color:var(--pfizer-blue);background:var(--surface-card);box-shadow:inset 4px 0 0 var(--pfizer-blue)}
.step[aria-pressed="true"] .n{background:var(--pfizer-blue);color:var(--on-action)}
.steps.static .step{cursor:default}
.steps.static .step:hover{border-color:var(--line)}
.steps.wrap{border-radius:var(--radius-sm)}

/* Flow diagrams built from boxes */
.flow{display:flex;align-items:stretch;gap:6px}
.fbox{flex:1 1 0;min-width:0;border:1.5px solid var(--blue-200);border-radius:var(--radius-sm);background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;gap:3px;transition:background .3s ease,border-color .3s ease,opacity .3s ease}
.fbox .fl{font-size:12.5px;line-height:1.2;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label)}
.fbox .ft{font-size:17px;line-height:1.35;font-weight:600;color:var(--ink)}
.fbox .fs{font-size:14.5px;line-height:1.35;color:var(--card-text)}
.fbox.on{background:var(--surface-card);border-color:var(--pfizer-blue);box-shadow:inset 0 0 0 1px var(--pfizer-blue)}
.fbox.dim{opacity:.45}
.arr{flex:none;align-self:center;color:var(--ink);font-size:20px;line-height:1}
.ctx{margin:0;border:1px solid var(--blue-200);border-radius:var(--radius-sm);background:var(--surface-card);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.ctx .cl{font-size:12.5px;line-height:1.2;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label)}
.ctx .cq{font-size:18px;line-height:1.4;color:var(--ink)}
.ctx .cd{font-family:var(--font-mono);font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xs);padding:5px 10px;color:var(--ink);align-self:flex-start}

/* Tables */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:14px;line-height:1.3;font-weight:600;color:var(--ink-muted);padding:7px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--line);font-size:18px;line-height:1.4;color:var(--card-text);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.k{font-weight:600;color:var(--ink);white-space:nowrap}
.tbl td b{font-weight:600;color:var(--ink)}
.tbl a{color:var(--pfizer-blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.tbl a:hover{text-decoration-thickness:2px}

/* Two columns */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{margin:0;border:1px solid var(--blue-200);border-radius:var(--radius-sm);background:var(--surface-card);padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.box .bh{margin:0;font-size:18px;line-height:1.35;font-weight:600;color:var(--card-title)}
.box .bp{margin:0;font-size:18px;line-height:1.45;color:var(--card-text);text-wrap:pretty}
.box .bp b{font-weight:600;color:var(--ink)}
.box ul{margin:0;padding-left:20px}
.box li{font-size:18px;line-height:1.45;color:var(--card-text)}
.box li b{font-weight:600;color:var(--ink)}
.box.white{background:var(--surface);border-color:var(--line)}

/* Sources into LlamaIndex (card 6) */
.src{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.src .chips{display:grid;grid-template-columns:auto auto;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:15px;line-height:1.2;font-weight:600;white-space:nowrap}
.hub{border:1.5px solid var(--pfizer-blue);background:var(--surface-card);border-radius:var(--radius-sm);padding:10px 12px;text-align:center;font-size:16px;line-height:1.3;font-weight:600;color:var(--ink)}
.hub small{display:block;font-size:13.5px;font-weight:500;color:var(--card-text);margin-top:2px}

/* Play button (card 10) */
.btn-play{display:inline-flex;align-items:center;gap:8px;font-size:15.5px;line-height:1.2;font-weight:600;padding:9px 15px;border-radius:var(--radius-xs);border:1.5px solid var(--ink);background:var(--surface);cursor:pointer}
.btn-play svg{width:13px;height:13px}

/* Recap (last card) */
.recap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.recap .box{padding:9px 13px;gap:3px}
.recap .bh{font-size:18px}
.recap li{font-size:18px;line-height:1.4}
.take{margin:0;border-left:4px solid var(--highlight);background:var(--surface);padding:4px 0 4px 14px;font-size:18px;line-height:1.45;color:var(--ink)}
.take b{font-weight:600}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }

/* ---------- m3 additions (built 23 November 2026), from the same tokens only ---------- */
.p a{color:var(--pfizer-blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.viz{display:flex;flex-direction:column;gap:8px}
.vrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tag{display:inline-block;background:var(--surface-card);color:var(--pfizer-blue);border:1px solid var(--blue-200);border-radius:999px;padding:3px 10px;font-size:13.5px;line-height:1.2;font-weight:600;white-space:nowrap}
.ex{font-size:13px;line-height:1.2;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-600)}

/* Documents drawn as one bar per real line (bar length = the line's length in characters) */
.docs{display:flex;gap:14px;align-items:flex-start}
.doc{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px}
.fn{font-family:var(--font-mono);font-size:13.5px;line-height:1.2;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lines{border:1px solid var(--line);border-radius:var(--radius-xs);background:var(--surface);padding:8px 9px;display:flex;flex-direction:column;gap:5px}
.lines i{display:block;height:7px;border-radius:4px;background:var(--blue-200);transition:opacity .3s ease,background .3s ease}
.lines i.on{background:var(--pfizer-blue)}
.lines i.dim{opacity:.25}
.lines i.ans{background:var(--highlight)}
.lines .cut{height:0;border-top:2px dashed var(--ink);margin:1px -9px;position:relative}
.lines .cut.off{border-top-color:transparent}
.lines .cut span{position:absolute;right:4px;top:-11px;background:var(--surface);font-size:12px;line-height:1;font-weight:700;color:var(--ink);padding:2px 4px}
.lines.piece{border-color:var(--pfizer-blue);background:var(--surface-card)}
.lines .ck{font-size:12.5px;line-height:1.1;font-weight:700;color:var(--pfizer-blue);margin:-2px 0 0}

/* Card 3: similarity scores on a 0 to 1 line */
.scale{position:relative;height:100px;margin:0 40px}
.scale .track{position:absolute;left:0;right:0;top:72px;height:4px;border-radius:2px;background:var(--blue-200)}
.scale .tk{position:absolute;top:82px;transform:translateX(-50%);font-size:13px;line-height:1.2;color:var(--gray-600);font-variant-numeric:tabular-nums}
.scale .pd{position:absolute;top:68px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--pfizer-blue);box-shadow:0 0 0 2px var(--surface)}
.pin{position:absolute;transform:translateX(-50%);background:none;border:0;padding:0;cursor:pointer;border-radius:999px}
.pin .pl{display:block;font-size:13.5px;line-height:1.2;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--ink);border-radius:999px;padding:3px 9px;white-space:nowrap}
.pin[aria-pressed="true"] .pl{background:var(--action);color:var(--on-action)}
.pair{margin:0;border:1px solid var(--blue-200);border-radius:var(--radius-sm);background:var(--surface-card);padding:8px 12px;font-size:16px;line-height:1.4;color:var(--card-text)}
.pair b{color:var(--ink);font-weight:600}

/* Card 4: his three vectors, plotted */
.plot{display:flex;gap:16px;align-items:center}
.plot svg{width:230px;height:150px;flex:none;overflow:visible}
.plot .ax{stroke:var(--ink);stroke-width:1.5}
.plot .gd{stroke:var(--line);stroke-width:1}
.plot .dot{fill:var(--pfizer-blue)}
.plot .dot.far{fill:var(--ink)}
.plot text{font-family:var(--font-text);font-size:13px;fill:var(--ink)}
.plot text.n{fill:var(--gray-600);font-size:11.5px}

/* Card 5: the two quotes, with the words a search compares */
.quote{margin:0;border-left:4px solid var(--blue-200);padding:3px 0 3px 14px;font-size:18px;line-height:1.45;color:var(--ink);font-style:italic}
.mk{border-radius:4px;padding:0 2px;transition:background .3s ease,box-shadow .3s ease}
.mk.on{background:var(--surface-card);box-shadow:0 0 0 2px var(--pfizer-blue)}
.mk.miss{box-shadow:0 0 0 2px var(--ink);background:var(--gray-50)}

/* Card 6: sentence into model into numbers */
.vec{font-family:var(--font-mono);font-size:14.5px;color:var(--ink)}

/* Card 12: bar chart from the run */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.bar .bt{height:22px;border-radius:5px;background:var(--pfizer-blue);color:var(--on-action);font-size:13.5px;font-weight:600;display:flex;align-items:center;padding-left:8px;white-space:nowrap}

/* Card 13: real words as blocks, cut every 20 words */
.words{display:flex;flex-wrap:wrap;gap:4px 3px;align-items:center;border:1px solid var(--line);border-radius:var(--radius-xs);padding:9px}
.words i{display:block;height:12px;border-radius:3px;background:var(--blue-200)}
.words i.end{background:var(--pfizer-blue)}
.words .wc{width:0;height:22px;border-left:2.5px dashed var(--ink);margin:0 3px}
.words i.hot{background:var(--highlight)}

/* Card 15 and 19: text pieces */
.pieces{display:flex;gap:10px;align-items:stretch}
.piece{flex:1 1 0;min-width:0;border:1.5px solid var(--blue-200);border-radius:var(--radius-sm);background:var(--surface);padding:8px 12px;font-size:16px;line-height:1.4;color:var(--card-text)}
.piece .pk{display:block;font-size:12.5px;line-height:1.2;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label);margin-bottom:3px}
.piece.on{border-color:var(--pfizer-blue);background:var(--surface-card)}
.piece .hit{background:var(--surface);box-shadow:0 0 0 2px var(--pfizer-blue);border-radius:4px;padding:0 2px}

/* Card 17: a report outline split in two passes */
.outline .lines i.h{height:11px;background:var(--pfizer-blue);width:45%}

/* Card 18a: the dictionary scale */
.dict{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.dict .box{align-items:center;text-align:center}
.dict .box.on{border-color:var(--pfizer-blue);box-shadow:inset 0 0 0 1px var(--pfizer-blue)}

/* Strategy number badges (cards 13 to 18b, 21) */
.sn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--pfizer-blue);color:var(--on-action);font-size:12.5px;font-weight:700;margin-right:6px;vertical-align:2px;flex:none}
.pc td{font-size:16.5px}
.pc th{font-size:14px}
.tbl td.sz{white-space:nowrap}
.szb{display:block;height:6px;border-radius:3px;background:var(--pfizer-blue);margin-top:5px}
.tap.left{left:auto;right:calc(100% + 10px)}
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="Chunking and embeddings: 22 cards">
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where"><span id="where-count">Card 1 of 22</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Card"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-next" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>
<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  var each = function (list, fn) { Array.prototype.forEach.call(list, fn); };
  var D = {"LINES": {"ai_history.txt": ["Artificial Intelligence (AI) has a rich history dating back to the 1950s.", "The term was first coined by John McCarthy in 1956 at the Dartmouth Conference.", "Early AI research focused on symbolic methods and rule-based systems.", "In the 1980s, expert systems became popular but faced limitations.", "The 1990s and early 2000s saw a shift towards machine learning approaches.", "The deep learning revolution began around 2012 with breakthrough results in computer vision.", "Today, large language models like GPT, LLaMA, and Gemini represent cutting-edge AI capabilities.", "These models are trained on vast amounts of text data and can generate human-like responses."], "neural_networks.txt": ["Neural networks are computing systems inspired by biological neural networks.", "The perceptron, developed by Frank Rosenblatt in 1958, was one of the earliest neural network models.", "Modern neural networks consist of layers of interconnected nodes or \"neurons.\"", "Each connection can transmit a signal from one neuron to another.", "The receiving neuron processes the signal and signals downstream neurons connected to it.", "Deep neural networks contain multiple hidden layers between input and output layers.", "Convolutional Neural Networks (CNNs) revolutionized image processing.", "Recurrent Neural Networks (RNNs) and transformers handle sequential data like text or time series."], "embeddings.txt": ["Embeddings are dense vector representations of data in a continuous vector space.", "Word embeddings map words to vectors where similar words are positioned closer together.", "Popular word embedding techniques include Word2Vec, GloVe, and FastText.", "Sentence embeddings capture meaning at the sentence level rather than individual words.", "Models like Universal Sentence Encoder and SBERT create powerful sentence embeddings.", "Document embeddings represent entire documents as fixed-length vectors.", "Embeddings enable semantic search by finding documents with similar meaning, not just keyword matches.", "They also power recommendation systems, clustering, and classification tasks.", "Recent models like OpenAI's text-embedding-ada and Cohere's embedding models offer state-of-the-art performance."]}, "ORDER": ["ai_history.txt", "embeddings.txt", "neural_networks.txt"], "MAXLEN": 112, "CUT": {"ai_history.txt": 5, "embeddings.txt": 6, "neural_networks.txt": 5}, "EXP2": [["Neural networks process data through interconnected nodes.", "Neural networks analyze information using connected neurons.", 0.6275], ["Embeddings transform text into vectors.", "Vector representations capture the semantic meaning of words.", 0.6206], ["Neural networks are used in image recognition.", "Embeddings are used for semantic search.", 0.3161]], "Q2": "Who named artificial intelligence?"};
  var timer = null;

  function clear(svg) { while (svg.firstChild) svg.removeChild(svg.firstChild); }
  /* boxes: [x0, y0, x1, y1] in the picture's own pixels */
  function draw(svg, boxes, pop) {
    clear(svg);
    boxes.forEach(function (b) {
      var r = document.createElementNS(NS, "rect");
      r.setAttribute("x", b[0]); r.setAttribute("y", b[1]);
      r.setAttribute("width", b[2] - b[0]); r.setAttribute("height", b[3] - b[1]); r.setAttribute("rx", 4);
      r.setAttribute("class", "g" + (pop ? " pop" : ""));
      svg.appendChild(r);
    });
  }

  /* Click-me nudges (copied from the P3 and P4 decks): a pulsing outline and a "Click me" tag until the first click */
  var tapped = {};
  function nudge(key, target, tagHost, cls) {
    if (tapped[key] || target.classList.contains("nudge")) return;
    target.classList.add("nudge");
    var tag = document.createElement("span");
    tag.className = "tap" + (cls ? " " + cls : ""); tag.setAttribute("aria-hidden", "true"); tag.textContent = "👆 Click me";
    (tagHost || target.parentNode).appendChild(tag);
    target.addEventListener("click", function () {
      tapped[key] = true;
      target.classList.remove("nudge");
      if (tag.parentNode) tag.parentNode.removeChild(tag);
    }, true);
  }

  function bar(len, cls) { return '<i class="' + (cls || "") + '" style="width:' + (100 * len / D.MAXLEN).toFixed(1) + '%"></i>'; }
  function pressed(btns, v) { each(btns, function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-view") === v ? "true" : "false"); }); }
  function switcher(root, views, first, key) {
    var btns = root.querySelectorAll(".sw button");
    function show(v) { pressed(btns, v); views(v); space(); }
    each(btns, function (x) { x.addEventListener("click", function () { show(x.getAttribute("data-view")); }); });
    show(first);
    nudge(key, root.querySelector(".sw"), root.querySelector(".sw").parentNode);
  }
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Card 1 (fix round 2): the whole long file is lit (it all fits in the window); a few lines in the
     middle pages fade in turn, the details a model can miss. The first and last pages never fade. ---------- */
  function initWindow(root) {
    var pages = root.querySelectorAll("#c1-viz .lines"), mid = [], step = 0;
    each(pages, function (pg, k) { if (k > 0 && k < pages.length - 1) each(pg.querySelectorAll("i"), function (l) { mid.push(l); }); });
    function show() {
      each(root.querySelectorAll("#c1-viz .lines i"), function (l) { l.classList.add("on"); l.classList.remove("dim"); });
      each(mid, function (l, k) { if ((k * 7 + step * 5) % 6 === 0) { l.classList.remove("on"); l.classList.add("dim"); } });
    }
    show();
    if (reduce) return;
    timer = setInterval(function () { step++; show(); }, 900);
  }

  /* ---------- Card 2: the three problems on ai_history.txt (the switch changes only the picture) ---------- */
  function initThree(root) {
    var viz = root.querySelector("#c2-viz"), L = D.LINES["ai_history.txt"];
    var q = '<div class="ctx"><span class="cl">Question</span><span class="cq">"' + D.Q2 + '"</span></div>';
    var V = {
      much: function () {
        return q + '<div class="vrow"><div class="doc" style="flex:0 0 260px"><span class="fn">ai_history.txt</span><div class="lines">' +
          L.map(function (l, k) { return bar(l.length, k === 1 ? "ans" : "on"); }).join("") + '</div></div>' +
          '<p class="cap" style="flex:1;margin:0">All 8 lines go to the AI. Only line 2 (green) answers it.</p></div>';
      },
      little: function () {
        return q + '<div class="pieces"><div class="piece"><span class="pk">Only this line</span>' + L[3] + '</div></div>' +
          '<p class="cap">The answer isn\'t in it.</p>';
      },
      key: function () {
        return q + '<p class="cap">Line 2 of ai_history.txt answers it ("<b>coined</b> by John McCarthy") but shares <b>none of its words</b>. A keyword search finds only line 1.</p>';
      }
    };
    switcher(root, function (v) { viz.innerHTML = V[v](); }, "much", "c2");
  }

  /* ---------- Card 3: Experiment 2's real similarity scores as pins on a 0 to 1 line ---------- */
  function initPins(root) {
    var scale = root.querySelector("#c3-scale"), pair = root.querySelector("#c3-pair");
    D.EXP2.forEach(function (p, k) {
      var dot = document.createElement("span");
      dot.className = "pd"; dot.style.left = (p[2] * 100) + "%"; scale.appendChild(dot);
      var b = document.createElement("button");
      b.type = "button"; b.className = "pin"; b.style.left = (p[2] * 100) + "%"; b.style.top = (k === 1 ? 28 : 0) + "px";
      b.innerHTML = '<span class="pl">' + p[2].toFixed(2) + '</span>'; b.setAttribute("aria-label", "Pair " + (k + 1) + ": score " + p[2].toFixed(2));
      b.addEventListener("click", function () { pick(k); });
      scale.appendChild(b);
    });
    var pins = scale.querySelectorAll(".pin");
    function pick(k) {
      each(pins, function (b, j) { b.setAttribute("aria-pressed", j === k ? "true" : "false"); });
      var p = D.EXP2[k];
      pair.innerHTML = '<b>Pair ' + (k + 1) + ':</b> "' + p[0] + '" and "' + p[1] + '"';
      space();
    }
    pick(0);
    nudge("c3", pins[2], pins[2], "left");
  }

  /* ---------- Card 5: keyword search vs search by meaning on his two lines ---------- */
  function initMeaning(root) {
    var q = root.querySelector("#c5-q"), d = root.querySelector("#c5-d"), cap = root.querySelector("#c5-cap");
    switcher(root, function (v) {
      q.className = "mk " + (v === "k" ? "miss" : "on"); d.className = "mk " + (v === "k" ? "" : "on");
      cap.innerHTML = v === "k" ? '<b>0 exact matches:</b> the document never says "expiration date".' : '<b>Close in meaning:</b> "expiration date" and "expires" match.';
    }, "k", "c5");
  }

  /* ---------- Card 8: Play cuts the 3 files where your notebook's STEP 4 cut them (6 chunks) ---------- */
  function initCut(root) {
    var docs = root.querySelector("#c8-docs"), btn = root.querySelector("#c8-play");
    var cap = root.querySelector("#c8-cap");
    function draw(cuts) {
      docs.innerHTML = D.ORDER.map(function (f, fi) {
        var L = D.LINES[f], h = '<div class="doc"><span class="fn">' + f + '</span><div class="lines">';
        L.forEach(function (l, k) {
          if (k === D.CUT[f] && fi < cuts) h += '<span class="cut"></span>';
          h += bar(l.length, fi < cuts ? "on" : "");
        });
        return h + '</div></div>';
      }).join("");
      cap.innerHTML = cuts >= 3 ? "<b>6 chunks</b>, cut where your notebook's STEP 4 cuts them." : "The notebook's 3 practice files, one bar per line.";
      space();
    }
    btn.addEventListener("click", function () {
      if (timer) clearInterval(timer);
      var c = 0; draw(0);
      timer = setInterval(function () { c++; draw(c); if (c >= 3) { clearInterval(timer); timer = null; } }, 600);
    });
    draw(0);
    nudge("c8", btn, btn.parentNode);
  }

  /* ---------- Card 10: asking the question lights the hiking boots chunk ---------- */
  function initHike(root) {
    var rows = root.querySelectorAll("#c10-list .step"), btn = root.querySelector("#c10-ask");
    btn.addEventListener("click", function () {
      each(rows, function (r, k) { r.style.opacity = k === 2 ? "" : ".45"; r.classList.toggle("lit", k === 2);
        r.style.borderColor = k === 2 ? "var(--pfizer-blue)" : ""; r.style.background = k === 2 ? "var(--surface-card)" : ""; });
    });
    nudge("c10", btn, btn.parentNode);
  }

  /* ---------- Card 15: his policy line, cut without and with overlap ---------- */
  function initOverlap(root) {
    var viz = root.querySelector("#c15-viz");
    var V = {
      no: '<div class="pieces"><div class="piece on"><span class="pk">Chunk 1</span>... The new policy applies to</div><div class="piece"><span class="pk">Chunk 2</span>all employees starting next quarter.</div></div>',
      yes: '<div class="pieces"><div class="piece"><span class="pk">Chunk 1</span>... The new policy applies to</div><div class="piece on"><span class="pk">Chunk 2</span><span class="hit">The new policy applies to</span> all employees starting next quarter.</div></div>'
    };
    switcher(root, function (v) { viz.innerHTML = '<span class="ex">Example</span>' + V[v]; }, "no", "c15");
  }

  /* ---------- Card 17: a report split in two passes (headings, then paragraphs) ---------- */
  var REPORT = [["h", 45], [0, 92], [0, 70], ["h", 40], [0, 90], [0, 64]];
  var PARA_CUTS = [2, 5];
  function initRecursive(root) {
    var viz = root.querySelector("#c17-viz"), btn = root.querySelector("#c17-play");
    function draw(pass) {
      /* fix round 2: the label sits at the right, clear of the "Click me" tag beside the button */
      var h = '<div class="docs outline"><div class="doc"><span class="ex" style="align-self:flex-end">Example</span><div class="lines">';
      REPORT.forEach(function (r, k) {
        /* cuts are always drawn, hidden until their pass, so the picture never changes height */
        if (k === 3) h += '<span class="cut' + (pass >= 1 ? '' : ' off') + '"></span>';
        if (PARA_CUTS.indexOf(k) >= 0) h += '<span class="cut' + (pass >= 2 ? '' : ' off') + '"></span>';
        h += '<i class="' + (r[0] === "h" ? "h" : "") + '" style="width:' + r[1] + '%"></i>';
      });
      viz.innerHTML = h + '</div></div></div>';
      space();
    }
    btn.addEventListener("click", function () {
      if (timer) clearInterval(timer);
      draw(0); var p = 0;
      timer = setInterval(function () { p++; draw(p); if (p >= 2) { clearInterval(timer); timer = null; } }, 800);
    });
    draw(0);
    nudge("c17", btn, btn.parentNode);
  }

  /* ---------- Card 19: his sterilization example, not chunked vs chunked ---------- */
  function initChunked(root) {
    var viz = root.querySelector("#c19-viz");
    var PAGE = [92, 85, 70, 0, 88, 94, 60, 0, 90, 82, 76, 0, 86, 55];
    var ANS = [8, 9, 10];
    function page(ch) {
      var h = '<div class="lines" style="flex:1">';
      PAGE.forEach(function (w, k) {
        if (!w) { h += '<span style="height:4px;display:block"></span>'; return; }
        var a = ANS.indexOf(k) >= 0;
        h += '<i class="' + (ch ? (a ? "on" : "dim") : (a ? "on" : "")) + '" style="width:' + w + '%"></i>';
      });
      return h + '</div>';
    }
    switcher(root, function (v) {
      viz.innerHTML = '<div class="vrow" style="flex-wrap:nowrap;align-items:center"><span class="ex">Example</span>' + page(v === "ch") +
        '<p class="cap" style="flex:1;margin:0">' + (v === "ch" ? "Only the answering paragraph." : "The whole page comes back.") + '</p></div>';
    }, "not", "c19");
  }

  var INITS = { initWindow: initWindow, initThree: initThree, initPins: initPins, initMeaning: initMeaning, initCut: initCut,
    initHike: initHike, initOverlap: initOverlap, initRecursive: initRecursive, initChunked: initChunked };
  var CARDS = [{label:"Long Documents",eyebrow:"The problem",html:"<h2 class=\"title\">Why Long Documents Are Hard for <span class=\"hl\">AI</span></h2><p class=\"why\">This is the problem chunking and embeddings fix.</p><p class=\"p\">You already know from Step 1 that RAG finds the right part of a document before the AI answers.</p><p class=\"p\">AI models like ChatGPT and Gemini have a <b>fixed memory window</b>, called a context window (the most text a model can read at one time). Today's Gemini can read a very long file in one go, but the longer the text, the more likely it is to miss details. If you feed in a full book, the model can <a href=\"https://ai.google.dev/gemini-api/docs/long-context\" target=\"_blank\" rel=\"noopener\">miss details from earlier pages</a>.</p><div class=\"viz\" id=\"c1-viz\"><div class=\"docs\"><div class=\"doc\" ><div class=\"lines \"><i style=\"width:65.2%\" title=\"Artificial Intelligence (AI) has a rich history dating back to the 1950s.\"></i><i style=\"width:70.5%\" title=\"The term was first coined by John McCarthy in 1956 at the Dartmouth Conference.\"></i><i style=\"width:61.6%\" title=\"Early AI research focused on symbolic methods and rule-based systems.\"></i><i style=\"width:58.9%\" title=\"In the 1980s, expert systems became popular but faced limitations.\"></i><i style=\"width:66.1%\" title=\"The 1990s and early 2000s saw a shift towards machine learning approaches.\"></i><i style=\"width:82.1%\" title=\"The deep learning revolution began around 2012 with breakthrough results in computer vision.\"></i><i style=\"width:85.7%\" title=\"Today, large language models like GPT, LLaMA, and Gemini represent cutting-edge AI capabilities.\"></i><i style=\"width:82.1%\" title=\"These models are trained on vast amounts of text data and can generate human-like responses.\"></i></div></div><div class=\"doc\" ><div class=\"lines \"><i style=\"width:72.3%\" title=\"Embeddings are dense vector representations of data in a continuous vector space.\"></i><i style=\"width:78.6%\" title=\"Word embeddings map words to vectors where similar words are positioned closer together.\"></i><i style=\"width:64.3%\" title=\"Popular word embedding techniques include Word2Vec, GloVe, and FastText.\"></i><i style=\"width:77.7%\" title=\"Sentence embeddings capture meaning at the sentence level rather than individual words.\"></i><i style=\"width:75.9%\" title=\"Models like Universal Sentence Encoder and SBERT create powerful sentence embeddings.\"></i><i style=\"width:63.4%\" title=\"Document embeddings represent entire documents as fixed-length vectors.\"></i><i style=\"width:91.1%\" title=\"Embeddings enable semantic search by finding documents with similar meaning, not just keyword matches.\"></i><i style=\"width:68.8%\" title=\"They also power recommendation systems, clustering, and classification tasks.\"></i></div></div><div class=\"doc\" ><div class=\"lines \"><i style=\"width:100.0%\" title=\"Recent models like OpenAI&#x27;s text-embedding-ada and Cohere&#x27;s embedding models offer state-of-the-art performance.\"></i><i style=\"width:68.8%\" title=\"Neural networks are computing systems inspired by biological neural networks.\"></i><i style=\"width:90.2%\" title=\"The perceptron, developed by Frank Rosenblatt in 1958, was one of the earliest neural network models.\"></i><i style=\"width:69.6%\" title=\"Modern neural networks consist of layers of interconnected nodes or &quot;neurons.&quot;\"></i><i style=\"width:58.0%\" title=\"Each connection can transmit a signal from one neuron to another.\"></i><i style=\"width:79.5%\" title=\"The receiving neuron processes the signal and signals downstream neurons connected to it.\"></i><i style=\"width:75.0%\" title=\"Deep neural networks contain multiple hidden layers between input and output layers.\"></i><i style=\"width:61.6%\" title=\"Convolutional Neural Networks (CNNs) revolutionized image processing.\"></i></div></div><div class=\"doc\" ><div class=\"lines \"><i style=\"width:87.5%\" title=\"Recurrent Neural Networks (RNNs) and transformers handle sequential data like text or time series.\"></i><i style=\"width:65.2%\" title=\"Artificial Intelligence (AI) has a rich history dating back to the 1950s.\"></i><i style=\"width:70.5%\" title=\"The term was first coined by John McCarthy in 1956 at the Dartmouth Conference.\"></i><i style=\"width:61.6%\" title=\"Early AI research focused on symbolic methods and rule-based systems.\"></i><i style=\"width:58.9%\" title=\"In the 1980s, expert systems became popular but faced limitations.\"></i><i style=\"width:66.1%\" title=\"The 1990s and early 2000s saw a shift towards machine learning approaches.\"></i><i style=\"width:82.1%\" title=\"The deep learning revolution began around 2012 with breakthrough results in computer vision.\"></i><i style=\"width:85.7%\" title=\"Today, large language models like GPT, LLaMA, and Gemini represent cutting-edge AI capabilities.\"></i></div></div><div class=\"doc\" ><div class=\"lines \"><i style=\"width:82.1%\" title=\"These models are trained on vast amounts of text data and can generate human-like responses.\"></i><i style=\"width:72.3%\" title=\"Embeddings are dense vector representations of data in a continuous vector space.\"></i><i style=\"width:78.6%\" title=\"Word embeddings map words to vectors where similar words are positioned closer together.\"></i><i style=\"width:64.3%\" title=\"Popular word embedding techniques include Word2Vec, GloVe, and FastText.\"></i><i style=\"width:77.7%\" title=\"Sentence embeddings capture meaning at the sentence level rather than individual words.\"></i><i style=\"width:75.9%\" title=\"Models like Universal Sentence Encoder and SBERT create powerful sentence embeddings.\"></i><i style=\"width:63.4%\" title=\"Document embeddings represent entire documents as fixed-length vectors.\"></i><i style=\"width:91.1%\" title=\"Embeddings enable semantic search by finding documents with similar meaning, not just keyword matches.\"></i></div></div></div><p class=\"cap\">Example: the whole file fits, but faded details get missed.</p></div>",init:"initWindow"},
{label:"Three Problems",eyebrow:"The problem",html:"<h2 class=\"title\">Too Much, Too Little, or Only Exact <span class=\"hl\">Words</span></h2><p class=\"why\">Each problem gives a worse answer, so your pipeline has to avoid all three.</p><p class=\"p\">Without the right techniques, this leads to problems:</p><ul class=\"ul\"><li><b>Too much text:</b> The AI reads irrelevant information and gives vague or incorrect answers.</li><li><b>Too little text:</b> It misses key details and gives incomplete responses.</li><li><b>Basic keyword search:</b> It only finds exact matches, not meaningfully related information.</li></ul><p class=\"p\">This is where <b>embeddings</b> (and soon, <b>chunking</b>) come in.</p><div class=\"row\"><div class=\"nwrap\"><div class=\"sw\" role=\"group\" aria-label=\"Choose a problem\"><button type=\"button\" data-view=\"much\" aria-pressed=\"true\">Too much</button><button type=\"button\" data-view=\"little\" aria-pressed=\"false\">Too little</button><button type=\"button\" data-view=\"key\" aria-pressed=\"false\">Keyword search</button></div></div></div><div class=\"viz\" id=\"c2-viz\"></div>",init:"initThree"},
{label:"Embeddings",eyebrow:"Embeddings",html:"<h2 class=\"title\">Embeddings Turn Meaning Into <span class=\"hl\">Numbers</span></h2><p class=\"why\">This is how your pipeline matches meaning.</p><p class=\"p\">You already met embeddings in Step 1. Embeddings are how AI understands <b>meaning</b> rather than just matching <b>words</b>.</p><p class=\"p\">Instead of storing \"expiration date\" or \"test method\" as plain text, AI turns those phrases into <b>meaningful numeric representations</b>, kind of like location pins on a giant map of ideas.</p><ul class=\"ul\"><li>Two similar ideas: their vectors (number strings) are <b>close together</b>.</li><li>Completely different ideas: their vectors are <b>far apart</b>.</li></ul><div class=\"viz\" id=\"c3-viz\"><div class=\"scale\" id=\"c3-scale\"><span class=\"track\"></span><span class=\"tk\" style=\"left:0\">0</span><span class=\"tk\" style=\"left:100%\">1</span></div><p class=\"pair\" id=\"c3-pair\"></p><p class=\"cap\">Score near 1: close in meaning. Near 0: unrelated.</p></div>",init:"initPins"},
{label:"King and Queen",eyebrow:"Embeddings",html:"<h2 class=\"title\">King and Queen Sit Close, Apple Sits Far <span class=\"hl\">Away</span></h2><p class=\"why\">This tiny example is how every embedding search decides what's related.</p><div class=\"plot\"><div class=\"tbl \"><table><thead><tr><th scope=\"col\">Word</th><th scope=\"col\">Possible Embedding (Simplified)</th></tr></thead><tbody><tr><td class=\"k\">King</td><td><span class=\"mono\">[0.95, 0.12, 0.88]</span></td></tr><tr><td class=\"k\">Queen</td><td><span class=\"mono\">[0.94, 0.10, 0.87]</span></td></tr><tr><td class=\"k\">Apple</td><td><span class=\"mono\">[0.01, 0.99, 0.23]</span></td></tr></tbody></table></div><svg viewBox=\"0 0 220 152\" aria-hidden=\"true\"><line class=\"gd\" x1=\"30\" y1=\"67.5\" x2=\"190\" y2=\"67.5\"/><line class=\"gd\" x1=\"110.0\" y1=\"120\" x2=\"110.0\" y2=\"15\"/><line class=\"gd\" x1=\"30\" y1=\"15\" x2=\"190\" y2=\"15\"/><line class=\"gd\" x1=\"190\" y1=\"120\" x2=\"190\" y2=\"15\"/><line class=\"ax\" x1=\"30\" y1=\"120\" x2=\"190\" y2=\"120\"/><line class=\"ax\" x1=\"30\" y1=\"120\" x2=\"30\" y2=\"15\"/><text class=\"n\" x=\"26\" y=\"134\">0</text><text class=\"n\" x=\"187\" y=\"134\">1</text><text class=\"n\" x=\"16\" y=\"19\">1</text><circle class=\"dot \" cx=\"182.0\" cy=\"107.4\" r=\"5\"/><text x=\"144.0\" y=\"101.4\">King</text><circle class=\"dot \" cx=\"180.4\" cy=\"109.5\" r=\"5\"/><text x=\"189.4\" y=\"113.5\">Queen</text><circle class=\"dot far\" cx=\"31.6\" cy=\"16.0\" r=\"5\"/><text x=\"41.6\" y=\"20.0\">Apple</text></svg></div><ul class=\"ul\"><li>Notice how <b>King &amp; Queen</b> have similar embeddings? That's because they're <b>semantically related</b>, in other words, they refer to related concepts and are often used in similar contexts, like both being types of royalty.</li><li><b>Apple</b> is totally different: it belongs to another category.</li></ul><p class=\"cap\">The picture plots the first two numbers of each list.</p>",init:null},
{label:"Meaning Search",eyebrow:"Embeddings",html:"<h2 class=\"title\">Search by Meaning Finds What Keywords <span class=\"hl\">Miss</span></h2><p class=\"why\">This is why a RAG pipeline can answer questions worded differently from the file.</p><p class=\"p\">Now imagine this applied to your documents. A user might ask:</p><p class=\"quote\">\"What's the <span class=\"mk\" id=\"c5-q\">expiration date</span> for this batch?\"</p><p class=\"p\">The document might say:</p><p class=\"quote\">\"Batch LOT-2024-0892 <span class=\"mk\" id=\"c5-d\">expires</span> 20260315.\"</p><p class=\"p\">With just a keyword search, the AI might miss this. But with <b>embeddings</b>, it understands that \"expiration date\" and \"expires\" are conceptually related.</p><div class=\"row\"><div class=\"nwrap\"><div class=\"sw\" role=\"group\" aria-label=\"Choose a search\"><button type=\"button\" data-view=\"k\" aria-pressed=\"true\">Keyword search</button><button type=\"button\" data-view=\"m\" aria-pressed=\"false\">Search by meaning</button></div></div></div><div class=\"viz\" id=\"c5-viz\"><p class=\"cap\" id=\"c5-cap\"></p></div>",init:"initMeaning"},
{label:"Models",eyebrow:"Embedding models",html:"<h2 class=\"title\">Embedding Models Make the Numbers for <span class=\"hl\">You</span></h2><p class=\"why\">Your notebook uses one of these, so you never build one yourself.</p><p class=\"p\">Now that you know what embeddings are, numeric representations of meaning, you might be wondering: <i>How are they created?</i></p><p class=\"p\">That's where <b>embedding models</b> come in. These models are like smart compressors. You can think of them as compact, pre-trained tools that turn everyday language into math that the AI can understand.</p><p class=\"p\">You don't need to build these models from scratch. They're <b>already trained</b> on massive datasets (huge collections of text) and ready to use right out of the box.</p><div class=\"viz\"><div class=\"flow\"><div class=\"fbox\" title=\"Embeddings transform words into numerical vectors that capture meaning.\"><span class=\"ft\">Your text</span></div><span class=\"arr\" aria-hidden=\"true\">&rarr;</span><div class=\"fbox on\" style=\"flex:0 0 auto\"><span class=\"ft\">MiniLM</span></div><span class=\"arr\" aria-hidden=\"true\">&rarr;</span><div class=\"fbox\" style=\"flex:1.6 1 0\"><span class=\"fl\">384 numbers</span><span class=\"vec\">-0.0011, -0.0303, 0.0512, -0.0370, 0.0163, ...</span></div></div></div>",init:null},
{label:"Well-Known Models",eyebrow:"Embedding models",html:"<h2 class=\"title\">A Few Well-Known Embedding <span class=\"hl\">Models</span></h2><p class=\"why\">Knowing the common choices helps you pick a model for your own pipeline.</p><p class=\"p\">Here are a few well-known models and what they're good at:</p><div class=\"tbl \"><table><thead><tr><th scope=\"col\">Model</th><th scope=\"col\">What It's Great For</th></tr></thead><tbody><tr><td><span class=\"mono\">all-MiniLM-L6-v2</span> <span class=\"tag\">Your notebook</span></td><td>Fast, lightweight, and reliable for everyday retrieval tasks</td></tr><tr><td><span class=\"mono\">text-embedding-3-small</span> (by OpenAI)</td><td>High-quality embeddings for meaning-based searches</td></tr><tr><td><span class=\"mono\">bge-base-en-v1.5</span></td><td>Fine-tuned for search precision, great when accuracy matters</td></tr><tr><td><span class=\"mono\">intfloat/e5-small</span></td><td>Designed for pairing questions with relevant answers</td></tr></tbody></table></div><p class=\"p\">Each of these models helps your AI <b>\"read between the lines\"</b> and understand <b>what people <i>mean</i></b>, not just what they <i>say</i>.</p><p class=\"p\">You already know MiniLM from Step 1: it's the one your notebooks use.</p>",init:null},
{label:"Chunking",eyebrow:"Chunking",html:"<h2 class=\"title\">Chunking Splits a Long Document Into <span class=\"hl\">Pieces</span></h2><p class=\"why\">Before a pipeline can embed a long document, it has to cut it into pieces.</p><p class=\"p\">Before AI can even create embeddings, it faces another big challenge: <b>How do you feed a huge document into the AI without overwhelming it?</b></p><p class=\"p\">That's the job for <b>chunking</b>.</p><p class=\"p\">Here, you'll learn how to <b>break down long documents into smaller, meaningful pieces</b>. You'll explore different chunking strategies, why chunk size matters, and how smart chunking helps AI find exactly what it needs, without getting lost in a sea of text.</p><div class=\"row\"><div class=\"nwrap\"><button type=\"button\" class=\"btn-play\" id=\"c8-play\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M4 2.5v11l9-5.5z\" fill=\"currentColor\"/></svg>Cut them like your notebook</button></div></div><div class=\"viz\" id=\"c8-viz\"><div class=\"docs\" id=\"c8-docs\"></div><p class=\"cap\" id=\"c8-cap\"></p></div>",init:"initCut"},
{label:"Small Pieces",eyebrow:"Chunking",html:"<h2 class=\"title\">Small Pieces Help the AI Find Only What <span class=\"hl\">Matters</span></h2><p class=\"why\">Chunking is what lets your pipeline hand Gemini one useful piece instead of a whole file.</p><p class=\"p\">Chunking is exactly what it sounds like: <b>breaking a long document into smaller, more manageable pieces</b>.</p><p class=\"p\">Instead of treating the document as one giant block of text, chunking ensures that AI can process it in <b>bite-sized sections</b> and retrieve only the most relevant parts.</p><p class=\"p\">Here's why chunking is important:</p><ul class=\"ul\"><li>If AI retrieves <b>huge blocks of text</b>, you have to dig through a bunch of irrelevant information.</li><li>If AI retrieves <b>only the most relevant sections</b>, you get precise, useful answers.</li></ul><div class=\"viz\"><div class=\"docs\"><div class=\"doc\"><span class=\"fn\">ai_history.txt</span><div class=\"lines\"><i class=\"on\" style=\"width:65.2%\"></i><i class=\"on\" style=\"width:70.5%\"></i><i class=\"on\" style=\"width:61.6%\"></i><i class=\"on\" style=\"width:58.9%\"></i><i class=\"on\" style=\"width:66.1%\"></i><i class=\"\" style=\"width:82.1%\"></i><i class=\"\" style=\"width:85.7%\"></i><i class=\"\" style=\"width:82.1%\"></i></div></div><span class=\"arr\" aria-hidden=\"true\">&rarr;</span><div class=\"doc\"><span class=\"fn\">&nbsp;</span><div class=\"lines piece\"><span class=\"ck\">Chunk 1</span><i class=\"on\" style=\"width:65.2%\"></i><i class=\"on\" style=\"width:70.5%\"></i><i class=\"on\" style=\"width:61.6%\"></i><i class=\"on\" style=\"width:58.9%\"></i><i class=\"on\" style=\"width:66.1%\"></i></div></div></div></div>",init:null},
{label:"Hiking",eyebrow:"Chunking",html:"<h2 class=\"title\">Example: A Hiking Article in Four <span class=\"hl\">Chunks</span></h2><p class=\"why\">One question, one chunk: that's the goal of every split.</p><p class=\"p\"><b>Example of Chunking:</b></p><p class=\"p\">Imagine you have a <b>1,000-word article</b> on hiking gear. Instead of feeding the whole article into an AI model, it gets split into smaller \"chunks,\" like this:</p><div class=\"viz\"><ol class=\"steps static\" id=\"c10-list\"><li><div class=\"step\" data-k=\"0\"><span class=\"n\">1</span><span>Chunk 1 (Intro to Hiking Gear, 150 words)<span class=\"szb\" style=\"width:60%\"></span></span></div></li><li><div class=\"step\" data-k=\"1\"><span class=\"n\">2</span><span>Chunk 2 (Backpacks &amp; Features, 200 words)<span class=\"szb\" style=\"width:80%\"></span></span></div></li><li><div class=\"step\" data-k=\"2\"><span class=\"n\">3</span><span>Chunk 3 (Hiking Boots &amp; Materials, 250 words)<span class=\"szb\" style=\"width:100%\"></span></span></div></li><li><div class=\"step\" data-k=\"3\"><span class=\"n\">4</span><span>Chunk 4 (Rain Gear &amp; Weather Considerations, 180 words)<span class=\"szb\" style=\"width:72%\"></span></span></div></li></ol></div><p class=\"p\">If you ask, <i>\"What's the best hiking boot material?\"</i>, AI searches the hiking boots chunk rather than the whole document.</p><div class=\"row\"><div class=\"nwrap\"><button type=\"button\" class=\"btn-play\" id=\"c10-ask\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M4 2.5v11l9-5.5z\" fill=\"currentColor\"/></svg>Ask the question</button></div></div>",init:"initHike"},
{label:"Chunk Size",eyebrow:"Chunk size",html:"<h2 class=\"title\">Chunk Size Is a Trade-<span class=\"hl\">Off</span></h2><p class=\"why\">Every split starts with a size.</p><p class=\"p\">Choosing the right <b>chunk size</b> (how big each piece is, counted in tokens: words or parts of words) is a trade-off between <b>context retention</b> (keeping nearby text) and <b>retrieval precision</b> (finding only what's relevant). Here's how different sizes impact AI performance:</p><div class=\"tbl pc\"><table><thead><tr><th scope=\"col\">Chunk Size</th><th scope=\"col\">Pros</th><th scope=\"col\">Cons</th></tr></thead><tbody><tr><td class=\"k\">Small Chunks<br>(50-200 tokens)<span class=\"szb\" style=\"width:25%\"></span></td><td>Precise, faster retrieval, avoids irrelevant data</td><td>May lose important context, leading to incomplete answers</td></tr><tr><td class=\"k\">Medium Chunks<br>(200-500 tokens)<span class=\"szb\" style=\"width:60%\"></span></td><td>Best balance of precision &amp; context retention</td><td>Requires careful tuning for best results</td></tr><tr><td class=\"k\">Large Chunks<br>(500+ tokens)<span class=\"szb\" style=\"width:100%\"></span></td><td>Preserves more context, reducing loss of meaning</td><td>Slower retrieval, may contain too much irrelevant text</td></tr></tbody></table></div>",init:null},
{label:"Document Types",eyebrow:"Chunk size",html:"<h2 class=\"title\">Bigger Chunks for Dense Documents, Smaller for Quick <span class=\"hl\">Answers</span></h2><p class=\"why\">Your choice depends on what the documents are and what people ask.</p><p class=\"p\">Different document types and AI applications need different chunk sizes.</p><ul class=\"ul\"><li>Legal and medical documents: Larger chunks to retain meaning.</li><li>Quick Q&amp;A chatbots: Smaller chunks for fast, focused answers.</li></ul><p class=\"p\">In short:</p><ul class=\"ul\"><li><b>Small chunks</b> = precise but might lack context.</li><li><b>Big chunks</b> = more context, but slower and messier.</li><li><b>Medium chunks</b> = usually the best trade-off, but still requires tuning.</li></ul><div class=\"viz\"><div class=\"bars\"><div class=\"bar\"><span>Chunk size 100</span><span class=\"bt\" style=\"width:100%\">6 chunks</span></div><div class=\"bar\"><span>Chunk size 300</span><span class=\"bt\" style=\"width:50%\">3 chunks</span></div><div class=\"bar\"><span>Chunk size 500</span><span class=\"bt\" style=\"width:50%\">3 chunks</span></div></div><p class=\"cap\">Your notebook's run: sizes 300 and 500 keep each file whole.</p></div>",init:null},
{label:"Fixed-Size",eyebrow:"Different ways to chunk",html:"<h2 class=\"title\">Strategy 1: Fixed-Size <span class=\"hl\">Chunking</span></h2><p class=\"why\">The simplest split. Your notebook (STEP 4) tries to end chunks at sentence ends.</p><p class=\"p\">Not all chunking strategies are created equal. The <b>right method depends on your data type</b> and how AI will retrieve information.</p><p class=\"p\">This method just splits the text into <b>equal-sized pieces</b>, no matter where sentences or topics start and end. Divides text into equal-sized chunks (e.g., every 300 tokens), regardless of meaning.</p><div class=\"tbl pc\"><table><thead><tr><th scope=\"col\">Pros</th><th scope=\"col\">Cons</th></tr></thead><tbody><tr><td><b>Easy to implement:</b> No extra processing needed</td><td>May <b>cut off sentences</b> mid-way</td></tr><tr><td>Works well for structured text</td><td>Context is not <b>preserved naturally</b></td></tr></tbody></table></div><p class=\"p\"><b>Best for: News articles, structured documents with uniform text flow.</b></p><div class=\"viz\"><span class=\"ex\">Example: a cut every 20 words</span><div class=\"words\" aria-hidden=\"true\"><i class=\"\" style=\"width:46px\"></i><i class=\"\" style=\"width:54px\"></i><i class=\"\" style=\"width:21px\"></i><i class=\"\" style=\"width:17px\"></i><i class=\"\" style=\"width:8px\"></i><i class=\"\" style=\"width:21px\"></i><i class=\"\" style=\"width:33px\"></i><i class=\"\" style=\"width:29px\"></i><i class=\"\" style=\"width:21px\"></i><i class=\"\" style=\"width:12px\"></i><i class=\"\" style=\"width:17px\"></i><i class=\"end\" style=\"width:29px\"></i><i class=\"\" style=\"width:17px\"></i><i class=\"\" style=\"width:21px\"></i><i class=\"\" style=\"width:17px\"></i><i class=\"\" style=\"width:25px\"></i><i class=\"\" style=\"width:29px\"></i><i class=\"\" style=\"width:12px\"></i><i class=\"\" style=\"width:21px\"></i><i class=\"\" style=\"width:38px\"></i><span class=\"wc\"></span><i class=\"\" style=\"width:12px\"></i><i class=\"\" style=\"width:21px\"></i><i class=\"\" style=\"width:12px\"></i><i class=\"\" style=\"width:17px\"></i><i class=\"\" style=\"width:42px\"></i><i class=\"end\" style=\"width:50px\"></i><i class=\"\" style=\"width:25px\"></i><i class=\"\" style=\"width:12px\"></i><i class=\"\" style=\"width:38px\"></i><i class=\"\" style=\"width:33px\"></i><i class=\"\" style=\"width:12px\"></i><i class=\"\" style=\"width:38px\"></i><i class=\"\" style=\"width:33px\"></i><i class=\"\" style=\"width:17px\"></i><i class=\"\" style=\"width:46px\"></i><i class=\"end\" style=\"width:38px\"></i><i class=\"\" style=\"width:12px\"></i><i class=\"\" style=\"width:17px\"></i><i class=\"\" style=\"width:29px\"></i><i class=\"\" style=\"width:29px\"></i></div></div>",init:null},
{label:"Overlapping",eyebrow:"Different ways to chunk",html:"<h2 class=\"title\">Strategy 2: Overlapping <span class=\"hl\">Chunking</span></h2><p class=\"why\">Overlap stops an answer from being split across two pieces.</p><p class=\"p\">Instead of clean breaks, this method <b>overlaps chunks slightly</b> to make sure important context isn't lost.</p><div class=\"tbl pc\"><table><thead><tr><th scope=\"col\">Pros</th><th scope=\"col\">Cons</th></tr></thead><tbody><tr><td>Helps AI retain context</td><td>Uses more storage (some text gets indexed twice)</td></tr><tr><td>Improves accuracy for retrieving relevant text</td><td>Needs fine-tuning to get the overlap right</td></tr></tbody></table></div><p class=\"p\"><b>Example:</b> If chunk 1 ends at sentence 10, chunk 2 might start from sentence 9, ensuring continuity.</p><p class=\"p\"><b>Best for: Research papers, policy documents.</b></p><div class=\"viz\"><div class=\"docs\"><div class=\"doc\"><span class=\"fn\">Chunk 1</span><div class=\"lines\"><i class=\"\" style=\"width:65.2%\"></i><i class=\"\" style=\"width:70.5%\"></i><i class=\"\" style=\"width:61.6%\"></i><i class=\"\" style=\"width:58.9%\"></i><i class=\"ans\" style=\"width:66.1%\"></i></div></div><div class=\"doc\"><span class=\"fn\">Chunk 2</span><div class=\"lines\"><i class=\"ans\" style=\"width:66.1%\"></i><i class=\"\" style=\"width:82.1%\"></i><i class=\"\" style=\"width:85.7%\"></i><i class=\"\" style=\"width:82.1%\"></i></div></div></div><p class=\"cap\">Your notebook's STEP 5: both chunks hold <b>\"The 1990s and early 2000s saw a shift towards machine learning approaches.\"</b></p></div>",init:null},
{label:"Why Overlap",eyebrow:"Different ways to chunk",html:"<h2 class=\"title\">Overlap Keeps the Whole Rule <span class=\"hl\">Together</span></h2><p class=\"why\">Here's what a missing overlap looks like in an answer.</p><p class=\"p\"><b>Why This Helps</b></p><p class=\"p\">Without overlap, an AI <b>might miss key context</b> when responding to queries.</p><ul class=\"ul\"><li><b>Without overlap</b>: \"The new policy applies to...\" AI doesn't retrieve the earlier part of the rule.</li><li><b>With overlap</b>: \"The new policy applies to all employees starting next quarter.\" AI gets the full context.</li></ul><div class=\"row\"><div class=\"nwrap\"><div class=\"sw\" role=\"group\" aria-label=\"Choose a split\"><button type=\"button\" data-view=\"no\" aria-pressed=\"true\">Without overlap</button><button type=\"button\" data-view=\"yes\" aria-pressed=\"false\">With overlap</button></div></div></div><div class=\"viz\" id=\"c15-viz\"></div>",init:"initOverlap"},
{label:"Semantic",eyebrow:"Different ways to chunk",html:"<h2 class=\"title\">Strategy 3: Semantic <span class=\"hl\">Chunking</span></h2><p class=\"why\">This split follows the meaning, and it's the third one your notebook runs.</p><p class=\"p\">Instead of using word count, this method identifies natural topic breaks using embeddings.</p><p class=\"p\">Think of it like a book's table of contents: <b>it splits text where the topic naturally changes</b> instead of after an exact number of words.</p><div class=\"tbl pc\"><table><thead><tr><th scope=\"col\">Pros</th><th scope=\"col\">Cons</th></tr></thead><tbody><tr><td>Preserves full meaning</td><td>Takes more processing power</td></tr><tr><td>Best for unstructured text (like legal docs or books)</td><td>Requires AI to analyze content before splitting</td></tr></tbody></table></div><p class=\"p\"><b>Best for: Long-form text like books, Wikipedia pages, and technical manuals.</b></p><div class=\"viz\"><div class=\"docs\"><div class=\"doc\"><span class=\"fn\">Fixed (STEP 4)</span><div class=\"lines\"><i class=\"on\" style=\"width:65.2%\"></i><i class=\"on\" style=\"width:70.5%\"></i><i class=\"on\" style=\"width:61.6%\"></i><i class=\"on\" style=\"width:58.9%\"></i><i class=\"on\" style=\"width:66.1%\"></i><i class=\"dim\" style=\"width:82.1%\"></i><i class=\"dim\" style=\"width:85.7%\"></i><i class=\"dim\" style=\"width:82.1%\"></i></div></div><div class=\"doc\"><span class=\"fn\">Semantic (STEP 6)</span><div class=\"lines\"><i class=\"on\" style=\"width:65.2%\"></i><i class=\"on\" style=\"width:70.5%\"></i><i class=\"on\" style=\"width:61.6%\"></i><i class=\"on\" style=\"width:58.9%\"></i><i class=\"dim\" style=\"width:66.1%\"></i><i class=\"dim\" style=\"width:82.1%\"></i><i class=\"dim\" style=\"width:85.7%\"></i><i class=\"dim\" style=\"width:82.1%\"></i></div></div></div><p class=\"cap\">The semantic chunk stops a line earlier.</p></div>",init:null},
{label:"Recursive",eyebrow:"For structured documents",html:"<h2 class=\"title\">Strategy 4: Recursive <span class=\"hl\">Chunking</span></h2><p class=\"why\">Documents with headings, like reports, can be split along those headings.</p><p class=\"p\"><b>How It Works</b></p><ol class=\"ul\"><li><b>First, split the text by headings</b> (H1, H2, etc.: heading levels, like a title and a subtitle).</li><li><b>Then, break down each section into smaller chunks</b> for better retrieval.</li></ol><p class=\"p\">Think of it like organizing a report: first, divide it into <b>chapters</b> (big sections). Then, split those into <b>paragraphs</b> (smaller, focused chunks).</p><div class=\"tbl pc\"><table><thead><tr><th scope=\"col\">Pros</th><th scope=\"col\">Cons</th></tr></thead><tbody><tr><td>Keeps the document's structure intact, making retrieval more precise</td><td>Requires clear headings or metadata to work</td></tr><tr><td>Works well for reports with clear headings</td><td>Not ideal for unstructured text</td></tr></tbody></table></div><p class=\"p\"><b>Best for: Business reports and PDF reports.</b></p><div class=\"vrow\" style=\"flex-wrap:nowrap;align-items:flex-start\"><div class=\"row\" style=\"flex:none\"><div class=\"nwrap\"><button type=\"button\" class=\"btn-play\" id=\"c17-play\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M4 2.5v11l9-5.5z\" fill=\"currentColor\"/></svg>Split it</button></div></div><div class=\"viz\" id=\"c17-viz\" style=\"flex:1\"></div></div>",init:"initRecursive"},
{label:"Size and Strategy",eyebrow:"Choosing",html:"<h2 class=\"title\">Choosing the Right Chunk Size and <span class=\"hl\">Strategy</span></h2><p class=\"why\">The right size sits between too little and too much.</p><p class=\"p\"><b>Why Does Chunk Size Matter?</b> Imagine trying to search a dictionary that only gives you one word at a time vs. one that gives you entire pages of related words. The right balance makes retrieval accurate &amp; efficient.</p><div class=\"viz dict\"><div class=\"box white\"><p class=\"bp\">One word at a time</p></div><div class=\"box on\"><p class=\"bh\">The right balance</p></div><div class=\"box white\"><p class=\"bp\">Entire pages</p></div></div><p class=\"take\"><b>Key Takeaway:</b> The right chunking approach depends on the document type: structured text benefits from simple chunking, while complex documents need advanced strategies.</p>",init:null},
{label:"Match",eyebrow:"Choosing",html:"<h2 class=\"title\">Match the Strategy to the <span class=\"hl\">Document</span></h2><p class=\"why\">Each document type has a strategy that fits it best.</p><p class=\"p\"><b>How to Determine the Best Chunking Approach?</b></p><div class=\"tbl \"><table><thead><tr><th scope=\"col\">Document Type</th><th scope=\"col\">Best Chunking Strategy</th><th scope=\"col\">Reason</th></tr></thead><tbody><tr><td class=\"k\">News Articles</td><td><span class=\"sn\" aria-hidden=\"true\">1</span>Fixed-Length Chunking</td><td>Consistent structure, no need for deep context preservation</td></tr><tr><td class=\"k\">Legal Contracts</td><td><span class=\"sn\" aria-hidden=\"true\">3</span>Semantic Chunking</td><td>Requires logical section breaks to preserve legal clauses</td></tr><tr><td class=\"k\">Research Papers</td><td><span class=\"sn\" aria-hidden=\"true\">2</span>Overlapping Chunking</td><td>Ensures key points aren't split across chunks</td></tr><tr><td class=\"k\">PDF Reports</td><td><span class=\"sn\" aria-hidden=\"true\">4</span>Recursive Chunking</td><td>Maintains structure by using headings before chunking</td></tr></tbody></table></div>",init:null},
{label:"Why It Matters",eyebrow:"AI-powered search",html:"<h2 class=\"title\">Why This Matters for AI-Powered <span class=\"hl\">Search</span></h2><p class=\"why\">Good chunking returns the answer, not the whole page.</p><p class=\"p\">Let's say a pharmaceutical company is using AI to answer quality questions about their products.</p><p class=\"p\">A quality analyst asks: <i>\"What test method was used for sterilization?\"</i></p><ul class=\"ul\"><li>If the document <b>isn't chunked properly</b>, AI might return an entire page of technical data, forcing the analyst to dig through it.</li><li>With <b>smart chunking</b>, AI can grab just the <b>one paragraph that actually answers the question</b>.</li></ul><p class=\"p\">This makes AI-powered tools way more efficient in pharmaceuticals, healthcare, compliance, and any field where documents are long and complex.</p><div class=\"row\"><div class=\"nwrap\"><div class=\"sw\" role=\"group\" aria-label=\"Choose a view\"><button type=\"button\" data-view=\"not\" aria-pressed=\"true\">Not chunked</button><button type=\"button\" data-view=\"ch\" aria-pressed=\"false\">Chunked</button></div></div></div><div class=\"viz\" id=\"c19-viz\"></div>",init:"initChunked"},
{label:"Recap",eyebrow:"Quick recap",html:"<h2 class=\"title\">Quick Recap: Embeddings and <span class=\"hl\">Chunking</span> (1 of 2)</h2><p class=\"why\">The problem, and the fix.</p><div class=\"recap\"><div class=\"box\"><p class=\"bh\">1. Why AI Struggles with Long Documents</p><ul><li>AI models have a fixed memory window and can miss details in long documents.</li><li>Too much text: AI includes irrelevant details, making responses vague.</li><li>Too little text: AI misses key details, leading to incomplete answers.</li><li>Keyword search limitations: AI finds exact matches but may miss related concepts.</li></ul></div><div class=\"box\"><p class=\"bh\">2. How to Fix It: Embeddings &amp; Chunking</p><ul><li><b>Embeddings:</b> AI understands meaning, not just keywords (e.g., \"sterilization\" &asymp; \"autoclave processing\"). &asymp; means \"about the same\". Autoclave processing: sterilizing with high-pressure steam.</li><li><b>Chunking:</b> Splits long documents into smaller, searchable sections, ensuring AI retrieves only relevant parts.</li></ul></div></div>",init:null},
{label:"Recap 2",eyebrow:"Quick recap",html:"<h2 class=\"title\">Quick Recap: Embeddings and <span class=\"hl\">Chunking</span> (2 of 2)</h2><p class=\"why\">Pick the chunking method that fits the document you're splitting.</p><div class=\"box\"><p class=\"bp\"><b>What Creates Embeddings?</b> Embedding models like <span class=\"mono\">MiniLM</span>, <span class=\"mono\">text-embedding-3</span>, and <span class=\"mono\">BGE</span> generate these numeric representations from text.</p></div><p class=\"p\"><b>3. Best Chunking Methods for Different Documents</b></p><div class=\"two\"><div class=\"box white\"><p class=\"bp\"><span class=\"sn\" aria-hidden=\"true\">1</span><b>Fixed-Length Chunking:</b> Simple but may break context.</p></div><div class=\"box white\"><p class=\"bp\"><span class=\"sn\" aria-hidden=\"true\">2</span><b>Overlapping Chunking:</b> Retains more context but uses extra storage.</p></div><div class=\"box white\"><p class=\"bp\"><span class=\"sn\" aria-hidden=\"true\">3</span><b>Semantic Chunking:</b> Best for meaning but requires processing.</p></div><div class=\"box white\"><p class=\"bp\"><span class=\"sn\" aria-hidden=\"true\">4</span><b>Recursive Chunking:</b> Maintains document structure (great for structured reports).</p></div></div><p class=\"take\"><b>Key Takeaway:</b> AI-powered search works best when documents are <b>properly chunked</b> and <b>indexed using embeddings</b>, ensuring <b>precise, context-aware answers</b>.</p>",init:null}];
  var END_LABEL = "Done";

  var i = 0;
  var app = $("app"), rail = $("rail"), stage = $("stage"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the cards. Scroll down to the next part of this reading.";

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }

  /* Spacing (from P3 module 9 and P4): spare height widens the gaps between blocks, up to 2x. */
  var GAP = 12;
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = GAP + "px"; inner.style.marginTop = "";
    var cs = getComputedStyle(stage);
    var avail = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (GAP + Math.min(GAP, spare / gaps)) + "px";
    /* Fix round 2 (as the Steps deck): what is still spare after the gaps widen is split above and below, so a short
       card sits in the middle of the stage instead of leaving one big empty area at the bottom */
    var left = avail - inner.offsetHeight;
    if (left > 1) inner.style.marginTop = Math.floor(left / 2) + "px";
  }

  CARDS.forEach(function (c, n) {
    if (typeof c.init === "string") c.init = INITS[c.init];
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + c.label);
    b.innerHTML = '<span class="seg"></span>';
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function titleOf(n) { var m = CARDS[n].html.match(/<h2[^>]*>(.*?)<\/h2>/); return m ? m[1].replace(/<[^>]+>/g, "") : ""; }

  function render(anim) {
    if (timer) { clearInterval(timer); timer = null; }
    var c = CARDS[i];
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.eyebrow + '</p>' + c.html + '</div>';
    each(rail.children, function (b, n) {
      b.classList.toggle("is-cur", n === i);
      b.classList.toggle("is-done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("where-count").textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + titleOf(i + 1) + "</b>";
    donemsg.textContent = "";
    if (c.init) c.init(card);
    space();
    each(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  function go(n) { if (n < 0 || n >= CARDS.length || n === i) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i === CARDS.length - 1) {
      donemsg.textContent = DONE_MSG;
      space();
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "extern-deck-done" }, "*");
      return;
    }
    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.closest && e.target.closest(".sw, .steps")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #card=N opens a card directly */
  var m = location.hash.match(/card=(\d+)/);
  if (m) { i = Math.min(CARDS.length - 1, Math.max(0, +m[1] - 1)); }
  window.addEventListener("resize", function () { fit(); });
  fit();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
</body>
</html>
