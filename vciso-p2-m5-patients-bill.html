<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Patient's Bill at Cumberland</title>
<!--
  vCISO P2 Step 2, Module 5: Follow the Data.
  Built from the Extern deck shell (.claude/skills/build-html-slides/assets/deck-shell.html).
  Governing authority: output/programs/vciso/CLAUDE.md section 6 and
  VCISO-STYLE-GUIDE.md section 6, which set the larger type scale and the
  per-slide tint ramp used here (09-assets/deck-palette.json).

  Verify before shipping, both gates, every time:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs   this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  /* ===============================================================
     The palette. The Extern five, plus the vCISO per-slide tint ramp
     (VCISO-STYLE-GUIDE.md 6b, listed in 09-assets/deck-palette.json).
     Tint carries no meaning. Every tint of navy is an rgba() of
     #001D69. No state is ever signalled by colour alone: every
     coloured state also carries a glyph, a border shape or a label.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, borders, fills      */
    --bg:#FDF8F8;           /* canvas background, and text on navy */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;    /* UI feedback: hover, press, focus, select */
    --t-frame:300ms;   /* movement between slides                  */
    --t-reveal:560ms;  /* a value or an answer resolving           */
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);  /* the slight overshoot */
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    /* System stack, no webfont. */
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t3{background:#F2E3D2}

  /* ---- the 960x540 canvas, scaled down only, never up. flex:0 0 auto is
         load bearing: the canvas holds 960 in layout and the transform does
         all of the fitting. ---- */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr;gap:18px}
  .col{min-width:0;min-height:0;display:flex;flex-direction:column}

  .lead{flex:0 0 auto;font-size:17px;line-height:1.5;color:var(--body);max-width:74ch}
  .lead b{color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- slide 1: the five-stage flow ----
     Every node and every text slot exists at full size from first paint, so
     lighting a stage changes what is shown and never moves anything. */
  .flowwrap{display:flex;flex-direction:column;gap:16px;min-height:0}
  .flow{flex:0 0 auto;display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr 24px 1fr 24px 1fr;align-items:start}
  .stg{min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px}
  .node{position:relative;width:84px;height:84px;border-radius:50%;border:2px dashed var(--line);
    background:var(--tint);color:var(--on-highlight);display:flex;align-items:center;justify-content:center;
    transition:background var(--t-reveal) var(--ease-over),border-color var(--t-reveal) var(--ease-over)}
  .node svg.ic{width:40px;height:40px;opacity:.35;transition:opacity var(--t-reveal) var(--ease-over)}
  .node .num{position:absolute;top:-4px;right:-4px;width:26px;height:26px;border-radius:50%;
    border:1.5px dashed var(--on-highlight);background:var(--bg);color:var(--on-highlight);
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .stg.lit .node{border:2px solid var(--on-highlight);background:var(--highlight)}
  .stg.lit .node svg.ic{opacity:1}
  .stg.lit .node .num{border-style:solid;background:var(--on-highlight);color:var(--bg)}
  .stg.now .node{box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--on-highlight)}
  .stg .sl{font-size:15px;font-weight:600;color:var(--title);text-align:center;line-height:1.25;opacity:.45}
  .stg.lit .sl{opacity:1}
  .stg .st{width:100%;min-height:150px;border:1.5px dashed var(--line);border-radius:9px;padding:8px 9px;
    font-size:15px;line-height:1.42;color:var(--title)}
  .stg .st span{display:block}
  .stg:not(.lit) .st span{visibility:hidden}
  .stg.lit .st{border:1.5px solid var(--on-highlight);background:var(--bg)}
  .stg.lit .st.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .arr{height:84px;display:flex;align-items:center;justify-content:center;color:var(--on-highlight);opacity:.3}
  .arr svg.ic{width:22px;height:22px}
  .arr.lit{opacity:1}
  .ctl{flex:0 0 auto;display:flex;align-items:center;gap:14px}
  button.step{font-family:inherit;font-size:15px;font-weight:600;padding:9px 18px;border-radius:8px;cursor:pointer;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);
    display:inline-flex;align-items:center;gap:8px}
  button.step svg.ic{width:18px;height:18px}
  button.step:disabled{opacity:.34;cursor:default}
  button.step:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  .ctl .cs{font-size:15px;line-height:1.4;color:var(--body)}
  .ctl .cs b{color:var(--title);font-weight:600}

  /* ---- slide 2: three cards to open ---- */
  .cards3{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch}
  button.oc{font-family:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--title);
    border:1.5px dashed var(--on-highlight);border-radius:12px;padding:22px 20px 20px;min-height:268px;
    display:flex;flex-direction:column;gap:14px;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  button.oc:hover{background:var(--highlight)}
  button.oc:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.oc .oi{width:76px;height:76px;border-radius:14px;background:var(--highlight);color:var(--on-highlight);
    border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center}
  button.oc .oi svg.ic{width:42px;height:42px}
  button.oc .ot{font-size:22px;font-weight:600;line-height:1.25;color:var(--title)}
  button.oc .ob{min-height:74px;font-size:18px;line-height:1.45;color:var(--body);
    border-top:1.5px dashed var(--line);padding-top:10px;display:flex;align-items:flex-start;gap:8px}
  button.oc .ob .gl{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);font-size:13px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;margin-top:2px}
  button.oc.open{background:var(--highlight);border-style:solid;border-width:2px}
  button.oc.open .ob{border-top:1.5px solid var(--on-highlight);color:var(--title)}
  button.oc.open .ob.in{animation:rin var(--t-reveal) var(--ease-over) both}

  /* ---- slide 3: the closing line ---- */
  .closewrap{display:flex;flex-direction:column;justify-content:center;gap:28px;min-height:0;padding-bottom:24px}
  .statement{flex:0 0 auto;background:var(--highlight);border-left:5px solid var(--on-highlight);
    border-radius:0 12px 12px 0;padding:32px 36px;max-width:820px}
  .statement p{font-size:30px;line-height:1.4;font-weight:600;color:var(--title)}
  .statement p + p{margin-top:16px}
  .billcard{flex:0 0 auto;display:flex;align-items:center;gap:20px;max-width:820px}
  .billcard .bi{flex:0 0 auto;width:78px;height:78px;border-radius:16px;border:1.5px solid var(--on-highlight);
    background:var(--bg);color:var(--on-highlight);display:flex;align-items:center;justify-content:center}
  .billcard .bi svg.ic{width:42px;height:42px}
  .billcard ul{list-style:none;display:flex;gap:10px;flex-wrap:wrap}
  .billcard li{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--on-highlight);
    border-radius:22px;padding:9px 16px;font-size:17px;font-weight:600;color:var(--title)}
  .billcard li svg.ic{width:20px;height:20px;color:var(--on-highlight)}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* ---- the bar ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:56px;overflow-y:auto;font-size:13px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    .board{grid-template-columns:1fr;gap:18px;align-items:start;align-content:start}
    .lead{font-size:16px}
    .flow{grid-template-columns:1fr;row-gap:6px}
    .stg{display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:12px;row-gap:4px;align-items:start}
    .stg .node{width:60px;height:60px;grid-row:1 / span 2}
    .node svg.ic{width:30px;height:30px}
    .stg .sl{text-align:left;font-size:16px}
    .stg .st{min-height:0;width:auto;font-size:16px}
    .arr{height:22px;justify-content:flex-start;padding-left:19px}
    .arr svg.ic{transform:rotate(90deg)}
    .ctl{flex-wrap:wrap}
    button.step{font-size:16px;padding:12px 18px}
    .ctl .cs{font-size:16px}
    .cards3{grid-template-columns:1fr;max-height:none}
    button.oc .ob{min-height:0}
    .statement{padding:18px 18px}
    .statement p{font-size:21px}
    .billcard{align-items:flex-start}
    .billcard .bi{width:60px;height:60px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="A Patient's Bill at Cumberland">

    <div class="top">
      <span class="prog" id="prog">1 of 3</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
      <span class="chip" id="chip" hidden></span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Continue</button>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:17px;color:#1C1B1B;margin:20px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ol,.nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:6px}
    .nsf strong{color:#1C1B1B}
    .nsf .box{background:#DCE1FF;border-left:4px solid #001D69;padding:12px 16px;margin:16px 0;color:#1C1B1B}
    .nsf a{color:#001D69}
  </style>
  <div class="nsf">
    <h2>A Patient's Bill at Cumberland</h2>
    <h3>One visit, one bill</h3>
    <p>A bill starts when a patient visits a clinic. It then moves in five stages:</p>
    <ol>
      <li>A patient visits one of the 41 clinics.</li>
      <li>The clinic sends Cumberland the details of the visit: who the patient is, what was done and what it cost.</li>
      <li>Cumberland turns those details into a bill.</li>
      <li>Cumberland sends the bill to the patient's insurer.</li>
      <li>Cumberland tracks the payment until it arrives.</li>
    </ol>
    <h3>What travels with the bill</h3>
    <ul>
      <li><strong>Who the patient is:</strong> their name and personal details.</li>
      <li><strong>What was done:</strong> the treatment they had.</li>
      <li><strong>What it cost:</strong> the amount charged.</li>
    </ul>
    <div class="box">
      <p>Every bill carries the patient's personal and medical details. That is the data you follow next.</p>
    </div>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ---------------- icons ----------------
     Inline SVG, Phosphor style: one weight, outline, uniform size, #001D69
     through currentColor. No icon font, no network request. */
  var IC = {
    clinic:'<path d="M3 21h18"/><path d="M5 21V8.5L12 4l7 4.5V21"/><path d="M12 9v5M9.5 11.5h5"/><path d="M10 21v-3.5h4V21"/>',
    details:'<rect x="5" y="4.5" width="14" height="16.5" rx="1.8"/><path d="M9 4.5V3h6v1.5"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/>',
    bill:'<path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/>',
    send:'<path d="M21 3 3 10.4l7.2 3.4L13.6 21z"/><path d="M10.2 13.8 21 3"/>',
    coin:'<circle cx="12" cy="12" r="8.5"/><path d="M14.6 9.4c-.5-.8-1.5-1.3-2.6-1.3-1.5 0-2.6.8-2.6 1.9s1 1.6 2.6 1.9 2.6.9 2.6 2-1.1 2-2.6 2c-1.2 0-2.1-.5-2.6-1.3M12 6.6v1.5M12 15.9v1.5"/>',
    person:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.3-3.6 4.2-5.6 7.5-5.6s6.2 2 7.5 5.6"/>',
    care:'<rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M12 8v8M8 12h8"/>',
    tag:'<path d="M3.5 12.3V4.5a1 1 0 0 1 1-1h7.8l8.2 8.2a1 1 0 0 1 0 1.4l-7.4 7.4a1 1 0 0 1-1.4 0z"/><circle cx="8" cy="8" r="1.4"/>',
    arrow:'<path d="M4 12h15M13 6l6 6-6 6"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }

  /* ---------------- content ---------------- */
  var S = [
    { id:"journey", kind:"flow", label:"One visit",
      h1:"One Visit, One Bill",
      lead:"A bill starts when a patient visits a clinic. It moves in five stages. Click <b>Next stage</b> to follow it.",
      stages:[
        { ic:"clinic",  name:"Visit",           txt:"A patient visits one of the 41 clinics." },
        { ic:"details", name:"Details sent",    txt:"The clinic sends Cumberland the details of the visit: who the patient is, what was done and what it cost." },
        { ic:"bill",    name:"Bill made",       txt:"Cumberland turns those details into a bill." },
        { ic:"send",    name:"Sent to insurer", txt:"Cumberland sends the bill to the patient's insurer." },
        { ic:"coin",    name:"Payment tracked", txt:"Cumberland tracks the payment until it arrives." }
      ] },

    { id:"travels", kind:"explore", label:"The details",
      h1:"What Travels With the Bill",
      lead:"Three kinds of detail ride along with every bill. Tap each card to open it.",
      cards:[
        { id:"who",  ic:"person", name:"Who the patient is", txt:"Their name and personal details." },
        { id:"what", ic:"care",   name:"What was done",      txt:"The treatment they had." },
        { id:"cost", ic:"tag",    name:"What it cost",       txt:"The amount charged." }
      ] },

    { id:"close", kind:"close", label:"Your data",
      h1:"That Is Your Data",
      body:["Every bill carries the patient's personal and medical details.",
            "That is the data you follow next."] }
  ];

  /* ---------------- state ---------------- */
  var KEY = "vciso-p2-m5-patients-bill-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { answers:{}, out:{}, lit:0, opened:{} }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var lit = (typeof raw.lit === "number" && raw.lit >= 0 && raw.lit <= 5) ? Math.floor(raw.lit) : 0;
      return { answers: isPlain(raw.answers) ? raw.answers : {},
               out:     isPlain(raw.out)     ? raw.out     : {},
               lit:     lit,
               opened:  isPlain(raw.opened)  ? raw.opened  : {} };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Data validation, at load, loud. */
  (function validate(){
     var problems = [];
     var ids = {};
     S.forEach(function(s, n){
       if(!s.id) problems.push("slide " + (n+1) + " has no id");
       if(ids[s.id]) problems.push('duplicate slide id "' + s.id + '"');
       ids[s.id] = 1;
       if(s.kind === "flow" && !(s.stages && s.stages.length)) problems.push('slide "' + s.id + '" has no stages');
       if(s.kind === "explore"){
         var cids = {};
         (s.cards || []).forEach(function(c){
           if(cids[c.id]) problems.push('slide "' + s.id + '" has duplicate card id "' + c.id + '"');
           cids[c.id] = 1;
         });
       }
     });
     if(problems.length){
       document.getElementById("board").innerHTML =
         '<div class="lead"><p><b>This deck has authoring errors and will not '
         + 'behave correctly:</b></p><ul style="font-size:13px;line-height:1.6;padding-left:18px">'
         + problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul></div>";
       throw new Error("deck data invalid: " + problems.join("; "));
     }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = m; }
  function openedCount(s){ return (s.cards || []).filter(function(c){ return st.opened[c.id]; }).length; }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    if(s.kind === "explore"){
      el.chip.hidden = false;
      el.chip.textContent = "Opened " + openedCount(s) + " of " + s.cards.length;
    } else el.chip.hidden = true;

    el.back.disabled = (i === 0);
    el.next.textContent = "Continue";
    if(i === S.length-1){ el.next.disabled = true; el.next.textContent = "You are at the end"; }
    else if(s.kind === "flow" && st.lit < s.stages.length){
      /* The flow is the slide's one job. Continue waits until every stage has
         been lit, and Next stage can never trap anyone. */
      el.next.disabled = true;
      el.hint.innerHTML = "Light up all " + s.stages.length + " stages to carry on.";
    }
    else { el.next.disabled = false; el.hint.textContent = ""; }
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);
    el.board.className = "board";
    el.hint.textContent = "";

    if(s.kind === "flow") renderFlow(s);
    else if(s.kind === "explore") renderExplore(s);
    else if(s.kind === "close" || s.kind === "intro") renderClose(s);
    else {
      el.board.innerHTML = '<div class="lead"><p><b>Unhandled slide kind "'
        + esc(String(s.kind)) + '".</b></p></div>';
    }

    header();
    say("Slide " + (i+1) + " of " + S.length + ". " + s.h1 + ".");
  }

  /* Slide 1: stepped flow. One beat per click, left to right. */
  function renderFlow(s){
    var n = s.stages.length;
    var parts = [];
    s.stages.forEach(function(g, k){
      if(k > 0) parts.push('<div class="arr' + (k < st.lit ? " lit" : "") + '" data-a="' + k + '">' + icon("arrow") + "</div>");
      var lit = k < st.lit;
      parts.push('<div class="stg' + (lit ? " lit" : "") + (lit && k === st.lit-1 ? " now" : "") + '" data-s="' + k + '">'
        + '<div class="node">' + icon(g.ic) + '<span class="num" aria-hidden="true">' + (k+1) + "</span></div>"
        + '<div class="sl">' + esc(g.name) + "</div>"
        + '<div class="st"><span' + (lit ? "" : ' aria-hidden="true"') + ">" + esc(g.txt) + "</span></div>"
        + "</div>");
    });
    el.board.innerHTML = '<div class="flowwrap">'
      + '<p class="lead">' + s.lead + "</p>"
      + '<div class="flow">' + parts.join("") + "</div>"
      + '<div class="ctl"><button class="step" id="stepb" type="button">Next stage ' + icon("arrow") + "</button>"
      + '<span class="cs" id="cs"></span></div>'
      + "</div>";
    var b = el.board.querySelector("#stepb");
    var cs = el.board.querySelector("#cs");
    function status(){
      if(st.lit >= n){
        b.disabled = true;
        b.firstChild.nodeValue = "All stages shown ";
        cs.innerHTML = "<b>Stage " + n + " of " + n + ".</b> The bill has gone from the clinic visit to a tracked payment.";
      } else if(st.lit === 0){
        cs.textContent = "No stages shown yet.";
      } else {
        cs.innerHTML = "<b>Stage " + st.lit + " of " + n + ".</b>";
      }
    }
    status();
    b.addEventListener("click", function(){
      if(st.lit >= n) return;
      st.lit += 1; save(st);
      var k = st.lit - 1;
      var prev = el.board.querySelector(".stg.now");
      if(prev) prev.classList.remove("now");
      var node = el.board.querySelector('.stg[data-s="' + k + '"]');
      node.classList.add("lit", "now");
      var span = node.querySelector(".st span");
      span.removeAttribute("aria-hidden");
      var box = node.querySelector(".st");
      if(!reduce){ box.classList.remove("in"); void box.offsetWidth; box.classList.add("in"); }
      var ar = el.board.querySelector('.arr[data-a="' + k + '"]');
      if(ar) ar.classList.add("lit");
      status();
      header();
      if(st.lit >= n) el.next.focus();
      say("Stage " + (k+1) + " of " + n + ". " + s.stages[k].txt);
    });
  }

  /* Slide 2: three cards, opened in any order. Nothing is ever disabled. */
  function renderExplore(s){
    el.board.innerHTML = '<div class="col" style="gap:18px">'
      + '<p class="lead">' + s.lead + "</p>"
      + '<div class="cards3">' + s.cards.map(function(c){
          var open = !!st.opened[c.id];
          return '<button class="oc' + (open ? " open" : "") + '" type="button" data-c="' + esc(c.id) + '" aria-expanded="' + open + '">'
            + '<span class="oi">' + icon(c.ic) + "</span>"
            + '<span class="ot">' + esc(c.name) + "</span>"
            + '<span class="ob">' + obHTML(c, open) + "</span>"
            + "</button>";
        }).join("") + "</div></div>";
    Array.prototype.forEach.call(el.board.querySelectorAll("button.oc"), function(b){
      b.addEventListener("click", function(){
        var c = null;
        s.cards.forEach(function(x){ if(x.id === b.dataset.c) c = x; });
        if(!c || st.opened[c.id]) return;
        st.opened[c.id] = 1; save(st);
        b.classList.add("open");
        b.setAttribute("aria-expanded", "true");
        var ob = b.querySelector(".ob");
        ob.innerHTML = obHTML(c, true);
        if(!reduce){ ob.classList.remove("in"); void ob.offsetWidth; ob.classList.add("in"); }
        header();
        say(c.name + ". " + c.txt + " Opened " + openedCount(s) + " of " + s.cards.length + ".");
      });
    });
  }
  function obHTML(c, open){
    return open
      ? '<span class="gl" aria-hidden="true">✓</span><span>' + esc(c.txt) + "</span>"
      : '<span class="gl" aria-hidden="true">+</span><span>Tap to open</span>';
  }

  /* Slide 3: the closing line, no input. */
  function renderClose(s){
    el.board.innerHTML = '<div class="closewrap">'
      + '<div class="statement">' + (s.body || []).map(function(p){ return "<p>" + p + "</p>"; }).join("") + "</div>"
      + '<div class="billcard"><span class="bi">' + icon("bill") + "</span>"
      + '<ul aria-label="What every bill carries">'
      + "<li>" + icon("person") + "Who the patient is</li>"
      + "<li>" + icon("care") + "What was done</li>"
      + "<li>" + icon("tag") + "What it cost</li>"
      + "</ul></div></div>";
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return true;
    var r = node.getAttribute && node.getAttribute("role");
    return r === "slider" || r === "textbox" || r === "spinbutton" || r === "listbox";
  }

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    if(ownsKeys(e.target)){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    state:function(){ return { i:i, lit:st.lit, opened:st.opened }; }
  };
})();
</script>
</body>
</html>
