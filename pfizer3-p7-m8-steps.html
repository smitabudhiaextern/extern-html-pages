:root{

<template id="t1">
<p class="p">The document is the <b>Packaging Specification</b> inside the supplier bundle you've used all project. Metadata is information about a piece of text, such as which document type it belongs to. You'll follow 7 steps in your notebook:</p><ul class="list"><li><b>Steps 1 to 4:</b> take the Packaging Specification's pages, cut them into chunks, label each chunk and build a search index from them.</li><li><b>Steps 5 to 7:</b> search with a filter on the document type, write the answer with Gemini and package the result.</li></ul><p class="p">You'll record what you find in your own copy of a Google Doc and hand in its link. Handing in your notebook's link is optional.</p>
</template>

<template id="t2">
<p class="p">If you don't understand anything, I think you should use Claude. Here are two sample prompts:</p><figure class="run"><div class="code-head"><span class="code-lang">Prompt</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">I&#x27;m building a metadata-filtered search with LlamaIndex in Google Colab, on one document (a Packaging Specification) from a supplier PDF. My task says: [paste the slide&#x27;s instruction]. Explain in simple words what I need to do and give me one hint, but don&#x27;t write the code for me.</span></code></pre></figure><figure class="run"><div class="code-head"><span class="code-lang">Prompt</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">Here&#x27;s my code and the error I got: [paste both]. Explain in plain English what&#x27;s going wrong and give me one hint, but don&#x27;t fix it for me.</span></code></pre></figure><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p>Never paste your Gemini API key into a chat. It stays in Colab Secrets.</p></div>
</template>
