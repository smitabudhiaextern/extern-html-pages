<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Repeats in a Scan</title>
<!--
  vCISO P2 Step 4, Module 13: Triage the Scan Results. Step 3, "Group the Rows by Cause".
  Replaces the drag-the-cards build vciso-p2-m13-from-rows-to-a-working-list.html (kept, not edited).

  Teaches the method a student uses to check Claude's grouping of their real scan:
  Finding first (same name, same problem), then Host (one machine or many, still one
  problem), then CVE and Severity (no code and Medium or Low is a small setting, and all
  settings go in one group), then Severity Info (not a problem, set aside).

  The example sheet is made up. "Example" and EX-MAIL01 are the module's own made-up
  company and machine. No Cumberland data. CVE codes use the year 2099 so they can never
  match a real flaw. No update numbers.
  12 rows = 3 real problems + 2 Info rows set aside:
    4 x Missing March 2024 security updates, EX-MAIL01, CVE-2099-0001 to 0004   (problem 1)
    1 x Web server remote code execution, EX-WEB01, CVE-2099-0005               (problem 2)
    3 x SMB signing not required, Medium, on EX-MAIL01, EX-WEB01, EX-FILE01     (problem 3, settings)
    1 x Cleartext HTTP service, Low, EX-WEB01                                   (problem 3, settings)
    1 x TLS 1.0 enabled, Medium, EX-FILE01                                      (problem 3, settings)
    2 x Operating system identified, Info, EX-WEB01 and EX-FILE01               (set aside)

  Governing authority: output/programs/vciso/CLAUDE.md section 6. Chrome, options,
  right and wrong states, navigation, scale-to-fit and phone layout match
  vciso-p2-m11-is-cumberland-actually-affected.html. The right and wrong colours are used
  only for right and wrong, always with an icon and a word. No per-slide tint.

  Answer rules (owner): a wrong pick turns red with a cross and "Not quite" plus a hint,
  and the student tries again. After a second wrong pick the right answer is shown in
  its right state. On a two-option question one wrong pick leaves only the right one to try.
  Next opens only once the question on the slide is answered right or shown.
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    /* right and wrong states only, always paired with an icon and a word */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);
    --bandB:rgba(0,29,105,.085);

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:460ms;
    --t-sort:750ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto;background:var(--bg)}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:6px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:26px;height:4px;border-radius:2px;background:var(--tint2)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  h1{font-size:25px;line-height:1.22;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:6px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px}
  .ask{flex:0 0 auto;display:flex;flex-direction:column;gap:3px}
  .lead{font-size:15px;line-height:1.42;color:var(--body)}
  .lead b{color:var(--title);font-weight:600}
  .q{font-size:16.5px;font-weight:700;line-height:1.3;color:var(--title)}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  .split{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:530px minmax(0,1fr);gap:16px;align-items:start}

  /* ---- the sheet ---- */
  .sheet{position:relative;min-width:0;background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:8px;overflow:hidden}
  .sh,.sr-row{display:grid;grid-template-columns:76px minmax(0,1fr) 106px 62px;
    grid-template-areas:"host fnd cve sev";column-gap:8px;padding:0 10px;align-items:center}
  .c-host{grid-area:host}.c-fnd{grid-area:fnd}.c-cve{grid-area:cve}.c-sev{grid-area:sev}
  .sh{background:var(--on-highlight);color:var(--bg);font-size:11.5px;font-weight:600;letter-spacing:.04em;height:26px;text-transform:uppercase}
  .sh span{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .sh .sorted-ic{width:13px;height:13px;stroke-width:2.4}
  .rows{position:relative}
  .sheet:not(.grouped) .rows{padding-bottom:5px}
  .sr-row{min-height:22px;font-size:13px;line-height:1.25;color:var(--title);
    border-top:1px solid rgba(0,29,105,.12);background:var(--bg);
    transition:background var(--t-frame) var(--ease-io)}
  .sr-row:first-child{border-top:0}
  .sr-row span{min-width:0;padding:2px 0;white-space:nowrap}
  .sr-row .c-host{font-weight:600}
  .sr-row .c-cve{font-variant-numeric:tabular-nums}
  /* after sorting: each group of the same Finding gets one shade, and a navy line sits between groups */
  .sheet.grouped .sr-row.bA{background:var(--highlight)}
  .sheet.grouped .sr-row.bB{background:var(--bandB)}
  .sheet.grouped .sr-row.gstart{border-top:2px solid var(--on-highlight)}
  .sheet.grouped .sr-row.gstart:first-child{border-top:0}
  .sheet.moving .sr-row{transition:transform var(--t-sort) var(--ease-io)}
  /* the last slide: a label row above each group */
  .sr-row.glabel{display:flex;align-items:center;gap:7px;min-height:21px;background:var(--on-highlight);color:var(--bg);
    font-size:13px;font-weight:700;border-top:0}
  .sr-row.glabel svg.ic{width:15px;height:15px;flex:0 0 auto}
  .sr-row.glabel span{padding:2px 0;white-space:normal}

  /* the box around the rows a question is about */
  .fbox{position:absolute;left:3px;right:3px;border:3px solid var(--on-highlight);border-radius:6px;pointer-events:none}
  .fbox.in{animation:pop var(--t-reveal) var(--ease-over) both}
  .colbox{position:absolute;top:2px;bottom:1px;border:3px solid var(--on-highlight);border-radius:6px;pointer-events:none}
  .colbox.in{animation:pop var(--t-reveal) var(--ease-over) both}

  /* ---- the side panel ---- */
  .side{min-width:0;background:var(--highlight);border-radius:12px;padding:12px 14px 13px;display:flex;flex-direction:column;gap:7px}
  .sub{font-size:13.5px;line-height:1.38;color:var(--body)}
  .sub b{color:var(--title);font-weight:600}
  .pq{font-size:16.5px;font-weight:600;line-height:1.3;color:var(--title)}

  /* ---- options ---- */
  .opts{display:flex;flex-direction:column;gap:6px}
  button.opt{font-family:inherit;text-align:left;color:var(--title);
    background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;
    padding:5px 11px;cursor:pointer;display:flex;gap:10px;align-items:center;min-height:44px;width:100%;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  button.opt .g{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;background:transparent}
  button.opt .g svg.ic{width:14px;height:14px;stroke-width:2.6}
  button.opt .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
  button.opt .lr{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  button.opt .ol{font-size:15.5px;font-weight:700;line-height:1.25;color:var(--title)}
  button.opt .om{font-size:13px;line-height:1.3;color:var(--body)}
  button.opt .tg{flex:0 0 auto;font-size:13px;font-weight:700;white-space:nowrap}
  button.opt:hover:not(:disabled){background:var(--highlight)}
  html.fresh button.opt:hover:not(:disabled){background:var(--bg)}
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt:disabled{cursor:default}
  button.opt.idle:disabled{border-style:dashed;border-color:var(--line)}
  button.opt.idle:disabled .g{border-color:var(--line)}
  button.opt.idle:disabled .ol{color:var(--body)}
  button.opt.ok{background:var(--ok-tint);border:2px solid var(--ok)}
  button.opt.ok .g{background:var(--ok);border-color:var(--ok);color:var(--bg)}
  button.opt.ok .tg{color:var(--ok)}
  button.opt.no{background:var(--no-tint);border:2px solid var(--no)}
  button.opt.no .g{background:var(--no);border-color:var(--no);color:var(--bg)}
  button.opt.no .tg{color:var(--no)}

  /* ---- feedback ---- */
  .fb{border-radius:10px;padding:6px 13px 8px;border-left:6px solid;display:flex;flex-direction:column;gap:2px}
  .fb.ok{background:var(--ok-tint);border-color:var(--ok)}
  .fb.no{background:var(--no-tint);border-color:var(--no)}
  .fb .fh{display:flex;align-items:center;gap:7px;font-size:15.5px;font-weight:700}
  .fb.ok .fh{color:var(--ok)}
  .fb.no .fh{color:var(--no)}
  .fb .fh svg.ic{width:19px;height:19px;stroke-width:2}
  .fb .ft{font-size:13.5px;line-height:1.36;color:var(--title)}
  .fb.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .fb:focus{outline:none}

  /* ---- the sort button ---- */
  button.go{font-family:inherit;font-size:16px;font-weight:600;padding:11px 18px;border-radius:8px;cursor:pointer;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);align-self:flex-start;
    display:inline-flex;align-items:center;gap:9px}
  button.go svg.ic{width:20px;height:20px}
  button.go:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.go:disabled{opacity:.5;cursor:default}

  /* ---- the last slide ---- */
  .tot{font-size:16.5px;font-weight:700;line-height:1.32;color:var(--title)}
  .cols{display:flex;flex-direction:column;gap:6px;list-style:none}
  .cols li{background:var(--bg);border-left:4px solid var(--on-highlight);border-radius:0 8px 8px 0;padding:6px 10px;
    font-size:13.5px;line-height:1.36;color:var(--body)}
  .cols li b{color:var(--title);font-weight:700}

  .side.in > *{animation:rin var(--t-reveal) var(--ease-over) both}

  /* slide 4 only: its lead runs to three lines, so the spacing tightens a little to keep clear of the bar */
  @media (min-width:600px){
    .board.q4{gap:6px}
    .board.q4 .lead{font-size:14.5px;line-height:1.34}
    .board.q4 .side{padding:10px 14px 10px;gap:6px}
    .board.q4 .opts{gap:4px}
    .board.q4 button.opt{padding:4px 11px}
  }

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:52px;padding-top:9px}
  button.nav{font-family:inherit;font-size:15px;font-weight:600;padding:9px 20px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.36;color:var(--body)}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .segs i{width:22px}
    .chip{margin-left:0;font-size:13px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .q,.pq{font-size:17px}
    .board{flex:0 0 auto}
    .split{grid-template-columns:1fr}
    /* each row stacks: machine, code and severity on top, the Finding under them */
    .sh,.sr-row{grid-template-columns:minmax(0,1fr) 126px 66px;
      grid-template-areas:"host cve sev" "fnd fnd fnd";column-gap:8px;padding:3px 10px}
    .sh{height:auto;font-size:12px;padding-top:4px;padding-bottom:4px}
    .sr-row{font-size:15px}
    .sr-row .c-fnd{white-space:normal;padding-top:0}
    .sr-row.glabel{font-size:15px}
    .sub{font-size:15px}
    button.opt{padding:10px 12px}
    button.opt .ol{font-size:16px}
    button.opt .om{font-size:15px}
    .fb .ft{font-size:15.5px}
    .fb{scroll-margin:16px}
    .tot{font-size:18px}
    .cols li{font-size:15.5px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0;scroll-margin-bottom:16px}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{font-size:15px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

</div>

  <div class="nsf">
    <h2>Find the Repeats in a Scan</h2>
    <p>Here is a small scan from a made-up company called Example. It has 12 rows, but some of them are the same problem. Its CVE codes, the ID numbers of known flaws, are made up too. The sheet is already sorted A to Z by the Finding column, so rows with the same Finding name sit next to each other.</p>
    <div class="tw"><table>
      <tr><th>Host</th><th>Finding</th><th>CVE</th><th>Severity</th></tr>
      <tr><td>EX-WEB01</td><td>Cleartext HTTP service</td><td></td><td>Low</td></tr>
      <tr><td>EX-MAIL01</td><td>Missing March 2024 security updates</td><td>CVE-2099-0001</td><td>Critical</td></tr>
      <tr><td>EX-MAIL01</td><td>Missing March 2024 security updates</td><td>CVE-2099-0002</td><td>High</td></tr>
      <tr><td>EX-MAIL01</td><td>Missing March 2024 security updates</td><td>CVE-2099-0003</td><td>High</td></tr>
      <tr><td>EX-MAIL01</td><td>Missing March 2024 security updates</td><td>CVE-2099-0004</td><td>Critical</td></tr>
      <tr><td>EX-WEB01</td><td>Operating system identified</td><td></td><td>Info</td></tr>
      <tr><td>EX-FILE01</td><td>Operating system identified</td><td></td><td>Info</td></tr>
      <tr><td>EX-FILE01</td><td>SMB signing not required</td><td></td><td>Medium</td></tr>
      <tr><td>EX-MAIL01</td><td>SMB signing not required</td><td></td><td>Medium</td></tr>
      <tr><td>EX-WEB01</td><td>SMB signing not required</td><td></td><td>Medium</td></tr>
      <tr><td>EX-FILE01</td><td>TLS 1.0 enabled</td><td></td><td>Medium</td></tr>
      <tr><td>EX-WEB01</td><td>Web server remote code execution</td><td>CVE-2099-0005</td><td>Critical</td></tr>
    </table></div>
    <h3>Read the columns in this order</h3>
    <ul>
      <li><strong>Finding.</strong> When the same Finding name repeats, it is the same problem. Sorting the sheet A to Z by Finding puts those rows next to each other.</li>
      <li><strong>Host.</strong> The four Missing March 2024 security updates rows are all on EX-MAIL01. Each has its own CVE code, but installing the one missing update fixes all four, so they are one problem. The three SMB signing not required rows are on three different machines, but it is the same setting, wrong on each one and fixed the same way, so they are one problem too. SMB signing is a Windows setting that checks that shared files are not changed on their way between machines.</li>
      <li><strong>CVE and Severity.</strong> Five rows have no CVE code and say Medium or Low: the three SMB signing rows, Cleartext HTTP service and TLS 1.0 enabled. They're both settings. A setting is an option someone left switched on or off. SMB signing is a switch that's off, and old TLS 1.0 is a switch that's on. Claude can help you in this. They all go in one settings group, even with different Finding names and on different machines, and they are fixed in one clean-up.</li>
      <li><strong>Severity Info.</strong> The two rows that say Info only report a fact, such as which operating system (the main software on a computer, such as Windows) the machine runs. They are not problems, so you set them aside.</li>
    </ul>
    <div class="box"><p><strong>12 rows, 3 real problems, and 2 Info rows that you set aside.</strong> The three problems are the missing March 2024 updates on EX-MAIL01, the web server flaw on EX-WEB01, and the settings group.</p></div>
  </div>

  var lastPt = null;
  document.addEventListener("pointermove", function(e){
    var p = e.clientX + "," + e.clientY;
    if(lastPt !== null && p !== lastPt) document.documentElement.classList.remove("fresh");
    lastPt = p;
  }, true);
  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()) stage.style.transform = "";
    else {
      var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
      stage.style.transform = "scale(" + s + ")";
    }
    if(!sortTimer) placeBoxes(false);
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; i = n; render(); return true; },
    slides:S.length,
    reset:function(){ clearTimeout(sortTimer); sortTimer = null; st = fresh(); save(st); i = 0; render(); },
    state:function(){ return { i:i, sorted:st.sorted, a:st.a }; }
  };
})();
</script>
</body>
</html>
