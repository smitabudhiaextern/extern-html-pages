<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optional Reading Topics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Copied from pfizer3-p3-m5-optional.html (toggles, parts, code
   blocks, tip callout and link card unchanged); only the topics are new.
   Optional Reading for Project 3, module 8 (Learn How to Extract Fields with Regex, Anchor Phrases & Bounding Boxes):
   two topics as toggles, only one open at a time, each with a "Read this if..." hint.
   The text is the SME's module 8 page, in his words, with only the mistakes fixed: his phone-number cell is run on page 1
   of the supplier file (PyMuPDF 1.26.5, 10 November 2026), which has no phone number, so the real output is
   "Phone number not found." His page showed a "Found ... at" line that this code can't print. His YouTube link was
   checked live on 10 November 2026 (3,197 seconds, so "about 53 minutes").
   Fixed stage: 760 x 690 design stage (set the Notion embed height to 690 px), scaled as one piece. Nothing scrolls;
   a long topic is split into parts with Back and Next inside the open toggle. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --action:var(--extern-black); --on-action:var(--extern-white);
  --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --stage-w:760px; --stage-h:690px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;overflow:hidden;background:var(--surface);padding:16px 20px}

/* Accordion: the shape, spacing, header layout and chevron of the frozen template accordions
   (one bordered box, hairlines between items, title left and chevron right), in this design system's colours. */
.toggles{max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
/* A topic split into parts fills the stage, so Back and Next stay in one place from part to part. */
.app.fill .toggles{height:100%}
.item{flex:none;display:flex;flex-direction:column;min-height:0}
.item+.item{border-top:1px solid var(--line)}
.app.fill .item.open{flex:1 1 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;margin:0;border:0;background:none;text-align:left;cursor:pointer;padding:18px 20px;transition:background-color .15s ease}
.head:hover{background:var(--surface-card)}
.head:focus-visible{outline-offset:-2px;border-radius:0}
.ht{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{margin:0;font-family:var(--font-text);font-size:16px;font-weight:600;line-height:1.45;color:var(--ink)}
.hint{font-size:14px;line-height:1.45;color:var(--ink-muted)}
.chev{flex:none;width:20px;height:20px;color:var(--gray-600);transition:transform .2s ease}
.item.open .chev{transform:rotate(180deg)}

/* The open topic's reading area */
.body{display:none}
.item.open .body{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.pane{flex:1 1 auto;min-height:0;padding:2px 20px 16px;display:flex;flex-direction:column;gap:12px}
.pane p{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty}
.pane b{font-weight:600;color:var(--ink)}
.pane h3{margin:4px 0 0;font-family:var(--font-text);font-size:16px;font-weight:600;line-height:1.35;color:var(--ink)}
.pane ul{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:4px}
.pane li{font-size:15.5px;line-height:1.5;color:var(--ink-muted);padding-left:2px;text-wrap:pretty}
.pane li::marker{color:var(--step-label)}
.pane code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-card);color:var(--ink);padding:1px 5px;border-radius:5px;white-space:nowrap}

/* Code and output blocks, built from the design system's tokens. Outputs have no Copy button. */
.code{background:var(--surface-card);border-radius:var(--radius-sm);flex:none}
.code-head{padding:6px 14px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label);border-bottom:1px solid var(--blue-200)}
.code pre{margin:0;padding:9px 14px;font-family:var(--font-mono);font-size:13px;line-height:1.5;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}

/* Tip callout, built from the design system's tokens (pale-blue card, Pfizer blue icon in a white square) */
.tip{display:flex;gap:14px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:14px 16px;margin-top:2px}
.tip-icon{flex:none;width:34px;height:34px;border-radius:var(--radius-xs);background:var(--extern-white);display:flex;align-items:center;justify-content:center;color:var(--pfizer-blue)}
.tip-icon svg{width:20px;height:20px}
.tip-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
.tip-text p{color:var(--card-text);font-size:15px}

/* Part Back and Next, only for topics with more than one part */
.pnav{flex:none;display:flex;align-items:center;gap:12px;padding:8px 20px;border-top:1px solid var(--line)}
.pnav[hidden]{display:none}
.where{flex:1;font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-text);font-size:14px;line-height:1.2;font-weight:600;padding:7px 14px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.btn svg{width:13px;height:13px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.btn-next:disabled{opacity:.35;cursor:default}
/* Link card for the recommended video (same build as pfizer3-p1-m3-how-ai-reads.html) */
.link-card{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);text-decoration:none;flex:none}
.link-card:hover{border-color:var(--ink)}
.link-card:focus-visible{border-radius:var(--radius-sm)}
.lc-thumb{flex:none;width:56px;height:48px;border-radius:var(--radius-xs);background:var(--surface-card);color:var(--pfizer-blue);display:flex;align-items:center;justify-content:center}
.lc-thumb svg{width:22px;height:22px}
.lc-body{flex:1;min-width:0;display:grid;gap:2px}
.lc-title{font-size:15px;font-weight:600;line-height:1.35}
.lc-url{font-size:13px;line-height:1.4;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-card .ext{width:18px;height:18px;color:var(--gray-600);flex:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:no-preference){ .pane.anim{animation:in .22s ease} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
@media (prefers-reduced-motion:reduce){ .chev,.head{transition:none} }
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="Optional reading: two topics. Open one at a time."><div class="toggles" id="toggles"></div></div>

<script>
(function () {
  "use strict";
  var CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5.5 7.75 4.5 4.5 4.5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var BACK = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var NEXT = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var BULB = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function out(label, text) {
    return '<div class="code"><div class="code-head">' + label + '</div><pre>' + text + '</pre></div>';
  }

  var PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2a.8.8 0 0 0-1.2.7Z" fill="currentColor"/></svg>';
  var EXT = '<svg class="ext" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M11.5 3.75h4.75V8.5M16 4l-7 7M14.25 11.5v3.25c0 .8-.7 1.5-1.5 1.5h-7.5c-.8 0-1.5-.7-1.5-1.5v-7.5c0-.8.7-1.5 1.5-1.5H8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  /* The SME's phone-number cell from his module 8 page, word for word, and its real output on the supplier file */
  var PHONE_CODE = String.raw`import re

text = doc[0].get_text("text")

# Regex to find phone number
phone_match = re.search(r"\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}", text)

if phone_match:
    phone_number = phone_match.group()
    print(f"Candidate Phone Number: {phone_number}")
else:
    print("Phone number not found.")`;

  var TOPICS = [
    { title: "A pattern for phone numbers, and what each part means",
      hint: "Read this if you want to see one pattern that matches a value written in several different ways.",
      parts: ["The Idea", "Let's See This in Action", "What's Happening Here?"],
      panes: [
        '<p>Think of it like this: Imagine you\'re skimming a page looking for any 10-digit number that looks like a phone number. You know what it <i>should</i> look like, maybe it\'s <code>(123) 456-7890</code> or <code>123-456-7890</code>.</p>' +
        '<p>Instead of scanning every word manually, you write a tiny pattern that says: "Look for three digits, then a dash or space, then three more digits, then four more." Boom. The regex engine does the scanning for you.</p>',

        '<p>Let\'s see this in action:</p>' +
        out("Python", esc(PHONE_CODE)) +
        '<p>The supplier file has no phone number on page 1, so on your file this cell prints:</p>' +
        out("Output", "Phone number not found."),

        '<p><b>What\'s happening here?</b></p>' +
        '<ul>' +
          '<li><code>\\d{3}</code> means "find exactly three digits."</li>' +
          '<li><code>[-.\\s]?</code> says "Look for a dash, dot, or space, but it\'s optional."</li>' +
          '<li>The parentheses <code>\\(?</code> and <code>\\)?</code> handle numbers with or without brackets.</li>' +
        '</ul>' +
        '<p>Put it all together, and you\'ve got a handy pattern for matching U.S. phone numbers in most formats: <code>(123) 456-7890</code>, <code>123-456-7890</code>, <code>123.456.7890</code>, or even <code>123 456 7890</code>.</p>' +
        '<p>So instead of scanning line by line, you let regex be your detective: fast, precise, and not thrown off by a line break or extra space.</p>'
      ] },

    { title: "Regex can look like gibberish at first, and that's fine",
      hint: "Read this if regex patterns still feel hard to read, or you'd like a longer video.",
      parts: ["Pro Tip"],
      panes: [
        '<div class="tip"><span class="tip-icon">' + BULB + '</span><div class="tip-text">' +
          '<p><b>Pro Tip:</b> Regex can look like gibberish at first, but don\'t worry. You don\'t need to memorize it. You just need to learn how to read the patterns and tweak them. Over time, you\'ll get faster.</p>' +
        '</div></div>' +
        '<p><b>Optional watch:</b> For a walkthrough on regex, check out this beginner-friendly regex tutorial. It\'s long, about 53 minutes, so watch the parts you need:</p>' +
        '<a class="link-card" href="https://www.youtube.com/watch?v=K8L6KVGG-7o" target="_blank" rel="noopener noreferrer">' +
          '<span class="lc-thumb" aria-hidden="true">' + PLAY + '</span>' +
          '<span class="lc-body"><span class="lc-title">Python Tutorial: re Module, How to Write and Match Regular Expressions (Regex)</span><span class="lc-url">Corey Schafer on YouTube, about 53 minutes</span></span>' +
          EXT + '<span class="sr-only"> (opens in a new tab)</span>' +
        '</a>'
      ] }
  ];

  var app = document.getElementById("app"), list = document.getElementById("toggles");
  var open = -1, part = 0;

  TOPICS.forEach(function (tp, n) {
    var item = document.createElement("div");
    item.className = "item";
    item.innerHTML =
      '<button type="button" class="head" id="h' + n + '" aria-expanded="false" aria-controls="b' + n + '">' +
        '<span class="ht"><span class="t">' + tp.title + '</span><span class="hint">' + tp.hint + '</span></span>' +
        CHEV +
      '</button>' +
      '<div class="body" id="b' + n + '" role="region" aria-labelledby="h' + n + '">' +
        '<div class="pane" aria-live="polite"></div>' +
        '<div class="pnav"' + (tp.panes.length > 1 ? '' : ' hidden') + '>' +
          '<span class="where"></span>' +
          '<button type="button" class="btn btn-back">' + BACK + 'Back</button>' +
          '<button type="button" class="btn btn-next">Next' + NEXT + '</button>' +
        '</div>' +
      '</div>';
    item.querySelector(".head").addEventListener("click", function () { toggle(n); });
    item.querySelector(".btn-back").addEventListener("click", function () { goPart(part - 1); });
    item.querySelector(".btn-next").addEventListener("click", function () { goPart(part + 1); });
    list.appendChild(item);
  });

  function renderPane(anim) {
    if (open < 0) return;
    var tp = TOPICS[open], item = list.children[open];
    var pane = item.querySelector(".pane");
    pane.className = "pane" + (anim ? " anim" : "");
    pane.innerHTML = tp.panes[part];
    if (tp.panes.length > 1) {
      item.querySelector(".where").innerHTML = "Part " + (part + 1) + " of " + tp.panes.length + ": <b>" + tp.parts[part] + "</b>";
      item.querySelector(".btn-back").disabled = part === 0;
      item.querySelector(".btn-next").disabled = part === tp.panes.length - 1;
    }
  }

  function toggle(n) {
    open = open === n ? -1 : n;
    part = 0;
    app.classList.toggle("fill", open >= 0 && TOPICS[open].panes.length > 1);
    Array.prototype.forEach.call(list.children, function (item, k) {
      var on = k === open;
      item.classList.toggle("open", on);
      item.querySelector(".head").setAttribute("aria-expanded", on ? "true" : "false");
      if (!on) item.querySelector(".pane").innerHTML = "";
    });
    renderPane(true);
  }

  function goPart(p) {
    if (open < 0 || p < 0 || p >= TOPICS[open].panes.length) return;
    part = p; renderPane(true);
  }

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  /* Test hook: open a topic and part directly, for example #open=1&part=2. */
  var m = location.hash.match(/open=(\d)(?:&part=(\d))?/);
  if (m) { toggle(+m[1] - 1); if (m[2]) goPart(+m[2] - 1); }
})();
</script>
</body>
</html>
