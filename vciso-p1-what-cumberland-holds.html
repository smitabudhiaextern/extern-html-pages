<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Cumberland Does, and What It Holds</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#FDF8F8;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
color:#484646;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#w{position:absolute;top:0;left:0;width:960px;height:540px;overflow:hidden;transform-origin:top left}
.slide{position:absolute;top:0;left:0;width:960px;height:540px;
padding:24px 72px 20px;display:grid;grid-template-rows:20px 14px 402px 16px 44px;
background:#FDF8F8;text-align:left}
.slide[hidden]{display:none}
.hd{grid-row:1;display:flex;align-items:center;justify-content:space-between;
font-size:13px;line-height:20px;color:#484646}
.hd .rh{font-weight:500}
.hd .pos{font-variant-numeric:tabular-nums}
.bd{grid-row:3;height:402px;display:flex;flex-direction:column}
.ab{grid-row:5;height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.abl,.abr{display:flex;align-items:center;gap:12px}
h1,h2{font-weight:600;color:#1C1B1B}
h1:focus,h2:focus,h1.fx,h2.fx{outline:3px solid #001D69;outline-offset:4px;border-radius:2px}
h1{font-size:30px;line-height:1.16;width:fit-content}
h2{font-size:26px;line-height:1.2;width:fit-content}
.ln{font-size:18px;line-height:1.5;color:#484646;margin-top:8px;max-width:700px}
.fn{font-size:15px;line-height:1.5;color:#1C1B1B;font-weight:500;margin-top:6px}
.viz{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:10px}
.viz svg{width:100%;height:100%;max-height:100%;display:block;overflow:visible}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
clip:rect(0 0 0 0);white-space:nowrap;border:0}
.big{font-size:40px;font-weight:600;line-height:1;color:#001D69;font-variant-numeric:tabular-nums}
.bigrow{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.bigrow .lbl{font-size:17px;line-height:1.4;color:#1C1B1B;font-weight:500}
.ic{display:block;width:18px;height:18px;fill:none;stroke:#001D69;stroke-width:1.8;
stroke-linecap:round;stroke-linejoin:round}
.btn{font-family:inherit;font-size:15px;font-weight:500;line-height:1;height:40px;
padding:0 20px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
border:1px solid #001D69;background:#001D69;color:#FDF8F8}
.btn .ic{stroke:#FDF8F8}
.btn.sec{background:transparent;color:#001D69}
.btn.sec .ic{stroke:#001D69}
.btn:disabled{background:transparent;border-color:#484646;color:#484646;cursor:default}
.btn:disabled .ic{stroke:#484646}
.btn:focus-visible{outline:3px solid #001D69;outline-offset:2px}
.dot{fill:#001D69;opacity:0;transition:opacity .28s ease}
.dot.on{opacity:1}
.mark{fill:#001D69}
.gl{opacity:0;transform:translateY(6px);transform-box:fill-box;transform-origin:center;
transition:opacity .3s ease,transform .3s ease}
.gl.on{opacity:1;transform:translateY(0)}
.fade{opacity:0;transition:opacity .35s ease}
.fade.on{opacity:1}
.draw{stroke:#001D69;stroke-width:1.6;fill:none;stroke-linecap:round;
stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset .6s ease}
.draw.on{stroke-dashoffset:0}
.nodebox{fill:#FDF8F8;stroke:#001D69;stroke-width:1.6;transition:fill .3s ease}
.nodebox.act{fill:#DCE1FF}
.rail{stroke:#001D69;stroke-width:1.4;opacity:.45}
.tok{transition:transform .85s cubic-bezier(.45,.05,.35,1)}
.tokbox{fill:#DCE1FF;stroke:#001D69;stroke-width:1.6}
.svgt{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.nlab{font-size:15px;font-weight:600;fill:#1C1B1B}
.dlab{font-size:13px;font-weight:400;fill:#484646}
.tlab{font-size:12px;font-weight:500;fill:#001D69}
.card{fill:#FDF8F8;stroke:#001D69;stroke-width:1.6}
.cardhd{fill:#DCE1FF}
.frow{font-size:15px;fill:#1C1B1B}
.fdash{stroke:#001D69;stroke-width:1.2;opacity:.35}
.tag{transition:transform .5s cubic-bezier(.4,.05,.4,1)}
.tagbox{fill:#DCE1FF;stroke:#001D69;stroke-width:1.6}
.sweep{transition:width 1.7s linear}
.defbox{fill:#DCE1FF}
#w.pm{width:480px;height:640px}
#w.pm .slide{width:480px;height:640px;padding:24px 32px 20px;
grid-template-rows:20px 14px 502px 16px 44px}
#w.pm .bd{height:502px}
#w.pm h2{font-size:21px}
#w.pm h1{font-size:23px}
#w.pm .ln{font-size:16px}
#w.pm .fn{font-size:14px}
#w.pm .big{font-size:32px}
#w.pm .viz svg{max-height:none}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="w"></div>
<script>
(function(){
var W=document.getElementById('w');
var RUNHEAD='What Cumberland Does, and What It Holds';
var N=7;
var P={
back:'<line x1="20" y1="12" x2="5.5" y2="12"/><polyline points="11 6.5 5.5 12 11 17.5"/>',
next:'<line x1="4" y1="12" x2="18.5" y2="12"/><polyline points="13 6.5 18.5 12 13 17.5"/>',
replay:'<polyline points="4 5 4 10.5 9.5 10.5"/><path d="M4.6 14.2a8 8 0 1 0 1.2-6"/>'};
function ic(d,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+d+'</svg>';}
function esc(s){return s;}

/* ========== panel copy ========== */
var COPY=[
{h:'Cumberland Claims Services',
 l:'A medical billing company in Bowling Green, Kentucky.',
 f:'That is the whole company. Every person in this story works inside it.'},
{h:'Who sends them the work',
 l:'41 clinics and two hospital systems send Cumberland their billing.',
 f:'Cumberland treats nobody. It bills for the people who do.'},
{h:'What one claim does here',
 l:'A claim arrives from a clinic, gets checked and corrected, and then travels out to the payer by way of a clearinghouse.',
 f:''},
{h:'What has to be inside it',
 l:'To bill for a clinic, Cumberland needs that clinic&rsquo;s patients.',
 f:'Not Cumberland&rsquo;s patients. The clinic&rsquo;s.'},
{h:'Now multiply it',
 l:'Across 41 clinics and two hospital systems, that adds up to records for around 2.1 million people.',
 f:'Each mark is a thousand people.'},
{h:'And the money moves too',
 l:'Money moves through Cumberland as well, on behalf of every clinic it bills for.',
 f:'So the records and the money sit in the same 180 person company.'},
{h:'Almost none of it belongs to them',
 l:'Cumberland handles other organizations&rsquo; patient data under contract, which makes it directly liable under HIPAA.',
 f:'Holding the data under someone else&rsquo;s name does not move the obligation anywhere.'}];

/* ========== svg builders ========== */
function svg(vb,inner){return '<svg viewBox="'+vb+'" class="svgt" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';}

function vizPeople(){
  var s='',i=0,c,r;

    s+='<circle class="dot" data-i="'+i+'" cx="'+(123+c*30)+'" cy="'+(28+r*30)+'" r="6"/>';i++;}}

}

function vizSources(){
  var s='',i=0,c,r,x,y;
  /* 41 clinics: 7 columns, 6 rows, last row 5 */
  for(r=0;r<6;r++){for(c=0;c<7;c++){
    if(i>=41){break;}

    s+='<g class="gl" data-i="'+i+'"><rect x="'+x+'" y="'+y+'" width="20" height="20" rx="4" fill="none" stroke="#001D69" stroke-width="1.4"/>'+
       '<line x1="'+(x+10)+'" y1="'+(y+5)+'" x2="'+(x+10)+'" y2="'+(y+15)+'" stroke="#001D69" stroke-width="1.4" stroke-linecap="round"/>'+
       '<line x1="'+(x+5)+'" y1="'+(y+10)+'" x2="'+(x+15)+'" y2="'+(y+10)+'" stroke="#001D69" stroke-width="1.4" stroke-linecap="round"/></g>';
    i++;}}
  s+='<text class="nlab" x="40" y="18">41 clinics</text>';

  s+='<text class="nlab" x="40" y="232">2 hospital systems</text>';

  for(c=0;c<2;c++){
    x=hx[c];y=244;
    s+='<g class="gl" data-i="'+(41+c)+'"><rect x="'+x+'" y="'+y+'" width="76" height="40" rx="5" fill="#DCE1FF" stroke="#001D69" stroke-width="1.4"/>'+
       '<line x1="'+(x+38)+'" y1="'+(y+11)+'" x2="'+(x+38)+'" y2="'+(y+29)+'" stroke="#001D69" stroke-width="1.6" stroke-linecap="round"/>'+
       '<line x1="'+(x+29)+'" y1="'+(y+20)+'" x2="'+(x+47)+'" y2="'+(y+20)+'" stroke="#001D69" stroke-width="1.6" stroke-linecap="round"/></g>';
  }
  /* arrows converging */
  s+='<path class="draw" data-i="60" d="M270 90 C 400 90, 430 130, 520 148"/>';
  s+='<path class="draw" data-i="61" d="M270 160 C 400 160, 430 158, 520 158"/>';
  s+='<path class="draw" data-i="62" d="M230 264 C 400 264, 430 200, 520 170"/>';
  s+='<polygon class="fade" data-i="63" points="521,148 533,158 521,168" fill="#001D69"/>';
  /* Cumberland box */
  s+='<g class="fade" data-i="64"><rect x="544" y="118" width="232" height="80" rx="10" fill="#DCE1FF" stroke="#001D69" stroke-width="1.8"/>'+
     '<text class="nlab" x="660" y="152" text-anchor="middle">Cumberland</text>'+
     '<text class="dlab" x="660" y="174" text-anchor="middle">180 people, Bowling Green</text></g>';
  return svg('0 0 816 296',s);
}

var RAIL4=[92,303,513,724];
function railNode(x,label,def,idx){
  var s='<rect class="nodebox" id="nb'+idx+'" x="'+(x-76)+'" y="112" width="152" height="56" rx="10"/>';
  s+='<text class="nlab" x="'+x+'" y="146" text-anchor="middle">'+label+'</text>';
  if(def){s+='<foreignObject x="'+(x-100)+'" y="182" width="200" height="108" class="fade" data-i="'+(30+idx)+'">'+
    '<div xmlns="http://www.w3.org/1999/xhtml" style="font:400 12px/1.42 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#484646;background:#DCE1FF;border-left:3px solid #001D69;padding:7px 9px;border-radius:0 6px 6px 0">'+def+'</div></foreignObject>';}
  return s;
}
function vizClaimRail(){
  var s='<line class="rail" x1="16" y1="140" x2="800" y2="140"/>';
  s+=railNode(RAIL4[0],'Clinic','',0);
  s+=railNode(RAIL4[1],'Cumberland','',1);
  s+=railNode(RAIL4[2],'Clearinghouse','<strong style="color:#1C1B1B">Clearinghouse.</strong> The middleman that routes a claim to the insurer. Think courier service for medical billing.',2);
  s+=railNode(RAIL4[3],'Payer','<strong style="color:#1C1B1B">Payer.</strong> The insurer that actually pays the claim.',3);
  s+='<g class="fade" id="ckd" data-i="90"><rect x="'+(RAIL4[1]-72)+'" y="184" width="144" height="26" rx="13" fill="#FDF8F8" stroke="#001D69" stroke-width="1.4"/>'+
     '<text class="tlab" x="'+RAIL4[1]+'" y="201" text-anchor="middle">checked and corrected</text></g>';
  s+='<g class="tok" id="tok" transform="translate('+RAIL4[0]+',0)">'+
     '<rect class="tokbox" x="-21" y="60" width="42" height="30" rx="5"/>'+
     '<line x1="-12" y1="69" x2="12" y2="69" stroke="#001D69" stroke-width="1.3" stroke-linecap="round"/>'+
     '<line x1="-12" y1="75" x2="12" y2="75" stroke="#001D69" stroke-width="1.3" stroke-linecap="round"/>'+
     '<line x1="-12" y1="81" x2="4" y2="81" stroke="#001D69" stroke-width="1.3" stroke-linecap="round"/>'+
     '<text class="tlab" x="0" y="106" text-anchor="middle">the claim</text></g>';
  s+='<text class="dlab" x="'+RAIL4[0]+'" y="201" text-anchor="middle">where it starts</text>';
  return svg('0 0 816 296',s);
}

var RAIL3=[150,408,666];
function vizMoney(){
  var s='<line class="rail" x1="60" y1="140" x2="756" y2="140"/>';
  var lab=['Payer','Cumberland','Clinic'];
  var sub=['pays the claim','passes it through','gets paid'];
  for(var i=0;i<3;i++){
    s+='<rect class="nodebox" id="mb'+i+'" x="'+(RAIL3[i]-84)+'" y="112" width="168" height="56" rx="10"/>';
    s+='<text class="nlab" x="'+RAIL3[i]+'" y="140" text-anchor="middle">'+lab[i]+'</text>';
    s+='<text class="dlab" x="'+RAIL3[i]+'" y="158" text-anchor="middle">'+sub[i]+'</text>';
  }
  s+='<g class="tok" id="mtok" transform="translate('+RAIL3[0]+',0)">'+
     '<circle class="tokbox" cx="0" cy="80" r="17"/>'+
     '<text class="tlab" x="0" y="85" text-anchor="middle" style="font-size:14px;font-weight:600">$</text></g>';
  s+='<text class="dlab" x="408" y="218" text-anchor="middle">Cumberland never owns this money. It is on its way to the clinic.</text>';
  return svg('0 0 816 296',s);
}

function vizClaimCard(){
  var rows=['Name','Date of birth','Diagnosis','Procedure','Insurance details'];
  var s='<rect class="card" x="238" y="20" width="340" height="256" rx="12"/>';
  s+='<path class="cardhd" d="M238 32 a12 12 0 0 1 12 -12 h316 a12 12 0 0 1 12 12 v26 h-340 z"/>';
  s+='<line x1="238" y1="58" x2="578" y2="58" stroke="#001D69" stroke-width="1.6"/>';
  s+='<text class="nlab" x="258" y="46">One claim</text>';
  s+='<text class="dlab" x="558" y="46" text-anchor="end">from one clinic</text>';
  for(var i=0;i<5;i++){
    var y=90+i*38;
    s+='<g class="gl" data-i="'+i+'">'+
       '<circle cx="266" cy="'+(y-5)+'" r="4.5" fill="none" stroke="#001D69" stroke-width="1.5"/>'+
       '<text class="frow" x="284" y="'+y+'">'+rows[i]+'</text>'+
       '<line class="fdash" x1="284" y1="'+(y+10)+'" x2="556" y2="'+(y+10)+'"/></g>';
  }
  return svg('0 0 816 296',s);
}

function vizScale(){
  var s='',i=0,c,r;
  s+='<defs><clipPath id="swp"><rect id="swpr" x="18" y="20" width="0" height="252"/></clipPath></defs>';
  s+='<g clip-path="url(#swp)">';
  for(r=0;r<30;r++){for(c=0;c<70;c++){
    s+='<rect class="mark" x="'+(20+c*11.3)+'" y="'+(22+r*8.4)+'" width="4" height="4" rx="1"/>';i++;}}
  s+='</g>';
  return svg('0 0 816 296',s);
}

function vizObligation(){
  var s='';
  s+='<g class="tag" id="tag" transform="translate(0,0)">'+
     '<rect class="tagbox" x="565" y="16" width="152" height="34" rx="17"/>'+
     '<text class="tlab" x="641" y="38" text-anchor="middle">Responsibility</text></g>';
  s+='<g class="fade" id="snap" data-i="70">'+
     '<text class="dlab" x="641" y="70" text-anchor="middle" style="font-weight:500;fill:#1C1B1B">It does not move.</text></g>';
  s+='<rect x="40" y="82" width="270" height="120" rx="12" fill="#FDF8F8" stroke="#001D69" stroke-width="1.6"/>';
  s+='<text class="nlab" x="175" y="118" text-anchor="middle">The clinic</text>';
  s+='<text class="dlab" x="175" y="142" text-anchor="middle">These are its patients.</text>';
  s+='<text class="dlab" x="175" y="162" text-anchor="middle">Its name is on the records.</text>';
  s+='<rect x="506" y="82" width="270" height="120" rx="12" fill="#DCE1FF" stroke="#001D69" stroke-width="1.8"/>';
  s+='<text class="nlab" x="641" y="118" text-anchor="middle">Cumberland</text>';
  s+='<text class="dlab" x="641" y="142" text-anchor="middle">Holds the records under</text>';
  s+='<text class="dlab" x="641" y="162" text-anchor="middle">contract. Liable under HIPAA.</text>';
  s+='<foreignObject x="40" y="216" width="736" height="60" class="fade" data-i="71">'+
     '<div xmlns="http://www.w3.org/1999/xhtml" style="font:400 13px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#484646;background:#DCE1FF;border-left:3px solid #001D69;padding:8px 10px;border-radius:0 6px 6px 0">'+
     '<strong style="color:#1C1B1B">HIPAA.</strong> The US law that sets the rules for protecting health data. It applies to Cumberland because Cumberland holds the data, not because the data is Cumberland&rsquo;s.</div></foreignObject>';
  return svg('0 0 816 296',s);
}

var ALT=["A field of 180 dots, one for each person who works at Cumberland Claims Services.", "Forty one small clinic symbols and two larger hospital symbols, with arrows running into a single box labelled Cumberland, 180 people, Bowling Green.", "A rail with four stops. The claim starts at the clinic. It stops at Cumberland to be checked and corrected. It then moves to the clearinghouse, and finally to the payer. Clearinghouse: the middleman that routes a claim to the insurer, think courier service for medical billing. Payer: the insurer that actually pays the claim.", "A claim card listing the five things it has to contain: name, date of birth, diagnosis, procedure, insurance details.", "A dense field of 2,100 marks, one mark for every thousand people whose records Cumberland holds.", "The same rail running the other way. The payer pays the claim, Cumberland passes it through, and the clinic gets paid. Cumberland never owns this money.", "Two boxes side by side. The clinic, whose patients these are and whose name is on the records. Cumberland, which holds the records under contract and is liable under HIPAA. A tag labelled Responsibility slides from Cumberland toward the clinic and returns to Cumberland. HIPAA: the US law that sets the rules for protecting health data."];
var VIZ=[vizPeople,vizSources,vizClaimRail,vizClaimCard,vizScale,vizMoney,vizObligation];
var COUNTER=[{to:180,lbl:'people'},null,null,null,{to:2100000,lbl:'people&rsquo;s records'},null,null];

/* ========== build slides ========== */
var slides=[],heads=[];
for(var i=0;i<N;i++){
  var sec=document.createElement('section');
  sec.className='slide';
  sec.id='sl'+(i+1);
  sec.setAttribute('role','group');
  sec.setAttribute('aria-label','Panel '+(i+1)+' of '+N);
  if(i>0){sec.hidden=true;}
  var cnt=COUNTER[i];
  var html='<div class="hd"><span class="rh">'+(i>0?RUNHEAD:'')+'</span><span class="pos">'+(i+1)+' of '+N+'</span></div>';
  html+='<div class="bd">';
  html+=(i===0?'<h1 tabindex="-1">':'<h2 tabindex="-1">')+COPY[i].h+(i===0?'</h1>':'</h2>');
  html+='<p class="ln">'+COPY[i].l+'</p>';
  if(cnt){html+='<div class="bigrow"><span class="big" id="cnt'+i+'">0</span><span class="lbl">'+cnt.lbl+'</span></div>';}
  html+='<p class="sr">'+ALT[i]+'</p>';
  html+='<div class="viz">'+VIZ[i]()+'</div>';
  if(COPY[i].f){html+='<p class="fn">'+COPY[i].f+'</p>';}
  html+='</div>';
  html+='<div class="ab"><div class="abl">'+
        '<button class="btn sec" type="button" data-a="back">'+ic(P.back)+'Back</button>'+
        '<button class="btn sec" type="button" data-a="replay">'+ic(P.replay)+'Play again</button>'+
        '</div><div class="abr">'+
        '<button class="btn" type="button" data-a="next">'+(i===N-1?'Done':'Next')+ic(P.next)+'</button>'+
        '</div></div>';
  sec.innerHTML=html;
  W.appendChild(sec);
  slides.push(sec);
  heads.push(sec.querySelector('h1,h2'));
}

/* ========== animation engine ========== */
var timers=[],cur=0;
var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function clear(){for(var i=0;i<timers.length;i++){clearTimeout(timers[i]);}timers=[];}
function at(ms,fn){if(RM){fn();return;}timers.push(setTimeout(fn,ms));}
function all(sec,sel){return Array.prototype.slice.call(sec.querySelectorAll(sel));}
function reset(sec){
  all(sec,'.dot,.gl,.fade,.draw').forEach(function(e){e.classList.remove('on');});
  all(sec,'.nodebox').forEach(function(e){e.classList.remove('act');});
  var t=sec.querySelector('#tok');if(t){t.setAttribute('transform','translate('+RAIL4[0]+',0)');}
  var m=sec.querySelector('#mtok');if(m){m.setAttribute('transform','translate('+RAIL3[0]+',0)');}
  var g=sec.querySelector('#tag');if(g){g.setAttribute('transform','translate(0,0)');}
  var r=sec.querySelector('#swpr');if(r){r.classList.remove('sweep');r.setAttribute('width','0');}
  var c=sec.querySelector('.big');if(c){c.textContent='0';}
  void sec.offsetWidth;
}
function count(el,to,ms){
  if(!el){return;}
  if(RM){el.textContent=to.toLocaleString('en-US');return;}
  var t0=null;
  function step(ts){
    if(t0===null){t0=ts;}
    var p=Math.min(1,(ts-t0)/ms);
    var e=1-Math.pow(1-p,3);
    el.textContent=Math.round(to*e).toLocaleString('en-US');
    if(p<1){requestAnimationFrame(step);}
  }
  requestAnimationFrame(step);
}
function onAll(sec,sel,stepMs,startMs){
  all(sec,sel).forEach(function(e,i){at((startMs||0)+i*stepMs,function(){e.classList.add('on');});});
}

function play(n){
  var sec=slides[n];
  clear();reset(sec);
  if(n===0){
    onAll(sec,'.dot',9,120);
    at(120,function(){count(sec.querySelector('#cnt0'),180,1700);});
  }
  else if(n===1){
    onAll(sec,'.gl',26,100);
    at(1300,function(){all(sec,'.draw').forEach(function(e){e.classList.add('on');});});
    at(1750,function(){all(sec,'.fade').forEach(function(e){e.classList.add('on');});});
  }
  else if(n===2){
    var tok=sec.querySelector('#tok');
    var nb=[0,1,2,3].map(function(k){return sec.querySelector('#nb'+k);});
    var defs=all(sec,'.fade');
    at(200,function(){nb[0].classList.add('act');});
    at(900,function(){nb[0].classList.remove('act');tok.setAttribute('transform','translate('+RAIL4[1]+',0)');});
    at(1700,function(){nb[1].classList.add('act');sec.querySelector('#ckd').classList.add('on');});
    at(2900,function(){nb[1].classList.remove('act');tok.setAttribute('transform','translate('+RAIL4[2]+',0)');});
    at(3700,function(){nb[2].classList.add('act');defs.forEach(function(e){if(e.getAttribute('data-i')==='32'){e.classList.add('on');}});});
    at(5000,function(){nb[2].classList.remove('act');tok.setAttribute('transform','translate('+RAIL4[3]+',0)');});
    at(5800,function(){nb[3].classList.add('act');defs.forEach(function(e){if(e.getAttribute('data-i')==='33'){e.classList.add('on');}});});
  }
  else if(n===3){
    onAll(sec,'.gl',260,300);
  }
  else if(n===4){
    at(150,function(){
      var r=sec.querySelector('#swpr');
      if(RM){r.setAttribute('width','780');}
      else{r.classList.add('sweep');r.setAttribute('width','780');}
      count(sec.querySelector('#cnt4'),2100000,1900);
    });
  }
  else if(n===5){
    var mt=sec.querySelector('#mtok');
    var mb=[0,1,2].map(function(k){return sec.querySelector('#mb'+k);});
    at(200,function(){mb[0].classList.add('act');});
    at(1000,function(){mb[0].classList.remove('act');mt.setAttribute('transform','translate('+RAIL3[1]+',0)');});
    at(1900,function(){mb[1].classList.add('act');});
    at(2800,function(){mb[1].classList.remove('act');mt.setAttribute('transform','translate('+RAIL3[2]+',0)');});
    at(3600,function(){mb[2].classList.add('act');});
  }
  else if(n===6){
    var tag=sec.querySelector('#tag');
    at(300,function(){all(sec,'.fade').forEach(function(e){if(e.getAttribute('data-i')==='71'){e.classList.add('on');}});});
    at(1100,function(){tag.setAttribute('transform','translate(-366,0)');});
    at(1750,function(){tag.setAttribute('transform','translate(-316,0)');});
    at(2100,function(){tag.setAttribute('transform','translate(0,0)');});
    at(2650,function(){all(sec,'.fade').forEach(function(e){if(e.getAttribute('data-i')==='70'){e.classList.add('on');}});});
  }
}

/* ========== navigation ========== */
function show(n){
  if(n<0||n>=N){return;}
  slides[cur].hidden=true;
  cur=n;
  slides[cur].hidden=false;
  var backs=all(slides[cur],'[data-a="back"]');
  backs.forEach(function(b){b.disabled=(cur===0);});
  var nx=slides[cur].querySelector('[data-a="next"]');
  nx.disabled=(cur===N-1);
  heads[cur].classList.add('fx');
  heads[cur].focus();
  play(cur);
  fit();
}
function armHead(h){h.addEventListener('blur',function(){h.classList.remove('fx');});}
for(var k=0;k<N;k++){armHead(heads[k]);}
W.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('button[data-a]'):null;
  if(!b){return;}
  var a=b.getAttribute('data-a');
  if(a==='next'){show(cur+1);}
  else if(a==='back'){show(cur-1);}
  else if(a==='replay'){play(cur);}
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){show(cur+1);}
  else if(e.key==='ArrowLeft'){show(cur-1);}
});

/* ========== fit ========== */
function fit(){
  var pm=window.innerWidth<600;
  if(pm){W.classList.add('pm');}else{W.classList.remove('pm');}
  var cw=pm?480:960,ch=pm?640:540;
  var s=Math.min(window.innerWidth/cw,window.innerHeight/ch,1);
  W.style.transform='scale('+s+')';
  W.style.left=Math.max(0,(window.innerWidth-cw*s)/2)+'px';
  W.style.top=Math.max(0,(window.innerHeight-ch*s)/2)+'px';
}
window.addEventListener('resize',fit);
window.addEventListener('load',fit);
slides[0].querySelector('[data-a="back"]').disabled=true;
fit();
var start=parseInt((location.hash||'').replace('#',''),10);
if(start>=1&&start<=N){show(start-1);}else{play(0);}
}());
</script>
