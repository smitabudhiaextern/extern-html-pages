  Used in the module's Step 3, "Rewrite All Eight". Hints only: this page never writes
  a rewrite for the student, and never prints Answer B from the Step 1 interactive.
  Governing authority: output/programs/vciso/CLAUDE.md section 6. Look, navigation,
  scale-to-fit, phone layout and state handling match
  vciso-p4-m11-which-answer-would-you-rather-receive.html.

  Sources for every fact:
  - Question wording, Ray's answer and Vendor comment, word for word:
    P4 Sample Pack/Shared/Prior signed questionnaire (Cumberland to Meridian).md,
    rows A2, B4, D6, A3, D5, C1, D4, B1.
  - Grades, what backs each claim and what is missing: Prior questionnaire and
    evidence - answer key.md, section 1, including its two caveats on claims 3 and 4
    and "Weak is not the same as nothing".
  - File names: the names students see in their Drive evidence folders, as used in
    vciso-p4-m8-what-do-the-failures-have-in-common.html (firewall file name per
    Chaitanya 25 Sep, item 10e: CCS-FW01_backup_2026-06-02 in place of the key's
    firewall-config-export.txt; the console export and sign-in sample are Google
    Sheets, so they carry no .csv). The same names are in all four scope folders.
  - Claim 5: the m8 cell text Chaitanya approved (25 Sep, item 10b): Nate's system
    list exists but never says which systems hold patient data.
  - Claim 4 "Look closer": follows module 8 Step 2 and the m8 interactive
    (ridgeline-svc is most likely Ridgeline IT's login; the file does not say whose).
    Students have met Ridgeline IT and ridgeline-svc in module 8. The key's
    "Environment Record S4" and "shared" admin access are not named, because
    students have not been told the account is shared.
  - The three ways to rewrite a claim, and No: module 11 Step 3 (Chaitanya's three
    ways; No is on Meridian's form).
  - Plain-words lines under each question reuse the m8 interactive's definitions.

  The third question on each claim, "Which way fits?", is OUR mapping of claims to
  ways, not Chaitanya's. It is not in the answer key. Ask Chaitanya to review it.

  No scoring: each question has a button that shows the answer after the student
  has thought about it. Nothing is marked right or wrong.
-->

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:52px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;

  <div class="nsf">
    <h2>Rewrite Each Claim</h2>
    <p>We are going to show you Cumberland's eight claims one at a time, in the order you will rewrite them. For each claim, think about the three questions first, then read the answers below it.</p>
    <p>There are three ways to rewrite a claim so that it can be defended:</p>
    <ul>
      <li>Narrow it to what is true.</li>
      <li>Change it to Partly, and name what is missing.</li>
      <li>Keep Yes, and name the file that proves it.</li>
    </ul>
    <p>Meridian's form also allows No, if no file backs any part of the claim.</p>
    <div id="nsf-claims">
      <h3>Claim 5: Question A2</h3>
      <p><strong>“Do you maintain a list of every system that holds patient data?”</strong></p>
      <p>Ray's answer and comment: Yes. “Our systems administrator maintains a full list of company systems.” Graded: <strong>Can't be proven</strong>.</p>
      <p>A system here means any server, program or place that stores or handles data. Patient data is the information Cumberland holds about patients.</p>
      <p>Think about these three questions before you read the answers.</p>
      <ul>
        <li><strong>If Meridian said “show me”, which file would Ray hand over?</strong> There is no file to hand over. Nothing in your evidence folder shows which systems hold patient data.</li>
        <li><strong>What is missing?</strong> A list that names the systems holding patient data. Nate's system list from Project 1 lists servers and applications, but it never says which of them hold patient data.</li>
        <li><strong>Which way fits?</strong> No, and say what is missing, because no file backs any part of the claim. In the Which Way column, that is No.</li>
      </ul>
      <h3>Claim 8: Question B4</h3>
      <p><strong>“Is a staff member's system access removed the same day they leave?”</strong></p>
      <p>Ray's answer and comment: Yes. “Handled by IT on the leaving date.” Graded: <strong>Can't be proven</strong>.</p>
      <p>Removing access means switching off a leaver's accounts, so that they can no longer log in. A leaver is a person leaving the company.</p>
      <p>Think about these three questions before you read the answers.</p>
      <ul>
        <li><strong>If Meridian said “show me”, which file would Ray hand over?</strong> There is no file to hand over. Nothing in your evidence folder shows when a leaver's access was removed.</li>
        <li><strong>What is missing?</strong> Any record at all. There is no leaver checklist, no ticket and no record that this happens. A ticket is a request that is written down and tracked.</li>
        <li><strong>Which way fits?</strong> No, and say what is missing, because no file backs any part of the claim. In the Which Way column, that is No.</li>
      </ul>
      <h3>Claim 6: Question D6</h3>
      <p><strong>“Are firewall rules reviewed on a regular schedule?”</strong></p>
      <p>Ray's answer and comment: Yes. “Reviewed quarterly.” Graded: <strong>Partly proven</strong>.</p>
      <p>Firewall rules decide which traffic the firewall lets through. Quarterly means every three months.</p>
      <p>Think about these three questions before you read the answers.</p>
      <ul>
        <li><strong>If Meridian said “show me”, which file would Ray hand over?</strong> <code>firewall-review-emails.pdf</code>, two short emails from Nate to Ray, dated 14 March 2024 and 22 August 2024, saying he went through the firewall rules.</li>
        <li><strong>What is missing?</strong> The emails show two reviews, not a review every three months. There is no email for the last three months of 2024, none for 2025, and no written process.</li>
        <li><strong>Which way fits?</strong> Partly, and name what is missing. Name the emails for the part they do show. In the Which Way column, that is Partly.</li>
      </ul>
      <h3>Claim 7: Question A3</h3>
      <p><strong>“Do all staff complete security awareness training at least annually?”</strong></p>
      <p>Ray's answer and comment: Yes. “Delivered to all staff every year.” Graded: <strong>Partly proven</strong>.</p>
      <p>Security awareness training teaches staff to spot and avoid security risks. Annually means once a year.</p>
      <p>Think about these three questions before you read the answers.</p>
      <ul>
        <li><strong>If Meridian said “show me”, which file would Ray hand over?</strong> <code>awareness-training-attendance-2024.pdf</code>, the attendance record for the training given in January 2024. An attendance record lists who came.</li>
        <li><strong>What is missing?</strong> The session was in January 2024, and there is no 2025 session. So the file shows one training, not a yearly one.</li>
        <li><strong>Which way fits?</strong> Partly, and name what is missing. Or narrow it to the training that did happen, and name the file. In the Which Way column, that is Partly or Narrowed.</li>
      </ul>
      <h3>Claim 1: Question D5</h3>
      <p><strong>“Is a network firewall in place between your systems and the internet?”</strong></p>
      <p>Ray's answer and comment: Yes. “Perimeter firewall in place.” Graded: <strong>Proven</strong>.</p>
      <p>A firewall is the device between Cumberland's network and the internet. Its rules decide what traffic gets in. Perimeter means the edge of the network.</p>
      <p>Think about these three questions before you read the answers.</p>
      <ul>
        <li><strong>If Meridian said “show me”, which file would Ray hand over?</strong> <code>CCS-FW01_backup_2026-06-02</code>, the firewall's own configuration export: a copy of every setting on the firewall, saved by the firewall itself. CCS-FW01 is Cumberland's firewall.</li>
        <li><strong>What is missing?</strong> Nothing is missing for the claim as written. The file shows the firewall and its rules, and its name carries the date it was saved.</li>
        <li><strong>Which way fits?</strong> Keep Yes, and name the file that proves it. In the Which Way column, that is Yes.</li>
      </ul>
      <h3>Claim 2: Question C1</h3>
      <p><strong>“Is patient data backed up daily?”</strong></p>
      <p>Ray's answer and comment: Yes. “Backed up every night.” Graded: <strong>Proven</strong>.</p>
      <p>A backup is a saved copy of data, so that it can be brought back if it is lost.</p>
      <p>Think about these three questions before you read the answers.</p>
      <ul>
        <li><strong>If Meridian said “show me”, which file would Ray hand over?</strong> <code>veeam-backup-report.pdf</code>, the backup program's own report of the copies it makes each night. It shows Success every night across 30 days.</li>
        <li><strong>What is missing?</strong> Nothing is missing for the claim as written. The claim says daily, and the report shows a backup every night for 30 days.</li>
        <li><strong>Which way fits?</strong> Keep Yes, and name the file that proves it. In the Which Way column, that is Yes.</li>
      </ul>
      <h3>Claim 3: Question D4</h3>
      <p><strong>“Is anti-malware protection installed on all servers and workstations?”</strong></p>
      <p>Ray's answer and comment: Yes. “Installed across the estate.” Graded: <strong>Proven</strong>.</p>
      <p>Anti-malware is software that finds and blocks harmful programs. Workstations are staff computers. The estate means all of Cumberland's computers.</p>
      <p>Think about these three questions before you read the answers.</p>
      <ul>
        <li><strong>If Meridian said “show me”, which file would Ray hand over?</strong> <code>endpoint-protection-console-export</code>, a list saved from the screen that manages the anti-malware. It shows each machine it lists with anti-malware installed and reporting.</li>
        <li><strong>What is missing?</strong> Look closer. The export shows anti-malware installed on the day it was saved, not that anyone watches it, so if the anti-malware on a machine went silent, no one would notice.</li>
        <li><strong>Which way fits?</strong> Keep Yes and name the file, or narrow it to what the file shows. In the Which Way column, that is Yes or Narrowed.</li>
      </ul>
      <h3>Claim 4: Question B1</h3>
      <p><strong>“Is multi-factor authentication required for administrative access?”</strong></p>
      <p>Ray's answer and comment: Yes. “Required for admin accounts.” Graded: <strong>Proven</strong>.</p>
      <p>Multi-factor authentication (MFA) means proving who you are in two ways, like a password and a code on your phone. Administrative access means signing in to the accounts that can change settings.</p>
      <p>Think about these three questions before you read the answers.</p>
      <ul>
        <li><strong>If Meridian said “show me”, which file would Ray hand over?</strong> <code>admin-mfa-policy.pdf</code>, the rule that requires MFA for all admin roles, and <code>admin-signin-sample</code>, a log of real admin logins that shows the rule being met.</li>
        <li><strong>What is missing?</strong> Look closer. The files cover Cumberland's own administrators. The <code>ridgeline-svc</code> account in the firewall file is most likely the login of Ridgeline IT, Cumberland's outside provider, and it may not go through this MFA rule at all.</li>
        <li><strong>Which way fits?</strong> Keep Yes and name the files, or narrow it to what the files show. In the Which Way column, that is Yes or Narrowed.</li>
      </ul>
    </div>
    <div class="box"><p>Now write your rewrite for each claim in the Rewritten Answer column of your Rewrites tab, and the way you used in the Which Way column.</p></div>
  </div>

    gap:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/><path d="M8.5 11h5"/>',
    route:'<circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8.2 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.8"/>',
    narrow:'<path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/>',
    partly:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 6.5h3.5M12 10h7.2M12 13.5h7.2M12 17h3.5"/>',
    yesfile:'<path d="M13 3.5H7a1.5 1.5 0 0 0-1.5 1.5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V9z"/><path d="M13 3.5V9h5.5"/><path d="m9 14.5 2.2 2.2L15.5 12"/>',
    proven:'<circle cx="12" cy="12" r="8.5"/><path d="M8 12.3l2.8 2.8 5.4-5.6"/>',
    cant:'<circle cx="12" cy="12" r="8.5"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/>',
    info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2M12 7.8v.2"/>',
    eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
    eyeoff:'<path d="M4 4l16 16"/><path d="M9.9 6A9.8 9.8 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.6 3.4M6.6 7.6C4 9.3 2.5 12 2.5 12S6 18.5 12 18.5a9 9 0 0 0 4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
    pencil:'<path d="M4 20l1-4.5L16.5 4a2.1 2.1 0 0 1 3 3L8 18.5z"/><path d="M14.5 6l3 3"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }

  /* ---------------- content ----------------
     q, ans: the signed form, word for word. grade, a, b: the answer key, section 1,
     in plain words. f marks a file name, shown in code style. gl: plain words for the
     terms in the question (m8 interactive definitions). */
  var GRADE = {
    cant:{ t:"Can't be proven", ic:"cant" },
    partly:{ t:"Partly proven", ic:"partly" },
    proven:{ t:"Proven", ic:"proven" }
  };
  var QS = [
    { k:"a", ic:"file",  t:"If Meridian said “show me”, which file would Ray hand over?" },
    { k:"b", ic:"gap",   t:"What is missing?" },
    { k:"c", ic:"route", t:"Which way fits?" }
  ];

  /* Each answer is a list of parts: plain strings, or {f:"file-name"} for code style.
     The "c" answers ("Which way fits?") are OUR mapping, not Chaitanya's. */
  var CLAIMS = [
    { n:5, row:"A2", grade:"cant",
      q:"Do you maintain a list of every system that holds patient data?",
      ans:"Yes. “Our systems administrator maintains a full list of company systems.”",
      gl:"A system here means any server, program or place that stores or handles data. Patient data is the information Cumberland holds about patients.",
      a:["There is no file to hand over. Nothing in your evidence folder shows which systems hold patient data."],
      b:["A list that names the systems holding patient data. Nate's system list from Project 1 lists servers and applications, but it never says which of them hold patient data."],
      c:["No, and say what is missing, because no file backs any part of the claim. In the Which Way column, that is No."] },
    { n:8, row:"B4", grade:"cant",
      q:"Is a staff member's system access removed the same day they leave?",
      ans:"Yes. “Handled by IT on the leaving date.”",
      gl:"Removing access means switching off a leaver's accounts, so that they can no longer log in. A leaver is a person leaving the company.",
      a:["There is no file to hand over. Nothing in your evidence folder shows when a leaver's access was removed."],
      b:["Any record at all. There is no leaver checklist, no ticket and no record that this happens. A ticket is a request that is written down and tracked."],
      c:["No, and say what is missing, because no file backs any part of the claim. In the Which Way column, that is No."] },
    { n:6, row:"D6", grade:"partly",
      q:"Are firewall rules reviewed on a regular schedule?",
      ans:"Yes. “Reviewed quarterly.”",
      gl:"Firewall rules decide which traffic the firewall lets through. Quarterly means every three months.",
      a:[{f:"firewall-review-emails.pdf"}, ", two short emails from Nate to Ray, dated 14 March 2024 and 22 August 2024, saying he went through the firewall rules."],
      b:["The emails show two reviews, not a review every three months. There is no email for the last three months of 2024, none for 2025, and no written process."],
      c:["Partly, and name what is missing. Name the emails for the part they do show. In the Which Way column, that is Partly."] },
    { n:7, row:"A3", grade:"partly",
      q:"Do all staff complete security awareness training at least annually?",
      ans:"Yes. “Delivered to all staff every year.”",
      gl:"Security awareness training teaches staff to spot and avoid security risks. Annually means once a year.",
      a:[{f:"awareness-training-attendance-2024.pdf"}, ", the attendance record for the training given in January 2024. An attendance record lists who came."],
      b:["The session was in January 2024, and there is no 2025 session. So the file shows one training, not a yearly one."],
      c:["Partly, and name what is missing. Or narrow it to the training that did happen, and name the file. In the Which Way column, that is Partly or Narrowed."] },
    { n:1, row:"D5", grade:"proven",
      q:"Is a network firewall in place between your systems and the internet?",
      ans:"Yes. “Perimeter firewall in place.”",
      gl:"A firewall is the device between Cumberland's network and the internet. Its rules decide what traffic gets in. Perimeter means the edge of the network.",
      a:[{f:"CCS-FW01_backup_2026-06-02"}, ", the firewall's own configuration export: a copy of every setting on the firewall, saved by the firewall itself. CCS-FW01 is Cumberland's firewall."],
      b:["Nothing is missing for the claim as written. The file shows the firewall and its rules, and its name carries the date it was saved."],
      c:["Keep Yes, and name the file that proves it. In the Which Way column, that is Yes."] },
    { n:2, row:"C1", grade:"proven",
      q:"Is patient data backed up daily?",
      ans:"Yes. “Backed up every night.”",
      gl:"A backup is a saved copy of data, so that it can be brought back if it is lost.",
      a:[{f:"veeam-backup-report.pdf"}, ", the backup program's own report of the copies it makes each night. It shows Success every night across 30 days."],
      b:["Nothing is missing for the claim as written. The claim says daily, and the report shows a backup every night for 30 days."],
      c:["Keep Yes, and name the file that proves it. In the Which Way column, that is Yes."] },
    { n:3, row:"D4", grade:"proven",
      q:"Is anti-malware protection installed on all servers and workstations?",
      ans:"Yes. “Installed across the estate.”",
      gl:"Anti-malware is software that finds and blocks harmful programs. Workstations are staff computers. The estate means all of Cumberland's computers.",
      a:[{f:"endpoint-protection-console-export"}, ", a list saved from the screen that manages the anti-malware. It shows each machine it lists with anti-malware installed and reporting."],
      b:["Look closer. The export shows anti-malware installed on the day it was saved, not that anyone watches it, so if the anti-malware on a machine went silent, no one would notice."],
      c:["Keep Yes and name the file, or narrow it to what the file shows. In the Which Way column, that is Yes or Narrowed."] },
    { n:4, row:"B1", grade:"proven",
      q:"Is multi-factor authentication required for administrative access?",
      ans:"Yes. “Required for admin accounts.”",
      gl:"Multi-factor authentication (MFA) means proving who you are in two ways, like a password and a code on your phone. Administrative access means signing in to the accounts that can change settings.",
      a:[{f:"admin-mfa-policy.pdf"}, ", the rule that requires MFA for all admin roles, and ", {f:"admin-signin-sample"}, ", a log of real admin logins that shows the rule being met."],
      b:["Look closer. The files cover Cumberland's own administrators. The ", {f:"ridgeline-svc"}, " account in the firewall file is most likely the login of Ridgeline IT, Cumberland's outside provider, and it may not go through this MFA rule at all."],
      c:["Keep Yes and name the files, or narrow it to what the files show. In the Which Way column, that is Yes or Narrowed."] }
  ];

  var INTRO = {
    h1:"Rewrite Each Claim",
    lead:"We are going to show you Cumberland's eight claims one at a time, in the order you will rewrite them. For each claim, think about each question first, then show the answer and compare it with yours.",
    ways:[ { ic:"narrow", t:"Narrow it to what is true." },
           { ic:"partly", t:"Change it to Partly, and name what is missing." },
           { ic:"yesfile", t:"Keep Yes, and name the file that proves it." } ],
    no:"Meridian's form also allows No, if no file backs any part of the claim.",
    note:"These are hints, not rewrites. The words in your Rewrites tab are yours to write. The files we name here have the same names in every scope's evidence folder."
  };
  var CLOSE = {
    h1:"Now Write Your Rewrites",
    line:"Now write your rewrite for each claim in the Rewritten Answer column of your Rewrites tab, and the way you used in the Which Way column."
  };

  var S = [{ kind:"intro" }];
  CLAIMS.forEach(function(c, k){ S.push({ kind:"claim", c:c, pos:k+1 }); });
  S.push({ kind:"close" });

  /* ---------------- state ----------------
     i = the screen; open = for each claim number, which of a, b, c are shown. */
  var KEY = "vciso-p4-m11-rewrite-each-claim-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { i:0, open:{} }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var s = fresh();
      if(Number.isInteger(raw.i) && raw.i >= 0 && raw.i < S.length) s.i = raw.i;
      if(isPlain(raw.open)) CLAIMS.forEach(function(c){
        var o = raw.open[c.n];
        if(Array.isArray(o)){
          var keep = o.filter(function(k){ return k === "a" || k === "b" || k === "c"; });
          if(keep.length) s.open[c.n] = keep.filter(function(k, j){ return keep.indexOf(k) === j; });
        }
      });
      return s;
    }catch(e){ return fresh(); }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = ""; setTimeout(function(){ el.live.textContent = m; }, 30); }
  function phone(){ return window.matchMedia("(max-width:599px)").matches; }
  function parts(list){ return list.map(function(p){ return typeof p === "string" ? esc(p) : "<code>" + esc(p.f) + "</code>"; }).join(""); }
  function plain(list){ return list.map(function(p){ return typeof p === "string" ? p : p.f; }).join(""); }
  function isOpen(n, k){ return (st.open[n] || []).indexOf(k) >= 0; }
  function titleOf(s){
    if(s.kind === "intro") return INTRO.h1;
    if(s.kind === "close") return CLOSE.h1;
    return "Claim " + s.c.n + ": Question " + s.c.row;
  }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[st.i];
    el.prog.textContent = s.kind === "claim" ? "Rewrite " + s.pos + " of " + CLAIMS.length
      : s.kind === "intro" ? "Before you start" : "Your turn";
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<st.i?"on":k===st.i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    el.back.disabled = (st.i === 0);
    el.next.classList.remove("ghost");
    el.next.disabled = false;
    if(s.kind === "intro"){
      el.next.textContent = "Start";
      el.hint.textContent = "";
    } else if(s.kind === "claim"){
      el.next.textContent = "Next";
      el.hint.textContent = "Think about each question first, then show its answer.";
    } else {
      el.next.textContent = "Start over";
      el.next.classList.add("ghost");
      el.hint.textContent = "Start over hides every answer again.";
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[st.i];
    el.h1.textContent = titleOf(s);
    el.frame.setAttribute("aria-label", titleOf(s));
    if(s.kind === "intro") renderIntro();
    else if(s.kind === "claim") renderClaim(s.c);
    else renderClose();
    header();
  }
  function announce(){
    var s = S[st.i];
    if(s.kind === "claim") say("Rewrite " + s.pos + " of " + CLAIMS.length + ". " + titleOf(s) + ". " + s.c.q + " Graded " + GRADE[s.c.grade].t + ".");
    else if(s.kind === "intro") say(INTRO.h1 + ".");
    else say(CLOSE.line);
  }

  function renderIntro(){
    el.board.innerHTML = '<p class="lead">' + esc(INTRO.lead) + "</p>"
      + '<div class="ways" role="list" aria-label="Three ways to rewrite a claim">'
      + INTRO.ways.map(function(w, k){
          return '<div class="way" role="listitem"><span class="wi">' + icon(w.ic) + '</span>'
            + '<span><span class="wn">Way ' + (k+1) + '</span><br><span class="wt">' + esc(w.t) + "</span></span></div>";
        }).join("")
      + "</div>"
      + '<p class="alsono">' + esc(INTRO.no) + "</p>"
      + '<p class="note">' + icon("info") + "<span>" + esc(INTRO.note) + "</span></p>";
  }

  function renderClaim(c){
    var g = GRADE[c.grade];
    el.board.innerHTML = '<div class="claim">'
      + '<div class="card">'
      +   '<div class="row"><span class="ri">' + icon("form") + '</span><span class="rt">'
      +     '<span class="rl">Question ' + esc(c.row) + " on Meridian's form</span>"
      +     '<span class="rq">“' + esc(c.q) + "”</span></span></div>"
      +   "<hr>"
      +   '<div class="row"><span class="ri">' + icon("chat") + '</span><span class="rt">'
      +     '<span class="rl">Ray\'s answer and comment</span>'
      +     '<span class="ra">' + esc(c.ans) + "</span></span></div>"
      +   "<hr>"
      +   '<span class="grade">' + icon(g.ic) + "Graded: " + esc(g.t) + "</span>"
      +   '<p class="gl">' + esc(c.gl) + "</p>"
      + "</div>"
      + '<div class="qs">'
      + QS.map(function(q, k){
          var on = isOpen(c.n, q.k), id = "ans-" + c.n + q.k;
          return '<div class="q' + (on ? " open" : "") + '" data-k="' + q.k + '">'
            + '<div class="qh"><span class="qn" aria-hidden="true">' + (k+1) + "</span>"
            +   '<span class="qt" id="qt-' + c.n + q.k + '">' + esc(q.t) + "</span>"
            +   '<button class="rv" type="button" data-k="' + q.k + '" aria-expanded="' + on + '" aria-controls="' + id + '">'
            +     icon(on ? "eyeoff" : "eye") + (on ? "Hide answer" : "Show answer") + "</button></div>"
            + '<div class="ans" id="' + id + '"' + (on ? "" : " hidden") + ' role="region" aria-labelledby="qt-' + c.n + q.k + '">'
            +   icon(q.ic) + "<p>" + parts(c[q.k]) + "</p></div>"
            + "</div>";
        }).join("")
      + "</div></div>";
    Array.prototype.forEach.call(el.board.querySelectorAll("button.rv"), function(b){
      b.addEventListener("click", function(){ toggle(c, b.dataset.k); });
    });
  }

  function toggle(c, k){
    var list = (st.open[c.n] || []).slice(), at = list.indexOf(k), opening = at < 0;
    if(opening) list.push(k); else list.splice(at, 1);
    if(list.length) st.open[c.n] = list; else delete st.open[c.n];
    save();
    var box = el.board.querySelector('.q[data-k="' + k + '"]');
    var b = box.querySelector("button.rv"), a = box.querySelector(".ans");
    box.classList.toggle("open", opening);
    b.setAttribute("aria-expanded", String(opening));
    b.innerHTML = icon(opening ? "eyeoff" : "eye") + (opening ? "Hide answer" : "Show answer");
    a.hidden = !opening;
    if(opening){
      if(!reduce){ a.classList.remove("in"); void a.offsetWidth; a.classList.add("in"); }
      say(plain(c[k]));
      if(phone()) a.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block:"nearest" });
    } else say("Answer hidden.");
  }

  function renderClose(){
    el.board.innerHTML = '<div class="closewrap"><div class="statement">' + icon("pencil")
      + "<p>" + esc(CLOSE.line) + "</p></div></div>";
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = st.i + d;
    if(n < 0 || n >= S.length) return;
    st.i = n; save(); render(); announce();
    if(phone()) window.scrollTo(0,0);
    el.frame.focus({preventScroll:true});
  }
  function startOver(){
    st = fresh(); save(); render();
    if(phone()) window.scrollTo(0,0);
    el.frame.focus({preventScroll:true});
    say("Started over. Every answer is hidden again. " + INTRO.h1 + ".");
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){
    if(st.i === S.length-1){ startOver(); return; }
    go(1);
  });

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target) || e.altKey || e.ctrlKey || e.metaKey) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(st.i < S.length-1) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });
  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(st.i < S.length-1) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();
  announce();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      st.i = n; save(); render(); return true;
    },
    slides:S.length,
    openAll:function(){ CLAIMS.forEach(function(c){ st.open[c.n] = ["a","b","c"]; }); save(); render(); },
    reset:function(){ st = fresh(); save(); render(); },
    state:function(){ return JSON.parse(JSON.stringify(st)); }
  };
})();
</script>
</body>
</html>
