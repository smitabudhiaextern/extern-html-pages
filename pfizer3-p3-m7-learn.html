<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regex on the Supplier File</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Card player (rail, one card at a time, Back and Next) copied from
   pfizer3-p3-m5-learn.html, the approved Learn deck model.
   P3 module 7 Learn cards: "Learn How to Use Regex for Text Extraction with Python". Rebuilt 17 November 2026 (Smita):
   ideas only, no code. All code is in the steps deck (pfizer3-p3-m7-steps.html). Patterns appear only as small chips
   with plain words under them.
   1 Find a Date You've Never Seen: Ctrl+F vs "8 digits in a row" on page 2. 2 Turn Messy Text into a Clean Table: parsing,
   the 4 values fly from page 2 into a Field/Value table. 3 Describe What You're Looking For: build "8 digits in a row" one
   digit at a time, then guess how many it finds in the whole file. 4 Grab the Pieces of a Date: capturing groups on the
   letter's date. 5 When the Label and the Date Split: the hidden line break on page 3. The SME's Common Symbols table and
   his Key Takeaway (card 6 until 17 November 2026) moved to the last slide of the steps deck (Smita: "After they try then
   I want to show them").
   Text: the SME's (Chaitanya's) module 7 page where he has the words (em dashes already taken out when the deck was built; 17 November fix left
   them untouched): card 1 "Imagine Regex..." and "But
   what is this really doing?...", card 2 "Parsing means...", "That's parsing..." and "Going from...". Ours are titles, one
   why line per card, hints, labels and the short additions around his lines.
   Every count and box is real: run on sample-sdf-document.pdf with PyMuPDF 1.26.5 (get_text("text"), get_text("rawdict"),
   search_for()), 17 November 2026. Counts: \d{8} on the text of all 3 pages gives 11 matches, 4 of them certificate dates.
   Pictures (PyMuPDF renders of the supplier file, source: images/m7-page-renders-source.py):
   pfizer3-p3-m7-c1-p2-left.png (page 2, x 44 to 200, y 103 to 171), pfizer3-p3-m7-page1/2/3.png (whole pages),
   pfizer3-p3-m7-c5-p3-rows.png (page 3, x 44 to 258, y 163 to 221).
   Student-eye fix, 17 November 2026 (Smita). New renders, PyMuPDF 1.26.5, crop in PDF points and zoom (not yet in the
   source .py): pfizer3-p3-m7-c2-spot-dates.png (page 2, x 44 to 200, y 126 to 171, zoom 5),
   pfizer3-p3-m7-c2-spot-issued.png (page 2, x 28 to 242, y 660.5 to 677.8, zoom 5),
   pfizer3-p3-m7-c2-spot-footer.png (page 2, x 446 to 530, y 765.5 to 781, zoom 5),
   pfizer3-p3-m7-c3-p2-top.png (page 2, x 30 to 437, y 24 to 224, zoom 4; same 32 digits as before; replaced 17 November
   2026 by pfizer3-p3-m7-c3-p2-top2.png, x 30 to 426, so the line ends on "High Flow Gradient" and no phrase is cut at "C,"),
   pfizer3-p3-m7-c4-date.png (page 1, x 29 to 101, y 143 to 167, zoom 10). They replace pfizer3-p3-m7-c2-page2.png,
   pfizer3-p3-m7-p2-fields.png and pfizer3-p3-m7-c4-letter.png on these cards. What changed:
   card 1: in the pattern view the lot number 17242818 is blue (not a date) and the result line says so.
   Card 2: page 2 shown as its 3 source spots (top dates, "Issued by Cytiva", footer "Rev AD"), the footer scaled up by its
   smaller font so all 3 read at one size; our line defining unstructured and structured after the SME's parsing line;
   "Revision" explained in the table. Card 3: the guess, thumbnails and key appear only at 8 digits (the key only after
   the guess); at 8 digits the lot number is blue; after the guess the 11 numbers are listed under their pages.
   Card 4: our new why line (dates in words, why Python needs the pieces); picture cropped to the date line.
   Card 5: our why line before the SME's "In real life..." line; label "each label and value on its own line".
   QA fix, 17 November 2026 (Smita: nothing repeated or explained twice): the SME's lines on cards 3 ("Regex really
   shines..."), 4 ("Capturing groups let you...") and 5 ("In real life...") cut here, because the steps deck keeps them;
   card 4's chips lost their meaning labels (steps slide 12's table explains them); card 3's 8-digit count line shortened.
   QA fix 2, 17 November 2026: card 3 gets our why line ("To find dates you've never seen, you describe their shape, one
   digit at a time."), so it no longer opens cold; card 5's why line drops the repeat of card 3's lot-number point and
   keeps a short bridge ("Putting the label in front of the date tells Python which number you want, but there's a catch.").
   The freed height goes to the pictures: card 4's date line may grow to 704 px wide (new render at zoom 20,
   pfizer3-p3-m7-c4-date2.png, same crop as pfizer3-p3-m7-c4-date.png). Card 3's thumbnails stay at 360 px at most, so
   the guess and its "Click me" tag keep their room.
   Fixed stage: laid out on a 760 x 820 design stage, then scaled as one piece to fit the embed frame and centred
   (Notion embed height 764 px at the 708 px wide column). Nothing scrolls. Spare height on a card first widens the gaps
   between blocks (up to 2x), then enlarges the card's main picture. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --space-2:8px; --space-3:14px; --space-4:18px; --space-5:26px;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage-w:760px; --stage-h:820px;
  --c-day:var(--pfizer-blue); --c-month:var(--green-600); --c-year:var(--extern-black);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
[hidden]{display:none !important}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}
.pg-label{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-muted);white-space:nowrap}
.pg-label::after{content:attr(data-text);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:600}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:20px 28px;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.inner{display:flex;flex-direction:column;gap:12px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:2px}
.hl{color:var(--highlight)}
.why{margin:-6px 0 0;font-size:17px;line-height:1.45;font-weight:600;color:var(--ink)}
.p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty}
.p b{font-weight:600;color:var(--ink)}
.hint{margin:0;font-size:14px;line-height:1.4;font-weight:600;color:var(--step-label)}
.row{display:flex;align-items:center;gap:var(--space-4)}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.center{display:flex;justify-content:center}

/* Pattern chips: a symbol in a small box, with plain words under it */
.chip{display:inline-flex;flex-direction:column;align-items:center;gap:3px;vertical-align:top}
.chip .s{display:block;border:1.5px solid var(--ink);border-radius:var(--radius-xs);padding:3px 8px;font-family:var(--font-mono);font-size:14px;line-height:1.3;background:var(--surface);color:var(--ink);white-space:pre}
.chip .w{display:block;font-family:var(--font-text);font-size:12px;line-height:1.2;font-weight:600;color:var(--ink-muted);white-space:nowrap}
.chip.lit .s{border-color:var(--blue-200);color:var(--gray-600)}
.chip.sm .s{font-size:13px;padding:1px 6px}
.chips{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}

/* Switch */
.sw{display:inline-flex;flex:none;border:1.5px solid var(--ink);border-radius:var(--radius-xs);overflow:hidden}
.sw button{border:0;background:var(--surface);color:var(--ink);padding:9px 15px;cursor:pointer;font-size:14.5px;line-height:1.2;font-weight:600;white-space:nowrap}
.sw button + button{border-left:1.5px solid var(--ink)}
.sw button[aria-pressed="true"]{background:var(--action);color:var(--on-action)}

/* Click-me nudge: a soft pulsing outline and a small tag, both gone after the first click */
.nwrap{position:relative;display:inline-flex;flex:none}
.nudge{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(0,51,160,.55)}50%{box-shadow:0 0 0 7px rgba(0,51,160,.12)}}
.tap.static{position:static;transform:none;align-self:flex-start;margin-top:4px}
.tap{position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--surface-card);color:var(--pfizer-blue);border:1px solid var(--blue-200);border-radius:999px;padding:4px 11px;font-size:13px;line-height:1.2;font-weight:600;pointer-events:none;animation:tapx 1.6s ease-in-out infinite}
@keyframes tapx{0%,100%{margin-left:0}50%{margin-left:4px}}
@media (prefers-reduced-motion:reduce){ .nudge{animation:none;box-shadow:0 0 0 3px rgba(0,51,160,.5)} .tap{animation:none} }

/* Pictures with boxes drawn over them (an SVG in PDF points, viewBox = the picture's crop) */
.pic{position:relative;margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);line-height:0;flex:none}
.pic img{display:block;width:100%;height:auto}
.pic svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pic rect{fill:none;stroke-width:2.5px;vector-effect:non-scaling-stroke}
.pic rect.g{stroke:var(--highlight);fill:var(--highlight);fill-opacity:.16}
.pic rect.b{stroke:var(--pfizer-blue);fill:var(--pfizer-blue);fill-opacity:.12}
.pic rect.k{stroke:var(--ink);fill:var(--ink);fill-opacity:.06}
.pic rect.day{stroke:var(--c-day);fill:var(--c-day);fill-opacity:.14}
.pic rect.month{stroke:var(--c-month);fill:var(--c-month);fill-opacity:.16}
.pic rect.year{stroke:var(--c-year);fill:var(--c-year);fill-opacity:.10}
.pic rect.thin{stroke:var(--blue-200);stroke-width:1.5px;fill:none}
.pic rect.pop{animation:pop .3s ease both}
@keyframes pop{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){ .pic rect.pop{animation:none} }
.cap{margin:6px 0 0;font-size:12.5px;line-height:1.3;font-weight:600;color:var(--gray-600);text-align:center}
.res{margin:0;font-size:16px;line-height:1.5;color:var(--ink-muted);min-height:24px}
.res b{font-weight:700;color:var(--ink)}

/* Bridge strip to the next card */
.bridge{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:16px 22px;font-size:20px;line-height:1.35;font-weight:600;color:var(--card-title)}
.bridge b{color:var(--pfizer-blue);font-weight:700}
.bridge svg{width:30px;height:30px;flex:none;color:var(--pfizer-blue)}

/* Card 2: page 2 and the table the values fly into */
.parse{display:flex;gap:var(--space-5);align-items:center}
.parse .col{flex:1 1 auto;gap:14px}
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-icon)}
.tbl table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.4}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:8px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.tbl td{padding:var(--rowpad,9px) 12px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--card-text)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.v{font-family:var(--font-mono);font-size:14.5px;color:var(--ink);width:44%}
.tbl td.v:empty::before{content:"";display:block;height:20px;border:1.5px dashed var(--blue-200);border-radius:6px}
.tbl td.v.in{background:var(--surface-card)}
.tbl .def{font-size:13.5px;color:var(--gray-600)}
.spots{display:flex;flex-direction:column;gap:10px}
.spot-l{margin:0 0 4px;font-size:12.5px;line-height:1.3;font-weight:600;color:var(--pfizer-blue)}
.spots .pic{border-radius:var(--radius-xs)}
.spots .cap{margin:0;text-align:left}
.fly{position:absolute;z-index:5;margin:0;padding:2px 8px;border-radius:6px;background:var(--surface);border:2px solid var(--highlight);font-family:var(--font-mono);font-size:14.5px;line-height:20px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:left .7s cubic-bezier(.4,0,.2,1),top .7s cubic-bezier(.4,0,.2,1),opacity .2s ease}
.after{visibility:hidden}
.after.on{visibility:visible}

/* Card 3: the pattern builder and the guess */
.build{background:var(--surface-card);border-radius:var(--radius-md);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.build-top{display:flex;align-items:center;gap:var(--space-3)}
.add{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--ink);border-radius:var(--radius-xs);background:var(--surface);padding:6px 12px 6px 10px;cursor:pointer;font-weight:600;font-size:14.5px;line-height:1.2}
.add .s{font-family:var(--font-mono);font-size:14px;border:1.5px solid var(--ink);border-radius:6px;padding:1px 6px;background:var(--surface)}
.add:disabled{opacity:.45;cursor:default}
.again{margin-left:auto;background:none;border:0;padding:4px 2px;font-size:14px;font-weight:600;color:var(--pfizer-blue);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.again:disabled{visibility:hidden}
.pat{display:flex;align-items:flex-start;gap:12px;min-height:46px}
.pat-l{font-size:13px;line-height:24px;font-weight:600;color:var(--ink-muted);white-space:nowrap;padding-top:1px}
.pat .chips{gap:4px}
.pat .short{display:flex;align-items:flex-start;gap:6px;margin-left:auto;visibility:hidden}
.pat .short.on{visibility:visible}
.count{margin:0;font-size:15px;line-height:1.4;color:var(--ink-muted)}
.count b{color:var(--ink)}
.guess{display:flex;gap:var(--space-5);align-items:flex-start}
.guess .col{flex:1 1 auto;gap:10px}
.guess .thumbs{flex:none}
.q{margin:0;font-size:16px;line-height:1.45;font-weight:600;color:var(--ink)}
.opts{display:flex;gap:10px}
.opt{min-width:64px;border:1.5px solid var(--ink);border-radius:var(--radius-xs);background:var(--surface);padding:9px 16px;cursor:pointer;font-size:16px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums}
.opt:disabled{cursor:default}
.opts.off .opt{opacity:.4}
.opt.pick{background:var(--action);color:var(--on-action)}
.opt.right{box-shadow:0 0 0 3px var(--highlight)}
.reveal{visibility:hidden}
.reveal.on{visibility:visible}
.thumbs{display:flex;gap:8px;flex:none}
.thumbs figure{margin:0;flex:1 1 0;min-width:0}
.thumbs .pic{border-radius:6px}
.thumbs .pic img{opacity:.4;transition:opacity .3s ease}
.thumbs.on .pic img{opacity:1}
.c3top{aspect-ratio:396/200}
.c3top.short{aspect-ratio:396/68}
.c3top img{position:absolute;left:0;top:0}
.c3top.short img{top:-116.18%}
.nums{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.nums li{font-family:var(--font-mono);font-size:13px;line-height:18px;padding:0 5px;border-radius:4px;color:var(--ink);white-space:nowrap}
.nums li.g{background:rgba(7,166,87,.16);box-shadow:0 0 0 1.5px var(--highlight)}
.nums li.b{background:rgba(0,51,160,.10);box-shadow:0 0 0 1.5px var(--pfizer-blue)}
.key{display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.35;color:var(--ink-muted)}
.sq{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.sq.g{background:rgba(7,166,87,.25);border:2px solid var(--highlight)}
.sq.b{background:rgba(0,51,160,.12);border:2px solid var(--pfizer-blue)}

/* Card 4: the date in three colours, each part a button with its group under it */
.parts{display:flex;align-items:flex-start;gap:2px}
.parts .chip .w{white-space:normal;max-width:118px;text-align:center}
.gp{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:2px solid transparent;border-radius:var(--radius-sm);padding:4px 6px 6px;cursor:pointer}
.gp .big{font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-0.01em}
.gp.day .big{color:var(--c-day)} .gp.month .big{color:var(--c-month)} .gp.year .big{color:var(--c-year)}
.gp.day .s{border-color:var(--c-day)} .gp.month .s{border-color:var(--c-month)} .gp.year .s{border-color:var(--c-year)}
.gp[aria-pressed="true"]{background:var(--surface-card);border-color:var(--blue-200)}
.gp.gap{cursor:default;padding-left:0;padding-right:0}
.gp.gap .big{color:var(--gray-600);font-weight:400}
.grab{display:flex;align-items:center;justify-content:center;gap:12px;min-height:40px;margin:0}
.grab .gl{font-size:17px;line-height:1.4;font-weight:600;color:var(--ink)}
.grab .gl b{font-size:24px;font-weight:700}
.grab .gl b.day{color:var(--c-day)} .grab .gl b.month{color:var(--c-month)} .grab .gl b.year{color:var(--c-year)}
.grab .tap.static{order:-1;margin-top:0}

/* Card 5: the page line and the extracted text, side by side */
.split{display:flex;gap:var(--space-4);align-items:stretch}
.side-h{margin:0 0 6px;font-size:13px;line-height:1.3;font-weight:600;color:var(--pfizer-blue);letter-spacing:.02em}
.ex{margin:0;border:1px solid var(--blue-200);border-radius:var(--radius-sm);background:var(--surface-card);padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.ex .ln{display:flex;align-items:center;gap:6px;font-size:15px;line-height:24px;color:var(--ink);white-space:nowrap}
.ex .t{border-radius:4px;padding:0 3px;transition:background-color .25s ease,box-shadow .25s ease}
.ex .nl{display:inline-flex;align-items:center;justify-content:center;width:22px;height:20px;border-radius:5px;color:var(--pfizer-blue);font-weight:700;font-size:15px;transition:box-shadow .25s ease,background-color .25s ease}
.ex .t.hit{background:rgba(7,166,87,.18);box-shadow:0 0 0 1.5px var(--highlight)}
.ex .t.part{background:rgba(0,51,160,.08);box-shadow:0 0 0 1.5px var(--blue-200)}
.ex .nl.hit{background:rgba(7,166,87,.18);box-shadow:0 0 0 1.5px var(--highlight)}
.ex .nl.stop{background:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.ex .why-no{font-size:12.5px;font-weight:600;color:var(--ink);visibility:hidden}
.ex .why-no.on{visibility:visible}
.try{display:flex;flex-direction:column;gap:14px;min-width:0;flex:1 1 auto}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.btn-sm{padding:10px 16px;font-size:15px}
.btn-sm:disabled{opacity:.5;cursor:default}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="How regex finds text: five cards">
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where"><span id="where-count">Card 1 of 5</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Card"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-next" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  var each = function (list, fn) { Array.prototype.forEach.call(list, fn); };
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* A pattern chip: the symbol, with plain words under it */
  function chip(sym, words, cls) {
    return '<span class="chip' + (cls ? ' ' + cls : '') + '"><span class="s">' + sym + '</span>' + (words ? '<span class="w">' + words + '</span>' : '') + '</span>';
  }
  /* A picture of part of a page, with an empty SVG over it in PDF points (crop = x, y, width, height) */
  function pic(id, src, w, h, crop, alt, attrs) {
    return '<figure class="pic" id="' + id + '"' + (attrs || '') + '><img src="' + src + '" width="' + w + '" height="' + h + '" alt="' + alt + '">' +
      '<svg aria-hidden="true" preserveAspectRatio="none" viewBox="' + crop.join(" ") + '"></svg></figure>';
  }
  function draw(svg, boxes, cls, pop) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    boxes.forEach(function (b, n) {
      var pad = b[5] != null ? b[5] : 1.2;
      var r = document.createElementNS(NS, "rect");
      r.setAttribute("x", b[0] - pad); r.setAttribute("y", b[1] - pad);
      r.setAttribute("width", b[2] - b[0] + 2 * pad); r.setAttribute("height", b[3] - b[1] + 2 * pad);
      r.setAttribute("rx", 1.5);
      r.setAttribute("class", (b[4] || cls) + (pop ? " pop" : ""));
      if (pop) r.style.animationDelay = (n * 0.08) + "s";
      svg.appendChild(r);
    });
  }

  /* Click-me nudges: a pulsing outline on the element and a "Click me" tag beside it, until it is first clicked */
  var tapped = {};
  function nudge(root, key, target, tagHost, stat) {
    if (tapped[key] || target.classList.contains("nudge")) return;
    target.classList.add("nudge");
    var tag = document.createElement("span");
    tag.className = "tap" + (stat ? " static" : ""); tag.setAttribute("aria-hidden", "true"); tag.textContent = "\uD83D\uDC46 Click me";
    (tagHost || target.parentNode).appendChild(tag);
    target.addEventListener("click", function () {
      tapped[key] = true;
      target.classList.remove("nudge");
      if (tag.parentNode) tag.parentNode.removeChild(tag);
    }, true);
  }

  /* Real boxes [x0, y0, x1, y1] from page.search_for() and get_text("rawdict") on sample-sdf-document.pdf */
  var B_LOT2 = [108.1, 110.5, 148.4, 122.7], B_DOM2 = [148.0, 132.1, 188.3, 144.3], B_EXP2 = [125.4, 153.7, 165.8, 165.9];

  /* Card 1: Ctrl+F vs the pattern, on page 2 (crop x 44 to 200, y 103 to 171) */
  function initFind(root) {
    var svg = root.querySelector("#c1-pic svg"), res = root.querySelector("#c1-res"), btns = root.querySelectorAll(".sw button");
    var RES = {
      find: '<b>1 match:</b> only the date you typed.',
      pattern: '<b>3 matches</b>, and you didn\'t type any of them. 2 are dates. The third is the lot number, which is also 8 digits.'
    };
    function show(v, pop) {
      each(btns, function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-view") === v ? "true" : "false"); });
      draw(svg, v === "find" ? [B_EXP2] : [B_LOT2.concat(["b"]), B_DOM2, B_EXP2], "g", pop);
      res.innerHTML = RES[v];
    }
    each(btns, function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-view"), true); }); });
    show("find", false);
    nudge(root, "c1", root.querySelector(".sw"), root.querySelector(".sw").parentNode);
  }

  /* Card 2: the 4 values fly from 3 spots on page 2 into the table. Spots (crops in PDF points): the dates
     (x 44 to 200, y 126 to 171), "Issued by Cytiva Westborough Quality Assurance" (x 28 to 242, y 660.5 to 677.8) and the
     footer "29190939 Rev AD" (x 446 to 530, y 765.5 to 781). Boxes: "Cytiva", "AD" and the two dates. */
  var PARSE = [
    { pic: "c2-issued", box: [76.2, 662.5, 101.0, 674.7], val: "Cytiva" },
    { pic: "c2-footer", box: [507.6, 767.5, 517.2, 777.4], val: "AD" },
    { pic: "c2-dates", box: [148.0, 132.1, 188.3, 144.3], val: "20210126" },
    { pic: "c2-dates", box: [125.4, 153.7, 165.8, 165.9], val: "20230126" }
  ];
  var runToken = 0;
  function initParse(root) {
    var btn = root.querySelector("#parse-btn"), svgs = root.querySelectorAll(".spots svg"), cells = root.querySelectorAll("td.v"), after = root.querySelector("#c2-after");
    var app = $("app");
    function rel(el) {
      var a = app.getBoundingClientRect(), r = el.getBoundingClientRect(), s = a.width / app.offsetWidth;
      return { x: (r.left - a.left) / s, y: (r.top - a.top) / s, w: r.width / s, h: r.height / s };
    }
    btn.addEventListener("click", function () {
      var token = ++runToken;
      each(cells, function (c) { c.textContent = ""; c.classList.remove("in"); });
      each(app.querySelectorAll(".fly"), function (f) { f.parentNode.removeChild(f); });
      after.classList.remove("on");
      each(svgs, function (s) { while (s.firstChild) s.removeChild(s.firstChild); });
      btn.disabled = true;
      var shown = {};
      PARSE.forEach(function (p, n) {
        setTimeout(function () {
          if (token !== runToken || !btn.isConnected) return;
          var svg = root.querySelector("#" + p.pic + " svg");
          (shown[p.pic] = shown[p.pic] || []).push(p.box.concat(["g", 2]));
          draw(svg, shown[p.pic], "g", false);
          var rect = svg.lastChild, from = rel(rect), to = rel(cells[n]);
          if (reduce) { cells[n].textContent = p.val; cells[n].classList.add("in"); return; }
          var f = document.createElement("span");
          f.className = "fly"; f.textContent = p.val; f.style.opacity = "0";
          app.appendChild(f);
          var fw = f.offsetWidth, fh = f.offsetHeight;
          f.style.left = (from.x + from.w / 2 - fw / 2) + "px"; f.style.top = (from.y + from.h / 2 - fh / 2) + "px";
          f.getBoundingClientRect();
          f.style.opacity = "1";
          f.style.left = (to.x + 6) + "px"; f.style.top = (to.y + to.h / 2 - fh / 2) + "px";
          setTimeout(function () {
            if (f.parentNode) f.parentNode.removeChild(f);
            if (token !== runToken || !btn.isConnected) return;
            cells[n].textContent = p.val; cells[n].classList.add("in");
          }, 760);
        }, n * (reduce ? 150 : 850));
      });
      setTimeout(function () {
        if (token !== runToken || !btn.isConnected) return;
        after.classList.add("on");
        btn.disabled = false; btn.textContent = "Parse it again";
      }, PARSE.length * (reduce ? 150 : 850) + (reduce ? 0 : 500));
    });
    nudge(root, "c2", btn);
  }

  /* Card 3: the digits on page 2 as runs of digit boxes from get_text("rawdict"). The picture is page 2 from x 30 to 426,
     y 24 to 224 (title, product line, the fields and the next heading); at 8 digits it shows only y 103 to 171. Both views hold the same
     32 digits. \d{n} matches each run left to right: floor(length / n) matches. Counts for n = 1 to 8: 32, 16, 7, 7, 3, 3,
     3, 3. At 8 digits the first run (the lot number, 17242818) is drawn blue ("b"): it is 8 digits but not a date. */
  var RUNS = [
    [[108.1,110.5,113.2,122.7],[113.1,110.5,118.1,122.7],[118.2,110.5,123.2,122.7],[123.3,110.5,128.3,122.7],[128.2,110.5,133.3,122.7],[133.3,110.5,138.4,122.7],[138.4,110.5,143.4,122.7],[143.4,110.5,148.4,122.7]],
    [[366.0,110.5,371.0,122.7],[371.0,110.5,376.0,122.7]],
    [[379.2,110.5,384.2,122.7],[384.3,110.5,389.3,122.7],[389.3,110.5,394.3,122.7],[394.3,110.5,399.4,122.7]],
    [[402.4,110.5,407.4,122.7],[407.4,110.5,412.5,122.7]],
    [[148.0,132.1,153.0,144.3],[153.0,132.1,158.0,144.3],[158.0,132.1,163.1,144.3],[163.1,132.1,168.2,144.3],[168.1,132.1,173.1,144.3],[173.2,132.1,178.2,144.3],[178.2,132.1,183.2,144.3],[183.2,132.1,188.3,144.3]],
    [[125.4,153.7,130.4,165.9],[130.5,153.7,135.5,165.9],[135.5,153.7,140.5,165.9],[140.5,153.7,145.6,165.9],[145.5,153.7,150.6,165.9],[150.6,153.7,155.6,165.9],[155.8,153.7,160.8,165.9],[160.8,153.7,165.8,165.9]]
  ];
  function matches(n) {
    var out = [];
    RUNS.forEach(function (run, ri) {
      for (var k = 0; k + n <= run.length; k += n) out.push([run[k][0], run[k][1], run[k + n - 1][2], run[k + n - 1][3], n === 8 && ri === 0 ? "b" : "g", 0.6]);
    });
    return out;
  }
  /* The 11 matches of \d{8} on all 3 pages (search_for boxes); "g" = a certificate date, "b" = another 8-digit number.
     Each entry: box, colour, padding, the number itself (listed under its page after the guess, top to bottom). */
  var D8 = [
    [[92.7, 266.1, 138.5, 277.7, "b", 3, "28960345"], [297.0, 383.6, 342.8, 395.1, "b", 3, "29477427"], [297.0, 404.6, 342.8, 416.1, "b", 3, "29184612"]],
    [[459.6, 767.5, 492.1, 777.4, "b", 3, "29190939"], [108.1, 110.5, 148.4, 122.7, "b", 3, "17242818"], [148.0, 132.1, 188.3, 144.3, "g", 3, "20210126"], [125.4, 153.7, 165.8, 165.9, "g", 3, "20230126"]],
    [[200.0, 167.2, 244.5, 181.0, "b", 3, "18356721"], [200.0, 203.2, 244.5, 217.0, "g", 3, "20240315"], [200.0, 239.2, 244.5, 253.0, "g", 3, "20260315"], [50.0, 721.4, 85.6, 732.4, "b", 3, "28930182"]]
  ];
  function initBuild(root) {
    var add = root.querySelector("#c3-add"), again = root.querySelector("#c3-again"), chips = root.querySelector("#c3-chips");
    var short = root.querySelector("#c3-short"), count = root.querySelector("#c3-count"), svg = root.querySelector("#c3-pic svg");
    var opts = root.querySelector(".opts"), reveal = root.querySelector("#c3-reveal"), thumbs = root.querySelector(".thumbs"), fb = root.querySelector("#c3-fb");
    var guess = root.querySelector("#c3-guess"), key = root.querySelector("#c3-key"), fig = root.querySelector("#c3-pic"), nums = root.querySelectorAll(".nums");
    var n = 0, guessed = false;
    function set(k) {
      n = k;
      chips.innerHTML = n ? new Array(n + 1).join(chip("\\d", "", "sm")) : '<span class="count">empty</span>';
      short.classList.toggle("on", n === 8);
      add.disabled = n === 8; again.disabled = n === 0;
      count.innerHTML = n === 8 ? '<b>3 matches</b> on this part of page 2.' :
        n ? '<b>' + matches(n).length + ' match' + (matches(n).length === 1 ? '' : 'es') + '</b> on this part of page 2' : '<span class="hint">Add digits until the pattern finds whole 8-digit numbers.</span>';
      /* The guess, the page thumbnails and the key stay hidden until the pattern reaches 8 digits */
      guess.hidden = n !== 8;
      fig.classList.toggle("short", n === 8);
      svg.setAttribute("viewBox", n === 8 ? "30 103 396 68" : "30 24 396 200");
      draw(svg, n ? matches(n) : [], "g", true);
      opts.classList.toggle("off", n !== 8);
      each(opts.querySelectorAll(".opt"), function (o) { o.disabled = n !== 8 || guessed; });
      if (n === 8 && !guessed) nudge(root, "c3-guess", opts, opts.parentNode);
      space();
    }
    add.addEventListener("click", function () { if (n < 8) set(n + 1); });
    again.addEventListener("click", function () { set(0); });
    each(opts.querySelectorAll(".opt"), function (o) {
      o.addEventListener("click", function () {
        guessed = true;
        var v = o.getAttribute("data-v");
        each(opts.querySelectorAll(".opt"), function (x) {
          x.classList.toggle("pick", x === o);
          x.classList.toggle("right", x.getAttribute("data-v") === "11");
          x.disabled = true;
        });
        var tag = opts.parentNode.querySelector(".tap"); if (tag) tag.parentNode.removeChild(tag);
        opts.classList.remove("nudge"); tapped["c3-guess"] = true;
        fb.textContent = v === "11" ? "Yes! " : "Not quite. ";
        reveal.hidden = false; key.hidden = false; thumbs.classList.add("on");
        each(nums, function (u) { u.hidden = false; });
        [1, 2, 3].forEach(function (p) { draw(root.querySelector("#c3-pg" + p + " svg"), D8[p - 1], "b", true); });
        space();
      });
    });
    nudge(root, "c3-add", add);
    set(0);
  }

  /* Card 4: the letter's date line on page 1 (crop x 29 to 101, y 143 to 167). Character boxes from get_text("rawdict"). */
  var GROUPS = {
    day: { box: [36.0, 149.2, 41.7, 160.8], n: 1, v: "3", m: "the day" },
    month: { box: [44.1, 149.2, 66.8, 160.8], n: 2, v: "June", m: "the month" },
    year: { box: [71.3, 149.2, 94.2, 160.8], n: 3, v: "2022", m: "the year" }
  };
  function initGroups(root) {
    var svg = root.querySelector("#c4-pic svg"), parts = root.querySelectorAll(".gp[data-g]");
    var gl = root.querySelector("#c4-gl");
    function pick(g) {
      each(parts, function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-g") === g ? "true" : "false"); });
      var G = GROUPS[g];
      draw(svg, [[36.0, 149.2, 94.2, 160.8, "thin", 2.5], G.box.concat([g, 1.5])], "g", false);
      gl.innerHTML = "Group " + G.n + ' grabs <b class="' + g + '">' + G.v + "</b>: " + G.m + ", saved on its own.";
    }
    each(parts, function (b) { b.addEventListener("click", function () { pick(b.getAttribute("data-g")); }); });
    draw(svg, [[36.0, 149.2, 94.2, 160.8, "k", 2.5]], "k", false);
    nudge(root, "c4", root.querySelector(".parts"), root.querySelector(".grab"), true);
  }

  /* Card 5: page 3 (crop x 44 to 258, y 163 to 221). The extracted text of page 3 puts each label and each value on its
     own line. "Date of Manufacture: \d{8}" finds nothing (None); "Date of Manufacture:\s*\d{8}" finds
     "Date of Manufacture:\n20240315". */
  function initSplit(root) {
    var btns = root.querySelectorAll(".sw button"), svg = root.querySelector("#c5-pic svg"), res = root.querySelector("#c5-res");
    var lab = root.querySelector("#c5-lab"), nl1 = root.querySelector("#c5-nl1"), dat = root.querySelector("#c5-dat"), no = root.querySelector("#c5-no");
    var gapChip = root.querySelector("#c5-gap");
    function show(v, pop) {
      each(btns, function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-view") === v ? "true" : "false"); });
      var ok = v === "gap";
      gapChip.innerHTML = ok ? chip("\\s*", "any gap") : chip(" ", "a space");
      lab.className = "t " + (ok ? "hit" : "part");
      nl1.className = "nl " + (ok ? "hit" : "stop");
      dat.className = "t " + (ok ? "hit" : "");
      no.classList.toggle("on", !ok);
      draw(svg, ok ? [[50.0, 203.2, 143.4, 217.0, "g"], [200.0, 203.2, 244.5, 217.0, "g"]] : [], "g", pop);
      res.innerHTML = ok ? '<b>Found it: 20240315.</b> Any gap includes a line break.' : '<b>No match.</b> A space can\'t match a line break.';
    }
    each(btns, function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-view"), true); }); });
    show("space", false);
    nudge(root, "c5", root.querySelector(".sw"), root.querySelector(".sw").parentNode);
  }

  var CARDS = [
    { label: "Ctrl+F vs. Pattern", eyebrow: "What is regex?",
      html: '<h2 class="title">Find a Date You\'ve Never <span class="hl">Seen</span></h2>' +
        '<p class="why">In the last reading, PyMuPDF gave you all 617 words in the supplier file. Now Python has to pick out just the dates, and it doesn\'t know them ahead of time.</p>' +
        '<p class="p">Imagine <b>Regex</b> (short for Regular Expressions) as a smarter version of <b>Ctrl+F</b>. But instead of typing exact words, you define <b>patterns</b>, and Regex finds everything that fits those rules.</p>' +
        '<div class="row"><div class="nwrap"><div class="sw" role="group" aria-label="Choose how to search page 2">' +
          '<button type="button" data-view="find" aria-pressed="true">Ctrl+F: 20230126</button>' +
          '<button type="button" data-view="pattern" aria-pressed="false">Pattern: 8 digits in a row</button></div></div></div>' +
        '<div class="center"><div data-grow data-max="704" style="width:480px">' +
          pic("c1-pic", "pfizer3-p3-m7-c1-p2-left.png", 936, 408, [44, 103, 156, 68], "Part of page 2 of the supplier file: Lot Number 17242818, Date of Manufacture 20210126 and Expiration Date 20230126. Green boxes mark what the search finds.") +
          '<p class="cap">Page 2 of the supplier file</p></div></div>' +
        '<p class="res" id="c1-res" aria-live="polite" style="min-height:48px"></p>' +
        '<p class="bridge"><span>But what is this really doing? It\'s helping you <b>parse</b> the text.</span>' + ARROW + '</p>',
      init: initFind },

    { label: "Parsing", eyebrow: "What is parsing?",
      html: '<h2 class="title">Turn Messy Text into a Clean <span class="hl">Table</span></h2>' +
        '<p class="why">You don\'t need every word on the page, just the fields you check.</p>' +
        '<p class="p"><b>Parsing</b> means turning messy, unstructured text into clean, structured data. Unstructured means a page of sentences. Structured means a table, with a name for every value.</p>' +
        '<div class="parse"><div class="spots" data-grow data-max="400" style="width:378px;flex:none">' +
          '<div><p class="spot-l">Top of page 2</p>' + pic("c2-dates", "pfizer3-p3-m7-c2-spot-dates.png", 780, 225, [44, 126, 156, 45], "Top of page 2 of the supplier file: Date of Manufacture 20210126 and Expiration Date 20230126.", ' style="width:72.9%"') + '</div>' +
          '<div><p class="spot-l">Near the bottom of page 2</p>' + pic("c2-issued", "pfizer3-p3-m7-c2-spot-issued.png", 1070, 87, [28, 660.5, 214, 17.3], "Near the bottom of page 2: Issued by Cytiva Westborough Quality Assurance.") + '</div>' +
          '<div><p class="spot-l">Footer (the last line of page 2)</p>' + pic("c2-footer", "pfizer3-p3-m7-c2-spot-footer.png", 420, 78, [446, 765.5, 84, 15.5], "The footer of page 2: 29190939 Rev AD.", ' style="width:48.4%"') + '</div>' +
          '<p class="cap">Page 2 has lots of words. The values come from these 3 spots.</p></div>' +
          '<div class="col"><div class="nwrap" style="align-self:flex-start"><button type="button" class="btn btn-next btn-sm" id="parse-btn">Parse it</button></div>' +
            '<div class="tbl"><table><thead><tr><th scope="col">Field</th><th scope="col">Value</th></tr></thead><tbody>' +
              '<tr><td>Vendor</td><td class="v"></td></tr>' +
              '<tr><td>Revision <span class="def">(which version of this form it is)</span></td><td class="v"></td></tr>' +
              '<tr><td>Date of Manufacture</td><td class="v"></td></tr>' +
              '<tr><td>Expiration Date</td><td class="v"></td></tr>' +
            '</tbody></table></div>' +
          '</div></div>' +
        '<p class="p after" id="c2-after"><b>That\'s parsing.</b> You\'re transforming text into a format you (and your AI models) can actually use, like filling in the blanks of a structured form.</p>' +
        '<p class="bridge"><span>Going from <b>"lots of words"</b> to <b>"just the right data."</b></span>' + ARROW + '</p>',
      init: initParse },

    { label: "Patterns", eyebrow: "Build a pattern",
      html: '<h2 class="title">Describe What You\'re <span class="hl">Looking</span> For</h2>' +
        '<p class="why">To find dates you\'ve never seen, you describe their shape, one digit at a time.</p>' +
        '<div class="build"><div class="build-top"><div class="nwrap"><button type="button" class="add" id="c3-add"><span class="s">+ \\d</span>a digit</button></div>' +
            '<button type="button" class="again" id="c3-again">Start over</button></div>' +
          '<div class="pat"><span class="pat-l">Your pattern:</span><div class="chips" id="c3-chips"></div>' +
            '<div class="short" id="c3-short"><span class="pat-l">Written short:</span>' + chip("\\d", "a digit") + chip("{8}", "8 times") + '</div></div></div>' +
        '<div>' +
          '<figure class="pic c3top" id="c3-pic"><img src="pfizer3-p3-m7-c3-p2-top2.png" width="1584" height="800" alt="The top of page 2 of the supplier file: the title Certificate of Quality, the product name, Lot Number 17242818, Product Article Number 29-1846-12, Date of Manufacture 20210126, Product Description High Flow Gradient, Expiration Date 20230126, and the heading Product Release Criteria. Boxes mark what the pattern matches.">' +
            '<svg aria-hidden="true" preserveAspectRatio="none" viewBox="30 24 396 200"></svg></figure>' +
          '<p class="count" id="c3-count" aria-live="polite" style="margin-top:8px"></p></div>' +
        '<div class="guess" id="c3-guess" hidden><div class="col">' +
            '<p class="q">How many will it find in the whole file?</p>' +
            '<div class="nwrap" style="align-self:flex-start"><div class="opts off" role="group" aria-label="Your guess">' +
              '<button type="button" class="opt" data-v="3">3</button><button type="button" class="opt" data-v="4">4</button><button type="button" class="opt" data-v="11">11</button></div></div>' +
            '<p class="p" id="c3-reveal" aria-live="polite" hidden><span id="c3-fb"></span><b>11 matches</b>, but only <b>4</b> are dates. The rest are lot, part and document numbers. A pattern finds what text looks like, not what it means.</p>' +
            '<div class="key" id="c3-key" hidden><span><span class="sq g"></span>A date</span><span><span class="sq b"></span>A lot, part or document number</span></div></div>' +
          '<div class="thumbs" data-grow data-max="360" style="width:340px">' +
            [1, 2, 3].map(function (p) {
              var list = D8[p - 1].slice().sort(function (a, b) { return a[1] - b[1]; });
              return '<figure>' + pic("c3-pg" + p, "pfizer3-p3-m7-page" + p + ".png", 612, 792, [0, 0, 612, 792], "Page " + p + " of the supplier file. After your guess, boxes mark its 8-digit numbers: green for dates, blue for other numbers.") +
                '<p class="cap">Page ' + p + '</p><ul class="nums" hidden aria-label="The 8-digit numbers on page ' + p + '">' +
                list.map(function (b) { return '<li class="' + b[4] + '">' + b[6] + '</li>'; }).join("") + '</ul></figure>';
            }).join("") +
          '</div>' +
        '</div>',
      init: initBuild },

    { label: "Groups", eyebrow: "Capturing groups",
      html: '<h2 class="title">Grab the <span class="hl">Pieces</span> of a Date</h2>' +
        '<p class="why">Not every date in the file is 8 digits. The letter on page 1 writes it in words: 3 June, 2022. To check how old the letter is, Python needs the day, the month and the year as separate pieces.</p>' +
        '<div class="center"><div class="nwrap"><div class="parts" role="group" aria-label="The letter\'s date, in three groups">' +
            '<button type="button" class="gp day" data-g="day" aria-pressed="false"><span class="big">3</span>' + chip("(\\d{1,2})") + '</button>' +
            '<span class="gp gap" aria-hidden="true"><span class="big">&nbsp;</span>' + chip("\\s+", "", "lit") + '</span>' +
            '<button type="button" class="gp month" data-g="month" aria-pressed="false"><span class="big">June</span>' + chip("([A-Z][a-z]+)") + '</button>' +
            '<span class="gp gap" aria-hidden="true"><span class="big">,</span>' + chip(",\\s+", "", "lit") + '</span>' +
            '<button type="button" class="gp year" data-g="year" aria-pressed="false"><span class="big">2022</span>' + chip("(\\d{4})") + '</button>' +
          '</div></div></div>' +
        '<div class="grab" aria-live="polite"><span class="gl" id="c4-gl">Click a group to see what it grabs.</span></div>' +
        '<div class="center"><div data-grow data-max="704" style="width:330px">' +
          pic("c4-pic", "pfizer3-p3-m7-c4-date2.png", 1440, 480, [29, 143, 72, 24], "The date line of the letter on page 1 of the supplier file: 3 June, 2022. A box marks the part of the date the chosen group grabs.") +
          '<p class="cap">The date line of the letter on page 1</p></div></div>',
      init: initGroups },

    { label: "Line Breaks", eyebrow: "Hidden line breaks",
      html: '<h2 class="title">When the Label and the Date <span class="hl">Split</span></h2>' +
        '<p class="why">Putting the label in front of the date tells Python which number you want, but there\'s a catch.</p>' +
        '<p class="p">On the page, the label and its date share one line. In the text Python pulls out, a hidden <b>line break</b> (↵, a "start a new line" mark) splits them.</p>' +
        '<div class="center"><div data-grow data-max="704" style="width:470px"><p class="side-h">ON PAGE 3: ONE LINE</p>' +
          pic("c5-pic", "pfizer3-p3-m7-c5-p3-rows.png", 1070, 290, [44, 163, 214, 58], "Part of page 3 of the supplier file: Lot Number 18356721, Product Article Number 28 9301 82, and Date of Manufacture 20240315, each label on the same line as its value.") + '</div></div>' +
        '<div class="split"><div style="flex:none;width:300px"><p class="side-h">IN THE TEXT PYTHON PULLS OUT: EACH LABEL AND VALUE ON ITS OWN LINE</p>' +
            '<div class="ex" aria-label="The extracted text of page 3: each label and each value on its own line, with a line break after each.">' +
              '<span class="ln"><span class="t">Lot Number:</span><span class="nl">↵</span></span>' +
              '<span class="ln"><span class="t">18356721</span><span class="nl">↵</span></span>' +
              '<span class="ln"><span class="t">Product Article Number:</span><span class="nl">↵</span></span>' +
              '<span class="ln"><span class="t">28 9301 82</span><span class="nl">↵</span></span>' +
              '<span class="ln"><span class="t" id="c5-lab">Date of Manufacture:</span><span class="nl" id="c5-nl1">↵</span><span class="why-no" id="c5-no">← not a space</span></span>' +
              '<span class="ln"><span class="t" id="c5-dat">20240315</span><span class="nl">↵</span></span>' +
            '</div></div>' +
          '<div class="try"><div class="row"><div class="nwrap"><div class="sw" role="group" aria-label="Choose what goes between the label and the date">' +
              '<button type="button" data-view="space" aria-pressed="true">Match a space</button>' +
              '<button type="button" data-view="gap" aria-pressed="false">Match any gap</button></div></div></div>' +
            '<div class="chips">' + chip("Date of Manufacture:", "the label") + '<span id="c5-gap"></span>' + chip("\\d{8}", "8 digits") + '</div>' +
            '<p class="res" id="c5-res" aria-live="polite"></p>' +
          '</div></div>',
      init: initSplit }
  ];
  var END_LABEL = "Done";

  var i = 0;
  var app = $("app"), rail = $("rail"), stage = $("stage"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the cards. Scroll down to the next part of this reading.";

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a card. Spare height first widens the gaps
     between blocks, up to 2x; what is left enlarges the card's main picture. */
  var GAP = 12;
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = GAP + "px";
    /* Reset every picture to its base width, then use the first one that is showing (card 3 hides its thumbnails at first) */
    var grow = null;
    each(inner.querySelectorAll("[data-grow]"), function (g) {
      if (!g.hasAttribute("data-base")) g.setAttribute("data-base", g.style.width || "");
      g.style.width = g.getAttribute("data-base");
      if (!grow && g.offsetHeight) grow = g;
    });
    var cs = getComputedStyle(stage);
    var avail = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) {
      var add = Math.min(GAP, spare / gaps);
      inner.style.gap = (GAP + add) + "px";
      spare = avail - inner.offsetHeight;
    }
    /* A state that needs more room than the card has (card 3 after the guess) shrinks the picture instead */
    for (var j = 0; j < 4 && grow && spare < 0; j++) {
      var gw = grow.offsetWidth, gh = grow.offsetHeight;
      grow.style.width = Math.max(160, gw + spare * (gw / gh) - 1) + "px";
      spare = avail - inner.offsetHeight;
    }
    if (!grow || spare < 2) return;
    var max = +grow.getAttribute("data-max") || 704;
    for (var k = 0; k < 3 && spare >= 2; k++) {
      var w = grow.offsetWidth, h = grow.offsetHeight;
      if (!h || w >= max) break;
      grow.style.width = Math.min(max, w + spare * (w / h)) + "px";
      spare = avail - inner.offsetHeight;
      if (spare < 0) { grow.style.width = Math.max(0, grow.offsetWidth + spare * (w / h) - 1) + "px"; spare = avail - inner.offsetHeight; }
    }
  }

  CARDS.forEach(function (c, n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + c.label);
    b.innerHTML = '<span class="seg"></span><span class="pg-label" data-text="' + c.label + '">' + c.label + '</span>';
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function titleOf(n) { var m = CARDS[n].html.match(/<h2[^>]*>(.*?)<\/h2>/); return m ? m[1].replace(/<[^>]+>/g, "") : ""; }

  function render(anim) {
    var c = CARDS[i];
    runToken++;
    each(app.querySelectorAll(".fly"), function (f) { f.parentNode.removeChild(f); });
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.eyebrow + '</p>' + c.html + '</div>';
    each(rail.children, function (b, n) {
      b.classList.toggle("is-cur", n === i);
      b.classList.toggle("is-done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("where-count").textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + titleOf(i + 1) + "</b>";
    donemsg.textContent = "";
    if (c.init) c.init(card);
    space();
    each(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  function go(n) { if (n < 0 || n >= CARDS.length || n === i) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i === CARDS.length - 1) {
      donemsg.textContent = DONE_MSG;
      space();
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "extern-deck-done" }, "*");
      return;
    }
    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.closest && e.target.closest(".sw, .parts, .opts")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #card=N opens a card directly */
  var m = location.hash.match(/card=(\d)/);
  if (m) { i = Math.min(CARDS.length - 1, Math.max(0, +m[1] - 1)); }
  window.addEventListener("resize", function () { fit(); });
  fit();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
</body>
</html>
