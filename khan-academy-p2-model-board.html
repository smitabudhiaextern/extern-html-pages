<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Every model on the table</title>
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;
    --ink-14:rgba(0,29,105,.14);
    --ink-24:rgba(0,29,105,.24);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--body);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:10px;
  }
  .stage{
    width:100%;max-width:960px;aspect-ratio:16/9;
    display:flex;flex-direction:column;
    padding:clamp(12px,1.55vw,17px);
  }
  h1{
    font-size:clamp(15px,2.4vw,23px);line-height:1.1;font-weight:700;
    color:var(--title);letter-spacing:-.02em;
  }
  .sub{
    font-size:clamp(9px,1.35vw,13px);line-height:1.4;
    margin-top:clamp(2px,.28vw,3px);margin-bottom:clamp(6px,.82vw,9px);
  }
  .sub b{color:var(--on-highlight);font-weight:600}

  .band{margin-bottom:clamp(5px,.7vw,8px)}
  .bandlabel{
    font-size:clamp(8px,1.06vw,10px);font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--on-highlight);
    margin-bottom:clamp(3px,.42vw,5px);
    display:flex;align-items:center;gap:clamp(4px,.55vw,6px);
  }
  .bandlabel:after{content:"";flex:1;height:1px;background:var(--ink-14)}

  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(5px,.7vw,8px)}

  .card{
    background:var(--highlight);
    border:1.5px solid transparent;
  }
  /* Two fills, one per source. Light row and dark row, no sixth colour. */
  #rowA .card{background:var(--highlight)}
  #rowA .card:hover,#rowA .card:focus-visible,#rowA .card[aria-pressed="true"]{border-color:var(--on-highlight)}
  #rowB .card{background:var(--on-highlight)}
  #rowB .card .name{color:var(--bg)}
  #rowB .card .how{color:var(--highlight)}
  #rowB .card:hover,#rowB .card:focus-visible,#rowB .card[aria-pressed="true"]{border-color:var(--highlight)}
  .card{
    border-radius:clamp(5px,.62vw,7px);
    padding:clamp(6px,.83vw,10px);
    text-align:left;font:inherit;color:inherit;cursor:pointer;
    display:flex;flex-direction:column;gap:clamp(2px,.28vw,4px);
    transition:border-color .15s,transform .15s;
  }
  .card:hover,.card:focus-visible{outline:none;transform:translateY(-1px)}
  .card .name{
    font-size:clamp(9.5px,1.3vw,12.5px);line-height:1.15;font-weight:700;
    color:var(--on-highlight);
  }
  .card .how{
    font-size:clamp(8px,1.09vw,10.5px);line-height:1.3;color:var(--body);
  }

  .slot{
    background:var(--bg);color:var(--body);
    border:1.5px solid var(--on-highlight);
    border-radius:clamp(5px,.62vw,7px);
    padding:clamp(7px,.94vw,11px) clamp(9px,1.15vw,13px);
    min-height:clamp(52px,7.5vw,72px);
    display:flex;flex-direction:column;justify-content:center;gap:clamp(2px,.28vw,4px);
  }
  .slot .lead{
    font-size:clamp(8px,1.02vw,10px);font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--on-highlight);
  }
  .slot .deal{font-size:clamp(9.5px,1.3vw,12.5px);line-height:1.35;font-weight:700;color:var(--title)}
  .slot .fig{font-size:clamp(8.5px,1.12vw,11px);line-height:1.35;color:var(--body)}
  .slot.empty .deal{font-weight:500;opacity:.82}

  @media (prefers-reduced-motion:reduce){
    .card{transition:none}
    .card:hover,.card:focus-visible{transform:none}
  }
</style>
</head>
<body>

<div class="stage">
  <h1>Every model on the table</h1>
  <p class="sub">Eight ways an organization brings money in. Pick a card to see the real deal behind it. <b>The top row Khan Academy has already done.</b></p>

  <div class="band">
    <div class="bandlabel">Khan Academy already runs these</div>
    <div class="row" id="rowA"></div>
  </div>

  <div class="band">
    <div class="bandlabel">Proven somewhere else</div>
    <div class="row" id="rowB"></div>
  </div>

  <div class="slot empty" id="slot" role="status" aria-live="polite">
    <div class="lead">The deal behind it</div>
    <div class="deal" id="deal">Pick any card above.</div>
    <div class="fig" id="fig"></div>
  </div>
</div>

<noscript>
  <div style="max-width:960px;margin:0 auto;padding:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#484646">
    <h1 style="color:#1C1B1B;font-size:22px">Every model on the table</h1>
    <p>Eight ways an organization brings money in, and the real deal behind each one.</p>
    <h2 style="color:#001D69;font-size:14px;text-transform:uppercase;letter-spacing:.06em">Khan Academy already runs these</h2>
    <ul>
      <li><b>Licensing.</b> A partner pays to keep a piece of content built and kept current. The College Board and the official SAT practice, free to every learner, with the College Board still selling the test itself.</li>
      <li><b>In-kind sponsorship.</b> A partner hands over something it already owns instead of writing a check. Microsoft, announced May 2024: computing power and free Khanmigo for teachers, in exchange for Khan Academy's math questions with the working written out. No cash changed hands.</li>
      <li><b>CSR and brand.</b> A company pays for free content because it wants to be seen paying for it, and its name goes on the result. Bank of America and Better Money Habits, launched 2013, ad free.</li>
      <li><b>Content sponsorship.</b> A partner funds a whole course and the course carries its name. Walmart, founding sponsor of Khan Academy's Financial Literacy course, July 2023.</li>
    </ul>
    <h2 style="color:#001D69;font-size:14px;text-transform:uppercase;letter-spacing:.06em">Proven somewhere else</h2>
    <ul>
      <li><b>Wikimedia.</b> Anyone can copy it free, but companies that need it fast and in bulk pay for a proper pipe. Wikimedia Enterprise took $8.3 million in the year to 30 June 2025 from 13 paying customers, 4.0% of what the Foundation took in.</li>
      <li><b>Coursera.</b> A person learns free, an organization pays for the records and the reporting around it. The Enterprise segment took $255.3 million in the year to 31 December 2025 from 1,730 paying organizations.</li>
      <li><b>Duolingo.</b> Anyone can start free, and you pay to keep going once the free version slows you down. Subscriptions were about 84% of the $1.04 billion it took in during 2025. Advertising was under 8%.</li>
      <li><b>Mozilla.</b> One partner pays a share of what it earns from your users. In 2024, 86% of Mozilla's revenue from customers under contract came from a single customer, up from 81% two years earlier.</li>
    </ul>
  </div>
</noscript>

<script>
"use strict";
var CARDS = {
  A: [
    { name:"Licensing",
      how:"A partner pays to keep a piece of content built and current.",
      deal:"The College Board and the official SAT practice.",
      fig:"Free to every learner. The College Board carried on selling the test itself. No amount was ever published." },
    { name:"In-kind sponsorship",
      how:"A partner hands over something it owns instead of cash.",
      deal:"Microsoft, announced May 2024.",
      fig:"Computing power and free Khanmigo for teachers, in exchange for Khan Academy's math questions with the working written out. No cash changed hands." },
    { name:"CSR and brand",
      how:"A company pays for free content and its name goes on it.",
      deal:"Bank of America and Better Money Habits, launched 2013.",
      fig:"Ad free, and Khan Academy said at the time it would provide the videos with no outside editorial control." },
    { name:"Content sponsorship",
      how:"A partner funds a whole course, and the course carries its name.",
      deal:"Walmart and Khan Academy's Financial Literacy course, July 2023.",
      fig:"Founding sponsor, with Intuit and Capital One adding support. No amount published." }
  ],
  B: [
    { name:"Wikimedia",
      how:"Free to copy, but paying customers get it fast and in bulk.",
      deal:"Wikimedia Enterprise.",
      fig:"$8.3 million in the year to 30 June 2025, from 13 paying customers. That was 4.0% of what the Foundation took in." },
    { name:"Coursera",
      how:"A person learns free, an organization pays for the records.",
      deal:"The Coursera Enterprise segment.",
      fig:"$255.3 million in the year to 31 December 2025, from 1,730 paying organizations. The company's total revenue that year was $757.5 million." },
    { name:"Duolingo",
      how:"Start free, pay to keep going once the free version slows you down.",
      deal:"Duolingo subscriptions.",
      fig:"About 84% of the $1.04 billion Duolingo took in during 2025. Advertising was under 8%." },
    { name:"Mozilla",
      how:"One partner pays a share of what it earns from your users.",
      deal:"Mozilla's search royalties.",
      fig:"In 2024, 86% of Mozilla's revenue from customers under contract came from a single customer, up from 81% two years earlier." }
  ]
};

var slot = document.getElementById("slot");
var dealEl = document.getElementById("deal");
var figEl  = document.getElementById("fig");
var buttons = [];

function show(c, btn){
  slot.classList.remove("empty");
  dealEl.textContent = c.deal;
  figEl.textContent  = c.fig;
  buttons.forEach(function(b){ b.setAttribute("aria-pressed", b === btn ? "true" : "false"); });
}

["A","B"].forEach(function(key){
  var row = document.getElementById(key === "A" ? "rowA" : "rowB");
  CARDS[key].forEach(function(c){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "card";
    b.setAttribute("aria-pressed","false");
    var n = document.createElement("span"); n.className = "name"; n.textContent = c.name;
    var h = document.createElement("span"); h.className = "how";  h.textContent = c.how;
    b.appendChild(n); b.appendChild(h);
    b.addEventListener("click", function(){ show(c, b); });
    b.addEventListener("mouseenter", function(){ show(c, b); });
    b.addEventListener("focus", function(){ show(c, b); });
    row.appendChild(b);
    buttons.push(b);
  });
});
</script>
</body>
</html>
