<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap">
<style>
/* P7 Step 2 module 6, "Try It Yourself": the student copy of his notebook "Route Queries" (Drive
   1bHQT8VEpoJDKUZTSt3wmENNCFGAKoAxo, from nb3 1nLBQHlR..., fixed only where Smita approved), with his 0731 practice
   steps. Built 28 November 2026 by steps-build.py (scratchpad p7/p7-m6/steps). Shell copied unchanged from
   pfizer3-p6-m6-steps.html. Outputs: real Run all of the student copy, b1-notebook-and-runs.md 8.nb3, and its
   screenshots (images/pfizer3-p7-m6-run-*.png).
   Fixed stage 760 x 1140 (frames under 560 px wide: 450 x 1256), scaled as one piece so nothing scrolls.
   Look: Pfizer x Extern Core, Light format; every color, size, radius and font comes from design-system/tokens.json. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* The design stage, scaled and centred by the script at the end */
.app{position:absolute;left:50%;top:50%;width:760px;height:1140px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: step rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:13px;font-weight:500;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}
.narrow .top{grid-template-columns:minmax(0,1fr);row-gap:8px}
.narrow .where{order:0}
.narrow .pg-word{display:none}
.narrow .pg.pg-fit{flex:none}

/* Slide area and slide */
.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}
.narrow .stage{padding:10px 0}
.narrow .card{padding:18px 16px;border-left:0;border-right:0;border-radius:0}
.inner{flex:none;display:flex;flex-direction:column;gap:var(--space-3);width:100%}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding-bottom:3px;color:var(--ink);text-wrap:balance}
.narrow .title{font-size:28px;line-height:34px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:15px;line-height:22px;color:var(--ink);text-wrap:pretty}
.p b{font-weight:600}
.p code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.p code.nw,.list code.nw{white-space:nowrap}
.list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:22px;text-wrap:pretty}
.list b{font-weight:600}
.list code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.list li::marker{color:var(--step-label);font-weight:600}
.see{margin-top:4px}

/* Buttons (design system Button, Light) */
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* Run card: a notebook cell (no Copy button: the cells are already in the notebook), or the one cell students add (Copy button) */
.run{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin:0}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:6px 8px 6px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:12px 14px;font-family:var(--font-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out{border-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:6px 12px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}
.narrow .run pre{font-size:13px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.narrow .run.out pre{font-size:12px}

/* The Colab screenshot: the full width of the card (edge to edge), opens full size in a new tab.
   Under 560 px the card itself runs edge to edge, so the picture is as wide as the frame. */
.shot{margin:0 calc(-1 * var(--space-5));border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;line-height:0;background:var(--surface)}
.narrow .shot{margin:0 -16px}
.shot a{display:block}
.shot img{display:block;width:100%;height:auto}
.shot-cap{margin:-6px 0 0;font-size:13px;line-height:18px;color:var(--gray-600)}

/* A picture of the page (slide 14: the table in foo.pdf): framed like the output blocks, as wide as the text */
.pagepic{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;line-height:0;background:var(--surface)}
.pagepic a{display:block}
.pagepic img{display:block;width:100%;height:auto}

/* Table and analysis box (from the Learn deck) */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.4}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:6px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--card-text)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.m{font-family:var(--font-mono);font-size:13px;color:var(--ink);white-space:nowrap}
.tbl td code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .tbl table{font-size:13px}
.narrow .tbl td,.narrow .tbl th{padding:5px 8px}
.concl{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px;font-size:15px;line-height:22px;color:var(--card-text)}
.concl b{font-weight:600;color:var(--card-title)}
.concl p{margin:0}
.concl p + p{margin-top:6px}
.concl code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}


/* A smaller code font for the long function in Step 3 (from the 11 November module 9 steps deck) */
.run.small pre{font-size:12px;line-height:1.32;padding:8px 14px}
.narrow .run.small pre{font-size:10.5px;line-height:1.35}

/* Tip box (from the 11 November module 9 Learn deck): pale-blue card, Pfizer blue bulb in a white square */
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px}
.tip-icon{flex:none;width:30px;height:30px;border-radius:var(--radius-xs);background:var(--surface);display:grid;place-items:center;color:var(--pfizer-blue)}
.tip-icon svg{width:18px;height:18px}
.tip p{margin:0;font-size:15px;line-height:22px;color:var(--card-text);text-wrap:pretty}
.tip b{font-weight:600;color:var(--card-title)}

/* Last slide: his closing line and Key Takeaway (takeaway box copied from the module 7 cheat sheet slide) */
.inner.end-slide{gap:var(--space-4)}
.end-slide .p{font-size:17px;line-height:1.55}
.take{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:14px 18px;font-size:17px;line-height:1.55;color:var(--card-text)}
.take b{font-weight:700;color:var(--card-title)}
.take code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .take{font-size:15px;padding:12px 16px}
.narrow .end-slide .p{font-size:16px}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:22px;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.foot .btn{padding:10px 16px;font-size:15px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
.narrow .upnext{visibility:hidden}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }

/* Added for P4 module 2 (copied from the P3 module 8 Try deck): "now holds" note, the SME's callout box, the Quick Recap size */
.holds{margin:0;display:flex;align-items:center;gap:8px;background:var(--surface-card);border-left:4px solid var(--pfizer-blue);border-radius:var(--radius-xs);padding:7px 12px;font-size:14px;line-height:20px;font-weight:600;color:var(--card-title)}
.holds code{font-family:var(--font-mono);font-size:.93em;background:var(--surface);border-radius:4px;padding:1px 5px}
.holds svg{width:16px;height:16px;flex:none;color:var(--pfizer-blue)}
.note{border:1.5px solid var(--ink);border-radius:var(--radius-sm);padding:9px 14px}
.note .num{display:block;margin-bottom:3px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.note p{margin:0;font-size:15px;line-height:1.48;color:var(--ink-muted)}
.note b{font-weight:600;color:var(--ink)}
.recap-slide .list{font-size:17px;line-height:1.55;gap:14px}
.recap-slide .list ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.recap-slide .list ul li::marker{color:var(--ink-muted)}
.narrow .recap-slide .list{font-size:15.5px;gap:10px}
/* Many steps in the rail: numbers only */
.pg-word{display:none}
.pg-label{text-align:center}
.pg.pg-fit{flex:none}
.pg.pg-fit .pg-label{text-align:left}
/* Under 560 px there is no room for the 7 group labels: the rail shows only the progress bars, and "Step N" sits beside the count */
.narrow .pg-label{display:none}
.narrow .pg.pg-fit{flex:1 1 0}
/* Code and output: Project 3's size (fix pass, 22 November 2026: 14 px on the 760 stage, 13 px at the 708 px column; 13 px on
   the narrow stage). Long lines wrap, so nothing scrolls; long cells and outputs are cut over more slides instead */
.run pre{white-space:pre-wrap;overflow-wrap:anywhere}
.run.out pre{font-size:14px;line-height:1.5}
.narrow .run pre,.narrow .run.out pre{font-size:13px}
/* F02: zoomed crops of one strip of the page, before and after a step */
.zoom{margin:0;display:flex;flex-direction:column;gap:6px}
.zoom a{display:block;line-height:0}
.zoom img{display:block;height:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--radius-xs)}
/* The STEP 15 JSON: the 3 heading lines across the top, the JSON in two columns (same text, same order) */
.run.out.json pre.head{padding-bottom:0}
.run.out.json pre.cols{column-count:2;column-gap:24px;padding-top:4px}
.narrow .run.out.json pre.cols{column-gap:12px;font-size:10.5px}
/* A page picture from Colab (tall): shown smaller and centred, so the slide stays short; opens full size */
.shot.tall{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.shot.tall img{width:auto;max-width:100%;height:var(--pic-h,480px);margin:0 auto}
.narrow .shot.tall{margin:0}
.narrow .shot.tall img{height:var(--pic-hn,520px)}
/* q3 Proposal A: two Colab page pictures side by side (STEP 6 + 7, STEP 8 + 9), each with its own notes under it */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.half{display:flex;flex-direction:column;gap:8px;min-width:0}
.half-head{margin:0;font-size:13px;line-height:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label)}
.half .p{margin:0}
.half .list{font-size:14.5px;line-height:1.45;gap:4px}
.half code{overflow-wrap:anywhere}
.pair-slide .shot.tall img{width:auto;height:auto;max-width:100%;max-height:330px}
.narrow .pair{gap:10px}
.narrow .pair-slide .shot.tall img{height:auto;max-height:300px}
.narrow .half .list{font-size:13.5px}
.pic-sm .shot.tall img{height:435px}

.run pre{white-space:pre-wrap;overflow-wrap:anywhere}
.run pre code{display:block}
.run pre .ln{display:block;padding-left:calc(var(--i) + 2ch);text-indent:calc(-1 * (var(--i) + 2ch))}
.run pre .ln:empty::before{content:"\200b"}
.shot.fit{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;line-height:0;background:var(--surface)}
.shot.fit img{width:auto;max-width:100%;max-height:var(--mh);margin:0 auto}
.p a{color:var(--pfizer-blue);text-underline-offset:2px}
.list a{color:var(--pfizer-blue);text-underline-offset:2px}
.his{border-left:4px solid var(--pfizer-blue);background:var(--surface-card);border-radius:0 var(--radius-xs) var(--radius-xs) 0;padding:8px 14px}
.his .num{display:block;margin-bottom:3px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label);text-transform:uppercase}
.his p{margin:0;font-size:15px;line-height:1.5;color:var(--card-text)}
.his b{font-weight:600;color:var(--ink)}
.his code,.note code,.tip code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}
</style>
</head>

<div class="app" id="app">

d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p>The whole notebook takes about 2 minutes to run. Run the cells from the top down, in order, and wait for each green tick before you press the next <b>Run</b>.</p></div>

<template id="t6">
<div class="his"><span class="num">YOUR NOTEBOOK SAYS</span><p>When users upload pharmaceutical PDFs, don't just save the raw file. Attach useful metadata that helps identify what the document contains.</p></div><p class="p">Let's walk through the Python snippet that captures metadata during file upload. It starts with the values every page will share:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">import uuid</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">file_id = str(uuid.uuid4())  # Assigns Unique ID</span><span class="ln" style="--i:0ch">user_id = &quot;xyz&quot;</span><span class="ln" style="--i:0ch">year = &quot;2024&quot;</span><span class="ln" style="--i:0ch">filename = &quot;pharma-blob-sample.pdf&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">pdf_metadata_store = []</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>uuid.uuid4()</code> makes a random ID for the file, so every upload gets its own <code>file_id</code>.</li><li><code>year</code> is the value the code sets, <code>"2024"</code>, for every page. It isn't read from the PDF.</li><li><code>pdf_metadata_store</code> starts as an empty list, ready for one entry per page.</li></ul>
</template>

<template id="t7">
<p class="p">Find the cell with <code># STEP 3: Store File-Level Metadata</code> near its top, and press <b>Run</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">for i, doc in enumerate(documents):</span><span class="ln" style="--i:4ch">    metadata = {</span><span class="ln" style="--i:8ch">        &quot;file_id&quot;: file_id,</span><span class="ln" style="--i:8ch">        &quot;user_id&quot;: user_id,</span><span class="ln" style="--i:8ch">        &quot;doc_type&quot;: &quot;unknown&quot;,  # We&#x27;ll classify it later</span><span class="ln" style="--i:8ch">        &quot;year&quot;: year,</span><span class="ln" style="--i:8ch">        &quot;filename&quot;: filename,</span><span class="ln" style="--i:8ch">        &quot;page_number&quot;: i + 1,</span><span class="ln" style="--i:8ch">        &quot;text&quot;: doc.text</span><span class="ln" style="--i:4ch">    }</span><span class="ln" style="--i:4ch">    pdf_metadata_store.append(metadata)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">print(&quot;Stored Metadata:&quot;)</span><span class="ln" style="--i:0ch">print(pdf_metadata_store[0])</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>The loop builds one <b>dictionary</b> (a set of name and value pairs) per page and adds it to <code>pdf_metadata_store</code>.</li><li><code>"doc_type": "unknown"</code> is a placeholder. You'll replace it with a real label a few slides on.</li><li>The last two lines print page 1's dictionary, so you can check it.</li></ul>
</template>

<template id="t9">
<p class="p">Find the cell with <code># STEP 4: Set Up Gemini LLM Connection</code> near its top, and press <b>Run</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">from google import genai</span><span class="ln" style="--i:0ch">from google.colab import userdata</span><span class="ln" style="--i:0ch">import time</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">MODEL = &quot;gemini-3.5-flash-lite&quot;</span><span class="ln" style="--i:0ch">client = genai.Client(api_key=userdata.get(&#x27;GEMINI_API_KEY&#x27;))</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">def gemini_model(prompt, retries=3):</span><span class="ln" style="--i:4ch">    for attempt in range(retries):</span><span class="ln" style="--i:8ch">        try:</span><span class="ln" style="--i:12ch">            response = client.models.generate_content(model=MODEL, contents=prompt)</span><span class="ln" style="--i:12ch">            return response.text</span><span class="ln" style="--i:8ch">        except Exception as e:</span><span class="ln" style="--i:12ch">            busy = any(s in str(e).lower() for s in</span><span class="ln" style="--i:23ch">                       [&quot;429&quot;, &quot;503&quot;, &quot;overloaded&quot;, &quot;resource_exhausted&quot;, &quot;unavailable&quot;])</span><span class="ln" style="--i:12ch">            if busy and attempt &lt; retries - 1:</span><span class="ln" style="--i:16ch">                wait = 30 * (attempt + 1)</span><span class="ln" style="--i:16ch">                print(f&quot;Gemini is busy, retrying in {wait}s...&quot;)</span><span class="ln" style="--i:16ch">                time.sleep(wait)</span><span class="ln" style="--i:12ch">            else:</span><span class="ln" style="--i:16ch">                raise</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>It reads your key from Colab Secrets and makes <code>gemini_model(prompt)</code>, which sends a prompt to Gemini 3.5 Flash-Lite and returns its answer.</li><li>If Gemini is busy, it waits 30 seconds, then 60 seconds, and tries again by itself. Nothing prints.</li><li>If Colab asks <b>Notebook does not have secret access</b>, click <b>Grant access</b>.</li></ul>
</template>

<template id="t10">
<div class="his"><span class="num">His page says</span><p>Now comes the interesting part: using a small LLM to figure out which files match a user's question. Instead of simple keyword matching, we'll send the user's query and a <b>summary of all uploaded files</b> to an LLM like Gemini to get a smart prediction of which files are most relevant.</p></div><p class="p">You can do this by:</p><ol class="list"><li><b>Creating a lightweight summary</b> (e.g., titles, page 1, extracted headings) of each document.</li><li><b>Prompting the LLM</b> with a question like: <i>"Based on the following user query and list of documents, which file(s) are most likely to contain the answer?"</i></li></ol><p class="p">The cell starts with two lists of the same 8 labels:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># Valid document type labels used throughout this notebook</span><span class="ln" style="--i:0ch">VALID_DOC_TYPES = [</span><span class="ln" style="--i:4ch">    &quot;cover_letter&quot;, &quot;certificate_of_quality&quot;, &quot;packaging_specification&quot;,</span><span class="ln" style="--i:4ch">    &quot;bse_tse_declaration&quot;, &quot;material_description&quot;, &quot;supplier_qualification&quot;,</span><span class="ln" style="--i:4ch">    &quot;chain_of_custody&quot;, &quot;unknown&quot;</span><span class="ln" style="--i:0ch">]</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># The same 8 labels, spelled as in the other Project 7 notebooks</span><span class="ln" style="--i:0ch">LABEL_NAMES = {</span><span class="ln" style="--i:4ch">    &quot;cover_letter&quot;: &quot;Cover Letter&quot;, &quot;certificate_of_quality&quot;: &quot;Certificate of Quality&quot;,</span><span class="ln" style="--i:4ch">    &quot;packaging_specification&quot;: &quot;Packaging Specification&quot;, &quot;bse_tse_declaration&quot;: &quot;BSE/TSE Declaration&quot;,</span><span class="ln" style="--i:4ch">    &quot;material_description&quot;: &quot;Material Description&quot;, &quot;supplier_qualification&quot;: &quot;Supplier Qualification&quot;,</span><span class="ln" style="--i:4ch">    &quot;chain_of_custody&quot;: &quot;Chain of Custody&quot;, &quot;unknown&quot;: &quot;Other&quot;</span><span class="ln" style="--i:0ch">}</span></code></pre></figure>
</template>

<template id="t11">
<p class="p">Next in the same cell are two functions. Read this half first:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">def clean_llm_label(response):</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;Clean up LLM response to extract a valid doc_type label.&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    cleaned = response.strip().replace(&#x27;&quot;&#x27;, &#x27;&#x27;).replace(&#x27;`&#x27;, &#x27;&#x27;).replace(&#x27;*&#x27;, &#x27;&#x27;).lower().replace(&quot;.&quot;, &quot;&quot;).strip()</span><span class="ln" style="--i:4ch">    # Check if the cleaned response contains a valid label</span><span class="ln" style="--i:4ch">    for label in VALID_DOC_TYPES:</span><span class="ln" style="--i:8ch">        if label in cleaned:</span><span class="ln" style="--i:12ch">            return LABEL_NAMES[label]</span><span class="ln" style="--i:4ch">    return &quot;Other&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">def classify_query_llm(query, metadata_store):</span><span class="ln" style="--i:4ch">    doc_list = &quot;\n&quot;.join(</span><span class="ln" style="--i:8ch">        [f&quot;{i+1}. {doc[&#x27;filename&#x27;]} - doc_type: {doc[&#x27;doc_type&#x27;]}&quot; for i, doc in enumerate(metadata_store)]</span><span class="ln" style="--i:4ch">    )</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>His prompts use labels like <code>packaging_specification</code>. <code>LABEL_NAMES</code> (on the last slide) turns each one into the spelling the other Project 7 notebooks use, such as <code>Packaging Specification</code>, and <code>unknown</code> into <code>Other</code>. One spelling everywhere means a filter on a label always finds it.</li><li><code>clean_llm_label</code> tidies Gemini's answer (no quotes, no capitals, no full stops) and returns the matching label from <code>LABEL_NAMES</code>, or <code>Other</code>.</li><li><code>classify_query_llm</code> starts by building the summary, <code>doc_list</code>: one line per page with its filename and its <code>doc_type</code>. It never sends the page text.</li></ul>
</template>

<template id="t12">
<p class="p">Find the cell with <code># STEP 5: Classify User Query by Document Type</code> near its top, and press <b>Run</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:4ch">    prompt = f&quot;&quot;&quot;</span><span class="ln" style="--i:2ch">  You are an intelligent assistant that routes user queries to the most relevant pharmaceutical document.</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:2ch">  Available documents:</span><span class="ln" style="--i:2ch">  {doc_list}</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:2ch">  User query: &quot;{query}&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:2ch">  Which document(s) are most likely to contain the answer?</span><span class="ln" style="--i:2ch">  Respond with one of the following types:</span><span class="ln" style="--i:2ch">  [&quot;cover_letter&quot;, &quot;certificate_of_quality&quot;, &quot;packaging_specification&quot;, &quot;bse_tse_declaration&quot;,</span><span class="ln" style="--i:0ch">&quot;material_description&quot;, &quot;supplier_qualification&quot;, &quot;chain_of_custody&quot;, &quot;unknown&quot;]</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:2ch">  Respond with ONLY the label. No explanation.</span><span class="ln" style="--i:2ch">  &quot;&quot;&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    response = gemini_model(prompt)</span><span class="ln" style="--i:4ch">    return clean_llm_label(response)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>The prompt hands Gemini the summary and your question, and asks for ONLY one of his 8 labels.</li><li>The last two lines send the prompt and return the cleaned label.</li><li>Nothing prints: the cell only defines the functions. You'll use them after the pages have labels.</li></ul>
</template>

<template id="t13">
<div class="his"><span class="num">His page says</span><p>Assign a doc_type to Each Page. Use your <code>classify_doc_type_llm()</code> function to loop through each page in <code>pdf_metadata_store</code>, use the LLM to classify the page's content into a <code>doc_type</code>, and update each page's dictionary with the predicted type.</p></div><p class="p">Find the cell with <code># STEP 7: Classify Document Content</code> near its top, and press <b>Run</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">def classify_doc_type_llm(text, max_chars=1000):</span><span class="ln" style="--i:4ch">    truncated_text = text[:max_chars]</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    prompt = f&quot;&quot;&quot;</span><span class="ln" style="--i:0ch">You are classifying a pharmaceutical document into one of the following types:</span><span class="ln" style="--i:0ch">[&quot;cover_letter&quot;, &quot;certificate_of_quality&quot;, &quot;packaging_specification&quot;, &quot;bse_tse_declaration&quot;,</span><span class="ln" style="--i:0ch">&quot;material_description&quot;, &quot;supplier_qualification&quot;, &quot;chain_of_custody&quot;, &quot;unknown&quot;]</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">Document content:</span><span class="ln" style="--i:0ch">\&quot;\&quot;\&quot;</span><span class="ln" style="--i:0ch">{truncated_text}</span><span class="ln" style="--i:0ch">\&quot;\&quot;\&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">What is the best doc_type label for this document? Respond with ONLY one of the labels above. No explanation.</span><span class="ln" style="--i:0ch">&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    try:</span><span class="ln" style="--i:8ch">        response = gemini_model(prompt)</span><span class="ln" style="--i:8ch">        return clean_llm_label(response)</span><span class="ln" style="--i:4ch">    except Exception as e:</span><span class="ln" style="--i:8ch">        print(&quot;LLM failed:&quot;, e)</span><span class="ln" style="--i:8ch">        return &quot;Other&quot;</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>This prompt does read the page: its first 1,000 characters (<code>max_chars=1000</code>). If the call fails, the page gets <code>Other</code>.</li></ul>
</template>

<template id="t14">
<p class="p">Find the cell with <code># STEP 8: Apply Document Classification to All Pages</code> near its top, and press <b>Run</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">for i, doc in enumerate(pdf_metadata_store):</span><span class="ln" style="--i:4ch">    print(f&quot;Classifying doc {i+1}...&quot;)</span><span class="ln" style="--i:4ch">    doc[&quot;doc_type&quot;] = classify_doc_type_llm(doc[&quot;text&quot;])</span><span class="ln" style="--i:4ch">    time.sleep(1)  # Avoid rate limiting</span></code></pre></figure><ul class="list"><li>The loop sends each page to <code>classify_doc_type_llm</code> and saves the answer in that page's <code>doc_type</code>, then waits 1 second so Gemini isn't asked too fast.</li></ul><p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot fit" style="--mh:205px"><a href="pfizer3-p7-m6-run-08.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p7-m6-run-08.png" width="1820" height="410" alt="The output under the cell that labels every page in Colab: Classifying doc 1... down to Classifying doc 10..."><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure><p class="p">In our run, this took about 18 seconds. If you see <code>Gemini is busy, retrying in 30s...</code>, let it run.</p>
</template>

<template id="t15">
<div class="his"><span class="num">His page says</span><p>Classify the User Query. Use your <code>classify_query_llm()</code> function to take in a user query (e.g., "What are the part numbers listed in this document?"), prompt the LLM to return one of the known types, and store the result as <code>predicted_doc_type</code>.</p></div><p class="p">This cell sits below the labelling cells in your copy, so every page already has its real label when the router reads the summary.</p><p class="p">Find the cell with <code># STEP 6: Test Query Classification</code> near its top, and press <b>Run</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">query = &quot;What are the part numbers listed in this document?&quot;</span><span class="ln" style="--i:0ch">predicted_doc_type = classify_query_llm(query, pdf_metadata_store)</span><span class="ln" style="--i:0ch">print(predicted_doc_type)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>It asks the router about one question, <i>"What are the part numbers listed in this document?"</i></li><li><code>predicted_doc_type</code> keeps the router's answer, and the last line prints it.</li></ul>

<template id="t16">

<template id="t17">
<div class="his"><span class="num">His page says</span><p>Once you've classified the query, use metadata to fetch only the relevant files, no need for embeddings yet. For example, if the predicted doc type is BSE/TSE Declaration, retrieve all documents where <code>doc_type = "BSE/TSE Declaration"</code>, or fetch just the most recent one if that makes more sense for your query.</p></div><p class="p">Find the cell with <code># STEP 9: Retrieve Files by Document Type</code> near its top, and press <b>Run</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">def retrieve_files_by_doc_type(doc_type, metadata_store):</span><span class="ln" style="--i:4ch">    return [doc for doc in metadata_store if doc[&quot;doc_type&quot;] == doc_type]</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Debug: show what we&#x27;re matching against</span><span class="ln" style="--i:0ch">print(f&quot;Query predicted type: &#x27;{predicted_doc_type}&#x27;&quot;)</span><span class="ln" style="--i:0ch">print(f&quot;Page types in store: {[doc[&#x27;doc_type&#x27;] for doc in pdf_metadata_store]}&quot;)</span><span class="ln" style="--i:0ch">print()</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Call the function using the predicted type</span><span class="ln" style="--i:0ch">matched_files = retrieve_files_by_doc_type(predicted_doc_type, pdf_metadata_store)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Display matched documents</span><span class="ln" style="--i:0ch">print(f&quot;Found {len(matched_files)} matching page(s):&quot;)</span><span class="ln" style="--i:0ch">for doc in matched_files:</span><span class="ln" style="--i:4ch">    print(f&quot;  Page {doc[&#x27;page_number&#x27;]}: {doc[&#x27;doc_type&#x27;]} - {doc[&#x27;text&#x27;][:100]}...&quot;)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>retrieve_files_by_doc_type</code> keeps only the pages whose <code>doc_type</code> is exactly the predicted type. This is a <b>filter</b>: no model and no search, just a match on the label.</li><li>The <code>Debug</code> lines print the predicted type and every page's label. The loop prints each match.</li></ul>
</template>

<template id="t19">
<div class="his"><span class="num">His page says</span><p>There may be cases where multiple documents match, or where the query is vague (e.g., "Show me all supplier documentation"). Here's what you can do: use the metadata + LLM to narrow down to a handful of files. Then apply embeddings + vector search <b>only within those few files</b>.</p></div><p class="p">Your notebook's Step 4 does that last search with keywords instead: if your metadata filter still leaves too many results, or the user's query is vague, you can run a keyword-based search, but only within the smaller set of matching pharmaceutical documents.</p><p class="p">Find the cell with <code># STEP 10: Fallback</code> near its top, and press <b>Run</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">def keyword_search(query, documents):</span><span class="ln" style="--i:4ch">    query = query.lower()</span><span class="ln" style="--i:4ch">    keywords = [&quot;part number&quot;, &quot;article number&quot;, &quot;item&quot;, &quot;specification&quot;,</span><span class="ln" style="--i:16ch">                &quot;product&quot;, &quot;certificate&quot;, &quot;lot&quot;, &quot;description&quot;,</span><span class="ln" style="--i:16ch">                &quot;sterilization&quot;, &quot;BSE&quot;, &quot;supplier&quot;]</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    for doc in documents:</span><span class="ln" style="--i:8ch">        text = doc[&quot;text&quot;].lower()</span><span class="ln" style="--i:8ch">        if any(keyword.lower() in text for keyword in keywords):</span><span class="ln" style="--i:12ch">            return doc</span><span class="ln" style="--i:4ch">    return None</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">user_query = &quot;What part numbers are listed?&quot;</span><span class="ln" style="--i:0ch">print(&quot;Best matching result (fallback):&quot;)</span><span class="ln" style="--i:0ch">print(keyword_search(user_query, matched_files))</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>keyword_search</code> returns the first matched page holding any word in <code>keywords</code>, such as <code>"lot"</code>.</li><li>It ignores the question's own words: <code>query</code> isn't used to pick a page.</li></ul>
</template>

    var avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var base = parseFloat(getComputedStyle(inner).rowGap) || 14;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (base + Math.min(base, spare / gaps)) + "px";
    /* P5 m2 fix round 1: what is still spare after the gaps widen is split above and below, so a short slide sits in
       the middle of the card instead of leaving one big empty area at the bottom */
    var left = avail - inner.offsetHeight;
    if (left > 1) inner.style.marginTop = Math.floor(left / 2) + "px";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    space();
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #slide=N opens slide N directly */
  var hm = location.hash.match(/slide=(\d+)/);
  if (hm) i = Math.min(SLIDES.length - 1, Math.max(0, +hm[1] - 1));
  window.addEventListener("resize", function () { scaleStage(); space(); });
  scaleStage();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
</body>
</html>
