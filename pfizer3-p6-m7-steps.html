<template id="s7">
<p class="p">You'll test all three models we introduced earlier:</p>
<ul class="list">
  <li><b>Mistral 7B (GGUF):</b> good balance of performance and speed.</li>
  <li><b>Phi-2 (Microsoft):</b> lightweight and fast, but not trained to follow instructions, so its answers may wander.</li>
  <li><b>TinyLlama (1.1B):</b> built for small-scale applications. 1.1B means about 1.1 billion numbers learned in training, which is small for a model.</li>
</ul>
<p class="p">GGUF is the file format the notebook's tool, llama-cpp-python, reads. Each model comes as one GGUF file you download.</p>
</template>
<template id="s8">
<p class="p">Run cell 11. It builds the same pipeline for every model you'll test:</p>
<ul class="list">
  <li><b>LlamaCPP</b> loads the model from <code>model_path="/content/mistral.gguf"</code>, with <code>max_new_tokens=512</code> (the longest answer it writes) and <code>context_window=2048</code> (the most text it reads at once, question and chunks together).</li>
  <li><b>BGE</b> (<code>BAAI/bge-small-en-v1.5</code>) turns the text into numbers, and the retriever brings back the 2 closest chunks (<code>similarity_top_k=2</code>).</li>
  <li><b>tree_summarize</b> combines the chunks and writes one answer.</li>
</ul>
<p class="p">In our run, cell 11 took 47 seconds. Its long loading log includes this line (CPU again, as on slide 5):</p>
<figure class="run out"><div class="code-head"><span class="code-lang">Output</span></div><pre tabindex="0"><code>llm_load_tensors:        CPU buffer size =  4165.37 MiB</code></pre></figure>
<p class="p">A yellow <code>HF_TOKEN</code> warning is safe to ignore.</p>

  function space() {
