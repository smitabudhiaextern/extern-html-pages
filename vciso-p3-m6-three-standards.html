<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Standards</title>
<link rel="icon" href="data:,">
<!--
  vCISO P3 Step 2, Module 6 (Frameworks, and the One You'll Use), section
  "Understand Security Standard Frameworks": Three standards.
  Governing authority: output/programs/vciso/CLAUDE.md section 6 and
  HANDOVER-2026-10-02-P2.md section 2 ("Interactives"). Chrome, options, right and
  wrong states, navigation, scale-to-fit and phone layout match
  vciso-p3-m3-find-cumberlands-labels.html and vciso-p3-m4-one-stolen-password.html.
  The right and wrong colours are used only for right and wrong, always with an icon and a word.

  Scope: outline P3 Step 2, "[Training] Frameworks, and the One You'll Use", bullet 3.
  Names at recognition level only. ISO 27001 is what a company gets certified against.
  ISO 27002 is the detailed guidance it implements from. SOC 2 is the one you'll meet in
  your second year rather than your first. NIST CSF is not covered here; the module does it next.

  Pebblework is a made-up company. The hospital is not named.
  Slide plan and the one-line definitions: owner approved, 7 October 2026.
  Animations are CSS only. Every animated element's resting style is its final state,
  so with reduced motion everything simply shows, finished.

  Verify before shipping:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs   this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    /* right and wrong states only, always paired with an icon and a word */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-reveal:460ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto;background:var(--bg)}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* header */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin-bottom:6px;min-height:28px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .dots{display:flex;gap:7px;align-items:center}
  .dots i{display:block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--on-highlight);background:transparent}
  .dots i.on{background:var(--on-highlight)}
  .dots i.here{background:var(--on-highlight);width:12px;height:12px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--on-highlight)}

  h1{font-size:25px;line-height:1.22;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px;position:relative}
  .lead{font-size:15.5px;line-height:1.48;color:var(--body);max-width:84ch}
  .lead b{color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- the scene (animated picture) ---------- */
  .split{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:452px minmax(0,1fr);gap:22px;align-items:start}
  .scene{position:relative;background:var(--highlight);border-radius:14px;padding:16px 18px 14px;color:var(--on-highlight)}
  .scene .tag{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  button.replay{font-family:inherit;position:absolute;top:10px;right:10px;display:inline-flex;align-items:center;gap:6px;
    background:var(--bg);color:var(--on-highlight);border:1.5px solid var(--on-highlight);border-radius:20px;
    padding:3px 11px 3px 8px;font-size:12.5px;font-weight:600;cursor:pointer}
  button.replay svg.ic{width:15px;height:15px}
  button.replay:hover{background:var(--tint2)}
  button.replay:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  .actor{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;flex:0 0 auto}
  .av{width:66px;height:66px;border-radius:50%;background:var(--bg);border:2px solid var(--on-highlight);
    display:flex;align-items:center;justify-content:center;color:var(--on-highlight);position:relative}
  .av svg.ic{width:36px;height:36px}
  .an{font-size:14.5px;font-weight:600;color:var(--title);line-height:1.2}
  .as{font-size:12.5px;line-height:1.3;color:var(--body);max-width:150px}

  .steps{list-style:none;display:flex;flex-direction:column;gap:5px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .steps li{display:flex;align-items:center;gap:9px;font-size:14px;line-height:1.3;color:var(--title)}
  .steps .n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--on-highlight);color:var(--bg);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}

  /* text column */
  .col{min-width:0;display:flex;flex-direction:column;gap:12px}
  .key{background:var(--bg);border:1.5px solid var(--on-highlight);border-left-width:6px;border-radius:10px;
    padding:10px 14px 11px;display:flex;gap:11px;align-items:flex-start}
  .key svg.ic{width:24px;height:24px;flex:0 0 auto;color:var(--on-highlight);margin-top:1px}
  .key .kt{display:flex;flex-direction:column;gap:3px;min-width:0}
  .key .kk{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .key .kv{font-size:16.5px;line-height:1.42;font-weight:600;color:var(--title)}
  .key.soft{background:var(--tint);border:1.5px dashed var(--line);border-left:6px solid var(--on-highlight)}
  .key.soft .kv{font-weight:400;font-size:15.5px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .pair > span{display:flex;align-items:center;gap:7px;background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:8px;
    padding:5px 9px;font-size:13.5px;line-height:1.25;color:var(--title)}
  .pair svg.ic{width:20px;height:20px;margin:0;color:var(--on-highlight)}
  .pair b{font-weight:700}

  /* slide 1 */
  .s1scene{display:flex;flex-direction:column;gap:12px;padding:16px 22px 18px}
  .s1row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:12px}
  .link{align-self:center;display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:26px}
  .link .ln{width:100%;border-top:2px dashed var(--on-highlight)}
  .link .lt{font-size:13px;line-height:1.3;color:var(--body);text-align:center}
  .bubble{position:relative;align-self:flex-end;width:250px;margin:30px 4px 4px 0;background:var(--bg);border:2px solid var(--on-highlight);
    border-radius:14px;padding:9px 13px;font-size:16px;line-height:1.35;font-weight:600;color:var(--title);text-align:left}
  .bubble::after{content:"";position:absolute;right:30px;bottom:-9px;width:14px;height:14px;background:var(--bg);
    border-right:2px solid var(--on-highlight);border-bottom:2px solid var(--on-highlight);transform:rotate(45deg)}
  button.replay.left{left:10px;right:auto}
  .ways{display:flex;flex-direction:column;gap:9px}
  .way{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:12px;padding:9px 14px;display:flex;align-items:center;gap:12px}
  .way .wi{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--highlight);border:1.5px solid var(--on-highlight);
    display:flex;align-items:center;justify-content:center;color:var(--on-highlight)}
  .way .wi svg.ic{width:25px;height:25px}
  .way .wt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .way .wn{font-size:12.5px;font-weight:600;color:var(--on-highlight)}
  .way .ww{font-size:17px;font-weight:600;color:var(--title);line-height:1.2}

  /* slide 2: the check and the certificate */
  .s2top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 6px;margin-top:4px}
  .clip{flex:0 0 auto;width:118px;background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:8px;padding:8px 10px;
    display:flex;flex-direction:column;gap:7px;margin-bottom:22px}
  .clip .cr{display:flex;align-items:center;gap:7px}
  .clip .bx{flex:0 0 auto;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center}
  .clip .bx svg.ic{width:12px;height:12px;stroke-width:2.6}
  .clip .bar2{flex:1 1 auto;height:5px;border-radius:3px;background:var(--tint2)}
  .mag{position:absolute;right:-14px;bottom:-8px;width:30px;height:30px;border-radius:50%;background:var(--highlight);
    border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center}
  .mag svg.ic{width:18px;height:18px}
  .cert{position:relative;margin:14px auto 0;width:300px;background:var(--bg);border:2px solid var(--on-highlight);border-radius:6px;padding:5px}
  .cert .ci{border:1px dashed var(--on-highlight);border-radius:3px;padding:9px 14px 10px;display:flex;flex-direction:column;gap:2px}
  .cert .c1{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--on-highlight)}
  .cert .c2{font-size:20px;font-weight:700;color:var(--title)}
  .cert .c3{font-size:12.5px;color:var(--body)}
  .stamp{position:absolute;right:14px;top:50%;margin-top:-34px;width:68px;height:68px;border-radius:50%;
    border:3px double var(--on-highlight);color:var(--on-highlight);background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transform:rotate(-12deg)}
  .stamp svg.ic{width:22px;height:22px;stroke-width:2.4}
  .stamp b{font-size:11px;letter-spacing:.1em;text-transform:uppercase}

  /* slide 3: the guide */
  .book{position:relative;margin:6px auto 0;width:360px;height:214px;perspective:1100px}
  .page{position:absolute;top:0;width:50%;height:100%;background:var(--bg);border:2px solid var(--on-highlight);padding:12px 12px}
  .page.l{left:0;border-radius:10px 2px 2px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;text-align:center}
  .page.r{right:0;border-radius:2px 10px 10px 2px;display:flex;flex-direction:column;gap:9px}
  .page.l svg.ic{width:34px;height:34px;color:var(--on-highlight)}
  .page .p1{font-size:19px;font-weight:700;color:var(--title)}
  .page .p2{font-size:13px;line-height:1.35;color:var(--body)}
  .page .ph{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--on-highlight)}
  .gstep{display:flex;align-items:center;gap:8px;font-size:13.5px;line-height:1.25;color:var(--title)}
  .gstep .gi{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--highlight);display:flex;align-items:center;justify-content:center;color:var(--on-highlight)}
  .gstep .gi svg.ic{width:18px;height:18px}
  .more{font-size:12.5px;font-style:italic;color:var(--body)}
  .cover{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;transform:rotateY(-180deg);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--on-highlight);color:var(--bg);
    border:2px solid var(--on-highlight);border-radius:2px 10px 10px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .cover svg.ic{width:38px;height:38px}
  .cover b{font-size:19px}
  .cover span{font-size:13px}
  .spine{position:absolute;left:50%;top:4px;bottom:4px;width:2px;margin-left:-1px;background:var(--on-highlight)}

  /* slide 4: the report */
  .s4scene{display:flex;flex-direction:column}
  .s4top{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:6px}
  .rep{width:170px;background:var(--bg);border:2px solid var(--on-highlight);border-radius:6px;padding:9px 12px 11px;display:flex;flex-direction:column;gap:6px}
  .rep .r1{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--on-highlight)}
  .rep .r1 svg.ic{width:16px;height:16px}
  .rep .r2{font-size:17px;font-weight:700;color:var(--title);line-height:1.15}
  .rep .r3{font-size:12px;color:var(--body)}
  .rep .rl{height:5px;border-radius:3px;background:var(--tint2);transform-origin:left center}
  .pen{position:relative}
  .pen .pn{position:absolute;right:-12px;bottom:-6px;width:30px;height:30px;border-radius:50%;background:var(--highlight);
    border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center}
  .pen .pn svg.ic{width:17px;height:17px}
  .s4row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:10px;margin-top:4px;padding:0 4px}
  .track{position:relative;height:34px;margin-bottom:24px}
  .track .tl{position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--on-highlight)}
  .track .arrow{position:absolute;right:-4px;top:50%;margin-top:-8px;width:16px;height:16px;color:var(--on-highlight)}
  .mini{position:absolute;top:0;left:calc(100% - 44px);width:34px;height:34px;background:var(--bg);border:2px solid var(--on-highlight);
    border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--on-highlight)}
  .mini b{font-size:9px;letter-spacing:.02em;white-space:nowrap}
  .ask{position:relative;align-self:flex-end;margin:14px 2px 6px auto;width:max-content;max-width:100%;background:var(--bg);border:2px solid var(--on-highlight);
    border-radius:12px;padding:6px 11px;font-size:14px;line-height:1.3;font-weight:600;color:var(--title);text-align:left}
  .ask::after{content:"";position:absolute;right:22px;bottom:-8px;width:12px;height:12px;background:var(--bg);
    border-right:2px solid var(--on-highlight);border-bottom:2px solid var(--on-highlight);transform:rotate(45deg)}

  /* slide 5: the quick check */
  .split.q{grid-template-columns:minmax(0,1fr) 448px;gap:20px}
  .ad{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:12px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:7px}
  .ad .ah{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .ad .ah svg.ic{width:20px;height:20px}
  .ad .at{font-size:19px;font-weight:700;color:var(--title);line-height:1.25}
  .ad .al{font-size:14px;line-height:1.4;color:var(--body)}
  .ad mark{background:var(--highlight);color:var(--title);font-weight:700;padding:2px 6px;border-radius:4px;border-bottom:2px solid var(--on-highlight)}
  .opts{display:flex;flex-direction:column;gap:8px}
  button.opt{font-family:inherit;text-align:left;color:var(--title);
    background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;
    padding:7px 12px;cursor:pointer;display:flex;gap:11px;align-items:center;min-height:56px;width:100%;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  button.opt .g{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;background:transparent;font-size:13px;font-weight:700}
  button.opt .g svg.ic{width:15px;height:15px;stroke-width:2.6}
  button.opt .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
  button.opt .lr{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  button.opt .ol{font-size:16px;font-weight:700;line-height:1.25;color:var(--title)}
  button.opt .om{font-size:13.5px;line-height:1.3;color:var(--body)}
  button.opt .tg{flex:0 0 auto;font-size:13px;font-weight:700;white-space:nowrap}
  button.opt:hover:not(:disabled){background:var(--highlight)}
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt:disabled{cursor:default}
  button.opt.idle:disabled{border-style:dashed;border-color:var(--line)}
  button.opt.idle:disabled .g{border-color:var(--line);color:var(--body)}
  button.opt.idle:disabled .ol{color:var(--body)}
  button.opt.ok{background:var(--ok-tint);border:2px solid var(--ok)}
  button.opt.ok .g{background:var(--ok);border-color:var(--ok);color:var(--bg)}
  button.opt.ok .tg{color:var(--ok)}
  button.opt.no{background:var(--no-tint);border:2px solid var(--no)}
  button.opt.no .g{background:var(--no);border-color:var(--no);color:var(--bg)}
  button.opt.no .tg{color:var(--no)}

  .fb{border-radius:10px;padding:9px 14px 11px;border-left:6px solid;display:flex;flex-direction:column;gap:4px}
  .fb.ok{background:var(--ok-tint);border-color:var(--ok)}
  .fb.no{background:var(--no-tint);border-color:var(--no)}
  .fb .fh{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:700}
  .fb.ok .fh{color:var(--ok)}
  .fb.no .fh{color:var(--no)}
  .fb .fh svg.ic{width:20px;height:20px;stroke-width:2}
  .fb .ft{font-size:14.5px;line-height:1.42;color:var(--title)}
  .fb.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .fb:focus{outline:none}

  /* the bar */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:52px;padding-top:9px}
  button.nav{font-family:inherit;font-size:15px;font-weight:600;padding:9px 20px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.36;color:var(--body)}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- gentle motion. Resting styles are the final state. ---------- */
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes walkIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
  @keyframes sweep{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(6px)}}
  @keyframes thump{0%{opacity:0;transform:rotate(-12deg) scale(1.45)}60%{opacity:1;transform:rotate(-12deg) scale(.94)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
  @keyframes coverOpen{from{transform:rotateY(0deg)}to{transform:rotateY(-180deg)}}
  @keyframes write{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes bob{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,-3px)}}
  @keyframes hand{from{left:0}to{left:calc(100% - 44px)}}

  .play .a-up{animation:fadeUp 520ms var(--ease-out) both}
  .play .a-in{animation:fadeIn 420ms var(--ease-out) both}
  .play .a-walk{animation:walkIn 700ms var(--ease-out) both}
  .play .a-pop{animation:pop 460ms var(--ease-over) both}
  .play .a-sweep{animation:sweep 650ms ease-in-out 2 both}
  .play .a-thump{animation:thump 480ms var(--ease-over) both}
  .play .a-cover{animation:coverOpen 900ms cubic-bezier(.45,.05,.3,1) both}
  .play .a-write{animation:write 420ms var(--ease-out) both}
  .play .a-bob{animation:bob 500ms ease-in-out 3 both}
  .play .a-hand{animation:hand 900ms cubic-bezier(.45,.05,.3,1) both}
  .play .d1{animation-delay:.2s}.play .d2{animation-delay:.45s}.play .d3{animation-delay:.7s}
  .play .d4{animation-delay:1s}.play .d5{animation-delay:1.3s}.play .d6{animation-delay:1.6s}
  .play .d7{animation-delay:1.9s}.play .d8{animation-delay:2.2s}.play .d9{animation-delay:2.5s}
  .play .d10{animation-delay:2.8s}.play .d11{animation-delay:3.1s}

  /* under 600px: a portrait restack, not a shrunken slide */
  @media (max-width:599px){

    render();
    var fb = el.board.querySelector("#fb");
    if(fb && !reduce){ fb.classList.remove("in"); void fb.offsetWidth; fb.classList.add("in"); }
    if(fb) say(strip(fb.innerHTML.replace(/<\/p>/g, " ").replace(/<\/span>/g, ". ")));
    var ph = phone(), opt = ph ? { preventScroll:true } : undefined;
    if(a.done) el.again.focus(opt);
    else { var f = el.board.querySelector(".opts button.opt:not(:disabled)"); if(f) f.focus(opt); }
    if(fb && ph) fb.scrollIntoView({ block:"nearest", behavior: reduce ? "auto" : "smooth" });
  }

  var S = [
    { label:"The question", h1:"The question every customer asks", r:s1 },
    { label:"ISO 27001", h1:"ISO 27001: a certificate", r:s2 },
    { label:"ISO 27002", h1:"ISO 27002: the how-to guide", r:s3 },
    { label:"SOC 2", h1:"SOC 2: a report card", r:s4 },
    { label:"Quick check", h1:"A job ad says ISO 27001 experience preferred. What do you think the company has?", r:s5, quiz:true }
  ];
  var i = 0;

  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k === i ? "here" : k < i ? "on" : "") + "'></i>";
    el.segs.innerHTML = h;
    el.back.disabled = (i === 0);
    el.next.hidden = false; el.next.disabled = false; el.again.hidden = true;
    el.next.textContent = (i === 0) ? "Start" : "Next";
    el.hint.textContent = "";
    if(s.quiz){
      el.next.hidden = true;
      if(a.done){ el.again.hidden = false; el.hint.textContent = "You are done here. Go back to the module and keep reading."; }
      else el.hint.textContent = Object.keys(a.out).length ? "Pick another answer." : "Pick an answer to finish.";
    } else {
      el.hint.innerHTML = '<span class="kb">Use the arrow keys or the buttons to move between slides.</span>';
    }
  }

  function render(){
    var s = S[i];
    el.h1.textContent = s.h1;
    el.board.innerHTML = s.r();
    el.board.classList.toggle("play", !reduce && !s.quiz);
    Array.prototype.forEach.call(el.board.querySelectorAll("button.replay"), function(b){
      b.addEventListener("click", function(){ render(); var nb = el.board.querySelector("button.replay"); if(nb) nb.focus(); say("Playing again."); });
    });
    Array.prototype.forEach.call(el.board.querySelectorAll(".opts button.opt:not(:disabled)"), function(b){
      b.addEventListener("click", function(){ pick(b.dataset.o); });
    });
    el.frame.setAttribute("aria-label", s.h1);
    header();
  }

  function focusTop(){
    var ph = phone();
    el.frame.focus(ph ? { preventScroll:true } : undefined);
    if(ph) window.scrollTo(0, 0);
  }
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(); focusTop();
    say(el.prog.textContent + ". " + S[i].h1);
  }
  function resetAll(){ a = { out:{}, done:null }; i = 0; render(); }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });
  el.again.addEventListener("click", function(){ resetAll(); focusTop(); say("Cleared. Back to the start."); });

  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(S[i].quiz && /^[1-4a-dA-D]$/.test(e.key)){
      var o = /[1-4]/.test(e.key) ? "ABCD".charAt(+e.key - 1) : e.key.toUpperCase();
      e.preventDefault(); pick(o);
    }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* scale the fixed canvas down to fit, never up */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()) stage.style.transform = "";
    else {
      var sc = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
      stage.style.transform = "scale(" + sc + ")";
    }
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* the QA hook */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    reset:function(){ resetAll(); },
    state:function(){ return { i:i, out:a.out, done:a.done }; }
  };
})();
</script>
</body>
</html>
