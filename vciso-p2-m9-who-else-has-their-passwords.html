<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Else Has Their Passwords</title>
<!--
  vCISO P2 Step 2, Module 9: Who Else Already Has Their Passwords. Interactive P2-8.
  Matches the approved M5 builds (vciso-p2-m5-follow-one-bill.html).
  Governing authority: output/programs/vciso/CLAUDE.md section 6 and
  VCISO-STYLE-GUIDE.md section 6 (per-slide tint ramp, 6b).

  Data: the four per-scope tables are verbatim from
  "P2 Sample Pack/Shared/Exposure fixtures - service lookup and breached credentials.md", section 2.
  Options, their order, the answer and the verdicts: module-09-internal.md build spec and
  "Interactive content sets - P2.md", P2-8. Option 1 is "true, but not the point", never marked wrong.
  Reveals follow the spec's suggested copy and never mention the second proof of identity.
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. Tint carries no meaning. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
  .lead{flex:0 0 auto;font-size:16px;line-height:1.45;color:var(--body);max-width:78ch}
  .lead b{color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  .gl{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--on-highlight);
    font-size:12px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center}

  /* ---- slide 1: the scope picker ---- */
  .scopes{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  button.sc{font-family:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--title);
    border:1.5px dashed var(--on-highlight);border-radius:12px;padding:20px 18px 16px;
    display:flex;flex-direction:column;gap:12px;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  button.sc:hover{background:var(--highlight)}
  button.sc:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.sc .si{width:64px;height:64px;border-radius:14px;background:var(--highlight);color:var(--on-highlight);
    border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center}
  button.sc .si svg.ic{width:36px;height:36px}
  button.sc .sl{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  button.sc .sn{font-size:20px;font-weight:600;line-height:1.25;color:var(--title);flex:1 1 auto;min-height:50px}
  button.sc .ss{font-size:14px;font-weight:600;color:var(--on-highlight);display:flex;align-items:center;gap:7px;
    border-top:1.5px dashed var(--line);padding-top:9px}
  button.sc.on{background:var(--on-highlight);border:2px solid var(--on-highlight);color:var(--bg)}
  button.sc.on .sl,button.sc.on .sn,button.sc.on .ss{color:var(--bg)}
  button.sc.on .ss{border-top:1.5px solid var(--bg)}
  button.sc.on .gl{border-color:var(--bg);background:var(--bg);color:var(--on-highlight)}
  button.sc.on .si{background:var(--bg)}
  .note2{flex:0 0 auto;font-size:15px;line-height:1.45;color:var(--body)}
  .note2 b{color:var(--title)}

  /* ---- slide 2: the search result ---- */
  .res{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
  .rh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:var(--on-highlight)}
  .rh svg.ic{width:20px;height:20px;flex:0 0 auto}
  table.bt{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--bg);
    border:1.5px solid var(--on-highlight);border-radius:10px;overflow:hidden;font-size:16px;color:var(--title)}
  table.bt th{background:var(--on-highlight);color:var(--bg);text-align:left;font-size:12.5px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;padding:6px 14px}
  table.bt th:nth-child(1){width:50%} table.bt th:nth-child(2){width:28%} table.bt th:nth-child(3){width:22%}
  table.bt td{padding:5px 14px;border-top:1.5px solid var(--line);line-height:1.3}
  table.bt td:first-child{font-weight:600;overflow-wrap:anywhere}

  .ask{flex:1 1 auto;min-height:0;background:var(--highlight);border-radius:12px;padding:10px 16px 10px;
    display:flex;flex-direction:column;gap:8px}
  .pq{flex:0 0 auto;font-size:19px;font-weight:600;line-height:1.3;color:var(--title)}
  .opts{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  button.opt{font-family:inherit;text-align:left;cursor:pointer;color:var(--title);background:var(--bg);
    border:1.5px solid var(--line);border-radius:10px;padding:8px 12px 7px;min-height:74px;
    display:flex;flex-direction:column;gap:6px;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out),box-shadow var(--t-fast) var(--ease-out)}
  button.opt:hover{background:var(--highlight);border-color:var(--on-highlight)}
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt .ot{display:flex;gap:9px;align-items:flex-start;font-size:15.5px;line-height:1.32;font-weight:600;flex:1 1 auto}
  /* Unanswered: an empty ring. Never a filled dot. */
  button.opt .g{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--on-highlight);
    background:transparent;margin-top:1px}
  button.opt .ov{font-size:13px;font-weight:600;color:var(--on-highlight);display:flex;align-items:center;gap:6px;
    border-top:1.5px dashed var(--line);padding-top:5px;min-height:25px}
  .ask:not(.answered) button.opt .ov{border-top-color:transparent}
  button.opt .ov .gl{width:18px;height:18px;font-size:12px}
  .gl svg.ic{width:80%;height:80%;stroke-width:2.2}
  .pl{flex:0 0 auto;font-size:14px;line-height:1.35;color:var(--title)}
  button.opt .ov .yp{margin-left:auto;background:var(--on-highlight);color:var(--bg);border-radius:10px;padding:1px 8px;font-size:12px}
  button.opt.mine{border:2px solid var(--on-highlight)}
  button.opt.mine .g{background:var(--on-highlight);box-shadow:inset 0 0 0 3px var(--bg)}
  button.opt.view{box-shadow:0 0 0 3px var(--highlight),0 0 0 5.5px var(--on-highlight)}
  .answered button.opt:not(.mine) .g{border-style:dashed}

  .rv{flex:1 1 auto;min-height:0;background:var(--bg);border:1.5px dashed var(--line);border-radius:10px;
    padding:8px 14px 9px;display:flex;flex-direction:column;gap:4px}
  .rv.wait{justify-content:center}
  .rv.wait p{font-size:14.5px;color:var(--body)}
  .rv.on{border:1.5px solid var(--on-highlight)}
  .rv.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .rv:focus{outline:none}
  .rv:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  html.ptr .rv:focus-visible{outline:none}
  .rvh{display:flex;align-items:center;gap:8px}
  .rvh .gl{width:22px;height:22px;font-size:12.5px;color:var(--on-highlight)}
  .rvh .vd{font-size:17px;font-weight:600;color:var(--title)}
  .rvh .which{margin-left:auto;margin-right:4px;font-size:12.5px;font-weight:600;color:var(--on-highlight);white-space:nowrap}
  .rv .why{font-size:15px;line-height:1.42;color:var(--title)}
  .rv .def{margin-top:auto;font-size:13px;line-height:1.35;color:var(--body);border-top:1.5px solid var(--line);padding-top:5px}
  .rv .def b{color:var(--title)}
  .rvfoot{display:flex;align-items:center;gap:12px}
  button.again{font-family:inherit;font-size:13px;font-weight:600;padding:4px 11px;border-radius:7px;cursor:pointer;
    border:1.5px solid var(--on-highlight);background:transparent;color:var(--on-highlight);flex:0 0 auto}
  button.again:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  .panel.gate{flex:0 0 auto;background:var(--highlight);border-radius:12px;display:flex;flex-direction:column;gap:14px;padding:22px 24px}
  .done{font-size:15px;line-height:1.45;color:var(--title)}
  button.go{font-family:inherit;font-size:15px;font-weight:600;padding:9px 17px;border-radius:8px;cursor:pointer;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);align-self:flex-start}
  button.go:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:56px;overflow-y:auto;font-size:13.5px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* Slide 2 compaction: the reveal needs room for three lines plus the definition. */
  @media (min-width:600px){
  body.t2 h1{font-size:26px;margin-bottom:6px}
  body.t2 .board{gap:8px}
  body.t2 table.bt th{padding:4px 14px}
  body.t2 table.bt td{padding:3px 14px}
  body.t2 .ask{padding:8px 14px 8px;gap:6px}
  body.t2 button.opt{min-height:0;padding:6px 12px 5px;gap:4px}
  body.t2 button.opt .ov{min-height:22px;padding-top:4px}
  body.t2 .rv{padding:6px 14px 7px;gap:3px}
  body.t2 .rv .why{font-size:14.5px;line-height:1.36}
  body.t2 .rv .def{font-size:12.5px;padding-top:3px}
  body.t2 .bar{padding-top:6px;min-height:50px}
  body.t2 #hint{height:50px}
  body.t2 .frame{padding-top:14px}
  }

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    .lead{font-size:16px}
    .pl{font-size:16px}
    .board{flex:0 0 auto}
    .scopes{grid-template-columns:1fr 1fr;gap:10px}
    button.sc{min-height:0;padding:14px 12px}
    button.sc .si{width:48px;height:48px}
    button.sc .sn{font-size:17px}
    .note2{font-size:16px}
    table.bt,table.bt tbody,table.bt tr,table.bt td{display:block;width:100%}
    table.bt thead{display:none}
    table.bt{border:0;background:transparent;font-size:16px}
    table.bt tr{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;margin-bottom:8px;padding:6px 0}
    table.bt td{border:0;padding:3px 12px}
    table.bt td::before{content:attr(data-l);display:block;font-size:12.5px;font-weight:600;letter-spacing:.04em;
      text-transform:uppercase;color:var(--on-highlight)}
    .ask{flex:0 0 auto;padding:14px}
    .opts{grid-template-columns:1fr}
    button.opt{min-height:0}
    button.opt .ot{font-size:16px}
    .rv{flex:0 0 auto}
    .rvh{flex-wrap:wrap}
    .rvh .which{margin-left:30px;white-space:normal}
    .rv .why{font-size:16px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

  <div class="nsf">
    <h2>Who Else Has Their Passwords</h2>
    <p>Find your scope below. It shows the two addresses the breach search found for it. <strong>A breach</strong> is a break-in at a company where its records are stolen, often including every account's email address and password.</p>
    <p>LinkedIn, Dropbox, Adobe and MySpace are other companies. When they were broken into, these Cumberland work addresses were in the stolen records.</p>
    <h3>Scope A, Claims Intake</h3>
    <table><tr><th>Email</th><th>Found in breach</th><th>Breach date</th></tr>
      <tr><td>twhitlock@cumberlandclaims.com</td><td>LinkedIn</td><td>2012</td></tr>
      <tr><td>jhale@cumberlandclaims.com</td><td>Dropbox</td><td>2012</td></tr></table>
    <h3>Scope B, Payments and Remittance</h3>
    <table><tr><th>Email</th><th>Found in breach</th><th>Breach date</th></tr>
      <tr><td>gramsey@cumberlandclaims.com</td><td>Adobe</td><td>2013</td></tr>
      <tr><td>jhale@cumberlandclaims.com</td><td>Dropbox</td><td>2012</td></tr></table>
    <h3>Scope C, Patient Records and Archive</h3>
    <table><tr><th>Email</th><th>Found in breach</th><th>Breach date</th></tr>
      <tr><td>dalcott@cumberlandclaims.com</td><td>MySpace</td><td>2008</td></tr>
      <tr><td>jhale@cumberlandclaims.com</td><td>Dropbox</td><td>2012</td></tr></table>
    <h3>Scope D, Remote and Corporate</h3>
    <table><tr><th>Email</th><th>Found in breach</th><th>Breach date</th></tr>
      <tr><td>nbrody@cumberlandclaims.com</td><td>LinkedIn</td><td>2012</td></tr>
      <tr><td>jhale@cumberlandclaims.com</td><td>Dropbox</td><td>2012</td></tr></table>
    <h3>So what does this tell you?</h3>
    <p>Pick one answer in your head before you read on.</p>
    <ol>
      <li>They should change that old password.</li>
      <li>Their work accounts may be reachable right now.</li>
      <li>Nothing. It happened at a different company.</li>
    </ol>
    <div class="box">
      <p><strong>Answer 1: not wrong, but not the point.</strong> True, and worth doing. But it fixes one person's account. The question is what this means for Cumberland.</p>
      <p><strong>Answer 2: right.</strong> A password stolen from another company still works anywhere it was reused. Someone could try it on a Cumberland work account, and nothing at Cumberland would notice it being used. The break-ins are years old, but a reused password could still be the one in use today.</p>
      <p><strong>Answer 3: the trap.</strong> It happened somewhere else, but the password may not have stayed there. If it was used at work too, the break-in reaches Cumberland. The break-ins are years old, but a reused password could still be the one in use today.</p>
    </div>
    <p><strong>Reused password.</strong> The same password used for more than one account, such as a personal account and a work account.</p>
  </div>

    { id:"o2", txt:"Their work accounts may be reachable right now.", ok:true,
      gl:"✓", tag:"The point",
      vd:"Right. This is the point.",
      why:"A password stolen from another company still works anywhere it was reused. Someone could try it on a Cumberland work account, and nothing at Cumberland would notice it being used. The break-ins are years old, but a reused password could still be the one in use today.", def:true },
    { id:"o3", txt:"Nothing. It happened at a different company.",
      gl:"✗", tag:"The trap",
      vd:"That is the trap. The risk can follow the password.",
      why:"It happened somewhere else, but the password may not have stayed there. If it was used at work too, the break-in reaches Cumberland. The break-ins are years old, but a reused password could still be the one in use today.", def:true }
  ];
  var DEF = "<b>Reused password.</b> The same password used for more than one account, such as a personal account and a work account.";

  var S = [
    { id:"scope", kind:"scope", label:"Your scope", h1:"Pick Your Scope",
      lead:"Choose the scope you picked in Project 1. The next slide shows the two addresses the breach search found for it. <b>A breach</b> is a break-in at a company where its records are stolen, often including every account's email address and password." },
    { id:"ask", kind:"ask", label:"The result", h1:"So What Does This Tell You?" }
  ];

  /* ---------------- state ---------------- */
  var KEY = "vciso-p2-m9-who-else-has-their-passwords-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { scope:null, pick:{}, view:{} }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      return { scope: (ORDER.indexOf(raw.scope) >= 0) ? raw.scope : null,
               pick:  isPlain(raw.pick) ? raw.pick : {},
               view:  isPlain(raw.view) ? raw.view : {} };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Data validation, at load, loud. */
  (function validate(){
    var problems = [];
    ORDER.forEach(function(k){ if(!SC[k] || SC[k].rows.length !== 2) problems.push("scope " + k + " needs exactly 2 rows"); });
    if(OPTS.filter(function(o){ return o.ok; }).length !== 1) problems.push("needs exactly one right option");
    if(problems.length){
      document.getElementById("board").innerHTML = '<div class="lead"><b>This deck has authoring errors:</b> ' + problems.join("; ") + "</div>";
      throw new Error("deck data invalid: " + problems.join("; "));
    }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = m; }
  function cur(){ return st.scope ? SC[st.scope] : null; }
  function optById(id){ var r = null; OPTS.forEach(function(o){ if(o.id === id) r = o; }); return r; }
  function myPick(){ return st.scope ? optById(st.pick[st.scope]) : null; }
  function myView(){ return st.scope ? (optById(st.view[st.scope]) || myPick()) : null; }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    if(st.scope && i > 0){
      el.chip.hidden = false;
      el.chip.textContent = "Scope " + st.scope + ", " + SC[st.scope].name;
    } else el.chip.hidden = true;

    el.back.disabled = (i === 0);
    el.next.textContent = "Continue";
    el.next.disabled = false;
    el.hint.textContent = "";
    if(s.kind === "scope" && !st.scope){
      el.next.disabled = true;
      el.hint.innerHTML = "Pick a scope to carry on.";
    }
    else if(i === S.length-1){
      el.next.disabled = true; el.next.textContent = "You are at the end";
      var p = myPick();
      if(!st.scope) el.hint.textContent = "";
      else if(!p) el.hint.innerHTML = "Pick the answer you think fits best.";
      else if(p.ok) el.hint.innerHTML = "Click the other two answers to see what each one means. Then carry on reading below.";
      else el.hint.innerHTML = "Click the other answers to see what each one means. Then carry on reading below.";
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);

    if(s.kind === "scope") renderScope(s);
    else if(s.kind === "ask") renderAsk(s);

    header();
    say("Slide " + (i+1) + " of " + S.length + ". " + s.h1);
  }

  /* Slide 1: four scopes, one pick. The pick can change; each scope keeps its own answer. */
  function renderScope(s){
    el.board.innerHTML = '<p class="lead">' + s.lead + "</p>"
      + '<div class="scopes" role="group" aria-label="Scopes">' + ORDER.map(function(k){
          var on = st.scope === k;
          return '<button class="sc' + (on ? " on" : "") + '" type="button" data-k="' + k + '" aria-pressed="' + on + '">'
            + '<span class="si">' + icon(SC[k].ic) + "</span>"
            + '<span class="sl">Scope ' + k + "</span>"
            + '<span class="sn">' + esc(SC[k].name) + "</span>"
            + '<span class="ss">' + (on ? '<span class="gl" aria-hidden="true">✓</span>Your scope'
                                        : '<span class="gl" aria-hidden="true">+</span>Pick this one') + "</span>"
            + "</button>";
        }).join("") + "</div>"
      + '<p class="note2">You can switch later. <b>Each scope keeps its own answer</b>, so switching loses nothing.</p>';
    Array.prototype.forEach.call(el.board.querySelectorAll("button.sc"), function(b){
      b.addEventListener("click", function(){
        st.scope = b.dataset.k; save(st);
        render();
        var nb = el.board.querySelector('button.sc[data-k="' + st.scope + '"]');
        if(nb) nb.focus();
        say("Scope " + st.scope + ", " + SC[st.scope].name + ", picked.");
      });
    });
  }

  function tableHTML(sc){
    return '<table class="bt"><thead><tr><th scope="col">Email</th><th scope="col">Found in breach</th><th scope="col">Breach date</th></tr></thead><tbody>'
      + sc.rows.map(function(r){
          return '<tr><td data-l="Email">' + esc(r[0]) + '</td><td data-l="Found in breach">' + esc(r[1]) + '</td><td data-l="Breach date">' + esc(r[2]) + "</td></tr>";
        }).join("") + "</tbody></table>";
  }

  function optHTML(o, n){
    var p = myPick(), v = myView();
    var mine = p && p.id === o.id, view = p && v && v.id === o.id;
    var foot = p
      ? '<span class="gl" aria-hidden="true">' + o.gl + "</span>" + esc(o.tag) + (mine ? '<span class="yp">Your pick</span>' : "")
      : "";
    var label = "Answer " + (n+1) + ". " + o.txt + (p ? " " + o.tag + "." + (mine ? " Your pick." : "") : "");
    return '<button class="opt' + (mine ? " mine" : "") + (view ? " view" : "") + '" type="button" data-o="' + o.id + '"'
      + (p ? ' aria-pressed="' + !!view + '"' : "") + ' aria-label="' + esc(label) + '">'
      + '<span class="ot"><span class="g" aria-hidden="true"></span><span>' + esc(o.txt) + "</span></span>"
      + '<span class="ov">' + foot + "</span>"
      + "</button>";
  }

  function rvHTML(){
    var p = myPick(), v = myView();
    if(!p) return '<div class="rv wait" id="rv"><p>Pick one answer. What it means shows here.</p></div>';
    var n = OPTS.indexOf(v) + 1;
    return '<div class="rv on" id="rv" tabindex="-1">'
      + '<div class="rvh"><span class="gl" aria-hidden="true">' + v.gl + '</span><span class="vd">' + esc(v.vd) + "</span>"
      + '<span class="which">' + (v.id === p.id ? "Your pick, answer " + n : "Answer " + n) + "</span>"
      + '<button class="again" type="button" id="again">Clear my answer</button></div>'
      + '<p class="why">' + esc(v.why) + "</p>"
      + (v.def ? '<p class="def">' + DEF + "</p>" : "")
      + "</div>";
  }

  /* Slide 2: the two rows for the scope, the question, three answers. */
  function renderAsk(s){
    var sc = cur();
    if(!sc){
      el.board.innerHTML = '<div class="panel gate"><p class="done"><b>Pick your scope first.</b> The search result depends on it.</p>'
        + '<button class="go" type="button" id="goscope">Go to the scope picker</button></div>';
      el.board.querySelector("#goscope").addEventListener("click", function(){ i = 0; render(); el.frame.focus(); });
      return;
    }
    var p = myPick();
    el.board.innerHTML = '<div class="res">'
      + '<div class="rh">' + icon("search") + "What the breach search found for Scope " + st.scope + ", " + esc(sc.name) + "</div>"
      + tableHTML(sc) + "</div>"
      + '<div class="ask' + (p ? " answered" : "") + '">'
      + '<p class="pl">LinkedIn, Dropbox, Adobe and MySpace are other companies. When they were broken into, these Cumberland work addresses were in the stolen records.</p>'
      + '<div class="opts" role="group" aria-label="So what does this tell you? Pick one.">' + OPTS.map(optHTML).join("") + "</div>"
      + rvHTML()
      + "</div>";
    wire();
  }

  function wire(){
    Array.prototype.forEach.call(el.board.querySelectorAll("button.opt"), function(b){
      b.addEventListener("click", function(){
        var o = optById(b.dataset.o);
        var first = !myPick();
        if(first) st.pick[st.scope] = o.id;
        st.view[st.scope] = o.id;
        save(st);
        renderAsk(S[i]); header();
        var rv = el.board.querySelector("#rv");
        if(rv && !reduce){ rv.classList.remove("in"); void rv.offsetWidth; rv.classList.add("in"); }
        var nb = el.board.querySelector('button.opt[data-o="' + o.id + '"]');
        if(nb) nb.focus();
        say((first ? "You picked: " : "Answer: ") + o.txt + " " + o.vd + " " + o.why);
      });
    });
    var ag = el.board.querySelector("#again");
    if(ag) ag.addEventListener("click", function(){
      delete st.pick[st.scope]; delete st.view[st.scope]; save(st);
      renderAsk(S[i]); header();
      var f = el.board.querySelector("button.opt");
      if(f) f.focus();
      say("Answer cleared. Pick one again.");
    });
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }
  document.addEventListener("keydown", function(e){
    document.documentElement.classList.remove("ptr");
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });
  document.addEventListener("pointerdown", function(){ document.documentElement.classList.add("ptr"); }, true);

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; i = n; render(); return true; },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    state:function(){ return { i:i, scope:st.scope, pick:st.pick, view:st.view }; }
  };
})();
</script>
</body>
</html>
