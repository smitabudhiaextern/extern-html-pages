<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What you have done in Project 4 so far</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#FDF8F8}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#484646}
  .canvas{width:960px;padding:32px 36px 36px;display:flex;flex-direction:column}
  h1{font-size:24px;line-height:1.2;color:#1C1B1B;font-weight:700}
  .tl{display:grid;grid-template-columns:repeat(4,1fr) 0.86fr;gap:0 14px;margin-top:26px}
  .col{display:flex;flex-direction:column;align-items:center;position:relative}
  svg.i{width:40px;height:40px;stroke:#001D69;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .rail{position:relative;width:100%;height:38px;margin-top:12px;display:flex;align-items:center;justify-content:center}
  .rail::before,.rail::after{content:"";position:absolute;top:50%;height:3px;margin-top:-1.5px;background:#001D69}
  .rail::before{left:-7px;right:50%}
  .rail::after{left:50%;right:-7px}
  .col:first-child .rail::before{display:none}
  .col:last-child .rail::after{display:none}
  .num{position:relative;z-index:1;width:38px;height:38px;border-radius:50%;background:#001D69;color:#FDF8F8;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;border:4px solid #FDF8F8;box-sizing:content-box}
  .card{background:#DCE1FF;border-radius:14px;padding:16px 14px;margin-top:14px;width:100%;flex:1;font-size:18px;line-height:1.4;color:#1C1B1B;text-align:center}
  .now .rail::before{background:none;border-top:3px dashed #001D69;height:0}
  .now .num{background:#FDF8F8;border:3px solid #001D69;width:34px;height:34px;padding:2px}
  .now .num span{width:16px;height:16px;border-radius:50%;background:#001D69;display:block}
  .now .card{background:#FDF8F8;border:2.5px solid #001D69;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .now .tag{font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#001D69}
  .now .what{font-size:20px;font-weight:700;color:#1C1B1B;line-height:1.3}
</style>
</head>
<body>
<div class="canvas">
  <h1>What you have done in Project 4 so far</h1>
  <div class="tl">
    <div class="col">
      <svg class="i" viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="5" width="18" height="24" rx="2"/><path d="M12 3h8v4h-8z"/><path d="M11 14l2 2 3.5-3.5"/><path d="M19 14.5h3"/><path d="M11 22l2 2 3.5-3.5"/><path d="M19 22.5h3"/></svg>
      <div class="rail"><div class="num">1</div></div>
      <div class="card">Graded Ray's eight claims against Cumberland's files</div>
    </div>
    <div class="col">
      <svg class="i" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 3h11l6 6v8"/><path d="M16 3v6h6"/><path d="M5 3v24h9"/><path d="M9 13h8M9 17.5h5"/><circle cx="21" cy="22" r="5"/><path d="M24.6 25.6l4 4"/></svg>
      <div class="rail"><div class="num">2</div></div>
      <div class="card">Read both incident reports the way an auditor would</div>
    </div>
    <div class="col">
      <svg class="i" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 3h11l6 6v6"/><path d="M16 3v6h6"/><path d="M5 3v26h8"/><path d="M9 13h8M9 17.5h6"/><path d="M17 28l1-4.5 8.5-8.5 3.5 3.5-8.5 8.5z"/><path d="M24 17.5l3.5 3.5"/></svg>
      <div class="rail"><div class="num">3</div></div>
      <div class="card">Rewrote Ray's eight answers so they can be proven</div>
    </div>
    <div class="col">
      <svg class="i" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 3h12l7 7v19H7z"/><path d="M19 3v7h7"/><rect x="10.5" y="14" width="4" height="4" rx=".8"/><path d="M17.5 16h5"/><rect x="10.5" y="21.5" width="4" height="4" rx=".8"/><path d="M11.3 23.4l1 1 1.7-2"/><path d="M17.5 23.5h5"/></svg>
      <div class="rail"><div class="num">4</div></div>
      <div class="card">Answered the four questions left in section 4 of Meridian's questionnaire</div>
    </div>
    <div class="col now">
      <svg class="i" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="17" rx="2"/><path d="M16 22v4M10 29l6-3 6 3"/><path d="M9 17l4.5-4.5 3.5 3 6-6"/></svg>
      <div class="rail"><div class="num"><span></span></div></div>
      <div class="card"><div class="tag">Now</div><div class="what">Slides<br>7 and 8</div></div>
    </div>
  </div>
</div>
</body>
</html>
