<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Words, Three Problems</title>
<!--
  vCISO P3 Step 2, Module 6, the interactive "Six words, three problems".
  Built from the Extern deck shell (.claude/skills/build-html-slides/assets/deck-shell.html),
  matched to the house look of 09-assets/final/vciso-p3-m2-three-buckets.html.
  Governing authority: output/programs/vciso/VCISO-STYLE-GUIDE.md section 6, which
  sets the larger type scale and the per-slide tint ramp used here.
  Spec: 06-content/project-03/step-02/module-06-internal.md, "Build note".
  Items, answers and the trap: P3 Sample Pack/Interactive content sets - P3.md, P3-6
  (SME drop 2026-09-25 copy). The six plain-English questions: the Guide, Part 2, idea 15.

  On screen before Check: the six words only, nothing explained (P3-6, "nothing explained").
  The deck never says "function", "CSF" or "NIST": the module prose right after the
  embed names them, so naming them here would spend that prose.

  Card 3 is accepted under Detect or under Respond, and gets the same reveal either way.

  Verify before shipping, both gates, every time:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs   this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  /* ===============================================================
     The palette. The Extern five, plus the vCISO per-slide tint ramp
     (VCISO-STYLE-GUIDE.md 6b, listed in 09-assets/deck-palette.json).
     Tint carries no meaning. Every tint of navy is an rgba() of
     #001D69. No state is ever signalled by colour alone: every
     coloured state also carries a glyph or a label.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, borders, fills      */
    --bg:#FDF8F8;           /* canvas background, and text on navy */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;    /* UI feedback: hover, press, focus, select */
    --t-frame:300ms;   /* movement between slides                  */
    --t-reveal:560ms;  /* a value or an answer resolving           */
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);  /* the slight overshoot */
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. Shared with every
     vCISO deck, so slide 2 here is the same colour as slide 2 elsewhere. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t3{background:#F2E3D2}

  /* ---- the 960x540 canvas, scaled down only, never up ----
     flex:0 0 auto is load bearing: the canvas must always hold 960 in
     layout and let the transform do all of the fitting. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header. Progress is visible from first paint. ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  /* vCISO 6a: heading 28px at 600. */
  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:8px}

  .board{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr;gap:20px}
  .col{min-width:0;min-height:0;display:flex;flex-direction:column}

  .intro{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px;max-width:74ch}
  .intro p{font-size:17px;line-height:1.5}
  .intro p b{color:var(--title);font-weight:600}
  button.jump{font-family:inherit;font-size:13px;font-weight:600;color:var(--on-highlight);align-self:flex-start;
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:6px;padding:5px 10px;cursor:pointer}
  button.jump:hover{background:var(--tint2)}
  button.jump:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  /* The line under the slide 1 heading. Shown only before Check. */
  .sub{flex:0 0 auto;font-size:16px;line-height:1.4;color:var(--body);margin:-2px 0 10px}

  /* ---- slide 1: three problems, six words ----
     The three problem cards stay put in the left column, each with its
     plain-words gloss always visible. Placing a card puts a short label
     for it under the word, so nothing on the slide reflows when a card
     moves. Once checked, the card column goes and every card moves under
     the word it belongs to. */
  .board.srt{display:grid;grid-template-columns:420px minmax(0,1fr);gap:14px}
  .board.srt.done{display:flex;flex-direction:column;gap:8px}
  .cards{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}

  .bins{min-width:0;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    grid-template-rows:repeat(3,minmax(0,1fr));gap:8px 10px}
  .done .bins{flex:1 1 auto;grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(2,minmax(0,1fr));gap:8px 12px}
  .bin{min-width:0;min-height:0;display:flex;flex-direction:column;gap:4px;background:var(--tint);
    border:1.5px dashed var(--on-highlight);border-radius:10px;padding:4px 7px 6px;
    transition:background var(--t-fast) var(--ease-out)}
  .bin.armed{cursor:pointer}
  .bin.over,.bin.armed:hover{background:var(--highlight);border-style:solid}
  .bin.done{border-style:solid;background:var(--bg)}
  button.bh{flex:0 0 auto;font-family:inherit;font-size:16px;font-weight:600;line-height:1.25;color:var(--title);
    letter-spacing:.06em;text-align:left;background:transparent;border:0;border-radius:6px;padding:2px 4px;cursor:pointer;
    display:flex;align-items:center;gap:8px}
  button.bh:focus-visible{outline:3px solid var(--on-highlight);outline-offset:1px}
  button.bh:disabled{cursor:default}
  .bk{flex:0 0 auto;width:24px;height:22px;border-radius:5px;border:1.5px solid var(--on-highlight);
    background:var(--highlight);font-size:13px;font-weight:600;color:var(--on-highlight);letter-spacing:0;
    display:flex;align-items:center;justify-content:center}
  /* The plain-English question each word asks. Shown only after Check. */
  .bq{flex:0 0 auto;font-size:14px;line-height:1.35;color:var(--body);padding:0 4px 2px}
  .bq.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .bcards{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:4px}
  .chips{flex:1 1 auto;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px;padding:0 2px}

  .scard{min-width:0;display:flex;flex-direction:column;gap:3px;
    background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:7px 11px 8px;
    cursor:grab;user-select:none;-webkit-user-select:none;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  .scard:hover,.scard.placed{border-color:var(--on-highlight)}
  .scard:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  .scard.sel{background:var(--highlight);border-color:var(--on-highlight);box-shadow:inset 0 0 0 1.5px var(--on-highlight)}
  .scard.drag,.pc.drag{opacity:.5}
  .sct{display:flex;align-items:flex-start;gap:10px}
  .scard .ct{flex:1 1 auto;min-width:0;font-size:15px;line-height:1.3;font-weight:600;color:var(--title)}
  /* Where the card sits now, in words, so placement is never colour alone. */
  .tag{flex:0 0 auto;margin-top:1px;font-size:12px;line-height:1.3;font-weight:600;white-space:nowrap;
    color:var(--on-highlight);background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;padding:1px 8px}
  .tag.no{background:transparent;border-style:dashed;border-color:var(--line);color:var(--body)}
  /* The plain-words gloss, always visible inside the card. */
  .scard .cd{font-size:15px;line-height:1.36;color:var(--body)}

  /* The short label for a placed card, sitting under its word. */
  .pc{font-size:13px;line-height:1.3;font-weight:600;color:var(--title);background:var(--bg);
    border:1.5px solid var(--on-highlight);border-radius:7px;padding:3px 8px;cursor:grab;
    user-select:none;-webkit-user-select:none}
  .pc.sel{background:var(--highlight);box-shadow:inset 0 0 0 1px var(--on-highlight)}

  /* A card after Check, sitting under the word it belongs to. Its status
     line carries a glyph and words, never colour alone. */
  .rcard{min-width:0;background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:9px;padding:4px 9px;
    display:flex;flex-direction:column;gap:2px}
  .rcard.miss{border-style:dashed}
  .rcard.alt{border-style:dashed;border-color:var(--line)}
  .rcard.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .rcard .ct{font-size:15px;line-height:1.28;color:var(--title)}
  .rcard .rs{display:flex;align-items:center;gap:6px;font-size:13px;line-height:1.3;font-weight:600;color:var(--on-highlight)}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* The tick and cross marks: inline SVG, Phosphor style, one size. */
  .gl{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:inline-flex;align-items:center;justify-content:center}
  .gl svg{width:14px;height:14px;display:block}
  .miss .gl,.gl.x{border-style:dashed}
  #hint .gl{vertical-align:middle;margin:-3px 1px 0}

  /* ---- slide 2: why each one goes where it does ---- */
  .board.ans{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-content:start}
  .board.ans.one{grid-template-columns:minmax(0,700px)}
  .acard{flex:0 0 auto;background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:9px;padding:10px 14px;
    display:flex;flex-direction:column;gap:6px}
    .acard.miss{border-style:dashed}
  .acard.in,.tbox.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .an{display:flex;align-items:flex-start;gap:8px;font-size:18px;line-height:1.3;font-weight:600;color:var(--title)}
  .an .gl{margin-top:2px}
  .aw{display:inline-block;margin-left:27px;align-self:flex-start;background:var(--highlight);border:1px solid var(--on-highlight);
    border-radius:20px;padding:2px 10px;font-size:14px;font-weight:600;color:var(--on-highlight)}
  .ar{font-size:17px;line-height:1.45;color:var(--body);padding-left:27px}
  .ar b{color:var(--on-highlight);font-weight:600}
  .tbox{flex:0 0 auto;margin-top:12px;background:var(--highlight);border:1.5px solid var(--on-highlight);border-left-width:4px;
    border-radius:0 9px 9px 0;padding:9px 12px}
  .tbox p{font-size:18px;line-height:1.42;font-weight:600;color:var(--title)}

  /* ---- the bar. margin-top:auto plus flex:0 0 auto means overflow above
         can never displace this row. ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:56px;overflow-y:auto;font-size:13px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}
  #hint .end{font-size:16px;line-height:1.4;font-weight:600;color:var(--title)}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    .board,.board.ans{display:block}
    .board.srt,.board.srt.done{display:flex;flex-direction:column;gap:14px}
    .sub{font-size:16px;margin:0 0 12px}
    .intro p{font-size:16px}
    .cards{gap:10px}
    .bins,.done .bins{grid-template-columns:1fr;grid-template-rows:none;align-content:start}
    .bin{min-height:80px}
    button.bh{font-size:17px}
    .bq{font-size:16px;line-height:1.45}
    .scard{padding:10px 12px;gap:6px}
    .scard .ct,.rcard .ct{font-size:16px}
    .tag{font-size:13px}
    .rcard .rs{font-size:14px}
    .scard .cd{font-size:16px;line-height:1.45}
    .pc{font-size:15px;padding:6px 10px}
    .col + .col{margin-top:12px}
    .an{font-size:16px}
    .ar{font-size:16px;line-height:1.5}
    .aw{font-size:14px;border-radius:8px;max-width:calc(100% - 27px)}
    .tbox p{font-size:17px}
    button.jump{font-size:14px;padding:7px 12px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

  <div class="nsf">
    <h2>Six words, three problems</h2>
    <p>Here are six words: <strong>Govern</strong>, <strong>Identify</strong>, <strong>Protect</strong>, <strong>Detect</strong>, <strong>Respond</strong> and <strong>Recover</strong>. Nobody has told you what these six words mean yet. Go with your gut. Here are three problems you found at Cumberland. Decide which word you think each problem belongs under before you open the answers below.</p>
    <ol>
      <li><strong>No asset inventory existed.</strong> An asset inventory is one list of everything a company runs: its computers, its systems and its programs.</li>
      <li><strong>Staff have no MFA.</strong> MFA, short for multi-factor authentication, is a second check at login. On top of the password, you give a second proof that it is you, like a code sent to your phone.</li>
      <li><strong>The antivirus outage that spread for days before anyone noticed.</strong> Antivirus is software on each computer that guards it against harmful programs. An outage means it stopped working. Here it stopped on more and more computers over several days.</li>
    </ol>

    <details>
      <summary>Where does "No asset inventory existed" go?</summary>
      <p><strong>Identify.</strong> Identify asks: do we know what we have and where the risks are? Until you built an inventory in Project 1, nobody at Cumberland could list what it runs.</p>
    </details>

    <details>
      <summary>Where does "Staff have no MFA" go?</summary>
      <p><strong>Protect.</strong> Protect asks: are the safeguards in place? A second proof at login is a safeguard. Administrators have to give one. Ordinary staff do not.</p>
    </details>

    <details>
      <summary>Where does "The antivirus outage that spread for days before anyone noticed" go?</summary>
      <!-- Ask Chaitanya to review: Respond reasoning wording -->
      <p><strong>Detect or Respond.</strong> Detect asks: would we notice if something went wrong? Nobody noticed for days, which is a Detect failure. Respond asks: do we know what to do when it does? Even once machines were losing antivirus, nobody traced it back to the cause for days, which is a Respond failure. Both are right. Write one line in your notes on why you picked yours.</p>
      <div class="box"><p><strong>The three problems went under three different words. The third fits under two, and that is allowed.</strong></p></div>
    </details>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ---------------- content ----------------
     The six words, the three cards and the answers are verbatim from P3-6
     (Interactive content sets - P3.md, SME drop 2026-09-25) and the module
     spec (module-06-internal.md, Build note). Card 3 accepts two words.
     The plain-English question for each word is verbatim from the Guide,
     Part 2, idea 15. The reveal text, the footer, the gloss on each card
     (`def`), the short label under a word (`short`) and the reason for a
     wrong pick (`not`) are ours: plain words only, no new facts. Card 3's
     answer badge reads "Detect or Respond" by owner decision. */
  var BINS = [
    { id:"gv", key:"1", word:"GOVERN",   name:"Govern",   q:"Does anyone actually own security here?" },
    { id:"id", key:"2", word:"IDENTIFY", name:"Identify", q:"Do we know what we have and where the risks are?" },
    { id:"pr", key:"3", word:"PROTECT",  name:"Protect",  q:"Are the safeguards in place?" },
    { id:"de", key:"4", word:"DETECT",   name:"Detect",   q:"Would we notice if something went wrong?" },
    { id:"rs", key:"5", word:"RESPOND",  name:"Respond",  q:"Do we know what to do when it does?" },
    { id:"rc", key:"6", word:"RECOVER",  name:"Recover",  q:"Can we get back to normal, and have we proved it?" }
  ];

  var CARDS = [
    { id:"inv", ans:["id"], answer:"Identify", short:"No inventory",
      txt:"No asset inventory existed",
      def:"An asset inventory is one list of everything a company runs: its computers, its systems and its programs.",
      reveal:"Identify asks: do we know what we have and where the risks are? Until you built an inventory in Project 1, nobody at Cumberland could list what it runs.",
      not:{
        gv:"Govern asks whether anyone owns security. This problem is about knowing what Cumberland has, not about who is in charge.",
        pr:"Protect asks whether the safeguards are in place. A list is not a safeguard. It tells you what needs one.",
        de:"Detect asks whether anyone would notice something going wrong. A list does not watch for anything.",
        rs:"Respond asks whether people know what to do once something goes wrong. This problem was there before anything went wrong.",
        rc:"Recover asks whether the company can get back to normal. This problem is about knowing what it has in the first place."
      } },
    { id:"mfa", ans:["pr"], answer:"Protect", short:"No MFA",
      txt:"Staff have no MFA",
      def:"MFA, short for multi-factor authentication, is a second check at login. On top of the password, you give a second proof that it is you, like a code sent to your phone.",
      reveal:"Protect asks: are the safeguards in place? A second proof at login is a safeguard. Administrators have to give one. Ordinary staff do not.",
      not:{
        gv:"Govern asks whether anyone owns security. A missing second check on staff logins is a missing safeguard, not a missing owner.",
        id:"Identify asks whether the company knows what it has and where the risks are. Cumberland already knows staff have no second check. What is missing is the check itself, and that is a safeguard.",
        de:"Detect asks whether anyone would notice something going wrong. A second check does not watch for anything.",
        rs:"Respond asks whether people know what to do once something goes wrong. A second check does its work before anything goes wrong.",
        rc:"Recover asks whether the company can get back to normal. A second check does its work before anything goes wrong, not after."
      } },
    { id:"av", ans:["de","rs"], answer:"Detect or Respond", short:"Antivirus outage",
      txt:"The antivirus outage that spread for days before anyone noticed",
      def:"Antivirus is software on each computer that guards it against harmful programs. An outage means it stopped working. Here it stopped on more and more computers over several days.",
      /* Ask Chaitanya to review: Respond reasoning wording
         ("Even once machines were losing antivirus, nobody traced it back
         to the cause for days, which is a Respond failure."). */
      reveal:"Detect asks: would we notice if something went wrong? Nobody noticed for days, which is a Detect failure. Respond asks: do we know what to do when it does? Even once machines were losing antivirus, nobody traced it back to the cause for days, which is a Respond failure.",
      /* Added after the reveal: `ok` for a Detect or Respond pick, `miss` otherwise. */
      ok:"Both are right. Write one line in your notes on why you picked yours.",
      miss:"Both answers are right.",
      not:{
        gv:"Govern asks whether anyone owns security. This problem is about nobody noticing for days, not about who is in charge of security.",
        id:"Identify asks whether the company knows what it has. This problem is about the days nobody noticed the antivirus had stopped working.",
        pr:"Protect asks whether the safeguards are in place. The antivirus was installed. This problem is about the days nobody noticed it had stopped working.",
        rc:"Recover asks whether the company can get back to normal afterwards. This problem is about the days before anyone noticed, not about getting back to normal."
      } }
  ];
  var FOOTER = "The three problems went under three different words. The third fits under two, and that is allowed.";
  var END_LINE = "Now go back to the module and keep reading.";

  var S = [
    { id:"sort", kind:"sort", label:"Place three problems", h1:"Which word do you think each problem belongs under?",
      sub:"Nobody has told you what these six words mean yet. Go with your gut.",
      h1done:"Here is where each problem goes." },
    { id:"answers", kind:"answers", cards:["inv","mfa"], label:"The first two", h1:"Where the first two problems go" },
    { id:"third", kind:"answers", cards:["av"], footer:true, label:"The third one", h1:"Where the third problem goes" }
  ];

  /* ---------------- state ----------------
     localStorage is wrapped: a blocked storage API must degrade silently. */
  var KEY = "vciso-p3-m6-six-words-three-problems-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { answers:{}, place:{} }; }
  function binOf(id){ for(var k=0;k<BINS.length;k++) if(BINS[k].id === id) return BINS[k]; return null; }
  function cardOf(id){ for(var k=0;k<CARDS.length;k++) if(CARDS[k].id === id) return CARDS[k]; return null; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var place = {};
      if(isPlain(raw.place)){
        CARDS.forEach(function(c){ if(binOf(raw.place[c.id])) place[c.id] = raw.place[c.id]; });
      }
      var answers = isPlain(raw.answers) ? raw.answers : {};
      /* A check only counts if every card is still placed. */
      if(answers.sort && Object.keys(place).length !== CARDS.length) answers = {};
      return { answers:answers, place:place };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  /* Inline SVG marks, Phosphor style: outline, stroke 1.7, #001D69 via currentColor. */
  var SVG_OPEN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">';
  var GLYPH = {
    ok: SVG_OPEN + '<polyline points="3.2,8.6 6.6,11.8 12.8,4.6"/></svg>',
    out: SVG_OPEN + '<path d="M4.6 4.6l6.8 6.8M11.4 4.6l-6.8 6.8"/></svg>'
  };
  function mark(kind){ return '<span class="gl' + (kind === "out" ? " x" : "") + '" aria-hidden="true">' + GLYPH[kind] + "</span>"; }

  /* Data validation, at load, loud. */
  (function validate(){
     var problems = [], ids = {}, cids = {};
     S.forEach(function(s, n){
       if(!s.id) problems.push("slide " + (n+1) + " has no id");
       if(ids[s.id]) problems.push('duplicate slide id "' + s.id + '"');
       ids[s.id] = 1;
     });
     CARDS.forEach(function(c){
       if(cids[c.id]) problems.push('duplicate card id "' + c.id + '"');
       cids[c.id] = 1;
       if(!c.ans || !c.ans.length) problems.push('card "' + c.id + '" has no answer');
       c.ans.forEach(function(a){ if(!binOf(a)) problems.push('card "' + c.id + '" names an unknown word "' + a + '"'); });
       if(!c.reveal || !c.def || !c.short) problems.push('card "' + c.id + '" is missing its reveal, gloss or short label');
       BINS.forEach(function(b){
         if(c.ans.indexOf(b.id) < 0 && !(c.not && c.not[b.id])) problems.push('card "' + c.id + '" has no reason for a wrong pick of "' + b.id + '"');
       });
     });
     if(problems.length){
       document.getElementById("board").innerHTML =
         '<div class="intro"><p><b>This deck has authoring errors and will not '
         + 'behave correctly:</b></p><ul style="font-size:13px;line-height:1.6;padding-left:18px">'
         + problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul></div>";
       throw new Error("deck data invalid: " + problems.join("; "));
     }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), sub:document.getElementById("sub"), board:document.getElementById("board"),
    back:document.getElementById("back"), chk:document.getElementById("chk"),
    next:document.getElementById("next"), again:document.getElementById("again"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;
  var sel = null;   /* the card currently picked up, if any */

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function attr(s){ return esc(s).replace(/"/g, "&quot;"); }
  function say(m){ el.live.textContent = m; }
  function checked(){ return !!st.answers.sort; }
  function placedCount(){ return CARDS.filter(function(c){ return st.place[c.id]; }).length; }
  function isRight(c){ return c.ans.indexOf(st.place[c.id]) >= 0; }
  function rightCount(){ return CARDS.filter(isRight).length; }

  var GATE_HINT = "Drag each problem under a word, or click a problem and then click a word. " +
    "Check unlocks once all three are placed.";
  /* Keyboard instructions live in screen-reader text only. */
  var KEY_HINT = "On a keyboard, press Enter on a problem to pick it up, then press 1 to 6 to put it under a word. Escape puts it down.";
  function setHint(html, keys){
    el.hint.innerHTML = "<span>" + html + "</span>" + (keys ? '<span class="sr">' + esc(KEY_HINT) + "</span>" : "");
  }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    el.back.disabled = (i === 0);
    el.again.disabled = !checked() && placedCount() === 0;

    /* Check shows only on the sort, only until it is pressed. It is
       enabled once all three problems are placed. No hints before Check. */
    el.chk.hidden = !(s.kind === "sort" && !checked());
    el.chk.disabled = placedCount() !== CARDS.length;

    /* No Continue on the last slide: a plain line sends the student back
       to the module instead. */
    el.next.hidden = (i === S.length-1);
    el.next.disabled = (i === S.length-1) || (s.kind === "sort" && !checked());
    if(i === S.length-1 && checked()) setHint('<span class="end">' + esc(END_LINE) + "</span>", false);

    if(checked() && s.kind === "answers"){
      el.chip.hidden = false;
      el.chip.textContent = rightCount() + " of " + CARDS.length + " right";
    } else { el.chip.hidden = true; el.chip.textContent = ""; }
  }

  function render(focusSel){
    var s = S[i];
    document.body.className = "t" + (i+1);
    var h = (s.h1done && checked()) ? s.h1done : s.h1;
    el.h1.textContent = h;
    el.frame.setAttribute("aria-label", h);
    var showSub = !!s.sub && !checked();
    el.sub.hidden = !showSub;
    el.sub.textContent = showSub ? s.sub : "";
    if(s.kind === "sort") renderSort(focusSel);
    else if(s.kind === "answers") renderAnswers();
    else {
      el.board.className = "board";
      el.board.innerHTML = '<div class="intro"><p><b>Unhandled slide kind "' + esc(String(s.kind)) + '".</b></p></div>';
    }
    header();
  }

  /* ---------------- slide 1: before Check ----------------
     The three cards stay in the left column with their glosses showing.
     Placing one sets a tag on the card and puts its short label under the
     word. The short label can be clicked or dragged too, to move it again. */
  function cardLabel(c){
    var p = st.place[c.id];
    var base = c.txt + ". ";
    if(sel === c.id) return base + "Picked up. Press 1 to 6 to put it under a word.";
    if(p) return base + "Under " + binOf(p).name + ". Press Enter to pick it up and move it.";
    return base + "Not placed yet. Press Enter to pick it up.";
  }

  function cardHTML(c){
    var p = st.place[c.id];
    var cls = "scard" + (sel === c.id ? " sel" : "") + (p ? " placed" : "");
    return '<div class="' + cls + '" role="button" data-c="' + c.id + '" tabindex="0" draggable="true"' +
      ' aria-pressed="' + (sel === c.id ? "true" : "false") + '"' +
      ' aria-label="' + attr(cardLabel(c)) + '">' +
      '<div class="sct" aria-hidden="true"><span class="ct">' + esc(c.txt) + "</span>" +
        '<span class="tag' + (p ? "" : " no") + '">' + (p ? "Under " + esc(binOf(p).name) : "Not placed") + "</span></div>" +
      '<span class="cd" aria-hidden="true">' + esc(c.def) + "</span></div>";
  }

  /* Mouse and touch only: the keyboard path is the card itself. */
  function chipHTML(c){
    return '<span class="pc' + (sel === c.id ? " sel" : "") + '" data-c="' + c.id + '" draggable="true" aria-hidden="true">' +
      esc(c.short) + "</span>";
  }

  /* ---------------- slide 1: after Check ----------------
     Every card moves under the word it belongs to, and every word shows
     the question it asks. Card 3 sits under both of its words. The copy
     the student chose carries "You put it here"; a wrong pick carries a
     cross and says where they put it, so no tick ever sits on a wrong pick. */
  function rcardHTML(c, zone, anim){
    var p = st.place[c.id], right = isRight(c);
    var primary = right ? p : c.ans[0];
    var cls = "rcard", status;
    if(zone === primary){
      if(right) status = mark("ok") + "<span>You put it here.</span>";
      else { cls += " miss"; status = mark("out") + "<span>You put it under " + esc(binOf(p).name) + ".</span>"; }
    } else {
      cls += " alt";
      status = "<span>Also right here.</span>";
    }
    return '<div class="' + cls + anim + '"><span class="ct">' + esc(c.txt) + '</span><span class="rs">' + status + "</span></div>";
  }

  function renderSort(focusSel){
    var done = checked();
    el.board.className = "board srt" + (done ? " done" : "");
    var anim = reduce ? "" : " in";
    var armed = sel && !done ? " armed" : "";

    var cards = done ? "" :
      '<div class="cards" role="group" aria-label="The three problems">' + CARDS.map(cardHTML).join("") + "</div>";

    var bins = '<div class="bins">' + BINS.map(function(b){
      var body;
      if(done){
        body = '<div class="bq' + anim + '">' + esc(b.q) + "</div>" +
          '<div class="bcards">' + CARDS.filter(function(c){ return c.ans.indexOf(b.id) >= 0; })
            .map(function(c){ return rcardHTML(c, b.id, anim); }).join("") + "</div>";
      } else {
        body = '<div class="chips">' + CARDS.filter(function(c){ return st.place[c.id] === b.id; }).map(chipHTML).join("") + "</div>";
      }
      var n = CARDS.filter(function(c){ return st.place[c.id] === b.id; }).length;
      return '<div class="bin' + (done ? " done" : armed) + '"' + (done ? "" : ' data-drop="' + b.id + '"') + '>' +
        '<button class="bh" type="button" data-bin="' + b.id + '"' + (done ? " disabled" : "") +
          ' aria-label="' + attr(done ? b.name + ". " + b.q
                                       : b.name + ". Holds " + n + (n === 1 ? " problem." : " problems.") + " Press to put the picked-up problem here.") + '">' +
          '<span class="bk" aria-hidden="true">' + b.key + "</span>" + esc(b.word) + "</button>" +
        body + "</div>";
    }).join("") + "</div>";

    el.board.innerHTML = cards + bins;
    if(!done) wireSort();
    setSortHint();
    if(focusSel){
      var f = el.board.querySelector(focusSel) || document.querySelector(focusSel);
      if(f && !f.disabled && !f.hidden){ try{ f.focus({preventScroll:true}); }catch(e){ f.focus(); } }
    }
  }

  function setSortHint(){
    if(checked()){
      if(rightCount() === CARDS.length) setHint("Each problem has moved to the word it belongs under. Continue to see why.", false);
      else setHint("Each problem has moved to the word it belongs under. " + mark("out") +
        '<span class="sr">A cross</span> means you put it somewhere else. Continue to see why.', false);
      return;
    }
    if(sel) setHint("<b>Picked up.</b> Now click the word you think it belongs under.", true);
    else if(placedCount() === CARDS.length) setHint("All three are placed. Move any you want, then press <b>Check</b>.", true);
    else setHint(esc(GATE_HINT), true);
  }

  function pick(id, fromChip){
    if(checked()) return;
    sel = (sel === id) ? null : id;
    renderSort(fromChip ? null : '.scard[data-c="' + id + '"]');
    say(sel ? "Picked up: " + cardOf(id).txt + ". " + cardOf(id).def + " Press 1 to 6 to put it under a word."
            : "Put down.");
  }

  function place(id, zone){
    if(checked() || !cardOf(id) || !binOf(zone)) return;
    st.place[id] = zone;
    save(st);
    sel = null;
    header();
    var nextCard = CARDS.filter(function(c){ return !st.place[c.id]; })[0];
    renderSort(nextCard ? '.scard[data-c="' + nextCard.id + '"]' : "#chk");
    say(cardOf(id).txt + ": under " + binOf(zone).name + "." +
      (placedCount() === CARDS.length ? " All three placed. You can press Check." : ""));
  }

  function wireSort(){
    Array.prototype.forEach.call(el.board.querySelectorAll(".scard,.pc"), function(card){
      var id = card.dataset.c;
      var isChip = card.classList.contains("pc");
      card.addEventListener("click", function(e){ e.stopPropagation(); pick(id, isChip); });
      if(!isChip) card.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(id); }
      });
      card.addEventListener("dragstart", function(e){
        sel = id;
        try{ e.dataTransfer.setData("text/plain", id); e.dataTransfer.effectAllowed = "move"; }catch(x){}
        card.classList.add("drag");
      });
      /* A drag dropped outside every word must not leave the card
         secretly picked up, or the next click on a word would move it. */
      card.addEventListener("dragend", function(){
        card.classList.remove("drag");
        if(sel === id){ sel = null; setSortHint(); }
        Array.prototype.forEach.call(el.board.querySelectorAll(".over"), function(z){ z.classList.remove("over"); });
      });
    });
    Array.prototype.forEach.call(el.board.querySelectorAll("[data-drop]"), function(z){
      var zone = z.dataset.drop;
      z.addEventListener("dragover", function(e){ e.preventDefault(); z.classList.add("over"); });
      z.addEventListener("dragleave", function(e){ if(!z.contains(e.relatedTarget)) z.classList.remove("over"); });
      z.addEventListener("drop", function(e){
        e.preventDefault();
        var id = "";
        try{ id = e.dataTransfer.getData("text/plain"); }catch(x){}
        place(id || sel, zone);
      });
      z.addEventListener("click", function(){
        if(sel) place(sel, zone);
        else setHint("<b>Pick up a problem first.</b> Click a problem, then click this word.", true);
      });
    });
  }

  function checkSort(){
    if(placedCount() !== CARDS.length) return;
    st.answers.sort = rightCount() === CARDS.length ? "right" : "shown";
    sel = null;
    save(st);
    render();
    el.next.focus();
    say("Checked. " + rightCount() + " of " + CARDS.length + " in the right place. " +
      "Each problem has moved to the word it belongs under. " +
      (rightCount() === CARDS.length ? "" : "A cross means you put it somewhere else. ") + "Continue to see why.");
  }
  el.chk.addEventListener("click", checkSort);

  /* ---------------- slide 2: why each one goes where it does ---------------- */
  function acardHTML(c, anim){
    var p = st.place[c.id], right = isRight(c);
    var status = right
      ? "<b>You put it under " + esc(binOf(p).name) + ". Right.</b>"
      : "<b>You put it under " + esc(binOf(p).name) + ".</b> " + esc(c.not[p]);
    return '<div class="acard' + (right ? "" : " miss") + anim + '">' +
      '<div class="an">' + mark(right ? "ok" : "out") +
      "<span>" + esc(c.txt) + "</span></div>" +
      '<span class="aw">It goes under: ' + esc(c.answer) + "</span>" +
      '<div class="ar">' + status + "</div>" +
      '<div class="ar">' + esc(c.reveal) + (c.ok ? " " + esc(right ? c.ok : c.miss) : "") + "</div></div>";
  }

  function renderAnswers(){
    if(!checked()){
      el.board.className = "board";
      el.board.innerHTML = '<div class="intro"><p>Place the three problems first. Where each one goes appears here once you press <b>Check</b>.</p>' +
        '<button class="jump" type="button" id="tosort">Go to the six words</button></div>';
      el.board.querySelector("#tosort").addEventListener("click", function(){ i = 0; render(); toTop(); });
      el.hint.textContent = "";
      return;
    }
    var anim = reduce ? "" : " in";
    var s = S[i];
    el.board.className = "board ans" + (s.cards.length === 1 ? " one" : "");
    el.board.innerHTML = s.cards.map(function(id, k){
      var last = k === s.cards.length - 1;
      return '<div class="col">' + acardHTML(cardOf(id), anim) +
        (last && s.footer ? '<div class="tbox' + anim + '"><p>' + esc(FOOTER) + "</p></div>" : "") + "</div>";
    }).join("");
    el.hint.textContent = "";
  }

  /* ---------------- navigation ---------------- */
  function toTop(){
    try{ el.frame.focus({preventScroll:true}); }catch(e){ el.frame.focus(); }
    try{ window.scrollTo(0, 0); }catch(e){}
  }
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    if(d > 0 && el.next.disabled) return;
    sel = null; i = n; render(); toTop();
    say("Slide " + (i+1) + " of " + S.length + ". " + el.h1.textContent +
      (i === S.length-1 && checked() ? " " + END_LINE : ""));
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });
  el.again.addEventListener("click", function(){
    st = fresh(); save(st); sel = null; i = 0; render(); toTop();
    say("Started again. None of the three problems is placed.");
  });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return true;
    var r = node.getAttribute && node.getAttribute("role");
    return r === "slider" || r === "textbox" || r === "spinbutton" || r === "listbox";
  }

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(S[i].kind !== "sort" || checked() || !sel) return;
    var b = null; BINS.forEach(function(x){ if(x.key === e.key) b = x; });
    if(b){ e.preventDefault(); place(sel, b.id); return; }
    if(e.key === "Escape"){ var was = sel; sel = null; renderSort('.scard[data-c="' + was + '"]'); say("Put down."); }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    if(ownsKeys(e.target)){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ----------------
     measure-fit.mjs steps through the deck with this. Keep it on every deck. */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      sel = null; i = n; render(); return true;
    },
    slides:S.length,
    place:function(id, zone){ place(id, zone); return st.place[id] === zone; },
    check:function(){ checkSort(); return checked(); },
    reset:function(){ st = fresh(); save(st); sel = null; i = 0; render(); },
    state:function(){ return { i:i, sel:sel, answers:st.answers, place:st.place }; }
  };
})();
</script>
</body>
</html>
