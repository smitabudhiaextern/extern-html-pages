<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    /* right and wrong states only, always paired with an icon and a word */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-reveal:460ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;

  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto;background:var(--bg)}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* header */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin-bottom:6px;min-height:28px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .dots{display:flex;gap:7px;align-items:center}
  .dots i{display:block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--on-highlight);background:transparent}
  .dots i.on{background:var(--on-highlight)}
  .dots i.here{background:var(--on-highlight);width:12px;height:12px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--on-highlight)}

  h1{font-size:25px;line-height:1.22;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
  .lead{font-size:16px;line-height:1.48;color:var(--body);max-width:84ch}
  .lead b{color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- slides 1 and 2: three functions each ---------- */
  .fns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
  .fn{min-width:0;background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:12px;
    padding:12px 14px 13px;display:flex;flex-direction:column;gap:8px}
  .fn.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .fn.d2{animation-delay:.12s}.fn.d3{animation-delay:.24s}
  .fh2{display:flex;align-items:center;gap:10px}
  .fi{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--highlight);border:1.5px solid var(--on-highlight);
    display:flex;align-items:center;justify-content:center;color:var(--on-highlight)}
  .fi svg.ic{width:22px;height:22px}
  .fname{font-size:21px;font-weight:700;color:var(--title);line-height:1.15}
  .fline{font-size:17px;line-height:1.38;font-weight:600;color:var(--title)}
  .fsub{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:7px}
  .fk{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--on-highlight)}
  .fv{font-size:14.5px;line-height:1.4;color:var(--body)}

  .pk svg.ic{width:18px;height:18px}
  .pt{font-size:20px;line-height:1.3;font-weight:700;color:var(--title)}
  .pd{font-size:14.5px;line-height:1.42;color:var(--body)}

  .opts{grid-area:opts;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto;gap:9px}
  button.opt{font-family:inherit;text-align:left;color:var(--title);min-width:0;width:100%;
    background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;
    padding:8px 11px;cursor:pointer;display:flex;gap:10px;align-items:center;min-height:68px;

  button.opt .lr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
  button.opt .ol{font-size:16.5px;font-weight:700;line-height:1.2;color:var(--title)}
  button.opt .om{font-size:13.5px;line-height:1.3;color:var(--body)}
  button.opt .tg{flex:0 0 auto;font-size:13px;font-weight:700;white-space:nowrap}

  button.opt:disabled{cursor:default}
  button.opt.idle:disabled{border-style:dashed;border-color:var(--line)}

  button.opt.ok .tg{color:var(--ok)}
  button.opt.no{background:var(--no-tint);border:2px solid var(--no)}

  .close p{font-size:20px;line-height:1.42;font-weight:600;color:var(--title)}
  .mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .mf{min-width:0;display:flex;align-items:center;gap:10px;background:var(--highlight);border-radius:10px;padding:9px 12px}
  .mf .fi{width:34px;height:34px;background:var(--bg)}

  .mf .mt{display:flex;flex-direction:column;gap:1px;min-width:0}
  .mf b{font-size:16px;color:var(--title)}
  .mf span.ms{font-size:13.5px;line-height:1.3;color:var(--body)}

  /* the bar */

  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.36;color:var(--body)}

    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .board{flex:0 0 auto}
    .fns{grid-template-columns:1fr;gap:12px}
    .fv{font-size:15.5px}
    .q{display:flex;flex-direction:column;gap:14px}
    .pd{font-size:16px}

    .fb .ft{font-size:15.5px}

    .close p{font-size:18px}
    .mini{grid-template-columns:1fr}
    .mf span.ms{font-size:15px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{font-size:15px;flex:1 1 100%;margin-top:4px}
    #hint .kb{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }

    <h2>Six words, three problems</h2>
    <h3>The six functions</h3>
    <p>NIST CSF 2.0 splits all of security into six areas, called functions. We are going to explain each one in everyday words, and compare it to keeping a house safe.</p>
    <ul>
      <li><strong>Govern: deciding who is in charge of security, and setting the rules everyone follows.</strong> It asks: does anyone actually own security here? At home, it is like your family agreeing who locks up at night, and what the house rules are.</li>
      <li><strong>Identify: knowing what you have, and which parts matter most.</strong> It asks: do we know what we have and where the risks are? At home, it is like making a list of everything in your house, and knowing which things you could never replace.</li>
      <li><strong>Protect: putting safeguards in place to keep things safe.</strong> It asks: are the safeguards in place? At home, it is like locking the doors and windows.</li>
      <li><strong>Detect: noticing when something goes wrong.</strong> It asks: would we notice if something went wrong? At home, it is like a smoke alarm that beeps when there is smoke.</li>
      <li><strong>Respond: acting when it happens, to stop it and limit the damage.</strong> It asks: do we know what to do when it does? At home, it is like getting everyone out and calling the fire department.</li>
      <li><strong>Recover: getting back to normal afterwards.</strong> It asks: can we get back to normal, and have we proved it? At home, it is like repairing the damage and moving back in.</li>
    </ul>
    <h3>Three problems you found at Cumberland</h3>
    <p>For each problem, pick the function you think it belongs to in your head, then open the answer.</p>
    <p><strong>Problem 1: No asset inventory existed.</strong> An asset inventory is one list of everything a company runs: its computers, its systems and its programs.</p>
    <details>
      <summary>Which function does it belong to?</summary>
      <p><strong>Identify.</strong> Identify is about knowing what you have. Until you built an inventory in Project 1, nobody at Cumberland could list what it runs.</p>
    </details>
    <p><strong>Problem 2: Staff have no MFA.</strong> MFA, short for multi-factor authentication, is a second check at login. On top of the password, you give a second proof that it is you, like a code sent to your phone.</p>
    <details>
      <summary>Which function does it belong to?</summary>
      <p><strong>Protect.</strong> Protect is about safeguards. A second check at login is a safeguard. The people who run Cumberland's systems, called administrators, have to give one. Ordinary staff do not.</p>
    </details>
    <p><strong>Problem 3: The antivirus outage that spread for days before anyone noticed.</strong> Antivirus is software on each computer that guards it against harmful programs. An outage means it stopped working. Here it stopped on more and more computers over several days.</p>
    <details>
      <summary>Which function does it belong to?</summary>
      <p><strong>Detect or Respond. Both are right, because you can defend either one.</strong> Nobody noticed for days, which is a Detect failure. There was also no plan in place to act on it, which is a Respond failure.</p>
    </details>
    <div class="box"><p><strong>Each of the six functions is one area of security, and you will score Cumberland on all six.</strong></p></div>
  </div>

      right:"Protect is about safeguards. A second check at login is a safeguard. The people who run Cumberland's systems, called administrators, have to give one. Ordinary staff do not.",
      hints:{
        gv:"Govern is about who is in charge and the rules. A missing second check at login is not about who is in charge. Try again.",
        id:"Identify is about knowing what you have. Cumberland already knows its staff have no second check. The problem is that the check itself is missing. Try again.",
        de:"Detect is about noticing when something goes wrong. A second check at login does not watch for anything. It stops the wrong person getting in. Try again.",
        rs:"Respond is about acting once something goes wrong. A second check does its work before anything goes wrong. Try again.",
        rc:"Recover is about getting back to normal afterwards. A second check does its work before anything goes wrong, not after. Try again."
      } },
    { id:"av", ord:"The third problem you found", txt:"The antivirus outage that spread for days before anyone noticed",
      def:"Antivirus is software on each computer that guards it against harmful programs. An outage means it stopped working. Here it stopped on more and more computers over several days.",
      ans:["de","rs"],
      right:"Detect and Respond are both right here, because you can defend either one. Nobody noticed for days, which is a Detect failure. There was also no plan in place to act on it, which is a Respond failure.",
      hints:{
        gv:"Govern is about who is in charge and the rules. This problem is about the days that went by before anyone noticed. Try again.",
        id:"Identify is about knowing what you have. This problem is about the days nobody noticed the antivirus had stopped working. Try again.",
        pr:"Protect is about safeguards. The antivirus was already installed. This problem is about the days nobody noticed it had stopped working. Try again.",
        rc:"Recover is about getting back to normal afterwards. This problem is about the days before anyone noticed or acted. Try again."
      } }
  ];
  var CLOSE_LINE = "Each of the six functions is one area of security, and you will score Cumberland on all six.";

  function fOf(id){ for(var k=0;k<F.length;k++) if(F[k].id === id) return F[k]; return null; }

  /* data validation, at load, loud */
  (function validate(){
    var p = [];
    if(F.length !== 6) p.push("there must be six functions");
    P.forEach(function(x){
      x.ans.forEach(function(a){ if(!fOf(a)) p.push(x.id + " names an unknown function " + a); });
      F.forEach(function(f){ if(x.ans.indexOf(f.id) < 0 && !x.hints[f.id]) p.push(x.id + " has no hint for " + f.id); });
      if(!x.right) p.push(x.id + " has no reason");
    });
    if(p.length){
      document.getElementById("board").innerHTML = '<p class="lead"><b>This interactive has authoring errors:</b> ' + p.join("; ") + "</p>";
      throw new Error("data invalid: " + p.join("; "));
    }
  })();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function fresh(){ return P.map(function(){ return { out:{}, last:null, done:null, pick:null }; }); }
  var A = fresh();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), h1:document.getElementById("h1"),
    board:document.getElementById("board"), back:document.getElementById("back"),
    next:document.getElementById("next"), again:document.getElementById("again"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function say(m){ el.live.textContent = ""; setTimeout(function(){ el.live.textContent = m; }, 30); }
  function phone(){ return window.matchMedia("(max-width:599px)").matches; }

  /* ---------- slides 1 and 2 ---------- */
  function fnCard(f, n){
    var anim = reduce ? "" : " in d" + (n+1);
    return '<div class="fn' + anim + '" role="listitem">'
      + '<div class="fh2"><span class="fi">' + icon(f.ic) + '</span><span class="fname">' + esc(f.name) + "</span></div>"
      + '<p class="fline">' + esc(f.line) + "</p>"
      + '<div class="fsub"><span class="fk">The question it asks</span><span class="fv">' + esc(f.q) + "</span></div>"
      + '<div class="fsub"><span class="fk">At home</span><span class="fv">' + esc(f.home) + "</span></div>"
      + "</div>";
  }
  function sFns(from, lead){
    return function(){
      return '<p class="lead">' + lead + "</p>"
        + '<div class="fns" role="list" aria-label="Functions">' + F.slice(from, from+3).map(fnCard).join("") + "</div>";
    };
  }

  /* ---------- slides 3 to 5 ---------- */
  function optHTML(f, cls, ico, tag, disabled){
    return '<button class="opt' + (cls ? " " + cls : "") + '" type="button" data-f="' + f.id + '"'
      + (disabled ? ' disabled aria-disabled="true"' : "")
      + ' aria-label="' + esc(f.name + ". " + f.short + "." + (tag ? " " + tag + "." : "")) + '">'
      + '<span class="g" aria-hidden="true">' + icon(ico || f.ic) + "</span>"
      + '<span class="txt" aria-hidden="true"><span class="lr"><span class="ol">' + esc(f.name) + "</span>"
      + (tag ? '<span class="tg">' + esc(tag) + "</span>" : "") + "</span>"
      + '<span class="om">' + esc(f.short) + "</span></span></button>";
  }
  function optsHTML(n){
    var p = P[n], a = A[n];
    return '<div class="opts" role="group" aria-label="The six functions">' + F.map(function(f){
      var isAns = p.ans.indexOf(f.id) >= 0;
      if(a.done && isAns){
        var tag;
        if(a.done === "right") tag = (f.id === a.pick) ? "Right" : "Also right";
        else tag = "Right answer";
        return optHTML(f, "ok", "check", tag, true);
      }
      if(a.out[f.id]) return optHTML(f, "no", "x", "Not quite", true);
      if(a.done) return optHTML(f, "idle", "", "", true);
      return optHTML(f, "", "", "", false);
    }).join("") + "</div>";
  }
  function fbHTML(good, head, text){
    return '<div class="fb ' + (good ? "ok" : "no") + '" id="fb" tabindex="-1">'
      + '<span class="fh">' + icon(good ? "okc" : "noc") + esc(head) + "</span>"
      + '<p class="ft">' + esc(text) + "</p></div>";
  }
  function feedback(n){
    var p = P[n], a = A[n];
    if(a.done === "right") return fbHTML(true, "Right", p.right);
    if(a.done === "shown") return fbHTML(true, "Here is the right answer", p.right);
    if(a.last) return fbHTML(false, "Not quite", p.hints[a.last]);
    return "";
  }
  function sProb(n){
    return function(){
      var p = P[n];
      return '<div class="q">'
        + '<div class="pcard"><span class="pk">' + icon("flag") + esc(p.ord) + "</span>"
        +   '<p class="pt">' + esc(p.txt) + "</p>"
        +   '<p class="pd">' + esc(p.def) + "</p></div>"
        + optsHTML(n)
        + '<div class="fbwrap">' + feedback(n) + "</div>"
        + "</div>";
    };
  }
  function pick(fid){
    var s = S[i];
    if(s.prob === undefined) return;
    var n = s.prob, p = P[n], a = A[n];
    if(a.done || a.out[fid] || !fOf(fid)) return;
    if(p.ans.indexOf(fid) >= 0){ a.done = "right"; a.pick = fid; }
    else {
      a.out[fid] = 1; a.last = fid;
      if(Object.keys(a.out).length >= 2) a.done = "shown";
    }
    render();
    var fb = el.board.querySelector("#fb");
    if(fb && !reduce){ fb.classList.remove("in"); void fb.offsetWidth; fb.classList.add("in"); }
    if(fb) say(fb.textContent.replace(/^(Right|Not quite|Here is the right answer)/, "$1. "));
    var ph = phone(), opt = ph ? { preventScroll:true } : undefined;
    if(a.done) el.next.focus(opt);
    else { var f = el.board.querySelector(".opts button.opt:not(:disabled)"); if(f) f.focus(opt); }
    if(fb && ph) fb.scrollIntoView({ block:"nearest", behavior: reduce ? "auto" : "smooth" });
  }

  /* ---------- slide 6 ---------- */
  function sClose(){
    return '<div class="close">' + icon("six") + "<p>" + esc(CLOSE_LINE) + "</p></div>"
      + '<div class="mini" role="list" aria-label="The six functions">' + F.map(function(f){
          return '<div class="mf" role="listitem"><span class="fi">' + icon(f.ic) + '</span><span class="mt"><b>' + esc(f.name) + '</b><span class="ms">' + esc(f.short) + "</span></span></div>";
        }).join("") + "</div>";
  }

  var S = [
    { label:"Functions 1 to 3", h1:"NIST CSF 2.0 splits security into six functions",
      r:sFns(0, "We are going to explain the six functions three at a time, in everyday words. To make each one easy to picture, we will compare it to keeping a house safe. Here are the first three.") },
    { label:"Functions 4 to 6", h1:"Here are the last three functions",
      r:sFns(3, "These three are about the moment something goes wrong, and what happens after it. Picture a fire in that same house.") },
    { label:"Problem 1", h1:"Which function do you think this problem belongs to?", r:sProb(0), prob:0 },
    { label:"Problem 2", h1:"Which function do you think this problem belongs to?", r:sProb(1), prob:1 },
    { label:"Problem 3", h1:"Which function do you think this problem belongs to?", r:sProb(2), prob:2 },
    { label:"Wrap up", h1:"You have placed all three problems", r:sClose }
  ];
  var i = 0;

  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k === i ? "here" : k < i ? "on" : "") + "'></i>";
    el.segs.innerHTML = h;
    el.back.disabled = (i === 0);
    el.next.hidden = false; el.next.disabled = false; el.again.hidden = true;
    el.next.textContent = "Next";
    el.hint.textContent = "";
    if(s.prob !== undefined){
      var a = A[s.prob];
      if(a.done){
        el.hint.textContent = (i === S.length - 2) ? "Press Next for the last slide." : "Press Next for the next problem.";
      } else {
        el.next.disabled = true;
        el.hint.innerHTML = (Object.keys(a.out).length ? "Pick another function." : "Pick the function you think fits.")
          + '<span class="kb"> You can also press 1 to 6.</span>';
      }
    } else if(i === S.length - 1){
      el.next.hidden = true;
      el.again.hidden = false;
      el.hint.textContent = "You are done here. Go back to the module and keep reading.";
    } else {
      el.hint.innerHTML = '<span class="kb">Use the arrow keys or the buttons to move between slides.</span>';
    }
  }

  function render(){
    var s = S[i];
    el.h1.textContent = s.h1;
    el.board.innerHTML = s.r();
    Array.prototype.forEach.call(el.board.querySelectorAll(".opts button.opt:not(:disabled)"), function(b){
      b.addEventListener("click", function(){ pick(b.dataset.f); });
    });
    el.frame.setAttribute("aria-label", s.h1);
    header();
  }

  function focusTop(){
    var ph = phone();
    el.frame.focus(ph ? { preventScroll:true } : undefined);
    if(ph) window.scrollTo(0, 0);
  }
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    if(d > 0 && (el.next.disabled || el.next.hidden)) return;
    i = n; render(); focusTop();
    var s = S[i];
    say(el.prog.textContent + ". " + s.h1 + (s.prob !== undefined ? " " + P[s.prob].txt + "." : ""));
  }
  function resetAll(){ A = fresh(); i = 0; render(); }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });
  el.again.addEventListener("click", function(){ resetAll(); focusTop(); say("Cleared. Back to the start."); });

  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(S[i].prob !== undefined && /^[1-6]$/.test(e.key)){
      e.preventDefault(); pick(F[+e.key - 1].id);
    }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* scale the fixed canvas down to fit, never up */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()) stage.style.transform = "";
    else {
      var sc = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
      stage.style.transform = "scale(" + sc + ")";
    }
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* the QA hook */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    pick:function(fid){ pick(fid); return A[S[i].prob]; },
    reset:function(){ resetAll(); },
    state:function(){ return { i:i, answers:A }; }
  };
})();
</script>
</body>
</html>
