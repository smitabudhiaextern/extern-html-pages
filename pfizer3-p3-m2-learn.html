<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Libraries Read Documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Card player copied from pfizer3-p1-m1-learn:
   a rail with "Card X of N" on top, one card at a time, Back and Next below.
   P3 module 2 Learn cards: "Know How Python Libraries Turn Documents into AI-Ready Data" (6 cards).
   Fixed stage: laid out once on a 760 x 820 design stage (set the Notion embed height to 820 px), then scaled as one piece
   to fit the embed frame and centred. Nothing scrolls, and Back and Next never move.
   Page images: the sample supplier file rendered with PyMuPDF at 300 dpi, shown as it is with nothing blurred
   (Smita, 10 Nov 2026: the documents are shareable). Card 3 loads pfizer3-p3-m2-learn-page2.jpg from this folder.
   Word boxes on card 4 are the real output of page.get_text("words") on page 2. The ID card on card 5 is made up. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600); --icon:var(--extern-black); --connector:var(--extern-black);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --space-1:4px; --space-2:8px; --space-3:14px; --space-4:18px; --space-5:26px; --space-6:40px; --space-7:56px;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage-w:760px; --stage-h:820px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* The design stage. JavaScript sets the scale and position; until it runs, the stage sits at full size. */
.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}
.pg-label{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-muted);white-space:nowrap}
.pg-label::after{content:attr(data-text);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:600}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:22px 28px;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.inner{display:flex;flex-direction:column;gap:16px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:2px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:16px;line-height:1.6;color:var(--ink-muted);text-wrap:pretty;max-width:68ch}
.p b{font-weight:600;color:var(--ink)}
.p code,.tbl code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.ask{margin:0;font-family:var(--font-serif);font-weight:400;font-size:24px;line-height:1.25;color:var(--ink);text-wrap:balance}

/* Tiles on surface-card */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{background:var(--surface-card);border-radius:var(--radius-md);padding:18px 20px;min-width:0}
.tile h3{margin:0;font-size:18px;line-height:1.3;font-weight:600;color:var(--card-title)}
.tile p{margin:4px 0 0;font-size:15px;line-height:1.5;color:var(--card-text)}
.tile .num{display:block;margin-bottom:6px;font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.tile b{font-weight:600;color:var(--card-title)}
.tile .mono{font-family:var(--font-mono);font-size:14px;color:var(--ink);white-space:nowrap}

.fact{border:1.5px solid var(--ink);border-radius:var(--radius-md);padding:16px 20px}
.fact .num{display:block;margin-bottom:4px;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.fact p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-muted)}
.fact b{font-weight:600;color:var(--ink)}

/* Picture beside text */
.cols{display:grid;grid-template-columns:370px minmax(0,1fr);gap:var(--space-5);align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.shot{margin:0;display:flex;flex-direction:column;gap:6px}
.shot .frame{background:var(--surface-icon);border:1px solid var(--line);border-radius:var(--radius-xs);overflow:hidden;line-height:0}
.shot img,.shot svg{display:block;width:100%;height:auto}
.cap{font-size:13px;line-height:1.4;color:var(--gray-600)}
.tag{align-self:flex-start;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:var(--radius-xs);border:1px solid var(--ink);color:var(--ink);background:var(--surface-icon)}

/* Card 4: crop with boxes, then the numbers */
.boxrow{display:grid;grid-template-columns:400px minmax(0,1fr);gap:var(--space-4);align-items:center}
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-icon)}
.tbl table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.4}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--card-text)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.w{font-family:var(--font-mono);color:var(--ink);white-space:nowrap}
.tbl td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.lib{font-weight:600;color:var(--ink);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;line-height:1.3;color:var(--gray-600)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:10px;border-radius:2px}
.legend .k{border:2px solid var(--pfizer-blue)}
.legend .o{border:1.5px solid var(--blue-200)}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="How Python libraries turn documents into data: six cards">
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where"><span id="where-count">Card 1 of 6</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Card"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-next" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

        '<text x="146" y="74" font-size="10" font-weight="600" letter-spacing="1" fill="var(--gray-600)">NAME</text>' +
        '<text class="bx" x="146" y="100" font-size="17" font-weight="600" fill="var(--extern-black)">Sam Rivera</text>' +
        '<text x="146" y="130" font-size="10" font-weight="600" letter-spacing="1" fill="var(--gray-600)">DATE OF BIRTH</text>' +
        '<text class="bx" x="146" y="152" font-size="15" fill="var(--extern-black)">14 MAR 2008</text>' +
        '<text x="276" y="130" font-size="10" font-weight="600" letter-spacing="1" fill="var(--gray-600)">EXPIRES</text>' +
        '<text class="bx" x="276" y="152" font-size="15" fill="var(--extern-black)">14 MAR 2030</text>' +
        '<text x="146" y="182" font-size="10" font-weight="600" letter-spacing="1" fill="var(--gray-600)">ID NUMBER</text>' +
        '<text class="bx" x="146" y="204" font-size="15" fill="var(--extern-black)">4821 0937</text>' +
      '</g><g id="idboxes"></g>' +
    '</svg>';
  function boxIdCard() {
    var svg = document.getElementById("idcard"); if (!svg) return;
    var g = svg.querySelector("#idboxes"); var out = "";
    Array.prototype.forEach.call(svg.querySelectorAll("text"), function (t) {
      if (t.textContent.indexOf("Made up") === 0) return;
      var b = t.getBBox();
      var light = t.classList.contains("bx-light");
      out += '<rect x="' + (b.x - 3) + '" y="' + (b.y - 2) + '" width="' + (b.width + 6) + '" height="' + (b.height + 4) + '" rx="2" fill="none" stroke="' +
        (light ? 'var(--blue-200)' : 'var(--pfizer-blue)') + '" stroke-width="' + (t.classList.contains("bx") ? 2 : 1.5) + '"/>';
    });
    g.innerHTML = out;
  }

  var CARDS = [
    { label: "Extract", eyebrow: "Where this project starts",
      html: '<h2 class="title"><span class="hl">Pulling</span> the Details Out of a Raw File</h2>' +
        '<p class="p">When a file arrives from a supplier, it comes as a <b>raw file</b>: a document just as it arrived, before anyone typed its details into a table.</p>' +
        '<p class="p">In this project, you\'ll write Python that opens a raw file and pulls out, or <b>extracts</b>, the details you need, like its dates.</p>' +
        '<p class="p">On the next cards, you\'ll see why that\'s harder than it sounds, and meet the tools that make it possible.</p>' },

    { label: "Unstructured", eyebrow: "The challenge",
      html: '<h2 class="title">Why Supplier Files Are Hard for a Computer</h2>' +
        '<p class="p">You already know what\'s in a supplier file: certificates, a letter, lot numbers and dates. You can read it in minutes. A computer struggles, because the file is <b>unstructured data</b>. That means its information isn\'t arranged in neat rows and columns like a spreadsheet, so nothing tells the computer which piece is which.</p>' +
        '<div class="tiles three">' +
          '<div class="tile"><h3>Tables</h3><p>Some details sit in a grid of rows and columns. Others sit in plain sentences.</p></div>' +
          '<div class="tile"><h3>Mixed Layouts</h3><p>Each page puts its labels and dates in a different place.</p></div>' +
          '<div class="tile"><h3>Different Date Formats</h3><p>One page says <span class="mono">3 June, 2022</span>. The next says <span class="mono">20210126</span>.</p></div>' +
        '</div>' +
        '<div class="fact"><span class="num">WHAT A PDF REALLY STORES</span><p>A PDF stores letters and <b>where to draw them</b> on the page. It never stores "this is the expiration date". Working that out is your program\'s job.</p></div>' +
        '<p class="p">We call these supplier files <b>SDFs (Supporting Documentation Files)</b>.</p>' },

    { label: "Real Page", eyebrow: "A real page",
      html: '<h2 class="title">A Real Page Gives a Computer No Hints</h2>' +
        '<div class="cols">' +
          '<figure class="shot"><div class="frame"><img src="' + PAGE2 + '" width="370" height="479" alt="Page 2 of the supplier file, a Certificate of Quality. Near the top: Lot Number, Date of Manufacture and Expiration Date, then a Product Release Criteria section, a short table and a Regulatory Conformance section."></div>' +
          '<figcaption class="cap">Page 2 of the supplier file.</figcaption></figure>' +
          '<div class="stack">' +
            '<p class="p">This is page 2 of the supplier file you opened in Project 1, a <b>Certificate of Quality</b>.</p>' +
            '<p class="ask">If someone handed you this page, where would you begin?</p>' +
            '<p class="p">You\'d probably look for a label you know, like <b>Expiration Date:</b>, then read the number right after it. Your eyes use <b>position</b>: the date sits right next to its label.</p>' +
            '<p class="p">A computer can only do the same if it knows where every word sits on the page. The next card shows how it finds out.</p>' +
          '</div>' +
        '</div>' },

    { label: "Bounding Box", eyebrow: "The key idea",
      html: '<h2 class="title">A Bounding Box Shows Where Each Word Sits</h2>' +
        '<p class="p">A <b>bounding box</b> is an invisible rectangle around a word. Four numbers describe it: how far its left, top, right and bottom edges are from the top-left corner of the page. They\'re measured in <b>points</b>, and a point is 1/72 of an inch.</p>' +
        '<div class="boxrow">' +
          '<figure class="shot"><div class="frame">' + cropFigure() + '</div>' +
          '<div class="legend"><span><i class="k"></i>The words we\'re reading</span><span><i class="o"></i>Every other word</span></div></figure>' +
          '<p class="cap">These are real boxes from page 2. We got them with <b>PyMuPDF</b>, a Python tool you\'ll meet on the last card. It returns one box per word, so "Expiration Date:" comes back as two words.</p>' +
        '</div>' +
        '<div class="tbl" role="region" aria-label="The real box numbers for the three words"><table>' +
          '<thead><tr><th scope="col">Word</th><th scope="col">Left</th><th scope="col">Top</th><th scope="col">Right</th><th scope="col">Bottom</th></tr></thead>' +
          '<tbody>' + keyRows() + '</tbody></table></div>' +
        '<p class="p">All three words have the same top (153.7) and bottom (165.9), so they sit on the <b>same line</b>. The date starts at 125.4, just after "Date:" ends at 120.8. So a program can find the label, then take the word right beside it. That\'s how the box links the label to its date.</p>' },

    { label: "Everyday", eyebrow: "Boxes in everyday life",
      html: '<h2 class="title">Bounding Boxes Help Apps Read Everyday Cards</h2>' +
        '<p class="p">You\'ve probably seen bounding boxes at work without noticing. When a phone app scans a photo ID card, it draws a box around each piece of text. Then it uses where each box sits to work out what each piece means.</p>' +
        '<div class="cols" style="grid-template-columns:400px minmax(0,1fr)">' +
          '<figure class="shot"><div class="frame" style="border:0;background:none">' + IDCARD + '</div></figure>' +
          '<div class="stack">' +
            '<p class="p">Each dark blue box marks one piece of text the app found, even the small labels.</p>' +
            '<p class="p">The date 14 MAR 2008 sits right under the label "Date of Birth", so the app knows it\'s the birth date, not the expiry date.</p>' +
            '<p class="p">Banking apps do the same when you photograph a check: boxes help them find the amount and the signature.</p>' +
          '</div>' +
        '</div>' +
        '<p class="p">Your supplier file works the same way, with labels and dates instead of a name and a photo.</p>' },

    { label: "Libraries", eyebrow: "The tools",
      html: '<h2 class="title">Three Python Tools That Read PDFs</h2>' +
        '<p class="p">A <b>Python library</b> is a set of ready-made code that someone else wrote and shared for free. You add it to your program with one line, so you don\'t have to write everything yourself. Think of it as a toolbox. Three libraries are popular for reading PDFs:</p>' +
        '<div class="tbl" role="region" aria-label="Three Python libraries that read PDFs"><table>' +
          '<thead><tr><th scope="col">Library</th><th scope="col">Pulls out text</th><th scope="col">Gives word positions (bounding boxes)</th><th scope="col">Best for</th></tr></thead>' +
          '<tbody>' +
            '<tr><td class="lib">pypdf</td><td>Yes</td><td>No</td><td>Quick, simple text reading</td></tr>' +
            '<tr><td class="lib">pdfplumber</td><td>Yes</td><td>Yes, with <code>extract_words</code></td><td>Tables</td></tr>' +
            '<tr><td class="lib">PyMuPDF</td><td>Yes</td><td>Yes</td><td>Text, word positions, page images and tables. It\'s the one we use for the rest of this project.</td></tr>' +
          '</tbody></table></div>' +
        '<div class="fact"><span class="num">WHAT\'S NEXT</span><p>You\'ll try all three in the next reading.</p></div>' }
  ];
  var END_LABEL = "Done";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the cards. Scroll down to the next part of the page.";

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }

  CARDS.forEach(function (c, n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + c.label);
    b.innerHTML = '<span class="seg"></span><span class="pg-label" data-text="' + c.label + '">' + c.label + '</span>';
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function titleOf(n) { var m = CARDS[n].html.match(/<h2[^>]*>(.*?)<\/h2>/); return m ? m[1].replace(/<[^>]+>/g, "") : ""; }

  function render(anim) {
    var c = CARDS[i];
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.eyebrow + '</p>' + c.html + '</div>';
    boxIdCard();
    Array.prototype.forEach.call(rail.children, function (b, n) {
      b.classList.toggle("is-cur", n === i);
      b.classList.toggle("is-done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("where-count").textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + titleOf(i + 1) + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n < 0 || n >= CARDS.length || n === i) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i === CARDS.length - 1) {
      donemsg.textContent = DONE_MSG;
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "extern-deck-done" }, "*");
      return;
    }
    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Re-measure the ID card boxes once the web font has loaded, so each box fits its text. */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boxIdCard);
  window.addEventListener("resize", fit);
  fit();
  render(false);
})();
</script>
