<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy Your Inventory Into Your Workbook</title>
<!--
  vCISO P1 Step 2, Module 7: Build the Asset Inventory.
  Animated click-by-click walkthrough: copy the view-only asset inventory
  template tab for your scope into your own Workbook, then rename it Inventory.
  (06-content/project-01/step-02/module-07-task-build-the-asset-inventory.md)
  Same shell, header, bar, tint ramp and scale-to-fit as
  vciso-p2-m6-what-is-a-lookup.html.

  Data: the grid rows are verbatim from the live Scope A template
  (rows 7 to 12 of "Asset inventory template - Scope A"). Nothing is added.
  The Workbook tab names (Charter, Questionnaire, Findings, Risk picture)
  are from the brief.

  Check in a real account before shipping: the exact Google wording of the
  file picker title, its "Insert" button, and the "Sheet copied
  successfully" message with its "Open spreadsheet" link.

  Every scene animates on entry and has Replay. Under reduced motion every
  scene shows its end state at once.
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;

    /* the fake app window only */
    --app:#FFFFFF;
    --app-chrome:#F9FBFD;
    --app-strip:#F1F3F4;
    --app-head:#F8F9FA;
    --app-edge:#D3D6DB;
    --app-grid:#E2E3E3;
    --app-dim:#9A9A9A;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp (09-assets/deck-palette.json), in slide order. Tint carries no meaning. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t3{background:#F2E3D2}
  body.t4{background:#DEEBDA}
  body.t5{background:#F0E4EF}
  body.t6{background:#D0EEF1}
  body.t7{background:#EEDAD6}

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  .lead{flex:0 0 auto;font-size:16px;line-height:1.45;color:var(--body);max-width:82ch}
  .lead b{color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- the reveal primitive: base state is the END state, so reduced
         motion (no transitions, every step applied at once) shows the end. ---- */
  .fx{opacity:0;transform:translateY(8px);transition:opacity 480ms var(--ease-out),transform 480ms var(--ease-over)}
  .fx.on{opacity:1;transform:none}

  /* ---- the scene: a fake Google Sheets window ---- */
  .scene{flex:1 1 auto;min-height:0;position:relative}
  .gs{position:absolute;inset:0;background:var(--app);border:1px solid var(--app-edge);border-radius:10px;
    display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(28,27,27,.10)}
  .gs-top{flex:0 0 auto;min-height:42px;display:flex;align-items:center;gap:10px;padding:0 14px;
    background:var(--app-chrome);border-radius:10px 10px 0 0}
  .gs-ico{width:18px;height:24px;flex:0 0 auto;display:block}
  .gs-title{font-size:16px;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .gs-pill{flex:0 0 auto;font-size:14px;font-weight:600;color:var(--body);background:#EDEFF2;border:1px solid var(--app-edge);
    border-radius:13px;padding:1px 11px;line-height:20px;transition:box-shadow 300ms var(--ease-out)}
  .gs-menu{flex:0 0 auto;height:28px;display:flex;gap:17px;align-items:center;padding:0 14px;font-size:14px;color:var(--body);
    background:var(--app-chrome);border-bottom:1px solid var(--app-edge);overflow:hidden;white-space:nowrap}
  .gs-grid{flex:1 1 auto;min-height:0;overflow:hidden;display:grid;align-content:start;
    grid-template-columns:36px 34px 145px 165px 100px 120px 165px minmax(0,1fr);
    font-family:Arial,Helvetica,sans-serif;font-size:14px;color:var(--title)}
  .gs-grid > span{border-right:1px solid var(--app-grid);border-bottom:1px solid var(--app-grid);padding:0 6px;
    white-space:nowrap;overflow:hidden;height:28px;line-height:27px}
  .gs-grid > .cl{height:22px;line-height:21px;background:var(--app-head);color:var(--body);text-align:center}
  .gs-grid > .rn{background:var(--app-head);color:var(--body);text-align:center;padding:0}
  .gs-grid > .h{height:42px;line-height:17px;white-space:normal;font-weight:700;display:flex;align-items:center}
  .gs-grid > .rn.h{justify-content:center;font-weight:400}
  .gs-tabs{flex:0 0 auto;min-height:40px;display:flex;align-items:center;gap:4px;padding:4px 10px;background:var(--app-strip);
    border-top:1px solid var(--app-edge);border-radius:0 0 10px 10px;position:relative;z-index:3}
  .gtb{flex:0 0 auto;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--body);border-radius:6px;
    transition:box-shadow 300ms var(--ease-out)}
  .gtb svg.ic{width:20px;height:20px}
  .tab{position:relative;flex:0 0 auto;height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-size:14px;
    color:var(--body);border-radius:6px;white-space:nowrap;transition:box-shadow 300ms var(--ease-out),background 200ms var(--ease-out)}
  .tab.act{background:var(--highlight);color:var(--on-highlight);font-weight:700}
  .tab .car{width:10px;height:10px}
  .tab.slidein{opacity:0;transform:translateX(-16px);transition:opacity 420ms var(--ease-out),transform 520ms var(--ease-over),box-shadow 300ms var(--ease-out)}
  .tab.slidein.on{opacity:1;transform:none}
  .ring{box-shadow:0 0 0 3px var(--on-highlight)!important}
  .ring.pulse{animation:pulse 1100ms var(--ease-io) 2}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--on-highlight)}50%{box-shadow:0 0 0 6px rgba(0,29,105,.35)}}

  /* tab in rename mode */
  .tab.edit{background:var(--app);border:2px solid var(--on-highlight);padding:0 8px;font-weight:400;color:var(--title)}
  .tab .sel{background:var(--highlight);color:var(--title)}
  .tab .caret{display:inline-block;width:2px;height:17px;background:var(--title);vertical-align:-3px;margin-left:1px;animation:blink 900ms steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .kchip{position:absolute;left:calc(100% + 14px);top:50%;margin-top:-16px;height:32px;display:inline-flex;align-items:center;gap:7px;
    background:var(--bg);border:1.5px solid var(--on-highlight);border-bottom-width:3.5px;border-radius:7px;padding:0 12px;
    font-size:14px;font-weight:700;color:var(--on-highlight);opacity:0;transition:opacity 260ms var(--ease-out);white-space:nowrap}
  .kchip.on{opacity:1}
  .kchip svg.ic{width:16px;height:16px}

  /* right-click menu, anchored to the tab */
  .cm{position:absolute;left:0;bottom:calc(100% + 8px);width:232px;background:var(--app);border:1px solid var(--app-edge);border-radius:8px;
    box-shadow:0 4px 16px rgba(28,27,27,.18);padding:6px 0;font-weight:400;color:var(--title);
    opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity 200ms var(--ease-out),transform 240ms var(--ease-out),visibility 0s linear 240ms}
  .cm.on,.sm.on{opacity:1;visibility:visible;transform:none;transition:opacity 200ms var(--ease-out),transform 240ms var(--ease-out),visibility 0s}
  .mi{position:relative;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:14.5px;color:var(--title);
    border:2px solid transparent;transition:background 160ms var(--ease-out),border-color 160ms var(--ease-out)}
  .mi.dis{color:var(--app-dim)}
  .mi .sa{font-size:14px;color:var(--body)}
  .mi.hl{background:var(--highlight);border-color:var(--on-highlight);color:var(--on-highlight);font-weight:700}
  .mi.hl .sa{color:var(--on-highlight)}
  .sm{position:absolute;left:calc(100% + 4px);top:-8px;width:210px;background:var(--app);border:1px solid var(--app-edge);border-radius:8px;
    box-shadow:0 4px 16px rgba(28,27,27,.18);padding:6px 0;font-weight:400;
    opacity:0;visibility:hidden;transform:translateX(-6px);transition:opacity 200ms var(--ease-out),transform 240ms var(--ease-out),visibility 0s linear 240ms}

  /* the file picker */
  .dim{position:absolute;inset:0;border-radius:10px;background:rgba(28,27,27,.32);z-index:5}
  .dlgw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;pointer-events:none}
  .dlg{width:560px;max-width:calc(100% - 16px);background:var(--app);border-radius:10px;box-shadow:0 8px 30px rgba(28,27,27,.28);
    padding:14px 18px 14px;display:flex;flex-direction:column;gap:8px}
  .dh{font-size:17px;font-weight:600;color:var(--title)}
  .ds{height:36px;border:1px solid var(--app-edge);border-radius:18px;background:var(--app-strip);display:flex;align-items:center;gap:8px;
    padding:0 14px;font-size:14px;color:var(--body)}
  .ds svg.ic{width:18px;height:18px}
  .dr{font-size:14px;font-weight:700;color:var(--body);margin-top:2px}
  .df{height:38px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:7px;border:2px solid transparent;
    font-size:14.5px;color:var(--title);transition:background 180ms var(--ease-out),border-color 180ms var(--ease-out)}
  .df .gs-ico{width:15px;height:20px}
  .df .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .df.pick{background:var(--highlight);border-color:var(--on-highlight);color:var(--on-highlight);font-weight:700}
  .df .tick{margin-left:auto;width:20px;height:20px;color:var(--on-highlight);opacity:0;transition:opacity 200ms var(--ease-out);flex:0 0 auto}
  .df.pick .tick{opacity:1}
  .dfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
  .bt{height:36px;display:inline-flex;align-items:center;padding:0 18px;border-radius:18px;font-size:14px;font-weight:600;
    color:var(--on-highlight);border:1px solid var(--app-edge);background:var(--app);transition:background 160ms var(--ease-out),color 160ms var(--ease-out),transform 120ms var(--ease-out)}
  .bt.pri{background:var(--on-highlight);border-color:var(--on-highlight);color:var(--bg)}
  .bt.pri.off{background:#E6E7E9;border-color:#E6E7E9;color:#6E6E6E}
  .bt.down{transform:scale(.95)}

  /* the "copied" message */
  .toastw{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;z-index:6;pointer-events:none}
  .toast{width:420px;max-width:calc(100% - 16px);background:var(--app);border:1px solid var(--app-edge);border-radius:10px;
    box-shadow:0 6px 24px rgba(28,27,27,.22);padding:14px 18px;display:flex;flex-direction:column;gap:12px}
  .toast .tt{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;color:var(--title)}
  .toast .tt svg.ic{width:22px;height:22px;color:var(--on-highlight)}
  .toast .ta{display:flex;align-items:center;justify-content:flex-end;gap:12px}
  .lnk{font-size:14.5px;font-weight:700;color:var(--on-highlight);padding:6px 10px;border-radius:6px;transition:background 160ms var(--ease-out)}
  .lnk.hl{background:var(--highlight);text-decoration:underline}

  /* the cursor */
  .cur{position:absolute;left:0;top:0;z-index:20;pointer-events:none;opacity:0;
    transition:transform 760ms var(--ease-io),opacity 200ms var(--ease-out)}
  .cur.show{opacity:1}
  .cur svg{display:block;width:22px;height:30px;overflow:visible;transform-origin:2px 2px;margin:-2px 0 0 -2px}
  .cur.press svg{animation:press 220ms var(--ease-io)}
  @keyframes press{50%{transform:scale(.82)}}
  .cur .cc{position:absolute;left:20px;top:26px;background:var(--on-highlight);color:var(--bg);font-size:14px;font-weight:700;
    border-radius:13px;padding:3px 11px;white-space:nowrap;opacity:0;transform:translateY(4px);
    transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out)}
  .cur .cc.on{opacity:1;transform:none}
  .cur.flip .cc{left:auto;right:4px}
  .cur.up .cc{top:-34px}
  .rip{position:absolute;left:0;top:0;z-index:19;pointer-events:none}
  .rip i{position:absolute;left:-16px;top:-16px;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--on-highlight);
    background:rgba(0,29,105,.12);opacity:0}
  .rip.go i{animation:rip 560ms var(--ease-out)}
  .rip.go2 i{animation:rip2 560ms var(--ease-out)}
  @keyframes rip{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.7)}}
  @keyframes rip2{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.7)}}

  /* ---- scene 8: four steps ---- */
  .steps{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
  .stp{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:12px;padding:12px 14px;
    display:grid;grid-template-columns:32px minmax(0,1fr) 150px;gap:12px;align-items:center}
  .sn{width:32px;height:32px;border-radius:50%;background:var(--on-highlight);color:var(--bg);font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center;align-self:start}
  .stp p{font-size:15px;line-height:1.42;color:var(--title);align-self:center}
  .stp p b{font-weight:700}
  .mini{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center}
  .mtabs{display:flex;align-items:center;gap:6px;background:var(--app-strip);border:1px solid var(--app-edge);border-radius:8px;padding:5px 8px}
  .mtabs .gtb{width:28px;height:28px;background:var(--app)}
  .mtabs .tab{height:28px;padding:0 10px}
  .mg{display:grid;grid-template-columns:24px 34px 34px 34px;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:var(--body);
    border-top:1px solid var(--app-edge);border-left:1px solid var(--app-edge)}
  .mg span{height:24px;line-height:23px;text-align:center;border-right:1px solid var(--app-edge);border-bottom:1px solid var(--app-edge);background:var(--app)}
  .mg .hd{background:var(--app-head)}
  .mg .cor{background:#C9CDD4;position:relative}
  .mg.all span{background:var(--highlight)}
  .mg.all .hd{background:#C4CCF5;color:var(--on-highlight);font-weight:700}
  .mg.all .cor{background:var(--on-highlight)}
  .mg .a1{box-shadow:inset 0 0 0 2px var(--on-highlight);background:var(--highlight)}
  .keys{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--body);white-space:nowrap}
  .key{display:inline-flex;align-items:center;height:28px;padding:0 9px;background:var(--bg);border:1.5px solid var(--on-highlight);
    border-bottom-width:3.5px;border-radius:6px;font-size:14px;font-weight:700;color:var(--on-highlight)}
  .keys .mac{font-size:14px;color:var(--body);margin-right:2px}

  /* ---- the bar ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out);
    display:inline-flex;align-items:center;gap:7px}
  button.nav svg.ic{width:17px;height:17px}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled,button.nav.ghost:disabled{background:transparent;color:var(--on-highlight);border-style:dashed;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:40px;font-size:13.5px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}
  #replay{margin-left:auto}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .board{flex:0 0 auto}
    .scene{flex:0 0 auto}
    .gs{position:relative;inset:auto}
    .gs-top{flex-wrap:wrap;padding:8px 12px;row-gap:6px}
    .gs-title{white-space:normal;flex:1 1 0;line-height:1.3}
    .gs-grid{flex:0 0 auto;height:204px;grid-template-columns:28px 30px 124px minmax(0,1fr)}
    .gs-grid > .ph{display:none}
    .gs-tabs{flex-wrap:wrap;row-gap:4px}
    .cm{width:214px}
    .sm{left:36px;top:calc(100% - 4px);width:200px;z-index:2}
    .dlg{padding:12px 12px}
    .dh{font-size:16px}
    .df{height:auto;min-height:38px;padding:6px 10px}
    .df .nm{white-space:normal;line-height:1.3}
    .toastw{bottom:52px}
    .kchip{left:auto;right:0;top:calc(100% + 16px);margin-top:0}
    .scene.has-k{padding-bottom:50px}
    .steps{grid-template-columns:1fr;grid-template-rows:none}
    .stp{grid-template-columns:32px minmax(0,1fr)}
    .stp .mini{grid-column:2;align-items:flex-start}
    .stp p{font-size:16px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #replay{margin-left:0}
    #hint{height:auto;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Copy Your Inventory Into Your Workbook">

    <div class="top">
      <span class="prog" id="prog">1 of 8</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Continue</button>
      <div id="hint" aria-hidden="true"></div>
      <button class="nav ghost" id="replay" type="button"></button>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:18px;color:#1C1B1B;margin:18px 0 8px}
    .nsf p{margin-bottom:12px}
    .nsf ol{margin:0 0 12px 22px}
    .nsf li{margin-bottom:8px}
    .nsf strong{color:#1C1B1B}
  </style>
  <div class="nsf">
    <h2>Copy Your Inventory Into Your Workbook</h2>
    <ol>
      <li><strong>Open the inventory for your scope.</strong> Click the link for your scope. It opens as view only, so you cannot type in it. That is fine, because you are going to copy it.</li>
      <li><strong>Right-click the tab at the bottom.</strong> Move your mouse to the tab at the bottom of the screen and right-click it. On a Mac trackpad, click with two fingers.</li>
      <li><strong>Choose Copy to, then Existing spreadsheet.</strong></li>

  /* ---------------- state and timeline ---------------- */
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function q(s){ return el.board.querySelector(s); }

  /* ---------------- the cursor ---------------- */
  var curLast = null;
  function ptOf(node, fx, fy){
    var sc = q(".scene"), sr = sc.getBoundingClientRect(), r = node.getBoundingClientRect();

    return { x:(r.left - sr.left + r.width * fx) * k, y:(r.top - sr.top + r.height * fy) * k };

  function curTo(sel, fx, fy, instant){

    c.classList.toggle("up", !!n.closest(".gs-tabs"));
    if(instant) c.style.transition = "none";
    c.style.transform = "translate(" + p.x.toFixed(1) + "px," + p.y.toFixed(1) + "px)";

    if(instant){ void c.offsetWidth; c.style.transition = ""; }
  }

  function render(){
    stop();

    var s = S[i];

    var my = ++gen;

      if(my !== gen) return;

    if(reduce) run(); else requestAnimationFrame(function(){ requestAnimationFrame(run); });
  }

  function go(d){

    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){ if(dx < 0){ if(!el.next.disabled) go(1); } else go(-1); }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; }
    else {
      var sc = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
      stage.style.transform = "scale(" + sc + ")";
    }
    /* keep the cursor on its target when the layout changes */
    if(curLast) curTo(curLast.sel, curLast.fx, curLast.fy, true);
  }
  window.addEventListener("resize", fit);

  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; i = n; render(); return true; },
    slides:S.length, done:false,
    reset:function(){ i = 0; render(); },
    state:function(){ return { i:i, playing:playing }; }
  };

  render();
  fit();
})();
</script>
</body>
</html>
