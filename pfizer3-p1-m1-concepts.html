<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharma Industry Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Card player: a rail with "Card X of N" on top,
   one card at a time, Back and Next below.
   Fixed stage: the whole deck is laid out once on a 760 x 700 design stage, then scaled as one piece
   to fit the embed frame and centred. Nothing scrolls, and Back and Next never move. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600); --icon:var(--extern-black); --connector:var(--extern-black);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --space-1:4px; --space-2:8px; --space-3:14px; --space-4:18px; --space-5:26px; --space-6:40px; --space-7:56px;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --stage-w:760px; --stage-h:700px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* The design stage. JavaScript sets the scale and position; until it runs, the stage sits at full size. */
.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}
.pg-label{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-muted);white-space:nowrap}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:22px 28px;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.inner{display:flex;flex-direction:column;gap:16px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:2px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:16px;line-height:1.6;color:var(--ink-muted);text-wrap:pretty;max-width:68ch}
.p b{font-weight:600;color:var(--ink)}
.list{margin:0;padding-left:22px;font-size:16px;line-height:1.6;color:var(--ink-muted)}
.list li{margin:0 0 6px}
.list li::marker{color:var(--pfizer-blue)}
.list b{color:var(--ink);font-weight:600}

/* Tiles on surface-card */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{background:var(--surface-card);border-radius:var(--radius-md);padding:18px 20px;min-width:0}
.tile h3{margin:0;font-size:18px;line-height:1.3;font-weight:600;color:var(--card-title)}
.tile p{margin:4px 0 0;font-size:15px;line-height:1.5;color:var(--card-text)}
.tile .num{display:block;margin-bottom:6px;font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}

/* Pillars flow: StepCards joined by arrows (redrawn from the design system's ProcessFlow) */
.flow{display:flex;align-items:stretch;gap:10px}
.pcard{flex:1 1 0;min-width:0;background:var(--surface-card);border-radius:var(--radius-md);padding:var(--space-4);display:flex;flex-direction:column;justify-content:space-between;gap:var(--space-4);min-height:250px}
.badge{width:76px;height:76px;flex:none;border-radius:var(--radius-sm);background:var(--surface-icon);color:var(--icon);display:grid;place-items:center}
.badge svg{width:48px;height:48px;display:block}
.badge .cut{fill:var(--surface-icon)}
.step{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.pcard h3{margin:var(--space-2) 0 0;font-size:18px;line-height:23px;font-weight:600;color:var(--card-title)}
.pcard p{margin:6px 0 0;font-size:15px;line-height:21px;color:var(--card-text)}
.arrow{display:flex;align-items:center;justify-content:center;flex:none;color:var(--connector)}
.arrow svg{width:28px;height:20px;display:block}
/* A single pillar card beside the text */
.cols{display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--space-5);align-items:start}
.cols .pcard{min-height:240px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* Small inline note for the expert reviewer */
.sme{display:block;margin:0;padding:6px 0 6px 12px;border-left:2px solid var(--pfizer-blue);font-size:13px;line-height:1.45;color:var(--gray-600)}
.sme b{font-weight:600;color:var(--gray-800)}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app">
  <h1 class="sr-only">How the pharma industry works: five cards</h1>
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where"><b id="where-label">The Industry</b> · <span id="where-count">Card 1 of 5</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Card"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-next" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  /* Line icons from the design system (48 x 48 grid, 2px stroke, round caps and joins). */
  function icon(paths) { return '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>'; }
  var IC = {
    research: icon('<path d="M8 5c9 6-9 13 0 19s-9 13 0 19M17 5c-9 6 9 13 0 19s9 13 0 19M9 11h7M9 19h7M9 29h7M9 37h7"/><rect x="28" y="4" width="7" height="17" rx="2" transform="rotate(30 31.5 12.5)"/><path d="M33 22c5 4 5 13-1 17M24 30h11M22 43h22M30 39v4"/>'),
    manufacturing: icon('<path d="M5 43V26l9 5v-5l9 5v-5l9 5V43ZM5 43h38M32 31V14h6v29M11 37h4M18 37h4M25 37h4"/><circle cx="38" cy="8" r="3.5"/><path d="M38 2v2M38 12v2M32 8h2M42 8h2"/>'),
    supply: icon('<circle cx="17" cy="17" r="12"/><path d="M5 17h24M17 5c-6 7-6 17 0 24M17 5c6 7 6 17 0 24"/><path d="M20 26h16v13H20ZM36 30h5l3 4v5h-8M26 32.5h4M28 30.5v4"/><circle cx="25" cy="40" r="3" class="cut"/><circle cx="39" cy="40" r="3" class="cut"/>')
  };
  var ARROW = '<div class="arrow" aria-hidden="true"><svg viewBox="0 0 36 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10h30M25 3l7 7-7 7"/></svg></div>';

  function pillar(n, ic, title, desc) {
    return '<div class="pcard"><div class="badge">' + IC[ic] + '</div><div><div class="step">0' + n + '</div><h3>' + title + '</h3><p>' + desc + '</p></div></div>';
  }
  var P1 = pillar(1, "research", "Research &amp; Development", "Inventing new medicines");
  var P2 = pillar(2, "manufacturing", "Manufacturing", "Producing medicines at scale");
  var P3 = pillar(3, "supply", "Clinical Supply &amp; Operations", "Getting the right materials and papers to clinical trials on time");

  var CARDS = [
    { label: "The Industry", eyebrow: "The big picture",
      html: '<h2 class="title">What Is the Pharma Industry?</h2>' +
        '<p class="p">You\'ve almost certainly met it already. You\'ve taken medicine, seen an ad for a new drug, or walked into a pharmacy. The <b>pharmaceutical industry</b>, or <b>pharma</b> for short, is the group of companies that find, test, make and deliver medicines that prevent, treat or cure diseases.</p>' +
        '<div class="tiles four">' +
          '<div class="tile"><h3>Discover</h3><p>Finding new medicines in the lab</p></div>' +
          '<div class="tile"><h3>Develop</h3><p>Testing them to prove they\'re safe and work</p></div>' +
          '<div class="tile"><h3>Make</h3><p>Producing them in huge, careful batches (groups made at the same time)</p></div>' +
          '<div class="tile"><h3>Deliver</h3><p>Getting them to patients around the world</p></div>' +
        '</div>' +
        '<p class="p">Here\'s what most people don\'t realize: getting one medicine from a scientist\'s lab bench to your medicine cabinet takes <b>thousands of people, billions of dollars and more than a decade of work</b>.</p>' },

    { label: "Three Pillars", eyebrow: "How a pharma company is built",
      html: '<h2 class="title">The 3 Pillars of <span class="hl">Pharma</span></h2>' +
        '<p class="p">Think of a pharma company as having three big engines that work together. Here are all three together. The third one mentions clinical trials: those are studies that test new medicines in people.</p>' +
        '<div class="flow" role="img" aria-label="Three pillars in order: 1, Research and Development, inventing new medicines; 2, Manufacturing, producing medicines at scale; 3, Clinical Supply and Operations, getting the right materials and papers to clinical trials on time.">' + P1 + ARROW + P2 + ARROW + P3 + '</div>' +
        '<p class="p">On the next three cards, we\'ll look inside each one, starting with the scientists.</p>' },

    { label: "R&amp;D", eyebrow: "Pillar 1",
      html: '<h2 class="title">Research &amp; Development: The Brains</h2>' +
        '<div class="cols">' + P1 + '<div class="stack">' +
          '<p class="p"><b>Research and development</b>, or <b>R&amp;D</b>, is the part of the company that invents new medicines. Its scientists work in labs to discover new molecules (tiny groups of atoms joined together), understand how diseases work, and design <b>clinical trials</b>. Clinical trials are careful studies that test a new medicine in people.</p>' +
          '<p class="p">Pfizer\'s main research sites include <b>Groton, Connecticut</b>, <b>Cambridge, Massachusetts</b>, <b>Pearl River, New York</b> (its main vaccine research site) and <b>San Diego, California</b>. Thousands of scientists there work on medicines for cancer, new vaccines and much more.</p>' +
          '<p class="sme"><b>Ask Chaitanya to review:</b> the list of Pfizer research sites.</p>' +
        '</div></div>' },

    { label: "Manufacturing", eyebrow: "Pillar 2",
      html: '<h2 class="title">Manufacturing: The Muscle</h2>' +
        '<div class="cols">' + P2 + '<div class="stack">' +
          '<p class="p">Huge factories make billions of doses of medicine. They follow very strict quality rules called <b>Good Manufacturing Practice</b>, or <b>GMP</b>: the rules that make sure every batch of a medicine is made safely, cleanly and the same way every time.</p>' +
          '<p class="p">Pfizer\'s site in <b>Kalamazoo, Michigan</b> is the largest in its manufacturing network. During the pandemic, it made hundreds of millions of COVID-19 vaccine doses.</p>' +
        '</div></div>' },

    { label: "Clinical Supply", eyebrow: "Pillar 3",
      html: '<h2 class="title">Clinical Supply &amp; Operations: The Nervous System</h2>' +
        '<div class="cols">' + P3 + '<div class="stack">' +
          '<p class="p">This pillar connects everything else. Its teams:</p>' +
          '<ul class="list">' +
            '<li>Manage <b>thousands of documents</b>, such as purchase orders (a company\'s written order to buy something), material labels and shipping forms</li>' +
            '<li>Coordinate materials across Pfizer sites around the world</li>' +
            '<li>Make sure the right supplies reach the right clinical trials, on time</li>' +
          '</ul>' +
        '</div></div>' +
        '<div class="tile"><span class="num">THIS IS WHERE YOU COME IN</span><p>Every material that reaches a trial arrives with papers from its <b>supplier</b>, the company that made it. Someone has to check that those papers are complete and up to date. In this externship, you\'ll build AI tools that help Clinical Supply teams do that check.</p></div>' }
  ];
  var END_LABEL = "Done. Now Follow a Medicine";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of the page.";

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }

  CARDS.forEach(function (c, n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    var plain = c.label.replace(/&amp;/g, "&");
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + plain);
    b.innerHTML = '<span class="seg"></span><span class="pg-label">' + c.label + '</span>';
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function titleOf(n) { var m = CARDS[n].html.match(/<h2[^>]*>(.*?)<\/h2>/); return m ? m[1].replace(/<[^>]+>/g, "") : ""; }

  function render(anim) {
    var c = CARDS[i];
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.eyebrow + '</p>' + c.html + '</div>';
    Array.prototype.forEach.call(rail.children, function (b, n) {
      b.classList.toggle("is-cur", n === i);
      b.classList.toggle("is-done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("where-label").innerHTML = c.label;
    $("where-count").textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + titleOf(i + 1) + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n < 0 || n >= CARDS.length || n === i) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i === CARDS.length - 1) {
      donemsg.textContent = DONE_MSG;
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "extern-deck-done" }, "*");
      return;
    }
    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", fit);
  fit();
  render(false);
})();
</script>
</body>
</html>
