<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can They Prove It?</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#FDF8F8;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
color:#484646;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#w{position:absolute;top:0;left:0;width:960px;height:540px;overflow:hidden;transform-origin:top left}
.slide{position:absolute;top:0;left:0;width:960px;height:540px;
padding:24px 72px 20px;display:grid;grid-template-rows:20px 14px 402px 16px 44px;
background:#FDF8F8;text-align:left}
.slide[hidden]{display:none}
.t1{background:#FDF8F8}
.t2{background:#FAF4EA}
.t3{background:#F1F5F1}
.t4{background:#F5F1F9}
.t5{background:#FBF1F2}
.t6{background:#EFF2F8}
.t7{background:#F6F4EE}
.hd{grid-row:1;display:flex;align-items:center;justify-content:space-between;
font-size:13px;line-height:20px;color:#484646}
.hd .rh{font-weight:500}
.hd .pos{font-variant-numeric:tabular-nums}
.bd{grid-row:3;height:402px}
.s1 .bd{display:grid;grid-template-columns:312px 464px;gap:0 40px;align-content:center}
.s2 .bd{display:grid;grid-template-columns:436px 340px;gap:0 40px;align-content:center}
.se .bd{display:flex;flex-direction:column;justify-content:flex-start;padding-top:24px}
.ab{grid-row:5;height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.abl,.abr{display:flex;align-items:center;gap:12px}
h1,h2{font-weight:600;color:#1C1B1B}
h1:focus,h2:focus,h1.fx,h2.fx{outline:3px solid #001D69;outline-offset:4px;border-radius:2px}
h1{font-size:30px;line-height:1.16;width:fit-content}
.prompt{font-size:18px;line-height:1.5;color:#1C1B1B;margin-top:12px}
.sub{font-size:13px;line-height:1.5;color:#484646;margin-top:8px}
#grp{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid rgba(0,29,105,0.55);border-radius:8px;padding:10px 13px;
background:transparent;cursor:pointer}
.card .row{display:flex;align-items:flex-start;gap:10px}
.card .n{flex:0 0 auto;font-size:15px;font-weight:500;line-height:1.4;color:#001D69;
font-variant-numeric:tabular-nums}
.card .c{font-size:15px;font-weight:500;line-height:1.4;color:#1C1B1B}
.card .ind{flex:0 0 auto;line-height:0;padding-top:2px}
.card.sel{background:#DCE1FF;border-color:#001D69;box-shadow:inset 0 0 0 1px #001D69}
.card.lock{cursor:default;background:transparent;border-color:rgba(0,29,105,0.55);box-shadow:none}
.card:focus-visible{outline:3px solid #001D69;outline-offset:2px}
.mine{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;
line-height:1.4;color:#484646;margin-top:6px;padding-left:24px}
.ln{font-size:18px;line-height:1.5;color:#484646;margin-top:12px}
.pick{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:400;
line-height:1.5;color:#484646;margin-top:14px}
.pick .ic{margin-top:2px}
.note{background:#DCE1FF;border-left:4px solid #001D69;border-radius:0 10px 10px 0;
padding:14px 18px;font-size:17px;line-height:1.5;color:#1C1B1B}
.s2 .note,.se .note{margin-top:14px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow.key{border-left:3px solid #001D69;padding-left:12px;margin-left:-15px}
.rc{display:flex;align-items:flex-start;gap:10px;font-size:15px;font-weight:500;
line-height:1.4;color:#1C1B1B}
.rc .n{flex:0 0 auto;color:#001D69;font-variant-numeric:tabular-nums}
.rs{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:5px}
.ymark{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:400;
line-height:1.5;color:#484646}
.end{font-size:17px;line-height:1.5;color:#484646;text-align:right}
.se h2{font-size:28px;line-height:1.2;display:flex;align-items:baseline;gap:12px;width:fit-content}
.se h2 .hn{flex:0 0 auto;color:#001D69;font-variant-numeric:tabular-nums}
.rule{height:1px;background:rgba(0,29,105,0.18);margin:16px 0 18px}
.two{display:grid;grid-template-columns:256px 520px;gap:0 40px}
.rail{display:flex;flex-direction:column;align-items:flex-start;align-self:start}
.rail.key{border-left:3px solid #001D69;padding-left:15px;margin-left:-18px}
.chip{display:inline-flex;align-items:flex-start;gap:8px;font-size:15px;font-weight:500;
line-height:1.3;color:#001D69;border:1px solid #001D69;border-radius:999px;padding:5px 14px 5px 11px}
.chip.key{background:#DCE1FF}
.chip .ci{flex:0 0 auto;line-height:0;padding-top:1px}
.exp{font-size:17px;line-height:1.5;color:#484646}
.ic{display:block;width:18px;height:18px;fill:none;stroke:#001D69;stroke-width:1.8;
stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}
.btn{font-family:inherit;font-size:15px;font-weight:500;line-height:1;height:40px;
padding:0 20px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
border:1px solid #001D69;background:#001D69;color:#FDF8F8}
.btn .ic{stroke:#FDF8F8}
.btn.sec{background:transparent;color:#001D69}
.btn.sec .ic{stroke:#001D69}
.btn:disabled{background:transparent;border-color:#484646;color:#484646;cursor:default}
.btn:disabled .ic{stroke:#484646}
.btn:focus-visible{outline:3px solid #001D69;outline-offset:2px}
#w.pm{width:480px;height:640px}
#w.pm .slide{width:480px;height:640px;padding:24px 32px 20px;
grid-template-rows:20px 14px 502px 16px 44px}
#w.pm .bd{height:502px}
#w.pm .s1 .bd,#w.pm .s2 .bd{grid-template-columns:1fr;gap:0}
#w.pm #grp,#w.pm .note{margin-top:18px}
#w.pm .two{grid-template-columns:1fr;gap:0}
#w.pm .rail{margin-bottom:16px}
#w.pm .rail.key{margin-left:0;padding-left:13px}
#w.pm .rrow.key{margin-left:0;padding-left:12px}
#w.pm .rlist{margin-top:14px;gap:6px}
#w.pm .rs{margin-top:4px}
#w.pm .se .bd{padding-top:20px}
#w.pm h1{font-size:22px}
#w.pm .se h2{font-size:22px;gap:10px}
#w.pm .hslot{min-height:52.8px}
#w.pm .prompt,#w.pm .ln,#w.pm .note,#w.pm .exp{font-size:16px}
#w.pm .end{font-size:13px}
#w.pm .rule{margin:14px 0 16px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="w">
<section class="slide s1 t1" id="sl1" role="group" aria-label="Slide 1 of 7">
<div class="hd"><span class="rh"></span><span class="pos">1 of 7</span></div>
<div class="bd" id="bd1">
<div>
<h1 id="h1" tabindex="-1">Can They Prove It?</h1>
<p class="prompt" id="prompt">Which of these five could Cumberland prove, if any?</p>
<p class="sub">You have not seen their paperwork yet. Go on instinct.</p>
</div>
<div id="grp" role="radiogroup" aria-labelledby="prompt"></div>
</div>
<div class="ab"><div class="abl"></div><div class="abr"><button class="btn" type="button" id="go1" disabled>Reveal</button></div></div>
</section>
</div>
<script>
(function(){
var CLAIM=[
"&ldquo;We know what systems we run.&rdquo;",
"&ldquo;We patch our systems regularly.&rdquo;",
"&ldquo;We review our firewall settings every quarter.&rdquo;",
"&ldquo;Only authorized staff can reach patient data.&rdquo;",
"&ldquo;Our staff are trained on security.&rdquo;"];
var STATUS=["Not provable","Not provable","True. Still not provable","Not provable","Not provable"];
var EXP=[
"Not provable. Two lists of what the company owns exist, and they do not match. One is Nate&rsquo;s, the systems administrator: 19 rows of servers and software, kept since 2019, with names typed differently in different rows and a column he stopped filling in halfway down. The other belongs to finance: 15 rows, kept for contract renewals, so it lists anything that costs money and nothing that does not. The two disagree in six places, and nobody has ever sat down and compared them. So the company has two answers to what it owns, which is the same as having none.",
"Not provable. A patch is a fix a manufacturer sends out when it finds a hole in its own product. They keep arriving, week after week, so patching is something you do continuously, not once. What Cumberland has is one scan, an automated check that goes through the machines and reports which fixes are missing. It was run by an outside company, four months ago. One scan shows one afternoon. It does not show a habit.",
"True, and still not provable. A firewall is the gate between the company&rsquo;s network and the internet, and its settings are the list of rules about what is allowed through. Reviewing them means checking that list is still right, because a rule that made sense two years ago can quietly leave a door open today. Those reviews really happened, twice in 2024. Nobody wrote down when, who did it, or what changed. So there is nothing to hand Meridian. This is the one worth remembering: real work that left no trace counts as nothing to an outsider.",
"Not provable. Patient data sits in systems people log into, and the claim is that only the right people can get in. To check it you would need a list of who is allowed. Cumberland cannot produce one. So nobody can show this is true, and nobody can show it is false either. A claim that cannot be tested is not proof, and no customer accepts it.",
"Not provable. A security training deck sits on the intranet, the company&rsquo;s internal website. That proves a deck exists. Training is what people did with it, and no record says anyone ever opened it."];
var NOTE="Some words here will be new. That is expected, and nothing is being tested. This is a tour of what is going on inside the company, and every idea on this screen comes back later with much more room. Read for the shape of the problem: honest people, real work, and almost nothing written down.";
var TRAP=2;
var TINT=["#FDF8F8","#FAF4EA","#F1F5F1","#F5F1F9","#FBF1F2","#EFF2F8","#F6F4EE"];
var RUNHEAD="Can They Prove It?";
var P={
off:'<circle cx="12" cy="12" r="8.2"/>',
on:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.6" fill="#001D69" stroke="none"/>',
no:'<circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/>',
key:'<circle cx="12" cy="12" r="9"/><line x1="12" y1="7" x2="12" y2="12.6"/><line x1="12" y1="16.3" x2="12" y2="16.4"/>',
mark:'<line x1="4" y1="12" x2="18.5" y2="12"/><polyline points="13 6.5 18.5 12 13 17.5"/>',
back:'<line x1="20" y1="12" x2="5.5" y2="12"/><polyline points="11 6.5 5.5 12 11 17.5"/>',
next:'<line x1="4" y1="12" x2="18.5" y2="12"/><polyline points="13 6.5 18.5 12 13 17.5"/>'};
function ic(d,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+d+'</svg>';}
function hdr(n){return '<div class="hd"><span class="rh">'+(n>1?RUNHEAD:'')+'</span><span class="pos">'+n+' of 7</span></div>';}

var w=document.getElementById('w');
var grp=document.getElementById('grp');
var go1=document.getElementById('go1');
var slides=[document.getElementById('sl1')];
var heads=[document.getElementById('h1')];
var cards=[],picked=null,revealed=false,cur=0;
function armHead(h){if(!h){return;}h.addEventListener('blur',function(){h.classList.remove('fx');});}
var noteEl=null,noteHome=null,noteAlt=null;
function place(){
  if(!noteEl){return;}
  var host=w.classList.contains('pm')?noteAlt:noteHome;
  if(noteEl.parentNode!==host){host.appendChild(noteEl);}
}

for(var i=0;i<5;i++){(function(i){
  var c=document.createElement('div');
  c.className='card';
  c.setAttribute('role','radio');
  c.setAttribute('aria-checked','false');
  c.setAttribute('tabindex',i===0?'0':'-1');
  c.innerHTML='<div class="row"><span class="ind">'+ic(P.off)+'</span><span class="n">'+(i+1)+'</span><span class="c">'+CLAIM[i]+'</span></div>';
  grp.appendChild(c);cards.push(c);
  c.addEventListener('click',function(){sel(i);});
  c.addEventListener('keydown',function(e){key(e,i);});
})(i);}

function sel(i){
  if(revealed){return;}
  picked=i;
  for(var n=0;n<cards.length;n++){
    var on=n===i;
    cards[n].classList.toggle('sel',on);
    cards[n].setAttribute('aria-checked',on?'true':'false');
    cards[n].setAttribute('tabindex',on?'0':'-1');
    cards[n].querySelector('.ind').innerHTML=ic(on?P.on:P.off);
  }
  go1.disabled=false;
}
function key(e,i){
  if(revealed){return;}
  var k=e.key,nx=null;
  if(k===' '||k==='Enter'||k==='Spacebar'){e.preventDefault();e.stopPropagation();sel(i);return;}
  if(k==='ArrowDown'||k==='ArrowRight'){nx=(i+1)%cards.length;}
  if(k==='ArrowUp'||k==='ArrowLeft'){nx=(i+cards.length-1)%cards.length;}
  if(k==='Home'){nx=0;}
  if(k==='End'){nx=cards.length-1;}
  if(nx!==null){e.preventDefault();e.stopPropagation();sel(nx);cards[nx].focus();}
}

function mk(n,tint,bodyHtml,extraCls,leftBtn,rightBtn){
  var s=document.createElement('section');
  s.className='slide '+extraCls+' t'+n;
  s.setAttribute('role','group');
  s.setAttribute('aria-label','Slide '+n+' of 7');
  s.hidden=true;
  s.innerHTML=hdr(n)+'<div class="bd">'+bodyHtml+'</div>'+
    '<div class="ab"><div class="abl">'+leftBtn+'</div><div class="abr">'+rightBtn+'</div></div>';
  w.appendChild(s);
  slides.push(s);
  var h=s.querySelector('h1,h2');
  heads.push(h);
  armHead(h);
  return s;
}
function backBtn(){return '<button class="btn sec" type="button" data-nav="-1">'+ic(P.back)+'Back</button>';}

function pickLine(){
  if(picked===TRAP){return 'You picked 3, the one that is true. It still could not be proved, and that is the interesting case.';}
  return 'You picked '+(picked+1)+'.';
}
function claimList(){
  var h='<div class="rlist">';
  for(var i=0;i<5;i++){
    var k=(i===TRAP);
    h+='<div class="rrow'+(k?' key':'')+'">'+
      '<p class="rc"><span class="n">'+(i+1)+'</span><span class="c">'+CLAIM[i]+'</span></p>'+
      '<p class="rs"><span class="chip'+(k?' key':'')+'"><span class="ci">'+ic(k?P.key:P.no)+
      '</span>'+STATUS[i]+'</span>'+
      (i===picked?'<span class="ymark">'+ic(P.mark,'sm')+'Your pick</span>':'')+'</p></div>';
  }
  return h+'</div>';
}
function build(){
  mk(2,TINT[1],
    '<div class="vcol"><h1 tabindex="-1" role="status" aria-live="polite">None of Them</h1>'+
    '<p class="ln">Not one of the five could be proved. And nobody at Cumberland lied to you.</p>'+
    '<p class="pick">'+ic(P.mark,'sm')+'<span>'+pickLine()+'</span></p>'+
    '<p class="note">'+NOTE+'</p></div>'+
    claimList(),
    's2',backBtn(),'<button class="btn" type="button" data-nav="1">Why each one fails'+ic(P.next)+'</button>');
  for(var i=0;i<5;i++){
    var n=i+3,k=(i===TRAP);
    var right=(n===7)
      ?'<p class="end">That is the end of this activity. Go back to the module to keep reading.</p>'
      :'<button class="btn" type="button" data-nav="1">Next'+ic(P.next)+'</button>';
    mk(n,TINT[n-1],
      '<div class="hslot"><h2 tabindex="-1"><span class="hn">'+(i+1)+'</span><span>'+CLAIM[i]+'</span></h2></div>'+
      '<div class="rule"></div>'+
      '<div class="two"><div class="rail'+(k?' key':'')+'"><span class="chip'+(k?' key':'')+'">'+
      '<span class="ci">'+ic(k?P.key:P.no)+'</span>'+STATUS[i]+'</span></div>'+
      '<p class="exp">'+EXP[i]+'</p></div>',
      'se',backBtn(),right);
  }
  noteEl=slides[1].querySelector('.note');
  noteHome=noteEl.parentNode;
  noteAlt=slides[6].querySelector('.bd');
  place();
  w.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('[data-nav]'):null;
    if(b&&!b.disabled){nav(parseInt(b.getAttribute('data-nav'),10));}
  });
}

function lock(){
  grp.removeAttribute('role');
  grp.removeAttribute('aria-labelledby');
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    c.removeAttribute('role');
    c.removeAttribute('aria-checked');
    c.removeAttribute('tabindex');
    c.classList.remove('sel');
    c.classList.add('lock');
    var ind=c.querySelector('.ind');
    if(ind){ind.parentNode.removeChild(ind);}
    if(i===picked){
      var p=document.createElement('p');
      p.className='mine';
      p.innerHTML=ic(P.mark,'sm')+'Your pick';
      c.appendChild(p);
    }
  }
}

function show(i){
  slides[cur].hidden=true;
  cur=i;
  slides[cur].hidden=false;
  document.body.style.background=TINT[cur];
  for(var q=0;q<heads.length;q++){if(heads[q]){heads[q].classList.remove('fx');}}
  if(heads[cur]){heads[cur].classList.add('fx');heads[cur].focus();}
}
function nav(d){
  var t=cur+d;
  if(!revealed){return;}
  if(t<0||t>slides.length-1){return;}
  show(t);
}

go1.addEventListener('click',function(){
  if(revealed){nav(1);return;}
  if(picked===null){return;}
  revealed=true;
  lock();
  build();
  go1.innerHTML='Next'+ic(P.next);
  show(1);
});

document.addEventListener('keydown',function(e){
  if(!revealed){return;}
  if(e.key==='ArrowRight'){e.preventDefault();nav(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();nav(-1);}
});

function fit(){
  var pm=window.innerWidth<600;
  if(pm){w.classList.add('pm');}else{w.classList.remove('pm');}
  var cw=pm?480:960,ch=pm?640:540;
  var s=Math.min(window.innerWidth/cw,window.innerHeight/ch,1);
  w.style.transform='scale('+s+')';
  w.style.left=Math.max(0,(window.innerWidth-cw*s)/2)+'px';
  w.style.top=Math.max(0,(window.innerHeight-ch*s)/2)+'px';
  place();
}
window.addEventListener('resize',fit);
window.addEventListener('load',fit);
armHead(heads[0]);
document.body.style.background=TINT[0];
fit();
}());
</script>
</body>
</html>
