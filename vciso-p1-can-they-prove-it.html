<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can They Prove It?</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: #FDF8F8;
  color: #484646;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  overflow-x: hidden;
}
main {
  max-width: 700px;
  margin: 0 auto;
  padding: 28px 18px 48px;
}
h1 {
  color: #1C1B1B;
  font-size: 1.44rem;
  font-weight: 700;
  line-height: 1.25;
  margin: 0 0 14px;
}
.prompt {
  color: #1C1B1B;
  font-size: 1.22rem;
  font-weight: 600;
  line-height: 1.35;
  margin: 0 0 8px;
}
.sub {
  color: #484646;
  font-size: 0.95rem;
  line-height: 1.45;
  margin: 0 0 24px;
}
.banner {
  background: #DCE1FF;
  color: #001D69;
  padding: 16px 18px;
  border-radius: 10px;
  margin: 0 0 22px;
}
.banner:empty { display: none; }
.banner:focus-visible { outline: 3px solid #001D69; outline-offset: 3px; }
.banner .hl {
  font-size: 1.18rem;
  font-weight: 700;
  line-height: 1.35;
  margin: 0;
}
.banner .ln {
  font-size: 1rem;
  font-weight: 500;
  line-height: 1.45;
  margin: 8px 0 0;
}
.group { display: flex; flex-direction: column; gap: 12px; }
.card {
  background: #FDF8F8;
  border: 1px solid #484646;
  border-radius: 10px;
  padding: 14px 16px;
  cursor: pointer;
  transition: background 120ms linear, box-shadow 120ms linear;
}
.card[role="radio"]:focus-visible { outline: 3px solid #001D69; outline-offset: 3px; }
.card.sel {
  background: #DCE1FF;
  box-shadow: inset 0 0 0 2px #001D69;
}
.card.done { cursor: default; }
.card.trap {
  background: #DCE1FF;
  box-shadow: inset 7px 0 0 0 #001D69;
  padding-left: 22px;
}
.row { display: flex; align-items: flex-start; gap: 10px; }
.ind { flex: 0 0 auto; line-height: 0; padding-top: 3px; }
.num {
  flex: 0 0 auto;
  color: #001D69;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  min-width: 1.1em;
}
.claim { color: #1C1B1B; font-weight: 500; }
.card.sel .claim, .card.trap .claim { color: #001D69; }
svg.ic {
  width: 20px;
  height: 20px;
  display: block;
  fill: none;
  stroke: #001D69;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
svg.ic.sm { width: 16px; height: 16px; }
.ann {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px;
  margin: 10px 0 0;
  padding-left: 30px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #001D69;
  font-size: 0.9rem;
  font-weight: 700;
  border: 1px solid #001D69;
  border-radius: 999px;
  padding: 2px 11px 2px 8px;
}
.pick {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #484646;
  font-size: 0.84rem;
  font-weight: 400;
  margin: 8px 0 0;
  padding-left: 30px;
}
button {
  font: inherit;
  font-weight: 600;
  color: #FDF8F8;
  background: #001D69;
  border: 2px solid #001D69;
  border-radius: 8px;
  padding: 11px 26px;
  margin-top: 22px;
  cursor: pointer;
  text-align: left;
}
button:disabled {
  color: #484646;
  background: #FDF8F8;
  border-color: #484646;
  cursor: default;
}
button:focus-visible { outline: 3px solid #001D69; outline-offset: 3px; }
#stage3[hidden] { display: none; }
#stage3 { margin-top: 30px; }
.note {
  background: #DCE1FF;
  color: #001D69;
  border-left: 4px solid #001D69;
  border-radius: 0 10px 10px 0;
  padding: 14px 18px;
  margin: 0 0 28px;
}
.note:focus-visible { outline: 3px solid #001D69; outline-offset: 3px; }
.exp { margin: 0 0 26px; }
.exp:last-child { margin-bottom: 0; }
.exp h2 {
  color: #1C1B1B;
  font-size: 1.06rem;
  font-weight: 600;
  line-height: 1.35;
  margin: 0 0 6px;
}
.exp h2 .num { display: inline-block; margin-right: 6px; }
.exp p { margin: 0; }
.exp.key {
  border-left: 4px solid #001D69;
  padding-left: 16px;
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
@media (max-width: 420px) {
  body { font-size: 16px; }
  main { padding: 20px 14px 40px; }
  .ann, .pick { padding-left: 0; }
  button { width: 100%; text-align: center; }
}
</style>
</head>
<body>
<main>
  <h1>Can They Prove It?</h1>

  <p class="prompt" id="prompt">Five things Cumberland Claims Services says about itself. Which one do you think they could prove?</p>
  <p class="sub">You have not seen their paperwork yet. Go on instinct.</p>

  <div class="banner" id="banner" role="status" aria-live="polite" tabindex="-1"></div>

  <div class="group" id="group" role="radiogroup" aria-labelledby="prompt"></div>

  <button id="check" type="button" disabled>Check</button>
  <div id="cont"></div>

  <section id="stage3" hidden aria-hidden="true"></section>
</main>

<script>
(function () {
  var CLAIMS = [
    "&ldquo;We know what systems we run.&rdquo;",
    "&ldquo;We patch our systems regularly.&rdquo;",
    "&ldquo;We review our firewall settings every quarter.&rdquo;",
    "&ldquo;Only authorized staff can reach patient data.&rdquo;",
    "&ldquo;Our staff are trained on security.&rdquo;"
  ];

  var CHIP = [
    "Not provable",
    "Not provable",
    "True. Still not provable",
    "Not provable",
    "Not provable"
  ];

  var NOTE = "Some words here will be new. That is expected, and nothing is being tested. This is a tour of what is going on inside the company, and every idea on this screen comes back later with much more room. Read for the shape of the problem: honest people, real work, and almost nothing written down.";

  var EXP = [
    "Not provable. Two lists of what the company owns exist, and they do not match. One is Nate&rsquo;s, the systems administrator: 19 rows of servers and software, kept since 2019, with names typed differently in different rows and a column he stopped filling in halfway down. The other belongs to finance: 15 rows, kept for contract renewals, so it lists anything that costs money and nothing that does not. The two disagree in six places, and nobody has ever sat down and compared them. So the company has two answers to what it owns, which is the same as having none.",
    "Not provable. A patch is a fix a manufacturer sends out when it finds a hole in its own product. They keep arriving, week after week, so patching is something you do continuously, not once. What Cumberland has is one scan, an automated check that goes through the machines and reports which fixes are missing. It was run by an outside company, four months ago. One scan shows one afternoon. It does not show a habit.",
    "True, and still not provable. A firewall is the gate between the company&rsquo;s network and the internet, and its settings are the list of rules about what is allowed through. Reviewing them means checking that list is still right, because a rule that made sense two years ago can quietly leave a door open today. Those reviews really happened, twice in 2024. Nobody wrote down when, who did it, or what changed. So there is nothing to hand Meridian. This is the one worth remembering: real work that left no trace counts as nothing to an outsider.",
    "Not provable. Patient data sits in systems people log into, and the claim is that only the right people can get in. To check it you would need a list of who is allowed. Cumberland cannot produce one. So nobody can show this is true, and nobody can show it is false either. A claim that cannot be tested is not proof, and no customer accepts it.",
    "Not provable. A security training deck sits on the intranet, the company&rsquo;s internal website. That proves a deck exists. Training is what people did with it, and no record says anyone ever opened it."
  ];

  var TRAP = 2;

  var ICON = {
    off: '<circle cx="12" cy="12" r="8"/>',
    on: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
    no: '<circle cx="12" cy="12" r="9"/><line x1="5.7" y1="5.7" x2="18.3" y2="18.3"/>',
    flag: '<circle cx="12" cy="12" r="9"/><line x1="12" y1="7.2" x2="12" y2="12.8"/><line x1="12" y1="16.2" x2="12" y2="16.4"/>',
    pick: '<line x1="4" y1="12" x2="19" y2="12"/><polyline points="13.5 6.5 19 12 13.5 17.5"/>'
  };

  function svg(paths, extra) {
    return '<svg class="ic' + (extra ? ' ' + extra : '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + paths + '</svg>';
  }

  var group = document.getElementById("group");
  var banner = document.getElementById("banner");
  var check = document.getElementById("check");
  var cont = document.getElementById("cont");
  var stage3 = document.getElementById("stage3");
  var cards = [];
  var picked = null;
  var revealed = false;

  CLAIMS.forEach(function (text, i) {
    var card = document.createElement("div");
    card.className = "card";
    card.setAttribute("role", "radio");
    card.setAttribute("aria-checked", "false");
    card.setAttribute("tabindex", i === 0 ? "0" : "-1");
    card.innerHTML =
      '<div class="row">' +
        '<span class="ind">' + svg(ICON.off) + "</span>" +
        '<span class="num">' + (i + 1) + "</span>" +
        '<span class="claim">' + text + "</span>" +
      "</div>";
    group.appendChild(card);
    cards.push(card);

    card.addEventListener("click", function () { select(i); });
    card.addEventListener("keydown", function (e) { onKey(e, i); });
  });

  function select(i) {
    if (revealed) { return; }
    picked = i;
    cards.forEach(function (c, n) {
      var on = n === i;
      c.classList.toggle("sel", on);
      c.setAttribute("aria-checked", on ? "true" : "false");
      c.setAttribute("tabindex", on ? "0" : "-1");
      c.querySelector(".ind").innerHTML = svg(on ? ICON.on : ICON.off);
    });
    check.disabled = false;
  }

  function move(i) {
    select(i);
    cards[i].focus();
  }

  function onKey(e, i) {
    if (revealed) { return; }
    var k = e.key;
    if (k === " " || k === "Enter" || k === "Spacebar") {
      e.preventDefault();
      select(i);
      return;
    }
    var next = null;
    if (k === "ArrowDown" || k === "ArrowRight") { next = (i + 1) % cards.length; }
    if (k === "ArrowUp" || k === "ArrowLeft") { next = (i + cards.length - 1) % cards.length; }
    if (k === "Home") { next = 0; }
    if (k === "End") { next = cards.length - 1; }
    if (next !== null) {
      e.preventDefault();
      move(next);
    }
  }

  function openStage3() {
    var html = '<p class="note" id="note" tabindex="-1">' + NOTE + "</p>";
    EXP.forEach(function (text, i) {
      html +=
        '<div class="exp' + (i === TRAP ? " key" : "") + '">' +
          "<h2>" + '<span class="num">' + (i + 1) + "</span>" + CLAIMS[i] + "</h2>" +
          "<p>" + text + "</p>" +
        "</div>";
    });
    stage3.innerHTML = html;
    stage3.removeAttribute("aria-hidden");
    stage3.removeAttribute("hidden");
    document.getElementById("note").focus();
  }

  check.addEventListener("click", function () {
    if (revealed || picked === null) { return; }
    revealed = true;

    group.removeAttribute("role");
    group.removeAttribute("aria-labelledby");

    cards.forEach(function (c, i) {
      c.removeAttribute("role");
      c.removeAttribute("aria-checked");
      c.removeAttribute("tabindex");
      c.classList.remove("sel");
      c.classList.add("done");
      c.querySelector(".ind").remove();
      if (i === TRAP) { c.classList.add("trap"); }

      var ann = document.createElement("p");
      ann.className = "ann";
      ann.innerHTML =
        '<span class="chip">' + svg(i === TRAP ? ICON.flag : ICON.no) + CHIP[i] + "</span>";
      c.appendChild(ann);

      if (i === picked) {
        var p = document.createElement("p");
        p.className = "pick";
        p.innerHTML = svg(ICON.pick, "sm") + "Your pick";
        c.appendChild(p);
      }
    });

    banner.innerHTML =
      '<p class="hl">None of them.</p>' +
      '<p class="ln">Not one of the five could be proved. And nobody at Cumberland lied to you.</p>';

    check.remove();

    var next = document.createElement("button");
    next.type = "button";
    next.id = "more";
    next.textContent = "Now read why each one fails";
    next.addEventListener("click", function () {
      next.remove();
      openStage3();
    });
    cont.appendChild(next);

    banner.focus();
  });
}());
</script>
</body>
</html>
