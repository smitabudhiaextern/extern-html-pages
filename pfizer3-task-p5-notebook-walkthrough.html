<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notebook Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Text&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: same lesson player as the Template B explorer. Section rail on top, one card on a tinted stage, Back and Next below.
   Each card is one notebook cell: press Run to see what it really printed in the team's reference run. */
:root{
  --bg:#FFFFFF;
  --stage:#FAFAFA;
  --surface:#FFFFFF;
  --text:#000000;
  --text-2:#666666;
  --purple:#3D1FBC;
  --action:#2550D0;
  --action-hover:#14369C;
  --on-action:#FFFFFF;
  --tint:#E5E0FA;
  --tint-2:#D2CAF5;
  --note-bg:#F3F0FD;
  --note-line:#D2CAF5;
  --warm:#FDF8F8;
  --warm-line:#F0E4E4;
  --line:#DDDDDD;
  --line-soft:#EEEEEE;
  --line-strong:#C9C6C5;
  --icode-bg:#EFEBFC;
  --icode-text:#2A1590;
  --code-bg:#17142C;
  --code-head:#1F1B3A;
  --code-line:#2E2954;
  --code-text:#ECE9FF;
  --code-muted:#9590B5;
  --code-str:#AFC0FF;
  --code-btn:#2A2550;
  --focus:#2550D0;
  --end-bg:#EEF0FF;
  --end-text:#4D5380;
  --f-display:"DM Serif Text", Georgia, "Times New Roman", serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line-soft);padding:9px 16px 7px}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:5px;background:none;border:0;padding:3px 2px 1px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.pg i{display:block;height:4px;border-radius:2px;background:var(--line)}
.pg.is-done i{background:var(--purple)}
.pg.is-cur i{background:var(--purple);height:6px;margin:-1px 0}
.pg-label{font-size:12px;font-weight:500;line-height:1.2;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--purple)}
.pg.is-cur .pg-label{color:var(--text);font-weight:600}
@media (max-width:559.98px){ .pg-label{display:none} }

/* Stage and card */
.stage{flex:1 1 auto;min-height:0;background:var(--stage);padding:12px 16px;display:flex}
.card{flex:1;min-width:0;min-height:0;overflow-y:auto;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:clamp(16px, 2.6vh, 28px) clamp(16px, 3.2vw, 36px)}
.inner{display:flex;flex-direction:column;gap:14px;max-width:900px;margin:0 auto}
.kicker{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--purple)}
.title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(23px, 1.5vw + 15px, 32px);line-height:1.12;text-wrap:balance}
.p{margin:0;font-size:clamp(14.5px, 0.4vw + 12.5px, 16.5px);line-height:1.58;text-wrap:pretty}
code{font-family:var(--f-mono);font-size:.86em;background:var(--icode-bg);color:var(--icode-text);padding:0 .3em;border-radius:5px;overflow-wrap:anywhere}

/* Colab-style cell */
.cell{border-radius:12px;overflow:hidden;background:var(--code-bg);color:var(--code-text);border:1px solid var(--code-line)}
.cell-head{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 14px;background:var(--code-head);border-bottom:1px solid var(--code-line)}
.cell-name{flex:1;min-width:0;font-size:12px;font-weight:500;color:var(--code-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--action);background:var(--action);color:var(--on-action);border-radius:999px;padding:5px 14px 5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.run:hover{background:var(--action-hover);border-color:var(--action-hover)}
.run svg{width:12px;height:12px}
.run.ran{background:var(--code-btn);border-color:var(--code-line);color:var(--code-str)}
.cell pre{margin:0;padding:12px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;white-space:pre}
.out{border-top:1px dashed var(--code-line);background:#100E20}
.out-label{padding:8px 14px 0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--code-muted)}
.out pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#DCD7FF}
.out.placeholder pre{color:#DCD7FF}
/* Shared placeholder style, same as the Task pages */
.ph{background:var(--note-bg);border:1px dashed var(--note-line);border-radius:5px;padding:0 4px;color:var(--text);white-space:normal}
.scroll-hint{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;font-weight:500;color:var(--purple)}
.scroll-hint svg{width:14px;height:14px}
.scroll-hint[hidden]{display:none}

/* Notes */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--note-bg);border:1px solid var(--note-line);font-size:14.5px;line-height:1.5}
.note svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--purple)}
.note.warm{background:var(--warm);border-color:var(--warm-line)}

/* Choice tiles */
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:720px){ .tiles{grid-template-columns:repeat(3,minmax(0,1fr))} }
.tile{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.15}
.tile .where{font-size:12px;font-weight:600;color:var(--purple)}
.tile p{margin:0;font-size:14px;line-height:1.5}

/* Foot */
.foot{flex:none;border-top:1px solid var(--line-soft);padding:8px 16px;display:flex;align-items:center;gap:12px}
.btn-back{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:7px 16px 7px 12px;font-size:14px;font-weight:500;cursor:pointer}
.btn-back:disabled{opacity:.4;cursor:default}
.btn-back svg,.btn-next svg{width:15px;height:15px}
.count{flex:1;min-width:0;text-align:center;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.btn-next{display:inline-flex;align-items:center;gap:8px;background:var(--action);color:var(--on-action);border:1px solid var(--action);border-radius:999px;padding:7px 16px 7px 20px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-next:hover:not(:disabled){background:var(--action-hover)}
.btn-next:disabled{opacity:.45;cursor:default}
.btn-next.end{background:var(--end-bg);border-color:var(--end-bg);color:var(--end-text);cursor:default;white-space:normal;text-align:center;flex:1 1 auto;justify-content:center}
.btn-next.end ~ .count,.count:has(+ .btn-next.end){display:none}
@media (max-width:559.98px){ .count{display:none} .foot{justify-content:space-between} }
@media (prefers-reduced-motion:no-preference){ .inner{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app">
  <h1 class="sr-only">Step through the RAG notebook</h1>
  <header class="top"><nav class="rail" id="rail" aria-label="Notebook cells"></nav></header>
  <main class="stage"><section class="card" id="card" aria-live="polite"></section></main>
  <footer class="foot">
    <button type="button" class="btn-back" id="back"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 10H4.5M9 5l-5 5 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="count" id="count">Card 1 of 7</div>
    <button type="button" class="btn-next" id="next"><span id="next-label">Next</span><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h11.5M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var INFO = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.25" stroke="currentColor" stroke-width="1.5"/><path d="M10 9v4.5M10 6.5v.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  var DOWN = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v9.5M4 8.5l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var PLAY = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.8v8.4a.6.6 0 0 0 .9.5l6.6-4.2a.6.6 0 0 0 0-1L3.9 1.3a.6.6 0 0 0-.9.5Z" fill="currentColor"/></svg>';

  /* Every output below is copied from the team's real run of the reference notebook (22 Oct 2026),
     except the Prompt 2 card, which is a marked placeholder. */
  var CARDS = [
    { rail: "Install", kicker: "STEP 0", title: "Install the Tools",
      p: "This cell installs PyMuPDF (reads the PDF), LlamaIndex (runs the pipeline) and the embedding and reranking tools. It takes a few minutes the first time.",
      code: "!pip install -q llama-index==0.14.25 llama-index-llms-google-genai==0.11.3 pymupdf\n!pip install -q llama-index-embeddings-huggingface==0.8.0\n!pip install -q nest_asyncio\n!pip install -q llama-index-retrievers-bm25==0.8.0\n!pip install -q sentence-transformers",
      out: "68.9/68.9 MB 11.8 MB/s eta 0:00:00\n11.9/11.9 MB 47.7 MB/s eta 0:00:00\n1.7/1.7 MB 39.1 MB/s eta 0:00:00\n...",
      note: "Red lines that say <code>ERROR: pip's dependency resolver</code> and name <code>google-adk</code>, <code>opentelemetry</code> or <code>jedi</code> are fine. Keep going." },
    { rail: "Key", kicker: "STEP 1", title: "Connect Your Gemini Key",
      p: "This cell reads your key from Colab Secrets, so the key never sits in your code. It also turns on <code>nest_asyncio</code>, which lets Gemini answer inside Colab.",
      code: "import nest_asyncio\nnest_asyncio.apply()\n\nfrom google.colab import userdata\nos.environ[\"GOOGLE_API_KEY\"] = userdata.get('GEMINI_API_KEY')",
      out: "FutureWarning: The `fitz` API is deprecated and will be removed in future. Use `import pymupdf` instead.",
      note: "That warning is fine. The first time, Colab may ask to let this notebook use your secret. Choose <b>Grant access</b>." },
    { rail: "Upload", kicker: "STEP 3", title: "Upload the Sample SDF",
      p: "A file picker opens under the cell. Choose the sample SDF you downloaded. Run all waits here until you do.",
      code: "pdf_path = upload_pdf()",
      out: "Please select a PDF file to upload:\nSaving sample-sdf-document (Project 5).pdf to sample-sdf-document (Project 5).pdf\nPDF saved to sample_docs/sample-sdf-document (Project 5).pdf" },
    { rail: "Index", kicker: "STEPS 5, 7 AND 9", title: "Read the PDF and Build the Index",
      p: "PyMuPDF pulls out the text. Then LlamaIndex turns each piece into an embedding (a list of numbers that captures its meaning) and stores it in an index, a search table it can look things up in.",
      code: "text = extract_text_from_pdf(pdf_path)      # STEP 5\npdf_docs = load_pdf_with_pymupdf(pdf_path)  # STEP 7\nindex = process_and_index_pdf(pdf_path)     # STEP 9",
      out: "Number of pages: 3\nExtracted 617 words from the PDF.\n...\nExtracted 3 pages with content\nIndexed 3 document chunks",
      note: "3 pages became 3 chunks, so this notebook uses one chunk per page. That's a chunking choice you can change." },
    { rail: "Choices", kicker: "YOUR THREE CHOICES", title: "Find the Three Settings You'll Explain",
      p: "These are the three choices you write about in your Google Doc. Keep them as they are or change one to experiment. Either way, say why.",
      tiles: [
        ["Embedding model", "STEP 8", "<code>sentence-transformers/all-MiniLM-L6-v2</code> turns each chunk into numbers that capture its meaning."],
        ["Chunking strategy", "STEP 6", "One chunk per page. Chunking means cutting the document into pieces the pipeline can search."],
        ["Retrieval method", "STEP 20", "Hybrid: vector search (matches meaning) plus BM25 keyword search (matches exact words), then a reranker re-sorts the best pieces."]
      ] },
    { rail: "Prompt 1", kicker: "STEP 21", title: "Ask Prompt 1",
      p: "Now the whole pipeline runs: it finds the best chunks, then Gemini answers from them. Here is the answer the team got.",
      code: "rag_engine = build_rag_pipeline(index)\nresponse = rag_engine.query(\"What test methods were used for quality control?\")\nprint(response)",
      out: "For the AKTA ready Low Flow Kit, the test methods used for quality control include the following:\n\n* **Autoclave - Pump tubing:** 121C > 15 min\n* **Gamma Irradiation - Inlets:** 25.0 - 40.0 kGy\n* **Flow Rate Test:** Per SOP-QC-042\n* **Pressure Integrity:** Max 0.5 bar, 5 min hold\n* **Visual Inspection:** No defects visible\n* **Package Integrity:** Sealed, no damage\n\nFor the ÄKTA ready Gradient Flow Section With Inlets, the quality control methods include:\n* **Autoclave (Pump tubing):** 121°C > 15 min\n* **Gamma Irradiation (Inlets):** 25.0 – 40.0 kGy",
      answer: true,
      note: "Gemini words its answer a little differently each run. Yours should name the same test methods." },
    { rail: "Prompt 2", kicker: "STEP 21, AGAIN", title: "Ask Prompt 2",
      p: "Change the question in STEP 21 to Prompt 2 and run the cell again. Then paste both answers into your Google Doc.",
      code: "response = rag_engine.query(\"What are the storage conditions specified in the certificate?\")\nprint(response)",
      out: "[Real answer to be pasted after a test run]",
      placeholder: true, answer: true,
      note: "Check your answer against the certificate itself. Page 1 gives the recommended storage temperature." }
  ];

  var i = 0, ran = {};
  var rail = document.getElementById("rail"), card = document.getElementById("card");
  var back = document.getElementById("back"), next = document.getElementById("next");
  var nextLabel = document.getElementById("next-label"), count = document.getElementById("count");

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  CARDS.forEach(function (c, n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.innerHTML = "<i></i><span class=\"pg-label\">" + c.rail + "</span>";
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + c.title);
    b.addEventListener("click", function () { i = n; render(); });
    rail.appendChild(b);
  });

  function render(justRan) {
    var c = CARDS[i], h = '<div class="inner">';
    h += '<p class="kicker">' + c.kicker + '</p><h2 class="title">' + c.title + '</h2><p class="p">' + c.p + '</p>';
    if (c.answer && ran[i]) h += '<p class="scroll-hint" id="scroll-hint" hidden>' + DOWN + 'Scroll down to see the answer</p>';
    if (c.code) {
      h += '<div class="cell"><div class="cell-head"><span class="cell-name">' + c.kicker + '</span>' +
           '<button type="button" class="run' + (ran[i] ? ' ran' : '') + '" id="run">' + PLAY + (ran[i] ? 'Ran' : 'Run') + '</button></div>' +
           '<pre>' + esc(c.code) + '</pre>';
      if (ran[i]) h += '<div class="out' + (c.placeholder ? ' placeholder' : '') + '"><div class="out-label">' + (c.placeholder ? 'Output (placeholder)' : 'What it printed') + '</div><pre>' + (c.placeholder ? '<span class="ph">' + esc(c.out) + '</span>' : esc(c.out)) + '</pre></div>';
      h += '</div>';
    }
    if (c.tiles) {
      h += '<div class="tiles">' + c.tiles.map(function (t) { return '<div class="tile"><span class="where">' + t[1] + '</span><b>' + t[0] + '</b><p>' + t[2] + '</p></div>'; }).join("") + '</div>';
    }
    if (c.note && (!c.code || ran[i])) h += '<div class="note">' + INFO + '<span>' + c.note + '</span></div>';
    card.innerHTML = h + '</div>';
    card.scrollTop = 0;
    var r = document.getElementById("run");
    if (r) r.addEventListener("click", function () { ran[i] = true; render(true); });
    var out = card.querySelector(".out");
    if (out) {
      var cr = card.getBoundingClientRect(), or = out.getBoundingClientRect();
      var hidden = or.bottom > cr.bottom;
      var hint = document.getElementById("scroll-hint");
      if (hint && hidden) hint.hidden = false;
      if (justRan && hidden) {
        or = out.getBoundingClientRect();
        var top = card.scrollTop + or.top - cr.top - 12;
        if (card.scrollTo) card.scrollTo({ top: top, behavior: REDUCE ? "auto" : "smooth" }); else card.scrollTop = top;
      }
    }

    Array.prototype.forEach.call(rail.children, function (b, n) {
      b.className = "pg" + (n === i ? " is-cur" : (n < i || ran[n] ? " is-done" : ""));
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    count.textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    next.classList.toggle("end", last);
    next.querySelector("svg").style.display = last ? "none" : "";
    nextLabel.textContent = last ? "Now paste both answers in your Doc" : (c.code && !ran[i] ? "Press Run first" : "Next");
    next.disabled = last ? false : (c.code && !ran[i]);
  }

  back.addEventListener("click", function () { if (i > 0) { i--; render(); } });
  next.addEventListener("click", function () { if (i < CARDS.length - 1 && !(CARDS[i].code && !ran[i])) { i++; render(); } });
  render();
})();
</script>
</body>
</html>
