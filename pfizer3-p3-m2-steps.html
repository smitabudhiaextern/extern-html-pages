<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P3 Notebook Setup Steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap">
<style>
/* Structure: copied from the approved P1 steps deck (06-content/project-01/pfizer3-p1-task-steps.html).
   Code blocks and Copy buttons: copied from the P1 m3 decks (pfizer3-p1-m3-how-ai-reads.html, pfizer3-p1-m3-try.html).
   Look: Pfizer x Extern Core, Light format. Every colour, size, radius and font below comes from design-system/tokens.json.
   Content: P3 module 2, "Follow the Steps Below", Steps 1 to 4, word for word from the page.
   Fixed stage: the whole deck is laid out on one 760 x 720 design stage that scales as a single piece to fit
   the embed frame, so nothing ever scrolls and Back and Next sit in the same place on every slide. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* The design stage: 760 x 720, scaled and centred by the script at the end */
.app{position:absolute;left:50%;top:50%;width:760px;height:720px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: step rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:13px;font-weight:500;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Slide area and slide */
.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}
.inner{display:flex;flex-direction:column;gap:var(--space-3);width:100%}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding-bottom:3px;color:var(--ink);text-wrap:balance}
.hl{color:var(--highlight)}
.p{margin:0;font-size:15px;line-height:22px;color:var(--ink);text-wrap:pretty}
.p b{font-weight:600}
.p code{font-family:var(--font-mono);font-size:.92em;white-space:nowrap;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}

/* Buttons (design system Button, Light) */
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* Run card: the code to paste, with a Copy button, and the real output under it */
.run{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px 6px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:12px 14px;font-family:var(--font-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out{border-color:var(--blue-200)}
.run.out pre{background:var(--surface-card)}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:6px 12px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:22px;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.foot .btn{padding:10px 16px;font-size:15px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app">
  <h1 class="sr-only">Get the Supplier File into Your Notebook: The Steps</h1>
  <header class="top">
    <nav class="rail" id="rail" aria-label="Steps"></nav>
    <div class="where"><b id="where-section">Step 1</b><span aria-hidden="true">&middot;</span><span id="where-count">Slide 1 of 5</span></div>
  </header>
  <main class="stage" aria-label="Slide"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-secondary" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-primary" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<!-- Slide bodies. The text is the page's Steps 1 to 4, word for word. -->
<template id="s1">
  <p class="p">Open the team's Colab notebook. If Google asks you to sign in, use your Google account. You need to be signed in to run anything in Colab.</p>
  <div class="links">{{OPEN:NOTEBOOK:Python Libraries for Data Extraction (Colab notebook)}}</div>
  <p class="p">Then click <b>File → Save a copy in Drive</b>. Colab opens your own copy in a new tab, with "Copy of" at the start of its name. Work in that copy from now on, so your changes are saved.</p>
</template>

<template id="s2">
  <p class="p">You already know what a library is. This cell installs the three you need, because Colab doesn't come with the three libraries that read PDFs: PyMuPDF, pypdf and pdfplumber.</p>
  <p class="p">Find the install cell in your copy, or paste this into a new code cell, and press <b>Run</b> (the round play button on the left of the cell):</p>
  {{CODE:python:!pip install pymupdf pypdf pdfplumber}}
  <p class="p"><code>pip</code> is Python's tool for installing libraries. The <code>!</code> at the start tells Colab to run this line as a command, not as Python code. PyMuPDF is installed under the name <code>pymupdf</code>.</p>
  <p class="p">Lines of text scroll past while Colab downloads each library. Wait until the cell stops running. The last line should start with <b>Successfully installed</b> and name the libraries it added. If a library was already there, you'll see <b>Requirement already satisfied</b> for it instead, which is fine too. You may also see red text about other packages, such as gradio, just above the last line. That's okay, as long as the last line starts with <b>Successfully installed</b>.</p>
</template>

<template id="s3">
  <p class="p">First, get the supplier file onto your computer. Open it in Google Drive and click the <b>Download</b> button (the arrow pointing down, in the toolbar at the top left).</p>
  <div class="links">{{OPEN:FILE:The Supplier File (sample-sdf-document.pdf)}}</div>
</template>

<template id="s3b">
  <p class="p">Next, find the upload cell in your notebook, or paste this into a new code cell, and press <b>Run</b>:</p>
  {{CODE:python:from google.colab import files
uploaded = files.upload()}}
  <p class="p">The first line brings in Colab's own tool for moving files. The second line opens an upload box under the cell. Click <b>Choose Files</b>, pick <code>sample-sdf-document.pdf</code> from your computer (it's usually in your Downloads folder), and wait.</p>
  <p class="p">When the upload finishes, Colab prints this line under the cell:</p>
  {{CODE:plain:Saving sample-sdf-document.pdf to sample-sdf-document.pdf}}
  <p class="p">Check that the second file name is exactly <code>sample-sdf-document.pdf</code>.</p>
</template>

<template id="s4">
  <p class="p">Now check that the file is in your notebook. Find the cell that starts with <code># Check file directory</code>, or paste this into a new code cell, and press <b>Run</b>:</p>
  {{CODE:python:import os
print(os.listdir())}}
  <p class="p"><code>os</code> is a library that comes with Python, so you don't need to install it. It lets your code look at the folders and files on the computer your notebook runs on. <code>os.listdir()</code> lists every file and folder in the current folder, and <code>print</code> shows that list under the cell.</p>
  <p class="p">You'll see a list inside square brackets, with each name in quotes. Look for <code>'sample-sdf-document.pdf'</code> in that list. You'll see a few other names too, such as <code>'sample_data'</code>, a folder Colab adds to every notebook, and <code>'.config'</code>, a folder where Colab keeps its own settings. You can ignore those. If you run this cell before the upload, those are the only names you'll see.</p>
</template>

<script>
(function () {
  "use strict";
  var IC_OPEN = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  var IC_COPY = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5V3.3c0-.7-.6-1.3-1.3-1.3H3.8c-.7 0-1.3.6-1.3 1.3v5.4c0 .7.6 1.3 1.3 1.3H4" stroke="currentColor" stroke-width="1.4"/></svg>';
  var LINKS = {
    NOTEBOOK: "https://colab.research.google.com/drive/1D04hOCPVNZRou-17tor4ym4w4i8r0wi6",
    FILE: "https://drive.google.com/file/d/1oOR50D8F3Deask7aT2HbXQZhw0u1hvcg/view"
  };
  var LANG = { python: "Python", plain: "Output" };

  function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function openBtn(url, label) { return '<a class="btn btn-secondary" href="' + url + '" target="_blank" rel="noopener noreferrer">' + IC_OPEN + '<span>' + label + '</span><span class="sr-only"> (opens in a new tab)</span></a>'; }
  function codeBlock(lang, text) {
    return '<figure class="run' + (lang === "plain" ? ' out' : '') + '" style="margin:0"><div class="code-head"><span class="code-lang">' + LANG[lang] + '</span>' +
      (lang === "plain" ? '' : '<button type="button" class="copy" data-copy aria-label="Copy ' + LANG[lang] + ' code">' + IC_COPY + '<span>Copy</span></button>') + '</div>' +
      '<pre tabindex="0"><code>' + esc(text) + '</code></pre></figure>';
  }
  /* Fill the {{...}} markers in a slide template with buttons and code blocks */
  function body(id) {
    return document.getElementById(id).innerHTML
      .replace(/\{\{OPEN:(\w+):([^}]*)\}\}/g, function (m, k, label) { return openBtn(LINKS[k], label); })
      .replace(/\{\{CODE:(\w+):([\s\S]*?)\}\}/g, function (m, lang, text) { return codeBlock(lang, text.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")); });
  }

  var GROUPS = ["Step 1", "Step 2", "Step 3", "Step 4"];
  var SLIDES = [
    { group: "Step 1", label: "STEP 1", title: 'Open the <span class="hl">Notebook</span>', plain: "Step 1. Open the Notebook", tpl: "s1" },
    { group: "Step 2", label: "STEP 2", title: 'Install the Three <span class="hl">Tools</span>', plain: "Step 2. Install the Three Tools", tpl: "s2" },
    { group: "Step 3", label: "STEP 3 &middot; PART 1 OF 2", title: 'Download and Upload the Supplier <span class="hl">File</span>', plain: "Step 3. Download and Upload the Supplier File", tpl: "s3" },
    { group: "Step 3", label: "STEP 3 &middot; PART 2 OF 2", title: 'Download and Upload the Supplier <span class="hl">File</span>', plain: "Step 3. Download and Upload the Supplier File (Part 2 of 2)", tpl: "s3b" },
    { group: "Step 4", label: "STEP 4", title: 'Check the <span class="hl">File</span> Is There', plain: "Step 4. Check the File Is There", tpl: "s4" }
  ];
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of this reading.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  /* The fixed stage: lay out at 760 x 720, then scale the whole deck to fit the frame and centre it. */
  var STAGE_W = 760, STAGE_H = 720;
  function scaleStage() {
    var k = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", g.name + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + g.name + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + body(s.tpl) + '</div>';
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });

    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  /* Left and Right arrow keys move between slides */
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", scaleStage);
  scaleStage();
  render(false);
})();
</script>
</body>
</html>
