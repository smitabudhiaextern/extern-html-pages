<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* P7 Step 2 module 7, "Try It Yourself": the nb4 student copy "Improve Query Routing" (Drive 1Hka0dNNcuY6ifHMuikgmbrQG8jsQUkKU,
   a copy of Chaitanya's 1Y8GfAVF... with pins, an upload cell, 30 s / 60 s waits and one label spelling), all 14 code cells
   word for word from b1-notebooks/nb4-student.ipynb (his comments keep their own dashes, inside code only). Built 28 November
   2026 by steps_build.py (scratchpad p7/p7-m7). Shell copied unchanged from pfizer3-p6-m6-steps.html. Outputs: real Run all
   of that copy, b1-notebook-and-runs.md section 8.nb4, screenshots b1-shots/nb4-cell-*.png cropped to images/pfizer3-p7-m7-run-*.png.
   His 54a1 page text (I-S1, I-S2, I-S4, I-S5, I6) sits on the matching slides.
   Fixed stage 760 x 1140 (frames under 560 px wide: 450 x 1256), scaled as one piece so nothing scrolls.
   Look: Pfizer x Extern Core, Light format; every color, size, radius and font comes from design-system/tokens.json. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-600);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* The design stage, scaled and centred by the script at the end */
.app{position:absolute;left:50%;top:50%;width:760px;height:1140px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: step rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:13px;font-weight:500;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}
.narrow .top{grid-template-columns:minmax(0,1fr);row-gap:8px}
.narrow .where{order:0}
.narrow .pg-word{display:none}
.narrow .pg.pg-fit{flex:none}

/* Slide area and slide */
.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}
.narrow .stage{padding:10px 0}
.narrow .card{padding:18px 16px;border-left:0;border-right:0;border-radius:0}
.inner{flex:none;display:flex;flex-direction:column;gap:var(--space-3);width:100%}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding-bottom:3px;color:var(--ink);text-wrap:balance}
.narrow .title{font-size:28px;line-height:34px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:15px;line-height:22px;color:var(--ink);text-wrap:pretty}
.p b{font-weight:600}
.p code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.p code.nw,.list code.nw{white-space:nowrap}
.list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:22px;text-wrap:pretty}
.list b{font-weight:600}
.list code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.list li::marker{color:var(--step-label);font-weight:600}
.see{margin-top:4px}

/* Buttons (design system Button, Light) */
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* Run card: a notebook cell (no Copy button: the cells are already in the notebook), or the one cell students add (Copy button) */
.run{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin:0}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:6px 8px 6px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:12px 14px;font-family:var(--font-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out{border-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:6px 12px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}
.narrow .run pre{font-size:13px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.narrow .run.out pre{font-size:12px}

/* The Colab screenshot: the full width of the card (edge to edge), opens full size in a new tab.
   Under 560 px the card itself runs edge to edge, so the picture is as wide as the frame. */
.shot{margin:0 calc(-1 * var(--space-5));border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;line-height:0;background:var(--surface)}
.narrow .shot{margin:0 -16px}
.shot a{display:block}
.shot img{display:block;width:100%;height:auto}
.shot-cap{margin:-6px 0 0;font-size:13px;line-height:18px;color:var(--gray-600)}

/* A picture of the page (slide 14: the table in foo.pdf): framed like the output blocks, as wide as the text */
.pagepic{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;line-height:0;background:var(--surface)}
.pagepic a{display:block}
.pagepic img{display:block;width:100%;height:auto}

/* Table and analysis box (from the Learn deck) */
.tbl{border:1px solid var(--gray-200);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.4}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:6px 12px;border-bottom:1px solid var(--gray-200);background:var(--gray-50)}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--gray-200);vertical-align:top;color:var(--card-text)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.m{font-family:var(--font-mono);font-size:13px;color:var(--ink);white-space:nowrap}
.tbl td code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .tbl table{font-size:13px}
.narrow .tbl td,.narrow .tbl th{padding:5px 8px}
.concl{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px;font-size:15px;line-height:22px;color:var(--card-text)}
.concl b{font-weight:600;color:var(--card-title)}
.concl p{margin:0}
.concl p + p{margin-top:6px}
.concl code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}


/* A smaller code font for the long function in Step 3 (from the 11 November module 9 steps deck) */
.run.small pre{font-size:12px;line-height:1.32;padding:8px 14px}
.narrow .run.small pre{font-size:10.5px;line-height:1.35}

/* Tip box (from the 11 November module 9 Learn deck): pale-blue card, Pfizer blue bulb in a white square */
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px}
.tip-icon{flex:none;width:30px;height:30px;border-radius:var(--radius-xs);background:var(--surface);display:grid;place-items:center;color:var(--pfizer-blue)}
.tip-icon svg{width:18px;height:18px}
.tip p{margin:0;font-size:15px;line-height:22px;color:var(--card-text);text-wrap:pretty}
.tip b{font-weight:600;color:var(--card-title)}

/* Last slide: his closing line and Key Takeaway (takeaway box copied from the module 7 cheat sheet slide) */
.inner.end-slide{gap:var(--space-4)}
.end-slide .p{font-size:17px;line-height:1.55}
.take{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:14px 18px;font-size:17px;line-height:1.55;color:var(--card-text)}
.take b{font-weight:700;color:var(--card-title)}
.take code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .take{font-size:15px;padding:12px 16px}
.narrow .end-slide .p{font-size:16px}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:22px;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.foot .btn{padding:10px 16px;font-size:15px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
.narrow .upnext{visibility:hidden}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }

/* Added for P4 module 2 (copied from the P3 module 8 Try deck): "now holds" note, the SME's callout box, the Quick Recap size */
.holds{margin:0;display:flex;align-items:center;gap:8px;background:var(--surface-card);border-left:4px solid var(--pfizer-blue);border-radius:var(--radius-xs);padding:7px 12px;font-size:14px;line-height:20px;font-weight:600;color:var(--card-title)}
.holds code{font-family:var(--font-mono);font-size:.93em;background:var(--surface);border-radius:4px;padding:1px 5px}
.holds svg{width:16px;height:16px;flex:none;color:var(--pfizer-blue)}
.note{border:1.5px solid var(--ink);border-radius:var(--radius-sm);padding:9px 14px}
.note .num{display:block;margin-bottom:3px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.note p{margin:0;font-size:15px;line-height:1.48;color:var(--ink-muted)}
.note b{font-weight:600;color:var(--ink)}
.recap-slide .list{font-size:17px;line-height:1.55;gap:14px}
.recap-slide .list ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.recap-slide .list ul li::marker{color:var(--ink-muted)}
.narrow .recap-slide .list{font-size:15.5px;gap:10px}
/* Many steps in the rail: numbers only */
.pg-word{display:none}
.pg-label{text-align:center}
.pg.pg-fit{flex:none}
.pg.pg-fit .pg-label{text-align:left}
/* Under 560 px there is no room for the 7 group labels: the rail shows only the progress bars, and "Step N" sits beside the count */
.narrow .pg-label{display:none}
.narrow .pg.pg-fit{flex:1 1 0}
/* Code and output: Project 3's size (fix pass, 22 November 2026: 14 px on the 760 stage, 13 px at the 708 px column; 13 px on
   the narrow stage). Long lines wrap, so nothing scrolls; long cells and outputs are cut over more slides instead */
.run pre{white-space:pre-wrap;overflow-wrap:anywhere}
.run.out pre{font-size:14px;line-height:1.5}
.narrow .run pre,.narrow .run.out pre{font-size:13px}
/* F02: zoomed crops of one strip of the page, before and after a step */
.zoom{margin:0;display:flex;flex-direction:column;gap:6px}
.zoom a{display:block;line-height:0}
.zoom img{display:block;height:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--radius-xs)}
/* The STEP 15 JSON: the 3 heading lines across the top, the JSON in two columns (same text, same order) */
.run.out.json pre.head{padding-bottom:0}
.run.out.json pre.cols{column-count:2;column-gap:24px;padding-top:4px}
.narrow .run.out.json pre.cols{column-gap:12px;font-size:10.5px}
/* A page picture from Colab (tall): shown smaller and centred, so the slide stays short; opens full size */
.shot.tall{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.shot.tall img{width:auto;max-width:100%;height:var(--pic-h,480px);margin:0 auto}
.narrow .shot.tall{margin:0}
.narrow .shot.tall img{height:var(--pic-hn,520px)}
/* q3 Proposal A: two Colab page pictures side by side (STEP 6 + 7, STEP 8 + 9), each with its own notes under it */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.half{display:flex;flex-direction:column;gap:8px;min-width:0}
.half-head{margin:0;font-size:13px;line-height:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label)}
.half .p{margin:0}
.half .list{font-size:14.5px;line-height:1.45;gap:4px}
.half code{overflow-wrap:anywhere}
.pair-slide .shot.tall img{width:auto;height:auto;max-width:100%;max-height:330px}
.narrow .pair{gap:10px}
.narrow .pair-slide .shot.tall img{height:auto;max-height:300px}
.narrow .half .list{font-size:13.5px}
.pic-sm .shot.tall img{height:435px}

.run pre{white-space:pre-wrap;overflow-wrap:anywhere}
.run pre code{display:block}
.run pre .ln{display:block;padding-left:calc(var(--i) + 2ch);text-indent:calc(-1 * (var(--i) + 2ch))}
.run pre .ln:empty::before{content:"\200b"}
.shot.fit{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;line-height:0;background:var(--surface)}
.shot.fit img{width:auto;max-width:100%;max-height:var(--mh);margin:0 auto}
.p a{color:var(--pfizer-blue);text-underline-offset:2px}
.list a{color:var(--pfizer-blue);text-underline-offset:2px}

/* P7 m7: on narrow frames, long inline code in the instructions may wrap */
.narrow .p code.nw,.narrow .list code.nw{white-space:normal;overflow-wrap:anywhere}
.tbl td,.tbl th{padding:4px 12px}
</style>
</head>

<p class="p">Before you start, open this companion Colab notebook that walks through the <b>entire metadata-powered query routing pipeline</b>, from grouping pages to chunking, embedding, and intelligent retrieval.</p><div class="links"><a class="btn btn-secondary" href="https://colab.research.google.com/drive/1Hka0dNNcuY6ifHMuikgmbrQG8jsQUkKU" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Improve Query Routing (Colab notebook)</span><span class="sr-only"> (opens in a new tab)</span></a><a class="btn btn-secondary" href="https://drive.google.com/file/d/1fJ7DszcjB_TerDTAhXfAw74VqJBElTyw/view?usp=sharing" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 2.75h6.5L15.5 7v10.25H5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M11.25 2.75V7h4.25" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>The supplier bundle (PDF)</span><span class="sr-only"> (opens in a new tab)</span></a></div><ol class="list"><li>Open the notebook and click <b>File &rarr; Save a copy in Drive</b>, then work in the copy that opens. Keep this copy: the upcoming Task adds its steps at the bottom of it.</li><li>Open the PDF and click <b>Download</b> (the arrow at the top right) to save <code class="nw">pharma-blob-sample.pdf</code> to your computer. Use it to test document splitting, classification, and routing.</li><li>Check that your Gemini API key is saved in Colab Secrets as <code class="nw">GEMINI_API_KEY</code>, as in earlier projects.</li></ol><p class="p">This notebook uses the same JSON metadata from Step 1 and builds on your existing logic, perfect for following along. It labels the pages again by itself, so you don't need your Step 1 output.</p><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p>Run the cells from the top, in order. Every code block on these slides is already in your notebook, so there's nothing to paste.</p></div>

le="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">from pypdf import PdfReader</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">reader = PdfReader(&quot;/content/pharma-blob-sample.pdf&quot;)</span><span class="ln" style="--i:0ch">pages = [page.extract_text() for page in reader.pages]</span><span class="ln" style="--i:0ch">doc_pages = [{&quot;page_num&quot;: i, &quot;text&quot;: p} for i, p in enumerate(pages)]</span><span class="ln" style="--i:0ch">doc_pages</span></code></pre></figure>

<template id="t6">
<p class="p">This slide shows the first part of the next cell, and the next slide the rest. Read both, then run it. This cell sets up the helper that every Gemini request in the notebook goes through.</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; first part</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 3: Set Up Gemini LLM</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Creating a helper function that sends prompts to Google&#x27;s</span><span class="ln" style="--i:0ch"># Gemini 3.5 Flash-Lite model. We&#x27;ll use this for classification</span><span class="ln" style="--i:0ch"># and boundary detection.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># The LLM is the brain of our pipeline — it decides what type</span><span class="ln" style="--i:0ch"># each page is and whether consecutive pages belong together.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output (just defines the function).</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">from google import genai</span><span class="ln" style="--i:0ch">from google.colab import userdata</span><span class="ln" style="--i:0ch">import time</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">MODEL = &quot;gemini-3.5-flash-lite&quot;</span><span class="ln" style="--i:0ch">client = genai.Client(api_key=userdata.get(&#x27;GEMINI_API_KEY&#x27;))</span><span class="ln" style="--i:0ch"></span></code></pre></figure>
</template>

<template id="t7">
<p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 3: Set Up Gemini LLM</code>. This is the rest of it:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">def gemini_model(prompt, retries=3):</span><span class="ln" style="--i:4ch">    for attempt in range(retries):</span><span class="ln" style="--i:8ch">        try:</span><span class="ln" style="--i:12ch">            response = client.models.generate_content(model=MODEL, contents=prompt)</span><span class="ln" style="--i:12ch">            return response.text</span><span class="ln" style="--i:8ch">        except Exception as e:</span><span class="ln" style="--i:12ch">            busy = any(s in str(e).lower() for s in</span><span class="ln" style="--i:23ch">                       [&quot;429&quot;, &quot;503&quot;, &quot;overloaded&quot;, &quot;resource_exhausted&quot;, &quot;unavailable&quot;])</span><span class="ln" style="--i:12ch">            if busy and attempt &lt; retries - 1:</span><span class="ln" style="--i:16ch">                wait = 30 * (attempt + 1)</span><span class="ln" style="--i:16ch">                print(f&quot;Gemini is busy, retrying in {wait}s...&quot;)</span><span class="ln" style="--i:16ch">                time.sleep(wait)</span><span class="ln" style="--i:12ch">            else:</span><span class="ln" style="--i:16ch">                raise</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>MODEL</code> names the Gemini model, and <code>client</code> reads your key from Colab Secrets.</li><li><code>gemini_model(prompt)</code> sends a prompt to Gemini and returns its reply as text.</li><li>If Gemini is busy, it waits 30 seconds, then 60, and tries again. This copy changed the waits from 20 and 40 seconds.</li></ul><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span>No output: this cell only gets things ready for the next ones. If Colab asks <b>Grant access?</b> for <code>GEMINI_API_KEY</code>, click <b>Grant access</b>.</span></p>
</template>

--i:0ch"></span><span class="ln" style="--i:4ch">    A NEW document starts when the page has:</span><span class="ln" style="--i:4ch">    - A different document title or heading (e.g., &quot;Certificate of Quality&quot;</span></code></pre></figure>
</template>

<template id="t9">
<p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 4: Define Document Boundary Detection</code>. This is the rest of it:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:6ch">      vs &quot;Packaging Specification&quot; vs &quot;Material Description Sheet&quot;)</span><span class="ln" style="--i:4ch">    - A completely different topic or subject matter</span><span class="ln" style="--i:4ch">    - Its own header with a new document number or reference</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Pages belong to the SAME document when:</span><span class="ln" style="--i:4ch">    - The second page says &quot;continued&quot; or &quot;page 2 of 2&quot;</span><span class="ln" style="--i:4ch">    - The content directly continues the previous page&#x27;s discussion</span><span class="ln" style="--i:4ch">    - They share the same document number or title</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Previous page type: {doc_type or &#x27;unknown&#x27;}</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Previous Page:</span><span class="ln" style="--i:4ch">    {prev_text}</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Current Page:</span><span class="ln" style="--i:4ch">    {curr_text}</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Do these two pages belong to the SAME document? Answer ONLY &#x27;Yes&#x27; or &#x27;No&#x27;.</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    response = gemini_model(prompt)</span><span class="ln" style="--i:4ch">    return response.strip().lower().startswith(&quot;yes&quot;)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>is_same_document</code> gets the previous page, the current page and the previous page's type.</li><li>The prompt lists what starts a new document and what continues one.</li><li>It returns <code>True</code> when Gemini's answer starts with "yes". The cell prints nothing.</li></ul>

<template id="t10">
<p class="p">This cell holds the label list and the classifier. It's long, so it takes 3 slides. Read them, then run it.</p><p class="p">Changed in this copy: the labels are spelled <code>Certificate of Quality</code>, <code>BSE/TSE Declaration</code> and <code>Chain of Custody</code>, the same as the router later, and an answer that matches no label becomes <code>Other</code>.</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; first part</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 5: Define Document Type Classification</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Creating a function that classifies a page into one of</span><span class="ln" style="--i:0ch"># 7 pharmaceutical document types (plus &quot;Other&quot;).</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Each document type needs different extraction logic.</span><span class="ln" style="--i:0ch"># A Certificate of Quality has test results and lot numbers,</span><span class="ln" style="--i:0ch"># while a BSE/TSE Declaration has compliance dates.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output (just defines the function).</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Valid document type labels used throughout this notebook</span><span class="ln" style="--i:0ch">VALID_DOC_TYPES = [</span><span class="ln" style="--i:4ch">    &quot;Cover Letter&quot;, &quot;Certificate of Quality&quot;, &quot;Packaging Specification&quot;,</span><span class="ln" style="--i:4ch">    &quot;BSE/TSE Declaration&quot;, &quot;Material Description&quot;, &quot;Supplier Qualification&quot;,</span><span class="ln" style="--i:4ch">    &quot;Chain of Custody&quot;, &quot;Other&quot;</span><span class="ln" style="--i:0ch">]</span><span class="ln" style="--i:0ch"></span></code></pre></figure>
</template>

<template id="t11">
<p class="p">The middle of the cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; middle of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">def clean_doc_type(response):</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;Clean up LLM response to extract a valid doc_type label.&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    cleaned = response.strip().replace(&#x27;&quot;&#x27;, &#x27;&#x27;).replace(&#x27;`&#x27;, &#x27;&#x27;).replace(&#x27;*&#x27;, &#x27;&#x27;).lower().replace(&quot;.&quot;, &quot;&quot;).strip()</span><span class="ln" style="--i:4ch">    cleaned_title = cleaned.title()</span><span class="ln" style="--i:4ch">    # Check if the cleaned response contains a valid label</span><span class="ln" style="--i:4ch">    for label in VALID_DOC_TYPES:</span><span class="ln" style="--i:8ch">        if label.lower() in cleaned.lower():</span><span class="ln" style="--i:12ch">            return label</span><span class="ln" style="--i:4ch">    return &quot;Other&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">def classify_document_type(text):</span><span class="ln" style="--i:4ch">    prompt = f&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    You are a pharmaceutical document classifier. Based on the page</span><span class="ln" style="--i:4ch">    content below, classify it into ONE of these document types:</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    - Cover Letter: A formal letter (often starting with &quot;To Whom It</span><span class="ln" style="--i:6ch">      May Concern&quot;) discussing product information or storage conditions.</span><span class="ln" style="--i:4ch">    - Certificate of Quality: Contains lot numbers, manufacture dates,</span><span class="ln" style="--i:6ch">      expiration dates, and test results (autoclave, gamma irradiation).</span><span class="ln" style="--i:4ch">    - Packaging Specification: Describes packaging components, materials,</span><span class="ln" style="--i:6ch">      part numbers, and configuration change history.</span><span class="ln" style="--i:4ch">    - BSE/TSE Declaration: A declaration about animal-origin materials</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>VALID_DOC_TYPES</code> holds the 7 document types, plus <code>Other</code>.</li><li><code>clean_doc_type</code> tidies Gemini's reply and returns the matching label, spelled exactly as in the list.</li></ul>
</template>

<template id="t12">
<p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 5: Define Document Type Classification</code>. This is the end of it:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; end of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:6ch">      and transmissible spongiform encephalopathy compliance.</span><span class="ln" style="--i:4ch">    - Material Description: Lists materials of construction, sterilization</span><span class="ln" style="--i:6ch">      compatibility, and physical properties of a product.</span><span class="ln" style="--i:4ch">    - Supplier Qualification: Contains supplier audit history,</span><span class="ln" style="--i:6ch">      certifications (ISO 9001, ISO 13485), and approved product lists.</span><span class="ln" style="--i:4ch">    - Chain of Custody: Lists manufactured assemblies, traceability</span><span class="ln" style="--i:6ch">      information, and the manufacturing-to-shipment flow.</span><span class="ln" style="--i:4ch">    - Other: Use ONLY if the content does not match any of the above.</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Page Content:</span><span class="ln" style="--i:11ch">           {text}</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:11ch">           Respond with ONLY the document type name. No explanation.</span><span class="ln" style="--i:11ch">           &quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    response = gemini_model(prompt)</span><span class="ln" style="--i:4ch">    return clean_doc_type(response)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>classify_document_type</code> asks Gemini to pick one type for a page, with a short description of each type.</li></ul><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span>No output: this cell only gets things ready for the next ones.</span></p>
</template>

<template id="t13">
<p class="p">This slide shows the first part of the next cell, and the next slide the rest. Read both, then run it. This loop builds your metadata, one page at a time.</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; first part</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 6: Run the Classification Pipeline</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Looping through all 10 pages, classifying each one and</span><span class="ln" style="--i:0ch"># detecting document boundaries. This builds our metadata_store.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># This is the core of the blob processing pipeline — it turns</span><span class="ln" style="--i:0ch"># a flat list of pages into structured, labeled metadata.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># A list of 10 entries, each with page number, text, doc_type,</span><span class="ln" style="--i:0ch"># and page_in_doc (0 = first page of that document).</span><span class="ln" style="--i:0ch"># Multi-page docs like Packaging Spec (pages 4-5) will show</span><span class="ln" style="--i:0ch"># page_in_doc: 0 then 1.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">metadata_store = []</span><span class="ln" style="--i:0ch">current_doc_type = None</span><span class="ln" style="--i:0ch">doc_counter = 0</span><span class="ln" style="--i:0ch">page_counter = 0</span></code></pre></figure>
</template>

<template id="t14">
<p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 6: Run the Classification Pipeline</code>. This is the rest of it:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">for i, page in enumerate(doc_pages):</span><span class="ln" style="--i:4ch">    same = False</span><span class="ln" style="--i:4ch">    if i == 0:</span><span class="ln" style="--i:8ch">        current_doc_type = classify_document_type(page[&quot;text&quot;])</span><span class="ln" style="--i:4ch">    else:</span><span class="ln" style="--i:8ch">        prev_text = doc_pages[i - 1][&quot;text&quot;]</span><span class="ln" style="--i:8ch">        same = is_same_document(prev_text, page[&quot;text&quot;], current_doc_type)</span><span class="ln" style="--i:8ch">        if not same:</span><span class="ln" style="--i:12ch">            doc_counter += 1</span><span class="ln" style="--i:12ch">            current_doc_type = classify_document_type(page[&quot;text&quot;])</span><span class="ln" style="--i:12ch">            page_counter = 0</span><span class="ln" style="--i:8ch">        else:</span><span class="ln" style="--i:12ch">            page_counter += 1</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    metadata_store.append({</span><span class="ln" style="--i:8ch">        &quot;page&quot;: i,</span><span class="ln" style="--i:8ch">        &quot;text&quot;: page[&quot;text&quot;],</span><span class="ln" style="--i:8ch">        &quot;doc_type&quot;: current_doc_type,</span><span class="ln" style="--i:8ch">        &quot;page_in_doc&quot;: page_counter</span><span class="ln" style="--i:4ch">    })</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">metadata_store</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>Page 0 gets a type straight away. For every other page, Gemini first checks whether it belongs with the page before.</li><li>A new document gets its own type, and <code>page_in_doc</code> goes back to 0. A page that continues a document adds 1.</li><li>Each page's number, text, <code>doc_type</code> and <code>page_in_doc</code> go into <code>metadata_store</code>.</li></ul><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span>This cell sends about 17 requests to Gemini. If you see <code>Gemini is busy, retrying in 30s...</code>, wait: it carries on by itself.</span></p>
</template>

<template id="t16">
<p class="p">This slide shows the first part of the next cell, and the next slide the rest. Read both, then run it. Here, you use <code>page_in_doc</code> and <code>doc_type</code> to group consecutive pages into <b>full documents</b>.</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; first part</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 7: Group Pages into Logical Documents</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Combining consecutive pages that belong to the same document</span><span class="ln" style="--i:0ch"># into a single logical document with merged text.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># The Packaging Specification (pages 4-5) and Supplier</span><span class="ln" style="--i:0ch"># Qualification Record (pages 8-9) each span 2 pages.</span><span class="ln" style="--i:0ch"># We need to merge them so retrieval sees the full document.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No printed output, but logical_docs will contain ~8 documents</span><span class="ln" style="--i:0ch"># (10 pages grouped into 8 logical documents).</span><span class="ln" style="--i:0ch"># ============================================</span></code></pre></figure>
</template>

<template id="t17">
<p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 7: Group Pages into Logical Documents</code>. This is the rest of it:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">logical_docs = []</span><span class="ln" style="--i:0ch">current_doc = {&quot;text&quot;: &quot;&quot;, &quot;doc_type&quot;: None, &quot;page_start&quot;: 0}</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">for page in metadata_store:</span><span class="ln" style="--i:4ch">    if page[&quot;page_in_doc&quot;] == 0 and current_doc[&quot;text&quot;]:</span><span class="ln" style="--i:8ch">        current_doc[&quot;page_end&quot;] = page[&quot;page&quot;] - 1</span><span class="ln" style="--i:8ch">        logical_docs.append(current_doc)</span><span class="ln" style="--i:8ch">        current_doc = {&quot;text&quot;: &quot;&quot;, &quot;doc_type&quot;: None, &quot;page_start&quot;: page[&quot;page&quot;]}</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    current_doc[&quot;text&quot;] += &quot;\n\n&quot; + page[&quot;text&quot;]</span><span class="ln" style="--i:4ch">    current_doc[&quot;doc_type&quot;] = page[&quot;doc_type&quot;]</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Append last document</span><span class="ln" style="--i:0ch">current_doc[&quot;page_end&quot;] = metadata_store[-1][&quot;page&quot;]</span><span class="ln" style="--i:0ch">logical_docs.append(current_doc)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>A page with <code>page_in_doc</code> 0 starts a new document, so the document before it is saved with its <code>page_end</code>.</li><li>Every page's text is added to the current document, with a blank line between pages.</li><li>After the loop, the last document is saved too.</li></ul><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span>No output. Now each item in <code>logical_docs</code> is a reconstructed document: clean, structured, and labeled. In our run, there are 8.</span></p>
</template>

<template id="t18">
<p class="p">This slide shows the first part of the next cell, and the next slide the rest. Read both, then run it. This cell cuts each document into chunks and gives every chunk its metadata, as in Learn card 3.</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; first part</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 8: Chunk Each Document with Metadata</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Splitting each logical document into 500-word chunks and</span><span class="ln" style="--i:0ch"># attaching metadata (doc_type, page range, source file).</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Chunks are what actually get embedded and stored in the</span><span class="ln" style="--i:0ch"># vector database. The metadata lets us filter retrieval</span><span class="ln" style="--i:0ch"># to only the right document type.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No printed output, but chunked_documents will contain</span><span class="ln" style="--i:0ch"># LlamaIndex Document objects ready for embedding.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">from llama_index.core.schema import Document</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">def chunk_text(text, chunk_size=500):</span><span class="ln" style="--i:4ch">    words = text.split()</span><span class="ln" style="--i:4ch">    return [&#x27; &#x27;.join(words[i:i+chunk_size]) for i in range(0, len(words), chunk_size)]</span><span class="ln" style="--i:0ch"></span></code></pre></figure>
</template>

<template id="t19">
<p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 8: Chunk Each Document with Metadata</code>. This is the rest of it:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">chunked_documents = []</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">for idx, doc in enumerate(logical_docs):</span><span class="ln" style="--i:4ch">    chunks = chunk_text(doc[&quot;text&quot;])</span><span class="ln" style="--i:4ch">    for chunk_idx, chunk in enumerate(chunks):</span><span class="ln" style="--i:8ch">        chunked_documents.append(</span><span class="ln" style="--i:12ch">            Document(</span><span class="ln" style="--i:16ch">                text=chunk,</span><span class="ln" style="--i:16ch">                metadata={</span><span class="ln" style="--i:20ch">                    &quot;doc_type&quot;: doc[&quot;doc_type&quot;],</span><span class="ln" style="--i:20ch">                    &quot;chunk_index&quot;: chunk_idx,</span><span class="ln" style="--i:20ch">                    &quot;page_start&quot;: doc[&quot;page_start&quot;],</span><span class="ln" style="--i:20ch">                    &quot;page_end&quot;: doc[&quot;page_end&quot;],</span><span class="ln" style="--i:20ch">                    &quot;source_file&quot;: &quot;pharma-blob-sample.pdf&quot;</span><span class="ln" style="--i:16ch">                }</span><span class="ln" style="--i:12ch">            )</span><span class="ln" style="--i:8ch">        )</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>chunk_text</code> splits a text into pieces of up to 500 words (<code>chunk_size=500</code>).</li><li>Each chunk becomes a LlamaIndex <code>Document</code>: a piece of text plus its metadata, <code>doc_type</code>, <code>chunk_index</code>, <code>page_start</code>, <code>page_end</code> and <code>source_file</code>.</li></ul><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span>No output. Every chunk now carries context about its parent document, essential for routing. In our run, every document is under 500 words, so there are 8 chunks.</span></p>
</template>

<template id="t20">
<p class="p">You're now feeding each chunk (along with its metadata) into an <b>embedding model</b> (HuggingFace). Once that's done, you store all these vectors in a <b>vector index</b>: a searchable system that can find chunks that "mean" the same thing as your question.</p><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 9: Embed Chunks and Build Vector Index</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 9: Embed Chunks and Build Vector Index</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Converting each chunk into a numerical vector (embedding)</span><span class="ln" style="--i:0ch"># using the BGE-small embedding model, then storing them in</span><span class="ln" style="--i:0ch"># an in-memory vector index for fast similarity search.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># This is what makes RAG work — when a user asks a question,</span><span class="ln" style="--i:0ch"># we find the most similar chunks by comparing embeddings.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># A progress bar as chunks are embedded (may take 30-60 seconds).</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">from llama_index.embeddings.huggingface import HuggingFaceEmbedding</span><span class="ln" style="--i:0ch">from llama_index.core import VectorStoreIndex</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">embed_model = HuggingFaceEmbedding(model_name=&quot;BAAI/bge-small-en-v1.5&quot;)</span><span class="ln" style="--i:0ch">index = VectorStoreIndex.from_documents(chunked_documents, embed_model=embed_model)</span></code></pre></figure>
</template>

<template id="t21">
<p class="p"><b>What this code does:</b></p><ul class="list"><li><code>BAAI/bge-small-en-v1.5</code> is BGE, the embedding model you tested in Project 6. A vector is the list of numbers it makes for each chunk.</li><li><code>VectorStoreIndex</code> embeds every chunk and stores the numbers together with the chunk's metadata.</li></ul><p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot fit" style="--mh:380px"><a href="pfizer3-p7-m7-run-10.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p7-m7-run-10.png" width="1820" height="1010" alt="The output under STEP 9 in Colab: two warnings about unauthenticated requests to the HF Hub, then download bars for BGE&#x27;s files, including model.safetensors at 133 MB."><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure><ul class="list"><li>The cell takes about 40 seconds: BGE downloads first (about 133 MB).</li><li>The <code>HF_TOKEN</code> warnings only mean you aren't signed in to Hugging Face, and you don't need to be.</li></ul><p class="p"><b>What's happening now?</b></p><ul class="list"><li>Each chunk now has a <i>meaningful numeric fingerprint</i></li><li>You can search across all chunks based on <b>semantic similarity</b> (not just matching words)</li><li>You can also <b>filter by metadata</b>, like only search within Supplier Qualifications or BSE/TSE Declarations</li></ul>
</template>

<template id="t22">
<p class="p">When a user sends a query, your system should <b>first guess the document type</b> the answer likely belongs to. You can use a lightweight model like Gemini or Mistral to route the query. Your notebook uses Gemini.</p><p class="p">This slide shows the first part of the next cell, and the next slide the rest. Read both, then run it. </p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; first part</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 10: Define Query Routing Function</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Creating a function that predicts which document type is</span><span class="ln" style="--i:0ch"># most relevant to a user&#x27;s query. The LLM acts as a router,</span><span class="ln" style="--i:0ch"># directing each query to the right document type.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Without routing, a query about BSE/TSE compliance might</span><span class="ln" style="--i:0ch"># retrieve text from a Cover Letter. Routing ensures we</span><span class="ln" style="--i:0ch"># search only within the relevant document type.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output (just defines the function).</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span></code></pre></figure>
</template>

<template id="t23">
<p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 10: Define Query Routing Function</code>. This is the rest of it:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">def predict_doc_type_for_query(query):</span><span class="ln" style="--i:4ch">    prompt = f&quot;&quot;&quot;</span><span class="ln" style="--i:2ch">  You are an intelligent assistant that routes user queries to the most relevant pharmaceutical document.</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:2ch">  User query: &quot;{query}&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:2ch">  Which document type is most likely to contain the answer?</span><span class="ln" style="--i:2ch">  Choose ONLY ONE from: Cover Letter, Certificate of Quality, Packaging Specification, BSE/TSE Declaration,</span><span class="ln" style="--i:0ch">Material Description, Supplier Qualification, Chain of Custody, Other.</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:2ch">  Respond with ONLY the document type name. No explanation.</span><span class="ln" style="--i:2ch">  &quot;&quot;&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    response = gemini_model(prompt)</span><span class="ln" style="--i:4ch">    return clean_doc_type(response)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>The prompt lists the 7 document types, plus <code>Other</code>, and asks Gemini for one.</li><li><code>clean_doc_type</code> turns the reply into a label spelled exactly as in <code>VALID_DOC_TYPES</code>, because the filter in the next cell only matches exact spellings.</li></ul><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span>No output: this cell only gets things ready for the next ones.</span></p>
</template>

<template id="t24">
<p class="p">Then, retrieve only from chunks that match that type.</p><p class="p">This slide shows the first part of the next cell, and the next slide the rest. Read both, then run it. </p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; first part</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 11: Route a Query and Retrieve Filtered Results</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Testing the full pipeline with a pharmaceutical query.</span><span class="ln" style="--i:0ch"># The LLM predicts the document type, then we retrieve</span><span class="ln" style="--i:0ch"># only chunks from that type using metadata filtering.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># This is the payoff — instead of searching all 10 pages,</span><span class="ln" style="--i:0ch"># we narrow down to just the relevant document type first.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># The predicted document type (e.g., &quot;Packaging Specification&quot;),</span><span class="ln" style="--i:0ch"># followed by matching chunks with page ranges.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">from llama_index.core.vector_stores import MetadataFilters, FilterOperator, MetadataFilter</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Get doc_type filter</span><span class="ln" style="--i:0ch">user_query = &quot;Were there any packaging configuration changes?&quot;</span><span class="ln" style="--i:0ch">predicted_doc_type = predict_doc_type_for_query(user_query)</span><span class="ln" style="--i:0ch">print(f&quot;Predicted document type: {predicted_doc_type}&quot;)</span><span class="ln" style="--i:0ch"></span></code></pre></figure>
</template>

<template id="t25">
<p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 11: Route a Query and Retrieve Filtered Results</code>. This is the rest of it:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># Retrieve</span><span class="ln" style="--i:0ch">retriever = index.as_retriever(</span><span class="ln" style="--i:4ch">    filters=MetadataFilters(</span><span class="ln" style="--i:8ch">        filters=[</span><span class="ln" style="--i:12ch">            MetadataFilter(key=&quot;doc_type&quot;, value=predicted_doc_type, operator=FilterOperator.EQ)</span><span class="ln" style="--i:8ch">        ]</span><span class="ln" style="--i:4ch">    )</span><span class="ln" style="--i:0ch">)</span><span class="ln" style="--i:0ch">results = retriever.retrieve(user_query)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">for res in results:</span><span class="ln" style="--i:4ch">    print(f&quot;[{res.metadata[&#x27;doc_type&#x27;]} - p{res.metadata[&#x27;page_start&#x27;]}–{res.metadata[&#x27;page_end&#x27;]}]&quot;)</span><span class="ln" style="--i:4ch">    print(res.text[:200])</span><span class="ln" style="--i:4ch">    print(&quot;-&quot; * 50)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>MetadataFilter</code> keeps only chunks whose <code>doc_type</code> equals (<code>EQ</code>) the predicted type.</li><li><code>index.as_retriever(...)</code> searches only those chunks. The cell doesn't set how many to return, so LlamaIndex returns up to 2, its default.</li></ul><p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot fit" style="--mh:90px"><a href="pfizer3-p7-m7-run-12.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p7-m7-run-12.png" width="1820" height="236" alt="The output under STEP 11 in Colab: Gemini is busy, retrying in 30s..., Predicted document type: Packaging Specification, [Packaging Specification - p3–4], then the chunk&#x27;s first 200 characters."><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure><p class="p">Only the Packaging Specification's one chunk came back: pages 3 to 4. The first line means Gemini was busy once.</p>
</template>

<template id="t26">
<p class="p">This slide shows the first part of the next cell, and the next slide the rest. Read both, then run it. Retrieval finds the right text. This cell asks Gemini to answer from it.</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; first part</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 12: Extract the Answer Using the LLM</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Taking the top retrieved chunk and asking Gemini to extract</span><span class="ln" style="--i:0ch"># a specific answer to the user&#x27;s question.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Retrieval alone gives us relevant text. This final step</span><span class="ln" style="--i:0ch"># uses the LLM to produce a clear, concise answer — the</span><span class="ln" style="--i:0ch"># &quot;generation&quot; part of Retrieval-Augmented Generation.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># A direct answer to the query extracted from the retrieved text.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span></code></pre></figure>
</template>

<template id="t27">
<p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 12: Extract the Answer Using the LLM</code>. This is the rest of it:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">if results:</span><span class="ln" style="--i:4ch">    # Take the text from the first (most relevant) result</span><span class="ln" style="--i:4ch">    retrieved_text = results[0].text</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Ask the model for a specific answer</span><span class="ln" style="--i:4ch">    prompt = f&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    Based on the following text, please answer the user&#x27;s question.</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Text:</span><span class="ln" style="--i:4ch">    {retrieved_text}</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    User Question: {user_query}</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Provide a clear, specific answer based only on the text provided.</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    answer = gemini_model(prompt)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    print(f&quot;Query: &#x27;{user_query}&#x27;&quot;)</span><span class="ln" style="--i:4ch">    print(f&quot;Answer: {answer}&quot;)</span><span class="ln" style="--i:0ch">else:</span><span class="ln" style="--i:4ch">    print(&quot;Could not find an answer as no relevant documents were retrieved.&quot;)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>results[0].text</code> is the top chunk the filter let through.</li><li>The prompt asks Gemini to answer the question from that text only.</li><li>If nothing came back, it prints a message instead.</li></ul>
</template>

ass="ln" style="--i:4ch">    &quot;What are the part numbers listed in this document?&quot;,</span><span class="ln" style="--i:4ch">    &quot;Were there any packaging configuration changes?&quot;,</span><span class="ln" style="--i:4ch">    &quot;What are the BSE/TSE compliance dates?&quot;,</span><span class="ln" style="--i:4ch">    &quot;Are there any documents dated over 5 years ago?&quot;,</span><span class="ln" style="--i:4ch">    &quot;What supplier information is available?&quot;,</span><span class="ln" style="--i:0ch">]</span><span class="ln" style="--i:0ch"></span></code></pre></figure>

<p class="p">The middle of the cell routes each question and searches only the chunks of its type, as in the last cells:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; middle of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">for i, query in enumerate(test_queries, 1):</span><span class="ln" style="--i:4ch">    print(f&quot;\n{&#x27;=&#x27;*60}&quot;)</span><span class="ln" style="--i:4ch">    print(f&quot;QUERY {i}: {query}&quot;)</span><span class="ln" style="--i:4ch">    print(f&quot;{&#x27;=&#x27;*60}&quot;)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Route the query</span><span class="ln" style="--i:4ch">    predicted_type = predict_doc_type_for_query(query)</span><span class="ln" style="--i:4ch">    print(f&quot;Routed to: {predicted_type}&quot;)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    # Retrieve with metadata filter</span><span class="ln" style="--i:4ch">    retriever = index.as_retriever(</span><span class="ln" style="--i:8ch">        filters=MetadataFilters(</span><span class="ln" style="--i:12ch">            filters=[</span><span class="ln" style="--i:16ch">                MetadataFilter(key=&quot;doc_type&quot;, value=predicted_type, operator=FilterOperator.EQ)</span><span class="ln" style="--i:12ch">            ]</span><span class="ln" style="--i:8ch">        )</span><span class="ln" style="--i:4ch">    )</span><span class="ln" style="--i:4ch">    results = retriever.retrieve(query)</span><span class="ln" style="--i:0ch"></span></code></pre></figure>

gh.</li></ul><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span>This cell sends about 11 requests to Gemini, so a <code>Gemini is busy</code> wait is normal.</span></p>

    {"group": "Route", "label": "ROUTE AND FILTER &middot; PART 4 OF 4: RUN IT AND SEE IT", "title": "Route a Question and <span class=\"hl\">Filter</span>", "plain": "Route and Filter. Route a Question and Filter", "tpl": "t25", "cls": "end-slide"},
    {"group": "Answer", "label": "ANSWER &middot; PART 1 OF 3: READ IT", "title": "Turn the Chunk into an <span class=\"hl\">Answer</span>", "plain": "Turn the Chunk into an Answer", "tpl": "t26"},
    {"group": "Answer", "label": "ANSWER &middot; PART 2 OF 3: RUN IT", "title": "Ask Gemini to Answer from the <span class=\"hl\">Chunk</span>", "plain": "Answer. Ask Gemini to Answer from the Chunk", "tpl": "t27", "cls": "end-slide"},
    {"group": "Answer", "label": "ANSWER &middot; PART 3 OF 3: SEE IT", "title": "Read the <span class=\"hl\">Answer</span>", "plain": "Answer. Read the Answer", "tpl": "t28", "cls": "end-slide"},
    {"group": "Test", "label": "TEST 6 QUESTIONS &middot; PART 1 OF 6: READ IT", "title": "Test All <span class=\"hl\">6</span> Questions", "plain": "Test All 6 Questions", "tpl": "t29"},
    {"group": "Test", "label": "TEST 6 QUESTIONS &middot; PART 2 OF 6: READ IT", "title": "Route and Filter <span class=\"hl\">Each</span> Question", "plain": "Test 6 Questions. Route and Filter Each Question", "tpl": "t30"},
    {"group": "Test", "label": "TEST 6 QUESTIONS &middot; PART 3 OF 6: RUN IT", "title": "<span class=\"hl\">Answer</span> Each Question", "plain": "Test 6 Questions. Answer Each Question", "tpl": "t31", "cls": "end-slide"},
    {"group": "Test", "label": "TEST 6 QUESTIONS &middot; PART 4 OF 6: SEE IT", "title": "Questions 1 to 4 Find Their <span class=\"hl\">Document</span>", "plain": "Test 6 Questions. Questions 1 to 4 Find Their Document", "tpl": "t32", "cls": "end-slide"},
    {"group": "Test", "label": "TEST 6 QUESTIONS &middot; PART 5 OF 6: SEE IT", "title": "Why Question 5 Finds <span class=\"hl\">Nothing</span>", "plain": "Test 6 Questions. Why Question 5 Finds Nothing", "tpl": "t33", "cls": "end-slide"},
    {"group": "Test", "label": "TEST 6 QUESTIONS &middot; PART 6 OF 6: SEE IT", "title": "All 6 Questions <span class=\"hl\">Done</span>", "plain": "Test 6 Questions. All 6 Questions Done", "tpl": "t34", "cls": "end-slide"}
  ];
  var STAGE = { wide: [760, 1140], narrow: [450, 1256] };
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of this reading.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var sz = narrow ? STAGE.narrow : STAGE.wide;
    app.style.width = sz[0] + "px"; app.style.height = sz[1] + "px";
    var k = Math.min(window.innerWidth / sz[0], window.innerHeight / sz[1]);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  var GROUP_LABEL = { "Regex": "Find" };
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    var isStep = g.name.indexOf("Step ") === 0;
    b.type = "button"; b.className = "pg" + (isStep ? "" : " pg-fit");
    var shown = GROUP_LABEL[g.name] || g.name;
    b.setAttribute("aria-label", (g.name === "Regex" ? "Find Values" : shown) + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    var word = isStep ? '<span class="pg-word">Step </span>' + g.name.replace("Step ", "") : shown;
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + word + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span"), orig = label.textContent;
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = orig; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner' + (s.cls ? " " + s.cls : "") + '"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + document.getElementById(s.tpl).innerHTML + '</div>';
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(CELLS[b.getAttribute("data-copy")], b, pre); });
    });
    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.where || s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
    space();
    Array.prototype.forEach.call(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a slide. Spare height widens the gaps
     between blocks, up to 2x. */
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = ""; inner.style.marginTop = "";
    var cs = getComputedStyle(card);
    var avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var base = parseFloat(getComputedStyle(inner).rowGap) || 14;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (base + Math.min(base, spare / gaps)) + "px";
    /* P5 m2 fix round 1: what is still spare after the gaps widen is split above and below, so a short slide sits in
       the middle of the card instead of leaving one big empty area at the bottom */
    var left = avail - inner.offsetHeight;
    if (left > 1) inner.style.marginTop = Math.floor(left / 2) + "px";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    space();
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #slide=N opens slide N directly */
  var hm = location.hash.match(/slide=(\d+)/);
  if (hm) i = Math.min(SLIDES.length - 1, Math.max(0, +hm[1] - 1));
  window.addEventListener("resize", function () { scaleStage(); space(); });
  scaleStage();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
