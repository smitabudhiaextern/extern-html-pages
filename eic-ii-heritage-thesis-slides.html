<!DOCTYPE html>
<!--
  EIC II — Heritage Investment Thesis explainer (Project 1, 1.1.2). Navigable, slides 2-5, each in plain,
  beginner-friendly language (a short intro, the key points with everyday analogies, and "the big idea").
  Slide 3 copy is the user's own; slides 2/4/5 match its voice and are grounded in the deck. Slide 7
  (investment themes) is intentionally left for the next module.
  Notion-embeddable 960x540 (Mode A) + scale-to-fit. Brand palette, Inter, Phosphor.
  CONTENT lives in the SLIDES config block below; edit only that.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritage's Thesis, Made Simple — EIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
  :root {
    --color-bg: #FDF8F8;
    --color-surface-highlight: #DCE1FF;
    --color-accent: #001D69;
    --color-title: #1C1B1B;
    --color-body: #484646;
    --color-white: #FFFFFF;
    --color-border: #E7E3EC;
    --color-muted: #8a8693;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #EFEAF0; font-family: 'Inter', sans-serif; }
  #stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: flex-start; justify-content: center; }
  #deck-wrapper { width: 960px; height: 540px; position: relative; overflow: hidden; background: var(--color-bg); padding: 24px 34px 20px; display: flex; flex-direction: column; }

  h1.slide-title { font-size: 22px; font-weight: 800; color: var(--color-title); line-height: 1.1; margin-bottom: 9px; }
  h1.slide-title .n { color: var(--color-accent); }
  .intro { font-size: 13.5px; color: var(--color-body); line-height: 1.5; margin-bottom: 12px; }

  .points { margin-bottom: 10px; }
  .points.list { display: flex; flex-direction: column; gap: 8px; }
  .points.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

  .pt { background: var(--color-white); border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 13px; box-shadow: 0 2px 8px rgba(0,29,105,.04); }
  .pt .lead { font-size: 13px; font-weight: 700; color: var(--color-title); }
  .pt .txt { font-size: 12.5px; color: var(--color-body); line-height: 1.42; margin-top: 2px; }
  .points.list .pt { display: block; }

  .note { font-size: 11px; color: var(--color-muted); font-style: italic; margin-bottom: 10px; }

  .bigidea { display: flex; align-items: center; gap: 11px; background: var(--color-accent); color: #fff; border-radius: 11px; padding: 12px 16px; }
  .bigidea .bi-label { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .8; white-space: nowrap; }
  .bigidea .bi-text { font-size: 13.5px; font-weight: 600; line-height: 1.4; }

  .nav { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 12px; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 29px; height: 29px; border-radius: 8px; border: 1.5px solid var(--color-border); background: var(--color-white); color: var(--color-muted); font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all .12s ease; }
  .dot:hover { border-color: var(--color-accent); color: var(--color-accent); }
  .dot.on { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  .btn { display: inline-flex; align-items: center; gap: 7px; background: var(--color-accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; padding: 9px 16px; }
  .btn:hover { box-shadow: 0 3px 12px rgba(0,29,105,.22); }
  .btn.ghost { background: transparent; color: var(--color-accent); padding: 9px 11px; }
  .btn.ghost:hover { box-shadow: none; background: rgba(0,29,105,.06); }
  .btn:disabled { opacity: .35; cursor: default; box-shadow: none; }

  .foot { font-size: 10.5px; color: var(--color-muted); margin-top: 9px; line-height: 1.4; }
  .foot b { color: var(--color-body); }
</style>
</head>
<body>
<div id="stage">
  <div id="deck-wrapper" role="img"
       aria-label="A plain-language explainer of EIC Heritage's investment thesis, slides 2 to 5, each with a short summary and the key points in everyday language. Slide 7, the investment themes, is covered in the next module.">

    <h1 class="slide-title"><span class="n" id="s-n">Slide 2</span> &middot; <span id="s-title"></span></h1>
    <p class="intro" id="intro"></p>
    <div class="points" id="points"></div>
    <p class="note" id="note" hidden></p>
    <div class="bigidea"><span class="bi-label">The big idea</span><span class="bi-text" id="bigidea"></span></div>

    <div class="nav">
      <button class="btn ghost" id="backBtn"><i class="ph-bold ph-arrow-left"></i> Back</button>
      <div class="dots" id="dots"></div>
      <button class="btn" id="nextBtn">Next <i class="ph-bold ph-arrow-right"></i></button>
    </div>
    <div class="foot"><b>Slides 2 to 5 carry the thesis.</b> Slide 7 (the investment themes) comes up in the next module, so skip it for now.</div>

  </div>
</div>

<noscript><p style="font-family:sans-serif;padding:16px;max-width:900px">A plain-language walk through EIC Heritage's thesis: Slide 2, who Heritage is (a young oil-and-gas tech fund backed by real operators). Slide 3, what they invest in (four kinds of new technology). Slide 4, their thesis (oil-and-gas tech is underfunded, so they can back the best startups cheaply). Slide 5, why now (money is scarce but the need is huge). Skip slide 7 for now.</p></noscript>

<script>
/* ===== CONFIG: edit only this block ===== */
const SLIDES = [
  {
    n: 2, title: "Who Heritage Is",
    intro: "This slide introduces the fund. In plain words: EIC Heritage is a young investment fund that gives money to new companies building better technology for finding and producing oil and gas.",
    layout: "list",
    points: [
      { lead: "Backed by real oil companies", txt: "Big operators like Devon, Coterra, Chevron, and ConocoPhillips put money into the fund. That is rare, and it is Heritage's secret weapon." },
      { lead: "They know the real problems", txt: "Because those operators work with Heritage every week, the fund hears the exact problems they need solved, straight from the field." },
      { lead: "Part of a bigger family", txt: "Heritage sits inside EIC, a firm that has invested in energy technology for decades, so it brings a big network and years of experience." }
    ],
    bigIdea: "Heritage is an oil-and-gas tech fund whose superpower is that the real oil companies back it and tell it what to build."
  },
  {
    n: 3, title: "What They Invest In",
    intro: "This slide has one big sentence and four pictures. The big sentence means: “We put our money into new inventions that help America stay the #1 country for energy.” Oil and gas is like the legs holding up America's energy strength, and they invest in inventions that keep those legs strong.",
    layout: "grid",
    points: [
      { lead: "AI-assisted modeling and prediction", txt: "using smart computers to guess really well about what's underground, before you dig." },
      { lead: "Novel drilling and completion techniques", txt: "new, clever, better ways to drill holes deep into the ground." },
      { lead: "Advanced imaging and characterization", txt: "fancy ways to take “pictures” of what's underground, like X-ray goggles for the earth." },
      { lead: "Production optimization", txt: "getting the MOST oil out in the smartest way, like squeezing every last drop from an orange." }
    ],
    note: "The tiny note “Illustrative examples, non-exhaustive” just means these are only a few examples, and there are more.",
    bigIdea: "They invest in 4 main types of smart new inventions that help America dig up oil and gas better and stay the strongest energy country."
  },
  {
    n: 4, title: "The Big Bet (Their Thesis)",
    intro: "This slide is the fund's core belief, its “thesis.” In plain words: oil and gas is not going away, but almost nobody is funding the technology that produces it, so that is a wide-open opportunity.",
    layout: "list",
    points: [
      { lead: "Oil and gas is here to stay", txt: "It is a lasting part of how the world runs, so the technology to produce it will always matter." },
      { lead: "Barely anyone funds it", txt: "Investors chased clean energy instead, so few venture funds focus here. That means less competition for Heritage." },
      { lead: "So Heritage can win", txt: "With few funds competing, it can back the best young companies at good prices, and its oil-company partners help those companies actually get used." }
    ],
    bigIdea: "Everyone else looked away from oil-and-gas tech, so Heritage can back the best startups cheaply, and its partners help them succeed."
  },
  {
    n: 5, title: "Why Now",
    intro: "This slide shows why the timing is right, with real numbers. In plain words: the money dried up, but the need is enormous, so the opportunity is huge right now.",
    layout: "list",
    points: [
      { lead: "The money left", txt: "Investment in core oil-and-gas tech fell from about 11 deals a year to about 3 (2020 to 2024), because money went to clean energy." },
      { lead: "The need is gigantic", txt: "The industry must spend about $540 billion every year just to keep production from dropping, and EIC already sees 400+ companies to look at." },
      { lead: "The prize", txt: "In one oil executive's words, technology once turned near-worthless land into top-quality land. Heritage wants to do that again for today's weaker land (Tier 2 and Tier 3)." }
    ],
    bigIdea: "Money is scarce but the need is massive, and the goal is to make weaker oil land produce like the best land."
  }
];
/* ===== end config ===== */

const sN = document.getElementById('s-n'), sTitle = document.getElementById('s-title');
const introEl = document.getElementById('intro'), pointsEl = document.getElementById('points');
const noteEl = document.getElementById('note'), bigIdeaEl = document.getElementById('bigidea');
const dots = document.getElementById('dots'), backBtn = document.getElementById('backBtn'), nextBtn = document.getElementById('nextBtn');
let idx = 0;

SLIDES.forEach((s, i) => {
  const d = document.createElement('button');
  d.className = 'dot'; d.textContent = s.n;
  d.addEventListener('click', () => { idx = i; render(); });
  dots.appendChild(d);
});

function render() {
  const s = SLIDES[idx];
  sN.textContent = 'Slide ' + s.n;
  sTitle.textContent = s.title;
  introEl.textContent = s.intro;
  pointsEl.className = 'points ' + s.layout;
  pointsEl.innerHTML = '';
  s.points.forEach(p => {
    const card = document.createElement('div');
    card.className = 'pt';
    const lead = document.createElement('div'); lead.className = 'lead'; lead.textContent = p.lead;
    const txt = document.createElement('div'); txt.className = 'txt'; txt.textContent = p.txt;
    card.appendChild(lead); card.appendChild(txt);
    pointsEl.appendChild(card);
  });
  if (s.note) { noteEl.textContent = s.note; noteEl.hidden = false; } else { noteEl.hidden = true; }
  bigIdeaEl.textContent = s.bigIdea;
  Array.from(dots.children).forEach((d, i) => d.classList.toggle('on', i === idx));
  backBtn.disabled = idx === 0;
  nextBtn.innerHTML = idx === SLIDES.length - 1
    ? 'Start over <i class="ph-bold ph-arrow-counter-clockwise"></i>'
    : 'Next <i class="ph-bold ph-arrow-right"></i>';
}
nextBtn.addEventListener('click', () => { idx = (idx + 1) % SLIDES.length; render(); });
backBtn.addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
render();

/* ---- MANDATORY viewport scale-to-fit ---- */
function scaleDeck() {
  const wrapper = document.getElementById('deck-wrapper');
  const scale = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
  wrapper.style.transform = `scale(${scale})`;
  wrapper.style.transformOrigin = 'top center';
}
window.addEventListener('resize', scaleDeck);
scaleDeck();
</script>
</body>
</html>
