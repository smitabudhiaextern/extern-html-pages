<!DOCTYPE html>
<!--
  EIC II — Heritage Investment Thesis, the four slides that matter (Project 1, 1.1.2 "Understand EIC Heritage's Investment Thesis").
  A navigable explainer of deck slides 2-5: each shows the deck's own language ("On the slide") next to a plain-language
  takeaway ("In plain language"). Slide 7 (investment themes) is deliberately left out — that's the next module (focus areas).
  Notion-embeddable 960x540 canvas (Mode A) + mandatory scale-to-fit. Brand palette, Inter, Phosphor.
  CONTENT is in the SLIDES config block below; edit only that to update.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritage's Thesis in Four Slides — EIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
  :root {
    --color-bg: #FDF8F8;
    --color-surface-highlight: #DCE1FF;
    --color-accent: #001D69;
    --color-title: #1C1B1B;
    --color-body: #484646;
    --color-white: #FFFFFF;
    --color-border: #E7E3EC;
    --color-muted: #8a8693;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #EFEAF0; font-family: 'Inter', sans-serif; }
  #stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: flex-start; justify-content: center; }
  #deck-wrapper { width: 960px; height: 540px; position: relative; overflow: hidden; background: var(--color-bg); padding: 26px 34px 22px; display: flex; flex-direction: column; }

  .brandbar { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent); margin-bottom: 8px; }
  .brandbar i { font-size: 15px; }
  h1.slide-title { font-size: 24px; font-weight: 800; color: var(--color-title); line-height: 1.1; margin-bottom: 14px; }
  h1.slide-title .n { color: var(--color-accent); }

  .cols { display: flex; gap: 20px; flex: 1; min-height: 0; }
  .deck-col { width: 500px; flex-shrink: 0; }
  .plain-col { flex: 1; min-width: 0; }
  .col-label { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 9px; }

  .deck-col ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .deck-col li { position: relative; padding-left: 20px; font-size: 13px; color: var(--color-body); line-height: 1.42; }
  .deck-col li::before { content: ""; position: absolute; left: 3px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); opacity: .55; }

  .plain-box { background: var(--color-surface-highlight); border-radius: 12px; padding: 15px 17px; height: 100%; display: flex; flex-direction: column; }
  .plain-box .col-label { color: var(--color-accent); }
  .plain-box p { font-size: 14.5px; color: var(--color-title); line-height: 1.5; font-weight: 500; }

  .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .dots { display: flex; gap: 8px; }
  .dot { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--color-border); background: var(--color-white); color: var(--color-muted); font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all .12s ease; }
  .dot:hover { border-color: var(--color-accent); color: var(--color-accent); }
  .dot.on { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }

  .btn { display: inline-flex; align-items: center; gap: 7px; background: var(--color-accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; padding: 10px 18px; }
  .btn:hover { box-shadow: 0 3px 12px rgba(0,29,105,.22); }
  .btn.ghost { background: transparent; color: var(--color-accent); padding: 10px 12px; }
  .btn.ghost:hover { box-shadow: none; background: rgba(0,29,105,.06); }
  .btn:disabled { opacity: .35; cursor: default; box-shadow: none; }

  .foot { font-size: 11px; color: var(--color-muted); margin-top: 11px; line-height: 1.4; }
  .foot b { color: var(--color-body); }
</style>
</head>
<body>
<div id="stage">
  <div id="deck-wrapper" role="img"
       aria-label="An explainer of EIC Heritage's investment-thesis deck, slides 2 to 5. Slide 2: what Heritage is, an early-stage upstream oil and gas fund backed by major operators. Slide 3: the kinds of technology it backs. Slide 4: its thesis, that upstream tech is underfunded so Heritage can back the best startups cheaply. Slide 5: why now, a funding gap plus a huge need, with the goal of making lower-tier acreage produce like top-tier acreage. Slide 7, the investment themes, is covered in the next module.">

    <div class="brandbar"><i class="ph-bold ph-file-text"></i> EIC Heritage &middot; the thesis in four slides</div>
    <h1 class="slide-title"><span class="n" id="s-n">Slide 2</span> &middot; <span id="s-title">What Heritage is</span></h1>

    <div class="cols">
      <div class="deck-col">
        <div class="col-label">On the slide</div>
        <ul id="deck-list"></ul>
      </div>
      <div class="plain-col">
        <div class="plain-box">
          <div class="col-label">In plain language</div>
          <p id="plain-text"></p>
        </div>
      </div>
    </div>

    <div class="nav">
      <button class="btn ghost" id="backBtn"><i class="ph-bold ph-arrow-left"></i> Back</button>
      <div class="dots" id="dots"></div>
      <button class="btn" id="nextBtn">Next <i class="ph-bold ph-arrow-right"></i></button>
    </div>

    <div class="foot"><b>Slides 2 to 5 carry the thesis.</b> Slide 7 (the investment themes) comes up in the next module, so skip it for now.</div>

  </div>
</div>

<noscript><p style="font-family:sans-serif;padding:16px;max-width:900px">Heritage's thesis in four slides. Slide 2: an early-stage upstream oil and gas fund whose edge is its Fortune 500 operator partners. Slide 3: the technology it backs (AI modeling, drilling and completion, imaging, production optimization). Slide 4: its thesis, upstream tech is underfunded so Heritage backs the best startups cheaply. Slide 5: why now, a funding gap plus a huge need, aiming to make Tier 2 and Tier 3 acreage produce like Tier 1. Skip slide 7 (investment themes); that's the next module.</p></noscript>

<script>
/* ===== CONFIG: edit only this block to change the slides ===== */
const SLIDES = [
  {
    n: 2, title: "What Heritage is",
    deck: [
      "An “early-stage venture fund” for “the upstream oil and gas industry”",
      "“Foundational partnerships with Fortune 500 energy leaders” (Devon, Coterra, Chevron, ConocoPhillips)",
      "“Access to confirmed problem statements” and pilots, straight from operators"
    ],
    plain: "Heritage is a young upstream oil-and-gas fund. Its edge is who backs it: major operators put in the money and tell it the exact problems they need solved."
  },
  {
    n: 3, title: "What it backs",
    deck: [
      "AI-assisted modeling and prediction",
      "Novel drilling and completion techniques",
      "Advanced imaging and characterization",
      "Production optimization"
    ],
    plain: "A quick taste of the technology it funds. You'll choose from these areas in the next module, so just skim this one."
  },
  {
    n: 4, title: "Its thesis",
    deck: [
      "Oil and gas is “durable,” but its technology “continues to be underfunded”",
      "“Few venture funds focus here”",
      "“Capital scarcity means Heritage can lead investments… at attractive valuations”"
    ],
    plain: "Few funds compete here, so Heritage can back the best startups cheaply, and its operator ties help those startups get adopted."
  },
  {
    n: 5, title: "Why now",
    deck: [
      "Money went to cleantech, “leaving a funding gap in core O&G innovation” (core deals fell from about 11 a year to about 3)",
      "“$540B” needed each year “to sustain production”; “400+ opportunities” in EIC's pipeline",
      "“Tier 1 assets used to be Tier 100 assets… Heritage will help Tier 2 & 3 assets be produced as economically as Tier 1”"
    ],
    plain: "The money left for clean energy, but the need is enormous, and the prize is making lower-tier land produce like the best land."
  }
];
/* ===== end config ===== */

const sN = document.getElementById('s-n'), sTitle = document.getElementById('s-title');
const deckList = document.getElementById('deck-list'), plainText = document.getElementById('plain-text');
const dots = document.getElementById('dots'), backBtn = document.getElementById('backBtn'), nextBtn = document.getElementById('nextBtn');
let idx = 0;

SLIDES.forEach((s, i) => {
  const d = document.createElement('button');
  d.className = 'dot'; d.textContent = s.n;
  d.addEventListener('click', () => { idx = i; render(); });
  dots.appendChild(d);
});

function render() {
  const s = SLIDES[idx];
  sN.textContent = 'Slide ' + s.n;
  sTitle.textContent = s.title;
  deckList.innerHTML = '';
  s.deck.forEach(b => { const li = document.createElement('li'); li.textContent = b; deckList.appendChild(li); });
  plainText.textContent = s.plain;
  Array.from(dots.children).forEach((d, i) => d.classList.toggle('on', i === idx));
  backBtn.disabled = idx === 0;
  nextBtn.innerHTML = idx === SLIDES.length - 1
    ? 'Start over <i class="ph-bold ph-arrow-counter-clockwise"></i>'
    : 'Next <i class="ph-bold ph-arrow-right"></i>';
}
nextBtn.addEventListener('click', () => { idx = (idx + 1) % SLIDES.length; render(); });
backBtn.addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
render();

/* ---- MANDATORY viewport scale-to-fit (Notion embeds are 700-900px wide) ---- */
function scaleDeck() {
  const wrapper = document.getElementById('deck-wrapper');
  const scale = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
  wrapper.style.transform = `scale(${scale})`;
  wrapper.style.transformOrigin = 'top center';
}
window.addEventListener('resize', scaleDeck);
scaleDeck();
</script>
</body>
</html>
