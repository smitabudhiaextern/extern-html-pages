<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can They Back It Up?</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#FDF8F8;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
color:#484646;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#w{position:absolute;top:0;left:0;width:960px;height:540px;overflow:hidden;transform-origin:top left}
.slide{position:absolute;top:0;left:0;width:960px;height:540px;
padding:24px 72px 20px;display:grid;grid-template-rows:20px 14px 402px 16px 44px;
background:#FDF8F8;text-align:left}
.slide[hidden]{display:none}
.hd{grid-row:1;display:flex;align-items:center;justify-content:space-between;
font-size:13px;line-height:20px;color:#484646}
.hd .rh{font-weight:500}
.hd .pos{font-variant-numeric:tabular-nums}
.bd{grid-row:3;height:402px;display:flex;flex-direction:column;justify-content:center}
.ab{grid-row:5;height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.abl,.abr{display:flex;align-items:center;gap:12px}
h1,h2{font-weight:600;color:#1C1B1B}
h1{font-size:30px;line-height:1.18;width:fit-content;max-width:100%}
h2{font-size:24px;line-height:1.22;width:fit-content;max-width:100%}
h1:focus,h2:focus,h1.fx,h2.fx{outline:3px solid #001D69;outline-offset:4px;border-radius:2px}
.ask{font-size:18px;line-height:1.5;color:#1C1B1B;max-width:730px;margin-top:16px}
.end{font-size:15px;line-height:1.4;color:#484646;text-align:right;max-width:420px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* the paper form */
.form{border:1.5px solid #001D69;background:#FDF8F8;border-radius:3px;padding:16px 20px}
.fhd{border-bottom:1px solid rgba(0,29,105,0.55);padding-bottom:9px}
.fco{font-size:15px;font-weight:600;letter-spacing:0.09em;color:#1C1B1B;line-height:1.25}
.fsub{font-size:13px;color:#484646;line-height:1.35;margin-top:2px}
.fnote{font-size:13px;color:#484646;line-height:1.35;margin-top:9px}
.fq{font-size:17px;font-weight:500;color:#1C1B1B;line-height:1.35;margin-top:12px}
.ftick{font-size:17px;font-weight:500;color:#1C1B1B;line-height:1.35;margin-top:10px}
.fc{font-size:15px;color:#484646;line-height:1.5;margin-top:10px}
.sig{display:flex;gap:14px;margin-top:16px;align-items:stretch}
.sf{border-bottom:1px solid rgba(0,29,105,0.55);padding-bottom:4px;min-height:34px;
display:flex;align-items:flex-end;flex-wrap:wrap;gap:0 5px}
.s1{flex:1.6 1 0}
.s2{flex:1 1 0}
.s3{flex:1.2 1 0}
.fl{font-size:12px;color:#484646;line-height:1.4}
.fv{font-size:13.5px;color:#1C1B1B;line-height:1.4}
.bx{width:18px;height:18px;fill:none;stroke:#001D69;stroke-width:2;
stroke-linecap:round;stroke-linejoin:round;display:block;flex:0 0 auto}

/* the same form, shrunk, once the student has read it once */
.form.mini{padding:12px 14px;border-width:1.2px}
.mini .fco{font-size:12px;letter-spacing:0.07em}
.mini .fsub{font-size:10.5px}
.mini .fhd{padding-bottom:7px}
.mini .fnote{font-size:10.5px;margin-top:7px}
.mini .fq{font-size:13px;margin-top:9px}
.mini .ftick{font-size:13px;margin-top:8px}
.mini .fc{font-size:11.5px;margin-top:8px;line-height:1.45}
.mini .sig{margin-top:11px;gap:9px}
.mini .sf{min-height:32px;padding-bottom:3px;flex-direction:column;
align-items:flex-start;justify-content:flex-end;gap:1px 0}
.mini .fl{font-size:9px;letter-spacing:0.02em}
.mini .fv{font-size:10px}
.mini .s1{flex:2 1 0}
.mini .s2{flex:0.9 1 0}
.mini .s3{flex:1.3 1 0}
.mini .bx{width:14px;height:14px}
.mini .tickw{gap:6px}
.mini .cw{width:13px;height:13px;font-size:8.5px;margin-left:3px}

/* strikethrough, drawn, with a numbered tag so it never reads by colour alone */
.mark{white-space:nowrap}
.st{position:relative;text-decoration:none;color:inherit}
.tickw{display:inline-flex;align-items:center;gap:7px;vertical-align:middle}
.st::after{content:"";position:absolute;left:-1px;right:-1px;top:53%;height:1.6px;
background:#484646;transform:scaleX(0);transform-origin:left center;
transition:transform 0.42s ease}
.mark.on .st::after{transform:scaleX(1)}
.cw{display:none;align-items:center;justify-content:center;width:15px;height:15px;
border-radius:999px;border:1px solid #001D69;background:#DCE1FF;color:#001D69;
font-size:9.5px;font-weight:600;line-height:1;margin-left:4px;vertical-align:middle;
font-variant-numeric:tabular-nums}
.mark.on .cw{display:inline-flex;animation:fadein 0.3s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* slide 3, everything recedes but the field nobody filled in */
.fpart{transition:opacity 0.5s ease}
.form.dim .fpart{opacity:0.28}
.form.dim{border-color:rgba(0,29,105,0.3)}
.rev{transition:background 0.5s ease}
.form.dim .rev{background:#DCE1FF;border-bottom:2px solid #001D69;
justify-content:flex-start;border-radius:3px 3px 0 0;padding:5px 8px 0}
.form.dim .rev .fl{color:#001D69;font-weight:600}

/* two column arrangement, form left */
.cols{display:grid;grid-template-columns:452px 1fr;gap:0 40px;align-items:start;margin-top:12px}
.know{background:#DCE1FF;border-left:4px solid #001D69;border-radius:0 10px 10px 0;
padding:9px 14px;display:flex;align-items:flex-start;gap:10px}
.knn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
width:18px;height:18px;border-radius:999px;border:1px solid #001D69;background:#FDF8F8;
color:#001D69;font-size:11px;font-weight:600;line-height:1;margin-top:2px;
font-variant-numeric:tabular-nums}
.knt{font-size:16.5px;font-weight:500;line-height:1.3;color:#1C1B1B}
.kns{font-size:12.5px;line-height:1.35;color:#484646;margin-top:3px}
.stack{display:flex;flex-direction:column;gap:11px}
.foot{font-size:16px;line-height:1.45;color:#1C1B1B;margin-top:14px;
border-left:3px solid #001D69;padding-left:14px}
.said{font-size:22px;font-weight:600;line-height:1.28;color:#1C1B1B}
.said2{font-size:17px;line-height:1.5;color:#484646;margin-top:16px}

/* icons and buttons */
.ic{display:block;width:18px;height:18px;fill:none;stroke:#001D69;stroke-width:1.8;
stroke-linecap:round;stroke-linejoin:round}
.btn{font-family:inherit;font-size:15px;font-weight:500;line-height:1;height:40px;
padding:0 20px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
border:1px solid #001D69;background:#001D69;color:#FDF8F8}
.btn .ic{stroke:#FDF8F8}
.btn.sec{background:transparent;color:#001D69}
.btn.sec .ic{stroke:#001D69}
.btn:disabled{background:transparent;border-color:#484646;color:#484646;cursor:default}
.btn:disabled .ic{stroke:#484646}
.btn:focus-visible{outline:3px solid #001D69;outline-offset:2px}

/* motion primitives, all reversible to a finished state */
.rise{opacity:0;transform:translateY(8px);transition:opacity 0.36s ease,transform 0.36s ease}
.rise.on{opacity:1;transform:translateY(0)}
.fade{opacity:0;transition:opacity 0.4s ease}
.fade.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* portrait */
#w.pm{width:540px;height:720px}
#w.pm .slide{width:540px;height:720px;padding:24px 32px 20px;
grid-template-rows:20px 14px 582px 16px 44px}
#w.pm .bd{height:582px}
#w.pm h1{font-size:23px;line-height:1.24}
#w.pm h2{font-size:22px;line-height:1.24}
#w.pm .ask{font-size:17px;max-width:100%;margin-top:14px}
#w.pm .cols{grid-template-columns:1fr;gap:16px 0}
#w.pm .said{font-size:20px}
#w.pm .said2{font-size:16px;margin-top:12px}
#w.pm .knt{font-size:15.5px}
#w.pm .foot{font-size:15px;margin-top:12px}
#w.pm .end{font-size:13px;max-width:300px}
#w.pm .btn{font-size:13.5px;padding:0 12px;height:40px;line-height:1.2;text-align:center}
#w.pm .ab{gap:8px}
#w.pm .abl,#w.pm .abr{gap:8px}
</style>
</head>
<body>
<div id="w"></div>
<script>
(function(){
var W=document.getElementById('w');
var RUNHEAD='Can They Back It Up?';
var N=3;
var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;

var P={
back:'<line x1="20" y1="12" x2="5.5" y2="12"/><polyline points="11 6.5 5.5 12 11 17.5"/>',
next:'<line x1="4" y1="12" x2="18.5" y2="12"/><polyline points="13 6.5 18.5 12 13 17.5"/>',
replay:'<polyline points="4 5 4 10.5 9.5 10.5"/><path d="M4.6 14.2a8 8 0 1 0 1.2-6"/>'};
function ic(d){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+d+'</svg>';}

var KNOW=[
{t:'Assets with nobody answerable for them',s:'your inventory, column D'},
{t:'Two client records that do not agree',s:'the box at the foot of your inventory'},
{t:'Assets that were on neither record',s:'the rows you added yourself'}];
var FOOT='Every one of those came from work you did. None of it was available to Ray.';
var SAID1='Nobody lied. Ray wrote down what he believed, and nobody checked it.';
var SAID2='That is what the empty field is. Not a person who failed. A step that was never anybody&rsquo;s job.';

/* the questionnaire extract */
function tag(n){
  return '<span class="cw"><span class="sr">struck out, note </span>'+n+'</span>';
}
function boxIcon(){
  return '<svg class="bx" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+
    '<rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/>'+
    '<polyline points="7.6 12.4 10.9 15.7 16.9 8.6"/></svg>';
}
function formHTML(sfx,mini){
  var h='<div class="form'+(mini?' mini':'')+'" id="fm'+sfx+'">';
  h+='<div class="fhd fpart"><p class="fco">CUMBERLAND CLAIMS SERVICES</p>'+
     '<p class="fsub">Vendor security questionnaire, returned 14 months ago</p></div>';
  h+='<p class="fnote fpart">Filled in internally, from memory, over two afternoons.</p>';
  h+='<p class="fq fpart">Do you maintain a list of every system that holds patient data?</p>';
  h+='<p class="ftick fpart"><span class="mark" id="k3'+sfx+'">'+
     '<s class="st tickw">'+boxIcon()+'Yes</s>'+tag(3)+'</span></p>';
  h+='<p class="fc fpart">Supporting comment: &ldquo;Our systems administrator maintains '+
     '<span class="mark" id="k1'+sfx+'"><s class="st">a full list</s>'+tag(1)+'</span> of '+
     '<span class="mark" id="k2'+sfx+'"><s class="st">company systems</s>'+tag(2)+'</span>.&rdquo;</p>';
  h+='<div class="sig">'+
     '<div class="sf s1 fpart"><span class="fl">Signed:</span>'+
     '<span class="fv">Ray Okafor, Chief Operating Officer</span></div>'+
     '<div class="sf s2 fpart"><span class="fl">Date:</span>'+
     '<span class="fv">14 months ago</span></div>'+
     '<div class="sf s3 rev"><span class="fl">Reviewed by:</span>'+
     '<span class="fv"><span class="sr">left blank</span></span></div></div>';
  h+='</div>';
  return h;
}

/* slide bodies */
function body1(){
  return '<h1 tabindex="-1" class="fade" id="hd1">The Answer They Already Gave</h1>'+
    '<div class="rise" id="f1wrap" style="margin-top:18px">'+formHTML('a')+'</div>'+
    '<p class="ask rise" id="ask1">You have just built the list they are describing. '+
    'Could Cumberland back this up today?</p>';
}
function body2(){
  var k='<div class="stack">';
  for(var i=0;i<KNOW.length;i++){
    k+='<div class="know rise" id="kn'+i+'"><span class="knn">'+(i+1)+'</span>'+
       '<div><p class="knt">'+KNOW[i].t+'</p><p class="kns">'+KNOW[i].s+'</p></div></div>';
  }
  k+='</div>';
  return '<h2 tabindex="-1" class="fade" id="hd2">What You Know Now</h2>'+
    '<div class="cols"><div>'+formHTML('b',1)+'</div><div>'+k+'</div></div>'+
    '<p class="foot fade" id="foot2">'+FOOT+'</p>';
}
function body3(){
  return '<div class="cols" style="margin-top:0"><div>'+formHTML('c',1)+'</div>'+
    '<div><h2 tabindex="-1" class="said fade" id="hd3">'+SAID1+'</h2>'+
    '<p class="said2 fade" id="said2">'+SAID2+'</p></div></div>';
}

var BODIES=[body1,body2,body3];
var slides=[],heads=[];
for(var i=0;i<N;i++){
  var sec=document.createElement('section');
  sec.className='slide s'+(i+1);
  sec.setAttribute('role','group');
  sec.setAttribute('aria-label','Slide '+(i+1)+' of '+N);
  if(i>0){sec.hidden=true;}
  var left='<button class="btn sec" type="button" data-a="back">'+ic(P.back)+'Back</button>'+
    '<button class="btn sec" type="button" data-a="replay">'+ic(P.replay)+'Replay</button>';
  var right='';
  if(i===0){
    right='<button class="btn sec" type="button" data-a="next">Yes, they could</button>'+
      '<button class="btn sec" type="button" data-a="next">No, they could not</button>';
  }else if(i===1){
    right='<button class="btn" type="button" data-a="next">Next'+ic(P.next)+'</button>';
  }else{
    right='<p class="end">That is the end of this activity. Go back to the module to keep reading.</p>';
  }
  sec.innerHTML='<div class="hd" aria-hidden="true"><span class="rh">'+RUNHEAD+'</span>'+
    '<span class="pos">'+(i+1)+' of '+N+'</span></div>'+
    '<div class="bd">'+BODIES[i]()+'</div>'+
    '<div class="ab"><div class="abl">'+left+'</div><div class="abr">'+right+'</div></div>';
  W.appendChild(sec);
  slides.push(sec);
  heads.push(sec.querySelector('h1,h2'));
}

/* staged reveal */
var timers=[],cur=0;
function clear(){for(var q=0;q<timers.length;q++){clearTimeout(timers[q]);}timers=[];}
function at(ms,fn){if(RM){fn();return;}timers.push(setTimeout(fn,ms));}
function all(sec,sel){return Array.prototype.slice.call(sec.querySelectorAll(sel));}
function reset(sec){
  all(sec,'.rise,.fade,.mark').forEach(function(e){e.classList.remove('on');});
  all(sec,'.form').forEach(function(e){e.classList.remove('dim');});
  void sec.offsetWidth;
}
function on(sec,id){var e=sec.querySelector('#'+id);if(e){e.classList.add('on');}}

function play(n){
  var sec=slides[n];
  clear();reset(sec);
  if(n===0){
    at(60,function(){on(sec,'hd1');});
    at(260,function(){on(sec,'f1wrap');});
    at(760,function(){on(sec,'ask1');});
  }else if(n===1){
    at(60,function(){on(sec,'hd2');});
    at(240,function(){on(sec,'kn0');});
    at(740,function(){on(sec,'k1b');});
    at(1240,function(){on(sec,'kn1');});
    at(1740,function(){on(sec,'k2b');});
    at(2240,function(){on(sec,'kn2');});
    at(2740,function(){on(sec,'k3b');});
    at(3340,function(){on(sec,'foot2');});
  }else{
    on(sec,'k1c');on(sec,'k2c');on(sec,'k3c');
    at(300,function(){sec.querySelector('#fmc').classList.add('dim');});
    at(950,function(){on(sec,'hd3');});
    at(1600,function(){on(sec,'said2');});
  }
}

/* navigation */
function show(n){
  if(n<0||n>=N){return;}
  slides[cur].hidden=true;
  cur=n;
  slides[cur].hidden=false;
  all(slides[cur],'[data-a="back"]').forEach(function(b){b.disabled=(cur===0);});
  for(var k=0;k<heads.length;k++){if(heads[k]){heads[k].classList.remove('fx');}}
  if(heads[cur]){heads[cur].classList.add('fx');heads[cur].focus();}
  play(cur);
  fit();
}
heads.forEach(function(h){
  if(!h){return;}
  h.addEventListener('blur',function(){h.classList.remove('fx');});
});
W.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('button[data-a]'):null;
  if(!b||b.disabled){return;}
  var a=b.getAttribute('data-a');
  if(a==='next'){show(cur+1);}
  else if(a==='back'){show(cur-1);}
  else if(a==='replay'){play(cur);}
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){e.preventDefault();show(cur+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();show(cur-1);}
});

function fit(){
  var pm=window.innerWidth<600;
  if(pm){W.classList.add('pm');}else{W.classList.remove('pm');}
  var cw=pm?540:960,ch=pm?720:540;
  var s=Math.min(window.innerWidth/cw,window.innerHeight/ch,1);
  W.style.transform='scale('+s+')';
  W.style.left=Math.max(0,(window.innerWidth-cw*s)/2)+'px';
  W.style.top=Math.max(0,(window.innerHeight-ch*s)/2)+'px';
}
window.addEventListener('resize',fit);
window.addEventListener('load',fit);
slides[0].querySelector('[data-a="back"]').disabled=true;
fit();
var start=parseInt((location.hash||'').replace('#',''),10);
if(start>=1&&start<=N){show(start-1);}else{play(0);}
}());
</script>
</body>
</html>
