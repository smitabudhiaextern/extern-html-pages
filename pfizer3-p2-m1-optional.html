<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Essentials Extras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Optional Reading for Project 2, module 1 (Know the Python
   Essentials): seven topics as toggles, only one open at a time. Each closed toggle shows a title and a
   "Read this if..." hint so the student can choose.
   Same build as project-03/pfizer3-p3-m5-optional.html: the toggles copy the shape, spacing, header layout, chevron
   and open and close behaviour of the frozen template accordions; their colours come only from this design
   system's tokens. The link card is the one in pfizer3-p1-m3-how-ai-reads.html.
   Fixed stage: laid out once on a 760 x 980 design stage (set the Notion embed height to 980 px), then
   scaled as one piece to fit the embed frame and centred. Nothing scrolls. A topic too long to fit when
   open is split into short parts with Back and Next inside the open toggle.
   The text is the old course text (the old "Know the Python Essentials" page and the old "Python Introduction and
   Basics" and "Data Structures" notebooks), kept word for word, with only the mistakes fixed, plain definitions
   added and em dashes removed. Every output is real, run in Python 3.12.
   Revision, 10 November 2026 (M1-REVISION.md items B and C): the topic on join(), startswith(), endswith() and
   [::-1] moved here from the Learn deck, with the Learn cards' wording; the typecasting code moved to the Learn
   deck, so only the exercise stays here; the SME's two "Learn more" videos (Mosh, Khan Academy) joined the
   slicing video. The new outputs were run in Python 3.9.6 on 10 November 2026. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --action:var(--extern-black); --on-action:var(--extern-white);
  --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --stage-w:760px; --stage-h:980px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;overflow:hidden;background:var(--surface);padding:16px 20px}

/* Accordion: the shape, spacing, header layout and chevron of the frozen template accordions
   (one bordered box, hairlines between items, title left and chevron right), in this design system's colours. */
.toggles{max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
/* A topic split into parts fills the stage, so Back and Next stay in one place from part to part. */
.app.fill .toggles{height:100%}
.item{flex:none;display:flex;flex-direction:column;min-height:0}
.item+.item{border-top:1px solid var(--line)}
.app.fill .item.open{flex:1 1 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;margin:0;border:0;background:none;text-align:left;cursor:pointer;padding:18px 20px;transition:background-color .15s ease}
.head:hover{background:var(--surface-card)}
.head:focus-visible{outline-offset:-2px;border-radius:0}
.ht{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{margin:0;font-family:var(--font-text);font-size:16px;font-weight:600;line-height:1.45;color:var(--ink)}
.hint{font-size:14px;line-height:1.45;color:var(--ink-muted)}
.chev{flex:none;width:20px;height:20px;color:var(--gray-600);transition:transform .2s ease}
.item.open .chev{transform:rotate(180deg)}

/* The open topic's reading area */
.body{display:none}
.item.open .body{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.pane{flex:1 1 auto;min-height:0;padding:2px 20px 16px;display:flex;flex-direction:column;gap:10px}
.pane p{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty}
.pane b{font-weight:600;color:var(--ink)}
.pane h3{margin:4px 0 0;font-family:var(--font-text);font-size:16px;font-weight:600;line-height:1.35;color:var(--ink)}
.pane ul{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:4px}
.pane li{font-size:15.5px;line-height:1.5;color:var(--ink-muted);padding-left:2px;text-wrap:pretty}
.pane li::marker{color:var(--step-label)}
.pane code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-card);color:var(--ink);padding:1px 5px;border-radius:5px;white-space:nowrap}

/* Code and output blocks, built from the design system's tokens. Outputs have no Copy button. */
.code{background:var(--surface-card);border-radius:var(--radius-sm);flex:none}
.code-head{padding:6px 14px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label);border-bottom:1px solid var(--blue-200)}
.code pre{margin:0;padding:9px 14px;font-family:var(--font-mono);font-size:13px;line-height:1.5;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}

/* Tip callout, built from the design system's tokens (pale-blue card, Pfizer blue icon in a white square) */
.tip{display:flex;gap:14px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:14px 16px;margin-top:2px}
.tip-icon{flex:none;width:34px;height:34px;border-radius:var(--radius-xs);background:var(--extern-white);display:flex;align-items:center;justify-content:center;color:var(--pfizer-blue)}
.tip-icon svg{width:20px;height:20px}
.tip-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
.tip-text p{color:var(--card-text);font-size:15px}

/* Part Back and Next, only for topics with more than one part */
.pnav{flex:none;display:flex;align-items:center;gap:12px;padding:8px 20px;border-top:1px solid var(--line)}
.pnav[hidden]{display:none}
.where{flex:1;font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-text);font-size:14px;line-height:1.2;font-weight:600;padding:7px 14px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.btn svg{width:13px;height:13px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.btn-next:disabled{opacity:.35;cursor:default}
/* Link card for the recommended video (same build as pfizer3-p1-m3-how-ai-reads.html) */
.link-card{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);text-decoration:none;flex:none}
.link-card:hover{border-color:var(--ink)}
.link-card:focus-visible{border-radius:var(--radius-sm)}
.lc-thumb{flex:none;width:56px;height:48px;border-radius:var(--radius-xs);background:var(--surface-card);color:var(--pfizer-blue);display:flex;align-items:center;justify-content:center}
.lc-thumb svg{width:22px;height:22px}
.lc-body{flex:1;min-width:0;display:grid;gap:2px}
.lc-title{font-size:15px;font-weight:600;line-height:1.35}
.lc-url{font-size:13px;line-height:1.4;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-card .ext{width:18px;height:18px;color:var(--gray-600);flex:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:no-preference){ .pane.anim{animation:in .22s ease} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
@media (prefers-reduced-motion:reduce){ .chev,.head{transition:none} }
/* While a topic is open, the closed topics shrink to their titles, so the open one has room to read. */
.app.has-open .item:not(.open) .hint{display:none}
.app.has-open .item:not(.open) .head{padding:9px 20px}
.app.has-open .item:not(.open) .t{font-size:15px}
.app.has-open .item.open .head{padding:14px 20px 10px}
/* Two blocks side by side (code and its output) */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start;flex:none}
.pane a:not(.link-card){color:var(--pfizer-blue);font-weight:600}
.pane i{font-style:italic}
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="Optional reading: seven topics. Open one at a time."><div class="toggles" id="toggles"></div></div>

<script>
(function () {
  "use strict";
  var CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5.5 7.75 4.5 4.5 4.5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var BACK = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var NEXT = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var BULB = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2a.8.8 0 0 0-1.2.7Z" fill="currentColor"/></svg>';
  var EXT = '<svg class="ext" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M11.5 3.75h4.75V8.5M16 4l-7 7M14.25 11.5v3.25c0 .8-.7 1.5-1.5 1.5h-7.5c-.8 0-1.5-.7-1.5-1.5v-7.5c0-.8.7-1.5 1.5-1.5H8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function out(label, text) {
    return '<div class="code"><div class="code-head">' + label + '</div><pre>' + esc(text) + '</pre></div>';
  }
  function two(a, b, w) { return '<div class="two"' + (w ? ' style="grid-template-columns:' + w + '"' : '') + '>' + a + b + '</div>'; }
  function ex(title, body) { return '<div class="tip"><span class="tip-icon">' + PEN + '</span><div class="tip-text"><p><b>' + title + '</b></p>' + body + '</div></div>'; }

  var PEN = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m13.5 6.5 4 4" stroke="currentColor" stroke-width="1.7"/></svg>';
  var TRYLINE = '<p>You can try this in a Colab notebook once you\'ve set one up in "Start Using Google Colab", later in this step.</p>';

  /* Every output below is real: run in Python 3.12, 10 November 2026. The datetime outputs show the moment they ran. */
  var TOPICS = [
    { title: "Where Python came from, and why so many people use it",
      hint: "Read this if you're curious why Python is the language this externship uses.",
      parts: ["Python: A Quick Intro", "Why Python?"],
      panes: [
        '<p>Hey there! Before we dive into the deep end with libraries like Pandas and NumPy, let\'s start at the beginning with a quick intro to Python. It\'s been around since 1991, but really started turning heads in 2005 with Django, its web framework. Over the last two decades, Python has become indispensable in fields like scientific computing, data analysis, machine learning, and general software development in both academia and industry.</p>' +
        '<ul>' +
          '<li>A <b>library</b> is a toolbox of ready-made code that someone else has already written, so you don\'t have to. Pandas and NumPy are libraries for working with tables of data and with numbers.</li>' +
          '<li>A <b>web framework</b> is a library for building websites. Django is one, written in Python.</li>' +
          '<li><b>Machine learning</b> is a way of building AI: the computer learns patterns from many examples, instead of following rules a person wrote.</li>' +
        '</ul>',

        '<p>While there are other languages out there for data analysis and data science, Python stands out because:</p>' +
        '<ul>' +
          '<li>It offers a vast range of open-source libraries like Pandas and Scikit-learn. (<b>Open-source</b> means free to use, and anyone can read and change the code.)</li>' +
          '<li>It integrates seamlessly with legacy software in C, C++, and FORTRAN, acting as a powerful glue in multi-decade systems. (<b>Legacy software</b> is older programs a company still runs. C, C++ and FORTRAN are older programming languages.)</li>' +
          '<li>It provides a unified environment for all programming needs, whether you\'re prototyping, building complex systems, or crafting analytical applications. (<b>Prototyping</b> means building a quick first version to test an idea.)</li>' +
        '</ul>'
      ] },

    { title: "More data types, and practice changing a value from one type to another",
      hint: "Read this if you want to meet complex numbers, or practice turning a number into text.",
      parts: ["Python Sets the Type for You", "Your Own Types, and a Typecasting Exercise"],
      panes: [
        '<p>These data types are set dynamically based on the value assigned to a variable. Here\'s how simple it is:</p>' +
        out("Python", "var = 50\nprint('value: ', var, ', type: ', type(var))\n\nvar = 45.5\nprint('value: ', var, ', type: ', type(var))\n\nvar = \"Hello World!!\"\nprint('value: ', var, ', type: ', type(var))\n\nvar = 3+5j\nprint('value: ', var, ', type: ', type(var))") +
        out("Output", "value:  50 , type:  <class 'int'>\nvalue:  45.5 , type:  <class 'float'>\nvalue:  Hello World!! , type:  <class 'str'>\nvalue:  (3+5j) , type:  <class 'complex'>") +
        '<p>Likewise for string and all other datatypes. <code>3+5j</code> is a <b>complex number</b>, a kind of number used in advanced math, with a second part written with a <code>j</code>. You won\'t need it in this externship.</p>',

        '<p>There are other more complex types as well in Python, each serving its own purpose. In addition to this, we can also have our own custom types as well (this can be achieved by creating a class and creating an instance of it). A <b>class</b> is a blueprint for your own kind of value, and an <b>instance</b> is one value made from that blueprint.</p>' +
        '<p>Sometimes, you need to convert data from one type to another, a process called <b>typecasting</b>. You already know how from the Learn cards: <code>int()</code>, <code>str()</code> and <code>float()</code>. This exercise lets you practice <code>str()</code> once more.</p>' +
        ex("Exercise 1. Typecasting an Integer to String",
          '<p>Create an integer variable named <code>age</code> and assign it your age. Convert <code>age</code> to a string and print it with the text:</p>' +
          out("Text", "\"I am age years old.\"") + TRYLINE)
      ] },

    { title: "Operators: doing math, comparing values and combining True and False",
      hint: "Read this if you want to calculate, compare or combine values.",
      parts: ["Arithmetic Operators", "More Arithmetic: Remainders, Powers and Whole-Number Division", "Comparison Operators", "Logical Operators", "Bitwise Operations", "Bitwise Operations in Code (1 of 2)", "Bitwise Operations in Code (2 of 2)", "Exercise 2", "Exercises 3 and 4"],
      panes: [
        '<p>In Python, <b>operators</b> are the symbols that facilitate relationships by allowing you to perform calculations, comparisons, and logical operations. They enable your program to make decisions based on the data it processes. For instance, if you want to check if a player\'s score exceeds a certain threshold to unlock a new level, operators help you express that logic clearly. The ability to compare and manipulate data with operators is what gives your programs their intelligence and functionality.</p>' +
        '<p><b>Arithmetic Operators</b>: Perform basic arithmetic operations.</p>' +
        '<ul><li>Addition (<code>+</code>): Adds two values.</li><li>Subtraction (<code>-</code>): Subtracts the second value from the first.</li><li>Multiplication (<code>*</code>): Multiplies two values.</li><li>Division (<code>/</code>): Divides the first value by the second.</li></ul>' +
        two(out("Python", "# Arithmetic Operators\nx = 10\ny = 5\nprint(x + y)  # 15\nprint(x - y)  # 5\nprint(x * y)  # 50\nprint(x / y)  # 2.0"), out("Output", "15\n5\n50\n2.0")) +
        '<p><b>Tip:</b> Use arithmetic operators to quickly calculate anything from simple budgets to complex mathematical problems.</p>',

        '<p>These are used for basic math operations and more, helping you manipulate numerical data effectively.</p>' +
        two(out("Python", "a = 10\nb = 6\nprint(a + b)  # Add: Output will be 16\nprint(a - b)  # Subtract: Output will be 4\nprint(a * b)  # Multiply: Output will be 60\nprint(a / b)  # Division: Output will be approximately 1.67\n\n# Modulus operation returns the remainder of a division\nprint(a % b)  # Output will be 4\n\n# Exponentiation returns the power of one number raised to another\nprint(a ** b)  # Output will be 1000000\n\n# Floor division returns the largest integer less than or equal to the division\nprint(a // b)  # Output will be 1"), out("Output", "16\n4\n60\n1.6666666666666667\n4\n1000000\n1")),

        '<p>These operators compare two values and return a Boolean value (True or False). Let\'s try these in Python now:</p>' +
        two(out("Python", "a = 13\nb = 33\nprint(a > b)  # Is a greater than b? False\nprint(a < b)  # Is a less than b? True\nprint(a == b)  # Is a equal to b? False\nprint(a != b)  # Is a not equal to b? True\nprint(a >= b)  # Is a greater than or equal to b? False\nprint(a <= b)  # Is a less than or equal to b? True"), out("Output", "False\nTrue\nFalse\nTrue\nFalse\nTrue")) +
        '<p>Notice that "is equal to" is two equals signs, <code>==</code>. One equals sign, <code>=</code>, assigns a value to a variable.</p>',

        '<p><b>Logical Operators</b>: Combine conditional statements.</p>' +
        '<ul><li>AND (<code>and</code>): Returns True if both statements are true.</li><li>OR (<code>or</code>): Returns True if at least one of the statements is true.</li><li>NOT (<code>not</code>): Reverses the result, returns False if the result is true.</li></ul>' +
        two(out("Python", "# Logical Operators\nx = True\ny = False\nprint(x and y)  # False\nprint(x or y)   # True\nprint(not x)    # False"), out("Output", "False\nTrue\nFalse")),

        '<p>Bitwise operators are used to perform bitwise calculations on integers. The integers are first converted into binary and then operations are performed on each bit or corresponding pair of bits, hence the name bitwise operators. The result is then returned in decimal format. (<b>Binary</b> writes numbers with only 1s and 0s, and each 1 or 0 is a <b>bit</b>. <b>Decimal</b> is the everyday way of writing numbers.)</p>' +
        '<p>Bitwise operators act on bits and perform bit-by-bit operations. These are useful in lower-level programming tasks like writing algorithms for network protocols. (An <b>algorithm</b> is a set of steps for solving a problem, and a <b>network protocol</b> is the set of rules computers follow to send data to each other.)</p>' +
        '<p>For example, 10 in binary is 1010, and 4 is 0100. The next part shows what each bitwise operator does to them.</p>',

        two(out("Python", "# binary: 1010\na = 10\n\n# binary: 0100\nb = 4\n\n# Bitwise AND: Each bit of the output is 1 if the corresponding bit of a AND b is 1, otherwise it's 0. Output: 0\nprint(a & b)\n\n# Bitwise OR: Each bit of the output is 0 if the corresponding bit of a AND b is 0, otherwise it's 1. Output: 14\nprint(a | b)\n\n# Bitwise XOR: Each bit of the output is the same as the corresponding bit in a if that bit in b is 0, and it's the complement of the bit in a if that bit in b is 1. Output: 14\nprint(a ^ b)"), out("Output", "0\n14\n14"), "minmax(0,1fr) 110px") +
        '<p>The same cell goes on in the next part.</p>',

        '<p>Here\'s the rest of the cell, with the same <code>a</code> and <code>b</code>:</p>' +
        two(out("Python", "# Bitwise NOT: Flips the bits. Output for ~a is -11 because it's the two's complement of a.\nprint(~a)\n\n# Right shift: Shifts the bits of a to the right by 2 places. Output: 2\nprint(a >> 2)\n\n# Left shift: Shifts the bits of a to the left by 2 places. Output: 40\nprint(a << 2)"), out("Output", "-11\n2\n40"), "minmax(0,1fr) 110px") +
        '<p><b>Two\'s complement</b> is the way computers store negative whole numbers in binary.</p>',

        '<p>Try changing the values of a and b in the code snippets above to see how the output changes. Experiment with different operators to get a feel for how they work.</p>' +
        ex("Exercise 2. Performing Operations", '<p>Assign three different integer values to variables <code>a</code>, <code>b</code>, and <code>c</code>. Perform and print the results of their addition, subtraction, multiplication, and division.</p>') + TRYLINE,

        ex("Exercise 3. Comparison for Equality", '<p>Create two integer variables, <code>x</code> and <code>y</code>, assigning them values of your choice. Check if <code>x</code> and <code>y</code> are equal and print the result as a Boolean value.</p>') +
        ex("Exercise 4. Logical AND Operation", '<p>Assign integer values to two variables, <code>num1</code> and <code>num2</code>. Check if both <code>num1</code> and <code>num2</code> are greater than 10 using a logical AND operator. Print the result.</p>') +
        TRYLINE
      ] },

    { title: "More ways to use print()",
      hint: "Read this if you want to change how print() ends a line or separates values.",
      parts: ["Basic Printing and Adding Flair", "Repetition and Separators", "Exercise: End Character in Print Statement"],
      panes: [
        '<p>The <code>print()</code> function is more versatile than it seems at first glance. It\'s your primary tool for displaying output in Python, but it can do a lot more than just spit out text. Let\'s explore how you can use <code>print()</code> to make your output informative and pretty!</p>' +
        '<p><b>Basic Printing.</b> Just saying hello:</p>' +
        two(out("Python", "print(\"Hi all\")"), out("Output", "Hi all")) +
        '<p><b>Adding Flair to Your Text.</b> You can manipulate the end of your print statement on the fly. For example, adding an \'e\' at the end of a greeting:</p>' +
        two(out("Python", "print(\"Hi welcom\", end=\"e\")\nprint('\\n')  # This adds a new line after your text"), out("Output", "Hi welcome\n ")) +
        '<p><code>end</code> is a <b>parameter</b>: an extra setting you give a function inside its brackets. Normally <code>print()</code> ends with a newline. <code>end="e"</code> ends it with an "e" instead. Then <code>print(\'\\n\')</code> prints a newline, and <code>print()</code> adds its own, so you also see a blank line.</p>',

        '<p><b>Getting Fancy with Repetition.</b> What if you want to really emphasize a point?</p>' +
        out("Python", "print(5 * \"How are you \")  # This will repeat the text five times\nprint('\\n')") +
        out("Output", "How are you How are you How are you How are you How are you \n \n ") +
        '<p><b>Separators for Clarity.</b> When you need to print multiple items in one line and want to control the formatting, use a separator:</p>' +
        out("Python", "print('This is how you can use a separator', 'let us see how', sep=' @ ')") +
        out("Output", "This is how you can use a separator @ let us see how") +
        '<p>Normally a comma in <code>print()</code> prints as a space. <code>sep=\' @ \'</code> puts " @ " between the items instead.</p>',

        ex("Exercise 5. End Character in Print Statement",
          '<p>Print any statement and add <code>"@"</code> at the end of the statement using the end parameter in the <code>print()</code> function.</p>' + TRYLINE)
      ] },

    { title: "More string tools: join(), startswith(), endswith() and reversing text with [::-1]",
      hint: "Read this if you want to glue pieces of text back together, check how text starts or ends, or flip a string backwards.",
      parts: ["join() Glues Pieces Back Together", "startswith() and endswith() Answer Yes or No", "Reversing a String with [::-1]"],
      panes: [
        '<p><code>join()</code> does the opposite of <code>split()</code>. Write the glue first, in quotes, then <code>.join()</code> with the pieces inside the brackets.</p>' +
        two(out("Python", "line = \"Date of Manufacture:  20210126 \"\nwords = [\"Certificate\", \"of\", \"Quality\"]\nprint(\" \".join(words))\nprint(\"_\".join(words))\nprint(\" \".join(line.split()))"), out("Output", "Certificate of Quality\nCertificate_of_Quality\nDate of Manufacture: 20210126"), "minmax(0,1fr) 270px") +
        '<p>The last line is a handy trick for messy text. <code>split()</code> drops every extra space, and <code>join()</code> puts back exactly one space between the pieces. So the double space after the colon, and the space at the end, are gone.</p>',

        '<p><code>startswith()</code> checks whether a string begins with some text. It gives back a boolean: <code>True</code> or <code>False</code>. Its partner, <code>endswith()</code>, checks the end.</p>' +
        two(out("Python", "line = \"Date of Manufacture:  20210126 \"\nprint(line.startswith(\"Date\"))\nprint(line.startswith(\"Expiration\"))\nfile_name = \"sample-sdf-document.pdf\"\nprint(file_name.endswith(\".pdf\"))"), out("Output", "True\nFalse\nTrue"), "minmax(0,1fr) 160px") +
        '<p><code>line</code> holds the date line from page 2, so it starts with "Date", not "Expiration". And the supplier file\'s name ends with ".pdf".</p>' +
        '<p>This is how code can find the line it wants on a page of text, such as the one that starts with "Date". You\'ll use <code>True</code> and <code>False</code> to make decisions in a later reading.</p>',

        '<p>You already know the slice <code>[start:stop]</code> from the Learn cards. A slice can also take a third number:</p>' +
        two(out("Python", "my_string = \"Hello, world!\"\nprint(my_string[::-1])  # Reversed string"), out("Output", "!dlrow ,olleH"), "minmax(0,1fr) 170px") +
        '<p><code>[::-1]</code> has a third number, the step. A step of -1 walks backwards, so it reverses the string.</p>'
      ] },

    { title: "Dates and times with the datetime module",
      hint: "Read this if you want Python to tell you today's date, or count the days to a deadline.",
      parts: ["Get Today's Date and Time", "What the Code Does, and Why DateTime Matters", "Playing with Time"],
      panes: [
        '<p>Managing dates and times is a common requirement in many programming tasks. Python\'s <code>datetime</code> module provides a set of tools to handle time-related tasks, making it easier to manage events, logs, timestamps, and more. (A <b>module</b> is a file of ready-made Python code. You bring it into your code with <code>import</code>.)</p>' +
        out("Python", "import datetime\n\n# Get the current date and time\nnow = datetime.datetime.now()\nprint(\"Current date and time:\", now)\n\n# Get the current date\ntoday = datetime.date.today()\nprint(\"Today's date:\", today)\n\n# Create a specific date\nmy_birthday = datetime.date(2000, 1, 1)\nprint(\"My birthday:\", my_birthday)") +
        out("Output (run on 10 November 2026: yours shows the moment you run it)", "Current date and time: 2026-11-10 00:25:51.524958\nToday's date: 2026-11-10\nMy birthday: 2000-01-01"),

        '<ul><li><code>datetime.datetime.now()</code>: Returns the current date and time.</li><li><code>datetime.date.today()</code>: Returns the current date.</li><li><code>datetime.date(2000, 1, 1)</code>: Creates a date object representing January 1, 2000.</li></ul>' +
        '<p><i>"Imagine you\'re building an event planner app. You need to track when a meeting starts, how long it lasts, and even how many days until an important deadline."</i></p>' +
        out("Python", "import datetime\n\n# Example: Calculate days until an event\nevent_date = datetime.date(2027, 1, 1)  # Set an event date\ntoday = datetime.date.today()  # Get today's date\ndays_until_event = (event_date - today).days\n\nprint(f\"There are {days_until_event} days left until the event.\")") +
        out("Output (run on 10 November 2026)", "There are 52 days left until the event.") +
        '<p>Taking one date away from another gives the time between them, and <code>.days</code> turns that into a number of days. The same idea can tell you how old a document is.</p>',

        '<p>Let\'s mix things up by adding some real-time data:</p>' +
        out("Python", "import datetime\nnow = datetime.datetime.now()\n\n# Using f-string for seamless integration of text and data:\nprint(f'Current time is {now}')") +
        out("Output (run on 10 November 2026)", "Current time is 2026-11-10 00:25:51.525145") +
        '<p><b>Simplicity with Positional Arguments.</b> Sometimes, you just need a straightforward way to concatenate (join together) different types of data:</p>' +
        two(out("Python", "print('Current time is', now)"), out("Output", "Current time is 2026-11-10 00:25:51.525145")) +
        '<p>Study more about the <code>datetime</code> module in Python and how to format a date time object in this great read by W3 Schools: <a href="https://www.w3schools.com/python/python_datetime.asp" target="_blank" rel="noopener noreferrer">Dates in Python by W3</a>.</p>'
      ] },

    { title: "Recommended videos: variables, string methods and slicing",
      hint: "Read this if you'd like variables, string methods or slicing explained step by step in a video.",
      parts: ["Recommended Videos: Variables, String Methods and Slicing"],
      panes: [
        '<p>Mosh explains variables and the four data types from the Learn cards (<code>str</code>, <code>int</code>, <code>float</code> and <code>bool</code>) out loud, with short examples. It helps if you\'d like variables explained a second way (about 7 minutes).</p>' +
        '<a class="link-card" href="https://www.youtube.com/watch?v=cQT33yu9pY8" target="_blank" rel="noopener noreferrer">' +
          '<span class="lc-thumb" aria-hidden="true">' + PLAY + '</span>' +
          '<span class="lc-body"><span class="lc-title">Python Variables: Python Tutorial for Beginners with Examples</span><span class="lc-url">Programming with Mosh on YouTube</span></span>' +
          EXT + '<span class="sr-only"> (opens in a new tab)</span>' +
        '</a>' +
        '<p>Khan Academy shows how to call a method with a dot, and tries <code>lower()</code>, <code>upper()</code>, <code>strip()</code>, <code>split()</code> and <code>join()</code> one at a time. It helps if string methods still feel new (about 5 minutes).</p>' +
        '<a class="link-card" href="https://www.youtube.com/watch?v=JJ5Cq6I9lbs" target="_blank" rel="noopener noreferrer">' +
          '<span class="lc-thumb" aria-hidden="true">' + PLAY + '</span>' +
          '<span class="lc-body"><span class="lc-title">String Methods: Intro to CS, Python</span><span class="lc-url">Khan Academy on YouTube</span></span>' +
          EXT + '<span class="sr-only"> (opens in a new tab)</span>' +
        '</a>' +
        '<p>Slicing and indexing are very useful in Python, and it is important that you get used to them. Here is a great video tutorial for the same:</p>' +
        '<a class="link-card" href="https://www.youtube.com/watch?v=ajrtAuDg3yw" target="_blank" rel="noopener noreferrer">' +
          '<span class="lc-thumb" aria-hidden="true">' + PLAY + '</span>' +
          '<span class="lc-body"><span class="lc-title">Python Tutorial: Slicing Lists and Strings</span><span class="lc-url">Corey Schafer on YouTube</span></span>' +
          EXT + '<span class="sr-only"> (opens in a new tab)</span>' +
        '</a>' +
        '<p>It slices lists too. A <b>list</b> holds several values in order, and you\'ll meet lists in a later reading.</p>'
      ] }
  ];

  var app = document.getElementById("app"), list = document.getElementById("toggles");
  var open = -1, part = 0;

  TOPICS.forEach(function (tp, n) {
    var item = document.createElement("div");
    item.className = "item";
    item.innerHTML =
      '<button type="button" class="head" id="h' + n + '" aria-expanded="false" aria-controls="b' + n + '">' +
        '<span class="ht"><span class="t">' + tp.title + '</span><span class="hint">' + tp.hint + '</span></span>' +
        CHEV +
      '</button>' +
      '<div class="body" id="b' + n + '" role="region" aria-labelledby="h' + n + '">' +
        '<div class="pane" aria-live="polite"></div>' +
        '<div class="pnav"' + (tp.panes.length > 1 ? '' : ' hidden') + '>' +
          '<span class="where"></span>' +
          '<button type="button" class="btn btn-back">' + BACK + 'Back</button>' +
          '<button type="button" class="btn btn-next">Next' + NEXT + '</button>' +
        '</div>' +
      '</div>';
    item.querySelector(".head").addEventListener("click", function () { toggle(n); });
    item.querySelector(".btn-back").addEventListener("click", function () { goPart(part - 1); });
    item.querySelector(".btn-next").addEventListener("click", function () { goPart(part + 1); });
    list.appendChild(item);
  });

  function renderPane(anim) {
    if (open < 0) return;
    var tp = TOPICS[open], item = list.children[open];
    var pane = item.querySelector(".pane");
    pane.className = "pane" + (anim ? " anim" : "");
    pane.innerHTML = tp.panes[part];
    if (tp.panes.length > 1) {
      item.querySelector(".where").innerHTML = "Part " + (part + 1) + " of " + tp.panes.length + ": <b>" + tp.parts[part] + "</b>";
      item.querySelector(".btn-back").disabled = part === 0;
      item.querySelector(".btn-next").disabled = part === tp.panes.length - 1;
    }
  }

  function toggle(n) {
    open = open === n ? -1 : n;
    part = 0;
    app.classList.toggle("fill", open >= 0 && TOPICS[open].panes.length > 1);
    app.classList.toggle("has-open", open >= 0);
    Array.prototype.forEach.call(list.children, function (item, k) {
      var on = k === open;
      item.classList.toggle("open", on);
      item.querySelector(".head").setAttribute("aria-expanded", on ? "true" : "false");
      if (!on) item.querySelector(".pane").innerHTML = "";
    });
    renderPane(true);
  }

  function goPart(p) {
    if (open < 0 || p < 0 || p >= TOPICS[open].panes.length) return;
    part = p; renderPane(true);
  }

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  /* Test hook: open a topic and part directly, for example #open=1&part=2. */
  var m = location.hash.match(/open=(\d)(?:&part=(\d))?/);
  if (m) { toggle(+m[1] - 1); if (m[2]) goPart(+m[2] - 1); }
})();
</script>
