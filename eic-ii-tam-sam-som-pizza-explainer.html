<!DOCTYPE html>
<!--
  EIC II — P3 Step 3 teaching interactive: "What TAM, SAM, and SOM Are".
  Pizza-delivery analogy, active learning: predict-before-reveal, then a
  draggable SOM slider so students feel SOM is a judgment call, not a
  sourced figure, then a 2-question quick check with instant feedback.
  All pizza numbers are illustrative/for-practice ONLY, labeled as such.
  Self-contained, no external requests. 960x540 scale-to-fit for Notion.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What TAM, SAM, and SOM Are</title>
<style>
  :root {
    --bg: #FDF8F8;
    --accent: #001D69;
    --lav: #DCE1FF;
    --title: #1C1B1B;
    --body: #484646;
    --white: #FFFFFF;
    --border: #E7E3EC;
    --tam: #7C3AED; --tam-bg: #EDE9FE;
    --sam: #2563EB; --sam-bg: #DBEAFE;
    --som: #EA580C; --som-bg: #FDE3CC;
    --good: #0E9C94; --good-bg: #CCF3F0;
    --warn-ink: #B45309; --warn-bg: #FEF6E7; --warn-line: #E9A23B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#EFEAF0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #stage { position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:flex-start; justify-content:flex-start; }
  #deck-wrapper { width:960px; height:540px; position:relative; overflow:hidden; background:var(--bg); flex-shrink:0; }
  .root { width:960px; height:540px; padding:14px 22px 10px; display:flex; flex-direction:column; }

  .titlebar { display:flex; align-items:baseline; justify-content:space-between; }
  .titlebar h1 { font-size:19px; font-weight:800; color:var(--title); line-height:1.1; }
  .titlebar .tag { font-size:9.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--accent); background:var(--lav); padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .sub { font-size:10.5px; font-weight:600; color:var(--body); margin-top:3px; }

  .scenario { margin-top:8px; background:var(--white); border:1px solid var(--border); border-radius:10px;
    padding:7px 12px; font-size:11px; font-weight:600; color:var(--body); line-height:1.35; }
  .scenario b { color:var(--title); }

  .stagearea { flex:1; display:flex; gap:14px; margin-top:9px; min-height:0; }

  /* left: concentric circles */
  .circles-col { flex:1.05; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:0; position:relative; }
  .rings { position:relative; width:300px; height:300px; }
  .ring { position:absolute; border-radius:50%; display:flex; align-items:flex-start; justify-content:center;
    transition:all .3s ease; cursor:pointer; }
  .ring .rlabel { margin-top:10px; font-size:10.5px; font-weight:800; text-align:center; opacity:0; transition:opacity .3s ease; }
  .ring.revealed .rlabel { opacity:1; }
  #ring-tam { width:300px; height:300px; top:0; left:0; background:var(--tam-bg); border:2px solid var(--tam); }
  #ring-tam .rlabel { color:var(--tam); }
  #ring-sam { width:200px; height:200px; top:50px; left:50px; background:var(--sam-bg); border:2px solid var(--sam); }
  #ring-sam .rlabel { color:var(--sam); }
  #ring-som { width:100px; height:100px; top:100px; left:100px; background:var(--som-bg); border:2px solid var(--som);
    align-items:center; }
  #ring-som .rlabel { margin-top:0; }
  .ring:not(.revealed) { filter:grayscale(1) opacity(.35); }
  .ring:not(.revealed):hover { filter:grayscale(1) opacity(.55); }

  .fig-row { margin-top:12px; display:flex; gap:8px; }
  .fig-chip { font-size:9.5px; font-weight:700; padding:4px 9px; border-radius:999px; border:1px solid var(--border);
    background:var(--white); color:var(--body); opacity:.4; }
  .fig-chip.on { opacity:1; }
  .fig-chip.tam.on { color:var(--tam); border-color:var(--tam); background:var(--tam-bg); }
  .fig-chip.sam.on { color:var(--sam); border-color:var(--sam); background:var(--sam-bg); }
  .fig-chip.som.on { color:var(--som); border-color:var(--som); background:var(--som-bg); }

  /* right: interaction panel */
  .panel { flex:1; background:var(--white); border:1px solid var(--border); border-radius:11px;
    padding:12px 14px; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .stepdot-row { display:flex; gap:5px; margin-bottom:8px; }
  .stepdot { width:20px; height:4px; border-radius:3px; background:var(--border); }
  .stepdot.done { background:var(--accent); }

  .p-badge { align-self:flex-start; font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 9px; border-radius:999px; }
  .p-badge.tam { color:var(--tam); background:var(--tam-bg); border:1px solid var(--tam); }
  .p-badge.sam { color:var(--sam); background:var(--sam-bg); border:1px solid var(--sam); }
  .p-badge.som { color:var(--som); background:var(--som-bg); border:1px solid var(--som); }

  .p-q { font-size:11.5px; font-weight:700; color:var(--title); line-height:1.4; margin-top:8px; }
  .choices { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .choice { text-align:left; cursor:pointer; border:1.5px solid var(--border); background:var(--white);
    border-radius:8px; padding:6px 10px; font-size:10.8px; font-weight:600; color:var(--body); }
  .choice:hover { border-color:var(--accent); }
  .choice.correct { border-color:var(--good); background:var(--good-bg); color:#0b5e58; font-weight:800; }
  .choice.wrong { border-color:#D14343; background:#FDEBEB; color:#8f2b2b; }

  .p-reveal { margin-top:8px; font-size:11px; font-weight:600; color:var(--body); line-height:1.42; }
  .p-reveal b { color:var(--title); }
  .p-note { margin-top:7px; font-size:9.5px; font-weight:700; color:var(--warn-ink); background:var(--warn-bg);
    border:1px solid var(--warn-line); border-radius:7px; padding:5px 9px; line-height:1.35; }

  .nextbtn { margin-top:auto; align-self:flex-end; cursor:pointer; border:none; background:var(--accent); color:#fff;
    font-size:10.5px; font-weight:800; padding:7px 14px; border-radius:8px; }
  .nextbtn:disabled { background:var(--border); color:var(--body); cursor:default; }

  /* slider stage */
  .slider-wrap { margin-top:10px; }
  .slider-readout { font-size:22px; font-weight:800; color:var(--som); }
  .slider-readout .lbl { font-size:9.5px; font-weight:700; color:var(--body); display:block; margin-top:1px; }
  input[type="range"] { width:100%; margin-top:10px; accent-color:var(--som); }
  .slider-marks { display:flex; justify-content:space-between; font-size:9px; font-weight:700; color:var(--body); margin-top:2px; }

  /* quiz stage */
  .quiz-q { margin-top:6px; }
</style>
</head>
<body>
<div id="stage">
  <div id="deck-wrapper">
    <div class="root">

      <div class="titlebar">
        <div>
          <h1>What TAM, SAM, and SOM Are</h1>
          <div class="sub">Three nested market sizes. Work through the pizza example, step by step.</div>
        </div>
        <span class="tag">Practice example</span>
      </div>

      <div class="scenario">🍕 <b>The scenario:</b> imagine you are starting a pizza delivery startup in a mid-size city. All numbers below are made up for practice, not real research.</div>

      <div class="stagearea">
        <div class="circles-col">
          <div class="rings">
            <div class="ring" id="ring-tam"><span class="rlabel">TAM</span></div>
            <div class="ring" id="ring-sam"><span class="rlabel">SAM</span></div>
            <div class="ring" id="ring-som"><span class="rlabel">SOM</span></div>
          </div>
          <div class="fig-row">
            <span class="fig-chip tam" id="chip-tam">TAM —</span>
            <span class="fig-chip sam" id="chip-sam">SAM —</span>
            <span class="fig-chip som" id="chip-som">SOM —</span>
          </div>
        </div>

        <div class="panel" id="panel"></div>
      </div>

    </div>
  </div>
</div>

<script>
var state = { stage: 0 }; // 0=predict, 1=tam reveal, 2=sam predict, 3=sam reveal, 4=som slider, 5=quiz1, 6=quiz2, 7=done
var SOM_PCT = 5;

function setChip(id, text, on) {
  var el = document.getElementById(id);
  el.textContent = text;
  el.classList.toggle('on', !!on);
}
function revealRing(id) {
  document.getElementById(id).classList.add('revealed');
}
function dots(n) {
  var out = '';
  for (var i=0;i<3;i++) out += '<div class="stepdot' + (i < n ? ' done' : '') + '"></div>';
  return out;
}

function render() {
  var p = document.getElementById('panel');

  if (state.stage === 0) {
    p.innerHTML =
      '<div class="stepdot-row">' + dots(0) + '</div>' +
      '<span class="p-badge tam">Step 1 · Predict</span>' +
      '<div class="p-q">The whole city spends money on pizza every month, delivery or not. That total is the <b>TAM</b>, the Total Addressable Market. Before we reveal it: do you think TAM only counts your delivery orders, or every pizza dollar in the city, including sit-down restaurants?</div>' +
      '<div class="choices">' +
        '<button class="choice" data-c="wrong">Only delivery orders, since that is what I would sell</button>' +
        '<button class="choice" data-c="correct">Every pizza dollar in the city, restaurants included</button>' +
      '</div>' +
      '<div class="p-reveal" id="reveal" style="display:none;"></div>' +
      '<button class="nextbtn" id="next" disabled>Reveal TAM →</button>';
    wireChoice(function(picked) {
      document.getElementById('reveal').style.display = 'block';
      document.getElementById('reveal').innerHTML = '<b>TAM is the whole market</b>, every way people spend on pizza in the city: delivery, takeout, and sit-down. It does not care what you personally plan to sell. It is the size of the pie before anyone slices it.';
      document.getElementById('next').disabled = false;
      document.getElementById('next').onclick = function() { state.stage = 1; render(); };
    });
  }

  else if (state.stage === 1) {
    revealRing('ring-tam');
    setChip('chip-tam', 'TAM ≈ $180M / yr', true);
    p.innerHTML =
      '<div class="stepdot-row">' + dots(1) + '</div>' +
      '<span class="p-badge tam">Step 1 · Revealed</span>' +
      '<div class="p-reveal"><b>TAM ≈ $180M a year</b> — all pizza spending in the city, every restaurant and delivery app combined. This is the outer ring: the whole market, whether or not it is realistic for you to reach all of it.</div>' +
      '<button class="nextbtn">Next: narrow it down →</button>';
    document.querySelector('.nextbtn').onclick = function() { state.stage = 2; render(); };
  }

  else if (state.stage === 2) {
    p.innerHTML =
      '<div class="stepdot-row">' + dots(1) + '</div>' +
      '<span class="p-badge sam">Step 2 · Predict</span>' +
      '<div class="p-q">Your startup only does <b>delivery</b>, and only for <b>vegan and gluten-free</b> pizza. That narrower slice is the <b>SAM</b>, the Serviceable Addressable Market. Do you think SAM is closer to half of TAM, or a small fraction of it?</div>' +
      '<div class="choices">' +
        '<button class="choice" data-c="wrong">Close to half of TAM ($90M)</button>' +
        '<button class="choice" data-c="correct">A small fraction of TAM</button>' +
      '</div>' +
      '<div class="p-reveal" id="reveal" style="display:none;"></div>' +
      '<button class="nextbtn" id="next" disabled>Reveal SAM →</button>';
    wireChoice(function(picked) {
      document.getElementById('reveal').style.display = 'block';
      document.getElementById('reveal').innerHTML = '<b>SAM is almost always much smaller than TAM.</b> Most of that $180M is sit-down and regular delivery, not vegan/gluten-free. SAM only counts the slice that matches what you actually offer.';
      document.getElementById('next').disabled = false;
      document.getElementById('next').onclick = function() { state.stage = 3; render(); };
    });
  }

  else if (state.stage === 3) {
    revealRing('ring-sam');
    setChip('chip-sam', 'SAM ≈ $14M / yr', true);
    p.innerHTML =
      '<div class="stepdot-row">' + dots(2) + '</div>' +
      '<span class="p-badge sam">Step 2 · Revealed</span>' +
      '<div class="p-reveal"><b>SAM ≈ $14M a year</b> — the vegan and gluten-free delivery slice only. This is the middle ring: the part of the whole market that your specific offer could realistically serve.</div>' +
      '<button class="nextbtn">Next: the hardest one →</button>';
    document.querySelector('.nextbtn').onclick = function() { state.stage = 4; render(); };
  }

  else if (state.stage === 4) {
    p.innerHTML =
      '<div class="stepdot-row">' + dots(2) + '</div>' +
      '<span class="p-badge som">Step 3 · Your call</span>' +
      '<div class="p-q">SOM is the piece <b>one startup</b>, yours, could realistically win in the next <b>3 to 5 years</b>. Nobody publishes this number. You set it as a percentage of SAM. Drag the slider and watch SOM change.</div>' +
      '<div class="slider-wrap">' +
        '<div class="slider-readout" id="som-readout">$700K <span class="lbl">SOM at 5% of SAM</span></div>' +
        '<input type="range" min="1" max="15" value="5" id="som-slider">' +
        '<div class="slider-marks"><span>1%</span><span>15%</span></div>' +
      '</div>' +
      '<div class="p-note">Most early-stage sizing uses <b>3–5%</b> of SAM as a realistic 3-to-5-year share, not a sourced figure, a judgment call you show your math on.</div>' +
      '<button class="nextbtn">Lock in my SOM →</button>';
    var slider = document.getElementById('som-slider');
    slider.oninput = function() {
      SOM_PCT = parseInt(slider.value, 10);
      var som = Math.round(14000000 * SOM_PCT / 100);
      document.getElementById('som-readout').innerHTML = '$' + (som/1000).toFixed(0) + 'K <span class="lbl">SOM at ' + SOM_PCT + '% of SAM</span>';
    };
    document.querySelector('.nextbtn').onclick = function() { state.stage = 5; render(); };
  }

  else if (state.stage === 5) {
    var som = Math.round(14000000 * SOM_PCT / 100);
    revealRing('ring-som');
    setChip('chip-som', 'SOM ≈ $' + (som/1000).toFixed(0) + 'K / yr', true);
    p.innerHTML =
      '<div class="stepdot-row">' + dots(3) + '</div>' +
      '<span class="p-badge som">Step 3 · Locked in</span>' +
      '<div class="p-reveal"><b>SOM ≈ $' + (som/1000).toFixed(0) + 'K a year</b> at your ' + SOM_PCT + '% assumption. This is the inner ring: not sourced from a report, calculated from SAM and a defendable assumption you can explain out loud.</div>' +
      '<button class="nextbtn">Quick check →</button>';
    document.querySelector('.nextbtn').onclick = function() { state.stage = 6; render(); };
  }

  else if (state.stage === 6) {
    p.innerHTML =
      '<div class="stepdot-row">' + dots(3) + '</div>' +
      '<span class="p-badge som">Quick check 1 of 2</span>' +
      '<div class="p-q quiz-q">Which of the three is usually the smallest number?</div>' +
      '<div class="choices">' +
        '<button class="choice" data-c="wrong">TAM</button>' +
        '<button class="choice" data-c="wrong">SAM</button>' +
        '<button class="choice" data-c="correct">SOM</button>' +
      '</div>' +
      '<div class="p-reveal" id="reveal" style="display:none;"><b>Right — SOM is the smallest.</b> TAM &gt; SAM &gt; SOM, always. Each ring narrows down from the whole market to what one company could realistically win.</div>' +
      '<button class="nextbtn" id="next" style="display:none;">Next question →</button>';
    wireChoice(function() {
      document.getElementById('reveal').style.display = 'block';
      var btn = document.getElementById('next');
      btn.style.display = 'inline-block';
      btn.onclick = function() { state.stage = 7; render(); };
    });
  }

  else if (state.stage === 7) {
    p.innerHTML =
      '<div class="stepdot-row">' + dots(3) + '</div>' +
      '<span class="p-badge som">Quick check 2 of 2</span>' +
      '<div class="p-q quiz-q">Which of the three is calculated from a judgment call, not looked up in a research report?</div>' +
      '<div class="choices">' +
        '<button class="choice" data-c="wrong">TAM</button>' +
        '<button class="choice" data-c="wrong">SAM</button>' +
        '<button class="choice" data-c="correct">SOM</button>' +
      '</div>' +
      '<div class="p-reveal" id="reveal" style="display:none;"><b>Right — SOM.</b> TAM and SAM come from real market research, sourced and citable. SOM is your own defendable estimate of what share one company could win, which is exactly what you will build next for the AI data center opportunity.</div>' +
      '<button class="nextbtn" id="next" style="display:none;">Done</button>';
    wireChoice(function() {
      document.getElementById('reveal').style.display = 'block';
      var btn = document.getElementById('next');
      btn.style.display = 'inline-block';
      btn.onclick = function() { state.stage = 8; render(); };
    });
  }

  else if (state.stage === 8) {
    p.innerHTML =
      '<div class="stepdot-row">' + dots(3) + '</div>' +
      '<span class="p-badge som">Done</span>' +
      '<div class="p-reveal"><b>You just built a full TAM → SAM → SOM funnel.</b> TAM is the whole market. SAM is the slice that matches what you offer. SOM is the piece one company could realistically win, a calculation, not a citation. Next: do this for real, sizing an AI data center opportunity with sourced numbers.</div>';
  }
}

function wireChoice(onPick) {
  var btns = document.querySelectorAll('.choice');
  btns.forEach(function(b) {
    b.onclick = function() {
      btns.forEach(function(x) { x.disabled = true; });
      if (b.dataset.c === 'correct') {
        b.classList.add('correct');
      } else {
        b.classList.add('wrong');
        var correctBtn = Array.prototype.find.call(btns, function(x){ return x.dataset.c === 'correct'; });
        if (correctBtn) correctBtn.classList.add('correct');
      }
      onPick(b.dataset.c);
    };
  });
}

render();

/* ---- scale-to-fit ---- */
function scaleDeck() {
  var w = document.getElementById('deck-wrapper');
  var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
  var tx = Math.max(0, (window.innerWidth - 960 * s) / 2);
  w.style.transformOrigin = 'top left';
  w.style.transform = 'translateX(' + tx + 'px) scale(' + s + ')';
}
window.addEventListener('resize', scaleDeck);
scaleDeck();
</script>
</body>
</html>
