<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Would an Auditor Accept?</title>
<!--
  vCISO P4 Step 1, Module 3: What an Auditor Will Accept as Proof.
  Build spec in 06-content/project-04/step-01/module-03-internal.md (Build note).
  Items, verdicts, weak tags and the closing definition: P4 Sample Pack,
  "Interactive content sets - P4.md", P4-3, word for word. Only #4 is accepted.
  #2 and #3 are weak. The trap is #1, Nate, put in the accept bucket.
  The premise names Cumberland in place of "the client" (build spec).
  Not per scope: the module is identical in every scope (build spec).
  Governing authority: output/programs/vciso/CLAUDE.md section 6.

  Owner's interactive rules (Project 2) applied over the build spec:
  - One thing per screen, "Question N of 6", in place of six cards at once.
  - A pick shows right or wrong at once. Each question has only two answers,
    so a wrong pick shows the right one straight away, green "Right answer"
    (same rule as the yes or no question in vciso-p2-m11). No submit step.
  - The last screen shows where all six belong, then the definition and
    "Only #4 does all three" as the reveal (P4-3).
  - The "Why" lines are P4-3's, turned into full sentences. No new facts.
  - The plain line under each card and each answer is ours, from the
    module's own definition boxes. No new facts.
  Green #146C2E on #E6F4EA (5.7:1), red #B3261E on #FCE8E6 (5.6:1),
  right and wrong only, always with an icon and a word. "Weak, not nothing"
  is navy, so it never reads as right or wrong.
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    /* right and wrong states only, always paired with an icon and a word */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-reveal:460ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto;background:var(--bg)}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:6px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:26px;height:4px;border-radius:2px;background:var(--tint2)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}

  h1{font-size:25px;line-height:1.22;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:8px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px;overflow-y:auto;padding:4px 6px;margin:-4px -6px}
  .lead{flex:0 0 auto;font-size:15.5px;line-height:1.45;color:var(--body);max-width:86ch}
  .lead b{color:var(--title);font-weight:600}
  .sub{flex:0 0 auto;font-size:14px;line-height:1.4;color:var(--body);margin-top:-4px}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- the premise strip ---- */
  .strip{flex:0 0 auto;display:flex;align-items:flex-start;gap:11px;background:var(--bg);
    border:1.5px solid var(--on-highlight);border-radius:10px;padding:7px 14px}
  .strip > svg.ic{width:22px;height:22px;color:var(--on-highlight);flex:0 0 auto;margin-top:1px}
  .strip p{font-size:14.5px;line-height:1.4;color:var(--body)}
  .strip p b{color:var(--title);font-weight:600}

  /* ---- the thing on the table ---- */
  .card{flex:0 0 auto;background:var(--highlight);border-radius:12px;padding:12px 16px;
    display:grid;grid-template-columns:48px 1fr;gap:4px 14px;align-items:center}
  .card .bi{grid-row:1 / span 3;width:48px;height:48px;border-radius:12px;background:var(--bg);border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;align-self:start}
  .card .bi svg.ic{width:28px;height:28px}
  .card .cl{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .card .cb{font-size:20px;font-weight:600;line-height:1.3;color:var(--title)}
  .card .cs{font-size:14px;line-height:1.4;color:var(--body)}

  /* ---- the two answers ---- */
  .opts{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  button.opt{font-family:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--title);
    border:1.5px solid var(--on-highlight);border-radius:10px;padding:9px 12px;
    display:grid;grid-template-columns:36px 1fr auto;gap:11px;align-items:center;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  @media (hover:hover){ button.opt:hover:not(:disabled){background:var(--highlight)}
    html.fresh button.opt:hover:not(:disabled){background:var(--bg)} }
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt:disabled{cursor:default}
  button.opt .oi{width:36px;height:36px;border-radius:10px;background:var(--highlight);color:var(--on-highlight);
    border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center}
  button.opt .oi svg.ic{width:22px;height:22px}
  button.opt .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
  button.opt .on{font-size:16.5px;font-weight:600;line-height:1.25;color:var(--title)}
  button.opt .od{font-size:13.5px;line-height:1.3;color:var(--body)}
  button.opt .mk{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px}
  button.opt .lb{font-size:12.5px;font-weight:700;line-height:1.15;text-align:center}
  /* The state marker. Empty ring until clicked. Nothing is ever pre-selected. */
  button.opt .g{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;background:transparent}
  button.opt .g svg.ic{width:14px;height:14px;stroke-width:2.6}
  button.opt.ok{background:var(--ok-tint);border:2px solid var(--ok)}
  button.opt.ok .g{background:var(--ok);border-color:var(--ok);color:var(--bg)}
  button.opt.ok .lb{color:var(--ok)}
  button.opt.ok .oi{background:var(--bg);border-color:var(--ok);color:var(--ok)}
  button.opt.no{background:var(--no-tint);border:2px solid var(--no)}
  button.opt.no .g{background:var(--no);border-color:var(--no);color:var(--bg)}
  button.opt.no .lb{color:var(--no)}
  button.opt.no .oi{background:var(--bg);border-color:var(--no);color:var(--no)}
  /* Not picked, once the question is finished. */
  button.opt.idle{border-style:dashed;border-color:var(--line)}
  button.opt.idle .g{border-color:var(--line)}
  button.opt.idle .on{color:var(--body)}

  /* ---- feedback ---- */
  .fb{flex:0 0 auto;border-radius:10px;padding:9px 16px 11px;border-left:6px solid;display:flex;flex-direction:column;gap:5px}
  .fb.ok{background:var(--ok-tint);border-color:var(--ok)}
  .fb.no{background:var(--no-tint);border-color:var(--no)}
  .fb .fh{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;flex-wrap:wrap}
  .fb.ok .fh{color:var(--ok)}
  .fb.no .fh{color:var(--no)}
  .fb .fh > svg.ic{width:22px;height:22px;stroke-width:2}
  .fb .ft{font-size:15px;line-height:1.42;color:var(--title)}
  .fb .ft b{font-weight:700}
  .fb.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .fb:focus{outline:none}

  /* "Weak, not nothing": navy, never green or red. */
  .weak{display:inline-flex;align-items:center;gap:5px;background:var(--highlight);border:1.5px solid var(--on-highlight);
    border-radius:20px;padding:1px 9px 1px 6px;font-size:12.5px;font-weight:700;color:var(--on-highlight);white-space:nowrap;line-height:1.5}
  .weak svg.ic{width:15px;height:15px;stroke-width:2}

  /* ---- the last screen ---- */
  .buckets{flex:0 0 auto;display:grid;grid-template-columns:1fr 1.55fr;gap:14px;align-items:start}
  .buckets .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .bucket{border:1.5px solid var(--on-highlight);border-radius:12px;background:var(--bg);overflow:hidden}
  .bucket .bh{display:flex;align-items:center;gap:9px;background:var(--highlight);padding:8px 14px;
    font-size:15.5px;font-weight:600;color:var(--title)}
  .bucket .bh svg.ic{width:22px;height:22px;color:var(--on-highlight)}
  .bucket ul{list-style:none}
  .bucket li{display:grid;grid-template-columns:30px 1fr;gap:4px 8px;padding:6px 14px;border-top:1.5px solid var(--line);align-items:start}
  .bucket li:first-child{border-top:0}
  .bucket .n{font-size:14px;font-weight:700;color:var(--on-highlight);line-height:1.35}
  .bucket .t{font-size:14px;line-height:1.35;color:var(--title)}
  .bucket .tags{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
  .mk2{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .mk2 svg.ic{width:14px;height:14px;stroke-width:2.6;flex:0 0 auto}
  .mk2.ok{color:var(--ok)}
  .mk2.sh{color:var(--on-highlight)}
  .lead .mk2{font-size:14px;vertical-align:-2px}
  .statement{flex:0 0 auto;background:var(--highlight);border-left:5px solid var(--on-highlight);
    border-radius:0 10px 10px 0;padding:10px 18px}
  .statement p{font-size:17px;line-height:1.4;font-weight:600;color:var(--title)}
  .statement p + p{margin-top:3px}

  /* Added by render() only when a screen would not fit the 540px canvas
     (desktop only): slightly tighter spacing, nothing hidden. */
  .frame.tight .board{gap:6px}
  .frame.tight .card{padding:9px 14px}
  .frame.tight .card .cb{font-size:18.5px}
  .frame.tight button.opt{padding:7px 12px}
  .frame.tight .fb{padding:7px 16px 8px;gap:3px}
  .frame.tight .fb .ft{font-size:14.5px;line-height:1.36}
  .frame.tight .bucket li{padding:4px 14px}
  .frame.tight .statement{padding:7px 18px}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:52px;padding-top:9px}
  button.nav{font-family:inherit;font-size:15px;font-weight:600;padding:9px 20px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.36;color:var(--body)}
  #hint b{color:var(--title);font-weight:600}
  .bar.ask #hint{order:-1;color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .segs i{width:22px}
    h1{font-size:22px}
    .lead{font-size:16px}
    .sub{font-size:15px}
    .board{flex:0 0 auto;overflow:visible}
    .strip p{font-size:15px}
    .card{grid-template-columns:40px 1fr;gap:4px 12px;padding:12px 14px}
    .card .bi{width:40px;height:40px;grid-row:1 / span 1}
    .card .bi svg.ic{width:24px;height:24px}
    .card .cb{font-size:18px;grid-column:1 / -1}
    .card .cs{font-size:15px;grid-column:1 / -1}
    .opts{grid-template-columns:1fr;gap:10px}
    button.opt{padding:12px 10px 12px 12px;grid-template-columns:36px 1fr auto}
    button.opt .od{font-size:15px}
    .fb .ft{font-size:16px;line-height:1.45}
    .fb{scroll-margin:16px}
    .bar{scroll-margin-bottom:16px}
    .buckets{grid-template-columns:1fr}
    .buckets .col{display:contents}
    .statement{order:3}
    .bucket .t{font-size:15.5px}
    .mk2{font-size:14px}
    .statement p{font-size:18px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{font-size:15px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="What Would an Auditor Accept?">

      <span class="segs" id="segs" aria-hidden="true"></span>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:18px;color:#1C1B1B;margin:24px 0 6px}

  </style>
  <div class="nsf">
    <h2>What Would an Auditor Accept?</h2>
    <p>Cumberland reviews its firewall every three months. You know this for a fact, because Nate, Cumberland’s systems administrator, told you, and Nate is not lying. The auditor asks you to hand over something that shows it.</p>
    <p>There are six things on the table. For each one, decide: <strong>an auditor would accept this</strong>, or <strong>this only looks like proof</strong>? Make every call before you read the answers below.</p>
    <ol>
      <li>Nate saying “I review it every quarter”. Every quarter means every three months.</li>
      <li>A screenshot of the firewall rules, no date on it. A screenshot is a picture of what was on a screen at one moment.</li>
      <li>The two 2024 emails (“had a look, all fine”). These are two emails sent in 2024, each saying the firewall had been looked at and was fine.</li>
      <li>A dated configuration export / change log from the firewall itself. A configuration export is a copy of every setting on the firewall, saved by the firewall itself. A change log is a list the firewall keeps of the changes made to it.</li>
      <li>The policy line “firewall shall be reviewed quarterly”. A policy is a set of written rules a company sets for itself. “Shall” means must, and “quarterly” means every three months.</li>
      <li>A calendar reminder titled “review firewall”. A calendar reminder is a note that pops up at a set time to remind someone to do something.</li>
    </ol>
    <h3>Where each one belongs</h3>
    <ul>
      <li><strong>#4 An auditor would accept this.</strong> It shows what changed, when, and by which admin account, the login used to make the change. That is the thing happening, on a date, done by someone.</li>
      <li><strong>#1 This only looks like proof.</strong> It is true, and it is still not evidence, the kind of proof an auditor can take. A person’s word is where you start, not what you hand over.</li>
      <li><strong>#2 This only looks like proof. Weak, not nothing.</strong> It has no date, so you can’t tell when it was taken. It is weak, not nothing: a dated configuration export fixes it.</li>
      <li><strong>#3 This only looks like proof. Weak, not nothing.</strong> They are dated and come from a named person, but they don’t show what was reviewed. And two emails aren’t a quarterly process, which means a review every three months. That makes them weak, not nothing: you can’t tell what was done, but that is a cheap fix.</li>
      <li><strong>#5 This only looks like proof.</strong> It is a rule that the review should happen. It says nothing about whether it did.</li>
      <li><strong>#6 This only looks like proof.</strong> It shows someone meant to do the review, not that anything was done.</li>
    </ul>
    <div class="box">
      <p><strong>Evidence is something you can hand over that shows the thing happened, on a date, done by someone.</strong></p>
      <p>Only #4 does all three.</p>
    </div>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ---------------- icons ----------------
     Inline SVG drawn to the Phosphor outline style: one weight, uniform size,
     #001D69 through currentColor. No icon font, no network request. */
  var IC = {
    shield:'<path d="M12 3.2 19.5 6v5.6c0 4.7-3.2 7.9-7.5 9.2-4.3-1.3-7.5-4.5-7.5-9.2V6z"/><path d="M12 8.5v4M12 15.6v.2"/>',
    chat:'<path d="M4.5 5h15a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H10l-4.5 3.5V17h-1a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8 9.5h8M8 12.5h5"/>',
    image:'<rect x="3.5" y="5" width="17" height="14" rx="1.8"/><circle cx="9" cy="10" r="1.6"/><path d="m3.5 16.5 5-4.5 4 3.5 2.5-2 5.5 4.5"/>',
    mail:'<rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="m4 6.5 8 6 8-6"/>',

    book:'<path d="M5 4.5h10.5a2 2 0 0 1 2 2V20H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h10.5"/><path d="M9 8.5h5M9 11.5h5"/>',
    calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="1.8"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M12 12.5v3l2 1.2"/>',
    stamp:'<path d="M4 20.5h16"/><path d="M5 17.5h14v-3a1.5 1.5 0 0 0-1.5-1.5H14l-1-3.6a3 3 0 1 0-2 0L10 13H6.5A1.5 1.5 0 0 0 5 14.5z"/>',

    weak:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 8h5.5M12 12h8.5M12 16h5.5"/>',
    check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',

  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }

  /* ---------------- content ----------------
     The six things and their verdicts: P4-3, word for word ("t").
     "why": P4-3's Why line, turned into full sentences, no new facts.
     "def": the plain-words line under a card, ours, from the module's own
     definition boxes. No new facts. */
  var PREMISE = "<b>Cumberland reviews its firewall every three months.</b> You know this for a fact, because Nate, Cumberland’s systems administrator, told you, and Nate is not lying. The auditor asks you to hand over something that shows it.";

  var ANS = {
    accept:{ name:"An auditor would accept this", ic:"stamp",
      def:"An auditor is an outside checker. This means you could hand it over as proof." },
    only:{ name:"This only looks like proof", ic:"eye",
      def:"This means it may seem like proof at first, but an auditor would not take it as proof." }
  };
  var ORDER = ["accept","only"];

  var ITEMS = [
    { n:1, ic:"chat", ok:"only",
      t:"Nate saying “I review it every quarter”",
      def:"Every quarter means every three months.",
      why:["It is true, and it is still not evidence, the kind of proof an auditor can take. A person’s word is where you start, not what you hand over."] },
    { n:2, ic:"image", ok:"only", weak:true,
      t:"A screenshot of the firewall rules, no date on it",
      def:"A screenshot is a picture of what was on a screen at one moment.",
      why:["It has no date, so you can’t tell when it was taken. It is weak, not nothing: a dated configuration export fixes it."] },
    { n:3, ic:"mail", ok:"only", weak:true,
      t:"The two 2024 emails (“had a look, all fine”)",
      def:"These are two emails sent in 2024, each saying the firewall had been looked at and was fine.",
      why:["They are dated and come from a named person, but they don’t show what was reviewed. And two emails aren’t a quarterly process, which means a review every three months. That makes them weak, not nothing: you can’t tell what was done, but that is a cheap fix."] },
    { n:4, ic:"file", ok:"accept",
      t:"A dated configuration export / change log from the firewall itself",
      def:"A configuration export is a copy of every setting on the firewall, saved by the firewall itself. A change log is a list the firewall keeps of the changes made to it.",
      why:["It shows what changed, when, and by which admin account, the login used to make the change. That is the thing happening, on a date, done by someone."] },
    { n:5, ic:"book", ok:"only",
      t:"The policy line “firewall shall be reviewed quarterly”",
      def:"A policy is a set of written rules a company sets for itself. “Shall” means must, and “quarterly” means every three months.",
      why:["It is a rule that the review should happen. It says nothing about whether it did."] },
    { n:6, ic:"calendar", ok:"only",
      t:"A calendar reminder titled “review firewall”",
      def:"A calendar reminder is a note that pops up at a set time to remind someone to do something.",
      why:["It shows someone meant to do the review, not that anything was done."] }
  ];
  var NQ = ITEMS.length;
  var SHOWN = "There are only two answers here, so the right one is now marked in green, “Right answer.”";
  var VERDICT = { accept:"An auditor would accept this.", only:"This only looks like proof." };
  var WEAK = "Weak, not nothing";
  var DEF1 = "Evidence is something you can hand over that shows the thing happened, on a date, done by someone.";
  var DEF2 = "Only #4 does all three.";

  /* One question per screen, then the last screen. */
  var S = ITEMS.map(function(it, k){ return { kind:"q", q:k }; });
  S.push({ kind:"end" });

  /* ---------------- state ----------------
     p[n]: the student's one pick for item n ("accept" or "only").
     The pick is kept even when wrong, so the last screen can mark it. */
  var KEY = "vciso-p4-m3-what-would-an-auditor-accept-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { p:{} }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw) || !isPlain(raw.p)) return fresh();
      var p = {};
      ITEMS.forEach(function(it){ var v = raw.p[it.n]; if(v === "accept" || v === "only") p[it.n] = v; });
      return { p:p };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), h1:document.getElementById("h1"),
    board:document.getElementById("board"), bar:document.getElementById("bar"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0, confirming = false;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function strip(s){ return String(s).replace(/<[^>]+>/g,""); }
  function say(m){ el.live.textContent = ""; setTimeout(function(){ el.live.textContent = m; }, 30); }
  function phone(){ return window.matchMedia("(max-width:599px)").matches; }
  function picked(it){ return st.p[it.n] || null; }
  function allDone(){ return ITEMS.every(function(it){ return !!picked(it); }); }
  function firstOpen(){ for(var k=0;k<NQ;k++) if(!picked(ITEMS[k])) return k; return -1; }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = s.kind === "q" ? "Question " + (s.q+1) + " of " + NQ : "All six done";
    var h = "";
    for(var k=0;k<NQ;k++){
      var here = s.kind === "q" && k === s.q, on = !!picked(ITEMS[k]);
      h += "<i class='" + (here ? "here" : on ? "on" : "") + "'></i>";
    }
    el.segs.innerHTML = h;

    el.next.hidden = false;
    el.bar.classList.remove("ask");
    el.back.disabled = (i === 0);
    el.back.textContent = "Back";
    el.next.disabled = false;
    el.next.classList.remove("ghost");
    el.next.textContent = "Next";
    el.hint.textContent = "";

    if(s.kind === "q"){
      if(i === NQ - 1) el.next.textContent = "See where all six belong";
      if(!picked(ITEMS[s.q])){ el.next.disabled = true; el.hint.textContent = "Pick one answer to carry on."; }
    } else {
      if(!allDone()){ el.prog.textContent = "Not finished yet"; el.next.hidden = true; el.hint.textContent = ""; return; }
      el.next.textContent = "Start over";
      el.next.classList.add("ghost");
      el.hint.textContent = "When you are done here, go back to the module and carry on.";
      if(confirming){
        el.bar.classList.add("ask");
        el.hint.textContent = "This clears all six of your answers. Do you want to start over?";
        el.back.textContent = "No, keep my answers";
        el.next.textContent = "Yes, start over";
        el.next.classList.remove("ghost");
      }
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    document.documentElement.classList.add("fresh");
    var title = s.kind === "q" ? renderQ(s) : renderEnd();
    el.h1.innerHTML = title;
    el.frame.setAttribute("aria-label", strip(title));
    header();
    el.frame.classList.remove("tight");
    if(!phone() && el.board.scrollHeight > el.board.clientHeight + 1) el.frame.classList.add("tight");
    return title;
  }

  function optHTML(k, cls, ico, tag){
    var a = ANS[k], off = !!cls;
    var sr = cls === "ok" ? (tag === "Right" ? "Right. You picked this one." : "Right answer.")
      : cls === "no" ? "Not quite. You picked this one." : cls === "idle" ? "Not picked." : "";
    return '<button class="opt' + (cls ? " " + cls : "") + '" type="button" data-o="' + k + '"'
      + (off ? ' disabled aria-disabled="true"' : "") + ">"
      + '<span class="oi">' + icon(a.ic) + "</span>"
      + '<span class="ot"><span class="on">' + esc(a.name) + '</span><span class="od">' + esc(a.def) + "</span></span>"
      + '<span class="mk"><span class="g" aria-hidden="true">' + (ico ? icon(ico) : "") + "</span>"
      +   (tag ? '<span class="lb" aria-hidden="true">' + tag + "</span>" : "") + "</span>"
      + (sr ? '<span class="sr">' + sr + "</span>" : "")
      + "</button>";
  }
  function weakTag(){ return '<span class="weak">' + icon("weak") + WEAK + "</span>"; }

  /* One thing on the table, two answers. Nothing chosen on arrival. */
  function renderQ(s){
    var it = ITEMS[s.q], p = picked(it), good = p === it.ok;
    var h = '<div class="strip">' + icon("shield") + "<p>" + PREMISE + "</p></div>";
    if(!p){
      h += '<p class="lead">Here is one thing Cumberland could offer the auditor. Pick the answer that you think the auditor would give.</p>';
      if(s.q === 0) h += '<p class="sub">There are only two answers, so if your pick is not right, we show you the right one straight away.</p>';
    }
    h += '<div class="card"><span class="bi">' + icon(it.ic) + "</span>"
      + '<span class="cl">On the table: #' + it.n + "</span>"
      + '<span class="cb">' + esc(it.t) + "</span>"
      + (it.def ? '<span class="cs">' + esc(it.def) + "</span>" : "")
      + "</div>";
    h += '<div class="opts" role="group" aria-label="Your answer">' + ORDER.map(function(k){
        if(!p) return optHTML(k, "", "", "");
        if(k === it.ok) return optHTML(k, "ok", "check", good ? "Right" : "Right answer");
        if(k === p) return optHTML(k, "no", "x", "Not quite");
        return optHTML(k, "idle", "", "");
      }).join("") + "</div>";
    if(p){
      var lines = [];
      if(!good) lines.push(esc(SHOWN));
      lines.push("<b>" + esc(VERDICT[it.ok]) + "</b> " + esc(it.why[0]));
      h += '<div class="fb ' + (good ? "ok" : "no") + '" id="fb" tabindex="-1">'
        + '<span class="fh">' + icon(good ? "okc" : "noc") + (good ? "Right" : "Not quite")
        + (it.weak ? " " + weakTag() : "") + "</span>"
        + lines.map(function(t){ return '<p class="ft">' + t + "</p>"; }).join("") + "</div>";
    }
    el.board.innerHTML = h;
    if(!p){
      Array.prototype.forEach.call(el.board.querySelectorAll("button.opt"), function(b){
        b.addEventListener("click", function(){ choose(it, b.dataset.o); });
      });
    }
    return "Would an Auditor Accept This?";
  }

  function choose(it, k){
    if(picked(it) || !ANS[k]) return;
    st.p[it.n] = k; save(st);
    render();
    var fb = el.board.querySelector("#fb");
    if(fb && !reduce){ fb.classList.remove("in"); void fb.offsetWidth; fb.classList.add("in"); }
    if(fb) say(strip(fb.innerHTML.replace(/<\/p>/g, " ").replace(/<\/span>/g, ". ")));
    var ph = phone();
    el.next.focus(ph ? { preventScroll:true } : undefined);
    if(fb && ph) el.bar.scrollIntoView({ block:"end", behavior: reduce ? "auto" : "smooth" });
  }

  /* The last screen: where all six belong, then the definition. */
  function mark(good){
    return '<span class="mk2 ' + (good ? "ok" : "sh") + '">' + icon(good ? "check" : "info") + (good ? "Right" : "Shown to you") + "</span>";
  }
  function renderEnd(){
    var open = firstOpen();
    if(open >= 0){
      el.board.innerHTML = '<p class="lead"><b>Answer every question first.</b> Question ' + (open+1) + " of " + NQ + " is still open.</p>";
      return "One Step Back";
    }
    function list(k){
      return ITEMS.filter(function(it){ return it.ok === k; }).map(function(it){
        return '<li><span class="n">#' + it.n + '</span><span class="t">' + esc(it.t) + "</span>"
          + '<span class="tags">' + mark(picked(it) === it.ok) + (it.weak ? weakTag() : "") + "</span></li>";
      }).join("");
    }
    el.board.innerHTML = '<p class="lead">Here is where each of the six belongs. ' + mark(true)
      + " means you sorted it yourself. " + mark(false) + " means we showed you the answer. " + weakTag() + " means it is not proof yet, but it is a cheap fix.</p>"
      + '<div class="buckets"><div class="col">'
      +   '<div class="bucket"><div class="bh">' + icon("stamp") + esc(ANS.accept.name) + "</div><ul>" + list("accept") + "</ul></div>"
      +   '<div class="statement"><p>' + esc(DEF1) + "</p><p>" + esc(DEF2) + "</p></div>"
      + "</div>"
      +   '<div class="bucket"><div class="bh">' + icon("eye") + esc(ANS.only.name) + "</div><ul>" + list("only") + "</ul></div>"
      + "</div>";
    return "Where All Six Belong";
  }

  /* ---------------- navigation ---------------- */
  function focusTop(){
    var ph = phone();
    el.frame.focus(ph ? { preventScroll:true } : undefined);
    if(ph) window.scrollTo(0, 0);
  }
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; confirming = false;
    var t = render(); focusTop();
    say(strip(el.prog.textContent) + ". " + strip(t));
  }
  function startOver(){
    st = fresh(); save(st); i = 0; confirming = false;
    render(); focusTop();
    say("Started over. Question 1 of " + NQ + ".");
  }
  el.back.addEventListener("click", function(){
    if(confirming){ confirming = false; header(); el.next.focus(); say("Your answers are kept."); return; }
    go(-1);
  });
  el.next.addEventListener("click", function(){
    if(S[i].kind === "end"){
      if(!allDone()) return;
      if(confirming) startOver();
      else { confirming = true; header(); el.back.focus(); say(el.hint.textContent); }
      return;
    }
    go(1);
  });

  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || (e.target && e.target.isContentEditable)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled && S[i].kind !== "end") go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); if(!confirming) go(-1); }
  });

  /* A cursor resting where new content lands must not tint an option. */
  var lastPt = null;
  document.addEventListener("pointermove", function(e){
    var pt = e.clientX + "," + e.clientY;
    if(lastPt !== null && pt !== lastPt) document.documentElement.classList.remove("fresh");
    lastPt = pt;
  }, true);

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled && S[i].kind !== "end") go(1); } else if(!confirming) go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; confirming = false; render(); return true;
    },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; confirming = false; render(); },
    state:function(){ return { i:i, p:JSON.parse(JSON.stringify(st.p)), confirming:confirming }; }
  };
})();
</script>
</body>
</html>
