<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Would You Fix First?</title>
<!--
  vCISO P2 Step 4, Module 14: Make the Severity Defensible.
  Interactive: Which Would You Fix First? Per scope.
  Build spec: 06-content/project-02/step-04/module-14-internal.md.
  Source: P2-13 in Interactive content sets - P2.md, and the four
  Scan export - Scope X.csv files. Host, Finding, CVE, Severity and CVSS are
  copied from the scan rows unchanged. The Description cell is not shown (spec):
  it carries the exploitation status and gives the answer away.
  Scope A: the 7.8 card is the writer's pick (BITS over Print Spooler EoP).
  Scope D: the pair is the spec's candidate, awaiting Chaitanya's confirmation.
  Look and navigation follow the approved m5 builds.
  Step 4 pass, 2 October 2026 (owner rules): a right pick turns green with a
  tick and "Right"; a wrong pick turns red with a cross and "Not quite", and
  the other card is marked green "Right answer" (two cards, so one wrong try
  shows the answer, as in m11). "Choose again" removed; "Start over" on the
  last slide clears the pick. Leads rewritten as full sentences. Data, cards,
  answers and reveal wording unchanged.
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    /* Right and wrong, as in the approved m11 build. Always paired with an
       icon and a word, never colour alone. Green 5.7:1, red 5.6:1. */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. Tint carries no meaning. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t3{background:#F2E3D2}

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:16px 44px 12px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:8px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px}
  .lead{flex:0 0 auto;font-size:16px;line-height:1.45;color:var(--body);max-width:80ch}
  .lead b{color:var(--title);font-weight:600}
  .lead.wide{max-width:none}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- slide 1: the scope picker (same as the approved m5 builds) ---- */
  .scopes{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  button.sc{font-family:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--title);
    border:1.5px dashed var(--on-highlight);border-radius:12px;padding:20px 18px 16px;
    display:flex;flex-direction:column;gap:12px;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  button.sc:hover{background:var(--highlight)}
  button.sc:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.sc .si{width:64px;height:64px;border-radius:14px;background:var(--highlight);color:var(--on-highlight);
    border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center}
  button.sc .si svg.ic{width:36px;height:36px}
  button.sc .sl{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  button.sc .sn{font-size:20px;font-weight:600;line-height:1.25;color:var(--title);flex:1 1 auto;min-height:50px}
  button.sc .ss{font-size:14px;font-weight:600;color:var(--on-highlight);display:flex;align-items:center;gap:7px;
    border-top:1.5px dashed var(--line);padding-top:9px}
  .gl{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--on-highlight);
    font-size:12px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  button.sc.on{background:var(--on-highlight);border:2px solid var(--on-highlight);color:var(--bg)}
  button.sc.on .sl,button.sc.on .sn,button.sc.on .ss{color:var(--bg)}
  button.sc.on .ss{border-top:1.5px solid var(--bg)}
  button.sc.on .gl{border-color:var(--bg);background:var(--bg);color:var(--on-highlight)}
  button.sc.on .si{background:var(--bg)}
  .note2{flex:0 0 auto;font-size:15px;line-height:1.45;color:var(--body)}
  .note2 b{color:var(--title)}

  /* ---- slide 2: the two findings ----
     Every row exists at full size from first paint. Picking a card fills the
     exploited-list row and the verdict, and never moves anything. */
  .pair{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  button.fc{font-family:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--title);
    border:1.5px dashed var(--on-highlight);border-radius:12px;padding:9px 16px 7px;min-width:0;
    display:flex;flex-direction:column;gap:6px;
    transition:background var(--t-fast) var(--ease-out),box-shadow var(--t-fast) var(--ease-out)}
  button.fc:hover:not(:disabled){background:var(--highlight)}
  button.fc:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.fc:disabled{cursor:default}
  .fc .hh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;color:var(--on-highlight)}
  .fc .hh svg.ic{width:22px;height:22px;flex:0 0 auto}
  .fc .hh .hn{font-size:15px;letter-spacing:.02em;text-transform:none;color:var(--title)}
  .fc .mid{display:grid;grid-template-columns:minmax(0,1fr) 114px;gap:12px;align-items:start}
  .fc .fn{font-size:17px;font-weight:600;line-height:1.3;color:var(--title);display:block}
  .fc .cve{font-size:13px;font-weight:600;color:var(--on-highlight);letter-spacing:.02em;display:block;margin-top:3px}
  .fc .pw{font-size:14px;line-height:1.42;color:var(--body);display:block;margin-top:5px}
  .fc .pw b{color:var(--title);font-weight:600}
  .fc .sbox{display:flex;flex-direction:column;gap:2px;border-left:1.5px solid var(--line);padding-left:12px}
  .fc .k{font-size:12.5px;font-weight:600;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase;color:var(--on-highlight);display:block}
  .fc .v{font-size:18px;font-weight:700;color:var(--title);line-height:1.2;display:block}
  .fc .v.big{font-size:34px;line-height:1.05;margin-bottom:6px}
  .fc .kev{display:flex;align-items:center;gap:7px;font-size:14px;line-height:1.25;color:var(--title);
    background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:16px;padding:3px 10px 3px 7px}
  .fc .kev svg.ic{width:20px;height:20px;flex:0 0 auto;color:var(--on-highlight)}
  .fc .kev .k{flex:0 0 auto}
  .fc .kev .kv{font-weight:700}
  .fc .kev.wait{color:var(--body)}
  .fc .kev.wait .kv{font-weight:600}
  .fc .ft{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--on-highlight);
    border-top:1.5px dashed var(--line);padding-top:8px;min-height:36px;margin-top:auto}
  .fc .ft .fl{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .fc .ft .kev{margin-left:auto}
  button.fc.dim{border:2px solid var(--line)}
  .gl svg.ic{width:12px;height:12px;stroke-width:2.8}
  button.fc.ok{background:var(--ok-tint);border:2px solid var(--ok)}
  button.fc.ok .ft{border-top:1.5px solid var(--ok);color:var(--ok)}
  button.fc.ok .ft .gl{background:var(--ok);border-color:var(--ok);color:var(--bg)}
  button.fc.no{background:var(--no-tint);border:2px solid var(--no)}
  button.fc.no .ft{border-top:1.5px solid var(--no);color:var(--no)}
  button.fc.no .ft .gl{background:var(--no);border-color:var(--no);color:var(--bg)}
  .kev.in{animation:rin var(--t-reveal) var(--ease-over) both}

  .verdict{flex:0 0 auto;min-height:64px;border-radius:12px;padding:6px 14px;display:flex;align-items:flex-start;gap:12px;
    background:transparent;border:1.5px dashed var(--line)}
  .verdict svg.ic{width:26px;height:26px;flex:0 0 auto;color:var(--on-highlight);margin-top:2px}
  .verdict .vt{font-size:15px;line-height:1.42;color:var(--body)}
  .verdict .vt b{color:var(--title);font-weight:600}
  .verdict.ok,.verdict.no{border-left-width:6px;border-style:solid}
  .verdict.ok{background:var(--ok-tint);border-color:var(--ok)}
  .verdict.no{background:var(--no-tint);border-color:var(--no)}
  .verdict.ok svg.ic{color:var(--ok)}
  .verdict.no svg.ic{color:var(--no)}
  .verdict.ok .vt,.verdict.no .vt{color:var(--title)}
  .verdict .fh{font-weight:700}
  .verdict.ok .fh{color:var(--ok)}
  .verdict.no .fh{color:var(--no)}
  .verdict.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .verdict:focus{outline:none}
  .verdict:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  html.ptr .verdict:focus-visible{outline:none}
  .verdict .vbody{flex:1 1 auto;min-width:0}

  /* ---- gates ---- */
  .panel{flex:0 0 auto;background:var(--highlight);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
  .done{font-size:15px;line-height:1.45;color:var(--title)}
  button.go{font-family:inherit;font-size:15px;font-weight:600;padding:9px 17px;border-radius:8px;cursor:pointer;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);align-self:flex-start}
  button.go:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}

  /* ---- slide 3: the closing line ---- */
  .closewrap{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-bottom:16px}
  .statement{flex:0 0 auto;background:var(--highlight);border-left:5px solid var(--on-highlight);
    border-radius:0 12px 12px 0;padding:30px 36px;max-width:840px}
  .statement p{font-size:28px;line-height:1.35;font-weight:600;color:var(--title)}
  .statement p + p{margin-top:14px}
  .defn{flex:0 0 auto;display:flex;align-items:flex-start;gap:14px;max-width:840px}
  .defn .di{flex:0 0 auto;width:52px;height:52px;border-radius:12px;border:1.5px solid var(--on-highlight);
    background:var(--bg);color:var(--on-highlight);display:flex;align-items:center;justify-content:center}
  .defn .di svg.ic{width:28px;height:28px}
  .defn p{font-size:17px;line-height:1.5;color:var(--body)}
  .defn p b{color:var(--title);font-weight:600}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:6px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:56px;overflow-y:auto;font-size:13.5px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .keym{display:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    .lead{font-size:16px}
    .board{flex:0 0 auto}
    .scopes{grid-template-columns:1fr 1fr;gap:10px}
    button.sc{min-height:0;padding:14px 12px}
    button.sc .si{width:48px;height:48px}
    button.sc .sn{font-size:17px}
    .note2{font-size:16px}
    .pair{grid-template-columns:1fr;gap:14px}
    .fc .fn,.fc .pw{min-height:0}
    .fc .pw{font-size:15px}
    .verdict{flex-wrap:nowrap}
    .verdict .vt{font-size:16px}
    .statement{padding:20px 18px}
    .statement p{font-size:21px}
    .defn p{font-size:16px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
    .keym{display:block;flex:0 0 auto;font-size:14px;line-height:1.45;color:var(--body);
      background:var(--highlight);border-radius:10px;padding:10px 12px}
    .keym b{color:var(--title);font-weight:600}
    body.t2 #hint{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Which Would You Fix First?">

    <div class="top">
      <span class="prog" id="prog">1 of 3</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
      <span class="chip" id="chip" hidden></span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Continue</button>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

    scale:'<path d="M12 4v16M7 20h10"/><path d="M5 7h14"/><path d="M5 7l-2.5 6a2.5 2.5 0 0 0 5 0zM19 7l-2.5 6a2.5 2.5 0 0 0 5 0z"/>',

    ask:'<circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.5M12 16.8v.01"/>'

  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }

  /* ---------------- content ----------------
     host, finding, cve, sev and cvss are copied unchanged from each scope's
     Scan export CSV. "pw" is the plain-words line, written at build from the
     scan's own Description wording with the exploitation status left out.
     kev is from the build spec (CISA KEV, catalogVersion 2026.09.25). */
  var MSMQ_PW = "The October 2023 update is missing. It would fix a flaw in <b>Message Queuing</b>, a Windows messaging feature, that could let an attacker <b>run their own commands</b> on the machine.";
  var EB_PW = "A flaw in <b>SMBv1</b>, an old Windows way of sharing files over the network, that could let an attacker <b>run their own commands</b> on the machine.";
  var SC = {
    A:{ name:"Claims Intake", ic:"claims", same:null,
      cards:[
        { id:"hi", host:"CCS-SFTP01", finding:"OpenSSH ssh-agent PKCS#11 remote code execution", cve:"CVE-2023-38408",
          sev:"Critical", cvss:"9.8", kev:false, short:"the OpenSSH flaw",
          pw:"A flaw in <b>OpenSSH</b>, the program people use to connect to this machine from elsewhere, that could let an attacker <b>run their own commands</b> on it." },
        { id:"lo", host:"CCS-APP01", finding:"Windows BITS elevation of privilege", cve:"CVE-2020-0787",
          sev:"High", cvss:"7.8", kev:true, short:"the BITS flaw",
          pw:"A flaw in <b>BITS</b>, a Windows feature that downloads files in the background, that lets someone already on the machine <b>give themselves administrator control</b>." }
      ] },
    B:{ name:"Payments and Remittance", ic:"coin", same:"CCS-FS01",
      cards:[
        { id:"hi", host:"CCS-FS01", finding:"Missing final security update KB5031419 (October 2023)", cve:"CVE-2023-35349",
          sev:"Critical", cvss:"9.8", kev:false, short:"the missing October 2023 update", pw:MSMQ_PW },
        { id:"lo", host:"CCS-FS01", finding:"Windows SMBv1 remote code execution (EternalBlue)", cve:"CVE-2017-0144",
          sev:"Critical", cvss:"8.8", kev:true, short:"EternalBlue", pw:EB_PW }
      ] },
    C:{ name:"Patient Records and Archive", ic:"archive", same:"CCS-ARCH01",
      cards:[
        { id:"hi", host:"CCS-ARCH01", finding:"Missing final security update KB5031419 (October 2023)", cve:"CVE-2023-35349",
          sev:"Critical", cvss:"9.8", kev:false, short:"the missing October 2023 update", pw:MSMQ_PW },
        { id:"lo", host:"CCS-ARCH01", finding:"Windows SMBv1 remote code execution (EternalBlue)", cve:"CVE-2017-0144",
          sev:"Critical", cvss:"8.8", kev:true, short:"EternalBlue", pw:EB_PW }
      ] },
    D:{ name:"Remote and Corporate", ic:"laptop", same:"CCS-FS01",
      cards:[
        { id:"hi", host:"CCS-FS01", finding:"Missing final security update KB5031419 (October 2023)", cve:"CVE-2023-35349",
          sev:"Critical", cvss:"9.8", kev:false, short:"the missing October 2023 update", pw:MSMQ_PW },
        { id:"lo", host:"CCS-FS01", finding:"Windows SMBv1 remote code execution (EternalBlue)", cve:"CVE-2017-0144",
          sev:"Critical", cvss:"8.8", kev:true, short:"EternalBlue", pw:EB_PW }
      ] }
  };
  var ORDER = ["A","B","C","D"];

  var S = [
    { id:"scope", kind:"scope", label:"Your scope", h1:"Pick Your Scope",
      lead:"Choose the scope you picked in Project 1. On the next slide, there are two findings from your own scope's scan that we are going to show you." },
    { id:"pick", kind:"pick", label:"Pick one", h1:"Which Would You Fix First?" },
    { id:"close", kind:"close", label:"What it means", h1:"What the Score Leaves Out",
      body:["A severity score measures how bad a flaw could be.",
            "The exploited list tells you what attackers are actually using."] }
  ];

  /* ---------------- state ---------------- */
  var KEY = "vciso-p2-m14-which-would-you-fix-first-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { scope:null, pick:{} }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var pick = {};
      if(isPlain(raw.pick)) ORDER.forEach(function(k){ if(raw.pick[k] === "hi" || raw.pick[k] === "lo") pick[k] = raw.pick[k]; });
      return { scope: (ORDER.indexOf(raw.scope) >= 0) ? raw.scope : null, pick:pick };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Data validation, at load, loud. Each scope needs two cards, exactly one
     on the exploited list, and that one must carry the lower score. */
  (function validate(){
    var problems = [];
    ORDER.forEach(function(k){
      var c = SC[k] && SC[k].cards;
      if(!c || c.length !== 2){ problems.push("scope " + k + " needs 2 cards"); return; }
      var kev = c.filter(function(x){ return x.kev; });
      if(kev.length !== 1) problems.push("scope " + k + " needs exactly 1 card on the exploited list");
      else {
        var other = c.filter(function(x){ return !x.kev; })[0];
        if(!(parseFloat(kev[0].cvss) < parseFloat(other.cvss))) problems.push("scope " + k + ": the exploited card must score lower");
      }
      c.forEach(function(x){ if(!x.host || !x.finding || !x.cve || !x.sev || !x.cvss || !x.pw) problems.push("scope " + k + " card " + x.id + " is missing a field"); });
    });
    if(problems.length){
      document.getElementById("board").innerHTML =
        '<div class="lead"><p><b>This deck has authoring errors and will not behave correctly:</b></p>'
        + '<ul style="font-size:13px;line-height:1.6;padding-left:18px">'
        + problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul></div>";
      throw new Error("deck data invalid: " + problems.join("; "));
    }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function cap(s){ s = String(s); return s.charAt(0).toUpperCase() + s.slice(1); }
  function strip(s){ return String(s).replace(/<[^>]+>/g, ""); }
  function say(m){ el.live.textContent = m; }
  function cur(){ return st.scope ? SC[st.scope] : null; }
  function picked(){ return st.scope ? st.pick[st.scope] || null : null; }
  function card(id){ var r = null; cur().cards.forEach(function(c){ if(c.id === id) r = c; }); return r; }
  function answer(){ return cur().cards.filter(function(c){ return c.kev; })[0]; }

  var KEYLINE = "<span><b>Host:</b> the machine the problem is on. <b>CVE:</b> the flaw's public ID number. "
    + "<b>Score (CVSS):</b> how bad the scanner rates the flaw, from 0 to 10. <b>Severity:</b> the same rating as a word, like High or Critical.</span>";

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    if(st.scope && i > 0){
      el.chip.hidden = false;
      el.chip.textContent = "Scope " + st.scope + ", " + SC[st.scope].name;
    } else el.chip.hidden = true;

    el.back.disabled = (i === 0);
    el.next.disabled = false;
    el.next.textContent = "Continue";
    if(i === S.length-1){ el.next.textContent = "Start over"; }
    else if(s.kind === "scope" && !st.scope){
      el.next.disabled = true;
      el.hint.innerHTML = "Pick a scope to carry on.";
    }
    else if(s.kind === "pick" && !st.scope){
      el.next.disabled = true;
    }
    else if(s.kind === "pick" && st.scope && !picked()){
      el.next.disabled = true;
      el.hint.innerHTML = KEYLINE;
    }
    else if(s.kind === "pick" && picked()){
      el.hint.innerHTML = KEYLINE;
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);
    el.hint.textContent = "";

    if(s.kind === "scope") renderScope(s);
    else if(s.kind === "pick") renderPick(s);
    else if(s.kind === "close") renderClose(s);
    else el.board.innerHTML = '<div class="lead"><b>Unhandled slide kind "' + esc(String(s.kind)) + '".</b></div>';

    header();
    say("Slide " + (i+1) + " of " + S.length + ". " + s.h1 + ".");
  }

  /* Slide 1: four scopes, one pick. Each scope keeps its own answer. */
  function renderScope(s){
    el.board.innerHTML = '<p class="lead">' + s.lead + "</p>"
      + '<div class="scopes" role="group" aria-label="Scopes">' + ORDER.map(function(k){
          var on = st.scope === k;
          return '<button class="sc' + (on ? " on" : "") + '" type="button" data-k="' + k + '" aria-pressed="' + on + '">'
            + '<span class="si">' + icon(SC[k].ic) + "</span>"
            + '<span class="sl">Scope ' + k + "</span>"
            + '<span class="sn">' + esc(SC[k].name) + "</span>"
            + '<span class="ss">' + (on ? '<span class="gl" aria-hidden="true">✓</span>Your scope'
                                        : '<span class="gl" aria-hidden="true">+</span>Pick this one') + "</span>"
            + "</button>";
        }).join("") + "</div>"
      + '<p class="note2">You can switch later. <b>Each scope keeps its own answer</b>, so switching loses nothing.</p>';
    Array.prototype.forEach.call(el.board.querySelectorAll("button.sc"), function(b){
      b.addEventListener("click", function(){
        st.scope = b.dataset.k; save(st);
        render();
        var nb = el.board.querySelector('button.sc[data-k="' + st.scope + '"]');
        if(nb) nb.focus();
        say("Scope " + st.scope + ", " + SC[st.scope].name + ", picked.");
      });
    });
  }

  function needScope(){
    el.board.innerHTML = '<div class="panel"><p class="done"><b>Pick your scope first.</b> The two findings come from your own scope\'s scan.</p>'
      + '<button class="go" type="button" id="goscope">Go to the scope picker</button></div>';
    el.board.querySelector("#goscope").addEventListener("click", function(){ i = 0; render(); el.frame.focus(); });
  }

  function kevHTML(c){
    return c.kev
      ? '<span class="kev">' + icon("warn") + '<span class="kv">On the exploited list</span></span>'
      : '<span class="kev">' + icon("minus") + '<span class="kv">Not on the exploited list</span></span>';
  }

  /* After a pick: a right pick turns green, "Right". A wrong pick turns red,
     "Not quite", and with only two cards the other one is then marked green,
     "Right answer" (the m11 rule: one wrong try on a two-way question shows
     the right one). The card not picked after a right pick stays plain. */
  function cardState(c, p){
    if(!p) return null;
    var a = answer(), right = p === a.id;
    if(c.id === p) return right ? "right" : "wrong";
    return c.kev ? "shown" : "none";
  }
  function cardHTML(c, p){
    var isPick = p === c.id, cs = cardState(c, p);
    var foot = !p ? '<span class="gl" aria-hidden="true"></span>Fix this one first'
             : cs === "right" ? '<span class="gl" aria-hidden="true">' + icon("check") + "</span>Right"
             : cs === "wrong" ? '<span class="gl" aria-hidden="true">' + icon("x") + "</span>Not quite"
             : cs === "shown" ? '<span class="gl" aria-hidden="true">' + icon("check") + "</span>Right answer"
             : "Not picked";
    var label = "Host " + c.host + ". " + c.finding + ", " + c.cve + ". Severity " + c.sev + ", score " + c.cvss + "."
      + (p ? (c.kev ? " On the exploited list." : " Not on the exploited list.")
             + (cs === "right" ? " Your pick. Right." : cs === "wrong" ? " Your pick. Not quite." : cs === "shown" ? " Right answer." : " Not picked.")
           : " Fix this one first.");
    var cls = cs === "right" || cs === "shown" ? " ok" : cs === "wrong" ? " no" : (p ? " dim" : "");
    return '<button class="fc' + cls + '" type="button" data-c="' + c.id + '"'
      + ' aria-pressed="' + isPick + '" aria-label="' + esc(label) + '"' + (p ? " disabled" : "") + ">"
      + '<span class="hh">' + icon("server") + 'Host <span class="hn">' + esc(c.host) + "</span></span>"
      + '<span class="mid"><span class="txtc">'
      + '<span class="fn">' + esc(c.finding) + "</span>"
      + '<span class="cve">' + esc(c.cve) + "</span>"
      + '<span class="pw">' + c.pw + "</span></span>"
      + '<span class="sbox"><span class="k">Score (CVSS)</span><span class="v big">' + esc(c.cvss) + "</span>"
      + '<span class="k">Severity</span><span class="v">' + esc(c.sev) + "</span></span></span>"
      + '<span class="ft"><span class="fl">' + foot + "</span>" + (p ? kevHTML(c) : "") + "</span>"
      + "</button>";
  }

  function verdictHTML(p){
    if(!p) return '<div class="verdict" id="verdict">' + icon("ask") + '<div class="vbody"><p class="vt">'
      + "You can only fix one first, and you get one try. Pick the one that you think should go at the top of your Working List.</p></div></div>";
    var a = answer(), right = p === a.id;
    var hiC = cur().cards.filter(function(c){ return !c.kev; })[0];
    var lead = right
      ? "<b>" + esc(cap(a.short)) + " comes first.</b> "
      : "<b>Most people pick the bigger number. Fix " + esc(a.short) + " first.</b> ";
    return '<div class="verdict ' + (right ? "ok" : "no") + '" id="verdict" tabindex="-1">' + icon(right ? "okc" : "noc") + '<div class="vbody">'
      + '<p class="vt"><span class="fh">' + (right ? "Right." : "Not quite.") + "</span> " + lead + "The lower score, " + esc(a.cvss) + ", is on the exploited list: a public list of flaws confirmed as used in real attacks. The higher one, "
      + esc(hiC.cvss) + ", is not. The score only guesses how bad a flaw could be. Attackers are already using the one on the list.</p></div></div>";
  }

  /* Slide 2: two findings side by side, one pick, then the reveal. */
  function renderPick(s){
    var sc = cur();
    if(!sc){ needScope(); return; }
    var p = picked();
    var lead = "There are two findings from your Scope " + st.scope + " scan that we are going to show you."
      + (sc.same ? " Both are on one machine, " + esc(sc.same) + "." : "");
    el.board.innerHTML = '<p class="lead wide">' + lead + "</p>"
      + '<p class="keym">' + KEYLINE + "</p>"
      + '<div class="pair" role="group" aria-label="Two findings">' + sc.cards.map(function(c){ return cardHTML(c, p); }).join("") + "</div>"
      + verdictHTML(p);
    Array.prototype.forEach.call(el.board.querySelectorAll("button.fc"), function(b){
      b.addEventListener("click", function(){
        if(picked()) return;
        st.pick[st.scope] = b.dataset.c; save(st);
        renderPick(s); header();
        var v = el.board.querySelector("#verdict");
        if(!reduce){
          Array.prototype.forEach.call(el.board.querySelectorAll(".kev"), function(n){ n.classList.add("in"); });
          if(v){ v.classList.add("in"); }
        }
        if(v) v.focus();
        say("You picked " + card(b.dataset.c).short + ". " + strip(v.querySelector(".vt").innerHTML));
      });
    });
  }

  /* Slide 3: the closing line. Waits for a pick, so it never shows the answer early. */
  function renderClose(s){
    if(st.scope && !picked()){
      el.board.innerHTML = '<div class="panel"><p class="done"><b>Make your pick first.</b> This slide explains the answer, so it waits until you have chosen.</p>'
        + '<button class="go" type="button" id="gopick">Back to the two findings</button></div>';
      el.board.querySelector("#gopick").addEventListener("click", function(){ i = 1; render(); el.frame.focus(); });
      return;
    }
    if(!st.scope){ needScope(); return; }
    el.board.innerHTML = '<div class="closewrap">'
      + '<div class="statement">' + s.body.map(function(p){ return "<p>" + p + "</p>"; }).join("") + "</div>"
      + '<div class="defn"><span class="di">' + icon("warn") + "</span>"
      + "<p><b>The exploited list</b> is a public list of flaws confirmed as used in real attacks. You search it yourself in Step 3.</p></div>"
      + "</div>";
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){
    if(i === S.length-1){ if(st.scope) delete st.pick[st.scope]; st.scope = null; save(st); i = 0; render(); el.frame.focus(); say("Started over. Pick your scope."); return; }
    go(1);
  });

  document.addEventListener("pointerdown", function(){ document.documentElement.classList.add("ptr"); }, true);
  document.addEventListener("keydown", function(e){
    document.documentElement.classList.remove("ptr");
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled && i < S.length-1) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return true;
    var r = node.getAttribute && node.getAttribute("role");
    return r === "slider" || r === "textbox" || r === "spinbutton" || r === "listbox";
  }

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    if(ownsKeys(e.target)){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled && i < S.length-1) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    scope:function(k){ if(ORDER.indexOf(k) < 0) return false; st.scope = k; save(st); render(); return true; },
    state:function(){ return { i:i, scope:st.scope, pick:st.pick }; }
  };
})();
</script>
</body>
</html>
