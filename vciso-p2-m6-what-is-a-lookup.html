<!--
  vCISO P2 Step 2, Module 6: Look Up Your Scope's Address.
  Animated explainer for the section "What Can a Lookup Show You?"
  (06-content/project-02/step-02/module-06-task-learn-how-to-look-up-your-scopes-address.md).
  Same shell, header, bar, tint ramp and scale-to-fit as
  vciso-p2-m5-patients-bill.html and vciso-p2-m6-click-what-should-worry-you.html.

  Data: the netflix.com lookup is verbatim from the module page. Nothing is

  "last visited" stamp, on purpose.

  Every scene animates on entry and has Replay. Under reduced motion every
  scene shows its end state at once.

  Verify before shipping:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs   this-deck.html

-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp (09-assets/deck-palette.json), in slide order. Tint carries no meaning. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t3{background:#F2E3D2}
  body.t4{background:#DEEBDA}
  body.t5{background:#F0E4EF}
  body.t6{background:#D0EEF1}
  body.t7{background:#EEDAD6}

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  .lead{flex:0 0 auto;font-size:16px;line-height:1.45;color:var(--body);max-width:82ch}
  .lead b{color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  svg.art{display:block;width:100%;height:auto;overflow:hidden}

  /* ---- the reveal primitive: base state is the END state, so reduced
         motion (no transitions, every step applied at once) shows the end. ---- */
  .fx{opacity:0;transform:translateY(8px);transition:opacity 480ms var(--ease-out),transform 480ms var(--ease-over)}
  .fx.on{opacity:1;transform:none}
  .fxs{opacity:0;transform:scale(.6);transform-box:fill-box;transform-origin:center;
    transition:opacity 420ms var(--ease-out),transform 520ms var(--ease-over)}
  .fxs.on{opacity:1;transform:none}
  .wr{clip-path:inset(0 100% 0 0);transition:clip-path 700ms var(--ease-io)}
  .wr.on{clip-path:inset(0 0 0 0)}

  /* ---- SVG drawing styles ---- */
  .art .hb{fill:var(--bg);stroke:var(--on-highlight);stroke-width:2}
  .art .roof{fill:var(--highlight);stroke:var(--on-highlight);stroke-width:2;stroke-linejoin:round}
  .art .plate{fill:var(--bg);stroke:var(--on-highlight);stroke-width:1.5}
  .art .pn{font-size:12px;font-weight:700;fill:var(--title);text-anchor:middle;dominant-baseline:central}
  .art .wc{fill:var(--bg);stroke:var(--on-highlight);stroke-width:1.5}
  .art .wl{stroke:var(--on-highlight);stroke-width:1.2}
  .art .dark{fill:var(--on-highlight);stroke:var(--on-highlight);stroke-width:1.5}
  .art .leaf{fill:var(--bg);stroke:var(--on-highlight);stroke-width:1.5;stroke-linejoin:round}
  .art .dc{fill:var(--highlight);stroke:var(--on-highlight);stroke-width:1.5}
  .art .knob{fill:var(--on-highlight)}
  .art .house.srv .hb{fill:var(--highlight)}
  .art .ground{stroke:var(--on-highlight);stroke-width:2}
  .art .road{fill:rgba(0,29,105,.07)}
  .art .lane{stroke:rgba(0,29,105,.35);stroke-width:2;stroke-dasharray:14 12}
  .art .navy{fill:var(--on-highlight)}
  .art .stroke{fill:none;stroke:var(--on-highlight);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .art .person{fill:var(--bg);stroke:var(--on-highlight);stroke-width:2}
  .art .lbl{font-size:13.5px;font-weight:600;fill:var(--title)}
  .art .lblc{font-size:13.5px;font-weight:600;fill:var(--title);text-anchor:middle}
  .art .sub{font-size:12.5px;fill:var(--body);text-anchor:middle}
  .art .badge{fill:var(--bg);stroke:var(--on-highlight);stroke-width:1.5}
  .art .mono{font-family:var(--mono)}
  .art .open-set,.art .shut-set{transition:opacity 420ms var(--ease-out)}
  .art .dset .open-set{opacity:0}
  .art .dset.op .open-set{opacity:1}
  .art .dset.op .shut-set{opacity:0}

  /* ---- the walker ---- */
  #walker{transition:transform 1000ms var(--ease-io),opacity 500ms var(--ease-out)}
  #walker .bob{transform-box:fill-box}
  #walker.walking .bob{animation:bob 330ms ease-in-out infinite alternate}
  #walker.gone{opacity:0}
  #walker .wnb{transform-box:fill-box;transform-origin:0% 100%;transition:transform 220ms var(--ease-out)}
  #walker .pen{opacity:0;transition:opacity 160ms var(--ease-out)}
  #walker.jot .wnb{transform:rotate(-20deg)}
  #walker.jot .pen{opacity:1;animation:scrib 250ms ease-in-out infinite alternate}
  @keyframes scrib{from{transform:translateX(0)}to{transform:translateX(3px)}}
  .art .wlbl{font-size:12.5px;font-weight:700;fill:var(--on-highlight);text-anchor:middle}
  .art .lt{font-size:13px;font-weight:700;fill:var(--on-highlight)}
  .art .lty{font-size:15px;font-weight:700;fill:var(--title)}
  .art .ltb{font-size:12.5px;font-weight:700;fill:var(--bg);text-anchor:middle}
  .art .lth{font-size:13px;font-weight:700;fill:var(--on-highlight)}
  .art .lti{font-size:16px;font-style:italic;fill:var(--title)}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}

  /* ---- shared cards ---- */
  .duo{flex:1 1 auto;min-height:0;display:flex;align-items:center}
  .row2{flex:1 1 auto;min-height:0;display:grid;gap:18px;align-items:center}
  .pnl{background:var(--highlight);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:12px;padding:12px 14px;

  .icb{flex:0 0 auto;width:48px;height:48px;border-radius:12px;background:var(--highlight);color:var(--on-highlight);

  .icb svg.ic{width:28px;height:28px}
  .kl{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .kv{font-size:19px;font-weight:700;color:var(--title);line-height:1.25}
  .kv.mono{font-family:var(--mono);font-size:17px}
  .ks{font-size:14.5px;line-height:1.4;color:var(--body)}
  .eq{font-size:14px;font-weight:600;color:var(--on-highlight);display:flex;align-items:center;gap:8px;padding-left:4px}
  .eq svg.ic{width:18px;height:18px}
  .cap{flex:0 0 auto;font-size:15px;line-height:1.4;color:var(--title);display:flex;align-items:center;gap:10px}
  .cap svg.ic{width:22px;height:22px;color:var(--on-highlight);flex:0 0 auto}
  .statement{background:var(--highlight);border-left:5px solid var(--on-highlight);border-radius:0 12px 12px 0;

  /* ---- scene 2: the notebook ---- */
  .nb{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;padding:10px 14px 12px;
    display:flex;flex-direction:column}
  .nbh{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--on-highlight);
    padding-bottom:6px;border-bottom:1.5px solid var(--on-highlight)}
  .nbh svg.ic{width:20px;height:20px}
  .ne{height:31px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:15px;color:var(--title)}
  .ne b{font-weight:700;min-width:48px}
  .ne i{font-style:italic}
  .ne .sv{width:18px;height:18px;color:var(--on-highlight);margin-left:auto}
  .legend{flex:0 0 auto;display:flex;gap:18px;font-size:13.5px;color:var(--body);align-items:center;flex-wrap:wrap}

  /* ---- scene 4: attacker, notes, you ---- */

  .ar{display:flex;align-items:center;justify-content:center;color:var(--on-highlight)}
  .ar svg.ic{width:34px;height:34px}
  .mid{display:flex;flex-direction:column;gap:10px;align-items:stretch}
  .note{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;padding:10px 14px;

    background-position:0 5px}
  .note .nh{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight);
    display:flex;align-items:center;gap:7px;height:24px}
  .note .nh svg.ic{width:18px;height:18px}
  .note .nl{height:30px;line-height:30px;font-size:15.5px;color:var(--title)}
  .note .nl.mono{font-family:var(--mono);font-weight:700;font-size:14.5px}
  .note .nl i{font-style:italic}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .chipx{display:flex;align-items:center;gap:6px;background:var(--highlight);border:1.5px solid var(--on-highlight);
    border-radius:18px;padding:5px 12px;font-size:14px;font-weight:600;color:var(--on-highlight)}
  .chipx svg.ic{width:17px;height:17px}

  /* ---- scene 5: notebook turns into JSON ---- */
  .split{flex:1 1 auto;min-height:0;margin-bottom:6px;display:grid;grid-template-columns:452px minmax(0,1fr);gap:16px}
  .flip{position:relative;perspective:2400px;overflow:hidden;min-height:0}
  .flip > .face{position:absolute;inset:0;backface-visibility:hidden;
    transition:transform 700ms var(--ease-io),opacity 700ms var(--ease-io)}
  .face.nbk{transform:rotateY(90deg);opacity:0}
  .face.nbk.show{transform:none;opacity:1}
  .face.jsn{transform:rotateY(-90deg);opacity:0}
  .face.jsn.on{transform:none;opacity:1}
  .code{height:100%;background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:12px;padding:8px 10px;
    display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:13.5px;color:var(--title)}

  .jl.br{padding-left:8px}
  .jl .tx{display:block;white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere;padding-left:16px;text-indent:-16px}
  .jl .gl{position:absolute;left:6px;top:4px;width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--line);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:11px;font-weight:700;color:var(--on-highlight);display:flex;align-items:center;justify-content:center}
  .jl.seen .gl{border:1.5px solid var(--on-highlight)}
  .jl.cur{background:var(--highlight);border:2px solid var(--on-highlight);box-shadow:inset 4px 0 0 var(--on-highlight)}

  .nbk .note{height:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:14px 20px;background-position:0 15px}
  .nbk .note .nh{font-size:13px;height:30px}

  .means{min-height:0;display:flex;flex-direction:column;gap:5px}

    font-size:12.5px;font-weight:700;color:var(--on-highlight);background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:12px;padding:0 9px;line-height:18px}
  .mean.cur{border:2px solid var(--on-highlight);background:var(--highlight);padding:4.5px 8.5px}
  .mhead{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}

  /* ---- scene 7: the stamp ---- */
  .snap{position:relative}
  .stamp{position:absolute;right:14px;top:50%;display:flex;align-items:center;gap:8px;
    border:3px double var(--on-highlight);border-radius:8px;padding:8px 12px;background:var(--bg);
    font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--on-highlight);
    opacity:0;transform:translateY(-50%) rotate(-8deg) scale(1.7);
    transition:opacity 260ms var(--ease-out),transform 420ms var(--ease-over)}
  .stamp svg.ic{width:22px;height:22px}
  .stamp.on{opacity:1;transform:translateY(-50%) rotate(-8deg) scale(1)}

  /* ---- the bar ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:9px}

  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:40px;font-size:13.5px;line-height:1.36;

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .board{flex:0 0 auto}
    .row2{grid-template-columns:1fr!important;gap:14px}
    .trio{grid-template-columns:1fr;row-gap:4px}
    .duo{flex-direction:column;gap:6px}
    .duo svg.art{flex:0 0 auto!important;width:100%}
    .art .pn{font-size:17px}
    .art .lbl,.art .lblc,.art .wlbl{font-size:18px}
    .art .lt,.art .lth{font-size:17px}
    .art .lty{font-size:19px}
    .art .ltb{font-size:15px}

    .who{min-height:0}
    .ar{height:34px}

    .split{grid-template-columns:1fr}

    .mean{font-size:15px}

  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}

  </style>
  <div class="nsf">
    <h2>What Can a Lookup Show You?</h2>
    <p>Every website runs on computers somewhere, called servers. Each server has an address on the internet, the same way a house has a street address.</p>
    <p>Some free websites keep a record of what they can see at millions of these addresses. They visit each one from time to time and note down what they find, like someone walking down a street writing down which doors and windows are open on each house.</p>
    <p>Typing an address into one of these websites and reading its record is called a <strong>lookup</strong>.</p>
    <p><strong>Why look at all?</strong> Because attackers do this first. Before anyone tries to break in, they look up the company's address to find an open door or a known flaw. It is free and takes seconds. A lookup shows you exactly what they would see, so you can find the problem before they do.</p>
    <p>Here is the lookup for netflix.com:</p>
<pre>{
  "ip": "54.155.246.232",
  "hostnames": ["ec2-54-155-246-232.eu-west-1.compute.amazonaws.com"],
  "ports": [80, 443],
  "cpes": [],
  "vulns": [],
  "tags": ["cloud"]
}</pre>
    <ul>
      <li><strong>ip:</strong> the address, written as numbers.</li>
      <li><strong>hostnames:</strong> the names that point to this machine. These are Amazon's names, because Netflix rents its servers from Amazon.</li>
      <li><strong>ports:</strong> the doors open to the internet. 80 and 443 are the two doors every website uses.</li>
      <li><strong>cpes:</strong> the software running there and its version. It is empty here, because the lookup website could not tell.</li>
      <li><strong>vulns:</strong> codes for known flaws in that software. There are none here.</li>
      <li><strong>tags:</strong> extra labels. "cloud" means the machine is rented from a cloud company.</li>
    </ul>
    <p>So Netflix shows the internet two ordinary doors and no known flaws.</p>
    <p>It is a snapshot from the lookup website's last visit.</p>
  </div>
</noscript>

<script>

  function icon(k, cls){ return '<svg class="ic' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }

  /* ---------------- drawing helpers (SVG strings) ---------------- */
  function pts(a){ return a.map(function(p){ return p[0] + "," + p[1]; }).join(" "); }

  /* One window. o = open. An open window is dark with its pane swung out:
     shape, not colour alone, tells open from shut. */
  function win(wx, wy, o, side){
    if(o){
      var lx = side < 0 ? wx - 5 : wx + 23;

  /* One door. An open door is a dark gap with the door leaf swung out. */

  function doorShut(dx, G){
    return '<rect class="dc" x="' + dx + '" y="' + (G-34) + '" width="16" height="34"/>'

  /* A house. s = {w:[0|1,0|1], d:[0|1|"a",...]}; "a" draws both states so

  function house(x, G, num, s, cls){

        + '<text class="pn" x="' + (x+50) + '" y="' + (G-83.5) + '">' + num + "</text>";
    }
    h += win(x+8, G-54, s.w[0], -1) + win(x+74, G-54, s.w[1], 1);

  /* The note-taker: a small figure holding a notebook. Drawn at x=0, moved by CSS. */
  function walker(feet, label){
    var t = feet - 50;

    { id:"server", label:"Servers", h1:"Every Website Runs on a Server",

    { id:"notes", label:"The notes", h1:"Someone Walks the Street Taking Notes",

      play:function(){

      play:function(){
        var L = this.lines;
        T(900, function(){ q("#fnb").classList.remove("show"); });
        at(1650, "json");
        var t = 2500;
        L.forEach(function(l, k){
          T(t, function(){
            qa(".jl.cur").forEach(function(n){ n.classList.remove("cur"); n.classList.add("seen"); n.querySelector(".gl").textContent = "✓"; });
            qa(".mean.cur").forEach(function(n){ n.classList.remove("cur"); });
            var ln = q('.jl[data-l="' + k + '"]'); ln.classList.add("cur");
            var mn = q('[data-k="m' + k + '"]'); mn.classList.add("on", "cur");
          });
          if(l.k === "ports") at(t + 500, "pchip");
          t += (l.k === "hostnames" ? 4200 : 3400);
        });
        T(t, function(){
          qa(".jl.cur").forEach(function(n){ n.classList.remove("cur"); n.classList.add("seen"); n.querySelector(".gl").textContent = "✓"; });
          qa(".mean.cur").forEach(function(n){ n.classList.remove("cur"); });
        });
        return t + 200;
      } },

    { id:"doors", label:"What it shows", h1:"Two Ordinary Doors, No Known Flaws",
      alt:"The netflix.com server drawn as a house with two open doors, labelled 80 and 443.",
      build:function(){
        var G = 110;
        var art = '<svg class="art" viewBox="0 0 380 300" role="img" aria-label="' + this.alt + '">'
          + '<text class="lblc mono" x="190" y="24" style="font-size:16px">netflix.com</text>'
          + '<g transform="translate(88 42) scale(2)">' + house(0, G, "", {w:[0,0], d:["a","a"]}, "srv") + "</g>"
          + '<line class="ground" x1="10" y1="262" x2="370" y2="262"/>'
          + '<g class="fxs" data-k="p80"><text class="mono" x="164" y="232" font-size="15" font-weight="700" fill="#FDF8F8" text-anchor="middle">80</text></g>'
          + '<g class="fxs" data-k="p443"><text class="mono" x="212" y="232" font-size="15" font-weight="700" fill="#FDF8F8" text-anchor="middle">443</text></g>'
          + "</svg>";
        return '<div class="row2" style="grid-template-columns:380px minmax(0,1fr)">'
          + "<div>" + art + "</div>"
          + '<div style="display:flex;flex-direction:column;gap:12px">'
          + '<div class="card fx" data-k="c1"><span class="icb">' + icon("door") + '</span><div><div class="kl">Doors open</div><div class="kv">80 and 443</div><div class="ks">The two doors every website uses.</div></div></div>'
          + '<div class="card fx" data-k="c2"><span class="icb">' + icon("bug") + '</span><div><div class="kl">Known flaws</div><div class="kv">None</div></div></div>'
          + '<div class="statement fx" data-k="st">So Netflix shows the internet two ordinary doors and no known flaws.</div>'
          + "</div></div>";
      },
      play:function(){
        T(700, function(){ q('.dset[data-door="0"]').classList.add("op"); });
        at(900, "p80");
        T(1500, function(){ q('.dset[data-door="1"]').classList.add("op"); });
        at(1700, "p443");
        at(2500, "c1");
        at(3300, "c2");
        at(4200, "st");
        return 4700;
      } },

    { id:"snapshot", label:"A snapshot", h1:"A Snapshot From the Last Visit",
      alt:"The note-taker leaves the netflix.com house. The note gets a Last visited stamp.",
      build:function(){
        var G = 180, W = 400, H = 262;
        var art = '<svg class="art" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + this.alt + '">'
          + street(W, G, H) + house(40, G, "", STATES[2], "srv")
          + '<text class="lblc mono" x="90" y="60">netflix.com</text>'
          + walker(H - 8) + "</svg>";
        return '<div class="row2" style="grid-template-columns:400px minmax(0,1fr)">'
          + "<div>" + art + "</div>"
          + '<div class="snap"><div class="note" style="padding:12px 18px;background-position:0 7px"><div class="nh">' + icon("note") + "The notes</div>"
          + '<div class="nl" style="font-weight:700;font-size:18px">netflix.com</div>'
          + '<div class="nl mono">54.155.246.232</div>'
          + '<div class="nl"><i>2 doors open</i></div>'
          + '<div class="nl"><i>No known flaws</i></div></div>'
          + '<div class="stamp" data-k="stamp">' + icon("calendar") + "Last visited</div></div>"
          + "</div>"
          + '<div class="statement fx" data-k="st" style="font-size:19px;padding:13px 20px">It is a snapshot from the lookup website\'s last visit.</div>'
          + '<p class="cap fx" data-k="nx">' + icon("arrow") + "Next, you will look at the same kind of result for your scope's address.</p>";
      },
      play:function(){
        var w = q("#walker");
        if(!w) return 0;
        w.style.transition = "none"; w.style.transform = "translateX(92px)"; void w.getBoundingClientRect(); w.style.transition = "";
        T(700, function(){ w.style.transform = "translateX(430px)"; w.classList.add("walking"); });
        T(1700, function(){ w.classList.remove("walking"); w.classList.add("gone"); });
        at(2000, "stamp");
        at(2900, "st");
        at(3700, "nx");
        return 4200;
      } }
  ];

  /* ---------------- state and timeline ---------------- */
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var timers = [];
  var gen = 0;
  var playing = false;
  function T(ms, fn){ if(reduce){ fn(); return; } timers.push(setTimeout(fn, ms)); }
  function stop(){ timers.forEach(clearTimeout); timers = []; }
  function q(s){ return el.board.querySelector(s); }
  function qa(s){ return Array.prototype.slice.call(el.board.querySelectorAll(s)); }
  function at(ms, key){ T(ms, function(){ qa('[data-k="' + key + '"]').forEach(function(n){ n.classList.add("on"); }); }); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), h1:document.getElementById("h1"),
    board:document.getElementById("board"), back:document.getElementById("back"),
    next:document.getElementById("next"), hint:document.getElementById("hint"),
    replay:document.getElementById("replay"), live:document.getElementById("live")
  };
  el.replay.innerHTML = icon("replay") + "Replay";
  var i = 0;

  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;
    el.back.disabled = (i === 0);
    if(i === S.length-1){ el.next.disabled = true; el.next.textContent = "You are at the end"; }
    else { el.next.disabled = false; el.next.textContent = "Continue"; }
  }

  function render(){
    stop();
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);
    el.board.innerHTML = s.build();
    header();
    el.live.textContent = "Scene " + (i+1) + " of " + S.length + ". " + s.h1 + ".";
    /* let the first paint land in its start state, then play */
    playing = true;
    el.hint.textContent = "";
    void el.board.offsetWidth;
    var my = ++gen;
    var run = function(){
      if(my !== gen) return;
      var end = s.play();
      T(end, function(){ playing = false; window.__ex.done = true; });
    };
    window.__ex && (window.__ex.done = false);
    if(reduce) run(); else requestAnimationFrame(function(){ requestAnimationFrame(run); });
  }

  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });
  el.replay.addEventListener("click", function(){ render(); });

  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){ if(dx < 0){ if(!el.next.disabled) go(1); } else go(-1); }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var sc = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + sc + ")";
  }
  window.addEventListener("resize", fit);

  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; i = n; render(); return true; },
    slides:S.length, done:false,
    reset:function(){ i = 0; render(); },
    state:function(){ return { i:i, playing:playing }; }
  };

  render();
  fit();
})();
</script>
