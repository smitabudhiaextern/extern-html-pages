<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optional Reading: RAG and Your First Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Shell (toggles, parts, link card, tip callout, CSS, JS) copied
   unchanged from ../project-04/pfizer3-p4-m2-optional.html; new: the topics, the stage height and a 2 x 2 link grid
   (.lgrid, as in pfizer3-p4-m4-optional.html). Built by source/m2-optional-build.py; never edit this file by hand.
   Optional Reading for Project 5, module 2 (How RAG Works, Then Your First Gemini Chatbot): 6 topics, one open at a time.
   Topic 1 is the two Bonus pages (Limitations of AI, Further Limitations of AI), short, per Smita (22 Nov 2026).
   Every source line, cut and swap: ../step1-coverage-m2-optional.md.
   Fixed stage: 760 x 830 (Notion embed height 773 px = stage x 708 / 760). Nothing scrolls. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --action:var(--extern-black); --on-action:var(--extern-white);
  --line:var(--gray-600); --focus-ring:var(--pfizer-blue);
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --stage-w:760px; --stage-h:830px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;overflow:hidden;background:var(--surface);padding:16px 20px}

/* Accordion: the shape, spacing, header layout and chevron of the frozen template accordions
   (one bordered box, hairlines between items, title left and chevron right), in this design system's colors. */
.toggles{max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
/* A topic split into parts fills the stage, so Back and Next stay in one place from part to part. */
.app.fill .toggles{height:100%}
.item{flex:none;display:flex;flex-direction:column;min-height:0}
.item+.item{border-top:1px solid var(--line)}
.app.fill .item.open{flex:1 1 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;margin:0;border:0;background:none;text-align:left;cursor:pointer;padding:18px 20px;transition:background-color .15s ease}
.head:hover{background:var(--surface-card)}
.head:focus-visible{outline-offset:-2px;border-radius:0}
.ht{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{margin:0;font-family:var(--font-text);font-size:16px;font-weight:600;line-height:1.45;color:var(--ink)}
.hint{font-size:14px;line-height:1.45;color:var(--ink-muted)}
.chev{flex:none;width:20px;height:20px;color:var(--gray-600);transition:transform .2s ease}
.item.open .chev{transform:rotate(180deg)}

/* The open topic's reading area */
.body{display:none}
.item.open .body{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.pane{flex:1 1 auto;min-height:0;padding:2px 20px 16px;display:flex;flex-direction:column;gap:12px}
.pane p{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty}
.pane b{font-weight:600;color:var(--ink)}
.pane h3{margin:4px 0 0;font-family:var(--font-text);font-size:16px;font-weight:600;line-height:1.35;color:var(--ink)}
.pane ul{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:4px}
.pane li{font-size:15.5px;line-height:1.5;color:var(--ink-muted);padding-left:2px;text-wrap:pretty}
.pane li::marker{color:var(--step-label)}
.pane code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-card);color:var(--ink);padding:1px 5px;border-radius:5px;white-space:nowrap}

.code{background:var(--surface-card);border-radius:var(--radius-sm);flex:none}
.code-head{padding:6px 14px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label);border-bottom:1px solid var(--blue-200)}
.code pre{margin:0;padding:9px 14px;font-family:var(--font-mono);font-size:13px;line-height:1.5;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
/* Tip callout, built from the design system's tokens (pale-blue card, Pfizer blue icon in a white square) */
.tip{display:flex;gap:14px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:14px 16px;margin-top:2px}
.tip-icon{flex:none;width:34px;height:34px;border-radius:var(--radius-xs);background:var(--extern-white);display:flex;align-items:center;justify-content:center;color:var(--pfizer-blue)}
.tip-icon svg{width:20px;height:20px}
.tip-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
.tip-text p{color:var(--card-text);font-size:15px}

/* Part Back and Next, only for topics with more than one part */
.pnav{flex:none;display:flex;align-items:center;gap:12px;padding:8px 20px;border-top:1px solid var(--line)}
.pnav[hidden]{display:none}
.where{flex:1;font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-text);font-size:14px;line-height:1.2;font-weight:600;padding:7px 14px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.btn svg{width:13px;height:13px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.btn-next:disabled{opacity:.35;cursor:default}
/* Link card for the recommended video (same build as pfizer3-p1-m3-how-ai-reads.html) */
.link-card{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);text-decoration:none;flex:none}
.link-card:hover{border-color:var(--ink)}
.link-card:focus-visible{border-radius:var(--radius-sm)}
.lc-thumb{flex:none;width:56px;height:48px;border-radius:var(--radius-xs);background:var(--surface-card);color:var(--pfizer-blue);display:flex;align-items:center;justify-content:center}
.lc-thumb svg{width:22px;height:22px}
.lc-body{flex:1;min-width:0;display:grid;gap:2px}
.lc-title{font-size:15px;font-weight:600;line-height:1.35}
.lc-url{font-size:13px;line-height:1.4;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-card .ext{width:18px;height:18px;color:var(--gray-600);flex:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:no-preference){ .pane.anim{animation:in .22s ease} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
@media (prefers-reduced-motion:reduce){ .chev,.head{transition:none} }

/* 2 x 2 grid of link cards (pfizer3-p4-m4-optional.html) */
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lgrid .link-card{padding:10px 12px}
.lgrid3{grid-template-columns:1fr 1fr 1fr}
/* Six topics instead of three: slightly shorter toggle heads so the closed list leaves room for an open topic */
.head{padding:13px 20px}
</style>
</head>

<script>
(function () {
  "use strict";
  var CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5.5 7.75 4.5 4.5 4.5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var BACK = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var NEXT = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var TOPICS = [
 {
  "title": "Where AI still gets things wrong",
  "hint": "Read this if you want to know why RAG is needed, and where even RAG can fail.",
  "parts": [
   "Hallucinations",
   "A Supplier-File Example",
   "Why AI Hallucinates",
   "Bias",
   "Memory",
   "Complex Reasoning",
   "The Black Box"
  ],
  "panes": [
   "<p>If AI models like ChatGPT and Gemini were infallible (never wrong), why would they come with disclaimers urging users to verify critical information?</p><p>You met hallucinations in Project 1: the AI says something false as if it were true. Even with web search and citation features in the newest chatbots, mistakes still happen.</p><div class=\"tip\"><span class=\"tip-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></span><div class=\"tip-text\"><p>In document workflows, hallucinations can result in AI incorrectly interpreting text, such as misidentifying a 'batch number' as a 'product code.' This can lead to errors in decision-making if left unchecked.</p></div></div>",
   "<p><b>Suppose</b> you ask a chatbot when lot <code>17242818</code> expires, and it confidently answers <code>20210126</code>.</p><p>That's the Date of Manufacture. The certificate's Expiration Date is <code>20230126</code>. One wrong line, said with full confidence.</p><p>See a hallucination for yourself: open ChatGPT or Gemini and type <b>Who is [your own name]?</b> Check what it says.</p>",
   "<p>Here are some reasons why Gen AI hallucinates:</p><ul><li><b>Training Data Limitations:</b> it learned from data that can be wrong, missing or old. Trained only on data from before 2006, it might still call Pluto a planet.</li><li><b>Probabilistic Nature:</b> it guesses the most likely next word, and a likely answer isn't always a true one.</li><li><b>Lack of Proper Grounding:</b> it doesn't check facts against the world. It can even make up links to web pages that never existed.</li><li><b>Context Misunderstanding:</b> ask \"What is the population?\" without a place, and it may give a random number.</li><li><b>Complexity of Human Language:</b> it can take a saying like \"kick the bucket\" literally.</li></ul>",
   "<p>AI models learn from massive datasets, but if those datasets contain historical biases (old, unfair patterns), the AI may unknowingly repeat them and make them stronger.</p><p>For example, some computer-aided diagnosis systems give less accurate results for Black patients than for White patients, because the training data doesn't include enough patients from every group.</p><p>Newer models include stronger safeguards, but bias can't be fully eliminated. That's why <b>human oversight is still essential.</b></p>",
   "<p>ChatGPT, Gemini and Claude now have a <b>memory</b> setting. It saves details from your chats and uses them in later chats, and you can turn it off. Each company explains its memory setting on its own help page:</p><div class=\"lgrid lgrid3\"><a class=\"link-card\" href=\"https://help.openai.com/en/articles/8590148-memory-faq\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"lc-body\"><span class=\"lc-title\">Memory in ChatGPT</span><span class=\"lc-url\">OpenAI Help Center</span></span><svg class=\"ext\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M11.5 3.75h4.75V8.5M16 4l-7 7M14.25 11.5v3.25c0 .8-.7 1.5-1.5 1.5h-7.5c-.8 0-1.5-.7-1.5-1.5v-7.5c0-.8.7-1.5 1.5-1.5H8.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><span class=\"sr-only\"> (opens in a new tab)</span></a><a class=\"link-card\" href=\"https://support.google.com/gemini/answer/16598469?co=GENIE.Platform%3DDesktop\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"lc-body\"><span class=\"lc-title\">Memory of past Gemini chats</span><span class=\"lc-url\">Gemini Apps Help</span></span><svg class=\"ext\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M11.5 3.75h4.75V8.5M16 4l-7 7M14.25 11.5v3.25c0 .8-.7 1.5-1.5 1.5h-7.5c-.8 0-1.5-.7-1.5-1.5v-7.5c0-.8.7-1.5 1.5-1.5H8.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><span class=\"sr-only\"> (opens in a new tab)</span></a><a class=\"link-card\" href=\"https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"lc-body\"><span class=\"lc-title\">Claude's chat search and memory</span><span class=\"lc-url\">Claude Help Center</span></span><svg class=\"ext\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M11.5 3.75h4.75V8.5M16 4l-7 7M14.25 11.5v3.25c0 .8-.7 1.5-1.5 1.5h-7.5c-.8 0-1.5-.7-1.5-1.5v-7.5c0-.8.7-1.5 1.5-1.5H8.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><span class=\"sr-only\"> (opens in a new tab)</span></a></div><p>But the model itself still doesn't learn from your chat. If you correct a mistake, the model only changes when its makers train a new version with new data.</p><p>The chatbot you build in this reading has no memory between chats. Its <code>messages</code> list is its memory for one chat, and it empties every time you run the chatbot again.</p>",
   "<p>AI models like ChatGPT, Gemini, and Claude are great at pattern recognition but struggle with complex reasoning that requires logical deduction, deep understanding, and step-by-step calculations.</p><p>Newer models are better at maths and problems with many steps, but they still make mistakes as a problem gets harder. This news story covers a study that found exactly that:</p><a class=\"link-card\" href=\"https://www.theguardian.com/technology/2025/jun/09/apple-artificial-intelligence-ai-study-collapse\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"lc-thumb\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M14 3v4h4M9.5 12h6M9.5 15.5h6\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/></svg></span><span class=\"lc-body\"><span class=\"lc-title\">Advanced AI suffers ‘complete accuracy collapse’ in face of complex problems, study finds</span><span class=\"lc-url\">theguardian.com/technology</span></span><svg class=\"ext\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M11.5 3.75h4.75V8.5M16 4l-7 7M14.25 11.5v3.25c0 .8-.7 1.5-1.5 1.5h-7.5c-.8 0-1.5-.7-1.5-1.5v-7.5c0-.8.7-1.5 1.5-1.5H8.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><span class=\"sr-only\"> (opens in a new tab)</span></a>",
   "<p>We don't always know <b>how</b> AI makes its decisions: we see the input and the output, but the reasoning stays hidden. That's why AI is often called a <b>\"black box\"</b>.</p><p><b>Suppose</b> an AI marks a supplier certificate as \"failed\". Before anyone rejects that batch, the quality team needs to know why.</p><p><b>Open-source AI</b> shares its code and model design, and sometimes its training data, so anyone can inspect it. <b>Closed-source AI</b> keeps these private. Open source doesn't fully solve the black box, but it lets people check for bias and errors. You'll use open-source models in Project 6.</p><p><b>Key Takeaway:</b> AI is a powerful tool, but requires <b>human oversight</b> to ensure accuracy and fairness.</p>"
  ]
 },
 {
  "title": "Google explains the limits of AI in a short video",
  "hint": "Read this if you'd like a 3-minute video on what to watch for when you use AI.",
  "parts": [
   "Recommended Video"
  ],
  "panes": [
   "<p>Check out this video to learn what Google, a leading company in AI innovation, has to say about the limitations of AI. It's about 3 minutes long.</p><a class=\"link-card\" href=\"https://www.youtube.com/watch?v=unPKJJjQP0A\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"lc-thumb\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2a.8.8 0 0 0-1.2.7Z\" fill=\"currentColor\"/></svg></span><span class=\"lc-body\"><span class=\"lc-title\">Watch this before using generative AI</span><span class=\"lc-url\">youtube.com · Google · about 3 min</span></span><svg class=\"ext\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M11.5 3.75h4.75V8.5M16 4l-7 7M14.25 11.5v3.25c0 .8-.7 1.5-1.5 1.5h-7.5c-.8 0-1.5-.7-1.5-1.5v-7.5c0-.8.7-1.5 1.5-1.5H8.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><span class=\"sr-only\"> (opens in a new tab)</span></a>"
  ]
 },
 {
  "title": "IBM explains RAG in a short video",
  "hint": "Read this if you'd like RAG explained a second way, in about 7 minutes.",
  "parts": [
   "Recommended Video"
  ],
  "panes": [
   "<p>If you want to understand RAG in detail, then this IBM video is a great resource. It's about 7 minutes long.</p><a class=\"link-card\" href=\"https://www.youtube.com/watch?v=T-D1OfcDW1M\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"lc-thumb\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2a.8.8 0 0 0-1.2.7Z\" fill=\"currentColor\"/></svg></span><span class=\"lc-body\"><span class=\"lc-title\">What is Retrieval-Augmented Generation (RAG)?</span><span class=\"lc-url\">youtube.com · IBM Technology · about 7 min</span></span><svg class=\"ext\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M11.5 3.75h4.75V8.5M16 4l-7 7M14.25 11.5v3.25c0 .8-.7 1.5-1.5 1.5h-7.5c-.8 0-1.5-.7-1.5-1.5v-7.5c0-.8.7-1.5 1.5-1.5H8.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><span class=\"sr-only\"> (opens in a new tab)</span></a>"
  ]
 },
 {
  "title": "You can see RAG at work in a chatbot you already use",
  "hint": "Read this if you want to try a quick side-by-side test.",
  "parts": [
   "Try This"
  ],
  "panes": [
   "<p>Try this: ask ChatGPT and Perplexity.ai the same question. Spot the difference? (Hint: Perplexity uses RAG!)</p><p>Perplexity searches the web first, then writes its answer from what it found, with numbered links to its sources. That's the RAG idea: find first, then answer.</p><p>ChatGPT can search the web now too, so look at which answer shows where its facts came from.</p><a class=\"link-card\" href=\"https://www.perplexity.ai/\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"lc-thumb\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M14 3v4h4M9.5 12h6M9.5 15.5h6\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/></svg></span><span class=\"lc-body\"><span class=\"lc-title\">Perplexity</span><span class=\"lc-url\">perplexity.ai</span></span><svg class=\"ext\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M11.5 3.75h4.75V8.5M16 4l-7 7M14.25 11.5v3.25c0 .8-.7 1.5-1.5 1.5h-7.5c-.8 0-1.5-.7-1.5-1.5v-7.5c0-.8.7-1.5 1.5-1.5H8.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><span class=\"sr-only\"> (opens in a new tab)</span></a>"
  ]
 },
 {
  "title": "RAG is used wherever answers must come from trusted documents",
  "hint": "Read this if you're curious where else RAG is used.",
  "parts": [
   "Where RAG Is Used"
  ],
  "panes": [
   "<p>This makes RAG especially powerful for:</p><ul><li>Legal research (retrieving actual case law, the decisions courts made in past cases)</li><li>Medical AI (pulling from peer-reviewed studies, research that other experts checked before it was published)</li><li>Finance (fetching real-time market data, prices as they change)</li></ul><p>In each one, the answer has to come from trusted documents, not from the AI's memory. Answering questions about supplier documents is the same kind of job.</p>"
  ]
 },
 {
  "title": "LlamaIndex's own guides go deeper on each stage and part",
  "hint": "Read this if you want the official docs behind the stages and the four core parts.",
  "parts": [
   "The Stages",
   "The Four Core Parts"
  ],
  "panes": [
   "<p>For a more in-depth look into the stages (Loading, Indexing, Storing, Querying and Evaluating), you can look at this resource by LlamaIndex:</p><a class=\"link-card\" href=\"https://developers.llamaindex.ai/python/framework/understanding/rag/\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"lc-thumb\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M14 3v4h4M9.5 12h6M9.5 15.5h6\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/></svg></span><span class=\"lc-body\"><span class=\"lc-title\">Introduction to RAG</span><span class=\"lc-url\">developers.llamaindex.ai</span></span><svg class=\"ext\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M11.5 3.75h4.75V8.5M16 4l-7 7M14.25 11.5v3.25c0 .8-.7 1.5-1.5 1.5h-7.5c-.8 0-1.5-.7-1.5-1.5v-7.5c0-.8.7-1.5 1.5-1.5H8.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><span class=\"sr-only\"> (opens in a new tab)</span></a><p>These guides are written for developers, so skim them.</p>",

  var app = document.getElementById("app"), list = document.getElementById("toggles");
  var open = -1, part = 0;

  TOPICS.forEach(function (tp, n) {
    var item = document.createElement("div");
    item.className = "item";
    item.innerHTML =
      '<button type="button" class="head" id="h' + n + '" aria-expanded="false" aria-controls="b' + n + '">' +
        '<span class="ht"><span class="t">' + tp.title + '</span><span class="hint">' + tp.hint + '</span></span>' +
        CHEV +
      '</button>' +
      '<div class="body" id="b' + n + '" role="region" aria-labelledby="h' + n + '">' +
        '<div class="pane" aria-live="polite"></div>' +
        '<div class="pnav"' + (tp.panes.length > 1 ? '' : ' hidden') + '>' +
          '<span class="where"></span>' +
          '<button type="button" class="btn btn-back">' + BACK + 'Back</button>' +
          '<button type="button" class="btn btn-next">Next' + NEXT + '</button>' +
        '</div>' +
      '</div>';
    item.querySelector(".head").addEventListener("click", function () { toggle(n); });
    item.querySelector(".btn-back").addEventListener("click", function () { goPart(part - 1); });
    item.querySelector(".btn-next").addEventListener("click", function () { goPart(part + 1); });
    list.appendChild(item);
  });

  function renderPane(anim) {
    if (open < 0) return;
    var tp = TOPICS[open], item = list.children[open];
    var pane = item.querySelector(".pane");
    pane.className = "pane" + (anim ? " anim" : "");
    pane.innerHTML = tp.panes[part];
    if (tp.panes.length > 1) {
      item.querySelector(".where").innerHTML = "Part " + (part + 1) + " of " + tp.panes.length + ": <b>" + tp.parts[part] + "</b>";
      item.querySelector(".btn-back").disabled = part === 0;
      item.querySelector(".btn-next").disabled = part === tp.panes.length - 1;
    }
  }

  function toggle(n) {
    open = open === n ? -1 : n;
    part = 0;
    app.classList.toggle("fill", open >= 0 && TOPICS[open].panes.length > 1);
    Array.prototype.forEach.call(list.children, function (item, k) {
      var on = k === open;
      item.classList.toggle("open", on);
      item.querySelector(".head").setAttribute("aria-expanded", on ? "true" : "false");
      if (!on) item.querySelector(".pane").innerHTML = "";
    });
    renderPane(true);
  }

  function goPart(p) {
    if (open < 0 || p < 0 || p >= TOPICS[open].panes.length) return;
    part = p; renderPane(true);
  }

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  /* Test hook: open a topic and part directly, for example #open=1&part=2. */
  var m = location.hash.match(/open=(\d)(?:&part=(\d))?/);
  if (m) { toggle(+m[1] - 1); if (m[2]) goPart(+m[2] - 1); }
})();
