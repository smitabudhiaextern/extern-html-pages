<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Your Heatmap</title>
<link rel="icon" href="data:,">
<!--
  vCISO P3 Step 3, Module 9, "Build your heatmap".
  Spec: 06-content/project-03/step-03/module-09-internal.md, "Build note".
  Answer rule: P3 Sample Pack/Interactive content sets - P3.md, P3-9 (SME drop
  2026-09-25): read the chart cold, numbers hidden, then reveal; ties are right
  ("a student who names all three 'closest' is right; don't mark that wrong").

  QA fix pass 8 October 2026: rebuilt to the owner's interactive rules
  (HANDOVER-2026-10-02-P2.md section 2) and to the layout of the fixed
  vciso-p3-m6-six-words-three-problems.html.
    - One question per slide: "furthest behind" and "closest" were on one slide.
    - Right = green tick and "Right"; wrong = red cross and "Not quite", then try
      again; after the second wrong try the right answer shows in green. The old
      build judged once, in navy only, on a separate slide.
    - A plain line under each option says what the function means.
    - The old slide 3 (numbers plus a verdict panel) and slide 4 (numbers for the
      screenshot) showed the same chart twice. They are now one last slide.
    - The per-slide background tints are gone, because the green and red
      feedback tints did not read against them.

  The chart is built from the student's own twelve scores. Nothing here holds
  an expected answer: the right set for each question is worked out from what
  the student put in. Every row in the furthest (or closest) shade is right;
  naming only some of them is right too, and the feedback names the rest.
  When every row is the same shade there is no right answer: the picks show in
  navy as "Your pick" and the panel is green, never red.

  The right and wrong colours are used only for right and wrong, always with an
  icon and a word. Every shade of navy in the chart also carries its label in
  words, so colour is never the only signal.

  Layout: every grid sits in normal flow, so nothing can be drawn over anything
  else. No absolute positioning on the board.

  Verify before shipping:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs --allow '#146C2E,#E6F4EA,#B3261E,#FCE8E6' this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    /* right and wrong states only, always paired with an icon and a word */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);
    /* The shade ramp, light to darkest, checked in grayscale:
       at or above #DCE1FF, one step 45% navy, two steps 70% navy, three or
       more solid navy with #484646 hairlines. Text on each is AA. */
    --mid:rgba(0,29,105,.45);
    --deep:rgba(0,29,105,.70);

    --t-fast:160ms;
    --t-reveal:460ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto;background:var(--bg)}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* header */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin-bottom:6px;min-height:28px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .dots{display:flex;gap:7px;align-items:center}
  .dots i{display:block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--on-highlight);background:transparent}
  .dots i.on{background:var(--on-highlight)}
  .dots i.here{background:var(--on-highlight);width:12px;height:12px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--on-highlight)}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  h1{font-size:25px;line-height:1.22;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  .lead{font-size:16px;line-height:1.48;color:var(--body);max-width:96ch}
  .lead b{color:var(--title);font-weight:600}
  .intro{display:flex;flex-direction:column;gap:14px;max-width:74ch}
  .intro p{font-size:17px;line-height:1.5}
  .intro p b{color:var(--title);font-weight:600}
  button.jump{font-family:inherit;font-size:15px;font-weight:600;color:var(--on-highlight);align-self:flex-start;
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:7px;padding:8px 15px;cursor:pointer}
  button.jump:hover{background:var(--tint2)}
  button.jump:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* the instruction strip on slide 1, with Build on the right, in flow */
  .how{flex:0 0 auto;display:flex;align-items:center;gap:12px;min-height:46px;background:var(--highlight);color:var(--title);
    border-left:4px solid var(--on-highlight);border-radius:6px;padding:5px 6px 5px 14px;font-size:16px;line-height:1.4}
  .how .ht{flex:1 1 auto;min-width:0}
  .how b{font-weight:600}
  .how .sc{flex:0 0 auto;font-weight:600;color:var(--on-highlight);font-size:15px;white-space:nowrap}
  .how button.nav{padding:8px 18px}

  /* ---------- slide 1: the twelve score pickers ----------
     Every picker starts empty. Nothing is pre-selected. */
  .grid{flex:0 0 auto;display:flex;flex-direction:column;
    background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:1px 14px}
  .gr{display:grid;grid-template-columns:minmax(0,1fr) 230px 230px;column-gap:28px;align-items:center;
    min-height:45px;border-top:1px solid var(--tint2)}
  .gr:first-child{border-top:0}
  .gr.gh{min-height:30px}
  .gr.gh span{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--on-highlight);line-height:1.3}
  .fname{min-width:0;display:flex;flex-direction:column;padding:2px 0}
  .fname b{font-size:19px;font-weight:600;color:var(--title);line-height:1.2}
  .pc{min-width:0}
  .pcap{display:none;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--on-highlight);margin-bottom:4px}
  .seg{display:flex;gap:5px;border:0}
  .seg legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .seg input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  .seg label{flex:0 0 auto;width:42px;height:36px;border-radius:8px;border:1.5px solid var(--on-highlight);
    background:transparent;color:var(--on-highlight);font-size:17px;font-weight:600;
    display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;
    font-variant-numeric:tabular-nums;transition:background var(--t-fast) var(--ease-out),color var(--t-fast) var(--ease-out)}
  .seg label:hover{background:var(--tint2)}
  .seg input:checked + label{background:var(--on-highlight);color:var(--bg)}
  .seg input:focus-visible + label{outline:3px solid var(--on-highlight);outline-offset:2px}

  /* The heat cell. Lightest at or above target, darkest furthest away.
     Every shade carries its label in words. */
  .hc{min-width:0;min-height:34px;border-radius:7px;display:flex;align-items:center;padding:4px 12px;
    font-size:15px;font-weight:600;line-height:1.25;text-align:left}
  .hc.h0{background:var(--highlight);border:1.5px solid var(--on-highlight);color:var(--title)}
  .hc.h1{background:linear-gradient(var(--mid),var(--mid)),var(--bg);border:1.5px solid var(--on-highlight);color:var(--title)}
  .hc.h2{background:linear-gradient(var(--deep),var(--deep)),var(--bg);border:1.5px solid var(--on-highlight);color:var(--bg)}
  .hc.h3{background:repeating-linear-gradient(135deg,#001D69 0 6px,#484646 6px 8.5px);border:1.5px solid var(--on-highlight);color:var(--bg)}
  .hc.h3 .lb{background:var(--on-highlight);border-radius:4px;padding:1px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

  /* ---------- slides 2 and 3: one question each ----------
     Each chart row is an option: the function, a plain line on what it
     means, and its shade. Picks are judged with Check. */
  .q{display:grid;grid-template-columns:minmax(0,1fr) 268px;column-gap:22px;align-items:start;min-height:0}
  .rows{min-width:0;display:grid;grid-auto-rows:auto;gap:6px}
  button.opt{font-family:inherit;text-align:left;color:var(--title);min-width:0;width:100%;
    background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;
    padding:5px 8px 5px 10px;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) 238px;column-gap:10px;align-items:center;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  button.opt .g{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--on-highlight);
    color:var(--bg);display:flex;align-items:center;justify-content:center;background:var(--bg)}
  button.opt .g svg.ic{width:17px;height:17px;stroke-width:2.6}
  button.opt .txt{min-width:0;display:flex;flex-direction:column;gap:1px}
  button.opt .lr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
  button.opt .ol{font-size:16.5px;font-weight:700;line-height:1.2;color:var(--title)}
  button.opt .om{font-size:13.5px;line-height:1.3;color:var(--body)}
  button.opt .tg{flex:0 0 auto;font-size:13px;font-weight:700;white-space:nowrap}
  @media (hover:hover){ button.opt:hover:not(:disabled):not(.sel){background:var(--highlight)} }
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt:disabled{cursor:default}
  /* picked, not yet judged: navy, "Your pick" */
  button.opt.sel{background:var(--highlight);box-shadow:inset 0 0 0 1.5px var(--on-highlight)}
  button.opt.sel .g{background:var(--on-highlight)}
  button.opt.sel .tg{color:var(--on-highlight)}
  button.opt.idle:disabled{border-style:dashed;border-color:var(--line)}
  button.opt.idle:disabled .g{border-color:var(--line)}
  button.opt.idle:disabled .ol{color:var(--body)}
  button.opt.ok{background:var(--ok-tint);border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
  button.opt.ok .g{background:var(--ok);border-color:var(--ok)}
  button.opt.ok .tg{color:var(--ok)}
  button.opt.no{background:var(--no-tint);border-color:var(--no);box-shadow:0 0 0 1px var(--no)}
  button.opt.no .g{background:var(--no);border-color:var(--no)}
  button.opt.no .tg{color:var(--no)}

  .side{min-width:0;display:flex;flex-direction:column;gap:10px}
  .ask{font-size:15px;line-height:1.42;color:var(--body)}
  .ask b{color:var(--title);font-weight:600}
  .side button.nav{align-self:flex-start}
  .fb{border-radius:10px;padding:9px 14px 11px;border-left:6px solid;display:flex;flex-direction:column;gap:4px}
  .fb.ok{background:var(--ok-tint);border-color:var(--ok)}
  .fb.no{background:var(--no-tint);border-color:var(--no)}
  .fb .fh{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:700}
  .fb.ok .fh{color:var(--ok)}
  .fb.no .fh{color:var(--no)}
  .fb .fh svg.ic{width:20px;height:20px;stroke-width:2}
  .fb .ft{font-size:14.5px;line-height:1.42;color:var(--title)}
  .fb.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .fb:focus{outline:none}

  /* ---------- slide 4: the chart with numbers, for the screenshot ---------- */
  .fin{display:grid;grid-template-columns:minmax(0,1fr) 262px;column-gap:20px;align-items:start;min-height:0}
  .chart{min-width:0;display:flex;flex-direction:column;
    background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:6px 14px 6px}
  .ctitle{font-size:15px;font-weight:600;color:var(--title);padding:2px 0 4px;line-height:1.3}
  .cr{display:grid;grid-template-columns:86px 66px 58px 36px minmax(0,1fr);column-gap:8px;align-items:center;
    min-height:40px;border-top:1px solid var(--tint2)}
  .cr.ch{min-height:26px;border-top:0}
  .cr.ch span{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--on-highlight)}
  .cr .fn{font-size:16px;font-weight:600;color:var(--title)}
  .ctr{text-align:center}
  .sq{justify-self:center;width:32px;height:30px;border-radius:6px;border:1.5px solid var(--on-highlight);
    background:var(--highlight);color:var(--on-highlight);font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .gp{justify-self:center;font-size:15px;font-weight:600;color:var(--title);font-variant-numeric:tabular-nums}
  .chart .hc{min-height:32px;padding:3px 10px}
  .capt{border-top:1px solid var(--tint2);padding:5px 0 0;font-size:13.5px;line-height:1.38;color:var(--body)}
  .chart.in .hc{animation:rin var(--t-reveal) var(--ease-over) both}
  .notes{min-width:0;display:flex;flex-direction:column;gap:10px}
  .shot{background:var(--highlight);border-left:4px solid var(--on-highlight);border-radius:0 9px 9px 0;
    padding:9px 13px;font-size:15px;line-height:1.42;color:var(--title)}
  .shot b{font-weight:600}
  .fnote{font-size:14.5px;line-height:1.42;color:var(--title);border:1.5px solid var(--on-highlight);border-radius:9px;padding:8px 12px}
  .fnote b{font-weight:600}

  /* the bar */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:52px;padding-top:9px}
  button.nav{font-family:inherit;font-size:15px;font-weight:600;padding:9px 20px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.36;color:var(--body)}
  #hint b{color:var(--title);font-weight:600}
  /* Start again asks first, in the bar, before anything is cleared. */
  #confirm{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--title)}
  #confirm b{font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* under 600px: a portrait restack, not a shrunken slide */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    .lead{font-size:16px}
    .intro p{font-size:16px}
    .board{flex:0 0 auto;gap:14px}
    .how{flex-wrap:wrap;font-size:16px;padding:10px 12px}
    .grid{padding:4px 12px}
    .gr{grid-template-columns:1fr 1fr;row-gap:8px;padding:10px 0}
    .gr .fname{grid-column:1/-1}
    .gr.gh{display:none}
    .gr:nth-child(2){border-top:0}
    .fname b{font-size:18px}
    .pcap{display:block}
    .seg{gap:4px}
    .seg label{width:auto;flex:1 1 0;min-width:0;height:40px;font-size:17px}
    .q,.fin{display:flex;flex-direction:column;gap:14px}
    button.opt{grid-template-columns:28px minmax(0,1fr);row-gap:8px;padding:10px 12px}
    button.opt .hc{grid-column:1/-1}
    button.opt .om{font-size:15px}
    .ask{font-size:16px}
    .side button.nav{align-self:stretch}
    .fb .ft{font-size:15.5px}
    .fb{scroll-margin:16px}
    .cr{grid-template-columns:minmax(0,1fr) 66px 58px 36px;column-gap:6px;row-gap:6px;padding:8px 0}
    .cr .hc{grid-column:1/-1}
    .cr.ch{padding:4px 0}
    .cr.ch span:last-child{display:none}
    .shot,.fnote{font-size:16px;line-height:1.5}
    .capt{font-size:14px}
    button.jump{font-size:16px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{font-size:15px;flex:1 1 100%;margin-top:4px}
    #hint .kb{display:none}
    #confirm{flex:1 1 100%;flex-wrap:wrap;font-size:16px}
    #confq{flex:1 1 100%}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Put in your twelve scores">

    <div class="top">
      <span class="prog" id="prog"></span>
      <span class="dots" id="segs" aria-hidden="true"></span>
      <span class="chip" id="chip" hidden></span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Next</button>
      <button class="nav ghost" id="again" type="button" hidden>Start again</button>
      <div id="confirm" role="group" aria-labelledby="confq" hidden>
        <b id="confq">Clear all my scores?</b>
        <button class="nav" id="confyes" type="button">Yes, clear them</button>
        <button class="nav ghost" id="confno" type="button">Keep them</button>
      </div>
      <div id="hint"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 16px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:18px;color:#1C1B1B;margin:22px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:8px}
    .nsf strong{color:#1C1B1B}
  </style>
  <div class="nsf">
    <h2>Build your heatmap</h2>
    <p>This interactive needs JavaScript, which is switched off here. You can work out the same chart by hand from your profile.</p>
    <h3>Work out each gap</h3>
    <p>For each of the six functions (Govern, Identify, Protect, Detect, Respond and Recover), take its <strong>Target</strong> score and subtract its <strong>Current</strong> score. That number is the gap.</p>
    <h3>Give each gap a label</h3>
    <ul>
      <li><strong>At target:</strong> a gap of 0.</li>
      <li><strong>Above target:</strong> a gap below 0. The current score is higher than the target. Check that you did not swap the two numbers.</li>
      <li><strong>One step short:</strong> a gap of 1.</li>
      <li><strong>Two steps short:</strong> a gap of 2.</li>
      <li><strong>Three or more steps short:</strong> a gap of 3 or 4.</li>
    </ul>
    <p>On a heatmap, the bigger the gap, the darker the color.</p>
    <h3>Read it</h3>
    <p>Which functions do you think are furthest behind? Which do you think are closest to their target? You can name more than one. Functions with the same label are tied.</p>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  var IC = {
    check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    x:'<path d="M7 7l10 10M17 7L7 17"/>',
    okc:'<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8 5.4-5.6"/>',
    noc:'<circle cx="12" cy="12" r="9"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/>',
    book:'<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15.5H5.5A1.5 1.5 0 0 0 4 21z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15.5h5.5A1.5 1.5 0 0 1 20 21z"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }

  /* ---------------- content ----------------
     Function names: verbatim from the Profile tab of CSF profile
     template.xlsx (SME drop 2026-09-25). The 0 to 4 scale: verbatim from its
     "The scale" tab. Status labels and shading rules: module-09-internal.md,
     Build note. short: the plain line under each option, ours, from the
     NIST CSF 2.0 function definitions, matching vciso-p3-m6-six-words-three-problems.html. */
  var FUNCS = [
    { id:"gv", name:"Govern",   short:"Who is in charge, and the rules" },
    { id:"id", name:"Identify", short:"Knowing what you have" },
    { id:"pr", name:"Protect",  short:"Safeguards, like locks" },
    { id:"de", name:"Detect",   short:"Noticing when something goes wrong" },
    { id:"rs", name:"Respond",  short:"Acting when something goes wrong" },
    { id:"rc", name:"Recover",  short:"Getting back to normal" }
  ];
  var SCALE = [
    "Not done at all",
    "Ad hoc: happens informally, if at all; nothing written, nobody owns it",
    "Partly in place: done in some areas, inconsistently, or without records",
    "Defined and operating: done consistently, with evidence it operates",
    "Managed and measured: done, measured, and improved over time"
  ];
  /* The four shades. Band 0 holds both "at target" and "above target",
     band 3 holds gaps of 3 and 4: the spec draws each pair the same way,
     so the questions are judged by shade. */
  var BAND_WORDS = ["at or above target", "one step short", "two steps short", "three or more steps short"];
  var SHOT_LINE = "Take a screenshot of just the chart and paste it on the Profile tab, under the table. On a Mac, press <b>Cmd+Ctrl+Shift+4</b>. On Windows, press <b>Windows+Shift+S</b>. Then drag a box around the chart.";
  var DONE_LINE = "You are done here. Go back to the module for the next step.";

  /* The two questions. far: the darkest shade is right. */
  var Q = {
    pa:{ far:true,  q:"Which functions do you think are furthest behind?", end:"darkest" },
    pb:{ far:false, q:"Which functions do you think are closest to their target?", end:"lightest" }
  };

  var S = [
    { kind:"scores", label:"Your scores",       h1:"Put in your twelve scores" },
    { kind:"q", qk:"pa", label:"Furthest behind",   h1:Q.pa.q },
    { kind:"q", qk:"pb", label:"Closest to target", h1:Q.pb.q },
    { kind:"final", label:"Your heatmap",        h1:"Here are the numbers behind your colors" }
  ];

  /* data validation, at load, loud */
  (function validate(){
    var p = [];
    if(FUNCS.length !== 6) p.push("expected six functions");
    if(SCALE.length !== 5) p.push("expected a 0 to 4 scale");
    FUNCS.forEach(function(f){ if(!f.short) p.push(f.id + " has no plain line"); });
    if(p.length){
      document.getElementById("board").innerHTML = '<p class="lead"><b>This interactive has authoring errors:</b> ' + p.join("; ") + "</p>";
      throw new Error("data invalid: " + p.join("; "));
    }
  })();

  /* ---------------- state ----------------
     A copy is kept in localStorage so the chart is still there when the
     student comes back for the screenshot; if storage is blocked, the
     interactive works the same without it. */
  var KEY = "vciso-p3-m9-build-your-heatmap-v2";
  function freshQ(){ return { sel:{}, out:{}, tries:0, done:null }; }
  function fresh(){
    var o = { cur:{}, tgt:{}, built:false, pa:freshQ(), pb:freshQ() };
    FUNCS.forEach(function(f){ o.cur[f.id] = null; o.tgt[f.id] = null; });
    return o;
  }
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function okScore(v){ return v === 0 || v === 1 || v === 2 || v === 3 || v === 4; }
  function fOf(id){ for(var k=0;k<FUNCS.length;k++) if(FUNCS[k].id === id) return FUNCS[k]; return null; }
  function filled(o){
    var n = 0;
    FUNCS.forEach(function(f){ if(okScore(o.cur[f.id])) n++; if(okScore(o.tgt[f.id])) n++; });
    return n;
  }
  function loadQ(r){
    var q = freshQ();
    if(!isPlain(r)) return q;
    ["sel","out","lastOut","kept"].forEach(function(k){
      if(k === "lastOut" || k === "kept") q[k] = {};
      if(isPlain(r[k])) FUNCS.forEach(function(f){ if(r[k][f.id] === 1) q[k][f.id] = 1; });
    });
    if(r.tries === 1 || r.tries === 2) q.tries = r.tries;
    if(r.done === "right" || r.done === "shown" || r.done === "read") q.done = r.done;
    return q;
  }
  function load(){
    var o = fresh();
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return o;
      FUNCS.forEach(function(f){
        if(isPlain(raw.cur) && okScore(raw.cur[f.id])) o.cur[f.id] = raw.cur[f.id];
        if(isPlain(raw.tgt) && okScore(raw.tgt[f.id])) o.tgt[f.id] = raw.tgt[f.id];
      });
      if(filled(o) === 12 && raw.built === true){
        o.built = true;
        o.pa = loadQ(raw.pa);
        o.pb = o.pa.done ? loadQ(raw.pb) : freshQ();
      }
    }catch(e){}
    return o;
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();
  /* A returning student lands on the furthest slide still open to them. */
  function startSlide(o){
    if(!o.built) return 0;
    if(o.pb.done) return 3;
    if(o.pa.done) return 2;
    return 1;
  }

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    again:document.getElementById("again"), confirm:document.getElementById("confirm"),
    confyes:document.getElementById("confyes"), confno:document.getElementById("confno"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = startSlide(st);
  var changedNote = false;   /* a score changed after the chart was built */

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function say(m){ el.live.textContent = ""; setTimeout(function(){ el.live.textContent = m; }, 30); }
  function phone(){ return window.matchMedia("(max-width:599px)").matches; }

  /* ---------------- the arithmetic ----------------
     Gap = target minus current (module-09-internal.md source trace). */
  function gap(f){ return st.tgt[f.id] - st.cur[f.id]; }
  function band(g){ return g <= 0 ? 0 : (g >= 3 ? 3 : g); }
  function label(g){
    if(g < 0) return "Above target";
    if(g === 0) return "At target";
    if(g === 1) return "One step short";
    if(g === 2) return "Two steps short";
    return "Three or more steps short";
  }
  function fmtGap(g){ return g < 0 ? "−" + (-g) : String(g); }
  function names(list){
    var n = list.map(function(f){ return f.name; });
    if(n.length < 2) return n.join("");
    return n.slice(0, -1).join(", ") + " and " + n[n.length-1];
  }
  function isAre(list){ return list.length === 1 ? " is " : " are "; }
  /* How a set of functions in one shade is described. Band 0 says "at
     target" or "above target" when every function in it is the same. */
  function words(list){
    var b = band(gap(list[0]));
    if(b > 0) return BAND_WORDS[b];
    var at = list.filter(function(f){ return gap(f) === 0; }).length;
    if(at === list.length) return "at target";
    if(at === 0) return "above target";
    return BAND_WORDS[0];
  }
  /* The right set for each question, from the student's own scores. Ties:
     every function in the furthest (or closest) shade is right. */
  function answerSets(){
    var vals = FUNCS.map(function(f){ return band(gap(f)); });
    var hi = Math.max.apply(null, vals), lo = Math.min.apply(null, vals);
    return {
      hi:hi, lo:lo, same:(hi === lo),
      pa:FUNCS.filter(function(f){ return band(gap(f)) === hi; }),
      pb:FUNCS.filter(function(f){ return band(gap(f)) === lo; })
    };
  }
  function rightSet(qk){ return answerSets()[qk]; }
  function inSet(list, f){ return list.some(function(x){ return x.id === f.id; }); }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k === i ? "here" : k < i ? "on" : "") + "'></i>";
    el.segs.innerHTML = h;
    el.back.disabled = (i === 0);
    var end = (i === S.length - 1);
    el.next.hidden = end;
    el.again.hidden = !end || !el.confirm.hidden;
    el.again.disabled = filled(st) === 0;
    if(!end){
      if(s.kind === "scores") el.next.disabled = !st.built;
      else el.next.disabled = !(st.built && st[s.qk].done);
    }
    if(s.kind === "q" && st.built){ el.chip.hidden = false; el.chip.textContent = "Numbers hidden"; }
    else if(s.kind === "final" && st.built && st.pb.done){ el.chip.hidden = false; el.chip.textContent = "Numbers showing"; }
    else { el.chip.hidden = true; el.chip.textContent = ""; }
  }

  function render(focusSel){
    var s = S[i];
    askClear(false);
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);
    el.hint.innerHTML = "";
    if(s.kind === "scores") renderScores(focusSel);
    else if(s.kind === "q") renderQ(s.qk, focusSel);
    else renderFinal();
    header();
  }

  function gate(msg, btn, to){
    el.board.innerHTML = '<div class="intro"><p>' + msg + '</p><button class="jump" type="button" id="gate">' + esc(btn) + "</button></div>";
    el.board.querySelector("#gate").addEventListener("click", function(){ i = to; render(); focusTop(); });
  }

  /* ---------------- slide 1: your twelve scores ---------------- */
  var SCORES_HINT = 'Click a number to pick it.<span class="kb"> On a keyboard, use Tab and the arrow keys.</span>';
  function scoreHint(v){ el.hint.innerHTML = "<b>Score " + v + ".</b> " + esc(SCALE[v]); }
  function restHint(){
    if(changedNote && !st.built) el.hint.innerHTML = "<b>You changed a score.</b> Press <b>Build</b> to make the chart again.";
    else el.hint.innerHTML = SCORES_HINT;
  }
  function segHTML(f, which){
    var v = st[which][f.id];
    var nm = "s-" + which + "-" + f.id;
    var lab = f.name + ", " + (which === "cur" ? "current" : "target") + " score";
    var h = '<fieldset class="seg"><legend>' + esc(lab) + "</legend>";
    for(var n=0;n<=4;n++){
      var id = nm + "-" + n;
      h += '<input type="radio" name="' + nm + '" id="' + id + '" value="' + n + '" data-f="' + f.id + '" data-w="' + which + '"' + (v === n ? " checked" : "") + ">"
        + '<label for="' + id + '" data-v="' + n + '" aria-label="' + n + ". " + esc(SCALE[n]) + '">' + n + "</label>";
    }
    return h + "</fieldset>";
  }
  function renderScores(focusSel){
    var n = filled(st);
    var how = '<div class="how"><span class="ht">Copy the Current and Target scores from your profile. Then press <b>Build</b>.</span>'
      + '<span class="sc" id="cnt">' + n + " of 12 filled</span>"
      + '<button class="nav" id="build" type="button"' + (n === 12 ? "" : " disabled") + ">Build</button></div>";
    var rows = '<div class="gr gh"><span>Function</span><span>Current</span><span>Target</span></div>';
    FUNCS.forEach(function(f){
      rows += '<div class="gr"><div class="fname"><b>' + esc(f.name) + "</b></div>"
        + '<div class="pc"><span class="pcap" aria-hidden="true">Current</span>' + segHTML(f, "cur") + "</div>"
        + '<div class="pc"><span class="pcap" aria-hidden="true">Target</span>' + segHTML(f, "tgt") + "</div></div>";
    });
    el.board.innerHTML = how + '<div class="grid">' + rows + "</div>";
    Array.prototype.forEach.call(el.board.querySelectorAll(".seg input"), function(inp){
      inp.addEventListener("change", function(){ setScore(inp.dataset.f, inp.dataset.w, +inp.value); });
      inp.addEventListener("focus", function(){ scoreHint(+inp.value); });
      inp.addEventListener("blur", function(){ restHint(); });
    });
    Array.prototype.forEach.call(el.board.querySelectorAll(".seg label"), function(lb){
      lb.addEventListener("mouseenter", function(){ scoreHint(+lb.dataset.v); });
      lb.addEventListener("mouseleave", function(){ restHint(); });
    });
    el.board.querySelector("#build").addEventListener("click", build);
    restHint();
    if(focusSel){ var x = el.board.querySelector(focusSel); if(x) x.focus(); }
  }
  function setScore(fid, which, v){
    if(!okScore(v) || !(fid in st[which])) return;
    if(st[which][fid] === v) return;
    st[which][fid] = v;
    if(st.built){
      st.built = false; st.pa = freshQ(); st.pb = freshQ();
      changedNote = true;
      restHint();
    }
    save(st);
    var n = filled(st);
    var cnt = el.board.querySelector("#cnt"), b = el.board.querySelector("#build");
    if(cnt) cnt.textContent = n + " of 12 filled";
    if(b) b.disabled = n !== 12;
    header();
    say(fOf(fid).name + ", " + (which === "cur" ? "current" : "target") + ": " + v + ". " + n + " of 12 filled.");
  }
  function build(){
    if(filled(st) !== 12) return;
    if(!st.built){
      st.built = true; st.pa = freshQ(); st.pb = freshQ();
      changedNote = false;
      save(st);
    }
    i = 1; render(); focusTop();
    say("Chart built. " + el.prog.textContent + ". " + S[1].h1);
  }

  /* ---------------- slides 2 and 3: one question each ---------------- */
  function cellHTML(f, hide){
    return '<span class="hc h' + band(gap(f)) + '"' + (hide ? ' aria-hidden="true"' : "") + '><span class="lb">' + esc(label(gap(f))) + "</span></span>";
  }
  function optHTML(f, cls, ico, tag, disabled, pressed){
    return '<button class="opt' + (cls ? " " + cls : "") + '" type="button" data-f="' + f.id + '"'
      + (disabled ? ' disabled aria-disabled="true"' : ' aria-pressed="' + (pressed ? "true" : "false") + '"')
      + ' aria-label="' + esc(f.name + ". " + f.short + ". " + label(gap(f)) + "." + (tag ? " " + tag + "." : "")) + '">'
      + '<span class="g" aria-hidden="true">' + (ico ? icon(ico) : "") + "</span>"
      + '<span class="txt" aria-hidden="true"><span class="lr"><span class="ol">' + esc(f.name) + "</span>"
      + (tag ? '<span class="tg">' + esc(tag) + "</span>" : "") + "</span>"
      + '<span class="om">' + esc(f.short) + "</span></span>"
      + cellHTML(f, true) + "</button>";
  }
  function rowsHTML(qk){
    var q = st[qk], right = rightSet(qk), same = answerSets().same;
    return '<div class="rows" role="group" aria-label="Your chart, one row per function">' + FUNCS.map(function(f){
      var isAns = inSet(right, f);
      if(q.done === "read") return q.sel[f.id] ? optHTML(f, "sel", "check", "Your pick", true) : optHTML(f, "idle", "", "", true);
      if(q.done && isAns && !same){
        var tag = q.done === "right" ? (q.sel[f.id] ? "Right" : "Also right") : "Right answer";
        return optHTML(f, "ok", "check", tag, true);
      }
      if(q.out[f.id]) return optHTML(f, "no", "x", "Not quite", true);
      if(q.done) return optHTML(f, "idle", "", "", true);
      if(q.sel[f.id]) return optHTML(f, "sel", "check", "Your pick", false, true);
      return optHTML(f, "", "", "", false, false);
    }).join("") + "</div>";
  }
  function fbHTML(kind, head, text){
    return '<div class="fb ' + (kind === "no" ? "no" : "ok") + '" id="fb" tabindex="-1">'
      + '<span class="fh">' + icon(kind === "no" ? "noc" : kind === "read" ? "book" : "okc") + esc(head) + "</span>"
      + '<p class="ft">' + esc(text) + "</p></div>";
  }
  function feedback(qk){
    var q = st[qk], Qd = Q[qk], a = answerSets(), right = a[qk];
    var picked = FUNCS.filter(function(f){ return q.sel[f.id]; });
    var they = right.length === 1 ? "It is the " + Qd.end + " row" : "They are the " + Qd.end + " rows";
    if(q.done === "read"){
      var t = a.hi === 0
        ? "There is no right answer here. Every function is at or above its target, so none of them is behind."
        : "There is no right answer here. Every row on your chart is the same shade: all six functions are " + BAND_WORDS[a.hi] + ". None is further behind or closer than the others.";
      return fbHTML("read", "Read", t);
    }
    if(q.done === "right"){
      var miss = right.filter(function(f){ return !q.sel[f.id]; });
      var txt = names(picked) + isAre(picked) + words(right) + ". " + (picked.length === 1 ? "It is the " : "They are the ") + Qd.end + (picked.length === 1 ? " row" : " rows") + " on your chart.";
      if(miss.length) txt += " " + names(miss) + isAre(miss) + "in the same shade, so " + (miss.length === 1 ? "it counts" : "they count") + " too.";
      return fbHTML("ok", "Right", txt);
    }
    if(q.done === "shown")
      return fbHTML("ok", right.length === 1 ? "Here is the right answer" : "Here are the right answers",
        names(right) + isAre(right) + words(right) + ". " + they + " on your chart.");
    if(q.tries){
      var last = FUNCS.filter(function(f){ return q.out[f.id] && q.lastOut && q.lastOut[f.id]; });
      if(!last.length) last = FUNCS.filter(function(f){ return q.out[f.id]; });
      var kl = FUNCS.filter(function(f){ return q.kept && q.kept[f.id]; });
      var kept = kl.length ? names(kl) + isAre(kl) + "right, so " + (kl.length === 1 ? "it stays" : "they stay") + " picked. " : "";
      var hint = names(last) + isAre(last) + (last.length === 1 ? "not one of the " : "not among the ") + Qd.end + " rows. Look for the " + Qd.end + " shade on your chart. ";
      return fbHTML("no", "Not quite", hint + kept + "Then press Check again.");
    }
    return "";
  }
  function renderQ(qk, focusSel){
    if(!st.built){ gate("Put in all twelve scores and press <b>Build</b> first. Your chart shows up here.", "Go to your scores", 0); return; }
    if(qk === "pb" && !st.pa.done){ gate("Answer the first question first.", "Go to the first question", 1); return; }
    var q = st[qk], n = Object.keys(q.sel).length;
    var ask = q.done ? "" : '<p class="ask">Pick every function you think fits. You can pick more than one, because rows in the same shade are tied. Then press <b>Check</b>.</p>'
      + '<button class="nav" id="chk" type="button"' + (n ? "" : " disabled") + ">Check</button>";
    el.board.innerHTML = '<p class="lead">Here is your chart with the numbers hidden. The darker the row, the further that function is from its target.</p>'
      + '<div class="q">' + rowsHTML(qk) + '<div class="side">' + ask + feedback(qk) + "</div></div>";
    if(!q.done){
      Array.prototype.forEach.call(el.board.querySelectorAll(".rows button.opt:not(:disabled)"), function(b){
        b.addEventListener("click", function(){ toggle(qk, b.dataset.f); });
      });
      el.board.querySelector("#chk").addEventListener("click", function(){ check(qk); });
      el.hint.innerHTML = n ? "Press <b>Check</b> when you are happy with your picks." : "Click a row to pick it. Click it again to take it back.";
    } else {
      el.hint.textContent = qk === "pa" ? "Press Next for the second question." : "Press Next to see the numbers behind your colors.";
    }
    if(focusSel){ var x = el.board.querySelector(focusSel); if(x) x.focus(); }
  }
  function toggle(qk, fid){
    var q = st[qk];
    if(q.done || q.out[fid] || !fOf(fid)) return;
    if(q.sel[fid]) delete q.sel[fid]; else q.sel[fid] = 1;
    save(st);
    renderQ(qk, '.rows button.opt[data-f="' + fid + '"]');
    header();
    say(fOf(fid).name + (q.sel[fid] ? " picked." : " not picked."));
  }
  function check(qk){
    var q = st[qk], a = answerSets(), right = a[qk];
    var picked = FUNCS.filter(function(f){ return q.sel[f.id]; });
    if(q.done || !picked.length) return;
    if(a.same){ q.done = "read"; }
    else {
      var wrong = picked.filter(function(f){ return !inSet(right, f); });
      if(!wrong.length) q.done = "right";
      else {
        q.lastOut = {};
        wrong.forEach(function(f){ q.out[f.id] = 1; q.lastOut[f.id] = 1; delete q.sel[f.id]; });
        q.kept = {}; Object.keys(q.sel).forEach(function(k){ q.kept[k] = 1; });
        q.tries++;
        if(q.tries >= 2) q.done = "shown";
      }
    }
    save(st);
    renderQ(qk);
    header();
    var fb = el.board.querySelector("#fb");
    if(fb && !reduce){ fb.classList.remove("in"); void fb.offsetWidth; fb.classList.add("in"); }
    if(fb) say(fb.textContent.replace(/^(Right|Not quite|Read|Here is the right answer|Here are the right answers)/, "$1. "));
    var ph = phone(), opt = ph ? { preventScroll:true } : undefined;
    if(q.done) el.next.focus(opt);
    else { var f = el.board.querySelector(".rows button.opt:not(:disabled)"); if(f) f.focus(opt); }
    if(fb && ph) fb.scrollIntoView({ block:"nearest", behavior: reduce ? "auto" : "smooth" });
  }

  /* ---------------- slide 4: the numbers, for the screenshot ---------------- */
  function renderFinal(){
    if(!st.built){ gate("Put in all twelve scores and press <b>Build</b> first.", "Go to your scores", 0); return; }
    if(!st.pb.done){ gate("Answer the two questions about your chart first.", "Go to the questions", st.pa.done ? 2 : 1); return; }
    var anim = reduce ? "" : " in";
    var h = '<div class="chart' + anim + '"><div class="ctitle">Cumberland Claims Services: current and target profile</div>'
      + '<div class="cr ch"><span>Function</span><span class="ctr">Current</span><span class="ctr">Target</span><span class="ctr">Gap</span><span>Status</span></div>';
    FUNCS.forEach(function(f){
      h += '<div class="cr"><span class="fn">' + esc(f.name) + "</span>"
        + '<span class="sq">' + st.cur[f.id] + "</span>"
        + '<span class="sq">' + st.tgt[f.id] + "</span>"
        + '<span class="gp">' + fmtGap(gap(f)) + "</span>" + cellHTML(f) + "</div>";
    });
    h += '<p class="capt">Scored 0 to 4 against the six functions of NIST CSF 2.0. Gap is the target minus the current score.</p></div>';
    var above = FUNCS.filter(function(f){ return gap(f) < 0; });
    var note = above.length
      ? '<div class="fnote"><b>' + esc(names(above)) + (above.length === 1 ? " has a current score higher than its target." : " have a current score higher than the target.") + "</b> Check that you did not swap the two numbers in your profile.</div>"
      : "";
    el.board.innerHTML = '<div class="fin">' + h + '<div class="notes"><div class="shot">' + SHOT_LINE + "</div>" + note + "</div></div>";
    el.hint.textContent = DONE_LINE;
  }

  /* ---------------- navigation ---------------- */
  function focusTop(){
    var ph = phone();
    try{ el.frame.focus(ph ? { preventScroll:true } : undefined); }catch(e){ el.frame.focus(); }
    if(ph) try{ window.scrollTo(0, 0); }catch(e){}
  }
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    if(d > 0 && (el.next.disabled || el.next.hidden)) return;
    i = n; render(); focusTop();
    say(el.prog.textContent + ". " + S[i].h1);
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  /* Start again asks first. Nothing is cleared until "Yes, clear them". */
  function askClear(on){
    var was = !el.confirm.hidden;
    el.confirm.hidden = !on;
    el.again.hidden = on || i !== S.length - 1;
    el.hint.hidden = on;
    if(on){ try{ el.confno.focus({preventScroll:true}); }catch(e){ el.confno.focus(); } say("Clear all my scores? Yes, clear them, or Keep them."); }
    else if(was && document.activeElement && el.confirm.contains(document.activeElement)) el.again.focus();
  }
  el.again.addEventListener("click", function(){ askClear(true); });
  el.confno.addEventListener("click", function(){ askClear(false); el.again.focus(); say("Your scores are kept."); });
  el.confyes.addEventListener("click", function(){
    st = fresh(); save(st); changedNote = false; i = 0; render(); focusTop();
    say("Started again. All twelve scores are empty.");
  });
  el.confirm.addEventListener("keydown", function(e){
    if(e.key === "Escape"){ e.preventDefault(); askClear(false); el.again.focus(); }
  });

  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "LABEL"){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* scale the fixed canvas down to fit, never up */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()) stage.style.transform = "";
    else {
      var sc = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
      stage.style.transform = "scale(" + sc + ")";
    }
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* the QA hook */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    fill:function(cur, tgt){
      FUNCS.forEach(function(f, k){
        if(cur && okScore(cur[k])) setScore(f.id, "cur", cur[k]);
        if(tgt && okScore(tgt[k])) setScore(f.id, "tgt", tgt[k]);
      });
      if(i === 0) render();
      return filled(st);
    },
    build:function(){ build(); return st.built; },
    pick:function(qk, list){ list.forEach(function(nm){ var f = FUNCS.filter(function(x){ return x.name === nm; })[0]; if(f) toggle(qk, f.id); }); return true; },
    check:function(qk){ check(qk); return st[qk].done; },
    reset:function(){ st = fresh(); save(st); changedNote = false; i = 0; render(); },
    state:function(){ return JSON.parse(JSON.stringify({ i:i, st:st, sets:st.built ? answerSets() : null })); }
  };
})();
</script>
</body>
</html>
