<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Your Heatmap</title>
<link rel="icon" href="data:,">
<!--
  vCISO P3 Step 3, Module 9, "Build your heatmap".
  Spec: 06-content/project-03/step-03/module-09-internal.md, "Build note".

  Owner decision 11 October 2026: rebuilt as three slides.
    1. Scores. The student enters the twelve scores from their profile
       (Current and Target for the six functions) and presses Build. This
       slide is unchanged from the 8 October build.
    2. Colors. The student picks one of four ready-made color sets. There is
       no right or wrong answer here, so there is no tick, cross or feedback.
       Nothing is pre-selected and Next stays off until a set is picked.
    3. Heatmap. A vertical table like Harlan Ridge's slide (owner, second
       pass, 11 October 2026): a header row, then one row per function in
       CSF order, a bold Function name and a Status block filled in the
       chosen set's color with the status in words inside it. No current, target or
       gap numbers appear anywhere on the chart. A legend sits under it, and
       "Download as PNG" draws the same chart on a canvas at 2x and saves it
       as cumberland-gap-heatmap.png. No external library is used.
  The two read-the-chart questions (furthest behind, closest to target) and
  the old final table with numbers are gone from this interactive; the
  questions moved out to the module. The owner's reason: the old chart shaded
  one column in navy only, and shades of one color do not read as hot and
  cold. The model is Harlan Ridge's heatmap slide
  (09-assets/final/vciso-p3-m11-harlan-heatmap-slide.png).

  Gap = target minus current. Levels: At target (gap 0), One step short
  (gap 1), Two steps short (gap 2), Three or more steps short (gap 3 or 4).
  A gap below 0 is labelled "Above target", drawn in the At target color, and
  a note asks the student to check they did not swap the two numbers.

  Palette. CLAUDE.md section 6 (the five navy palette values) applies to
  everything on every slide EXCEPT the heatmap color sets on slides 2 and 3.
  Those sixteen values are a deliberate exception approved by the owner on
  11 October 2026. Every set runs from light and calm at target to dark and
  strong for the biggest gap. Text on each block is #1C1B1B on the two light
  levels and #FDF8F8 on the two dark levels; every pairing measures at least
  4.5:1. Every color also carries its label in words, so color is never the
  only signal.

  Layout: every grid sits in normal flow, so nothing can be drawn over
  anything else. No absolute positioning on the board.

  Verify before shipping:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs --allow '#A9DDB8,#F5A93F,#C62828,#7A1010,#FFF1A8,#FCB255,#C2410C,#7F1D1D,#DCEBFA,#8FBCEB,#2D69B2,#0B2C66,#EFE5F8,#BCA3E0,#6D46AA,#3A1868' this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    --line:rgba(0,29,105,.26);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-reveal:460ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto;background:var(--bg)}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* header */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin-bottom:6px;min-height:28px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .dots{display:flex;gap:7px;align-items:center}
  .dots i{display:block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--on-highlight);background:transparent}
  .dots i.on{background:var(--on-highlight)}
  .dots i.here{background:var(--on-highlight);width:12px;height:12px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--on-highlight)}

  h1{font-size:25px;line-height:1.22;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  .lead{font-size:16px;line-height:1.48;color:var(--body);max-width:96ch}
  .lead b{color:var(--title);font-weight:600}
  .intro{display:flex;flex-direction:column;gap:14px;max-width:74ch}
  .intro p{font-size:17px;line-height:1.5}
  .intro p b{color:var(--title);font-weight:600}
  button.jump{font-family:inherit;font-size:15px;font-weight:600;color:var(--on-highlight);align-self:flex-start;
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:7px;padding:8px 15px;cursor:pointer}
  button.jump:hover{background:var(--tint2)}
  button.jump:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* the instruction strip on slide 1, with Build on the right, in flow */
  .how{flex:0 0 auto;display:flex;align-items:center;gap:12px;min-height:46px;background:var(--highlight);color:var(--title);
    border-left:4px solid var(--on-highlight);border-radius:6px;padding:5px 6px 5px 14px;font-size:16px;line-height:1.4}
  .how .ht{flex:1 1 auto;min-width:0}
  .how b{font-weight:600}
  .how .sc{flex:0 0 auto;font-weight:600;color:var(--on-highlight);font-size:15px;white-space:nowrap}
  .how button.nav{padding:8px 18px}

  /* slide 1: the twelve score pickers
     Every picker starts empty. Nothing is pre-selected. */
  .grid{flex:0 0 auto;display:flex;flex-direction:column;
    background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:1px 14px}
  .gr{display:grid;grid-template-columns:minmax(0,1fr) 230px 230px;column-gap:28px;align-items:center;
    min-height:45px;border-top:1px solid var(--tint2)}
  .gr:first-child{border-top:0}
  .gr.gh{min-height:30px}
  .gr.gh span{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--on-highlight);line-height:1.3}
  .fname{min-width:0;display:flex;flex-direction:column;padding:2px 0}
  .fname b{font-size:19px;font-weight:600;color:var(--title);line-height:1.2}
  .pc{min-width:0}
  .pcap{display:none;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--on-highlight);margin-bottom:4px}
  .seg{display:flex;gap:5px;border:0}
  .seg legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .seg input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  .seg label{flex:0 0 auto;width:42px;height:36px;border-radius:8px;border:1.5px solid var(--on-highlight);
    background:transparent;color:var(--on-highlight);font-size:17px;font-weight:600;
    display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;
    font-variant-numeric:tabular-nums;transition:background var(--t-fast) var(--ease-out),color var(--t-fast) var(--ease-out)}
  .seg label:hover{background:var(--tint2)}
  .seg input:checked + label{background:var(--on-highlight);color:var(--bg)}
  .seg input:focus-visible + label{outline:3px solid var(--on-highlight);outline-offset:2px}

  /* slide 2: choose your colors
     Native radios, so Tab and the arrow keys work. Nothing is pre-selected.
     A pick is shown in navy as "Your pick": there is no right or wrong. */
  .sets{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;border:0}
  .sets legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .sets input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  .card{display:grid;grid-template-columns:28px 128px minmax(0,1fr);column-gap:12px;align-items:center;
    padding:7px 10px;border:1.5px solid var(--on-highlight);border-radius:10px;background:var(--bg);cursor:pointer;
    user-select:none;-webkit-user-select:none;transition:background var(--t-fast) var(--ease-out)}
  @media (hover:hover){ .card:hover{background:var(--tint2)} }
  .card .rd{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--on-highlight);background:var(--bg);
    color:var(--bg);display:flex;align-items:center;justify-content:center}
  .card .rd svg.ic{width:16px;height:16px;stroke-width:2.6;visibility:hidden}
  .card .nm{min-width:0;display:flex;flex-direction:column;gap:1px}
  .card .nm b{font-size:17px;font-weight:700;color:var(--title);line-height:1.2}
  .card .nm em{font-style:normal;font-size:13px;font-weight:700;color:var(--on-highlight);visibility:hidden}
  .sets input:checked + .card{background:var(--highlight);box-shadow:inset 0 0 0 1.5px var(--on-highlight)}
  .sets input:checked + .card .rd{background:var(--on-highlight)}
  .sets input:checked + .card .rd svg.ic,
  .sets input:checked + .card .nm em{visibility:visible}
  .sets input:focus-visible + .card{outline:3px solid var(--on-highlight);outline-offset:2px}
  .sw{min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .sw span{min-width:0;min-height:42px;border-radius:7px;border:1px solid var(--line);padding:3px 6px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:12.5px;font-weight:600;line-height:1.15}

  /* slide 3: the heatmap
     One block per function, filled in the chosen color for its gap, with the
     status in words on the block. No numbers anywhere on the chart. */
  /* Owner decision 11 October 2026 (second pass): a vertical table like
     Harlan Ridge's slide, one row per function in CSF order, a Function
     column and a Status column. The chart sits on the left; the swap note
     and the download sit beside it on the right, in flow. */
  .mapwrap{flex:0 0 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;column-gap:20px;align-items:start}
  .side{min-width:0;display:flex;flex-direction:column;gap:12px}
  .chart{min-width:0;display:flex;flex-direction:column;gap:8px;
    background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 16px 11px}
  .ctitle{font-size:17px;font-weight:700;color:var(--title);line-height:1.3}
  .htab{width:100%;border-collapse:collapse;table-layout:fixed}
  .htab thead th{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--on-highlight);
    text-align:left;line-height:1.3;padding:0 0 5px;border-bottom:1.5px solid var(--on-highlight)}
  .htab thead th.cf{width:40%}
  .htab tbody th,.htab tbody td{padding:3px 0;height:39px;vertical-align:middle;border-bottom:1px solid var(--tint2)}
  .htab tbody th.fn{text-align:left;font-size:18px;font-weight:700;color:var(--title);line-height:1.2;padding-right:10px}
  .pill{display:flex;align-items:center;min-height:31px;border-radius:7px;border:1px solid var(--line);
    padding:3px 12px;font-size:15.5px;font-weight:600;line-height:1.2}
  .legend{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:5px 18px;font-size:14px;color:var(--body);padding-top:2px}
  .legend li{display:flex;align-items:center;gap:7px}
  .legend i{display:block;flex:0 0 auto;width:18px;height:18px;border-radius:4px;border:1px solid var(--line)}
  .chart.in .pill{animation:rin var(--t-reveal) var(--ease-over) both}
  .fnote{flex:0 0 auto;font-size:14.5px;line-height:1.42;color:var(--title);border:1.5px solid var(--on-highlight);border-radius:9px;padding:7px 12px}
  .fnote b{font-weight:600}
  .dl{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .dl p{min-width:0;font-size:15.5px;line-height:1.4;color:var(--title)}
  button.nav.ico{display:inline-flex;align-items:center;gap:8px}
  button.nav.ico svg.ic{width:18px;height:18px;stroke-width:2}

  /* the bar */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:52px;padding-top:9px}
  button.nav{font-family:inherit;font-size:15px;font-weight:600;padding:9px 20px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.36;color:var(--body)}
  #hint b{color:var(--title);font-weight:600}
  /* Start again asks first, in the bar, before anything is cleared. */
  #confirm{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--title)}
  #confirm b{font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* under 600px: a portrait restack, not a shrunken slide */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .intro p{font-size:16px}
    .board{flex:0 0 auto;gap:14px}
    .how{flex-wrap:wrap;font-size:16px;padding:10px 12px}
    .grid{padding:4px 12px}
    .gr{grid-template-columns:1fr 1fr;row-gap:8px;padding:10px 0}
    .gr .fname{grid-column:1/-1}
    .gr.gh{display:none}
    .gr:nth-child(2){border-top:0}
    .fname b{font-size:18px}
    .pcap{display:block}
    .seg{gap:4px}
    .seg label{width:auto;flex:1 1 0;min-width:0;height:40px;font-size:17px}
    .sets{gap:10px}
    .card{grid-template-columns:28px minmax(0,1fr);row-gap:10px;padding:10px 12px}
    .card .sw{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr))}
    .card .nm{flex-direction:row;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .sw span{font-size:14px;min-height:44px}
    .mapwrap{grid-template-columns:minmax(0,1fr);row-gap:14px}
    .side{gap:14px}
    .chart{padding:12px}
    .htab thead th.cf{width:38%}
    .htab tbody th,.htab tbody td{height:auto;padding:5px 0}
    .htab tbody th.fn{font-size:17px;padding-right:8px}
    .pill{min-height:36px;font-size:15.5px;padding:5px 10px}
    .legend{flex-direction:column;align-items:flex-start;font-size:15px}
    .fnote{font-size:16px;line-height:1.5}
    .dl{flex-direction:column;align-items:stretch}
    .dl p{font-size:16px}
    button.nav.ico{justify-content:center}
    button.jump{font-size:16px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{font-size:15px;flex:1 1 100%;margin-top:4px}
    #hint .kb{display:none}
    #confirm{flex:1 1 100%;flex-wrap:wrap;font-size:16px}
    #confq{flex:1 1 100%}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Put in your twelve scores">

    <div class="top">
      <span class="prog" id="prog"></span>
      <span class="dots" id="segs" aria-hidden="true"></span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Next</button>
      <button class="nav ghost" id="again" type="button" hidden>Start again</button>
      <div id="confirm" role="group" aria-labelledby="confq" hidden>
        <b id="confq">Clear all my scores and my colors?</b>
        <button class="nav" id="confyes" type="button">Yes, clear them</button>
        <button class="nav ghost" id="confno" type="button">Keep them</button>
      </div>
      <div id="hint"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 16px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:18px;color:#1C1B1B;margin:22px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:8px}
    .nsf strong{color:#1C1B1B}
  </style>
  <div class="nsf">
    <h2>Build your heatmap</h2>
    <p>This interactive needs JavaScript, which is switched off here. You can make the same heatmap by hand from your profile.</p>
    <h3>Work out each gap</h3>
    <p>For each of the six functions (Govern, Identify, Protect, Detect, Respond and Recover), take its <strong>Target</strong> score and subtract its <strong>Current</strong> score. That number is the gap.</p>
    <h3>Give each gap a label</h3>
    <ul>
      <li><strong>At target:</strong> a gap of 0.</li>
      <li><strong>Above target:</strong> a gap below 0. The current score is higher than the target. Check that you did not swap the two numbers. Color it the same as At target.</li>
      <li><strong>One step short:</strong> a gap of 1.</li>
      <li><strong>Two steps short:</strong> a gap of 2.</li>
      <li><strong>Three or more steps short:</strong> a gap of 3 or 4.</li>
    </ul>
    <h3>Color it in</h3>
    <p>Pick four colors that go from calm to strong, for example green, orange, red and dark red. Draw one box for each function and fill it with the color for its label: the calmest color for At target, the strongest for Three or more steps short. Write the label in words on each box, and leave the numbers off. Title it "Cumberland Claims Services: gap heatmap" and add a small key that shows each color with its label.</p>
    <p>Keep a picture of your heatmap. You will paste it into your Workbook next.</p>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  var IC = {
    check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    down:'<path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/><path d="M5 19.5h14"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }

  /* content
     Function names: verbatim from the Profile tab of CSF profile
     template.xlsx (SME drop 2026-09-25). The 0 to 4 scale: verbatim from its
     "The scale" tab. Status labels: module-09-internal.md, Build note. */
  var FUNCS = [
    { id:"gv", name:"Govern" },
    { id:"id", name:"Identify" },
    { id:"pr", name:"Protect" },
    { id:"de", name:"Detect" },
    { id:"rs", name:"Respond" },
    { id:"rc", name:"Recover" }
  ];
  var SCALE = [
    "Not done at all",
    "Ad hoc: happens informally, if at all; nothing written, nobody owns it",
    "Partly in place: done in some areas, inconsistently, or without records",
    "Defined and operating: done consistently, with evidence it operates",
    "Managed and measured: done, measured, and improved over time"
  ];
  var LEVELS = ["At target", "One step short", "Two steps short", "Three or more steps short"];

  /* The four color sets (owner-approved exception to the section 6 palette,
     11 October 2026). Each runs light and calm at level 0 to dark and strong
     at level 3. fg is the text color on that block, checked at 4.5:1 or more. */
  var DARK = "#1C1B1B", LIGHT = "#FDF8F8";
  var SETS = [
    { id:"traffic", name:"Traffic light", c:["#A9DDB8","#F5A93F","#C62828","#7A1010"] },
    { id:"heat",    name:"Heat",          c:["#FFF1A8","#FCB255","#C2410C","#7F1D1D"] },
    { id:"blues",   name:"Blues",         c:["#DCEBFA","#8FBCEB","#2D69B2","#0B2C66"] },
    { id:"purples", name:"Purples",       c:["#EFE5F8","#BCA3E0","#6D46AA","#3A1868"] }
  ];
  var FG = [DARK, DARK, LIGHT, LIGHT];
  var CHART_TITLE = "Cumberland Claims Services: gap heatmap";
  var COL_FN = "Function", COL_ST = "Status";
  var DL_LINE = "Download your heatmap and keep it. You will paste it into your Workbook next.";
  var DONE_LINE = "You are done here. Go back to the module for the next step.";
  var FILE_NAME = "cumberland-gap-heatmap.png";

  var S = [
    { kind:"scores", label:"Your scores",  h1:"Put in your twelve scores" },
    { kind:"colors", label:"Your colors",  h1:"Choose your colors" },
    { kind:"map",    label:"Your heatmap", h1:"Here is your gap heatmap" }
  ];

  /* data validation, at load, loud */
  (function validate(){
    var p = [];
    if(FUNCS.length !== 6) p.push("expected six functions");
    if(SCALE.length !== 5) p.push("expected a 0 to 4 scale");
    SETS.forEach(function(s){ if(!s.c || s.c.length !== 4) p.push(s.id + " needs four colors"); });
    if(p.length){
      document.getElementById("board").innerHTML = '<p class="lead"><b>This interactive has authoring errors:</b> ' + p.join("; ") + "</p>";
      throw new Error("data invalid: " + p.join("; "));
    }
  })();

  /* state
     A copy is kept in localStorage so the scores and the color pick are
     still there when the student comes back; if storage is blocked, the
     interactive works the same without it. The key is unchanged from the
     8 October build, so scores saved then still load. */
  var KEY = "vciso-p3-m9-build-your-heatmap-v2";
  function fresh(){
    var o = { cur:{}, tgt:{}, built:false, pal:null };
    FUNCS.forEach(function(f){ o.cur[f.id] = null; o.tgt[f.id] = null; });
    return o;
  }
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function okScore(v){ return v === 0 || v === 1 || v === 2 || v === 3 || v === 4; }
  function fOf(id){ for(var k=0;k<FUNCS.length;k++) if(FUNCS[k].id === id) return FUNCS[k]; return null; }
  function setOf(id){ for(var k=0;k<SETS.length;k++) if(SETS[k].id === id) return SETS[k]; return null; }
  function filled(o){
    var n = 0;
    FUNCS.forEach(function(f){ if(okScore(o.cur[f.id])) n++; if(okScore(o.tgt[f.id])) n++; });
    return n;
  }
  function load(){
    var o = fresh();
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return o;
      FUNCS.forEach(function(f){
        if(isPlain(raw.cur) && okScore(raw.cur[f.id])) o.cur[f.id] = raw.cur[f.id];
        if(isPlain(raw.tgt) && okScore(raw.tgt[f.id])) o.tgt[f.id] = raw.tgt[f.id];
      });
      if(filled(o) === 12 && raw.built === true) o.built = true;
      if(typeof raw.pal === "string" && setOf(raw.pal)) o.pal = raw.pal;
    }catch(e){}
    return o;
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();
  /* A returning student lands on the furthest slide still open to them. */
  function startSlide(o){
    if(!o.built) return 0;
    return o.pal ? 2 : 1;
  }

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    again:document.getElementById("again"), confirm:document.getElementById("confirm"),
    confyes:document.getElementById("confyes"), confno:document.getElementById("confno"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = startSlide(st);
  var changedNote = false;   /* a score changed after the chart was built */

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function say(m){ el.live.textContent = ""; setTimeout(function(){ el.live.textContent = m; }, 30); }
  function phone(){ return window.matchMedia("(max-width:599px)").matches; }

  /* the arithmetic
     Gap = target minus current (module-09-internal.md source trace).
     Level 0 holds both "at target" and "above target"; level 3 holds gaps
     of 3 and 4. */
  function gap(f){ return st.tgt[f.id] - st.cur[f.id]; }
  function level(g){ return g <= 0 ? 0 : (g >= 3 ? 3 : g); }
  function label(g){
    if(g < 0) return "Above target";
    return LEVELS[level(g)];
  }
  function names(list){
    var n = list.map(function(f){ return f.name; });
    if(n.length < 2) return n.join("");
    return n.slice(0, -1).join(", ") + " and " + n[n.length-1];
  }
  function aboveList(){ return FUNCS.filter(function(f){ return gap(f) < 0; }); }
  /* The legend's first label covers "Above target" too when it is used. */
  function legendLabels(){
    var l = LEVELS.slice();
    if(aboveList().length) l[0] = "At or above target";
    return l;
  }

  /* chrome */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k === i ? "here" : k < i ? "on" : "") + "'></i>";
    el.segs.innerHTML = h;
    el.back.disabled = (i === 0);
    var end = (i === S.length - 1);
    el.next.hidden = end;
    el.again.hidden = !end || !el.confirm.hidden;
    el.again.disabled = filled(st) === 0 && !st.pal;
    if(!end){
      if(s.kind === "scores") el.next.disabled = !st.built;
      else el.next.disabled = !(st.built && st.pal);
    }
  }

  function render(focusSel){
    var s = S[i];
    askClear(false);
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);
    el.hint.innerHTML = "";
    if(s.kind === "scores") renderScores(focusSel);
    else if(s.kind === "colors") renderColors(focusSel);
    else renderMap();
    header();
  }

  function gate(msg, btn, to){
    el.board.innerHTML = '<div class="intro"><p>' + msg + '</p><button class="jump" type="button" id="gate">' + esc(btn) + "</button></div>";
    el.board.querySelector("#gate").addEventListener("click", function(){ i = to; render(); focusTop(); });
  }

  /* slide 1: your twelve scores */
  var SCORES_HINT = 'Click a number to pick it.<span class="kb"> On a keyboard, use Tab and the arrow keys.</span>';
  function scoreHint(v){ el.hint.innerHTML = "<b>Score " + v + ".</b> " + esc(SCALE[v]); }
  function restHint(){
    if(changedNote && !st.built) el.hint.innerHTML = "<b>You changed a score.</b> Press <b>Build</b> to make the chart again.";
    else el.hint.innerHTML = SCORES_HINT;
  }
  function segHTML(f, which){
    var v = st[which][f.id];
    var nm = "s-" + which + "-" + f.id;
    var lab = f.name + ", " + (which === "cur" ? "current" : "target") + " score";
    var h = '<fieldset class="seg"><legend>' + esc(lab) + "</legend>";
    for(var n=0;n<=4;n++){
      var id = nm + "-" + n;
      h += '<input type="radio" name="' + nm + '" id="' + id + '" value="' + n + '" data-f="' + f.id + '" data-w="' + which + '"' + (v === n ? " checked" : "") + ">"
        + '<label for="' + id + '" data-v="' + n + '" aria-label="' + n + ". " + esc(SCALE[n]) + '">' + n + "</label>";
    }
    return h + "</fieldset>";
  }
  function renderScores(focusSel){
    var n = filled(st);
    var how = '<div class="how"><span class="ht">Copy the Current and Target scores from your profile. Then press <b>Build</b>.</span>'
      + '<span class="sc" id="cnt">' + n + " of 12 filled</span>"
      + '<button class="nav" id="build" type="button"' + (n === 12 ? "" : " disabled") + ">Build</button></div>";
    var rows = '<div class="gr gh"><span>Function</span><span>Current</span><span>Target</span></div>';
    FUNCS.forEach(function(f){
      rows += '<div class="gr"><div class="fname"><b>' + esc(f.name) + "</b></div>"
        + '<div class="pc"><span class="pcap" aria-hidden="true">Current</span>' + segHTML(f, "cur") + "</div>"
        + '<div class="pc"><span class="pcap" aria-hidden="true">Target</span>' + segHTML(f, "tgt") + "</div></div>";
    });
    el.board.innerHTML = how + '<div class="grid">' + rows + "</div>";
    Array.prototype.forEach.call(el.board.querySelectorAll(".seg input"), function(inp){
      inp.addEventListener("change", function(){ setScore(inp.dataset.f, inp.dataset.w, +inp.value); });
      inp.addEventListener("focus", function(){ scoreHint(+inp.value); });
      inp.addEventListener("blur", function(){ restHint(); });
    });
    Array.prototype.forEach.call(el.board.querySelectorAll(".seg label"), function(lb){
      lb.addEventListener("mouseenter", function(){ scoreHint(+lb.dataset.v); });
      lb.addEventListener("mouseleave", function(){ restHint(); });
    });
    el.board.querySelector("#build").addEventListener("click", build);
    restHint();
    if(focusSel){ var x = el.board.querySelector(focusSel); if(x) x.focus(); }
  }
  function setScore(fid, which, v){
    if(!okScore(v) || !(fid in st[which])) return;
    if(st[which][fid] === v) return;
    st[which][fid] = v;
    if(st.built){
      st.built = false;
      changedNote = true;
      restHint();
    }
    save(st);
    var n = filled(st);
    var cnt = el.board.querySelector("#cnt"), b = el.board.querySelector("#build");
    if(cnt) cnt.textContent = n + " of 12 filled";
    if(b) b.disabled = n !== 12;
    header();
    say(fOf(fid).name + ", " + (which === "cur" ? "current" : "target") + ": " + v + ". " + n + " of 12 filled.");
  }
  function build(){
    if(filled(st) !== 12) return;
    if(!st.built){
      st.built = true;
      changedNote = false;
      save(st);
    }
    i = 1; render(); focusTop();
    say("Scores saved. " + el.prog.textContent + ". " + S[1].h1);
  }

  /* slide 2: choose your colors
     There is no right answer, so a pick is never judged. */
  var COLORS_LEAD = "Pick the colors for your heatmap. Each set goes from calm for functions at their target to strong for the ones furthest behind.";
  function swatchHTML(set){
    return '<span class="sw" aria-hidden="true">' + set.c.map(function(c, k){
      return '<span style="background:' + c + ";color:" + FG[k] + '">' + esc(LEVELS[k]) + "</span>";
    }).join("") + "</span>";
  }
  function colorsHint(){
    el.hint.innerHTML = st.pal
      ? "Press <b>Next</b> to see your heatmap. You can change your pick at any time."
      : 'Click a set to pick it.<span class="kb"> On a keyboard, use Tab and the arrow keys.</span>';
  }
  function renderColors(focusSel){
    if(!st.built){ gate("Put in all twelve scores and press <b>Build</b> first. Your colors come next.", "Go to your scores", 0); return; }
    var h = '<p class="lead">' + esc(COLORS_LEAD) + "</p>"
      + '<fieldset class="sets"><legend>Color sets for your heatmap</legend>';
    SETS.forEach(function(set){
      var id = "pal-" + set.id;
      h += '<input type="radio" name="pal" id="' + id + '" value="' + set.id + '"' + (st.pal === set.id ? " checked" : "") + ">"
        + '<label class="card" for="' + id + '" aria-label="' + esc(set.name + ". " + LEVELS.join(", ") + ", from calm to strong.") + '">'
        + '<span class="rd" aria-hidden="true">' + icon("check") + "</span>"
        + '<span class="nm" aria-hidden="true"><b>' + esc(set.name) + "</b><em>Your pick</em></span>"
        + swatchHTML(set) + "</label>";
    });
    el.board.innerHTML = h + "</fieldset>";
    Array.prototype.forEach.call(el.board.querySelectorAll(".sets input"), function(inp){
      inp.addEventListener("change", function(){ pickSet(inp.value); });
    });
    colorsHint();
    if(focusSel){ var x = el.board.querySelector(focusSel); if(x) x.focus(); }
  }
  function pickSet(id){
    var set = setOf(id);
    if(!set || st.pal === id) return;
    st.pal = id;
    save(st);
    colorsHint();
    header();
    say(set.name + " picked. Press Next to see your heatmap.");
  }

  /* slide 3: the heatmap */
  function renderMap(){
    if(!st.built){ gate("Put in all twelve scores and press <b>Build</b> first.", "Go to your scores", 0); return; }
    var set = setOf(st.pal);
    if(!set){ gate("Pick the colors for your heatmap first.", "Go to the colors", 1); return; }
    var anim = reduce ? "" : " in";
    var rows = FUNCS.map(function(f){
      var lv = level(gap(f));
      return '<tr><th scope="row" class="fn">' + esc(f.name) + '</th>'
        + '<td><span class="pill" style="background:' + set.c[lv] + ";color:" + FG[lv] + '">' + esc(label(gap(f))) + "</span></td></tr>";
    }).join("");
    var leg = legendLabels().map(function(t, k){
      return '<li><i style="background:' + set.c[k] + '" aria-hidden="true"></i>' + esc(t) + "</li>";
    }).join("");
    var above = aboveList();
    var note = above.length
      ? '<div class="fnote"><b>' + esc(names(above)) + (above.length === 1 ? " has a current score higher than its target." : " have a current score higher than the target.") + "</b> Check that you did not swap the two numbers in your profile.</div>"
      : "";
    el.board.innerHTML = '<div class="mapwrap"><div class="chart' + anim + '" id="chart" role="group" aria-labelledby="ctitle">'
      + '<p class="ctitle" id="ctitle">' + esc(CHART_TITLE) + "</p>"
      + '<table class="htab" aria-labelledby="ctitle"><thead><tr><th scope="col" class="cf">' + esc(COL_FN) + '</th><th scope="col">' + esc(COL_ST) + "</th></tr></thead>"
      + "<tbody>" + rows + "</tbody></table>"
      + '<ul class="legend" aria-label="Key">' + leg + "</ul></div>"
      + '<div class="side">' + note
      + '<div class="dl"><button class="nav ico" id="dlbtn" type="button">' + icon("down") + "Download as PNG</button>"
      + "<p>" + esc(DL_LINE) + "</p></div></div></div>";
    el.board.querySelector("#dlbtn").addEventListener("click", download);
    el.hint.textContent = DONE_LINE;
  }

  /* The PNG: the same chart drawn on a canvas at 2x, no library. */
  var FONT = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  function rr(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
  /* Shrink a line until it fits its box, so no label is ever cut off. */
  function fitFont(ctx, text, weight, size, maxW){
    var s = size;
    do { ctx.font = weight + " " + s + "px " + FONT; if(ctx.measureText(text).width <= maxW) break; s -= 1; } while(s > 9);
    return s;
  }
  function drawPNG(){
    var set = setOf(st.pal);
    if(!set || !st.built) return null;
    /* The same table as the screen: a header row, then one row per
       function in CSF order, a Function column and a colored Status block. */
    var W = 800, PAD = 40, IW = W - PAD * 2;
    var headY = 116, headLine = 130, RH = 62;
    var stX = PAD + Math.round(IW * 0.4), stW = W - PAD - stX, BH = 42;
    var tableEnd = headLine + FUNCS.length * RH;
    var legTop = tableEnd + 26;
    var labels = legendLabels();

    /* Lay the legend out first, so the canvas is tall enough for it. */
    var meas = document.createElement("canvas").getContext("2d");
    meas.font = "500 17px " + FONT;
    var items = [], lx = PAD, ly = legTop, SW = 22;
    labels.forEach(function(t){
      var w = SW + 9 + meas.measureText(t).width;
      if(lx > PAD && lx + w > W - PAD){ lx = PAD; ly += 34; }
      items.push({ x:lx, y:ly, t:t });
      lx += w + 28;
    });
    var H = ly + SW + PAD;

    var SCALE2 = 2;
    var c = document.createElement("canvas");
    c.width = W * SCALE2; c.height = H * SCALE2;
    var ctx = c.getContext("2d");
    ctx.scale(SCALE2, SCALE2);
    ctx.fillStyle = "#FDF8F8";
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = "alphabetic";

    ctx.fillStyle = "#1C1B1B";
    fitFont(ctx, CHART_TITLE, "700", 30, W - PAD * 2);
    ctx.fillText(CHART_TITLE, PAD, 62);

    /* header row, uppercase like the screen, with a strong rule under it */
    ctx.fillStyle = "#001D69";
    ctx.font = "600 15px " + FONT;
    try{ ctx.letterSpacing = "1px"; }catch(e){}
    ctx.fillText(COL_FN.toUpperCase(), PAD, headY);
    ctx.fillText(COL_ST.toUpperCase(), stX, headY);
    try{ ctx.letterSpacing = "0px"; }catch(e){}
    ctx.fillRect(PAD, headLine - 1, IW, 2);

    FUNCS.forEach(function(f, k){
      var y = headLine + k * RH;
      var lv = level(gap(f));
      ctx.fillStyle = "#1C1B1B";
      fitFont(ctx, f.name, "700", 24, stX - PAD - 16);
      ctx.fillText(f.name, PAD, y + RH / 2 + 8);
      var by = y + (RH - BH) / 2;
      rr(ctx, stX, by, stW, BH, 8);
      ctx.fillStyle = set.c[lv]; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = "rgba(0,29,105,.26)"; ctx.stroke();
      ctx.fillStyle = FG[lv];
      var lab = label(gap(f));
      fitFont(ctx, lab, "600", 20, stW - 36);
      ctx.fillText(lab, stX + 18, by + BH / 2 + 7);
      /* thin divider under every row */
      ctx.fillStyle = "rgba(0,29,105,.13)";
      ctx.fillRect(PAD, y + RH - 1, IW, 1);
    });

    items.forEach(function(it, k){
      rr(ctx, it.x, it.y, SW, SW, 5);
      ctx.fillStyle = set.c[k]; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = "rgba(0,29,105,.26)"; ctx.stroke();
      ctx.fillStyle = "#484646";
      ctx.font = "500 17px " + FONT;
      ctx.fillText(it.t, it.x + SW + 9, it.y + 17);
    });
    return c;
  }
  function dlFailed(){
    el.hint.innerHTML = "<b>The download did not start.</b> Take a screenshot of the chart instead.";
    say("The download did not start. Take a screenshot of the chart instead.");
  }
  function saveURL(url, after){
    var a = document.createElement("a");
    a.href = url; a.download = FILE_NAME; a.rel = "noopener";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ try{ a.parentNode.removeChild(a); }catch(e){} if(after) after(); }, 1500);
  }
  function download(){
    var c;
    try{ c = drawPNG(); }catch(e){ c = null; }
    if(!c){ dlFailed(); return; }
    var done = function(){
      el.hint.innerHTML = "<b>Downloaded.</b> Look for " + esc(FILE_NAME) + " in your Downloads folder.";
      say("Your heatmap is downloading as " + FILE_NAME + ".");
    };
    try{
      if(c.toBlob && window.URL && URL.createObjectURL){
        c.toBlob(function(b){
          if(!b){ try{ saveURL(c.toDataURL("image/png")); done(); }catch(e){ dlFailed(); } return; }
          var u = URL.createObjectURL(b);
          saveURL(u, function(){ URL.revokeObjectURL(u); });
          done();
        }, "image/png");
      } else { saveURL(c.toDataURL("image/png")); done(); }
    }catch(e){ dlFailed(); }
  }

  /* navigation */
  function focusTop(){
    var ph = phone();
    try{ el.frame.focus(ph ? { preventScroll:true } : undefined); }catch(e){ el.frame.focus(); }
    if(ph) try{ window.scrollTo(0, 0); }catch(e){}
  }
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    if(d > 0 && (el.next.disabled || el.next.hidden)) return;
    i = n; render(); focusTop();
    say(el.prog.textContent + ". " + S[i].h1);
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  /* Start again asks first. Nothing is cleared until "Yes, clear them". */
  function askClear(on){
    var was = !el.confirm.hidden;
    el.confirm.hidden = !on;
    el.again.hidden = on || i !== S.length - 1;
    el.hint.hidden = on;
    if(on){ try{ el.confno.focus({preventScroll:true}); }catch(e){ el.confno.focus(); } say("Clear all my scores and my colors? Yes, clear them, or Keep them."); }
    else if(was && document.activeElement && el.confirm.contains(document.activeElement)) el.again.focus();
  }
  el.again.addEventListener("click", function(){ askClear(true); });
  el.confno.addEventListener("click", function(){ askClear(false); el.again.focus(); say("Your scores and colors are kept."); });
  el.confyes.addEventListener("click", function(){
    st = fresh(); save(st); changedNote = false; i = 0; render(); focusTop();
    say("Started again. All twelve scores are empty.");
  });
  el.confirm.addEventListener("keydown", function(e){
    if(e.key === "Escape"){ e.preventDefault(); askClear(false); el.again.focus(); }
  });

  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "LABEL" || (e.target.closest && e.target.closest("label"))){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* scale the fixed canvas down to fit, never up */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()) stage.style.transform = "";
    else {
      var sc = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
      stage.style.transform = "scale(" + sc + ")";
    }
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* the QA hook */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    fill:function(cur, tgt){
      FUNCS.forEach(function(f, k){
        if(cur && okScore(cur[k])) setScore(f.id, "cur", cur[k]);
        if(tgt && okScore(tgt[k])) setScore(f.id, "tgt", tgt[k]);
      });
      if(i === 0) render();
      return filled(st);
    },
    build:function(){ build(); return st.built; },
    pick:function(id){ pickSet(id); return st.pal; },
    sets:SETS.map(function(s){ return s.id; }),
    png:function(){ var c = drawPNG(); return c ? c.toDataURL("image/png") : null; },
    reset:function(){ st = fresh(); save(st); changedNote = false; i = 0; render(); },
    state:function(){ return JSON.parse(JSON.stringify({ i:i, st:st })); }
  };
})();
</script>
</body>
</html>
