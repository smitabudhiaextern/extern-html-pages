:root{

  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;

<p class="p">You'll read the same page as in the Tesseract reading, Page 4, the Certificate of Processing. Download it to your computer, because STEP 3 asks you to upload it.</p><p class="p">You won't need any new files, and we've already got a Colab notebook ready to go:</p><div class="links"><a class="btn btn-secondary" href="https://drive.google.com/file/d/1UvYmChia7K90-xjCsHsGqhixmDrPfhHw/view" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Sample Document: Pharmaceutical SDF, Page 4 (Certificate of Processing)</span><span class="sr-only"> (opens in a new tab)</span></a><a class="btn btn-secondary" href="https://colab.research.google.com/drive/1lKyUnyJnMEUY34vnCMHMdh7Z8gzN-qzP" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Layout-Aware OCR: PaddleOCR and EasyOCR (Colab notebook)</span><span class="sr-only"> (opens in a new tab)</span></a></div><ol class="list"><li>Open the notebook, then click <b>File → Save a copy in Drive</b>. Your copy opens in a new tab. Work in that copy.</li><li>Download the Page 4 file, <code>pharmaceutical-sdf-page4-certificate-processing.pdf</code>.</li><li>Run the notebook's cells in order, from the top. Each one starts with a comment such as <code class="nw"># STEP 1</code>, and the next slides take you through them one by one.</li><li>Two slides ask you to add a cell of your own. Each one has a <b>Copy</b> button.</li></ol><p class="p">Let's start with PaddleOCR first, then move on to EasyOCR further down.</p>

<template id="t2">
<p class="p"><b>Step-by-Step: PaddleOCR in Action</b></p><p class="p"><b>Install the libraries</b><br>Let's start with PaddleOCR. It's more powerful, slightly more setup, but <i>really good</i> at layout-heavy docs like pharmaceutical certificates.</p><p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 1</code>:</p><figure class="run small"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code># ============================================
# STEP 1: Install PaddleOCR and All Dependencies
# ============================================
#
# WHAT WE'RE DOING:
# Installing PaddleOCR, PaddlePaddle (its deep learning framework),
# and helper libraries for PDF processing.
#
# WHY THIS MATTERS:
# PaddleOCR needs several tools to work:
# - PaddlePaddle: The engine that powers PaddleOCR (like a car engine)

<template id="t14">
<p class="p"><b>Draw bounding boxes manually using OpenCV</b><br>Now you want to <b>visually show</b> where PaddleOCR found that text by drawing boxes on the image. So, how do you do that? You drew boxes with OpenCV in the Tesseract reading. This time, each box is a polygon.</p><p class="p">What are all these steps doing? Let's break it down:</p><div class="tbl"><table><thead><tr><th scope="col">Code line</th><th scope="col">What it does</th><th scope="col">Explanation</th></tr></thead><tbody><tr><td class="cl"><code>img = cv2.imread(image_path)</code></td><td>Loads your image using OpenCV</td><td>Think of this like "opening" your PDF page (converted to an image) so you can draw on it.</td></tr><tr><td class="cl"><code>for line in result[0]:</code></td><td>Loops through OCR results</td><td>Goes through every word/phrase PaddleOCR found on the page.</td></tr><tr><td class="cl"><code>box = line[0]</code>, <code>text = line[1][0]</code>, <code>score = line[1][1]</code></td><td>Splits result into parts</td><td><code>box</code> = where the text is (a polygon); <code>text</code> = what it says; <code>score</code> = how confident it is.</td></tr><tr><td class="cl"><code>box = [(int(x), int(y)) for x, y in box]</code></td><td>Cleans up box coordinates</td><td>Converts the box's corner points from decimals to whole numbers (needed for drawing).</td></tr><tr><td class="cl"><code>cv2.polylines(img, [np.array(box)], isClosed=True, color=(255, 0, 0), thickness=2)</code></td><td>Draws a box around text</td><td>Connects the corners to make a full shape around the text. Red box (the picture was turned to RGB first, so (255, 0, 0) is red).</td></tr><tr><td class="cl"><code>cv2.putText(img, text[:20], box[0], cv2.FONT_HERSHEY_SIMPLEX, 0.4, (0, 0, 255), 1)</code></td><td>Writes the text label on the image</td><td>Adds the first 20 characters of the text PaddleOCR saw near the top-left corner of the box, in blue font.</td></tr></tbody></table></div>
</template>

<template id="t15">
<p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 7</code>:</p><figure class="run small"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code># ============================================
# STEP 7: Draw Polygon Bounding Boxes
# ============================================
#
# WHAT WE'RE DOING:
# Drawing boxes around every text region PaddleOCR found.
#
# WHY THIS MATTERS:
# Unlike Tesseract's rectangles, PaddleOCR gives us polygons!
# Polygons can follow tilted or skewed text more precisely.
#
# WHAT YOU'LL SEE:
# Your document with red polygon boxes around all detected text.
# ============================================

# Load the original image with OpenCV
img = cv2.imread(image_path)
img = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)  # Convert to RGB for display

# Draw polygons for each detected text region
for line in result[0]:
    box = line[0]  # Get the polygon coordinates
    text = line[1][0]  # Get the text
    score = line[1][1]  # Get confidence

    # Only draw for high-confidence detections
    if score &gt; 0.5:
        # Convert box coordinates to integers
        box = [(int(x), int(y)) for x, y in box]

        # Draw the polygon (4-sided shape) in red
        cv2.polylines(img, [np.array(box)], isClosed=True,
                      color=(255, 0, 0), thickness=2)

        # Add the text label near the first corner in blue
        cv2.putText(img, text[:20], box[0],
                    cv2.FONT_HERSHEY_SIMPLEX, 0.4, (0, 0, 255), 1)

# Display the result
plt.figure(figsize=(15, 10))
plt.imshow(img)
plt.title('PaddleOCR Results - Polygon Bounding Boxes')
plt.axis('off')
plt.show()

# TIP: Notice how polygons can capture tilted text better than rectangles!</code></pre></figure>
</template>

<template id="t29">
<ul class="list"><li><b>Tesseract</b> gives every word its own box. Great for clean docs, but it doesn't keep the words of a line or a phrase together.</li><li><b>Layout-aware OCR</b> tools like PaddleOCR and EasyOCR keep the words that belong together in one box, so they know <i>where</i> text lives and <i>how</i> it's grouped into lines.</li><li><b>PaddleOCR</b> is powerful for complex pages; <b>EasyOCR</b> is fast and works well for forms.</li></ul><div class="recap2"><div><p class="rh">PaddleOCR</p><ol class="list"><li><b>Installing and Setting Up PaddleOCR</b><ul><li>Installed PaddleOCR along with helper libraries like <code>pdf2image</code> and <code>poppler-utils</code>.</li><li>Converted the pharmaceutical SDF into a clean image that OCR can read.</li></ul></li><li><b>Running OCR and Visualizing Output</b><ul><li>Used PaddleOCR to detect text and its location on the page.</li><li>Drew boxes and labels around the detected text using OpenCV.</li></ul></li><li><b>Why It's Powerful</b><ul><li>Unlike basic OCR, PaddleOCR finds each line of text and a four-cornered box around it, even on dense pages with multiple columns.</li></ul></li></ol></div><div><p class="rh">EasyOCR</p><ol class="list"><li><b>Why Use EasyOCR</b><ul><li>It's lightweight, easy to install, and perfect for scanned forms or small batches.</li><li>Doesn't require a deep setup like PaddleOCR, great for fast results.</li></ul></li><li><b>How It Works</b><ul><li>Converts a PDF page into an image, then reads the text using EasyOCR.</li><li>Draws boxes and confidence scores so you can visually verify what it captured.</li></ul></li><li><b>When It Shines</b><ul><li>Works well on structured forms and documents with clean layouts.</li><li>Faster setup, but less layout-aware than PaddleOCR.</li></ul></li></ol></div></div>

    {"group": "Print", "label": "PRINT THE TEXT &middot; ADD ANOTHER CELL", "title": "Print All of <span class=\"hl\">PaddleOCR's Text</span>, in Another Cell", "plain": "Print All of PaddleOCR's Text, in Another Cell", "tpl": "t25", "where": "Print the Text"},

    {"group": "Step 14", "label": "STEP 14 &middot; RUN IT", "title": "Check Which <span class=\"hl\">Key Terms</span> Each Engine Found", "plain": "Step 14. Check Which Key Terms Each Engine Found", "tpl": "t27"},
    {"group": "Step 14", "label": "STEP 13 AND STEP 14 &middot; SEE IT", "title": "See the Two Engines <span class=\"hl\">Side by Side</span>", "plain": "Steps 13 and 14. See the Two Engines Side by Side", "tpl": "t28", "where": "Steps 13 and 14"},
    {"group": "End", "label": "QUICK RECAP", "title": "Quick Recap: Two Engines That Read <span class=\"hl\">Lines</span>", "plain": "Quick Recap: Two Engines That Read Lines", "tpl": "t29", "where": "Quick Recap", "cls": "recap-slide"}
  ];
  var STAGE = { wide: [760, 1035], narrow: [420, 1228] };
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of this reading.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var sz = narrow ? STAGE.narrow : STAGE.wide;
    app.style.width = sz[0] + "px"; app.style.height = sz[1] + "px";
    var k = Math.min(window.innerWidth / sz[0], window.innerHeight / sz[1]);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  var GROUP_LABEL = { "Print": "Print" };
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    var isStep = g.name.indexOf("Step ") === 0;
    b.type = "button"; b.className = "pg" + (isStep ? "" : " pg-fit");
    var shown = GROUP_LABEL[g.name] || g.name;
    b.setAttribute("aria-label", (g.name === "Print" ? "Print the Text" : shown) + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    var word = isStep ? '<span class="pg-word">Step </span>' + g.name.replace("Step ", "") : shown;
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + word + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span"), orig = label.textContent;
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = orig; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner' + (s.cls ? " " + s.cls : "") + '"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + document.getElementById(s.tpl).innerHTML + '</div>';
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(CELLS[b.getAttribute("data-copy")], b, pre); });
    });
    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.where || s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
    space();
    Array.prototype.forEach.call(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a slide. Spare height widens the gaps
     between blocks, up to 2x. */
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = "";
    var cs = getComputedStyle(card);
    var avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var base = parseFloat(getComputedStyle(inner).rowGap) || 14;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (base + Math.min(base, spare / gaps)) + "px";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    space();
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #slide=N opens slide N directly */
  var hm = location.hash.match(/slide=(\d+)/);
  if (hm) i = Math.min(SLIDES.length - 1, Math.max(0, +hm[1] - 1));
  window.addEventListener("resize", function () { scaleStage(); space(); });
  scaleStage();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
