<meta charset="utf-8">
<title>Focus-Area Impact Snapshot</title>
<style>
  /* ===================== BASE / RESET ===================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #FDF8F8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;               /* never scroll in any state */
  }
  body { display: flex; align-items: flex-start; justify-content: center; }

  /* Scale-to-fit stage. #wrapper is a FIXED px canvas, scaled by JS. */
  #stage { width: 100%; height: 100%; overflow: hidden; }
  #wrapper {
    width: 1000px;
    height: 1180px;
    transform-origin: top center;
    background: #FDF8F8;
    position: relative;
  }

  /* ===================== CARD ===================== */
  .card {
    width: 1000px;
    height: 1180px;
    background: #FFFFFF;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- Top band (navy) ---- */
  .band {
    background: #001D69;
    padding: 56px 72px 52px;
    color: #FFFFFF;
  }
  .kicker {
    color: #DCE1FF;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3.5px;
    text-transform: uppercase;
  }
  .title {
    margin-top: 18px;
    color: #FFFFFF;
    font-size: 46px;
    line-height: 1.12;
    font-weight: 700;
    letter-spacing: -0.5px;
    max-width: 720px;
  }

  /* ---- Pill toggle (only shown when >1 entry) ---- */
  .pills {
    display: flex;
    gap: 10px;
    padding: 22px 72px 0;
    flex-wrap: wrap;
  }
  .pill {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: #001D69;
    background: #FFFFFF;
    border: 1.5px solid #DCE1FF;
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .pill:hover { border-color: #001D69; }
  .pill.active {
    background: #001D69;
    border-color: #001D69;
    color: #FFFFFF;
  }

  /* ---- Hero zone ---- */
  .hero {
    padding: 44px 72px 8px;
  }
  .hero-number {
    color: #001D69;
    font-size: 148px;
    line-height: 0.94;
    font-weight: 700;
    letter-spacing: -4px;
  }
  .hero-label {
    margin-top: 18px;
    color: #484646;
    font-size: 25px;
    line-height: 1.35;
    font-weight: 400;
    max-width: 780px;
  }

  /* ---- Chart strip ---- */
  .chart-strip {
    padding: 28px 72px 8px;
  }
  .chart-strip svg { display: block; width: 856px; height: 300px; }

  /* ---- Insight line ---- */
  .insight {
    margin: 26px 72px 0;
    display: flex;
    gap: 22px;
    align-items: stretch;
  }
  .insight-accent {
    flex: 0 0 6px;
    background: #001D69;
    border-radius: 3px;
  }
  .insight-text {
    color: #1C1B1B;
    font-size: 24px;
    line-height: 1.5;
    font-weight: 500;
    max-width: 760px;
  }

  /* ---- Footer ---- */
  .footer {
    margin-top: auto;
    padding: 0 72px 48px;
  }
  .footer-rule {
    height: 2px;
    background: #DCE1FF;
    margin-bottom: 22px;
  }
  .source {
    color: #8A8693;
    font-size: 15px;
    line-height: 1.5;
    font-weight: 400;
  }
  .credit {
    margin-top: 8px;
    color: #001D69;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
</style>

<div id="stage">
  <div id="wrapper">
    <div class="card">
      <div class="band">
        <div class="kicker">Focus-Area Research</div>
        <div class="title" id="elTitle">Focus area title</div>
      </div>

      <div class="pills" id="elPills"></div>

      <div class="hero">
        <div class="hero-number" id="elNumber">000</div>
        <div class="hero-label" id="elLabel">hero label</div>
      </div>

      <div class="chart-strip">
        <svg id="elChart" viewBox="0 0 856 300" preserveAspectRatio="xMidYMid meet"></svg>
      </div>

      <div class="insight">
        <div class="insight-accent"></div>
        <div class="insight-text" id="elInsight">insight sentence</div>
      </div>

      <div class="footer">
        <div class="footer-rule"></div>
        <div class="source" id="elSource">source line</div>
        <div class="credit" id="elCredit">student credit</div>
      </div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   STUDENT: EDIT THIS DATA OBJECT ONLY.
   ---------------------------------------------------------------------
   Everything you need to change lives in ENTRIES below. You may keep
   ONE entry, or add up to THREE (small toggle pills appear automatically
   when there is more than one). Each entry is one "standout" story:
   its hero number, its chart, its insight sentence, and its source.

   Shared header fields (kicker text stays fixed by brand):
   ===================================================================== */

var CREDIT = "Priya Rao  ·  EIC II Externship";   // your name + program

/* Each ENTRY = one standout number you want to feature.
   FIELDS:
     title     : the focus-area name (shows in the navy top band)
     number    : the big hero number, exactly as you want it read (e.g. "580 TWh")
     label     : one line under the number saying what the number is
     insight   : the "why it matters to oil and gas" sentence
     source    : where the numbers came from (citation)
     chartMode : "trend"  -> a 3-bar year-over-year chart (use bars below)
                 "split"  -> a 2-part share bar (e.g. 60% vs 40%; use split below)

   For chartMode "trend", fill "bars" (2 or 3 of them):
     label   : the year or category under the bar
     value   : the number the bar height represents (plain number, no units)
     display : the text drawn above the bar (add units here, e.g. "580 TWh")
     peak    : true for the ONE punchline bar (drawn navy); others lavender

   For chartMode "split", fill "split":
     value   : the featured share, 0 to 100 (drawn navy)
     label   : label for the featured share (navy segment)
     restLabel : label for the remaining share (lavender segment)
*/
var ENTRIES = [
  {
    title: "AI Data-Center Energy Demand",
    number: "580 TWh",
    label: "projected US data-center electricity by 2028",
    insight: "About 60% of that new demand is expected to be met by natural gas, a real pull on upstream production.",
    source: "LBNL / U.S. DOE; Goldman Sachs, 2024",
    chartMode: "trend",
    bars: [
      { label: "2014", value: 58,  display: "58 TWh",       peak: false },
      { label: "2023", value: 176, display: "176 TWh",      peak: false },
      { label: "2028", value: 580, display: "up to 580 TWh", peak: true  }
    ]
    // split: { value: 60, label: "Met by natural gas", restLabel: "Other sources" }
  }
  /* ,
  {
    title: "Second focus area",
    number: "60%",
    label: "share of new demand met by natural gas",
    insight: "Your one-line reason this matters to upstream oil and gas production.",
    source: "Your source here, Year",
    chartMode: "split",
    split: { value: 60, label: "Met by natural gas", restLabel: "Other sources" }
  }
  */
];

/* =====================================================================
   RENDER ENGINE. No need to edit below this line.
   ===================================================================== */
var C = {
  navy: "#001D69", lavender: "#DCE1FF", ink: "#1C1B1B",
  body: "#484646", line: "#ECE6EE", muted: "#8A8693", white: "#FFFFFF"
};

function el(id){ return document.getElementById(id); }

function svgEl(name, attrs){
  var n = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function drawTrend(svg, bars){
  var W = 856, H = 300;
  var padL = 8, padR = 8, padTop = 44, baseY = H - 42;
  var plotW = W - padL - padR;
  var n = bars.length;
  var gap = 46;
  var barW = (plotW - gap * (n - 1)) / n;
  var maxV = 0;
  bars.forEach(function(b){ if (b.value > maxV) maxV = b.value; });
  var maxH = baseY - padTop;

  // baseline
  svg.appendChild(svgEl("line", {
    x1: padL, y1: baseY + 0.5, x2: W - padR, y2: baseY + 0.5,
    stroke: C.line, "stroke-width": 2
  }));

  bars.forEach(function(b, i){
    var x = padL + i * (barW + gap);
    var h = maxV > 0 ? (b.value / maxV) * maxH : 0;
    if (h < 3) h = 3;
    var y = baseY - h;
    var fill = b.peak ? C.navy : C.lavender;

    // bar with rounded top
    svg.appendChild(svgEl("rect", {
      x: x, y: y, width: barW, height: h, rx: 8, ry: 8, fill: fill
    }));
    // square off the bottom corners
    svg.appendChild(svgEl("rect", {
      x: x, y: y + h - 12, width: barW, height: 12, fill: fill
    }));

    // value label above bar
    var vt = svgEl("text", {
      x: x + barW / 2, y: y - 14,
      "text-anchor": "middle",
      "font-family": "inherit",
      "font-size": b.peak ? 27 : 22,
      "font-weight": b.peak ? 700 : 600,
      fill: b.peak ? C.navy : C.body
    });
    vt.textContent = b.display;
    svg.appendChild(vt);

    // year label below baseline
    var lt = svgEl("text", {
      x: x + barW / 2, y: baseY + 30,
      "text-anchor": "middle",
      "font-family": "inherit",
      "font-size": 20,
      "font-weight": b.peak ? 700 : 500,
      fill: b.peak ? C.ink : C.muted
    });
    lt.textContent = b.label;
    svg.appendChild(lt);
  });
}

function drawSplit(svg, split){
  var W = 856, H = 300;
  var x = 8, w = W - 16;
  var barY = 116, barH = 88;
  var v = Math.max(0, Math.min(100, split.value));
  var navyW = w * (v / 100);

  // full lavender track
  svg.appendChild(svgEl("rect", {
    x: x, y: barY, width: w, height: barH, rx: 12, ry: 12, fill: C.lavender
  }));
  // navy featured segment (clip rounded left via full-round rect then square right)
  svg.appendChild(svgEl("rect", {
    x: x, y: barY, width: navyW, height: barH, rx: 12, ry: 12, fill: C.navy
  }));
  if (navyW > 12) {
    svg.appendChild(svgEl("rect", {
      x: x + navyW - 12, y: barY, width: 12, height: barH, fill: C.navy
    }));
  }

  // navy percent label inside
  var pt = svgEl("text", {
    x: x + 24, y: barY + barH / 2 + 12,
    "text-anchor": "start",
    "font-family": "inherit", "font-size": 40, "font-weight": 700, fill: C.white
  });
  pt.textContent = v + "%";
  svg.appendChild(pt);

  // rest percent label inside lavender
  if (100 - v > 8) {
    var rt = svgEl("text", {
      x: x + w - 24, y: barY + barH / 2 + 10,
      "text-anchor": "end",
      "font-family": "inherit", "font-size": 30, "font-weight": 700, fill: C.navy
    });
    rt.textContent = (100 - v) + "%";
    svg.appendChild(rt);
  }

  // legends below
  function legend(cx, color, txt){
    svg.appendChild(svgEl("rect", { x: cx, y: barY + barH + 26, width: 20, height: 20, rx: 5, ry: 5, fill: color }));
    var t = svgEl("text", {
      x: cx + 30, y: barY + barH + 42,
      "font-family": "inherit", "font-size": 19, "font-weight": 500, fill: C.body
    });
    t.textContent = txt;
    svg.appendChild(t);
  }
  legend(x, C.navy, split.label);
  legend(x + w / 2, C.lavender, split.restLabel);
}

function renderEntry(entry){
  el("elTitle").textContent = entry.title;
  el("elNumber").textContent = entry.number;
  el("elLabel").textContent = entry.label;
  el("elInsight").textContent = entry.insight;
  el("elSource").textContent = entry.source;

  var svg = el("elChart");
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  if (entry.chartMode === "split" && entry.split) {
    drawSplit(svg, entry.split);
  } else {
    drawTrend(svg, entry.bars || []);
  }
}

function buildPills(){
  var box = el("elPills");
  box.innerHTML = "";
  if (ENTRIES.length <= 1) { box.style.display = "none"; return; }
  ENTRIES.forEach(function(entry, i){
    var b = document.createElement("button");
    b.className = "pill" + (i === 0 ? " active" : "");
    b.textContent = entry.title;
    b.addEventListener("click", function(){
      var all = box.querySelectorAll(".pill");
      for (var j = 0; j < all.length; j++) all[j].classList.remove("active");
      b.classList.add("active");
      renderEntry(entry);
    });
    box.appendChild(b);
  });
}

el("elCredit").textContent = CREDIT;
buildPills();
renderEntry(ENTRIES[0]);

/* ===================== SCALE TO FIT ===================== */
(function(){
  var W = 1000, H = 1180;
  var wrap = document.getElementById("wrapper");
  function fit(){
    var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
    wrap.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();
})();
</script>
