<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check One Finding by Hand</title>
<!--
  vCISO P2 Step 4, Module 14: Decide What Cumberland Should Fix First. Step 4,
  "Check Each Finding's Score and the Exploited List With Claude"
  (06-content/project-02/step-04/module-14-task-make-the-severity-defensible.md).

  A scene by scene animation with no questions. It shows, by hand, how the two
  facts Claude works out for every finding (the Score and On the Exploited List
  columns of its chat table) are worked out for one finding. They sit in a small
  drawing of Claude's table (column headings Finding, Score and On the
  Exploited List, one row per finding), drawn like a chat table and labelled
  "Claude's table", not on the Working List: the student's Working List has
  only Finding, Rank and Why It Sits Here, and in Step 5 the student writes
  both facts in words in Why It Sits Here.
    Score: the highest CVSS number among the finding's rows.
    On the Exploited List: yes and the code if any one of its CVE codes is on
    CISA's Known Exploited Vulnerabilities catalog, no if none is, no code if
    the finding has no CVE.

  Data: the company "Example" and every machine name are made up. CVE codes with
  the year 2099 are made up so they can never match a real flaw. CVE-2014-0160
  (Heartbleed) is real and public; its CVSS 3.x base score is 7.5 and it is on the
  KEV catalog. The KEV entry text is copied from the module's screenshot of the
  real CISA page (vciso-p2-m14-kev-search.png).

  Same chrome, tint ramp, bar, Replay and scale-to-fit as
  vciso-p2-m6-what-is-a-lookup.html. Sheet styling follows
  vciso-p2-m13-find-the-repeats.html. Green is used only to mark "on the list",
  always with a tick and words. "Not on the list" is neutral, never red.
  Our notes on a search ("Our note") sit outside the drawn CISA page, because
  the real page shows nothing like them.

  Every scene animates on entry and has Replay. Under reduced motion every
  scene shows its end state at once.

  Verify before shipping:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs --allow '#146C2E,#E6F4EA' this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    /* "on the list" only, always with a tick and words */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;

    --line:rgba(0,29,105,.26);
    --grid:rgba(0,29,105,.15);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp (09-assets/deck-palette.json), in slide order. Tint carries no meaning. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t3{background:#F2E3D2}
  body.t4{background:#DEEBDA}
  body.t5{background:#F0E4EF}
  body.t6{background:#D0EEF1}
  body.t7{background:#EEDAD6}

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  .lead{flex:0 0 auto;font-size:16px;line-height:1.45;color:var(--body);max-width:96ch}
  .lead b{color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .mono{font-family:var(--mono)}
  .nw{white-space:nowrap}

  /* ---- the reveal primitive: layout never moves, only opacity and transform,
         so reduced motion (every step applied at once) shows the end state. ---- */
  .fx{opacity:0;transform:translateY(8px);transition:opacity 480ms var(--ease-out),transform 480ms var(--ease-over)}
  .fx.on{opacity:1;transform:none}

  .statement{background:var(--highlight);border-left:5px solid var(--on-highlight);border-radius:0 12px 12px 0;
    padding:12px 18px;font-size:18px;line-height:1.4;font-weight:600;color:var(--title)}
  .cap{flex:0 0 auto;font-size:15px;line-height:1.4;color:var(--title);display:flex;align-items:center;gap:10px}
  .cap svg.ic{width:22px;height:22px;color:var(--on-highlight);flex:0 0 auto}

  /* ---- the spreadsheet ---- */
  .gs{position:relative;min-width:0;background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:8px;overflow:hidden;flex:0 0 auto}
  .gr{display:grid;align-items:stretch}
  .gr > span{min-width:0;padding:3px 8px;border-left:1px solid var(--grid);display:flex;align-items:center;line-height:1.25}
  .gr > span:first-child{border-left:0;justify-content:center;padding:3px 0;background:var(--tint);font-size:11px;color:var(--body)}
  .gl{background:var(--tint);font-size:11px;color:var(--body);min-height:19px}
  .gl > span{justify-content:center}
  .gh{background:var(--highlight);font-weight:700;color:var(--on-highlight);font-size:13px;min-height:26px;border-top:1px solid var(--grid)}
  .gd{font-size:13px;color:var(--title);min-height:24px;border-top:1px solid var(--grid);
    transition:background var(--t-frame) var(--ease-io),opacity var(--t-frame) var(--ease-io),box-shadow var(--t-frame) var(--ease-io)}
  .gd > span.num{justify-content:flex-end;font-variant-numeric:tabular-nums}
  .gd .empty{color:var(--body)}
  .tabs{display:flex;gap:4px;background:var(--tint);border-top:1px solid var(--grid);padding:0 8px;height:28px;align-items:stretch}
  .tab{font-size:12.5px;padding:0 12px;display:flex;align-items:center;color:var(--body)}
  .tab.on{background:var(--bg);color:var(--on-highlight);font-weight:700;box-shadow:inset 0 -3px 0 var(--on-highlight)}

  /* Claude's table: the two facts as Claude gives them in the chat, one row per finding.
     Drawn like a chat table, not a sheet: a message bubble, no row numbers, no column
     letters, no tabs, no vertical grid lines. The Working List itself holds only Finding,
     Rank and Why It Sits Here. */
  .cbx{position:relative;flex:0 0 auto;align-self:flex-start;width:540px;max-width:100%;background:var(--bg);border:1.5px solid var(--line);
    border-radius:4px 18px 18px 18px;padding:8px 10px 6px}
  .cth{display:flex;align-items:center;gap:7px;padding:0 4px 3px;font-size:12px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;color:var(--on-highlight)}
  .cth svg.ic{width:18px;height:18px;flex:0 0 auto}
  .ctab{width:100%;border-collapse:collapse;table-layout:fixed}
  .ctab .c1{width:46%}
  .ctab .c2{width:15%}
  .ctab .c3{width:39%}
  .ctab th{font-size:13.5px;font-weight:700;color:var(--title);text-align:left;vertical-align:bottom;line-height:1.25;
    padding:5px 10px;border-bottom:1.5px solid var(--on-highlight)}
  .ctab td{font-size:15px;color:var(--title);vertical-align:middle;line-height:1.3;padding:6px 10px;height:36px}
  .cbx.big{width:620px}
  .cbx.big .cth{font-size:12.5px}
  .cbx.big .ctab th{font-size:15px;padding:6px 12px}
  .cbx.big .ctab td{font-size:17px;padding:8px 12px;height:44px}
  .wcell{position:relative}
  .wcell.mark{box-shadow:inset 0 0 0 2.5px var(--on-highlight);background:var(--tint)}
  .wcell.lit{background:var(--highlight);font-weight:700}
  .wcell .wv{white-space:nowrap}
  .wcell .wq{font-size:12px;font-style:italic;color:var(--body);font-weight:400}

  /* Scan columns: row number, A Host, E Finding, F CVE, G Severity, H CVSS, L Group */
  .sc .gr{grid-template-columns:30px 92px minmax(0,1.2fr) 114px 68px 50px minmax(0,1fr)}
  .sc .gd{font-size:12.5px}
  .sc .gd > span.hn{white-space:nowrap}
  .sc .gd.scan{box-shadow:inset 0 0 0 2px var(--on-highlight)}
  .sc .gd.hit{background:var(--highlight);box-shadow:inset 5px 0 0 var(--on-highlight)}
  .sc .gd.hit > span{font-weight:700}
  .sc .gd.miss{opacity:.32}
  .colbox{position:absolute;border:3px solid var(--on-highlight);border-radius:6px;pointer-events:none}
  .collab{position:absolute;right:6px;top:-1px;background:var(--on-highlight);color:var(--bg);font-size:11.5px;font-weight:700;
    padding:1px 8px;border-radius:0 0 6px 6px}

  /* Score scene: the three rows only. Row number, E Finding, F CVE, H CVSS */
  .s3 .gr{grid-template-columns:30px minmax(0,1fr) 140px 64px}
  .s3 .gd > span.cv{transition:background var(--t-frame) var(--ease-io),box-shadow var(--t-frame) var(--ease-io)}
  .s3 .gd > span.cv.lit{background:var(--highlight);box-shadow:inset 0 0 0 2.5px var(--on-highlight);font-weight:700}
  .cmp{flex:0 0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
  .tiles{display:flex;gap:12px;align-items:flex-start}
  .tl{width:92px;height:76px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px}
  .tv{width:92px;height:54px;flex:0 0 auto;border-radius:10px;border:1.5px solid var(--on-highlight);background:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--title);font-variant-numeric:tabular-nums;
    transition:opacity var(--t-frame) var(--ease-out),border-width var(--t-fast),background var(--t-frame)}
  .tt{font-size:12px;font-weight:700;color:var(--on-highlight);display:flex;align-items:center;gap:4px;height:18px;opacity:0;
    transition:opacity var(--t-frame) var(--ease-out)}
  .tt svg.ic{width:15px;height:15px;stroke-width:2.2}
  .tl.best .tv{border:3px solid var(--on-highlight);background:var(--highlight)}
  .tl.best .tt{opacity:1}
  .tl.dim .tv{opacity:.4}
  .slab{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight);flex:0 0 auto;
    display:flex;align-items:center;gap:7px}
  .slab svg.ic{width:17px;height:17px}

  /* the thing that moves from one place to another */
  .flyer{position:absolute;z-index:6;pointer-events:none;background:var(--highlight);border:2px solid var(--on-highlight);border-radius:7px;
    padding:2px 9px;font-weight:700;color:var(--title);white-space:nowrap;font-size:17px;
    transition:transform 850ms var(--ease-io)}

  /* ---- CISA's exploited list, drawn ---- */
  .kwrap{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:226px minmax(0,1fr);gap:16px;align-items:start}
  .codes{background:var(--highlight);border-radius:12px;padding:11px 12px 12px;display:flex;flex-direction:column;gap:7px}
  .codes .ch{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .cc{background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:6px 9px;display:flex;gap:9px;align-items:center;
    transition:background var(--t-frame) var(--ease-out),border-color var(--t-frame) var(--ease-out),box-shadow var(--t-frame) var(--ease-out)}
  .cc .cg{flex:0 0 auto;width:22px;height:22px;color:var(--on-highlight)}
  .cc .cg svg.ic{width:22px;height:22px}
  .cc .ct{display:flex;flex-direction:column;min-width:0}
  .cc .cn{font-family:var(--mono);font-size:13.5px;font-weight:700;color:var(--title);white-space:nowrap}
  .cc .cs{font-size:13px;color:var(--body);line-height:1.3}
  .cc.cur{border-color:var(--on-highlight);box-shadow:inset 0 0 0 .5px var(--on-highlight)}
  .cc.cur .cs{color:var(--on-highlight);font-weight:600}
  .cc.yes{background:var(--ok-tint);border-color:var(--ok);box-shadow:inset 0 0 0 .5px var(--ok)}
  .cc.yes .cg{color:var(--ok)}
  .cc.yes .cs{color:var(--ok);font-weight:700}
  .cc.no{border-color:var(--on-highlight)}
  .cc.no .cs{color:var(--title);font-weight:600}
  .codes .st{font-size:14.5px;line-height:1.42;color:var(--title);font-weight:600;border-top:1.5px solid var(--line);padding-top:8px}

  .kev{min-width:0;background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;overflow:hidden}
  .kbar{height:26px;background:var(--tint);border-bottom:1px solid var(--grid);display:flex;align-items:center;gap:10px;padding:0 10px}
  .kbar .dots{display:flex;gap:5px}
  .kbar .dots i{width:8px;height:8px;border-radius:50%;border:1.3px solid var(--line)}
  .kbar .url{flex:1 1 auto;min-width:0;background:var(--bg);border-radius:9px;font-size:11.5px;color:var(--body);padding:1px 10px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kbody{display:grid;grid-template-columns:186px minmax(0,1fr);gap:20px;padding:12px 16px 10px}
  .kside{display:flex;flex-direction:column;gap:7px}
  .kh{font-size:14px;font-weight:700;line-height:1.25;color:var(--title)}
  .klab{font-size:12.5px;color:var(--title);margin-top:4px}
  .kin{height:34px;border:1.5px solid var(--line);background:var(--bg);border-radius:2px;display:flex;align-items:center;gap:7px;padding:0 8px;
    transition:box-shadow var(--t-fast) var(--ease-out)}
  .kin.act{box-shadow:0 0 0 2.5px var(--on-highlight)}
  .kin svg.ic{width:16px;height:16px;color:var(--body);flex:0 0 auto}
  .kin .ty{font-family:var(--mono);font-size:13px;color:var(--title);white-space:nowrap}
  .kin .caret{display:inline-block;width:1.5px;height:16px;background:var(--on-highlight);margin-left:1px;opacity:0}
  .kin.act .caret{opacity:1}
  .kapply{align-self:flex-start;margin-top:4px;background:var(--on-highlight);color:var(--bg);border:2px solid var(--on-highlight);
    font-size:12.5px;font-weight:600;letter-spacing:.08em;padding:6px 16px;transition:background var(--t-fast),color var(--t-fast)}
  .kapply.press{background:var(--bg);color:var(--on-highlight)}
  .kmain{min-width:0;display:flex;flex-direction:column}
  .kt{font-size:23px;line-height:1.15;color:var(--on-highlight);font-weight:500}
  .kskel{display:flex;flex-direction:column;gap:7px;margin:8px 0 10px}
  .kskel i{display:block;height:7px;border-radius:4px;background:var(--tint2)}
  .kline{height:1.5px;background:var(--on-highlight)}
  .kres{position:relative;min-height:128px;padding-top:9px}
  .kres .kshow{font-size:12px;color:var(--body)}
  .kres .kven{font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--body);margin-top:3px}
  .kcode{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
  .kcl{display:inline-flex;align-items:center;gap:7px;font-size:18px;font-weight:600;color:var(--on-highlight);text-decoration:underline;
    border-radius:4px;padding:1px 4px;box-shadow:0 0 0 0 transparent;transition:box-shadow var(--t-frame) var(--ease-out)}
  .kcl svg.ic{width:20px;height:20px}
  .kcl.boxed{box-shadow:0 0 0 2.5px var(--on-highlight)}
  .kdesc{font-size:12.5px;line-height:1.4;color:var(--title);margin-top:7px}
  .kdesc b{font-weight:700}
  /* Our note on the search, kept outside the drawn CISA page because the real page shows nothing like it. */
  .kcol{min-width:0;display:flex;flex-direction:column;gap:7px}
  .knote{flex:0 0 auto;display:flex;align-items:center;gap:9px;min-height:34px;padding:5px 12px;border-radius:9px;
    background:var(--highlight);border:1.5px solid var(--on-highlight);font-size:14px;line-height:1.35;color:var(--title)}
  .knote svg.ic{width:20px;height:20px;flex:0 0 auto;color:var(--on-highlight)}
  .knote .nl{flex:0 0 auto;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .knote.yes{background:var(--ok-tint);border-color:var(--ok)}
  .knote.yes svg.ic{color:var(--ok);stroke-width:2.2}
  .knote.yes .nl{color:var(--ok)}

  /* ---- scene 6 and 7 ---- */
  .codes.row{flex-direction:row;align-items:center;gap:10px;padding:8px 10px;flex:0 0 auto}
  .codes.row .ch{flex:0 0 auto;width:118px;line-height:1.25}
  .codes.row .cc{flex:1 1 0;min-width:0}
  .rules{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .rule{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start}
  .rule .rg{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--highlight);border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center}
  .rule .rg svg.ic{width:19px;height:19px}
  .rule.yes{border:2px solid var(--ok);background:var(--ok-tint)}
  .rule.yes .rg{background:var(--bg);border-color:var(--ok);color:var(--ok)}
  .rule p{font-size:14.5px;line-height:1.38;color:var(--title)}
  .rule p b{font-weight:700}
  .sums{flex:0 0 auto;display:flex;flex-direction:column;gap:10px}
  .sums .statement b{color:var(--on-highlight)}

  /* ---- the bar ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out);
    display:inline-flex;align-items:center;gap:7px}
  button.nav svg.ic{width:17px;height:17px}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled,button.nav.ghost:disabled{background:transparent;color:var(--on-highlight);border-style:dashed;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:40px;font-size:13.5px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #replay{margin-left:auto}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .board{flex:0 0 auto}
    .statement{font-size:17px;padding:12px 14px}
    .cap{font-size:16px;align-items:flex-start}

    .gr > span{padding:4px 6px}
    .gd{font-size:14.5px}
    .gh{font-size:13.5px}
    /* the phone shows fewer columns, so nothing scrolls sideways */
    .hp{display:none!important}
    .sc .gr{grid-template-columns:26px minmax(0,1fr) 48px minmax(0,1fr)}
    .s3 .gr{grid-template-columns:26px minmax(0,1fr) 126px 50px}
    .wcell .wv{white-space:normal}
    .cbx,.cbx.big{width:100%;padding:8px 5px 5px}
    .cth,.cbx.big .cth{font-size:12.5px}
    .ctab .c1{width:39%}
    .ctab .c2{width:19%}
    .ctab .c3{width:42%}
    .ctab th,.cbx.big .ctab th{font-size:14px;padding:5px 7px}
    .ctab td,.cbx.big .ctab td{font-size:16px;padding:6px 7px;height:48px}

    .cmp{grid-template-columns:1fr;gap:12px}
    .tl,.tv{width:84px}

    <h2>Check One Finding by Hand</h2>
    <p>Here is one finding from the Working List of a made-up company called Example: <strong>Old OpenSSL on <span class="nw">EX-WEB02</span></strong>. We are going to show you how to work out two facts about it by hand: its score, and whether it is on the exploited list. In the real task, Claude gives you these two facts as a table like this one.</p>

      },
      play:function(){
        at(100, "sc");
        T(800, function(){ boxGroup(); });
        var t = 1500;
        SCAN.forEach(function(r, k){
          var row = q('.gd[data-r="' + k + '"]');
          T(t, function(){ row.classList.add("scan"); });
          T(t + 420, function(){ row.classList.remove("scan"); row.classList.add(r.grp === FIND ? "hit" : "miss"); if(q(".colbox")) boxGroup(); });
          t += 520;
        });
        at(t + 300, "cap");
        return t + 800;
      } },

    { id:"score", label:"Score", h1:"The Score Is the Highest CVSS Number",
      build:function(){
        var tiles = MINE.map(function(r, k){
          return '<div class="tl fx" data-k="t' + k + '" data-t="' + k + '"><span class="tt">' + icon("up") + 'Highest</span><span class="tv">' + r.cvss + "</span></div>";
        }).join("");
        return '<p class="lead">Next, we look at the CVSS column of the finding\'s three rows. Each number is that row\'s danger score, from 0 to 10.</p>'
          + threeSheet()
          + '<div class="cmp"><div class="tiles">' + tiles + "</div>"
          + '<div class="statement fx" data-k="st">The Score is the highest CVSS number among the finding\'s rows. Here, that is 7.5.</div></div>'
          + answerCard({});
      },
      prep:holdRow,
      play:function(){
        at(100, "s3"); at(250, "ac");
        MINE.forEach(function(r, k){
          T(900 + k*600, function(){ var c = q('[data-cv="' + k + '"]'); if(c) c.classList.add("lit"); });
          at(1100 + k*600, "t" + k);
        });
        var top = MINE.indexOf(TOP);
        T(3200, function(){
          qa(".tl").forEach(function(n){ n.classList.add(+n.dataset.t === top ? "best" : "dim"); });
          qa(".s3 .cv").forEach(function(n){ if(+n.dataset.cv !== top) n.classList.remove("lit"); });
        });
        T(4100, function(){
          var cell = q("#cScore");
          fly(q('.tl[data-t="' + top + '"] .tv'), cell, TOP.cvss, function(){
            cell.classList.add("lit"); cell.innerHTML = '<span class="wv">' + TOP.cvss + "</span>";
          });
        });
        at(5200, "st");
        return 5700;
      } },

    { id:"kev1", label:"First code", h1:"Search the First Code on the Exploited List",
      build:function(){
        return '<p class="lead">Next, we search each of the finding\'s three codes on CISA\'s exploited list of flaws that attackers have really used, one at a time. We start with <b class="nw">CVE-2014-0160</b>, a real flaw from 2014 called Heartbleed.</p>'
          + '<div class="kwrap"><div class="codes fx" data-k="codes"><div class="ch">The finding\'s codes</div>'
          + codeCard(0, "wait") + codeCard(1, "wait") + codeCard(2, "wait")
          + '<p class="st fx" data-k="st">The code at the top of the entry is the one we typed, so this code is on the list.</p></div>'
          + kevMock(kevNote("yes", kevHTML("CVE-2014-0160") + " is on the list.")) + "</div>";
      },
      /* Reserve the result's full height before it appears, so nothing below it moves. */
      prep:function(){
        var r = q("#kres");
        if(!r) return;
        var probe = document.createElement("div");
        probe.style.visibility = "hidden";
        probe.setAttribute("aria-hidden", "true");
        probe.innerHTML = kevHit().replace(' id="kcl"', "");
        r.appendChild(probe);
        var h = probe.getBoundingClientRect().height / scaleOf() + parseFloat(getComputedStyle(r).paddingTop);
        probe.remove();
        r.style.minHeight = Math.max(128, Math.ceil(h)) + "px";
      },
      play:function(){
        at(100, "codes"); at(250, "kev");
        T(900, function(){ setCard(0, "cur"); q("#kin").classList.add("act"); });
        typeInto(q("#typed"), "CVE-2014-0160", 1300, 85);
        T(2600, function(){ q("#kapply").classList.add("press"); });
        T(2850, function(){ q("#kapply").classList.remove("press"); q("#kin").classList.remove("act"); q("#kres").innerHTML = kevHit(); });
        at(3000, "hit");
        T(3900, function(){ var c = q("#kcl"); if(c) c.classList.add("boxed"); });
        at(4600, "note");
        T(4700, function(){ setCard(0, "yes"); });
        at(5500, "st");
        return 6000;
      } },

    { id:"kev2", label:"Other codes", h1:"Search the Other Two Codes",
      build:function(){
        return '<p class="lead">Now we do the same for the other two codes, <b class="nw">CVE-2099-0011</b> and <b class="nw">CVE-2099-0012</b>. We type each one into the same search box and press Apply.</p>'
          + '<div class="kwrap"><div class="codes fx on" data-k="codes"><div class="ch">The finding\'s codes</div>'
          + codeCard(0, "yes") + codeCard(1, "wait") + codeCard(2, "wait")
          + '<p class="st fx" data-k="st">Nothing appears below the line for either code, so they are not on the list. These two codes are made up anyway.</p></div>'
          + kevMock(kevNote("no", "Nothing appears below the line for " + kevHTML(MINE[1].cve) + ".")) + "</div>";
      },
      play:function(){
        at(50, "kev");
        var t = 600;
        [1, 2].forEach(function(k){
          var code = MINE[k].cve;
          T(t, function(){ setCard(k, "cur"); q("#typed").textContent = ""; q("#knote").classList.remove("on"); q("#kin").classList.add("act"); });
          typeInto(q("#typed"), code, t + 400, 80);
          var a = t + 400 + code.length*80 + 300;
          T(a, function(){ q("#kapply").classList.add("press"); });
          T(a + 250, function(){
            q("#kapply").classList.remove("press"); q("#kin").classList.remove("act");
            q("#ntext").innerHTML = "Nothing appears below the line for " + kevHTML(code) + ".";
          });
          at(a + 400, "note");
          T(a + 1300, function(){ setCard(k, "no"); });
          t = a + 2100;
        });
        at(t, "st");
        return t + 500;
      } },

    { id:"write", label:"The answer", h1:"Work Out the Exploited List Answer",
      build:function(){
        return '<p class="lead">One of the finding\'s three codes is on the list, so the answer for On the Exploited List is <b>yes</b>, with that code.</p>'
          + '<div class="codes row fx" data-k="codes"><div class="ch">The finding\'s codes</div>' + codeCard(0, "yes") + codeCard(1, "no") + codeCard(2, "no") + "</div>"
          + answerCard({ score:TOP.cvss })
          + '<div class="rules">'
          + '<div class="rule yes fx" data-k="r0"><span class="rg">' + icon("check") + '</span><p>The answer is <b>yes</b> and that code if any one of the finding\'s codes is on the list.</p></div>'
          + '<div class="rule fx" data-k="r1"><span class="rg">' + icon("minus") + '</span><p>The answer is <b>no</b> if none of its codes is on the list.</p></div>'
          + '<div class="rule fx" data-k="r2"><span class="rg">' + icon("nocode") + '</span><p>The answer is <b>no code</b> if the finding has no CVE at all.</p></div>'
          + "</div>";
      },
      prep:holdRow,
      play:function(){
        at(100, "codes"); at(250, "ac");
        T(1000, function(){
          var cell = q("#cKev");
          fly(q('.cc[data-c="0"] .cn'), cell, "CVE-2014-0160", function(){
            cell.classList.add("lit");
            cell.innerHTML = '<span class="wv"></span>';
            typeInto(cell.querySelector(".wv"), ANSWER, 0, 55, true, kevPart);
            timers.push(setTimeout(function(){ cell.innerHTML = '<span class="wv">' + kevHTML(ANSWER) + "</span>"; }, reduce ? 0 : (ANSWER.length + 1) * 55));
          });
        });
        at(3300, "r0"); at(4100, "r1"); at(4900, "r2");
        return 5400;
      } },

    { id:"sum", label:"Summary", h1:"One Finding, Checked by Hand",
      build:function(){
        return '<p class="lead">Here is the finding with both facts worked out.</p>'
          + answerCard({ big:true, score:TOP.cvss, kev:ANSWER })
          + '<div class="sums">'
          + '<div class="statement fx" data-k="s1"><b>Score:</b> the highest CVSS number among the finding\'s rows.</div>'
          + '<div class="statement fx" data-k="s2"><b>On the Exploited List:</b> yes and the code if any one of its codes is on the list.</div>'
          + "</div>"
          + '<p class="cap fx" data-k="nx">' + icon("pencil") + "In the next step, you will write both facts into the Why It Sits Here column.</p>";
      },
      prep:holdRow,
      play:function(){
        at(100, "ac");
        T(600, function(){ q("#cScore").classList.add("lit"); q("#cKev").classList.add("lit"); });
        at(1300, "s1"); at(2300, "s2"); at(3300, "nx");
        return 3800;
      } }
  ];

  /* ---------------- state and timeline ---------------- */
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var timers = [];
  var gen = 0;
  var playing = false;
  function T(ms, fn){ if(reduce){ fn(); return; } timers.push(setTimeout(fn, ms)); }
  function stop(){ timers.forEach(clearTimeout); timers = []; }
  function q(s){ return el.board.querySelector(s); }
  /* the stage's current scale, so a measured height is in canvas pixels */
  function scaleOf(){ return (el.frame.getBoundingClientRect().width / el.frame.offsetWidth) || 1; }
  function qa(s){ return Array.prototype.slice.call(el.board.querySelectorAll(s)); }
  function at(ms, key){ T(ms, function(){ qa('[data-k="' + key + '"]').forEach(function(n){ n.classList.add("on"); }); }); }
  /* Type text into a node one character at a time. now = start from inside a running step. */
  function typeInto(node, text, start, per, now, fmt){
    if(!node) return;
    for(var c = 1; c <= text.length; c++){
      (function(n){
        var f = fmt ? function(){ node.innerHTML = fmt(text.slice(0, n)); } : function(){ node.textContent = text.slice(0, n); };
        if(reduce) f(); else if(now) timers.push(setTimeout(f, start + n*per)); else T(start + n*per, f);
      })(c);
    }
  }
  /* Move a copy of what is in src over to dst, then call done. */
  function fly(src, dst, text, done){
    if(reduce || !src || !dst){ done(); return; }
    var fr = el.frame.getBoundingClientRect(), sc = (fr.width / el.frame.offsetWidth) || 1;
    var a = src.getBoundingClientRect(), b = dst.getBoundingClientRect();
    var f = document.createElement("div");
    f.className = "flyer"; f.textContent = text; f.setAttribute("aria-hidden", "true");
    el.frame.appendChild(f);
    var fw = f.offsetWidth, fh = f.offsetHeight;
    var x0 = (a.left + a.width/2 - fr.left)/sc - fw/2, y0 = (a.top + a.height/2 - fr.top)/sc - fh/2;
    var x1 = (b.left + b.width/2 - fr.left)/sc - fw/2, y1 = (b.top + b.height/2 - fr.top)/sc - fh/2;
    f.style.left = x0 + "px"; f.style.top = y0 + "px";
    void f.offsetWidth;
    f.style.transform = "translate(" + (x1 - x0) + "px," + (y1 - y0) + "px)";
    timers.push(setTimeout(function(){ f.remove(); done(); }, 900));
  }
  /* A navy box around the Group column of the Scan tab. */
  function boxGroup(){
    var sheet = document.getElementById("scan"), hg = document.getElementById("hGroup");
    if(!sheet || !hg) return;
    var old = sheet.querySelector(".colbox"); if(old) old.remove();
    var tabs = sheet.querySelector(".tabs");
    var b = document.createElement("div");
    b.className = "colbox"; b.setAttribute("aria-hidden", "true");
    b.style.left = (hg.offsetLeft + 1) + "px";
    b.style.width = (hg.offsetWidth - 2) + "px";
    b.style.top = "1px";
    b.style.height = (tabs.offsetTop - 2) + "px";
    b.innerHTML = '<span class="collab">Column L</span>';
    sheet.appendChild(b);
  }

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), h1:document.getElementById("h1"),
    board:document.getElementById("board"), back:document.getElementById("back"),
    next:document.getElementById("next"), hint:document.getElementById("hint"),
    replay:document.getElementById("replay"), live:document.getElementById("live")
  };
  el.replay.innerHTML = icon("replay") + "Replay";
  var i = 0;

  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;
    el.back.disabled = (i === 0);
    if(i === S.length-1){ el.next.disabled = true; el.next.textContent = "You are at the end"; }
    else { el.next.disabled = false; el.next.textContent = "Next"; }
  }

  function render(){
    stop();
    Array.prototype.forEach.call(el.frame.querySelectorAll(".flyer"), function(n){ n.remove(); });
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);
    el.board.innerHTML = s.build();
    if(s.prep) s.prep();
    header();
    el.live.textContent = "Scene " + (i+1) + " of " + S.length + ". " + s.h1 + ".";
    playing = true;
    el.hint.textContent = "";
    void el.board.offsetWidth;
    var my = ++gen;
    var run = function(){
      if(my !== gen) return;
      var end = s.play();
      T(end, function(){ playing = false; window.__ex.done = true; });
    };
    window.__ex && (window.__ex.done = false);
    if(reduce) run(); else requestAnimationFrame(function(){ requestAnimationFrame(run); });
  }

  /* btn = the button that was pressed. Focus stays on it, or moves to the
     other one when it has just become disabled at either end. */
  function go(d, btn){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render();
    var ph = window.matchMedia("(max-width:599px)").matches;
    var to = el.frame;
    if(btn) to = btn.disabled ? (btn === el.next ? el.back : el.next) : btn;
    to.focus(ph ? { preventScroll:true } : undefined);
    if(ph) window.scrollTo(0, 0);
  }
  el.back.addEventListener("click", function(){ go(-1, el.back); });
  el.next.addEventListener("click", function(){ go(1, el.next); });
  el.replay.addEventListener("click", function(){ render(); });

  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){ if(dx < 0){ if(!el.next.disabled) go(1); } else go(-1); }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches) stage.style.transform = "";
    else {
      var sc = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
      stage.style.transform = "scale(" + sc + ")";
    }
    if(S[i].prep) S[i].prep();
    if(document.querySelector("#scan .colbox")) boxGroup();
  }
  window.addEventListener("resize", fit);

  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; i = n; render(); return true; },
    slides:S.length, done:false,
    reset:function(){ i = 0; render(); },
    state:function(){ return { i:i, playing:playing }; }
  };

  render();
  fit();
})();
</script>
</body>
</html>
