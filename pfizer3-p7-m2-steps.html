:root{

  --gray-800:#333333;

  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;

}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

.app{position:absolute;left:50%;top:50%;width:760px;height:1140px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: step rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}

/* Table and analysis box (from the Learn deck) */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}

/* A smaller code font for the long function in Step 3 (from the 11 November module 9 steps deck) */
.run.small pre{font-size:12px;line-height:1.32;padding:8px 14px}

<template id="t7">
<p class="p">Before your code can ask Gemini anything, the notebook has to connect to it.</p><p class="p">Press <b>Run</b> on the cell under <b>Step 2: Set Up Gemini LLM Connection</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; lines 19 to 39 of 39</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">from google import genai</span><span class="ln" style="--i:0ch">from google.colab import userdata</span><span class="ln" style="--i:0ch">import time</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">MODEL = &quot;gemini-3.5-flash-lite&quot;</span><span class="ln" style="--i:0ch">client = genai.Client(api_key=userdata.get(&#x27;GEMINI_API_KEY&#x27;))</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">def gemini_model(prompt, retries=3):</span><span class="ln" style="--i:4ch">    for attempt in range(retries):</span><span class="ln" style="--i:8ch">        try:</span><span class="ln" style="--i:12ch">            response = client.models.generate_content(model=MODEL, contents=prompt)</span><span class="ln" style="--i:12ch">            return response.text</span><span class="ln" style="--i:8ch">        except Exception as e:</span><span class="ln" style="--i:12ch">            busy = any(s in str(e).lower() for s in</span><span class="ln" style="--i:23ch">                       [&quot;429&quot;, &quot;503&quot;, &quot;overloaded&quot;, &quot;resource_exhausted&quot;, &quot;unavailable&quot;])</span><span class="ln" style="--i:12ch">            if busy and attempt &lt; retries - 1:</span><span class="ln" style="--i:16ch">                wait = 30 * (attempt + 1)</span><span class="ln" style="--i:16ch">                print(f&quot;Gemini is busy, retrying in {wait}s...&quot;)</span><span class="ln" style="--i:16ch">                time.sleep(wait)</span><span class="ln" style="--i:12ch">            else:</span><span class="ln" style="--i:16ch">                raise</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>It reads your <code>GEMINI_API_KEY</code> from Colab Secrets and connects to the model <code>gemini-3.5-flash-lite</code>.</li><li><code>gemini_model(prompt)</code> sends one prompt and returns Gemini's reply as text. If Gemini is busy, it waits 30 seconds, then 60, and tries again.</li></ul><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span>No output. If Colab asks <b>Grant access?</b>, click it.</span></p>
</template>

<template id="t8">
<p class="p">Now that you have the page content, let's start comparing them! Your next job is to decide: <b>"Does this page belong to the same document as the one before it?"</b> You'll write a function that asks an LLM (like Gemini) to look at the text on two consecutive pages and return <b>Yes</b> or <b>No</b>.</p><p class="p">Read the prompt in the next cell first:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; lines 19 to 44 of 53</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">def is_same_document(prev_text, curr_text, doc_type=None):</span><span class="ln" style="--i:4ch">    prompt = f&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    You are checking whether two consecutive pages from a pharmaceutical</span><span class="ln" style="--i:4ch">    document package belong to the SAME individual document.</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    A NEW document starts when the page has:</span><span class="ln" style="--i:4ch">    - A different document title or heading (e.g., &quot;Certificate of Quality&quot;</span><span class="ln" style="--i:6ch">      vs &quot;Packaging Specification&quot; vs &quot;Material Description Sheet&quot;)</span><span class="ln" style="--i:4ch">    - A completely different topic or subject matter</span><span class="ln" style="--i:4ch">    - Its own header with a new document number or reference</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Pages belong to the SAME document when:</span><span class="ln" style="--i:4ch">    - The second page says &quot;continued&quot; or &quot;page 2 of 2&quot;</span><span class="ln" style="--i:4ch">    - The content directly continues the previous page&#x27;s discussion</span><span class="ln" style="--i:4ch">    - They share the same document number or title</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Previous page type: {doc_type or &#x27;unknown&#x27;}</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Previous Page:</span><span class="ln" style="--i:4ch">    {prev_text}</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Current Page:</span><span class="ln" style="--i:4ch">    {curr_text}</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Do these two pages belong to the SAME document? Answer ONLY &#x27;Yes&#x27; or &#x27;No&#x27;.</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;</span></code></pre></figure>
</template>

<template id="t9">
<p class="p">Press <b>Run</b> on that cell, with <code class="nw">STEP 4: Write Document Boundary Detection Function</code> in its top comment. Its last lines test the function:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; lines 45 to 53 of 53</span></div><pre tabindex="0"><code><span class="ln" style="--i:4ch">    response = gemini_model(prompt)</span><span class="ln" style="--i:4ch">    return response.strip().lower().startswith(&quot;yes&quot;)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">prev_text = doc_pages[1][&quot;text&quot;]</span><span class="ln" style="--i:0ch">curr_text = doc_pages[2][&quot;text&quot;]</span><span class="ln" style="--i:0ch">doc_type = &quot;Certificate of Quality&quot;  # Optional, can be &quot;unknown&quot; or None</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">is_same_document(prev_text, curr_text, doc_type)</span></code></pre></figure><p class="p"><b>Why this matters:</b></p><ul class="list"><li>You give the model the content of two pages (previous + current).</li><li>You also tell it what kind of document the <b>previous page</b> was (if known).</li><li>The model looks at both pages and decides: <b>same document or not?</b></li></ul><p class="p"><code>.lower().startswith("yes")</code> turns the model's reply into <code>True</code> or <code>False</code>.</p>

<template id="t11">
<p class="p">Whenever the model says <i>"This is a new document,"</i> we need to figure out <b>what kind of document it is</b>. Is it a Cover Letter? A Certificate of Quality? A Packaging Specification? This next function does that. Read its prompt first:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; lines 19 to 37 of 54</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">DOC_TYPES = [&quot;Cover Letter&quot;, &quot;Certificate of Quality&quot;, &quot;Packaging Specification&quot;, &quot;BSE/TSE Declaration&quot;, &quot;Material Description&quot;, &quot;Supplier Qualification&quot;, &quot;Chain of Custody&quot;, &quot;Other&quot;]</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">def classify_document_type(text):</span><span class="ln" style="--i:4ch">    prompt = f&quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    You are a pharmaceutical document classifier. Based on the page</span><span class="ln" style="--i:4ch">    content below, classify it into ONE of these document types:</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    - Cover Letter: A formal letter (often starting with &quot;To Whom It</span><span class="ln" style="--i:6ch">      May Concern&quot;) discussing product information or storage conditions.</span><span class="ln" style="--i:4ch">    - Certificate of Quality: Contains lot numbers, manufacture dates,</span><span class="ln" style="--i:6ch">      expiration dates, and test results (autoclave, gamma irradiation).</span><span class="ln" style="--i:4ch">    - Packaging Specification: Describes packaging components, materials,</span><span class="ln" style="--i:6ch">      part numbers, and configuration change history.</span><span class="ln" style="--i:4ch">    - BSE/TSE Declaration: A declaration about animal-origin materials</span><span class="ln" style="--i:6ch">      and transmissible spongiform encephalopathy compliance.</span><span class="ln" style="--i:4ch">    - Material Description: Lists materials of construction, sterilization</span><span class="ln" style="--i:6ch">      compatibility, and physical properties of a product.</span><span class="ln" style="--i:4ch">    - Supplier Qualification: Contains supplier audit history,</span><span class="ln" style="--i:6ch">      certifications (ISO 9001, ISO 13485), and approved product lists.</span></code></pre></figure>
</template>

<template id="t12">
<p class="p">Press <b>Run</b> on the cell under <b>Step 3: Write the Document Type Classifier</b>. Its second half sends the prompt and reads Gemini's answer:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; lines 38 to 54 of 54</span></div><pre tabindex="0"><code><span class="ln" style="--i:4ch">    - Chain of Custody: Lists manufactured assemblies, traceability</span><span class="ln" style="--i:6ch">      information, and the manufacturing-to-shipment flow.</span><span class="ln" style="--i:4ch">    - Other: Use ONLY if the content does not match any of the above.</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Page Content:</span><span class="ln" style="--i:4ch">    {text}</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    Respond with ONLY the document type name. No explanation.</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    response = gemini_model(prompt).strip().lower().replace(&quot;.&quot;, &quot;&quot;)</span><span class="ln" style="--i:4ch">    # Match the answer to one of the 8 labels, spelled exactly as in the list above</span><span class="ln" style="--i:4ch">    for label in DOC_TYPES:</span><span class="ln" style="--i:8ch">        if label.lower() in response:</span><span class="ln" style="--i:12ch">            return label</span><span class="ln" style="--i:4ch">    return &quot;Other&quot;</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">classify_document_type(doc_pages[3][&quot;text&quot;])</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>The loop matches Gemini's reply to one label in <code>DOC_TYPES</code> and returns it spelled exactly as in the list, so <code>cover letter</code> becomes <code>Cover Letter</code>. If the reply matches none of them, the page gets <code>Other</code>.</li><li>The last line tests it on page 3.</li></ul>
</template>

<template id="t14">
<p class="p">Here comes the fun part: walking through all your pages and using the two functions above to check if a page is part of the same document, assign a <b>document ID</b> and classify the document <b>type</b>, generating a structured metadata list that tracks document boundaries and types.</p><p class="p">Press <b>Run</b> on the cell under <b>Step 4: Loop Through Pages and Generate Page-Level Metadata</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; lines 20 to 42 of 42</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">results = []</span><span class="ln" style="--i:0ch">current_doc_type = None</span><span class="ln" style="--i:0ch">doc_counter = 0</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">for i, page in enumerate(doc_pages):</span><span class="ln" style="--i:4ch">    if i == 0:</span><span class="ln" style="--i:8ch">        current_doc_type = classify_document_type(page[&quot;text&quot;])</span><span class="ln" style="--i:4ch">    else:</span><span class="ln" style="--i:8ch">        prev_text = doc_pages[i - 1][&quot;text&quot;]</span><span class="ln" style="--i:8ch">        same = is_same_document(prev_text, page[&quot;text&quot;], current_doc_type)</span><span class="ln" style="--i:8ch">        if not same:</span><span class="ln" style="--i:12ch">            doc_counter += 1</span><span class="ln" style="--i:12ch">            current_doc_type = classify_document_type(page[&quot;text&quot;])</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:4ch">    results.append({</span><span class="ln" style="--i:8ch">        &quot;page&quot;: i,</span><span class="ln" style="--i:8ch">        &quot;doc_id&quot;: doc_counter,</span><span class="ln" style="--i:8ch">        &quot;doc_type&quot;: current_doc_type</span><span class="ln" style="--i:4ch">    })</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">for r in results:</span><span class="ln" style="--i:4ch">    print(r)</span></code></pre></figure><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span>This cell takes the longest, about 1.5 minutes. If it prints <code>Gemini is busy, retrying in 30s...</code>, let it run.</span></p>
</template>

<script>
(function () {
  "use strict";
  var CELLS = {};
  var GROUPS = ["Start", "Step 1", "Step 2", "Step 3", "Step 4", "Step 5", "Step 6", "Done"];
  var SLIDES = [
    {"group": "Start", "label": "GET READY &middot; PART 1 OF 2", "title": "Open the Notebook and the Sample <span class=\"hl\">PDF</span>", "plain": "Open the Notebook and the Sample PDF", "tpl": "t1", "where": "Start"},

    {"group": "Step 1", "label": "STEP 1 &middot; PART 1 OF 4: RUN IT AND SEE IT", "title": "Install the <span class=\"hl\">Libraries</span>", "plain": "Step 1. Install the Libraries", "tpl": "t3"},
    {"group": "Step 1", "label": "STEP 1 &middot; PART 2 OF 4: RUN IT AND SEE IT", "title": "Upload the Sample <span class=\"hl\">PDF</span>", "plain": "Step 1. Upload the Sample PDF", "tpl": "t4"},

    {"group": "Step 1", "label": "STEP 1 &middot; PART 4 OF 4: SEE IT", "title": "Ten Pages, Ten <span class=\"hl\">Dictionaries</span>", "plain": "Step 1. Ten Pages, Ten Dictionaries", "tpl": "t6", "cls": "end-slide"},
    {"group": "Step 2", "label": "STEP 2 &middot; PART 1 OF 4: RUN IT", "title": "Connect Your Notebook to <span class=\"hl\">Gemini</span>", "plain": "Step 2. Connect Your Notebook to Gemini", "tpl": "t7"},
    {"group": "Step 2", "label": "STEP 2 &middot; PART 2 OF 4: READ IT", "title": "Write the \"Same <span class=\"hl\">Document</span>?\" Function", "plain": "Step 2. Write the Same Document? Function", "tpl": "t8"},
    {"group": "Step 2", "label": "STEP 2 &middot; PART 3 OF 4: RUN IT", "title": "Test It on Pages 1 and <span class=\"hl\">2</span>", "plain": "Step 2. Test It on Pages 1 and 2", "tpl": "t9"},
    {"group": "Step 2", "label": "STEP 2 &middot; PART 4 OF 4: SEE IT", "title": "Two Separate <span class=\"hl\">Certificates</span>", "plain": "Step 2. Two Separate Certificates", "tpl": "t10", "cls": "end-slide"},
    {"group": "Step 3", "label": "STEP 3 &middot; PART 1 OF 3: READ IT", "title": "Write the Document Type <span class=\"hl\">Classifier</span>", "plain": "Step 3. Write the Document Type Classifier", "tpl": "t11"},
    {"group": "Step 3", "label": "STEP 3 &middot; PART 2 OF 3: RUN IT", "title": "Match the Answer to One <span class=\"hl\">Label</span>", "plain": "Step 3. Match the Answer to One Label", "tpl": "t12"},
    {"group": "Step 3", "label": "STEP 3 &middot; PART 3 OF 3: SEE IT", "title": "Page 3 Is a Packaging <span class=\"hl\">Specification</span>", "plain": "Step 3. Page 3 Is a Packaging Specification", "tpl": "t13", "cls": "end-slide"},
    {"group": "Step 4", "label": "STEP 4 &middot; PART 1 OF 2: RUN IT", "title": "Loop Through Every <span class=\"hl\">Page</span>", "plain": "Step 4. Loop Through Every Page", "tpl": "t14"},
    {"group": "Step 4", "label": "STEP 4 &middot; PART 2 OF 2: SEE IT", "title": "A Neat Little <span class=\"hl\">Map</span> of Your File", "plain": "Step 4. A Neat Little Map of Your File", "tpl": "t15", "cls": "end-slide"},
    {"group": "Step 5", "label": "STEP 5 &middot; RUN IT AND SEE IT", "title": "Turn Your Results into a <span class=\"hl\">Table</span>", "plain": "Step 5. Turn Your Results into a Table", "tpl": "t16", "cls": "end-slide"},
    {"group": "Step 6", "label": "STEP 6 &middot; RUN IT AND SEE IT", "title": "Keep a <span class=\"hl\">Human</span> in the Loop", "plain": "Step 6. Keep a Human in the Loop", "tpl": "t17", "cls": "end-slide"},
    {"group": "Done", "label": "DONE LOOKS LIKE", "title": "Check Your Final <span class=\"hl\">Output</span>", "plain": "Check Your Final Output", "tpl": "t18", "where": "Done", "cls": "end-slide"}
  ];
  var STAGE = { wide: [760, 1140], narrow: [450, 1256] };
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of this reading.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var sz = narrow ? STAGE.narrow : STAGE.wide;
    app.style.width = sz[0] + "px"; app.style.height = sz[1] + "px";
    var k = Math.min(window.innerWidth / sz[0], window.innerHeight / sz[1]);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  var GROUP_LABEL = { "Regex": "Find" };
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    var isStep = g.name.indexOf("Step ") === 0;
    b.type = "button"; b.className = "pg" + (isStep ? "" : " pg-fit");
    var shown = GROUP_LABEL[g.name] || g.name;
    b.setAttribute("aria-label", (g.name === "Regex" ? "Find Values" : shown) + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    var word = isStep ? '<span class="pg-word">Step </span>' + g.name.replace("Step ", "") : shown;
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + word + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span"), orig = label.textContent;
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = orig; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner' + (s.cls ? " " + s.cls : "") + '"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + document.getElementById(s.tpl).innerHTML + '</div>';
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(CELLS[b.getAttribute("data-copy")], b, pre); });
    });
    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.where || s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
    space();
    Array.prototype.forEach.call(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a slide. Spare height widens the gaps
     between blocks, up to 2x. */
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = ""; inner.style.marginTop = "";
    var cs = getComputedStyle(card);
    var avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var base = parseFloat(getComputedStyle(inner).rowGap) || 14;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (base + Math.min(base, spare / gaps)) + "px";
    /* P5 m2 fix round 1: what is still spare after the gaps widen is split above and below, so a short slide sits in
       the middle of the card instead of leaving one big empty area at the bottom */
    var left = avail - inner.offsetHeight;
    if (left > 1) inner.style.marginTop = Math.floor(left / 2) + "px";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    space();
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #slide=N opens slide N directly */
  var hm = location.hash.match(/slide=(\d+)/);
  if (hm) i = Math.min(SLIDES.length - 1, Math.max(0, +hm[1] - 1));
  window.addEventListener("resize", function () { scaleStage(); space(); });
  scaleStage();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
