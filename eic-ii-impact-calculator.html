<meta charset="utf-8">
<title>EIC Heritage Focus Area — Interactive Scale Calculator</title>
<style>
  :root{
    --bg:#FDF8F8; --navy:#001D69; --lav:#DCE1FF; --ink:#1C1B1B;
    --body:#484646; --line:#ECE6EE; --muted:#8A8693; --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex; justify-content:center; align-items:flex-start;
    overflow:hidden;
  }
  #wrapper{
    width:1000px; height:600px;
    transform-origin:top center;
  }
  .card{
    width:1000px; height:600px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:22px;
    padding:38px 44px 22px;
    display:grid;
    grid-template-rows:1fr auto;
    box-shadow:0 18px 44px rgba(0,29,105,0.06);
  }
  .body-grid{
    display:grid;
    grid-template-columns:410px 1fr;
    gap:44px;
    min-height:0;
  }

  /* ---------- LEFT COLUMN ---------- */
  .left{display:flex; flex-direction:column; min-width:0;}
  .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:2px;
    color:var(--muted); text-transform:uppercase;
  }
  .focus{
    margin-top:8px; font-size:22px; font-weight:700; color:var(--ink);
    line-height:1.2;
  }
  .headline{margin-top:20px; display:flex; align-items:flex-end; gap:12px;}
  .uptowrap{display:flex; flex-direction:column; align-items:flex-start;}
  .upto{
    font-size:13px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:1px; margin-bottom:2px;
  }
  #bigNumber{
    font-size:74px; font-weight:800; color:var(--navy);
    line-height:0.9; letter-spacing:-2px;
  }
  .unit{font-size:26px; font-weight:700; color:var(--navy); padding-bottom:8px;}
  .valuelabel{font-size:13px; color:var(--muted); margin-top:6px;}

  .badge{
    margin-top:16px; align-self:flex-start;
    background:var(--lav); color:var(--navy);
    font-size:14px; padding:8px 16px; border-radius:999px;
  }
  #badge b{font-weight:800;}
  .badge-sub{font-weight:600; color:#3a4a8f;}

  #takeaway{
    margin-top:18px; font-size:16px; line-height:1.55; color:var(--ink);
    max-width:392px;
  }
  #takeaway b{color:var(--navy);}

  .controls{margin-top:auto; padding-top:20px;}
  .ctrl-row{margin-bottom:16px;}
  .ctrl-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:9px;
  }
  .ctrl-label{font-size:12px; font-weight:700; letter-spacing:1px; color:var(--muted); text-transform:uppercase;}
  #yearReadout{font-size:20px; font-weight:800; color:var(--navy);}

  /* slider: lavender filled track, navy thumb */
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:8px; border-radius:999px;
    background:linear-gradient(90deg, var(--lav) 0%, var(--lav) var(--fill,0%), var(--line) var(--fill,0%), var(--line) 100%);
    outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:22px; height:22px; border-radius:50%;
    background:var(--navy); border:3px solid var(--white);
    box-shadow:0 2px 6px rgba(0,29,105,0.35); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%;
    background:var(--navy); border:3px solid var(--white);
    box-shadow:0 2px 6px rgba(0,29,105,0.35); cursor:pointer;
  }
  .scale-ticks{display:flex; justify-content:space-between; margin-top:7px; font-size:11px; color:var(--muted);}

  /* segmented growth control */
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .seg button{
    font:inherit; font-size:13px; font-weight:600;
    padding:8px 16px; border:none; background:var(--white); color:var(--body);
    cursor:pointer; border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--navy); color:var(--white);}

  /* ---------- RIGHT COLUMN ---------- */
  .right{position:relative; min-width:0; display:flex; align-items:center;}
  .chip{
    position:absolute; top:4px; right:6px;
    background:var(--bg); border:1px solid var(--line);
    color:var(--muted); font-size:11px; font-weight:700; letter-spacing:0.5px;
    padding:5px 12px; border-radius:999px; text-transform:uppercase;
  }
  svg{width:100%; height:auto; display:block;}

  /* ---------- FOOTER ---------- */
  .footer{
    border-top:1px solid var(--line); margin-top:14px; padding-top:12px;
    font-size:12px; color:var(--muted); line-height:1.4;
  }
</style>

<div id="wrapper">
  <div class="card">
    <div class="body-grid">

      <!-- LEFT -->
      <div class="left">
        <div class="eyebrow" id="eyebrow">FOCUS AREA · EIC HERITAGE</div>
        <div class="focus" id="focusArea">AI Data-Center Power Demand</div>

        <div class="headline">
          <div class="uptowrap">
            <span class="upto">up to</span>
            <span id="bigNumber">176</span>
          </div>
          <span class="unit" id="unit">TWh</span>
        </div>
        <div class="valuelabel" id="valueLabel">Electricity demand in the selected year</div>

        <div class="badge" id="badge"><b>up to 4.4%</b> <span class="badge-sub">of US electricity</span></div>

        <div id="takeaway"></div>

        <div class="controls">
          <div class="ctrl-row">
            <div class="ctrl-head">
              <span class="ctrl-label" id="driverLabel">Year</span>
              <span id="yearReadout">2023</span>
            </div>
            <input type="range" id="slider" min="2023" max="2030" step="1" value="2023">
            <div class="scale-ticks">
              <span>2023</span><span>2025</span><span>2028</span><span>2030</span>
            </div>
          </div>
          <div class="ctrl-row">
            <div class="ctrl-head"><span class="ctrl-label">Growth past 2028</span></div>
            <div class="seg" id="growth">
              <button data-g="conservative">Conservative</button>
              <button data-g="base" class="active">Base</button>
              <button data-g="aggressive">Aggressive</button>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="right">
        <div class="chip">Illustrative projection</div>
        <svg id="chart" viewBox="0 0 520 430" preserveAspectRatio="xMidYMid meet" aria-label="Projection chart"></svg>
      </div>

    </div>

    <div class="footer" id="footer"></div>
  </div>
</div>

<script>
/* =====================================================================
   STUDENT DATA  -  EDIT THIS BLOCK ONLY
   ---------------------------------------------------------------------
   Swap in your own focus area and your own two CITED anchor points.
   Everything on the page (headline number, % badge, sentence, chart)
   is drawn from the two anchors below, so you only edit numbers here.

   HOW THE MATH WORKS (deliberately simple and honest):
     - "anchors" are your two cited data points (year + value). The tool
       draws a straight line between them (linear interpolation) and,
       past the second anchor, extends that line gently.
     - "percentAnchors" are two cited context percentages (share of the
       denominator, here US electricity). Same straight-line treatment.
     - Everything shows "up to" language and is rounded, so the chart
       never implies more precision than your two sources support.
   ===================================================================== */
const DATA = {
  eyebrow:    "FOCUS AREA · EIC HERITAGE",
  focusArea:  "AI Data-Center Power Demand",
  unit:       "TWh",
  valueLabel: "Electricity demand in the selected year",

  // Slider (the "driver"): usually a year range.
  driverLabel: "Year",
  driverMin: 2023,
  driverMax: 2030,
  driverStep: 1,

  // >>> Your two CITED value anchors (the standout numbers) <<<
  anchors: [
    { year: 2023, value: 176 },   // cited: 2023 = 176 TWh
    { year: 2028, value: 580 }    // cited: 2028 = 580 TWh
  ],

  // >>> Your two CITED context percentages (share of US electricity) <<<
  percentAnchors: [
    { year: 2023, percent: 4.4 }, // cited: about 4.4% of US electricity
    { year: 2028, percent: 12  }  // cited: up to about 12% of US electricity
  ],

  // Chart y-axis top. Set a round number a bit above your largest value.
  yMax: 900,

  // Takeaway sentence. Tokens {value}, {percent}, {year} are filled live.
  takeaway: "By <b>{year}</b>, AI data centers could draw up to <b>{value} TWh</b>, about <b>{percent}</b> of all US electricity, most of it likely met by natural gas.",

  // One-line source + method note shown in the footer.
  source: "Source: LBNL / U.S. DOE; EIA, 2024. Straight-line interpolation between the cited 2023 and 2028 figures. Values past 2028 are illustrative, not forecasts."
};
/* ===================  END OF STUDENT DATA  =========================== */


/* ---------- derived constants (from the two anchors) ---------- */
var A0 = DATA.anchors[0], A1 = DATA.anchors[1];
var valSlope = (A1.value - A0.value) / (A1.year - A0.year);   // per year
var P0 = DATA.percentAnchors[0], P1 = DATA.percentAnchors[1];
var pctSlope = (P1.percent - P0.percent) / (P1.year - P0.year);
var SECOND_YEAR = A1.year;   // past this year we extrapolate + apply growth

var growthFactor = { conservative:0.5, base:1.0, aggressive:1.6 };
var currentGrowth = "base";

/* ---------- value + percent models ---------- */
function valueAt(year, growth){
  if (year <= SECOND_YEAR) return A0.value + valSlope * (year - A0.year);
  return A1.value + valSlope * growthFactor[growth] * (year - SECOND_YEAR);
}
function percentAt(year, growth){
  if (year <= SECOND_YEAR) return P0.percent + pctSlope * (year - P0.year);
  return P1.percent + pctSlope * growthFactor[growth] * (year - SECOND_YEAR);
}

/* ---------- honest formatting (no false precision) ---------- */
function fmtValue(v){ return Math.round(v).toLocaleString(); }
function fmtPercent(p){
  var r = Math.round(p * 10) / 10;                 // one decimal max
  var s = (r % 1 === 0) ? r.toFixed(0) : r.toFixed(1);
  return "up to " + s + "%";
}

/* ---------- chart geometry ---------- */
var SVG_NS = "http://www.w3.org/2000/svg";
var chart = document.getElementById("chart");
var PLOT = { left:52, right:504, top:24, bottom:372 };  // inside 520x430 viewBox
var xMin = DATA.driverMin, xMax = DATA.driverMax, yMax = DATA.yMax;

function xPos(year){ return PLOT.left + (year - xMin)/(xMax - xMin) * (PLOT.right - PLOT.left); }
function yPos(val){  return PLOT.bottom - (val / yMax) * (PLOT.bottom - PLOT.top); }

function el(name, attrs){
  var e = document.createElementNS(SVG_NS, name);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* ----- static axes + gridlines, drawn once ----- */
function drawAxes(){
  var g = el("g", {});
  var steps = 3;
  for (var i = 0; i <= steps; i++){
    var val = yMax * i / steps;
    var y = yPos(val);
    g.appendChild(el("line", { x1:PLOT.left, y1:y, x2:PLOT.right, y2:y,
      stroke:"#ECE6EE", "stroke-width":1 }));
    var t = el("text", { x:PLOT.left - 10, y:y + 4, "text-anchor":"end",
      "font-size":11, fill:"#8A8693" });
    t.textContent = Math.round(val).toLocaleString();
    g.appendChild(t);
  }
  var cap = el("text", { x:PLOT.left - 10, y:PLOT.top - 8, "text-anchor":"start",
    "font-size":10, fill:"#8A8693", "letter-spacing":"1" });
  cap.textContent = DATA.unit;
  g.appendChild(cap);
  for (var yr = xMin; yr <= xMax; yr++){
    var x = xPos(yr);
    var lt = el("text", { x:x, y:PLOT.bottom + 20, "text-anchor":"middle",
      "font-size":11, fill:"#8A8693" });
    lt.textContent = yr;
    g.appendChild(lt);
  }
  chart.appendChild(g);
}

/* ----- dynamic layer ----- */
var dyn = el("g", {});
chart.appendChild(dyn);

function redraw(){
  var year = parseInt(document.getElementById("slider").value, 10);
  var g = currentGrowth;

  // projected line across whole integer year range
  var pts = [];
  for (var yr = xMin; yr <= xMax; yr++){
    pts.push({ x: xPos(yr), y: yPos(valueAt(yr, g)) });
  }
  var linePath = pts.map(function(p, i){ return (i===0?"M":"L") + p.x.toFixed(1) + " " + p.y.toFixed(1); }).join(" ");
  var areaPath = linePath + " L" + pts[pts.length-1].x.toFixed(1) + " " + PLOT.bottom +
                 " L" + pts[0].x.toFixed(1) + " " + PLOT.bottom + " Z";

  while (dyn.firstChild) dyn.removeChild(dyn.firstChild);

  dyn.appendChild(el("path", { d:areaPath, fill:"#DCE1FF", opacity:"0.55", stroke:"none" }));
  dyn.appendChild(el("path", { d:linePath, fill:"none", stroke:"#001D69",
    "stroke-width":3, "stroke-dasharray":"7 5", "stroke-linecap":"round", "stroke-linejoin":"round" }));

  // moving guide + dot at current slider year
  var mx = xPos(year), my = yPos(valueAt(year, g));
  dyn.appendChild(el("line", { x1:mx, y1:PLOT.top, x2:mx, y2:PLOT.bottom,
    stroke:"#8A8693", "stroke-width":1, "stroke-dasharray":"3 4", opacity:"0.5" }));
  dyn.appendChild(el("circle", { cx:mx, cy:my, r:9, fill:"#DCE1FF" }));
  dyn.appendChild(el("circle", { cx:mx, cy:my, r:5, fill:"#001D69", stroke:"#FFFFFF", "stroke-width":2 }));

  // CITED anchor points as solid dots, on top
  DATA.anchors.forEach(function(a){
    var ax = xPos(a.year), ay = yPos(a.value);
    dyn.appendChild(el("circle", { cx:ax, cy:ay, r:6, fill:"#001D69", stroke:"#FFFFFF", "stroke-width":2 }));
    var lbl = el("text", { x:ax, y:ay - 14, "text-anchor":"middle",
      "font-size":11, "font-weight":"700", fill:"#001D69" });
    lbl.textContent = a.year + " cited";
    dyn.appendChild(lbl);
  });

  // update left-column readouts
  var val = valueAt(year, g), pct = percentAt(year, g);
  document.getElementById("bigNumber").textContent = fmtValue(val);
  document.getElementById("badge").innerHTML =
    "<b>" + fmtPercent(pct) + "</b> <span class='badge-sub'>of US electricity</span>";
  document.getElementById("takeaway").innerHTML = DATA.takeaway
    .replace("{year}", year)
    .replace("{value}", fmtValue(val))
    .replace("{percent}", fmtPercent(pct));
  document.getElementById("yearReadout").textContent = year;

  // slider fill
  var pctFill = (year - xMin) / (xMax - xMin) * 100;
  document.getElementById("slider").style.setProperty("--fill", pctFill + "%");
}

/* ---------- wire up static text from DATA ---------- */
document.getElementById("eyebrow").textContent = DATA.eyebrow;
document.getElementById("focusArea").textContent = DATA.focusArea;
document.getElementById("unit").textContent = DATA.unit;
document.getElementById("valueLabel").textContent = DATA.valueLabel;
document.getElementById("driverLabel").textContent = DATA.driverLabel;
document.getElementById("footer").textContent = DATA.source;
(function(){
  var s = document.getElementById("slider");
  s.min = DATA.driverMin; s.max = DATA.driverMax; s.step = DATA.driverStep; s.value = DATA.driverMin;
})();

/* ---------- events ---------- */
document.getElementById("slider").addEventListener("input", redraw);
document.getElementById("growth").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  currentGrowth = b.getAttribute("data-g");
  Array.prototype.forEach.call(this.querySelectorAll("button"), function(x){ x.classList.remove("active"); });
  b.classList.add("active");
  redraw();
});

/* ---------- scale-to-fit (never scroll) ---------- */
var W = 1000, H = 600, wrap = document.getElementById("wrapper");
function fit(){
  var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
  wrap.style.transform = "scale(" + s + ")";
}
window.addEventListener("resize", fit);

/* ---------- init ---------- */
drawAxes();
redraw();
fit();
</script>
