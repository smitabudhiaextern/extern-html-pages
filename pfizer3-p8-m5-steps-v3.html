<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P8 Run the Full Document Chatbot Steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap">
<style>
/* P8 Step 2 m5, "Try It Yourself": run Chaitanya's notebook "Full RAG Gradio" (Drive 1meectpZrzJ_lYilMDBuUV9Je1_Wy-hvL)
   on P7's blob PDF (pharma-blob-sample.pdf), STEP 1 to STEP 11, then use the app. Built by m5-steps-build.py
   (06-content/project-08/source/). Shell copied from the P5 m4 Try deck. Text is his notebook's STEP comments and his
   reading 1fb1 (swaps in coverage-m5.md). Colab pictures fill SLOTs from images/pfizer3-p8-m5-try-<id>.png; a missing
   one shows a pending box. Fixed stage 760 x 1190 (frames under 560 px wide: 450 x 1300), scaled as one piece so nothing
   scrolls. Look: Pfizer x Extern Core, Light format; every color, size, radius and font comes from design-system/tokens.json. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* The design stage, scaled and centred by the script at the end */
.app{position:absolute;left:50%;top:50%;width:760px;height:1190px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: step rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:13px;font-weight:500;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}
.narrow .top{grid-template-columns:minmax(0,1fr);row-gap:8px}
.narrow .where{order:0}
.narrow .pg-word{display:none}
.narrow .pg.pg-fit{flex:none}

/* Slide area and slide */
.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}
.narrow .stage{padding:10px 0}
.narrow .card{padding:18px 16px;border-left:0;border-right:0;border-radius:0}
.inner{flex:none;display:flex;flex-direction:column;gap:var(--space-3);width:100%}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding-bottom:3px;color:var(--ink);text-wrap:balance}
.narrow .title{font-size:28px;line-height:34px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:15px;line-height:22px;color:var(--ink);text-wrap:pretty}
.p b{font-weight:600}
.p code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.p code.nw,.list code.nw{white-space:nowrap}
.list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:22px;text-wrap:pretty}
.list b{font-weight:600}
.list code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.list li::marker{color:var(--step-label);font-weight:600}
.see{margin-top:4px}

/* Buttons (design system Button, Light) */
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* Run card: a notebook cell (no Copy button: the cells are already in the notebook), or the one cell students add (Copy button) */
.run{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin:0}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:6px 8px 6px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:12px 14px;font-family:var(--font-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out{border-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:6px 12px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}
.narrow .run pre{font-size:13px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.narrow .run.out pre{font-size:12px}

/* The Colab screenshot: the full width of the card (edge to edge), opens full size in a new tab.
   Under 560 px the card itself runs edge to edge, so the picture is as wide as the frame. */
.shot{margin:0 calc(-1 * var(--space-5));border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;line-height:0;background:var(--surface)}
.narrow .shot{margin:0 -16px}
.shot a{display:block}
.shot img{display:block;width:100%;height:auto}
.shot-cap{margin:-6px 0 0;font-size:13px;line-height:18px;color:var(--gray-600)}

/* A picture of the page (slide 14: the table in foo.pdf): framed like the output blocks, as wide as the text */
.pagepic{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;line-height:0;background:var(--surface)}
.pagepic a{display:block}
.pagepic img{display:block;width:100%;height:auto}

/* Table and analysis box (from the Learn deck) */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.4}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:6px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--card-text)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.m{font-family:var(--font-mono);font-size:13px;color:var(--ink);white-space:nowrap}
.tbl td code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .tbl table{font-size:13px}
.narrow .tbl td,.narrow .tbl th{padding:5px 8px}
.concl{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px;font-size:15px;line-height:22px;color:var(--card-text)}
.concl b{font-weight:600;color:var(--card-title)}
.concl p{margin:0}
.concl p + p{margin-top:6px}
.concl code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}


/* A smaller code font for the long function in Step 3 (from the 11 November module 9 steps deck) */
.run.small pre{font-size:12px;line-height:1.32;padding:8px 14px}
.narrow .run.small pre{font-size:10.5px;line-height:1.35}

/* Tip box (from the 11 November module 9 Learn deck): pale-blue card, Pfizer blue bulb in a white square */
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px}
.tip-icon{flex:none;width:30px;height:30px;border-radius:var(--radius-xs);background:var(--surface);display:grid;place-items:center;color:var(--pfizer-blue)}
.tip-icon svg{width:18px;height:18px}
.tip p{margin:0;font-size:15px;line-height:22px;color:var(--card-text);text-wrap:pretty}
.tip b{font-weight:600;color:var(--card-title)}

/* Last slide: his closing line and Key Takeaway (takeaway box copied from the module 7 cheat sheet slide) */
.inner.end-slide{gap:var(--space-4)}
.end-slide .p{font-size:17px;line-height:1.55}
.take{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:14px 18px;font-size:17px;line-height:1.55;color:var(--card-text)}
.take b{font-weight:700;color:var(--card-title)}
.take code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .take{font-size:15px;padding:12px 16px}
.narrow .end-slide .p{font-size:16px}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:22px;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.foot .btn{padding:10px 16px;font-size:15px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
.narrow .upnext{visibility:hidden}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }

/* Added for P4 module 2 (copied from the P3 module 8 Try deck): "now holds" note, the SME's callout box, the Quick Recap size */
.holds{margin:0;display:flex;align-items:center;gap:8px;background:var(--surface-card);border-left:4px solid var(--pfizer-blue);border-radius:var(--radius-xs);padding:7px 12px;font-size:14px;line-height:20px;font-weight:600;color:var(--card-title)}
.holds code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px}
.holds svg{width:16px;height:16px;flex:none;color:var(--pfizer-blue)}
.note{border:1.5px solid var(--ink);border-radius:var(--radius-sm);padding:9px 14px}
.note .num{display:block;margin-bottom:3px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.note p{margin:0;font-size:15px;line-height:1.48;color:var(--ink-muted)}
.note b{font-weight:600;color:var(--ink)}
.recap-slide .list{font-size:17px;line-height:1.55;gap:14px}
.recap-slide .list ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.recap-slide .list ul li::marker{color:var(--ink-muted)}
.narrow .recap-slide .list{font-size:15.5px;gap:10px}
/* Many steps in the rail: numbers only */
.pg-word{display:none}
.pg-label{text-align:center}
.pg.pg-fit{flex:none}
.pg.pg-fit .pg-label{text-align:left}
/* Under 560 px there is no room for the 7 group labels: the rail shows only the progress bars, and "Step N" sits beside the count */
.narrow .pg-label{display:none}
.narrow .pg.pg-fit{flex:1 1 0}
/* Code and output: Project 3's size (fix pass, 22 November 2026: 14 px on the 760 stage, 13 px at the 708 px column; 13 px on
   the narrow stage). Long lines wrap, so nothing scrolls; long cells and outputs are cut over more slides instead */
.run pre{white-space:pre-wrap;overflow-wrap:anywhere}
.run.out pre{font-size:14px;line-height:1.5}
.narrow .run pre,.narrow .run.out pre{font-size:13px}
/* F02: zoomed crops of one strip of the page, before and after a step */
.zoom{margin:0;display:flex;flex-direction:column;gap:6px}
.zoom a{display:block;line-height:0}
.zoom img{display:block;height:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--radius-xs)}
/* The STEP 15 JSON: the 3 heading lines across the top, the JSON in two columns (same text, same order) */
.run.out.json pre.head{padding-bottom:0}
.run.out.json pre.cols{column-count:2;column-gap:24px;padding-top:4px}
.narrow .run.out.json pre.cols{column-gap:12px;font-size:10.5px}
/* A page picture from Colab (tall): shown smaller and centred, so the slide stays short; opens full size */
.shot.tall{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.shot.tall img{width:auto;max-width:100%;height:var(--pic-h,480px);margin:0 auto}
.narrow .shot.tall{margin:0}
.narrow .shot.tall img{height:var(--pic-hn,520px)}
/* q3 Proposal A: two Colab page pictures side by side (STEP 6 + 7, STEP 8 + 9), each with its own notes under it */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.half{display:flex;flex-direction:column;gap:8px;min-width:0}
.half-head{margin:0;font-size:13px;line-height:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label)}
.half .p{margin:0}
.half .list{font-size:14.5px;line-height:1.45;gap:4px}
.half code{overflow-wrap:anywhere}
.pair-slide .shot.tall img{width:auto;height:auto;max-width:100%;max-height:330px}
.narrow .pair{gap:10px}
.narrow .pair-slide .shot.tall img{height:auto;max-height:300px}
.narrow .half .list{font-size:13.5px}
.pic-sm .shot.tall img{height:435px}

.run pre code{display:block}
.run pre .ln{display:block;padding-left:calc(var(--i) + 2ch);text-indent:calc(-1 * (var(--i) + 2ch))}
.run pre .ln:empty::before{content:"\200b"}
.shot.pic{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm)}
.shot.pic img{width:auto;max-width:100%;max-height:var(--pic-max,500px);margin:0 auto}
.narrow .shot.pic img{max-height:var(--pic-max-n,360px)}
.p a{color:var(--pfizer-blue);text-underline-offset:2px}
.list a{color:var(--pfizer-blue);text-underline-offset:2px}
.p code,.list code,.tip code,.note code{font-family:var(--font-mono);font-size:.9em;overflow-wrap:anywhere}
/* Pending Colab picture: same height the picture may take, so the slide's size is already tested */
.pending{flex:none;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:6px;
  border:2px dashed var(--ink-muted);border-radius:var(--radius-sm);background:var(--gray-50);padding:12px 16px;overflow:hidden}
.narrow .pending{height:var(--hn) !important}
.pending b{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--ink)}
.pending span{font-size:13px;line-height:18px;color:var(--ink-muted)}
.shotrow{flex:none;display:flex;gap:10px;justify-content:center;align-items:flex-start}
.shotrow .shot.pic{flex:0 1 auto;min-width:0}
.shotrow .pending{flex:1 1 0}
.rail{gap:3px}
.pg{padding:4px 0 2px}
.pg-label{overflow:visible;text-overflow:clip;font-size:12px;letter-spacing:-.02em}
</style>
</head>

<div class="app" id="app">
  <h1 class="sr-only">Run the Full Document Chatbot on the Blob PDF: The Steps</h1>
  <header class="top">
    <nav class="rail" id="rail" aria-label="Steps"></nav>
    <div class="where"><b id="where-section">Start</b><span aria-hidden="true">&middot;</span><span id="where-count">Slide 1</span></div>

  <main class="stage" aria-label="Slide"><section class="card" id="card" aria-live="polite"></section></main>

    <button type="button" class="btn btn-secondary" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-primary" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>


<template id="t1">
<p class="p">You can refer to the linked Colab notebook for the full code and walkthrough of this process.</p><div class="links"><a class="btn btn-secondary" href="https://colab.research.google.com/drive/1-jkP5KzRS0Ye1Es_1I5R3hWiVdiE_HTs" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Full RAG Gradio (Pfizer 3.0) (Colab notebook)</span><span class="sr-only"> (opens in a new tab)</span></a><a class="btn btn-secondary" href="https://drive.google.com/file/d/1fJ7DszcjB_TerDTAhXfAw74VqJBElTyw/view?usp=sharing" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5.25 2.75h6.5l3 3v11.5h-9.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M11.75 2.75v3h3M10 9v5.5M7.75 12.25 10 14.5l2.25-2.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>The blob PDF (pharma-blob-sample.pdf)</span><span class="sr-only"> (opens in a new tab)</span></a></div><div class="note"><span class="num">TWO LINES CHANGED</span><p>This is a copy of the team's notebook with two lines changed, because on today's Colab they broke. STEP 1 also installs <code>pytesseract</code>: without it, a scanned page fails with <code>OCR failed - No module named 'pytesseract'</code>. STEP 7 removes the code fence (the <code>```json</code> marks Gemini puts around its answer) before reading the answer: without that, every question printed <code>Query routing error: Expecting value: line 1 column 1 (char 0)</code> and searched every document.</p></div><ol class="list"><li>Open the notebook and click <b>File &rarr; Save a copy in Drive</b>. Work in the copy that opens.</li><li>Open the blob PDF. It opens in a Google Drive preview: click the <b>Download</b> button (the arrow at the top right) to save it to your computer. You'll upload it into the app at the end.</li><li>Check that your Gemini key is saved in Colab Secrets as <code>GEMINI_API_KEY</code>. You already did this in Project 5.</li><li>Every cell is already written. Run them in order, from top to bottom, and press <b>Run</b> on each one when a slide asks you to.</li></ol><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p>This is the same 10-page blob PDF you split in Project 7. Here you run the team's finished app on it with Gemini. In the Task, you'll build your own version with a different model.</p></div>

h named fields, such as <code>page_num</code> and <code>text</code>. <code>Optional[str]</code> means the field holds text or nothing, and <code>List[...]</code> means a list. You run this cell. You don't need to write it.</p></div>

ing in STEP 5.</p><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p>You built page classification and boundary detection in Project 7. These are the same two ideas, as two functions the app calls for you.</p></div>

/code> is in STEP 9.</p><p class="p">OCR (optical character recognition) means reading the words from a picture of a page. The blob PDF already has text on every page, so the app doesn't need it here.</p>

<template id="t7">
<p class="p">Press <b>Run</b> on the STEP 6 cell (its heading says <code class="nw"># STEP 6</code>).</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; the comment at the top of the STEP 6 cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Breaking each LogicalDocument into smaller overlapping text chunks and</span><span class="ln" style="--i:0ch"># attaching rich metadata (document type, page range, chunk index) to each</span><span class="ln" style="--i:0ch"># one. Two approaches are provided: a custom sliding-window chunker and a</span><span class="ln" style="--i:0ch"># LlamaIndex SentenceSplitter that respects sentence boundaries.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Language models and vector search work best with short focused text</span><span class="ln" style="--i:0ch"># segments rather than entire documents. Overlapping chunks (100-word</span><span class="ln" style="--i:0ch"># overlap) prevent important information from being split across chunk</span><span class="ln" style="--i:0ch"># boundaries. Preserving metadata on every chunk ensures that when a chunk</span><span class="ln" style="--i:0ch"># is retrieved, we can tell the user exactly which document type and page</span><span class="ln" style="--i:0ch"># it came from -- essential for pharmaceutical compliance traceability.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output when this cell runs. When process_all_documents() is called</span><span class="ln" style="--i:0ch"># during PDF processing you will see lines like:</span><span class="ln" style="--i:0ch">#   Certificate Of Quality: Created 3 chunks</span><span class="ln" style="--i:0ch">#   Packaging Specification: Created 2 chunks</span></code></pre></figure><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p>You already know chunk size and overlap from Project 5. Here each chunk is up to 500 words, and neighbouring chunks share 100 words. The app uses the first of the two approaches, the custom chunker.</p></div>
</template>

that quickly finds the stored vectors closest to your question.</p><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p>You already routed questions to a document type in Project 7. Here the app does it before every search.</p></div>

<template id="t9">
<p class="p"><b>Step-by-Step: How the “Brain” Works</b></p><p class="p"><b>Step 1: Retrieve Relevant Chunks.</b> You'll start by retrieving the most relevant chunks from your document index using semantic similarity. This ensures the chatbot only looks at the most useful parts of the document before answering a question.</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; the part of the cell this step explains</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">def retrieve(self, query: str, k: int = 4,</span><span class="ln" style="--i:13ch">             filter_doc_type: Optional[str] = None,</span><span class="ln" style="--i:13ch">             auto_route: bool = True) -&gt; List[Tuple[ChunkMetadata, float]]:</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;</span><span class="ln" style="--i:4ch">    Retrieve relevant chunks with optional filtering and routing.</span><span class="ln" style="--i:4ch">    Returns chunks with relevance scores.</span><span class="ln" style="--i:4ch">    &quot;&quot;&quot;</span></code></pre></figure><p class="p">To find it in your notebook, click a blank spot outside the cells, press Ctrl+F (Cmd+F on a Mac) and type <code>def retrieve</code>.</p><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p><b>How to read this line:</b> <code>self</code> means the function belongs to the retriever. <code>k: int = 4</code> means it fetches 4 chunks unless you ask for another number. The part after <code>-&gt;</code> says what comes back: a list of chunks, each with its score.</p></div>
</template>

<template id="t10">
<p class="p">Press <b>Run</b> on the STEP 8 cell (its heading says <code class="nw"># STEP 8</code>).</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; the comment at the top of the STEP 8 cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Defining generate_answer_with_sources(), which takes the top-k retrieved</span><span class="ln" style="--i:0ch"># chunks and sends them to Gemini as context, asking it to answer the user&#x27;s</span><span class="ln" style="--i:0ch"># question using only that context. The function returns the answer text, a</span><span class="ln" style="--i:0ch"># list of source citations (document type, page range, relevance score),</span><span class="ln" style="--i:0ch"># and an overall confidence score derived from the retrieval scores.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Pharmaceutical documentation must be traceable. Simply generating an</span><span class="ln" style="--i:0ch"># answer without citing which document and page it came from would not meet</span><span class="ln" style="--i:0ch"># compliance standards. By injecting &quot;[From Certificate Of Quality, Pages</span><span class="ln" style="--i:0ch"># 2-3]&quot; labels into the context prompt, we encourage Gemini to ground its</span><span class="ln" style="--i:0ch"># answer in the actual source material and to tell the user where to verify</span><span class="ln" style="--i:0ch"># the information.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output when this cell runs. After a user submits a question in the</span><span class="ln" style="--i:0ch"># Gradio interface the answer will appear in the chat panel along with</span><span class="ln" style="--i:0ch"># source citations and a confidence percentage.</span></code></pre></figure><p class="p">The next three slides walk through this cell, one part at a time, the same way the team's reading does. You don't run anything else for them.</p>
</template>

<template id="t11">
<p class="p"><b>Step 2: Handle Empty Results.</b> Before doing anything else, you check if the retrieval step returned any results. If the list is empty, you stop and return a polite message letting the user know that it couldn't find an answer.</p><p class="p">This prevents wasting time building a prompt or calling the LLM if there's no useful information in the document.</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; the part of the cell this step explains</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">if not retrieved_chunks:</span><span class="ln" style="--i:4ch">    return {</span><span class="ln" style="--i:8ch">        &#x27;answer&#x27;: &quot;I couldn&#x27;t find relevant information to answer your question.&quot;,</span><span class="ln" style="--i:8ch">        &#x27;sources&#x27;: [],</span><span class="ln" style="--i:8ch">        &#x27;confidence&#x27;: 0.0</span><span class="ln" style="--i:4ch">    }</span></code></pre></figure><p class="p"><b>Step 3. Build the Context and Source list.</b> You go through the top-matching text chunks and start building the “context” for the LLM: this is what the model will read before answering. You also collect helpful source info for each chunk to display later.</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; the part of the cell this step explains</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">context_parts = []</span><span class="ln" style="--i:0ch">sources = []</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">for chunk_meta, score in retrieved_chunks:</span><span class="ln" style="--i:4ch">    context_parts.append(f&quot;[From {chunk_meta.doc_type}, Pages {chunk_meta.page_start}-{chunk_meta.page_end}]&quot;)</span><span class="ln" style="--i:4ch">    context_parts.append(chunk_meta.text)</span><span class="ln" style="--i:4ch">    context_parts.append(&quot;&quot;)</span></code></pre></figure><p class="p">This keeps the model focused and prevents hallucinations by telling it, <i>“Only answer using this text, and here's where it came from.”</i></p><p class="p">To find it in your notebook, click a blank spot outside the cells, press Ctrl+F (Cmd+F on a Mac) and type <code>if not retrieved_chunks</code>.</p>
</template>

<template id="t12">
<p class="p"><b>Step 4: Create the LLM prompt.</b> Now that you've gathered the chunks, you combine them with the user's question and write a clear prompt. This prompt gives the LLM context, the question, and instructions on how to respond.</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; the part of the cell this step explains</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">prompt = f&quot;&quot;&quot;</span><span class="ln" style="--i:0ch">You are a helpful AI assistant...</span><span class="ln" style="--i:0ch">&quot;&quot;&quot;</span></code></pre></figure><p class="p">This string gives the model all the info it needs:</p><ul class="list"><li>Here's the document info</li><li>Here's the question</li><li>Only use this info</li><li>Cite your sources</li></ul><p class="p">In your notebook, the full prompt starts with <code>You are answering questions about pharmaceutical documentation</code>.</p><p class="p"><b>Step 5: Ask the Model.</b> You send the prompt to an LLM. In our example, it's Gemini:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; the part of the cell this step explains</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">response = gemini_model.generate_content(prompt)</span><span class="ln" style="--i:0ch">answer = response.text.strip()</span></code></pre></figure><p class="p">Using Groq? Use <code>answer = call_llm(prompt)</code> instead.</p><p class="p">To find it in your notebook, click a blank spot outside the cells, press Ctrl+F (Cmd+F on a Mac) and type <code>You are answering questions</code>.</p>
</template>

<template id="t13">
<p class="p"><b>Step 6: Calculate Confidence.</b> Take the average of all the similarity scores from the retrieved chunks. This number gives us a rough idea of how strong the connection is between the answer and the original document.</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; the part of the cell this step explains</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">avg_score = sum(s for _, s in retrieved_chunks) / len(retrieved_chunks)</span></code></pre></figure><p class="p">It helps users know how closely the found chunks match the question. A higher score means the answer was based on more relevant content.</p><p class="p"><b>Step 7: Return the full response.</b> You then return:</p><ul class="list"><li>The final answer</li><li>The document sources it came from</li><li>How confident the system is</li><li>How many chunks were used</li></ul><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; the part of the cell this step explains</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">return {</span><span class="ln" style="--i:4ch">    &#x27;answer&#x27;: answer,</span><span class="ln" style="--i:4ch">    &#x27;sources&#x27;: sources,</span><span class="ln" style="--i:4ch">    &#x27;confidence&#x27;: avg_score,</span><span class="ln" style="--i:4ch">    &#x27;chunks_used&#x27;: len(retrieved_chunks)</span><span class="ln" style="--i:0ch">}</span></code></pre></figure><p class="p">To find it in your notebook, click a blank spot outside the cells, press Ctrl+F (Cmd+F on a Mac) and type <code>avg_score = sum</code>.</p>
</template>

<template id="t22">
<p class="p"><b>1. Retrieval Powers the Chatbot's “Memory.”</b><br>Your retrieval function pulls the most relevant chunks based on the user's question: these become the context for the LLM.</p><p class="p"><b>2. Prompting Transforms Context into Answers</b><br>You created a prompt that embeds the retrieved chunks and routes them to an LLM, like Gemini, for natural language output.</p><p class="p"><b>3. Wiring It All Together in Gradio</b><br>The chatbot interface was built using Gradio Blocks. The <code>chat_handler()</code> connects the UI to your backend logic, handling messages, retrieval, and response display.</p><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p><b>Key Takeaway:</b> This structure, retrieval &rarr; prompt &rarr; response, is the heart of any RAG chatbot. By keeping each part modular, you can easily upgrade models, modify prompts, or enhance logic without touching the UI.</p></div><p class="p">Next, scroll down to If You're Stuck if anything went wrong.</p>

    {"group": "Use the App", "label": "SEE IT &middot; PART 2 OF 4", "title": "See How the App Split the <span class=\"hl\">File</span>", "plain": "Use the App. See How the App Split the File (Part 2 of 4)", "tpl": "t18"},
    {"group": "Use the App", "label": "SEE IT &middot; PART 3 OF 4", "title": "Ask Questions and Read the <span class=\"hl\">Sources</span>", "plain": "Use the App. Ask Questions (Part 3 of 4)", "tpl": "t19"},
    {"group": "Use the App", "label": "SEE IT &middot; PART 4 OF 4", "title": "Search One Kind of <span class=\"hl\">Document</span>", "plain": "Use the App. Search One Kind of Document (Part 4 of 4)", "tpl": "t20"},
    {"group": "Done", "label": "WHAT YOU JUST RAN", "title": "Get the Best <span class=\"hl\">Answers</span>", "plain": "What You Just Ran: Get the Best Answers", "tpl": "t21", "where": "Done", "cls": "end-slide"},
    {"group": "Done", "label": "QUICK RECAP", "title": "Retrieve, Prompt, <span class=\"hl\">Respond</span>", "plain": "Quick Recap: Retrieve, Prompt, Respond", "tpl": "t22", "where": "Done", "cls": "end-slide"}
  ];
  var STAGE = { wide: [760, 1190], narrow: [450, 1300] };
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of this reading.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var sz = narrow ? STAGE.narrow : STAGE.wide;
    app.style.width = sz[0] + "px"; app.style.height = sz[1] + "px";
    var k = Math.min(window.innerWidth / sz[0], window.innerHeight / sz[1]);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  var GROUP_LABEL = { "Regex": "Find" };
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    var isStep = g.name.indexOf("Step ") === 0;
    b.type = "button"; b.className = "pg" + (isStep ? "" : " pg-fit");
    var shown = GROUP_LABEL[g.name] || g.name;
    b.setAttribute("aria-label", (g.name === "Regex" ? "Find Values" : shown) + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    var word = isStep ? '<span class="pg-word">Step </span>' + g.name.replace("Step ", "") : shown;
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + word + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span"), orig = label.textContent;
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = orig; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner' + (s.cls ? " " + s.cls : "") + '"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + document.getElementById(s.tpl).innerHTML + '</div>';
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(CELLS[b.getAttribute("data-copy")], b, pre); });
    });
    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.where || s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
    space();
    Array.prototype.forEach.call(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a slide. Spare height widens the gaps
     between blocks, up to 2x. */
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = ""; inner.style.marginTop = "";
    var cs = getComputedStyle(card);
    var avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var base = parseFloat(getComputedStyle(inner).rowGap) || 14;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (base + Math.min(base, spare / gaps)) + "px";
    /* P5 m2 fix round 1: what is still spare after the gaps widen is split above and below, so a short slide sits in
       the middle of the card instead of leaving one big empty area at the bottom */
    var left = avail - inner.offsetHeight;
    if (left > 1) inner.style.marginTop = Math.floor(left / 2) + "px";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    space();
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #slide=N opens slide N directly */
  var hm = location.hash.match(/slide=(\d+)/);
  if (hm) i = Math.min(SLIDES.length - 1, Math.max(0, +hm[1] - 1));
  window.addEventListener("resize", function () { scaleStage(); space(); });
  scaleStage();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
</body>
