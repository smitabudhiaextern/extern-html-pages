<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Say What You Did</title>
<!--
  vCISO P5 Step 3, Module 9 (How to Talk About This Work, and Open Your
  Predictions), interactive: Say What You Did.
  Built from the Extern deck shell, matched to the house look of
  09-assets/final/vciso-p5-m1-whats-missing-from-the-deck.html and
  vciso-p5-m4-defend-your-ranking.html (which match P3 Step 1).
  Governing authority: output/programs/vciso/VCISO-STYLE-GUIDE.md section 6.
  Source: Doc from SME/P5 Sample Pack/Interactive content sets - P5.md, P5-9.
  The three sentences and their verdicts are Chaitanya's words. Sentence 3's
  dash became a colon; the verdicts' dashes and semicolon became a full stop.
  No other words change.

  Spec rules kept here:
  - Two slides: the pick, then the reveal.
  - One pick only. Check stays disabled until a sentence is picked. No retry:
    once Check is pressed the pick locks (Start again clears everything).
  - The reveal shows all three verdicts at once. Sentence 3 is marked with a
    filled style, a tick icon and its label, never colour alone. The
    student's own pick carries a neutral "Your pick" tag. No score, no praise.
  - Not on screen, because the module prose carries it: the honesty rule,
    the two-minute version, the jobs, the tool answer, the predictions.
  - No storage: a reload starts clean.

  Verify before shipping, both gates, every time:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs   this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  /* ===============================================================
     The palette. The Extern five, plus the vCISO per-slide tint ramp
     (VCISO-STYLE-GUIDE.md 6b, listed in 09-assets/deck-palette.json).
     Tint carries no meaning. Every tint of navy is an rgba() of
     #001D69. No state is ever signalled by colour alone: every
     coloured state also carries a glyph or a label.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, borders, fills      */
    --bg:#FDF8F8;           /* canvas background, and text on navy */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}

  /* ---- the 960x540 canvas, scaled down only, never up ---- */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:12px}

  /* ---- the board ---- */
  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}

  svg.ic{width:28px;height:28px;flex:0 0 auto;fill:none;stroke:var(--on-highlight);stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}

  .leadbar{flex:0 0 auto;background:var(--highlight);border-left:5px solid var(--on-highlight);border-radius:0 10px 10px 0;
    padding:12px 18px;display:flex;align-items:flex-start;gap:14px}
  .leadbar svg.ic{width:30px;height:30px;margin-top:1px}
  .leadbar p{font-size:18px;line-height:1.42;color:var(--title)}
  .leadbar p b{font-weight:600}

  /* ---- slide 1: three sentences, one pick ---- */
  .ans-col{flex:0 0 auto;display:flex;flex-direction:column;gap:10px}
  button.ans{font-family:inherit;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:14px;min-height:54px;padding:9px 16px;
    background:var(--bg);color:var(--title);border:2px solid var(--on-highlight);border-radius:10px;
    transition:background var(--t-fast) var(--ease-out),color var(--t-fast) var(--ease-out),opacity var(--t-fast) var(--ease-out)}
  button.ans:hover:not(:disabled):not(.is-pick){background:var(--highlight)}
  button.ans:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.ans:disabled{cursor:default}
  .bk{flex:0 0 auto;width:30px;height:28px;border-radius:6px;border:1.5px solid var(--on-highlight);
    background:var(--highlight);font-size:15px;font-weight:600;color:var(--on-highlight);
    display:flex;align-items:center;justify-content:center}
  button.ans .al{flex:1 1 auto;font-size:17px;font-weight:600;line-height:1.36}
  .tg{flex:0 0 auto;font-size:13px;font-weight:600;white-space:nowrap}
  /* The pick: filled navy, a dot and the words "Your pick". A dot, not a
     tick: nothing is marked until Check. */
  button.ans.is-pick{background:var(--on-highlight);color:var(--bg)}
  button.ans.is-pick .bk{background:var(--bg);border-color:var(--bg)}
  button.ans.is-other{opacity:.45}

  /* ---- slide 2: the reveal, a verdict under each sentence ---- */
  .vcol{flex:0 0 auto;display:flex;flex-direction:column;gap:10px}
  .vcol.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .vc{display:flex;flex-direction:column;gap:7px;padding:9px 16px 10px;
    background:var(--bg);color:var(--title);border:2px solid var(--on-highlight);border-radius:10px}
  .vc .row{display:flex;align-items:center;gap:14px}
  .vc .q{flex:1 1 auto;font-size:16px;font-weight:600;line-height:1.36}
  .vc .tg{border:1.5px solid var(--on-highlight);border-radius:999px;padding:2px 10px;color:var(--on-highlight);background:var(--bg)}
  .vd{display:flex;align-items:flex-start;gap:10px;margin-left:44px;
    border-top:1.5px solid var(--line);padding-top:7px}
  .vd svg.ic{width:22px;height:22px;margin-top:1px}
  .vd p{font-size:16px;line-height:1.4;color:var(--body)}
  .vd p b{color:var(--title);font-weight:700;margin-right:6px}
  /* The one that gets the interview: filled navy, a tick icon and its label. */
  .vc.is-right{background:var(--on-highlight);color:var(--bg)}
  .vc.is-right .bk{background:var(--bg);border-color:var(--bg)}
  .vc.is-right .vd{border-top-color:var(--bg)}
  .vc.is-right .vd svg.ic{stroke:var(--bg)}
  .vc.is-right .vd p,.vc.is-right .vd p b{color:var(--bg)}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  button.jump{font-family:inherit;font-size:14px;font-weight:600;color:var(--on-highlight);
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:7px;padding:7px 13px;cursor:pointer;white-space:nowrap;align-self:flex-start}
  button.jump:hover{background:var(--tint2)}
  button.jump:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  /* ---- the bar ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:12px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:44px;overflow-y:auto;font-size:13px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .nw{white-space:nowrap}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px;align-content:flex-start}
    .segs i{width:14px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .leadbar{padding:12px 14px;gap:10px}
    .leadbar p{font-size:16px}
    button.ans{align-items:flex-start;flex-wrap:wrap;gap:10px;padding:12px 12px}
    button.ans .al{font-size:16px;flex-basis:calc(100% - 44px)}
    button.ans .tg{margin-left:40px}
    .vc{padding:12px 12px}
    .vc .row{align-items:flex-start;flex-wrap:wrap;gap:10px}
    .vc .q{flex-basis:calc(100% - 44px)}
    .vc .tg{margin-left:40px}
    .vd{margin-left:0}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
    #hint .kb{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Say What You Did">

    <div class="top">
      <span class="prog" id="prog">1 of 2</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Check</button>
      <button class="nav ghost" id="again" type="button" hidden>Start again</button>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:17px;color:#1C1B1B;margin:20px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf strong{color:#1C1B1B}
    .nsf ol{padding-left:22px;margin-bottom:12px}
    .nsf li{margin-bottom:8px}
  </style>
  <div class="nsf">
    <h2>Say What You Did</h2>
    <p>Three people who did this exact work each wrote one sentence about it for their CV. Which one do you think gets the interview? Write down your pick before you read on.</p>
    <ol>
      <li>"Did a cybersecurity project for a healthcare company."</li>
      <li>"Secured a medical company's systems and eliminated its security risks."</li>
      <li>"As an externship project, completed a full security assessment of a (simulated) 180-person medical billing company against NIST CSF 2.0: built the asset inventory, triaged a vulnerability scan, tested control evidence, and delivered a ranked risk report and stakeholder deck."</li>
    </ol>
    <h3>Check your pick</h3>
    <ol>
      <li><strong>Vague.</strong> Says nothing you can be asked about.</li>
      <li><strong>Over-claims.</strong> You assessed, you didn't secure or eliminate. It collapses under one follow-up question.</li>
      <li><strong>The one that gets the interview.</strong> Names what was built, the framework, and the outcome.</li>
    </ol>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ---------------- content ----------------
     P5-9 from the SME pack, word for word. Sentence 3's dash became a
     colon. In the verdicts, the dashes are gone and the semicolon in
     verdict 2 became a full stop. Sentence 3 is the one that gets the
     interview. Do not change "ranked risk report" until Chaitanya answers. */
  var CHOICES = [
    { id:"a", key:"1",
      text:"Did a cybersecurity project for a healthcare company.",
      label:"Vague", line:"Says nothing you can be asked about." },
    { id:"b", key:"2",
      text:"Secured a medical company's systems and eliminated its security risks.",
      label:"Over-claims", line:"You assessed, you didn't secure or eliminate. It collapses under one follow-up question." },
    { id:"c", key:"3",
      text:"As an externship project, completed a full security assessment of a (simulated) 180-person medical billing company against NIST CSF 2.0: built the asset inventory, triaged a vulnerability scan, tested control evidence, and delivered a ranked risk report and stakeholder deck.",
      label:"The one that gets the interview", line:"Names what was built, the framework, and the outcome." }
  ];
  var RIGHT = "c";
  var TITLE = "Say What You Did";

  var S = [
    { id:"pick",   kind:"pick",   label:"Your pick",    h1:TITLE },
    { id:"reveal", kind:"reveal", label:"The verdicts", h1:TITLE }
  ];

  /* Inline SVG icons, Phosphor style: one weight, outline, navy. */
  var ICON = {
    briefcase:'<rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M8.5 7V5.2c0-.7.5-1.2 1.2-1.2h4.6c.7 0 1.2.5 1.2 1.2V7"/><path d="M3 12.5c5.8 2.4 12.2 2.4 18 0"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.6 2.6 5-5.2"/>',
    note:'<path d="M5 4h14v16H5z"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICON[k] + "</svg>"; }
  function choiceOf(id){ for(var k=0;k<CHOICES.length;k++) if(CHOICES[k].id === id) return CHOICES[k]; return null; }

  /* ---------------- state ----------------
     No storage. `locked` is set when the student presses Check, so the
     pick cannot be changed afterwards. Start again clears it. */
  function fresh(){ return { pick:null, locked:false }; }
  var st = fresh();
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Data validation, at load, loud. */
  (function validate(){
    var problems = [], ids = {};
    S.forEach(function(s, n){
      if(!s.id) problems.push("slide " + (n+1) + " has no id");
      if(ids[s.id]) problems.push('duplicate slide id "' + s.id + '"');
      ids[s.id] = 1;
    });
    if(CHOICES.length !== 3) problems.push("the pick needs three sentences");
    if(!choiceOf(RIGHT)) problems.push("the right answer is not one of the choices");
    CHOICES.forEach(function(c){ if(!c.text || !c.label || !c.line) problems.push('sentence "' + c.key + '" is missing a field'); });
    if(problems.length){
      document.getElementById("board").innerHTML =
        '<div class="leadbar"><p><b>This deck has authoring errors and will not behave correctly:</b></p></div>' +
        '<ul style="font-size:13px;line-height:1.6;padding-left:18px">' +
        problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul>";
      throw new Error("deck data invalid: " + problems.join("; "));
    }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    again:document.getElementById("again"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  /* Sentence text: escaped, and "180-person" kept on one line. */
  function said(s){ return esc(s).replace("180-person", '<span class="nw">180-person</span>'); }
  function say(m){ el.live.textContent = m; }
  function topFocus(){
    try{ el.frame.focus({preventScroll:true}); }catch(e){ el.frame.focus(); }
    try{ window.scrollTo(0, 0); }catch(e){}
  }

  /* ---------------- chrome ---------------- */
  function canGo(n){
    if(n < 0 || n >= S.length) return false;
    if(n === 0) return true;
    return st.pick !== null;
  }

  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;
    el.back.disabled = (i === 0);
    el.again.hidden = !st.locked;
    var end = (i === S.length - 1);
    el.next.hidden = end;
    el.next.textContent = st.locked ? "See the verdicts" : "Check";
    el.next.disabled = end || !canGo(i + 1);
  }

  function render(anim){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.hint.textContent = "";
    el.h1.textContent = s.h1;
    if(s.kind === "pick") renderPick();
    else if(s.kind === "reveal") renderReveal(anim);
    else el.board.innerHTML = '<p class="leadbar"><b>Unhandled slide kind "' + esc(String(s.kind)) + '".</b></p>';
    el.frame.setAttribute("aria-label", TITLE);
    header();
  }

  /* ---------------- slide 1: the pick ----------------
     Pick one of three, or press 1, 2 or 3. The pick can change until Check. */
  function buttonHTML(c){
    var mine = st.pick === c.id;
    var cls = "ans" + (mine ? " is-pick" : (st.locked ? " is-other" : ""));
    return '<button class="' + cls + '" type="button" data-choice="' + c.id + '" aria-pressed="' + mine + '"' + (st.locked ? " disabled" : "") + ">" +
      '<span class="bk" aria-hidden="true">' + c.key + "</span>" +
      '<span class="al">“' + said(c.text) + "”</span>" +
      (mine ? '<span class="tg" aria-hidden="true">● Your pick</span>' : "") +
      (mine ? '<span class="sr"> Your pick.</span>' : "") + "</button>";
  }

  function renderPick(){
    el.board.innerHTML =
      '<div class="leadbar">' + icon("briefcase") +
        "<p>Three people who did this exact work each wrote one sentence about it for their CV. <b>Which one do you think gets the interview?</b></p></div>" +
      '<div class="ans-col" role="group" aria-label="Pick one sentence">' + CHOICES.map(buttonHTML).join("") + "</div>";
    Array.prototype.forEach.call(el.board.querySelectorAll("button.ans"), function(btn){
      btn.addEventListener("click", function(){ choose(btn.dataset.choice); });
    });
    pickHint();
  }

  function pickHint(){
    if(st.locked) el.hint.innerHTML = "<b>You picked sentence " + choiceOf(st.pick).key + ".</b> To pick again, press Start again.";
    else if(st.pick === null) el.hint.innerHTML = 'Pick one sentence, then press Check. <span class="kb">On a keyboard, press 1, 2 or 3.</span>';
    else el.hint.innerHTML = "<b>You picked sentence " + choiceOf(st.pick).key + ".</b> You can change it until you press Check.";
  }

  function choose(id){
    if(st.locked || !choiceOf(id)) return;
    st.pick = id;
    renderPick(); header();
    var b = el.board.querySelector('button.ans[data-choice="' + id + '"]');
    if(b) b.focus();
    say("Your pick: sentence " + choiceOf(id).key + ".");
  }

  /* ---------------- slide 2: the reveal ---------------- */
  function cardHTML(c){
    var right = c.id === RIGHT, mine = st.pick === c.id;
    return '<div class="vc' + (right ? " is-right" : "") + '" role="listitem">' +
      '<div class="row"><span class="bk" aria-hidden="true">' + c.key + "</span>" +
        '<span class="q">“' + said(c.text) + "”</span>" +
        (mine ? '<span class="tg">● Your pick</span>' : "") + "</div>" +
      '<div class="vd">' + (right ? icon("check") : icon("note")) +
        "<p><b>" + esc(c.label) + "</b>" + esc(c.line) + "</p></div></div>";
  }

  function renderReveal(anim){
    if(st.pick === null){
      el.h1.textContent = "Make your pick first";
      el.board.innerHTML = '<div class="leadbar"><p>Pick the sentence that you think gets the interview. Then this slide opens.</p></div>' +
        '<button class="jump" type="button" id="topick">Go to your pick</button>';
      el.board.querySelector("#topick").addEventListener("click", function(){ i = 0; render(); topFocus(); });
      return;
    }
    el.board.innerHTML =
      '<div class="vcol' + (anim && !reduce ? " in" : "") + '" role="list" aria-label="The three sentences and their verdicts">' +
      CHOICES.map(cardHTML).join("") + "</div>";
    el.hint.textContent = "Go back to the module and keep reading.";
  }

  /* ---------------- start again ---------------- */
  function resetAll(){ st = fresh(); i = 0; render(); }
  el.again.addEventListener("click", function(){ resetAll(); topFocus(); say("Cleared. Back to the start. Pick one sentence."); });

  /* ---------------- navigation ---------------- */
  function announce(){
    if(S[i].kind === "reveal" && st.pick !== null){
      return "Slide 2 of 2. The verdicts. " + CHOICES.map(function(c){
        return "Sentence " + c.key + (st.pick === c.id ? ", your pick" : "") + ": " + c.label + ". " + c.line;
      }).join(" ");
    }
    return "Slide " + (i+1) + " of " + S.length + ". " + el.h1.textContent;
  }

  function go(d){
    var n = i + d;
    if(!canGo(n)) return;
    if(d > 0 && i === 0) st.locked = true;
    i = n; render(d > 0); topFocus();
    say(announce());
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }
  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(S[i].kind === "pick" && (e.key === "1" || e.key === "2" || e.key === "3")){
      e.preventDefault(); choose(CHOICES[+e.key - 1].id);
    }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render(false);
  fit();

  /* ---------------- the QA hook ----------------
     goto fills the pick when the reveal needs one, so every slide can be
     measured with real content on it. */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      if(n >= 1 && st.pick === null){ st.pick = "a"; st.locked = true; }
      i = n; render(false); return true;
    },
    slides:S.length,
    fill:function(pick){
      if(choiceOf(pick)){ st.pick = pick; st.locked = true; }
      render(false); return true;
    },
    reset:function(){ resetAll(); },
    state:function(){ return { i:i, pick:st.pick, locked:st.locked }; }
  };
})();
</script>
</body>
</html>
