<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus-Area Snapshot — Produced-Water Treatment</title>
<style>
  :root{
    --bg:#FDF8F8;
    --navy:#001D69;
    --lavender:#DCE1FF;
    --ink:#1C1B1B;
    --body:#484646;
    --line:#ECE6EE;
    --muted:#8A8693;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg);
    overflow:hidden;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #wrapper{
    transform-origin:top center;
  }
  #card{
    width:1000px;
    background:var(--white);
    border-radius:28px;
    box-shadow:0 24px 64px rgba(0,29,105,0.14);
    padding:56px 64px 44px;
  }

  /* ---- Header ---- */
  .kicker{
    display:inline-block;
    background:var(--lavender);
    color:var(--navy);
    font-size:13px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:7px 16px;
    border-radius:999px;
    margin-bottom:20px;
  }
  h1.headline{
    font-size:34px;
    line-height:1.28;
    color:var(--ink);
    margin:0 0 8px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .section{
    margin-top:34px;
    padding-top:30px;
    border-top:1px solid var(--line);
  }
  .section:first-of-type{
    margin-top:30px;
  }
  h2.section-title{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--navy);
    margin:0 0 14px;
  }
  p.body-text{
    font-size:16.5px;
    line-height:1.62;
    color:var(--body);
    margin:0;
  }

  /* ---- Trajectory ---- */
  .traj-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:6px;
  }
  h3.traj-title{
    font-size:19px;
    color:var(--ink);
    margin:0;
    font-weight:700;
  }
  .unit-tag{
    font-size:13px;
    color:var(--muted);
  }

  .readout-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    margin:18px 0 14px;
  }
  .big-number{
    font-size:52px;
    font-weight:800;
    color:var(--navy);
    line-height:1;
    letter-spacing:-0.02em;
  }
  .big-number-sub{
    font-size:14px;
    color:var(--muted);
    margin-top:6px;
  }
  .year-badge{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 18px;
    text-align:center;
    min-width:96px;
  }
  .year-badge .yr{
    font-size:24px;
    font-weight:800;
    color:var(--ink);
  }
  .year-badge .lbl{
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:2px;
  }

  .slider-wrap{
    margin:6px 0 22px;
  }
  input[type="range"]{
    -webkit-appearance:none;
    width:100%;
    height:6px;
    border-radius:6px;
    background:var(--line);
    outline:none;
    margin:0;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--navy);
    border:3px solid var(--white);
    box-shadow:0 0 0 1px var(--navy);
    cursor:pointer;
    margin-top:-8px;
  }
  input[type="range"]::-moz-range-thumb{
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--navy);
    border:3px solid var(--white);
    box-shadow:0 0 0 1px var(--navy);
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height:6px;
    border-radius:6px;
    background:var(--line);
  }
  input[type="range"]::-moz-range-track{
    height:6px;
    border-radius:6px;
    background:var(--line);
  }
  .slider-scale{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
  }

  .scenario-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
  }
  .scenario-label{
    font-size:13px;
    color:var(--muted);
    margin-right:2px;
    white-space:nowrap;
  }
  .scenario-btn{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:var(--navy);
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:6px 15px;
    cursor:pointer;
  }
  .scenario-btn.active{
    background:var(--navy);
    border-color:var(--navy);
    color:var(--white);
  }

  .chart-box{
    position:relative;
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 16px 10px;
    background:linear-gradient(180deg, #FFFFFF 0%, #FDFDFF 100%);
  }
  svg#chart{
    width:100%;
    height:auto;
    display:block;
    overflow:visible;
  }
  .legend{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    margin-top:14px;
    font-size:12.5px;
    color:var(--muted);
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .legend-swatch{
    width:22px;
    height:0;
    border-top:3px solid var(--navy);
    display:inline-block;
  }
  .legend-swatch.dashed{
    border-top:3px dashed var(--navy);
  }
  .legend-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--navy);
    display:inline-block;
  }

  .tooltip{
    position:absolute;
    background:var(--ink);
    color:var(--white);
    font-size:12.5px;
    line-height:1.45;
    padding:10px 13px;
    border-radius:10px;
    max-width:230px;
    pointer-events:none;
    opacity:0;
    transform:translate(-50%,-100%);
    transition:opacity 0.12s ease;
    z-index:5;
  }
  .tooltip.show{
    opacity:1;
  }
  .tooltip .src{
    color:var(--lavender);
    display:block;
    margin-top:4px;
    font-size:11.5px;
  }

  .takeaway{
    margin-top:16px;
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
    background:var(--bg);
    border-left:3px solid var(--navy);
    border-radius:8px;
    padding:14px 18px;
  }

  /* ---- Why it matters ---- */
  ul.why-list{
    margin:0;
    padding:0;
    list-style:none;
  }
  ul.why-list li{
    display:flex;
    gap:14px;
    margin-bottom:18px;
  }
  ul.why-list li:last-child{
    margin-bottom:0;
  }
  .why-marker{
    flex:0 0 auto;
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--lavender);
    color:var(--navy);
    font-weight:800;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:2px;
  }
  .why-text{
    font-size:16px;
    line-height:1.6;
    color:var(--body);
  }
  .why-text .cite{
    color:var(--muted);
    font-size:13.5px;
    display:block;
    margin-top:4px;
  }

  /* ---- Footer ---- */
  footer{
    margin-top:34px;
    padding-top:22px;
    border-top:1px solid var(--line);
  }
  .sources-line{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 10px;
  }
  .credit-line{
    font-size:14px;
    font-weight:700;
    color:var(--navy);
    margin:0 0 6px;
  }
  .proj-note{
    font-size:12px;
    font-style:italic;
    color:var(--muted);
    margin:0;
  }
</style>
</head>
<body>

<div id="wrapper">
  <div id="card">

    <!-- Header -->
    <span class="kicker" id="kicker"></span>
    <h1 class="headline" id="headline"></h1>

    <!-- What it is -->
    <div class="section" id="section-whatis">
      <h2 class="section-title">What It Is</h2>
      <p class="body-text" id="whatis-text"></p>
    </div>

    <!-- The Trajectory -->
    <div class="section">
      <h2 class="section-title">The Trajectory</h2>
      <div class="traj-head">
        <h3 class="traj-title" id="traj-title"></h3>
        <span class="unit-tag" id="unit-tag"></span>
      </div>

      <div class="readout-row">
        <div>
          <div class="big-number" id="big-number">--</div>
          <div class="big-number-sub" id="big-number-sub"></div>
        </div>
        <div class="year-badge">
          <div class="yr" id="year-badge-yr">--</div>
          <div class="lbl">Selected Year</div>
        </div>
      </div>

      <div class="slider-wrap">
        <input type="range" id="year-slider" min="2024" max="2033" step="1" value="2029">
        <div class="slider-scale">
          <span id="slider-min-lbl"></span>
          <span id="slider-max-lbl"></span>
        </div>
      </div>

      <div class="scenario-row" id="scenario-row">
        <span class="scenario-label">Growth beyond 2029:</span>
        <!-- buttons injected by JS -->
      </div>

      <div class="chart-box">
        <svg id="chart" viewBox="0 0 888 300" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="tooltip" id="tooltip"></div>
      </div>

      <div class="legend">
        <span class="legend-item"><span class="legend-swatch"></span> Cited forecast (2024–2029)</span>
        <span class="legend-item"><span class="legend-swatch dashed"></span> Illustrative projection (2029+)</span>
        <span class="legend-item"><span class="legend-dot"></span> Cited data point (hover / tap for source)</span>
      </div>

      <div class="takeaway" id="takeaway"></div>
    </div>

    <!-- Why it matters -->
    <div class="section">
      <h2 class="section-title">Why It Matters to Oil and Gas</h2>
      <ul class="why-list" id="why-list"></ul>
    </div>

    <!-- Footer -->
    <footer>
      <p class="sources-line" id="sources-line"></p>
      <p class="credit-line" id="credit-line"></p>
      <p class="proj-note" id="proj-note"></p>
    </footer>

  </div>
</div>

<script>
(function(){

  /* =========================================================
     DATA — everything editable about this card lives here.
     Topic: Produced-water treatment, re-use & handling
     (one of EIC Heritage's locked focus areas, under
     "Resource Management"). All figures below are cited to
     real, named sources; see DATA.sources.
     ========================================================= */
  const DATA = {
    kicker: "Focus-Area Snapshot",
    focusArea: "produced-water treatment",
    headline: "Here's what I learned about produced-water treatment, and why it matters to oil and gas.",

    whatIs: "When an oil or gas well is pumped, water comes up out of the ground along with the oil, usually several times more water than oil. This is called produced water. It is typically salty and mixed with minerals and chemical residue, so it cannot be released into the environment without treatment first. Producers filter and clean it so it can be disposed of safely, or reused, often to mix new fracking fluid (fluid pumped underground at high pressure to free oil and gas trapped in rock) for future wells. As shale wells (wells drilled into dense rock formations using fracking) get older, they tend to bring up more water for the same amount of oil, so treating, storing, and moving that water has become a bigger and more expensive part of running an oil field.",

    trajTitle: "Global market for produced-water treatment",
    unit: "$ billions, global market size",
    valueLabel: "market size",

    driverLabel: "Year",
    driverMin: 2024,
    driverMax: 2033,
    driverStep: 1,
    driverDefault: 2029,

    // Two real, cited anchor points that define the solid (reported) line
    anchorStart: {
      year: 2024,
      value: 10.7,
      tooltip: "Estimated at $10.7 billion in 2024.",
      source: "MarketsandMarkets, 2024"
    },
    anchorEnd: {
      year: 2029,
      value: 13.4,
      tooltip: "Projected to reach $13.4 billion by 2029 (about 4.7% average yearly growth from 2024).",
      source: "MarketsandMarkets, 2024"
    },

    // Scenario toggle only changes the dashed, illustrative region after 2029
    scenarios: {
      conservative: { label: "Conservative", rate: 0.025 },
      base:         { label: "Base",         rate: 0.047 },
      aggressive:   { label: "Aggressive",   rate: 0.07 }
    },
    defaultScenario: "base",

    yMax: 20,

    // Takeaway sentence builder — handles cited range vs illustrative range
    takeaway: function(year, value, scenarioLabel){
      const v = value.toFixed(1);
      if (year === DATA.anchorStart.year){
        return `In 2024, the global produced-water treatment market was estimated at about $${v}B (MarketsandMarkets, 2024).`;
      }
      if (year > DATA.anchorStart.year && year < DATA.anchorEnd.year){
        return `By ${year}, the market is on pace for about $${v}B, heading toward an estimated $13.4B by 2029 (MarketsandMarkets, 2024).`;
      }
      if (year === DATA.anchorEnd.year){
        return `By 2029, the market is projected to reach about $${v}B, up from an estimated $10.7B in 2024 (MarketsandMarkets, 2024).`;
      }
      return `If growth continues at the ${scenarioLabel.toLowerCase()} pace after 2029, the market could reach about $${v}B by ${year}. This part of the chart is an illustrative projection, not a cited forecast.`;
    },

    whyItMatters: [
      {
        point: "Handling produced water is now a major cost of running a shale oil field, not a side task. In the Permian Basin (the largest US shale play), moving that water from the wellsite to disposal or reuse sites is projected to cost $101.8 billion between 2025 and 2030, nearly two-thirds of the entire $156 billion US oil-and-gas water market over that period. Just transporting the water, by truck or pipeline, makes up 43% of all water-related costs operators pay.",
        cite: "Bluefield Research, 2025"
      },
      {
        point: "Part of why costs run so high: for every barrel of oil pumped in the Permian Basin, producers currently bring up roughly three barrels of water, a ratio that has been climbing as wells age. More water for the same oil means more equipment, more trucking or pipeline capacity, and more treatment needed just to keep production running.",
        cite: "B3 Insight"
      }
    ],

    sources: ["MarketsandMarkets (2024)", "Bluefield Research (2025)", "B3 Insight"],
    credit: "Priya Rao  ·  EIC Energy Transition Venture Capital Market Research Externship",
    projNote: "Illustrative projection, based on cited sources."
  };

  /* =========================================================
     RENDER — static text fields
     ========================================================= */
  document.getElementById('kicker').textContent = DATA.kicker;
  document.getElementById('headline').textContent = DATA.headline;
  document.getElementById('whatis-text').textContent = DATA.whatIs;
  document.getElementById('traj-title').textContent = DATA.trajTitle;
  document.getElementById('unit-tag').textContent = DATA.unit;
  document.getElementById('slider-min-lbl').textContent = DATA.driverMin;
  document.getElementById('slider-max-lbl').textContent = DATA.driverMax;

  const whyList = document.getElementById('why-list');
  DATA.whyItMatters.forEach(function(item, i){
    const li = document.createElement('li');
    li.innerHTML = '<span class="why-marker">' + (i+1) + '</span>' +
      '<span class="why-text">' + item.point + '<span class="cite">Source: ' + item.cite + '</span></span>';
    whyList.appendChild(li);
  });

  document.getElementById('sources-line').textContent = DATA.sources.join(' · ');
  document.getElementById('credit-line').textContent = DATA.credit;
  document.getElementById('proj-note').textContent = DATA.projNote;

  /* =========================================================
     SCENARIO BUTTONS
     ========================================================= */
  const scenarioRow = document.getElementById('scenario-row');
  let currentScenario = DATA.defaultScenario;
  const scenarioBtns = {};
  Object.keys(DATA.scenarios).forEach(function(key){
    const btn = document.createElement('button');
    btn.className = 'scenario-btn' + (key === currentScenario ? ' active' : '');
    btn.type = 'button';
    btn.textContent = DATA.scenarios[key].label;
    btn.addEventListener('click', function(){
      currentScenario = key;
      Object.keys(scenarioBtns).forEach(function(k){
        scenarioBtns[k].classList.toggle('active', k === key);
      });
      renderChart();
      updateReadout();
    });
    scenarioRow.appendChild(btn);
    scenarioBtns[key] = btn;
  });

  /* =========================================================
     VALUE MODEL
     ========================================================= */
  function valueAt(year, scenarioRate){
    const a = DATA.anchorStart, b = DATA.anchorEnd;
    if (year <= b.year){
      const t = (year - a.year) / (b.year - a.year);
      return a.value * Math.pow(b.value / a.value, t);
    }
    const yearsPast = year - b.year;
    return b.value * Math.pow(1 + scenarioRate, yearsPast);
  }

  /* =========================================================
     CHART GEOMETRY
     ========================================================= */
  const SVG_W = 888, SVG_H = 300;
  const PAD = { l: 46, r: 14, t: 16, b: 34 };
  const plotW = SVG_W - PAD.l - PAD.r;
  const plotH = SVG_H - PAD.t - PAD.b;

  function xScale(year){
    return PAD.l + (year - DATA.driverMin) / (DATA.driverMax - DATA.driverMin) * plotW;
  }
  function yScale(value){
    return PAD.t + plotH - (value / DATA.yMax) * plotH;
  }

  const svg = document.getElementById('chart');
  const NS = 'http://www.w3.org/2000/svg';

  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); });
    return e;
  }

  function renderChart(){
    svg.innerHTML = '';
    const scenarioRate = DATA.scenarios[currentScenario].rate;

    // gridlines + y labels
    const ySteps = 4;
    for (let i = 0; i <= ySteps; i++){
      const val = (DATA.yMax / ySteps) * i;
      const y = yScale(val);
      svg.appendChild(el('line', { x1: PAD.l, x2: SVG_W - PAD.r, y1: y, y2: y, stroke: '#ECE6EE', 'stroke-width': 1 }));
      const label = el('text', { x: PAD.l - 10, y: y + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#8A8693', 'font-family': 'inherit' });
      label.textContent = '$' + val.toFixed(0) + 'B';
      svg.appendChild(label);
    }

    // x labels (every other year to avoid crowding)
    for (let yr = DATA.driverMin; yr <= DATA.driverMax; yr++){
      if ((yr - DATA.driverMin) % 1 !== 0) continue;
      const x = xScale(yr);
      const showLabel = (yr % 1 === 0);
      if (showLabel){
        const label = el('text', { x: x, y: SVG_H - PAD.b + 20, 'text-anchor': 'middle', 'font-size': 11, fill: '#8A8693', 'font-family': 'inherit' });
        label.textContent = yr;
        svg.appendChild(label);
      }
    }

    // build point series
    const solidPts = [];
    for (let yr = DATA.anchorStart.year; yr <= DATA.anchorEnd.year; yr++){
      solidPts.push([yr, valueAt(yr, scenarioRate)]);
    }
    const dashedPts = [[DATA.anchorEnd.year, valueAt(DATA.anchorEnd.year, scenarioRate)]];
    for (let yr = DATA.anchorEnd.year + 1; yr <= DATA.driverMax; yr++){
      dashedPts.push([yr, valueAt(yr, scenarioRate)]);
    }

    function toPath(pts){
      return pts.map(function(p, i){
        return (i === 0 ? 'M' : 'L') + xScale(p[0]).toFixed(2) + ',' + yScale(p[1]).toFixed(2);
      }).join(' ');
    }
    function toAreaPath(pts){
      const line = toPath(pts);
      const last = pts[pts.length - 1];
      const first = pts[0];
      return line + ' L' + xScale(last[0]).toFixed(2) + ',' + (yScale(0)).toFixed(2) +
             ' L' + xScale(first[0]).toFixed(2) + ',' + (yScale(0)).toFixed(2) + ' Z';
    }

    // area fills (subtle)
    svg.appendChild(el('path', { d: toAreaPath(solidPts), fill: '#DCE1FF', opacity: '0.55', stroke: 'none' }));
    svg.appendChild(el('path', { d: toAreaPath(dashedPts), fill: '#DCE1FF', opacity: '0.28', stroke: 'none' }));

    // lines
    svg.appendChild(el('path', { d: toPath(solidPts), fill: 'none', stroke: '#001D69', 'stroke-width': 3 }));
    svg.appendChild(el('path', { d: toPath(dashedPts), fill: 'none', stroke: '#001D69', 'stroke-width': 3, 'stroke-dasharray': '7,6' }));

    // selected-year indicator
    const selYear = parseInt(document.getElementById('year-slider').value, 10);
    const selVal = valueAt(selYear, scenarioRate);
    svg.appendChild(el('line', {
      x1: xScale(selYear), x2: xScale(selYear), y1: PAD.t, y2: yScale(0),
      stroke: '#001D69', 'stroke-width': 1, 'stroke-dasharray': '3,4', opacity: '0.45'
    }));
    svg.appendChild(el('circle', {
      cx: xScale(selYear), cy: yScale(selVal), r: 6, fill: '#FFFFFF', stroke: '#001D69', 'stroke-width': 2.5
    }));

    // cited anchor dots (always visible, hoverable)
    [DATA.anchorStart, DATA.anchorEnd].forEach(function(a){
      const dot = el('circle', {
        cx: xScale(a.year), cy: yScale(a.value), r: 7, fill: '#001D69', stroke: '#FFFFFF', 'stroke-width': 2,
        style: 'cursor:pointer;'
      });
      dot.addEventListener('mouseenter', function(evt){ showTooltip(evt, a); });
      dot.addEventListener('mousemove', function(evt){ positionTooltip(evt); });
      dot.addEventListener('mouseleave', hideTooltip);
      dot.addEventListener('click', function(evt){ showTooltip(evt, a); });
      svg.appendChild(dot);
    });
  }

  const tooltip = document.getElementById('tooltip');
  function showTooltip(evt, anchor){
    tooltip.innerHTML = anchor.tooltip + '<span class="src">Source: ' + anchor.source + '</span>';
    tooltip.classList.add('show');
    positionTooltip(evt);
  }
  function positionTooltip(evt){
    const box = evt.target.closest('.chart-box') || document.querySelector('.chart-box');
    const rect = box.getBoundingClientRect();
    const svgRect = svg.getBoundingClientRect();
    // Use pointer position relative to chart-box container
    const px = (evt.clientX - rect.left);
    const py = (evt.clientY - rect.top);
    tooltip.style.left = px + 'px';
    tooltip.style.top = (py - 10) + 'px';
  }
  function hideTooltip(){
    tooltip.classList.remove('show');
  }

  /* =========================================================
     READOUT + SLIDER WIRING
     ========================================================= */
  const slider = document.getElementById('year-slider');
  slider.min = DATA.driverMin;
  slider.max = DATA.driverMax;
  slider.step = DATA.driverStep;
  slider.value = DATA.driverDefault;

  function updateReadout(){
    const year = parseInt(slider.value, 10);
    const scenarioRate = DATA.scenarios[currentScenario].rate;
    const val = valueAt(year, scenarioRate);
    document.getElementById('big-number').textContent = '$' + val.toFixed(1) + 'B';
    document.getElementById('big-number-sub').textContent = DATA.valueLabel + (year > DATA.anchorEnd.year ? ' (illustrative)' : ' (cited forecast)');
    document.getElementById('year-badge-yr').textContent = year;
    document.getElementById('takeaway').textContent = DATA.takeaway(year, val, DATA.scenarios[currentScenario].label);

    // move the moving indicator without a full re-render of static chrome
    renderChart();
  }

  slider.addEventListener('input', updateReadout);

  /* =========================================================
     SCALE-TO-FIT WRAPPER (no scroll, ever)
     ========================================================= */
  const wrapper = document.getElementById('wrapper');
  const card = document.getElementById('card');
  function fitToViewport(){
    const cardH = card.getBoundingClientRect().height;
    const cardW = 1000;
    const scale = Math.min(window.innerWidth / cardW, window.innerHeight / cardH, 1);
    wrapper.style.transform = 'scale(' + scale + ')';
  }

  /* =========================================================
     INITIAL RENDER (fully settled, no timers)
     ========================================================= */
  renderChart();
  updateReadout();
  fitToViewport();
  window.addEventListener('resize', fitToViewport);

})();
</script>
</body>
</html>
