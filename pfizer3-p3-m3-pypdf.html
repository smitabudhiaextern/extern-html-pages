<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P3 pypdf Slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Structure, rail, Back and Next, code blocks and Copy buttons: copied from the P3 m2 steps deck (pfizer3-p3-m2-steps.html).
   Hidden answer button: copied from the P3 m2 challenge deck (pfizer3-p3-m2-build.html).
   Look: Pfizer x Extern Core, Light format. Every colour, size, radius and font below comes from design-system/tokens.json.
   Content: P3 module 3, Part 1 (pypdf): the SME's Loom video, the notebook's pypdf cells (cells 6, 8 and 9 of the
   team notebook, code word for word) and the task "find Expiration Date in your page 2 output".
   Outputs: the real output of each cell, run with pypdf on sample-sdf-document.pdf (the supplier file) at build time.
   Long outputs are cut where a "..." line shows. Grey bars hide the supplier's name, addresses, web address, brand
   spellings and trademark lines (the same things the P3 videos and images blur); each bar is as long as the words it hides.
   Fixed stage: the deck is laid out on one design stage that scales as a single piece to fit the frame, so nothing
   ever scrolls and Back and Next sit in the same place on every slide. Wide frames use a 760 x 860 stage
   (set the Notion embed height to 860 px); frames under 560 px wide use a 420 x 1000 stage, so the text stays readable. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* The design stage, scaled and centred by the script at the end */
.app{position:absolute;left:50%;top:50%;width:760px;height:860px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.app.narrow{width:420px;height:1000px}

/* Header: step rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:13px;font-weight:500;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}
.narrow .top{grid-template-columns:minmax(0,1fr);row-gap:8px}
.narrow .where{order:0}

/* Slide area and slide */
.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}
.narrow .stage{padding:10px 10px}
.narrow .card{padding:18px 16px}
.inner{flex:none;display:flex;flex-direction:column;gap:var(--space-3);width:100%}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding-bottom:3px;color:var(--ink);text-wrap:balance}
.narrow .title{font-size:28px;line-height:34px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:15px;line-height:22px;color:var(--ink);text-wrap:pretty}
.p b{font-weight:600}
.p code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.p code.nw{white-space:nowrap}

/* Video: the Loom player, with a plain link under it */
.video{margin:0;display:flex;flex-direction:column;gap:6px;align-self:center;width:560px;max-width:100%}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;background:var(--gray-800);border:1px solid var(--line)}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-link{font-size:13px;line-height:16px;color:var(--ink-muted)}
.video-link a{color:var(--pfizer-blue);font-weight:600}

/* Note box (built from tokens: surface-card ground, card-title and card-text) */
.note{margin:0;background:var(--surface-card);border-radius:var(--radius-sm);padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.note p{margin:0;font-size:15px;line-height:22px;color:var(--card-title);text-wrap:pretty}
.note b{font-weight:600}
.note code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}

/* Hidden answer: the button, then the content once it is shown */
.reveal{display:flex;flex-direction:column;gap:var(--space-3)}
.reveal > .btn{align-self:flex-start}
.reveal-box{display:flex;flex-direction:column;gap:var(--space-3);border-top:1px solid var(--line);padding-top:var(--space-3)}

/* Buttons (design system Button, Light) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none;text-align:left}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* Run card: the code with a Copy button; output blocks have no Copy button */
.run{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin:0}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:6px 8px 6px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:12px 14px;font-family:var(--font-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out{border-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:6px 12px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}
.narrow .run pre{font-size:13px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.narrow .run.out pre{font-size:12px}
/* A grey bar in an output hides the supplier's details; the line we point at is marked */
.hide{background:var(--gray-200);color:transparent;border-radius:3px;user-select:none}
.find{display:inline;background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--pfizer-blue);padding:1px 6px 1px 8px;border-radius:3px}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:22px;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.foot .btn{padding:10px 16px;font-size:15px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
.narrow .upnext{visibility:hidden}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app">
  <h1 class="sr-only">Part 1: pypdf</h1>
  <header class="top">
    <nav class="rail" id="rail" aria-label="Parts"></nav>
    <div class="where"><b id="where-section">Video</b><span aria-hidden="true">&middot;</span><span id="where-count">Slide 1 of 5</span></div>
  </header>
  <main class="stage" aria-label="Slide"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-secondary" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-primary" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<!-- Slide bodies.
     {{CODE:python:text}} is a code block with a Copy button. {{OUT:label:text}} is an output block with no Copy button.
     Inside an output, @@N@@ is a grey bar N characters long that hides the supplier's details, and a line that starts
     with >> is the line we point at. {{REVEAL:key:button label}} ... {{/REVEAL}} hides its content behind a button. -->
<template id="s1">
  <p class="p">pypdf is a simple library for basic text extraction from PDFs. It's lightweight but doesn't provide bounding box information.</p>
  <figure class="video">
    <div class="video-frame"><iframe src="https://www.loom.com/embed/fd1b76896afc4a82a579ad53fa8b2cda" title="Getting Started with PyPDF2 (Loom video, about 3 minutes)" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
    <figcaption class="video-link">Video not playing? <a href="https://www.loom.com/share/fd1b76896afc4a82a579ad53fa8b2cda" target="_blank" rel="noopener noreferrer">Watch on Loom</a><span class="sr-only"> (opens in a new tab)</span></figcaption>
  </figure>
  <div class="note">
    <p>The video uses PyPDF2. Type <code>from pypdf import PdfReader</code> instead.</p>
    <p>The video uses a different sample PDF from ours, so its output won't match yours.</p>
  </div>
</template>

<template id="s2">
  <p class="p">In your copy of the notebook, find the cell that starts with <code class="nw">from pypdf import PdfReader</code>, or paste this into a new code cell, and press <b>Run</b>:</p>
  {{CODE:python:from pypdf import PdfReader

# Load the PDF file
# Upload sample-sdf-document.pdf first
reader = PdfReader("sample-sdf-document.pdf")

# Check the total number of pages
print(f"The PDF has {len(reader.pages)} pages.")}}
  <p class="p"><code class="nw">PdfReader</code> is pypdf's tool for opening a PDF. It opens the supplier file and keeps it in <code class="nw">reader</code>. <code class="nw">reader.pages</code> holds the file's pages, and <code class="nw">len()</code> counts them. Lines that start with <code class="nw">#</code> are notes for people, so Python skips them.</p>
  <p class="p">You'll see this line under the cell:</p>
  {{OUT:Output:The PDF has 3 pages.}}
</template>

<template id="s3">
  <p class="p">Next, find the cell that starts with <code class="nw"># Extract text from the first page</code>, or paste this into a new code cell, and press <b>Run</b>:</p>
  {{CODE:python:# Extract text from the first page (the storage conditions letter)
page = reader.pages[0]
print(page.extract_text())}}
  <p class="p"><code class="nw">reader.pages[0]</code> picks page 1, because Python starts counting at 0. <code class="nw">extract_text()</code> pulls the words off that page, and <code class="nw">print</code> shows them under the cell. Here's how your output starts:</p>
  {{OUT:Output (the start of it):@@6@@
@@15@@
@@21@@
@@13@@
Page 1 / 1
@@10@@
3 June, 2022
Re: @@6@@ ready Flow Kit Storage Conditions
To Whom It May Concern,
...}}
  <p class="p">The output goes on past the dots. Grey bars hide the supplier's name, address and brand name, but your notebook shows the real words.</p>
</template>

<template id="s4">
  <p class="p">Now find the cell that starts with <code class="nw"># Extract text from page 2</code>, or paste this into a new code cell, and press <b>Run</b>:</p>
  {{CODE:python:# Extract text from page 2 (another document type)
page = reader.pages[1]
print(page.extract_text())}}
  <p class="p">This time, <code class="nw">reader.pages[1]</code> picks page 2, because page 2 is number 1 when Python counts from 0. Here's how your output starts:</p>
  {{OUT:Output (the start of it):Certificate of Quality 
This product is manufactured in compliance with our ISO 9001 certified quality management system.
Issued by @@18@@ Quality Assurance
This document has been electronically produced and is valid without a signature.
@@103@@ 
@@94@@
@@10@@ 29190939 Rev AD
...}}
  <p class="p">The output goes on past the dots, and grey bars hide the supplier's details.</p>
</template>

<template id="s5">
  <p class="p">Look through your page 2 output in your notebook and find the line that starts with <b>Expiration Date</b>. An expiration date is the last day a product is safe to use.</p>
  {{REVEAL:where:Show Where It Is}}
    <p class="p">Here it is in the real output, on the line just under Product Description:</p>
    {{OUT:Output (part of page 2):...
Lot Number: 17242818 Product Article Number:   29 1846 12 
Date of Manufacture:  20210126 
  Product Description:  High Flow Gradient C, Modified, @@6@@ ready
>>Expiration Date:  20230126 
Product Release Criteria 
...}}
    <p class="p">You already know how to read a date like 20230126: year, then month, then day. So it's 26 January 2023.</p>
  {{/REVEAL}}
  <div class="note"><p><b>Done looks like:</b> you found the line that starts with Expiration Date in your own page 2 output.</p></div>
</template>

<script>
(function () {
  "use strict";
  var IC_COPY = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5V3.3c0-.7-.6-1.3-1.3-1.3H3.8c-.7 0-1.3.6-1.3 1.3v5.4c0 .7.6 1.3 1.3 1.3H4" stroke="currentColor" stroke-width="1.4"/></svg>';

  function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function unesc(t) { return t.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&"); }
  function codeBlock(text) {
    return '<figure class="run"><div class="code-head"><span class="code-lang">Python</span>' +
      '<button type="button" class="copy" data-copy aria-label="Copy Python code">' + IC_COPY + '<span>Copy</span></button></div>' +
      '<pre tabindex="0"><code>' + esc(text) + '</code></pre></figure>';
  }
  /* Output block: no Copy button. Grey bars and the marked line are added after the text is escaped. */
  function outBlock(label, text) {
    var html = esc(text).split("\n").map(function (line) {
      line = line.replace(/@@(\d+)@@/g, function (m, n) {
        return '<span class="hide" aria-hidden="true">' + new Array(+n + 1).join("x") + '</span>';
      });
      return line.indexOf("&gt;&gt;") === 0 ? '<mark class="find">' + line.slice(8) + '</mark>' : line;
    }).join("\n");
    var hidden = /@@\d+@@/.test(text) ? '<span class="sr-only"> Some words are hidden behind grey bars.</span>' : '';
    return '<figure class="run out"><div class="code-head"><span class="code-lang">' + label + hidden + '</span></div>' +
      '<pre tabindex="0"><code>' + html + '</code></pre></figure>';
  }

  var shown = {};
  /* Fill the {{...}} markers in a slide template */
  function body(id) {
    return document.getElementById(id).innerHTML
      .replace(/\{\{REVEAL:(\w+):([^}]*)\}\}([\s\S]*?)\{\{\/REVEAL\}\}/g, function (m, key, label, inner) {
        var open = !!shown[key];
        return '<div class="reveal">' +
          '<button type="button" class="btn btn-primary" data-reveal="' + key + '" aria-expanded="' + open + '" aria-controls="rv-' + key + '"' + (open ? ' hidden' : '') + '>' + label + '</button>' +
          '<div class="reveal-box" id="rv-' + key + '"' + (open ? '' : ' hidden') + '>' + inner + '</div></div>';
      })
      .replace(/\{\{CODE:python:([\s\S]*?)\}\}/g, function (m, text) { return codeBlock(unesc(text)); })
      .replace(/\{\{OUT:([^:]*):([\s\S]*?)\}\}/g, function (m, label, text) { return outBlock(label, unesc(text)); });
  }

  var GROUPS = ["Video", "Step 1", "Step 2", "Step 3", "Task"];
  var SLIDES = [
    { group: "Video", label: "PART 1 &middot; PYPDF", title: 'Watch pypdf Read a <span class="hl">PDF</span>', plain: "Watch pypdf Read a PDF", tpl: "s1" },
    { group: "Step 1", label: "STEP 1", title: 'Open the File and Count Its <span class="hl">Pages</span>', plain: "Step 1. Open the File and Count Its Pages", tpl: "s2" },
    { group: "Step 2", label: "STEP 2", title: 'Read <span class="hl">Page 1</span>', plain: "Step 2. Read Page 1", tpl: "s3" },
    { group: "Step 3", label: "STEP 3", title: 'Read <span class="hl">Page 2</span>', plain: "Step 3. Read Page 2", tpl: "s4" },
    { group: "Task", label: "YOUR TASK", title: 'Find the Expiration <span class="hl">Date</span>', plain: "Your Task. Find the Expiration Date", tpl: "s5" }
  ];
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of this reading.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  /* The fixed stage: pick the wide or narrow design size, then scale the whole deck to fit the frame and centre it. */
  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var W = narrow ? 420 : 760, H = narrow ? 1000 : 860;
    var k = Math.min(window.innerWidth / W, window.innerHeight / H);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", g.name + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + g.name + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + body(s.tpl);
  }

  function wire(root) {
    Array.prototype.forEach.call(root.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-reveal]"), function (b) {
      b.addEventListener("click", function () {
        var key = b.getAttribute("data-reveal"), box = $("rv-" + key);
        shown[key] = true;
        b.setAttribute("aria-expanded", "true"); b.hidden = true; box.hidden = false;
        var first = box.querySelector("pre"); if (first) first.focus({ preventScroll: true });
      });
    });
  }

  /* Slide 1 holds the video player. It is built once and only hidden while you are on other slides,
     so the video keeps its place when you come back to it. The other slides are rebuilt each time. */
  var videoSlide = document.createElement("div");
  videoSlide.className = "inner";
  videoSlide.innerHTML = slideHTML(0);
  var otherSlide = document.createElement("div");
  otherSlide.className = "inner";
  card.appendChild(videoSlide);
  card.appendChild(otherSlide);
  wire(videoSlide);

  function render(anim) {
    var s = SLIDES[i];
    var el = i === 0 ? videoSlide : otherSlide;
    videoSlide.hidden = i !== 0;
    otherSlide.hidden = i === 0;
    if (i !== 0) { otherSlide.innerHTML = slideHTML(i); wire(otherSlide); }
    else { otherSlide.innerHTML = ""; }
    el.classList.remove("anim");
    if (anim) { void el.offsetWidth; el.classList.add("anim"); }

    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  /* Left and Right arrow keys move between slides */
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", scaleStage);
  scaleStage();
  render(false);
})();
</script>
</body>
</html>
