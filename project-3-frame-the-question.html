<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frame the Q4 question</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FDF8F8;
    --highlight: #DCE1FF;
    --accent: #001D69;
    --title: #1C1B1B;
    --body: #484646;
    --white: #FFFFFF;
    --grey-text: #6E6E73;
    --grey-surface: #F1F1F4;
    --grey-border: #E2E2E6;
    --ok: #1B7A5A;
    --ok-bg: #E9F5EF;
    --ok-border: #BFE3D3;
    --warn: #9A6700;
    --warn-bg: #FBF1DA;
    --warn-border: #ECD6A6;
    --mono: 'SFMono-Regular', ui-monospace, 'Roboto Mono', Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent;
    margin: 0; padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--body);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 14px; }

  .card {
    position: relative;
    background: var(--white);
    border: 1px solid #E8E8EC;
    border-radius: 18px;
    padding: 22px 26px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .06);
  }

  .eyebrow {
    display: inline-block;
    font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--accent); background: var(--highlight);
    padding: 5px 12px; border-radius: 999px; margin: 0 0 10px;
  }

  h1 { font-size: 1.24rem; font-weight: 800; color: var(--title); margin: 0 0 6px; line-height: 1.3; }

  .rubric { font-size: 0.85rem; line-height: 1.5; color: var(--body); margin: 0 0 14px; }
  .rubric b { color: var(--title); font-weight: 700; }

  /* ── Tracker ──────────────────────────────── */
  .trackbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin: 0 0 16px;
    padding-bottom: 14px; border-bottom: 1px solid var(--grey-border);
  }
  .dots { display: flex; gap: 8px; }
  .dot {
    width: 11px; height: 11px; border-radius: 999px;
    background: var(--grey-surface); border: 1.5px solid var(--grey-border);
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .dot.done { background: var(--ok); border-color: var(--ok); }
  .dot.current { border-color: var(--accent); transform: scale(1.25); }
  .progress { font-size: 0.78rem; font-weight: 700; color: var(--grey-text); }
  .progress b { color: var(--accent); }

  /* ── Mike card ────────────────────────────── */
  .mike {
    background: var(--bg);
    border: 1px solid var(--grey-border);
    border-left: 4px solid var(--accent);
    border-radius: 12px;
    padding: 14px 16px; margin: 0 0 16px;
  }
  .mike .who {
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 6px;
  }
  .mike .ask { font-size: 0.92rem; line-height: 1.55; color: var(--title); margin: 0; }

  .prompt { font-size: 0.82rem; font-weight: 700; color: var(--grey-text); margin: 0 0 10px; }

  /* ── Options ──────────────────────────────── */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt-row {
    border: 1.5px solid var(--grey-border); border-radius: 12px;
    overflow: hidden; background: var(--white);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .opt-q {
    padding: 12px 15px; font-size: 0.9rem; font-weight: 600; color: var(--title);
    cursor: pointer; user-select: none; line-height: 1.45;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .opt-q .mark {
    flex: none; width: 20px; height: 20px; border-radius: 999px;
    border: 1.5px solid var(--grey-border); margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
  }
  .opt-q .mark svg { width: 12px; height: 12px; }
  .opt-row:not(.revealed) .opt-q:hover { box-shadow: inset 0 0 0 2px rgba(0,29,105,.12); }
  .opt-row.ok   { border-color: var(--ok-border); }
  .opt-row.warn { border-color: var(--warn-border); }
  .opt-row.ok   .opt-q .mark { background: var(--ok);   border-color: var(--ok); }
  .opt-row.ok   .opt-q .mark svg { fill: #fff; }
  .opt-row.warn .opt-q .mark { background: var(--warn); border-color: var(--warn); }
  .opt-row.warn .opt-q .mark svg { fill: #fff; }

  .opt-fb { padding: 0 15px 13px 45px; font-size: 0.84rem; line-height: 1.55; }
  .opt-row.ok   .opt-fb { color: var(--body); }
  .opt-row.warn .opt-fb { color: var(--body); }
  .opt-fb .tag {
    display: inline-block; font-size: 0.68rem; font-weight: 800;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; margin-bottom: 7px;
  }
  .opt-row.ok   .tag { background: var(--ok);   color: #fff; }
  .opt-row.warn .tag { background: var(--warn); color: #fff; }
  .opt-fb .mono {
    font-family: var(--mono); font-size: 0.86em; color: var(--accent);
    background: rgba(0,29,105,.06); padding: 1px 5px; border-radius: 5px;
  }
  .opt-fb .step2 {
    display: flex; align-items: center; gap: 6px;
    margin-top: 8px; font-weight: 700; color: var(--ok); font-size: 0.82rem;
  }
  .opt-fb .step2 svg { width: 14px; height: 14px; fill: var(--ok); flex: none; }

  /* ── Nav ──────────────────────────────────── */
  .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
  .nav .hint { font-size: 0.78rem; color: var(--grey-text); }
  .btn {
    font-family: inherit; font-size: 0.86rem; font-weight: 700;
    padding: 9px 18px; border-radius: 10px; cursor: pointer;
    border: 1.5px solid var(--grey-border); background: var(--white); color: var(--title);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.08); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.ghost { visibility: hidden; }

  /* ── Final list ───────────────────────────── */
  .done-head { display: flex; align-items: center; gap: 9px; margin: 0 0 4px; }
  .done-head h1 { margin: 0; }
  .qlist { display: flex; flex-direction: column; gap: 9px; margin: 14px 0 16px; }
  .qitem {
    background: var(--ok-bg); border: 1px solid var(--ok-border);
    border-radius: 11px; padding: 11px 14px;
  }
  .qitem .qdec {
    font-size: 0.68rem; font-weight: 800; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--ok); margin: 0 0 4px;
  }
  .qitem .qtext { font-size: 0.88rem; line-height: 1.5; color: var(--title); font-weight: 600; margin: 0; }
  .deliverable {
    background: var(--highlight); border-radius: 12px; padding: 14px 16px;
    font-size: 0.88rem; line-height: 1.6; color: var(--accent);
  }
  .deliverable b { font-weight: 800; }

  @media (prefers-reduced-motion: reduce) {
    .btn:hover, .dot { transition: none !important; transform: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="stage"></div>
  </div>

  <script>
    var CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.4 11.6 2.8 8l1.1-1.1 2.5 2.5 5.7-5.7L13.2 4.8z"/></svg>';
    var CROSS = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 6.6 5.1 3.7 3.7 5.1 6.6 8l-2.9 2.9 1.4 1.4L8 9.4l2.9 2.9 1.4-1.4L9.4 8l2.9-2.9-1.4-1.4z"/></svg>';
    var ARROW = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 7.25h7.1L7.3 4.5l1.05-1.1L13 8l-4.65 4.6L7.3 11.5l2.8-2.75H3z"/></svg>';

    var SCENARIOS = [
      {
        decision: 'Where Q4 budget goes',
        mike: "We spent $37,200 on Facebook ads this period, and I'm about to set the Q4 budget for our biggest quarter. Shari will ask me straight out whether that money was worth it and where the next dollar should go. I need a question I can put real numbers against, not a gut feeling.",
        options: [
          { v: 'trap', text: "Which Facebook campaign brought in the most revenue?",
            why: 'It sounds precise, but <span class="mono">referrals</span> has no campaign column. You can\'t trace a visit, let alone a sale, back to one campaign &mdash; there\'s no key to join on.' },
          { v: 'ok', text: "For the Facebook channel, what did we pay per pageview, and how does its checkout rate compare to other channels?",
            why: 'A slice (the Facebook channel), a measure (cost per pageview and checkout rate), and a decision (does Facebook earn more Q4 budget). Answerable from spend plus traffic.',
            step2: 'Sets up Step 2: Marketing Channel Breakdown' },
          { v: 'vague', text: "Are our Facebook ads working?",
            why: '"Working" isn\'t a measure, and there\'s no decision attached. Nothing to query, nothing to act on.' }
        ]
      },
      {
        decision: 'Cut or keep campaigns',
        mike: "I've got 35 campaigns in the account and most are switched off. Before Q4 I want to keep the ones that pulled their weight and stop re-running the rest. The tricky part: each campaign was built to do a different thing, so I can't just rank them all on one number.",
        options: [
          { v: 'ok', text: "Among campaigns with the same objective, which have the lowest cost per result, and should any paused ones come back for Q4?",
            why: 'A slice (same-objective campaigns), a measure (cost per result), and a decision (cut, keep, or revive). Answerable inside <span class="mono">meta_campaigns</span> for the campaigns that report a result.',
            step2: 'Sets up Step 2: which campaigns earn their spend' },
          { v: 'trap', text: "Across all 35 campaigns, which had the lowest cost per result?",
            why: '<span class="mono">cost_per_result</span> only compares within the same objective &mdash; a reach campaign and a purchase campaign aren\'t measuring the same thing. And only 6 of 35 campaigns report a result at all.' },
          { v: 'vague', text: "Which campaigns are the good ones?",
            why: '"Good" how &mdash; by spend, by sales, by reach? No measure and no action means there\'s nothing to query.' }
        ]
      },
      {
        decision: 'Which channel to lean into',
        mike: "Facebook sends us far more visitors than anywhere else, so on a traffic chart it always looks like the winner. But traffic isn't money, and I care who actually buys. If a smaller channel quietly converts better, I'd rather feed that one in Q4.",
        options: [
          { v: 'vague', text: "Which channel sends us the most traffic?",
            why: 'You already know Facebook wins on volume, and volume isn\'t the question. This can\'t tell you who buys, so it can\'t guide spend.' },
          { v: 'trap', text: "Which channel has the highest return on ad spend?",
            why: 'ROAS needs revenue tied to each channel, and this data can\'t attribute a sale to a channel. It\'s the perfect-sounding metric the data can\'t honestly produce.' },
          { v: 'ok', text: "For each channel, what share of its pageviews reach checkout, so I can see which sends buyers, not just browsers?",
            why: 'A slice (each channel), a measure (checkout rate), and a decision (which channel to lean into). Answerable from <span class="mono">referrals</span> &mdash; checkouts divided by pageviews.',
            step2: 'Sets up Step 2: the channel conversion ranking' }
        ]
      },
      {
        decision: 'Which product pages to fix',
        mike: "We send ad traffic to specific product pages, and I think some of them are leaking. Plenty of visits land, but the sales don't follow. I want to know which product pages pull traffic without turning it into sales, before we spend more in Q4.",
        options: [
          { v: 'ok', text: "Which product pages get heavy pageviews but a low checkout rate?",
            why: 'A slice (each product page), a measure (pageviews and checkout rate), and a decision (which pages to fix). Answerable from <span class="mono">referrals</span> by the <span class="mono">/products/</span> path.',
            step2: 'Sets up Step 2: pages getting traffic but not sales' },
          { v: 'trap', text: "For each Facebook campaign, which product page did it send traffic to?",
            why: 'Same wall as before: <span class="mono">referrals</span> can\'t tell you which campaign a visit came from, so you can\'t connect a campaign to a landing page.' },
          { v: 'vague', text: "Are our product pages any good?",
            why: '"Good" isn\'t measurable and there\'s no action &mdash; good at loading, looking nice, or selling?' }
        ]
      }
    ];

    var TAGS = { vague: 'Too vague', trap: 'The data can\'t answer this', ok: 'Sharp and answerable' };

    var idx = 0;
    var revealed = [ [], [], [], [] ];        // option indices clicked per scenario
    var solved = [ false, false, false, false ];

    var stage = document.getElementById('stage');

    function dotsHTML(activeIdx) {
      var h = '<div class="dots">';
      for (var i = 0; i < 4; i++) {
        var c = 'dot';
        if (solved[i]) c += ' done';
        if (i === activeIdx) c += ' current';
        h += '<span class="' + c + '"></span>';
      }
      return h + '</div>';
    }

    function countSolved() { var n = 0; for (var i = 0; i < 4; i++) if (solved[i]) n++; return n; }

    function renderScenario() {
      var sc = SCENARIOS[idx];
      var h = '';
      h += '<span class="eyebrow">🎯 Frame the Q4 question</span>';
      h += '<h1>Pick the question worth Mike\'s time</h1>';
      h += '<p class="rubric">A sharp question names a <b>slice</b>, a <b>measure</b>, and the <b>decision</b> it drives &mdash; and the data can actually answer it. Mike walks you through four calls he has to make. Pick the sharp one for each.</p>';
      h += '<div class="trackbar">' + dotsHTML(idx) + '<span class="progress">Questions ready: <b>' + countSolved() + '</b> / 4</span></div>';
      h += '<div class="mike"><p class="who">Mike &middot; Head of E-Commerce</p><p class="ask">' + sc.mike + '</p></div>';
      h += '<p class="prompt">Which question should you write down?</p>';
      h += '<div class="options">';
      for (var i = 0; i < sc.options.length; i++) {
        var o = sc.options[i];
        var isRev = revealed[idx].indexOf(i) !== -1;
        var rowClass = 'opt-row';
        if (isRev) rowClass += (o.v === 'ok') ? ' revealed ok' : ' revealed warn';
        h += '<div class="' + rowClass + '">';
        h += '<div class="opt-q" data-opt="' + i + '"><span class="mark">' + (isRev ? (o.v === 'ok' ? CHECK : CROSS) : '') + '</span><span>' + o.text + '</span></div>';
        if (isRev) {
          h += '<div class="opt-fb"><span class="tag">' + TAGS[o.v] + '</span><div>' + o.why + '</div>';
          if (o.v === 'ok' && o.step2) h += '<div class="step2">' + ARROW + o.step2 + '</div>';
          h += '</div>';
        }
        h += '</div>';
      }
      h += '</div>';

      // nav
      var backBtn = (idx > 0)
        ? '<button class="btn" data-nav="back">&larr; Back</button>'
        : '<button class="btn ghost">&larr; Back</button>';
      var nextLabel = (idx === 3) ? 'See your list &rarr;' : 'Next &rarr;';
      var nextBtn = solved[idx]
        ? '<button class="btn primary" data-nav="next">' + nextLabel + '</button>'
        : '<button class="btn primary" disabled>' + nextLabel + '</button>';
      var hint = solved[idx] ? '' : '<span class="hint">Find the sharp question to move on.</span>';
      h += '<div class="nav">' + backBtn + hint + nextBtn + '</div>';

      stage.innerHTML = h;
    }

    function renderFinal() {
      var h = '';
      h += '<span class="eyebrow">🎯 Frame the Q4 question</span>';
      h += '<div class="done-head"><h1>Your four questions for Mike</h1></div>';
      h += '<div class="trackbar">' + dotsHTML(-1) + '<span class="progress">Questions ready: <b>4</b> / 4</span></div>';
      h += '<div class="qlist">';
      for (var i = 0; i < 4; i++) {
        var ok = null, sc = SCENARIOS[i];
        for (var j = 0; j < sc.options.length; j++) if (sc.options[j].v === 'ok') ok = sc.options[j];
        h += '<div class="qitem"><p class="qdec">' + sc.decision + '</p><p class="qtext">' + ok.text + '</p></div>';
      }
      h += '</div>';
      h += '<div class="deliverable">These are the four questions Mike needs answered before Q4. Before you move on, make sure each one makes sense: what it measures, and why the data can answer it. You\'ll answer them in <b>Step 2</b>.</div>';
      h += '<div class="nav"><button class="btn" data-nav="back">&larr; Back</button><button class="btn ghost">x</button></div>';
      stage.innerHTML = h;
    }

    function render() { if (idx >= 4) renderFinal(); else renderScenario(); }

    stage.addEventListener('click', function (e) {
      var optEl = e.target.closest ? e.target.closest('[data-opt]') : null;
      var navEl = e.target.closest ? e.target.closest('[data-nav]') : null;
      if (optEl) {
        var i = parseInt(optEl.getAttribute('data-opt'), 10);
        if (revealed[idx].indexOf(i) === -1) revealed[idx].push(i);
        if (SCENARIOS[idx].options[i].v === 'ok') solved[idx] = true;
        render();
      } else if (navEl) {
        var dir = navEl.getAttribute('data-nav');
        if (dir === 'next' && idx < 4 && solved[idx]) idx++;
        else if (dir === 'back' && idx > 0) idx--;
        render();
      }
    });

    render();
  </script>
</body>
</html>
