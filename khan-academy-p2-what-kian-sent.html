<style>
  /* ===============================================================
     Extern design system. These five values are the entire palette.
     Do not add a sixth. Every tint below is an rgba() of #001D69,
     not a new hue. No state is ever carried by colour alone: every
     coloured state also carries a glyph or a label.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, the thing THEY did  */
    --bg:#FDF8F8;           /* canvas background, negative space   */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;    /* UI feedback              */
    --t-frame:300ms;   /* between-frame movement   */
    --t-reveal:420ms;  /* a verdict resolving      */
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- the 960x540 canvas, scaled down only, never up ----
     flex:0 0 auto is load bearing. As a shrinkable flex item the canvas
     lays out at the viewport width between 600 and 899px and the JS
     transform then scales it a second time, double shrinking the design.
     The canvas must always hold 960 in layout and let the transform do
     all of the fitting. getComputedStyle(stage).width must read 960px. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;overflow:hidden;
  }
  /* the frame takes programmatic focus so a screen reader announces the new
     state. It is not a control, so it draws no ring of its own. Every real
     control keeps its own visible ring. */
  .frame{position:absolute;inset:0;padding:14px 40px 10px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header: progress, visible from first paint ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:4px}
  .prog{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{
    display:block;width:16px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out);
  }
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}

  h1{font-size:18.5px;line-height:1.22;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:5px}

  /* ---- boards. Two columns on a requirement frame, one on the close ---- */
  .board{flex:1 1 auto;min-height:0;min-width:0;display:grid;gap:16px}
  .board.two{grid-template-columns:1fr 404px}
  .board.one{grid-template-columns:1fr}
  .col{min-width:0;min-height:0;display:flex;flex-direction:column}

  /* ---- what Kian actually sent. It sits on every frame of the working
         section, so nobody is asked to check a list against a memory. ---- */
  .panel{
    background:var(--highlight);border-radius:11px;padding:8px 11px;
    display:flex;flex-direction:column;min-width:0;min-height:0;flex:0 0 auto;
  }
  .panel:focus{outline:3px solid var(--on-highlight);outline-offset:2px}
  .panel:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  .ph{
    display:flex;align-items:center;gap:6px;margin-bottom:4px;flex:0 0 auto;
    font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight);
  }
  .ph svg{width:13px;height:13px;flex:0 0 auto;display:block}
  .pitch{font-size:13px;line-height:1.46;color:var(--title)}
  .pitch q{quotes:"\201C" "\201D"}

  /* ---- the one question Wes asked, and the answer he got ---- */
  .xchg{flex:0 0 auto;background:var(--tint);border-radius:9px;padding:7px 10px;margin-top:7px}
  .xchg p{font-size:12.5px;line-height:1.42;margin-bottom:3px}
  .xchg p:last-child{margin-bottom:0}
  .xchg p b{color:var(--on-highlight);font-weight:700}

  /* ---- the checklist, on the opening frame ---- */
  .list{flex:0 0 auto;display:flex;flex-direction:column;gap:3px}
  .list p{font-size:12.5px;line-height:1.42;display:flex;gap:7px}
  .list p b{color:var(--on-highlight);font-weight:700;flex:0 0 auto}
  /* provenance on the one item Sarah added. Inline, so it costs no line of
     its own, and it carries a word rather than a colour. */
  .list .prov{
    font-style:normal;font-weight:700;font-size:10.5px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--on-highlight);white-space:nowrap;
  }
  .intro{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .intro p{font-size:13.5px;line-height:1.46}
  .intro p b{color:var(--title);font-weight:600}

  /* ---- the requirement under examination ---- */
  .req{flex:0 0 auto;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:8px}
  .rtag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight);margin-bottom:3px}
  .rq{font-size:15px;line-height:1.34;font-weight:600;color:var(--title)}
  .ask{flex:0 0 auto;font-size:13px;line-height:1.32;font-weight:600;color:var(--title);margin-bottom:6px}

  /* ---- the two calls. Real buttons, Tab and Enter, no custom protocol ---- */
  .choices{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  button.ch{
    display:flex;align-items:flex-start;gap:9px;text-align:left;width:100%;
    font-family:inherit;font-size:13.5px;line-height:1.32;font-weight:600;color:var(--title);
    background:var(--highlight);border:2px solid transparent;border-radius:9px;
    padding:7px 11px;cursor:pointer;
    transition:border-color var(--t-fast) var(--ease-out),opacity var(--t-fast) var(--ease-out);
  }
  button.ch .dot{
    flex:0 0 auto;width:16px;height:16px;border-radius:50%;margin-top:1px;
    border:2px solid var(--on-highlight);color:var(--on-highlight);
    font-size:10px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  button.ch:hover:not([aria-disabled="true"]){border-color:var(--on-highlight)}
  button.ch:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.ch[aria-pressed="true"]{border-color:var(--on-highlight)}
  /* settled buttons stay in the tab order, so they are aria-disabled rather
     than disabled: reachable, announced, inert */
  button.ch[aria-disabled="true"]{cursor:default}
  button.ch .mk{
    margin-left:auto;flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:var(--on-highlight);padding-top:2px;
  }
  /* dimmed but still readable: #1C1B1B on #DCE1FF composites to 5.36:1 at
     .7, which clears 4.5:1 for 13.5px body copy. The .mk label inside is
     #001D69 on the same ground and clears it by a wider margin. */
  button.ch.done[aria-pressed="false"]{opacity:.7}

  /* ---- the reason. It lands under the two calls, on the same frame, and it
         never scrolls: nobody reads teaching through a 4px scrollbar. ---- */
  .reason{
    flex:0 0 auto;margin-top:8px;min-width:0;
    background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;
  }
  .reason:focus{outline:3px solid var(--on-highlight);outline-offset:2px}
  .reason:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  .lead{font-size:11.5px;line-height:1.3;font-weight:600;color:var(--on-highlight);margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .lead b{color:var(--title);font-weight:700}
  .lead svg{width:13px;height:13px;flex:0 0 auto;display:block}
  .rbody{font-size:13.5px;line-height:1.46}
  .rbody b{color:var(--title);font-weight:600}
  .reason.on{animation:rise var(--t-reveal) var(--ease-out) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---- the closing rows ---- */
  .rows{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
  .row{
    display:grid;grid-template-columns:1fr 128px 132px;gap:12px;align-items:baseline;
    background:var(--highlight);border-radius:8px;padding:5px 11px;
  }
  .row .nm{font-size:13.5px;font-weight:600;color:var(--title);line-height:1.28}
  .row .nm .prov{
    font-style:normal;font-weight:700;font-size:10px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--on-highlight);white-space:nowrap;
  }
  .row .yr,.row .an{font-size:12.5px;line-height:1.28;color:var(--on-highlight);font-weight:600}
  .row .an b{color:var(--title);font-weight:700}
  .rhead{
    display:grid;grid-template-columns:1fr 128px 132px;gap:12px;padding:0 11px 3px;
    font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight);
  }
  .close{flex:0 0 auto;margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .close p{font-size:14px;line-height:1.48}
  .close p b{color:var(--title);font-weight:600}
  .close .flagline{
    border:2px dashed var(--on-highlight);border-radius:9px;padding:8px 11px;
    font-size:13px;line-height:1.44;
  }

  /* ---- the bar. margin-top:auto plus flex:0 0 auto means overflow above
         scrolls inside its own region and can never displace this row. ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:34px;flex-wrap:wrap;padding-top:7px}
  button.nav{
    font-family:inherit;font-size:13px;font-weight:600;padding:8px 15px;border-radius:8px;cursor:pointer;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);flex:0 0 auto;
    transition:opacity var(--t-fast) var(--ease-out);
  }
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav.small{font-size:12px;padding:7px 12px}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  .hint{flex:1 1 auto;min-width:0;font-size:11.5px;line-height:1.36}
  .hint b{color:var(--title);font-weight:600}
  .key{border:1px solid var(--on-highlight);border-radius:4px;padding:0 4px;font-size:10.5px;font-weight:600;color:var(--on-highlight)}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    /* Drop flex on the body. As a flex item #stage inherits min-width:auto
       and refuses to shrink below its content width, which pushes the board
       off screen. Block layout removes that floor. */
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{
      width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important;overflow:visible;
    }
    .frame{position:relative;inset:auto;padding:18px 16px 32px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    /* align-content, not just align-items: a stretched one column grid hands
       its leftover height to the auto rows, which opens a dead band between
       two stacked panels on a tall phone. */
    .board,.board.two,.board.one{
      grid-template-columns:1fr;gap:16px;flex:0 0 auto;align-items:start;align-content:start;
    }
    .panel{padding:12px 13px}
    .ph{font-size:12px}
    .pitch{font-size:15px;line-height:1.5}
    .xchg{padding:11px 13px;margin-top:12px}
    .xchg p{font-size:14.5px;line-height:1.45}
    .list p{font-size:14.5px}
    .intro p{font-size:15.5px}
    .req{padding:12px 13px;margin-bottom:14px}
    .rtag{font-size:12px}
    .rq{font-size:17px}
    .ask{font-size:15px}
    button.ch{font-size:16px;padding:12px 13px}
    /* the mark label is pushed to the right edge by margin-left:auto at 960.
       On a 320 phone that puts a nowrap label and a wrapped verdict in one
       row wider than the viewport, which widens the document and scrolls the
       page sideways. It moves under the label instead. */
    button.ch{flex-wrap:wrap}
    button.ch .mk{margin-left:25px;font-size:12px;flex:1 1 100%}
    .reason{margin-top:14px;padding:12px 14px}
    .lead{font-size:14px}
    .rbody{font-size:15.5px}
    .rhead{display:none}
    .row{grid-template-columns:1fr;gap:3px;padding:11px 13px}
    .row .nm{font-size:15.5px}
    .row .yr,.row .an{font-size:14px}
    .close p{font-size:15.5px}
    .close .flagline{font-size:15px;padding:12px 13px}
    .bar{margin-top:18px;min-height:0;padding-top:0}
    button.nav{font-size:16px;padding:13px 18px}
    button.nav.small{font-size:14px;padding:11px 15px}
    .hint{font-size:14px;flex:1 1 100%}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

  <div class="nsf">
    <h1>What Kian sent, and what the checklist asks for</h1>
    <p>Kian is the other intern on this team. He put a partnership idea into the team channel. The team keeps a checklist of what goes on any partner recommendation. Six items, and a seventh that Sarah Thaler, Senior Strategic Partnerships Manager, added to it herself. This is his pitch checked against all seven, one at a time.</p>
    <p>The idea is not what is under examination here. The evidence is.</p>

    <h2>What Kian sent</h2>
    <p class="said"><strong>Kian, in the team channel.</strong> &ldquo;Hey everyone, I have a new partnership idea and I&rsquo;m really excited to share it. This is for one of the big national banks. We build them a &ldquo;banking basics&rdquo; hub inside Financial Literacy: opening your first account, what a credit score actually is, how an APR works, a short quiz at the end of each one. I haven&rsquo;t landed on a number yet, but their community giving budget is public and it is not small. And the reach sells itself. Would love thoughts on this.&rdquo;</p>
    <p class="said"><strong>Wes.</strong> &ldquo;So what does the bank get here that it couldn&rsquo;t already get from a billboard?&rdquo;<br><strong>Kian.</strong> &ldquo;They get their name next to the most trusted name in free education, and no billboard can buy that.&rdquo;</p>

    <h2>The seven, six from the team and one from Sarah</h2>
    <ol>
      <li>Why this company is a strategic fit for Khan Academy</li>
      <li>The specific partnership model they&rsquo;d recommend (revenue share, product integration, co-selling, etc.)</li>
      <li>The value proposition for both sides: what Khan Academy gets and what the partner gets</li>
      <li>Estimated reach or revenue impact</li>
      <li>A rough outline of what the first conversation or pitch to that company could look like</li>
      <li>Any risks or reasons it might not work out or competitors who might fill the space if we don&rsquo;t</li>
      <li>Whether there are competing models already being done or if this would be a first of its kind. <strong>Sarah added this one herself.</strong></li>
    </ol>

    <h2>His pitch against the seven</h2>

    <h3>1. Why this company is a strategic fit for Khan Academy. Covered.</h3>
    <p>He names a specific sector, a specific course to put it in, and a real audience overlap. People learning what a credit score is are people who will open an account somewhere.</p>

    <h3>2. The specific partnership model. Covered.</h3>
    <p>A company funds a themed hub inside an existing course and gets its name on it. That is a shape this team has run before.</p>

    <h3>3. The value proposition for both sides. Not covered.</h3>
    <p>He has Khan Academy&rsquo;s side. Asked directly what the bank gets, he answered by describing Khan Academy. That is one side twice, not two sides.</p>

    <h3>4. Estimated reach or revenue impact. Not covered.</h3>
    <p>&ldquo;The reach sells itself&rdquo; is not a number, and &ldquo;I haven&rsquo;t landed on a number yet&rdquo; is not an estimate. Neither Khan Academy nor the bank can plan against either.</p>

    <h3>5. A rough outline of the first conversation or pitch. Not covered.</h3>
    <p>Nothing about who at the bank he would talk to or what he would open with.</p>

    <h3>6. Any risks, or who fills the space if we don&rsquo;t. Not covered.</h3>
    <p>He names no risk at all. A pitch with no downside in it reads as one nobody has stress-tested.</p>

    <h3>7. Competing models, or a first of its kind. Not covered.</h3>
    <p>He never asks whether anyone has run this before. This is the one that decides the rest of the week.</p>

    <h2>Two of seven</h2>
    <p>Two of the seven are in his message. Five are not. <strong>Half an idea reads as no idea, however good the half is.</strong> His idea was reasonable, and a reader of that message still cannot tell whether it is worth a meeting, because the parts that would settle it are missing.</p>
    <div class="flag">
      <p style="margin-bottom:0"><strong>Requirement 7, the one Sarah added, is what the rest of the week is about.</strong> Whether competing models are already being run, or whether this would be a first of its kind, is the question you are about to go and answer for yourself.</p>
    </div>

     =============================================================== */
  var PITCH = "Hey everyone, I have a new partnership idea and I’m really excited to share it. This is for one of the big national banks. We build them a “banking basics” hub inside Financial Literacy: opening your first account, what a credit score actually is, how an APR works, a short quiz at the end of each one. I haven’t landed on a number yet, but their community giving budget is public and it is not small. And the reach sells itself. Would love thoughts on this.";
  var WES  = "So what does the bank get here that it couldn’t already get from a billboard?";
  var KIAN = "They get their name next to the most trusted name in free education, and no billboard can buy that.";

  /* ===============================================================
     The seven requirements. Six are the team's own checklist. The
     seventh, "comp", is the one Sarah Thaler added when she read the
     list, and .prov marks it so the build can say so on screen.
     SHE DID NOT AUTHOR THE OTHER SIX. Never label this array as her
     words, and never write a line for her anywhere in this file.
     The short label is ours and is used only for the progress line
     and the closing table.
     =============================================================== */
  var REQS = [
    {
      id:"fit", short:"Why this company is a strategic fit", covered:true,
      full:"Why this company is a strategic fit for Khan Academy",
      why:"He names a specific sector, a specific course to put it in, and a real audience overlap. People learning what a credit score is are people who will open an account somewhere."
    },
    {
      id:"model", short:"The specific partnership model they’d recommend", covered:true,
      full:"The specific partnership model they’d recommend (revenue share, product integration, co-selling, etc.)",
      why:"A company funds a themed hub inside an existing course and gets its name on it. That is a shape this team has run before."
    },
    {
      id:"both", short:"The value proposition for both sides", covered:false,
      full:"The value proposition for both sides: what Khan Academy gets and what the partner gets",
      why:"He has Khan Academy’s side. Asked directly what the bank gets, he answered by describing Khan Academy. That is one side twice, not two sides."
    },
    {
      id:"reach", short:"Estimated reach or revenue impact", covered:false,
      full:"Estimated reach or revenue impact",
      why:"“The reach sells itself” is not a number, and “I haven’t landed on a number yet” is not an estimate. Neither Khan Academy nor the bank can plan against either."
    },
    {
      id:"first", short:"A rough outline of the first conversation or pitch", covered:false,
      full:"A rough outline of what the first conversation or pitch to that company could look like",
      why:"Nothing about who at the bank he would talk to or what he would open with."
    },
    {
      id:"risk", short:"Any risks, or competitors who might fill the space", covered:false,
      full:"Any risks or reasons it might not work out or competitors who might fill the space if we don’t",
      why:"He names no risk at all. A pitch with no downside in it reads as one nobody has stress-tested."
    },
    {
      id:"comp", short:"Competing models, or a first of its kind", covered:false,
      prov:"Sarah added this one",
      full:"Whether there are competing models already being done or if this would be a first of its kind",
      why:"He never asks whether anyone has run this before. This is the one that decides the rest of the week."
    }
  ];

  var YES = "Kian covered this";
  var NO  = "Kian did not";

  var TOTAL = REQS.length + 2;   /* the opening frame, seven, the close */
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var el = {};
  ["frame","prog","segs","h1","board","back","next","hint","live"].forEach(function(k){
    el[k] = document.getElementById(k);
  });

  /* ---------------------------------------------------------------
     A small, failure-tolerant store, so "do three and come back" is a
     true statement rather than a promise the build breaks. Every read
     and write is wrapped: a browser with storage disabled must lose
     the record, not the interactive. Keyed by requirement id, never by
     position, so a reorder cannot restore a call onto the wrong item.
     --------------------------------------------------------------- */
  var KEY = "ka-p2-kian-sent-v1";
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
  var store = load();
  store.calls = store.calls || {};   /* requirement id -> true covered, false not */

  var i = 0;   /* 0 is the opening frame, 1 to 7 the requirements, 8 the close */

  function say(m){ el.live.textContent = m; }
  function reqAt(n){ return REQS[n - 1]; }
  function answered(n){ var r = reqAt(n); return Object.prototype.hasOwnProperty.call(store.calls, r.id); }
  function allDone(){
    for(var k=0;k<REQS.length;k++){
      if(!Object.prototype.hasOwnProperty.call(store.calls, REQS[k].id)) return false;
    }
    return true;
  }
  function doneCount(){
    var n = 0;
    REQS.forEach(function(r){ if(Object.prototype.hasOwnProperty.call(store.calls, r.id)) n++; });
    return n;
  }

  function segs(at){
    var out = "";
    for(var k=0;k<TOTAL;k++){
      out += '<i class="' + (k === at ? "here" : (k < at ? "on" : "")) + '"></i>';
    }
    el.segs.innerHTML = out;
  }

  function pitchHTML(){
    return '<div class="panel" id="pitchpanel" tabindex="-1" role="group" aria-label="What Kian sent">' +
             '<div class="ph">' + I.say + '<span>What Kian sent</span></div>' +
             '<p class="pitch"><q>' + PITCH + '</q></p>' +
             '<div class="xchg">' +
               '<p><b>Wes.</b> <q>' + WES + '</q></p>' +
               '<p><b>Kian.</b> <q>' + KIAN + '</q></p>' +
             '</div>' +
           '</div>';
  }

  /* ---------------- the opening frame ---------------- */

  function drawIntro(){
    el.h1.textContent = "What Kian sent, and what the checklist asks for";
    el.board.className = "board two";
    el.board.innerHTML =
      '<div class="col">' + pitchHTML() + '</div>' +
      '<div class="col">' +
        '<div class="intro">' +
          '<p>The team keeps a checklist of what goes on any partner recommendation. Six items, and a seventh that Sarah Thaler, the senior manager these land with, added herself.</p>' +
          '<p>You take them one at a time and decide whether Kian’s message actually covered each one. <b>The idea is not what is under examination here. The evidence is.</b></p>' +
        '</div>' +
      '</div>';
    el.back.hidden = true;
    el.next.hidden = false;
    el.next.textContent = doneCount() ? "Back to the list" : "Start with the first one";
    el.hint.innerHTML = doneCount()
      ? '<b>You have called ' + doneCount() + ' of the seven already.</b> Those calls are saved on this device.'
      : 'His message stays on screen the whole way through.';
  }

  /* ---------------- a requirement ---------------- */

  function drawReq(){
    var n = i, r = reqAt(n), done = answered(n);
    el.h1.textContent = "Did his message cover this one?";
    el.board.className = "board two";
    el.board.innerHTML =
      '<div class="col">' + pitchHTML() + '</div>' +
      '<div class="col">' +
        '<div class="req">' +
          '<div class="rtag">Requirement ' + n + ' of 7' + (r.prov ? ', added by Sarah' : '') + '</div>' +
          '<p class="rq" id="rq">' + r.full + '</p>' +
        '</div>' +
        '<p class="ask" id="ask">Make the call.</p>' +
        '<div class="choices" id="choices" role="group" aria-labelledby="ask">' +
          choiceHTML(r, "yes", YES) + choiceHTML(r, "no", NO) +
        '</div>' +
        '<section class="reason" id="reason"' + (done ? '' : ' hidden') +
          ' tabindex="-1" role="group" aria-label="Why this is the answer">' +
          '<p class="lead" id="rlead"></p><div class="rbody" id="rbody"></div>' +
        '</section>' +
      '</div>';
    wireChoices(r);
    if(done){ paint(r, store.calls[r.id], false); }

    el.back.hidden = false;
    el.back.textContent = n === 1 ? "Back to his message" : "Back";
    el.next.hidden = !done;
    el.next.textContent = n === REQS.length ? "See all seven together" : "Next requirement";
    el.hint.innerHTML = done
      ? "You called this one. The reason is on this frame, under your call."
      : 'Two calls, and either one opens the reason. Keys <span class="key">1</span> and <span class="key">2</span> also work.';
  }

  function choiceHTML(r, key, label){
    return '<button class="ch" type="button" data-c="' + key + '" aria-pressed="false">' +
             '<span class="dot" aria-hidden="true"></span>' +
             '<span class="txt">' + label + '</span>' +
             '<span class="mk" hidden></span>' +
           '</button>';
  }
  function buttons(){
    return Array.prototype.slice.call(el.board.querySelectorAll("button.ch"));
  }
  function locked(b){ return b.getAttribute("aria-disabled") === "true"; }

  function wireChoices(r){
    buttons().forEach(function(b){
      b.addEventListener("click", function(){
        if(locked(b)) return;
        commit(r, b.getAttribute("data-c") === "yes");
      });
      /* aria-disabled, not disabled: a settled call stays reachable by Tab so
         a screen reader user can land on it and hear that it is settled. These
         two guards hold it inert, one for pointer, one for keyboard. */
      b.addEventListener("keydown", function(e){
        if(!locked(b)) return;
        if(e.key === "Enter" || e.key === " " || e.key === "Spacebar"){ e.preventDefault(); }
      });
    });
  }

  /* the call, the marks on the two buttons, and the reason. The reason states
     the verdict and says whether the student had it, in that order, so the
     teaching is the same sentence whichever way they went. */
  function paint(r, said, animate){
    var right = (said === r.covered);
    buttons().forEach(function(b){
      var isYes = b.getAttribute("data-c") === "yes";
      var mine  = (isYes === said);
      var truth = (isYes === r.covered);
      b.classList.add("done");
      b.setAttribute("aria-pressed", mine ? "true" : "false");
      b.setAttribute("aria-disabled", "true");
      var mk = b.querySelector(".mk");
      var parts = [];
      if(mine) parts.push("your call");
      if(truth) parts.push("the answer");
      mk.textContent = parts.join(" · ");
      mk.hidden = parts.length === 0;
      b.setAttribute("aria-label", (isYes ? YES : NO) + (parts.length ? ", " + parts.join(" and ") : ", not the answer"));
      b.querySelector(".dot").textContent = truth ? "✓" : "";
    });

    var lead = document.getElementById("rlead");
    var body = document.getElementById("rbody");
    lead.innerHTML = I.look + "<span>" + (right ? "<b>You had it.</b>" : "<b>Not this one.</b>") + " " +
                     (r.covered ? "He covered this one." : "He did not cover this one.") + "</span>";
    body.innerHTML = r.why;
    var rv = document.getElementById("reason");
    rv.hidden = false;
    if(animate && !reduce){ rv.classList.remove("on"); void rv.offsetWidth; rv.classList.add("on"); }
  }

  function commit(r, said){
    store.calls[r.id] = said;
    save();
    paint(r, said, true);
    el.next.hidden = false;
    el.hint.innerHTML = "You called this one. The reason is on this frame, under your call.";
    /* focus is placed by hand on every state change, so it can never fall back
       to <body>. Both calls open the same reason, so this lands on the reading
       and not on a button that has just gone inert. */
    document.getElementById("reason").focus();
    say((said === r.covered ? "You had it. " : "Not this one. ") +
        (r.covered ? "He covered this one. " : "He did not cover this one. ") + r.why);
  }

  /* ---------------- the close ---------------- */

  function drawClose(){
    el.h1.textContent = "Two of the seven are in his message";
    el.board.className = "board one";
    el.board.innerHTML =
      '<div class="col">' +
        '<div class="rhead" aria-hidden="true"><span>Requirement</span><span>You said</span><span>The answer</span></div>' +
        '<div class="rows">' +
          REQS.map(function(r,n){
            var said = store.calls[r.id];
            var mine = (said === undefined) ? "Not called" : (said ? "Covered" : "Not covered");
            var truth = r.covered ? "<b>Covered</b>" : "<b>Not covered</b>";
            return '<div class="row">' +
                     '<span class="nm">' + (n+1) + '. ' + r.short +
                       (r.prov ? ' <i class="prov">Sarah added this one</i>' : '') + '</span>' +
                     '<span class="yr">' + mine + '</span>' +
                     '<span class="an">' + truth + '</span>' +
                   '</div>';
          }).join("") +
        '</div>' +
        '<div class="close">' +
          '<p><b>Half an idea reads as no idea, however good the half is.</b> His idea was reasonable, and a reader of that message still cannot tell whether it is worth a meeting, because the five parts that would settle it are not in it.</p>' +
          '<p class="flagline"><b>Requirement 7, the one Sarah added, is what the rest of the week is about.</b> Whether competing models are already being run, or whether this would be a first of its kind, is the question you are about to go and answer for yourself.</p>' +
        '</div>' +
      '</div>';
    el.back.hidden = false;
    el.back.textContent = "Back";
    el.next.hidden = false;
    el.next.textContent = "Run it again";
    el.hint.innerHTML = doneCount() === REQS.length
      ? '<b>That is the end of this one.</b> Nothing further is required.'
      : '<b>' + (REQS.length - doneCount()) + ' of the seven were never called.</b> Their answers are in the table either way.';
  }

  /* ---------------- render ---------------- */

  function render(){
    el.prog.textContent = (i+1) + " of " + TOTAL + " · " +
      (i === 0 ? "What he sent" : (i === TOTAL - 1 ? "All seven together" : "Requirement " + i + " of 7"));
    segs(i);
    if(i === 0){ drawIntro(); }
    else if(i === TOTAL - 1){ drawClose(); }
    else { drawReq(); }
  }

  /* every path through here lands focus on a real element: the frame, which
     holds tabindex="-1", or a control on the frame it just drew */
  function go(n){
    i = Math.max(0, Math.min(TOTAL - 1, n));
    render();
    el.frame.focus();
    say(el.prog.textContent + ". " + el.h1.textContent);
  }

  el.back.addEventListener("click", function(){ go(i - 1); });
  el.next.addEventListener("click", function(){
    if(i === TOTAL - 1){
      store.calls = {}; save();
      go(0);
      say("Cleared. Seven calls to make again.");
      return;
    }
    go(i + 1);
  });

  /* Plain Tab and Enter operate every control in this file. The two number
     keys are an addition, not a protocol: nothing is reachable only by
     keyboard shortcut. */
  document.addEventListener("keydown", function(e){
    var t = e.target, tag = t && t.tagName ? t.tagName.toLowerCase() : "";
    if(tag === "textarea" || tag === "input") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(i === 0 || i === TOTAL - 1) return;
    if(e.key !== "1" && e.key !== "2") return;
    var b = buttons()[e.key === "1" ? 0 : 1];
    if(b && !locked(b)){ e.preventDefault(); b.click(); }
  });

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* exposed for render QA only: lets a headless run force a state without
     hand driving the UI */
  window.__ex = {
    frames:TOTAL,
    goto:function(n){ go(n); },
    call:function(n, said){ go(n); commit(reqAt(n), said); },
    reset:function(){ store.calls = {}; save(); },
    answerAt:function(n){ return reqAt(n).covered; },
    state:function(){ return {i:i, calls:store.calls}; }
  };
})();
</script>
</body>
</html>
