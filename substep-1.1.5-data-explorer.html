<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Explorer — Six Files, One Story</title>
<style>
  :root {
    --bg: #FDF8F8;
    --title: #1C1B1B;
    --body: #484646;
    --shopify: #5E8E3E;
    --shopify-tint: #E9F2E1;
    --analytics: #2A9D8F;
    --analytics-tint: #DEF1EE;
    --meta: #1877F2;
    --meta-tint: #DCE9FD;
    --card: #FFFFFF;
    --line: #ECE4E4;
    --good: #2E7D32;
    --good-bg: #E6F4E7;
    --bad: #C0392B;
    --bad-bg: #FBE9E7;
    --warn-bg: #FFF4E0;
    --warn-line: #E8A33D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--body);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    padding: 24px 16px 56px;
  }

  .mono {
    font-family: "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }

  .wrap {
    max-width: 860px;
    margin: 0 auto;
  }

  /* ---- Progress ---- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
  }
  .progress-label {
    font-weight: 700;
    color: var(--title);
    font-size: 15px;
  }
  .dots {
    display: flex;
    gap: 9px;
  }
  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid #c9bcbc;
    background: transparent;
    padding: 0;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .dot:hover { transform: scale(1.18); }
  .dot.active { background: var(--title); border-color: var(--title); }
  .dot.done { background: #b7a9a9; border-color: #b7a9a9; }
  .dot:focus-visible { outline: 3px solid #001D69; outline-offset: 2px; }

  /* ---- Card / Screen ---- */
  .screen {
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 6px 22px rgba(28,27,27,0.07);
    padding: 26px 26px 28px;
    border: 1px solid var(--line);
    animation: fade .32s ease;
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .screen[hidden] { display: none; }

  .file-header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 6px;
  }
  .file-name {
    font-size: 19px;
    font-weight: 700;
    color: var(--title);
  }
  .pill {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 999px;
    color: #fff;
    letter-spacing: .2px;
  }
  .badge {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: #F1EBEB;
    color: var(--body);
    border: 1px solid var(--line);
  }
  .src-shopify .pill { background: var(--shopify); }
  .src-analytics .pill { background: var(--analytics); }
  .src-meta .pill { background: var(--meta); }

  .accent-bar {
    height: 5px;
    border-radius: 999px;
    width: 100%;
    margin: 14px 0 16px;
  }
  .src-shopify .accent-bar { background: var(--shopify); }
  .src-analytics .accent-bar { background: var(--analytics); }
  .src-meta .accent-bar { background: var(--meta); }

  .whatis {
    font-size: 15px;
    color: var(--title);
    margin: 0 0 16px;
  }

  /* ---- Table ---- */
  .table-note {
    font-size: 12.5px;
    color: #8a7e7e;
    margin: 0 0 6px;
    font-style: italic;
  }
  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
    -webkit-overflow-scrolling: touch;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    min-width: 540px;
  }
  thead th {
    text-align: left;
    padding: 11px 12px;
    background: #F7F1F1;
    color: var(--title);
    font-weight: 700;
    white-space: nowrap;
    border-bottom: 2px solid var(--line);
  }
  /* tooltip header */
  .col-h {
    position: relative;
    cursor: help;
  }
  .col-h .lbl {
    border-bottom: 1.5px dotted #9a8d8d;
    padding-bottom: 1px;
  }
  .col-h .info {
    font-size: 11px;
    color: #001D69;
    margin-left: 3px;
    vertical-align: super;
    font-weight: 700;
  }
  .col-h:focus-visible { outline: 3px solid #001D69; outline-offset: -2px; }
  .tip {
    position: absolute;
    left: 0;
    top: calc(100% + 8px);
    width: 230px;
    max-width: 60vw;
    background: var(--title);
    color: #fff;
    font-weight: 400;
    font-size: 12px;
    line-height: 1.45;
    padding: 9px 11px;
    border-radius: 9px;
    white-space: normal;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px);
    transition: opacity .15s ease, transform .15s ease;
    z-index: 30;
    pointer-events: none;
  }
  .tip::after {
    content: "";
    position: absolute;
    bottom: 100%;
    left: 16px;
    border: 6px solid transparent;
    border-bottom-color: var(--title);
  }
  .col-h:hover .tip,
  .col-h:focus .tip,
  .col-h:focus-within .tip,
  .col-h.show .tip {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  tbody td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  tbody tr:nth-child(even) { background: #FBF7F7; }
  tbody tr:last-child td { border-bottom: none; }
  .empty-cell {
    color: #b0a4a4;
    font-style: italic;
    background: #F3EEEE;
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 11.5px;
  }

  /* ---- Answer lines ---- */
  .answers {
    margin: 18px 0 4px;
    display: grid;
    gap: 8px;
  }
  .ans {
    font-size: 13.5px;
    padding: 9px 13px;
    border-radius: 10px;
  }
  .ans.can { background: var(--good-bg); color: #1f5b22; }
  .ans.cant { background: var(--bad-bg); color: #8c2c20; }
  .ans b { font-weight: 700; }

  .watch {
    margin-top: 14px;
    background: var(--warn-bg);
    border: 1px solid var(--warn-line);
    border-left: 5px solid var(--warn-line);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 13.5px;
    color: #7a5410;
  }
  .watch b { color: #8a5a08; }

  /* ---- Quiz ---- */
  .quiz {
    margin-top: 18px;
    border-top: 1px dashed var(--line);
    padding-top: 16px;
  }
  .quiz-q {
    font-weight: 700;
    color: var(--title);
    font-size: 14.5px;
    margin: 0 0 12px;
  }
  .quiz-q .tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: .5px;
    text-transform: uppercase;
    background: #DCE1FF;
    color: #001D69;
    padding: 2px 9px;
    border-radius: 999px;
    margin-right: 8px;
    vertical-align: 1px;
  }
  .opts { display: grid; gap: 9px; }
  .opt {
    text-align: left;
    font-size: 13.5px;
    padding: 11px 14px;
    border-radius: 11px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--body);
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .08s;
    font-family: inherit;
  }
  .opt:hover { border-color: #b7a9a9; transform: translateX(2px); }
  .opt:focus-visible { outline: 3px solid #001D69; outline-offset: 2px; }
  .opt .mark { font-weight: 700; margin-left: 6px; }
  .opt.correct {
    background: var(--good-bg);
    border-color: var(--good);
    color: #1f5b22;
  }
  .opt.wrong {
    background: var(--bad-bg);
    border-color: var(--bad);
    color: #8c2c20;
  }
  .opt.dim { opacity: .55; }
  .explain {
    margin-top: 12px;
    font-size: 13.5px;
    padding: 11px 14px;
    border-radius: 10px;
    background: #F2EEFE;
    color: #4a3b86;
    display: none;
  }
  .explain.show { display: block; }
  .explain b { color: #362a66; }

  /* ---- Nav ---- */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 22px;
  }
  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 11px 22px;
    border-radius: 11px;
    border: none;
    cursor: pointer;
    transition: transform .08s, opacity .15s, background .15s;
  }
  .btn:focus-visible { outline: 3px solid #001D69; outline-offset: 2px; }
  .btn-back {
    background: #F1EBEB;
    color: var(--body);
  }
  .btn-back:hover { background: #E6DEDE; }
  .btn-next {
    background: #001D69;
    color: #fff;
  }
  .btn-next:hover { transform: translateX(2px); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:disabled:hover { transform: none; }

  /* ---- Wrap screen ---- */
  .wrap-screen {
    text-align: center;
    padding: 40px 26px 44px;
  }
  .wrap-screen h2 {
    color: var(--title);
    font-size: 26px;
    margin: 0 0 18px;
  }
  .wrap-icons {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .wrap-icons span {
    width: 38px; height: 38px;
    border-radius: 9px;
    display: inline-block;
  }
  .wrap-body {
    font-size: 16px;
    color: var(--body);
    max-width: 580px;
    margin: 0 auto;
    line-height: 1.7;
  }
  .wrap-body b { color: var(--title); }

  @media (max-width: 560px) {
    .screen { padding: 20px 16px 22px; }
    .file-name { font-size: 17px; }
    .btn { padding: 10px 16px; font-size: 13px; }
    .tip { width: 200px; }
  }

  /* ---- Auto-tour ---- */
  /* "what this file is" pop */
  .whatis.pop {
    animation: whatisPop 2s ease;
    border-radius: 10px;
  }
  @keyframes whatisPop {
    0%   { background: transparent; transform: scale(1); box-shadow: none; }
    15%  { background: #DCE1FF; transform: scale(1.025); box-shadow: 0 6px 18px rgba(0,29,105,0.15); }
    80%  { background: #DCE1FF; transform: scale(1.025); box-shadow: 0 6px 18px rgba(0,29,105,0.15); }
    100% { background: transparent; transform: scale(1); box-shadow: none; }
  }
  .whatis {
    padding: 2px 6px;
    margin-left: -6px;
    transition: background .3s ease, transform .3s ease;
  }

  /* highlighted column header + cells during tour */
  thead th.tour-active {
    background: #DCE1FF !important;
    box-shadow: inset 0 0 0 2px #001D69;
  }
  tbody td.tour-col {
    background: #EEF1FF !important;
  }

  /* the moving pointer/caret */
  .tour-pointer {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 11px solid transparent;
    border-right: 11px solid transparent;
    border-bottom: 15px solid #001D69;
    filter: drop-shadow(0 2px 3px rgba(0,29,105,0.4));
    opacity: 0;
    transform: translate(-50%, 0);
    transition: left .5s cubic-bezier(.4,0,.2,1), top .5s cubic-bezier(.4,0,.2,1), opacity .25s ease;
    pointer-events: none;
    z-index: 40;
  }
  .tour-pointer.on { opacity: 1; }
  .tour-pointer::after {
    content: "";
    position: absolute;
    left: -11px; top: 15px;
    width: 22px; height: 22px;
    background: #001D69;
    border-radius: 50%;
    opacity: .14;
    animation: pointerPulse 1.4s ease-in-out infinite;
  }
  @keyframes pointerPulse {
    0%,100% { transform: scale(.9); opacity: .14; }
    50%     { transform: scale(1.5); opacity: 0; }
  }
  /* the table-scroll wrapper needs to host the absolute pointer */
  .table-scroll { position: relative; }

  /* tour controls */
  .tour-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 0 4px;
    flex-wrap: wrap;
  }
  .tour-controls .tc-label {
    font-size: 12.5px;
    color: #8a7e7e;
    margin-right: 2px;
  }
  .tc-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--title);
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .08s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .tc-btn:hover { border-color: #b7a9a9; background: #FBF7F7; }
  .tc-btn:active { transform: scale(.96); }
  .tc-btn:focus-visible { outline: 3px solid #001D69; outline-offset: 2px; }
  .tc-status {
    font-size: 12px;
    color: #8a7e7e;
    margin-left: 2px;
  }

  /* aria-live region — visually subtle caption, screen-reader friendly */
  .tour-live {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* reduced-motion: static caption list under the table */
  .tour-static {
    display: none;
    margin: 12px 0 4px;
    gap: 6px;
  }
  .tour-static .tsi {
    font-size: 12.5px;
    line-height: 1.5;
    padding: 7px 11px;
    border-radius: 9px;
    background: #F7F4FF;
    color: #4a3b86;
  }
  .tour-static .tsi b {
    color: #001D69;
    font-family: "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }

  /* "Show all" fast-forward: reuse the static caption list, force it visible */
  .tour-static.show-all { display: grid; }

  @media (prefers-reduced-motion: reduce) {
    .tour-pointer { display: none !important; }
    .whatis.pop { animation: none; background: #DCE1FF; }
    .tour-static { display: grid; }
    .tour-controls { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar" id="topbar">
    <span class="progress-label" id="progressLabel">File 1 of 6</span>
    <div class="dots" id="dots" role="tablist" aria-label="Jump to file"></div>
  </div>

  <div id="screens"></div>

  <div class="nav">
    <button class="btn btn-back" id="backBtn">◀ Back</button>
    <button class="btn btn-next" id="nextBtn">Next ▶</button>
  </div>

</div>

const TOTAL = FILES.length;
const LAST = TOTAL; // wrap screen index

/* ============ RENDER ============ */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function cell(v){
  if (v && typeof v === "object" && v.empty) {
    return '<span class="empty-cell">(empty)</span>';
  }
  return esc(v);
}

function buildFileScreen(f, idx){
  const headCells = f.cols.map(c =>
    `<th class="col-h${c.tour ? ' is-key' : ''}"${c.tour ? ' data-tour="1"' : ''} tabindex="0" aria-label="${esc(c.k)}: ${esc(c.t)}">
        <span class="lbl mono">${esc(c.k)}</span><span class="info">ⓘ</span>
        <span class="tip">${esc(c.t)}</span>
     </th>`).join("");

  const bodyRows = f.data.map(r =>
    `<tr>${r.map(v => `<td>${cell(v)}</td>`).join("")}</tr>`).join("");

  const optsHtml = f.opts.map((o,i) =>
    `<button class="opt" data-i="${i}" onclick="answer(${idx},${i})">${esc(o)}<span class="mark"></span></button>`).join("");

  return `
  <section class="screen src-${f.src}" data-screen="${idx}" ${idx===0?'':'hidden'} role="group" aria-label="${esc(f.name)}">
    <div class="file-header">
      <span class="file-name mono">${esc(f.name)}</span>
      <span class="pill">${esc(f.srcLabel)}</span>
      <span class="badge">${esc(f.rows)}</span>
    </div>
    <div class="accent-bar"></div>
    <p class="whatis">${esc(f.whatis)}</p>

    ${f.note ? `<p class="table-note">${esc(f.note)}</p>` : ``}
    <div class="table-scroll">
      <div class="tour-pointer" aria-hidden="true"></div>
      <table>
        <thead><tr>${headCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>

    <div class="tour-controls" aria-label="Guided tour controls">
      <span class="tc-label">Guided tour:</span>
      <button class="tc-btn tc-toggle" type="button" aria-label="Pause or play the guided tour">⏸ Pause</button>
      <button class="tc-btn tc-skip" type="button" aria-label="Skip the tour and show all column explanations at once">Show all ⏭</button>
      <button class="tc-btn tc-replay" type="button" aria-label="Replay the guided tour from the start">↻ Replay</button>
      <span class="tc-status" aria-hidden="true"></span>
    </div>

    <div class="tour-static" aria-hidden="true">
      ${f.cols.map(c => `<div class="tsi"><b>${esc(c.k)}</b> — ${esc(c.t)}</div>`).join("")}
    </div>

    <div class="tour-live" aria-live="polite"></div>

    <div class="answers">
      <div class="ans can"><b>✅ It can answer:</b> ${esc(f.can)}</div>
      <div class="ans cant"><b>🚫 It can't answer:</b> ${esc(f.cant)}</div>
    </div>

    <div class="watch"><b>⚠️ Watch out:</b> ${esc(f.watch)}</div>

    <div class="quiz">
      <p class="quiz-q"><span class="tag">Quick check</span>${esc(f.q)}</p>
      <div class="opts" id="opts-${idx}">${optsHtml}</div>
      <div class="explain" id="explain-${idx}"></div>
    </div>
  </section>`;
}

function buildWrap(){
  return `
  <section class="screen wrap-screen" data-screen="${LAST}" hidden role="group" aria-label="Summary">
    <div class="wrap-icons">
      <span style="background:var(--shopify)"></span>
      <span style="background:var(--shopify)"></span>
      <span style="background:var(--shopify)"></span>
      <span style="background:var(--analytics)"></span>
      <span style="background:var(--meta)"></span>
      <span style="background:var(--meta)"></span>
    </div>
    <h2>Six files, one story</h2>
    <p class="wrap-body">Six files. About <b>10,500 rows</b>. Two separate systems (<b>Shopify</b> and <b>Meta</b>). And <b>not one shared ID</b> between them. Knowing what's in each file is this week's job — connecting them is next week's.</p>
  </section>`;
}

const screensEl = document.getElementById("screens");
screensEl.innerHTML = FILES.map(buildFileScreen).join("") + buildWrap();

/* dots */
const dotsEl = document.getElementById("dots");
for (let i=0;i<TOTAL;i++){
  const b = document.createElement("button");
  b.className = "dot" + (i===0?" active":"");
  b.setAttribute("role","tab");
  b.setAttribute("aria-label","Go to file "+(i+1));
  b.onclick = () => goTo(i);
  dotsEl.appendChild(b);
}

/* ============ STATE / NAV ============ */
let current = 0;
const backBtn = document.getElementById("backBtn");
const nextBtn = document.getElementById("nextBtn");
const progressLabel = document.getElementById("progressLabel");

function render(){
  document.querySelectorAll(".screen").forEach(s => {
    s.hidden = (+s.dataset.screen !== current);
  });
  // dots
  [...dotsEl.children].forEach((d,i) => {
    d.classList.toggle("active", i===current);
    d.classList.toggle("done", i<current);
  });
  // progress label
  if (current < TOTAL) {
    progressLabel.textContent = `File ${current+1} of ${TOTAL}`;
    dotsEl.style.visibility = "visible";
  } else {
    progressLabel.textContent = "Done — recap";
    dotsEl.style.visibility = "hidden";
  }
  // buttons
  backBtn.disabled = (current === 0);
  nextBtn.textContent = (current === LAST) ? "Done" : "Next ▶";
  nextBtn.disabled = (current === LAST);

  // focus current screen for a11y
  const cs = document.querySelector(`.screen[data-screen="${current}"]`);
  if (cs) cs.scrollIntoView({block:"nearest"});
  window.scrollTo({top:0, behavior:"smooth"});
}

function goTo(i){
  if (i < 0 || i > LAST) return;
  stopTour();              // cancel any running tour before leaving the screen
  current = i;
  render();
  startTourForCurrent();   // fresh tour on the screen we just landed on
}
backBtn.onclick = () => goTo(current-1);
nextBtn.onclick = () => goTo(current+1);

/* keyboard arrows */
document.addEventListener("keydown", (e) => {
  if (e.target.classList && e.target.classList.contains("opt")) return;
  if (e.key === "ArrowRight") {
    // While the tour is walking columns, Right-arrow jumps to the next column.
    const t = (current < TOTAL) ? tours[current] : null;
    if (t && advanceTour(t)) { e.preventDefault(); return; }
    if(current<LAST) goTo(current+1);
  }
  if (e.key === "ArrowLeft")  { if(current>0)    goTo(current-1); }
});

/* tap-to-toggle tooltip on touch devices */
document.querySelectorAll(".col-h").forEach(th => {
  th.addEventListener("click", (e) => {
    document.querySelectorAll(".col-h.show").forEach(o => { if(o!==th) o.classList.remove("show"); });
    th.classList.toggle("show");
  });
});

/* Manual hover/focus on a header pauses the auto-tour and shows that header's
   tooltip; moving away resumes. Native :hover/:focus already render the tip. */
document.querySelectorAll(".screen .col-h").forEach(th => {
  const screen = th.closest(".screen");
  const onEnter = () => {
    const t = tours[+screen.dataset.screen];
    if (t && t.running && !t.paused) { t.pausedByHover = true; pauseTour(t); }
  };
  const onLeave = () => {
    const t = tours[+screen.dataset.screen];
    if (t && t.pausedByHover) { t.pausedByHover = false; resumeTour(t); }
  };
  th.addEventListener("mouseenter", onEnter);
  th.addEventListener("mouseleave", onLeave);
  th.addEventListener("focus", onEnter);
  th.addEventListener("blur", onLeave);

  // Clicking the currently-active column header jumps to the next column.
  th.addEventListener("click", () => {
    const t = tours[+screen.dataset.screen];
    if (!t || !t.running) return;
    // hover may have paused it; releasing the hover-pause lets advance run
    if (t.pausedByHover) { t.pausedByHover = false; t.paused = false; if (t.toggleBtn) t.toggleBtn.textContent = "⏸ Pause"; }
    const tourCols = (t.tourIdx && t.tourIdx.length) ? t.tourIdx : t.headers.map((h,i)=>i);
    if (t.headers.indexOf(th) === tourCols[t.step]) advanceTour(t);
  });
});

/* ============ AUTO-TOUR ============ */
const REDUCE_MOTION = window.matchMedia
  && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// per-screen tour state, keyed by screen index
const tours = {};

function tipDwell(text){
  // scale dwell to reading time: min 1.8s, +35ms/char, cap 3s
  return Math.min(3000, Math.max(1800, 1800 + (text ? text.length : 0) * 35));
}

function getTour(idx){
  if (tours[idx]) return tours[idx];
  const screen = document.querySelector(`.screen[data-screen="${idx}"]`);
  if (!screen || idx >= TOTAL) return null; // no tour on wrap screen
  tours[idx] = {
    idx,
    screen,
    whatis: screen.querySelector(".whatis"),
    headers: [...screen.querySelectorAll(".col-h")],
    tourIdx: [...screen.querySelectorAll(".col-h")].map((h,i)=> h.dataset.tour ? i : -1).filter(i=>i>=0),
    pointer: screen.querySelector(".tour-pointer"),
    live: screen.querySelector(".tour-live"),
    toggleBtn: screen.querySelector(".tc-toggle"),
    skipBtn: screen.querySelector(".tc-skip"),
    staticEl: screen.querySelector(".tour-static"),
    statusEl: screen.querySelector(".tc-status"),
    scroller: screen.querySelector(".table-scroll"),
    timer: null,
    step: -1,        // -1 = not yet at columns (intro), 0..n-1 = columns, n = done
    running: false,
    paused: false,
    pausedByHover: false,
    bound: false
  };
  const t = tours[idx];
  if (!t.bound) {
    if (t.toggleBtn) t.toggleBtn.addEventListener("click", () => toggleTour(t));
    if (t.skipBtn) t.skipBtn.addEventListener("click", () => showAllTour(t));
    const rep = screen.querySelector(".tc-replay");
    if (rep) rep.addEventListener("click", () => { stopTour(); startTourForCurrent(true); });
    t.bound = true;
  }
  return t;
}

function clearHighlights(t){
  t.headers.forEach(h => {
    h.classList.remove("tour-active", "show");
  });
  t.screen.querySelectorAll("tbody td.tour-col").forEach(td => td.classList.remove("tour-col"));
  if (t.pointer) t.pointer.classList.remove("on");
}

function setStatus(t, txt){
  if (t.statusEl) t.statusEl.textContent = txt;
}

function highlightColumn(t, colIdx){
  clearHighlights(t);
  const th = t.headers[colIdx];
  if (!th) return;
  th.classList.add("tour-active", "show");

  // highlight the cells in that column
  const cellPos = colIdx; // header order matches td order
  t.screen.querySelectorAll("tbody tr").forEach(tr => {
    const td = tr.children[cellPos];
    if (td) td.classList.add("tour-col");
  });

  // announce for screen readers
  const tipText = th.querySelector(".tip");
  const label = th.querySelector(".lbl");
  if (t.live) t.live.textContent =
    (label ? label.textContent + ": " : "") + (tipText ? tipText.textContent : "");

  // move the pointer to the header (skipped under reduced motion via CSS display:none)
  if (t.pointer && !REDUCE_MOTION) {
    // make sure the active header is visible in the horizontal scroller
    if (th.offsetLeft < t.scroller.scrollLeft ||
        th.offsetLeft + th.offsetWidth > t.scroller.scrollLeft + t.scroller.clientWidth) {
      t.scroller.scrollTo({ left: Math.max(0, th.offsetLeft - 16), behavior: "smooth" });
    }
    const x = th.offsetLeft + th.offsetWidth / 2 - t.scroller.scrollLeft;
    const y = th.offsetTop + th.offsetHeight + 4;
    t.pointer.style.left = x + "px";
    t.pointer.style.top = y + "px";
    t.pointer.classList.add("on");
  }
}

function tourSchedule(t, delay, fn){
  clearTimeout(t.timer);
  t.timer = setTimeout(() => { t.timer = null; if (!t.paused) fn(); }, delay);
}

function runTourStep(t){
  if (!t.running || t.paused) return;

  if (t.step === -1) {
    // intro: pop the "what this file is" line
    if (t.whatis) {
      t.whatis.classList.remove("pop");
      void t.whatis.offsetWidth; // reflow to restart animation
      t.whatis.classList.add("pop");
    }
    if (t.live) t.live.textContent = t.whatis ? t.whatis.textContent : "";
    setStatus(t, "Reading the file…");
    t.step = 0;
    tourSchedule(t, 2000, () => runTourStep(t));
    return;
  }

  const tourCols = (t.tourIdx && t.tourIdx.length) ? t.tourIdx : t.headers.map((h,i)=>i);
  if (t.step >= tourCols.length) {
    // settle at the end — clean resting state
    finishTour(t);
    return;
  }

  // walk a key column — t.step indexes the tour stops; colIdx is the real column
  const colIdx = tourCols[t.step];
  highlightColumn(t, colIdx);
  setStatus(t, `Key column ${t.step + 1} of ${tourCols.length}`);
  const tip = t.headers[colIdx].querySelector(".tip");
  const dwell = tipDwell(tip ? tip.textContent : "");
  tourSchedule(t, dwell, () => { t.step++; runTourStep(t); });
}

// Jump straight to the next column instead of waiting out the dwell.
// Only acts while the tour is actively walking columns (step 0..n-1).
// Returns true if it consumed the advance request.
function advanceTour(t){
  if (!t || !t.running || t.paused) return false;
  const tourLen = (t.tourIdx && t.tourIdx.length) ? t.tourIdx.length : t.headers.length;
  if (t.step < 0 || t.step >= tourLen) return false;
  clearTimeout(t.timer); t.timer = null;
  t.step++;
  runTourStep(t);
  return true;
}

function finishTour(t){
  clearTimeout(t.timer); t.timer = null;
  clearHighlights(t);
  if (t.whatis) t.whatis.classList.remove("pop");
  t.running = false;
  t.paused = false;
  if (t.live) t.live.textContent = "Tour complete.";
  setStatus(t, "Done");
  if (t.toggleBtn) t.toggleBtn.textContent = "↻ Play";
  t._done = true;
}

// "Show all": stop the walk for this file and reveal every column explanation
// at once as static, always-visible captions (reuses the reduced-motion list).
function showAllTour(t){
  clearTimeout(t.timer); t.timer = null;
  clearHighlights(t);
  if (t.whatis) t.whatis.classList.remove("pop");
  t.running = false;
  t.paused = false;
  t.pausedByHover = false;
  t._done = true;
  if (t.staticEl) t.staticEl.classList.add("show-all");
  if (t.toggleBtn) t.toggleBtn.textContent = "↻ Play";
  setStatus(t, "Showing all");
  if (t.live) t.live.textContent =
    (t.whatis ? t.whatis.textContent + " " : "") +
    "Column explanations are listed below the table.";
}

function pauseTour(t){
  if (!t.running || t.paused) return;
  t.paused = true;
  clearTimeout(t.timer); t.timer = null;
  if (t.toggleBtn) t.toggleBtn.textContent = "▶ Play";
  setStatus(t, "Paused");
}

function resumeTour(t){
  if (!t.running || !t.paused) return;
  t.paused = false;
  if (t.toggleBtn) t.toggleBtn.textContent = "⏸ Pause";
  // re-run the current step (re-highlights the same column and reschedules its dwell)
  runTourStep(t);
}

function toggleTour(t){
  if (t._done || !t.running) {
    // replay from start
    stopTour();
    startTourForCurrent(true);
    return;
  }
  if (t.paused) resumeTour(t); else pauseTour(t);
}

// stop / reset whatever tour is on the current screen (called before navigating away)
function stopTour(){
  Object.values(tours).forEach(t => {
    clearTimeout(t.timer); t.timer = null;
    clearHighlights(t);
    if (t.whatis) t.whatis.classList.remove("pop");
    t.running = false;
    t.paused = false;
    t.pausedByHover = false;
    t.step = -1;
    t._done = false;
    if (t.staticEl) t.staticEl.classList.remove("show-all");
    if (t.toggleBtn) t.toggleBtn.textContent = "⏸ Pause";
    if (t.statusEl) t.statusEl.textContent = "";
    if (t.live) t.live.textContent = "";
  });
}

function startTourForCurrent(force){
  if (current >= TOTAL) return; // no tour on wrap screen
  const t = getTour(current);
  if (!t) return;

  if (REDUCE_MOTION) {
    // static fallback: captions are always visible via CSS; just announce intro.
    if (t.live) t.live.textContent =
      (t.whatis ? t.whatis.textContent + " " : "") +
      "Column explanations are listed below the table.";
    if (t.whatis) { t.whatis.classList.add("pop"); }
    return;
  }

  t.running = true;
  t.paused = false;
  t.pausedByHover = false;
  t.step = -1;
  t._done = false;
  if (t.toggleBtn) t.toggleBtn.textContent = "⏸ Pause";
  runTourStep(t);
}

/* ============ QUIZ ============ */
function answer(screenIdx, choice){
  const f = FILES[screenIdx];
  const optsBox = document.getElementById("opts-"+screenIdx);
  const explainBox = document.getElementById("explain-"+screenIdx);
  const buttons = [...optsBox.querySelectorAll(".opt")];

  buttons.forEach((b,i) => {
    b.classList.remove("correct","wrong","dim");
    const mark = b.querySelector(".mark");
    mark.textContent = "";
    if (i === f.correct) {
      b.classList.add("correct");
      mark.textContent = " ✓";
    } else if (i === choice) {
      b.classList.add("wrong");
      mark.textContent = " ✗";
    } else {
      b.classList.add("dim");
    }
  });

  const right = (choice === f.correct);
  explainBox.innerHTML = `<b>${right ? "Correct." : "Not quite."}</b> ${esc(f.explain)}`;
  explainBox.classList.add("show");
}
window.answer = answer;

render();
startTourForCurrent(); // auto-tour on first load
</script>
</body>
