<!--
  vCISO P4 Step 1, Module 6 (optional): Read How Real Companies Answer.
  Build spec in 06-content/project-04/step-01/module-06-internal.md (Build Note),
  adapted to the real pair. Look, navigation, scale-to-fit and phone layout match
  vciso-p4-m11-which-answer-would-you-rather-receive.html.

  Sources:
  - The question, IAM-08.1, word for word from the CAIQ file.
  - The weak answer and the strong answer: column E of two public CAIQ files, word for
    word, with the company name replaced by "[Company]" wherever it appears. The strong
    answer's bare URL line is left out; "Please refer to the Entitlement Review SOP:" is kept.
  - Both answers are marked Yes in column C.
  - The plain-words gloss, the highlight labels and the key text are ours.
  No company name and no source name appear anywhere: Step 2 of the prose introduces
  where the files come from.

  16 Oct 2026 update, to match the module (Read How Real Companies Answer):
  - The module says both picks have a right answer: the company whose answer names
    the process. So the owner's right/wrong pattern applies to both picks: the right
    pick shows a green tick and "Right"; a wrong pick shows a red cross and "Not quite"
    with one plain line, and the student tries again. With two options, one wrong try
    leaves only the right one, so the "after two wrong tries" step cannot be reached;
    the student picks the other company to finish (same as the m11 interactive).
  - The student writes both picks in the note on their laptop first (module wording).
  - The strong answer still sits on a random side on a fresh start.
  - The old "you picked different companies" line is gone: after the try again both
    picks end on the same company. The reveal tags now show the student's first picks.

<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    /* right and wrong states only, always paired with an icon and a word */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-reveal:520ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}

  h1{font-size:27px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- the question ---- */
  .plead{display:none}
  .qform{flex:0 0 auto;display:flex;gap:12px;align-items:flex-start;background:var(--highlight);
    border-left:5px solid var(--on-highlight);border-radius:0 12px 12px 0;padding:8px 16px}
  .qform .qi{color:var(--on-highlight);flex:0 0 auto;margin-top:2px}
  .qform .qi svg.ic{width:24px;height:24px}
  .qform .qt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .qform .ql{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .qform .qq{font-size:15.5px;font-weight:600;line-height:1.3;color:var(--title)}
  .qform .qd{font-size:13.5px;line-height:1.35;color:var(--body)}

  /* ---- answer cards ---- */
  .cards{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{min-height:0;background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:12px;
    padding:9px 6px 8px 14px;display:flex;flex-direction:column;gap:6px}
  .card .ch{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:8px}
  .card .bi{width:28px;height:28px;border-radius:8px;background:var(--highlight);border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .card .bi svg.ic{width:17px;height:17px}
  .card .cl{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--on-highlight);border-radius:20px;
    padding:1px 9px 1px 7px;font-size:12px;font-weight:600;color:var(--on-highlight);background:var(--bg)}
  .chip svg.ic{width:12px;height:12px;stroke-width:2.4}
  .tag{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--on-highlight);border-radius:20px;
    padding:1px 9px 1px 7px;font-size:12px;font-weight:600;color:var(--on-highlight);background:var(--highlight)}
  .tag svg.ic{width:12px;height:12px}
  .tw{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px;position:relative}
  .more{position:absolute;right:12px;bottom:2px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
    color:var(--on-highlight);background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:20px;padding:1px 9px 1px 7px;
    box-shadow:0 -10px 12px 2px var(--bg);pointer-events:none}
  .nw{white-space:nowrap}
  .more svg.ic{width:13px;height:13px;stroke-width:2.2}

  .txt{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:10px;font-size:14px;line-height:1.45;color:var(--title);
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior:contain}
  .txt:focus{outline:none}
  .txt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px;border-radius:4px}
  .txt p + p{margin-top:6px}
  .txt p.hd{font-weight:600}

  /* ---- the two picks ---- */
  .picks{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
  .pwrap{display:flex;flex-direction:column;gap:3px}
  .prow{display:flex;align-items:center;gap:10px}
  .prow .pn{width:24px;height:24px;border-radius:50%;background:var(--on-highlight);color:var(--bg);
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .prow .pq{flex:1 1 auto;min-width:0;font-size:15px;font-weight:600;line-height:1.3;color:var(--title)}
  .prow .pb{display:flex;gap:8px;flex:0 0 auto}
  button.pk{font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;min-width:122px;white-space:nowrap;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 14px;border-radius:8px;
    border:1.5px solid var(--on-highlight);background:var(--bg);color:var(--on-highlight);
    transition:background var(--t-fast) var(--ease-out),color var(--t-fast) var(--ease-out)}
  button.pk .g{width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center}
  button.pk .g svg.ic{width:10px;height:10px;stroke-width:3}
  @media (hover:hover){ button.pk:hover:not(:disabled){background:var(--highlight)} }
  button.pk:disabled{cursor:default}
  button.pk:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.pk .lb{font-size:12.5px;font-weight:700}
  /* Right: green, tick, "Right". Wrong: red, cross, "Not quite". */
  button.pk.ok{background:var(--ok-tint);border:2px solid var(--ok);color:var(--ok)}
  button.pk.ok .g{background:var(--ok);border-color:var(--ok);color:var(--bg)}
  button.pk.no{background:var(--no-tint);border:2px solid var(--no);color:var(--no)}
  button.pk.no .g{background:var(--no);border-color:var(--no);color:var(--bg)}
  .fb{display:flex;align-items:flex-start;gap:6px;padding-left:34px;font-size:13.5px;line-height:1.35;color:var(--title)}
  .fb svg.ic{width:16px;height:16px;stroke-width:2.2;flex:0 0 auto;margin-top:1px}
  .fb b{font-weight:700}
  .fb.ok b,.fb.ok svg.ic{color:var(--ok)}
  .fb.no b,.fb.no svg.ic{color:var(--no)}
  .fb.in{animation:rin var(--t-reveal) var(--ease-over) both}
  /* Once a pick has its line, tighten the spacing so both answers keep their room. */
  .board.fbon{gap:7px}
  .board.fbon .picks{gap:3px}
  .board.fbon .pwrap{gap:1px}
  .board.fbon .qform{padding-top:6px;padding-bottom:6px}
  h1.fbon{margin-bottom:6px}
  .frame.fbon .top{margin-bottom:4px}
  .frame.fbon .bar{padding-top:6px}
  .frame.fbon .card{gap:4px;padding-top:7px}
  .frame.fbon .card .bi{width:24px;height:24px}
  .frame.fbon .fb{line-height:1.25}

  /* ---- the reveal ---- */
  .rev{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1.18fr 1fr 1.02fr;gap:14px}
  .rev .card .bi{display:none}
  .rcol{min-height:0;display:flex;flex-direction:column;gap:8px}
  .rev .card{flex:1 1 auto}
  .rev .txt{font-size:13.5px;line-height:1.47}

  /* highlights, over the answer's own words */
  .hl{background:var(--highlight);color:var(--title);border-bottom:2px solid var(--on-highlight);
    padding:0 2px;border-radius:3px 3px 0 0;-webkit-box-decoration-break:clone;box-decoration-break:clone;
    transition:outline-color var(--t-fast) var(--ease-out)}
  .hl.dash{background:transparent;border-bottom:2px dashed var(--on-highlight)}
  .hlb{display:block;background:var(--highlight);border-left:4px solid var(--on-highlight);border-radius:0 6px 6px 0;

  .bn{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;border-radius:50%;

    margin-right:4px;vertical-align:1px;padding:0 4px}
  .hl.flash,.hlb.flash{outline:2.5px solid var(--on-highlight);outline-offset:1px}

  .tags{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;padding-right:8px}
  .key{min-height:0;display:flex;flex-direction:column;gap:4px}
  .key .kh{font-size:12.5px;line-height:1.35;color:var(--body)}
  .key .kh b{color:var(--title);font-weight:600}
  button.ky{font-family:inherit;text-align:left;cursor:pointer;background:var(--tint);border:1.5px solid var(--line);
    border-radius:10px;padding:5px 9px;display:flex;gap:7px;align-items:flex-start;color:var(--body);
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  @media (hover:hover){ button.ky:hover{background:var(--highlight);border-color:var(--on-highlight)} }
  button.ky.on{background:var(--highlight);border-color:var(--on-highlight)}
  button.ky:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.ky .bn{flex:0 0 auto;margin:1px 0 0}
  button.ky .kt{display:flex;flex-direction:column;gap:1px;min-width:0}
  button.ky .kl{font-size:13px;font-weight:700;line-height:1.25;color:var(--title)}
  button.ky .kd{font-size:12.5px;line-height:1.3;color:var(--body)}

  .notes{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;border-top:1.5px dashed var(--line);padding-top:7px;margin-right:8px}
  .notes p{display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:1.36;color:var(--title)}
  .notes p .bn{flex:0 0 auto;margin:1px 0 0}

  .in{animation:rin var(--t-reveal) var(--ease-over) both}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:50px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;min-height:40px;font-size:13.5px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden;overflow-y:auto}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}

    .board{flex:0 0 auto}
    .plead{display:block;font-size:16px;line-height:1.45;font-weight:600;color:var(--title)}
    .qform{padding:10px 12px}
    .qform .qq{font-size:16px}
    .qform .qd{font-size:15px}
    .cards,.rev{grid-template-columns:1fr}
    .card{padding:10px 12px}
    .txt,.rev .txt{overflow:visible;font-size:15.5px;padding-right:0}
    .more{display:none}
    .prow{flex-wrap:wrap}
    .prow .pq{flex:1 1 calc(100% - 34px);font-size:16px}
    .prow .pb{flex:1 1 100%;padding-left:34px}
    button.pk{flex:1 1 0;min-width:0;font-size:16px;padding:11px 10px;white-space:normal;flex-wrap:wrap}
    .fb{font-size:15px;padding-left:0}
    .board.fbon{gap:10px}
    .yours p{font-size:15.5px}
    .key .kh{font-size:15px}
    button.ky .kl{font-size:15px}
    button.ky .kd{font-size:15px}
    .notes{margin-right:0}
    .notes p{font-size:15px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{min-height:0;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow:auto!important}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}

  </style>
  <div class="nsf">
    <h2>Which Answer Told You Something?</h2>
    <p>Question IAM-08.1: <strong>"Are reviews and revalidation of user access for least privilege and separation of duties completed with a frequency commensurate with organizational risk tolerance?"</strong></p>
    <p>In plain words: does the company regularly check who can get into its systems, and take away access people should not have?</p>
    <p>Both companies answered Yes. Here is what each one wrote.</p>
    <div class="box">
      <p><strong>Company 1:</strong> "[Company] is responsible for reviewing and revalidating user access for least privilege and separation of duties with a frequency that is commensurate with organizational risk tolerance. [Company] implements its Identity and Access Management Policy and related Procedures; and Access Control Policies and Procedures to meet compliance with this requirement."</p>
    </div>
    <div class="box">
      <p><strong>Company 2:</strong></p>
      <p>[Company] User Identities:</p>
      <p>[Company] utilizes an identity and access management system to maintain an inventory of identities including level of information system access. At a minimum, quarterly entitlement reviews are carried out to ensure that personnel have the appropriate logical access rights assigned to them. Reviews also take place when personnel change roles within [Company]. The majority of [Company] personnel have no access to any systems hosting customer data, or to customer data in general.</p>
      <p>Please refer to the Entitlement Review SOP:</p>
      <p>Customer Instance User Identities:</p>
      <p>[Company] customers are responsible for the management of user identities within their instances. This includes the creation of individual identities (credentials) for each of their users, both internal and external, the methods used to authenticate those users, password policies (for built&#8208;in authentication), and the entitlements and access levels granted to those users.</p>
    </div>
    <p>Before you read on, write down two picks in the note on your laptop: the company that you would rather hand patient data to, and the answer that you think actually told you something.</p>
    <p>For both picks, the right answer is Company 2, the company whose answer names the process. Company 1's answer feels safer because it admits nothing, but it gives you nothing that you could check.</p>
    <h3>What a strong answer contains</h3>
    <ul>
      <li><strong>The scope:</strong> Company 2 says whose access it checks, its own staff, and that most of them cannot reach customer data at all.</li>
      <li><strong>Specifics instead of adjectives:</strong> facts you could check. "At a minimum, quarterly" means at least every three months, and "Reviews also take place when personnel change roles".</li>
      <li><strong>A named process:</strong> "quarterly entitlement reviews", written down in the "Entitlement Review SOP". An SOP is a written list of steps. An entitlement is the access a person is given.</li>
      <li><strong>"Partly," with a reason attached:</strong> it still answered Yes, but says what its checks do not cover: accounts in each customer's own copy of the service. Those are the customer's job.</li>
    </ul>
    <p>Company 1's first sentence repeats the question back. Its second, "implements its Identity and Access Management Policy and related Procedures", tells you there is a policy, but not how access is checked, how often, or by whom.</p>
  </div>
</noscript>

  var STRONG = [
    { hd:true, runs:[{ k:"1", t:"[Company] User Identities:" }] },
    { runs:[
      "[Company] utilizes an identity and access management system to maintain an inventory of identities including level of information system access. ",
      { k:"2", t:"At a minimum, quarterly" }, " ",
      { k:"3", t:"entitlement reviews" },
      " are carried out ",
      { k:"1", t:"to ensure that personnel have the appropriate logical access rights assigned to them" },
      ". ",
      { k:"2", t:"Reviews also take place when personnel change roles" },
      " within [Company]. ",
      { k:"1", t:"The majority of [Company] personnel have no access to any systems hosting customer data" },
      ", or to customer data in general."
    ]},
    { runs:["Please refer to the ", { k:"3", t:"Entitlement Review SOP" }, ":"] },
    { block:"4", paras:[
      { hd:true, runs:["Customer Instance User Identities:"] },
      { runs:["[Company] customers are responsible for the management of user identities within their instances. This includes the creation of individual identities (credentials) for each of their users, both internal and external, the methods used to authenticate those users, password policies (for built‐in authentication), and the entitlements and access levels granted to those users."] }
    ]}
  ];
  var WEAK = [
    { runs:[
      { k:"A", t:"[Company] is responsible for reviewing and revalidating user access for least privilege and separation of duties with a frequency that is commensurate with organizational risk tolerance.", dash:true },
      " [Company] ",
      { k:"B", t:"implements its Identity and Access Management Policy and related Procedures; and Access Control Policies and Procedures" },
      " to meet compliance with this requirement."
    ]}
  ];

  /* The four labels on the strong answer, and the two on the weak one. Ours. */
  var KEY = [
    { k:"1", l:"The scope",
      d:"Says whose access it checks: its own staff. Most of them cannot reach customer data at all." },
    { k:"2", l:"Specifics instead of adjectives",
      d:"Facts you could check: at least every three months, and again when someone changes jobs." },
    { k:"3", l:"A named process",
      d:"The check has a name. Its steps are in an SOP, a written list of steps. An entitlement is a person’s access." },
    { k:"4", l:"“Partly,” with a reason attached",
      d:"It still says Yes, but names what it does not cover: accounts in each customer’s own copy of the service. Those are the customer’s job." }
  ];
  var WNOTES = [
    { k:"A", d:"The first sentence repeats the question back. It adds nothing new." },
    { k:"B", d:"It tells you there is a policy, but not how access is checked, how often, or by whom." }
  ];
  var KNAME = { "1":"The scope", "2":"Specifics instead of adjectives", "3":"A named process",
    "4":"Partly, with a reason attached", "A":"Repeats the question", "B":"Tells you there is a policy" };

  /* The two picks. Both have a right answer, the strong one (module prose).
     ok: the line shown when the student picks it. no: the line for the other one.
     Ours, worded from the module's own sentences. */
  var PICKS = [
    { id:"data", q:"Which company would you rather hand patient data to?", tag:"Your first pick: patient data",
      ok:"This company’s answer names the process, so it gives you facts that you could check.",
      no:"An answer that admits nothing feels safer, but it gives you nothing that you could check. Try the other company." },
    { id:"told", q:"Which answer do you think actually told you something?", tag:"Your first pick: told you something",
      ok:"It tells you how access is checked, how often, and one thing it does not cover.",
      no:"It only tells you that there is a policy. Try the other company’s answer." }
  ];

  var S = [
    { id:"compare", h1:"Which Answer Told You Something?", prog:"Part 1 of 2" },
    { id:"reveal", h1:"What a strong answer contains", prog:"Part 2 of 2" }
  ];

  /* ---------------- state ----------------
     strong = which company number (1 or 2) holds the strong answer, picked at random
     on a fresh start. data / told = { out: wrong company numbers picked, in order,
     done: true once the right company is picked }. */
  var SKEY = "vciso-p4-m6-which-answer-told-v2";
  function rand(){ return Math.random() < 0.5 ? 1 : 2; }
  function freshP(){ return { out:[], done:false }; }
  function fresh(){ return { strong:rand(), data:freshP(), told:freshP(), at:0 }; }
  function ok12(v){ return v === 1 || v === 2; }
  function cleanP(raw, strong){
    var p = freshP();
    if(!raw || typeof raw !== "object") return p;
    if(Array.isArray(raw.out)) raw.out.forEach(function(n){ if(ok12(n) && n !== strong && p.out.indexOf(n) < 0) p.out.push(n); });
    p.done = raw.done === true;
    return p;
  }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(SKEY));
      if(!raw || typeof raw !== "object" || !ok12(raw.strong)) return fresh();
      var s = { strong:raw.strong, data:cleanP(raw.data, raw.strong), told:cleanP(raw.told, raw.strong), at:0 };
      if(raw.at === 1 && s.data.done && s.told.done) s.at = 1;
      return s;
    }catch(e){ return fresh(); }
  }
  function bothDone(){ return st.data.done && st.told.done; }
  function firstPick(p){ var a = st[p]; return a.out.length ? a.out[0] : (a.done ? st.strong : 0); }
  function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(st)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = m; }
  function phone(){ return window.matchMedia("(max-width:599px)").matches; }
  function answerOf(n){ return n === st.strong ? STRONG : WEAK; }
  function weakNo(){ return st.strong === 1 ? 2 : 1; }

  /* ---------------- answer text ---------------- */
  function runsHTML(runs, marks){
    return runs.map(function(r){
      if(typeof r === "string") return esc(r);
      if(!marks) return esc(r.t);
      return '<mark class="hl' + (r.dash ? " dash" : "") + '" data-k="' + r.k + '">'
        + '<span class="sr">Highlight ' + r.k + ", " + esc(KNAME[r.k]) + ": </span>"
        + glue(r.k, r.t) + "</mark>";
    }).join("");
  }
  /* The number badge never sits alone at the end of a line: it is glued to the first word. */
  function glue(k, t){
    var sp = t.indexOf(" "), w = sp < 0 ? t : t.slice(0, sp), rest = sp < 0 ? "" : t.slice(sp);
    return '<span class="nw"><span class="bn" aria-hidden="true">' + k + "</span>" + esc(w) + "</span>" + esc(rest);
  }
  function parasHTML(paras, marks){
    return paras.map(function(p){
      if(p.block){
        var inner = parasHTML(p.paras, marks);
        if(!marks) return inner;
        return '<div class="hlb" data-k="' + p.block + '"><span class="bn" aria-hidden="true">' + p.block + "</span>"
          + '<span class="sr">Highlight ' + p.block + ", " + esc(KNAME[p.block]) + ", starts here.</span>"
          + inner + "</div>";
      }
      return "<p" + (p.hd ? ' class="hd"' : "") + ">" + runsHTML(p.runs, marks) + "</p>";
    }).join("");
  }

  function cardHTML(n, marks, extraHead, extraFoot){
    var id = "txt" + n;
    return '<div class="card">'
      + '<div class="tw">'
      + '<div class="ch"><span class="bi">' + icon("bldg") + '</span><span class="cl">Company ' + n + "</span>"
      +   '<span class="chip">Answered: Yes</span>'
      + "</div>"
      + (extraHead ? '<div class="tags">' + extraHead + "</div>" : "")
      + '<div class="txt" id="' + id + '" tabindex="0" role="region" aria-label="Company ' + n + "’s answer\">"
      +   parasHTML(answerOf(n), marks) + "</div>"
      + '<span class="more" data-for="' + id + '" aria-hidden="true" hidden>' + icon("down") + "Scroll for more</span>"
      + "</div>"
      + (extraFoot || "")
      + "</div>";
  }

  /* Show "Scroll for more" only while a card's text runs past its box. */
  function scrollHints(){
    Array.prototype.forEach.call(el.board.querySelectorAll(".more"), function(m){
      var t = document.getElementById(m.dataset.for);
      if(!t) return;
      function upd(){ m.hidden = phone() || (t.scrollHeight - t.clientHeight - t.scrollTop) <= 2; }
      upd();
      if(!t.dataset.wired){ t.dataset.wired = "1"; t.addEventListener("scroll", upd, { passive:true }); }
    });
  }

  function qformHTML(){
    return '<div class="qform"><span class="qi">' + icon("form") + "</span>"
      + '<span class="qt"><span class="ql">' + esc(QFORM.label) + "</span>"
      + '<span class="qq">“' + esc(QFORM.text) + "”</span>"
      + '<span class="qd">' + esc(QFORM.def) + "</span></span></div>";
  }

  /* ---------------- screen 1: compare and pick ---------------- */
  function renderCompare(){
    el.board.innerHTML = '<p class="plead">Both companies answered Yes. Read both answers. Write your two picks in the note on your laptop, then click them below to check them.</p>'
      + qformHTML()
      + '<div class="cards">' + cardHTML(1, false) + cardHTML(2, false) + "</div>"
      + '<div class="picks">' + PICKS.map(pickRowHTML).join("") + "</div>";
    wirePicks();
    scrollHints();
  }

  function pkState(p, n){
    if(n === st.strong && st[p].done) return { cls:"ok", ico:"check", tag:"Right" };
    if(st[p].out.indexOf(n) >= 0) return { cls:"no", ico:"x", tag:"Not quite" };
    return { cls:"", ico:"", tag:"" };
  }
  function fbHTML(p){
    var a = st[p.id];
    if(a.done) return '<p class="fb ok" id="fb-' + p.id + '">' + icon("okc") + "<span><b>Right.</b> " + esc(p.ok) + "</span></p>";
    if(a.out.length) return '<p class="fb no" id="fb-' + p.id + '">' + icon("noc") + "<span><b>Not quite.</b> " + esc(p.no) + "</span></p>";
    return "";
  }
  function pickRowHTML(p, ix){
    var lid = "pq-" + p.id, a = st[p.id];
    return '<div class="pwrap" data-w="' + p.id + '"><div class="prow" role="group" aria-labelledby="' + lid + '">'
      + '<span class="pn" aria-hidden="true">' + (ix + 1) + "</span>"
      + '<span class="pq" id="' + lid + '">' + esc(p.q) + "</span>"
      + '<span class="pb">' + [1, 2].map(function(n){
          var s = pkState(p.id, n), off = !!s.cls || a.done;
          return '<button class="pk' + (s.cls ? " " + s.cls : "") + '" type="button" data-p="' + p.id + '" data-n="' + n + '"'
            + (off ? ' disabled aria-disabled="true"' : "") + ">"
            + '<span class="g" aria-hidden="true">' + (s.ico ? icon(s.ico) : "") + "</span>Company " + n
            + (s.tag ? '<span class="lb" aria-hidden="true">' + s.tag + "</span>" : "")
            + (s.tag ? '<span class="sr">. ' + s.tag + ". You picked this one.</span>" : "")
            + "</button>";
        }).join("") + "</span></div>"
      + fbHTML(p) + "</div>";
  }
  function wirePicks(){
    Array.prototype.forEach.call(el.board.querySelectorAll("button.pk:not(:disabled)"), function(b){
      if(b.dataset.wired) return;
      b.dataset.wired = "1";
      b.addEventListener("click", function(){ pick(b.dataset.p, +b.dataset.n); });
    });
  }

  function pick(p, n){
    if(!ok12(n)) return;
    var a = st[p];
    if(a.done || a.out.indexOf(n) >= 0) return;
    if(n === st.strong) a.done = true; else a.out.push(n);
    save();
    var ix = PICKS.map(function(x){ return x.id; }).indexOf(p), P = PICKS[ix];
    var w = el.board.querySelector('.pwrap[data-w="' + p + '"]');
    if(w){
      var tmp = document.createElement("div");
      tmp.innerHTML = pickRowHTML(P, ix);
      var nw = tmp.firstChild;
      w.parentNode.replaceChild(nw, w);
      var f = nw.querySelector(".fb");
      if(f && !reduce) f.classList.add("in");
      wirePicks();
      var focusTo = a.done ? null : nw.querySelector("button.pk:not(:disabled)");
      if(focusTo) focusTo.focus({ preventScroll:true });
    }
    chrome();
    if(a.done && bothDone()) el.next.focus({ preventScroll:true });
    else if(a.done){
      var other = el.board.querySelector("button.pk:not(:disabled)");
      if(other) other.focus({ preventScroll:true });
    }
    scrollHints();
    say((a.done ? "Right. " + P.ok : "Not quite. " + P.no) + (bothDone() ? " Both picks are done. Show me is ready." : ""));
  }

  /* ---------------- screen 2: the reveal ---------------- */
  function tagsFor(n){
    var t = [];
    PICKS.forEach(function(p){ if(firstPick(p.id) === n) t.push('<span class="tag">' + icon("user") + esc(p.tag) + "</span>"); });
    return t.join("");
  }
  function renderReveal(){
    var s = st.strong, w = weakNo();
    var key = '<div class="key" role="group" aria-labelledby="kh">'
      + '<p class="kh" id="kh">Click or tap one to find it in <b>Company ' + s + "’s</b> answer.</p>"
      + KEY.map(function(k){
          return '<button class="ky" type="button" data-k="' + k.k + '" aria-controls="txt' + s + '">'
            + '<span class="bn" aria-hidden="true">' + k.k + "</span>"
            + '<span class="kt"><span class="kl">' + esc(k.l) + '</span><span class="kd">' + esc(k.d) + "</span></span>"
            + '<span class="sr">. Show it in the answer.</span></button>';
        }).join("") + "</div>";
    var notes = '<div class="notes">' + WNOTES.map(function(n){
        return '<p><span class="bn" aria-hidden="true">' + n.k + "</span><span><span class=\"sr\">Highlight " + n.k + ": </span>" + esc(n.d) + "</span></p>";
      }).join("") + "</div>";

    el.board.innerHTML = '<div class="rev">'
      +   '<div class="rcol">' + cardHTML(s, true, tagsFor(s)) + "</div>"
      +   key
      +   '<div class="rcol">' + cardHTML(w, true, tagsFor(w), notes) + "</div>"
      + "</div>";
    Array.prototype.forEach.call(el.board.querySelectorAll("button.ky"), function(b){
      b.addEventListener("click", function(){ showMark(b.dataset.k, b); });
    });
    if(!reduce) Array.prototype.forEach.call(el.board.querySelectorAll(".rev .card"), function(c){ c.classList.add("in"); });
    scrollHints();
  }

  /* A key button scrolls the answer to that highlight and outlines it. */
  var flashT = null;
  function showMark(k, btn){
    var box = document.getElementById("txt" + st.strong);
    if(!box) return;
    var ms = box.querySelectorAll('[data-k="' + k + '"]');
    Array.prototype.forEach.call(box.querySelectorAll(".flash"), function(m){ m.classList.remove("flash"); });
    Array.prototype.forEach.call(el.board.querySelectorAll("button.ky"), function(b){ b.classList.toggle("on", b === btn); });
    if(!ms.length) return;
    Array.prototype.forEach.call(ms, function(m){ m.classList.add("flash"); });
    if(phone()){
      ms[0].scrollIntoView({ behavior: reduce ? "auto" : "smooth", block:"center" });
    } else {
      var top = (ms[0].getBoundingClientRect().top - box.getBoundingClientRect().top) / stageScale() + box.scrollTop;
      box.scrollTo({ top: Math.max(0, top - 8), behavior: reduce ? "auto" : "smooth" });
    }
    clearTimeout(flashT);
    flashT = setTimeout(function(){
      Array.prototype.forEach.call(ms, function(m){ m.classList.remove("flash"); });
    }, 2400);
    var kk = KEY.filter(function(x){ return x.k === k; })[0];
    if(kk) say("Highlight " + k + ", " + kk.l.replace(/[“”]/g, "") + ". " + kk.d);
  }

  /* ---------------- chrome ---------------- */
  function chrome(){
    var s = S[st.at];
    el.prog.textContent = s.prog;
    var h = "";
    for(var k = 0; k < S.length; k++) h += "<i class='" + (k < st.at ? "on" : k === st.at ? "here" : "") + "'></i>";
    el.segs.innerHTML = h;
    if(st.at === 0){
      el.back.hidden = true;
      el.next.textContent = "Show me";
      el.next.classList.remove("ghost");
      var both = bothDone();
      var anyFb = !!el.board.querySelector(".fb");
      el.board.classList.toggle("fbon", anyFb); el.h1.classList.toggle("fbon", anyFb); el.frame.classList.toggle("fbon", anyFb && !phone());
      var tried = st.data.out.length || st.told.out.length || st.data.done || st.told.done;
      el.next.disabled = !both;
      el.next.setAttribute("aria-describedby", "hint");
      el.hint.innerHTML = both
        ? "<span>Both picks are right. Click <b>Show me</b> to see what a strong answer contains.</span>"
        : tried
        ? "<span>Get <b>both picks</b> right to carry on. If a pick is not quite right, try the other company.</span>"
        : (phone() ? "<span>Write <b>both picks</b> in the note on your laptop, then click them here to check them.</span>"
          : "<span>Both companies answered Yes. Write <b>both picks</b> in the note on your laptop, then click them here to check them.</span>");
    } else {
      el.board.classList.remove("fbon"); el.h1.classList.remove("fbon"); el.frame.classList.remove("fbon");
      el.back.hidden = false;
      el.next.textContent = "Start again";
      el.next.classList.add("ghost");
      el.next.disabled = false;
      el.next.removeAttribute("aria-describedby");
      el.hint.innerHTML = "<span><b>Back</b> takes you to your picks. <b>Start again</b> clears them.</span>";
    }
  }

  function render(){
    var s = S[st.at];
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);
    if(st.at === 0) renderCompare(); else renderReveal();
    chrome();
    say(s.prog + ". " + s.h1);
  }

  function go(n){
    st.at = n; save(); render();
    if(phone()) window.scrollTo(0, 0);
    el.frame.focus({ preventScroll:true });
  }
  el.next.addEventListener("click", function(){
    if(st.at === 0){ if(bothDone()) go(1); return; }
    st = fresh(); save(); render();
    if(phone()) window.scrollTo(0, 0);
    el.frame.focus({ preventScroll:true });
    say("Started again. Your picks are cleared. Part 1 of 2.");
  });
  el.back.addEventListener("click", function(){ go(0); });

  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.target && e.target.classList && e.target.classList.contains("txt")) return;
    if(e.key === "ArrowRight" && st.at === 0 && bothDone()){ e.preventDefault(); go(1); }
    else if(e.key === "ArrowLeft" && st.at === 1){ e.preventDefault(); go(0); }
  });

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  var scale = 1;
  function stageScale(){ return phone() ? 1 : scale; }
  function fit(){
    if(phone()){ stage.style.transform = ""; scale = 1; scrollHints(); return; }
    scale = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + scale + ")";
    scrollHints();
  }
  var wasPhone = phone();
  window.addEventListener("resize", function(){
    if(phone() !== wasPhone){ wasPhone = phone(); chrome(); }
    fit();
  });

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; st.at = n; render(); return true; },
    slides:S.length,
    state:function(){ return JSON.parse(JSON.stringify(st)); },
    setStrong:function(n){ if(!ok12(n)) return false; st.strong = n; save(); render(); return true; },
    reset:function(){ st = fresh(); save(); render(); }
  };
})();
</script>
</body>
</html>
