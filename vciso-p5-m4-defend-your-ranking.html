<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Defend Your Ranking</title>
<!--
  vCISO P5 Step 1, Module 4 (Compare Your Ranking), interactive: Defend your ranking.
  Built from the Extern deck shell, matched to the house look of
  09-assets/final/vciso-p3-m2-control-or-written-rule.html,
  vciso-p3-m3-guess-the-date.html and vciso-p3-m4-one-stolen-password.html.
  Governing authority: output/programs/vciso/VCISO-STYLE-GUIDE.md section 6.
  Source: Doc from SME/SME drop 2026-09-25/P5 Sample Pack/Interactive content sets - P5.md, P5-4.
  The four reviewers' reasons are Chaitanya's words. His dashes are turned
  into a colon (A) and parentheses (D). No words change.

  Spec rules kept here:
  - No scoring and no right or wrong marking anywhere.
  - The student's rank sits in the table as one more row, never compared.
  - Slide 4 states the choice and one line. The lesson (D isn't wrong, A and
    B aren't wrong either, no single correct order) is in the module prose
    right after the embed, so it is not repeated here.
  - No storage: a reload starts clean.

  Verify before shipping, both gates, every time:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs   this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  /* ===============================================================
     The palette. The Extern five, plus the vCISO per-slide tint ramp
     (VCISO-STYLE-GUIDE.md 6b, listed in 09-assets/deck-palette.json).
     Tint carries no meaning. Every tint of navy is an rgba() of
     #001D69. No state is ever signalled by colour alone.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, borders, fills      */
    --bg:#FDF8F8;           /* canvas background, and text on navy */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t3{background:#F2E3D2}
  body.t4{background:#DEEBDA}

  /* ---- the 960x540 canvas, scaled down only, never up ---- */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:12px}

  /* ---- the board ---- */
  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px}
  .lead{flex:0 0 auto;font-size:17px;line-height:1.5;max-width:74ch}
  .lead b{color:var(--title);font-weight:600}

  svg.ic{width:28px;height:28px;flex:0 0 auto;fill:none;stroke:var(--on-highlight);stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}

  /* ---- slide 1: the risk card and the number picker ---- */
  .pcard{flex:0 0 auto;display:flex;align-items:center;gap:18px;
    background:var(--bg);border:1.5px solid var(--on-highlight);border-left-width:6px;border-radius:12px;
    padding:14px 22px}
  .pcard .ib{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:2px solid var(--on-highlight);
    background:var(--highlight);display:flex;align-items:center;justify-content:center}
  .pcard .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
  .pcard .pn{font-size:13px;font-weight:600;color:var(--on-highlight)}
  .pcard .ct{font-size:24px;line-height:1.25;font-weight:600;color:var(--title)}

  .rk{flex:0 0 auto;display:flex;align-items:flex-start;gap:14px}
  .rk .yl{flex:0 0 auto;font-size:15px;font-weight:600;color:var(--title);padding-top:12px;min-width:92px}
  .nums{display:grid;grid-template-columns:repeat(10,58px);gap:8px}
  /* Twenty identical outline buttons. Nothing looks chosen until a click. */
  button.y{font-family:inherit;width:58px;height:44px;border-radius:8px;cursor:pointer;
    font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;
    background:var(--bg);color:var(--title);border:1.5px solid var(--on-highlight);
    transition:background var(--t-fast) var(--ease-out),color var(--t-fast) var(--ease-out),opacity var(--t-fast) var(--ease-out)}
  button.y:hover:not(:disabled):not([aria-pressed="true"]){background:var(--highlight)}
  button.y:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  /* The pick: filled, with an inner ring, plus the words in the hint bar. */
  button.y[aria-pressed="true"],
  button.y[aria-pressed="true"]:hover,
  button.y[aria-pressed="true"]:active,
  button.y[aria-pressed="true"]:disabled{background:var(--on-highlight);color:var(--bg);box-shadow:inset 0 0 0 2px var(--bg)}
  button.y:disabled{cursor:default}
  button.y.dim{opacity:.38}

  /* ---- slide 2: the spread ---- */
  .sub{flex:0 0 auto;font-size:16px;line-height:1.4;color:var(--body);margin-top:-6px}
  .spread{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px}
  .sh,.sr-row{display:grid;grid-template-columns:136px 76px minmax(0,1fr);column-gap:14px;align-items:center}
  .sh{padding:0 14px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--on-highlight)}
  .sr-row{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:9px;padding:7px 14px}
  .sr-row .who{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:15px;font-weight:600;color:var(--title)}
  .sr-row .cn{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--on-highlight);background:var(--highlight);
    color:var(--on-highlight);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .sr-row .cn svg.ic{width:18px;height:18px}
  .sr-row .rr{font-size:20px;font-weight:400;color:var(--title);font-variant-numeric:tabular-nums}
  .sr-row .rr b{font-weight:700}
  .sr-row .rs{font-size:15px;line-height:1.4;color:var(--title)}
  .sr-row .rs b{font-weight:700}
  .sr-row .rl{display:none}
  /* The student's own row: the "you picked this" style, filled navy. */
  .sr-row.you{background:var(--on-highlight);border-color:var(--on-highlight)}
  .sr-row.you .who,.sr-row.you .rr,.sr-row.you .rs{color:var(--bg)}
  .sr-row.you .rr{font-weight:600}
  .sr-row.you .cn{background:var(--bg);border-color:var(--bg)}
  .spread.in{animation:rin var(--t-reveal) var(--ease-over) both}

  /* ---- slide 3: defend or change ---- */
  .ans-row{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
  button.ans{font-family:inherit;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 18px;
    background:var(--bg);color:var(--title);border:2px solid var(--on-highlight);border-radius:10px;
    transition:background var(--t-fast) var(--ease-out),color var(--t-fast) var(--ease-out)}
  button.ans:hover:not(.is-pick){background:var(--highlight)}
  button.ans:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.ans .bk{flex:0 0 auto;width:28px;height:26px;border-radius:6px;border:1.5px solid var(--on-highlight);
    background:var(--highlight);font-size:14px;font-weight:600;color:var(--on-highlight);
    display:flex;align-items:center;justify-content:center}
  button.ans .al{flex:1 1 auto;font-size:21px;font-weight:600;line-height:1.2}
  button.ans .tg{flex:0 0 auto;font-size:13px;font-weight:600;white-space:nowrap}
  /* The pick: filled navy, a dot and the words "Your pick". A dot, not a
     tick: nothing here is ever marked. */
  button.ans.is-pick{background:var(--on-highlight);color:var(--bg)}
  button.ans.is-pick .bk{background:var(--bg);border-color:var(--bg)}

  /* ---- slide 4: the choice ---- */
  .close{flex:0 0 auto;display:flex;align-items:center;gap:18px;
    background:var(--highlight);border-left:6px solid var(--on-highlight);border-radius:0 12px 12px 0;padding:18px 24px;max-width:74ch}
  .close .ib{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:2px solid var(--on-highlight);
    background:var(--bg);display:flex;align-items:center;justify-content:center}
  .close p{font-size:19px;line-height:1.45;font-weight:600;color:var(--title)}
  .close.in{animation:rin var(--t-reveal) var(--ease-over) both}
  button.jump{font-family:inherit;font-size:14px;font-weight:600;color:var(--on-highlight);
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:7px;padding:7px 13px;cursor:pointer;white-space:nowrap;align-self:flex-start}
  button.jump:hover{background:var(--tint2)}
  button.jump:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* ---- the bar ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:12px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:44px;overflow-y:auto;font-size:13px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px;align-content:flex-start}
    .segs i{width:14px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .pcard{gap:14px;padding:14px 14px}
    .pcard .ct{font-size:20px}
    .rk{flex-direction:column;gap:8px}
    .rk .yl{padding-top:0;font-size:16px}
    .nums{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%}
    button.y{width:auto;height:50px;font-size:18px}
    .sh{display:none}
    .sr-row{grid-template-columns:auto 1fr;row-gap:6px;padding:10px 12px}
    .sr-row .rr{justify-self:end;font-size:16px}
    .sr-row .rl{display:inline;font-size:13px;font-weight:400;margin-right:4px}
    .sr-row .rs{grid-column:1/-1;font-size:16px}
    .ans-row{grid-template-columns:1fr;gap:10px}
    button.ans .al{font-size:19px}
    .close{padding:16px 16px;gap:14px}
    .close p{font-size:17px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Defend your ranking">

    <div class="top">
      <span class="prog" id="prog">1 of 4</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">See how others ranked it</button>
      <button class="nav ghost" id="again" type="button" hidden>Start again</button>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:17px;color:#1C1B1B;margin:20px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf strong{color:#1C1B1B}
    .nsf table{border-collapse:collapse;margin:0 0 14px}
    .nsf td,.nsf th{padding:6px 12px 6px 0;border-bottom:1px solid rgba(0,29,105,.26);vertical-align:top;text-align:left}
  </style>
  <div class="nsf">
    <h2>Where did you rank this risk?</h2>
    <p>The end-of-support risk is #2 in your Risk picture tab. Look at your Risk picture tab. Where did you put this risk in your order? Write the number down.</p>
    <h3>Four reviewers, the same risk</h3>
    <p>They worked from the same findings as you. Read all four reasons.</p>
    <table>
      <tr><th>Reviewer</th><th>Ranked it</th><th>Their reasoning</th></tr>
      <tr><td>A</td><td>1st</td><td>"Unsupported software running patient systems: highest exposure, no fix path."</td></tr>
      <tr><td>B</td><td>1st</td><td>"Past end of support means it only gets worse; top of the list."</td></tr>
      <tr><td>C</td><td>2nd</td><td>"Serious, but the leaked-credentials risk is a live way in <em>today</em>, so I put that first."</td></tr>
      <tr><td>D</td><td><strong>7th</strong></td><td>"End-of-life is a chronic, known condition the client can plan around. I ranked what's under <strong>active threat right now</strong> (the forgeable domain and the leaked credentials could be used against the company today) above a systemic weakness that's been sitting there for years."</td></tr>
    </table>
    <h3>Before anything is explained</h3>
    <p>Are you defending your order, or changing it? Write down your choice. Keep your choice in mind, then go back to the task and read on.</p>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ---------------- content ----------------
     The spread is P5-4 from the SME drop of 25 September 2026, word for
     word. A's dash became a colon and D's dashes became parentheses.
     `rank` holds the HTML for the "Ranked it" cell, `why` for the reason,
     so the source's own bold and italic carry over and nothing else does. */
  var RISK = { name:"The end-of-support risk", label:"#2 in your Risk picture tab" };
  var MIN = 1, MAX = 20;
  var REVIEWERS = [
    { id:"A", rank:"1st", why:"Unsupported software running patient systems: highest exposure, no fix path." },
    { id:"B", rank:"1st", why:"Past end of support means it only gets worse; top of the list." },
    { id:"C", rank:"2nd", why:"Serious, but the leaked-credentials risk is a live way in <em>today</em>, so I put that first." },
    { id:"D", rank:"<b>7th</b>", why:"End-of-life is a chronic, known condition the client can plan around. I ranked what's under <b>active threat right now</b> (the forgeable domain and the leaked credentials could be used against the company today) above a systemic weakness that's been sitting there for years." }
  ];
  var CHOICES = [
    { id:"defend", key:"1", label:"Defend my order" },
    { id:"change", key:"2", label:"Change my order" }
  ];

  var S = [
    { id:"rank",   kind:"rank",   label:"Your rank",   h1:"Where did you rank this risk?" },
    { id:"spread", kind:"spread", label:"The spread",  h1:"Four reviewers, the same risk" },
    { id:"call",   kind:"call",   label:"Your call",   h1:"Before anything is explained" },
    { id:"close",  kind:"close",  label:"Your choice", h1:"" }
  ];

  /* Inline SVG icons, Phosphor style: one weight, outline, navy. */
  var ICON = {
    monitor:'<rect x="3" y="4" width="18" height="12.5" rx="1.5"/><path d="M9 20.5h6M12 16.5v4"/><circle cx="12" cy="10.2" r="3.2"/><path d="M12 8.6v1.7l1.1.8"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.4-3.8 4.4-5.8 8-5.8s6.6 2 8 5.8"/>',
    defend:'<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V6z"/><path d="m8.8 12 2.2 2.2 4.3-4.4"/>',
    change:'<path d="M7.5 4v16M4 7.5 7.5 4 11 7.5"/><path d="M16.5 20V4M20 16.5 16.5 20 13 16.5"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICON[k] + "</svg>"; }

  function ordinal(n){
    var t = n % 100;
    if(t >= 11 && t <= 13) return n + "th";
    var u = n % 10;
    return n + (u === 1 ? "st" : u === 2 ? "nd" : u === 3 ? "rd" : "th");
  }
  function choiceOf(id){ for(var k=0;k<CHOICES.length;k++) if(CHOICES[k].id === id) return CHOICES[k]; return null; }

  /* ---------------- state ----------------
     No storage. `locked` is set when the student leaves slide 1, so the
     rank they wrote down before seeing the spread stays as it was. */
  function fresh(){ return { rank:null, locked:false, choice:null }; }
  var st = fresh();
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Data validation, at load, loud. */
  (function validate(){
    var problems = [], ids = {};
    S.forEach(function(s, n){
      if(!s.id) problems.push("slide " + (n+1) + " has no id");
      if(ids[s.id]) problems.push('duplicate slide id "' + s.id + '"');
      ids[s.id] = 1;
    });
    if(REVIEWERS.length !== 4) problems.push("the spread needs four reviewers");
    REVIEWERS.forEach(function(r){ if(!r.why || !r.rank) problems.push('reviewer "' + r.id + '" is missing a field'); });
    if(problems.length){
      document.getElementById("board").innerHTML =
        '<div class="lead"><p><b>This deck has authoring errors and will not behave correctly:</b></p>' +
        '<ul style="font-size:13px;line-height:1.6;padding-left:18px">' +
        problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul></div>";
      throw new Error("deck data invalid: " + problems.join("; "));
    }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    again:document.getElementById("again"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function say(m){ el.live.textContent = m; }
  function topFocus(){
    try{ el.frame.focus({preventScroll:true}); }catch(e){ el.frame.focus(); }
    try{ window.scrollTo(0, 0); }catch(e){}
  }
  function strip(h){ return String(h).replace(/<[^>]+>/g, ""); }

  /* ---------------- chrome ---------------- */
  function canGo(n){
    if(n < 0 || n >= S.length) return false;
    if(n === 0) return true;
    if(n <= 2) return st.rank !== null;
    return st.rank !== null && st.choice !== null;
  }

  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;
    el.back.disabled = (i === 0);
    el.again.hidden = !st.locked;
    var end = (i === S.length - 1);
    el.next.hidden = end;
    el.next.textContent = s.kind === "rank" ? "See how others ranked it" : s.kind === "spread" ? "Make your call" : "Next";
    el.next.disabled = end || !canGo(i + 1);
  }

  function render(anim){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.hint.textContent = "";
    el.h1.textContent = s.h1;
    if(s.kind === "rank") renderRank();
    else if(s.kind === "spread") renderSpread(anim);
    else if(s.kind === "call") renderCall();
    else if(s.kind === "close") renderClose(anim);
    else el.board.innerHTML = '<p class="lead"><b>Unhandled slide kind "' + esc(String(s.kind)) + '".</b></p>';
    el.frame.setAttribute("aria-label", el.h1.textContent || "Defend your ranking");
    header();
  }

  /* ---------------- slide 1: where you put it ---------------- */
  function renderRank(){
    var btns = "";
    for(var n=MIN; n<=MAX; n++){
      var mine = st.rank === n;
      btns += '<button class="y' + (st.locked && !mine ? " dim" : "") + '" type="button" data-n="' + n + '"' +
        ' aria-pressed="' + (mine ? "true" : "false") + '"' + (st.locked ? " disabled" : "") +
        ' aria-label="' + ordinal(n) + (mine ? ", your rank" : "") + '">' + n + "</button>";
    }
    el.board.innerHTML =
      '<div class="pcard"><span class="ib">' + icon("monitor") + "</span>" +
        '<div class="tx"><span class="pn">' + esc(RISK.label) + '</span><p class="ct">' + esc(RISK.name) + "</p></div></div>" +
      '<p class="lead">Look at your Risk picture tab. Where did you put this risk in your order?</p>' +
      '<div class="rk" role="group" aria-labelledby="rkl"><span class="yl" id="rkl">I ranked it</span>' +
        '<div class="nums">' + btns + "</div></div>";
    Array.prototype.forEach.call(el.board.querySelectorAll("button.y"), function(b){
      b.addEventListener("click", function(){ pickRank(+b.dataset.n); });
    });
    rankHint();
  }

  function rankHint(){
    if(st.locked) el.hint.innerHTML = "<b>You ranked it " + ordinal(st.rank) + ".</b> To change it, press Start again.";
    else if(st.rank === null) el.hint.textContent = "Pick a number to go on.";
    else el.hint.innerHTML = "<b>You ranked it " + ordinal(st.rank) + ".</b> You can change it until you press See how others ranked it.";
  }

  function pickRank(n){
    if(st.locked || n < MIN || n > MAX) return;
    st.rank = n;
    renderRank(); header();
    var b = el.board.querySelector('button.y[data-n="' + n + '"]');
    if(b) b.focus();
    say("You ranked it " + ordinal(n) + ".");
  }

  /* ---------------- slide 2: the spread ---------------- */
  function renderSpread(anim){
    if(st.rank === null){ needRank(); return; }
    var rows = REVIEWERS.map(function(r){
      return '<div class="sr-row" role="row">' +
        '<span class="who" role="cell"><span class="cn" aria-hidden="true">' + r.id + "</span>Reviewer " + r.id + "</span>" +
        '<span class="rr" role="cell"><span class="rl">Ranked it</span>' + r.rank + "</span>" +
        '<span class="rs" role="cell">“' + r.why + "”</span></div>";
    }).join("");
    rows += '<div class="sr-row you" role="row">' +
      '<span class="who" role="cell"><span class="cn" aria-hidden="true">' + icon("user") + "</span>You</span>" +
      '<span class="rr" role="cell"><span class="rl">Ranked it</span>' + ordinal(st.rank) + "</span>" +
      '<span class="rs" role="cell">Your order</span></div>';
    el.board.innerHTML =
      '<p class="sub">They worked from the same findings as you. Read all four reasons.</p>' +
      '<div class="spread' + (anim && !reduce ? " in" : "") + '" role="table" aria-label="How four reviewers and you ranked the end-of-support risk">' +
        '<div class="sh" role="row"><span role="columnheader">Reviewer</span><span role="columnheader">Ranked it</span><span role="columnheader">Their reasoning</span></div>' +
        rows + "</div>";
  }

  function needRank(){
    el.board.innerHTML = '<p class="lead">Pick where you ranked the risk first.</p>' +
      '<button class="jump" type="button" id="torank">Go to your rank</button>';
    el.board.querySelector("#torank").addEventListener("click", function(){ i = 0; render(); topFocus(); });
  }

  /* ---------------- slide 3: defend or change ---------------- */
  function renderCall(){
    if(st.rank === null){ needRank(); return; }
    el.board.innerHTML =
      '<p class="lead">Are you defending your order, or changing it?</p>' +
      '<div class="ans-row" role="group" aria-label="Defend or change your order">' +
      CHOICES.map(function(c){
        var mine = st.choice === c.id;
        return '<button class="ans' + (mine ? " is-pick" : "") + '" type="button" data-c="' + c.id + '" aria-pressed="' + mine + '">' +
          '<span class="bk" aria-hidden="true">' + c.key + '</span><span class="al">' + esc(c.label) + "</span>" +
          (mine ? '<span class="tg" aria-hidden="true">● Your pick</span>' : "") + "</button>";
      }).join("") + "</div>";
    Array.prototype.forEach.call(el.board.querySelectorAll("button.ans"), function(b){
      b.addEventListener("click", function(){ pickChoice(b.dataset.c); });
    });
    el.hint.textContent = st.choice === null ? "Pick one to go on." : "You can change your pick.";
  }

  function pickChoice(id){
    if(!choiceOf(id)) return;
    st.choice = id;
    renderCall(); header();
    var b = el.board.querySelector('button.ans[data-c="' + id + '"]');
    if(b) b.focus();
    say("Your pick: " + choiceOf(id).label + ".");
  }

  /* ---------------- slide 4: the choice, one line ---------------- */
  function renderClose(anim){
    if(st.choice === null){
      el.h1.textContent = "Make your call first.";
      el.board.innerHTML = '<p class="lead">Pick Defend my order or Change my order first.</p>' +
        '<button class="jump" type="button" id="tocall">Go to your call</button>';
      el.board.querySelector("#tocall").addEventListener("click", function(){ i = st.rank === null ? 0 : 2; render(); topFocus(); });
      return;
    }
    var c = choiceOf(st.choice);
    el.h1.textContent = "You chose: " + c.label;
    el.board.innerHTML = '<div class="close' + (anim && !reduce ? " in" : "") + '"><span class="ib">' + icon(c.id) + "</span>" +
      "<p>Keep your choice in mind, then go back to the task and read on.</p></div>";
  }

  /* ---------------- start again ---------------- */
  function resetAll(){ st = fresh(); i = 0; render(); }
  el.again.addEventListener("click", function(){ resetAll(); topFocus(); say("Cleared. Back to the start. Pick where you ranked the risk."); });

  /* ---------------- navigation ---------------- */
  function announce(){
    var s = S[i];
    if(s.kind === "spread" && st.rank !== null){
      return "Slide 2 of 4. Four reviewers, the same risk. " + REVIEWERS.map(function(r){
        return "Reviewer " + r.id + " ranked it " + strip(r.rank) + ". " + strip(r.why);
      }).join(" ") + " You ranked it " + ordinal(st.rank) + ".";
    }
    return "Slide " + (i+1) + " of " + S.length + ". " + el.h1.textContent;
  }

  function go(d){
    var n = i + d;
    if(!canGo(n)) return;
    if(d > 0 && i === 0) st.locked = true;
    i = n; render(d > 0); topFocus();
    say(announce());
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }
  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(S[i].kind === "call" && (e.key === "1" || e.key === "2")){
      e.preventDefault(); pickChoice(e.key === "1" ? "defend" : "change");
    }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render(false);
  fit();

  /* ---------------- the QA hook ----------------
     goto fills the earlier answers when a later slide needs them, so every
     slide can be measured with real content on it. */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      if(n >= 1 && st.rank === null){ st.rank = 7; st.locked = true; }
      if(n >= 3 && st.choice === null) st.choice = "defend";
      i = n; render(false); return true;
    },
    slides:S.length,
    fill:function(rank, choice){
      if(rank >= MIN && rank <= MAX){ st.rank = rank; st.locked = true; }
      if(choiceOf(choice)) st.choice = choice;
      render(false); return true;
    },
    reset:function(){ resetAll(); },
    state:function(){ return { i:i, rank:st.rank, locked:st.locked, choice:st.choice }; }
  };
})();
</script>
</body>
</html>
