<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read the Data — Jess's Monday Quiz</title>
<style>
  :root {
    --bg: #FDF8F8;
    --title: #1C1B1B;
    --body: #484646;
    --highlight: #DCE1FF;
    --accent: #001D69;
    --shopify: #5E8E3E;
    --shopify-tint: #E9F2E1;
    --analytics: #2A9D8F;
    --analytics-tint: #DEF1EE;
    --meta: #1877F2;
    --meta-tint: #DCE9FD;
    --card: #FFFFFF;
    --line: #ECE4E4;
    --good: #2E7D32;
    --good-bg: #E6F4E7;
    --bad: #C0392B;
    --bad-bg: #FBE9E7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--body);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    padding: 24px 16px 56px;
  }

  .mono {
    font-family: "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }

  .wrap {
    max-width: 860px;
    margin: 0 auto;
  }

  /* ---- Progress ---- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
  }
  .progress-label {
    font-weight: 700;
    color: var(--title);
    font-size: 15px;
  }
  .dots {
    display: flex;
    gap: 9px;
  }
  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid #c9bcbc;
    background: transparent;
    padding: 0;
  }
  .dot.active { background: var(--title); border-color: var(--title); }
  .dot.done { background: #b7a9a9; border-color: #b7a9a9; }

  /* ---- Card / Screen ---- */
  .screen {
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 6px 22px rgba(28,27,27,0.07);
    padding: 26px 26px 28px;
    border: 1px solid var(--line);
    animation: fade .32s ease;
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .screen[hidden] { display: none; }

  /* ---- Jess intro / outro ---- */
  .jess-head {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-bottom: 18px;
  }
  .jess-avatar {
    flex: 0 0 auto;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: .5px;
  }
  .jess-meta .jess-name {
    font-weight: 700;
    color: var(--title);
    font-size: 16px;
    line-height: 1.2;
  }
  .jess-meta .jess-role {
    font-size: 12.5px;
    color: #8a7e7e;
  }
  .jess-bubble {
    background: var(--highlight);
    border-radius: 14px;
    padding: 18px 20px;
    color: var(--title);
    font-size: 15.5px;
    line-height: 1.6;
    margin-bottom: 20px;
    position: relative;
  }
  .jess-bubble p { margin: 0 0 12px; }
  .jess-bubble p:last-child { margin-bottom: 0; }
  .jess-bubble b { color: var(--accent); }

  .intro-list {
    margin: 0 0 22px;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 9px;
  }
  .intro-list li {
    display: flex;
    gap: 11px;
    align-items: flex-start;
    font-size: 14px;
    color: var(--body);
  }
  .intro-list .ic {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--shopify-tint);
    color: var(--shopify);
    font-weight: 700;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .intro-list li:nth-child(2) .ic { background: var(--analytics-tint); color: var(--analytics); }
  .intro-list li:nth-child(3) .ic { background: var(--meta-tint); color: var(--meta); }

  /* ---- Question header (filename + source) ---- */
  .file-header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 6px;
  }
  .file-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--title);
  }
  .pill {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 999px;
    color: #fff;
    letter-spacing: .2px;
  }
  .src-shopify .pill { background: var(--shopify); }
  .src-analytics .pill { background: var(--analytics); }
  .src-meta .pill { background: var(--meta); }

  .accent-bar {
    height: 5px;
    border-radius: 999px;
    width: 100%;
    margin: 13px 0 16px;
  }
  .src-shopify .accent-bar { background: var(--shopify); }
  .src-analytics .accent-bar { background: var(--analytics); }
  .src-meta .accent-bar { background: var(--meta); }

  /* ---- Table ---- */
  .tbl-caption {
    font-size: 12.5px;
    color: #8a7e7e;
    margin: 0 0 5px;
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .tbl-caption .dotsrc {
    width: 9px; height: 9px; border-radius: 50%;
    display: inline-block;
  }
  .cap-shopify .dotsrc { background: var(--shopify); }
  .cap-analytics .dotsrc { background: var(--analytics); }
  .cap-meta .dotsrc { background: var(--meta); }

  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
    -webkit-overflow-scrolling: touch;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    min-width: 460px;
  }
  thead th {
    text-align: left;
    padding: 11px 12px;
    background: #F7F1F1;
    color: var(--title);
    font-weight: 700;
    white-space: nowrap;
    border-bottom: 2px solid var(--line);
  }
  .src-shopify thead th { background: var(--shopify-tint); }
  .src-analytics thead th { background: var(--analytics-tint); }
  .src-meta thead th { background: var(--meta-tint); }
  tbody td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  tbody tr:nth-child(even) { background: #FBF7F7; }
  tbody tr:last-child td { border-bottom: none; }
  .empty-cell {
    color: #b0a4a4;
    font-style: italic;
    background: #F3EEEE;
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 11.5px;
    white-space: nowrap;
  }

  /* ---- Highlighted column (the one the question hinges on) ---- */
  thead th.col-key {
    background: var(--highlight) !important;
    box-shadow: inset 0 0 0 2px var(--accent);
    position: relative;
  }
  tbody td.col-key {
    background: #EEF1FF;
  }
  tbody tr:nth-child(even) td.col-key {
    background: #E6EAFF;
  }

  /* tiny "look here" caption that rides above a highlighted table */
  .focus-note {
    font-size: 12px;
    color: var(--accent);
    margin: 0 0 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }
  .focus-note .fn-dot {
    width: 9px; height: 9px; border-radius: 2px;
    background: var(--highlight);
    box-shadow: inset 0 0 0 2px var(--accent);
    display: inline-block;
    flex: 0 0 auto;
  }
  .focus-note .mono { font-weight: 700; }

  /* two tables stacked (Q5) — each full table keeps its own horizontal scroll */
  .duo {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  /* ---- Question ---- */
  .quiz-q {
    font-weight: 700;
    color: var(--title);
    font-size: 15.5px;
    margin: 20px 0 14px;
  }
  .quiz-q .tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: .5px;
    text-transform: uppercase;
    background: var(--highlight);
    color: var(--accent);
    padding: 2px 9px;
    border-radius: 999px;
    margin-right: 8px;
    vertical-align: 2px;
  }
  .quiz-q .who {
    font-weight: 700;
    color: var(--accent);
  }

  .opts { display: grid; gap: 9px; }
  .opt {
    text-align: left;
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 11px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--body);
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .08s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .opt:hover:not(:disabled) { border-color: #b7a9a9; transform: translateX(2px); }
  .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt .opt-letter {
    flex: 0 0 auto;
    width: 24px; height: 24px;
    border-radius: 7px;
    background: #F1EBEB;
    color: var(--body);
    font-weight: 700;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .opt .opt-text { flex: 1; }
  .opt .mark {
    flex: 0 0 auto;
    font-weight: 700;
    font-size: 16px;
    opacity: 0;
  }
  .opt.correct {
    background: var(--good-bg);
    border-color: var(--good);
    color: #1f5b22;
  }
  .opt.correct .opt-letter { background: var(--good); color: #fff; }
  .opt.correct .mark { opacity: 1; color: var(--good); }
  .opt.wrong {
    background: var(--bad-bg);
    border-color: var(--bad);
    color: #8c2c20;
  }
  .opt.wrong .opt-letter { background: var(--bad); color: #fff; }
  .opt.wrong .mark { opacity: 1; color: var(--bad); }
  .opt.dim { opacity: .5; }
  .opt:disabled { cursor: default; }

  /* ---- Reveal ---- */
  .reveal {
    margin-top: 14px;
    font-size: 14px;
    padding: 13px 15px;
    border-radius: 11px;
    border-left: 5px solid var(--accent);
    background: #F2EEFE;
    color: #4a3b86;
    display: none;
  }
  .reveal.show {
    display: block;
    animation: fade .3s ease;
  }
  .reveal .verdict {
    font-weight: 700;
    display: block;
    margin-bottom: 3px;
  }
  .reveal.is-right { border-left-color: var(--good); background: #EEF7EF; color: #2c5e30; }
  .reveal.is-right .verdict { color: var(--good); }
  .reveal.is-wrong { border-left-color: var(--bad); background: #FBF0EE; color: #7a342a; }
  .reveal.is-wrong .verdict { color: var(--bad); }
  .reveal b { color: inherit; font-weight: 700; }

  /* ---- Nav ---- */
  .nav {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 22px;
  }
  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: 11px;
    border: none;
    cursor: pointer;
    transition: transform .08s, opacity .15s, background .15s;
  }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn-next {
    background: var(--accent);
    color: #fff;
  }
  .btn-next:hover:not(:disabled) { transform: translateX(2px); }
  .btn-next.hidden { display: none; }
  .btn-start {
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    padding: 13px 30px;
  }
  .btn-start:hover { transform: translateY(-1px); }

  /* ---- Wrap screen ---- */
  .wrap-screen .reflect {
    background: var(--highlight);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 14.5px;
    color: var(--title);
    margin-top: 4px;
  }
  .wrap-screen .reflect b { color: var(--accent); }
  .tally {
    margin-bottom: 20px;
    padding: 18px 20px;
    border-radius: 14px;
    background: #fff;
    border: 1.5px solid var(--accent);
    box-shadow: 0 4px 14px rgba(0,29,105,0.08);
  }
  .tally-count {
    margin: 0 0 6px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .4px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .tally-count .score-num { font-size: 18px; }
  .tally-verdict {
    margin: 0 0 7px;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--title);
  }
  .tally-msg {
    margin: 0;
    font-size: 15px;
    line-height: 1.6;
    color: var(--body);
  }
  .btn-again {
    background: var(--highlight);
    color: var(--accent);
  }
  .btn-again:hover { transform: translateY(-1px); }
  .wrap-icons {
    display: flex;
    gap: 7px;
    margin-bottom: 18px;
  }
  .wrap-icons span {
    width: 34px; height: 34px;
    border-radius: 8px;
    display: inline-block;
  }

  @media (max-width: 560px) {
    .screen { padding: 20px 16px 22px; }
    .btn { padding: 11px 18px; font-size: 13px; }
    .jess-bubble { font-size: 14.5px; padding: 15px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .screen, .reveal { animation: none; }
    .opt, .btn { transition: none; }
    .opt:hover:not(:disabled), .btn-next:hover:not(:disabled), .btn-start:hover, .btn-again:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar" id="topbar" hidden>
    <span class="progress-label" id="progressLabel">Question 1 of 6</span>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>

  <div id="screens"></div>

  <div class="nav" id="nav" hidden>
    <button class="btn btn-next hidden" id="nextBtn">Next &#9654;</button>
  </div>

</div>

<script>
/* ============ DATA ============ */

const QUESTIONS = [

        ["Dwellings of Eldervale – Treasure & Trove Tokens","Breaking Games","Game Accessory","127","$2,558.72","-$86.02","-$17.99","$2,454.71","$131.51","$2,586.22"]
      ]
    }],
    who: "Jess:",
    q: "Each row in this view is one…?",
    opts: ["A single customer order","One product's total sales for the whole period","One ad campaign"],
    correct: 1,
    reveal: "Not an order and not a campaign — there are no customers or ad columns here. Each row is one product's totals for Jan–Jul: units sold and the money it made. It's the scoreboard of what sold."
  },
  {

    tables: [{
      src: "shopify", caption: "shopify_checkouts.csv",

      cols: ["name","email","customer_id","customer_name","financial_status","fulfillment_status","accepts_marketing","currency","subtotal","shipping","taxes","total","discount_code","discount_amount","shipping_method","created_at","lineitem_quantity","lineitem_name","lineitem_price","lineitem_sku","lineitem_discount","billing_city","billing_province","billing_country","shipping_city","shipping_province","shipping_country","payment_method","refunded_amount","vendor","risk_level","source"],

        ["#44051150536751","customer_003@example.com","3","Customer 003",{empty:true},"unfulfilled","no","USD","$2.00","$0.00","$0.00","$2.00",{empty:true},"$0.00",{empty:true},"2025-07-29 05:35:03 -0400","1","Sparkle*Kitty Princess Palette Card","$2.00","BGZ110342","$0.00",{empty:true},{empty:true},{empty:true},{empty:true},{empty:true},{empty:true},{empty:true},{empty:true},"Breaking Games","Low","web"],

    correct: 1,
    reveal: "A blank financial_status means no payment ever went through — abandoned. Not paid-and-shipped, and not a fraud flag (that's the separate risk_level column). This file logs every cart, finished or not — your Week-5 hunting ground."
  },
  {

    tables: [{
      src: "analytics", caption: "referrals.csv",

    correct: 2,
    reveal: "It's a fraction, not a count or a percent. 0.0007 × 100 = 0.07% — so not 0.7%, and definitely not 7 people. Misreading this is the classic beginner mistake."
  },
  {
    src: "shopify",

  {

  }
];

const TOTAL = QUESTIONS.length;
const INTRO = -1;          // intro screen index sentinel
const OUTRO = TOTAL;       // outro screen index

/* ============ HELPERS ============ */
function esc(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function cell(v){
  if (v && typeof v === "object" && v.empty){
    return '<span class="empty-cell">(blank)</span>';
  }
  return esc(v);
}
function buildTable(t, tableId){
  const hl = t.highlight || [];
  const keyIdx = t.cols.map((c,i) => hl.indexOf(c) >= 0 ? i : -1).filter(i => i >= 0);
  const isKey = i => keyIdx.indexOf(i) >= 0;

  const head = t.cols.map((c,i) =>
    `<th class="mono${isKey(i) ? ' col-key' : ''}">${esc(c)}</th>`).join("");
  const body = t.rows.map(r =>
    `<tr>${r.map((v,i) => `<td${isKey(i) ? ' class="col-key"' : ''}>${cell(v)}</td>`).join("")}</tr>`).join("");

  // a small "look here" note naming the column(s) the question turns on
  let focusNote = "";
  if (hl.length){
    const names = hl.map(n => `<span class="mono">${esc(n)}</span>`).join(" &amp; ");
    focusNote = `<p class="focus-note"><span class="fn-dot" aria-hidden="true"></span>Focus on ${names}</p>`;
  }

  return `
    <p class="tbl-caption cap-${t.src}"><span class="dotsrc"></span><span class="mono">${esc(t.caption)}</span></p>
    ${focusNote}
    <div class="table-scroll src-${t.src}" id="${tableId}" data-key-cols="${keyIdx.join(',')}">
      <table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
    </div>`;
}

/* ============ RENDER SCREENS ============ */
const LETTERS = ["A","B","C","D"];

function buildQuestionScreen(item, idx){
  let tablesHtml;
  if (item.duo){
    tablesHtml = `<div class="duo">${item.tables.map((t,ti) => buildTable(t, `scroll-${idx}-${ti}`)).join("")}</div>`;
  } else {
    tablesHtml = item.tables.map((t,ti) => buildTable(t, `scroll-${idx}-${ti}`)).join("");
  }

  const optsHtml = item.opts.map((o,i) =>
    `<button class="opt" type="button" data-i="${i}" onclick="answer(${idx},${i})">
       <span class="opt-letter" aria-hidden="true">${LETTERS[i]}</span>
       <span class="opt-text">${esc(o)}</span>
       <span class="mark" aria-hidden="true"></span>
     </button>`).join("");

  return `
  <section class="screen src-${item.src}" data-screen="${idx}" hidden role="group" aria-label="Question ${idx+1} of ${TOTAL}">
    ${tablesHtml}
    <p class="quiz-q"><span class="tag">Question ${idx+1} of ${TOTAL}</span>${esc(item.q)}</p>
    <div class="opts" id="opts-${idx}" role="group" aria-label="Answer options">${optsHtml}</div>
    <div class="reveal" id="reveal-${idx}" aria-live="polite"></div>
  </section>`;
}

function buildIntro(){
  return `
  <section class="screen" data-screen="${INTRO}" role="group" aria-label="Introduction">
    <div class="jess-head">
      <div class="jess-avatar" aria-hidden="true">J</div>
      <div class="jess-meta">
        <div class="jess-name">Jess</div>
        <div class="jess-role">Your manager, Breaking Games</div>
      </div>
    </div>
    <div class="jess-bubble">
      <p>Morning! Pulling you into something quick before standup.</p>
      <p><b>Forget the file names.</b> I want to know you can <b>READ the data</b>. Six quick screens — I'll show you a slice of a real file and you tell me what each one's actually <i>saying</i>.</p>
      <p>No score, no grade. I just want to see how your instincts are shaping up. Ready?</p>
    </div>
    <ul class="intro-list">
      <li><span class="ic" aria-hidden="true">1</span><span><b>Look at the data</b> — columns and a few real rows from a Breaking Games file.</span></li>
      <li><span class="ic" aria-hidden="true">2</span><span><b>Pick what it means</b> — three options, one click. Your choice locks in.</span></li>
      <li><span class="ic" aria-hidden="true">3</span><span><b>See the why</b> — the reveal tells you what the data was really telling you.</span></li>
    </ul>
    <div class="nav" style="margin-top:6px;">
      <button class="btn btn-start" id="startBtn" type="button">Let's go &#9654;</button>
    </div>
  </section>`;
}

function buildOutro(){
  return `
  <section class="screen wrap-screen" data-screen="${OUTRO}" hidden role="group" aria-label="Wrap up">
    <div class="wrap-icons" aria-hidden="true">
      <span style="background:var(--shopify)"></span>
      <span style="background:var(--shopify)"></span>
      <span style="background:var(--shopify)"></span>
      <span style="background:var(--analytics)"></span>
      <span style="background:var(--meta)"></span>
      <span style="background:var(--meta)"></span>
    </div>
    <div class="jess-head">
      <div class="jess-avatar" aria-hidden="true">J</div>
      <div class="jess-meta">
        <div class="jess-name">Jess</div>
        <div class="jess-role">Your manager, Breaking Games</div>
      </div>
    </div>
    <div class="tally" id="tally" aria-live="polite">
      <p class="tally-count" id="tallyCount"></p>
      <p class="tally-verdict" id="tallyVerdict"></p>
      <p class="tally-msg" id="tallyMsg"></p>
    </div>
    <div class="jess-bubble">
      <p>That's exactly the read I was hoping for. You're not memorizing file names — you're seeing what the rows <i>mean</i>. That's the whole job.</p>
      <p>The pattern to keep: one file is the <b>scoreboard</b>, one logs the carts that <b>almost</b> converted, the Meta files track <b>spend and audiences</b>, and <b>nothing</b> links an ad to a sale yet. That gap is where the real work starts.</p>
    </div>
    <div class="reflect">
      <b>Before you move on:</b> log one quick reflection — which file surprised you most, and what's the one thing you now know to double-check before trusting a number in it?
    </div>
    <div class="nav" style="margin-top:18px;">
      <button class="btn btn-again" id="againBtn" type="button">&#8635; Try again</button>
    </div>
  </section>`;
}

const screensEl = document.getElementById("screens");
screensEl.innerHTML =
  buildIntro() +
  QUESTIONS.map(buildQuestionScreen).join("") +
  buildOutro();

/* dots */
const dotsEl = document.getElementById("dots");
for (let i=0;i<TOTAL;i++){
  const d = document.createElement("span");
  d.className = "dot";
  dotsEl.appendChild(d);
}

/* ============ STATE / NAV ============ */
let current = INTRO;
let answered = new Array(TOTAL).fill(false);
let score = 0;   // number of questions answered correctly (first/locked answer only)

const topbar = document.getElementById("topbar");
const nav = document.getElementById("nav");
const nextBtn = document.getElementById("nextBtn");
const progressLabel = document.getElementById("progressLabel");

function render(){
  document.querySelectorAll(".screen").forEach(s => {
    s.hidden = (+s.dataset.screen !== current);
  });

  const onQuestion = (current >= 0 && current < TOTAL);

  // topbar + dots only on question screens
  topbar.hidden = !onQuestion;
  if (onQuestion){
    progressLabel.textContent = `Question ${current+1} of ${TOTAL}`;
    [...dotsEl.children].forEach((d,i) => {
      d.classList.toggle("active", i===current);
      d.classList.toggle("done", i<current || answered[i]);
    });
  }

  // nav bar (Next button) only on question screens, shown after answering
  nav.hidden = !onQuestion;
  if (onQuestion){
    nextBtn.classList.toggle("hidden", !answered[current]);
    nextBtn.textContent = (current === TOTAL-1) ? "Finish" : "Next ▶";
  }

  window.scrollTo({top:0, behavior:"smooth"});
  // move focus to the active screen for screen-reader users
  const cs = document.querySelector(`.screen[data-screen="${current}"]`);
  if (cs){ cs.setAttribute("tabindex","-1"); cs.focus({preventScroll:true}); }

  // on a question screen, slide each wide table so its highlighted column shows
  if (onQuestion) scrollKeyColumnsIntoView(current);

  // on the outro, compute and show the tally from the current score
  if (current === OUTRO) fillTally();
}

/* Populate the final-screen tally (count + verdict + message) from `score`.
   Brackets: 5-6 high, 3-4 mid, 0-2 low. Announced via the tally's aria-live region. */
function fillTally(){
  const countEl   = document.getElementById("tallyCount");
  const verdictEl = document.getElementById("tallyVerdict");
  const msgEl     = document.getElementById("tallyMsg");
  if (!countEl || !verdictEl || !msgEl) return;

  let verdict, msg;
  if (score >= 5){
    verdict = "You've got the analyst's eye";
    msg = "You're already reading data like an analyst — you can tell what each file can answer and what it can't. That's the instinct the whole program builds on. Go you. 🎉";
  } else if (score >= 3){
    verdict = "You're getting the hang of this";
    msg = "Nice — the core instinct is already there. You can read what most of these files are telling you, and it only gets sharper from here.";
  } else {
    verdict = "Great start — this is how it begins";
    msg = "Totally normal the first time through — these files click fast once you've sat with them a bit. Pop back into the data explorer for another look, then come back and crush this. You've got it.";
  }

  countEl.innerHTML = `You got <span class="score-num">${score}</span> of ${TOTAL}.`;
  verdictEl.textContent = verdict;
  msgEl.textContent = msg;
}

/* Fully reset the drill so a retake works cleanly, then return to question 1. */
function resetDrill(){
  score = 0;
  answered = new Array(TOTAL).fill(false);

  // clear every question's option buttons + reveals back to untouched state
  QUESTIONS.forEach((item, qIdx) => {
    const optsBox = document.getElementById("opts-"+qIdx);
    if (optsBox){
      optsBox.querySelectorAll(".opt").forEach(b => {
        b.disabled = false;
        b.classList.remove("correct","wrong","dim");
        const mark = b.querySelector(".mark");
        if (mark) mark.textContent = "";
      });
    }
    const revealBox = document.getElementById("reveal-"+qIdx);
    if (revealBox){
      revealBox.className = "reveal";
      revealBox.innerHTML = "";
    }
  });

  // reset progress dots
  [...dotsEl.children].forEach(d => d.classList.remove("active","done"));

  goTo(0);
}

const REDUCE_MOTION = window.matchMedia
  && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* For the current question, horizontally scroll every table so the first
   highlighted column is comfortably in view (mirrors the explorer's behavior). */
function scrollKeyColumnsIntoView(qIdx){
  const screen = document.querySelector(`.screen[data-screen="${qIdx}"]`);
  if (!screen) return;
  screen.querySelectorAll(".table-scroll").forEach(scroller => {
    const keys = (scroller.dataset.keyCols || "").split(",").filter(s => s !== "");
    if (!keys.length) return;
    const ths = scroller.querySelectorAll("thead th");
    const th = ths[parseInt(keys[0], 10)];
    if (!th) return;
    // already fully visible? leave it.
    const fullyVisible =
      th.offsetLeft >= scroller.scrollLeft &&
      th.offsetLeft + th.offsetWidth <= scroller.scrollLeft + scroller.clientWidth;
    if (fullyVisible) return;
    // center the key column in the viewport where possible
    const target = Math.max(
      0,
      th.offsetLeft - (scroller.clientWidth - th.offsetWidth) / 2
    );
    scroller.scrollTo({ left: target, behavior: REDUCE_MOTION ? "auto" : "smooth" });
  });
}

function goTo(i){
  current = i;
  render();
}

document.getElementById("startBtn").onclick = () => goTo(0);
nextBtn.onclick = () => goTo(current + 1);
document.getElementById("againBtn").onclick = () => resetDrill();

/* keyboard arrows: advance only allowed once answered (or on intro/outro) */
document.addEventListener("keydown", (e) => {
  if (e.target.classList && e.target.classList.contains("opt")) return;
  if (e.key === "ArrowRight"){
    if (current === INTRO){ goTo(0); }
    else if (current >= 0 && current < TOTAL && answered[current] && current < TOTAL){ goTo(current+1); }
  }
});

/* ============ ANSWER (predict -> reveal) ============ */
function answer(qIdx, choice){
  if (answered[qIdx]) return;        // locked: no retry
  answered[qIdx] = true;

  const item = QUESTIONS[qIdx];
  // count this question only once, at the moment of locking, if the chosen answer is correct
  if (choice === item.correct) score++;
  const optsBox = document.getElementById("opts-"+qIdx);
  const revealBox = document.getElementById("reveal-"+qIdx);
  const buttons = [...optsBox.querySelectorAll(".opt")];

  buttons.forEach((b,i) => {
    b.disabled = true;               // lock all options
    const mark = b.querySelector(".mark");
    if (i === item.correct){
      b.classList.add("correct");
      mark.textContent = "✓";
    } else if (i === choice){
      b.classList.add("wrong");
      mark.textContent = "✗";
    } else {
      b.classList.add("dim");
    }
  });

  const right = (choice === item.correct);
  revealBox.className = "reveal show " + (right ? "is-right" : "is-wrong");
  revealBox.innerHTML =
    `<span class="verdict">${right ? "Nailed it." : "Not quite — here's the read:"}</span>${esc(item.reveal)}`;

  // reveal the Next button
  nextBtn.classList.remove("hidden");
  nextBtn.textContent = (qIdx === TOTAL-1) ? "Finish" : "Next ▶";
  // update progress dots
  [...dotsEl.children].forEach((d,i) => d.classList.toggle("done", i<current || answered[i]));
}
window.answer = answer;

render();
</script>
