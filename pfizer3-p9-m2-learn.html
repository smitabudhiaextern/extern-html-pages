<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn How to Evaluate Your Pipeline with Real Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer 3.0, Project 9, Step 1, page m2 Learn deck: "Learn How to Evaluate Your Pipeline with Real Data".
   Chaitanya's (SME) page of the same name (Notion 9761d028b9f4837d9e6f8119bcbaa085, last edited 6 Nov 2026) and his
   H5P "Testing RAG Pipeline - Pfizer" (externcom.h5p.com/content/1292839754686265889, 6 metric slides), ideas only, no code.
   Built 27 November 2026 from source/m2-learn-build.py (+ m2-learn-style.css, m2-learn-player.js, this head), the same
   way as the P8 m2 Learn deck. Never hand-patch this file: change the source and rebuild.
   SME text word for word, except the swaps listed in ../coverage-m2.md section 3. Ours: titles, eyebrows, one bold why
   line per card, captions, switch labels, flow-box and bar labels, and short term definitions.
   His example tables and example values only; no new data.
   Fixed stage: 760 x 750 at every width, scaled as one piece to fit the frame and centred. Nothing scrolls. */

/* Pfizer x Extern Core design system, Light format. P9 m2 Learn deck: copied from project-08/source/m2-learn-style.css (27 Nov 2026), plus the P9 m2 blocks at the end. P8 m2 header follows. P8 m2 Learn deck: copied unchanged from project-05/source/m4-learn-style.css (P5 m4), plus the P8 m2 blocks at the end. P5 m4 header: copied from m2-learn-style.css (P5 m2), plus the m4 blocks at the end. Tokens, card player, rail, "Click me" pulse, switches and pictures
   copied from pfizer3-p4-m2-learn.html (P4 module 2, rebuilt 22 November 2026: body text 18 css px). */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage-w:760px; --stage-h:750px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
[hidden]{display:none !important}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:20px;align-items:center}
.where{order:2;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:5px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 1px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:18px 28px;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.inner{display:flex;flex-direction:column;gap:12px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:2px}
.hl{color:var(--highlight)}
.why{margin:-6px 0 0;font-size:19px;line-height:1.4;font-weight:600;color:var(--ink)}
.p{margin:0;font-size:18px;line-height:1.5;color:var(--ink-muted);text-wrap:pretty}
.p b,.li b{font-weight:600;color:var(--ink)}
.hint{margin:0;font-size:15.5px;line-height:1.4;font-weight:600;color:var(--step-label)}
.ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:2px}
.ul li{font-size:18px;line-height:1.5;color:var(--ink-muted)}
.ul li b{font-weight:600;color:var(--ink)}
.q{font-style:italic}
.mono{font-family:var(--font-mono);font-size:.9em;white-space:nowrap}

/* Switch */
.sw{display:inline-flex;flex:none;border:1.5px solid var(--ink);border-radius:var(--radius-xs);overflow:hidden}
.sw button{border:0;background:var(--surface);color:var(--ink);padding:9px 15px;cursor:pointer;font-size:15.5px;line-height:1.2;font-weight:600;white-space:nowrap}
.sw button + button{border-left:1.5px solid var(--ink)}
.sw button[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.row{display:flex;align-items:center;gap:16px}

/* Click-me nudge: a soft pulsing outline and a small tag, both gone after the first click */
.nwrap{position:relative;display:inline-flex;flex:none}
.nudge{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(0,51,160,.55)}50%{box-shadow:0 0 0 7px rgba(0,51,160,.12)}}
.tap{position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--surface-card);color:var(--pfizer-blue);border:1px solid var(--blue-200);border-radius:999px;padding:4px 11px;font-size:13px;line-height:1.2;font-weight:600;pointer-events:none;animation:tapx 1.6s ease-in-out infinite}
.tap.inline{position:static;transform:none;display:inline-block;margin-left:10px;vertical-align:1px}
@keyframes tapx{0%,100%{margin-left:0}50%{margin-left:4px}}
.tap.inline{animation:none}
@media (prefers-reduced-motion:reduce){ .nudge{animation:none;box-shadow:0 0 0 3px rgba(0,51,160,.5)} .tap{animation:none} }

/* Pictures with boxes drawn over them */
.pic{position:relative;margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);line-height:0;flex:none;padding:8px 10px}
.pic img{display:block;width:100%;height:auto}
.pic .ov{position:absolute;inset:8px 10px;pointer-events:none}
.pic svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pic rect{fill:none;vector-effect:non-scaling-stroke}
.pic rect.g{stroke:var(--highlight);fill:var(--highlight);fill-opacity:.16;stroke-width:3px}
.pic rect.pop{animation:pop .3s ease both}
@keyframes pop{from{opacity:0}to{opacity:1}}
.pic .blank{position:absolute;inset:0;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:72px;line-height:1;color:var(--blue-200)}
.cap{margin:6px 0 0;font-size:15px;line-height:1.35;font-weight:600;color:var(--gray-600);text-align:left}
.cap b{color:var(--ink)}
.picwrap{display:flex;gap:18px;align-items:center}
.picwrap .pic{width:300px}
.picwrap .cap{flex:1;margin:0;font-size:18px}

/* Clickable rows (text always visible; a click only changes the picture) */
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:10px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer;font-size:18px;line-height:1.45;color:var(--ink-muted)}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--surface-card);color:var(--pfizer-blue);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step b{font-weight:600;color:var(--ink)}
.step:hover{border-color:var(--blue-200)}
.step[aria-pressed="true"]{border-color:var(--pfizer-blue);background:var(--surface-card);box-shadow:inset 4px 0 0 var(--pfizer-blue)}
.step[aria-pressed="true"] .n{background:var(--pfizer-blue);color:var(--on-action)}
.steps.static .step{cursor:default}
.steps.static .step:hover{border-color:var(--line)}
.steps.wrap{border-radius:var(--radius-sm)}

/* Flow diagrams built from boxes */
.flow{display:flex;align-items:stretch;gap:6px}
.fbox{flex:1 1 0;min-width:0;border:1.5px solid var(--blue-200);border-radius:var(--radius-sm);background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;gap:3px;transition:background .3s ease,border-color .3s ease,opacity .3s ease}
.fbox .fl{font-size:12.5px;line-height:1.2;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label)}
.fbox .ft{font-size:17px;line-height:1.35;font-weight:600;color:var(--ink)}
.fbox .fs{font-size:14.5px;line-height:1.35;color:var(--card-text)}
.fbox.on{background:var(--surface-card);border-color:var(--pfizer-blue);box-shadow:inset 0 0 0 1px var(--pfizer-blue)}
.fbox.dim{opacity:.45}
.arr{flex:none;align-self:center;color:var(--ink);font-size:20px;line-height:1}
.ctx{margin:0;border:1px solid var(--blue-200);border-radius:var(--radius-sm);background:var(--surface-card);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.ctx .cl{font-size:12.5px;line-height:1.2;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label)}
.ctx .cq{font-size:18px;line-height:1.4;color:var(--ink)}
.ctx .cd{font-family:var(--font-mono);font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xs);padding:5px 10px;color:var(--ink);align-self:flex-start}

/* Tables */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:14px;line-height:1.3;font-weight:600;color:var(--ink-muted);padding:7px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--line);font-size:18px;line-height:1.4;color:var(--card-text);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.k{font-weight:600;color:var(--ink);white-space:nowrap}
.tbl td b{font-weight:600;color:var(--ink)}
.tbl a{color:var(--pfizer-blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.tbl a:hover{text-decoration-thickness:2px}

/* Two columns */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{margin:0;border:1px solid var(--blue-200);border-radius:var(--radius-sm);background:var(--surface-card);padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.box .bh{margin:0;font-size:18px;line-height:1.35;font-weight:600;color:var(--card-title)}
.box .bp{margin:0;font-size:18px;line-height:1.45;color:var(--card-text);text-wrap:pretty}
.box .bp b{font-weight:600;color:var(--ink)}
.box ul{margin:0;padding-left:20px}
.box li{font-size:18px;line-height:1.45;color:var(--card-text)}
.box li b{font-weight:600;color:var(--ink)}
.box.white{background:var(--surface);border-color:var(--line)}

/* Sources into LlamaIndex (card 6) */
.src{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.src .chips{display:grid;grid-template-columns:auto auto;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:15px;line-height:1.2;font-weight:600;white-space:nowrap}
.hub{border:1.5px solid var(--pfizer-blue);background:var(--surface-card);border-radius:var(--radius-sm);padding:10px 12px;text-align:center;font-size:16px;line-height:1.3;font-weight:600;color:var(--ink)}
.hub small{display:block;font-size:13.5px;font-weight:500;color:var(--card-text);margin-top:2px}

/* Play button (card 10) */
.btn-play{display:inline-flex;align-items:center;gap:8px;font-size:15.5px;line-height:1.2;font-weight:600;padding:9px 15px;border-radius:var(--radius-xs);border:1.5px solid var(--ink);background:var(--surface);cursor:pointer}
.btn-play svg{width:13px;height:13px}

/* Recap (last card) */
.recap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.recap .box{padding:9px 13px;gap:3px}
.recap .bh{font-size:18px}
.recap li{font-size:18px;line-height:1.4}
.take{margin:0;border-left:4px solid var(--highlight);background:var(--surface);padding:4px 0 4px 14px;font-size:18px;line-height:1.45;color:var(--ink)}
.take b{font-weight:600}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }

/* ---------- m4 additions (same tokens only) ---------- */
/* Wide and mid-width page crops, with the caption under the picture */
.pic.wide{width:100%}
.pic.mid{width:540px;align-self:flex-start}
.cap.under{margin:0;font-size:17px;line-height:1.4;font-weight:600;color:var(--gray-600)}
.cap b{color:var(--ink)}

/* Page thumbnails (whole supplier pages). Labels sit under each page, never on it. */
.thumbs{display:flex;gap:12px;flex:none}
.th{margin:0;width:112px;display:flex;flex-direction:column;gap:5px;transition:opacity .3s ease}
.th img{display:block;width:112px;height:auto;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);transition:border-color .3s ease,box-shadow .3s ease}
.th figcaption{display:flex;flex-direction:column;gap:1px;line-height:1.25}
.th .pn{font-size:14px;font-weight:600;color:var(--ink)}
.th .sc{font-size:14px;font-weight:600;color:var(--step-label);font-variant-numeric:tabular-nums;min-height:17px}
.th.on img{border-color:var(--pfizer-blue);box-shadow:0 0 0 3px var(--pfizer-blue)}
.th.dim{opacity:.38}
.tview{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.tview .cap{margin:0;font-size:18px;line-height:1.4;font-weight:600;color:var(--gray-600)}
.duo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.duo .side{display:flex;flex-direction:column;gap:8px;width:360px}
.duo .side .cap{margin:0;font-size:16.5px;line-height:1.4;font-weight:600;color:var(--gray-600)}
.duo .side .thumbs{gap:12px}

/* Clickable boxes (card 4): the text never changes, a click changes the picture */
.picks{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-radius:var(--radius-sm)}
.box.pick{text-align:left;cursor:pointer;border-width:1.5px;font:inherit}
.box.pick .bh,.box.pick .bp{display:block}
.box.pick[aria-pressed="true"]{border-color:var(--pfizer-blue);box-shadow:inset 4px 0 0 var(--pfizer-blue)}
.box.pick[aria-pressed="false"]{background:var(--surface);border-color:var(--line)}

/* Key and value table (one technique per card) */
.kv td.k{width:170px;white-space:normal}

/* Ranked results that swap places (card 11) */
.rank{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rank li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;column-gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:9px 12px;font-size:18px;line-height:1.4;color:var(--card-text)}
.rank li .n{width:26px;height:26px;border-radius:50%;background:var(--surface-card);color:var(--pfizer-blue);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rank li .tg{font-size:13px;font-weight:600;color:var(--pfizer-blue);background:var(--surface-card);border:1px solid var(--blue-200);border-radius:999px;padding:3px 10px;white-space:nowrap;visibility:hidden}
.rank li.top{border-color:var(--pfizer-blue);background:var(--surface-card)}
.rank li.top .n{background:var(--pfizer-blue);color:var(--on-action)}
.rank li.top .tg{visibility:visible;background:var(--surface)}
.rank li.mv{animation:pop .35s ease both}
.tbl.rr td.k{white-space:normal;width:210px}

/* ---------- P8 m2 additions (same tokens only) ---------- */
/* Link card (his live hello-world app) */
.lnk{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:10px 14px;text-decoration:none;color:var(--ink);align-self:flex-start;max-width:100%}
.lnk:hover{border-color:var(--blue-200)}
.lnk .lt{display:flex;flex-direction:column;gap:2px;min-width:0}
.lnk .lt b{font-size:17px;line-height:1.3;font-weight:600;color:var(--ink)}
.lnk .lt span{font-size:14px;line-height:1.3;color:var(--gray-600)}
.lnk svg{width:18px;height:18px;flex:none;color:var(--pfizer-blue)}
/* His quote, in serif */
.say{margin:0;border-left:4px solid var(--pfizer-blue);background:var(--surface-card);padding:10px 16px;font-family:var(--font-serif);font-size:23px;line-height:1.35;color:var(--card-title)}
/* Five skills: five boxes in a row */
.flow.five .fbox{padding:8px 8px}
.flow.five .ft{font-size:16px}
.flow.five .fs{font-size:13.5px}
/* Picture on the left, switch and caption on the right (card 8) */
.side2{display:grid;grid-template-columns:380px minmax(0,1fr);gap:18px;align-items:center}
.side2 .sidecol{display:flex;flex-direction:column;gap:10px}

/* ---------- P9 m2 blocks (tokens only) ---------- */
.tbl.sm th{font-size:13px;padding:6px 10px}
.tbl.sm td{font-size:16px;line-height:1.35;padding:5px 10px}
.tbl tbody tr td{transition:background .3s ease,opacity .3s ease}
.tbl tbody tr.on td{background:var(--surface-card)}
.tbl tbody tr.on td.k{box-shadow:inset 4px 0 0 var(--pfizer-blue)}
.tbl tbody tr.dim td{opacity:.4}
.tbl td.num{white-space:nowrap}
/* A split bar: two parts of one whole (card 4, card 13) */
.split{display:flex;height:46px;border-radius:var(--radius-sm);overflow:hidden;border:1.5px solid var(--blue-200)}
.split .part{display:flex;align-items:center;justify-content:center;padding:0 10px;font-size:15px;line-height:1.2;font-weight:600;color:var(--ink);background:var(--surface);white-space:nowrap}
.split .part.key{background:var(--surface-card);border-left:1.5px solid var(--pfizer-blue);box-shadow:inset 0 0 0 1px var(--pfizer-blue)}
/* Timing bars (card 12) */
.bars{display:flex;flex-direction:column;gap:8px}
.bars .br{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;font-size:15px;font-weight:600;color:var(--ink-muted)}
.bars .bv{height:30px;border-radius:var(--radius-xs);background:var(--surface-card);border:1.5px solid var(--pfizer-blue);display:flex;align-items:center;padding:0 10px;font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap}
.qa{margin:0;font-size:18px;line-height:1.45;color:var(--card-text)}
.qa b{font-weight:600;color:var(--ink)}
.defs{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 14px;font-size:15.5px;line-height:1.45;color:var(--card-text)}
.defs b{font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="How to evaluate your pipeline with real data: 17 cards">
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where"><span id="where-count">Card 1 of 17</span></div>
  </header>

<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  var each = function (list, fn) { Array.prototype.forEach.call(list, fn); };
  var D = {"ST": {"c3": {"d": {"rows": [0, 2], "cap": "Digital PDFs: the Cover Letter and the Packaging Specification."}, "s": {"rows": [1, 3], "cap": "Scanned PDFs: the Certificate of Quality and the BSE/TSE Declaration."}, "m": {"rows": [4], "cap": "Mixed: the multi-doc blob has both digital and scanned pages."}}, "c14": {"f": {"flow": [0], "cap": "Field extraction: Exact Match % and Relative Error, both about accuracy."}, "c": {"flow": [1, 2], "cap": "A chatbot, like yours: Retrieval Quality (recall) and Latency."}}, "c15": {"0": {"flow": [0]}, "1": {"flow": [1]}, "2": {"flow": [2]}, "3": {"flow": [3]}}, "c16": {"0": {"rows": [0], "cap": "<i>Exact Match %</i>: Out of all the fields you needed, how many were <b>perfectly correct</b>? (Very strong on digital docs, weaker on scanned ones.)"}, "1": {"rows": [1], "cap": "<i>Response Time</i>: How long did the system take to reply? (On average, 3 to 4 seconds.)"}, "2": {"rows": [2], "cap": "<i>Retrieval Recall@5</i>: Did the system find the <b>right passages</b> in the top 5 chunks it pulled? (Pretty solid across both types.)"}}}};

  function clear(svg) { while (svg.firstChild) svg.removeChild(svg.firstChild); }
  /* boxes: [x0, y0, x1, y1] in the picture's own pixels */
  function draw(svg, boxes, pop) {
    clear(svg);
    boxes.forEach(function (b) {
      var r = document.createElementNS(NS, "rect");
      r.setAttribute("x", b[0]); r.setAttribute("y", b[1]);
      r.setAttribute("width", b[2] - b[0]); r.setAttribute("height", b[3] - b[1]); r.setAttribute("rx", 4);
      r.setAttribute("class", "g" + (pop ? " pop" : ""));
      svg.appendChild(r);
    });
  }

  /* Click-me nudges (copied from the P3 and P4 decks): a pulsing outline and a "Click me" tag until the first click */
  var tapped = {};
  function nudge(key, target, tagHost, cls) {
    if (tapped[key] || target.classList.contains("nudge")) return;
    target.classList.add("nudge");
    var tag = document.createElement("span");
    tag.className = "tap" + (cls ? " " + cls : ""); tag.setAttribute("aria-hidden", "true"); tag.textContent = "👆 Click me";
    (tagHost || target.parentNode).appendChild(tag);
    target.addEventListener("click", function () {
      tapped[key] = true;
      target.classList.remove("nudge");
      if (tag.parentNode) tag.parentNode.removeChild(tag);
    }, true);
  }

  /* P9 m2 Learn deck: copied from project-08/source/m2-learn-player.js (27 Nov 2026), plus the rows state below. */
  /* ---------- One init for every m4 card with a picture (copied idea from the m2 cards, made generic) ----------
     Each card holds one element with data-key. D.ST[key] has one state per button (data-v), or a single state "0" for a
     card with no buttons. A state can set: boxes (per picture id, in the picture's own pixels), pages (per page number:
     [class, label under the page]), flow (indexes of lit flow boxes), order (ids of the ranked rows, top first) and cap.
     Buttons change only the picture, the labels under the pages and the caption. The card's text never changes. */
  function initState(root) {
    var host = root.querySelector("[data-key]");
    if (!host) return;
    var S = D.ST[host.getAttribute("data-key")];
    var btns = root.querySelectorAll("[data-v]");
    function show(v, pop) {
      var s = S[v];
      each(btns, function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-v") === v ? "true" : "false"); });
      each(root.querySelectorAll(".pic"), function (fig) {
        var svg = fig.querySelector("svg"); if (!svg) return;
        draw(svg, (s.boxes && s.boxes[fig.id]) || [], pop);
      });
      if (s.pages) each(root.querySelectorAll(".th"), function (th) {
        var st = s.pages[th.getAttribute("data-p")] || ["", ""];
        th.className = "th" + (st[0] ? " " + st[0] : "");
        th.querySelector(".sc").textContent = st[1];
      });
      if (s.flow) each(root.querySelectorAll(".fbox"), function (b, k) {
        var on = s.flow.indexOf(k) >= 0; b.classList.toggle("on", on); b.classList.toggle("dim", !on);
      });
      /* P9 m2: rows (indexes of lit table rows in the card's .tbl.vz) */
      if (s.rows) each(root.querySelectorAll(".tbl.vz tbody tr"), function (tr, k) {
        var on = s.rows.indexOf(k) >= 0; tr.classList.toggle("on", on); tr.classList.toggle("dim", !on);
      });
      if (s.order) {
        var list = root.querySelector(".rank");
        s.order.forEach(function (id, k) {
          var li = list.querySelector('[data-id="' + id + '"]');
          list.appendChild(li);
          li.querySelector(".n").textContent = k + 1;
          li.classList.toggle("top", k === 0);
          if (pop) { li.classList.remove("mv"); void li.offsetWidth; li.classList.add("mv"); }
        });
      }
      var cap = root.querySelector(".cap.vz");
      if (cap) cap.innerHTML = s.cap || "";
      space();
    }
    each(btns, function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-v"), true); }); });
    show(btns.length ? btns[0].getAttribute("data-v") : "0", false);
    var group = root.querySelector(".sw, .steps:not(.static), .picks");
    if (group) {
      var hint = root.querySelector(".nhost");
      nudge(host.getAttribute("data-key"), group, hint || group.parentNode, hint ? "inline" : "");
    }
  }

  var timer = null;
  var INITS = { initState: initState };
  var CARDS = [{label:"Final Exam",eyebrow:"Does my pipeline work?",html:"<h2 class=\"title\">Run a Final <span class=\"hl\">Exam</span> for Your Pipeline</h2><p class=\"why\">This is how you answer your mentor's question with proof.</p><p class=\"p\">This time, you'll learn how to evaluate your pipeline properly! Think of it like running a final exam for your system. You'll test your work with real examples, measure your pipeline's performance, and gather solid evidence to <b>back up your claims</b>.</p><p class=\"p\">If you do this right, you'll gain two things:</p><div class=\"two\"><div class=\"box\"><p class=\"bh\">1. Confidence</p><p class=\"bp\">that your pipeline is reliable and ready for real-world use.</p></div><div class=\"box\"><p class=\"bh\">2. Professional proof of performance</p><p class=\"bp\">you can showcase in your final report, portfolio, or even in conversations with mentors and employers.</p></div></div>",init:null},
{label:"Test Set",eyebrow:"Step 1: Build a solid test set",html:"<h2 class=\"title\">Your Test Set Is the Exam <span class=\"hl\">Paper</span></h2><p class=\"why\">If the exam is too easy, a pass proves very little.</p><p class=\"p\">Your <i>test set</i> is basically the <b>exam paper</b> for your pipeline. It's a collection of documents that represent the kinds of files your system will face in the real world.</p><p class=\"p\"><b>How to Build It:</b></p><ul class=\"ul\"><li><b>Include variety:</b> Both <b>digital</b> and <b>scanned</b> PDFs.</li><li><b>Match real-world complexity:</b> Include multi-page docs, poor scan quality, and unusual layouts.</li><li><b>Represent every doc type:</b> From your pharmaceutical SDF package, that means&hellip;</li></ul><div class=\"chips\"><span class=\"chip\">Cover Letters</span><span class=\"chip\">Certificates of Quality</span><span class=\"chip\">Packaging Specifications</span><span class=\"chip\">BSE/TSE Declarations</span><span class=\"chip\">Multi-document pharma blobs</span></div>",init:null},
{label:"Example Set",eyebrow:"Step 1: Build a solid test set",html:"<h2 class=\"title\">An Example Test <span class=\"hl\">Set</span></h2><p class=\"why\">Mixing digital and scanned files shows where your pipeline struggles.<span class=\"nhost\"></span></p><div class=\"keyhost\" data-key=\"c3\" hidden></div><p class=\"p\">Let's take a look at an <b>example test set:</b></p><div class=\"tbl sm vz\"><table><thead><tr><th scope=\"col\">Doc Type</th><th scope=\"col\">Pages</th><th scope=\"col\">Digital / Scanned</th><th scope=\"col\">Notes</th></tr></thead><tbody><tr><td class=\"k\">Cover Letter</td><td>2</td><td>Digital</td><td>Formal letter with product info and storage conditions</td></tr><tr><td class=\"k\">Certificate of Quality</td><td>2</td><td>Scanned</td><td>Lot numbers, test results, manufacture/expiration dates</td></tr><tr><td class=\"k\">Packaging Specification</td><td>3</td><td>Digital</td><td>Part numbers, materials, configuration change history</td></tr><tr><td class=\"k\">BSE/TSE Declaration</td><td>1</td><td>Scanned</td><td>Animal-origin materials compliance statement</td></tr><tr><td class=\"k\">Multi-Doc Pharma Blob</td><td>15</td><td>Mixed</td><td>Requires segmentation + classification across all 7 types</td></tr></tbody></table></div><div class=\"row\"><div class=\"nwrap\"><div class=\"sw\" role=\"group\" aria-label=\"Choose a kind of PDF\"><button type=\"button\" data-v=\"d\" aria-pressed=\"false\">Digital</button><button type=\"button\" data-v=\"s\" aria-pressed=\"false\">Scanned</button><button type=\"button\" data-v=\"m\" aria-pressed=\"false\">Mixed</button></div></div></div><p class=\"cap vz under\"></p>",init:"initState"},
{label:"Unseen",eyebrow:"Step 1: Build a solid test set",html:"<h2 class=\"title\">Keep Some Documents <span class=\"hl\">Unseen</span></h2><p class=\"why\">Testing on documents you tuned with is like sitting an exam you've already seen.</p><div class=\"box\"><p class=\"bp\"><b>Pro Tip:</b> Ideally, you should set aside <b>10 to 15% of your documents</b> for testing <i>before</i> you start building. If you didn't do that earlier, no worries. You can still create a fresh test set now by picking some documents you haven't used for tuning or debugging. Think of them as your \"unseen exam questions\" to keep the evaluation fair.</p></div><div class=\"split\" role=\"img\" aria-label=\"Your documents: about 85 to 90% for building and tuning, 10 to 15% kept for testing\"><span class=\"part\" style=\"flex:87\">Build and tune: 85 to 90%</span><span class=\"part key\" style=\"flex:13\">Test: 10 to 15%</span></div>",init:null},
{label:"Ground Truth",eyebrow:"Step 2: Define your ground truth",html:"<h2 class=\"title\">Ground Truth Is Your Answer <span class=\"hl\">Key</span></h2><p class=\"why\">You can only mark an answer wrong if you know the right one.</p><p class=\"p\">Your <i>ground truth</i> is the <b>correct answer key</b>. It's what you'll use to judge whether your pipeline's answers are right or wrong.</p><p class=\"p\"><b>Example: (Certificate of Quality, 2 Pages)</b></p><div class=\"tbl sm\"><table><thead><tr><th scope=\"col\">Field Name</th><th scope=\"col\">Ground Truth Value</th></tr></thead><tbody><tr><td class=\"k\">Product Name</td><td>BD Hypak SCF Syringe</td></tr><tr><td class=\"k\">Lot Number</td><td>8290124</td></tr><tr><td class=\"k\">Sterilization Method</td><td>Gamma Irradiation</td></tr><tr><td class=\"k\">Expiration Date</td><td>2027-06-15</td></tr><tr><td class=\"k\">Storage Condition</td><td>15-30°C</td></tr></tbody></table></div>",init:null},
{label:"Make the Key",eyebrow:"Step 2: Define your ground truth",html:"<h2 class=\"title\">How to Create Your Answer <span class=\"hl\">Key</span></h2><p class=\"why\">Every score you report is checked against this key.</p><div class=\"box\"><p class=\"bh\">&#128161; How to Create It</p><ul><li>Go through documents <b>manually</b> (or with a trusted process).</li><li>Store results in a structured format like <b>JSON or CSV</b>.</li><li>Add extra details like <b>page numbers</b> if helpful.</li></ul></div><div class=\"flow\"><div class=\"fbox\"><span class=\"fl\">Read</span><span class=\"ft\">The document, by hand</span></div><span class=\"arr\" aria-hidden=\"true\">&rarr;</span><div class=\"fbox\"><span class=\"fl\">Write</span><span class=\"ft\">Each field's right value</span></div><span class=\"arr\" aria-hidden=\"true\">&rarr;</span><div class=\"fbox\"><span class=\"fl\">Save</span><span class=\"ft\">As JSON or CSV</span></div></div>",init:null},
{label:"Metrics",eyebrow:"Step 3: Pick the right metrics",html:"<h2 class=\"title\">Metrics Are the Scores on Your <span class=\"hl\">Exam</span></h2><p class=\"why\">Slide 4 of your final presentation shows your scores.</p><p class=\"p\">Now that you've got your test set and ground truth, the next question is: <b>how do you measure success?</b></p><p class=\"p\">That's where <b>metrics</b> come in.</p><p class=\"p\">Think of metrics like the <b>scores on your exam</b>. Just like in school, you don't only get one grade. Sometimes you're scored on multiple things (accuracy, speed, clarity). It's the same with your pipeline.</p><p class=\"p\">Let's break down the most important ones you can use:</p><div class=\"chips\"><span class=\"chip\">1. Exact Match %</span><span class=\"chip\">2. Relative Error</span><span class=\"chip\">3. Recall@K, MRR</span><span class=\"chip\">4. ROUGE / BLEU</span><span class=\"chip\">5. Latency</span><span class=\"chip\">6. Error Rate %</span></div>",init:null},
{label:"Metric 1",eyebrow:"Step 3: Metric 1 of 6",html:"<h2 class=\"title\">Field Accuracy: Exact <span class=\"hl\">Match</span> %</h2><p class=\"why\">A lot number that's one digit off is a wrong lot number.</p><p class=\"say\">\"Did my pipeline get the field exactly right?\"</p><p class=\"qa\"><b>Example:</b> If the ground truth says Lot Number = <b>8290124</b>, and your pipeline also outputs <b>8290124</b>, that's a perfect match.</p><div class=\"flow\"><div class=\"fbox\"><span class=\"fl\">Ground truth</span><span class=\"ft\">8290124</span></div><span class=\"arr\" aria-hidden=\"true\">&rarr;</span><div class=\"fbox\"><span class=\"fl\">Your pipeline</span><span class=\"ft\">8290124</span></div><span class=\"arr\" aria-hidden=\"true\">&rarr;</span><div class=\"fbox\"><span class=\"fl\">Result</span><span class=\"ft\">Perfect match</span></div></div><p class=\"qa\"><b>Why it matters:</b> For structured data like lot numbers, expiration dates, or product names, being precise is critical.</p>",init:null},
{label:"Metric 2",eyebrow:"Step 3: Metric 2 of 6",html:"<h2 class=\"title\">Numeric Accuracy: Relative <span class=\"hl\">Error</span></h2><p class=\"why\">Some misses are small and some are dangerous, and this tells them apart.</p><p class=\"say\">\"If my pipeline got the number wrong, how far off was it?\"</p><p class=\"qa\"><b>Example:</b> If the correct storage temperature is <b>2-8°C</b>, and your pipeline says <b>2-10°C</b>, that's close, but not exact. Relative error tells you how big the miss is.</p><div class=\"flow\"><div class=\"fbox\"><span class=\"fl\">Ground truth</span><span class=\"ft\">2-8°C</span></div><span class=\"arr\" aria-hidden=\"true\">&rarr;</span><div class=\"fbox\"><span class=\"fl\">Your pipeline</span><span class=\"ft\">2-10°C</span></div><span class=\"arr\" aria-hidden=\"true\">&rarr;</span><div class=\"fbox\"><span class=\"fl\">Result</span><span class=\"ft\">Close, not exact</span></div></div><p class=\"qa\"><b>Why it matters:</b> In pharmaceutical compliance, being \"close enough\" is sometimes fine (e.g., rounding differences), but large errors can be dangerous.</p>",init:null},
{label:"Metric 3",eyebrow:"Step 3: Metric 3 of 6",html:"<h2 class=\"title\">Retrieval Quality: Recall@K and <span class=\"hl\">MRR</span></h2><p class=\"why\">These two scores check the retrieval half of your chatbot.</p><p class=\"say\">\"Is my system pulling the right pieces of text before answering?\"</p><p class=\"qa\"><b>Example:</b> If the user asks <b>\"What's the sterilization method?\"</b>, the pipeline should grab the chunk of the document that actually contains that information.</p><p class=\"qa\"><b>Why it matters:</b> Even the smartest model can't answer correctly if it's looking at the wrong part of the document.</p><p class=\"defs\"><b>Recall@K:</b> did the right chunk show up in the top K chunks pulled (K is how many, like 5)? <b>MRR</b> (mean reciprocal rank): how near the top of that list the right chunk sits, on average.</p>",init:null},
{label:"Metric 4",eyebrow:"Step 3: Metric 4 of 6",html:"<h2 class=\"title\">Readability: ROUGE and <span class=\"hl\">BLEU</span></h2><p class=\"why\">Use these when the wording of an answer matters, not just the facts.</p><p class=\"say\">\"How good is my generated summary or answer compared to the ideal one?\"</p><p class=\"qa\"><b>Example:</b> If your ground truth summary is <b>\"Product was sterilized using gamma irradiation on 15-Mar-2024\"</b> and your pipeline says <b>\"Gamma irradiation sterilization performed March 15, 2024,\"</b> these metrics check how close the wording is.</p><p class=\"qa\"><b>Why it matters:</b> Sometimes, you don't just want facts. You want the answer written clearly and fluently.</p><p class=\"defs\"><b>ROUGE</b> and <b>BLEU</b> are scores that count how many words and short word groups an answer shares with the ideal one.</p>",init:null},
{label:"Metric 5",eyebrow:"Step 3: Metric 5 of 6",html:"<h2 class=\"title\">Latency: Response Time in <span class=\"hl\">Seconds</span></h2><p class=\"why\">How fast your chatbot answers is one of the scores worth reporting.</p><p class=\"say\">\"How fast does my system respond?\"</p><p class=\"qa\"><b>Example:</b> Does it take 3 seconds to answer, or does the user sit for 15 seconds waiting?</p><div class=\"bars\" role=\"img\" aria-label=\"A 3 second answer next to a 15 second answer\"><div class=\"br\"><span>Fast answer</span><span class=\"bv\" style=\"width:20%\">3 sec</span></div><div class=\"br\"><span>Slow answer</span><span class=\"bv\" style=\"width:100%\">15 sec</span></div></div><p class=\"qa\"><b>Why it matters:</b> Speed is part of the user experience. Even accurate answers feel broken if they're too slow.</p>",init:null},
{label:"Metric 6",eyebrow:"Step 3: Metric 6 of 6",html:"<h2 class=\"title\">Robustness: Error Rate <span class=\"hl\">%</span></h2><p class=\"why\">A demo that crashes once is the one everyone remembers.</p><p class=\"say\">\"How often does the system completely fail?\"</p><p class=\"qa\"><b>Example:</b> Crashes, timeouts, or empty outputs count as errors.</p><div class=\"split\" role=\"img\" aria-label=\"90% of answers work, 10% fail\"><span class=\"part\" style=\"flex:90\">Works: 90%</span><span class=\"part key\" style=\"flex:10\">Fails: 10%</span></div><div class=\"chips\"><span class=\"chip\">Crashes</span><span class=\"chip\">Timeouts</span><span class=\"chip\">Empty outputs</span></div><p class=\"qa\"><b>Why it matters:</b> A pipeline that works 90% of the time but fails 10% is not reliable enough for real users.</p>",init:null},
{label:"Pick Yours",eyebrow:"Step 3: Pick the right metrics",html:"<h2 class=\"title\">Pick the Metrics That Fit Your <span class=\"hl\">Project</span></h2><p class=\"why\">Your chatbot needs only some of these, so choose with care.<span class=\"nhost\"></span></p><div class=\"keyhost\" data-key=\"c14\" hidden></div><p class=\"p\">Don't worry if these sound new. Remember:</p><div class=\"flow vz\"><div class=\"fbox\"><span class=\"fl\">Accuracy</span><span class=\"ft\">How correct?</span></div><div class=\"fbox\"><span class=\"fl\">Recall</span><span class=\"ft\">Did it find the right place?</span></div><div class=\"fbox\"><span class=\"fl\">Latency</span><span class=\"ft\">How fast?</span></div><div class=\"fbox\"><span class=\"fl\">Error rate</span><span class=\"ft\">How often it breaks?</span></div></div><p class=\"p\">You don't need to use <i>all</i> of these metrics, but you should pick the ones that matter most for your project. If you're focused on <b>field extraction</b>, Exact Match % and Relative Error are critical. If you're building a <b>chatbot</b> <i>(like you are)</i>, then Retrieval Quality and Latency might matter more.</p><div class=\"row\"><div class=\"nwrap\"><div class=\"sw\" role=\"group\" aria-label=\"Choose a project\"><button type=\"button\" data-v=\"f\" aria-pressed=\"false\">Field extraction</button><button type=\"button\" data-v=\"c\" aria-pressed=\"false\">Chatbot</button></div></div></div><p class=\"cap vz under\"></p>",init:"initState"},
{label:"Run It",eyebrow:"Step 4: Run your final evaluation",html:"<h2 class=\"title\">Run Your Final <span class=\"hl\">Evaluation</span></h2><p class=\"why\">These four moves turn your chatbot's answers into numbers you can show.<span class=\"nhost\"></span></p><div class=\"keyhost\" data-key=\"c15\" hidden></div><p class=\"p\">Here's what the process looks like:</p><ol class=\"steps \"><li><button type=\"button\" class=\"step\" data-v=\"0\" aria-pressed=\"false\"><span class=\"n\">1</span><span><b>Load your test set</b> into the pipeline.</span></button></li><li><button type=\"button\" class=\"step\" data-v=\"1\" aria-pressed=\"false\"><span class=\"n\">2</span><span><b>Capture the outputs</b> (extracted fields, answers, summaries, etc.).</span></button></li><li><button type=\"button\" class=\"step\" data-v=\"2\" aria-pressed=\"false\"><span class=\"n\">3</span><span><b>Compare outputs</b> against the ground truth using the right metrics.</span></button></li><li><button type=\"button\" class=\"step\" data-v=\"3\" aria-pressed=\"false\"><span class=\"n\">4</span><span>Don't bury your results in paragraphs. <b>Use a table</b> that anyone can understand at a glance.</span></button></li></ol><div class=\"flow vz\"><div class=\"fbox\"><span class=\"fl\">1</span><span class=\"ft\">Test set</span></div><span class=\"arr\" aria-hidden=\"true\">&rarr;</span><div class=\"fbox\"><span class=\"fl\">2</span><span class=\"ft\">Outputs</span></div><span class=\"arr\" aria-hidden=\"true\">&rarr;</span><div class=\"fbox\"><span class=\"fl\">3</span><span class=\"ft\">Compare</span></div><span class=\"arr\" aria-hidden=\"true\">&rarr;</span><div class=\"fbox\"><span class=\"fl\">4</span><span class=\"ft\">Table</span></div></div>",init:"initState"},
{label:"Read It",eyebrow:"Step 4: Run your final evaluation",html:"<h2 class=\"title\">A Table Anyone Gets at a <span class=\"hl\">Glance</span></h2><p class=\"why\">A table like this is what slide 4 needs.<span class=\"nhost\"></span></p><div class=\"keyhost\" data-key=\"c16\" hidden></div><div class=\"tbl sm vz\"><table><thead><tr><th scope=\"col\">Metric</th><th scope=\"col\">Digital Docs</th><th scope=\"col\">Scanned Docs</th><th scope=\"col\">Overall</th></tr></thead><tbody><tr><td class=\"k\">Exact Match %</td><td>97%</td><td>89%</td><td>94%</td></tr><tr><td class=\"k\">Avg Response Time</td><td>3.2 sec</td><td>4.5 sec</td><td>3.8 sec</td></tr><tr><td class=\"k\">Retrieval Recall@5</td><td>95%</td><td>91%</td><td>93%</td></tr></tbody></table></div><p class=\"p\">This shows not just <i>how well</i> your pipeline did, but also <i>where it struggles</i>. A hiring manager, professor, or stakeholder will immediately get the picture. They will look at the table and realize:</p><div class=\"row\"><div class=\"nwrap\"><div class=\"sw\" role=\"group\" aria-label=\"Choose a row\"><button type=\"button\" data-v=\"0\" aria-pressed=\"false\">Exact Match %</button><button type=\"button\" data-v=\"1\" aria-pressed=\"false\">Response Time</button><button type=\"button\" data-v=\"2\" aria-pressed=\"false\">Recall@5</button></div></div></div><p class=\"cap vz under\"></p>",init:"initState"},
{label:"Recap",eyebrow:"Quick recap",html:"<h2 class=\"title\">Quick Recap: How to Evaluate Your <span class=\"hl\">Pipeline</span></h2><p class=\"why\">Use these five moves on your own chatbot.</p><div class=\"recap\"><div class=\"box\"><p class=\"bh\">1. Build a Test Set</p><p class=\"bp\">Collect a mix of digital + scanned docs, realistic in size and messiness.</p></div><div class=\"box\"><p class=\"bh\">2. Define Ground Truth</p><p class=\"bp\">Create the \"answer key\" for your documents (store it in JSON/CSV).</p></div><div class=\"box\"><p class=\"bh\">3. Pick Metrics</p><p class=\"bp\">Choose what matters most (accuracy, recall, speed, error rate).</p></div><div class=\"box\"><p class=\"bh\">4. Run Evaluation</p><p class=\"bp\">Feed in your test set, capture outputs, and compare them to ground truth.</p></div><div class=\"box\"><p class=\"bh\">5. Show Results Clearly</p><p class=\"bp\">Use a simple table to highlight strengths and weaknesses.</p></div></div>",init:null}];

  var i = 0;
  var app = $("app"), rail = $("rail"), stage = $("stage"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the cards. Scroll down to the next part of this reading.";

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }

  /* Spacing (from P3 module 9 and P4): spare height widens the gaps between blocks, up to 2x. */
  var GAP = 12;
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = GAP + "px"; inner.style.marginTop = "";
    var cs = getComputedStyle(stage);
    var avail = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (GAP + Math.min(GAP, spare / gaps)) + "px";
    /* Fix round 2 (as the Steps deck): what is still spare after the gaps widen is split above and below, so a short
       card sits in the middle of the stage instead of leaving one big empty area at the bottom */
    var left = avail - inner.offsetHeight;
    if (left > 1) inner.style.marginTop = Math.floor(left / 2) + "px";
  }

  CARDS.forEach(function (c, n) {
    if (typeof c.init === "string") c.init = INITS[c.init];
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + c.label);
    b.innerHTML = '<span class="seg"></span>';
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function titleOf(n) { var m = CARDS[n].html.match(/<h2[^>]*>(.*?)<\/h2>/); return m ? m[1].replace(/<[^>]+>/g, "") : ""; }

  function render(anim) {
    if (timer) { clearInterval(timer); timer = null; }
    var c = CARDS[i];
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.eyebrow + '</p>' + c.html + '</div>';
    each(rail.children, function (b, n) {
      b.classList.toggle("is-cur", n === i);
      b.classList.toggle("is-done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("where-count").textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + titleOf(i + 1) + "</b>";
    donemsg.textContent = "";
    if (c.init) c.init(card);
    space();
    each(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  function go(n) { if (n < 0 || n >= CARDS.length || n === i) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i === CARDS.length - 1) {
      donemsg.textContent = DONE_MSG;
      space();
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "extern-deck-done" }, "*");
      return;
    }
    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.closest && e.target.closest(".sw, .steps, .picks")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #card=N opens a card directly */
  var m = location.hash.match(/card=(\d+)/);
  if (m) { i = Math.min(CARDS.length - 1, Math.max(0, +m[1] - 1)); }
  window.addEventListener("resize", function () { fit(); });
  fit();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
</body>
</html>
