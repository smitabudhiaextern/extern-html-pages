:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;

  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);

<template id="t22">
<ul class="list"><li><b>Tesseract</b> gives every word its own box. Great for clean docs, but it doesn't keep the words of a line or a phrase together.</li><li><b>Layout-aware OCR</b> tools like PaddleOCR and EasyOCR keep the words that belong together in one box, so they know <i>where</i> text lives and <i>how</i> it's grouped into lines.</li><li><b>PaddleOCR</b> is powerful for complex pages; <b>EasyOCR</b> is fast and works well for forms.</li></ul>
</template>

<template id="t24">

<script>
(function () {
  "use strict";

  var GROUPS = ["Start", "Step 8", "Step 9", "Step 10", "Step 11", "Step 12", "Print", "Step 13", "Step 14", "End"];
  var SLIDES = [
    {"group": "Start", "label": "PART 2 &middot; GET READY", "title": "Keep Working in the <span class=\"hl\">Same Notebook</span>", "plain": "Keep Working in the Same Notebook", "tpl": "t1"},

    {"group": "Step 8", "label": "STEP 8 &middot; PART 2 OF 2: RUN IT", "title": "Install <span class=\"hl\">EasyOCR</span>", "plain": "Step 8. Install EasyOCR (Part 2 of 2)", "tpl": "t3"},
    {"group": "Step 9", "label": "STEP 9 &middot; RUN IT", "title": "Start <span class=\"hl\">EasyOCR</span>", "plain": "Step 9. Start EasyOCR", "tpl": "t4"},
    {"group": "Step 9", "label": "STEP 8 AND STEP 9 &middot; SEE IT", "title": "Check That EasyOCR Is <span class=\"hl\">Ready</span>", "plain": "Steps 8 and 9. Check That EasyOCR Is Ready", "tpl": "t5", "where": "Steps 8 and 9"},
    {"group": "Step 10", "label": "STEP 10 &middot; PART 1 OF 2: RUN IT", "title": "Let EasyOCR Read the <span class=\"hl\">Same Picture</span>", "plain": "Step 10. Let EasyOCR Read the Same Picture", "tpl": "t6"},
    {"group": "Step 10", "label": "STEP 10 &middot; PART 2 OF 2: SEE IT", "title": "See How Many Regions <span class=\"hl\">EasyOCR Found</span>", "plain": "Step 10. See How Many Regions EasyOCR Found (Part 2 of 2)", "tpl": "t7"},
    {"group": "Step 11", "label": "STEP 11 &middot; PART 1 OF 2: RUN IT", "title": "Look at What EasyOCR <span class=\"hl\">Found</span>", "plain": "Step 11. Look at What EasyOCR Found", "tpl": "t8"},
    {"group": "Step 11", "label": "STEP 11 &middot; PART 2 OF 2: SEE IT", "title": "See EasyOCR's <span class=\"hl\">First 15</span> Results", "plain": "Step 11. See EasyOCR's First 15 Results (Part 2 of 2)", "tpl": "t9"},
    {"group": "Step 12", "label": "STEP 12 &middot; PART 1 OF 4: READ THE TOP", "title": "Draw EasyOCR's <span class=\"hl\">Boxes</span>", "plain": "Step 12. Draw EasyOCR's Boxes", "tpl": "t10"},
    {"group": "Step 12", "label": "STEP 12 &middot; PART 2 OF 4: RUN IT", "title": "Run EasyOCR's <span class=\"hl\">Drawing Cell</span>", "plain": "Step 12. Run EasyOCR's Drawing Cell (Part 2 of 4)", "tpl": "t11"},
    {"group": "Step 12", "label": "STEP 12 &middot; PART 3 OF 4: SEE IT", "title": "See EasyOCR's <span class=\"hl\">Rectangles</span>", "plain": "Step 12. See EasyOCR's Rectangles (Part 3 of 4)", "tpl": "t12", "cls": "pair-slide"},
    {"group": "Step 12", "label": "STEP 12 &middot; PART 4 OF 4: COMPARE", "title": "<span class=\"hl\">Compare</span> EasyOCR's Results with PaddleOCR's", "plain": "Step 12. Compare EasyOCR's Results with PaddleOCR's (Part 4 of 4)", "tpl": "t13", "cls": "pair-slide"},
    {"group": "Print", "label": "PRINT THE TEXT &middot; ADD A CELL", "title": "Print the <span class=\"hl\">Text</span> EasyOCR Read, in a Cell of Your Own", "plain": "Print the Text EasyOCR Read, in a Cell of Your Own", "tpl": "t14", "where": "Print the Text"},
    {"group": "Print", "label": "PRINT THE TEXT &middot; SEE IT", "title": "See the <span class=\"hl\">Text</span> EasyOCR Read", "plain": "See the Text EasyOCR Read", "tpl": "t15", "where": "Print the Text"},
    {"group": "Print", "label": "PRINT THE TEXT &middot; ADD ANOTHER CELL", "title": "Print All of <span class=\"hl\">PaddleOCR's Text</span>, in Another Cell", "plain": "Print All of PaddleOCR's Text, in Another Cell", "tpl": "t16", "where": "Print the Text"},
    {"group": "Step 13", "label": "STEP 13 &middot; PART 1 OF 2: READ THE TOP", "title": "Compare the Two Engines' <span class=\"hl\">Numbers</span>", "plain": "Step 13. Compare the Two Engines' Numbers", "tpl": "t17"},
    {"group": "Step 13", "label": "STEP 13 &middot; PART 2 OF 2: RUN IT", "title": "Run the <span class=\"hl\">Comparison</span> Cell", "plain": "Step 13. Run the Comparison Cell (Part 2 of 2)", "tpl": "t18"},
    {"group": "Step 14", "label": "STEP 14 &middot; PART 1 OF 2: READ THE TOP", "title": "Check Which <span class=\"hl\">Key Terms</span> Each Engine Found", "plain": "Step 14. Check Which Key Terms Each Engine Found", "tpl": "t19"},
    {"group": "Step 14", "label": "STEP 14 &middot; PART 2 OF 2: RUN IT", "title": "Run the <span class=\"hl\">Key Terms</span> Cell", "plain": "Step 14. Run the Key Terms Cell (Part 2 of 2)", "tpl": "t20"},
    {"group": "Step 14", "label": "STEP 13 AND STEP 14 &middot; SEE IT", "title": "See the Two Engines <span class=\"hl\">Side by Side</span>", "plain": "Steps 13 and 14. See the Two Engines Side by Side", "tpl": "t21", "where": "Steps 13 and 14"},
    {"group": "End", "label": "QUICK RECAP &middot; 1 OF 3", "title": "Quick Recap: Two Engines That Read <span class=\"hl\">Lines</span>", "plain": "Quick Recap: Two Engines That Read Lines", "tpl": "t22", "where": "Quick Recap", "cls": "recap-slide"},
    {"group": "End", "label": "QUICK RECAP &middot; 2 OF 3", "title": "Quick Recap: <span class=\"hl\">PaddleOCR</span>", "plain": "Quick Recap: PaddleOCR", "tpl": "t23", "where": "Quick Recap", "cls": "recap-slide"},
    {"group": "End", "label": "QUICK RECAP &middot; 3 OF 3", "title": "Quick Recap: <span class=\"hl\">EasyOCR</span>", "plain": "Quick Recap: EasyOCR", "tpl": "t24", "where": "Quick Recap", "cls": "recap-slide"}
  ];
  var STAGE = { wide: [760, 1035], narrow: [420, 1228] };
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of this reading.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var sz = narrow ? STAGE.narrow : STAGE.wide;
    app.style.width = sz[0] + "px"; app.style.height = sz[1] + "px";
    var k = Math.min(window.innerWidth / sz[0], window.innerHeight / sz[1]);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  var GROUP_LABEL = { "Print": "Print" };
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    var isStep = g.name.indexOf("Step ") === 0;
    b.type = "button"; b.className = "pg" + (isStep ? "" : " pg-fit");
    var shown = GROUP_LABEL[g.name] || g.name;
    b.setAttribute("aria-label", (g.name === "Print" ? "Print the Text" : shown) + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    var word = isStep ? '<span class="pg-word">Step </span>' + g.name.replace("Step ", "") : shown;
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + word + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span"), orig = label.textContent;
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = orig; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner' + (s.cls ? " " + s.cls : "") + '"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + document.getElementById(s.tpl).innerHTML + '</div>';
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(CELLS[b.getAttribute("data-copy")], b, pre); });
    });
    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.where || s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
    space();
    Array.prototype.forEach.call(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a slide. Spare height widens the gaps
     between blocks, up to 2x. */
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = "";
    var cs = getComputedStyle(card);
    var avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var base = parseFloat(getComputedStyle(inner).rowGap) || 14;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (base + Math.min(base, spare / gaps)) + "px";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    space();
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #slide=N opens slide N directly */
  var hm = location.hash.match(/slide=(\d+)/);
  if (hm) i = Math.min(SLIDES.length - 1, Math.max(0, +hm[1] - 1));
  window.addEventListener("resize", function () { scaleStage(); space(); });
  scaleStage();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
