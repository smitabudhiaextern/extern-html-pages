<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P1 Task Steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap">
<style>
/* Structure: the locked Task deck (templates/task-page/pfizer3-task-p5-steps.html).
   Look: Pfizer x Extern Core, Light format. Every colour, size, radius and font below comes from design-system/tokens.json.
   Built for a fixed-height Notion embed (see the end of this style block). */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--surface);overflow-x:hidden}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{display:flex;flex-direction:column}

/* Header: section rail and "Slide X of N" */
.top{border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr);row-gap:9px}
.where{display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}
@media (min-width:640px){
  .top{grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
  .where{order:2}
}

/* Stage and slide */
.stage{background:var(--gray-50);padding:12px 16px;display:flex}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:clamp(18px, 3vw, 32px) clamp(16px, 3.4vw, 36px);display:flex;flex-direction:column}
.inner{display:flex;flex-direction:column;gap:var(--space-3);width:100%;max-width:900px;margin:auto}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:clamp(26px, 1.4vw + 19px, 32px);line-height:1.18;color:var(--ink);text-wrap:balance}
.hl{color:var(--highlight)}
.p{margin:0;font-size:clamp(15px, 0.4vw + 13px, 16.5px);line-height:1.6;color:var(--ink);text-wrap:pretty}
.p b,.tile b,.note b{font-weight:600}
.mark{display:inline-block;margin-left:4px;padding:0 8px;border-radius:var(--radius-full);border:1px solid var(--line);background:var(--surface);color:var(--gray-600);font-size:12px;font-weight:600;line-height:20px;white-space:nowrap;vertical-align:1px}

/* Buttons (design system Button, Light) */
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* Notes and tiles, on surface-card */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);background:var(--surface-card);color:var(--card-text);font-size:14.5px;line-height:1.55}
.note svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){ .tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))} .tiles.t2{grid-template-columns:repeat(2,minmax(0,1fr))} }
.tile{background:var(--surface-card);border-radius:var(--radius-md);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .loc{font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.tile .tt{margin:0;font-size:18px;line-height:24px;font-weight:600;color:var(--card-title)}
.tile p{margin:0;font-size:14.5px;line-height:1.55;color:var(--card-text)}

/* Reading an 8-digit date */
.split{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.part{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;border-radius:var(--radius-sm);background:var(--surface-card);min-width:72px}
.part b{font-size:22px;line-height:26px;font-weight:600;color:var(--card-title);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.part span{font-size:12.5px;line-height:16px;color:var(--card-text)}
.split .eq{display:flex;align-items:center;font-size:16px;font-weight:600;padding:0 4px}
.split .res{display:flex;align-items:center;padding:10px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--ink);font-weight:600;font-size:16px}

/* Date or not: the student's guess */
.quiz{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.q{border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;display:grid;gap:10px}
.q-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.q-text{font-size:15px;line-height:1.45;min-width:0}
.q-text span{color:var(--gray-600)}
.q-text b{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.q-btns{display:flex;gap:8px;flex-wrap:wrap}
.q-btns .btn{padding:8px 14px;font-size:14px}
.q-btns .btn[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.q-fb{margin:0;font-size:14.5px;line-height:1.55;color:var(--card-text);background:var(--surface-card);border-radius:var(--radius-sm);padding:10px 12px}
.q-fb b{font-weight:600;color:var(--card-title)}

/* Notes table and worked example */
.tbl-wrap{border:1px solid var(--line);border-radius:var(--radius-sm);overflow-x:auto}
.tbl-wrap table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.45}
.tbl-wrap th{text-align:left;font-weight:600;color:var(--ink-muted);background:var(--gray-50);padding:8px 12px;border-bottom:1px solid var(--line)}
.tbl-wrap td{padding:9px 12px;vertical-align:top}
.tbl-wrap td.blank{color:var(--gray-600)}
.tbl-wrap tr+tr td{border-top:1px solid var(--line)}
@media (max-width:559.98px){
  .tbl-wrap thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tbl-wrap tr{display:block;padding:10px 12px}
  .tbl-wrap td{display:block;padding:0}
  .tbl-wrap td+td{margin-top:4px}
  .tbl-wrap td::before{content:attr(data-h) ": ";font-weight:600;color:var(--ink-muted)}
}
.work{border:1.5px solid var(--ink);border-radius:var(--radius-md);padding:14px 16px}
.work h3{margin:0 0 8px;font-size:15px;line-height:1.4;font-weight:600}
.work ol{margin:0;padding-left:22px;display:grid;gap:6px;font-size:15px;line-height:1.55}
.answers{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:a}
.answers li{background:var(--surface-card);border-radius:var(--radius-md);padding:12px 16px 12px 52px;position:relative;color:var(--card-text);font-size:14.5px;line-height:1.55}
.answers li::before{counter-increment:a;content:"0" counter(a);position:absolute;left:16px;top:13px;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.answers li b{display:block;color:var(--card-title);font-size:15.5px;font-weight:600;margin-bottom:2px}

/* Foot */
.foot{border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.foot .btn{padding:10px 16px;font-size:14px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (max-width:620px){ .upnext{visibility:hidden} }
@media (max-width:480px){ #next.end{white-space:normal;text-align:center;flex:1 1 auto;min-width:0} .upnext{display:none} .foot{justify-content:space-between} }
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
/* Fixed-height embed. Notion sets the frame height by hand and ignores postMessage, so the deck fills
   whatever height it gets: the rail and Back and Next stay in view, and only the slide body scrolls when it is taller. */
html,body{height:100%;overflow:hidden}
.app{height:100%}
.top,.foot,.donemsg{flex:none}
.stage{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.stage:focus-visible{outline-offset:-3px}
.donemsg{margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:14.5px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{padding:0;border:0}
/* A soft fade at the bottom of the slide area while there is more to scroll */
.stage.more::after{content:"";position:sticky;bottom:0;flex:none;display:block;height:36px;margin-top:-36px;background:linear-gradient(to top, var(--surface), transparent);pointer-events:none}
</style>
</head>
<body>
<div class="app" id="app">
  <h1 class="sr-only">Inside a Supplier File: The Steps</h1>
  <header class="top">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <div class="where"><b id="where-section">Open</b><span aria-hidden="true">&middot;</span><span id="where-count">Slide 1 of 8</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Slide"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-secondary" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-primary" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var INFO = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.25" stroke="currentColor" stroke-width="1.5"/><path d="M10 9v4.5M10 6.5v.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  var IC_OPEN = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  var FILE = "https://drive.google.com/file/d/1oOR50D8F3Deask7aT2HbXQZhw0u1hvcg/view";
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function note(t) { return '<div class="note">' + INFO + '<span>' + t + '</span></div>'; }
  function tile(loc, title, text) { return '<div class="tile"><span class="loc">' + loc + '</span><p class="tt">' + title + '</p><p>' + text + '</p></div>'; }

  /* The worked example uses the student's real date, so the age is always right on the day they do the task. */
  function workedExample() {
    var t = new Date(), ty = t.getFullYear(), tm = t.getMonth() + 1, td = t.getDate();
    var y = 2021, m = 1, d = 26;
    var total = (ty - y) * 12 + (tm - m) - (td < d ? 1 : 0);
    var yrs = Math.floor(total / 12), mos = total % 12;
    var passed = tm > m || (tm === m && td >= d);
    var today = td + " " + MONTHS[tm - 1] + " " + ty;
    return '<div class="work"><h3>Worked Example: The Certificate on Page 2</h3><ol>' +
      '<li>Its date of manufacture is 20210126, which is 26 January 2021.</li>' +
      '<li>Today is ' + today + '. ' + ty + ' minus 2021 is ' + (ty - y) + '.</li>' +
      '<li>Has 26 January come yet this year? ' + (passed ? 'Yes, so keep ' + (ty - y) + '.' : 'Not yet, so take away 1. That gives ' + yrs + '.') + '</li>' +
      '<li>So this certificate is <b>' + yrs + ' years old</b> (' + yrs + ' years and ' + mos + (mos === 1 ? ' month' : ' months') + '). Its expiration date, 26 January 2023, has passed too.</li>' +
      '</ol></div>';
  }

  var QUIZ = [
    { label: "Lot Number:", val: "17242818", page: "page 2", date: false,
      why: "It's labelled <b>Lot Number</b>, so it's the batch's ID. Read as a date, its month would be 28, and no month is number 28." },
    { label: "Expiration Date:", val: "20230126", page: "page 2", date: true,
      why: "The label says it's a date, and it reads as year 2023, month 01, day 26. That's <b>26 January 2023</b>." },
    { label: "", val: "29190939 Rev AD", page: "bottom of page 2", date: false,
      why: "This is the document's own ID number. <b>Rev</b> is short for revision, which means a new version of a document, and the letters AD name the version. Read as a date, its day would be 39, which doesn't exist." },
    { label: "Date of Manufacture:", val: "20240315", page: "page 3", date: true,
      why: "The label says it's a date, and it reads as year 2024, month 03, day 15. That's <b>15 March 2024</b>." },
    { label: "Part Number:", val: "29184612", page: "the table on page 1", date: false,
      why: "It's a <b>part number</b>, the ID a supplier gives a product so you can order it. Read as a date, its month would be 46." }
  ];
  var guess = {};
  function quizHTML() {
    return '<ul class="quiz">' + QUIZ.map(function (q, n) {
      var g = guess[n], fb = "";
      if (g !== undefined) fb = '<p class="q-fb">' + (g === q.date ? '<b>You got it.</b> ' : '<b>Not quite.</b> ') + q.why + '</p>';
      return '<li class="q"><div class="q-row"><span class="q-text">' + (q.label ? q.label + ' ' : '') + '<b>' + q.val + '</b> <span>(' + q.page + ')</span></span>' +
        '<span class="q-btns" role="group" aria-label="Is ' + q.val + ' a date?">' +
        '<button type="button" class="btn btn-secondary" data-q="' + n + '" data-a="1" aria-pressed="' + (g === true) + '">Date</button>' +
        '<button type="button" class="btn btn-secondary" data-q="' + n + '" data-a="0" aria-pressed="' + (g === false) + '">Not a date</button></span></div>' + fb + '</li>';
    }).join("") + '</ul>';
  }

  var GROUPS = ["Open", "Read", "Dates", "Age", "Answer"];
  var SLIDES = [
    { group: "Open", title: 'Open the <span class="hl">File</span> and Count Its Pages', plain: "Open the File and Count Its Pages",
      body: function () { return '<p class="p">In this Task, you\'ll look inside a real supplier file, the same way a quality team at a drug company does. Open the Cytiva file below. It opens in a new tab, so these steps stay right here. Scroll from the top to the bottom and count the pages as you go.</p>' +
        '<div class="links"><a class="btn btn-secondary" href="' + FILE + '" target="_blank" rel="noopener noreferrer">' + IC_OPEN + '<span>Open the Cytiva File</span><span class="sr-only"> (opens in a new tab)</span></a></div>' +
        note('Before you go on, make a guess: how many separate documents do you think are inside this one PDF? Keep your guess in mind. You\'ll check it on slide 3.') +
        note('If Drive asks you to request access, look in <b>If You\'re Stuck</b>, just under these slides.'); } },

    { group: "Read", title: 'What a <span class="hl">Supplier</span> File Is', plain: "What a Supplier File Is",
      body: function () { return '<p class="p">A drug company like Pfizer doesn\'t make every part it uses. It buys many of them from other companies. A company that sells parts or materials to another company is called a <b>supplier</b>, also called a <b>vendor</b>. Both words mean the same thing, and you\'ll see both in this externship.</p>' +
        '<p class="p">Before a part can be used to make medicine, the supplier has to send papers that prove the part is safe and was made the right way. Suppliers often bundle many of these papers into one PDF. That bundle is called a <b>supplier file</b>.</p>' +
        '<div class="tiles t3">' +
        tile("THE SUPPLIER", "Cytiva", "The company that sent this file. It makes equipment that drug makers use in their labs and factories.") +
        tile("THE PRODUCT", "Flow Kits", "Sets of tubes and connectors that liquid flows through inside a lab machine.") +
        tile("YOUR JOB TODAY", "Read Like a Checker", "Find each document, each date, and how old each document is.") +
        '</div>'; } },

    { group: "Read", title: 'Find Where Each <span class="hl">Document</span> Starts', plain: "Find Where Each Document Starts",
      body: function () { return '<p class="p">Here\'s the first surprise. Your 3 pages hold 3 separate documents, one on each page. Was that your guess? Let\'s look at what each one is, so you can name its type.</p>' +
        '<div class="tiles t3">' +
        tile("PAGE 1", "A Letter", "A letter from the supplier about how to store its flow kits. It starts with a date and the word “Re:”, which means “about”.") +
        tile("PAGE 2", "Certificate of Quality", "A paper the supplier writes for one batch of a product, saying the batch passed its checks. This one is for lot 17242818.") +
        tile("PAGE 3", "Certificate of Quality", "A second certificate, for a different product and a different batch: lot 18356721.") +
        '</div>' +
        note('A <b>lot</b> is one batch of a product made at the same time. Its <b>lot number</b> is that batch\'s ID, so if something goes wrong, the supplier can find every item from the same batch.') +
        note('Here\'s how to spot where a new document starts. Page 1 says “Page 1 / 1”, so the letter is only one page long. Page 3 says “Page 1 of 1” again, so it\'s a document of its own. Each new document also starts with its own title, like “Certificate of Quality”.'); } },

    { group: "Dates", title: 'Know the Four Kinds of <span class="hl">Date</span>', plain: "Know the Four Kinds of Date",
      body: function () { return '<p class="p">Not every date means the same thing. Before you write any down, here are the four kinds of date you\'ll find in this file, and what each one tells you.</p>' +
        '<div class="tiles t2">' +
        tile("PAGE 1", "Letter Date", "The day the letter was written. It sits at the top of the letter with no label next to it, so it\'s easy to miss.") +
        tile("PAGES 2 AND 3", "Date of Manufacture", "The day the batch was made. Manufacture means making something, usually in a factory.") +
        tile("PAGES 2 AND 3", "Expiration Date", "The last day the batch should be used. Once that day has passed, the batch has expired.") +
        tile("PAGES 1 AND 2", "Approval Date", "A stamp printed sideways along the left edge of the page that includes the words “Approved On”. It shows when the document was approved, not when it was written. The long code at its start, 090177e19abdfceb, is an ID, not a date.") +
        '</div>'; } },

    { group: "Dates", title: 'Spot the Numbers That Only Look Like <span class="hl">Dates</span>', plain: "Spot the Numbers That Only Look Like Dates",
      body: function () { return '<p class="p">Many dates in this file are written as 8 digits with no gaps, like 20210126. Read them in three parts: the first 4 digits are the year, the next 2 are the month, and the last 2 are the day.</p>' +
        '<div class="split" aria-label="20210126 reads as year 2021, month 01, day 26, which is 26 January 2021">' +
        '<div class="part"><b>2021</b><span>year</span></div><div class="part"><b>01</b><span>month</span></div><div class="part"><b>26</b><span>day</span></div>' +
        '<span class="eq" aria-hidden="true">=</span><span class="res">26 January 2021</span></div>' +
        '<p class="p">But the file also has other 8-digit numbers that aren\'t dates at all. An 8-digit number is a date only when its label says it\'s a date and its parts make sense: a month from 01 to 12 and a day from 01 to 31. Make your guess for each number below.</p>' +
        quizHTML(); } },

    { group: "Dates", title: 'Find Every Date and Its <span class="hl">Format</span>', plain: "Find Every Date and Its Format",
      body: function () { return '<p class="p">Now it\'s your turn. Go through the file page by page and write down every date you find. For each one, note the page it\'s on, its kind (from slide 4) and its format.</p>' +
        '<p class="p">A date\'s <b>format</b> is the way it\'s written: the order of the day, month and year, whether the month is a word or a number, and what sits between the parts. For example, 20210126 is written as year, month and day in 8 digits with no gaps. People often write that format as YYYYMMDD.</p>' +
        '<div class="tbl-wrap"><table><thead><tr><th scope="col">Page</th><th scope="col">Date as written</th><th scope="col">Kind</th><th scope="col">Format</th></tr></thead><tbody>' +
        '<tr><td data-h="Page">2</td><td data-h="Date as written">20210126</td><td data-h="Kind">Date of manufacture</td><td data-h="Format">Year, month, day in 8 digits (YYYYMMDD)</td></tr>' +
        '<tr><td data-h="Page" class="blank">Your turn</td><td data-h="Date as written" class="blank">...</td><td data-h="Kind" class="blank">...</td><td data-h="Format" class="blank">...</td></tr>' +
        '</tbody></table></div>' +
        note('Check yourself: this file has <b>7 dates</b>, written in <b>3 different formats</b>. If you have fewer, look just under the address on page 1, then tilt your head and read the left edge of pages 1 and 2.'); } },

    { group: "Age", title: 'Work Out Each Document’s <span class="hl">Age</span>', plain: "Work Out Each Document’s Age",
      body: function () { return '<p class="p">A document\'s <b>age</b> is how long ago it was written or made. Use one date per document: the letter date for the letter, and the date of manufacture for each certificate. The expiration date tells you whether the batch can still be used, and the approval stamp tells you when someone approved the document, so neither of those sets the age.</p>' +
        workedExample() +
        '<p class="p">Now do the same for the other two documents. Then list every document that is more than 3 years old, with its age. Teams check documents again every 3 to 4 years, so anything past 3 years gets flagged.<span class="mark">Ask Chaitanya to review</span></p>' +
        note('An expired certificate is one more reason the paper needs checking.'); } },

    { group: "Answer", title: 'Write Your Four <span class="hl">Answers</span>', plain: "Write Your Four Answers",
      body: function () { return '<p class="p">You\'ve done the hard part. Now write your four answers. Write them in any notes app first, then paste each one into its own box under <b>Submit Your Work</b>, below these slides.</p>' +
        '<ol class="answers">' +
        '<li><b>The Document Types You Found</b>Name each document and the page it\'s on.</li>' +
        '<li><b>Every Date and Every Date Format You Found</b>List every date with the page, kind and format of each, then name the formats.</li>' +
        '<li><b>Documents More Than 3 Years Old</b>Name each one, the date you used, and how old it is on the day you submit.</li>' +
        '<li><b>At Least 2 Challenges for AI</b>Think about what tripped you up today. Which numbers fooled you? Which date was hard to see? How would a computer know where one document ends? Tie each challenge to something in this file.</li>' +
        '</ol>' +
        (standalone ? '<div id="standalone-msg" hidden>' + note('You opened these slides in their own tab. Go back to the Task page tab and paste your answers into the boxes under <b>Submit Your Work</b>.') + '</div>' : ''); } }
  ];
  var END_LABEL = "Done. Now submit your answers.";
  var standalone = !(window.parent && window.parent !== window);

  var i = 0, lastH = 0;
  var $ = function (id) { return document.getElementById(id); };
  var rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext");

  /* Fixed-height embed helpers. Notion ignores postMessage, so nothing below depends on the page around the deck. */
  var stage = $("stage"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the slides. Scroll down to Submit Your Work.";
  /* Scrolls only the slide area, never the page around the embed, so a reveal or message comes into view. */
  function keepInView(el) {
    var s = stage.getBoundingClientRect(), b = el.getBoundingClientRect();
    if (b.bottom > s.bottom) stage.scrollTop += Math.max(0, Math.min(b.bottom - s.bottom + 44, b.top - s.top - 12));
    else if (b.top < s.top) stage.scrollTop -= s.top - b.top + 12;
  }
  /* The slide area takes keyboard focus only when it has something to scroll. */
  function scrollCheck() {
    if (stage.scrollHeight > stage.clientHeight + 1) stage.setAttribute("tabindex", "0"); else stage.removeAttribute("tabindex");
    moreCheck();
  }
  function moreCheck() { stage.classList.toggle("more", stage.scrollTop + stage.clientHeight < stage.scrollHeight - 4); }
  stage.addEventListener("scroll", moreCheck, { passive: true });
  /* The full height the current slide needs, so a page that does listen to postMessage can still fit it. */
  function natural() {
    var inner = card.firstElementChild, cs = getComputedStyle(stage), cc = getComputedStyle(card), f = parseFloat;
    return Math.ceil($("app").offsetHeight - stage.offsetHeight + f(cs.paddingTop) + f(cs.paddingBottom) +
      f(cc.paddingTop) + f(cc.paddingBottom) + f(cc.borderTopWidth) + f(cc.borderBottomWidth) + (inner ? inner.offsetHeight : 0));
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", g.name + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + g.name + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner"><p class="step">' + (n < 9 ? "0" : "") + (n + 1) + '</p><h2 class="title">' + s.title + '</h2>' + s.body() + '</div>';
  }

  function render(anim, nav, focusSel) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-q]"), function (b) {
      b.addEventListener("click", function () {
        var q = b.getAttribute("data-q"), a = b.getAttribute("data-a");
        guess[q] = a === "1";
        render(false, false, '[data-q="' + q + '"][data-a="' + a + '"]');
        var li = card.querySelectorAll(".q")[q]; if (li) keepInView(li);
      });
    });
    if (focusSel) { var f = card.querySelector(focusSel); if (f) f.focus({ preventScroll: true }); }

    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
    if (nav) stage.scrollTop = 0;
    scrollCheck();
    postHeight(nav);
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true, true); }
  /* Works on its own: the message shows in the deck. The postMessage is kept for pages that listen, but nothing needs it. */
  function finish() {
    if (!standalone) { donemsg.textContent = DONE_MSG; scrollCheck(); tellParent({ type: "extern-deck-submit" }); postHeight(false); return; }
    var m = $("standalone-msg"); if (m) { m.hidden = false; scrollCheck(); keepInView(m); postHeight(false); }
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  /* Left and Right arrow keys move between slides */
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  function tellParent(msg) { if (!standalone) window.parent.postMessage(msg, "*"); }
  function postHeight(nav) {
    var h = natural();
    if (nav || h !== lastH) { lastH = h; tellParent({ type: "extern-deck-height", height: h, nav: !!nav }); }
  }
  function fit() { scrollCheck(); postHeight(false); }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(card);
  var t;
  window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(fit, 120); });

  render(false);
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener("load", fit);
})();
</script>
</body>
</html>
