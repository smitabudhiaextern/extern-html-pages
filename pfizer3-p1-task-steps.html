<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P1 Task Steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap">
<style>
/* Structure: the locked Task deck (templates/task-page/pfizer3-task-p5-steps.html).
   Look: Pfizer x Extern Core, Light format. Every colour, size, radius and font below comes from design-system/tokens.json.
   Fixed stage: the whole deck is laid out on one 760 x 790 design stage that scales as a single piece to fit
   the embed frame, so nothing ever scrolls and Back and Next sit in the same place on every slide. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* The design stage: 760 x 790, scaled and centred by the script at the end */
.app{position:absolute;left:50%;top:50%;width:760px;height:790px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: section rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:13px;font-weight:500;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Slide area and slide */
.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}
.inner{display:flex;flex-direction:column;gap:var(--space-3);width:100%}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding-bottom:3px;color:var(--ink);text-wrap:balance}
.hl{color:var(--highlight)}
.p{margin:0;font-size:15px;line-height:22px;color:var(--ink);text-wrap:pretty}
.p b,.tile b,.note b{font-weight:600}

/* Buttons (design system Button, Light) */
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* Notes and tiles, on surface-card */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);background:var(--surface-card);color:var(--card-text);font-size:15px;line-height:22px}
.note svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--ink)}
.tiles{display:grid;gap:10px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.t2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--surface-card);border-radius:var(--radius-md);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .loc{font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.tile .tt{margin:0;font-size:21px;line-height:26px;font-weight:600;color:var(--card-title)}
.tile p{margin:0;font-size:15px;line-height:22px;color:var(--card-text)}

/* Reading an 8-digit date */
.split{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.part{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;border-radius:var(--radius-sm);background:var(--surface-card);min-width:72px}
.part b{font-size:21px;line-height:26px;font-weight:600;color:var(--card-title);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.part span{font-size:13px;line-height:16px;color:var(--card-text)}
.split .eq{display:flex;align-items:center;font-size:15px;font-weight:600;padding:0 4px}
.split .res{display:flex;align-items:center;padding:10px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--ink);font-weight:600;font-size:15px}

/* Date or not: the student's guess */
.quiz{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.q{border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;display:grid;gap:10px}
.q-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.q-text{font-size:15px;line-height:22px;min-width:0}
.q-text span{color:var(--gray-600)}
.q-text b{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.q-btns{display:flex;gap:8px;flex-wrap:wrap}
.q-btns .btn{padding:8px 14px;font-size:15px}
.q-btns .btn[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.q-fb{margin:0;font-size:15px;line-height:22px;color:var(--card-text);background:var(--surface-card);border-radius:var(--radius-sm);padding:10px 12px}
.q-fb b{font-weight:600;color:var(--card-title)}

/* Notes table and worked example */
.tbl-wrap{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.tbl-wrap table{width:100%;border-collapse:collapse;font-size:15px;line-height:22px}
.tbl-wrap th{text-align:left;font-weight:600;color:var(--ink-muted);background:var(--gray-50);padding:8px 12px;border-bottom:1px solid var(--line)}
.tbl-wrap td{padding:9px 12px;vertical-align:top}
.tbl-wrap td.blank{color:var(--gray-600)}
.tbl-wrap tr+tr td{border-top:1px solid var(--line)}
.work{border:1.5px solid var(--ink);border-radius:var(--radius-md);padding:14px 16px}
.work h3{margin:0 0 8px;font-size:15px;line-height:22px;font-weight:600}
.work ol{margin:0;padding-left:22px;display:grid;gap:6px;font-size:15px;line-height:22px}
.answers{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:a}
.answers li{background:var(--surface-card);border-radius:var(--radius-md);padding:12px 16px 12px 52px;position:relative;color:var(--card-text);font-size:15px;line-height:22px}
.answers li::before{counter-increment:a;content:"0" counter(a);position:absolute;left:16px;top:15px;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.answers li b{display:block;color:var(--card-title);font-size:15px;font-weight:600;margin-bottom:2px}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:22px;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.foot .btn{padding:10px 16px;font-size:15px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }

/* Added for the West walk-through: compact tiles, a checklist and a tighter table */
.tiles.t2.compact .tile{padding:12px 14px;gap:4px}
.tile .ts{margin:0;font-size:15px;line-height:22px;font-weight:600;color:var(--card-title)}
.tile .ex{font-variant-numeric:tabular-nums;font-weight:600;color:var(--card-title)}
.tbl-wrap.tight td{padding:6px 12px}
.tbl-wrap.tight th{padding:6px 12px}
.tbl-wrap td.nw{white-space:nowrap}
.tbl-wrap td b{font-weight:600}
.checks{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.checks li{position:relative;padding-left:30px;font-size:15px;line-height:22px;color:var(--ink)}
.checks li::before{content:"";position:absolute;left:0;top:2px;width:18px;height:18px;border:1.5px solid var(--ink);border-radius:5px;background:var(--surface)}
.part-tag{display:inline-flex;align-self:flex-start;padding:4px 10px;border-radius:var(--radius-full);background:var(--surface-card);font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.extra{border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.extra p{margin:0;font-size:15px;line-height:22px;flex:1 1 320px;min-width:0}
.extra .btn{padding:10px 16px}
.answers.one li{padding:10px 16px 10px 52px}
.answers.one li::before{top:13px}
.answers.one li b{display:inline;margin:0}
</style>
</head>
<body>
<div class="app" id="app">
  <h1 class="sr-only">Inside a Supplier File: The Steps</h1>
  <header class="top">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <div class="where"><b id="where-section">See It Done</b><span aria-hidden="true">&middot;</span><span id="where-count">Slide 1 of 13</span></div>
  </header>
  <main class="stage" aria-label="Slide"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-secondary" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-primary" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var INFO = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.25" stroke="currentColor" stroke-width="1.5"/><path d="M10 9v4.5M10 6.5v.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  var IC_OPEN = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  var WEST = "https://drive.google.com/file/d/1sNQoYJ9oN6yQOXuCIdI6cRq9HLqnyT0g/view";
  var CYTIVA = "https://drive.google.com/file/d/1oOR50D8F3Deask7aT2HbXQZhw0u1hvcg/view";
  var PRACTICE = "https://drive.google.com/file/d/1agecqut7g7v5nGi8PWBjzOCUAoWwMlVx/view";
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function note(t) { return '<div class="note">' + INFO + '<span>' + t + '</span></div>'; }
  function tile(loc, title, text) { return '<div class="tile"><span class="loc">' + loc + '</span><p class="tt">' + title + '</p><p>' + text + '</p></div>'; }
  function stile(loc, title, text) { return '<div class="tile"><span class="loc">' + loc + '</span><p class="ts">' + title + '</p><p>' + text + '</p></div>'; }
  function openBtn(url, label) { return '<a class="btn btn-secondary" href="' + url + '" target="_blank" rel="noopener noreferrer">' + IC_OPEN + '<span>' + label + '</span><span class="sr-only"> (opens in a new tab)</span></a>'; }
  function checks(items) { return '<ul class="checks">' + items.map(function (t) { return '<li>' + t + '</li>'; }).join("") + '</ul>'; }
  function table(head, rows, cls) {
    return '<div class="tbl-wrap' + (cls ? ' ' + cls : '') + '"><table><thead><tr>' + head.map(function (h) { return '<th scope="col">' + h + '</th>'; }).join("") + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c, k) { return '<td' + (k < 2 && head.length === 3 && head[1] !== 'As written' ? ' class="nw"' : (k === 0 ? ' class="nw"' : '')) + '>' + c + '</td>'; }).join("") + '</tr>'; }).join("") + '</tbody></table></div>';
  }

  /* Ages use the student's real date, so they are right on the day they do the task. */
  var T = new Date(), TY = T.getFullYear(), TM = T.getMonth() + 1, TD = T.getDate();
  function hasCome(m, d) { return TM > m || (TM === m && TD >= d); }
  function age(y, m, d) { return TY - y - (hasCome(m, d) ? 0 : 1); }
  function moreThan3(y, m, d) { return TY - y > 3 || (TY - y === 3 && (TM > m || (TM === m && TD > d))); }
  function yrs(n) { return n + (n === 1 ? " year" : " years"); }
  function ageCell(y, m, d) { return yrs(age(y, m, d)) + ' &middot; <b>' + (moreThan3(y, m, d) ? 'Yes' : 'No') + '</b>'; }

  function workedExample() {
    var y = 2009, m = 11, d = 23, a = age(y, m, d);
    var today = TD + " " + MONTHS[TM - 1] + " " + TY;
    return '<div class="work"><h3>Worked Example: The Technical Support Bulletin, Pages 24 to 26</h3><ol>' +
      '<li>Its issue date is 23 November 2009, the day it was put out.</li>' +
      '<li>Today is ' + today + '. ' + TY + ' minus 2009 is ' + (TY - y) + '.</li>' +
      '<li>Has 23 November come yet this year? ' + (hasCome(m, d) ? 'Yes, so keep ' + (TY - y) + '.' : 'Not yet, so take away 1. That gives ' + a + '.') + '</li>' +
      '<li>So it’s <b>' + yrs(a) + ' old</b>, which is more than 3 years.</li>' +
      '</ol></div>';
  }

  var QUIZ = [
    { label: "", val: "Page 2/6", page: "page 1", date: false,
      why: "It’s a page count: page 2 of 6. It isn’t 2 June or 6 February." },
    { label: "", val: "Technical Support Bulletin 2009/033", page: "bottom of page 24", date: false,
      why: "It’s the bulletin’s ID number. It starts with a year, 2009, but 033 can’t be a month or a day, so the whole thing isn’t a date." },
    { label: "Collection time:", val: "27/03/2014", page: "page 40", date: true,
      why: "The label says it’s a time something happened, and the parts work: day 27, month 03, year 2014. That’s <b>27 March 2014</b>, the day a lab chart was made." }
  ];
  var guess = {};
  function quizHTML() {
    return '<ul class="quiz">' + QUIZ.map(function (q, n) {
      var g = guess[n], fb = "";
      if (g !== undefined) fb = '<p class="q-fb">' + (g === q.date ? '<b>You got it.</b> ' : '<b>Not quite.</b> ') + q.why + '</p>';
      return '<li class="q"><div class="q-row"><span class="q-text">' + (q.label ? q.label + ' ' : '') + '<b>' + q.val + '</b> <span>(' + q.page + ')</span></span>' +
        '<span class="q-btns" role="group" aria-label="Is ' + q.val + ' a date?">' +
        '<button type="button" class="btn btn-secondary" data-q="' + n + '" data-a="1" aria-pressed="' + (g === true) + '">Date</button>' +
        '<button type="button" class="btn btn-secondary" data-q="' + n + '" data-a="0" aria-pressed="' + (g === false) + '">Not a date</button></span></div>' + fb + '</li>';
    }).join("") + '</ul>';
  }

  var GROUPS = ["See It Done", "Your Turn"];
  var SLIDES = [
    /* Part 1: See it done on the West file */
    { group: "See It Done", title: 'First, Watch the Job Done on a Different <span class="hl">Supplier</span> File', plain: "First, Watch the Job Done on a Different Supplier File",
      body: function () { return '<span class="part-tag">PART 1 &middot; SEE IT DONE ON A REAL SUPPLIER FILE</span>' +
        '<p class="p">Before you check the Cytiva file, we’ll walk you through the same job on another supplier’s file. You’ll see every step done once, and the Cytiva file stays yours to solve.</p>' +
        '<div class="tiles t2">' +
        tile("WHO SENT IT", "West Pharmaceutical Services", "A company that makes rubber stoppers, the plugs that seal vials. A vial is a small glass bottle of medicine.") +
        tile("WHAT’S INSIDE", "42 Pages", "Several papers about one rubber stopper, saved together in one PDF.") +
        '</div>' +
        '<div class="links">' + openBtn(WEST, "Open the West File") + '</div>' +
        '<p class="p">It opens in a new tab, so these slides stay right here. You don’t need to read every word. Keep it open, and jump to the pages each slide names.</p>' +
        note('You won’t hand in anything about the West file. It’s only here to show you how the job is done.'); } },

    { group: "See It Done", title: 'Four <span class="hl">Clues</span> Show Where a New Document Starts', plain: "Four Clues Show Where a New Document Starts",
      body: function () { return '<p class="p">Nothing in a PDF says where one document ends and the next begins, so you read for clues. Here are four from the West file, with the pages where you can see each one.</p>' +
        '<div class="tiles t2 compact">' +
        stile("CLUE 1 &middot; PAGES 12 AND 13", "The Page Count Starts Again", "Page 12 ends with “Page 7 of 7”. Page 13 ends with “Page 1 of 5”. When the count goes back to 1, a new document has started.") +
        stile("CLUE 2 &middot; PAGES 24 AND 27", "A New Title Appears", "Page 24 opens with a new title, “Overview of FluroTec® and B2-Coating”. Page 27 opens with another one, “Formulation Characteristics”.") +
        stile("CLUE 3 &middot; PAGES 17 AND 18", "The Item Name Changes", "Pages 6 to 23 all say “Compliance Bulletin” at the top. But the item under it changes from “FluroTec Resin D” on page 17 to “B2 Coating” on page 18. Same kind of paper, different item, so it’s a new document.") +
        stile("CLUE 4 &middot; PAGE 17", "A Signature Closes It", "Each compliance bulletin ends with a person’s name and signature, like the one at the bottom of page 17. Whatever comes after a signature is usually a new document.") +
        '</div>' +
        note('Look at page 1: it says “Page 2/6”. So the file starts on page 2 of a 6-page document, and its first page is missing. When a count doesn’t start at 1, write that down too.'); } },

    { group: "See It Done", title: 'The West File Holds 7 <span class="hl">Documents</span>', plain: "The West File Holds 7 Documents",
      body: function () { return '<p class="p">Those clues split the West file into these documents. Here’s what each type is.</p>' +
        table(["Pages", "Document type", "What it is"], [
          ["1 to 5", "Quality Certificate", "Proof that 6 batches were made and tested properly"],
          ["6 to 12", "Compliance Bulletin", "A statement that the stopper’s rubber follows certain rules"],
          ["13 to 17", "Compliance Bulletin", "The same kind of statement, for a thin film on the stopper"],
          ["18 to 23", "Compliance Bulletin", "The same kind of statement, for a coating on the stopper"],
          ["24 to 26", "Technical Support Bulletin", "A notice that explains how the film and coating work"],
          ["27 to 41", "Formulation Characteristics", "The rubber’s recipe and test results, plus 10 lab charts on pages 32 to 41"],
          ["42", "Engineering Drawing", "A diagram of the stopper’s exact shape and size"]
        ], "tight"); } },

    { group: "See It Done", title: 'Each Kind of <span class="hl">Date</span> Tells You Something Different', plain: "Each Kind of Date Tells You Something Different",
      body: function () { return '<p class="p">The West file has many kinds of date. The first four tell you when a paper was made, written or changed. The last two don’t.</p>' +
        '<div class="tiles t2 compact">' +
        stile("PAGE 2", "Manufacturing Date", '<span class="ex">05 MAR 2025</span>. The day a batch of stoppers was made.') +
        stile("PAGE 17", "Signature Date", '<span class="ex">06-Jan-2022</span>. The day someone signed the bulletin. “DocuSigned” means it was signed online.') +
        stile("PAGE 26", "Issue Date", '“This technical bulletin dated <span class="ex">23 November 2009</span>”. The day the bulletin was put out.') +
        stile("PAGE 42", "Revision Date", '<span class="ex">25 JUN 2019</span>. The day the drawing was last changed. A revision is a new version.') +
        stile("LEFT EDGE OF EVERY PAGE", "Effective Stamp", '<span class="ex">Effective On: 03-Jun-2025</span>, printed sideways. It’s the same on all 42 pages, so it shows when the whole file was put into use, not when any paper was written.') +
        stile("PAGE 7", "A Law’s Date", '“Directive 94/62/EC dated <span class="ex">20 December 1994</span>”. The date of a law the bulletin mentions, not of the bulletin itself.') +
        '</div>'; } },

    { group: "See It Done", title: 'The Same Date Can Be Written in Many <span class="hl">Formats</span>', plain: "The Same Date Can Be Written in Many Formats",
      body: function () { return '<p class="p">A date’s <b>format</b> is the way it’s written: the order of the day, month and year, whether the month is a word or a number, and what sits between the parts. Here are 7 formats from the West file. D stands for day, M for month and Y for year.</p>' +
        table(["Page", "As written", "Format"], [
          ["2", "05 MAR 2025", "DD MON YYYY, with the month as 3 capital letters"],
          ["12", "30-Jun-2022 | 12:22 PM EDT", "DD-Mon-YYYY with dashes, then a time"],
          ["26", "23 November 2009", "Day, month in full, year"],
          ["38", "Fri Jun 09 11:11:20 2006", "Weekday, month, day, time, then year"],
          ["40", "27/03/2014", "DD/MM/YYYY, with the day first"],
          ["41", "15.06.2018", "DD.MM.YYYY, with dots"],
          ["42", "OCT03", "Month and a 2-digit year, with no day"]
        ], "tight") +
        note('Two dates written the same way share one format. 05 MAR 2025 and 25 JUN 2019 are both DD MON YYYY.'); } },

    { group: "See It Done", title: 'Some Numbers Only Look Like <span class="hl">Dates</span>', plain: "Some Numbers Only Look Like Dates",
      body: function () { return '<p class="p">Some numbers look like dates but aren’t. A number is a date only when its label says so and its parts make sense: a month from 1 to 12 and a day from 1 to 31. Make your guess for each one from the West file.</p>' +
        quizHTML(); } },

    { group: "See It Done", title: 'Count Each Document’s <span class="hl">Age</span> From Its Own Date', plain: "Count Each Document’s Age From Its Own Date",
      body: function () { return '<p class="p">You already know the 3-year check: a document more than 3 years old gets checked again. For each document, use the one date that says when it was made, written, signed, issued or last changed.</p>' +
        workedExample() +
        table(["Document", "Date used", "Age today &middot; More than 3?"], [
          ["Quality Certificate", "05 MAR 2025, made", ageCell(2025, 3, 5)],
          ["Bulletin, rubber (pages 6 to 12)", "30-Jun-2022, signed", ageCell(2022, 6, 30)],
          ["Bulletin, film (pages 13 to 17)", "06-Jan-2022, signed", ageCell(2022, 1, 6)],
          ["Bulletin, coating (pages 18 to 23)", "25-May-2022, signed", ageCell(2022, 5, 25)],
          ["Engineering Drawing", "25 JUN 2019, last revision", ageCell(2019, 6, 25)],
          ["Formulation Characteristics", "No date of its own", "Can’t tell, so flag it"]
        ], "tight"); } },

    /* Part 2: Your turn on the Cytiva file */
    { group: "Your Turn", title: 'Now Do the Same Job on the <span class="hl">Cytiva</span> File', plain: "Now Do the Same Job on the Cytiva File",
      body: function () { return '<span class="part-tag">PART 2 &middot; NOW IT’S YOUR TURN</span>' +
        '<p class="p">You’ve seen the whole job done once. Now do it on the Cytiva file, on your own. The next slides give you a checklist for each answer, but not the answers.</p>' +
        '<div class="tiles t2">' +
        tile("WHO SENT IT", "Cytiva", "A company that makes equipment pharma companies use in their labs and factories.") +
        tile("WHAT IT’S ABOUT", "Flow Kits", "Sets of plastic tubes and connectors that liquids flow through while medicines are being made.") +
        '</div>' +
        '<div class="links">' + openBtn(CYTIVA, "Open the Cytiva File") + '</div>' +
        '<p class="p">Open any notes app, like Google Docs or the notes app on your phone, and make four headings: <b>Documents</b>, <b>Dates</b>, <b>Ages</b> and <b>Challenges</b>. Write under them as you go.</p>' +
        note('If Drive asks you to request access, look in <b>If You’re Stuck</b>, just under these slides.'); } },

    { group: "Your Turn", title: 'Answer 1: Name Each Document and the <span class="hl">Pages</span> It’s On', plain: "Answer 1: Name Each Document and the Pages It’s On",
      body: function () { return '<p class="p">Go through the Cytiva file page by page, and look for the same clues you saw in the West file.</p>' +
        checks([
          "Read the top of every page. Is there a new title or heading?",
          "Look at the bottom and the corners for a page count. Does it start again at 1?",
          "Check the name of the product or item. Does it change from one page to the next?",
          "Look for a person’s name or a signature at the end, which often closes a document.",
          "Name each document’s type. Its title is usually the best guide."
        ]) +
        note('Remember the West file: on pages 12 and 13 the page count started again, and on page 24 a new title appeared.') +
        '<p class="p">Under <b>Documents</b> in your notes, write each type and its pages, like “Pages 24 to 26: Technical Support Bulletin”.</p>'; } },

    { group: "Your Turn", title: 'Answer 2: List Every Date With Its Page, Kind and <span class="hl">Format</span>', plain: "Answer 2: List Every Date With Its Page, Kind and Format",
      body: function () { return '<p class="p">Now hunt for every date in the Cytiva file.</p>' +
        checks([
          "Read every page from top to bottom, and every edge too, including any text printed sideways, like the West file’s stamp.",
          "Count dates with no label next to them. They’re the easiest to miss.",
          "For each number that might be a date, check the label first, then the parts.",
          "For each date, write the page, the date as written, its kind and its format.",
          "Then list the formats. Two dates written the same way share one format."
        ]) +
        '<p class="p">Set out your notes like this. The first row comes from the West file.</p>' +
        '<div class="tbl-wrap tight"><table><thead><tr><th scope="col">Page</th><th scope="col">Date as written</th><th scope="col">Kind</th><th scope="col">Format</th></tr></thead><tbody>' +
        '<tr><td>26</td><td>23 November 2009</td><td>Issue date</td><td>Day, month in full, year</td></tr>' +
        '<tr><td class="blank">Your turn</td><td class="blank">...</td><td class="blank">...</td><td class="blank">...</td></tr>' +
        '</tbody></table></div>'; } },

    { group: "Your Turn", title: 'Answer 3: Find the Documents More Than 3 Years <span class="hl">Old</span>', plain: "Answer 3: Find the Documents More Than 3 Years Old",
      body: function () { return '<p class="p">Use the same method as the worked example on the West bulletin.</p>' +
        checks([
          "For each document, pick the one date that says when it was made, written, signed, issued or last changed.",
          "Skip dates that don’t set the age: a date when something runs out or expires, a stamp added to the whole file, or a law’s date.",
          "Take that year away from this year. If that day hasn’t come yet this year, take away 1 more.",
          "If a document has no date of its own, say so instead of guessing.",
          "List every document more than 3 years old, the date you used and its age today."
        ]) +
        note('Work out ages on the day you submit, so your answer matches what your Program Manager checks.'); } },

    { group: "Your Turn", title: 'Answer 4: Name at Least 2 Things That Would Trip Up an <span class="hl">AI</span>', plain: "Answer 4: Name at Least 2 Things That Would Trip Up an AI",
      body: function () { return '<p class="p">AI here means a computer program that reads the file for you. Think about what slowed you down, because what was hard for you is often hard for a computer too.</p>' +
        checks([
          "Which numbers looked like dates but weren’t?",
          "Were any dates hard to see, or printed in an odd place?",
          "How many different formats did the dates use?",
          "How would a computer know where one document ends and the next begins?",
          "Did any document have no date, or more than one date that could set its age?"
        ]) +
        note('In the West file, the challenges included 7 date formats, a sideways stamp on every page, and a missing first page. Tie each of your challenges to something you saw in the Cytiva file.'); } },

    { group: "Your Turn", title: 'Paste Your 4 <span class="hl">Answers</span>, Then Check Them', plain: "Paste Your 4 Answers, Then Check Them",
      body: function () { return '<p class="p" id="paste-intro">Paste each answer into its own box under <b>Submit Your Work</b>, below these slides. First, check them against <b>How Your Program Manager Reviews It</b>, just above the boxes.</p>' +
        '<ol class="answers one">' +
        '<li><b>Document types</b>, with the pages each one is on</li>' +
        '<li><b>Every date</b>, with its page, kind and format, then the list of formats</li>' +
        '<li><b>Documents more than 3 years old</b>, with the date you used and the age</li>' +
        '<li><b>At least 2 challenges for AI</b>, each tied to the Cytiva file</li>' +
        '</ol>' +
        '<div class="extra"><p><b>Want more practice?</b> Try the same steps on another supplier file. This is optional, and there’s nothing to hand in.</p>' + openBtn(PRACTICE, "Open the Practice File") + '</div>' +
        (standalone ? '<div id="standalone-msg" hidden>' + note('You opened these slides in their own tab. Go back to the Task page tab and paste your answers into the boxes under <b>Submit Your Work</b>.') + '</div>' : ''); } }
  ];
  var END_LABEL = "Done. Now submit your answers.";
  var standalone = !(window.parent && window.parent !== window);

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the slides. Scroll down to Submit Your Work.";

  /* The fixed stage: lay out at 760 x 790, then scale the whole deck to fit the frame and centre it. */
  var STAGE_W = 760, STAGE_H = 790;
  function scaleStage() {
    var k = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", g.name + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + g.name + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner"><p class="step">' + (n < 9 ? "0" : "") + (n + 1) + '</p><h2 class="title">' + s.title + '</h2>' + s.body() + '</div>';
  }

  function render(anim, focusSel) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-q]"), function (b) {
      b.addEventListener("click", function () {
        var q = b.getAttribute("data-q"), a = b.getAttribute("data-a");
        guess[q] = a === "1";
        render(false, '[data-q="' + q + '"][data-a="' + a + '"]');
      });
    });
    if (focusSel) { var f = card.querySelector(focusSel); if (f) f.focus({ preventScroll: true }); }

    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  /* Works on its own: the message shows in the deck. The submit postMessage is kept for pages that listen, but nothing needs it. */
  function finish() {
    if (!standalone) { donemsg.textContent = DONE_MSG; tellParent({ type: "extern-deck-submit" }); return; }
    var m = $("standalone-msg"); if (m) { m.hidden = false; var pi = $("paste-intro"); if (pi) pi.hidden = true; }
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  /* Left and Right arrow keys move between slides */
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  function tellParent(msg) { if (!standalone) window.parent.postMessage(msg, "*"); }

  window.addEventListener("resize", scaleStage);
  scaleStage();
  render(false);
})();
</script>
</body>
</html>
