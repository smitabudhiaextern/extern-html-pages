/* The SME's lesson look (chaitanyabaweja/pfizer-lesson-templates, shared/styles.css), restyled to the
   Pfizer x Extern Core design system, Light format. Every colour, font, radius and shadow comes from
   output/programs/pfizer-3-0/design-system/tokens.json. His selectors, layout and spacing are kept.
   Changes beyond colour and type: the page is a fixed 760 px wide stage (height --stage-h) that
   stage.js scales to fit its iframe, so his width and height media queries are gone (the stage never
   changes size), and the textarea no longer resizes. The design system has no code font, so code uses
   the same system monospace stack as our Try engine. */
:root {
  /* design-system tokens (Light format) */
  --pfizer-blue: #0033a0;
  --blue-50: #e6ecf7;
  --blue-200: #b9c8e8;
  --extern-black: #000000;
  --extern-white: #ffffff;
  --green-600: #07a657;
  --gray-50: #f2f2f2;
  --gray-200: #e4e4e4;
  --gray-600: #666666;
  --gray-800: #333333;
  --surface: var(--extern-white);
  --surface-card: var(--blue-50);
  --surface-icon: var(--extern-white);
  --ink: var(--extern-black);
  --ink-muted: var(--gray-800);
  --card-title: var(--extern-black);
  --card-text: var(--gray-800);
  --step-label: var(--pfizer-blue);
  --action: var(--extern-black);
  --on-action: var(--extern-white);
  --line: var(--gray-200);
  --focus-ring: var(--pfizer-blue);
  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 14px;
  --radius-full: 9999px;
  --serif: "DM Serif Display", Georgia, serif;
  --sans: Inter, system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;
  --stage-h: 800px;
  /* The SME's code colours, kept exactly as he has them (Smita, 10 Nov 2026: keep his black
     Python code box). They are used only for code: code blocks, the code box and the output. */
  --code-bg: #1c1f26;
  --code-fg: #e6e8ee;
  --out-bg: #f2f4f8;
  --out-line: #dce1ea;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; overflow: hidden; }
body {
  height: 100%;
  overflow: hidden;
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 22px;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--pfizer-blue); }
a:hover { color: var(--ink); }
code {
  font-family: var(--mono);
  background: var(--surface-card);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 0.9em;
  overflow-wrap: anywhere;
}
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
[hidden] { display: none !important; }

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

/* ---- page frame: the fixed stage ---- */
/* stage.js sets one uniform scale and centres the stage in the frame. Header, tabs and the
   Back/Next bar never move; the step panel zooms its content down a little before it would scroll. */
.lesson {
  position: absolute;
  left: 0;
  top: 0;
  width: 760px;
  height: var(--stage-h);
  transform-origin: 0 0;
  padding: 16px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--surface);
}
.lesson-head, .tabs, .nav { flex-shrink: 0; }
.lesson-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.eyebrow {
  font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--step-label);
}
h1 { margin: 4px 0 0; font-family: var(--serif); font-size: 32px; font-weight: 400; line-height: 38px; color: var(--ink); }
.step-count { font-size: 13px; line-height: 16px; font-weight: 500; color: var(--ink-muted); white-space: nowrap; padding-bottom: 4px; }

/* ---- tabs ---- */
.tabs { display: grid; grid-template-columns: repeat(var(--tab-count, 5), minmax(0, 1fr)); gap: 8px; }
.tab {
  min-width: 0; min-height: 44px; padding: 6px 10px;
  border-radius: var(--radius-xs); border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink);
  font: 600 13px/1.15 var(--sans); text-align: left; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
}
.tab:hover { border-color: var(--ink); }
.tab-label { min-width: 0; overflow-wrap: break-word; }
.tab[aria-selected="true"] { background: var(--action); color: var(--on-action); border-color: var(--action); }
.tab-dot {
  width: 22px; height: 22px; border-radius: var(--radius-full); flex-shrink: 0;
  background: var(--surface-card); color: var(--step-label);
  font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;
}
.tab.done .tab-dot { background: var(--pfizer-blue); color: var(--extern-white); }
.tab[aria-selected="true"] .tab-dot { background: var(--extern-white); color: var(--ink); }

/* ---- panel card ---- */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 20px 24px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  overscroll-behavior: contain;
}
.panel.overflow { overflow-y: auto; } /* last resort only: stage.js zooms the content down first */
.stack { display: flex; flex-direction: column; gap: 16px; }
h2 { margin: 0; font-family: var(--serif); font-size: 24px; font-weight: 400; line-height: 28px; color: var(--ink); }
p { margin: 0; }
.lead { font-size: 16px; line-height: 24px; color: var(--ink-muted); max-width: 680px; }
.small-label {
  font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-muted);
}

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.mini-card { background: var(--surface-card); border-radius: var(--radius-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.mini-card b { font-size: 15px; line-height: 20px; font-weight: 600; color: var(--card-title); }
.mini-card span { font-size: 14px; color: var(--card-text); line-height: 21px; }
.mini-card code { background: var(--surface-icon); padding: 0 4px; }

pre {
  margin: 0; font-family: var(--mono); font-size: 13.5px; line-height: 1.6;
  white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--code-bg); color: var(--code-fg);
  border-radius: 10px; padding: 14px 18px;
  font-variant-ligatures: none;
}
pre.out { background: var(--out-bg); border: 1px solid var(--out-line); color: var(--ink); padding: 12px 18px; max-height: 230px; overflow-y: auto; }
.out-err { font-weight: 600; }

/* ---- example boxes ---- */
.boxes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.box { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.box-idx { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--step-label); }
.box-val {
  border: 1.5px solid var(--blue-200); background: var(--surface); border-radius: var(--radius-xs);
  padding: 14px 12px; font-size: 15px; font-weight: 600; text-align: center; overflow-wrap: anywhere;
}
.box.hl .box-val { border: 2px solid var(--pfizer-blue); background: var(--surface-card); }
/* Many boxes (one per character of a string): five to a row, so they take two rows, not four. */
.boxes:has(> .box:nth-child(7)) { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px 10px; }
.boxes:has(> .box:nth-child(7)) .box { gap: 4px; }
.boxes:has(> .box:nth-child(7)) .box-val { padding: 8px 10px; font-family: var(--mono); font-size: 16px; }
.caption { font-size: 15px; line-height: 23px; color: var(--ink-muted); }

/* ---- demo ---- */
.demo { display: flex; gap: 18px; }
.demo-list { display: flex; flex-direction: column; gap: 8px; width: 190px; flex-shrink: 0; }
.demo-main { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.demo-pick {
  min-height: 44px; text-align: left; padding: 9px 14px; border-radius: var(--radius-xs);
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: 500 14px/1.3 var(--sans); cursor: pointer;
}
.demo-pick:hover { border-color: var(--ink); }
.demo-pick[aria-pressed="true"] { border-color: var(--pfizer-blue); background: var(--surface-card); font-weight: 600; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.note { font-size: 13.5px; line-height: 20px; color: var(--ink-muted); flex: 1 1 200px; min-width: 0; }

/* ---- buttons: black primary, outlined secondary, radius-xs (Light format) ---- */
.btn {
  min-height: 44px; min-width: 44px; padding: 0 20px; border-radius: var(--radius-xs);
  border: 1.5px solid transparent; font: 600 15px/19px var(--sans); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
}
.btn-primary { background: var(--action); color: var(--on-action); }
.btn-primary:hover { background: var(--gray-800); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); padding: 0 18px; }
.btn-ghost:hover:not([disabled]), .btn-link:hover { background: var(--gray-50); }
.btn-link { background: transparent; color: var(--pfizer-blue); border-color: var(--pfizer-blue); padding: 0 18px; }
.btn-dark { background: var(--action); color: var(--on-action); padding: 0 22px; }
.btn[disabled] { opacity: 0.35; cursor: not-allowed; }

/* ---- try it ---- */
.try-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
textarea {
  display: block; width: 100%; min-height: 128px; resize: none;
  background: var(--code-bg); color: var(--code-fg); caret-color: var(--code-fg);
  border: 2px solid transparent; border-radius: 10px; padding: 12px 16px;
  font-family: var(--mono); font-size: 13px; line-height: 1.5; tab-size: 4;
  font-variant-ligatures: none;
}
textarea:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
.feedback { border-radius: var(--radius-xs); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.feedback.ok { background: var(--surface); border: 1.5px solid var(--green-600); }
.feedback.no { background: var(--gray-50); border-left: 3px solid var(--gray-600); }
.feedback .fb-title { font-weight: 600; font-size: 14px; color: var(--ink); }
.feedback.ok .fb-title::before {
  content: ""; display: inline-block; width: 9px; height: 5px; margin: 0 9px 3px 2px;
  border-left: 2.5px solid var(--green-600); border-bottom: 2.5px solid var(--green-600); transform: rotate(-45deg);
}
.feedback .fb-msg { font-size: 14px; line-height: 21px; color: var(--ink-muted); }
.feedback pre { background: transparent; border: 0; color: var(--ink); padding: 0; font-size: 13px; }
.answer-box { display: flex; flex-direction: column; gap: 6px; }

/* Long starters (more than 8 lines, class set by concept.js): the task and the feedback on the left,
   the code box, buttons and answer on the right, so the Try fits the stage. */
.stack.try-wide {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.75fr); column-gap: 18px; row-gap: 10px;
  grid-template-areas: "head head" "prompt label" "prompt code" "fb btns" "fb answer";
  grid-template-rows: auto auto auto auto auto; align-items: start;
}
.try-wide > .try-head { grid-area: head; }
.try-wide > .lead { grid-area: prompt; font-size: 14px !important; line-height: 21px; }
.try-wide > label { grid-area: label; }
.try-wide > textarea { grid-area: code; font-size: 12.5px; padding: 10px 12px; white-space: pre; overflow-wrap: normal; overflow-x: auto; } /* one code line = one row */
.try-wide > .row { grid-area: btns; gap: 8px !important; }
.try-wide > .row .btn { padding: 0 14px; font-size: 14px; }
.try-wide > #feedback { grid-area: fb; }
.try-wide > #answer { grid-area: answer; }
.try-wide .answer { max-height: 190px; font-size: 12.5px; padding: 10px 12px; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
.try-wide .feedback pre { max-height: 150px; overflow-y: auto; }
.answer-box:focus { outline: none; }
.answer-box:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
.answer { background: var(--out-bg); color: var(--ink); border: 1px solid var(--out-line); font-size: 13px; line-height: 1.5; padding: 10px 16px; max-height: 260px; overflow-y: auto; } /* a code panel: may scroll */

/* ---- learn more ---- */
.learn { display: flex; gap: 18px; }
.video { width: 380px; flex-shrink: 0; }
.video-frame, .video-soon {
  display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: var(--radius-md); background: var(--surface-card);
}
.video-soon {
  color: var(--card-title); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px; font-size: 14px; font-weight: 600; text-align: center; padding: 12px;
}
.play { width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--action); display: flex; align-items: center; justify-content: center; }
.learn-side { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; min-width: 0; }
.learn-side a { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.learn-side .where { font-size: 14px; line-height: 21px; color: var(--ink-muted); }

/* ---- pick-one buttons (Templates B and C; kept so the shell stays shared) ---- */
.choice {
  min-height: 44px; padding: 8px 18px; border-radius: var(--radius-xs);
  border: 1.5px solid var(--blue-200); background: var(--surface); color: var(--ink);
  font: 600 14px var(--sans); text-align: left; cursor: pointer; overflow-wrap: anywhere;
}
.choice.mono { font: 400 13.5px/1.5 var(--mono); white-space: pre-wrap; } /* keep leading spaces: indentation is the answer */
.choice.ok { border-color: var(--green-600); border-width: 2px; }
.choice.no { border-color: var(--gray-600); background: var(--gray-50); }
.choices-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.choices-col { display: flex; flex-direction: column; gap: 8px; }
.choices-row { display: flex; flex-wrap: wrap; gap: 10px; }
.choices-row .choice { min-width: 96px; text-align: center; }
.code-text { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }

/* ---- footer nav ---- */
.nav { display: flex; justify-content: space-between; gap: 12px; }

.error-box {
  background: var(--gray-50); color: var(--ink-muted); border-left: 3px solid var(--gray-600);
  border-radius: var(--radius-xs); padding: 16px 18px; font-size: 15px; line-height: 22px;
}
.error-box b { color: var(--ink); }

.only-narrow { display: none; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

:root{--stage-h:860px}

const TIMEOUT_HINT =
  "Your code took too long to run (over 5 seconds). Check for a loop that never ends.";

// Error types that have a matching "Fix the error" (Template C) lesson.
const ERROR_LESSONS = {
  SyntaxError: "Fix the error: SyntaxError",
  IndentationError: "Fix the error: IndentationError",
  NameError: "Fix the error: NameError",
  TypeError: "Fix the error: TypeError",
  KeyError: "Fix the error: KeyError",
  IndexError: "Fix the error: IndexError",
  FileNotFoundError: "Fix the error: FileNotFoundError",
  ModuleNotFoundError: "Fix the error: ModuleNotFoundError",
};

// Deep equality over values converted from Python by the runner:
//   list -> array, tuple -> array, dict -> plain object, None -> null,
//   set -> array (sorted by JSON text), int/float -> number (bigint if huge).
// So `expect` values in lesson JSON are written as ordinary JSON: a Python
// tuple (1, 2) is expected as [1, 2], and a dict as an object.
function deepEqual(a, b) {
  if (Object.is(a, b)) return true;
  if (typeof a !== typeof b || a === null || b === null) return false;
  if (typeof a !== "object") return false;
  const aIsArr = Array.isArray(a);
  if (aIsArr !== Array.isArray(b)) return false;
  if (aIsArr) {
    return a.length === b.length && a.every((v, i) => deepEqual(v, b[i]));
  }
  const ka = Object.keys(a);
  const kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every((k) => Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]));
}

// "an" before a vowel sound: an IndentationError, an ImportError, an OSError.
// "U" said as "you" (UnicodeDecodeError, UserWarning) keeps "a".
function article(word) {
  const w = String(word);
  if (/^U(ni|s)/.test(w)) return "a";
  return /^[AEIOU]/i.test(w) ? "an" : "a";
}

function errorHint(error) {
  const a = article(error.type);
  let hint = error.message
    ? `Your code stopped with ${a} ${error.type}: ${error.message}.`
    : `Your code stopped with ${a} ${error.type}.`;
  const title = Object.prototype.hasOwnProperty.call(ERROR_LESSONS, error.type)
    ? ERROR_LESSONS[error.type]
    : null;

  void title;
  return hint;
}

//   tryBlock: {checks: [{expr, expect, hint}], expect_stdout: null|string, stdout_hint}
//   run:      RunResult from the runner
//   values:   one converted value per check, in order (from runner.evalChecks)
function judge(tryBlock, run, values) {
  if (run.timedOut) return { ok: false, hint: TIMEOUT_HINT };
  if (run.error) return { ok: false, hint: errorHint(run.error) };

  const checks = tryBlock.checks || [];
  for (let i = 0; i < checks.length; i++) {
    if (!deepEqual(values[i], checks[i].expect)) {
      return { ok: false, hint: checks[i].hint };

  if (tryBlock.expect_stdout != null) {
    // Python's rstrip() strips all trailing whitespace; so does trimEnd().
    if (String(run.stdout).trimEnd() !== String(tryBlock.expect_stdout).trimEnd()) {
      return { ok: false, hint: tryBlock.stdout_hint };
    }
  }
  return { ok: true, hint: "" };

  return wrongCount >= 2;
}

// broke (not because of the student's code). The browser worker failing to load
// can surface as either "LoadError" or "InternalError"; the UI shows the same
// "Python couldn't load here" message for both.

  return Boolean(run && run.error && (run.error.type === "LoadError" || run.error.type === "InternalError"));

      if (!isObj(o) || typeof o.ok !== "boolean") c.bad(`predict.options[${i}].ok`, "must be true or false");
    });
    exactlyOneOk(opts, "predict.options", c);
  }
  if (l.verify === undefined) c.bad("verify", "must be null or {setup, code, stdout_startswith}");
  else if (l.verify !== null) {
    c.str(l.verify, "setup", "verify.");
    c.text(l.verify, "code", "verify.");
    c.text(l.verify, "stdout_startswith", "verify.");
  }
}

function validateFixError(l, c) {
  if (!Number.isInteger(l.number) || l.number < 1 || l.number > 8) c.bad("number", "must be a whole number from 1 to 8");
  c.text(l, "error_type", "");
  c.text(l, "code", "");
  c.list(l, "traceback", "", { min: 1 }).forEach((line, i) => {
    if (!isStr(line)) c.bad(`traceback[${i}]`, "must be text");
  });
  c.list(l, "notes", "").forEach((n, i) => {
    c.text(n, "label", `notes[${i}].`);
    c.text(n, "text", `notes[${i}].`);
  });
  if (!Number.isInteger(l.arrow_line) || l.arrow_line < 1) c.bad("arrow_line", "must be a 1-based line number");
  const fixes = c.list(l, "fixes", "", { min: 2 });
  fixes.forEach((f, i) => {
    c.text(f, "label", `fixes[${i}].`);
    c.text(f, "title", `fixes[${i}].`);
    c.text(f, "feedback", `fixes[${i}].`);
    c.str(f, "fixed_code", `fixes[${i}].`);
    if (!isObj(f) || typeof f.ok !== "boolean") c.bad(`fixes[${i}].ok`, "must be true or false");
    else if (f.ok) c.text(f, "fixed_code", `fixes[${i}].`);
  });
  exactlyOneOk(fixes, "fixes", c);
}

// Throws LessonError listing every missing/invalid field; returns the lesson if fine.
function validate(lesson) {
  const c = checker();
  if (!isObj(lesson)) throw new LessonError("This lesson file is not a JSON object.");
  if (!TEMPLATES.includes(lesson.template)) {
    throw new LessonError(`This lesson has an unknown template: ${JSON.stringify(lesson.template)} (template).`);
  }
  if (!isStr(lesson.id) || !ID_RE.test(lesson.id)) c.bad("id", "lowercase letters, digits and dashes");
  c.text(lesson, "title", "");
  c.text(lesson, "kicker", "");
  validateLearn(lesson, c);
  if (lesson.template === "concept") validateConcept(lesson, c);
  else if (lesson.template === "read-code") validateReadCode(lesson, c);
  else validateFixError(lesson, c);

  if (c.problems.length) {
    throw new LessonError(
      `This lesson file has problems in: ${c.problems.join("; ")}. Fix these in lessons/${lesson.id || "<id>"}.json.`
    );
  }
  return lesson;
}

// load({search, base, fetchFn, expectTemplate}) -> Promise<Lesson>
// In the browser all options default to the page's own location and fetch.
async function load({
  search = globalThis.location?.search ?? "",
  base = globalThis.document?.baseURI ?? globalThis.location?.href,
  fetchFn = globalThis.fetch?.bind(globalThis),
  expectTemplate = null,
} = {}) {
  const id = new URLSearchParams(search).get("lesson");
  if (!id) throw new LessonError("No lesson chosen. Add ?lesson=<name> to the page address, for example ?lesson=lists.");
  if (!ID_RE.test(id)) throw new LessonError(`"${id}" is not a valid lesson name. Use lowercase letters, digits and dashes.`);

  const url = new URL(`lessons/${id}.json`, base);
  let res;
  try {
    res = await fetchFn(url.href);
  } catch {
    throw new LessonError("The lesson file couldn't be loaded. Check your internet connection and reload the page.");
  }
  if (!res.ok) {
    throw new LessonError(
      res.status === 404
        ? `We couldn't find a lesson called "${id}".`
        : `The lesson file couldn't be loaded (error ${res.status}). Reload the page to try again.`
    );
  }
  let lesson;
  try {
    lesson = await res.json();
  } catch {
    throw new LessonError(`The lesson file "${id}" is not valid JSON.`);
  }
  validate(lesson);
  if (expectTemplate && lesson.template !== expectTemplate) {
    throw new LessonError(
      `Lesson "${id}" uses the ${lesson.template} template, not ${expectTemplate}. Open it with ${lesson.template}.html instead.`
    );
  }
  return lesson;
}

return { LessonError, validate, load };
})();

// ---- runner.js ----
const __m_runner = (() => {
// Main-thread runner. Runs student code in a worker so the page never freezes.
// A timeout terminates the worker; the next call starts a fresh one.
//
// Browser:  import { run, evalChecks } from "./runner.js"
// Node:     const r = await createNodeRunner(); r.run(...); r.close()

const DEFAULT_TIMEOUT_MS = 5000;
// Loading Pyodide and packages like pandas can be slow; that time is not
// charged to the student's 5 seconds (the timer starts when the worker says
// "started"). This only guards against a stuck load.
const LOAD_TIMEOUT_MS = 90000;

function failed(type, message) {
  return { ok: false, stdout: "", error: { type, message, line: null }, timedOut: false };
}

const TIMED_OUT = { ok: false, stdout: "", error: null, timedOut: true };

// workerFactory() -> {post(msg), onMessage(cb), onFail(cb), terminate()}
function createRunner(workerFactory) {
  let w = null;
  let chain = Promise.resolve();
  let nextId = 1;

  function kill() {
    if (w) {
      const old = w;
      w = null;
      try {
        old.terminate();
      } catch {
        /* already gone */
      }
    }
  }

  // One handler pair per worker (no listener build-up); `current` is the run in flight.
  let current = null;

  function startWorker() {
    const worker = workerFactory();
    worker.onMessage((msg) => {
      if (w === worker && current) current.onMessage(msg);
    });
    worker.onFail((err) => {
      if (w === worker && current) current.onFail(err);
    });
    return worker;
  }

  function exec(code, exprs, timeoutMs) {
    return new Promise((resolve) => {
      const id = nextId++;
      let timer = null;
      let settled = false;
      // Creating a worker can throw synchronously (blocked by the embed, no
      // Worker support). That is a load failure, not a rejected promise.
      try {
        if (!w) w = startWorker();
      } catch (err) {
        w = null;
        resolve({
          run: failed("LoadError", `Python couldn't start: ${String((err && err.message) || err)}`),
          values: [],
        });
        return;
      }
      const worker = w;

      const finish = (result) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (current === handlers) current = null;
        resolve(result);
      };
      const arm = (ms, onExpire) => {
        clearTimeout(timer);
        timer = setTimeout(onExpire, ms);
      };

      const handlers = {
        onMessage(msg) {
          if (msg.type === "load-error") {
            kill();
            finish({ run: failed("LoadError", msg.message), values: [] });
          } else if (msg.id !== id) {
            // stale message from an earlier run; ignore
          } else if (msg.type === "started") {
            arm(timeoutMs, () => {
              kill();
              finish({ run: { ...TIMED_OUT }, values: [] });
            });
          } else if (msg.type === "done") {
            // Self-heal: an internal failure means the worker's state is suspect.
            if (msg.run && msg.run.error && msg.run.error.type === "InternalError") kill();
            finish({ run: msg.run, values: msg.values });
          }
        },
        onFail(err) {
          kill();
          finish({ run: failed("InternalError", String((err && err.message) || err)), values: [] });
        },
      };
      current = handlers;

      arm(LOAD_TIMEOUT_MS, () => {
        kill();
        finish({ run: failed("LoadError", "Python took too long to load."), values: [] });
      });
      try {
        worker.post({ id, code, exprs });
      } catch (err) {
        kill();
        finish({ run: failed("LoadError", `Python couldn't start: ${String((err && err.message) || err)}`), values: [] });
      }
    });
  }

  function enqueue(code, exprs, timeoutMs) {
    const p = chain.then(() => exec(code, exprs, timeoutMs));
    chain = p.catch(() => {});
    return p;
  }

  return {
    async run(code, { timeoutMs = DEFAULT_TIMEOUT_MS } = {}) {
      return (await enqueue(code, [], timeoutMs)).run;
    },
    async evalChecks(code, exprs, { timeoutMs = DEFAULT_TIMEOUT_MS } = {}) {
      return enqueue(code, exprs, timeoutMs);
    },
    close() {
      kill();
    },
  };
}

// Pfizer x Extern build: build_lesson.py inlines the worker (py-worker.js + py-core.js)
// in a <script type="text/plain" id="py-worker-src"> tag, so the page is one self-contained
// file. It starts from a Blob URL as a classic worker (it loads Pyodide with importScripts),
// because a module worker from a Blob URL fails on a page opened from file://.
// Without that tag (local preview), py-worker.js is used as before.
let workerBlobUrl = null;
function newWorker() {
  const src = typeof document !== "undefined" ? document.getElementById("py-worker-src") : null;
  if (!src) return new Worker(new URL("./py-worker.js", import.meta.url), { type: "module" });
  workerBlobUrl ??= URL.createObjectURL(new Blob([src.textContent], { type: "text/javascript" }));
  return new Worker(workerBlobUrl);
}

function browserWorker() {
  const raw = newWorker();
  return {
    post: (m) => raw.postMessage(m),
    onMessage: (cb) => {
      raw.onmessage = (e) => cb(e.data);
    },
    onFail: (cb) => {
      raw.onerror = (e) => cb(e);
      raw.onmessageerror = (e) => cb(e);
    },
    terminate: () => raw.terminate(),
  };
}

let browserRunner = null;
function shared() {
  return (browserRunner ??= createRunner(browserWorker));
}

// Browser entry points (lazy: no worker is created until first use).
const run = (code, opts) => shared().run(code, opts);
const evalChecks = (code, exprs, opts) => shared().evalChecks(code, exprs, opts);

// Node entry point for tests: same runner, worker_threads instead of a Web Worker.
async function createNodeRunner() {
  const { Worker } = await import("node:worker_threads");
  const { fileURLToPath } = await import("node:url");
  const file = fileURLToPath(new URL("./node-worker.js", import.meta.url));
  return createRunner(() => {
    const raw = new Worker(file);
    return {
      post: (m) => raw.postMessage(m),
      onMessage: (cb) => {
        raw.on("message", cb);
      },
      onFail: (cb) => {
        raw.on("error", cb);
        raw.on("exit", (code) => {
          if (code !== 0) cb(new Error(`worker exited with code ${code}`));
        });
      },
      terminate: () => raw.terminate(),
    };
  });
}

return { createRunner, run, evalChecks, createNodeRunner };
})();

const __m_shell = (() => {
// The shell every lesson template shares: DOM helpers, the fit-to-box page
// (header, tabs, scrolling step panel, Back/Next), the Learn more tab, the
// "Python couldn't load" handling and the "lesson unavailable" page.
// concept.js, read-code.js and fix-error.js only supply their own panels.
//
// All lesson text goes in via textContent (never innerHTML); `inline()` turns
// `code` and **bold** in lesson text into real elements.
const { load, validate, LessonError } = __m_lesson_loader;

const SVG_TAGS = new Set(["svg", "polygon"]);

function h(tag, attrs = {}, ...kids) {
  const el = SVG_TAGS.has(tag) ? document.createElementNS("http://www.w3.org/2000/svg", tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

// "Use `x` and **bold**" -> text + <code> + <strong> nodes.
function inline(text) {
  return String(text)
    .split(/(`[^`]+`|\*\*[^*]+\*\*)/)
    .filter((part) => part !== "")
    .map((part) => {
      if (part.startsWith("`")) return h("code", {}, part.slice(1, -1));
      if (part.startsWith("**")) return h("strong", {}, part.slice(2, -2));
      return part;
    });
}

// ---------- scrolling and focus inside the panel ----------

// Scroll the step panel (only) so `el` is visible. Deliberately not
// el.scrollIntoView(): Chrome also scrolls ancestor frames, which would move the
// Notion page around the embed.
function revealInPanel(el) {
  const panel = document.getElementById("panels");
  const p = panel.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  if (r.height > p.height || r.top < p.top) panel.scrollTop += r.top - p.top - 8;
  else if (r.bottom > p.bottom) panel.scrollTop += r.bottom - p.bottom + 8;
}

// Newly revealed content (e.g. the answer after its own button hid itself):
// move keyboard focus onto it so focus isn't lost, then scroll it into view.
function focusRevealed(el) {
  el.tabIndex = -1;
  el.focus({ preventScroll: true });
  revealInPanel(el);
}

// A group of pick-one buttons. `mark(i, ok)` shows the picked one as right/wrong.
function choiceGroup(labels, { className, label, onPick, mono = false }) {

// ---------- page ----------

// Fills the header, builds one panel per tab and wires tabs + Back/Next.
// opts: { labels: [tab names], builders: [l => node], kicker?: string }
function mountShell(l, { labels, builders, kicker }) {
  document.title = l.title;
  document.getElementById("eyebrow").textContent = kicker || l.kicker;
  document.getElementById("title").textContent = l.title;

  const panelsEl = document.getElementById("panels");
  const tabsEl = document.getElementById("tabs");
  const back = document.getElementById("back");
  const next = document.getElementById("next");
  const stepCount = document.getElementById("step-count");
  let step = 0;

  const panels = builders.map((build, i) =>
    h("section", { role: "tabpanel", id: `panel-${i}`, "aria-labelledby": `tab-${i}`, hidden: true }, build(l))
  );
  panelsEl.replaceChildren(...panels);

  tabsEl.style.setProperty("--tab-count", String(labels.length));
  const tabs = labels.map((label, i) =>
    h(
      "button",
      { type: "button", role: "tab", class: "tab", id: `tab-${i}`, "aria-controls": `panel-${i}`, onclick: () => go(i) },
      h("span", { class: "tab-dot", "aria-hidden": "true" }, String(i + 1)),
      h("span", { class: "tab-label" }, label)
    )
  );
  tabsEl.replaceChildren(...tabs);
  tabsEl.addEventListener("keydown", (e) => {
    const keys = { ArrowRight: 1, ArrowLeft: -1 };
    if (e.key in keys) {
      e.preventDefault();
      go((step + keys[e.key] + tabs.length) % tabs.length, true);
    } else if (e.key === "Home" || e.key === "End") {
      e.preventDefault();
      go(e.key === "Home" ? 0 : tabs.length - 1, true);
    }
  });

  function go(i, focusTab = false) {
    step = Math.max(0, Math.min(tabs.length - 1, i));
    tabs.forEach((t, j) => {
      t.setAttribute("aria-selected", String(j === step));
      t.tabIndex = j === step ? 0 : -1;
      t.classList.toggle("done", j < step);
    });
    panels.forEach((p, j) => (p.hidden = j !== step));
    stepCount.replaceChildren(`Step ${step + 1} of ${tabs.length}`, h("span", { class: "only-narrow" }, ` · ${labels[step]}`));
    const hadFocus = document.activeElement;
    back.disabled = step === 0;
    next.disabled = step === tabs.length - 1;
    // A button that just disabled itself would drop keyboard focus: hand it to the active tab.
    if (focusTab || ((hadFocus === back || hadFocus === next) && hadFocus.disabled)) tabs[step].focus();
  }
  back.addEventListener("click", () => go(step - 1));
  next.addEventListener("click", () => go(step + 1));
  go(0);
}

function showProblem(err) {
  document.getElementById("title").textContent = "Lesson unavailable";
  document.getElementById("tabs").hidden = true;
  document.querySelector(".nav").hidden = true;
  document.getElementById("panels").replaceChildren(h("div", { class: "error-box", role: "alert" }, h("b", {}, "This lesson can't be shown. "), err.message));
}

// Entry point for every template page: `setup(lesson)` returns the mountShell options.
// Pfizer x Extern build: build_lesson.py inlines the lesson JSON in a
// <script type="application/json" id="lesson-data"> tag; it is checked with the same validate().
// Without that tag (local preview), the lesson is fetched from ?lesson=<id> as before.
function loadEmbedded(template) {
  const tag = document.getElementById("lesson-data");
  if (!tag) return load({ expectTemplate: template });
  return Promise.resolve().then(() => {
    let lesson;
    try {
      lesson = JSON.parse(tag.textContent);
    } catch {
      throw new LessonError("The lesson built into this page is not valid JSON.");
    }
    validate(lesson);
    if (lesson.template !== template) throw new LessonError(`This lesson uses the ${lesson.template} template, not ${template}.`);
    return lesson;
  });
}

function boot(template, setup) {
  loadEmbedded(template).then((l) => {
    mountShell(l, setup(l));

}

  const codeEl = h("pre", { id: "demo-code", style: "min-height:120px" });
  const noteEl = h("span", { class: "note" });
  const outWrap = h("div", { hidden: true, style: "display:flex;flex-direction:column;gap:6px" });
  const outEl = h("pre", { class: "out" });
  const status = h("div", { role: "status", "aria-live": "polite" }, outWrap);
  outWrap.append(h("span", { class: "small-label" }, "Output"), outEl);
  const runBtn = h(
    "button",
    { type: "button", class: "btn btn-primary" },
    h(
      "svg",
      { width: "14", height: "14", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.5", "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" },
      h("polygon", { points: "6 4 20 12 6 20 6 4" })
    ),
    "Run"
  );
  const picks = l.demos.map((d, i) =>
    h("button", { type: "button", class: "demo-pick", "aria-pressed": "false", onclick: () => select(i) }, d.label)
  );

  function select(i) {
    current = i;
    picks.forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
    codeEl.textContent = l.demos[i].code;
    noteEl.textContent = l.demos[i].note;
    outWrap.hidden = true;
  }

  runBtn.addEventListener("click", async () => {
    runBtn.disabled = true;
    const label = runBtn.lastChild;
    label.textContent = "Running…";
    const r = await safeRun(l.demos[current].code);
    label.textContent = "Run";
    runBtn.disabled = false;
    outEl.replaceChildren();
    if (isLoadFailure(r)) outEl.append(loadFailureNode());
    // Pfizer x Extern: a demo that stops with an error on purpose also keeps what it printed first.
    else if (r.timedOut || r.error) outEl.append(r.stdout ? r.stdout.trimEnd() + "\n" : "", h("span", { class: "out-err" }, runErrorText(r)));
    else outEl.append(r.stdout.trimEnd() || "(no output)");
    outWrap.hidden = false;
    revealInPanel(outWrap);
  });

  select(0);
  return h(
    "div",
    { class: "stack", style: "gap:16px" },
    h("h2", {}, "Watch it run"),
    h(
      "div",
      { class: "demo" },
      h("div", { class: "demo-list", role: "group", "aria-label": "Demos" }, picks),
      h("div", { class: "demo-main" }, codeEl, h("div", { class: "row" }, runBtn, noteEl), status)
    )
  );
}

function tryPanel(l) {
  const t = l.try;
  let attempts = 0;
  let wrong = 0;
  let solved = false;
  let revealed = false;
  let busy = false;

  const attemptsEl = h("span", { class: "small-label", style: "text-transform:none;letter-spacing:0;font-weight:400;font-size:12px" }, "Attempts: 0");
  // Pfizer x Extern: the code box is as tall as the starter code (at least his 6 rows), so a
  // three-part starter shows in full instead of scrolling inside a 6-row box.
  const rows = Math.max(6, String(t.starter).split("\n").length); // a starter ending in a newline gets its empty last row
  const box = h("textarea", { id: "code-box", spellcheck: "false", autocomplete: "off", autocapitalize: "off", rows: String(rows), style: `--rows:${rows}` });
  box.value = t.starter;
  const checkBtn = h("button", { type: "button", class: "btn btn-primary" }, "Run & check");
  const resetBtn = h("button", { type: "button", class: "btn btn-ghost" }, "Start over");
  const revealBtn = h("button", { type: "button", class: "btn btn-link", hidden: true }, "Show answer");
  const slot = feedbackSlot();
  const feedback = slot.el;
  feedback.id = "feedback";
  const answer = h("div", { hidden: true, id: "answer", class: "answer-box" }, h("span", { class: "small-label" }, "One way to do it"), h("pre", { class: "answer" }, t.solution));

  function syncReveal() {
    revealBtn.hidden = !(revealAllowed(wrong) && !solved && !revealed);
  }
  // Keeps the new message visible inside the scrolling panel (never scrolls the page).
  const showFeedback = slot.show;

  async function onCheck() {
    if (busy) return;
    busy = true;
    checkBtn.disabled = true;
    checkBtn.textContent = "Running…";
    const exprs = t.checks.map((c) => c.expr);
    const { run: r, values } = await safeEval(box.value, exprs);
    busy = false;
    checkBtn.disabled = false;
    checkBtn.textContent = "Run & check";

    if (isLoadFailure(r)) {
      // Not the student's fault: does not count as an attempt.
      showFeedback(false, "Python isn't ready", h("span", { class: "fb-msg" }, loadFailureNode()));
      return;
    }
    const verdict = judge(t, r, values);
    attempts += 1;
    attemptsEl.textContent = `Attempts: ${attempts}`;
    if (verdict.ok) solved = true;
    else wrong += 1;
    // Update the button row first: a newly shown "Show answer" button can wrap
    // onto a new line and push the feedback down.
    syncReveal();
    if (verdict.ok) {
      showFeedback(true, "Correct!", h("span", { class: "fb-msg" }, "That matches what we expected. Here is what printed:"), h("pre", {}, r.stdout.trimEnd()));
    } else {
      showFeedback(false, "Not quite yet", h("span", { class: "fb-msg" }, verdict.hint));
    }
  }

  checkBtn.addEventListener("click", onCheck);
  box.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      onCheck();
    }
  });
  resetBtn.addEventListener("click", () => {
    box.value = t.starter;
    attempts = wrong = 0;
    solved = revealed = false;
    attemptsEl.textContent = "Attempts: 0";
    slot.clear();
    answer.hidden = true;
    syncReveal();
    box.focus();
  });
  revealBtn.addEventListener("click", () => {
    revealed = true;
    answer.hidden = false;
    syncReveal();
    // "Show answer" just hid itself: keep keyboard focus by moving it to the answer.
    focusRevealed(answer);
  });

  return h(
    "div",
    // Pfizer x Extern: "try-wide" puts a long starter (more than 8 lines) beside the task
    // (styles.css), so the whole Try fits the fixed embed stage. Same elements, same order.
    { class: "stack" + (rows > 8 ? " try-wide" : ""), style: "gap:12px" },
    h("div", { class: "try-head" }, h("h2", {}, "Try it yourself"), attemptsEl),
    h("p", { class: "lead", style: "font-size:15px" }, inline(t.prompt)),
    h("label", { for: "code-box", class: "small-label" }, "Your code"),
    box,
    h("div", { class: "row", style: "gap:10px" }, checkBtn, resetBtn, revealBtn),
    feedback,
    answer
  );
}

boot("concept", () => ({ labels: TAB_LABELS, builders: [whatPanel, examplePanel, demoPanel, tryPanel, (l) => learnPanel(l)] }));

return {  };
})();

// ---- stage.js ----
{
// Pfizer x Extern addition (not in the SME's engine): the fixed embed stage.
// The lesson is laid out on a fixed 760 px wide stage (height = --stage-h, set by
// build_lesson.py) and scaled as one piece to fit its iframe, like every other
// Pfizer 3.0 embed. Nothing scrolls: when a tab's content is taller than the step
// panel, the content zooms down a little (to ZOOM_MIN at most). Only if it still
// does not fit does the panel scroll, as the SME's original page always did.

const STAGE_W = 760;
const ZOOM_MIN = 0.8;

const root = document.documentElement;
const stage = document.getElementById("lesson");
const panels = document.getElementById("panels");

function stageH() {
  const v = parseFloat(getComputedStyle(root).getPropertyValue("--stage-h"));
  return Number.isFinite(v) && v > 0 ? v : 800;
}

function fitStage() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const H = stageH();
  const s = Math.min(w / STAGE_W, h / H);
  stage.style.transform = `translate(${(w - STAGE_W * s) / 2}px, ${(h - H * s) / 2}px) scale(${s})`;
}

function fitPanel() {
  const active = [...panels.children].find((el) => !el.hidden) || null;
  panels.classList.remove("overflow");
  if (!active) return;
  let z = 1;
  active.style.zoom = "1";
  while (panels.scrollHeight > panels.clientHeight + 1 && z > ZOOM_MIN) {
    z = Math.max(ZOOM_MIN, Math.round((z - 0.025) * 1000) / 1000);
    active.style.zoom = String(z);
  }
  if (panels.scrollHeight > panels.clientHeight + 1) panels.classList.add("overflow"); // last resort only
  else panels.scrollTop = 0;
  active.dataset.zoom = String(z);
}

let raf = 0;
function refit() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    fitStage();
    fitPanel();
  });
}

// Re-fit when the tab changes, when output or feedback appears, and when fonts arrive.
new MutationObserver(refit).observe(panels, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["hidden"] });
window.addEventListener("resize", refit);
document.addEventListener("lesson-ready", refit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
fitStage();

}
