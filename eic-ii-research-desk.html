<!DOCTYPE html>
<!--
  EIC Heritage — The Research Timeline (Perplexity -> Claude two-tool flow)
  A horizontal timeline the learner SCRUBS across. Hover (or click / keyboard-focus) each stop and the
  detail below reveals what happens there: the exact prompt to paste AND the reusable template, inline at
  the stage where it is used. Worked on one real example (AI data-center energy).

  SELF-CONTAINED: inline CSS + vanilla JS + inline SVG. ZERO external requests.
  Fixed 960x540, never scrolls in any state. System font stack. Brand palette only.

  TO EDIT CONTENT: everything lives in the DATA section below (NODES + the DETAIL strings).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EIC Heritage Research Timeline</title>
<style>
  :root{
    --bg:#FDF8F8; --ink:#1C1B1B; --body:#484646; --accent:#001D69;
    --hl:#DCE1FF; --white:#FFFFFF; --line:#ECE6EE; --muted:#8A8693;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
  }
  #stage{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;}
  #wrapper{width:960px;height:540px;position:relative;overflow:hidden;background:var(--bg);transform-origin:top center;}

  /* ---- title bar ---- */
  .titlebar{height:50px;display:flex;align-items:center;gap:11px;padding:0 24px;border-bottom:1px solid var(--line);}
  .tb-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tb-mark svg{width:17px;height:17px;}
  .tb-title{font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:.1px;}
  .tb-title span{font-weight:500;color:var(--muted);}

  /* =========================================================
     TIMELINE band
     ========================================================= */
  .tl{position:relative;height:146px;margin:0 8px;}
  .tl-hint{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:11px;font-weight:600;color:var(--muted);}
  .tl-hint b{color:var(--accent);font-weight:800;}
  .spine{position:absolute;top:78px;left:12.5%;width:75%;height:3px;border-radius:3px;background:var(--line);}
  .fill{position:absolute;top:78px;left:12.5%;height:3px;border-radius:3px;background:var(--accent);transition:width .22s ease;}
  .node{position:absolute;top:58px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:9px;width:150px;background:transparent;border:none;cursor:pointer;font-family:inherit;padding:0;}
  .dot{width:42px;height:42px;border-radius:50%;background:var(--white);border:2.5px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative;z-index:2;transition:all .18s ease;}
  .dot svg{width:20px;height:20px;}
  .dot .n{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--white);border:1.5px solid var(--line);color:var(--muted);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .node .lab{font-size:12px;font-weight:700;color:var(--muted);line-height:1.15;text-align:center;transition:color .18s ease;}
  .node .lab small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:1px;}
  .node:hover .dot,.node.on .dot{border-color:var(--accent);color:#fff;background:var(--accent);}
  .node:hover .dot .n,.node.on .dot .n{border-color:var(--accent);color:var(--accent);}
  .node.on .dot{box-shadow:0 0 0 5px rgba(0,29,105,.12);}
  .node:hover .lab,.node.on .lab{color:var(--ink);}
  .node.on .lab small{color:var(--accent);font-weight:700;}

  /* =========================================================
     DETAIL card
     ========================================================= */
  .detail{position:relative;height:344px;padding:16px 30px 18px;border-top:1px solid var(--line);}
  .d-inner{height:100%;}
  .kicker{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
  .zpill{font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--accent);background:var(--hl);padding:4px 11px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
  .zpill svg{width:13px;height:13px;}
  .d-title{font-size:19px;font-weight:800;color:var(--ink);line-height:1.15;margin-bottom:5px;}
  .d-lead{font-size:12.5px;color:var(--body);line-height:1.5;margin-bottom:11px;}
  .d-lead b{color:var(--ink);font-weight:700;}

  /* question chips (pick) */
  .qgrid{display:flex;flex-direction:column;gap:6px;}
  .qrow{display:flex;align-items:center;gap:11px;background:var(--white);border:1px solid #EAE4EE;border-radius:9px;padding:8px 12px;}
  .qtag{font-size:9.5px;font-weight:800;letter-spacing:.5px;color:var(--accent);width:104px;flex-shrink:0;}
  .qtxt{font-size:12px;color:var(--body);line-height:1.3;}

  /* prompt box */
  .promptbox{background:var(--white);border:1.5px solid #E4DEEE;border-radius:12px;padding:11px 14px;position:relative;}
  .pb-lbl{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:800;letter-spacing:.9px;color:var(--muted);margin-bottom:6px;}
  .pb-lbl .ic{width:15px;height:15px;color:var(--accent);}
  .pb-lbl .ic svg{width:15px;height:15px;}
  .pb-txt{font-size:13px;line-height:1.5;color:var(--ink);font-weight:600;}

  /* answer + source */
  .answer{margin-top:10px;font-size:12px;line-height:1.5;color:var(--body);}
  .answer b{color:var(--ink);font-weight:800;}
  .srcpill{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--hl);padding:4px 9px;border-radius:99px;}
  .srcpill svg{width:12px;height:12px;}

  /* reusable template line */
  .tmplline{display:flex;align-items:flex-start;gap:9px;margin-top:11px;background:var(--hl);border-radius:10px;padding:9px 12px;}
  .tmplline .ic{width:18px;height:18px;color:var(--accent);flex-shrink:0;margin-top:1px;}
  .tmplline .ic svg{width:18px;height:18px;}
  .tmplline .tt{font-size:11.5px;line-height:1.45;color:var(--ink);}
  .tmplline .tt b{font-weight:800;color:var(--accent);}
  .tmplline .tt mark{background:var(--white);color:var(--accent);font-weight:700;padding:0 3px;border-radius:3px;}

  /* claude bullets */
  .bullets{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .blt{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.4;color:var(--body);}
  .blt .bi{width:18px;height:18px;border-radius:6px;background:var(--hl);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
  .blt .bi svg{width:11px;height:11px;}
  .blt b{color:var(--ink);font-weight:700;}

  /* standout */
  .standout{display:flex;align-items:flex-start;gap:11px;background:var(--hl);border-radius:12px;padding:13px 15px;margin-top:4px;}
  .standout .si{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .standout .si svg{width:17px;height:17px;}
  .standout .sk{font-size:9.5px;font-weight:800;letter-spacing:.9px;color:var(--accent);margin-bottom:3px;}
  .standout .st{font-size:13.5px;color:var(--ink);line-height:1.45;}
  .standout .st b{font-weight:800;}
</style>
</head>
<body>
<div id="stage">
  <div id="wrapper">

    <!-- TITLE BAR -->
    <div class="titlebar">
      <div class="tb-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
      </div>
      <div class="tb-title">Researching a focus area <span>&middot; the two-tool flow, on one real example</span></div>
    </div>

    <!-- TIMELINE -->
    <div class="tl">
      <div class="tl-hint"><b>Hover each stop</b> to see the prompt to paste and the template to reuse.</div>
      <div class="spine"></div>
      <div class="fill" id="fill"></div>
      <div id="nodes"></div>
    </div>

    <!-- DETAIL -->
    <div class="detail"><div class="d-inner" id="detail"></div></div>

  </div>
</div>

<script>
/* ===================== ICONS ===================== */
const IC = {
  target:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/><line x1="12" y1="1.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22.5" y2="12"/></svg>`,
  search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>`,
  spark:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.7 1.8L21.5 17.5 19.7 18.2 19 20l-.7-1.8L16.5 17.5l1.8-.7z"/></svg>`,
  star:`<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.9 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>`,
  starline:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.9 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>`,
  link:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>`,
  recycle:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6l2.5-3.5L14 4"/><path d="M4.5 12L3 8l4-1"/><path d="M17 8l3 1-1 4"/><path d="M20 15l-2.5 3.5L13 17"/><path d="M4 15l1 4 4-1"/></svg>`,
  paste:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="12" height="16" rx="2"/><path d="M8 8H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 6.5"/></svg>`
};

/* ===================== DATA ===================== */
const FOCUS = "AI data-center energy demand";

const NODES = [
  {id:"pick",    num:1, label:"Pick it",     sub:"the focus area",  icon:"target"},
  {id:"pplx",    num:2, label:"Perplexity",  sub:"cast the net",    icon:"search"},
  {id:"claude",  num:3, label:"Claude",      sub:"go deeper",       icon:"spark"},
  {id:"capture", num:4, label:"Capture",     sub:"flag the number", icon:"starline"}
];

function detailPick(){
  const rows = [
    ["WHAT IT IS","What is your focus area, in plain terms?"],
    ["WHAT IT IS","What are the key terms someone needs to follow it?"],
    ["WHY IT MATTERS","Why does it matter to oil and gas?"],
    ["WHY IT MATTERS","What are the key numbers that show its impact?"],
    ["WHY IT MATTERS","How does it show up in operations, and what does it cost?"]
  ].map(r=>`<div class="qrow"><span class="qtag">${r[0]}</span><span class="qtxt">${r[1]}</span></div>`).join("");
  return kick("target","STEP 1 &middot; PICK IT")
    + `<h2 class="d-title">Start with the focus area and its five questions</h2>`
    + `<p class="d-lead">You have picked <b>${FOCUS}</b>. The whole session fills in five questions: two on <b>what it is</b>, three on <b>why it matters to oil and gas</b>.</p>`
    + `<div class="qgrid">${rows}</div>`;
}

function detailPplx(){
  return kick("search","STEP 2 &middot; PERPLEXITY")
    + `<h2 class="d-title">Cast the wide net with one strong query</h2>`
    + `<div class="promptbox">`
      + `<div class="pb-lbl"><span class="ic">${IC.paste}</span>PASTE THIS INTO PERPLEXITY (RESEARCH MODE)</div>`
      + `<div class="pb-txt">What is the AI data-center electricity surge, how does it work, and why does it matter to oil and gas? Give specific figures, timeframes, and sources.</div>`
      + `<div class="answer"><b>What comes back:</b> US data-center electricity was about <b>176 TWh in 2023</b> (roughly 4.4% of US power) and is projected to reach <b>325 to 580 TWh by 2028</b>, up to 12% of the grid.<br><span class="srcpill">${IC.link} LBNL 2024 Data Center Energy Usage Report, via US DOE</span></div>`
    + `</div>`
    + `<div class="tmplline"><span class="ic">${IC.recycle}</span><span class="tt"><b>Reuse this template:</b> What is <mark>[your focus area]</mark>, how does it work, and why does it matter to oil and gas? Give specific figures, timeframes, and sources.</span></div>`;
}

function detailClaude(){
  return kick("spark","STEP 3 &middot; CLAUDE")
    + `<h2 class="d-title">Go deeper: pressure-test what you found</h2>`
    + `<div class="promptbox">`
      + `<div class="pb-lbl"><span class="ic">${IC.paste}</span>PASTE YOUR FINDINGS INTO CLAUDE, THEN ASK</div>`
      + `<div class="pb-txt">Which of these numbers should I double-check or find a stronger source for? What am I still missing? Suggest things to look up, but do not invent any numbers.</div>`
      + `<div class="bullets">`
        + `<div class="blt"><span class="bi">${IC.spark}</span><span>The <b>60% gas share</b> is one bank's estimate. Find a second source before you lean on it.</span></div>`
        + `<div class="blt"><span class="bi">${IC.spark}</span><span>You have the demand, but not the <b>bottleneck</b>. Look up gas-turbine lead times.</span></div>`
      + `</div>`
    + `</div>`
    + `<div class="tmplline"><span class="ic">${IC.recycle}</span><span class="tt"><b>Reuse this template:</b> Here are my findings with sources for <mark>[your focus area]</mark>. Which numbers should I double-check? What am I missing? Suggest things to look up, but do not invent numbers.</span></div>`;
}

function detailCapture(){
  return kick("starline","STEP 4 &middot; CAPTURE")
    + `<h2 class="d-title">Flag the one number a partner would remember</h2>`
    + `<p class="d-lead">Every row of your doc now holds a cited fact. The last move is to pick the standout number and star it, so your brief has a clear headline.</p>`
    + `<div class="standout"><span class="si">${IC.star}</span><div><div class="sk">YOUR STANDOUT NUMBER</div><div class="st">AI data centers could draw <b>up to 12% of all US electricity by 2028</b>, and most of the new demand is set to be met by <b>natural gas</b>. That is the demand tailwind a gas partner cannot wave away.</div></div></div>`;
}

const RENDER = {pick:detailPick, pplx:detailPplx, claude:detailClaude, capture:detailCapture};

/* ===================== ENGINE ===================== */
function kick(icon,tag){ return `<div class="kicker"><span class="zpill">${IC[icon]} ${tag}</span></div>`; }

const nodesEl = document.getElementById("nodes");
const fillEl  = document.getElementById("fill");
const detailEl= document.getElementById("detail");
let active = 0;

// place nodes at even centers: 12.5, 37.5, 62.5, 87.5 (%)
function nodeLeft(i){ return 12.5 + i*25; }
nodesEl.innerHTML = NODES.map((n,i)=>`
  <button class="node" data-i="${i}" style="left:${nodeLeft(i)}%" aria-label="${n.label}, ${n.sub}">
    <span class="dot">${IC[n.icon]}<span class="n">${n.num}</span></span>
    <span class="lab">${n.label}<small>${n.sub}</small></span>
  </button>`).join("");

function setActive(i){
  active = i;
  document.querySelectorAll(".node").forEach((el,k)=>el.classList.toggle("on", k===i));
  fillEl.style.width = (i*25) + "%";
  detailEl.innerHTML = RENDER[NODES[i].id]();
}

// hover to scrub, click + keyboard for touch / a11y
document.querySelectorAll(".node").forEach(el=>{
  const i = +el.getAttribute("data-i");
  el.addEventListener("mouseenter", ()=>setActive(i));
  el.addEventListener("click", ()=>setActive(i));
  el.addEventListener("focus", ()=>setActive(i));
});

/* optional deep-link for QA: #pick #pplx #claude #capture */
(function(){
  const h=(location.hash||"").replace("#","");
  const k=NODES.findIndex(n=>n.id===h);
  if(k>-1) active=k;
})();

/* scale-to-fit for Notion embeds */
function scaleDeck(){
  const w = document.getElementById("wrapper");
  const s = Math.min(window.innerWidth/960, window.innerHeight/540, 1);
  w.style.transform = `scale(${s})`;
  w.style.transformOrigin = "top center";
}
window.addEventListener("resize", scaleDeck);
scaleDeck();
setActive(active);
</script>
</body>
</html>
