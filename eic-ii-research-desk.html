<!DOCTYPE html>
<!--
  EIC Heritage — The Research Timeline (Perplexity -> Claude two-tool flow)
  A horizontal timeline the learner SCRUBS across. Three stops: Perplexity -> Claude -> Capture.
  Hover (or click / keyboard-focus) each stop and the detail below reveals WHAT TO DO at that stage
  plus a reusable PROMPT TEMPLATE with [placeholders] the learner swaps in for their own focus area.

  SELF-CONTAINED: inline CSS + vanilla JS + inline SVG. ZERO external requests.
  Fixed 960x540, never scrolls in any state. System font stack. Brand palette only.

  TO EDIT CONTENT: everything lives in the DATA section below (NODES + the DETAIL render functions).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EIC Heritage Research Timeline</title>
<style>
  :root{
    --bg:#FDF8F8; --ink:#1C1B1B; --body:#484646; --accent:#001D69;
    --hl:#DCE1FF; --white:#FFFFFF; --line:#ECE6EE; --muted:#8A8693;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
  }
  #stage{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;}
  #wrapper{width:960px;height:540px;position:relative;overflow:hidden;background:var(--bg);transform-origin:top center;}

  /* ---- title bar ---- */
  .titlebar{height:50px;display:flex;align-items:center;gap:11px;padding:0 24px;border-bottom:1px solid var(--line);}
  .tb-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tb-mark svg{width:17px;height:17px;}
  .tb-title{font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:.1px;}
  .tb-title span{font-weight:500;color:var(--muted);}

  /* =========================================================
     TIMELINE band
     ========================================================= */
  .tl{position:relative;height:128px;margin:0 8px;}
  .tl-hint{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:11px;font-weight:600;color:var(--muted);}
  .tl-hint b{color:var(--accent);font-weight:800;}
  .spine{position:absolute;top:64px;left:16.666%;width:66.666%;height:3px;border-radius:3px;background:var(--line);}
  .fill{position:absolute;top:64px;left:16.666%;height:3px;border-radius:3px;background:var(--accent);transition:width .22s ease;}
  .node{position:absolute;top:44px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:9px;width:150px;background:transparent;border:none;cursor:pointer;font-family:inherit;padding:0;}
  .dot{width:42px;height:42px;border-radius:50%;background:var(--white);border:2.5px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative;z-index:2;transition:all .18s ease;}
  .dot svg{width:20px;height:20px;}
  .dot .n{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--white);border:1.5px solid var(--line);color:var(--muted);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .node .lab{font-size:12px;font-weight:700;color:var(--muted);line-height:1.15;text-align:center;transition:color .18s ease;}
  .node .lab small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:1px;}
  .node:hover .dot,.node.on .dot{border-color:var(--accent);color:#fff;background:var(--accent);}
  .node:hover .dot .n,.node.on .dot .n{border-color:var(--accent);color:var(--accent);}
  .node.on .dot{box-shadow:0 0 0 5px rgba(0,29,105,.12);}
  .node:hover .lab,.node.on .lab{color:var(--ink);}
  .node.on .lab small{color:var(--accent);font-weight:700;}

  /* =========================================================
     DETAIL card
     ========================================================= */
  .detail{position:relative;height:362px;padding:14px 30px 18px;border-top:1px solid var(--line);}
  .d-inner{height:100%;}
  .kicker{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
  .zpill{font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--accent);background:var(--hl);padding:4px 11px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
  .zpill svg{width:13px;height:13px;}
  .d-title{font-size:19px;font-weight:800;color:var(--ink);line-height:1.15;margin-bottom:8px;}
  .d-lead{font-size:12.5px;color:var(--body);line-height:1.5;margin-bottom:11px;}
  .d-lead b{color:var(--ink);font-weight:700;}

  /* WHAT TO DO block */
  .blocklbl{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:800;letter-spacing:.9px;color:var(--muted);margin:0 0 8px;}
  .blocklbl .ic{width:15px;height:15px;color:var(--accent);display:flex;align-items:center;justify-content:center;}
  .blocklbl .ic svg{width:14px;height:14px;}
  .steps{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;}
  .stp{display:flex;align-items:flex-start;gap:10px;font-size:12px;line-height:1.4;color:var(--body);}
  .stp .sn{width:19px;height:19px;border-radius:50%;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
  .stp b{color:var(--ink);font-weight:700;}

  /* prompt template box */
  .promptbox{background:var(--white);border:1.5px solid #E4DEEE;border-radius:12px;padding:11px 14px;}
  .pb-lbl{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:800;letter-spacing:.9px;color:var(--muted);margin-bottom:6px;}
  .pb-lbl .ic{width:15px;height:15px;color:var(--accent);}
  .pb-lbl .ic svg{width:15px;height:15px;}
  .pb-txt{font-size:12.5px;line-height:1.5;color:var(--ink);font-weight:600;}
  .pb-txt mark{background:var(--hl);color:var(--accent);font-weight:800;padding:0 4px;border-radius:4px;}

  /* takeaway line (capture) */
  .tmplline{display:flex;align-items:flex-start;gap:9px;margin-top:2px;background:var(--hl);border-radius:10px;padding:10px 13px;}
  .tmplline .ic{width:20px;height:20px;color:var(--accent);flex-shrink:0;margin-top:1px;}
  .tmplline .ic svg{width:20px;height:20px;}
  .tmplline .tt{font-size:12px;line-height:1.5;color:var(--ink);}
  .tmplline .tt b{font-weight:800;color:var(--accent);}
</style>
</head>
<body>
<div id="stage">
  <div id="wrapper">

    <!-- TITLE BAR -->
    <div class="titlebar">
      <div class="tb-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
      </div>
      <div class="tb-title">Researching a focus area <span>&middot; the two-tool flow, step by step</span></div>
    </div>

    <!-- TIMELINE -->
    <div class="tl">
      <div class="tl-hint"><b>Hover each stop</b> to see what to do and the prompt template to reuse.</div>
      <div class="spine"></div>
      <div class="fill" id="fill"></div>
      <div id="nodes"></div>
    </div>

    <!-- DETAIL -->
    <div class="detail"><div class="d-inner" id="detail"></div></div>

  </div>
</div>

<script>
/* ===================== ICONS ===================== */
const IC = {
  search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>`,
  spark:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.7 1.8L21.5 17.5 19.7 18.2 19 20l-.7-1.8L16.5 17.5l1.8-.7z"/></svg>`,
  star:`<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.9 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>`,
  starline:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.9 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>`,
  recycle:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6l2.5-3.5L14 4"/><path d="M4.5 12L3 8l4-1"/><path d="M17 8l3 1-1 4"/><path d="M20 15l-2.5 3.5L13 17"/><path d="M4 15l1 4 4-1"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 6.5"/></svg>`
};

/* ===================== DATA ===================== */
const NODES = [
  {id:"pplx",    num:1, label:"Perplexity",  sub:"cast the net",    icon:"search"},
  {id:"claude",  num:2, label:"Claude",      sub:"verify + build",  icon:"spark"},
  {id:"capture", num:3, label:"Capture",     sub:"flag the number", icon:"starline"}
];

/* helpers */
function kick(icon,tag){ return `<div class="kicker"><span class="zpill">${IC[icon]} ${tag}</span></div>`; }
function whatToDo(items){
  const li = items.map((t,i)=>`<div class="stp"><span class="sn">${i+1}</span><span>${t}</span></div>`).join("");
  return `<div class="blocklbl"><span class="ic">${IC.check}</span>WHAT TO DO</div><div class="steps">${li}</div>`;
}
function promptTemplate(txt){
  return `<div class="promptbox"><div class="pb-lbl"><span class="ic">${IC.recycle}</span>PROMPT TEMPLATE &middot; SWAP IN YOUR FOCUS AREA</div><div class="pb-txt">${txt}</div></div>`;
}

/* ---- detail per stop ---- */
function detailPplx(){
  return kick("search","STEP 1 &middot; PERPLEXITY")
    + `<h2 class="d-title">Cast the wide net in Perplexity</h2>`
    + `<p class="d-lead">Your brief has two parts: <b>what your focus area is</b>, and <b>why it matters to oil and gas</b>. Ask a strong question for each.</p>`
    + whatToDo([
        `Open Perplexity and turn on <b>Research mode</b>.`,
        `Ask one strong question for each part of your brief. Name the figures and timeframes you want, and always ask for sources.`,
        `As answers come back, paste each finding and its source straight into your doc.`,
        `Batch related questions so you do not burn your daily Research runs.`
      ])
    + promptTemplate(`What is <mark>[your focus area]</mark>, how does it work, and why does it matter to oil and gas? Give specific figures, timeframes, and a named source for every claim. Cover the key terms someone needs to follow it, the main numbers that show its impact, and what has changed recently. Flag anything where the data looks thin or uncertain.`);
}

function detailClaude(){
  return kick("spark","STEP 2 &middot; CLAUDE")
    + `<h2 class="d-title">Verify with Claude, then build the doc</h2>`
    + whatToDo([
        `Copy everything Perplexity gave you, findings and sources, and paste it into Claude.`,
        `Ask Claude to <b>double-check the numbers</b> and flag anything weak or missing. Tell it not to invent numbers.`,
        `Ask Claude to <b>build your research brief</b> from the verified findings.`,
        `Attach the sample brief and ask Claude to <b>keep the headings the same</b>.`,
        `Read the doc through and check every number against its source before you trust it.`
      ])
    + promptTemplate(`Here are my Perplexity findings with sources for <mark>[your focus area]</mark>: <mark>[paste them]</mark>. Double-check these numbers, tell me which are weak or need a stronger source, and what is missing. Do not invent numbers. Then write a research brief from the verified findings, and use the attached sample brief as the template so the headings match exactly.`);
}

function detailCapture(){
  return kick("starline","STEP 3 &middot; CAPTURE")
    + `<h2 class="d-title">Flag the one number a partner would remember</h2>`
    + whatToDo([
        `Read your finished brief through once more.`,
        `Pick the single number that best shows why your focus area matters to oil and gas.`,
        `Star it at the top of your doc so your brief has a clear headline.`
      ])
    + `<div class="tmplline"><span class="ic">${IC.star}</span><span class="tt"><b>This is your headline.</b> If someone reads one line of your brief, make it the line that shows why your focus area matters to oil and gas.</span></div>`;
}

const RENDER = {pplx:detailPplx, claude:detailClaude, capture:detailCapture};

/* ===================== ENGINE ===================== */
const nodesEl = document.getElementById("nodes");
const fillEl  = document.getElementById("fill");
const detailEl= document.getElementById("detail");
let active = 0;

// place nodes at even centers for 3 stops: 16.666, 50, 83.333 (%)
function nodeLeft(i){ return 16.666 + i*33.333; }
nodesEl.innerHTML = NODES.map((n,i)=>`
  <button class="node" data-i="${i}" style="left:${nodeLeft(i)}%" aria-label="${n.label}, ${n.sub}">
    <span class="dot">${IC[n.icon]}<span class="n">${n.num}</span></span>
    <span class="lab">${n.label}<small>${n.sub}</small></span>
  </button>`).join("");

function setActive(i){
  active = i;
  document.querySelectorAll(".node").forEach((el,k)=>el.classList.toggle("on", k===i));
  fillEl.style.width = (i*33.333) + "%";
  detailEl.innerHTML = RENDER[NODES[i].id]();
}

// hover to scrub, click + keyboard for touch / a11y
document.querySelectorAll(".node").forEach(el=>{
  const i = +el.getAttribute("data-i");
  el.addEventListener("mouseenter", ()=>setActive(i));
  el.addEventListener("click", ()=>setActive(i));
  el.addEventListener("focus", ()=>setActive(i));
});

/* optional deep-link for QA: #pplx #claude #capture */
(function(){
  const h=(location.hash||"").replace("#","");
  const k=NODES.findIndex(n=>n.id===h);
  if(k>-1) active=k;
})();

/* scale-to-fit for Notion embeds */
function scaleDeck(){
  const w = document.getElementById("wrapper");
  const s = Math.min(window.innerWidth/960, window.innerHeight/540, 1);
  w.style.transform = `scale(${s})`;
  w.style.transformOrigin = "top center";
}
window.addEventListener("resize", scaleDeck);
scaleDeck();
setActive(active);
</script>
</body>
</html>
