<!DOCTYPE html>
<!--
  EIC Heritage — The Research Desk (Perplexity -> Claude two-tool walkthrough)
  A click-through of ONE real research session on the AI data-center focus area.
  Four stops: Pick the focus area -> Perplexity (wide net) -> Claude (deep dig) -> Flag the number.
  Plus a pinned "Your template" panel with the two reusable query templates.

  SELF-CONTAINED: inline CSS + vanilla JS + inline SVG. ZERO external requests.
  Fixed 960x540, never scrolls in any state. System font stack. Brand palette only.

  TO EDIT CONTENT: everything lives in the DATA section below (STOPS, PPLX, CLAUDE_*, DOC_ROWS, TEMPLATES).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EIC Heritage Research Desk</title>
<style>
  :root{
    --bg:#FDF8F8; --ink:#1C1B1B; --body:#484646; --accent:#001D69;
    --hl:#DCE1FF; --white:#FFFFFF; --line:#ECE6EE; --muted:#8A8693;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
  }
  #stage{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;}
  #wrapper{width:960px;height:540px;position:relative;overflow:hidden;background:var(--bg);transform-origin:top center;}

  /* ---- title bar ---- */
  .titlebar{height:52px;display:flex;align-items:center;gap:11px;padding:0 24px;border-bottom:1px solid var(--line);}
  .tb-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tb-mark svg{width:17px;height:17px;}
  .tb-title{font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:.1px;}
  .tb-title span{font-weight:500;color:var(--muted);}

  /* ---- main split ---- */
  .main{display:flex;height:488px;}
  .rail{width:270px;flex-shrink:0;border-right:1px solid var(--line);padding:18px 16px 14px;display:flex;flex-direction:column;}
  .right{flex:1;position:relative;overflow:hidden;}
  #panel{position:absolute;inset:0;padding:20px 26px 16px;display:flex;flex-direction:column;}

  /* ---- left rail: stepper ---- */
  .rail-lead{font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--muted);margin:0 4px 12px;}
  .stops{position:relative;}
  .stops::before{content:"";position:absolute;left:20px;top:20px;bottom:20px;width:2px;background:var(--line);}
  .stop{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:none;cursor:pointer;font-family:inherit;padding:8px 8px;border-radius:11px;transition:background .12s ease;z-index:1;}
  .stop:hover{background:#F5F2FA;}
  .stop.is-active{background:var(--hl);}
  .badge{width:26px;height:26px;border-radius:50%;background:var(--white);border:2px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;transition:all .12s ease;}
  .stop.is-active .badge{background:var(--accent);border-color:var(--accent);color:#fff;}
  .stop.is-done .badge{background:var(--accent);border-color:var(--accent);color:#fff;}
  .stop-txt{min-width:0;}
  .stop-tag{display:block;font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--accent);line-height:1.1;}
  .stop-label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.25;margin-top:2px;}
  .stop.is-active .stop-label{font-weight:700;}

  .rail-sep{flex:1;}
  .tmpl-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--white);border:1.5px solid #E4DEEE;cursor:pointer;font-family:inherit;padding:10px 12px;border-radius:11px;transition:all .12s ease;}
  .tmpl-btn:hover{border-color:var(--accent);background:#F7F5FF;}
  .tmpl-btn.is-active{border-color:var(--accent);background:var(--hl);}
  .tmpl-ico{width:24px;height:24px;color:var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .tmpl-ico svg{width:20px;height:20px;}
  .tmpl-txt b{font-size:12.5px;font-weight:800;color:var(--ink);display:block;line-height:1.2;}
  .tmpl-txt span{font-size:11px;color:#6A6672;line-height:1.2;}

  /* ---- right panel shared ---- */
  .kicker{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
  .zpill{font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--accent);background:var(--hl);padding:4px 10px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
  .zpill svg{width:13px;height:13px;}
  .stepcount{font-size:11px;font-weight:600;color:var(--muted);}
  .p-title{font-size:20px;font-weight:800;color:var(--ink);line-height:1.15;margin-bottom:6px;}
  .p-lead{font-size:12.5px;color:var(--body);line-height:1.5;margin-bottom:13px;}
  .p-lead b{color:var(--ink);font-weight:700;}
  .body{flex:1;min-height:0;}

  /* ---- tool card (Perplexity / Claude mock) ---- */
  .toolcard{background:var(--white);border:1.5px solid #E7E1EF;border-radius:13px;overflow:hidden;}
  .tc-head{display:flex;align-items:center;gap:8px;padding:8px 13px;border-bottom:1px solid var(--line);background:#FBFAFD;}
  .tc-head .ic{width:18px;height:18px;color:var(--accent);display:flex;align-items:center;justify-content:center;}
  .tc-head .ic svg{width:17px;height:17px;}
  .tc-head b{font-size:12px;font-weight:800;color:var(--ink);}
  .tc-mode{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.6px;color:var(--accent);background:var(--hl);padding:3px 8px;border-radius:99px;}
  .tc-q{padding:11px 14px;font-size:12.5px;line-height:1.5;color:var(--ink);font-weight:600;}
  .tc-ans{padding:2px 14px 12px;}
  .tc-ans .lbl{font-size:9.5px;font-weight:800;letter-spacing:.8px;color:var(--muted);margin-bottom:5px;}
  .tc-ans p{font-size:12.5px;line-height:1.55;color:var(--body);}
  .tc-ans b{color:var(--ink);font-weight:800;}
  .srcpill{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:11px;font-weight:700;color:var(--accent);background:var(--hl);padding:4px 9px;border-radius:99px;}
  .srcpill svg{width:12px;height:12px;}

  /* chips */
  .chips{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap;}
  .chip{font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--body);background:var(--white);border:1.5px solid #E4DEEE;padding:5px 12px;border-radius:99px;transition:all .12s ease;}
  .chip:hover{border-color:var(--accent);}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* annotation checks */
  .checks{display:flex;gap:14px;margin-top:11px;padding-top:11px;border-top:1px dashed #E0D9EA;}
  .check{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--accent);}
  .check svg{width:14px;height:14px;flex-shrink:0;}

  /* claude bubbles */
  .bubbles{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .bubble{display:flex;align-items:flex-start;gap:9px;background:#F4F2FA;border:1px solid #E4DEEE;border-radius:11px;padding:9px 12px;}
  .bubble-ico{width:22px;height:22px;border-radius:7px;background:var(--hl);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .bubble-ico svg{width:13px;height:13px;}
  .bubble p{font-size:12px;line-height:1.45;color:var(--body);}
  .bubble b{color:var(--ink);font-weight:700;}

  /* flag / working doc */
  .docrows{display:flex;flex-direction:column;gap:6px;}
  .docrow{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid #EAE4EE;border-radius:9px;padding:7px 11px;}
  .docrow.star{border-color:var(--accent);background:#F7F5FF;box-shadow:0 0 0 1px var(--accent);}
  .dr-q{font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--accent);width:118px;flex-shrink:0;line-height:1.2;}
  .dr-a{flex:1;font-size:11.5px;color:var(--body);line-height:1.35;min-width:0;}
  .dr-a b{color:var(--ink);font-weight:800;}
  .dr-src{font-size:9.5px;font-weight:700;color:var(--muted);background:var(--bg);padding:3px 7px;border-radius:99px;flex-shrink:0;white-space:nowrap;}
  .star-ic{width:16px;height:16px;color:var(--accent);flex-shrink:0;}
  .standout{display:flex;align-items:flex-start;gap:10px;background:var(--hl);border-radius:11px;padding:11px 13px;margin-top:11px;}
  .standout .si{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .standout .si svg{width:15px;height:15px;}
  .standout .sk{font-size:9.5px;font-weight:800;letter-spacing:.9px;color:var(--accent);margin-bottom:2px;}
  .standout .st{font-size:12.5px;color:var(--ink);line-height:1.4;}
  .standout .st b{font-weight:800;}

  /* template panel */
  .tcards{display:flex;flex-direction:column;gap:11px;}
  .tmpl-card{background:var(--white);border:1.5px solid #E7E1EF;border-radius:12px;padding:12px 14px;}
  .tmpl-card .th{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .tmpl-card .th .ic{width:20px;height:20px;color:var(--accent);}
  .tmpl-card .th .ic svg{width:19px;height:19px;}
  .tmpl-card .th b{font-size:12.5px;font-weight:800;color:var(--ink);}
  .tmpl-card .th .who{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.5px;color:var(--accent);background:var(--hl);padding:3px 8px;border-radius:99px;}
  .tmpl-card .q{font-size:12.5px;line-height:1.55;color:var(--body);font-style:italic;}
  .tmpl-card .q mark{background:var(--hl);color:var(--accent);font-weight:700;font-style:normal;padding:0 3px;border-radius:3px;}
  .tmpl-note{font-size:11.5px;color:#6A6672;line-height:1.45;margin-top:4px;}

  /* footer / next */
  .foot{display:flex;align-items:center;margin-top:12px;}
  .foot-hint{font-size:11px;color:var(--muted);}
  .nextbtn{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 15px;border-radius:9px;transition:opacity .12s ease;}
  .nextbtn:hover{opacity:.9;}
  .nextbtn svg{width:15px;height:15px;}
</style>
</head>
<body>
<div id="stage">
  <div id="wrapper">

    <!-- TITLE BAR -->
    <div class="titlebar">
      <div class="tb-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
      </div>
      <div class="tb-title">Researching a focus area <span>&middot; the two-tool flow, worked on one real example</span></div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <!-- LEFT: stepper -->
      <div class="rail">
        <div class="rail-lead">THE FLOW</div>
        <div class="stops" id="stops"></div>
        <div class="rail-sep"></div>
        <button class="tmpl-btn" id="tmplBtn">
          <span class="tmpl-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="12" height="16" rx="2"/><path d="M8 8H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2"/><line x1="11" y1="9" x2="17" y2="9"/><line x1="11" y1="13" x2="17" y2="13"/></svg></span>
          <span class="tmpl-txt"><b>Your template</b><span>reuse it for your focus area</span></span>
        </button>
      </div>

      <!-- RIGHT: content -->
      <div class="right"><div id="panel"></div></div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   ICONS
   ===================================================================== */
const IC = {
  target:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/><line x1="12" y1="1.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22.5" y2="12"/></svg>`,
  search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>`,
  spark:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.7 1.8L21.5 17.5 19.7 18.2 19 20l-.7-1.8L16.5 17.5l1.8-.7z"/></svg>`,
  star:`<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.9 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>`,
  starline:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.9 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>`,
  clip:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="12" height="16" rx="2"/><path d="M8 8H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2"/></svg>`,
  chevR:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 6.5"/></svg>`,
  link:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>`,
  quill:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c8-1 12-5 15-13 0 0-1 6-6 9-3 2-6 2-9 4z"/><path d="M6.5 17.5C10 14 13 12 17 11"/></svg>`,
  doc:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg>`
};

/* =====================================================================
   DATA  (edit here; UI re-renders)
   ===================================================================== */
const STOPS = [
  {id:"pick",  num:1, tag:"PICK IT",    label:"Choose the focus area", icon:"target"},
  {id:"pplx",  num:2, tag:"PERPLEXITY", label:"Cast the wide net",     icon:"search"},
  {id:"claude",num:3, tag:"CLAUDE",     label:"Go deeper",             icon:"spark"},
  {id:"flag",  num:4, tag:"CAPTURE",    label:"Flag the standout number", icon:"starline"}
];

// The example focus area every stop works on:
const FOCUS = "AI data-center energy demand";

// The five questions the brief must answer (mirrors the working doc).
const QS = [
  {part:"WHAT IT IS", q:"What is your focus area, in plain terms?"},
  {part:"WHAT IT IS", q:"What are the key terms someone needs to follow it?"},
  {part:"WHY IT MATTERS", q:"Why does it matter to oil and gas?"},
  {part:"WHY IT MATTERS", q:"What are the key numbers that show its impact?"},
  {part:"WHY IT MATTERS", q:"How does it show up in operations, and what does it cost?"}
];

// Perplexity stop: three selectable sample queries, each with a realistic cited answer.
const PPLX = [
  {
    chip:"What it is",
    q:`What is the AI data-center electricity surge, how does it work, and why does it matter to oil and gas? Give specific figures, timeframes, and sources.`,
    a:`US data-center electricity sat near <b>58 TWh in 2014</b>, climbed to about <b>176 TWh in 2023</b> (roughly 4.4% of all US electricity), and is projected to reach <b>325 to 580 TWh by 2028</b>, up to 12% of the grid.`,
    src:`LBNL 2024 Data Center Energy Usage Report, via US DOE`
  },
  {
    chip:"Why it matters to O&G",
    q:`How much of the new AI data-center power demand is expected to be met by natural gas, and what does that mean for US gas producers? Give figures and sources.`,
    a:`Analysts expect natural gas to supply roughly <b>60% of the near-term surge</b> in AI data-center power, with the rest from renewables and nuclear. That is a fresh demand tailwind for US gas producers.`,
    src:`Goldman Sachs, 2025`
  },
  {
    chip:"Key numbers",
    q:`How much are the largest US tech companies spending to build AI data centers, and how fast is it growing? Give figures and sources.`,
    a:`Combined capital spending by the four largest US tech companies is set to rise from about <b>$448B in 2025</b> to a guided <b>$725B in 2026</b>.`,
    src:`Tom's Hardware, 2025`
  }
];

const CLAUDE_PROMPT = `Here are my Perplexity findings with sources. Which numbers should I double-check or find a stronger source for? What am I still missing? Suggest specific things to look up, but do not invent any numbers.`;
const CLAUDE_REPLY = [
  `The <b>60% gas share</b> is a single-bank estimate. Find a second source, such as the EIA or IEA, before you lean on it.`,
  `You have the demand, but not the bottleneck. <b>Grid hookups and gas-turbine supply</b> are the real constraint. Look up turbine lead times.`,
  `Tie it back to oil and gas in plain numbers. A <b>volume of new gas demand</b> lands harder with a partner than a percentage does.`
];

const DOC_ROWS = [
  {q:"What it is", a:"Power-hungry buildings running AI models around the clock.", src:"DOE", star:false},
  {q:"Key terms", a:"TWh, load growth, baseload, behind-the-meter.", src:"IEA", star:false},
  {q:"Why it matters", a:"Most of the new power demand is set to be met by <b>natural gas</b>.", src:"Goldman Sachs", star:false},
  {q:"Key numbers", a:"176 TWh in 2023, up to <b>580 TWh by 2028</b> (up to 12% of US power).", src:"LBNL/DOE", star:true},
  {q:"Operations / cost", a:"Gas turbines now carry multi-year order backlogs.", src:"industry press", star:false}
];
const STANDOUT = `AI data centers could draw <b>up to 12% of all US electricity by 2028</b>, and most of the new demand is set to be met by <b>natural gas</b>. That is the demand tailwind a gas partner cannot wave away.`;

const TEMPLATES = [
  {
    who:"PERPLEXITY", icon:"search",
    q:`What is <mark>[your focus area]</mark>, how does it work, and why does it matter to oil and gas? Give specific figures, timeframes, and sources.`,
    note:"One strong, specific query. It names what you want, ties it to oil and gas, and asks for sources."
  },
  {
    who:"CLAUDE", icon:"spark",
    q:`Here are my findings with sources. Which numbers should I double-check or find a stronger source for? What am I missing? Suggest things to look up, but do not invent numbers.`,
    note:"Paste your Perplexity findings first, then send this. Claude pressure-tests them and points to the gaps."
  }
];

/* =====================================================================
   ENGINE
   ===================================================================== */
const panel = document.getElementById("panel");
const stopsEl = document.getElementById("stops");
const tmplBtn = document.getElementById("tmplBtn");
let cur = "pick";     // current stop id, or "tmpl"
let curPplx = 0;      // which sample query is open

// build the rail once
stopsEl.innerHTML = STOPS.map((s,i)=>`
  <button class="stop" data-stop="${s.id}">
    <span class="badge">${s.num}</span>
    <span class="stop-txt"><span class="stop-tag">${s.tag}</span><span class="stop-label">${s.label}</span></span>
  </button>`).join("");

function railState(){
  const idx = STOPS.findIndex(s=>s.id===cur);
  document.querySelectorAll(".stop").forEach((el,i)=>{
    el.classList.toggle("is-active", STOPS[i].id===cur);
    el.classList.toggle("is-done", idx>-1 && i<idx);
  });
  tmplBtn.classList.toggle("is-active", cur==="tmpl");
}

function kicker(icon, tag, count){
  const c = count ? `<span class="stepcount">${count}</span>` : "";
  return `<div class="kicker"><span class="zpill">${IC[icon]} ${tag}</span>${c}</div>`;
}
function foot(nextId, hint){
  const btn = nextId ? `<button class="nextbtn" data-next="${nextId}">${nextId==="tmpl"?"See the template":"Next"} ${IC.chevR}</button>` : "";
  return `<div class="foot"><span class="foot-hint">${hint||""}</span>${btn}</div>`;
}

function panelPick(){
  const qrows = QS.map((x,i)=>`
    <div class="docrow"><span class="dr-q">${x.part}</span><span class="dr-a">${x.q}</span></div>`).join("");
  return kicker("target","STOP 1 &middot; PICK IT","Step 1 of 4")
    + `<h2 class="p-title">Start with the focus area and its five questions</h2>`
    + `<p class="p-lead">You have picked <b>${FOCUS}</b>. Your brief answers five questions: two on <b>what it is</b>, three on <b>why it matters to oil and gas</b>. The whole research session exists to fill these in with cited facts.</p>`
    + `<div class="body"><div class="docrows">${qrows}</div></div>`
    + foot("pplx","Next, cast the wide net in Perplexity.");
}

function panelPplx(){
  const p = PPLX[curPplx];
  const chips = PPLX.map((x,i)=>`<button class="chip ${i===curPplx?'on':''}" data-pplx="${i}">${x.chip}</button>`).join("");
  return kicker("search","STOP 2 &middot; PERPLEXITY","Step 2 of 4")
    + `<h2 class="p-title">Cast the wide net with one strong query</h2>`
    + `<p class="p-lead">Perplexity reads many sources at once and cites each claim. Ask a sharp question and it hands you a sourced answer. Try each question below.</p>`
    + `<div class="chips">${chips}</div>`
    + `<div class="body"><div class="toolcard">`
      + `<div class="tc-head"><span class="ic">${IC.search}</span><b>Perplexity</b><span class="tc-mode">RESEARCH MODE</span></div>`
      + `<div class="tc-q">${p.q}</div>`
      + `<div class="tc-ans"><div class="lbl">A GOOD CITED ANSWER</div><p>${p.a}</p>`
        + `<span class="srcpill">${IC.link} ${p.src}</span>`
        + `<div class="checks"><span class="check">${IC.check} a figure</span><span class="check">${IC.check} a timeframe</span><span class="check">${IC.check} a source</span></div>`
      + `</div></div></div>`
    + foot("claude","Paste these findings into Claude to go deeper.");
}

function panelClaude(){
  const bubbles = CLAUDE_REPLY.map(t=>`
    <div class="bubble"><span class="bubble-ico">${IC.spark}</span><p>${t}</p></div>`).join("");
  return kicker("spark","STOP 3 &middot; CLAUDE","Step 3 of 4")
    + `<h2 class="p-title">Go deeper: pressure-test what you found</h2>`
    + `<p class="p-lead">Perplexity gave you the lay of the land. Now bring it to Claude to fill gaps and challenge any number that looks too clean. Claude has no daily research cap.</p>`
    + `<div class="body"><div class="toolcard">`
      + `<div class="tc-head"><span class="ic">${IC.spark}</span><b>Claude</b></div>`
      + `<div class="tc-q">${CLAUDE_PROMPT}</div>`
      + `<div class="tc-ans"><div class="lbl">CLAUDE PUSHES BACK</div>${bubbles}</div>`
    + `</div></div>`
    + foot("flag","Now capture the findings and flag the standout number.");
}

function panelFlag(){
  const rows = DOC_ROWS.map(r=>`
    <div class="docrow ${r.star?'star':''}">
      ${r.star?`<span class="star-ic">${IC.star}</span>`:""}
      <span class="dr-q">${r.q}</span>
      <span class="dr-a">${r.a}</span>
      <span class="dr-src">${r.src}</span>
    </div>`).join("");
  return kicker("starline","STOP 4 &middot; CAPTURE","Step 4 of 4")
    + `<h2 class="p-title">Capture the findings, then flag the one number</h2>`
    + `<p class="p-lead">Every row of your doc now holds a cited fact. The last move is to pick the <b>one number a partner would remember</b> and star it.</p>`
    + `<div class="body"><div class="docrows">${rows}</div>`
      + `<div class="standout"><span class="si">${IC.star}</span><div><div class="sk">YOUR STANDOUT NUMBER</div><div class="st">${STANDOUT}</div></div></div>`
    + `</div>`
    + foot("tmpl","Done. Grab the template to run this on your own focus area.");
}

function panelTmpl(){
  const cards = TEMPLATES.map(t=>`
    <div class="tmpl-card">
      <div class="th"><span class="ic">${IC[t.icon]}</span><b>${t.who==="PERPLEXITY"?"Query for Perplexity":"Prompt for Claude"}</b><span class="who">${t.who}</span></div>
      <div class="q">${t.q}</div>
      <div class="tmpl-note">${t.note}</div>
    </div>`).join("");
  return kicker("clip","YOUR TEMPLATE")
    + `<h2 class="p-title">Reuse this for your own focus area</h2>`
    + `<p class="p-lead">Same two moves you just walked through. Swap in <b>your</b> focus area and run it.</p>`
    + `<div class="body"><div class="tcards">${cards}</div></div>`
    + foot(null,"Perplexity casts the wide net. Claude does the deep dig.");
}

function render(){
  railState();
  if(cur==="pick")   panel.innerHTML = panelPick();
  else if(cur==="pplx")   panel.innerHTML = panelPplx();
  else if(cur==="claude") panel.innerHTML = panelClaude();
  else if(cur==="flag")   panel.innerHTML = panelFlag();
  else if(cur==="tmpl")   panel.innerHTML = panelTmpl();
}

// rail clicks
document.querySelectorAll(".stop").forEach(el=>{
  el.addEventListener("click", ()=>{ cur = el.getAttribute("data-stop"); render(); });
});
tmplBtn.addEventListener("click", ()=>{ cur="tmpl"; render(); });

// panel clicks (chips + next)
panel.addEventListener("click", e=>{
  const chip = e.target.closest(".chip");
  if(chip){ curPplx = +chip.getAttribute("data-pplx"); render(); return; }
  const nx = e.target.closest(".nextbtn");
  if(nx){ cur = nx.getAttribute("data-next"); render(); return; }
});

/* optional deep-link for QA/preview: #pick #pplx-0 #claude #flag #tmpl */
(function(){
  const h=(location.hash||"").replace("#","");
  if(!h) return;
  if(h.indexOf("pplx")===0){ cur="pplx"; curPplx=+(h.split("-")[1]||0)||0; }
  else if(["pick","claude","flag","tmpl"].indexOf(h)>-1){ cur=h; }
})();

/* scale-to-fit for Notion embeds */
function scaleDeck(){
  const w = document.getElementById("wrapper");
  const s = Math.min(window.innerWidth/960, window.innerHeight/540, 1);
  w.style.transform = `scale(${s})`;
  w.style.transformOrigin = "top center";
}
window.addEventListener("resize", scaleDeck);
scaleDeck();
render();
</script>
</body>
</html>
