<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    /* right and wrong states only, always paired with an icon and a word */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:14px 44px 12px;display:flex;flex-direction:column}
  .frame:focus,.cards3:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:4px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:6px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:7px}
  .lead{flex:0 0 auto;font-size:16px;line-height:1.45;color:var(--body);max-width:80ch}
  .lead b{color:var(--title);font-weight:600}
  .lead2{flex:0 0 auto;font-size:14.5px;line-height:1.35;color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- slide 1: the scope picker ---- */
  .scopes{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  button.sc{font-family:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--title);
    border:1.5px dashed var(--on-highlight);border-radius:12px;padding:20px 18px 16px;
    display:flex;flex-direction:column;gap:12px;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  button.sc:hover{background:var(--highlight)}
  button.sc:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.sc .si{width:64px;height:64px;border-radius:14px;background:var(--highlight);color:var(--on-highlight);
    border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center}
  button.sc .si svg.ic{width:36px;height:36px}
  button.sc .sl{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  button.sc .sn{font-size:20px;font-weight:600;line-height:1.25;color:var(--title);flex:1 1 auto;min-height:50px}
  button.sc .ss{font-size:14px;font-weight:600;color:var(--on-highlight);display:flex;align-items:center;gap:7px;
    border-top:1.5px dashed var(--line);padding-top:9px}
  .gl{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--on-highlight);
    font-size:12px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  button.sc.on{background:var(--on-highlight);border:2px solid var(--on-highlight);color:var(--bg)}
  button.sc.on .sl,button.sc.on .sn,button.sc.on .ss{color:var(--bg)}
  button.sc.on .ss{border-top:1.5px solid var(--bg)}
  button.sc.on .gl{border-color:var(--bg);background:var(--bg);color:var(--on-highlight)}
  button.sc.on .si{background:var(--bg)}
  .note2{flex:0 0 auto;font-size:15px;line-height:1.45;color:var(--body);max-width:80ch}
  .note2 b{color:var(--title)}

  /* ---- slide 2: the finding and Ray's question ---- */
  .ctx{flex:0 0 auto;display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
  .fnd{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;padding:7px 13px;min-width:0}
  .fnd .fl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .fnd .ft{font-size:15px;font-weight:600;line-height:1.3;color:var(--title);margin-top:2px}
  .fnd .fm{font-size:13px;line-height:1.35;color:var(--body);margin-top:2px}
  .ray{display:flex;align-items:center;gap:11px;background:var(--highlight);
    border-left:4px solid var(--on-highlight);border-radius:0 10px 10px 0;padding:7px 13px;min-width:0}
  .ray svg.ic{width:28px;height:28px;color:var(--on-highlight);flex:0 0 auto}
  .ray .rn{font-size:13px;line-height:1.35;color:var(--body)}
  .ray .rn b{color:var(--title);font-weight:600}
  .ray .rqt{font-size:17px;font-weight:600;line-height:1.3;color:var(--title);margin-top:2px}

  /* ---- slide 2: three answer cards ---- */
  .cards3{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:stretch}
  button.ex{font-family:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--title);
    border:1.5px solid var(--line);border-radius:12px;padding:8px 13px 8px;min-height:0;
    display:flex;flex-direction:column;gap:4px;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  button.ex:hover:not(:disabled){background:var(--highlight);border-color:var(--on-highlight)}
  button.ex:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.ex:disabled{cursor:default}
  .exh{display:flex;align-items:center;gap:9px}
  .exh .g{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--on-highlight);background:var(--bg);
    color:var(--on-highlight);font-size:12px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
  .exh .g svg.ic{width:13px;height:13px;stroke-width:2.6}
  .exh .en{font-size:14px;font-weight:600;color:var(--on-highlight);white-space:nowrap}
  .exh .tag{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
  .ext{font-size:14px;line-height:1.33;color:var(--title)}
  .pw{font-size:13px;line-height:1.3;color:var(--body)}
  .pw b{color:var(--title);font-weight:600}
  .exr{margin-top:auto;border-top:1.5px dashed var(--line);padding-top:5px;
    font-size:13.5px;line-height:1.3;color:var(--title)}
  .exr b{font-weight:700}
  button.ex.idle{background:transparent;border-style:dashed}
  button.ex.idle .exh .g{border-style:dashed}
  button.ex.idle .ext,button.ex.idle .pw{color:var(--body)}
  button.ex.idle .exr{color:var(--body)}
  button.ex.idle .exr b{color:var(--title)}
  button.ex.ok{background:var(--ok-tint);border:2px solid var(--ok)}
  button.ex.ok .exh .g{background:var(--ok);border-color:var(--ok);color:var(--bg)}
  button.ex.ok .exh .tag{color:var(--ok)}
  button.ex.ok .exr{border-top:1.5px solid var(--ok)}
  button.ex.ok .exr b{color:var(--ok)}
  button.ex.no{background:var(--no-tint);border:2px solid var(--no)}
  button.ex.no .exh .g{background:var(--no);border-color:var(--no);color:var(--bg)}
  button.ex.no .exh .tag{color:var(--no)}
  button.ex.no .exr{border-top:1.5px solid var(--no)}
  button.ex.no .exr b{color:var(--no)}
  button.ex .exr.in{animation:rin var(--t-reveal) var(--ease-over) both}

  /* ---- slide 3: the side-by-side reason ---- */
  .rows{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
  .row{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start;background:var(--bg);
    border:1.5px solid var(--line);border-radius:10px;padding:7px 16px}
  .row.ok{background:var(--ok-tint);border:2px solid var(--ok)}
  .row .rk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:var(--on-highlight);padding-top:2px;line-height:1.3}
  .row .rk .g{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--on-highlight);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:0}
  .row .rk .g svg.ic{width:13px;height:13px;stroke-width:2.6}
  .row.ok .rk{color:var(--ok)}
  .row.ok .rk .g{background:var(--ok);border-color:var(--ok);color:var(--bg)}
  .row .rq{font-size:14px;line-height:1.4;color:var(--body);margin-top:2px;padding-left:28px}
  .row .rw{font-size:15.5px;line-height:1.36;font-weight:600;color:var(--title);padding-top:1px}
  .shift{flex:0 0 auto;font-size:14px;line-height:1.4;color:var(--body);border-left:3px dashed var(--on-highlight);padding:2px 0 2px 12px}
  .shift b{color:var(--title)}
  .statement{flex:0 0 auto;background:var(--highlight);border-left:5px solid var(--on-highlight);
    border-radius:0 12px 12px 0;padding:9px 22px}
  .statement p{font-size:18.5px;line-height:1.34;font-weight:600;color:var(--title)}

  .gate{flex:0 0 auto;display:flex;flex-direction:column;gap:14px;background:var(--bg);border:1.5px solid var(--line);
    border-radius:12px;padding:22px 24px;max-width:620px}
  .gate p{font-size:16px;line-height:1.45;color:var(--title)}
  button.go{font-family:inherit;font-size:15px;font-weight:600;padding:9px 17px;border-radius:8px;cursor:pointer;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);align-self:flex-start}
  button.go:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:48px;padding-top:6px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.5;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:42px;overflow-y:auto;font-size:13.5px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    .scopes{grid-template-columns:1fr 1fr;gap:10px}
    button.sc{min-height:0;padding:14px 12px}
    button.sc .si{width:48px;height:48px}
    button.sc .sn{font-size:17px}
    .note2{font-size:16px}
    .ctx{grid-template-columns:1fr}
    .fnd .ft{font-size:16px}
    .fnd .fm,.ray .rn{font-size:14px}
    .cards3{grid-template-columns:1fr}
    .ext{font-size:16px}
    .exr{font-size:15px}
    .pw{font-size:14.5px}
    .row{grid-template-columns:1fr;gap:6px}
    .statement p{font-size:18px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

    <p>Ray Okafor is Cumberland's COO (chief operating officer). He owns the budget and the Meridian relationship. He reads a top finding from your scope's scan and asks, "So what does that mean for us?" There are three answers that we are going to show you. Find your scope below, and pick the one that you think Ray would act on before you read which one it is.</p>
    <h3>Scope A, Claims Intake</h3>
    <p><strong>The finding:</strong> Windows Print Spooler remote code execution (PrintNightmare). CVE-2021-34527, on CCS-APP01, CCS-WEB01 and MEDFLOW-TEST.</p>
    <h4>Answer 1</h4><p>The Print Spooler service on these machines lets anyone with a network login run their own code as SYSTEM, the highest level of control on the machine. CVE-2021-34527 scores 8.8 and is on the US government's list of flaws attackers are already using.</p><p><em>In plain words: the Print Spooler is the part of Windows that sends work to printers.</em></p>

    <p><strong>Ray acts on Answer 1.</strong></p>

    <h3>Scope C, Patient Records and Archive</h3>
    <p><strong>The finding:</strong> Windows Server 2012 R2 unsupported version detection. Critical, no score, on CCS-ARCH01, CCS-FS01 and CCS-ARCH02.</p>
    <h4>Answer 1</h4><p>Several servers are running old software, which creates security exposure. With Meridian's assessment coming, this is a serious risk that should be looked at.</p>

    check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    x:'<path d="M7 7l10 10M17 7L7 17"/>',
    person:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.3-3.6 4.2-5.6 7.5-5.6s6.2 2 7.5 5.6"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }

  /* ---------------- content ----------------
     Kinds and verdicts: P2-14. The finding title is the scan's own Finding
     cell for that row; the machines are the hosts on those rows. Mechanism
     text follows the scan's Description cell. Cost text uses only canon:
     what the machine holds (Environment Record), 2.1 million patients,
     Meridian 31% of revenue, 90 days to renewal. The decision named is what
     gets paid for first, never a fix. The right answer sits in a different
     position in each scope. */
  var KIND = {
    mech:{ label:"Explains how it works", short:"Ray doesn't need to know how the flaw works to decide.",
      why:"Executives don't need to know how the flaw works. Ray can't decide anything from it." },
    vague:{ label:"Vague", short:"It gives Ray nothing to act on, with no cost and no decision in it.",
      why:"It says nothing Ray can act on. There is no cost in it and no decision." },
    cost:{ label:"Names the cost and the decision", short:"It says what could happen, what it could cost and what Ray has to decide.",
      why:"It tells Ray what could happen to Cumberland, what it could cost, and what he is being asked to decide." }
  };
  var DECIDE = "Meridian, 31% of your revenue, decides in 90 days whether to renew. Your decision: do you pay for this first?";

  var SC = {
    A:{ name:"Claims Intake", ic:"claims",
      title:"Windows Print Spooler remote code execution (PrintNightmare)",
      meta:"CVE-2021-34527 · On CCS-APP01, CCS-WEB01 and MEDFLOW-TEST",
      shift:"\u2018Run their own code as SYSTEM\u2019 became \u2018take over the machines that run your billing and claims system.\u2019 The score and the flaw code dropped out. Meridian and a decision came in.",
      cards:[
        { k:"mech", txt:"The Print Spooler service on these machines lets anyone with a network login run their own code as SYSTEM, the highest level of control on the machine. CVE-2021-34527 scores 8.8 and is on the US government's list of flaws attackers are already using.",
          plain:"The Print Spooler is the part of Windows that sends work to printers." },
        { k:"vague", txt:"This is a serious security risk, and Meridian will look at it. The scanner rates it Critical, so it should be treated as a high priority." },
        { k:"cost", txt:"Anyone with a staff login could take over the machines that run your billing and claims system, the clinic portal, and the test copy of your patient data. " + DECIDE }
      ] },
    B:{ name:"Payments and Remittance", ic:"coin",
      title:"Windows Server 2012 R2 unsupported version detection",
      meta:"Critical, no score · On CCS-FS01 and CCS-PAY01",
      shift:"\u2018Reached end of support on 10 October 2023\u2019 became \u2018can never be made safe again.\u2019 The date and the scanner rating dropped out. Meridian and a decision came in.",
      cards:[
        { k:"cost", txt:"The server where payer files land and Finance keeps its payment spreadsheets can never be made safe again, and nor can a machine tied to card payments. " + DECIDE },
        { k:"mech", txt:"Windows Server 2012 R2 reached end of support on 10 October 2023. Microsoft releases no more security updates for it, so any flaw found in it after that date stays open for good. The scanner rates it Critical with no score." },
        { k:"vague", txt:"These servers are running outdated software, which is a significant risk with Meridian's assessment coming. It should be addressed as soon as possible." }
      ] },
    C:{ name:"Patient Records and Archive", ic:"archive",
      title:"Windows Server 2012 R2 unsupported version detection",
      meta:"Critical, no score · On CCS-ARCH01, CCS-FS01 and CCS-ARCH02",
      shift:"\u2018Reached end of support\u2019 became \u2018can never be made safe again,\u2019 and \u2018the records portal website\u2019 became \u2018open to the internet.\u2019 The date and the server names dropped out. Meridian and a decision came in.",
      cards:[
        { k:"vague", txt:"Several servers are running old software, which creates security exposure. With Meridian's assessment coming, this is a serious risk that should be looked at." },
        { k:"cost", txt:"Seven years of closed claims for about 2.1 million patients sit on servers that can never be made safe again, and one of them is open to the internet. " + DECIDE },
        { k:"mech", txt:"Windows Server 2012 R2 reached end of support on 10 October 2023. Microsoft releases no more security updates for it, so any flaw found in it after that date stays open for good. The records portal website runs on CCS-ARCH01." }
      ] },
    D:{ name:"Remote and Corporate", ic:"laptop",
      title:"FortiOS authentication bypass on administrative interface",
      meta:"CVE-2022-40684 · On CCS-FW01, the FortiGate firewall",
      shift:"\u2018Accepts crafted HTTP or HTTPS requests \u2026 without a login\u2019 became \u2018anyone on the internet could take control, without a password.\u2019 The score and the flaw code dropped out. Meridian and a decision came in.",
      cards:[
        { k:"mech", txt:"FortiOS on the FortiGate-60F accepts crafted HTTP or HTTPS requests to its admin interface without a login, and that interface is reachable from the internet. CVE-2022-40684 scores 9.8 and is on the US government's list of flaws attackers are already using.",
          plain:"FortiOS is the firewall's own software, and its admin interface is the firewall's settings screen." },
        { k:"cost", txt:"Anyone on the internet could take control, without a password, of the device your staff use to connect from home, which your outside IT provider's permanent connection also runs through. " + DECIDE },
        { k:"vague", txt:"The firewall has a critical vulnerability. With Meridian's assessment coming, this is a high-risk issue that needs attention." }
      ] }
  };
  var ORDER = ["A","B","C","D"];

  var S = [
    { id:"scope", kind:"scope", label:"Your scope", h1:"Pick Your Scope",
      lead:"Choose the scope you picked in Project 1. Next, we are going to show you a top finding from that scope's scan, Ray's question about it and three answers. Then you pick the one that you think Ray would act on." },
    { id:"pick", kind:"pick", label:"Pick one", h1:"So What Does That Mean for Us?" },
    { id:"why",  kind:"why",  label:"Why", h1:"What Ray Needs to Hear" }
  ];
  var CLOSE = "Ray doesn't need to know how something works. He needs to know what it could cost Cumberland and what he's being asked to decide.";

  /* ---------------- state ---------------- */
  var KEY = "vciso-p2-m15-so-what-does-that-mean-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { scope:null, out:{}, solved:{} }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var out = {}, solved = {};
      ORDER.forEach(function(k){
        if(isPlain(raw.out) && isPlain(raw.out[k])){
          out[k] = {};
          ["mech","vague"].forEach(function(c){ if(raw.out[k][c]) out[k][c] = 1; });
        }
        if(isPlain(raw.solved)){
          var v = raw.solved[k];
          if(v === "right" || v === true) solved[k] = "right";
          else if(v === "shown") solved[k] = "shown";
        }
        if(!solved[k] && out[k] && out[k].mech && out[k].vague) solved[k] = "shown";
      });
      return { scope: ORDER.indexOf(raw.scope) >= 0 ? raw.scope : null, out:out, solved:solved };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Data validation, at load, loud: each scope needs one card of each kind. */
  (function validate(){
    var problems = [];
    ORDER.forEach(function(k){
      var sc = SC[k], seen = {};
      if(!sc || !sc.title || !sc.meta) { problems.push("scope " + k + " is missing its finding"); return; }
      (sc.cards || []).forEach(function(c){
        if(!KIND[c.k]) problems.push("scope " + k + ' has unknown kind "' + c.k + '"');
        if(seen[c.k]) problems.push("scope " + k + " has two " + c.k + " cards");
        seen[c.k] = 1;
        if(!c.txt) problems.push("scope " + k + " " + c.k + " card has no text");
      });
      if(!(seen.mech && seen.vague && seen.cost)) problems.push("scope " + k + " needs one card of each kind");
    });
    if(problems.length){
      document.getElementById("board").innerHTML =
        '<div class="lead"><p><b>This deck has authoring errors and will not behave correctly:</b></p>'
        + '<ul style="font-size:13px;line-height:1.6;padding-left:18px">'
        + problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul></div>";
      throw new Error("deck data invalid: " + problems.join("; "));
    }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    reset:document.getElementById("reset"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = m; }
  function cur(){ return st.scope ? SC[st.scope] : null; }
  function outs(){ if(!st.out[st.scope]) st.out[st.scope] = {}; return st.out[st.scope]; }
  function solved(){ return !!st.scope && (st.solved[st.scope] === "right" || st.solved[st.scope] === "shown"); }
  function how(){ return st.scope ? st.solved[st.scope] : null; }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;
    if(st.scope && i > 0){ el.chip.hidden = false; el.chip.textContent = "Scope " + st.scope + " · " + SC[st.scope].name; }
    else el.chip.hidden = true;
    el.back.disabled = (i === 0);
    el.reset.hidden = (i !== S.length-1);
    el.next.textContent = "Continue";
    el.next.disabled = false;
    el.hint.textContent = "";
    if(i === S.length-1){ el.next.disabled = true; el.next.textContent = "You are at the end";
      if(st.scope && solved()) el.hint.innerHTML = "<span><b>You are done here.</b> Go back to the module to write your own number one for Ray.</span>"; }
    else if(s.kind === "scope" && !st.scope){ el.next.disabled = true; el.hint.innerHTML = "Pick a scope to carry on."; }
    else if(s.kind === "pick" && st.scope && !solved()){
      el.next.disabled = true;
      el.hint.innerHTML = Object.keys(outs()).length > 0
        ? "<span><b>Not quite.</b> Read why on the card marked Not quite, then try another answer.</span>"
        : "<span>Pick the one that you think Ray would act on.</span>";
    }
    else if(s.kind === "pick" && solved()){
      el.hint.innerHTML = how() === "right"
        ? "<span><b>Right.</b> Continue to see why the other two do not work.</span>"
        : "<span>The right answer is the green one, marked <b>Right answer</b>. Continue to see why.</span>";
    }
  }

  function render(){
    var s = S[i];
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);
    if(s.kind === "scope") renderScope(s);
    else if(s.kind === "pick") renderPick();
    else renderWhy();
    header();
    say("Slide " + (i+1) + " of " + S.length + ". " + s.h1);
  }

  /* Slide 1: four scopes, none picked on first load. */
  function renderScope(s){
    el.board.innerHTML = '<p class="lead">' + s.lead + "</p>"
      + '<div class="scopes" role="group" aria-label="Scopes">' + ORDER.map(function(k){
          var on = st.scope === k;
          return '<button class="sc' + (on ? " on" : "") + '" type="button" data-k="' + k + '" aria-pressed="' + on + '">'
            + '<span class="si">' + icon(SC[k].ic) + "</span>"
            + '<span class="sl">Scope ' + k + "</span>"
            + '<span class="sn">' + esc(SC[k].name) + "</span>"
            + '<span class="ss">' + (on ? '<span class="gl" aria-hidden="true">✓</span>Your scope'
                                        : '<span class="gl" aria-hidden="true">+</span>Pick this one') + "</span>"
            + "</button>";
        }).join("") + "</div>"
      + '<p class="note2">Your own number one may be a different finding. <b>Ray asks the same question of every finding</b>, so what you learn here works for yours too. If you try another scope, your picks here are kept until you start over.</p>';
    Array.prototype.forEach.call(el.board.querySelectorAll("button.sc"), function(b){
      b.addEventListener("click", function(){
        st.scope = b.dataset.k; save(st);
        render();
        var nb = el.board.querySelector('button.sc[data-k="' + st.scope + '"]');
        if(nb) nb.focus();
        say("Scope " + st.scope + ", " + SC[st.scope].name + ", picked.");
      });
    });
  }

  function needScope(){
    el.board.innerHTML = '<div class="gate"><p><b>Pick your scope first.</b> The finding depends on it.</p>'
      + '<button class="go" type="button" id="goscope">Go to the scope picker</button></div>';
    el.board.querySelector("#goscope").addEventListener("click", function(){ i = 0; render(); el.frame.focus(); });
  }

  function ctxHTML(sc){
    return '<div class="ctx">'
      + '<div class="fnd"><p class="fl">The finding, from your scan</p><p class="ft">' + esc(sc.title) + '</p><p class="fm">' + esc(sc.meta) + "</p></div>"
      + '<div class="ray">' + icon("person")
      + '<div><p class="rn"><b>Ray Okafor</b>, COO (chief operating officer). He owns the budget.</p>'
      + '<p class="rqt">“So what does that mean for us?”</p></div></div>'
      + "</div>";
  }

  /* Slide 2: three answers, none selected. A wrong pick shows why and stays
     crossed out; the student picks again. The right pick opens every reason. */
  /* open: not picked yet. no: picked, wrong. ok: the right answer.
     idle: a wrong answer left unpicked once the right one is found. */
  function cardState(c){
    if(outs()[c.k]) return "no";
    if(solved()) return c.k === "cost" ? "ok" : "idle";
    return "open";
  }
  function cardHTML(c, n){
    var s = cardState(c), K = KIND[c.k];
    var word = s === "ok" ? (how() === "right" ? "Right" : "Right answer") : s === "no" ? "Not quite" : "";
    var glyph = s === "ok" ? icon("check") : s === "no" ? icon("x") : "";
    var tag = word ? '<span class="tag">' + word + "</span>" : "";
    var plain = c.plain ? '<span class="pw"><b>In plain words:</b> ' + esc(c.plain) + "</span>" : "";
    var rev = s === "open" ? "" : '<span class="exr"><b>' + esc(K.label) + ".</b> " + esc(K.short) + "</span>";
    return '<button class="ex ' + s + '" type="button" data-c="' + c.k + '"'
      + (s === "open" ? "" : ' disabled aria-disabled="true"')
      + ' aria-label="Answer ' + (n+1) + (word ? ", " + word : "") + ". " + esc(c.txt) + (c.plain ? " In plain words: " + esc(c.plain) : "")
      + (s === "open" ? "" : " " + esc(K.label) + ". " + esc(K.short)) + '">'
      + '<span class="exh"><span class="g" aria-hidden="true">' + glyph + '</span><span class="en">Answer ' + (n+1) + "</span>" + tag + "</span>"
      + '<span class="ext">' + esc(c.txt) + "</span>"
      + plain + rev
      + "</button>";
  }
  function renderPick(animateIds){
    var sc = cur();
    if(!sc){ needScope(); return; }
    el.board.innerHTML = ctxHTML(sc)
      + '<p class="lead2">Ray asked this about the finding above. Read the three answers, then pick the one that you think Ray would act on.</p>'
      + '<div class="cards3" role="group" aria-label="Three answers" tabindex="-1">' + sc.cards.map(cardHTML).join("") + "</div>";
    if(animateIds && !reduce){
      animateIds.forEach(function(id){
        var r = el.board.querySelector('button.ex[data-c="' + id + '"] .exr');
        if(r){ r.classList.remove("in"); void r.offsetWidth; r.classList.add("in"); }
      });
    }
    Array.prototype.forEach.call(el.board.querySelectorAll("button.ex"), function(b){
      b.addEventListener("click", function(){
        var c = sc.cards.filter(function(x){ return x.k === b.dataset.c; })[0];
        if(!c || solved() || outs()[c.k]) return;
        var changed = [c.k];
        if(c.k === "cost") st.solved[st.scope] = "right";
        else {
          outs()[c.k] = 1;
          if(Object.keys(outs()).length >= sc.cards.length - 1) st.solved[st.scope] = "shown";
        }
        if(solved()) sc.cards.forEach(function(x){ if(x.k !== c.k && !outs()[x.k]) changed.push(x.k); });
        save(st);
        renderPick(changed);
        header();
        var K = KIND[c.k], R = KIND.cost;
        var phone = window.matchMedia("(max-width:599px)").matches;
        var fo = phone ? { preventScroll:true } : undefined;
        if(c.k === "cost"){
          say("Right. " + K.label + ". " + K.why + " Continue to see why the other two do not work.");
          el.next.focus(fo);
        } else if(solved()){
          say("Not quite. " + K.label + ". " + K.why + " The right answer is now shown in green, marked Right answer. " + R.label + ". " + R.why + " Continue to see why.");
          el.next.focus(fo);
        } else {
          say("Not quite. " + K.label + ". " + K.why + " Try another answer.");
          var g = el.board.querySelector(".cards3"); if(g) g.focus(fo);
        }
        if(phone){ var t = el.board.querySelector('button.ex[data-c="' + c.k + '"]'); if(t) t.scrollIntoView({ block:"center", behavior: reduce ? "auto" : "smooth" }); }
      });
    });
  }

  /* Slide 3: the three kinds side by side, then the one line. */
  function renderWhy(){
    var sc = cur();
    if(!sc){ needScope(); return; }
    if(!solved()){
      el.board.innerHTML = '<div class="gate"><p><b>Pick Ray\'s answer first.</b> This slide shows the answer, so it waits until then.</p>'
        + '<button class="go" type="button" id="gopick">Back to the three answers</button></div>';
      el.board.querySelector("#gopick").addEventListener("click", function(){ i = 1; render(); el.frame.focus(); });
      return;
    }
    var order = ["mech","vague","cost"];
    function pos(k){ var n = 0; sc.cards.forEach(function(c, j){ if(c.k === k) n = j+1; }); return n; }
    el.board.innerHTML = '<p class="lead">The answer that explains how the flaw works sounds the most expert. Ray still can\'t decide anything from it.</p>'
      + '<div class="rows">' + order.map(function(k){
          var n = 0; sc.cards.forEach(function(c, j){ if(c.k === k) n = j+1; });
          var K = KIND[k], ok = k === "cost";
          return '<div class="row' + (ok ? " ok" : "") + '">'
            + '<div><span class="rk"><span class="g" aria-hidden="true">' + icon(ok ? "check" : "x") + "</span>" + esc(K.label) + "</span>"
            + '<p class="rq">Answer ' + n + (ok ? ", the one Ray acts on" : "") + '</p></div><p class="rw">' + esc(K.why) + "</p>"
            + "</div>";
        }).join("") + "</div>"
      + '<p class="shift"><b>Look at what changed from Answer ' + pos("mech") + " to Answer " + pos("cost") + ".</b> " + esc(sc.shift) + "</p>"
      + '<div class="statement"><p>' + esc(CLOSE) + "</p></div>";
  }

  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    if(d > 0 && el.next.disabled) return;
    i = n; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });
  el.reset.addEventListener("click", function(){ st = fresh(); save(st); i = 0; render(); el.frame.focus(); });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }
  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){ if(dx < 0) go(1); else go(-1); }
    tx = null; ty = null;
  }, {passive:true});

  /* Scale the fixed canvas down to fit, never up. */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* QA hook. */
  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; i = n; render(); return true; },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    scope:function(k){ if(ORDER.indexOf(k) < 0) return false; st.scope = k; save(st); render(); return true; },
    state:function(){ return { i:i, scope:st.scope, out:st.out, solved:st.solved }; }
  };
})();
</script>
</body>
</html>
