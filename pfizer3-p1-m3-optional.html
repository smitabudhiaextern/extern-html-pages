<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optional Reading Topics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Optional Reading for the page How AI Reads Pharma
   Documents: five topics as toggles, only one open at a time. Each closed toggle shows a
   statement title and a "Read this if..." hint so the student can choose.
   The toggles copy the shape, spacing, header layout, chevron and open and close behaviour of the
   frozen template accordions; their colours come only from this design system's tokens.
   Fixed stage: laid out once on a 760 x 850 design stage (set the Notion embed height to 850 px), then
   scaled as one piece to fit the embed frame and centred. Nothing scrolls. A topic too long to fit when
   open is split into short parts with Back and Next inside the open toggle. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff;
  --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --action:var(--extern-black); --on-action:var(--extern-white);
  --line:var(--gray-200); --focus-ring:var(--pfizer-blue); --gray-50:#f2f2f2;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --stage-w:760px; --stage-h:850px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;overflow:hidden;background:var(--surface);padding:16px 20px}

/* Accordion: the shape, spacing, header layout and chevron of the frozen template accordions
   (one bordered box, hairlines between items, title left and chevron right), in this design system's colours. */
.toggles{max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
/* A topic split into parts fills the stage, so Back and Next stay in one place from part to part. */
.app.fill .toggles{height:100%}
.item{flex:none;display:flex;flex-direction:column;min-height:0}
.item+.item{border-top:1px solid var(--line)}
.app.fill .item.open{flex:1 1 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;margin:0;border:0;background:none;text-align:left;cursor:pointer;padding:18px 20px;transition:background-color .15s ease}
.head:hover{background:var(--surface-card)}
.head:focus-visible{outline-offset:-2px;border-radius:0}
.ht{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{margin:0;font-family:var(--font-text);font-size:16px;font-weight:600;line-height:1.45;color:var(--ink)}
.hint{font-size:14px;line-height:1.45;color:var(--ink-muted)}
.chev{flex:none;width:20px;height:20px;color:var(--gray-600);transition:transform .2s ease}
.item.open .chev{transform:rotate(180deg)}

/* The open topic's reading area */
.body{display:none}
.item.open .body{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.pane{flex:1 1 auto;min-height:0;padding:2px 20px 14px;display:flex;flex-direction:column;gap:12px}
.pane p{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty}
.pane p b{font-weight:600;color:var(--ink)}
.pane h3{margin:4px 0 0;font-family:var(--font-text);font-size:16px;font-weight:600;line-height:1.35;color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.4;color:var(--card-text)}
th{text-align:left;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label);padding:8px 10px;background:var(--surface-card);vertical-align:bottom}
th:first-child{border-radius:var(--radius-xs) 0 0 var(--radius-xs)}
th:last-child{border-radius:0 var(--radius-xs) var(--radius-xs) 0}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td b{font-weight:600;color:var(--ink)}
td .src{display:block;font-style:italic;font-size:12.5px;color:var(--gray-600)}
.c-name{width:26%}
.messy .c-name{width:50%}
.words .c-name{width:55%}
.words td{padding:5px 10px}
.uses{font-size:13.5px}
.uses{line-height:1.38}
.uses .c-name{width:17%}
.uses td:nth-child(2){width:28%}
.uses td:nth-child(3){width:24%}
.uses td{padding:5px 9px}
.uses th{padding:7px 9px}

/* Lists, code, links and the video note, built from the design system's tokens */
.pane ol,.pane ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px;font-size:15.5px;line-height:1.55;color:var(--ink-muted)}
.pane li{padding-left:2px}
.pane li::marker{color:var(--step-label);font-weight:600}
.pane li b{font-weight:600;color:var(--ink)}
.pane ul.links{gap:8px}
.pane code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-card);color:var(--ink);padding:1px 5px;border-radius:5px}
.code{background:var(--surface-card);border-radius:var(--radius-sm);flex:none}
.code-head{padding:6px 14px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label);border-bottom:1px solid var(--blue-200)}
.code pre{margin:0;padding:9px 14px;font-family:var(--font-mono);font-size:13px;line-height:1.5;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.pane a{color:var(--pfizer-blue);font-weight:500;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.pane a.res{font-weight:600;white-space:nowrap}
.pane a .ext{width:13px;height:13px;margin-left:4px;vertical-align:-1px}
.pane a:hover{text-decoration-thickness:2px}
.callout{background:var(--gray-50);border-radius:var(--radius-sm);padding:12px 16px}
.callout p{font-size:15px}
.tag{display:inline-block;font-size:12px;line-height:16px;font-weight:600;padding:2px 8px;border-radius:var(--radius-xs);background:var(--blue-200);color:var(--ink);vertical-align:1px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Part Back and Next, only for topics with more than one part */
.pnav{flex:none;display:flex;align-items:center;gap:12px;padding:8px 20px;border-top:1px solid var(--line)}
.pnav[hidden]{display:none}
.where{flex:1;font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-text);font-size:14px;line-height:1.2;font-weight:600;padding:7px 14px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.btn svg{width:13px;height:13px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.btn-next:disabled{opacity:.35;cursor:default}
@media (prefers-reduced-motion:no-preference){ .pane.anim{animation:in .22s ease} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
@media (prefers-reduced-motion:reduce){ .chev,.head{transition:none} }
</style>
</head>

 {
  "title": "What computer vision is, and how it helps a computer read a scanned page",
  "hint": "Read this if you're curious how a computer makes sense of a scanned page, not just its words.",
  "panes": [
   "<p><b>Computer vision (CV)<\/b> is the part of AI that helps computers understand pictures and videos. It's the technology behind your phone unlocking when it sees your face. OCR is one job computer vision does: it turns a picture of words into text. In document work, computer vision reads scanned pages and works out the layout, such as where a table or a heading sits.<\/p><p>If you'd like to go further:<\/p><ul class=\"links\"><li><a class=\"res\" href=\"https://viso.ai/computer-vision/what-is-computer-vision/\" target=\"_blank\" rel=\"noopener noreferrer\">What Is Computer Vision? (Viso.ai)<svg class=\"ext\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6.5 3.5h-3v9h9v-3M9.5 3.5h3v3M12.5 3.5 7.5 8.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span class=\"sr-only\"> (opens in a new tab)<\/span><\/a>: an article on how computers make sense of pictures, with examples from cars, healthcare and security.<\/li><li><a class=\"res\" href=\"https://youtu.be/OnTgbN3uXvw\" target=\"_blank\" rel=\"noopener noreferrer\">What Is Computer Vision and Why Does It Matter? (NVIDIA, YouTube)<svg class=\"ext\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6.5 3.5h-3v9h9v-3M9.5 3.5h3v3M12.5 3.5 7.5 8.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span class=\"sr-only\"> (opens in a new tab)<\/span><\/a>: a video on where computer vision is used today.<\/li><\/ul>"
  ]
 },
 {
  "title": "What NLP can do, and how it breaks sentences into pieces",
  "hint": "Read this if you want to see how a computer turns messy words into neat, labeled data.",
  "panes": [
   "<p><b>NLP (natural language processing)<\/b> is how computers read and understand human language. \"Natural language\" means the everyday words people write and speak, as opposed to computer code. <b>NLP is a part of AI that mostly uses machine learning today.<\/b> <b>Machine learning<\/b> means a computer learns patterns from lots of examples, instead of following rules a person wrote out one by one.<\/p><h3>From Messy Words to Neat Data<\/h3><p>People write in all sorts of ways. Computers work best with information that's neat and labeled. NLP sits between the two:<\/p><table class=\"messy\"><thead><tr><th scope=\"col\" class=\"c-name\">Unstructured (messy) text<\/th><th scope=\"col\">Structured (organized) data<\/th><\/tr><\/thead><tbody><tr><td class=\"c-name\"><b>Date of Manufacture: 20210126<\/b><\/td><td>manufacture_date = 26 January 2021<\/td><\/tr><\/tbody><\/table>",
   "<h3>What NLP Can Do<\/h3><ol><li><b>Translate languages.<\/b> Tools like Google Translate turn words from one language into another while keeping the meaning.<\/li><li><b>Power chatbots and voice assistants.<\/b> Gemini and voice assistants use NLP to understand what you type or say, so they can reply.<\/li><li><b>Spot feelings in text.<\/b> NLP can guess whether a review is happy (\"This phone is amazing\") or unhappy (\"This is the worst phone ever\"). This is called sentiment analysis.<\/li><li><b>Catch spam.<\/b> Email apps use NLP to spot messages like \"Congratulations! You won $1,000,000!\"<\/li><\/ol>",
   "<h3>A Few Ways NLP Breaks Down Language<\/h3><ul><li><b>Tokenization:<\/b> splitting text into pieces, usually words. \"Lot Number: 17242818\" becomes \"Lot\", \"Number\", \":\", \"17242818\".<\/li><li><b>Lemmatization:<\/b> shrinking words to their root, so \"running\" and \"runs\" both become \"run\".<\/li><li><b>Part-of-speech tagging:<\/b> working out whether each word is a noun, a verb, an adjective and so on.<\/li><li><b>Named entity recognition (NER):<\/b> finding names, places, organizations and dates in text. In the Cytiva file, \"Cytiva Westborough Quality Assurance\" is an organization.<\/li><\/ul><p><b>Video: What is NLP (Natural Language Processing)?<\/b> IBM Technology explains, with drawings, how NLP turns messy human language into data a computer can use. <a class=\"res\" href=\"https://youtu.be/fLvJ8VdHLA0\" target=\"_blank\" rel=\"noopener noreferrer\">Watch on YouTube<svg class=\"ext\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6.5 3.5h-3v9h9v-3M9.5 3.5h3v3M12.5 3.5 7.5 8.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span class=\"sr-only\"> (opens in a new tab)<\/span><\/a><\/p>"
  ],
  "parts": [
   "What NLP is",
   "What NLP can do",
   "How NLP breaks down language"
  ]
 },
 {
  "title": "A free NLP tool reads 2 lines of the Cytiva file and mixes up the numbers",
  "hint": "Read this if you want to see the code we ran and try the tool on your own text.",
  "panes": [
   "<p>Let's watch a real NLP tool read text from the Cytiva file. <b>spaCy<\/b> is a free NLP tool written in Python. One of its jobs is named entity recognition (NER): it finds things like organizations and dates in text and labels each one.<\/p><p>We gave spaCy two lines from page 2 of the Cytiva file, typed on one line, and asked it to label what it found. Here's the code we ran:<\/p><div class=\"code py\"><div class=\"code-head\">Python<\/div><pre>import spacy\n\nnlp = spacy.load(&quot;en_core_web_sm&quot;)\ndoc = nlp(&quot;Lot Number: 17242818 Date of Manufacture: 20210126&quot;)\nfor ent in doc.ents:\n    print(ent.text, ent.label_)<\/pre><\/div>",
   "<p>And here's exactly what it printed (spaCy 3.8.11, with its small English model, <code>en_core_web_sm<\/code> 3.8.0):<\/p><div class=\"code out\"><div class=\"code-head\">Output<\/div><pre>17242818 DATE\nDate of Manufacture WORK_OF_ART\n20210126 CARDINAL<\/pre><\/div><p>Let's read that. spaCy called the lot number, 17242818, a <code>DATE<\/code>. It called \"Date of Manufacture\" a <code>WORK_OF_ART<\/code>, the label it uses for titles of books and songs. It called the manufacture date, 20210126, a <code>CARDINAL<\/code>, which just means a plain number.<\/p>",
   "<p>That's not because spaCy is a bad tool. It learned from a large collection of English text, much of it news and web pages, where an 8-digit number is rarely a lot number (<a href=\"https://spacy.io/models/en\" target=\"_blank\" rel=\"noopener noreferrer\">spaCy: English models<span class=\"sr-only\"> (opens in a new tab)<\/span><\/a>). Even small changes can change its answers: when we added a period after each number, it labeled both numbers as dates, including the lot number. It does better with ordinary sentences. When we gave it \"Issued by Cytiva Westborough Quality Assurance\", also from page 2, it printed:<\/p><div class=\"code out\"><div class=\"code-head\">Output<\/div><pre>Cytiva Westborough Quality Assurance ORG<\/pre><\/div><p>That's right: <code>ORG<\/code> means an organization.<\/p>",
   "<p><b>Your turn.<\/b> Open spaCy's free online demo with the same Cytiva text already filled in. Look at the labels it gives, then change the text and see what changes. Try pasting another line from the Cytiva file, like \"3 June, 2022 Re: ÄKTA ready Flow Kit Storage Conditions\". The online demo may run a slightly different version of the model, so its labels can differ a little from ours.<\/p><p><a class=\"res\" href=\"https://demos.explosion.ai/displacy-ent?text=Lot%20Number%3A%2017242818%20Date%20of%20Manufacture%3A%2020210126&amp;model=en_core_web_sm&amp;ents=person%2Corg%2Cgpe%2Cloc%2Cproduct%2Cnorp%2Cdate%2Ccardinal%2Cwork_of_art%2Claw\" target=\"_blank\" rel=\"noopener noreferrer\">Open the spaCy NER demo with the Cytiva text<svg class=\"ext\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6.5 3.5h-3v9h9v-3M9.5 3.5h3v3M12.5 3.5 7.5 8.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span class=\"sr-only\"> (opens in a new tab)<\/span><\/a><\/p>"
  ],
  "parts": [
   "The code we ran",
   "What spaCy printed",
   "Why it got them wrong",
   "Try it yourself"
  ]
 },
 {
  "title": "How an LLM like Gemini writes its answers, one small piece at a time",
  "hint": "Read this if you've wondered how a chatbot learns to write, and why it can still make things up.",
  "panes": [
   "<p>An <b>LLM (large language model)<\/b> is the kind of AI behind chatbots like Gemini. It has learned from a huge amount of text, such as books, articles and websites, so it can write sentences that sound like a person wrote them. Here's what's going on inside.<\/p><h3>It Predicts the Next Word<\/h3><p>An LLM writes one token at a time (a token is a word or a piece of a word). Each time, it guesses the most suitable next word, adds it to the text, and then guesses again:<\/p><ol><li>The model gets some text.<\/li><li>It picks a good next word.<\/li><li>It adds that word to the text and feeds the longer text back in.<\/li><li>It repeats until the answer is done.<\/li><\/ol>",
   "<p>Here's a simplified example that starts with \"Machine learning\":<\/p><table class=\"words\"><thead><tr><th scope=\"col\" class=\"c-name\">Text so far<\/th><th scope=\"col\">Next word the model adds<\/th><\/tr><\/thead><tbody><tr><td class=\"c-name\"><b>Machine learning<\/b><\/td><td>is<\/td><\/tr><tr><td class=\"c-name\"><b>Machine learning is<\/b><\/td><td>a<\/td><\/tr><tr><td class=\"c-name\"><b>Machine learning is a<\/b><\/td><td>field<\/td><\/tr><tr><td class=\"c-name\"><b>Machine learning is a field<\/b><\/td><td>of<\/td><\/tr><tr><td class=\"c-name\"><b>Machine learning is a field of<\/b><\/td><td>study<\/td><\/tr><\/tbody><\/table><p>It looks like the model understands language, but it's really predicting the most likely next word, again and again. One more detail: an LLM doesn't always pick the single most likely word. It picks from the top few, which is why Gemini can give a slightly different answer to the same question each time.<\/p>",
   "<h3>Transformers and Attention<\/h3><p>Older language models struggled with long sentences. They focused on the last few words and forgot important details from earlier on. In 2017, researchers introduced a new design called the <b>transformer<\/b> (<a href=\"https://arxiv.org/abs/1706.03762\" target=\"_blank\" rel=\"noopener noreferrer\">Vaswani and others, \"Attention Is All You Need\", 2017<span class=\"sr-only\"> (opens in a new tab)<\/span><\/a>). A transformer looks at all the words in a passage at once, instead of one by one, so it keeps the full context in view.<\/p><p>The key idea inside a transformer is <b>attention<\/b>. Instead of treating every word the same, the model pays more attention to the words that matter most for the next word. In \"Is lot 17242818 still in date?\", the words \"lot\", \"17242818\" and \"date\" matter far more than \"is\" or \"still\". Attention is a big reason why today's chatbots write answers that make sense, instead of strings of words that only sound right.<\/p>",
   "<h3>How an LLM Is Trained, in 3 Stages<\/h3><ol><li><b>Learning from text (pretraining).<\/b> The model reads a huge amount of text and practices predicting the next word, a bit like the word suggestions on your phone's keyboard. This is how it picks up grammar, meaning and context.<\/li><li><b>Improving accuracy (fine-tuning).<\/b> The model is trained further on chosen examples of good answers, so it becomes more useful and reliable. Think of a teacher correcting a student's work.<\/li><li><b>Getting better with feedback (reinforcement learning).<\/b> People rate the model's answers, and the model is adjusted to give more of the answers people rated highly.<\/li><\/ol><p>Even after all this, an LLM doesn't think like a person, and it can still make things up. When an AI states something false as if it were true, that's called a <b>hallucination<\/b>. That's why you always fact-check what AI tells you.<\/p>",
   "<div class=\"callout\"><p><b>Want to go further?<\/b> <a class=\"res\" href=\"https://docs.google.com/document/d/1Q7tpwyrbGHb1k8G-FUauL_Zcbjz2OTxVjHmQrs0IziI/view\" target=\"_blank\" rel=\"noopener noreferrer\">Read the transcript of the video \"The Charades of Language Models\"<svg class=\"ext\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6.5 3.5h-3v9h9v-3M9.5 3.5h3v3M12.5 3.5 7.5 8.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span class=\"sr-only\"> (opens in a new tab)<\/span><\/a><\/p><\/div>"
  ],
  "parts": [
   "What an LLM is",
   "A simplified example",
   "Transformers and attention",
   "How an LLM is trained",
   "A transcript to read"
  ]
 },
 {
  "title": "5 jobs AI can take on in pharma document work",
  "hint": "Read this if you want to see where tools like these could save a compliance team time.",
  "panes": [
   "<p>Here are five jobs AI can take on in pharma document work, each with an example.<\/p><table class=\"uses\"><thead><tr><th scope=\"col\" class=\"c-name\">Use case<\/th><th scope=\"col\">What AI does<\/th><th scope=\"col\">How it works<\/th><th scope=\"col\">Example<\/th><\/tr><\/thead><tbody><tr><td class=\"c-name\"><b>Sorting documents<\/b><\/td><td>Sorts each document in a file into a type, like letter or Certificate of Quality<\/td><td>Looks at layout, headings and key words<\/td><td>Sorting the 3 pages of the Cytiva file into 1 letter and 2 Certificates of Quality<\/td><\/tr><tr><td class=\"c-name\"><b>Pulling out details<\/b><\/td><td>Pulls out dates, lot numbers, product names and revision codes (labels that show which version a document is)<\/td><td>Gets the text (with OCR if the page is scanned), then NLP finds each detail<\/td><td>Pulling Lot Number 17242818 and Date of Manufacture 20210126 from page 2<\/td><\/tr><tr><td class=\"c-name\"><b>Flagging old documents<\/b><\/td><td>Flags documents that have expired or are older than the team's limit<\/td><td>Pulls out the dates and compares them with today<\/td><td>Flagging the Cytiva documents that are more than 3 years old for a check<\/td><\/tr><\/tbody><\/table>",
   "<table class=\"uses\"><thead><tr><th scope=\"col\" class=\"c-name\">Use case<\/th><th scope=\"col\">What AI does<\/th><th scope=\"col\">How it works<\/th><th scope=\"col\">Example<\/th><\/tr><\/thead><tbody><tr><td class=\"c-name\"><b>Summarizing<\/b><\/td><td>Writes a short summary of a long supplier file<\/td><td>Finds the key parts of the text and shortens them<\/td><td>A one-page list of every document and date in a long supplier file<\/td><\/tr><tr><td class=\"c-name\"><b>Checking for gaps<\/b><\/td><td>Spots missing or incomplete papers<\/td><td>Compares the file against a checklist of required documents<\/td><td>Noticing that a certificate is missing for one batch, so the team can ask the supplier for it<\/td><\/tr><\/tbody><\/table>"

 }

  var app = document.getElementById("app"), list = document.getElementById("toggles");
  var open = -1, part = 0;

  TOPICS.forEach(function (tp, n) {
    var item = document.createElement("div");
    item.className = "item";
    item.innerHTML =
      '<button type="button" class="head" id="h' + n + '" aria-expanded="false" aria-controls="b' + n + '">' +
        '<span class="ht"><span class="t">' + tp.title + '</span><span class="hint">' + tp.hint + '</span></span>' +
        CHEV +
      '</button>' +
      '<div class="body" id="b' + n + '" role="region" aria-labelledby="h' + n + '">' +
        '<div class="pane" aria-live="polite"></div>' +
        '<div class="pnav"' + (tp.panes.length > 1 ? '' : ' hidden') + '>' +
          '<span class="where"></span>' +
          '<button type="button" class="btn btn-back">' + BACK + 'Back</button>' +
          '<button type="button" class="btn btn-next">Next' + NEXT + '</button>' +
        '</div>' +
      '</div>';
    item.querySelector(".head").addEventListener("click", function () { toggle(n); });
    item.querySelector(".btn-back").addEventListener("click", function () { goPart(part - 1); });
    item.querySelector(".btn-next").addEventListener("click", function () { goPart(part + 1); });
    list.appendChild(item);
  });

  function renderPane(anim) {
    if (open < 0) return;
    var tp = TOPICS[open], item = list.children[open];
    var pane = item.querySelector(".pane");
    pane.className = "pane" + (anim ? " anim" : "");
    pane.innerHTML = tp.panes[part];
    if (tp.panes.length > 1) {
      item.querySelector(".where").innerHTML = "Part " + (part + 1) + " of " + tp.panes.length + ": <b>" + tp.parts[part] + "</b>";
      item.querySelector(".btn-back").disabled = part === 0;
      item.querySelector(".btn-next").disabled = part === tp.panes.length - 1;
    }
  }

  function toggle(n) {
    open = open === n ? -1 : n;
    part = 0;
    app.classList.toggle("has-open", open >= 0);
    app.classList.toggle("fill", open >= 0 && TOPICS[open].panes.length > 1);
    Array.prototype.forEach.call(list.children, function (item, k) {
      var on = k === open;
      item.classList.toggle("open", on);
      item.querySelector(".head").setAttribute("aria-expanded", on ? "true" : "false");
      if (!on) item.querySelector(".pane").innerHTML = "";
    });
    renderPane(true);
  }

  function goPart(p) {
    if (open < 0 || p < 0 || p >= TOPICS[open].panes.length) return;
    part = p; renderPane(true);
  }

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  /* Test hook: open a topic and part directly, for example #open=4&part=2. */
  var m = location.hash.match(/open=(\d)(?:&part=(\d))?/);
  if (m) { toggle(+m[1] - 1); if (m[2]) goPart(+m[2] - 1); }
})();
</script>
