<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optional Reading Topics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Optional Reading for the page How AI Reads Pharma
   Documents: four topics as toggles, only one open at a time. Each closed toggle shows a
   statement title and a "Read this if..." hint so the student can choose.
   The toggles copy the shape, spacing, header layout, chevron and open and close behaviour of the
   frozen template accordions; their colours come only from this design system's tokens.
   Fixed stage: laid out once on a 760 x 850 design stage (set the Notion embed height to 850 px), then
   scaled as one piece to fit the embed frame and centred. Nothing scrolls. A topic too long to fit when
   open is split into short parts with Back and Next inside the open toggle. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff;
  --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --action:var(--extern-black); --on-action:var(--extern-white);
  --line:var(--gray-200); --focus-ring:var(--pfizer-blue); --gray-50:#f2f2f2;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --stage-w:760px; --stage-h:850px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;overflow:hidden;background:var(--surface);padding:16px 20px}

/* Accordion: the shape, spacing, header layout and chevron of the frozen template accordions
   (one bordered box, hairlines between items, title left and chevron right), in this design system's colours. */
.toggles{max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
/* A topic split into parts fills the stage, so Back and Next stay in one place from part to part. */
.app.fill .toggles{height:100%}
.item{flex:none;display:flex;flex-direction:column;min-height:0}
.item+.item{border-top:1px solid var(--line)}
.app.fill .item.open{flex:1 1 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;margin:0;border:0;background:none;text-align:left;cursor:pointer;padding:18px 20px;transition:background-color .15s ease}
.head:hover{background:var(--surface-card)}
.head:focus-visible{outline-offset:-2px;border-radius:0}
.ht{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{margin:0;font-family:var(--font-text);font-size:16px;font-weight:600;line-height:1.45;color:var(--ink)}
.hint{font-size:14px;line-height:1.45;color:var(--ink-muted)}
.chev{flex:none;width:20px;height:20px;color:var(--gray-600);transition:transform .2s ease}
.item.open .chev{transform:rotate(180deg)}

/* The open topic's reading area */
.body{display:none}
.item.open .body{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.pane{flex:1 1 auto;min-height:0;padding:2px 20px 14px;display:flex;flex-direction:column;gap:12px}
.pane p{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty}
.pane p b{font-weight:600;color:var(--ink)}
.pane h3{margin:4px 0 0;font-family:var(--font-text);font-size:16px;font-weight:600;line-height:1.35;color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.4;color:var(--card-text)}
th{text-align:left;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label);padding:8px 10px;background:var(--surface-card);vertical-align:bottom}
th:first-child{border-radius:var(--radius-xs) 0 0 var(--radius-xs)}
th:last-child{border-radius:0 var(--radius-xs) var(--radius-xs) 0}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td b{font-weight:600;color:var(--ink)}
td .src{display:block;font-style:italic;font-size:12.5px;color:var(--gray-600)}
.c-name{width:26%}
.messy .c-name{width:50%}
.words .c-name{width:55%}
.words td{padding:5px 10px}
.uses{font-size:13.5px}
.uses{line-height:1.38}
.uses .c-name{width:17%}
.uses td:nth-child(2){width:28%}
.uses td:nth-child(3){width:24%}
.uses td{padding:5px 9px}
.uses th{padding:7px 9px}

/* Lists, code, links and the video note, built from the design system's tokens */
.pane ol,.pane ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px;font-size:15.5px;line-height:1.55;color:var(--ink-muted)}
.pane li{padding-left:2px}
.pane li::marker{color:var(--step-label);font-weight:600}
.pane li b{font-weight:600;color:var(--ink)}
.pane ul.links{gap:8px}
.pane code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-card);color:var(--ink);padding:1px 5px;border-radius:5px}
.code{background:var(--surface-card);border-radius:var(--radius-sm);flex:none}
.code-head{padding:6px 14px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label);border-bottom:1px solid var(--blue-200)}
.code pre{margin:0;padding:9px 14px;font-family:var(--font-mono);font-size:13px;line-height:1.5;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.pane a{color:var(--pfizer-blue);font-weight:500;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.pane a.res{font-weight:600;white-space:nowrap}
.pane a .ext{width:13px;height:13px;margin-left:4px;vertical-align:-1px}
.pane a:hover{text-decoration-thickness:2px}
/* An old image or video from Notion, kept as a link, with its old caption under it when it had one */
.pane p.media{display:flex;flex-direction:column;gap:2px}
.pane p.media .cap{font-size:13.5px;line-height:1.45;font-style:italic;color:var(--gray-600)}
.callout{background:var(--gray-50);border-radius:var(--radius-sm);padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.callout p{font-size:15px}
.tag{display:inline-block;font-size:12px;line-height:16px;font-weight:600;padding:2px 8px;border-radius:var(--radius-xs);background:var(--blue-200);color:var(--ink);vertical-align:1px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Part Back and Next, only for topics with more than one part */
.pnav{flex:none;display:flex;align-items:center;gap:12px;padding:8px 20px;border-top:1px solid var(--line)}
.pnav[hidden]{display:none}
.where{flex:1;font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-text);font-size:14px;line-height:1.2;font-weight:600;padding:7px 14px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.btn svg{width:13px;height:13px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.btn-next:disabled{opacity:.35;cursor:default}
@media (prefers-reduced-motion:no-preference){ .pane.anim{animation:in .22s ease} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
@media (prefers-reduced-motion:reduce){ .chev,.head{transition:none} }
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="Optional reading: four topics. Open one at a time."><div class="toggles" id="toggles"></div></div>

<script>
(function () {
  "use strict";
  var CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5.5 7.75 4.5 4.5 4.5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var BACK = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var NEXT = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function table(cls, heads, rows) {
    return '<table class="' + cls + '"><thead><tr>' + heads.map(function (h, n) { return '<th scope="col"' + (n === 0 ? ' class="c-name"' : '') + '>' + h + '</th>'; }).join("") +
      '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (c, n) { return n === 0 ? '<td class="c-name"><b>' + c + '</b></td>' : '<td>' + c + '</td>'; }).join("") + '</tr>'; }).join("") + '</tbody></table>';
  }

  /* The text inside each topic is the old Notion text, word for word, with only the changes listed in the build notes
     (old-optional-content.md in the scratchpad holds the source passages and their page IDs). */
  var TOPICS = [
 {
  "title": "How LLMs work",
  "hint": "Read this if you've wondered how a chatbot writes its answers, one word at a time.",
  "parts": [
   "Making AI smarter with transformers",
   "What are transformers?",
   "What is attention?",
   "Generative AI models for text: LLMs",
   "How LLMs work?",
   "An example",
   "Why answers vary",
   "How are LLMs trained?",
   "How are LLMs trained? (continued)"
  ],
  "panes": [
   "<h3>Making AI Smarter with Transformers<\/h3><p><b>Deep learning<\/b> is a more advanced kind of <b>machine learning<\/b>, a part of AI where computers learn from data instead of just following fixed rules. It finds patterns in large amounts of data.<\/p><p>As deep learning improved, researchers looked for ways to make AI even better at understanding complex tasks, especially language. Early AI models struggled to process long sentences because they focused only on the most recent words and often <b>forgot important details<\/b> from earlier in the sentence.<\/p><p class=\"media\"><a class=\"res\" href=\"https://smitabudhiaextern.github.io/extern-html-pages/pfizer3-p1-m3-opt-phone-next-word.webp\" target=\"_blank\" rel=\"noopener noreferrer\">View image<svg class=\"ext\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6.5 3.5h-3v9h9v-3M9.5 3.5h3v3M12.5 3.5 7.5 8.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span class=\"sr-only\"> (opens in a new tab)<\/span><\/a><span class=\"cap\">Your phone can suggest the next word in a text message, but it lacks the ability to generate a fully coherent sentence.<\/span><\/p><p>Then, in 2017, a major breakthrough happened: <b><i>Transformer Architecture<\/i><\/b>.<\/p>",
   "<h3>What Are Transformers?<\/h3><p>Transformers are a more advanced type of deep learning model that <b>processes all words in a sentence at once<\/b>, instead of one by one. This allows them to understand the <b>full context<\/b> of a sentence much better than earlier models.<\/p><p><b><i>Transformers are not separate from Deep Learning: they are an improvement on it.<\/i><\/b> They help AI process information more efficiently, leading to major advancements in language understanding.<\/p><p>One of the key innovations that makes Transformers so powerful is called <b>attention<\/b>.<\/p>",
   "<h3>What Is Attention?<\/h3><p>Imagine you're typing a message on your phone, and it suggests the next word based on what you've written so far. If you type <b>\"Hello, how are\"<\/b>, your phone might suggest <b>\"you\"<\/b> next. But if you keep selecting the suggested words, the sentence can quickly stop making sense, because the system only looks at the last few words, not the full conversation.<\/p><p><b>Attention fixes this problem.<\/b> Instead of treating all words equally, AI <b>focuses on the most important words in a sentence<\/b>, helping it understand meaning better.<\/p><p>That's why AI models like <b>ChatGPT and Google Translate<\/b> can produce meaningful responses instead of just guessing random next words!<\/p>",
   "<h3>Generative AI Models for Text: LLMs<\/h3><p>Of all the things that robots can accomplish, turns out, talking like human beings has been the <a href=\"https://youtu.be/3wLqsRLvV-c\" target=\"_blank\" rel=\"noopener noreferrer\">most difficult accomplishment yet<span class=\"sr-only\"> (opens in a new tab)<\/span><\/a>. Being able to talk like human beings is at the core of the new generative AI technology. In order to understand the core of AI, it is important to become familiar with the concept of LLMs or Large Language Models.<\/p>",
   "<h3>How LLMs Work?<\/h3><p>Large Language Models (LLMs) operate by <b><i>predicting<\/i><\/b> the next word in a sequence of text. Here's a simplified algorithm demonstrating their process:<\/p><ul><li>The model receives a text as input.<\/li><li>The model tries to generate the most suitable <b>next word<\/b>.<\/li><li>The new word is added to the text, and the updated text is fed back into the model.<\/li><li>The process repeats.<\/li><\/ul>",
   "<p>For example, given the input \"Machine learning,\" the model predicts the next word as follows:<\/p><table class=\"words\"><thead><tr><th scope=\"col\" class=\"c-name\">Input text<\/th><th scope=\"col\">LLM response (next word)<\/th><\/tr><\/thead><tbody><tr><td class=\"c-name\">Machine learning<\/td><td>Machine learning <b>is<\/b><\/td><\/tr><tr><td class=\"c-name\">Machine learning is<\/td><td>Machine learning is <b>a<\/b><\/td><\/tr><tr><td class=\"c-name\">Machine learning is a<\/td><td>Machine learning is a <b>field<\/b><\/td><\/tr><tr><td class=\"c-name\">Machine learning is a field<\/td><td>Machine learning is a field <b>of<\/b><\/td><\/tr><tr><td class=\"c-name\">Machine learning is a field of<\/td><td>Machine learning is a field of <b>study<\/b><\/td><\/tr><\/tbody><\/table>",
   "<p>Thus, for the input \"Machine learning,\" the model predicts \"is\" as the next word. It then uses \"Machine learning is\" as the new input and predicts \"a\" next, continuing this process. This approach allows LLMs to generate coherent text based on their training data, giving the illusion of understanding the language when they are actually predicting the most likely next word in a sequence.<\/p><div class=\"callout\"><p>Here's an interesting detail: LLMs don't always choose the most likely next word. Instead, they <b>sample<\/b> from the top few possibilities, allowing for more creativity and variation. This is why ChatGPT can give different answers to the same question: it's not just repeating memorized text but generating responses dynamically.<\/p><\/div>",
   "<h3>How Are LLMs Trained?<\/h3><p>Large Language Models (LLMs) like <b>ChatGPT and Grok<\/b> learn by processing massive amounts of text from books, articles, and websites. Instead of being programmed with fixed rules, they <b>teach themselves<\/b> by identifying patterns in language.<\/p><p>The training process happens in <b>three main steps<\/b>:<\/p><ol><li><b>Learning from Text (Pretraining):<\/b> The model reads billions of sentences and learns to predict the next word, just like how your phone suggests words while typing. This helps it understand grammar, meaning, and context.<\/li><li><b>Improving Accuracy (Fine-Tuning):<\/b> The model is adjusted using specific examples to make it more useful and reliable. Think of it as a teacher correcting mistakes to improve a student's answers.<\/li><li><b>Getting Better with Feedback (Reinforcement Learning):<\/b> Humans review the model's responses and provide feedback, helping it refine answers to be more accurate and helpful over time.<\/li><\/ol>",
   "<p>These steps, combined with <b>advanced deep learning techniques like Transformers<\/b>, allow LLMs to generate human-like responses based on what they've learned, though they don't actually \"think\" like humans.<\/p>"
  ]
 },
 {
  "title": "Understanding natural language processing",
  "hint": "Read this if you want to see where NLP shows up in apps you already use.",
  "parts": [
   "Why NLP matters",
   "Natural language processing",
   "What can NLP do?",
   "How NLP works"
  ],
  "panes": [
   "<p>Before AI can generate text, it first needs to <b>understand language<\/b>: this is where <b>Natural Language Processing (NLP)<\/b> comes in.<\/p><p>Even though Generative AI models like ChatGPT rely on Transformer architecture, they wouldn't work without NLP. NLP <b><i>translates human language into structured data<\/i><\/b> that AI can process, making tasks like translation, summarization, and sentiment analysis possible.<\/p><h3>Why This Matters for This Externship<\/h3><p>Throughout this externship, you'll work with AI models that <b>process and extract insights from documents<\/b>. Understanding NLP will help you build <b>better AI-powered solutions for text analysis, search, and automation.<\/b><\/p><p>Now, let's explore how AI processes language before generating it.<\/p>",
   "<h3>Natural Language Processing<\/h3><p>NLP is a part of AI that mostly uses machine learning today. NLP focuses specifically on teaching computers how to understand and process human language.<\/p><p>WATCH: Every time you surf the internet you encounter a Natural Language Processing, or NLP, application. But what exactly is NLP and how does it work? In this lightboard video, Master Inventor with IBM, Martin Keen, visually explains what NLP is and why we need it, as well as how NLP takes unstructured human speech and converts it to structured data that a computer can understand. Don't forget to replay the timestamp 1:50 to 2:22<\/p><p class=\"media\"><a class=\"res\" href=\"https://youtu.be/fLvJ8VdHLA0\" target=\"_blank\" rel=\"noopener noreferrer\">Watch the video: What is NLP (Natural Language Processing)?<svg class=\"ext\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6.5 3.5h-3v9h9v-3M9.5 3.5h3v3M12.5 3.5 7.5 8.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span class=\"sr-only\"> (opens in a new tab)<\/span><\/a><\/p><p>Woah this video had at least 10 new phrases. Do you need to memorize these? Of course not! As long as you are able to make connections between different terms and concepts, you're good to go!<\/p>",
   "<p>Based on what you just watched in the video, here's a quick recap:<\/p><h3>What Can NLP Do?<\/h3><ol><li><b>Translate Languages:<\/b> Ever used <b>Google Translate<\/b>? NLP helps translate words from one language to another while keeping the meaning right!<\/li><li><b>Virtual Assistants &amp; Chatbots:<\/b> Alexa, Siri, and Google Assistant use NLP to understand what you say and respond. Chatbots in websites do the same for customer support.<\/li><li><b>Sentiment Analysis:<\/b> NLP can read product reviews or social media posts and guess if people are <b>happy<\/b> or <b>frustrated<\/b>. Example: \"This phone is amazing!\" (Positive) vs. \"This is the worst phone ever!\" (Negative)<\/li><li><b>Spam Detection:<\/b> NLP helps <b>email apps<\/b> detect spam by looking for common spam words like \"Congratulations! You won $1,000,000!\"<\/li><\/ol>",
   "<h3>How NLP Works<\/h3><p>NLP uses <b>smart techniques<\/b> to break down language into pieces computers can understand. Here are some:<\/p><ul><li><b>Stemming &amp; Lemmatization:<\/b> Reducing words to their root form. (\"running\", \"runs\" → \"run\")<\/li><li><b>Part of Speech Tagging:<\/b> Figuring out if a word is a <b>noun, verb, or adjective<\/b>.<\/li><\/ul><div class=\"callout\"><p>NLP helps computers read, understand, and generate human language so they can talk to us, translate languages, analyze emotions, and even detect spam! It's the reason AI can chat with you, answer questions, and help make life easier!<\/p><p>Next time you use Siri, Alexa, or Google Translate, remember: you're using NLP!<\/p><\/div><div class=\"callout\"><p><b>Quick Recap<\/b><\/p><p>NLP helps machines understand and analyze human language, enabling smarter search engines, chatbots, and automated document processing.<\/p><\/div>"
  ]
 },
 {
  "title": "What is computer vision?",
  "hint": "Read this if you're curious how computers make sense of pictures and scanned pages.",
  "parts": [
   "What computer vision is",
   "Computer vision in document processing"
  ],
  "panes": [
   "<p>Just as humans process the world through sight, <b>Computer Vision (CV)<\/b> enables machines to analyze, understand, and make sense of images and videos. It's the technology behind Face ID unlocking your phone.<\/p><p class=\"media\"><a class=\"res\" href=\"https://smitabudhiaextern.github.io/extern-html-pages/pfizer3-p1-m3-opt-face-id.png\" target=\"_blank\" rel=\"noopener noreferrer\">View image<svg class=\"ext\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6.5 3.5h-3v9h9v-3M9.5 3.5h3v3M12.5 3.5 7.5 8.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span class=\"sr-only\"> (opens in a new tab)<\/span><\/a><\/p><h3>How Does Computer Vision (CV) Work?<\/h3><p>At its core, <b>computer vision enables machines to understand and interpret images and videos, just like humans do<\/b>. But instead of eyes and a brain, computers rely on cameras, data, and algorithms to \"see\" the world.<\/p><p class=\"media\"><a class=\"res\" href=\"https://smitabudhiaextern.github.io/extern-html-pages/pfizer3-p1-m3-opt-object-detection.webp\" target=\"_blank\" rel=\"noopener noreferrer\">View image<svg class=\"ext\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6.5 3.5h-3v9h9v-3M9.5 3.5h3v3M12.5 3.5 7.5 8.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span class=\"sr-only\"> (opens in a new tab)<\/span><\/a><span class=\"cap\">Real-time small object detection in traffic analysis with computer vision<\/span><\/p>",
   "<ul><li><b>Document Processing -<\/b> In pharmaceutical and legal industries, CV automates data extraction from contracts, certificates, and compliance documents, reducing manual work.<\/li><\/ul><div class=\"callout\"><p>OPTIONAL READ: The article by Viso.ai explains Computer Vision (CV), how it enables machines to interpret visual data, and its applications in self-driving cars, healthcare, and security. Read it for a more comprehensive understanding of the concept.<\/p><p><a class=\"res\" href=\"https://viso.ai/computer-vision/what-is-computer-vision/\" target=\"_blank\" rel=\"noopener noreferrer\">What Is Computer Vision? (Viso.ai)<svg class=\"ext\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6.5 3.5h-3v9h9v-3M9.5 3.5h3v3M12.5 3.5 7.5 8.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span class=\"sr-only\"> (opens in a new tab)<\/span><\/a><\/p><\/div><div class=\"callout\"><p>OPTIONAL WATCH: Watch this video from American tech giant NVIDIA explaining the various areas where Computer Vision is being utilized.<\/p><p><a class=\"res\" href=\"https://youtu.be/OnTgbN3uXvw?si=wZql4IEnv4jy9DOU\" target=\"_blank\" rel=\"noopener noreferrer\">What Is Computer Vision &amp; Why Does It Matter? (NVIDIA, YouTube)<svg class=\"ext\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6.5 3.5h-3v9h9v-3M9.5 3.5h3v3M12.5 3.5 7.5 8.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span class=\"sr-only\"> (opens in a new tab)<\/span><\/a><\/p><\/div>"

   "<h3>How AI Is Transforming Pharmaceutical Document Processing<\/h3><p>The pharmaceutical industry handles a continuous flow of documentation, and AI is revolutionizing how these documents are processed. Here's a breakdown of the key use cases:<\/p><table class=\"uses\"><thead><tr><th scope=\"col\" class=\"c-name\">Use Case<\/th><th scope=\"col\">What AI Does<\/th><th scope=\"col\">How It Works<\/th><th scope=\"col\">Real-Life Example<\/th><\/tr><\/thead><tbody><tr><td class=\"c-name\"><b>Document Classification<\/b><\/td><td>Sorts documents into types like Quality Certificates, Compliance Bulletins, and Technical Bulletins.<\/td><td>AI analyzes features like layout, headers, and keywords to categorize files.<\/td><td>Compliance teams automatically separate certificates from bulletins within large vendor files.<\/td><\/tr><tr><td class=\"c-name\"><b>Data Extraction<\/b><\/td><td>Extracts details like dates, revision numbers, vendor names, and batch numbers from documents.<\/td><td>CV scans the document to extract text (Optical Character Recognition), and NLP identifies specific details.<\/td><td>AI pulls the effective date and revision number from a Compliance Bulletin, saving hours of manual review.<\/td><\/tr><\/tbody><\/table>",

  var app = document.getElementById("app"), list = document.getElementById("toggles");
  var open = -1, part = 0;

  TOPICS.forEach(function (tp, n) {
    var item = document.createElement("div");
    item.className = "item";
    item.innerHTML =
      '<button type="button" class="head" id="h' + n + '" aria-expanded="false" aria-controls="b' + n + '">' +
        '<span class="ht"><span class="t">' + tp.title + '</span><span class="hint">' + tp.hint + '</span></span>' +
        CHEV +
      '</button>' +
      '<div class="body" id="b' + n + '" role="region" aria-labelledby="h' + n + '">' +
        '<div class="pane" aria-live="polite"></div>' +
        '<div class="pnav"' + (tp.panes.length > 1 ? '' : ' hidden') + '>' +
          '<span class="where"></span>' +
          '<button type="button" class="btn btn-back">' + BACK + 'Back</button>' +
          '<button type="button" class="btn btn-next">Next' + NEXT + '</button>' +
        '</div>' +
      '</div>';
    item.querySelector(".head").addEventListener("click", function () { toggle(n); });
    item.querySelector(".btn-back").addEventListener("click", function () { goPart(part - 1); });
    item.querySelector(".btn-next").addEventListener("click", function () { goPart(part + 1); });
    list.appendChild(item);
  });

  function renderPane(anim) {
    if (open < 0) return;
    var tp = TOPICS[open], item = list.children[open];
    var pane = item.querySelector(".pane");
    pane.className = "pane" + (anim ? " anim" : "");
    pane.innerHTML = tp.panes[part];
    if (tp.panes.length > 1) {
      item.querySelector(".where").innerHTML = "Part " + (part + 1) + " of " + tp.panes.length + ": <b>" + tp.parts[part] + "</b>";
      item.querySelector(".btn-back").disabled = part === 0;
      item.querySelector(".btn-next").disabled = part === tp.panes.length - 1;
    }
  }

  function toggle(n) {
    open = open === n ? -1 : n;
    part = 0;
    app.classList.toggle("has-open", open >= 0);
    app.classList.toggle("fill", open >= 0 && TOPICS[open].panes.length > 1);
    Array.prototype.forEach.call(list.children, function (item, k) {
      var on = k === open;
      item.classList.toggle("open", on);
      item.querySelector(".head").setAttribute("aria-expanded", on ? "true" : "false");
      if (!on) item.querySelector(".pane").innerHTML = "";
    });
    renderPane(true);
  }

  function goPart(p) {
    if (open < 0 || p < 0 || p >= TOPICS[open].panes.length) return;
    part = p; renderPane(true);
  }

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  /* Test hook: open a topic and part directly, for example #open=4&part=2. */
  var m = location.hash.match(/open=(\d)(?:&part=(\d))?/);
  if (m) { toggle(+m[1] - 1); if (m[2]) goPart(+m[2] - 1); }
})();
