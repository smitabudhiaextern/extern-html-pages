<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What a Finding Rests On</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#FDF8F8;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
color:#484646;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#w{position:absolute;top:0;left:0;width:960px;height:540px;overflow:hidden;transform-origin:top left}
.slide{position:absolute;top:0;left:0;width:960px;height:540px;
padding:24px 72px 20px;display:grid;grid-template-rows:20px 14px 402px 16px 44px;
background:#FDF8F8;text-align:left}
.slide[hidden]{display:none}
.hd{grid-row:1;display:flex;align-items:center;justify-content:space-between;
font-size:13px;line-height:20px;color:#484646}
.hd .rh{font-weight:500}
.hd .pos{font-variant-numeric:tabular-nums}
.bd{grid-row:3;height:402px;display:flex;flex-direction:column}
.ab{grid-row:5;height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.abl,.abr{display:flex;align-items:center;gap:12px}
h1,h2{font-weight:600;color:#1C1B1B}
h1:focus,h2:focus,h1.fx,h2.fx{outline:3px solid #001D69;outline-offset:4px;border-radius:2px}
h1{font-size:30px;line-height:1.16;width:fit-content}
h2{font-size:26px;line-height:1.2;width:fit-content}
.ln{font-size:18px;line-height:1.5;color:#484646;margin-top:8px;max-width:730px}
.fn{font-size:15px;line-height:1.5;color:#1C1B1B;font-weight:500;margin-top:8px}
.viz{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:8px}
.viz svg{width:100%;height:100%;max-height:100%;display:block;overflow:visible}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{display:block;width:18px;height:18px;fill:none;stroke:#001D69;stroke-width:1.8;
stroke-linecap:round;stroke-linejoin:round}
.btn{font-family:inherit;font-size:15px;font-weight:500;line-height:1;height:40px;
padding:0 20px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
border:1px solid #001D69;background:#001D69;color:#FDF8F8}
.btn .ic{stroke:#FDF8F8}
.btn.sec{background:transparent;color:#001D69}
.btn.sec .ic{stroke:#001D69}
.btn:disabled{background:transparent;border-color:#484646;color:#484646;cursor:default}
.btn:disabled .ic{stroke:#484646}
.btn:focus-visible{outline:3px solid #001D69;outline-offset:2px}

/* shared animation primitives */
.fade{opacity:0;transition:opacity .38s ease}
.fade.on{opacity:1}
.rise{opacity:0;transform:translateY(8px);transform-box:fill-box;transform-origin:center;
transition:opacity .34s ease,transform .34s ease}
.rise.on{opacity:1;transform:translateY(0)}
.draw{fill:none;stroke:#001D69;stroke-width:1.5;stroke-linecap:round;
stroke-dasharray:280;stroke-dashoffset:280;transition:stroke-dashoffset .55s ease}
.draw.on{stroke-dashoffset:0}
.svgt{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.lab{font-size:13px;fill:#484646}
.labk{font-size:13px;font-weight:600;fill:#1C1B1B}
.tiny{font-size:11px;fill:#484646}
.page{fill:#FDF8F8;stroke:#001D69;stroke-width:1.5}
.ghost{fill:none;stroke:#001D69;stroke-width:1.3;stroke-dasharray:4 4;opacity:.55}
.bar{fill:#001D69;opacity:.28}
.barh{fill:#DCE1FF}
.card{fill:#FDF8F8;stroke:#001D69;stroke-width:1.6}
.chip{fill:#DCE1FF;stroke:#001D69;stroke-width:1.4}
.mark{fill:#DCE1FF}

/* panel 3, the exchange */
.chat{flex:1;display:flex;flex-direction:column;gap:12px;margin-top:10px;min-height:0}
.who{display:flex;align-items:center;gap:12px}
.av{position:relative;width:52px;height:52px;border-radius:50%;overflow:hidden;flex:0 0 auto;
background:#DCE1FF;display:flex;align-items:center;justify-content:center}
.av span{font-size:19px;font-weight:600;color:#001D69;letter-spacing:.5px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.who .nm{font-size:16px;font-weight:600;color:#1C1B1B;line-height:1.3}
.who .rl{font-size:13px;color:#484646;line-height:1.3}
.bub{max-width:660px;margin-left:64px;background:#DCE1FF;color:#1C1B1B;
border-radius:4px 14px 14px 14px;padding:12px 16px;font-size:17px;line-height:1.45;
opacity:0;transform:translateY(8px);transition:opacity .32s ease,transform .32s ease}
.bub.on{opacity:1;transform:translateY(0)}
.bub + .bub{border-radius:14px}
.typ{margin-left:64px;display:flex;gap:5px;align-items:center;height:0;overflow:hidden;
padding:0 4px;opacity:0;transition:opacity .2s ease,height .2s ease}
.typ.on{height:22px;opacity:1}
.typ i{width:6px;height:6px;border-radius:50%;background:#001D69;opacity:.35;
animation:bl 1.1s infinite ease-in-out}
.typ i:nth-child(2){animation-delay:.16s}
.typ i:nth-child(3){animation-delay:.32s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:.85;transform:translateY(-3px)}}
.closer{margin-left:64px;margin-top:6px;font-size:16px;line-height:1.5;color:#1C1B1B;font-weight:500;
border-left:3px solid #001D69;padding-left:14px;opacity:0;transition:opacity .38s ease}
.closer.on{opacity:1}

#w.pm{width:480px;height:640px}
#w.pm .slide{width:480px;height:640px;padding:24px 32px 20px;
grid-template-rows:20px 14px 502px 16px 44px}
#w.pm .bd{height:502px}
#w.pm h1{font-size:23px}
#w.pm h2{font-size:21px}
#w.pm .ln{font-size:16px}
#w.pm .fn{font-size:14px}
#w.pm .viz svg{max-height:none}
#w.pm .bub{margin-left:0;font-size:16px;max-width:none}
#w.pm .typ,#w.pm .closer{margin-left:0}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="w"></div>
<script>
(function(){
var W=document.getElementById('w');
var RUNHEAD='What a Finding Rests On';
var N=3;
var P={
back:'<line x1="20" y1="12" x2="5.5" y2="12"/><polyline points="11 6.5 5.5 12 11 17.5"/>',
next:'<line x1="4" y1="12" x2="18.5" y2="12"/><polyline points="13 6.5 18.5 12 13 17.5"/>',
replay:'<polyline points="4 5 4 10.5 9.5 10.5"/><path d="M4.6 14.2a8 8 0 1 0 1.2-6"/>'};
function ic(d){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+d+'</svg>';}
function svg(vb,inner){return '<svg viewBox="'+vb+'" class="svgt" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';}

/* ---------- panel 1 : the length ---------- */
function vizLength(){
  var s='';
  /* left, what people expect: three full pages stacked */
  var lx=150, py=[2,98,194];
  s+='<text class="lab" x="'+(lx+44)+'" y="308" text-anchor="middle">a page for each finding</text>';
  for(var i=0;i<3;i++){
    s+='<g class="rise" data-i="'+i+'">'+
       '<rect class="ghost" x="'+lx+'" y="'+py[i]+'" width="88" height="88" rx="3"/>'+
       '<rect class="bar" x="'+(lx+10)+'" y="'+(py[i]+12)+'" width="52" height="4" rx="2"/>'+
       '<rect class="bar" x="'+(lx+10)+'" y="'+(py[i]+24)+'" width="68" height="3" rx="1.5"/>'+
       '<rect class="bar" x="'+(lx+10)+'" y="'+(py[i]+33)+'" width="68" height="3" rx="1.5"/>'+
       '<rect class="bar" x="'+(lx+10)+'" y="'+(py[i]+42)+'" width="68" height="3" rx="1.5"/>'+
       '<rect class="bar" x="'+(lx+10)+'" y="'+(py[i]+51)+'" width="68" height="3" rx="1.5"/>'+
       '<rect class="bar" x="'+(lx+10)+'" y="'+(py[i]+60)+'" width="68" height="3" rx="1.5"/>'+
       '<rect class="bar" x="'+(lx+10)+'" y="'+(py[i]+69)+'" width="40" height="3" rx="1.5"/>'+
       '</g>';
  }
  /* arrow */
  s+='<g class="fade" data-i="10">'+
     '<line x1="288" y1="146" x2="352" y2="146" stroke="#001D69" stroke-width="1.5" stroke-linecap="round"/>'+
     '<polyline points="342,138 352,146 342,154" fill="none" stroke="#001D69" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'+
     '</g>';
  /* right, what it is: one page, three short findings */
  var rx=400;
  s+='<g class="fade" data-i="11"><rect class="page" x="'+rx+'" y="6" width="196" height="284" rx="4"/>'+
     '<rect class="barh" x="'+(rx+16)+'" y="24" width="164" height="22" rx="3"/>'+
     '<text class="tiny" x="'+(rx+24)+'" y="39" style="font-weight:600;fill:#001D69">Section 1</text></g>';
  var fy=[64,140,216];
  for(i=0;i<3;i++){
    s+='<g class="rise" data-i="'+(20+i)+'">'+
       '<rect class="bar" x="'+(rx+16)+'" y="'+fy[i]+'" width="54" height="4" rx="2" style="opacity:.85"/>'+
       '<rect class="bar" x="'+(rx+16)+'" y="'+(fy[i]+14)+'" width="164" height="3" rx="1.5"/>'+
       '<rect class="bar" x="'+(rx+16)+'" y="'+(fy[i]+23)+'" width="164" height="3" rx="1.5"/>'+
       '<rect class="bar" x="'+(rx+16)+'" y="'+(fy[i]+32)+'" width="118" height="3" rx="1.5"/>'+
       '</g>';
  }
  s+='<text class="lab" x="'+(rx+98)+'" y="308" text-anchor="middle">a paragraph for each finding</text>';
  /* the whole of section 1, measured */
  s+='<g class="fade" data-i="30">'+
     '<line x1="626" y1="6" x2="626" y2="290" stroke="#001D69" stroke-width="1.3" opacity=".55"/>'+
     '<line x1="620" y1="6" x2="632" y2="6" stroke="#001D69" stroke-width="1.3" opacity=".55"/>'+
     '<line x1="620" y1="290" x2="632" y2="290" stroke="#001D69" stroke-width="1.3" opacity=".55"/>'+
     '<text class="labk" x="646" y="140">The whole of</text>'+
     '<text class="labk" x="646" y="158">section 1</text>'+
     '<text class="lab" x="646" y="180">Scope, the inventory</text>'+
     '<text class="lab" x="646" y="196">behind it, and every</text>'+
     '<text class="lab" x="646" y="212">finding in it.</text>'+
     '</g>';
  return svg('0 0 816 316',s);
}

/* ---------- panel 2 : traceability ---------- */
function vizTrace(){
  var s='';
  s+='<g class="fade" data-i="0"><rect class="card" x="4" y="14" width="402" height="196" rx="10"/>'+
     '<text class="tiny" x="26" y="44" style="font-weight:600;fill:#001D69;letter-spacing:.6px">FINDING F-17</text>'+
     '<text class="labk" x="26" y="70" style="font-size:15px">The log retention the policy promises is</text>'+
     '<text class="labk" x="26" y="90" style="font-size:15px">not what the branches deliver.</text>'+
     '<text class="lab" x="26" y="118">Policy says twelve months. Head office complies.</text>'+
     '<text class="lab" x="26" y="136">The branch appliances retain thirty days.</text>'+
     '<line x1="26" y1="154" x2="384" y2="154" stroke="#001D69" stroke-width="1" opacity=".3"/>'+
     '</g>';
  s+='<g class="fade" data-i="1">'+
     '<rect class="mark" x="18" y="166" width="374" height="30" rx="6"/>'+
     '<text class="labk" x="26" y="186" style="font-size:13px">Evidence:</text>'+
     '<text class="lab" x="90" y="186" style="fill:#1C1B1B;font-size:12.5px">policy section 7.1; appliance configuration exports</text>'+
     '</g>';
  /* connectors out to the artifacts */
  s+='<path class="draw" data-i="2" d="M396 181 C 444 181, 444 78, 486 78"/>';
  /* artifact one */
  s+='<g class="rise" data-i="4">'+
     '<rect class="chip" x="486" y="34" width="326" height="84" rx="10"/>'+
     '<text class="labk" x="504" y="60" style="font-size:14px">A configuration export</text>'+
     '<text class="lab" x="504" y="82">A file a system produces listing its</text>'+
     '<text class="lab" x="504" y="100">own settings. Named on this finding.</text>'+
     '</g>';
  /* artifact two */
  s+='<g class="rise" data-i="5">'+
     '<text class="tiny" x="486" y="164" style="font-weight:600;fill:#001D69;letter-spacing:.6px">THE OTHER KIND, ON A DIFFERENT FINDING</text>'+
     '<rect class="chip" x="486" y="176" width="326" height="84" rx="10"/>'+
     '<text class="labk" x="504" y="202" style="font-size:14px">A patch log</text>'+
     '<text class="lab" x="504" y="224">The record of which updates got installed</text>'+
     '<text class="lab" x="504" y="242">on which machine and when. Named on F-11.</text>'+
     '</g>';
  s+='<text class="lab" x="204" y="240" text-anchor="middle">A stranger can go and check it.</text>';
  return svg('0 0 816 296',s);
}

/* ---------- panel 3 : the exchange ---------- */
var DANA=[
 'An artifact is something you could put in a stranger&rsquo;s hand.',
 'Not your notes. Not what somebody told you on the phone.',
 'A dated export, a signed sheet, a log entry with a name on it.'];
function chatHTML(){
  var s='<div class="chat">';
  s+='<div class="who fade" data-i="0"><div class="av">'+
     '<span>DR</span><img src="dana-reyes.jpg" alt="" onerror="this.remove()">'+
     '</div><div><div class="nm">Dana Reyes</div>'+
     '<div class="rl">Your supervisor, vCISO Services</div></div></div>';
  for(var i=0;i<DANA.length;i++){
    s+='<div class="typ" id="t'+i+'" aria-hidden="true"><i></i><i></i><i></i></div>';
    s+='<div class="bub" id="b'+i+'">'+DANA[i]+'</div>';
  }
  s+='<div class="closer" id="cl">Where the artifact does not exist, the finding says so in those words instead of going quiet.</div>';
  s+='</div>';
  return s;
}

var COPY=[
{h:'How long it actually is',
 l:'Section 1 covers the whole scope of the engagement and the inventory behind it, and it is short.',
 f:'Findings run a paragraph each, not a page.',
 alt:'On the left, three full pages, one per finding, which is what most people expect. On the right, the whole of section 1 on a single page: a heading, then three findings of one short paragraph each. Section 1 covers the scope, the inventory behind it, and every finding in it.',
 viz:vizLength},
{h:'What each one rests on',
 l:'Every finding names the thing it rests on.',
 f:'',
 alt:'Finding F-17 from the Harlan Ridge report: the log retention the policy promises is not what the branches deliver. Policy says twelve months, head office complies, the branch appliances retain thirty days. Its evidence line reads: policy section 7.1, appliance configuration exports. Two lines run from that evidence line to the two artifacts it names. A configuration export is a file a system produces listing its own settings. A patch log is the record of which updates got installed on which machine and when.',
 viz:vizTrace},
{h:'All of those go by one word here',
 l:'',
 f:'',
 alt:'Dana Reyes, your supervisor at vCISO Services, says: an artifact is something you could put in a stranger’s hand. Not your notes. Not what somebody told you on the phone. A dated export, a signed sheet, a log entry with a name on it. Where the artifact does not exist, the finding says so in those words instead of going quiet.',
 chat:true}];

/* ---------- build ---------- */
var slides=[],heads=[];
for(var i=0;i<N;i++){
  var sec=document.createElement('section');
  sec.className='slide';
  sec.setAttribute('role','group');
  sec.setAttribute('aria-label','Panel '+(i+1)+' of '+N);
  if(i>0){sec.hidden=true;}
  var c=COPY[i];
  var html='<div class="hd"><span class="rh">'+(i>0?RUNHEAD:'')+'</span><span class="pos">'+(i+1)+' of '+N+'</span></div>';
  html+='<div class="bd">';
  html+=(i===0?'<h1 tabindex="-1">':'<h2 tabindex="-1">')+c.h+(i===0?'</h1>':'</h2>');
  if(c.l){html+='<p class="ln">'+c.l+'</p>';}
  html+='<p class="sr">'+c.alt+'</p>';
  html+=c.chat?chatHTML():'<div class="viz">'+c.viz()+'</div>';
  if(c.f){html+='<p class="fn">'+c.f+'</p>';}
  html+='</div>';
  html+='<div class="ab"><div class="abl">'+
        '<button class="btn sec" type="button" data-a="back">'+ic(P.back)+'Back</button>'+
        '<button class="btn sec" type="button" data-a="replay">'+ic(P.replay)+'Play again</button>'+
        '</div><div class="abr">'+
        (i===N-1?'':'<button class="btn" type="button" data-a="next">Next'+ic(P.next)+'</button>')+
        '</div></div>';
  sec.innerHTML=html;
  W.appendChild(sec);
  slides.push(sec);
  heads.push(sec.querySelector('h1,h2'));
}

/* ---------- animation ---------- */
var timers=[],cur=0;
var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function clear(){for(var i=0;i<timers.length;i++){clearTimeout(timers[i]);}timers=[];}
function at(ms,fn){if(RM){fn();return;}timers.push(setTimeout(fn,ms));}
function all(sec,sel){return Array.prototype.slice.call(sec.querySelectorAll(sel));}
function reset(sec){
  all(sec,'.fade,.rise,.draw,.bub,.typ,.closer').forEach(function(e){e.classList.remove('on');});
  void sec.offsetWidth;
}
function seq(sec,sel,step,start){
  all(sec,sel).forEach(function(e,i){at((start||0)+i*step,function(){e.classList.add('on');});});
}
function byData(sec,v){return sec.querySelector('[data-i="'+v+'"]')||{classList:{add:function(){}}};}

function play(n){
  var sec=slides[n];
  clear();reset(sec);
  if(n===0){
    seq(sec,'[data-i="0"],[data-i="1"],[data-i="2"]',180,150);
    at(900,function(){byData(sec,10).classList.add('on');});
    at(1250,function(){byData(sec,11).classList.add('on');});
    seq(sec,'[data-i="20"],[data-i="21"],[data-i="22"]',200,1600);
    at(2500,function(){byData(sec,30).classList.add('on');});
  }
  else if(n===1){
    at(150,function(){byData(sec,0).classList.add('on');});
    at(900,function(){byData(sec,1).classList.add('on');});
    at(1500,function(){byData(sec,2).classList.add('on');});
    at(1950,function(){byData(sec,4).classList.add('on');});
    at(2250,function(){byData(sec,5).classList.add('on');});
  }
  else{
    at(150,function(){all(sec,'.who')[0].classList.add('on');});
    var t=700;
    for(var k=0;k<DANA.length;k++){
      (function(k,t){
        at(t,function(){sec.querySelector('#t'+k).classList.add('on');});
        at(t+750,function(){
          sec.querySelector('#t'+k).classList.remove('on');
          sec.querySelector('#b'+k).classList.add('on');
        });
      })(k,t);
      t+=1250;
    }
    at(t+250,function(){sec.querySelector('#cl').classList.add('on');});
  }
}

/* ---------- navigation ---------- */
function show(n){
  if(n<0||n>=N){return;}
  slides[cur].hidden=true;
  cur=n;
  slides[cur].hidden=false;
  all(slides[cur],'[data-a="back"]').forEach(function(b){b.disabled=(cur===0);});
  heads[cur].classList.add('fx');
  heads[cur].focus();
  play(cur);
  fit();
}
heads.forEach(function(h){h.addEventListener('blur',function(){h.classList.remove('fx');});});
W.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('button[data-a]'):null;
  if(!b){return;}
  var a=b.getAttribute('data-a');
  if(a==='next'){show(cur+1);}
  else if(a==='back'){show(cur-1);}
  else if(a==='replay'){play(cur);}
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){show(cur+1);}
  else if(e.key==='ArrowLeft'){show(cur-1);}
});

function fit(){
  var pm=window.innerWidth<600;
  if(pm){W.classList.add('pm');}else{W.classList.remove('pm');}
  var cw=pm?480:960,ch=pm?640:540;
  var s=Math.min(window.innerWidth/cw,window.innerHeight/ch,1);
  W.style.transform='scale('+s+')';
  W.style.left=Math.max(0,(window.innerWidth-cw*s)/2)+'px';
  W.style.top=Math.max(0,(window.innerHeight-ch*s)/2)+'px';
}
window.addEventListener('resize',fit);
window.addEventListener('load',fit);
slides[0].querySelector('[data-a="back"]').disabled=true;
fit();
var start=parseInt((location.hash||'').replace('#',''),10);
if(start>=1&&start<=N){show(start-1);}else{play(0);}
}());
</script>
</body>
</html>
