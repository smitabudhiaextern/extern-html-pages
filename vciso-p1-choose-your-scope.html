on:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.6" fill="#001D69" stroke="none"/>',
ok:'<circle cx="12" cy="12" r="9"/><polyline points="7.7 12.3 10.6 15.2 16.3 8.8"/>',
key:'<circle cx="12" cy="12" r="9"/><line x1="12" y1="7" x2="12" y2="12.6"/><line x1="12" y1="16.3" x2="12" y2="16.4"/>',
dot:'<circle cx="12" cy="12" r="3.4"/>',
mark:'<line x1="4" y1="12" x2="18.5" y2="12"/><polyline points="13 6.5 18.5 12 13 17.5"/>',
warn:'<path d="M12 4.4 21.5 19.6H2.5Z"/><line x1="12" y1="9.7" x2="12" y2="14.7"/><line x1="12" y1="17.4" x2="12" y2="17.5"/>',
back:'<line x1="20" y1="12" x2="5.5" y2="12"/><polyline points="11 6.5 5.5 12 11 17.5"/>',
next:'<line x1="4" y1="12" x2="18.5" y2="12"/><polyline points="13 6.5 18.5 12 13 17.5"/>'};
function ic(d,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+d+'</svg>';}

var w=document.getElementById('w');
var tabs=document.getElementById('tabs');
var pnl=document.getElementById('pnl');
var go1=document.getElementById('go1');
var cnt=document.getElementById('cnt');
var slides=[document.getElementById('sl1')];
var heads=[document.getElementById('h1')];
var tabEl=[],svc=null,stage=0,cur=0,lo=0,hi=0;
var rows=[],pick=[null,null,null,null,null,null,null,null];
var grp=null,go2=null,scnt=null;

function armHead(h){if(!h){return;}h.addEventListener('blur',function(){h.classList.remove('fx');});}
function hdr(n){
  var rh=(n===1)?'':'Your engagement: '+SNAME[svc];
  return '<div class="hd"><span class="rh">'+rh+'</span><span class="pos">'+n+' of '+N+'</span></div>';
}
function backBtn(){return '<button class="btn sec" type="button" data-nav="-1">'+ic(P.back)+'Back</button>';}
function nextBtn(label){return '<button class="btn" type="button" data-nav="1">'+label+ic(P.next)+'</button>';}

for(var i=0;i<4;i++){(function(i){
  var t=document.createElement('div');
  t.className='tab';
  t.setAttribute('role','radio');
  t.setAttribute('aria-checked','false');
  t.setAttribute('tabindex',i===0?'0':'-1');
  t.innerHTML='<span class="ti">'+ic(P.off)+'</span><span class="tn">'+SLET[i]+
    ' &middot; '+SNAME[i]+'</span>';
  tabs.appendChild(t);
  tabEl.push(t);
  t.addEventListener('click',function(){selSvc(i);});
  t.addEventListener('keydown',function(e){keyTab(e,i);});
})(i);}

function panelHtml(i){
  var c=CARD[i],h='';
  h+='<p class="pl hi">'+c.d+'</p><p class="pl">'+c.l+'</p><p class="pl">'+c.z+
    '</p><p class="pl">'+c.f+'</p>';
  for(var k=0;k<PANDEF[i].length;k++){
    var v=VOC[PANDEF[i][k]];
    h+='<p class="df"><b>'+v.w+'.</b> '+v.d+'</p>';
  }
  return h;
}
function selSvc(i){
  if(stage>0){return;}
  svc=i;
  for(var q=0;q<4;q++){
    var on=q===i;
    tabEl[q].setAttribute('aria-checked',on?'true':'false');
    tabEl[q].setAttribute('tabindex',on?'0':'-1');
    tabEl[q].querySelector('.ti').innerHTML=ic(on?P.on:P.off);
  }
  pnl.innerHTML=panelHtml(i);
  go1.disabled=false;
  go1.setAttribute('aria-disabled','false');
}
function keyTab(e,i){
  if(stage>0){return;}
  var k=e.key,nx=null;
  if(k===' '||k==='Enter'||k==='Spacebar'){e.preventDefault();e.stopPropagation();selSvc(i);return;}
  if(k==='ArrowRight'||k==='ArrowDown'){nx=(i+1)%4;}
  if(k==='ArrowLeft'||k==='ArrowUp'){nx=(i+3)%4;}
  if(k==='Home'){nx=0;}
  if(k==='End'){nx=3;}
  if(nx!==null){e.preventDefault();e.stopPropagation();selSvc(nx);tabEl[nx].focus();}
}

function mk(n,bodyHtml,extraCls,leftHtml,rightHtml){
  var s=document.createElement('section');
  s.className='slide '+extraCls+' t'+n;
  s.setAttribute('role','group');
  s.setAttribute('aria-label','Slide '+n+' of '+N);
  s.hidden=true;
  s.innerHTML=hdr(n)+'<div class="bd">'+bodyHtml+'</div>'+
    '<div class="ab"><div class="abl">'+leftHtml+'</div><div class="abr">'+rightHtml+'</div></div>';
  w.appendChild(s);
  slides.push(s);
  var h=s.querySelector('h1,h2');
  heads.push(h);
  armHead(h);
  return s;
}

function wordsHtml(){
  var d=SORTDEF[svc],h='<h2 tabindex="-1">Words On The Next Screen</h2>'+
    '<p class="sub">Plain meanings. Nothing here is being tested.</p><div class="dlist">';
  for(var k=0;k<d.length;k++){
    var v=VOC[d[k]];
    h+='<div class="drow"><span class="di">'+ic(P.dot,'sm')+'</span>'+
      '<p class="dt"><b>'+v.w+'.</b> '+v.d+'</p></div>';
  }
  return h+'</div>';
}
function sortHtml(){
  return '<h2 tabindex="-1">Eight Things Cumberland Owns Or Does</h2>'+
    '<p class="prompt">Which are inside your engagement? Place all eight. '+
    'Guess where you are unsure.</p>'+
    '<div id="grp"></div>';
}
function buildSort(){
  grp=document.getElementById('grp');
  for(var i=0;i<8;i++){(function(i){
    var r=document.createElement('div');
    r.className='item';
    r.innerHTML='<span class="n">'+(i+1)+'</span><p class="c" id="c'+i+'">'+ITEM[svc][i]+'</p>'+
      '<div class="seg" role="radiogroup" aria-labelledby="c'+i+'">'+
      '<button class="opt" type="button" role="radio" aria-checked="false" tabindex="0" data-v="0">'+
      ic(P.off,'sm')+LBL[0]+'</button>'+
      '<button class="opt" type="button" role="radio" aria-checked="false" tabindex="-1" data-v="1">'+
      ic(P.off,'sm')+LBL[1]+'</button></div>';
    grp.appendChild(r);
    rows.push(r);
    var opts=r.querySelectorAll('.opt');
    for(var v=0;v<2;v++){(function(v){
      opts[v].addEventListener('click',function(){place(i,v);});
      opts[v].addEventListener('keydown',function(e){keyOpt(e,i,v);});
    })(v);}
  })(i);}
}
function place(i,v){
  if(stage>1){return;}
  pick[i]=v;
  var opts=rows[i].querySelectorAll('.opt');
  for(var q=0;q<2;q++){
    var on=q===v;
    opts[q].setAttribute('aria-checked',on?'true':'false');
    opts[q].setAttribute('tabindex',on?'0':'-1');
    opts[q].innerHTML=ic(on?P.on:P.off,'sm')+LBL[q];
  }
  count();
}
function keyOpt(e,i,v){
  if(stage>1){return;}
  var k=e.key,nx=null;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowUp'){nx=(v+1)%2;}
  if(k==='Home'){nx=0;}
  if(k==='End'){nx=1;}
  if(nx!==null){
    e.preventDefault();e.stopPropagation();
    place(i,nx);
    rows[i].querySelectorAll('.opt')[nx].focus();
  }
}
function count(){
  var left=0;
  for(var q=0;q<8;q++){if(pick[q]===null){left++;}}
  if(left===0){
    scnt.textContent='All eight placed.';
    go2.disabled=false;
    go2.setAttribute('aria-disabled','false');
  }else{
    scnt.textContent=left+' left to place';
    go2.disabled=true;
    go2.setAttribute('aria-disabled','true');
  }
}
function lockSort(){
  for(var i=0;i<8;i++){
    var seg=rows[i].querySelector('.seg');
    if(seg){seg.parentNode.removeChild(seg);}
    var p=document.createElement('p');
    p.className='ymark';
    p.innerHTML=ic(P.mark,'sm')+'Your placement: '+SCOPE[pick[i]]+'.';
    rows[i].appendChild(p);
  }
}

function vrow(i){
  var a=ANS[svc][i],right=(pick[i]===a),isTrap=(i===TRAP[svc]);
  var h='<div class="vrow'+(right?'':' bad')+'">'+
    '<p class="vl">'+(i+1)+'. '+ITEM[svc][i]+'</p>'+
    '<p class="rs"><span class="chip"><span class="ci">'+ic(P.ok)+'</span>'+CHIPL[a]+'</span>';
  h+=right
    ?'<span class="ymark">'+ic(P.mark,'sm')+'Your placement: '+SCOPE[a]+'.</span>'
    :'<span class="wrong">'+ic(P.warn,'er')+'You said '+SCOPE[pick[i]]+'.</span>';
  h+='</p>';
  if(isTrap){
    h+='<p class="rs tl"><span class="chip key"><span class="ci">'+ic(P.key)+'</span>'+
      TRAPL+'</span></p>';
  }
  return h+'</div>';
}
function verdictHtml(){
  var h='<h2 tabindex="-1" role="status" aria-live="polite">'+BAN1+'</h2>'+
    '<p class="sub">'+BAN2+'</p><div class="vgrid"><div class="vcol">';
  for(var i=0;i<4;i++){h+=vrow(i);}
  h+='</div><div class="vcol">';
  for(var j=4;j<8;j++){h+=vrow(j);}
  return h+'</div></div>';
}
function itemHtml(i){
  var a=ANS[svc][i],isTrap=(i===TRAP[svc]);
  var h='<div class="hslot"><h2 tabindex="-1"><span class="hn">'+(i+1)+'</span><span>'+
    ITEM[svc][i]+'</span></h2></div><div class="rule"></div><div class="rail">'+
    '<span class="chip"><span class="ci">'+ic(P.ok)+'</span>'+CHIPL[a]+'</span>';
  if(isTrap){
    h+='<span class="chip key"><span class="ci">'+ic(P.key)+'</span>'+TRAPL+'</span>';
  }
  h+='</div><p class="lead">'+ANN[svc][i]+'</p><p class="exp">'+EXP[svc][i]+'</p>';
  return h;
}
function charterHtml(){
  var h='<h2 tabindex="-1">Your Charter Writes Its First Two Sections</h2>';
  h+='<div class="blk"><p class="bh">'+CH1+'</p><div class="bl">';
  for(var i=0;i<8;i++){
    if(ANS[svc][i]===0){
      h+='<p class="br"><span class="bi">'+ic(P.dot,'sm')+'</span><span>'+ITEM[svc][i]+'</span></p>';
    }
  }
  h+='</div></div><div class="blk"><p class="bh">'+CH2+'</p><div class="bl">';
  for(var j=0;j<8;j++){
    if(ANS[svc][j]===1){
      h+='<p class="br"><span class="bi">'+ic(P.dot,'sm')+'</span><span>'+ITEM[svc][j]+
        ' ('+OWNER[svc][j]+')</span></p>';
    }
  }
  return h+'</div></div><p class="ln">'+CHFOOT+'</p>';
}

function buildStage1(){
  mk(2,wordsHtml(),'sw','',nextBtn('See the eight items'));
  mk(3,sortHtml(),'ss',
    backBtn()+'<p class="cnt" id="scnt" aria-live="polite">8 left to place</p>',
    '<button class="btn" type="button" id="go2" disabled aria-disabled="true">Check</button>');
  buildSort();
  go2=document.getElementById('go2');
  scnt=document.getElementById('scnt');
  go2.addEventListener('click',reveal);
}
function buildReveal(){
  mk(4,verdictHtml(),'sv',backBtn(),nextBtn('Why each one'));
  for(var i=0;i<8;i++){
    mk(i+5,itemHtml(i),'se',backBtn(),
      nextBtn(i===7?'Take this to the charter':'Next'));
  }
  mk(13,charterHtml(),'sc',backBtn(),nextBtn('Finish'));
  mk(14,'<h2 tabindex="-1">'+CLOSE+'</h2>','sf',backBtn(),'<p class="end">'+ENDL+'</p>');
}

function show(i){
  slides[cur].hidden=true;
  cur=i;
  slides[cur].hidden=false;
  document.body.style.background=window.getComputedStyle(slides[cur]).backgroundColor;
  for(var q=0;q<heads.length;q++){if(heads[q]){heads[q].classList.remove('fx');}}
  if(heads[cur]){heads[cur].classList.add('fx');heads[cur].focus();}
}
function nav(d){
  var t=cur+d;
  if(t<lo||t>hi){return;}
  show(t);
}
function reveal(){
  if(stage>1){return;}
  for(var q=0;q<8;q++){if(pick[q]===null){return;}}
  stage=2;
  lockSort();
  buildReveal();
  hi=13;
  show(3);
}

go1.addEventListener('click',function(){
  if(stage>0||svc===null){return;}
  stage=1;
  buildStage1();
  lo=1;hi=2;
  show(1);
  slides[0].hidden=true;
  if(slides[0].parentNode){slides[0].parentNode.removeChild(slides[0]);}
});

w.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-nav]'):null;
  if(b&&!b.disabled){nav(parseInt(b.getAttribute('data-nav'),10));}
});
document.addEventListener('keydown',function(e){
  if(stage===0){return;}
  if(e.key==='ArrowRight'){e.preventDefault();nav(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();nav(-1);}
});

function fit(){
  var pm=window.innerWidth<600;
  if(pm){w.classList.add('pm');}else{w.classList.remove('pm');}
  var cw=pm?600:960,ch=pm?800:540;
  var s=Math.min(window.innerWidth/cw,window.innerHeight/ch,1);
  w.style.transform='scale('+s+')';
  w.style.left=Math.max(0,(window.innerWidth-cw*s)/2)+'px';
  w.style.top=Math.max(0,(window.innerHeight-ch*s)/2)+'px';
}
window.addEventListener('resize',fit);
window.addEventListener('load',fit);
armHead(heads[0]);
fit();
}());
</script>
</body>
</html>
