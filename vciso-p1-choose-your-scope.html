<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose Your Scope and Agree the Job</title>
<style>
/* Palette, the whole of it. Literal hex only, no sixth value, no rgba, no
   tinted shadow.
     #DCE1FF  highlight container
     #001D69  on highlight: icons, controls, accents
     #FDF8F8  background
     #484646  body copy
     #1C1B1B  titles
   No state is carried by color alone anywhere below. Every one pairs with
   an icon, a border pattern, or a word. */

*{box-sizing:border-box;margin:0;padding:0}
html{background:#FDF8F8}
body{
  background:#FDF8F8;
  color:#484646;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  padding:22px 16px 44px;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto}

svg{width:18px;height:18px;flex:0 0 auto;display:block;
  fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap}

:focus-visible{outline:3px solid #001D69;outline-offset:2px}
[hidden]{display:none !important}

/* the single framing line each stage gets */
.prompt{
  font-size:18px;line-height:1.45;color:#1C1B1B;font-weight:600;
  max-width:56ch;margin:0 0 18px;overflow-wrap:anywhere;
}
.prompt:focus{outline:none}

/* the four services */
.cards{display:grid;grid-template-columns:1fr;gap:14px}
.card{
  background:#DCE1FF;border:2px solid #DCE1FF;border-radius:14px;
  padding:15px 16px 16px;cursor:pointer;position:relative;
  transition:border-color 160ms cubic-bezier(.2,.7,.3,1);
}
.card[aria-checked="true"]{border-color:#001D69}
.card h2{
  font-size:16px;font-weight:700;color:#001D69;letter-spacing:.01em;
  padding-right:30px;line-height:1.35;
}
.card p{font-size:14.5px;line-height:1.5;color:#484646;margin-top:9px;
  overflow-wrap:anywhere}
.card .tick{position:absolute;top:14px;right:14px;color:#001D69;display:none}
.card .tick svg{width:20px;height:20px}
.card[aria-checked="true"] .tick{display:block}

.confirm{margin-top:18px}
.confirm p{font-size:14.5px;color:#484646;margin-bottom:10px;overflow-wrap:anywhere}

/* buttons */
.btn{
  font:inherit;font-size:15px;font-weight:600;
  background:#001D69;color:#DCE1FF;border:2px solid #001D69;
  border-radius:10px;padding:11px 18px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;max-width:100%;
}
.btn[aria-disabled="true"]{
  background:#FDF8F8;color:#484646;border-color:#DCE1FF;cursor:default;
}

/* the standing header strip */
.strip{
  background:#DCE1FF;border-radius:12px;padding:11px 14px;margin-bottom:20px;
  display:flex;align-items:center;gap:11px;color:#001D69;flex-wrap:wrap;
}
.strip .who{font-size:11.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase}
.strip .name{font-size:16px;font-weight:700;color:#1C1B1B;overflow-wrap:anywhere}

/* the eight items, sorting and revealed */
.items{display:flex;flex-direction:column;gap:10px}
.item{background:#FDF8F8;border:1px solid #DCE1FF;border-radius:12px;
  padding:12px 14px}
.item .top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.item .lbl{font-size:15.5px;line-height:1.45;color:#1C1B1B;overflow-wrap:anywhere}
.ctrls{display:flex;gap:8px;flex:0 0 auto}
.ctrl{
  font:inherit;font-size:14px;font-weight:600;
  background:#FDF8F8;color:#001D69;border:1.5px solid #001D69;border-radius:9px;
  padding:8px 12px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-width:86px;
  transition:background-color 160ms cubic-bezier(.2,.7,.3,1);
}
.ctrl[aria-checked="true"]{background:#001D69;color:#DCE1FF}
.ctrl .yes{display:none}
.ctrl[aria-checked="true"] .yes{display:block}
.ctrls.locked{pointer-events:none}
.ctrls.locked .ctrl{cursor:default}

.note{display:flex;gap:9px;align-items:flex-start;margin-top:11px;
  font-size:14.5px;line-height:1.5;color:#484646;overflow-wrap:anywhere}
.note svg{margin-top:2px;color:#001D69}
.diverge{display:flex;gap:7px;align-items:center;margin-top:9px;
  font-size:13px;color:#001D69;overflow-wrap:anywhere}

/* the trap: different fill, dashed edge, icon, and a word. Not a gotcha,
   just a different category from its neighbors. */
.item.trap{background:#DCE1FF;border:2px dashed #001D69;padding:11px 13px}
.item.trap .note{color:#1C1B1B}
.traplab{display:flex;gap:8px;align-items:center;margin-bottom:11px;
  font-size:13px;font-weight:700;color:#001D69;overflow-wrap:anywhere}

.tally{
  background:#DCE1FF;border-radius:12px;padding:14px 16px;margin-bottom:18px;
  font-size:17px;font-weight:600;line-height:1.45;color:#1C1B1B;
  overflow-wrap:anywhere;
}
.tally:focus{outline:none}

.after{margin-top:20px}

/* the charter */
.cblock{background:#DCE1FF;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.cblock h2{font-size:15px;font-weight:700;color:#001D69;margin-bottom:9px;
  line-height:1.4}
.cblock h2:focus{outline:none}
.cblock ul{list-style:none}
.cblock li{position:relative;padding-left:19px;margin-bottom:7px;
  font-size:15px;line-height:1.5;color:#1C1B1B;overflow-wrap:anywhere}
.cblock li:last-child{margin-bottom:0}
.cblock li::before{content:"";position:absolute;left:0;top:.55em;
  width:8px;height:8px;border:1.5px solid #001D69;border-radius:2px}
.cfoot{font-size:14.5px;color:#484646;overflow-wrap:anywhere}

/* wide: two columns of service cards */
@media (min-width:760px){
  .cards{grid-template-columns:1fr 1fr;gap:16px}
  body{padding:28px 24px 56px}
}

/* 360px: cards are already stacked, item controls drop below the label */
@media (max-width:620px){
  .item .top{flex-direction:column;align-items:stretch;gap:11px}
  .ctrls{width:100%}
  .ctrl{flex:1 1 0;min-width:0;padding:9px 8px}
  .prompt{font-size:17px}
  .tally{font-size:16px}
  .btn{width:100%;justify-content:center}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div class="wrap">

  <p class="sr" id="status" aria-live="polite"></p>

  <div class="strip" id="strip" hidden>
    <span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="2.6"/></svg></span>
    <span class="who">Your engagement</span>
    <span class="name" id="stripName"></span>
  </div>

  <section id="stChoose">
    <h1 class="prompt" id="p0">Cumberland cannot assess the whole company before the renewal, so the work is being phased. One service this quarter. Which one do you want?</h1>
    <div class="cards" id="cards" role="radiogroup" aria-labelledby="p0"></div>
    <div class="confirm">
      <p>This is your engagement for the whole program.</p>
      <button type="button" class="btn" id="confirmBtn" aria-disabled="true">Confirm</button>
    </div>
  </section>

  <section id="stSort" hidden>
    <h1 class="prompt" id="p1" tabindex="-1">Eight things Cumberland owns or does. Which are inside your engagement?</h1>
    <div class="items" id="items"></div>
    <div class="after">
      <button type="button" class="btn" id="checkBtn" aria-disabled="true">Check</button>
    </div>
  </section>

  <section id="stReveal" hidden aria-live="polite"></section>

  <section id="stCharter" hidden aria-live="polite"></section>

</div>

<script>
(function(){
  "use strict";

  /* Icons: inline, outline, single weight, uniform 18px, drawn in
     currentColor so navy on light and light on navy both clear contrast. */
  var ICON = {
    tick:  '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M8.1 12.4 L10.8 15.1 L16 9.6"/></svg>',
    yes:   '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 12.6 L9.6 17 L18.8 7.6"/></svg>',
    into:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 4 H19 V20 H13.2"/><path d="M4 12 H14.2"/><path d="M10.7 8.5 L14.2 12 L10.7 15.5"/></svg>',
    outof: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.8 4 H5 V20 H10.8"/><path d="M9.8 12 H20"/><path d="M16.5 8.5 L20 12 L16.5 15.5"/></svg>',
    trap:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 19 V11 A5 5 0 0 1 17 11 V16.4"/><path d="M13.5 12.9 L17 16.4 L20.5 12.9"/></svg>',
    swap:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 H20"/><path d="M16.5 5.5 L20 9 L16.5 12.5"/><path d="M20 15 H4"/><path d="M7.5 11.5 L4 15 L7.5 18.5"/></svg>'
  };

  var SCOPES = [
    {
      title: "A · Claims Intake",
      name: "Claims Intake",
      lines: [
        "The front door of the business. Claims arrive from 41 clinics and two hospital systems, get checked and corrected by the claims team, and leave for the payers by way of two clearinghouses.",
        "You would look at: the billing platform the claims team lives in, the web portal clinics submit through, the server that moves files to the clearinghouses, and the database underneath all of it.",
        "About 40 staff. Two outside companies in the data path, plus the platform’s own vendor.",
        "The busiest service, the most patient data on the move, and the most outside connections to account for."
      ],
      items: [
        {label:"The clinic submission portal", answer:"in",
         note:"In. Every claim in this service arrives through it. Leave it out and the entry point goes unassessed."},
        {label:"The seven-year claims archive", answer:"out", owner:"Records and Archive",
         note:"Out. It belongs to Records and Archive. Pull it in and you are assessing two services on one service’s budget."},
        {label:"The billing platform and its application server", answer:"in",
         note:"In. This is where the claims team works all day."},
        {label:"Nightly backups of the billing platform, run by the outsourced IT provider", answer:"in", trap:true,
         note:"In. Cumberland does not run it. Cumberland is still accountable for it."},
        {label:"Staff laptops and the VPN", answer:"out", owner:"Remote and Corporate",
         note:"Out. They belong to Remote and Corporate."},
        {label:"The file transfer server and the two clearinghouse connections", answer:"in",
         note:"In. Patient data leaves the building here, to two outside companies."},
        {label:"The finance reconciliation systems", answer:"out", owner:"Payments and Remittance",
         note:"Out. They belong to Payments and Remittance."},
        {label:"The database host, which also serves other services", answer:"in",
         note:"In. Your service cannot run without it. Sharing it does not move it out of your scope."}
      ]
    },
    {
      title: "B · Payments and Remittance",
      name: "Payments and Remittance",
      lines: [
        "Where the money comes back. Payers settle claims, the bank reports what landed, and a twelve-person finance team matches every dollar to the claim it belongs to.",
        "You would look at: the reconciliation application, the bank feeds in and out, a payer connection that arrives over the internet, and the working files the finance team actually uses day to day.",
        "Twelve staff. Three outside companies, including the bank.",
        "The smallest team and the tightest process, which makes it the clearest view of the gap between how a process is described and how it actually runs."
      ],
      items: [
        {label:"The remittance reconciliation application and its server", answer:"in",
         note:"In. The service is this application."},
        {label:"The clinic submission portal", answer:"out", owner:"Claims Intake",
         note:"Out. It belongs to Claims Intake."},
        {label:"The bank lockbox file feed", answer:"in",
         note:"In. Money movement arrives on this feed."},
        {label:"Staff webmail", answer:"out", owner:"Remote and Corporate",
         note:"Out. It belongs to Remote and Corporate."},
        {label:"Patient card payments, processed entirely by an outside provider", answer:"in", trap:true,
         note:"In. Cumberland does not touch the card data. Cumberland is still accountable for it."},
        {label:"The payer remittance endpoint", answer:"in",
         note:"In. It faces outward, and payer data arrives through it."},
        {label:"The records request portal", answer:"out", owner:"Records and Archive",
         note:"Out. It belongs to Records and Archive."},
        {label:"The file server folder where payer files land", answer:"in",
         note:"In. A shared folder is an asset when the service depends on it."}
      ]
    },
    {
      title: "C · Records and Archive",
      name: "Records and Archive",
      lines: [
        "The long memory. Seven years of closed claims for about 2.1 million people, a portal where patients and clinics request copies, and the backups that are supposed to make all of it survivable.",
        "You would look at: the archive and its aging server, the records request portal, the backup chain out to an offsite provider, and what happens to data everyone has stopped thinking about.",
        "Fifteen staff, run by the person who has managed it for eleven years.",
        "The largest volume of sensitive data at rest, and the questions nobody has asked in years."
      ],
      items: [
        {label:"The records request portal", answer:"in",
         note:"In. It is how patients and clinics reach the archive."},
        {label:"The billing platform", answer:"out", owner:"Claims Intake",
         note:"Out. It belongs to Claims Intake."},
        {label:"The archive server and the seven-year store", answer:"in",
         note:"In. This is the service."},
        {label:"The VPN gateway", answer:"out", owner:"Remote and Corporate",
         note:"Out. It belongs to Remote and Corporate."},
        {label:"Offsite backup replication, operated by an outside provider", answer:"in", trap:true,
         note:"In. Cumberland does not run it. Cumberland is still accountable for it."},
        {label:"The monthly export file the archive produces", answer:"in",
         note:"In. A file the system produces every month is part of the service that produces it."},
        {label:"The bank lockbox feed", answer:"out", owner:"Payments and Remittance",
         note:"Out. It belongs to Payments and Remittance."},
        {label:"The database host, which also serves claims intake", answer:"in",
         note:"In. Your service cannot run without it. Sharing it does not move it out of your scope."}
      ]
    },
    {
      title: "D · Remote and Corporate",
      name: "Remote and Corporate",
      lines: [
        "The service every other service stands on. How all 180 staff log in, connect and work, plus the outside IT provider who helps run it all.",
        "You would look at: the perimeter and the VPN, the laptop fleet, the identity and email platform, and the standing access outside companies have into the environment.",
        "Every employee is in scope, because every employee uses it.",
        "The widest reach. Nothing here is exotic, and everything here touches everyone."
      ],
      items: [
        {label:"The VPN gateway and the firewall", answer:"in",
         note:"In. This is how the outside reaches the inside."},
        {label:"The billing platform", answer:"out", owner:"Claims Intake",
         note:"Out. It belongs to Claims Intake."},
        {label:"The staff laptop fleet", answer:"in",
         note:"In. 180 people, and the service is how they work."},
        {label:"The remittance endpoint", answer:"out", owner:"Payments and Remittance",
         note:"Out. It belongs to Payments and Remittance."},
        {label:"The always-on tunnel to the outsourced IT provider’s own network", answer:"in", trap:true,
         note:"In. It is their tunnel and Cumberland’s exposure. Cumberland is accountable for it."},
        {label:"The directory and identity service", answer:"in",
         note:"In. Every login in the company depends on it."},
        {label:"The archive", answer:"out", owner:"Records and Archive",
         note:"Out. It belongs to Records and Archive."},
        {label:"Staff webmail", answer:"in",
         note:"In. It is where staff send attachments, and it is in this service."}
      ]
    }
  ];

  var TALLY   = "Five in, three out. One of the five is run by somebody else.";
  var TRAPLAB = "Reads like somebody else’s problem.";
  var DIVERGE = "you put this the other way";

  function el(id){ return document.getElementById(id); }
  function esc(s){
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function setOff(btn, off){ btn.setAttribute("aria-disabled", off ? "true" : "false"); }

  var status     = el("status");
  var cardsBox   = el("cards");
  var confirmBtn = el("confirmBtn");
  var checkBtn   = el("checkBtn");

  var picked = null;   /* index into SCOPES, before confirming */
  var scope  = null;   /* the confirmed scope. The only set ever rendered. */
  var sort   = [];     /* the student sort, "in" or "out" per item */

  /* ================= choose ================= */

  SCOPES.forEach(function(s, i){
    var c = document.createElement("div");
    c.className = "card";
    c.setAttribute("role", "radio");
    c.setAttribute("aria-checked", "false");
    c.setAttribute("tabindex", i === 0 ? "0" : "-1");
    c.setAttribute("aria-labelledby", "cT" + i);
    c.setAttribute("aria-describedby", "cD" + i);
    var html = '<span class="tick">' + ICON.tick + '</span>' +
      '<h2 id="cT' + i + '">' + esc(s.title) + "</h2>" + '<div id="cD' + i + '">';
    s.lines.forEach(function(t){ html += "<p>" + esc(t) + "</p>"; });
    c.innerHTML = html + "</div>";
    c.addEventListener("click", function(){ pick(i); });
    c.addEventListener("keydown", function(e){ cardKeys(e, i); });
    cardsBox.appendChild(c);
  });

  function pick(i){
    picked = i;
    var list = cardsBox.querySelectorAll(".card");
    for (var n = 0; n < list.length; n += 1){
      var on = (n === i);
      list[n].setAttribute("aria-checked", on ? "true" : "false");
      list[n].setAttribute("tabindex", on ? "0" : "-1");
    }
    list[i].focus();
    setOff(confirmBtn, false);
  }

  function cardKeys(e, i){
    var k = e.key;
    var last = SCOPES.length - 1;
    if (k === " " || k === "Enter" || k === "Spacebar"){
      e.preventDefault(); pick(i); return;
    }
    var next = null;
    if (k === "ArrowRight" || k === "ArrowDown"){ next = (i === last) ? 0 : i + 1; }
    if (k === "ArrowLeft"  || k === "ArrowUp"  ){ next = (i === 0) ? last : i - 1; }
    if (k === "Home"){ next = 0; }
    if (k === "End" ){ next = last; }
    if (next !== null){ e.preventDefault(); pick(next); }
  }

  confirmBtn.addEventListener("click", function(){
    if (confirmBtn.getAttribute("aria-disabled") === "true" || picked === null){ return; }
    confirmScope(picked);
  });

  function confirmScope(i){
    scope = SCOPES[i];
    sort = new Array(scope.items.length);

    /* the cards leave the document. Only the confirmed set is ever built,
       and there is no route back. */
    el("stChoose").remove();

    el("stripName").textContent = scope.name;
    el("strip").hidden = false;

    buildSort();
    el("stSort").hidden = false;
    status.textContent = scope.name + ". Eight items to sort.";
    el("p1").focus();
  }

  /* ================= sort ================= */

  function ctrlBtn(side, word){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "ctrl";
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", "false");
    b.setAttribute("tabindex", side === "in" ? "0" : "-1");
    b.dataset.side = side;
    b.innerHTML = (side === "in" ? ICON.into : ICON.outof) +
      "<span>" + word + "</span>" +
      '<span class="yes">' + ICON.yes + "</span>";
    return b;
  }

  function buildSort(){
    var box = el("items");
    scope.items.forEach(function(item, idx){
      var row = document.createElement("div");
      row.className = "item";

      var top = document.createElement("div");
      top.className = "top";

      var lbl = document.createElement("span");
      lbl.className = "lbl";
      lbl.textContent = item.label;

      var group = document.createElement("div");
      group.className = "ctrls";
      group.setAttribute("role", "radiogroup");
      group.setAttribute("aria-label", item.label);

      [ctrlBtn("in", "In"), ctrlBtn("out", "Out")].forEach(function(b){
        b.addEventListener("click", function(){ assign(idx, b.dataset.side); });
        b.addEventListener("keydown", function(e){ rowKeys(e, idx, b.dataset.side); });
        group.appendChild(b);
      });

      top.appendChild(lbl);
      top.appendChild(group);
      row.appendChild(top);
      box.appendChild(row);
    });
  }

  function assign(idx, side){
    sort[idx] = side;
    var group = el("items").querySelectorAll(".item")[idx].querySelector(".ctrls");
    var btns = group.querySelectorAll(".ctrl");
    for (var n = 0; n < btns.length; n += 1){
      var on = (btns[n].dataset.side === side);
      btns[n].setAttribute("aria-checked", on ? "true" : "false");
      btns[n].setAttribute("tabindex", on ? "0" : "-1");
      if (on){ btns[n].focus(); }
    }
    var done = true;
    for (var m = 0; m < scope.items.length; m += 1){
      if (!sort[m]){ done = false; }
    }
    setOff(checkBtn, !done);
  }

  function rowKeys(e, idx, side){
    var k = e.key;
    if (k === " " || k === "Enter" || k === "Spacebar"){
      e.preventDefault(); assign(idx, side); return;
    }
    if (k === "ArrowRight" || k === "ArrowDown" || k === "ArrowLeft" || k === "ArrowUp"){
      e.preventDefault();
      assign(idx, side === "in" ? "out" : "in");
    }
  }

  checkBtn.addEventListener("click", function(){
    if (checkBtn.getAttribute("aria-disabled") === "true"){ return; }
    reveal();
  });

  /* ================= reveal ================= */

  function lockedCtrl(side, word, chosen){
    return '<span class="ctrl" role="radio" aria-checked="' + (chosen ? "true" : "false") +
      '" aria-disabled="true">' +
      (side === "in" ? ICON.into : ICON.outof) +
      "<span>" + word + "</span>" +
      '<span class="yes">' + ICON.yes + "</span></span>";
  }

  function reveal(){
    var html = '<p class="tally" id="tally" tabindex="-1">' + esc(TALLY) + "</p>" +
               '<div class="items">';

    scope.items.forEach(function(item, idx){
      var mine = sort[idx];
      html += '<div class="item' + (item.trap ? " trap" : "") + '">';
      if (item.trap){
        html += '<p class="traplab">' + ICON.trap + "<span>" + esc(TRAPLAB) + "</span></p>";
      }
      html += '<div class="top"><span class="lbl">' + esc(item.label) + "</span>" +
              '<div class="ctrls locked" role="radiogroup" aria-readonly="true" aria-label="' + esc(item.label) + '">' +
              lockedCtrl("in", "In", mine === "in") +
              lockedCtrl("out", "Out", mine === "out") +
              "</div></div>";
      html += '<p class="note">' + (item.answer === "in" ? ICON.into : ICON.outof) +
              "<span>" + esc(item.note) + "</span></p>";
      if (mine !== item.answer){
        html += '<p class="diverge">' + ICON.swap + "<span>" + esc(DIVERGE) + "</span></p>";
      }
      html += "</div>";
    });

    html += "</div>" +
      '<div class="after"><button type="button" class="btn" id="charterBtn">' +
      "Take this to the charter</button></div>";

    el("stSort").hidden = true;
    var r = el("stReveal");
    r.hidden = false;
    r.innerHTML = html;
    el("charterBtn").addEventListener("click", charter);
    el("tally").focus();
  }

  /* ================= charter ================= */

  function charter(){
    var ins = [], outs = [];
    scope.items.forEach(function(item){
      if (item.answer === "in"){ ins.push(esc(item.label)); }
      else { outs.push(esc(item.label) + " (" + esc(item.owner) + ")"); }
    });

    function block(head, list, first){
      var lis = list.map(function(t){ return "<li>" + t + "</li>"; }).join("");
      return '<div class="cblock"><h2' + (first ? ' id="cHead" tabindex="-1"' : "") + ">" +
        head + "</h2><ul>" + lis + "</ul></div>";
    }

    /* Built from the fixed answer, not from the student sort. A student who
       put the trap out is not handed a charter with a hole in it, and the
       line under the blocks says which sort this came from. */
    var html =
      block("1. What this engagement covers", ins, true) +
      block("2. What this engagement does not cover", outs, false) +
      '<p class="cfoot">Built from the correct sort. Type these into your charter.</p>';

    el("stReveal").hidden = true;
    var c = el("stCharter");
    c.hidden = false;
    c.innerHTML = html;
    el("cHead").focus();
  }

})();
</script>
</body>
</html>
