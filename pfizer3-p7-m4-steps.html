<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag Every Page: Steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap">
<style>
/* Pfizer 3.0, Project 7, module 4, "Try It Yourself": the nb2 student copy "Tagging Chunks with Metadata in LlamaIndex"
   (Drive 1fCp2Rm2tcZEsppKAfvRwLoSC9d7OoO7H), every code cell word for word, with real outputs and screenshots from the B1 run
   (06-content/project-07/b1-notebook-and-runs.md section 8.nb2, b1-shots/nb2-cell-*). Built 28 November 2026 by build.py
   (scratchpad p7/p7-m4). Shell copied unchanged from pfizer3-p6-m6-steps.html.
   Fixed stage 760 x 1140 (frames under 560 px wide: 450 x 1256), scaled as one piece so nothing scrolls.
   Look: Pfizer x Extern Core, Light format; every color, size, radius and font comes from design-system/tokens.json. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-600);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* The design stage, scaled and centred by the script at the end */
.app{position:absolute;left:50%;top:50%;width:760px;height:1140px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: step rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:13px;font-weight:500;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}
.narrow .top{grid-template-columns:minmax(0,1fr);row-gap:8px}
.narrow .where{order:0}
.narrow .pg-word{display:none}
.narrow .pg.pg-fit{flex:none}

/* Slide area and slide */
.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}
.narrow .stage{padding:10px 0}
.narrow .card{padding:18px 16px;border-left:0;border-right:0;border-radius:0}
.inner{flex:none;display:flex;flex-direction:column;gap:var(--space-3);width:100%}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding-bottom:3px;color:var(--ink);text-wrap:balance}
.narrow .title{font-size:28px;line-height:34px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:15px;line-height:22px;color:var(--ink);text-wrap:pretty}
.p b{font-weight:600}
.p code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.p code.nw,.list code.nw{white-space:nowrap}
.list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:22px;text-wrap:pretty}
.list b{font-weight:600}
.list code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.list li::marker{color:var(--step-label);font-weight:600}
.see{margin-top:4px}

/* Buttons (design system Button, Light) */
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* Run card: a notebook cell (no Copy button: the cells are already in the notebook), or the one cell students add (Copy button) */
.run{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin:0}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:6px 8px 6px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:12px 14px;font-family:var(--font-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out{border-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:6px 12px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}
.narrow .run pre{font-size:13px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.narrow .run.out pre{font-size:12px}

/* The Colab screenshot: the full width of the card (edge to edge), opens full size in a new tab.
   Under 560 px the card itself runs edge to edge, so the picture is as wide as the frame. */
.shot{margin:0 calc(-1 * var(--space-5));border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;line-height:0;background:var(--surface)}
.narrow .shot{margin:0 -16px}
.shot a{display:block}
.shot img{display:block;width:100%;height:auto}
.shot-cap{margin:-6px 0 0;font-size:13px;line-height:18px;color:var(--gray-600)}

/* A picture of the page (slide 14: the table in foo.pdf): framed like the output blocks, as wide as the text */
.pagepic{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;line-height:0;background:var(--surface)}
.pagepic a{display:block}
.pagepic img{display:block;width:100%;height:auto}

/* Table and analysis box (from the Learn deck) */
.tbl{border:1px solid var(--gray-200);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.4}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:6px 12px;border-bottom:1px solid var(--gray-200);background:var(--gray-50)}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--gray-200);vertical-align:top;color:var(--card-text)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.m{font-family:var(--font-mono);font-size:13px;color:var(--ink);white-space:nowrap}
.tbl td code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .tbl table{font-size:13px}
.narrow .tbl td,.narrow .tbl th{padding:5px 8px}
.concl{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px;font-size:15px;line-height:22px;color:var(--card-text)}
.concl b{font-weight:600;color:var(--card-title)}
.concl p{margin:0}
.concl p + p{margin-top:6px}
.concl code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}


/* A smaller code font for the long function in Step 3 (from the 11 November module 9 steps deck) */
.run.small pre{font-size:12px;line-height:1.32;padding:8px 14px}
.narrow .run.small pre{font-size:10.5px;line-height:1.35}

/* Tip box (from the 11 November module 9 Learn deck): pale-blue card, Pfizer blue bulb in a white square */
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px}
.tip-icon{flex:none;width:30px;height:30px;border-radius:var(--radius-xs);background:var(--surface);display:grid;place-items:center;color:var(--pfizer-blue)}
.tip-icon svg{width:18px;height:18px}
.tip p{margin:0;font-size:15px;line-height:22px;color:var(--card-text);text-wrap:pretty}
.tip b{font-weight:600;color:var(--card-title)}

/* Last slide: his closing line and Key Takeaway (takeaway box copied from the module 7 cheat sheet slide) */
.inner.end-slide{gap:var(--space-4)}
.end-slide .p{font-size:17px;line-height:1.55}
.take{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:14px 18px;font-size:17px;line-height:1.55;color:var(--card-text)}
.take b{font-weight:700;color:var(--card-title)}
.take code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .take{font-size:15px;padding:12px 16px}
.narrow .end-slide .p{font-size:16px}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:22px;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.foot .btn{padding:10px 16px;font-size:15px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
.narrow .upnext{visibility:hidden}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }

/* Added for P4 module 2 (copied from the P3 module 8 Try deck): "now holds" note, the SME's callout box, the Quick Recap size */
.holds{margin:0;display:flex;align-items:center;gap:8px;background:var(--surface-card);border-left:4px solid var(--pfizer-blue);border-radius:var(--radius-xs);padding:7px 12px;font-size:14px;line-height:20px;font-weight:600;color:var(--card-title)}
.holds code{font-family:var(--font-mono);font-size:.93em;background:var(--surface);border-radius:4px;padding:1px 5px}
.holds svg{width:16px;height:16px;flex:none;color:var(--pfizer-blue)}
.note{border:1.5px solid var(--ink);border-radius:var(--radius-sm);padding:9px 14px}
.note .num{display:block;margin-bottom:3px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.note p{margin:0;font-size:15px;line-height:1.48;color:var(--ink-muted)}
.note b{font-weight:600;color:var(--ink)}
.recap-slide .list{font-size:17px;line-height:1.55;gap:14px}
.recap-slide .list ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.recap-slide .list ul li::marker{color:var(--ink-muted)}
.narrow .recap-slide .list{font-size:15.5px;gap:10px}
/* Many steps in the rail: numbers only */
.pg-word{display:none}
.pg-label{text-align:center}
.pg.pg-fit{flex:none}
.pg.pg-fit .pg-label{text-align:left}
/* Under 560 px there is no room for the 7 group labels: the rail shows only the progress bars, and "Step N" sits beside the count */
.narrow .pg-label{display:none}
.narrow .pg.pg-fit{flex:1 1 0}
/* Code and output: Project 3's size (fix pass, 22 November 2026: 14 px on the 760 stage, 13 px at the 708 px column; 13 px on
   the narrow stage). Long lines wrap, so nothing scrolls; long cells and outputs are cut over more slides instead */
.run pre{white-space:pre-wrap;overflow-wrap:anywhere}
.run.out pre{font-size:14px;line-height:1.5}
.narrow .run pre,.narrow .run.out pre{font-size:13px}
/* F02: zoomed crops of one strip of the page, before and after a step */
.zoom{margin:0;display:flex;flex-direction:column;gap:6px}
.zoom a{display:block;line-height:0}
.zoom img{display:block;height:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--radius-xs)}
/* The STEP 15 JSON: the 3 heading lines across the top, the JSON in two columns (same text, same order) */
.run.out.json pre.head{padding-bottom:0}
.run.out.json pre.cols{column-count:2;column-gap:24px;padding-top:4px}
.narrow .run.out.json pre.cols{column-gap:12px;font-size:10.5px}
/* A page picture from Colab (tall): shown smaller and centred, so the slide stays short; opens full size */
.shot.tall{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.shot.tall img{width:auto;max-width:100%;height:var(--pic-h,480px);margin:0 auto}
.narrow .shot.tall{margin:0}
.narrow .shot.tall img{height:var(--pic-hn,520px)}
/* q3 Proposal A: two Colab page pictures side by side (STEP 6 + 7, STEP 8 + 9), each with its own notes under it */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.half{display:flex;flex-direction:column;gap:8px;min-width:0}
.half-head{margin:0;font-size:13px;line-height:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label)}
.half .p{margin:0}
.half .list{font-size:14.5px;line-height:1.45;gap:4px}
.half code{overflow-wrap:anywhere}
.pair-slide .shot.tall img{width:auto;height:auto;max-width:100%;max-height:330px}
.narrow .pair{gap:10px}
.narrow .pair-slide .shot.tall img{height:auto;max-height:300px}
.narrow .half .list{font-size:13.5px}
.pic-sm .shot.tall img{height:435px}

.run pre{white-space:pre-wrap;overflow-wrap:anywhere}
.run pre code{display:block}
.run pre .ln{display:block;padding-left:calc(var(--i) + 2ch);text-indent:calc(-1 * (var(--i) + 2ch))}
.run pre .ln:empty::before{content:"\200b"}
.shot.fit{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;line-height:0;background:var(--surface)}
.shot.fit img{width:auto;max-width:100%;max-height:var(--mh);margin:0 auto}
.p a{color:var(--pfizer-blue);text-underline-offset:2px}
.list a{color:var(--pfizer-blue);text-underline-offset:2px}
</style>
</head>

<template id="t1">
<p class="p">You'll run the Extern expert's notebook <b>Tagging Chunks with Metadata in LlamaIndex</b>. It walks you through loading a multi-page PDF, enriching it with metadata, and retrieving filtered results using LlamaIndex.</p><div class="links"><a class="btn btn-secondary" href="https://colab.research.google.com/drive/1fCp2Rm2tcZEsppKAfvRwLoSC9d7OoO7H" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Tagging Chunks with Metadata in LlamaIndex (Colab notebook)</span><span class="sr-only"> (opens in a new tab)</span></a><a class="btn btn-secondary" href="https://drive.google.com/file/d/1fJ7DszcjB_TerDTAhXfAw74VqJBElTyw/view?usp=sharing" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 2.75h6.5L15.5 7v10.25H5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M11.25 2.75V7h4.25" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>The supplier bundle (PDF)</span><span class="sr-only"> (opens in a new tab)</span></a></div><ol class="list"><li>Open the notebook and click <b>File &rarr; Save a copy in Drive</b>. Work in the copy that opens.</li><li>Open the supplier bundle and click <b>Download</b> (the arrow at the top right) to save it to your computer. Keep its name, <code class="nw">pharma-blob-sample.pdf</code>. It's the same 10-page file you labelled in the reading <b>Find Where Each Document Starts in a Bundled PDF</b>.</li><li>Press <b>Run</b> on each code cell in order, from the top. Every code block on these slides is already in the notebook, so you don't type any code.</li></ol><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p>These cells don't use Gemini, so you don't need your API key. Only the Bonus cell at the very end does, and Optional Reading explains it.</p></div>

<template id="t2">

l see in Colab:</b></p><figure class="run out"><div class="code-head"><span class="code-lang">Output &middot; from our run</span></div><pre tabindex="0"><code>WARNING: huggingface-hub 1.33.0 does not provide the extra &#x27;inference&#x27;</code></pre></figure><p class="p">This yellow warning is safe to ignore: it names an extra part of a library this notebook doesn't use. The cell takes about 30 seconds.</p>

<template id="t4">
<p class="p">Use LlamaIndex's <b>PDFReader</b> to extract one <code>Document</code> object per page. This gives you fine-grained control over chunk-level metadata.</p><p class="p">Press <b>Run</b> on the cell headed <b>STEP 2: Load the Pharmaceutical Blob PDF</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in the notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 2: Load the Pharmaceutical Blob PDF</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Loading a multi-page pharmaceutical blob PDF.</span><span class="ln" style="--i:0ch"># Each page becomes a separate Document object.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># The blob contains multiple document types</span><span class="ln" style="--i:0ch"># (certificates, specs, declarations) stitched</span><span class="ln" style="--i:0ch"># together. We need to process each page separately.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># Number of pages loaded and a preview of page 1.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">from llama_index.readers.file import PDFReader</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">loader = PDFReader()</span><span class="ln" style="--i:0ch">pages = loader.load_data(&quot;/content/pharma-blob-sample.pdf&quot;)  # Returns one Document per page</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Print preview</span><span class="ln" style="--i:0ch">print(f&quot;Loaded {len(pages)} pages&quot;)</span><span class="ln" style="--i:0ch">print(pages[0].text[:300])</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>loader.load_data(...)</code> reads the file you uploaded and returns one <code>Document</code> per page, in a list called <code>pages</code>.</li><li>The <code>print</code> lines show the page count and the start of page 1.</li></ul>
</template>

<template id="t5">

<template id="t6">
<p class="p">Now, let's give each page some basic metadata:</p><ul class="list"><li>What page number is it?</li><li>Which file did it come from?</li></ul><p class="p">We loop through all the pages and attach this info. Press <b>Run</b> on the cell headed <b>STEP 3: Add Page-Level Metadata</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in the notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 3: Add Page-Level Metadata</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Attaching metadata (page number, source file)</span><span class="ln" style="--i:0ch"># to each page Document object.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Metadata lets us trace results back to their</span><span class="ln" style="--i:0ch"># source page and filter by document attributes.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output (metadata is attached silently).</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">documents = []</span><span class="ln" style="--i:0ch">for i, doc in enumerate(pages):</span><span class="ln" style="--i:4ch">    doc.metadata = {</span><span class="ln" style="--i:8ch">        &quot;page_number&quot;: i + 1,</span><span class="ln" style="--i:8ch">        &quot;source_file&quot;: &quot;pharma-blob-sample.pdf&quot;</span><span class="ln" style="--i:4ch">    }</span><span class="ln" style="--i:4ch">    documents.append(doc)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>enumerate(pages)</code> counts from 0, so <code>i + 1</code> gives page numbers 1 to 10, as in Project 5. Each page gets two tags.</li></ul><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span>This cell prints nothing. Now every chunk knows where it came from in the file. Nice!</span></p>
</template>

<template id="t7">
<p class="p">Let's say you already have this list. Press <b>Run</b> on the cell headed <b>STEP 4: Assign Document Types</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in the notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 4: Assign Document Types</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Labeling each page with its pharmaceutical</span><span class="ln" style="--i:0ch"># document type. In a real pipeline, an LLM would</span><span class="ln" style="--i:0ch"># classify these automatically (see Notebook 1).</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># doc_type metadata enables filtered retrieval -</span><span class="ln" style="--i:0ch"># you can search only within specific document types.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># No output (doc_type is assigned silently).</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">doc_type_array = [</span><span class="ln" style="--i:4ch">    &quot;Cover Letter&quot;,            # Page 1</span><span class="ln" style="--i:4ch">    &quot;Certificate of Quality&quot;,  # Page 2</span><span class="ln" style="--i:4ch">    &quot;Certificate of Quality&quot;,  # Page 3</span><span class="ln" style="--i:4ch">    &quot;Packaging Specification&quot;, # Page 4</span><span class="ln" style="--i:4ch">    &quot;Packaging Specification&quot;, # Page 5</span><span class="ln" style="--i:4ch">    &quot;BSE/TSE Declaration&quot;,     # Page 6</span><span class="ln" style="--i:4ch">    &quot;Material Description&quot;,    # Page 7</span><span class="ln" style="--i:4ch">    &quot;Supplier Qualification&quot;,  # Page 8</span><span class="ln" style="--i:4ch">    &quot;Supplier Qualification&quot;,  # Page 9</span><span class="ln" style="--i:4ch">    &quot;Chain of Custody&quot;,        # Page 10</span><span class="ln" style="--i:0ch">]</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">for doc, doc_type in zip(documents, doc_type_array):</span><span class="ln" style="--i:4ch">    doc.metadata[&quot;doc_type&quot;] = doc_type</span></code></pre></figure><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span>This cell prints nothing. The next slide explains it.</span></p>
</template>

<template id="t8">
<p class="p">If you've already <b>classified</b> the pages into types, like Cover Letter, Certificate of Quality, etc., you can now attach that as well. This lets you filter chunks later using <code>doc_type</code>.</p><p class="p">That means:</p><ul class="list"><li>Page 1 is a Cover Letter</li><li>Pages 2 and 3 are Certificates of Quality</li><li>Pages 4 and 5 are a Packaging Specification</li><li>etc.</li></ul><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>zip(documents, doc_type_array)</code> pairs page 1 with the first label in the list, page 2 with the second, and so on.</li><li><code>doc.metadata[&quot;doc_type&quot;] = doc_type</code> adds a third tag to each page's dictionary.</li></ul><p class="p">Now each page knows:</p><ul class="list"><li>Its content</li><li>Its page number</li><li>The file it came from</li><li>And what <i>kind</i> of document it is</li></ul><div class="note"><span class="num">ONE SPELLING</span><p>Each label is spelled exactly as in <b>Find Where Each Document Starts in a Bundled PDF</b>, for example <b>Certificate of Quality</b> with a small "of". A filter matches only the exact spelling.</p></div>

<template id="t9">
<p class="p">Press <b>Run</b> on the cell headed <b>STEP 5: Preview Metadata</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in the notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 5: Preview Metadata</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Printing the metadata and a text preview for</span><span class="ln" style="--i:0ch"># the first two pages to verify tagging worked.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Always verify your metadata before indexing.</span><span class="ln" style="--i:0ch"># Wrong labels lead to wrong retrieval results.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># Metadata dict and first 150 chars for pages 1-2.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">for doc in documents[:2]:</span><span class="ln" style="--i:4ch">    print(doc.metadata)</span><span class="ln" style="--i:4ch">    print(doc.text[:150], &quot;\n---\n&quot;)</span></code></pre></figure><p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot fit" style="--mh:200px"><a href="pfizer3-p7-m4-run-06.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p7-m4-run-06.png" width="1000" height="377" alt="The output under STEP 5 in Colab: page 1&#x27;s metadata, page_number 1, source_file pharma-blob-sample.pdf, doc_type Cover Letter, with the start of the cover letter; then page 2&#x27;s metadata, doc_type Certificate of Quality, with the start of the certificate."><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure><p class="p">Page 1 is tagged <b>Cover Letter</b> and page 2 <b>Certificate of Quality</b>, each with its first 150 characters.</p>
</template>

<template id="t10">
<p class="p">Press <b>Run</b> on the cell headed <b>STEP 6: Build Vector Index with Metadata</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in the notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 6: Build Vector Index with Metadata</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Converting all pages into vector embeddings</span><span class="ln" style="--i:0ch"># and storing them in a searchable index.</span><span class="ln" style="--i:0ch"># The metadata (doc_type, page_number) travels</span><span class="ln" style="--i:0ch"># with each vector.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># The index enables semantic search. Metadata</span><span class="ln" style="--i:0ch"># enables filtered search (e.g., only search</span><span class="ln" style="--i:0ch"># within &quot;Certificate of Quality&quot; pages).</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># Embedding model download (first run) and</span><span class="ln" style="--i:0ch"># confirmation of index creation.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">from llama_index.core import VectorStoreIndex</span><span class="ln" style="--i:0ch">from llama_index.embeddings.huggingface import HuggingFaceEmbedding</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Use a local embedding model</span><span class="ln" style="--i:0ch">embed_model = HuggingFaceEmbedding(model_name=&quot;BAAI/bge-small-en-v1.5&quot;)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Build a vector index enriched with metadata (doc_type, page_number, source_file)</span><span class="ln" style="--i:0ch">index = VectorStoreIndex.from_documents(documents, embed_model=embed_model)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">print(&quot;Metadata-enriched index created with&quot;, len(documents), &quot;documents.&quot;)</span></code></pre></figure><p class="holds"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/></svg><span>Expect about 45 seconds. The cell downloads BGE first. The next slide shows what you'll see.</span></p>
</template>

<template id="t11">
<p class="p">Once your documents have the right metadata fields (like <code>doc_type</code>, source, and <code>page_number</code>), you can create a vector index that keeps those fields attached to each chunk. This is what your system will search for when answering questions.</p><p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot fit" style="--mh:330px"><a href="pfizer3-p7-m4-run-07.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p7-m4-run-07.png" width="1000" height="574" alt="The output under STEP 6 in Colab: two HF_TOKEN warnings, download bars for the BGE model files, then Metadata-enriched index created with 10 documents."><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure><ul class="list"><li><code>HuggingFaceEmbedding</code> loads BGE (<code>bge-small-en-v1.5</code>), the embedding model you compared in Project 6. <code>VectorStoreIndex.from_documents(...)</code> builds the index from your 10 tagged pages.</li><li>The <code>HF_TOKEN</code> warning only means you aren't signed in to Hugging Face, and you don't need to be.</li></ul><p class="p">Now that your index is enriched with metadata, you can start applying filters during retrieval, for example, pulling only from specific document types or narrowing by page ranges.</p><p class="p">Let's say a user asks: <i>"What are the BSE/TSE compliance dates for this product?"</i> But you want to only search the <i>BSE/TSE Declaration</i> pages.</p>
</template>

<template id="t12">
<p class="p">Here's how you filter by <code>doc_type</code> during retrieval, in the cell headed <b>STEP 7</b>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in the notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 7: Query with Metadata Filtering</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Querying the index, then filtering results</span><span class="ln" style="--i:0ch"># to only show chunks from a specific doc type.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Without filtering, the retriever might return</span><span class="ln" style="--i:0ch"># chunks from irrelevant document types. Metadata</span><span class="ln" style="--i:0ch"># filtering narrows results to the right documents.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># Only results from &quot;BSE/TSE Declaration&quot; pages,</span><span class="ln" style="--i:0ch"># even though the query searches the full index.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Query the full index</span><span class="ln" style="--i:0ch">retriever = index.as_retriever()</span><span class="ln" style="--i:0ch">query = &quot;What are the BSE/TSE compliance dates for this product?&quot;</span><span class="ln" style="--i:0ch">all_results = retriever.retrieve(query)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Filter results using metadata</span><span class="ln" style="--i:0ch">filtered_results = [</span><span class="ln" style="--i:4ch">    r for r in all_results if r.metadata.get(&quot;doc_type&quot;) == &quot;BSE/TSE Declaration&quot;</span><span class="ln" style="--i:0ch">]</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Display the filtered results</span><span class="ln" style="--i:0ch">for i, r in enumerate(filtered_results):</span><span class="ln" style="--i:4ch">    print(f&quot;--- Result {i+1} ---&quot;)</span><span class="ln" style="--i:4ch">    print(r.text[:500])</span><span class="ln" style="--i:4ch">    print(&quot;Metadata:&quot;, r.metadata)</span><span class="ln" style="--i:4ch">    print(&quot;\n&quot;)</span></code></pre></figure>
</template>

<template id="t13">

<script>
(function () {
  "use strict";
  var CELLS = {};
  var GROUPS = ["Start", "Install", "Upload", "Load", "Tag", "Index", "Search"];
  var SLIDES = [
    {"group": "Start", "label": "GET READY", "title": "Open Your Copy of the <span class=\"hl\">Notebook</span>", "plain": "Open Your Copy of the Notebook", "tpl": "t1", "cls": "end-slide"},
    {"group": "Install", "label": "INSTALL &middot; RUN IT AND SEE IT", "title": "Install the <span class=\"hl\">Libraries</span>", "plain": "Install the Libraries", "tpl": "t2"},
    {"group": "Upload", "label": "UPLOAD &middot; RUN IT AND SEE IT", "title": "Upload the Supplier <span class=\"hl\">Bundle</span>", "plain": "Upload the Supplier Bundle", "tpl": "t3", "cls": "end-slide"},
    {"group": "Load", "label": "LOAD &middot; PART 1 OF 2: RUN IT", "title": "Load the PDF and Extract Page-Level <span class=\"hl\">Data</span>", "plain": "Load the PDF and Extract Page-Level Data", "tpl": "t4"},
    {"group": "Load", "label": "LOAD &middot; PART 2 OF 2: SEE IT", "title": "Ten Pages, One Document <span class=\"hl\">Each</span>", "plain": "Load. Ten Pages, One Document Each", "tpl": "t5", "cls": "end-slide"},
    {"group": "Tag", "label": "TAG &middot; PART 1 OF 4: RUN IT", "title": "Assign Metadata to Each <span class=\"hl\">Page</span>", "plain": "Assign Metadata to Each Page", "tpl": "t6"},
    {"group": "Tag", "label": "TAG &middot; PART 2 OF 4: RUN IT", "title": "Add Document Type (Optional, But <span class=\"hl\">Powerful</span>)", "plain": "Add Document Type (Optional, But Powerful)", "tpl": "t7"},
    {"group": "Tag", "label": "TAG &middot; PART 3 OF 4: READ IT", "title": "Now Each Page Knows Its <span class=\"hl\">Type</span>", "plain": "Tag. Now Each Page Knows Its Type", "tpl": "t8", "cls": "end-slide"},
    {"group": "Tag", "label": "TAG &middot; PART 4 OF 4: RUN IT AND SEE IT", "title": "Check the Tags Before You <span class=\"hl\">Index</span>", "plain": "Check the Tags Before You Index", "tpl": "t9", "cls": "end-slide"},
    {"group": "Index", "label": "INDEX &middot; PART 1 OF 2: RUN IT", "title": "Build a Searchable Index That Keeps the <span class=\"hl\">Metadata</span>", "plain": "Build a Searchable Index That Keeps the Metadata", "tpl": "t10"},
    {"group": "Index", "label": "INDEX &middot; PART 2 OF 2: SEE IT", "title": "BGE Downloads, Then the Index Is <span class=\"hl\">Ready</span>", "plain": "Index. BGE Downloads, Then the Index Is Ready", "tpl": "t11", "cls": "end-slide"},
    {"group": "Search", "label": "SEARCH &middot; PART 1 OF 2: RUN IT", "title": "Use Metadata When Retrieving <span class=\"hl\">Answers</span>", "plain": "Use Metadata When Retrieving Answers", "tpl": "t12"},
    {"group": "Search", "label": "SEARCH &middot; PART 2 OF 2: SEE IT", "title": "Only the BSE/TSE Declaration Page Comes <span class=\"hl\">Back</span>", "plain": "Search. Only the BSE/TSE Declaration Page Comes Back", "tpl": "t13", "cls": "end-slide"}
  ];
  var STAGE = { wide: [760, 1140], narrow: [450, 1256] };
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of this reading.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var sz = narrow ? STAGE.narrow : STAGE.wide;
    app.style.width = sz[0] + "px"; app.style.height = sz[1] + "px";
    var k = Math.min(window.innerWidth / sz[0], window.innerHeight / sz[1]);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  var GROUP_LABEL = { "Regex": "Find" };
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    var isStep = g.name.indexOf("Step ") === 0;
    b.type = "button"; b.className = "pg" + (isStep ? "" : " pg-fit");
    var shown = GROUP_LABEL[g.name] || g.name;
    b.setAttribute("aria-label", (g.name === "Regex" ? "Find Values" : shown) + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    var word = isStep ? '<span class="pg-word">Step </span>' + g.name.replace("Step ", "") : shown;
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + word + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span"), orig = label.textContent;
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = orig; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner' + (s.cls ? " " + s.cls : "") + '"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + document.getElementById(s.tpl).innerHTML + '</div>';
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(CELLS[b.getAttribute("data-copy")], b, pre); });
    });
    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.where || s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
    space();
    Array.prototype.forEach.call(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a slide. Spare height widens the gaps
     between blocks, up to 2x. */
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = ""; inner.style.marginTop = "";
    var cs = getComputedStyle(card);
    var avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var base = parseFloat(getComputedStyle(inner).rowGap) || 14;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (base + Math.min(base, spare / gaps)) + "px";
    /* P5 m2 fix round 1: what is still spare after the gaps widen is split above and below, so a short slide sits in
       the middle of the card instead of leaving one big empty area at the bottom */
    var left = avail - inner.offsetHeight;
    if (left > 1) inner.style.marginTop = Math.floor(left / 2) + "px";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    space();
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #slide=N opens slide N directly */
  var hm = location.hash.match(/slide=(\d+)/);
  if (hm) i = Math.min(SLIDES.length - 1, Math.max(0, +hm[1] - 1));
  window.addEventListener("resize", function () { scaleStage(); space(); });
  scaleStage();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
