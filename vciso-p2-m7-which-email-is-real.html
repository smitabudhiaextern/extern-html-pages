<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Email Is Real</title>
<!--
  vCISO P2 Step 2, Module 7: Who Can Send Email in Cumberland's Name. Step 1.
  Build spec: 06-content/project-02/step-02/module-07-internal.md, "Build Spec: P2-6 Which Email Is Real".
  Source: P2 Sample Pack/Interactive content sets - P2.md, P2-6.
  Same for all four scopes, so there is no scope picker.

  EMAIL CONTENT DRAFTED BY THE OWNER'S TEAM, 30 Sep 2026, pending Chaitanya's
  review (the SME pack gives none). Sender, address, clinic name, subject and
  body are ours. Barren River Family Practice is an invented clinic. Fill them in the EMAIL object only; both emails use the same one,
  because the spec says the two are identical in every visible way.
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;
    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);
    --t-fast:160ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:#F2DAE0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:16px 44px 12px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}
  h1{font-size:26px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:4px}
  .lead{flex:0 0 auto;font-size:16px;line-height:1.45;color:var(--body);margin-bottom:10px}
  .lead b{color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- the two emails ---- */
  .mails{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .mail{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;min-width:0}
  .mh{display:flex;align-items:center;gap:8px;background:var(--highlight);padding:7px 14px;
    border-bottom:1.5px solid var(--on-highlight)}
  .mh svg.ic{width:20px;height:20px;color:var(--on-highlight)}
  .mh .mn{font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--on-highlight)}
  .mh .pk{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--on-highlight);display:flex;align-items:center;gap:6px}
  .mf{display:grid;grid-template-columns:62px minmax(0,1fr);row-gap:5px;padding:9px 14px 8px;
    border-bottom:1.5px solid var(--line);font-size:14px;line-height:1.35}
  .mf dt{color:var(--body);font-weight:600}
  .mf dd{color:var(--title);min-width:0}
  .mb{padding:8px 14px 8px;font-size:13.5px;line-height:1.4;color:var(--title);height:100px;overflow:hidden}
  .mb p + p{margin-top:4px}

  /* A slot the SME has not filled yet. Dashed, labelled, with an icon, so it
     can never pass for real content. */
  .todo{display:inline-flex;align-items:center;gap:5px;border:1.5px dashed var(--on-highlight);border-radius:6px;
    padding:0 6px;font-size:12.5px;font-weight:600;color:var(--on-highlight);background:var(--tint);white-space:nowrap}
  .todo svg.ic{width:14px;height:14px}
  .todo.blk{display:flex;white-space:normal;padding:8px 10px;height:100%;align-items:flex-start;line-height:1.4}
  .todo.blk svg.ic{width:18px;height:18px;flex:0 0 auto;margin-top:1px}

  /* ---- the three options ---- */
  .ask{flex:0 0 auto;margin-top:10px;display:flex;align-items:center;gap:12px}
  .ask .q{flex:0 0 auto;font-size:16px;font-weight:600;color:var(--title)}
  .opts{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  button.opt{font-family:inherit;font-size:15.5px;font-weight:600;line-height:1.25;text-align:left;color:var(--title);
    background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;padding:10px 12px;cursor:pointer;
    display:flex;align-items:center;gap:9px;min-width:0;
    transition:background var(--t-fast) var(--ease-out)}
  button.opt:hover:not(:disabled){background:var(--highlight)}
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.opt:disabled{cursor:default}
  /* Unselected: an empty ring. Nothing is ever pre-selected. */
  button.opt .g{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--bg);font-size:12px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
  button.opt .lab{margin-left:auto;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}
  button.opt.pick{border-width:2.5px;background:var(--highlight)}
  button.opt.pick .g{background:var(--on-highlight)}
  button.opt.right{border-width:2.5px}
  button.opt.right .g{background:var(--on-highlight)}
  button.opt.dim{border-style:dashed;border-color:var(--line);color:var(--body)}

  /* ---- the reveal, space held from first paint ---- */
  .rv{flex:0 0 auto;margin-top:10px;min-height:66px;background:var(--highlight);border-left:5px solid var(--on-highlight);
    border-radius:0 10px 10px 0;padding:10px 16px;display:flex;align-items:center;gap:12px}
  .rv.wait{background:transparent;border-left:5px dashed var(--line)}
  .rv svg.ic{width:26px;height:26px;color:var(--on-highlight);flex:0 0 auto}
  .rv .rt{font-size:16.5px;line-height:1.4;color:var(--title)}
  .rv .rt b{font-weight:700}
  .rv.wait .rt{color:var(--body);font-size:15px}
  .rv.in{animation:rin var(--t-reveal) var(--ease-over) both}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:48px;padding-top:8px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;font-size:13.5px;line-height:1.36;color:var(--body)}
  #hint b{color:var(--title);font-weight:600}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;overflow-x:hidden}
    #stage{width:100%!important;height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .chip{margin-left:0}
    h1{font-size:22px}
    .mails{grid-template-columns:1fr;gap:12px}
    .mb{height:auto}
    .ask{flex-direction:column;align-items:stretch}
    .opts{grid-template-columns:1fr}
    button.opt{font-size:16px;padding:13px 14px}
    .bar{margin-top:18px;flex-wrap:wrap}
    button.nav{font-size:16px;padding:12px 18px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Which Email Is Real">
    <div class="top">
      <span class="prog">Who can send email in Cumberland's name</span>
      <span class="chip" id="chip">Pick one</span>
    </div>
    <h1>Which Email Is Real?</h1>
    <p class="lead">Both came from Cumberland's finance address. <b>One is real. A stranger sent the other.</b></p>

    <div class="mails" id="mails"></div>

    <div class="ask">
      <span class="q" id="q">Which one is real?</span>
      <div class="opts" id="opts" role="group" aria-labelledby="q"></div>
    </div>

    <div class="rv wait" id="rv" aria-live="polite"></div>

    <div class="bar">
      <button class="nav" id="reset" type="button">Start over</button>
      <div id="hint"></div>
    </div>
    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646;background:#FDF8F8}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf p{margin-bottom:12px}
    .nsf .box{background:#DCE1FF;border-left:4px solid #001D69;padding:12px 16px;margin:16px 0;color:#1C1B1B}
  </style>
  <div class="nsf">
    <h2>Which Email Is Real?</h2>
    <p>Two emails, both from Cumberland's finance address. One is real and a stranger sent the other. Your choices are Email 1, Email 2 or I can't tell.</p>
    <div class="box"><p>The answer is I can't tell. Nothing you can see proves which one is real, and neither can the clinic that receives it.</p></div>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  var IC = {
    mail:'<rect x="3" y="5.5" width="18" height="13" rx="1.8"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>',
    wait:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    todo:'<path d="M12 4 21 19.5H3z"/><path d="M12 10v4.5"/><circle cx="12" cy="17" r=".6"/>',
    eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
    check:'<circle cx="12" cy="12" r="8.5"/><path d="m8.2 12.3 2.6 2.6 5-5.4"/>',
    q:'<circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2 1-1.2 1.8v.4"/><circle cx="12" cy="16.8" r=".6"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }
  function todo(label){ return '<span class="todo">' + icon("todo") + "TO COME: " + label + "</span>"; }

  /* ---------------- content ----------------
     EMAIL: one object, used for both cards. Every field is null until the SME
     supplies it. A null field renders as a marked TO COME slot.
       fromName  sender name, as shown in a mail app
       fromAddr  the finance address, e.g. the part before @cumberlandclaims.com
       to        the clinic it is addressed to
       subject   subject line of a routine remittance notice
       body      array of paragraphs, a routine remittance notice
       sign      signature lines */
  var EMAIL = {
    fromName:"Cumberland Claims Finance",
    fromAddr:"<finance@cumberlandclaims.com>",
    to:"Billing Office, Barren River Family Practice",
    subject:"Your September payments report",
    body:[
      "Your September payments report is attached. It lists each claim we posted and the amount paid. Reply by 10 October if anything looks wrong."
    ],
    sign:["Finance Team, Cumberland Claims Services"]
  };

  var OPTS = [
    { id:"e1", txt:"Email 1" },
    { id:"e2", txt:"Email 2" },
    { id:"ct", txt:"I can't tell", ok:true }
  ];
  var REVEAL = {
    wrong:"Nothing you can see proves that. One of these was forged, and a reader has no way to tell which.",
    right:"Right. Neither can the clinic that receives it."
  };

  /* ---------------- state ---------------- */
  var KEY = "vciso-p2-m7-which-email-is-real-v1";
  var pick = null;
  try{ var raw = localStorage.getItem(KEY); if(raw === "e1" || raw === "e2" || raw === "ct") pick = raw; }catch(e){}
  function save(){ try{ if(pick) localStorage.setItem(KEY, pick); else localStorage.removeItem(KEY); }catch(e){} }

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el = {
    mails:document.getElementById("mails"), opts:document.getElementById("opts"),
    rv:document.getElementById("rv"), chip:document.getElementById("chip"),
    hint:document.getElementById("hint"), reset:document.getElementById("reset"),
    live:document.getElementById("live"), frame:document.getElementById("frame")
  };
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function field(v, label){ return v ? esc(v) : todo(label); }
  function mailHTML(n){
    var from = (EMAIL.fromName ? esc(EMAIL.fromName) : todo("sender name"))
      + ' ' + (EMAIL.fromAddr ? esc(EMAIL.fromAddr) : todo("finance address"));
    var body = EMAIL.body
      ? EMAIL.body.map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("")
        + (EMAIL.sign ? "<p>" + EMAIL.sign.map(esc).join("<br>") + "</p>" : "")
      : '<span class="todo blk">' + icon("todo") + "<span>TO COME: the email text and signature. A routine remittance notice to a clinic, word for word the same in both emails. Waiting on Chaitanya.</span></span>";
    return '<article class="mail" aria-label="Email ' + n + '">'
      + '<div class="mh">' + icon("mail") + '<span class="mn">Email ' + n + "</span>"
      + '<span class="pk" data-pk="e' + n + '"></span></div>'
      + '<dl class="mf"><dt>From</dt><dd>' + from + "</dd>"
      + "<dt>To</dt><dd>" + field(EMAIL.to, "clinic") + "</dd>"
      + "<dt>Subject</dt><dd>" + field(EMAIL.subject, "subject line") + "</dd></dl>"
      + '<div class="mb">' + body + "</div></article>";
  }

  function render(animate){
    el.mails.innerHTML = mailHTML(1) + mailHTML(2);
    var right = OPTS.filter(function(o){ return o.ok; })[0].id;
    el.opts.innerHTML = OPTS.map(function(o){
      var cls = "opt", g = "", lab = "";
      if(pick){
        if(o.id === pick){ cls += " pick"; g = o.ok ? "✓" : "●"; lab = o.ok ? "Correct" : "Your pick"; }
        else if(o.ok){ cls += " right"; g = "✓"; lab = "Answer"; }
        else cls += " dim";
      }
      return '<button type="button" class="' + cls + '" data-o="' + o.id + '"'
        + (pick ? " disabled" : "") + ' aria-pressed="' + (o.id === pick) + '">'
        + '<span class="g" aria-hidden="true">' + g + "</span>"
        + '<span class="txt">' + esc(o.txt) + "</span>"
        + (lab ? '<span class="lab">' + lab + "</span>" : "") + "</button>";
    }).join("");

    Array.prototype.forEach.call(el.mails.querySelectorAll(".pk"), function(p){
      p.innerHTML = (pick === p.dataset.pk) ? icon("eye") + "Your pick" : "";
    });

    if(!pick){
      el.rv.className = "rv wait";
      el.rv.innerHTML = icon("wait") + '<p class="rt">Look at both emails closely, then pick one of the three answers.</p>';
      el.chip.textContent = "Pick one";
      el.hint.textContent = "";
      el.reset.disabled = true;
    } else {
      var ok = pick === right;
      el.rv.className = "rv";
      el.rv.innerHTML = icon(ok ? "check" : "q") + '<p class="rt">' + (ok
        ? "<b>" + esc(REVEAL.right) + "</b>"
        : "<b>" + esc(REVEAL.wrong) + "</b> The answer is <b>I can't tell</b>.") + "</p>";
      if(animate && !reduce){ void el.rv.offsetWidth; el.rv.classList.add("in"); }
      el.chip.textContent = "Answered";
      el.hint.innerHTML = "Press <b>Start over</b> to pick again.";
      el.reset.disabled = false;
    }

    Array.prototype.forEach.call(el.opts.querySelectorAll("button.opt"), function(b){
      b.addEventListener("click", function(){
        if(pick) return;
        pick = b.dataset.o; save(); render(true);
        el.rv.setAttribute("tabindex", "-1");
        el.live.textContent = (pick === right ? REVEAL.right : REVEAL.wrong + " The answer is I can't tell.");
        el.reset.focus();
      });
    });
  }

  el.reset.addEventListener("click", function(){
    pick = null; save(); render(false);
    var f = el.opts.querySelector("button.opt"); if(f) f.focus();
    el.live.textContent = "Cleared. Pick again.";
  });

  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  render(false);
  fit();

  window.__ex = {
    slides:1,
    reset:function(){ pick = null; save(); render(false); },
    state:function(){ return { pick:pick }; }
  };
})();
</script>
</body>
</html>
