<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Khan Academy P1 Step 2 podcast card</title>
<!--
  Static player card. This is rendered to PNG and placed in Notion as a linked
  image; the link target is the Google Drive file. It is a picture of a player,
  not a player, which is why the button reads "Play on Google Drive" rather than
  a bare play glyph. Do not remove that label.

  ESTIMATE ONLY. The Step 2 master does not exist yet (confirmed with the owner,
  23 September 2026). "About 32 min" is computed from the script: 4,864 spoken
  words plus 206 s of written silence at the 170 wpm pace policy. Re-render this
  card from the real master the moment it lands, and replace the estimate with
  the measured m:ss. A player card showing the wrong duration is worse than no card.

  Palette is the program lock: #001D69 / #DCE1FF / #FDF8F8 / #484646 / #1C1B1B.
-->
<style>
  :root{
    --ink:#001D69;
    --highlight:#DCE1FF;
    --bg:#FDF8F8;
    --body:#484646;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:420px;background:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
  }

  .card{
    width:1200px;height:420px;
    background:var(--ink);
    border-radius:28px;
    display:flex;align-items:center;
    padding:44px;
    gap:44px;
    position:relative;
    overflow:hidden;
  }
  /* soft depth, keeps the flat navy from reading as a placeholder */
  .card::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(760px 420px at 88% -12%, rgba(220,225,255,.16), transparent 62%);
    pointer-events:none;
  }

  /* ---- cover art ---- */
  .art{
    width:288px;height:288px;flex:0 0 288px;
    background:var(--highlight);
    border-radius:20px;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:26px;
    position:relative;z-index:1;
  }
  .art .eyebrow{
    font-size:15px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink);opacity:.62;
  }
  .art .num{
    font-size:104px;font-weight:800;line-height:.86;color:var(--ink);
    letter-spacing:-.035em;
  }
  .art .num span{display:block;font-size:26px;font-weight:700;letter-spacing:.01em;opacity:.7;margin-top:12px;}
  .waves{display:flex;align-items:flex-end;gap:6px;height:44px;}
  .waves i{display:block;width:8px;border-radius:4px;background:var(--ink);opacity:.34;}
  .waves i:nth-child(1){height:16px}
  .waves i:nth-child(2){height:34px}
  .waves i:nth-child(3){height:44px}
  .waves i:nth-child(4){height:24px}
  .waves i:nth-child(5){height:38px}
  .waves i:nth-child(6){height:14px}
  .waves i:nth-child(7){height:28px}

  /* ---- right hand column ---- */
  .meta{flex:1;min-width:0;position:relative;z-index:1;}
  .kicker{
    font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:var(--highlight);opacity:.8;margin-bottom:18px;
  }
  h1{
    font-size:46px;line-height:1.1;font-weight:800;color:#fff;
    letter-spacing:-.022em;margin-bottom:14px;
  }
  .sub{font-size:19px;line-height:1.45;color:var(--highlight);opacity:.82;margin-bottom:30px;}

  .scrub{display:flex;align-items:center;gap:14px;margin-bottom:26px;}
  .bar{flex:1;height:6px;border-radius:3px;background:rgba(220,225,255,.26);position:relative;}
  .bar::before{content:"";position:absolute;left:0;top:0;height:6px;width:4px;border-radius:3px;background:var(--highlight);}
  .bar::after{content:"";position:absolute;left:0;top:-4px;width:14px;height:14px;border-radius:50%;background:#fff;}
  .t{font-size:14px;font-weight:600;color:var(--highlight);opacity:.8;font-variant-numeric:tabular-nums;}

  .cta{display:flex;align-items:center;gap:18px;}
  .play{
    width:62px;height:62px;flex:0 0 62px;border-radius:50%;
    background:#fff;display:flex;align-items:center;justify-content:center;
  }
  .play svg{margin-left:4px;}
  .cta .label{font-size:20px;font-weight:700;color:#fff;letter-spacing:-.005em;}
  .cta .label span{display:block;font-size:14px;font-weight:500;color:var(--highlight);opacity:.72;margin-top:3px;letter-spacing:0;}
</style>
</head>
<body>
  <div class="card">

    <div class="art">
      <div class="eyebrow">Project 1</div>
      <div class="num">02<span>Step Two</span></div>
      <div class="waves"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="meta">
      <div class="kicker">Podcast &middot; Extern &times; Khan Academy</div>
      <h1>Learn What This Team Turns Down</h1>
      <p class="sub">The five teaching modules of Step 2, in order. Three of them are tasks, and one of those needs a laptop.</p>

      <div class="scrub">
        <span class="t">0:00</span>
        <span class="bar"></span>
        <span class="t">about 32 min</span>
      </div>

      <div class="cta">
        <span class="play">
          <svg width="24" height="26" viewBox="0 0 24 26" aria-hidden="true">
            <path d="M2 1.6 22 13 2 24.4Z" fill="#001D69"/>
          </svg>
        </span>
        <span class="label">Play the episode<span>Opens in Google Drive</span></span>
      </div>
    </div>

  </div>
</body>
</html>
