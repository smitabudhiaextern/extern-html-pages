<style>
/* Pfizer x Extern Core design system, Light format. Optional Reading for Project 2, module 3 (Know About Data
   Structures in Python): 4 topics as toggles, only one open at a time. Each closed toggle shows a title and a
   "Read this if..." hint so the student can choose.
   Copied from pfizer3-p3-m3-optional.html (the shape, spacing, header layout, chevron and open and close behaviour of
   the frozen template accordions), with colours only from this design system's tokens. Link cards added from the same tokens.
   Fixed stage: laid out once on a 760 x 910 design stage (set the Notion embed height to 910 px), then
   scaled as one piece to fit the embed frame and centred. Nothing scrolls. A topic too long to fit when open is split
   into short parts with Back and Next inside the open toggle.
   The text is the old course text (the old "Know About Data Structures in Python" page and its Data Structures
   notebook), kept word for word, with only the mistakes fixed. Every output was run in Python 3.12 and pasted as printed. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --action:var(--extern-black); --on-action:var(--extern-white);
  --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --stage-w:760px; --stage-h:910px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;overflow:hidden;background:var(--surface);padding:16px 20px}

/* Accordion: the shape, spacing, header layout and chevron of the frozen template accordions
   (one bordered box, hairlines between items, title left and chevron right), in this design system's colours. */
.toggles{max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
/* A topic split into parts fills the stage, so Back and Next stay in one place from part to part. */
.app.fill .toggles{height:100%}
.item{flex:none;display:flex;flex-direction:column;min-height:0}
.item+.item{border-top:1px solid var(--line)}
.app.fill .item.open{flex:1 1 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;margin:0;border:0;background:none;text-align:left;cursor:pointer;padding:18px 20px;transition:background-color .15s ease}
.head:hover{background:var(--surface-card)}
.head:focus-visible{outline-offset:-2px;border-radius:0}
.ht{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{margin:0;font-family:var(--font-text);font-size:16px;font-weight:600;line-height:1.45;color:var(--ink)}
.hint{font-size:14px;line-height:1.45;color:var(--ink-muted)}
.chev{flex:none;width:20px;height:20px;color:var(--gray-600);transition:transform .2s ease}
.item.open .chev{transform:rotate(180deg)}

/* The open topic's reading area */
.body{display:none}
.item.open .body{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.pane{flex:1 1 auto;min-height:0;padding:2px 20px 16px;display:flex;flex-direction:column;gap:12px}
.pane p{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty}
.pane b{font-weight:600;color:var(--ink)}
.pane h3{margin:4px 0 0;font-family:var(--font-text);font-size:16px;font-weight:600;line-height:1.35;color:var(--ink)}
.pane ul{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:4px}
.pane li{font-size:15.5px;line-height:1.5;color:var(--ink-muted);padding-left:2px;text-wrap:pretty}
.pane li::marker{color:var(--step-label)}
.pane code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-card);color:var(--ink);padding:1px 5px;border-radius:5px;white-space:nowrap}

/* Code and output blocks, built from the design system's tokens. Outputs have no Copy button. */
.code{background:var(--surface-card);border-radius:var(--radius-sm);flex:none}
.code-head{padding:6px 14px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label);border-bottom:1px solid var(--blue-200)}
.code pre{margin:0;padding:8px 14px;font-family:var(--font-mono);font-size:12.5px;line-height:1.45;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}

/* Tip callout, built from the design system's tokens (pale-blue card, Pfizer blue icon in a white square) */
.tip{display:flex;gap:14px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:14px 16px;margin-top:2px}
.tip-icon{flex:none;width:34px;height:34px;border-radius:var(--radius-xs);background:var(--extern-white);display:flex;align-items:center;justify-content:center;color:var(--pfizer-blue)}
.tip-icon svg{width:20px;height:20px}
.tip-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
.tip-text p{color:var(--card-text);font-size:15px}

/* Code beside its output */
.pair{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px;align-items:stretch}

/* Link card for a video or an article, built from the design system's tokens */
.link{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:var(--radius-md);padding:12px 16px;text-decoration:none;color:var(--ink);background:var(--surface)}
.link:hover{background:var(--surface-card)}
.link .li{flex:none;width:34px;height:34px;border-radius:var(--radius-xs);background:var(--surface-card);display:flex;align-items:center;justify-content:center;color:var(--pfizer-blue)}
.link .li svg{width:18px;height:18px}
.link .lt{display:flex;flex-direction:column;min-width:0}
.link .lt b{font-size:15px;line-height:1.35}
.link .lt span{font-size:13px;color:var(--gray-600)}
.pane .why{font-size:14.5px}
.code .c{color:var(--gray-600)}
.code .s{color:var(--pfizer-blue)}

/* Part Back and Next, only for topics with more than one part */
.pnav{flex:none;display:flex;align-items:center;gap:12px;padding:8px 20px;border-top:1px solid var(--line)}
.pnav[hidden]{display:none}
.where{flex:1;font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-text);font-size:14px;line-height:1.2;font-weight:600;padding:7px 14px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.btn svg{width:13px;height:13px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.btn-next:disabled{opacity:.35;cursor:default}
@media (prefers-reduced-motion:no-preference){ .pane.anim{animation:in .22s ease} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
@media (prefers-reduced-motion:reduce){ .chev,.head{transition:none} }
</style>
</head>
<body>

<script>
(function () {
  "use strict";
  var CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5.5 7.75 4.5 4.5 4.5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var BACK = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var NEXT = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var BULB = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function out(label, text) {
    return '<div class="code"><div class="code-head">' + label + '</div><pre>' + text + '</pre></div>';
  }

  var TOPICS = [
 {
  "title": "Why use lists, tuples and dictionaries",
  "hint": "Read this if you want to know when to pick each one.",
  "parts": [
   "Why Use Lists and Tuples?",
   "Lists and Tuples Together",
   "Why Use Dictionaries?",
   "An Article and a Video to Learn More"
  ],
  "panes": [
   "<h3>Why Use Lists?</h3><ul><li><b>Easy Organization</b>: Lists help you keep related items together.</li><li><b>Flexible</b>: You can change the contents easily.</li><li><b>Accessible</b>: You can quickly access any item using its position (index).</li></ul><h3>Why Use Tuples?</h3><ul><li><b>Data Integrity</b>: Since you can't change a tuple once it's created, it's perfect for storing fixed sets of data, like coordinates (latitude, longitude) or days of the week.</li><li><b>Performance</b>: Tuples are generally faster than lists, making them ideal for situations where you don't need to modify the data.</li><li><b>Protection</b>: While lists are flexible and allow for changes, tuples are rigid but offer protection and performance.</li></ul>",
   "<div class=\"tip\"><span class=\"tip-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></span><div class=\"tip-text\"><p><b>Lists and Tuples Together</b>: You can use a list and a tuple in the same program. For instance, if you were building a program to store a shopping list, the list could be used for the changing items you plan to buy, while the tuple could store unchanging data like your fixed shopping budget or store details. Together, they help organize and manage different types of information efficiently.</p></div></div><p>Many coders, especially those who code only in Python, often avoid using Tuples. Instead, they overuse Python lists because they are flexible and easy to use. However, this is not good practice. To be efficient, it's important to understand the use case for each data structure and choose the one best suited to your challenge.</p>",
   "<h3>Why Use Dictionaries?</h3><ul><li><b>Organized Data</b>: You can store related data (like items and their quantities) in one place, making it easy to manage.</li><li><b>Fast Lookup</b>: If you need to find out how many bananas you need, you can quickly access the value by looking up the key.</li><li><b>Flexibility</b>: You can add, change, or remove items and quantities as your needs change, just like updating your shopping list as you move through the store.</li></ul>",
   "<p><b>Additional Resource:</b> This article from Real Python dives deep on Python Tuples and is an authority article on this topic.</p><a class=\"link\" href=\"https://realpython.com/python-tuple/\" target=\"_blank\" rel=\"noopener\"><span class=\"li\"><svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/></svg></span><span class=\"lt\"><b>Real Python: Python's tuple Data Type</b><span>realpython.com/python-tuple (opens in a new tab)</span></span></a><p><b>Optional Additional Resource:</b> A beginner friendly video by Corey Schafer is just what you need to understand Dictionaries better!</p><a class=\"link\" href=\"https://www.youtube.com/watch?v=daefaLgNkw0\" target=\"_blank\" rel=\"noopener\"><span class=\"li\"><svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M8 5.5v13l11-6.5z\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/></svg></span><span class=\"lt\"><b>Corey Schafer: Dictionaries</b><span>youtube.com/watch?v=daefaLgNkw0 (opens in a new tab)</span></span></a>"
  ]
 },
 {
  "title": "Sets: your shopping basket",
  "hint": "Read this if you want to meet Python's fourth data structure.",
  "parts": [
   "What a Set Is",
   "Key Features of a Set",
   "A Set in Code",
   "Why Use Sets?",
   "Set Operations",
   "A Video on Lists, Tuples and Sets"
  ],
  "panes": [
   "<p>You are done meticulously organizing your shopping list! You don't care about the order in which you find the items but just want to make sure you grab everything without any duplicates sneaking in. In programming, that's what a <b>set</b> is like: a collection of unique items where the order doesn't matter.</p><p>A <b>set</b> is different from a list or tuple because it automatically removes duplicates and doesn't keep items in any specific order. Think of it as a basket where you toss in items. You don't care how they land, you just want to make sure you have one of everything you need.</p><p>You write a set inside curly brackets, <code>{ }</code>, with a comma between the items, but with no keys and colons, which is how you tell it apart from a dictionary.</p>",
   "<h3>Key Features of a Set</h3><ul><li><b>Unordered</b>: There's no particular order to how items are stored or retrieved in a set.</li><li><b>Unique Items</b>: Sets automatically remove duplicates, so you'll never have the same item twice.</li><li><b>Mutable</b>: While sets are unordered, you can still add or remove items from them after they're created.</li><li><b>Immutable items</b>: Items of a set in Python must be immutable (unchangeable). A set can have any number of items and they may be of different types (integer, float, tuple, string, etc.). But a set cannot have mutable elements like lists, sets or dictionaries as its elements.</li></ul>",
   "<p>Here's an example of a set in Python. Its last two lines use a <code>for</code> loop, which you'll learn in a later reading: it prints each item in turn.</p><div class=\"code\"><div class=\"code-head\">Python</div><pre><span class=\"c\"># Creating a set of grocery items</span>\ngrocery_set = {<span class=\"s\">&quot;apples&quot;</span>, <span class=\"s\">&quot;bananas&quot;</span>, <span class=\"s\">&quot;milk&quot;</span>}\n\n<span class=\"c\"># Adding an item</span>\ngrocery_set.add(<span class=\"s\">&quot;bread&quot;</span>)  <span class=\"c\"># Now the set is {&quot;apples&quot;, &quot;bananas&quot;, &quot;milk&quot;, &quot;bread&quot;}</span>\n\n<span class=\"c\"># Removing an item</span>\ngrocery_set.remove(<span class=\"s\">&quot;bananas&quot;</span>)  <span class=\"c\"># Now the set is {&quot;apples&quot;, &quot;milk&quot;, &quot;bread&quot;}</span>\n\n<span class=\"c\"># Trying to add a duplicate item (it won&#x27;t be added)</span>\ngrocery_set.add(<span class=\"s\">&quot;milk&quot;</span>)  <span class=\"c\"># Set remains {&quot;apples&quot;, &quot;milk&quot;, &quot;bread&quot;}</span>\n\n<span class=\"c\"># Accessing items in a set (sets don&#x27;t have indexes)</span>\nfor item in grocery_set:\n    print(item)  <span class=\"c\"># This will print the items, but in any order</span></pre></div><div class=\"code\"><div class=\"code-head\">Output (your order may be different)</div><pre>bread\nmilk\napples</pre></div>",
   "<h3>Why Use Sets?</h3><ul><li><b>Unique Elements</b>: Sets ensure that you don't have duplicates, making them ideal for tasks like tracking unique users or filtering out repeated values.</li><li><b>Faster Lookups</b>: Sets are optimized for quick membership tests: checking whether an item exists is typically faster than with lists or tuples.</li><li><b>Unordered Collections</b>: When you don't care about the order but need to ensure each item is unique, sets are the way to go.</li></ul><p>You can see the unique items at work here: the 3 is written twice, but the set keeps only one.</p><div class=\"pair\"><div class=\"code\"><div class=\"code-head\">Python</div><pre><span class=\"c\"># Creating a set</span>\nmy_set = {1, 2, 3, 3, 4}\nprint(my_set)  <span class=\"c\"># Duplicate elements are removed</span></pre></div><div class=\"code\"><div class=\"code-head\">Output</div><pre>{1, 2, 3, 4}</pre></div></div>",
   "<p>Sets can be compared with each other. The <b>union</b> (<code>|</code>) is every item in either set. The <b>intersection</b> (<code>&amp;</code>) is the items in both. The <b>difference</b> (<code>-</code>) is the items in the first set but not the second. The <b>symmetric difference</b> (<code>^</code>) is the items in one set or the other, but not both.</p><div class=\"pair\"><div class=\"code\"><div class=\"code-head\">Python</div><pre><span class=\"c\"># Set operations</span>\nset_a = {1, 2, 3}\nset_b = {3, 4, 5}\n\nunion = set_a | set_b\nprint(<span class=\"s\">&quot;Union:&quot;</span>, union)\n\nintersection = set_a &amp; set_b\nprint(<span class=\"s\">&quot;Intersection:&quot;</span>, intersection)\n\ndifference = set_a - set_b\nprint(<span class=\"s\">&quot;Difference:&quot;</span>, difference)\n\nsymmetric_difference = set_a ^ set_b\nprint(<span class=\"s\">&quot;Symmetric Difference:&quot;</span>, symmetric_difference)</pre></div><div class=\"code\"><div class=\"code-head\">Output</div><pre>Union: {1, 2, 3, 4, 5}\nIntersection: {3}\nDifference: {1, 2}\nSymmetric Difference: {1, 2, 4, 5}</pre></div></div>",
   "<p><b>Optional Additional Resource:</b> Follow along this tutorial by Corey Schafer in your Colab notebook and try experimenting with the concepts discussed so far (lists, tuples &amp; sets):</p><a class=\"link\" href=\"https://youtu.be/W8KRzm-HUcc\" target=\"_blank\" rel=\"noopener\"><span class=\"li\"><svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M8 5.5v13l11-6.5z\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/></svg></span><span class=\"lt\"><b>Corey Schafer: Lists, Tuples, and Sets</b><span>youtu.be/W8KRzm-HUcc (opens in a new tab)</span></span></a>"
  ]
 },
 {
  "title": "More ways to change lists, tuples and dictionaries",
  "hint": "Read this if you want to try more of what lists, tuples and dictionaries can do.",
  "parts": [
   "Change Items in a List",
   "List Methods",
   "Tuple Methods",
   "Change a Dictionary",
   "Dictionary Methods"
  ],
  "panes": [
   "<p>You can change, add and remove items in a list. <code>numbers[2] = 10</code> puts 10 at position 2, in place of the 3:</p><div class=\"code\"><div class=\"code-head\">Python</div><pre>numbers = [1, 2, 3, 4, 5]\n\n<span class=\"c\"># Changing an element</span>\nnumbers[2] = 10\nprint(numbers)\n\n<span class=\"c\"># Adding elements</span>\nnumbers.append(6)\nprint(numbers)\n\n<span class=\"c\"># Removing elements</span>\nnumbers.remove(10)\nprint(numbers)</pre></div><div class=\"code\"><div class=\"code-head\">Output</div><pre>[1, 2, 10, 4, 5]\n[1, 2, 10, 4, 5, 6]\n[1, 2, 4, 5, 6]</pre></div>",
   "<p>A <b>method</b> is a command that belongs to a value, written after a dot, like <code>.append()</code>. Here are some common list methods. <code>.sort()</code> puts the items in order, from smallest to largest. <code>.reverse()</code> flips the order. <code>.index(5)</code> gives the position of the first 5.</p><div class=\"code\"><div class=\"code-head\">Python</div><pre><span class=\"c\"># Using some common list methods</span>\nnumbers = [3, 1, 4, 1, 5, 9]\nnumbers.sort()\nprint(<span class=\"s\">&quot;Sorted list:&quot;</span>, numbers)\n\nnumbers.reverse()\nprint(<span class=\"s\">&quot;Reversed list:&quot;</span>, numbers)\n\nindex = numbers.index(5)\nprint(<span class=\"s\">&quot;Index of 5:&quot;</span>, index)</pre></div><div class=\"code\"><div class=\"code-head\">Output</div><pre>Sorted list: [1, 1, 3, 4, 5, 9]\nReversed list: [9, 5, 4, 3, 1, 1]\nIndex of 5: 1</pre></div><p>To see every method a list has, run <code>print(dir(numbers))</code>.</p>",
   "<p>Tuple methods are limited compared to lists. You can't change a tuple, but you can build a new tuple from pieces of the old one. <code>.count()</code> counts how many times an item appears, and <code>.index()</code> gives the position of an item.</p><div class=\"code\"><div class=\"code-head\">Python</div><pre>my_tuple = (1, 2, 3, <span class=\"s\">&quot;hello&quot;</span>)\n\n<span class=\"c\"># Creating a new tuple with changed content</span>\nnew_tuple = my_tuple[:1] + (4,) + my_tuple[2:]\nprint(new_tuple)\n\n<span class=\"c\"># Using some common tuple methods</span>\ncount = my_tuple.count(<span class=\"s\">&quot;hello&quot;</span>)\nprint(<span class=\"s\">&quot;Count of &#x27;hello&#x27;:&quot;</span>, count)\n\nindex = my_tuple.index(3)\nprint(<span class=\"s\">&quot;Index of 3:&quot;</span>, index)</pre></div><div class=\"code\"><div class=\"code-head\">Output</div><pre>(1, 4, 3, &#x27;hello&#x27;)\nCount of &#x27;hello&#x27;: 1\nIndex of 3: 2</pre></div>",
   "<p>You can change a value, add a new key-value pair, and remove one with <code>del</code>:</p><div class=\"code\"><div class=\"code-head\">Python</div><pre><span class=\"c\"># Creating a dictionary</span>\nmy_dict = {<span class=\"s\">&quot;name&quot;</span>: <span class=\"s\">&quot;Alice&quot;</span>, <span class=\"s\">&quot;age&quot;</span>: 25, <span class=\"s\">&quot;city&quot;</span>: <span class=\"s\">&quot;New York&quot;</span>}\n\n<span class=\"c\"># Changing a value</span>\nmy_dict[<span class=\"s\">&quot;age&quot;</span>] = 26\nprint(my_dict)\n\n<span class=\"c\"># Adding a new key-value pair</span>\nmy_dict[<span class=\"s\">&quot;email&quot;</span>] = <span class=\"s\">&quot;alice@example.com&quot;</span>\nprint(my_dict)\n\n<span class=\"c\"># Removing a key-value pair</span>\ndel my_dict[<span class=\"s\">&quot;city&quot;</span>]\nprint(my_dict)</pre></div><div class=\"code\"><div class=\"code-head\">Output</div><pre>{&#x27;name&#x27;: &#x27;Alice&#x27;, &#x27;age&#x27;: 26, &#x27;city&#x27;: &#x27;New York&#x27;}\n{&#x27;name&#x27;: &#x27;Alice&#x27;, &#x27;age&#x27;: 26, &#x27;city&#x27;: &#x27;New York&#x27;, &#x27;email&#x27;: &#x27;alice@example.com&#x27;}\n{&#x27;name&#x27;: &#x27;Alice&#x27;, &#x27;age&#x27;: 26, &#x27;email&#x27;: &#x27;alice@example.com&#x27;}</pre></div>",
   "<p>Here are some common dictionary methods. <code>.keys()</code> gives all the keys, <code>.values()</code> gives all the values, and <code>.items()</code> gives each key and value together, as a tuple.</p><div class=\"code\"><div class=\"code-head\">Python</div><pre>my_dict = {<span class=\"s\">&quot;name&quot;</span>: <span class=\"s\">&quot;Alice&quot;</span>, <span class=\"s\">&quot;age&quot;</span>: 26, <span class=\"s\">&quot;email&quot;</span>: <span class=\"s\">&quot;alice@example.com&quot;</span>}\n\n<span class=\"c\"># Using some common dictionary methods</span>\nkeys = my_dict.keys()\nprint(<span class=\"s\">&quot;Keys:&quot;</span>, keys)\n\nvalues = my_dict.values()\nprint(<span class=\"s\">&quot;Values:&quot;</span>, values)\n\nitems = my_dict.items()\nprint(<span class=\"s\">&quot;Items:&quot;</span>, items)</pre></div><div class=\"code\"><div class=\"code-head\">Output</div><pre>Keys: dict_keys([&#x27;name&#x27;, &#x27;age&#x27;, &#x27;email&#x27;])\nValues: dict_values([&#x27;Alice&#x27;, 26, &#x27;alice@example.com&#x27;])\nItems: dict_items([(&#x27;name&#x27;, &#x27;Alice&#x27;), (&#x27;age&#x27;, 26), (&#x27;email&#x27;, &#x27;alice@example.com&#x27;)])</pre></div>"
  ]
 },

  "panes": [
   "<p>Data structures serve as the backbone of your programming toolkit, helping you organize data into predefined formats.</p><p>When you delve into the study of data structures, your focus should be on <b>optimizing space (RAM) and processing efficiency (CPU)</b>. <b>RAM</b> is the computer's short-term memory, where it keeps what a program is using right now. The <b>CPU</b> is the part of the computer that does the work of running the program. Both processing power and memory are finite resources, so it's crucial to be strategic about how you use them. By employing the appropriate data structures, you can minimize memory requirements and reduce processing time, resulting in more efficient applications.</p><p>Data structures are fundamentals of any programming language, and for our purposes we will use Python, as it helps to learn the fundamentals of these data structures in a simpler way as compared to other programming languages.</p>",
   "<p>For a more in-depth understanding of the data structures, watch <b>Data Structures Explained for Beginners - How I Wish I was Taught</b>. Please note, this is an additional resource.</p><a class=\"link\" href=\"https://www.youtube.com/watch?v=SFEROgwxicA\" target=\"_blank\" rel=\"noopener\"><span class=\"li\"><svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M8 5.5v13l11-6.5z\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/></svg></span><span class=\"lt\"><b>Data Structures Explained for Beginners - How I Wish I was Taught</b><span>youtube.com/watch?v=SFEROgwxicA (opens in a new tab)</span></span></a><p>The video talks about <b>arrays</b>, which work like Python's lists, and <b>linked lists</b>, a chain of items where each item points to the next one.</p>",
   "<h3>Key Takeaways from the video</h3><ul><li>Understanding data structures is crucial for effective programming, as they serve to organize data efficiently and impact program performance significantly.</li><li>Initially, many find these concepts tedious and see them merely as a means to secure a job. However, a deeper understanding reveals their essential role in writing efficient, scalable code.</li><li>Simple structures like lists (or arrays) allow for quick data access but can be inefficient when adding more elements, while linked lists offer flexibility in addition at the cost of slower access times.</li><li>No single data structure is ideal for all tasks; the choice often depends on specific requirements.</li><li>Advanced structures like priority queues help prioritize data, such as ensuring first-class passengers are processed first in airlines.</li><li>Ultimately, mastering these concepts is vital not just for passing technical interviews but for creating real-world applications that perform well and solve complex problems effectively.</li></ul>"
  ]
 }

  var app = document.getElementById("app"), list = document.getElementById("toggles");
  var open = -1, part = 0;

  TOPICS.forEach(function (tp, n) {
    var item = document.createElement("div");
    item.className = "item";
    item.innerHTML =
      '<button type="button" class="head" id="h' + n + '" aria-expanded="false" aria-controls="b' + n + '">' +
        '<span class="ht"><span class="t">' + tp.title + '</span><span class="hint">' + tp.hint + '</span></span>' +
        CHEV +
      '</button>' +
      '<div class="body" id="b' + n + '" role="region" aria-labelledby="h' + n + '">' +
        '<div class="pane" aria-live="polite"></div>' +
        '<div class="pnav"' + (tp.panes.length > 1 ? '' : ' hidden') + '>' +
          '<span class="where"></span>' +
          '<button type="button" class="btn btn-back">' + BACK + 'Back</button>' +
          '<button type="button" class="btn btn-next">Next' + NEXT + '</button>' +
        '</div>' +
      '</div>';
    item.querySelector(".head").addEventListener("click", function () { toggle(n); });
    item.querySelector(".btn-back").addEventListener("click", function () { goPart(part - 1); });
    item.querySelector(".btn-next").addEventListener("click", function () { goPart(part + 1); });
    list.appendChild(item);
  });

  function renderPane(anim) {
    if (open < 0) return;
    var tp = TOPICS[open], item = list.children[open];
    var pane = item.querySelector(".pane");
    pane.className = "pane" + (anim ? " anim" : "");
    pane.innerHTML = tp.panes[part];
    if (tp.panes.length > 1) {
      item.querySelector(".where").innerHTML = "Part " + (part + 1) + " of " + tp.panes.length + ": <b>" + tp.parts[part] + "</b>";
      item.querySelector(".btn-back").disabled = part === 0;
      item.querySelector(".btn-next").disabled = part === tp.panes.length - 1;
    }
  }

  function toggle(n) {
    open = open === n ? -1 : n;
    part = 0;
    app.classList.toggle("fill", open >= 0 && TOPICS[open].panes.length > 1);
    Array.prototype.forEach.call(list.children, function (item, k) {
      var on = k === open;
      item.classList.toggle("open", on);
      item.querySelector(".head").setAttribute("aria-expanded", on ? "true" : "false");
      if (!on) item.querySelector(".pane").innerHTML = "";
    });
    renderPane(true);
  }

  function goPart(p) {
    if (open < 0 || p < 0 || p >= TOPICS[open].panes.length) return;
    part = p; renderPane(true);
  }

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  /* Test hook: open a topic and part directly, for example #open=1&part=2. */
  var m = location.hash.match(/open=(\d)(?:&part=(\d))?/);
  if (m) { toggle(+m[1] - 1); if (m[2]) goPart(+m[2] - 1); }
})();
