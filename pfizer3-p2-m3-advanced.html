<!doctype html>
<html lang="en" data-engine="pyodide">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="try-engine" content="pyodide">
<title>Try It Yourself</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<!-- Real Python in the browser: Pyodide 0.26.4 (CPython 3.12), the same pinned version and CDN as the SME's lesson
     templates (chaitanyabaweja/pfizer-lesson-templates, shared/py-worker.js). It runs in a Web Worker, so a loop that
     never ends can't freeze the page. -->
<style>
/* Pfizer x Extern Core design system, Light format, for the whole page. Tokens from design-system/tokens.json.
   The code area is a plain code box: a gray-50 box with a gray-200 hairline, and syntax colours taken from the tokens
   (pfizer-blue, cyan-ink, pfizer-navy, gray-600) or, for strings, green-600 darkened so it reads at 13 px.
   Error ink is the one colour outside the tokens: Python's errors keep a red name, so they read as errors.
   Fixed design stage, 760 x STAGE_H px, scaled to fit the embed frame (same approach as the P1 decks). Nothing scrolls. */
:root{
  --pfizer-blue:#0033a0;
  --pfizer-navy:#001a54;
  --cyan-ink:#0077b6;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --extern-black:#000000;
  --extern-white:#ffffff;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:var(--extern-white);
  --surface-card:var(--blue-50);
  --surface-icon:var(--extern-white);
  --ink:var(--extern-black);
  --ink-muted:var(--gray-800);
  --card-title:var(--extern-black);
  --card-text:var(--gray-800);
  --highlight:var(--green-600);
  --action:var(--extern-black);
  --on-action:var(--extern-white);
  --line:var(--gray-600);
  --focus-ring:var(--pfizer-blue);
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;

  /* The code box */
  --code-bg:var(--gray-50);
  --code-line:var(--gray-200);
  --code-ink:var(--extern-black);
  --code-kw:var(--pfizer-blue);      /* def, if, for, True, None ... */
  --code-fn:var(--pfizer-navy);      /* print, len, int ... */
  --code-num:var(--cyan-ink);
  --code-str:#067a45;                /* green-600, darkened for small text (5.3:1 on gray-50) */
  --code-com:var(--gray-600);
  --out-rule:var(--blue-200);
  --error-ink:#c5221f;
  --error-bg:#fdeded;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* The fixed stage. JavaScript sets one uniform scale and centres it in the frame. */
.app{position:absolute;left:0;top:0;width:760px;height:780px;display:flex;flex-direction:column;transform-origin:0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}

/* Top bar: where you are, whether Python is ready, Restart and Restart and run all */
.chrome{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.where{flex:none;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.conn{display:inline-flex;align-items:center;margin-left:6px;padding-left:12px;border-left:1px solid var(--line);font-size:12.5px;line-height:16px;color:var(--ink-muted);white-space:nowrap}
.conn.loading span{animation:pulse 1.1s ease-in-out infinite}
.conn.failed{color:var(--error-ink)}
@keyframes pulse{50%{opacity:.45}}
.grow{flex:1 1 auto}
.tbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:16px;font-weight:600;padding:6px 11px;border-radius:var(--radius-xs);border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.tbtn svg{width:13px;height:13px;flex:none}
.tbtn:hover:not(:disabled){background:var(--gray-50)}
.tbtn:disabled{opacity:.4;cursor:default}

/* Body: the challenges */
.body{flex:1 1 auto;min-height:0;display:flex}
.nb{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden;padding:14px 18px 8px}
.nb.overflow{overflow-y:auto}
.screen{display:flex;flex-direction:column;gap:10px}

/* Text */
.tcell{padding:2px 0;font-size:14.5px;line-height:1.55;color:var(--ink)}
.tcell p{margin:0}
.tcell p+p,.tcell p+ul,.tcell ul+p,.tcell p+ol,.tcell ol+p,.tcell img+ol,.tcell img+ul,.tcell img+p,.tcell p+img{margin-top:6px}
.tcell h2{margin:0 0 6px;font-family:var(--font-serif);font-size:28px;line-height:32px;font-weight:400;letter-spacing:-.005em}
.tcell h3{margin:0 0 2px;font-size:16.5px;line-height:1.3;font-weight:600}
.tcell ul,.tcell ol{margin:0;padding-left:22px}
.tcell li+li{margin-top:3px}
.tcell code{font-family:var(--font-mono);font-size:.9em;background:var(--code-bg);border:1px solid var(--code-line);border-radius:4px;padding:0 4px}
.tcell b,.tcell strong{font-weight:600}
.tcell a{color:var(--pfizer-blue)}
/* A picture in a text cell: drawn at 2x for a 720 px wide slot, the width of the text area. A fixed width (not 100%), so it shrinks with the screen's zoom. */
.tcell img.mdimg{display:block;width:720px;max-width:none;height:auto;margin:8px 0 10px;border-radius:var(--radius-sm)}

/* Code: a Run button, then the code box */
.ccell{display:flex;gap:10px;align-items:flex-start}
.cgut{width:66px;flex:none;display:flex;flex-direction:column;align-items:stretch}
.run{position:relative;height:32px;border-radius:var(--radius-xs);border:0;background:var(--action);color:var(--on-action);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 10px;font-size:13.5px;line-height:16px;font-weight:600}
.run svg{width:10px;height:10px;flex:none}
.run:hover{background:var(--gray-800)}
.run.busy{background:var(--gray-600)}
.run.busy svg{display:none}
.run.busy::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cnt{display:none}
.cmain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}

.ed{position:relative;background:var(--code-bg);border:1px solid var(--code-line);border-radius:var(--radius-xs)}
.ed:focus-within{border-color:var(--pfizer-blue);box-shadow:0 0 0 1px var(--pfizer-blue)}
.ed.ro{background:var(--surface)}
.mirror,.ta{margin:0;border:0;padding:8px 12px;font-family:var(--font-mono);font-size:13px;line-height:20px;font-weight:400;letter-spacing:0;word-spacing:0;tab-size:4;-moz-tab-size:4;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;text-indent:0;text-transform:none}
.mirror{position:relative;color:var(--code-ink);pointer-events:none;min-height:36px}
.ta{position:absolute;inset:0;width:100%;height:100%;display:block;resize:none;outline:none;overflow:hidden;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--code-ink)}
.ta::selection{background:rgba(0,51,160,.18);color:transparent;-webkit-text-fill-color:transparent}
.ta:focus-visible{outline:none}
.mirror .k,.mirror .x{color:var(--code-kw)} .mirror .s{color:var(--code-str)}
.mirror .n{color:var(--code-num)} .mirror .c{color:var(--code-com)} .mirror .f{color:var(--code-fn)}
.mirror .l.err{background:rgba(197,34,31,.08)}

/* Hint and answer row */
.tools{display:flex;gap:8px;justify-content:flex-end}
.lbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;line-height:15px;font-weight:600;padding:4px 10px;border-radius:var(--radius-xs);border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.lbtn svg{width:12px;height:12px;flex:none}
.lbtn[aria-expanded="true"]{background:var(--action);color:var(--on-action)}
.panel{background:var(--surface-card);border-radius:var(--radius-xs);padding:10px 12px;font-size:14px;line-height:1.5;color:var(--card-text);display:flex;flex-direction:column;gap:8px}
.panel .ptitle{font-weight:600;color:var(--card-title)}
.panel p{margin:0}
.panel code{font-family:var(--font-mono);font-size:.92em}
.panel pre{margin:0;background:var(--surface-icon);border-radius:6px;padding:8px 10px;font:13px/20px var(--font-mono);color:var(--code-ink);white-space:pre-wrap;overflow-wrap:anywhere}
.pbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:16px;font-weight:600;padding:7px 12px;border-radius:var(--radius-xs);border:1.5px solid var(--action);background:var(--action);color:var(--on-action);cursor:pointer}

/* Output: what the code prints, under the box, with a thin blue rule on its left */
.out{padding:1px 0 1px 10px;border-left:3px solid var(--out-rule)}
.out pre{margin:0;font:13px/19px var(--font-mono);color:var(--code-ink);white-space:pre-wrap;overflow-wrap:anywhere;font-variant-ligatures:none}
.out .stderr{background:var(--error-bg)}
.out .note{display:block;margin-top:4px;font-family:var(--font-text);font-size:13px;line-height:1.45;color:var(--gray-600);white-space:normal}
.out .muted{color:var(--gray-600)}
.out .note.wait{margin-top:0}
.tb-red{color:var(--error-ink)} .tb-green{color:var(--code-str)} .tb-cyan{color:var(--code-num)}
.tb-last{font-weight:700}
.tb-last .tb-red{font-weight:700}
.out.flash{animation:flash .3s ease}
@keyframes flash{from{opacity:.25}to{opacity:1}}

/* Check messages */
.chk{display:flex;gap:8px;align-items:flex-start;border-radius:var(--radius-xs);padding:7px 10px;font-size:13.5px;line-height:1.45}
.chk svg{width:16px;height:16px;flex:none;margin-top:1px}
.chk pre{margin:4px 0 0;font:12.5px/18px var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.chk.pass{background:var(--surface);border:1.5px solid var(--green-600);color:var(--ink);font-weight:600}
.chk.pass svg{color:var(--green-600)}
.chk.notyet{background:var(--gray-50);border-left:3px solid var(--gray-600);color:var(--gray-800)}
.chk.notyet b{font-weight:600;color:var(--ink)}

/* Final done message, then Back and Next */
.donemsg{flex:none;margin:0;display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--green-600)}
.donemsg .retry{margin-left:auto}
.foot{flex:none;padding:10px 16px 14px;display:flex;align-items:center;gap:14px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:19px;font-weight:600;padding:11px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-primary{background:var(--action);color:var(--on-action)}
.btn:disabled{opacity:.35;cursor:default}
.mid{flex:1;min-width:0;text-align:center;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.out.flash,.conn.loading span,.run.busy::before{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <h1 class="sr-only" id="sr-title">Try It Yourself</h1>
  <header class="chrome">
    <div class="where" id="where"></div>
    <span class="conn loading" id="conn" role="status"><span id="conn-text">Starting Python</span></span>
    <span class="grow"></span>
    <button type="button" class="tbtn" id="restart" title="Clear every variable and output"><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2.6 7a4.4 4.4 0 1 0 1.3-3.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3.4 1.6v2.8h2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Start over</button>
    <button type="button" class="tbtn" id="runall" title="Start over, then run every code box from the top"><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 2.5v9L7 7z" fill="currentColor"/><path d="M7 2.5v9L12 7z" fill="currentColor"/></svg>Start over and run all</button>
  </header>
  <div class="body">
    <main class="nb" id="nb" aria-label="Practice code"></main>
  </div>
  <div class="donemsg" id="donemsg" role="status" hidden></div>
  <footer class="foot">
    <button type="button" class="btn btn-secondary" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="mid" id="mid"></div>
    <button type="button" class="btn btn-primary" id="next">Next<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
  <p class="sr-only" id="ed-help">Python code box. Shift plus Enter runs the code box. Tab indents, Shift plus Tab outdents. Press Escape, then Tab, to move out of the code box.</p>
  <div class="sr-only" aria-live="polite" id="sr"></div>
</div>

# The Try kernel: runs each cell the way Google Colab (IPython 7.34 on Python 3.12) does, and shows errors the
# way plain Python 3.12 prints them (File "<your code>", line N, in <module>). Cells share one namespace.
import ast
import builtins
import dis
import errno
import io
import json
import linecache
import os
import re
import sys
import time
import tokenize
import traceback
import warnings

from try_pretty import pretty as _pretty

_MAX_OUT = 20000
_PREFIX = "<your code #"   # each cell's own file name inside the kernel; errors show it as _SHOWN
_SHOWN = "<your code>"
_dropped = {}   # file name -> blank lines dropped from the top of that cell, so error lines match the code box
_HOME = "/content"
_KERNEL_FILE = __file__
_state = {"chunks": [], "size": 0, "trunc": False, "input": False, "deadline": 0.0, "limit": 5.0}
# Compile as plain Python does (no codeop flags), so an unclosed ( at the end of a cell says
# "SyntaxError: '(' was never closed", not IPython's "incomplete input".
_FLAGS = 0
# Pyodide's file system uses Emscripten's error numbers (ENOENT is 44). Colab runs on Linux (ENOENT is 2).
_LINUX_ERRNO = {"EPERM": 1, "ENOENT": 2, "EIO": 5, "EBADF": 9, "EAGAIN": 11, "EACCES": 13, "EBUSY": 16, "EEXIST": 17,
                "EXDEV": 18, "ENOTDIR": 20, "EISDIR": 21, "EINVAL": 22, "EMFILE": 24, "EFBIG": 27, "ENOSPC": 28,
                "ESPIPE": 29, "EROFS": 30, "ENAMETOOLONG": 36, "ENOTEMPTY": 39, "ELOOP": 40}


def _linux_errno(n):
    name = errno.errorcode.get(n) if isinstance(n, int) else None
    return _LINUX_ERRNO.get(name, n)


def _linux_oserror(e):
    """The same error with Linux's error number, so its message reads like Colab's."""
    n = _linux_errno(e.errno)
    if n == e.errno or not isinstance(e.strerror, str):
        return None
    args = (n, e.strerror) + ((e.filename,) if e.filename is not None else ())
    if e.filename2 is not None:
        args += (None, e.filename2)
    return type(e)(*args)


_real_open = io.open


def _try_open(file, mode="r", buffering=-1, encoding=None, errors=None, newline=None, closefd=True, opener=None):
    try:
        return _real_open(file, mode, buffering, encoding, errors, newline, closefd, opener)
    except OSError as e:
        fixed = _linux_oserror(e)
        if fixed is None:
            raise
        fixed._try_linux = True
        raise fixed from None


def _murmur2(text, seed=0xC70F6907):
    """ipykernel's murmur2_x86: a short hash of the cell's code, which keeps each cell's file name unique."""
    m = 0x5BD1E995
    data = text.encode("utf8")
    length = len(data)
    h = seed ^ length
    end = length & 0xFFFFFFFC
    for i in range(0, end, 4):
        k = data[i] | (data[i + 1] << 8) | (data[i + 2] << 16) | (data[i + 3] << 24)
        k = (k * m) & 0xFFFFFFFF
        k ^= k >> 24
        k = (k * m) & 0xFFFFFFFF
        h = (h * m) & 0xFFFFFFFF
        h ^= k
    rest = length & 3
    k = 0
    if rest == 3:
        k = data[end + 2] << 16
    if rest in (2, 3):
        k |= data[end + 1] << 8
    if rest:
        k |= data[end]
        h ^= k
        h = (h * m) & 0xFFFFFFFF
    h ^= h >> 13
    h = (h * m) & 0xFFFFFFFF
    h ^= h >> 15
    return h


def _emit(kind, text):
    st = _state
    if st["trunc"] or not text:
        return
    if st["size"] + len(text) > _MAX_OUT:
        text = text[: _MAX_OUT - st["size"]]
        st["trunc"] = True
    st["size"] += len(text)
    chunks = st["chunks"]
    if chunks and chunks[-1][0] == kind:
        chunks[-1][1] += text
    else:
        chunks.append([kind, text])


class _Stream(io.TextIOBase):
    def __init__(self, kind):
        self.kind = kind

    @property
    def encoding(self):
        return "utf-8"

    def writable(self):
        return True

    def isatty(self):
        return False

    def write(self, s):
        if not isinstance(s, str):
            raise TypeError("write() argument must be str, not " + type(s).__name__)
        _emit(self.kind, s)
        return len(s)

    def flush(self):
        pass


def _try_input(prompt=""):
    # This notebook can't take typed answers: show the prompt, give back '' and let the page explain.
    sys.stdout.write(str(prompt) + "\n")
    _state["input"] = True
    return ""


_STOP = "the code box ran for {} seconds, so it was stopped. Check for a loop that never ends."


def _trace(frame, event, arg):
    # A loop that never ends: stop the cell after the time limit, like pressing Colab's stop button.
    if frame.f_code.co_filename.startswith(_PREFIX):
        if time.monotonic() > _state["deadline"]:
            raise KeyboardInterrupt(_STOP.format(int(_state["limit"])))
        return _trace_line
    return None


def _trace_line(frame, event, arg):
    if time.monotonic() > _state["deadline"]:
        raise KeyboardInterrupt(_STOP.format(int(_state["limit"])))
    return _trace_line


def _display(value):
    # IPython's displayhook: show the value of a last-line expression with IPython's pretty printer.
    if value is None:
        return
    _ns["_"] = value
    sys.stdout.write(_pretty(value, max_width=79) + "\n")


# ---------- the session ----------
_ns = {}
_builtins_snapshot = None


def _clear_home():
    for root, dirs, files in os.walk(_HOME, topdown=False):
        for f in files:
            try:
                os.remove(os.path.join(root, f))
            except OSError:
                pass
        for d in dirs:
            try:
                os.rmdir(os.path.join(root, d))
            except OSError:
                pass


def reset():
    """Restart: every variable, file and cell source is gone."""
    global _ns
    if _builtins_snapshot is not None:
        b = builtins.__dict__
        b.clear()
        b.update(_builtins_snapshot)
    _ns = {"__name__": "__main__", "__doc__": None, "__package__": None, "__loader__": None,
           "__spec__": None, "__builtins__": builtins}
    for name in [n for n in linecache.cache if n.startswith(_PREFIX)]:
        del linecache.cache[name]
    _dropped.clear()
    os.makedirs(_HOME, exist_ok=True)
    _clear_home()
    os.chdir(_HOME)


_real_formatwarning = warnings.formatwarning


def _formatwarning(message, category, filename, lineno, line=None):
    """A warning from a code box names it "<your code>", with the line as the student sees it."""
    if isinstance(filename, str) and filename.startswith(_PREFIX):
        if line is None:
            line = linecache.getline(filename, lineno)
        lineno += _dropped.get(filename, 0)
        filename = _SHOWN
    return _real_formatwarning(message, category, filename, lineno, line)


def _setup():
    global _builtins_snapshot
    warnings.formatwarning = _formatwarning
    builtins.input = _try_input
    builtins.open = io.open = _try_open
    _builtins_snapshot = builtins.__dict__.copy()
    reset()


# ---------- tracebacks, as plain Python 3.12 prints them ----------
_STDLIB = None


def _display_path(path):
    """Pyodide keeps the standard library at /lib/python3.12 (or inside python312.zip). Show it as /usr/lib/python3.12."""
    global _STDLIB
    if _STDLIB is None:
        v = "python%d.%d" % sys.version_info[:2]
        z = "python%d%d.zip" % sys.version_info[:2]
        _STDLIB = [("/lib/" + v + "/site-packages/", "/usr/local/lib/" + v + "/dist-packages/"),
                   ("/lib/" + z + "/", "/usr/lib/" + v + "/"),
                   ("/lib/" + v + "/", "/usr/lib/" + v + "/")]
    for a, b in _STDLIB:
        if path.startswith(a):
            return b + path[len(a):]
    return path


def _records(tb):
    """The frames Python would show: from the first code box frame down, without this kernel's own frames."""
    out = []
    started = False
    while tb is not None:
        fn = tb.tb_frame.f_code.co_filename
        if fn.startswith(_PREFIX):
            started = True
        if started and fn != _KERNEL_FILE:
            out.append(tb)
        tb = tb.tb_next
    return out


def _fix_stack(te):
    frames = []
    started = False
    for fs in te.stack:
        fn = fs.filename or ""
        if fn.startswith(_PREFIX):
            started = True
        if not started or fn == _KERNEL_FILE:
            continue
        fs.line   # read the source line now, before the name and line number change
        if fn.startswith(_PREFIX):
            d = _dropped.get(fn, 0)
            if fs.lineno is not None:
                fs.lineno += d
            if getattr(fs, "end_lineno", None) is not None:
                fs.end_lineno += d
            fs.filename = _SHOWN
        else:
            fs.filename = _display_path(fn)
        frames.append(fs)
    te.stack = traceback.StackSummary.from_list(frames)


def _fix_syntax(te, fname, compiled):
    fn = te.filename
    if not isinstance(fn, str):
        return
    if fn.startswith(_PREFIX) or (not compiled and fn == "<string>"):
        d = _dropped.get(fn if fn.startswith(_PREFIX) else fname, 0)
        for attr in ("lineno", "end_lineno"):
            v = getattr(te, attr, None)
            if v is not None and str(v).isdigit():
                setattr(te, attr, str(int(v) + d))
        te.filename = _SHOWN
    else:
        te.filename = _display_path(fn)


def _fix_all(te, fname, compiled, seen):
    if te is None or id(te) in seen:
        return
    seen.add(id(te))
    _fix_stack(te)
    t = getattr(te, "exc_type", None)
    if isinstance(t, type) and issubclass(t, SyntaxError):
        _fix_syntax(te, fname, compiled)
    _fix_all(te.__cause__, fname, compiled, seen)
    _fix_all(te.__context__, fname, compiled, seen)
    for sub in getattr(te, "exceptions", None) or []:
        _fix_all(sub, fname, compiled, seen)


def _plain_entries(exc, fname, compiled):
    """The traceback exactly as Python 3.12 prints it, as styled entries. The error's own last line is bold, its name red."""
    te = traceback.TracebackException(type(exc), exc, exc.__traceback__, compact=True)
    _fix_all(te, fname, compiled, set())
    # Pyodide's error numbers are Emscripten's. Show Linux's ([Errno 2]), as open() already does.
    if isinstance(exc, OSError) and not getattr(exc, "_try_linux", False) and isinstance(getattr(te, "_str", None), str):
        pre = "[Errno %s]" % exc.errno
        if te._str.startswith(pre):
            te._str = "[Errno %s]" % _linux_errno(exc.errno) + te._str[len(pre):]
    text = "".join(te.format())
    tail = "".join(te.format_exception_only())
    head = text[: len(text) - len(tail)] if text.endswith(tail) else ""
    if not text.endswith(tail):
        tail = text

    stype = t.__qualname__
    if t.__module__ not in ("__main__", "builtins"):

            break

    before = head + "".join(line + "\n" for line in lines[:k])
    if before:
        entries.append([["", before.rstrip("\n")]])
    final = lines[k]
    if final.startswith(stype):
        entries.append({"last": [["r", stype], ["", final[len(stype):]]]})
    else:
        entries.append({"last": [["", final]]})
    if lines[k + 1:]:
        entries.append([["", "\n".join(lines[k + 1:])]])
    return entries


def _first_cell_line(exc, fname):
    for t in _records(exc.__traceback__):
        if t.tb_frame.f_code.co_filename == fname:
            return t.tb_lineno or 0
        break
    return 0


# ---------- running a cell ----------
# IPython 7.34's cleanup transforms run on every cell before it is compiled.
_INDENT_RE = re.compile(r"^[ \t]+")
_CLASSIC_RE = re.compile(r"^(>>>|\.\.\.)( |$)")
_CLASSIC_FIRST_RE = re.compile(r"^>>>( |$)")
_IPY_PROMPT_RE = re.compile(r"^(In \[\d+\]: |\s*\.{3,}: ?)")


def _strip_prompts(lines, prompt_re, initial_re):
    if lines and (initial_re.match(lines[0]) or (len(lines) > 1 and prompt_re.match(lines[1]))):
        return [prompt_re.sub("", line, count=1) for line in lines]
    return lines


def _transform(src):
    """Return (the code IPython compiles, how many blank lines it dropped from the top)."""
    cell = src if src.endswith("\n") else src + "\n"
    lines = cell.splitlines(keepends=True)
    dropped = 0
    for line in lines:
        if line and not line.isspace():
            break
        dropped += 1
    if dropped < len(lines):
        lines = lines[dropped:]
    else:
        dropped = 0
    m = _INDENT_RE.match(lines[0]) if lines else None
    if m:
        space = m.group(0)
        lines = [line[len(space):] if line.startswith(space) else line for line in lines]
    lines = _strip_prompts(lines, _CLASSIC_RE, _CLASSIC_FIRST_RE)
    lines = _strip_prompts(lines, _IPY_PROMPT_RE, _IPY_PROMPT_RE)
    # IPython tokenizes the cell next. Python 3.12's tokenizer raises IndentationError for an unindent that matches

    try:

    """IPython hides the last value when the cell's last token is ';'."""
    try:
        tokens = list(tokenize.generate_tokens(io.StringIO(code).readline))
    except (tokenize.TokenError, SyntaxError):
        return False
    for tok in reversed(tokens):
        if tok[0] in (tokenize.ENDMARKER, tokenize.NL, tokenize.NEWLINE, tokenize.COMMENT):
            continue
        return tok[0] == tokenize.OP and tok[1] == ";"

def run(src, limit=5.0):
    """Run one cell. Returns JSON: the output chunks and, on an error, the traceback as styled entries."""
    st = _state
    st.update(chunks=[], size=0, trunc=False, input=False, limit=float(limit))
    fname = _PREFIX + str(_murmur2(src)) + ">"
    saved = sys.stdout, sys.stderr, sys.displayhook

    error = None
    dropped = 0
    try:
        tree = None
        try:
            code_text, dropped = _transform(src)
            _dropped[fname] = dropped
            linecache.cache[fname] = (len(code_text), None, [line + "\n" for line in code_text.splitlines()], fname)
            tree = compile(code_text, fname, "exec", _FLAGS | ast.PyCF_ONLY_AST, 1)
        except (OverflowError, SyntaxError, ValueError, TypeError, MemoryError) as exc:
            error = _error(exc, fname, compiled=False)
        if tree is not None:
            nodes = tree.body
            interactive = nodes[-1:] if nodes and isinstance(nodes[-1], ast.Expr) and not _quiet(code_text) else []
            plain = nodes[:-1] if interactive else nodes
            st["deadline"] = time.monotonic() + st["limit"]
            for node, mode in [(n, "exec") for n in plain] + [(n, "single") for n in interactive]:
                try:
                    mod = ast.Module([node], []) if mode == "exec" else ast.Interactive([node])
                    code = compile(mod, fname, mode, _FLAGS, 1)
                except BaseException as exc:
                    error = _error(exc, fname, compiled=False)
                    break
                try:
                    sys.settrace(_trace)
                    exec(code, _ns)
                except BaseException as exc:
                    sys.settrace(None)
                    error = _error(exc, fname, compiled=True)
                    break
                finally:
                    sys.settrace(None)
    finally:
        sys.stdout, sys.stderr, sys.displayhook = saved
    if error and error.get("line"):
        error["line"] += dropped   # the line in the cell as the student sees it
    return json.dumps({"out": st["chunks"], "truncated": st["trunc"], "input": st["input"], "error": error})


def _error(exc, fname, compiled):
    name = type(exc).__name__
    try:
        msg = exc.msg if isinstance(exc, SyntaxError) and exc.msg is not None else str(exc)
    except Exception:
        msg = ""
    info = {"type": name, "msg": msg, "line": 0}
    try:
        info["entries"] = _plain_entries(exc, fname, compiled)
    except Exception:
        info["entries"] = [{"last": [["r", name]] + ([["", ": " + msg]] if msg else [])}]
    if isinstance(exc, SyntaxError) and not (compiled and type(exc) is not SyntaxError):
        if compiled:
            info["line"] = _first_cell_line(exc, fname)
        else:
            info["line"] = (exc.lineno or 0) if exc.filename in (fname, "<string>") else 0
        info["syntax"] = True
    elif compiled:
        info["line"] = _first_cell_line(exc, fname)
    return info

            yield
        finally:
            self.indentation -= indent

    @contextmanager
    def group(self, indent=0, open='', close=''):
        """like begin_group / end_group but for the with statement."""
        self.begin_group(indent, open)
        try:
            yield
        finally:
            self.end_group(indent, close)

class PrettyPrinter(_PrettyPrinterBase):
    """
    Baseclass for the `RepresentationPrinter` prettyprinter that is used to
    generate pretty reprs of objects.  Contrary to the `RepresentationPrinter`
    this printer knows nothing about the default pprinters or the `_repr_pretty_`
    callback method.
    """

    def __init__(self, output, max_width=79, newline='\n', max_seq_length=MAX_SEQ_LENGTH):
        self.output = output
        self.max_width = max_width
        self.newline = newline
        self.max_seq_length = max_seq_length
        self.output_width = 0
        self.buffer_width = 0
        self.buffer = deque()

        root_group = Group(0)
        self.group_stack = [root_group]
        self.group_queue = GroupQueue(root_group)
        self.indentation = 0

    def _break_one_group(self, group):
        while group.breakables:
            x = self.buffer.popleft()
            self.output_width = x.output(self.output, self.output_width)
            self.buffer_width -= x.width
        while self.buffer and isinstance(self.buffer[0], Text):
            x = self.buffer.popleft()
            self.output_width = x.output(self.output, self.output_width)
            self.buffer_width -= x.width

    def _break_outer_groups(self):
        while self.max_width < self.output_width + self.buffer_width:
            group = self.group_queue.deq()
            if not group:
                return
            self._break_one_group(group)

    def text(self, obj):
        """Add literal text to the output."""
        width = len(obj)
        if self.buffer:
            text = self.buffer[-1]
            if not isinstance(text, Text):
                text = Text()
                self.buffer.append(text)
            text.add(obj, width)
            self.buffer_width += width
            self._break_outer_groups()
        else:
            self.output.write(obj)
            self.output_width += width

    def breakable(self, sep=' '):
        """
        Add a breakable separator to the output.  This does not mean that it
        will automatically break here.  If no breaking on this position takes
        place the `sep` is inserted which default to one space.
        """
        width = len(sep)
        group = self.group_stack[-1]
        if group.want_break:
            self.flush()
            self.output.write(self.newline)
            self.output.write(' ' * self.indentation)
            self.output_width = self.indentation
            self.buffer_width = 0
        else:
            self.buffer.append(Breakable(sep, width, self))
            self.buffer_width += width
            self._break_outer_groups()

    def break_(self):
        """
        Explicitly insert a newline into the output, maintaining correct indentation.
        """
        group = self.group_queue.deq()
        if group:
            self._break_one_group(group)
        self.flush()
        self.output.write(self.newline)
        self.output.write(' ' * self.indentation)
        self.output_width = self.indentation
        self.buffer_width = 0


    def begin_group(self, indent=0, open=''):
        """
        Begin a group.
        The first parameter specifies the indentation for the next line (usually
        the width of the opening text), the second the opening text.  All
        parameters are optional.
        """
        if open:
            self.text(open)
        group = Group(self.group_stack[-1].depth + 1)
        self.group_stack.append(group)
        self.group_queue.enq(group)
        self.indentation += indent

    def _enumerate(self, seq):
        """like enumerate, but with an upper limit on the number of items"""
        for idx, x in enumerate(seq):
            if self.max_seq_length and idx >= self.max_seq_length:
                self.text(',')
                self.breakable()
                self.text('...')
                return
            yield idx, x

    def end_group(self, dedent=0, close=''):
        """End a group. See `begin_group` for more details."""
        self.indentation -= dedent
        group = self.group_stack.pop()
        if not group.breakables:
            self.group_queue.remove(group)
        if close:
            self.text(close)

    def flush(self):
        """Flush data that is left in the buffer."""
        for data in self.buffer:
            self.output_width += data.output(self.output, self.output_width)
        self.buffer.clear()
        self.buffer_width = 0


def _get_mro(obj_class):
    """ Get a reasonable method resolution order of a class and its superclasses
    for both old-style and new-style classes.
    """
    if not hasattr(obj_class, '__mro__'):
        # Old-style class. Mix in object to make a fake new-style class.
        try:
            obj_class = type(obj_class.__name__, (obj_class, object), {})
        except TypeError:
            # Old-style extension type that does not descend from object.
            # FIXME: try to construct a more thorough MRO.
            mro = [obj_class]
        else:
            mro = obj_class.__mro__[1:-1]
    else:
        mro = obj_class.__mro__
    return mro


class RepresentationPrinter(PrettyPrinter):
    """
    Special pretty printer that has a `pretty` method that calls the pretty
    printer for a python object.

    This class stores processing data on `self` so you must *never* use
    this class in a threaded environment.  Always lock it or reinstanciate
    it.

    Instances also have a verbose flag callbacks can access to control their
    output.  For example the default instance repr prints all attributes and
    methods that are not prefixed by an underscore if the printer is in
    verbose mode.
    """

    def __init__(self, output, verbose=False, max_width=79, newline='\n',
        singleton_pprinters=None, type_pprinters=None, deferred_pprinters=None,
        max_seq_length=MAX_SEQ_LENGTH):

        PrettyPrinter.__init__(self, output, max_width, newline, max_seq_length=max_seq_length)
        self.verbose = verbose
        self.stack = []
        if singleton_pprinters is None:
            singleton_pprinters = _singleton_pprinters.copy()
        self.singleton_pprinters = singleton_pprinters
        if type_pprinters is None:
            type_pprinters = _type_pprinters.copy()
        self.type_pprinters = type_pprinters
        if deferred_pprinters is None:
            deferred_pprinters = _deferred_type_pprinters.copy()
        self.deferred_pprinters = deferred_pprinters

    def pretty(self, obj):
        """Pretty print the given object."""
        obj_id = id(obj)
        cycle = obj_id in self.stack
        self.stack.append(obj_id)
        self.begin_group()
        try:
            obj_class = _safe_getattr(obj, '__class__', None) or type(obj)
            # First try to find registered singleton printers for the type.
            try:
                printer = self.singleton_pprinters[obj_id]
            except (TypeError, KeyError):
                pass
            else:
                return printer(obj, self, cycle)
            # Next walk the mro and check for either:
            #   1) a registered printer
            #   2) a _repr_pretty_ method
            for cls in _get_mro(obj_class):
                if cls in self.type_pprinters:
                    # printer registered in self.type_pprinters
                    return self.type_pprinters[cls](obj, self, cycle)
                else:
                    # deferred printer
                    printer = self._in_deferred_types(cls)
                    if printer is not None:
                        return printer(obj, self, cycle)
                    else:
                        # Finally look for special method names.
                        # Some objects automatically create any requested
                        # attribute. Try to ignore most of them by checking for
                        # callability.
                        if '_repr_pretty_' in cls.__dict__:
                            meth = cls._repr_pretty_
                            if callable(meth):
                                return meth(obj, self, cycle)
                        if cls is not object \
                                and callable(cls.__dict__.get('__repr__')):
                            return _repr_pprint(obj, self, cycle)

            return _default_pprint(obj, self, cycle)
        finally:
            self.end_group()
            self.stack.pop()

    def _in_deferred_types(self, cls):
        """
        Check if the given class is specified in the deferred type registry.

        Returns the printer from the registry if it exists, and None if the
        class is not in the registry. Successful matches will be moved to the
        regular type registry for future use.
        """
        mod = _safe_getattr(cls, '__module__', None)
        name = _safe_getattr(cls, '__name__', None)
        key = (mod, name)
        printer = None
        if key in self.deferred_pprinters:
            # Move the printer over to the regular registry.
            printer = self.deferred_pprinters.pop(key)
            self.type_pprinters[cls] = printer
        return printer


class Printable(object):

    def output(self, stream, output_width):
        return output_width


class Text(Printable):

    def __init__(self):
        self.objs = []
        self.width = 0

    def output(self, stream, output_width):
        for obj in self.objs:
            stream.write(obj)
        return output_width + self.width

    def add(self, obj, width):
        self.objs.append(obj)
        self.width += width


class Breakable(Printable):

    def __init__(self, seq, width, pretty):
        self.obj = seq
        self.width = width
        self.pretty = pretty
        self.indentation = pretty.indentation
        self.group = pretty.group_stack[-1]
        self.group.breakables.append(self)

    def output(self, stream, output_width):
        self.group.breakables.popleft()
        if self.group.want_break:
            stream.write(self.pretty.newline)
            stream.write(' ' * self.indentation)
            return self.indentation
        if not self.group.breakables:
            self.pretty.group_queue.remove(self.group)
        stream.write(self.obj)
        return output_width + self.width


class Group(Printable):

    def __init__(self, depth):
        self.depth = depth
        self.breakables = deque()
        self.want_break = False


class GroupQueue(object):

    def __init__(self, *groups):
        self.queue = []
        for group in groups:
            self.enq(group)

    def enq(self, group):
        depth = group.depth
        while depth > len(self.queue) - 1:
            self.queue.append([])
        self.queue[depth].append(group)

    def deq(self):
        for stack in self.queue:
            for idx, group in enumerate(reversed(stack)):
                if group.breakables:
                    del stack[idx]
                    group.want_break = True
                    return group
            for group in stack:
                group.want_break = True
            del stack[:]

    def remove(self, group):
        try:
            self.queue[group.depth].remove(group)
        except ValueError:
            pass


def _default_pprint(obj, p, cycle):
    """
    The default print function.  Used if an object does not provide one and
    it's none of the builtin objects.
    """
    klass = _safe_getattr(obj, '__class__', None) or type(obj)
    if _safe_getattr(klass, '__repr__', None) is not object.__repr__:
        # A user-provided repr. Find newlines and replace them with p.break_()
        _repr_pprint(obj, p, cycle)
        return
    p.begin_group(1, '<')
    p.pretty(klass)
    p.text(' at 0x%x' % id(obj))
    if cycle:
        p.text(' ...')
    elif p.verbose:
        first = True
        for key in dir(obj):
            if not key.startswith('_'):
                try:
                    value = getattr(obj, key)
                except AttributeError:
                    continue
                if isinstance(value, types.MethodType):
                    continue
                if not first:
                    p.text(',')
                p.breakable()
                p.text(key)
                p.text('=')
                step = len(key) + 1
                p.indentation += step
                p.pretty(value)
                p.indentation -= step
                first = False
    p.end_group(1, '>')


def _seq_pprinter_factory(start, end):
    """
    Factory that returns a pprint function useful for sequences.  Used by
    the default pprint for tuples, dicts, and lists.
    """
    def inner(obj, p, cycle):
        if cycle:
            return p.text(start + '...' + end)
        step = len(start)
        p.begin_group(step, start)
        for idx, x in p._enumerate(obj):
            if idx:
                p.text(',')
                p.breakable()
            p.pretty(x)
        if len(obj) == 1 and type(obj) is tuple:
            # Special case for 1-item tuples.
            p.text(',')
        p.end_group(step, end)
    return inner


def _set_pprinter_factory(start, end):
    """
    Factory that returns a pprint function useful for sets and frozensets.
    """
    def inner(obj, p, cycle):
        if cycle:
            return p.text(start + '...' + end)
        if len(obj) == 0:
            # Special case.
            p.text(type(obj).__name__ + '()')
        else:
            step = len(start)
            p.begin_group(step, start)
            # Like dictionary keys, we will try to sort the items if there aren't too many
            if not (p.max_seq_length and len(obj) >= p.max_seq_length):
                items = _sorted_for_pprint(obj)
            else:
                items = obj
            for idx, x in p._enumerate(items):
                if idx:
                    p.text(',')
                    p.breakable()
                p.pretty(x)
            p.end_group(step, end)
    return inner


def _dict_pprinter_factory(start, end):
    """
    Factory that returns a pprint function used by the default pprint of
    dicts and dict proxies.
    """
    def inner(obj, p, cycle):
        if cycle:
            return p.text('{...}')
        step = len(start)
        p.begin_group(step, start)
        keys = obj.keys()
        for idx, key in p._enumerate(keys):
            if idx:
                p.text(',')
                p.breakable()
            p.pretty(key)
            p.text(': ')
            p.pretty(obj[key])
        p.end_group(step, end)
    return inner


def _super_pprint(obj, p, cycle):
    """The pprint for the super type."""
    p.begin_group(8, '<super: ')
    p.pretty(obj.__thisclass__)
    p.text(',')
    p.breakable()
    if PYPY: # In PyPy, super() objects don't have __self__ attributes
        dself = obj.__repr__.__self__
        p.pretty(None if dself is obj else dself)
    else:
        p.pretty(obj.__self__)
    p.end_group(8, '>')


def _re_pattern_pprint(obj, p, cycle):
    """The pprint function for regular expression patterns."""
    p.text('re.compile(')
    pattern = repr(obj.pattern)
    if pattern[:1] in 'uU':
        pattern = pattern[1:]
        prefix = 'ur'
    else:
        prefix = 'r'
    pattern = prefix + pattern.replace('\\\\', '\\')
    p.text(pattern)
    if obj.flags:
        p.text(',')
        p.breakable()
        done_one = False
        for flag in ('TEMPLATE', 'IGNORECASE', 'LOCALE', 'MULTILINE', 'DOTALL',
            'UNICODE', 'VERBOSE', 'DEBUG'):
            if obj.flags & getattr(re, flag):
                if done_one:
                    p.text('|')
                p.text('re.' + flag)
                done_one = True
    p.text(')')


def _types_simplenamespace_pprint(obj, p, cycle):
    """The pprint function for types.SimpleNamespace."""
    name = 'namespace'
    with p.group(len(name) + 1, name + '(', ')'):
        if cycle:
            p.text('...')
        else:
            for idx, (attr, value) in enumerate(obj.__dict__.items()):
                if idx:
                    p.text(',')
                    p.breakable()
                attr_kwarg = '{}='.format(attr)
                with p.group(len(attr_kwarg), attr_kwarg):
                    p.pretty(value)


def _type_pprint(obj, p, cycle):
    """The pprint for classes and types."""
    # Heap allocated types might not have the module attribute,
    # and others may set it to None.

    # Checks for a __repr__ override in the metaclass. Can't compare the
    # type(obj).__repr__ directly because in PyPy the representation function
    # inherited from type isn't the same type.__repr__
    if [m for m in _get_mro(type(obj)) if "__repr__" in vars(m)][:1] != [type]:
        _repr_pprint(obj, p, cycle)
        return

    mod = _safe_getattr(obj, '__module__', None)
    try:
        name = obj.__qualname__
        if not isinstance(name, str):
            # This can happen if the type implements __qualname__ as a property
            # or other descriptor in Python 2.
            raise Exception("Try __name__")
    except Exception:
        name = obj.__name__
        if not isinstance(name, str):
            name = '<unknown type>'

    if mod in (None, '__builtin__', 'builtins', 'exceptions'):
        p.text(name)
    else:
        p.text(mod + '.' + name)


def _repr_pprint(obj, p, cycle):
    """A pprint that just redirects to the normal repr function."""
    # Find newlines and replace them with p.break_()
    output = repr(obj)
    lines = output.splitlines()
    with p.group():
        for idx, output_line in enumerate(lines):
            if idx:
                p.break_()
            p.text(output_line)


def _function_pprint(obj, p, cycle):
    """Base pprint for all functions and builtin functions."""
    name = _safe_getattr(obj, '__qualname__', obj.__name__)
    mod = obj.__module__
    if mod and mod not in ('__builtin__', 'builtins', 'exceptions'):
        name = mod + '.' + name
    try:
       func_def = name + str(signature(obj))
    except ValueError:
       func_def = name
    p.text('<function %s>' % func_def)


def _exception_pprint(obj, p, cycle):
    """Base pprint for all exceptions."""
    name = getattr(obj.__class__, '__qualname__', obj.__class__.__name__)
    if obj.__class__.__module__ not in ('exceptions', 'builtins'):
        name = '%s.%s' % (obj.__class__.__module__, name)
    step = len(name) + 1
    p.begin_group(step, name + '(')
    for idx, arg in enumerate(getattr(obj, 'args', ())):
        if idx:
            p.text(',')
            p.breakable()
        p.pretty(arg)
    p.end_group(step, ')')

def for_type(typ, func):
    """
    Add a pretty printer for a given type.
    """
    oldfunc = _type_pprinters.get(typ, None)
    if func is not None:

        _type_pprinters[typ] = func

    oldfunc = _deferred_type_pprinters.get(key, None)
    if func is not None:
        # To support easy restoration of old pprinters, we need to ignore Nones.
        _deferred_type_pprinters[key] = func
    return oldfunc

      return;
    }
    if (m.type === "load-error") { killWorker(); loadFailed(); return; }
    var c = py.call;
    if (!c || m.id !== c.id) return;
    if (m.type === "started") {
      /* Last resort: a loop the time limit can't stop (one long step inside Python itself). Restart the worker. */
      clearTimeout(c.timer);
      c.timer = setTimeout(function () { if (py.call === c) { killWorker(); startKernel(true); } }, TIME_LIMIT_MS + HARD_STOP_EXTRA_MS);
    } else if (m.type === "done" || m.type === "crash") {
      py.call = null;
      clearTimeout(c.timer);
      if (m.type === "crash") { killWorker(); startKernel(true); c.resolve({ crashed: m.message }); }
      else c.resolve(JSON.parse(m.result));
    }
  }
  function crashed(message) {
    var c = py.call;
    killWorker();
    startKernel(true);
    if (c) c.resolve({ crashed: message });
  }
  function whenReady() {
    if (py.state === "ready") return Promise.resolve(true);
    if (py.state === "failed") return Promise.resolve(false);
    return new Promise(function (r) { py.waiters.push(r); });
  }
  function kernelCall(msg) {
    return whenReady().then(function (ok) {
      if (!ok || !py.worker) return { failed: true };
      return new Promise(function (resolve) {
        msg.id = ++py.ids;
        py.call = { id: msg.id, resolve: resolve, timer: null };
        py.worker.postMessage(msg);
      });
    });
  }

  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function runCell(cell, opts) {
    opts = opts || {};
    if (cell.busy) return Promise.resolve(cell.state !== "error" && cell.state !== "notyet");
    if (py.state === "failed") { announce("Python could not load, so the code box can't run."); return Promise.resolve(false); }
    cell.busy = true;
    cell.runBtn.classList.add("busy");
    cell.runBtn.setAttribute("aria-label", "Running code box " + cell.n);
    var waitNote = false;
    if (py.state !== "ready") {
      waitNote = true;
      cell.pre.innerHTML = '<span class="note wait">Python is starting. The first start takes a few seconds, then this code box runs.</span>';
      cell.out.hidden = false;
      refit();
    }
    var gen = generation;
    function done(ok) {
      if (waitNote && cell.pre.querySelector(".wait")) { cell.pre.innerHTML = ""; cell.out.hidden = true; refit(); }
      cell.busy = false;
      cell.runBtn.classList.remove("busy");
      cell.runBtn.setAttribute("aria-label", "Run code box " + cell.n);
      return ok;
    }
    return enqueue(function () {
      return whenReady().then(function (ready) {
        if (!ready || gen !== generation) return false;
        return delay(opts.fast ? 90 : RUN_DELAY_MS).then(function () {
          if (gen !== generation) return false;
          return execute(cell, gen);
        });
      });
    }).then(done, function () { return done(false); });
  }

  function execute(cell, gen) {
    var src = cell.editor.value;
    return kernelCall({ type: "run", src: src, limit: TIME_LIMIT_MS }).then(function (res) {
      if (gen !== generation) return false;   /* Restart was clicked while it ran */
      if (res.failed) return false;
      var count = ++execCount;
      if (res.killed || res.crashed) {
        res = {
          out: [], truncated: false, input: false, restarted: true,
          error: { type: "KeyboardInterrupt", msg: res.killed ? "the code box ran for " + (TIME_LIMIT_MS / 1000) + " seconds, so it was stopped. Check for a loop that never ends." : "Python stopped unexpectedly.", line: 0,
                   entries: [{ last: [["r", "KeyboardInterrupt"], ["", ": " + (res.killed ? "the code box ran for " + (TIME_LIMIT_MS / 1000) + " seconds, so it was stopped. Check for a loop that never ends." : "Python stopped unexpectedly.")]] }] }
        };
      }
      cell.count = count;
      cell.hadError = !!res.error;
      cell.cnt.textContent = "[" + count + "]";
      var outText = (res.out || []).filter(function (c) { return c[0] === "out"; }).map(function (c) { return c[1]; }).join("");
      renderOutput(cell, res);
      var ok = check(cell, outText, res.error);
      updateProgress();
      refit();
      return ok;
    });
  }

  /* ---------- Output and tracebacks ---------- */
  /* The kernel sends the traceback as plain Python 3.12 prints it: a list of entries, each a list of
     [style, text] parts, joined by new lines. Styles: "r" red, "g" green, "c" cyan, "" plain. The last entry is bold. */
  var TB_CLASS = { r: "tb-red", g: "tb-green", c: "tb-cyan" };
  function span(cls, text) { return '<span class="' + cls + '">' + esc(text) + "</span>"; }
  function parts(list) {
    return list.map(function (p) { return TB_CLASS[p[0]] ? span(TB_CLASS[p[0]], p[1]) : esc(p[1]); }).join("");
  }
  function traceback(err) {
    var out = (err.entries || []).map(function (e) {
      return e.last ? '<span class="tb-last">' + parts(e.last) + "</span>" : parts(e);
    }).join("\n");
    return out.replace(/\s+$/, "");
  }
  function renderOutput(cell, res) {
    var html = "", err = res.error;
    (res.out || []).forEach(function (c) { html += c[0] === "err" ? span("stderr", c[1]) : esc(c[1]); });
    if (res.truncated) html += span("muted", "\n(Output shortened)\n");
    if (res.input) html += (html && !/\n$/.test(html) ? "\n" : "") + '<span class="note">input() asks you to type an answer, but this practice page can\'t take typed answers. So input() gave back an empty answer (\'\'). On a computer that runs Python, a box appears here for you to type in.</span>';
    if (err) {
      if (html && !/\n$/.test(html.replace(/<[^>]+>/g, ""))) html += "\n";
      html += traceback(err);
      if (res.restarted) html += '<span class="note">Python had to start over to stop this code box, so every variable is gone. Click <b>Start over and run all</b>, or run the code boxes again from the top.</span>';
      cell.editor.markError(err.line || 0);
      announce("Error: " + err.type + (err.msg ? ": " + err.msg : ""));
    } else {
      cell.editor.markError(0);
      announce("Code box " + cell.n + " ran" + ((res.out || []).length ? "" : " and printed nothing"));
    }
    cell.pre.innerHTML = html;
    cell.out.hidden = html === "";
    cell.out.classList.remove("flash");
    void cell.out.offsetWidth;
    cell.out.classList.add("flash");
  }

  /* ---------- Checks ---------- */
  function norm(s) { return String(s).replace(/\r/g, "").split("\n").map(function (l) { return l.replace(/[ \t]+$/, ""); }).join("\n").replace(/^\n+|\n+$/g, ""); }
  function check(cell, outText, err) {
    var c = cell.cfg, kind = cell.kind, value = c.check && c.check.value != null ? String(c.check.value) : "";
    var pass;
    if (err) pass = false;
    else if (kind === "output_equals") pass = norm(outText) === norm(value);
    else if (kind === "output_contains") pass = outText.indexOf(value) >= 0 || norm(outText).indexOf(norm(value)) >= 0;
    else pass = true;   /* no_error and none: a clean run passes */
    var hintTail = c.hint ? " If you're stuck, click <b>Show a hint</b>." : "";
    var box = cell.chk;
    box.className = "chk";
    if (kind === "none") {
      cell.state = err ? "error" : "ran";
      box.hidden = true;
      return !err;
    }
    if (pass) {
      cell.state = "pass";
      box.classList.add("pass");
      box.innerHTML = ICON_OK + "<div>" + inline(c.done_msg || "Done. That's right.") + "</div>";
    } else {
      cell.state = "notyet";
      box.classList.add("notyet");
      var msg;
      if (err) msg = "<b>Not yet.</b> Read the last line of the error first. It names the problem. Fix the code, then run the code box again." + hintTail;
      else if (kind === "output_equals") msg = "<b>Not yet.</b> Your output should be exactly:<pre>" + esc(value) + "</pre>";
      else if (kind === "output_contains") msg = "<b>Not yet.</b> Your output should include:<pre>" + esc(value) + "</pre>";
      else msg = "<b>Not yet.</b> Fix the error, then run the code box again." + hintTail;
      if (!err && (kind === "output_equals" || kind === "output_contains") && c.hint) msg += "<span>If you're stuck, click <b>Show a hint</b>.</span>";
      box.innerHTML = ICON_INFO + "<div>" + msg + "</div>";
    }
    box.hidden = false;
    return pass;
  }

  var finished = false;
  function updateProgress() {
    var checked = codeCells.filter(function (c) { return c.kind !== "none"; });
    var allDone;
    if (checked.length) {
      var passed = checked.filter(function (c) { return c.state === "pass"; }).length;
      mid.innerHTML = "<b>" + passed + " of " + checked.length + "</b> checks done";
      allDone = passed === checked.length;
    } else {
      var ran = codeCells.filter(function (c) { return c.state === "ran"; }).length;
      mid.innerHTML = "<b>" + ran + " of " + codeCells.length + "</b> code boxes run";
      allDone = codeCells.length > 0 && ran === codeCells.length;
    }
    if (allDone) {
      if (py.state === "ready") { donemsg.innerHTML = ICON_OK + "<div>" + inline(CFG.final_done_msg || "You've finished the Try.") + "</div>"; donemsg.hidden = false; }
      if (!finished) { finished = true; announce(CFG.final_done_msg || "You've finished the Try."); tellParent({ type: "extern-try-done" }); }
    } else if (py.state !== "failed") {
      donemsg.hidden = true;
      finished = false;
    }
  }
  function tellParent(msg) { if (embedded) { try { window.parent.postMessage(msg, "*"); } catch (e) { /* ignore */ } } }

  /* ---------- Restart, and Restart and run all ---------- */
  function restart(quiet) {
    generation++;
    if (py.call) { killWorker(); startKernel(true); }   /* a cell is running: stop it, like Colab's restart */
    else if (py.state !== "failed") enqueue(function () { return kernelCall({ type: "reset" }); });
    execCount = 0;
    codeCells.forEach(function (c) {
      c.state = "idle"; c.count = 0; c.hadError = false;
      c.cnt.textContent = "[ ]";
      c.pre.innerHTML = ""; c.out.hidden = true;
      c.chk.hidden = true; c.chk.innerHTML = "";
      c.editor.markError(0);
    });
    finished = false;
    donemsg.hidden = true;
    updateProgress();
    refit();
    if (!quiet) announce("Started over. Every variable is gone, so run the code boxes again from the top.");
  }
  var runningAll = false;
  function runAll() {
    if (runningAll || py.state === "failed") return;
    runningAll = true;
    $("runall").disabled = true; $("restart").disabled = true;
    restart(true);
    var i = 0;
    function step() {
      if (i >= codeCells.length) return Promise.resolve(true);
      var cell = codeCells[i++];
      return runCell(cell, { fast: true }).then(function () {
        if (cell.hadError) {
          if (cell.screen !== cur) show(cell.screen);
          announce("Stopped at code box " + cell.n + " because it has an error.");
          return false;
        }
        return step();
      });
    }
    step().then(function () {
      runningAll = false;
      $("runall").disabled = false; $("restart").disabled = false;
    });
  }
  $("restart").addEventListener("click", function () { restart(false); });
  $("runall").addEventListener("click", runAll);

  /* ---------- Keyboard: Shift+Enter anywhere in a cell runs it; arrows change screens outside the code ---------- */
  document.addEventListener("keydown", function (e) {
    var t = e.target;
    if (t && t.tagName === "TEXTAREA") return;
    if (e.key === "Enter" && e.shiftKey) {
      var host = t && t.closest ? t.closest(".ccell") : null;
      var cell = host ? codeCells.filter(function (c) { return c.el === host; })[0] : null;
      if (cell) { e.preventDefault(); runCell(cell); }
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey || (t && t.tagName === "INPUT")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); show(cur + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); show(cur - 1); }
  });

  /* ---------- Loading Python ---------- */
  function loadFailed() {
    clearTimeout(py.loadTimer);
    py.state = "failed";
    setConn("failed", "Python could not load");
    donemsg.innerHTML = ICON_INFO + '<div>Python could not load, so the code boxes can\'t run right now. Check your internet connection, then try again.</div><button type="button" class="tbtn retry" id="retry">Try Again</button>';
    donemsg.dataset.failed = "1";
    donemsg.hidden = false;
    $("retry").addEventListener("click", retryLoad);
    var q = py.waiters; py.waiters = [];
    q.forEach(function (r) { r(false); });
    refit();
  }
  function retryLoad() {
    donemsg.hidden = true;
    delete donemsg.dataset.failed;
    killWorker();
    startKernel(false);
  }

  /* ---------- Fit: the stage scales to the frame; the notebook area zooms down a little before it would ever scroll ---------- */
  app.style.height = STAGE_H + "px";
  function fitStage() {
    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.min(w / STAGE_W, h / STAGE_H);
    app.style.transform = "translate(" + ((w - STAGE_W * s) / 2) + "px," + ((h - STAGE_H * s) / 2) + "px) scale(" + s + ")";
  }
  function fitNotebook() {
    var s = screens[cur];
    if (!s) return;
    var z = 1;
    s.el.style.zoom = "1";
    nb.classList.remove("overflow");
    while (nb.scrollHeight > nb.clientHeight + 1 && z > ZOOM_MIN) {
      z = Math.max(ZOOM_MIN, Math.round((z - 0.025) * 1000) / 1000);
      s.el.style.zoom = String(z);
    }
    if (nb.scrollHeight > nb.clientHeight + 1) nb.classList.add("overflow");   /* last resort only */
  }
  var raf = 0;
  function refit() { cancelAnimationFrame(raf); raf = requestAnimationFrame(function () { fitStage(); fitNotebook(); }); }
  window.addEventListener("resize", refit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { codeCells.forEach(function (c) { c.editor.paint(); }); refit(); });

  fitStage();
  show(0);
  updateProgress();
  startKernel(false);
})();
</script>
</body>
</html>
