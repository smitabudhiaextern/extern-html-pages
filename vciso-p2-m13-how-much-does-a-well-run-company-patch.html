  <div class="nsf">
    <h2>How Much Does a Well-Run Company Patch?</h2>
    <p>A patch is an update from a program's maker that fixes a known flaw. A system is fully patched when every patch for it is installed. A system is any computer or program the company runs.</p>
    <p><strong>What share of its systems do you think a large, well-run company has fully patched?</strong> Write down your guess before you read on.</p>
    <h3>The answer</h3>
    <p>There is no single right number here. These are the figures for where real companies sit.</p>
    <ul>
      <li><strong>60 to 70%</strong> is common.</li>
      <li><strong>90%</strong> is doing well.</li>
      <li><strong>100%</strong> is theoretical. It is possible on paper, but real companies do not reach it.</li>
    </ul>
    <h3>Why not 100%?</h3>
    <p>There are four reasons that we are going to show you. They explain why even a well-run company leaves some systems unpatched.</p>
    <ul>
      <li><strong>Outage windows.</strong> Most patches need a restart. Many systems can only be switched off at an agreed time, called an outage window, so the patch waits.</li>
      <li><strong>Old software depending on other old software.</strong> Updating one program can break an older program that relies on it, so both stay as they are.</li>
      <li><strong>Suppliers who won't support the newer version.</strong> The company that sells a program may only help with problems on an older version. Updating means losing their help.</li>
      <li><strong>Systems nobody dares touch.</strong> Some systems matter so much that nobody wants to risk restarting them. So they go without patches.</li>
    </ul>
    <p>When you open Cumberland's scan, expect a lot of rows. Some will be for systems that cannot be patched, and some will turn out to be wrong. A scanner is a program that checks each machine for known flaws. Unpatchable means no patch can be installed to fix it. A defect here means a sign that the scanner is broken.</p>
    <div class="box"><p>So a scanner reporting things that turn out to be wrong, or unpatchable, is expected, not a defect.</p></div>
  </div>
</noscript>

    { id:"guess", kind:"guess", label:"Your guess",
      h1:"How Much Does a Well-Run Company Patch?",
      q:"What share of its systems do you think a large, well-run company has fully patched?" },

    { id:"answer", kind:"answer", label:"The answer",
      h1:"Here Is Where Real Companies Sit" },

    { id:"why", kind:"explore", label:"Why",
      h1:"Why Not 100%?",
      lead:"There are four reasons that we are going to show you. Click or tap each card to open it.",
      cards:[
        { id:"outage", ic:"clock", name:"Outage windows",
          txt:"Most patches need a restart. Many systems can only be switched off at an agreed time, called an outage window, so the patch waits." },
        { id:"old", ic:"stack", name:"Old software depending on other old software",
          txt:"Updating one program can break an older program that relies on it. So both stay as they are." },
        { id:"supplier", ic:"vendor", name:"Suppliers who won't support the newer version",
          txt:"The company that sells a program may only help with problems on an older version. Updating means losing their help." },
        { id:"touch", ic:"warn", name:"Systems nobody dares touch",
          txt:"Some systems matter so much that nobody wants to risk restarting them. So they go without patches." }
      ] },

    { id:"close", kind:"close", label:"Your scan",
      h1:"What This Means for Your Scan",
      body:"So a scanner reporting things that turn out to be wrong, or unpatchable, is expected, not a defect." }
  ];

  /* ---------------- state ---------------- */
  var KEY = "vciso-p2-m13-well-run-patch-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { g:null, locked:false, shown:false, opened:{} }; }
  function okG(v){ return typeof v === "number" && v >= 0 && v <= 100 && Math.floor(v) === v; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var g = okG(raw.g) ? raw.g : null;
      var locked = !!raw.locked && g !== null;
      return { g:g, locked:locked, shown:!!raw.shown && locked,
               opened: isPlain(raw.opened) ? raw.opened : {} };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = m; }
  function openedCount(s){ return (s.cards || []).filter(function(c){ return st.opened[c.id]; }).length; }

  /* The verdict compares the guess with the SME's three figures only. */
  var NEXT = " The next slide shows why even well-run companies stop short of 100%.";
  function verdict(g){
    if(g >= 90) return "You guessed " + g + "%. " + (g === 90 ? "That is exactly what a company doing well reaches. Many large companies sit at 60 to 70%." : "That is higher than even a company doing well reaches, which is about 90%. Most people guess high.") + NEXT;
    if(g > 70)  return "You guessed " + g + "%. That is above what is common. Most people guess high." + NEXT;
    if(g >= 60) return "You guessed " + g + "%. That is what is common." + NEXT;
    return "You guessed " + g + "%. That is below what is common, so real companies patch more of their systems than you thought, but still not all of them." + NEXT;
  }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    if(s.kind === "explore"){
      el.chip.hidden = false;
      el.chip.textContent = "Opened " + openedCount(s) + " of " + s.cards.length;
    } else el.chip.hidden = true;

    el.back.disabled = (i === 0);
    el.next.textContent = "Continue";
    el.next.disabled = false;
    el.hint.textContent = "";
    el.next.classList.toggle("end", i === S.length-1);
    if(i === S.length-1){
      el.next.disabled = true; el.next.textContent = "You are at the end";
      el.hint.innerHTML = "You have finished. Go back to the module page and carry on from where you left off.";
    }
    else if(s.kind === "guess" && !st.locked){
      el.next.disabled = true;
      el.hint.innerHTML = "Set your guess on the line and lock it in to carry on.";
    }
    else if(s.kind === "answer" && !st.shown){
      el.next.disabled = true;
      el.hint.innerHTML = "Show the answer to carry on.";
    }
    else if(s.kind === "explore" && openedCount(s) < s.cards.length){
      el.next.disabled = true;
      el.hint.innerHTML = "Open all four cards to carry on.";
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);
    if(s.kind === "guess") renderGuess(s);
    else if(s.kind === "answer") renderAnswer(s);
    else if(s.kind === "explore") renderExplore(s);
    else renderClose(s);
    header();
    say("Slide " + (i+1) + " of " + S.length + ". " + s.h1 + ".");
  }

  /* Slide 1: the guess. The line starts empty: no thumb, no value, dashed
     track, until the student clicks, drags or presses a key. */
  function renderGuess(s){
    var ticks = "";
    [0,25,50,75,100].forEach(function(t){ ticks += '<span class="tk" style="left:' + t + '%">' + t + "%</span>"; });
    el.board.innerHTML =
        '<div class="defs">'
      +   '<div class="def"><b>What is a patch?</b> An update from a program\'s maker that fixes a known flaw.</div>'
      +   '<div class="def"><b>What does fully patched mean?</b> Every patch for a system is installed. A system is any computer or program the company runs.</div>'
      + "</div>"
      + '<div class="ask">'
      +   '<p class="q">' + esc(s.q) + "</p>"
      +   '<div class="readout" id="ro"></div>'
      +   '<div class="slider" id="sl" role="slider" tabindex="0" aria-label="Your guess, in percent" aria-valuemin="0" aria-valuemax="100">'
      +     '<span class="trk"></span><span class="fill" id="fill"></span><span class="thumb" id="th"></span>' + ticks
      +   "</div>"
      +   '<div class="ctl"><button class="step" id="lockb" type="button">' + icon("lock") + "Lock in my guess</button>"
      +   '<span class="cs" id="cs"></span></div>'
      + "</div>";

    var sl = el.board.querySelector("#sl"), ro = el.board.querySelector("#ro"),
        fill = el.board.querySelector("#fill"), th = el.board.querySelector("#th"),
        lockb = el.board.querySelector("#lockb"), cs = el.board.querySelector("#cs");

    function paint(){
      var g = st.g;
      if(g === null){
        sl.classList.remove("set");
        sl.setAttribute("aria-valuetext", "No guess yet");
        sl.removeAttribute("aria-valuenow");
        ro.innerHTML = '<span class="rv none">No guess yet.</span><span class="rl">Click, tap or drag on the line below to set the share that you think is right. You can also use the arrow keys.</span>';
      } else {
        sl.classList.add("set");
        sl.setAttribute("aria-valuenow", g);
        sl.setAttribute("aria-valuetext", g + " percent");
        fill.style.width = g + "%";
        th.style.left = g + "%";
        ro.innerHTML = '<span class="rv">' + g + "%</span>"
          + '<span class="rl">' + (st.locked ? "<b>Locked in.</b> This is your guess." : "Your guess so far. Adjust it until it feels right.") + "</span>";
      }
      sl.classList.toggle("locked", st.locked);
      sl.setAttribute("aria-disabled", st.locked ? "true" : "false");
      lockb.disabled = st.locked || g === null;
      lockb.classList.toggle("done", st.locked);
      if(st.locked){
        lockb.innerHTML = icon("lock") + "Guess locked";
        cs.innerHTML = '<span class="gl" aria-hidden="true">✓</span><b>Locked at ' + g + "%.</b> Continue to see the answer.";
      } else if(g === null){
        cs.textContent = "";
      } else {
        cs.textContent = "Lock it in when you are ready.";
      }
    }
    function setFromX(x){
      if(st.locked) return;
      var r = sl.getBoundingClientRect();
      var p = Math.round((x - r.left) / r.width * 100);
      st.g = Math.max(0, Math.min(100, p));
      save(st); paint();
    }
    var dragging = false;
    sl.addEventListener("pointerdown", function(e){
      if(st.locked) return;
      dragging = true;
      try{ sl.focus({focusVisible:false}); }catch(err){ sl.focus(); }
      try{ sl.setPointerCapture(e.pointerId); }catch(err){}
      setFromX(e.clientX);
    });
    sl.addEventListener("pointermove", function(e){ if(dragging) setFromX(e.clientX); });
    sl.addEventListener("pointerup", function(){ dragging = false; });
    sl.addEventListener("pointercancel", function(){ dragging = false; });
    sl.addEventListener("keydown", function(e){
      if(st.locked) return;
      var d = 0;
      if(e.key === "ArrowRight" || e.key === "ArrowUp") d = 1;
      else if(e.key === "ArrowLeft" || e.key === "ArrowDown") d = -1;
      else if(e.key === "PageUp") d = 10;
      else if(e.key === "PageDown") d = -10;
      else if(e.key === "Home"){ e.preventDefault(); st.g = 0; save(st); paint(); return; }
      else if(e.key === "End"){ e.preventDefault(); st.g = 100; save(st); paint(); return; }
      else return;
      e.preventDefault();
      /* From empty, the first key press starts the guess at 50. */
      st.g = st.g === null ? 50 : Math.max(0, Math.min(100, st.g + d));
      save(st); paint();
    });
    lockb.addEventListener("click", function(){
      if(st.g === null || st.locked) return;
      st.locked = true; save(st); paint(); header();
      el.next.focus();
      say("Guess locked at " + st.g + " percent.");
    });
    paint();
  }

  /* Slide 2: the answer on the same 0 to 100 line, with the guess pinned. */
  var LEAD_PRE = "There is no single right number here. Click or tap Show the answer to see where real companies sit, and how close your guess was.";
  var LEAD_SHOWN = "There is no single right number here. This is where real companies sit, and how close your guess was.";
  function renderAnswer(){
    var g = st.g;
    var you = (g === null) ? "" :
      '<div class="you" style="left:' + g + '%"><span class="yt">Your guess: ' + g + '%</span><span class="yp"></span><span class="ys"></span></div>';
    var AH = st.shown ? "" : ' aria-hidden="true"';
    var marks = ""
      + '<span class="band ans"' + AH + ' style="left:60%;width:10%"></span>'
      + '<span class="al ans"' + AH + ' style="left:65%"><span class="n">60 to 70%</span><span class="w">Common</span></span>'
      + '<span class="mk ans"' + AH + ' style="left:90%"></span>'
      + '<span class="al ans well"' + AH + ' style="left:90%"><span class="n">90%</span><span class="w">Doing well</span></span>'
      + '<span class="mk ans"' + AH + ' style="left:100%"></span>'
      + '<span class="al ans side"' + AH + ' style="left:100%"><span class="n">100%</span><span class="w">Theoretical</span></span>';
    var sx = "";
    /* 75% and 100% are plain axis labels shown only before the reveal,
       where the answer labels would otherwise collide with them. */
    [0,25,50,75,100].forEach(function(t){ sx += '<span class="sx' + (t > 50 ? " pre" : "") + '" style="left:' + t + '%">' + t + "%</span>"; });
    el.board.innerHTML =
        '<p class="lead" id="al">' + (st.shown ? LEAD_SHOWN : LEAD_PRE) + "</p>"
      + '<div class="scalebox"><div class="scale' + (st.shown ? " shown" : "") + '" id="sc">'
      +   '<span class="trk"></span>' + sx + marks + you
      + "</div></div>"
      + '<div class="legend' + (st.shown ? " shown-all" : "") + '" id="lg">'
      +   ANS.map(function(a){
            return '<div class="lg"' + (st.shown ? "" : ' aria-hidden="true"') + '><span class="n">' + a.n + '</span><span class="w">' + a.w + '</span><span class="d">' + a.d + "</span></div>";
          }).join("")
      + "</div>"
      + '<div class="ctl" style="margin-top:0">'
      +   (st.shown ? "" : '<button class="step" id="showb" type="button">Show the answer ' + icon("arrow") + "</button>")
      +   '<p class="verdict" id="vd">' + (st.shown && g !== null ? '<span class="gl" aria-hidden="true">' + icon("target").replace('class="ic"','class="ic" style="width:13px;height:13px"') + "</span><span>" + esc(verdict(g)) + "</span>" : "") + "</p>"
      + "</div>";
    /* Keep the guess bubble inside the box at the far left. */
    var yt = el.board.querySelector(".you .yt"), sc0 = el.board.querySelector("#sc");
    if(yt && sc0){
      var W = sc0.getBoundingClientRect().width / (stageScale() || 1);
      var half = yt.offsetWidth / 2;
      var room = g * W / 100 + (window.matchMedia("(max-width:599px)").matches ? 28 : 44);   /* scale margin + most of the box padding (30+26 desktop, 22+10 phone) */
      yt.style.left = (-Math.min(half, room)) + "px";
    }
    var b = el.board.querySelector("#showb");
    if(b) b.addEventListener("click", function(){
      st.shown = true; save(st);
      var sc = el.board.querySelector("#sc"), lg = el.board.querySelector("#lg");
      sc.classList.add("shown");
      if(reduce) lg.classList.add("shown-all");
      else setTimeout(function(){ lg.classList.add("shown-all"); }, 260);
      Array.prototype.forEach.call(lg.querySelectorAll(".lg"), function(x){ x.removeAttribute("aria-hidden"); });
      Array.prototype.forEach.call(sc.querySelectorAll(".ans"), function(x){ x.removeAttribute("aria-hidden"); });
      var vd = el.board.querySelector("#vd");
      if(g !== null) vd.innerHTML = '<span class="gl" aria-hidden="true">' + icon("target").replace('class="ic"','class="ic" style="width:13px;height:13px"') + "</span><span>" + esc(verdict(g)) + "</span>";
      b.remove();
      var al = el.board.querySelector("#al"); if(al) al.textContent = LEAD_SHOWN;
      header();
      el.next.focus();
      say("60 to 70 percent is common. 90 percent is doing well. 100 percent is theoretical. " + (g !== null ? verdict(g) : ""));
    });
  }

  /* Slide 3: four cards, opened in any order. Continue waits for all four. */
  function renderExplore(s){
    el.board.innerHTML = '<p class="lead">' + s.lead + "</p>"
      + '<div class="cards4">' + s.cards.map(function(c){
          var open = !!st.opened[c.id];
          return '<button class="oc' + (open ? " open" : "") + '" type="button" data-c="' + esc(c.id) + '" aria-expanded="' + open + '">'
            + '<span class="oi">' + icon(c.ic) + "</span>"
            + '<span class="ot">' + esc(c.name) + "</span>"
            + '<span class="ob">' + obHTML(c, open) + "</span>"
            + "</button>";
        }).join("") + "</div>";
    Array.prototype.forEach.call(el.board.querySelectorAll("button.oc"), function(b){
      b.addEventListener("click", function(){
        var c = null;
        s.cards.forEach(function(x){ if(x.id === b.dataset.c) c = x; });
        if(!c || st.opened[c.id]) return;
        st.opened[c.id] = 1; save(st);
        b.classList.add("open");
        b.setAttribute("aria-expanded", "true");
        var ob = b.querySelector(".ob");
        ob.innerHTML = obHTML(c, true);
        if(!reduce){ ob.classList.remove("in"); void ob.offsetWidth; ob.classList.add("in"); }
        header();
        say(c.name + ". " + c.txt + " Opened " + openedCount(s) + " of " + s.cards.length + ".");
      });
    });
  }
  function obHTML(c, open){
    return open
      ? '<span class="gl" aria-hidden="true">✓</span><span>' + esc(c.txt) + "</span>"
      : '<span class="gl" aria-hidden="true">+</span><span>Click or tap to open</span>';
  }

  /* Slide 4: the closing line, the two words it needs, and start over. */
  function renderClose(s){
    el.board.innerHTML = '<div class="closewrap">'
      + '<div class="defs d3">'
      +   '<div class="def"><b>What is a scanner?</b> A program that checks each machine for known flaws. Ridgeline IT ran one on Cumberland\'s machines.</div>'
      +   '<div class="def"><b>What does unpatchable mean?</b> No patch can be installed to fix it.</div>'
      +   '<div class="def"><b>What is a defect here?</b> A sign that the scanner is broken.</div>'
      + "</div>"
      + '<p class="bridge">When you open Cumberland\'s scan, expect a lot of rows. Some will be for systems that cannot be patched, and some will turn out to be wrong.</p>'
      + '<div class="statement"><p>' + esc(s.body) + "</p></div>"
      + '<div class="endrow"><ul class="recap" aria-label="Your guess and the answer">'
      +   (st.g !== null ? "<li>" + icon("target") + "Your guess: " + st.g + "%</li>" : "")
      +   "<li>" + icon("chart") + "Common: 60 to 70%</li>"
      +   "<li>" + icon("chart") + "Doing well: 90%</li>"
      + "</ul>"
      + '<button class="step ghost" id="again" type="button">' + icon("reset") + "Start over</button></div>"
      + "</div>";
    el.board.querySelector("#again").addEventListener("click", function(){
      st = fresh(); save(st); i = 0; render(); el.frame.focus();
      say("Started over. No guess yet.");
    });
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    if(d > 0 && el.next.disabled) return;
    i = n; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return true;
    var r = node.getAttribute && node.getAttribute("role");
    return r === "slider" || r === "textbox" || r === "spinbutton" || r === "listbox";
  }

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    if(ownsKeys(e.target) || (e.target.closest && e.target.closest(".slider"))){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0) go(1); else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function stageScale(){ var m = /scale\(([\d.]+)\)/.exec(stage.style.transform || ""); return m ? parseFloat(m[1]) : 1; }
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    state:function(){ return { i:i, g:st.g, locked:st.locked, shown:st.shown, opened:st.opened }; }
  };
})();
</script>
</body>
</html>
