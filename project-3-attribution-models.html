<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Who gets the credit?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FDF8F8;
    --highlight: #DCE1FF;
    --accent: #001D69;
    --title: #1C1B1B;
    --body: #484646;
    --white: #FFFFFF;
    --grey-text: #6E6E73;
    --grey-surface: #F1F1F4;
    --grey-border: #E2E2E6;
    --ok: #1B7A5A;
    --ok-bg: #E9F5EF;
    --ok-border: #BFE3D3;
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent;
    margin: 0; padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--body);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 14px; }

  .card {
    position: relative;
    background: var(--white);
    border: 1px solid #E8E8EC;
    border-radius: 18px;
    padding: 22px 26px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .06);
  }

  .eyebrow {
    display: inline-block;
    font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--accent); background: var(--highlight);
    padding: 5px 12px; border-radius: 999px; margin: 0 0 10px;
  }

  h1 { font-size: 1.24rem; font-weight: 800; color: var(--title); margin: 0 0 6px; line-height: 1.3; }
  .rubric { font-size: 0.85rem; line-height: 1.55; color: var(--body); margin: 0 0 14px; }
  .rubric b { color: var(--title); font-weight: 700; }

  /* ── Tracker ──────────────────────────────── */
  .trackbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin: 0 0 16px;
    padding-bottom: 14px; border-bottom: 1px solid var(--grey-border);
  }
  .dots { display: flex; gap: 8px; }
  .dot {
    width: 11px; height: 11px; border-radius: 999px;
    background: var(--grey-surface); border: 1.5px solid var(--grey-border);
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .dot.done { background: var(--ok); border-color: var(--ok); }
  .dot.current { border-color: var(--accent); transform: scale(1.25); }
  .progress { font-size: 0.78rem; font-weight: 700; color: var(--grey-text); }
  .progress b { color: var(--accent); }

  /* ── Order / nudges panel ─────────────────── */
  .order {
    background: var(--bg);
    border: 1px solid var(--grey-border);
    border-radius: 12px;
    padding: 14px 16px; margin: 0 0 16px;
  }
  .order .who {
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 8px;
  }
  .nudge {
    display: flex; gap: 11px; align-items: flex-start;
    padding: 7px 0;
  }
  .nudge + .nudge { border-top: 1px dashed var(--grey-border); }
  .nudge .ne { font-size: 1.5rem; line-height: 1.2; flex: none; }
  .nudge .day { font-size: 0.7rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .03em; }
  .nudge .txt { font-size: 0.86rem; line-height: 1.45; color: var(--title); margin: 1px 0 0; }

  .prompt { font-size: 0.82rem; font-weight: 700; color: var(--grey-text); margin: 0 0 10px; }

  /* ── Priming chips ────────────────────────── */
  .chips { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip {
    font-family: inherit; font-size: 0.85rem; font-weight: 600;
    padding: 9px 14px; border-radius: 10px; cursor: pointer;
    border: 1.5px solid var(--grey-border); background: var(--white); color: var(--title);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .chip:hover { box-shadow: inset 0 0 0 2px rgba(0,29,105,.12); }
  .chip.picked { border-color: var(--accent); box-shadow: inset 0 0 0 2px rgba(0,29,105,.2); }
  .note {
    margin: 14px 0 0; padding: 13px 15px; border-radius: 12px;
    background: var(--highlight); color: var(--accent);
    font-size: 0.86rem; line-height: 1.55;
  }
  .note b { font-weight: 800; }

  /* ── Model split bars ─────────────────────── */
  .model-name {
    display: inline-block; font-size: 0.72rem; font-weight: 800;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--accent); background: var(--highlight);
    padding: 4px 11px; border-radius: 999px; margin: 0 0 4px;
  }
  .model-rule { font-size: 0.9rem; line-height: 1.5; color: var(--title); margin: 0 0 14px; font-weight: 600; }
  .bars { display: flex; flex-direction: column; gap: 11px; margin: 0 0 4px; }
  .bar-row { display: flex; align-items: center; gap: 11px; }
  .bar-lab { flex: none; width: 118px; font-size: 0.82rem; font-weight: 600; color: var(--title); display: flex; align-items: center; gap: 7px; }
  .bar-lab .be { font-size: 1.15rem; }
  .bar-track {
    position: relative; flex: 1; height: 26px;
    background: var(--grey-surface); border-radius: 8px; overflow: hidden;
  }
  .bar-fill {
    position: absolute; left: 0; top: 0; height: 100%; width: 0;
    background: var(--accent); border-radius: 8px;
    transition: width .6s cubic-bezier(.22,.61,.36,1);
  }
  .bar-fill.zero { background: var(--grey-border); }
  .bar-amt { flex: none; width: 46px; text-align: right; font-size: 0.9rem; font-weight: 800; color: var(--accent); }
  .bar-amt.zero { color: var(--grey-text); }
  .reveal-hint { font-size: 0.8rem; color: var(--grey-text); margin: 12px 0 0; }
  .blurb {
    margin: 14px 0 0; padding: 13px 15px; border-radius: 12px;
    background: var(--ok-bg); border: 1px solid var(--ok-border);
    font-size: 0.85rem; line-height: 1.55; color: var(--body);
  }

  /* ── Recap table ──────────────────────────── */
  .recap { width: 100%; border-collapse: collapse; margin: 6px 0 0; font-size: 0.82rem; }
  .recap th, .recap td { padding: 9px 8px; text-align: center; border-bottom: 1px solid var(--grey-border); }
  .recap th { color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: .02em; font-size: 0.68rem; }
  .recap td:first-child, .recap th:first-child { text-align: left; font-weight: 700; color: var(--title); }
  .recap tr:last-child td { border-bottom: none; }
  .takeaway {
    margin: 16px 0 0; padding: 14px 16px; border-radius: 12px;
    background: var(--highlight); color: var(--accent);
    font-size: 0.88rem; line-height: 1.6;
  }
  .takeaway b { font-weight: 800; }

  /* ── Nav ──────────────────────────────────── */
  .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
  .nav .hint { font-size: 0.78rem; color: var(--grey-text); }
  .btn {
    font-family: inherit; font-size: 0.86rem; font-weight: 700;
    padding: 9px 18px; border-radius: 10px; cursor: pointer;
    border: 1.5px solid var(--grey-border); background: var(--white); color: var(--title);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.08); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.ghost { visibility: hidden; }

  @media (prefers-reduced-motion: reduce) {
    .btn:hover, .dot, .bar-fill { transition: none !important; transform: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="stage"></div>
  </div>

  <script>
    // One $30 pizza-night order. Three nudges led to it.
    var TOTAL = 30;
    var NUDGES = [
      { e: '📬', day: 'Monday',    lab: 'Flyer',        txt: 'A flyer for Tony’s Pizza lands in your mailbox. You glance at it.' },
      { e: '🪧', day: 'Wednesday', lab: 'Sidewalk sign', txt: 'You walk past Tony’s big sidewalk sign on your way home.' },
      { e: '📱', day: 'Friday',    lab: 'Friend’s text', txt: 'A friend texts “let’s get Tony’s tonight.” You order — a $30 pizza night.' }
    ];

    // Each model = how the $30 credit splits across [Flyer, Sign, Text]
    var MODELS = [
      { name: 'Last-touch',
        rule: 'All the credit goes to the last nudge before you bought.',
        split: [0, 0, 30],
        blurb: 'Only the friend’s text gets credit. It’s the simplest rule and the most common one in BI tools — but it ignores what first put Tony’s on your radar.' },
      { name: 'First-touch',
        rule: 'All the credit goes to the very first nudge.',
        split: [30, 0, 0],
        blurb: 'Only the flyer gets credit. Good for spotting what creates awareness, but it ignores the text that actually closed the sale.' },
      { name: 'Linear',
        rule: 'Every nudge gets an equal share.',
        split: [10, 10, 10],
        blurb: 'Fair and even — but it treats the flyer you barely remember as mattering just as much as the text that made you order.' },
      { name: 'Time-decay',
        rule: 'The closer a nudge is to the purchase, the more credit it gets.',
        split: [5, 10, 15],
        blurb: 'The recent text counts most, the old flyer least. It assumes fresher nudges did more of the work.' },
      { name: 'Position-based',
        rule: 'The first and last nudge get the most (40% each); the middle gets the rest (20%).',
        split: [12, 6, 12],
        blurb: 'It rewards both what sparked your interest (the flyer) and what closed the deal (the text), and gives the sign in between a smaller share.' }
    ];

    var PRIME_OPTS = ['The flyer', 'The sidewalk sign', 'The friend’s text', 'Split it evenly'];

    // State
    var idx = 0;                 // 0 = intro, 1..5 = models, 6 = recap
    var primed = false;
    var picked = -1;
    var revealed = [false, false, false, false, false];

    // Inert deep-link for QA / direct screen embeds: ?idx=1&rev=1
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.has('idx')) {
        idx = parseInt(q.get('idx'), 10) || 0;
        if (idx > 0) { primed = true; picked = 2; }
        for (var k = 0; k < idx - 1; k++) revealed[k] = true;
        if (q.get('rev') === '1' && idx >= 1 && idx <= 5) revealed[idx - 1] = true;
      }
    })();

    var stage = document.getElementById('stage');

    function nudgesHTML() {
      var h = '<div class="order"><p class="who">🍕 One pizza-night order · $30</p>';
      for (var i = 0; i < NUDGES.length; i++) {
        var n = NUDGES[i];
        h += '<div class="nudge"><span class="ne">' + n.e + '</span><div><span class="day">' + n.day + '</span><p class="txt">' + n.txt + '</p></div></div>';
      }
      return h + '</div>';
    }

    function dotsHTML() {
      var h = '<div class="dots">';
      for (var i = 0; i < 5; i++) {
        var c = 'dot';
        if (revealed[i] || idx === 6) c += ' done';
        if (idx - 1 === i) c += ' current';
        h += '<span class="' + c + '"></span>';
      }
      return h + '</div>';
    }

    function navHTML(nextEnabled, nextLabel, showBack, hintText) {
      var back = showBack
        ? '<button class="btn" data-nav="back">&larr; Back</button>'
        : '<button class="btn ghost">&larr; Back</button>';
      var hint = nextEnabled ? '' : '<span class="hint">' + (hintText || 'Reveal the split to continue.') + '</span>';
      var next = nextEnabled
        ? '<button class="btn primary" data-nav="next">' + nextLabel + '</button>'
        : '<button class="btn primary" disabled>' + nextLabel + '</button>';
      return '<div class="nav">' + back + hint + next + '</div>';
    }

    function renderIntro() {
      var h = '';
      h += '<span class="eyebrow">🍕 Who gets the credit?</span>';
      h += '<h1>One pizza order, five ways to count it</h1>';
      h += '<p class="rubric">Three little nudges led to one $30 order. When a company counts which nudge earned the sale, the rule it uses is called an <b>attribution model</b>. First, meet the order.</p>';
      h += nudgesHTML();
      h += '<p class="prompt">Before we start: which nudge do you think deserves the credit?</p>';
      h += '<div class="chips">';
      for (var i = 0; i < PRIME_OPTS.length; i++) {
        h += '<button class="chip' + (picked === i ? ' picked' : '') + '" data-chip="' + i + '">' + PRIME_OPTS[i] + '</button>';
      }
      h += '</div>';
      if (primed) {
        h += '<div class="note">Good instinct — and there’s no single right answer. Different companies use different rules. Watch the <b>same $30 order</b> counted five different ways, and see the credit move.</div>';
      }
      h += navHTML(primed, 'Start &rarr;', false, 'Pick an answer to continue.');
      stage.innerHTML = h;
    }

    function renderModel() {
      var m = MODELS[idx - 1];
      var isRev = revealed[idx - 1];
      var h = '';
      h += '<span class="eyebrow">🍕 Who gets the credit?</span>';
      h += '<div class="trackbar">' + dotsHTML() + '<span class="progress">Model <b>' + idx + '</b> / 5</span></div>';
      h += '<span class="model-name">' + m.name + '</span>';
      h += '<p class="model-rule">' + m.rule + '</p>';
      h += '<div class="bars">';
      for (var i = 0; i < NUDGES.length; i++) {
        var amt = m.split[i];
        var pct = isRev ? Math.round(amt / TOTAL * 100) : 0;
        var zero = (isRev && amt === 0) ? ' zero' : '';
        h += '<div class="bar-row">';
        h += '<span class="bar-lab"><span class="be">' + NUDGES[i].e + '</span>' + NUDGES[i].lab + '</span>';
        h += '<div class="bar-track"><div class="bar-fill' + zero + '" data-pct="' + pct + '"></div></div>';
        h += '<span class="bar-amt' + zero + '">' + (isRev ? '$' + amt : '&mdash;') + '</span>';
        h += '</div>';
      }
      h += '</div>';
      if (!isRev) {
        h += '<p class="reveal-hint">The same $30 order. How does <b>' + m.name + '</b> split it?</p>';
        h += '<div class="nav"><button class="btn" data-nav="back">&larr; Back</button><button class="btn primary" data-reveal="1">Reveal the split 👀</button></div>';
      } else {
        h += '<div class="blurb">' + m.blurb + '</div>';
        var nextLabel = (idx === 5) ? 'See all five &rarr;' : 'Next model &rarr;';
        h += navHTML(true, nextLabel, true);
      }
      stage.innerHTML = h;
      if (isRev) animateBars();
    }

    function animateBars() {
      var fills = stage.querySelectorAll('.bar-fill');
      // next frame so the width transition runs from 0
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          for (var i = 0; i < fills.length; i++) {
            fills[i].style.width = fills[i].getAttribute('data-pct') + '%';
          }
        });
      });
    }

    function renderRecap() {
      var h = '';
      h += '<span class="eyebrow">🍕 Who gets the credit?</span>';
      h += '<h1>Same $30 order. Five answers.</h1>';
      h += '<p class="rubric">Here is how each model split the exact same sale across the three nudges:</p>';
      h += '<table class="recap"><thead><tr><th>Model</th><th>📬 Flyer</th><th>🪧 Sign</th><th>📱 Text</th></tr></thead><tbody>';
      for (var i = 0; i < MODELS.length; i++) {
        var s = MODELS[i].split;
        h += '<tr><td>' + MODELS[i].name + '</td><td>$' + s[0] + '</td><td>$' + s[1] + '</td><td>$' + s[2] + '</td></tr>';
      }
      h += '</tbody></table>';
      h += '<div class="takeaway">None of these is the &ldquo;right&rdquo; answer — they are just different rules. <b>The model you pick changes the story the numbers tell.</b> That is why a good analyst chooses one on purpose, and says which one out loud.</div>';
      h += '<div class="nav"><button class="btn" data-nav="back">&larr; Back</button><button class="btn ghost">x</button></div>';
      stage.innerHTML = h;
    }

    function render() {
      if (idx === 0) renderIntro();
      else if (idx === 6) renderRecap();
      else renderModel();
    }

    stage.addEventListener('click', function (e) {
      var chip = e.target.closest ? e.target.closest('[data-chip]') : null;
      var rev  = e.target.closest ? e.target.closest('[data-reveal]') : null;
      var nav  = e.target.closest ? e.target.closest('[data-nav]') : null;
      if (chip) {
        picked = parseInt(chip.getAttribute('data-chip'), 10);
        primed = true;
        render();
      } else if (rev) {
        revealed[idx - 1] = true;
        render();
      } else if (nav) {
        var dir = nav.getAttribute('data-nav');
        if (dir === 'next' && idx < 6) idx++;
        else if (dir === 'back' && idx > 0) idx--;
        render();
      }
    });

    render();
  </script>
</body>
</html>
