<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Explanation Would Ray Act On</title>
<!--
  vCISO P2 Step 2, Module 7: Who Can Send Email in Cumberland's Name. Step 4.
  Interactive P2-6b. Source: P2 Sample Pack/Interactive content sets - P2.md,
  P2-6 "Second interactive (three explanations for the boss)", and the build
  spec in 06-content/project-02/step-02/module-07-internal.md.
  The three card texts, the correct answer (the plain one, because it names
  who gets hurt) and the reveal lines come from that spec. Same for all four
  scopes, so there is no scope picker.
  Governing authority: output/programs/vciso/CLAUDE.md section 6 and
  VCISO-STYLE-GUIDE.md section 6b (per-slide tint ramp).
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:8px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
  .lead{flex:0 0 auto;font-size:16px;line-height:1.45;color:var(--body);max-width:80ch}
  .lead b{color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- who Ray is ---- */
  .ray{flex:0 0 auto;display:flex;align-items:center;gap:12px;background:var(--highlight);
    border-left:4px solid var(--on-highlight);border-radius:0 10px 10px 0;padding:8px 14px}
  .ray svg.ic{width:26px;height:26px;color:var(--on-highlight);flex:0 0 auto}
  .ray p{font-size:15.5px;line-height:1.4;color:var(--title)}
  .ray b{font-weight:600}

  /* ---- slide 1: three explanation cards ---- */
  .cards3{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
  button.ex{font-family:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--title);
    border:1.5px solid var(--line);border-radius:12px;padding:12px 15px 10px;min-height:0;
    display:flex;flex-direction:column;gap:8px;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  button.ex:hover:not(:disabled){background:var(--highlight);border-color:var(--on-highlight)}
  button.ex:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.ex:disabled{cursor:default}
  .exh{display:flex;align-items:center;gap:9px}
  .exh .g{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--on-highlight);background:var(--bg);
    color:var(--on-highlight);font-size:12px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
  .exh .en{font-size:14px;font-weight:600;color:var(--on-highlight);white-space:nowrap}
  .exh .tag{margin-left:auto;font-size:12px;font-weight:600;color:var(--on-highlight);background:var(--bg);
    border:1px solid var(--on-highlight);border-radius:14px;padding:2px 9px;white-space:nowrap}
  .ext{font-size:15.5px;line-height:1.4;color:var(--title)}
  .exr{margin-top:auto;min-height:72px;border-top:1.5px dashed var(--line);padding-top:9px;
    font-size:14.5px;line-height:1.42;color:var(--body)}
  .exr b{color:var(--title);font-weight:600}
  .exr .prompt{color:var(--body)}
  button.ex.out{background:transparent;border-style:dashed}
  button.ex.out .exh .g{border-style:dashed}
  button.ex.out .ext{color:var(--body)}
  button.ex.ok{background:var(--highlight);border:1.5px solid var(--on-highlight);box-shadow:0 0 0 1px var(--on-highlight)}
  button.ex.ok .exh .g{background:var(--on-highlight);color:var(--bg)}
  button.ex.ok .exr{border-top:1.5px solid var(--on-highlight);color:var(--title)}
  button.ex .exr.in{animation:rin var(--t-reveal) var(--ease-over) both}

  /* ---- slide 2: the side-by-side reason ---- */
  .rows{flex:0 0 auto;display:flex;flex-direction:column;gap:10px}
  .row{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start;background:var(--bg);
    border:1.5px solid var(--line);border-radius:10px;padding:12px 16px}
  .row.ok{background:var(--highlight);border:2px solid var(--on-highlight)}
  .row .rk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;color:var(--on-highlight);padding-top:2px}
  .row .rk .g{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--on-highlight);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:0}
  .row.ok .rk .g{background:var(--on-highlight);color:var(--bg)}
  .row .rq{font-size:14.5px;line-height:1.4;color:var(--body)}
  .row .rw{font-size:16px;line-height:1.4;font-weight:600;color:var(--title);margin-top:4px}
  .statement{flex:0 0 auto;background:var(--highlight);border-left:5px solid var(--on-highlight);
    border-radius:0 12px 12px 0;padding:14px 22px}
  .statement p{font-size:22px;line-height:1.35;font-weight:600;color:var(--title)}

  .gate{flex:0 0 auto;display:flex;flex-direction:column;gap:14px;background:var(--bg);border:1.5px solid var(--line);
    border-radius:12px;padding:22px 24px;max-width:620px}
  .gate p{font-size:16px;line-height:1.45;color:var(--title)}
  button.go{font-family:inherit;font-size:15px;font-weight:600;padding:9px 17px;border-radius:8px;cursor:pointer;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);align-self:flex-start}
  button.go:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.5;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:56px;overflow-y:auto;font-size:13.5px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    .cards3{grid-template-columns:1fr}
    .exr{min-height:0}
    .row{grid-template-columns:1fr;gap:6px}
    .statement p{font-size:18px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Which Explanation Would Ray Act On">
    <div class="top">
      <span class="prog" id="prog">1 of 2</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
      <span class="chip" id="chip" hidden></span>
    </div>
    <h1 id="h1"></h1>
    <div class="board" id="board"></div>
    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Continue</button>
      <button class="nav ghost" id="reset" type="button" hidden>Start over</button>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>
    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:17px;color:#1C1B1B;margin:20px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf strong{color:#1C1B1B}
    .nsf .box{background:#DCE1FF;border-left:4px solid #001D69;padding:12px 16px;margin:16px 0;color:#1C1B1B}
  </style>
  <div class="nsf">
    <h2>Which Explanation Would Ray Act On</h2>
    <p>Ray Okafor is Cumberland's COO (chief operating officer). He owns the budget. Below are three explanations of the same email finding. Decide which one he would act on before you read the answer.</p>
    <h3>Explanation 1</h3>
    <p>cumberlandclaims.com publishes an SPF record ending in -all but no DMARC record at the apex, so there is no alignment enforcement on the visible From domain and spoofed messages are not rejected.</p>
    <h3>Explanation 2</h3>
    <p>Cumberland's email security could be improved. There is a risk that the email domain could be misused.</p>
    <h3>Explanation 3</h3>
    <p>Anyone can send an email that looks exactly like it came from Cumberland's finance team, and nothing stops it arriving. The 41 clinics that move money based on those emails would have no way to tell.</p>
    <div class="box">
      <p><strong>Answer: Explanation 3</strong>, because it names who gets hurt.</p>
      <p>Explanation 1 is full of jargon. If you could not follow this, neither can Ray. He can't repeat it to anyone, so he can't act on it.</p>
      <p>Explanation 2 is vague. He has heard "could be improved" before. It gives him nothing to fund.</p>
      <p>Explanation 3 is plain. He can picture the clinic that pays a forged invoice.</p>
    </div>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* Inline SVG, Phosphor style: one weight, outline, #001D69 via currentColor. */
  var IC = {
    person:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.3-3.6 4.2-5.6 7.5-5.6s6.2 2 7.5 5.6"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }

  /* ---------------- content ----------------
     Card texts, answer and reveal lines: module-07-internal.md, Build Spec
     P2-6b. Kind labels (jargon, vague, plain) are shown only after a card
     is picked, so they never give the answer away. */
  var CARDS = [
    { id:"jargon", kind:"Full of jargon", ok:false,
      txt:"cumberlandclaims.com publishes an SPF record ending in -all but no DMARC record at the apex, so there is no alignment enforcement on the visible From domain and spoofed messages are not rejected.",
      why:"If you could not follow this, neither can Ray. He can't repeat it to anyone, so he can't act on it." },
    { id:"vague", kind:"Vague", ok:false,
      txt:"Cumberland's email security could be improved. There is a risk that the email domain could be misused.",
      why:"He has heard \"could be improved\" before. It gives him nothing to fund." },
    { id:"plain", kind:"Plain", ok:true,
      txt:"Anyone can send an email that looks exactly like it came from Cumberland's finance team, and nothing stops it arriving. The 41 clinics that move money based on those emails would have no way to tell.",
      why:"He can picture the clinic that pays a forged invoice." }
  ];

  var S = [
    { id:"pick", kind:"pick", label:"Pick one", h1:"Which Explanation Would Ray Act On?" },
    { id:"why",  kind:"why",  label:"Why",      h1:"Why Ray Acts on the Plain One" }
  ];

  /* ---------------- state ---------------- */
  var KEY = "vciso-p2-m7-which-explanation-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { out:{}, solved:false }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var out = {};
      if(isPlain(raw.out)) CARDS.forEach(function(c){ if(!c.ok && raw.out[c.id]) out[c.id] = 1; });
      return { out:out, solved: raw.solved === true };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  (function validate(){
    var ok = CARDS.filter(function(c){ return c.ok; }).length;
    if(ok !== 1) throw new Error("need exactly one right card, have " + ok);
    CARDS.forEach(function(c){ if(!c.why || !c.txt) throw new Error("card " + c.id + " missing text"); });
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    reset:document.getElementById("reset"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = m; }

  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;
    el.chip.hidden = true;
    el.back.disabled = (i === 0);
    el.reset.hidden = (i !== S.length-1);
    el.next.textContent = "Continue";
    el.hint.textContent = "";
    el.next.hidden = false;
    if(i === S.length-1){
      el.next.disabled = true; el.next.hidden = true;
      el.hint.innerHTML = st.solved ? "<span>Now go back to the module and write the email finding in your workbook's <b>Findings</b> tab.</span>" : "";
    }
    else if(s.kind === "pick" && !st.solved){
      el.next.disabled = true;
      el.hint.innerHTML = "Tap or click a card to choose it.";
    } else el.next.disabled = false;
  }

  function render(){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);
    if(s.kind === "pick") renderPick();
    else renderWhy();
    header();
    say("Slide " + (i+1) + " of " + S.length + ". " + s.h1);
  }

  function rayBox(){
    return '<div class="ray">' + icon("person")
      + "<p><b>Ray Okafor</b> is Cumberland's COO (chief operating officer). He owns the budget.</p></div>";
  }

  /* Slide 1: three cards, none selected. A wrong pick shows why and stays
     crossed out; the student picks again. The right pick opens every reason. */
  function cardState(c){
    if(st.solved) return c.ok ? "ok" : "out";
    return st.out[c.id] ? "out" : "open";
  }
  function cardHTML(c, n){
    var s = cardState(c);
    var glyph = s === "ok" ? "✓" : s === "out" ? "✕" : "";
    var tag = s === "ok" ? '<span class="tag">Ray acts on it</span>'
            : s === "out" ? '<span class="tag">Not this one</span>' : "";
    var rev = s === "open"
      ? '<span class="prompt">Pick this one if you think Ray would act on it.</span>'
      : "<b>" + esc(c.kind) + ".</b> " + (c.ok ? "It names who gets hurt. " : "") + esc(c.why);
    return '<button class="ex ' + s + '" type="button" data-c="' + c.id + '"'
      + (s === "open" ? "" : " disabled") + ' aria-label="Explanation ' + (n+1) + (s === "ok" ? ", the right pick" : s === "out" ? ", not the one" : "") + '">'
      + '<span class="exh"><span class="g" aria-hidden="true">' + glyph + '</span><span class="en">Explanation ' + (n+1) + "</span>" + tag + "</span>"
      + '<span class="ext">' + esc(c.txt) + "</span>"
      + '<span class="exr">' + rev + "</span>"
      + "</button>";
  }
  function renderPick(animateIds){
    el.board.innerHTML = rayBox()
      + '<p class="lead">Three explanations of the same email finding. Pick the one Ray would act on.</p>'
      + '<div class="cards3" role="group" aria-label="Three explanations">' + CARDS.map(cardHTML).join("") + "</div>";
    if(animateIds && !reduce){
      animateIds.forEach(function(id){
        var r = el.board.querySelector('button.ex[data-c="' + id + '"] .exr');
        if(r){ r.classList.remove("in"); void r.offsetWidth; r.classList.add("in"); }
      });
    }
    Array.prototype.forEach.call(el.board.querySelectorAll("button.ex"), function(b){
      b.addEventListener("click", function(){
        var c = CARDS.filter(function(x){ return x.id === b.dataset.c; })[0];
        if(!c || st.solved || st.out[c.id]) return;
        var changed = [c.id];
        if(c.ok){
          st.solved = true;
          CARDS.forEach(function(x){ if(!x.ok && !st.out[x.id]) changed.push(x.id); });
        } else st.out[c.id] = 1;
        save(st);
        renderPick(changed);
        header();
        if(c.ok){
          say("Right. " + c.kind + ". It names who gets hurt. " + c.why + " Continue to see why the other two get ignored.");
          el.next.focus();
        } else {
          say(c.kind + ". " + c.why + " Pick again.");
          var nx = el.board.querySelector("button.ex.open");
          if(nx) nx.focus();
        }
      });
    });
  }

  /* Slide 2: all three side by side with the reason, then the one line. */
  function renderWhy(){
    if(!st.solved){
      el.board.innerHTML = '<div class="gate"><p><b>Pick the explanation first.</b> This slide shows the answer, so it waits until then.</p>'
        + '<button class="go" type="button" id="gopick">Back to the three explanations</button></div>';
      el.board.querySelector("#gopick").addEventListener("click", function(){ i = 0; render(); el.frame.focus(); });
      return;
    }
    el.board.innerHTML = '<p class="lead">Ray reads each one and asks two things: what could happen, and to whom? Only Explanation 3 answers both.</p>'
      + '<div class="rows">' + CARDS.map(function(c, n){
          return '<div class="row' + (c.ok ? " ok" : "") + '">'
            + '<span class="rk"><span class="g" aria-hidden="true">' + (c.ok ? "✓" : "✕") + "</span>" + esc(c.kind) + "</span>"
            + '<div><p class="rq">Explanation ' + (n+1) + (c.ok ? ", the one Ray acts on" : "") + '</p><p class="rw">' + esc(c.why) + "</p></div>"
            + "</div>";
        }).join("") + "</div>"
      + '<div class="statement"><p>The plain one works because it names who gets hurt.</p></div>';
  }

  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    if(d > 0 && el.next.disabled) return;
    i = n; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });
  el.reset.addEventListener("click", function(){ st = fresh(); save(st); i = 0; render(); el.frame.focus(); });

  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){ if(dx < 0) go(1); else go(-1); }
    tx = null; ty = null;
  }, {passive:true});

  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; i = n; render(); return true; },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    state:function(){ return { i:i, out:st.out, solved:st.solved }; }
  };
})();
</script>
