<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fill In the Leaver Row</title>
<!--
  vCISO P4 Step 1, Module 4: How to Describe a Process the Way an Auditor Does.
  Build spec in 06-content/project-04/step-01/module-04-internal.md (Build Note).
  Governing authority: output/programs/vciso/CLAUDE.md section 6. Look, navigation,
  scale-to-fit and phone layout match vciso-p2-m12-day-8-why-is-it-still-spreading.html
  and vciso-p2-m11-is-cumberland-actually-affected.html.

  Sources, word for word:
  - Column headers, the joiner row, the leaver Understanding cell and the model
    leaver row: P4 Sample Pack/Interactive content sets - P4.md, P4-4. The model
    Evidence cell's dash is restructured as a comma, per the build spec.
  - Behind the model row (not shown as text): SME drop 2026-09-25/Environment
    Record.md, "Leaver revocation" row; P3 policy section 5.

  No single right answer: the three leaver cells are free text and never marked.
  So there is no red and no green on screen. The student's row is labelled in
  navy, "Your row". The model row sits beside it.
  Per-scope data: none (build spec). The leaver process is company-wide.
  Closing panel: none (build spec). The columns are not defined here and claim 8
  is not named; the module prose does that after the interactive.
  Plain-words lines under "(claimed)", "disabled" and "which does not exist" are
  definitions only, no new facts ("which does not exist" restates Environment
  Record line 295, "No record that this happens"). Text the student types is saved on this device only.
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-reveal:520ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto;background:var(--bg)}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:6px;min-height:24px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:6px}
  .lead{flex:0 0 auto;font-size:15.5px;line-height:1.45;color:var(--body);margin-bottom:12px;max-width:860px}
  .lead b{color:var(--title);font-weight:600}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- the table (both slides) ---- */
  .tbl{flex:0 1 auto;min-height:0;display:grid;grid-template-columns:118px 1fr 1fr 1fr 1.12fr;
    border:1.5px solid var(--on-highlight);border-radius:12px;overflow:hidden;background:var(--bg)}
  .tbl > .tr{display:contents}
  .tbl > .tr > div{padding:9px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
  .tbl > .tr > div.endc{border-right:0}
  .tbl > .tr > div.endr{border-bottom:0}
  .hd{background:var(--highlight);font-size:14px;font-weight:700;line-height:1.25;color:var(--on-highlight);
    display:flex;align-items:center}
  .rl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--tint)}
  .rl .ri{width:32px;height:32px;border-radius:9px;background:var(--highlight);border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center}
  .rl .ri svg.ic{width:19px;height:19px}
  .rl .rt{display:flex;flex-direction:column;gap:3px}
  .rl .rn{font-size:15px;font-weight:700;color:var(--title);line-height:1.2}
  .rl .rs{font-size:12.5px;line-height:1.3;color:var(--body)}
  .c{font-size:14.5px;line-height:1.4;color:var(--title)}
  .c .cl{display:none}
  .c.given{color:var(--title)}

  /* writing cells */
  .w{display:flex;flex-direction:column;gap:5px;background:var(--bg)}
  .w textarea{font-family:inherit;font-size:14.5px;line-height:1.4;color:var(--title);background:var(--bg);
    border:1.5px solid var(--on-highlight);border-radius:8px;padding:7px 9px;resize:none;width:100%;
    height:100px;transition:border-color var(--t-fast) var(--ease-out),box-shadow var(--t-fast) var(--ease-out)}
  .w textarea::placeholder{color:var(--body);opacity:.85}
  .w textarea:focus{outline:none;box-shadow:0 0 0 3px var(--highlight);border-width:2px}
  .w .st{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--body);min-height:16px}
  .w .st svg.ic{width:14px;height:14px;color:var(--on-highlight);stroke-width:2.4}
  .w.done .st{color:var(--on-highlight)}

  .tip{flex:0 0 auto;display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:14px;line-height:1.4;color:var(--body)}
  .tip svg.ic{width:18px;height:18px;color:var(--on-highlight);flex:0 0 auto;margin-top:1px}
  .tip b{color:var(--title);font-weight:600}

  /* ---- slide 2: compare ---- */
  /* The compare table is tighter than the writing table: the model row carries
     plain-words lines, so the Evidence column is wider and long answers show
     three lines before they scroll. */
  .tbl.cmp{grid-template-columns:100px .78fr 1fr 1fr 1.48fr;grid-template-rows:auto auto auto}
  .tbl.cmp > .tr > div{padding:7px 10px}
  .tbl.cmp .rl{gap:3px}
  .tbl.cmp .rl .ri{width:26px;height:26px;border-radius:8px}
  .tbl.cmp .rl .ri svg.ic{width:16px;height:16px}
  .tbl.cmp .rl .rs{font-size:12px}
  .tbl.cmp .und{grid-row:2 / span 2;grid-column:2;display:flex;flex-direction:column;gap:5px}
  .tbl.cmp .und .gv{font-size:12.5px;font-weight:600;color:var(--body)}
  .yr{background:var(--bg)}
  .yr .tx{max-height:61px;overflow-y:auto;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .rl.you{background:var(--bg)}
  .rl.mod{background:var(--highlight)}
  .yr .tx:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  .yr .more{display:block;margin-top:4px;font-size:12px;font-weight:600;color:var(--on-highlight)}
  .tag{display:inline-flex;align-items:center;gap:5px;background:var(--on-highlight);color:var(--bg);
    font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px 2px 7px;white-space:nowrap}
  .tag svg.ic{width:13px;height:13px;stroke-width:2.2}
  .md{background:var(--highlight)}
  .md .tx b{color:var(--on-highlight);font-weight:800}
  .md .pl{margin-top:5px;padding-top:4px;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.32;color:var(--body)}
  .md .pl b{color:var(--title);font-weight:600}
  .reveal{animation:rin var(--t-reveal) var(--ease-over) both}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* ---- bar ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:10px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:56px;overflow-y:auto;font-size:13.5px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}
  .bar.ask #hint{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- phone ---- */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .board{flex:0 0 auto}
    .tbl,.tbl.cmp{display:block;border:0;border-radius:0;overflow:visible;background:transparent}
    .tbl > .tr > div{border:0;padding:0}
    .tbl .hd{display:none}
    .tbl .rl{flex-direction:row;align-items:center;gap:10px;background:transparent;margin:18px 0 8px}
    .tbl .rl.first{margin-top:4px}
    .tbl .rl .rn{font-size:17px}
    .tbl .rl .rs{font-size:14px}
    .tbl .rl .rt{display:flex;flex-direction:column;gap:2px}
    .c{display:block;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px!important;
      margin-bottom:8px;font-size:16px}
    .c .cl{display:block;font-size:13px;font-weight:700;color:var(--on-highlight);margin-bottom:3px}
    .tbl > .tr > div.c{border:1.5px solid var(--line)}
    .tbl > .tr > div.w{border:0;padding:0 0 4px!important;background:transparent}
    .w textarea{font-size:16px;height:auto;min-height:104px}
    .w .st{font-size:13.5px}
    .tbl.cmp .und{display:block}
    .yr .tx{max-height:none;overflow:visible}
    .tbl > .tr > div.yr{border:2px solid var(--on-highlight)}
    .tbl > .tr > div.md{background:var(--highlight);border:1.5px solid var(--on-highlight)}
    .tbl.cmp .und{background:var(--tint)}
    .tbl.cmp .und .gv{display:block;margin-bottom:2px}
    .pc{margin-top:18px}
    .pc:first-child{margin-top:4px}
    .pc h2{font-size:17px;font-weight:700;color:var(--on-highlight);margin-bottom:8px}
    .pc .c .cl{display:flex;align-items:center;gap:6px}
    .pc .c .cl .tag{font-size:12.5px}
    .pc .c.yr{border:2px solid var(--on-highlight)}
    .pc .c.md{border:1.5px solid var(--on-highlight);background:var(--highlight)}
    .pc .c.und{background:var(--tint)}
    .md .pl{font-size:14px}
    .tip{font-size:15px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Fill In the Leaver Row">

    <div class="top">
      <span class="prog" id="prog">1 of 2</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
    </div>

    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>

    <div class="board" id="board"></div>

    <div class="bar" id="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Show the model row</button>
      <div id="hint"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:18px;color:#1C1B1B;margin:22px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:8px}
    .nsf strong{color:#1C1B1B}
    .nsf .box{background:#DCE1FF;border-left:4px solid #001D69;padding:12px 16px;margin:14px 0;color:#1C1B1B}
    .nsf .box b{color:#001D69}
    .nsf details{margin:14px 0}
    .nsf summary{cursor:pointer;font-weight:600;color:#001D69}
    .nsf details .box{margin-top:10px}
  </style>
  <div class="nsf">
    <h2>Fill In the Leaver Row</h2>
    <p>This page needs JavaScript to let you type into the table. You can still do the task on paper or in a note.</p>
    <h3>Row one: the joiner (done for you)</h3>
    <ul>
      <li><strong>Understanding:</strong> IT sets up accounts and access when someone starts</li>
      <li><strong>Risk:</strong> A new hire can't work, or is given more access than the role needs</li>
      <li><strong>Control:</strong> Access is provisioned to a role profile on the start date</li>
      <li><strong>Evidence you'd ask to see:</strong> A dated account-creation record tied to the role</li>
    </ul>
    <h3>Row two: the leaver (your turn)</h3>
    <ul>
      <li><strong>Understanding:</strong> When someone leaves, IT is meant to remove their access</li>
    </ul>
    <p>Write your own Risk, Control and Evidence you'd ask to see for the leaver. There is no single right answer. Write all three before you read on.</p>
    <h3>The model row</h3>
    <details>
    <summary>Show the model row (write yours first)</summary>
    <div class="box">
      <p><strong>Risk:</strong> A former employee keeps access to patient systems</p>
      <p><strong>Control:</strong> Access is removed on the leaving date (claimed)</p>
      <p><strong>Evidence you'd ask to see:</strong> A dated record showing the account was disabled the day they left, <b>which does not exist</b></p>
      <p>Claimed means the company says this happens. Saying it is not the same as showing it. Disabled means switched off, so nobody can log in with it. Which does not exist means Cumberland keeps no record like this. You could ask for it, but there would be nothing to hand over.</p>
    </div>
    </details>
    <p>Your row is not marked right or wrong. When you have compared your row with the model row, carry on reading the module page. It asks you about your Control cell next.</p>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ---------------- icons ----------------
     Inline SVG drawn to the Phosphor outline style: one weight, uniform size,
     #001D69 through currentColor. No icon font, no network request. */
  var IC = {
    userplus:'<circle cx="10" cy="8.5" r="4"/><path d="M3 19.5c1.3-3.2 4-5 7-5s5.7 1.8 7 5"/><path d="M18.5 7v6M15.5 10h6"/>',
    userminus:'<circle cx="10" cy="8.5" r="4"/><path d="M3 19.5c1.3-3.2 4-5 7-5s5.7 1.8 7 5"/><path d="M15.5 10h6"/>',
    pencil:'<path d="M4 20h4.2L19 9.2a2.1 2.1 0 0 0 0-3L17.8 5a2.1 2.1 0 0 0-3 0L4 15.8z"/><path d="m13.5 6.5 4 4"/>',
    seal:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m8.8 13 2.2 2.2 4.2-4.4"/>',
    check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    dot:'<circle cx="12" cy="12" r="5"/>',
    info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2M12 7.8v.2"/>',
    eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }

  /* ---------------- content ----------------
     P4-4, word for word. Do not change. */
  var COLS = ["Understanding", "Risk", "Control", "Evidence you'd ask to see"];
  var JOINER = [
    "IT sets up accounts and access when someone starts",
    "A new hire can't work, or is given more access than the role needs",
    "Access is provisioned to a role profile on the start date",
    "A dated account-creation record tied to the role"
  ];
  var LEAVER_UND = "When someone leaves, IT is meant to remove their access";
  /* The model leaver row (P4-4). The dash before "which does not exist" is
     restructured as a comma, per the build spec. */
  var MODEL = {
    risk:"A former employee keeps access to patient systems",
    control:'Access is removed on the leaving date (claimed)',
    evidence:'A dated record showing the account was disabled the day they left, <b>which does not exist</b>'
  };
  /* Plain-words lines: definitions only, no new facts. */
  var PLAIN = {
    control:"<b>Claimed</b> means the company says this happens. Saying it is not the same as showing it.",
    evidence:"<b>Disabled</b> means switched off, so nobody can log in with it. <b>Which does not exist</b> means Cumberland keeps no record like this. You could ask for it, but there would be nothing to hand over."
  };
  var CELLS = [
    { id:"risk", col:1, ph:"Write the risk here" },
    { id:"control", col:2, ph:"Write the control here" },
    { id:"evidence", col:3, ph:"Write what you'd ask to see here" }
  ];
  var MAXLEN = 600;

  var S = [
    { id:"write", label:"Your turn", h1:"Fill In the Leaver Row",
      lead:"Write the three empty cells in the leaver row, in your own words. <b>There is no single right answer here.</b> When all three have something in them, you can compare your row with the one an auditor would write." },
    { id:"compare", label:"Compare", h1:"Your Row Next to the Model Row",
      lead:"Here is what you wrote, next to the row an auditor would write. Your row is not marked right or wrong. Read the two rows one column at a time and spot where yours is different." }
  ];

  /* ---------------- state ---------------- */
  var KEY = "vciso-p4-m4-leaver-row-v1";
  function fresh(){ return { risk:"", control:"", evidence:"", seen:false }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!raw || typeof raw !== "object" || Array.isArray(raw)) return fresh();
      var o = fresh();
      CELLS.forEach(function(c){ if(typeof raw[c.id] === "string") o[c.id] = raw[c.id].slice(0, MAXLEN); });
      o.seen = raw.seen === true && filled(o) === 3;
      return o;
    }catch(e){ return fresh(); }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
  function filled(o){ var n = 0; CELLS.forEach(function(c){ if(String(o[c.id] || "").trim()) n++; }); return n; }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), h1:document.getElementById("h1"),
    lead:document.getElementById("lead"), board:document.getElementById("board"),
    bar:document.getElementById("bar"), back:document.getElementById("back"),
    next:document.getElementById("next"), hint:document.getElementById("hint"),
    live:document.getElementById("live")
  };
  var i = 0;
  var confirming = false;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function say(m){ el.live.textContent = m; }
  function phone(){ return window.matchMedia("(max-width:599px)").matches; }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + " · " + s.label;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;
    el.bar.classList.remove("ask");
    el.back.textContent = "Back";
    el.next.classList.remove("ghost");

    if(s.id === "write"){
      el.back.disabled = true;
      el.next.textContent = "Show the model row";
      var n = filled(st);
      el.next.disabled = n < 3;
      el.hint.innerHTML = n < 3
        ? "<span>You have filled <b>" + n + " of 3</b> cells. Fill in all three to see the model row, the one an auditor would write.</span>"
        : "<span>All three cells are filled in. You can still change them before you look.</span>";
    } else {
      el.back.disabled = false;
      if(confirming){
        el.bar.classList.add("ask");
        el.back.textContent = "No, keep my row";
        el.next.textContent = "Yes, start over";
        el.hint.textContent = "This clears the three cells you wrote. Do you want to start over?";
      } else {
        el.next.textContent = "Start over";
        el.next.classList.add("ghost");
        el.next.disabled = false;
        el.hint.innerHTML = "<span>When you have compared the two rows, <b>carry on reading the module page</b>. It asks you about your Control cell next. Back lets you change your row.</span>";
      }
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    el.h1.textContent = s.h1;
    el.lead.innerHTML = s.lead;
    el.frame.setAttribute("aria-label", s.h1);
    if(s.id === "write") renderWrite(); else renderCompare();
    header();
  }

  var TR = '<div class="tr" role="row">';
  function hd(t, end){ return '<div class="hd' + (end ? " endc" : "") + '" role="columnheader">' + esc(t) + "</div>"; }
  function rowLabel(ic, name, sub, cls, endr){
    return '<div class="rl' + (cls ? " " + cls : "") + (endr ? " endr" : "") + '" role="rowheader"><span class="ri">' + icon(ic) + '</span>'
      + '<span class="rt"><span class="rn">' + name + '</span><span class="rs">' + sub + "</span></span></div>";
  }
  function cell(colIdx, html, cls, endr){
    return '<div class="c' + (cls ? " " + cls : "") + (colIdx === 3 ? " endc" : "") + (endr ? " endr" : "") + '" role="cell">'
      + '<span class="cl">' + esc(COLS[colIdx]) + "</span>" + html + "</div>";
  }

  /* Slide 1: the joiner row given, the leaver row to write. Nothing typed on arrival. */
  function renderWrite(){
    var h = '<div class="tbl" role="table" aria-label="Joiner and leaver rows">'
      + TR + '<div class="hd" role="columnheader"><span class="sr">Row</span></div>'
      + COLS.map(function(t, k){ return hd(t, k === 3); }).join("") + "</div>"
      + TR + rowLabel("userplus", "Joiner", "Done for you", "first")
      + JOINER.map(function(t, k){ return cell(k, esc(t), "given"); }).join("") + "</div>"
      + TR + rowLabel("userminus", "Leaver", "Your turn", "", true)
      + cell(0, esc(LEAVER_UND), "given", true)
      + CELLS.map(function(c){
          var v = st[c.id];
          var done = !!v.trim();
          return '<div class="c w' + (done ? " done" : "") + (c.col === 3 ? " endc" : "") + ' endr" role="cell" data-c="' + c.id + '">'
            + '<label class="cl" for="t-' + c.id + '">' + esc(COLS[c.col]) + "</label>"
            + '<textarea id="t-' + c.id + '" maxlength="' + MAXLEN + '" placeholder="' + esc(c.ph) + '"'
            + ' aria-label="Leaver, ' + esc(COLS[c.col]) + '" spellcheck="true">' + esc(v) + "</textarea>"
            + '<span class="st" aria-hidden="true">' + stLine(done) + "</span>"
            + "</div>";
        }).join("") + "</div>"
      + "</div>"
      + '<p class="tip">' + icon("info") + "<span><b>Stuck on a cell?</b> Look at what the joiner row says in the same column, then write the leaver's version.</span></p>";
    el.board.innerHTML = h;

    CELLS.forEach(function(c){
      var ta = document.getElementById("t-" + c.id);
      ta.addEventListener("input", function(){
        var before = filled(st);
        st[c.id] = ta.value.slice(0, MAXLEN);
        if(filled(st) < 3) st.seen = false;
        save();
        var wrap = ta.parentNode, done = !!st[c.id].trim();
        wrap.classList.toggle("done", done);
        wrap.querySelector(".st").innerHTML = stLine(done);
        header();
        var after = filled(st);
        if(after !== before) say(after === 3 ? "All three cells are filled in. Show the model row is ready." : "You have filled " + after + " of 3 cells.");
      });
    });
  }
  function stLine(done){ return done ? icon("check") + "Filled in" : ""; }

  /* Slide 2: the student's three cells beside the model row.
     On a phone the table cannot sit side by side, so each column is shown as
     a pair: your cell, then the model cell, one column at a time. */
  function renderCompare(){
    st.seen = true; save();
    if(phone()){ renderComparePhone(); return; }
    var h = '<div class="tbl cmp" role="table" aria-label="Your leaver row next to the model row">'
      + TR + '<div class="hd" role="columnheader"><span class="sr">Row</span></div>'
      + COLS.map(function(t, k){ return hd(t, k === 3); }).join("") + "</div>"
      + TR + rowLabel("pencil", '<span class="tag">Your row</span>', "What you wrote", "you first")
      + '<div class="c und given endr" role="cell"><span class="cl">' + esc(COLS[0]) + "</span>"
      +   '<span class="gv">Leaver, given to you</span>' + esc(LEAVER_UND) + "</div>"
      + CELLS.map(function(c){
          return cell(c.col, '<div class="tx">' + esc(st[c.id].trim() || "(empty)") + "</div>", "yr");
        }).join("") + "</div>"
      + TR + rowLabel("seal", "Model row", "What an auditor would write", "mod", true)
      + CELLS.map(function(c){
          return cell(c.col, '<div class="tx">' + MODEL[c.id] + "</div>"
            + (PLAIN[c.id] ? '<p class="pl">' + PLAIN[c.id] + "</p>" : ""), "md reveal", true);
        }).join("") + "</div>"
      + "</div>";
    el.board.innerHTML = h;
    /* A long answer scrolls inside its cell on the 960x540 canvas: say so. */
    if(!phone()) Array.prototype.forEach.call(el.board.querySelectorAll(".yr .tx"), function(t){
      if(t.scrollHeight > t.clientHeight + 1){
        var m = document.createElement("span"); m.className = "more"; m.textContent = "Scroll this cell to read it all";
        /* Let keyboard users in every browser reach and scroll the long cell. */
        var colName = t.parentNode.querySelector(".cl").textContent;
        t.tabIndex = 0;
        t.setAttribute("role", "region");
        t.setAttribute("aria-label", "Your " + colName + ", scroll to read");
        t.parentNode.appendChild(m);
      }
    });
  }

  function renderComparePhone(){
    var h = '<div class="pc"><h2>' + esc(COLS[0]) + '</h2>'
      + '<div class="c und given"><span class="cl">Leaver, given to you</span>' + esc(LEAVER_UND) + "</div></div>"
      + CELLS.map(function(c){
          return '<div class="pc"><h2>' + esc(COLS[c.col]) + "</h2>"
            + '<div class="c yr"><span class="cl"><span class="tag">Your row</span>What you wrote</span>'
            +   '<div class="tx">' + esc(st[c.id].trim() || "(empty)") + "</div></div>"
            + '<div class="c md reveal"><span class="cl">' + icon("seal").replace('class="ic"', 'class="ic" style="width:16px;height:16px"') + "Model row: what an auditor would write</span>"
            +   '<div class="tx">' + MODEL[c.id] + "</div>"
            +   (PLAIN[c.id] ? '<p class="pl">' + PLAIN[c.id] + "</p>" : "") + "</div></div>";
        }).join("");
    el.board.innerHTML = '<div class="tbl cmp">' + h + "</div>";
  }

  /* ---------------- navigation ---------------- */
  function go(n){
    if(n < 0 || n >= S.length) return;
    if(n === 1 && filled(st) < 3) return;
    confirming = false;
    i = n; render();
    if(phone()) window.scrollTo(0,0);
    el.frame.focus({preventScroll:true});
    say("Slide " + (i+1) + " of " + S.length + ". " + S[i].h1 + ".");
  }
  el.back.addEventListener("click", function(){
    if(confirming){ confirming = false; header(); el.next.focus(); say("Your row is kept."); return; }
    go(i - 1);
  });
  el.next.addEventListener("click", function(){
    if(i === 0){ go(1); return; }
    if(!confirming){ confirming = true; header(); el.next.focus(); say(el.hint.textContent); return; }
    st = fresh(); save(); confirming = false; i = 0; render();
    if(phone()) window.scrollTo(0,0);
    var t = document.getElementById("t-risk");
    if(t) t.focus({preventScroll:true});
    say("Started over. Slide 1 of " + S.length + ". The three cells are empty.");
  });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }
  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ if(i === 0 && !el.next.disabled){ e.preventDefault(); go(1); } }
    else if(e.key === "ArrowLeft"){ if(i > 0 && !confirming){ e.preventDefault(); go(i - 1); } }
  });

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  var wasPhone = phone();
  window.addEventListener("resize", function(){
    fit();
    /* Re-draw the compare screen when crossing the phone breakpoint. */
    if(phone() !== wasPhone){ wasPhone = phone(); if(i === 1) renderCompare(); }
  });

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){ if(n === 1 && filled(st) < 3) return false; go(n); return true; },
    slides:S.length,
    reset:function(){ st = fresh(); save(); confirming = false; i = 0; render(); },
    state:function(){ return { i:i, risk:st.risk, control:st.control, evidence:st.evidence, seen:st.seen, confirming:confirming }; }
  };
})();
</script>
</body>
</html>
