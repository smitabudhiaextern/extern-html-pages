<!--
  vCISO P4 Step 2, Module 9: Reading an Incident Report Critically.
  Build spec in 06-content/project-04/step-02/module-09-internal.md, "Build Note".
  Governing authority: output/programs/vciso/CLAUDE.md section 6. Look, navigation,
  scale-to-fit and phone layout match vciso-p2-m12-day-8-why-is-it-still-spreading.html.

  Sources for every fact:
  - The report text, header and five sections: P2 Sample Pack/Shared/Incident report -
    antivirus outage.md, THE STUDENT-FACING DOCUMENT, with the 25 Sep title (colon, not a dash).
  - The checklist and its order: P4 Sample Pack/Interactive content sets - P4.md, P4-8.
  - "What the report does" and "what actually happened": the answer key in the incident
    file, as edited in the build spec (the script "run on day 1", no subject, DN19; the
    "why it spread" row folded out; dashes replaced).
  - Dates and counts: LOCKED CANONICAL FACTS in the incident file.
  - Contributing factors, "the reason one script reached most of the machines": answer key.

  Judgement calls (owner can reverse):
  - No separate header slide. The module already says what the interactive does, so the
    note's header sits on top of every section slide and the build opens on section 1.
  - No closing "three things to look for" panel. The module's next section, "What to Look
    For in Any Report", says the same three things straight after the interactive.
  - Marks lock once the checklist is shown, so the reveal stays a true before and after.
    Start over at the end clears them.
  - The reveal is one overview slide (the seven items, with the student's marks) and one
    slide per item, instead of one dense table.
  - Which section each item belongs to is ours: timeline and how long before anyone
    noticed go with "What happened"; root cause and contributing factors with "Cause";
    what worked and what didn't with "Resolution". Ask Chaitanya to review.
  - "What worked and what didn't": wording is ours, from the build spec, for approval.
    Ask Chaitanya to review.
  - Marks are shown in navy ("You marked" plus the section name), never green or red: a mark says which
    section the student flagged, not whether their note found the right gap.
  - Plain-words lines (component, contained, unprotected, change testing, staged rollout,
    monitoring, workstation, script, Windows Update, compatibility) are definitions only.
    No new facts. Script and Windows Update reuse the P2 wording.
  Green and red are not used: there is no right or wrong pick in this build.
  Nate is named only as the report's author, never as who ran the script.
-->

  <div class="nsf">
    <h2>What Does the Report Leave Out?</h2>
    <p>This page needs JavaScript to let you mark the report. You can still do it on paper. Read each section below, and write down every place that you think it leaves out something you know happened. Only then read the checklist underneath.</p>
    <div class="box">
      <p><strong>CUMBERLAND CLAIMS SERVICES: IT INCIDENT NOTE</strong><br>Prepared by: N. Brody<br>Date: 17 February 2025<br>System(s): Staff workstations</p>
      <p><strong>What happened</strong><br>A Windows Update compatibility issue affected a number of staff workstations in February. A script was run on 3 February to correct an update problem. Some machines later showed antivirus warnings. The issue was resolved on 14 February and all machines are now protected.</p>
      <p><strong>Cause</strong><br>A Windows Update compatibility problem.</p>
      <p><strong>Impact</strong><br>A number of workstations were temporarily affected. No data was lost. No patient information was accessed.</p>
      <p><strong>Resolution</strong><br>The affected machines were corrected and antivirus was confirmed working.</p>
      <p><strong>Lessons learned</strong><br>Update procedures to be reviewed at a later date.</p>
    </div>
    <h3>What a complete report holds</h3>
    <p>A complete incident report holds these seven things. This report leaves out or gets wrong every one of them.</p>
    <ul>
      <li><strong>Timeline.</strong><span>The report says: 3 February, then 14 February, with nothing in between. What actually happened: 3 machines by 5 February, 10 by 7 February, 40 by 10 February, and about 70 by 13 February. The damage spread for over a week.</span></li>
      <li><strong>Root cause.</strong><span>The report says: "A Windows Update compatibility problem." That is a symptom. What actually happened: the script run on day 1 disabled a component the antivirus depended on.</span></li>
      <li><strong>Contributing factors.</strong><span>The report has no section for these. What actually happened: no change testing, no staged rollout, and no monitoring of antivirus health.</span></li>
      <li><strong>How long before anyone noticed.</strong><span>The report does not mention it. What actually happened: nobody noticed for two days, and the outage was not contained until 14 February, day 12 if you count 3 February as day 1.</span></li>
      <li><strong>Impact.</strong><span>The report says: "A number of workstations." What actually happened: about 70 machines (60 to 80, depending on how shared machines are counted), each unprotected for about six days. No data confirmed lost.</span></li>
      <li><strong>What worked and what didn't.</strong><span>The report says the machines "were corrected", but not what found the problem, what fixed it, or what failed along the way.</span></li>
      <li><strong>Lessons learned.</strong><span>The report says: "Update procedures to be reviewed at a later date." Nobody owns it, there is no date, and nothing changes. It is "lessons learned: none", in disguise.</span></li>
    </ul>
    <p>Now go back to the module.</p>
  </div>

    calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="1.8"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>',
    target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
    stack:'<path d="m12 3.5 8.5 4.5-8.5 4.5-8.5-4.5z"/><path d="m3.5 12 8.5 4.5 8.5-4.5"/><path d="m3.5 16 8.5 4.5 8.5-4.5"/>',
    eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
    monitor:'<rect x="3" y="4.5" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16.5V20"/>',
    wrench:'<path d="M14.7 6.3a4.5 4.5 0 0 0-5.9 5.9L3.5 17.5 6.5 20.5l5.3-5.3a4.5 4.5 0 0 0 5.9-5.9L15 12l-3-3z"/>',
    bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
    check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2M12 7.8v.2"/>',
    lock:'<rect x="5" y="10.5" width="14" height="10" rx="1.8"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/>',
    dash:'<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12h7"/>',
    clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'
  };
  function icon(k){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + IC[k] + "</svg>"; }

  /* ---------------- content ----------------
     Report text: verbatim from the incident note (25 Sep title). "gloss" is a
     plain definition of the section name, no hint at what is missing. */
  var HEAD = {
    title:"CUMBERLAND CLAIMS SERVICES: IT INCIDENT NOTE",
    by:"N. Brody", date:"17 February 2025", sys:"Staff workstations"
  };
  var SECS = [
    { id:"what", name:"What happened",
      gloss:"This section tells the story of the incident.",
      text:"A Windows Update compatibility issue affected a number of staff workstations in February. A script was run on 3 February to correct an update problem. Some machines later showed antivirus warnings. The issue was resolved on 14 February and all machines are now protected.",
      words:"A workstation is a staff member's computer. A script is a short list of instructions that a computer carries out in one go. Windows Update installs Microsoft's fixes on Windows computers. A compatibility issue is when two pieces of software do not work well together." },
    { id:"cause", name:"Cause",
      gloss:"This section says what started the problem.",
      text:"A Windows Update compatibility problem.",
      words:"A compatibility problem is when two pieces of software do not work well together." },
    { id:"impact", name:"Impact",
      gloss:"This section says how much harm the problem did.",
      text:"A number of workstations were temporarily affected. No data was lost. No patient information was accessed." },
    { id:"res", name:"Resolution",
      gloss:"This section says how the problem was fixed.",
      text:"The affected machines were corrected and antivirus was confirmed working." },
    { id:"lessons", name:"Lessons learned",
      gloss:"This section says what the company will change because of the incident.",
      text:"Update procedures to be reviewed at a later date." }
  ];

  /* The checklist, in P4-8's order. Rows from the answer key as edited in the
     build spec. "sec" (which section should hold it) is our call, for review. */
  var ITEMS = [
    { id:"timeline", ic:"calendar", name:"Timeline", sec:"what",
      gloss:"What happened on each day, in order.",
      kind:"timeline" },
    { id:"root", ic:"target", name:"Root cause", sec:"cause",
      gloss:"The first thing that went wrong, which set off everything after it.",
      rep:{ q:"“A Windows Update compatibility problem.”", p:["That is a symptom: something you could see going wrong, not what started it."] },
      act:{ p:["The script run on day 1, 3 February, disabled a component the antivirus depended on."],
            gl:"A component is one part of a piece of software. The antivirus needed this part in order to work." },
      miss:"This is the easiest one to miss, because the report sounds so sure of its cause." },
    { id:"factors", ic:"stack", name:"Contributing factors", sec:"cause",
      gloss:"What let the problem spread or last longer.",
      rep:{ p:["The report has no section for these.", "You did not meet these three in Project 2. A complete report would have told you about them."] }, dense:true,
      act:{ list:[
              ["No change testing", "Nobody tried the change on a test machine before using it on real ones."],
              ["No staged rollout", "The change was not sent to a few machines first, then the rest."],
              ["No monitoring of antivirus health", "Nobody was regularly checking that the antivirus on every machine was working."]
            ],
            p:["Together, they are why one script could reach most of the machines."] } },
    { id:"noticed", ic:"eye", name:"How long before anyone noticed", sec:"what",
      gloss:"How much time passed before someone saw something was wrong.",
      rep:{ p:["The report does not mention this."] },
      act:{ p:["Nobody noticed for two days, and the outage was not contained until 14 February, day 12 if you count 3 February as day 1."],
            gl:"Contained means the last machines got their antivirus back." } },
    { id:"impact", ic:"monitor", name:"Impact", sec:"impact",
      gloss:"How much harm was done: how many machines, and for how long.",
      rep:{ q:"“A number of workstations were temporarily affected.”" },
      act:{ p:["About 70 machines (60 to 80, depending on how shared machines are counted), each unprotected for about six days.", "No data confirmed lost."],
            gl:"Unprotected means the machine had no working antivirus." } },
    { id:"worked", ic:"wrench", name:"What worked and what didn't", sec:"res",
      gloss:"Which steps helped, and which failed, while the problem was being fixed.",
      rep:{ q:"“The affected machines were corrected and antivirus was confirmed working.”", p:["It says the machines “were corrected”, but not how."] },
      actTitle:"What it leaves out",
      act:{ p:["What found the problem, what fixed it, and what failed along the way."] } },
    { id:"lessons", ic:"bulb", name:"Lessons learned", sec:"lessons",
      gloss:"What the company will change because of the incident.",
      rep:{ q:"“Update procedures to be reviewed at a later date.”" },
      actTitle:"What it really says",
      act:{ p:["Nobody owns it, there is no date, and nothing changes.", "It is “lessons learned: none”, in disguise."],
            gl:"In disguise means it looks like a lesson, but nothing will change because of it." } }
  ];
  /* Timeline points: LOCKED CANONICAL FACTS. Day 1 is 3 February. */
  var TL_ACT = [
    { d:3,  b:"3 Feb",  s:"Script run" },
    { d:5,  b:"5 Feb",  s:"3 machines" },
    { d:7,  b:"7 Feb",  s:"10 machines" },
    { d:10, b:"10 Feb", s:"40 machines" },
    { d:13, b:"13 Feb", s:"About 70" },
    { d:14, b:"14 Feb", s:"Contained" }
  ];

  /* ---------------- slides ---------------- */
  var S = [];
  SECS.forEach(function(s, n){ S.push({ kind:"mark", sec:s.id, n:n }); });
  S.push({ kind:"overview" });
  ITEMS.forEach(function(it, n){ S.push({ kind:"item", item:it.id, n:n }); });
  var FIRST_REVEAL = SECS.length;

  /* ---------------- state ----------------
     marks: section id -> true. notes: section id -> text. revealed: the
     checklist has been shown, so the marks are locked in. */
  var KEY = "vciso-p4-m9-leave-out-v1";
  var MAXNOTE = 300;
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function secIds(){ return SECS.map(function(s){ return s.id; }); }
  function fresh(){ return { marks:{}, notes:{}, revealed:false }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var o = fresh();
      secIds().forEach(function(k){
        if(isPlain(raw.marks) && raw.marks[k] === true) o.marks[k] = true;
        if(isPlain(raw.notes) && typeof raw.notes[k] === "string") o.notes[k] = raw.notes[k].slice(0, MAXNOTE);
      });
      o.revealed = raw.revealed === true;
      return o;
    }catch(e){ return fresh(); }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), sub:document.getElementById("sub"),
    board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    cancel:document.getElementById("cancel"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = st.revealed ? FIRST_REVEAL : 0;
  var confirming = false;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function say(m){ el.live.textContent = m; }
  function phone(){ return window.matchMedia("(max-width:599px)").matches; }
  function sec(id){ var r = null; SECS.forEach(function(s){ if(s.id === id) r = s; }); return r; }
  function item(id){ var r = null; ITEMS.forEach(function(s){ if(s.id === id) r = s; }); return r; }
  function nMarked(){ return secIds().filter(function(k){ return st.marks[k]; }).length; }
  function noteOf(id){ return (st.notes[id] || "").trim(); }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    if(s.kind === "mark") el.prog.textContent = "Section " + (s.n+1) + " of " + SECS.length;
    else if(s.kind === "overview") el.prog.textContent = "The checklist";
    else el.prog.textContent = "Checklist item " + (s.n+1) + " of " + ITEMS.length;
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;
    el.chip.hidden = false;
    el.chip.innerHTML = icon("file") + "Report dated " + esc(HEAD.date);

    el.back.disabled = (i === 0);
    el.cancel.hidden = true;
    el.next.disabled = false;
    el.next.textContent = "Next";
    var m = nMarked();
    var marks = "You have marked " + m + " of " + SECS.length + " sections.";
    if(s.kind === "mark"){
      if(st.revealed){ el.next.textContent = "Next"; el.hint.textContent = "Your marks are locked in. You can still read them here."; }
      else if(i === FIRST_REVEAL - 1){
        el.next.textContent = "Show the checklist";
        el.hint.innerHTML = esc(marks) + " <b>Once you show the checklist, your marks are locked in.</b>";
      } else el.hint.textContent = marks + " You can leave a section unmarked.";
    } else if(s.kind === "overview"){
      el.hint.textContent = "Next to each thing, you can see whether you marked the section where it belongs. Next, we go through the seven things one at a time.";
    } else if(i === S.length - 1){
      if(confirming){
        el.next.textContent = "Yes, start over";
        el.cancel.hidden = false;
        el.hint.innerHTML = "<b>Start over clears your marks and notes.</b> Are you sure?";
      } else {
        el.next.textContent = "Start over";
        el.hint.innerHTML = "<b>That is the end. Now go back to the module.</b> Start over clears your marks and notes.";
      }
    } else el.hint.textContent = "";
  }

  /* ---------------- render ---------------- */
  function render(){
    document.documentElement.classList.add("fresh");
    confirming = false;
    var s = S[i];
    if(s.kind === "mark") renderMark(s);
    else if(s.kind === "overview") renderOverview();
    else renderItem(s);
    el.frame.setAttribute("aria-label", el.h1.textContent);
    header();
    say(el.prog.textContent + ". " + el.h1.textContent);
  }

  function setTitle(h, sub){ el.h1.textContent = h; el.sub.textContent = sub || ""; }

  /* Marking slides: one section of the report, a mark and a note. */
  function renderMark(s){
    var x = sec(s.sec);
    var on = !!st.marks[x.id];
    var lock = st.revealed;
    setTitle("Does “" + x.name + "” leave anything out?", "");
    var ask = lock
      ? (on ? "This is the section you read before the checklist. Your mark is shown below." : "This is the section you read before the checklist. You did not mark it.")
      : s.n === 0
      ? "Read this section of the report. Think back to Project 2, where you followed the outage day by day. If you think it leaves out something that you know happened, mark it and write down what is missing."
      : "Read this section. If you think it leaves out something that you know happened, mark it and write down what is missing.";
    var td = lock
      ? (on ? "You marked this section." : "You did not mark this section.")
      : (on ? "Marked. Tap again to unmark." : "Tap to mark this section.");
    el.board.innerHTML =
        '<div class="mark">'
      +   '<div class="doc">'
      +     '<div class="dh"><div class="dt">' + esc(HEAD.title) + '</div>'
      +       '<div class="dm"><b>Prepared by:</b> ' + esc(HEAD.by) + ' &nbsp;·&nbsp; <b>Date:</b> ' + esc(HEAD.date)
      +       '<br><b>System(s):</b> ' + esc(HEAD.sys) + "</div></div>"
      +     '<div class="sec"><div class="sh">' + esc(x.name) + '</div><div class="sg">' + esc(x.gloss) + '</div>'
      +       '<p class="sx">' + esc(x.text) + "</p></div>"
      +   "</div>"
      +   '<div class="mp">'
      +     '<p class="ask">' + esc(ask) + "</p>"
      +     '<button class="tog" id="tog" type="button" aria-pressed="' + (on ? "true" : "false") + '"' + (lock ? " disabled" : "") + ">"
      +       '<span class="oi">' + icon("flag") + "</span>"
      +       '<span class="tn">Something is missing here<span class="td">' + esc(td) + "</span></span>"
      +       '<span class="g" aria-hidden="true">' + icon("check") + "</span>"
      +     "</button>"
      +     '<div class="note" id="note"' + (on ? "" : " hidden") + ">"
      +       '<label for="ta">What does it leave out?</label>'
      +       '<textarea id="ta" maxlength="' + MAXNOTE + '" placeholder="Write it in your own words."' + (lock ? " readonly" : "") + ">" + esc(st.notes[x.id] || "") + "</textarea>"
      +     "</div>"
      +     (lock ? '<p class="small">' + icon("lock") + "<span>Your marks are locked in, because you have seen the checklist. Start over at the end to mark the report again.</span></p>" : "")
      +   "</div>"
      +   (x.words ? '<p class="sw">' + icon("info") + "<span>" + esc(x.words) + "</span></p>" : "")
      + "</div>";
    if(lock) return;
    var tog = el.board.querySelector("#tog"), ta = el.board.querySelector("#ta"), note = el.board.querySelector("#note");
    tog.addEventListener("click", function(){
      document.documentElement.classList.add("fresh");
      if(st.marks[x.id]) delete st.marks[x.id]; else st.marks[x.id] = true;
      save();
      var now = !!st.marks[x.id];
      tog.setAttribute("aria-pressed", now ? "true" : "false");
      tog.querySelector(".td").textContent = now ? "Marked. Tap again to unmark." : "Tap to mark this section.";
      note.hidden = !now;
      if(now && !reduce){ note.classList.remove("in"); void note.offsetWidth; note.classList.add("in"); }
      header();
      say(now ? "Marked: something is missing in " + x.name + ". Write what it leaves out, if you like." : "Unmarked " + x.name + ".");
      if(now) ta.focus({ preventScroll:true });
    });
    ta.addEventListener("input", function(){ st.notes[x.id] = ta.value.slice(0, MAXNOTE); save(); });
  }

  function status(secId){
    var on = !!st.marks[secId];
    return on
      ? '<span class="st yes">' + icon("flag") + "You marked “" + esc(sec(secId).name) + "”</span>"
      : '<span class="st not">' + icon("dash") + "Not marked</span>";
  }

  /* The checklist arrives: seven rows, each with the section that should hold
     it and whether the student marked that section. */
  function renderOverview(){
    setTitle("What a Complete Report Holds",
      "A complete incident report holds these seven things. This report leaves out or gets wrong every one of them, so every one of its five sections had something missing. You marked " + nMarked() + " of " + SECS.length + ".");
    el.board.innerHTML = '<div class="rows" role="list">' + ITEMS.map(function(it){
      var x = sec(it.sec);
      return '<div class="row" role="listitem"><span class="ri">' + icon(it.ic) + "</span>"
        + '<span><span class="rn">' + esc(it.name) + '</span><br><span class="rg">' + esc(it.gloss) + "</span></span>"
        + '<span class="rs">Should be in<br><b>' + esc(x.name) + "</b></span>"
        + status(it.sec) + "</div>";
    }).join("") + "</div>";
  }

  /* One checklist item: what the report says, what actually happened, and the
     student's own mark on the section where it belongs. */
  function yoursHTML(it){
    var x = sec(it.sec), on = !!st.marks[x.id], n = noteOf(x.id), body;
    var card = "“" + (it.actTitle || "What actually happened") + "”";
    if(on && n) body = "<span>You marked the <b>“" + esc(x.name) + "”</b> section. Does your note say the same thing as " + esc(card) + " above?</span>"
      + '<span class="yn">“' + esc(n) + "”</span>";
    else if(on) body = "<span>You marked the <b>“" + esc(x.name) + "”</b> section. Look at " + esc(card) + " above to see what this section leaves out.</span>";
    else body = "<span>You did not mark the <b>“" + esc(x.name) + "”</b> section." + (it.miss ? " " + esc(it.miss) : "") + "</span>";
    var tight = it.kind === "timeline" || it.dense;
    return '<div class="yours ' + (on ? "yes" : "not") + (tight ? " tight" : "") + '">' + icon(on ? "flag" : "info") + '<span class="yt">' + body + "</span></div>";
  }
  function cardHTML(cls, title, ic, c){
    var h = '<div class="card ' + cls + '"><div class="ch">' + icon(ic) + esc(title) + "</div>";
    if(c.q) h += '<p class="q">' + esc(c.q) + "</p>";
    if(c.list) h += "<ul>" + c.list.map(function(l){ return "<li>" + esc(l[0]) + "<span>" + esc(l[1]) + "</span></li>"; }).join("") + "</ul>";
    (c.p || []).forEach(function(t){ h += "<p>" + esc(t) + "</p>"; });
    if(c.gl) h += '<p class="gl">' + esc(c.gl) + "</p>";
    return h + "</div>";
  }
  function timelineHTML(){
    var lo = 3, hi = 14;
    function x(d){ return ((d - lo) / (hi - lo) * 100).toFixed(2) + "%"; }
    var rep = '<div class="track rep"><div class="ch">' + icon("file") + "What the report says</div>"
      + '<div class="axis"><div class="ln"></div>'
      +   '<div class="gap" style="left:calc(' + x(3) + ' + 40px);right:40px"></div>'
      +   '<div class="gapl" style="left:' + x(8.5) + '">Nothing in between</div>'
      +   '<div class="pt" style="left:' + x(3) + '"><i></i><b>3 Feb</b><span>Script run</span></div>'
      +   '<div class="pt" style="left:' + x(14) + '"><i></i><b>14 Feb</b><span>Resolved</span></div>'
      + "</div>"
      + '<div class="vl"><div><b>3 Feb</b>A script was run.</div><div class="gp"><b></b>Nothing in between.</div><div><b>14 Feb</b>Resolved.</div></div>'
      + "</div>";
    var act = '<div class="track act"><div class="ch">' + icon("clock") + "What actually happened</div>"
      + '<div class="axis"><div class="ln"></div>'
      + TL_ACT.map(function(p){ return '<div class="pt" style="left:' + x(p.d) + '"><i></i><b>' + esc(p.b) + "</b><span>" + esc(p.s) + "</span></div>"; }).join("")
      + "</div>"
      + '<div class="vl">' + TL_ACT.map(function(p){ return "<div><b>" + esc(p.b) + "</b>" + esc(p.s) + "</div>"; }).join("") + "</div>"
      + '<p class="tf">The damage spread for over a week. Each count is the number of machines with no working antivirus.</p>'
      + "</div>";
    return '<div class="tl">' + rep + act + "</div>";
  }
  function renderItem(s){
    var it = item(s.item);
    setTitle(it.name, it.gloss);
    var main = it.kind === "timeline" ? timelineHTML()
      : '<div class="pair' + (it.dense ? " dense" : "") + '">' + cardHTML("rep", "What the report says", "file", it.rep)
        + cardHTML("act", it.actTitle || "What actually happened", it.actTitle ? "info" : "clock", it.act) + "</div>";
    el.board.innerHTML = main + yoursHTML(it);
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    if(n === FIRST_REVEAL && !st.revealed){ st.revealed = true; save(); }
    i = n; render(); if(phone()) window.scrollTo(0,0); el.frame.focus({preventScroll:true});
  }
  function startOver(){
    st = fresh(); save(); i = 0; render();
    if(phone()) window.scrollTo(0,0);
    el.frame.focus({preventScroll:true});
    say("Started over. Your marks and notes are cleared. Section 1 of " + SECS.length + ".");
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){
    if(i === S.length - 1){
      if(confirming){ startOver(); return; }
      confirming = true; header(); el.next.focus(); say("Start over clears your marks and notes. Are you sure?"); return;
    }
    go(1);
  });
  el.cancel.addEventListener("click", function(){ confirming = false; header(); el.next.focus(); say("Your marks are kept."); });

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(i === FIRST_REVEAL-1 && !st.revealed) return; if(i < S.length-1) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });
  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }

  /* A cursor resting where new content lands must not tint a control. */
  var lastPt = null;
  document.addEventListener("pointermove", function(e){
    var pt = e.clientX + "," + e.clientY;
    if(lastPt !== null && pt !== lastPt) document.documentElement.classList.remove("fresh");
    lastPt = pt;
  }, true);

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    if(ownsKeys(e.target)){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(i === FIRST_REVEAL-1 && !st.revealed){ tx = null; ty = null; return; } if(i < S.length-1) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      if(n >= FIRST_REVEAL && !st.revealed){ st.revealed = true; save(); }
      i = n; render(); return true;
    },
    slides:S.length,
    reset:function(){ st = fresh(); save(); i = 0; render(); },
    state:function(){ return { i:i, marks:JSON.parse(JSON.stringify(st.marks)), notes:JSON.parse(JSON.stringify(st.notes)), revealed:st.revealed }; }
  };
})();
</script>
</body>
</html>
