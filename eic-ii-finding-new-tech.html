<!DOCTYPE html>
<!--
  EIC II — Where new technology shows up (click-through informational slide deck)
  Reuses the 960x540 canvas + scale-to-fit fix from eic-ii-horizon-sorter.html.
  No predict/reveal/scoring: this is a plain Next/Back slide deck (6 slides).
  Fully self-contained: no CDNs, no external fonts, no external images.
  Icons are inline single-color SVGs in the Extern accent color.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where new technology shows up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #FDF8F8;
    --color-surface-highlight: #DCE1FF;
    --color-accent: #001D69;
    --color-title: #1C1B1B;
    --color-body: #484646;
    --color-white: #FFFFFF;
    --color-border: #E7E3EC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #EFEAF0;
    font-family: 'Inter', sans-serif;
  }
  #stage {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; align-items: flex-start; justify-content: flex-start;
  }
  #deck-wrapper {
    width: 960px; height: 540px; flex-shrink: 0;
    position: relative; overflow: hidden;
    background: var(--color-bg);
  }

  .screen {
    position: absolute; top: 0; left: 0;
    width: 960px; height: 540px;
    padding: 26px 48px 22px;
    display: flex; flex-direction: column;
  }
  .screen[aria-hidden="true"] { display: none; }

  /* top label */
  .brandbar {
    display: flex; align-items: center; gap: 9px;
    font-size: 12px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--color-accent);
    flex-shrink: 0;
  }
  .brandbar svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* centered content panel */
  .panel {
    flex: 1; min-height: 0; min-width: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 6px 40px;
  }
  .panel-icon {
    width: 66px; height: 66px; border-radius: 16px;
    background: var(--color-surface-highlight);
    display: flex; align-items: center; justify-content: center;
    color: var(--color-accent); margin-bottom: 20px; flex-shrink: 0;
  }
  .panel-icon svg { width: 40px; height: 40px; }

  .panel h1 {
    font-size: 29px; font-weight: 800; color: var(--color-title);
    line-height: 1.16; margin-bottom: 15px; max-width: 720px;
    overflow-wrap: break-word;
  }
  .panel p {
    font-size: 17px; color: var(--color-body); line-height: 1.55;
    max-width: 680px; overflow-wrap: break-word;
  }

  .example {
    margin-top: 20px;
    background: var(--color-surface-highlight);
    border-radius: 12px;
    padding: 14px 20px;
    max-width: 700px;
    display: flex; align-items: flex-start; gap: 11px;
    text-align: left;
  }
  .example[hidden] { display: none; }
  .example .tag {
    font-size: 11px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; color: var(--color-accent);
    background: var(--color-white); border-radius: 6px;
    padding: 4px 8px; flex-shrink: 0; margin-top: 1px;
  }
  .example p {
    font-size: 14.5px; color: var(--color-title); line-height: 1.5;
    max-width: none; margin: 0;
  }

  /* footer nav */
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; padding-top: 6px;
  }
  .stepper { font-size: 12.5px; font-weight: 700; color: var(--color-accent); letter-spacing: .04em; }
  .nav { display: flex; gap: 10px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--color-accent); color: #fff;
    border: none; border-radius: 8px; cursor: pointer;
    font-family: inherit; font-size: 14.5px; font-weight: 600;
    padding: 11px 20px; transition: transform .08s ease, box-shadow .15s ease;
    box-shadow: 0 2px 10px rgba(0,29,105,.18);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(0,29,105,.26); }
  .btn svg { width: 16px; height: 16px; }
  .btn.ghost {
    background: transparent; color: var(--color-accent);
    box-shadow: none; padding: 11px 16px;
    border: 1.5px solid var(--color-border);
  }
  .btn.ghost:hover { transform: none; background: rgba(0,29,105,.06); }
  .btn[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="deck-wrapper">
    <section class="screen" aria-hidden="false">
      <div class="brandbar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Where new technology shows up
      </div>

      <div class="panel" id="panel">
        <div class="panel-icon" id="panelIcon"></div>
        <h1 id="panelHeading"></h1>
        <p id="panelBody"></p>
        <div class="example" id="panelExampleWrap" hidden>
          <span class="tag">Example</span>
          <p id="panelExample"></p>
        </div>
      </div>

      <div class="footer">
        <span class="stepper" id="stepper">1 of 6</span>
        <div class="nav">
          <button class="btn ghost" id="backBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back
          </button>
          <button class="btn" id="nextBtn">
            Next
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
/* ============================================================
   CONTENT — the six slides. Edit `icon` / `heading` / `body` /
   `example` to change content; the engine is data-driven.
   ============================================================ */
const ICONS = {
  compass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>',
  signpost: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M12 4h7l2.5 2.5L19 9H12"/><path d="M12 11H5L2.5 13.5 5 16h7"/></svg>',
  newspaper: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13v16H5a1 1 0 0 1-1-1V4z"/><path d="M17 8h2a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2"/><line x1="7" y1="8" x2="14" y2="8"/><line x1="7" y1="12" x2="14" y2="12"/><line x1="7" y1="16" x2="11" y2="16"/></svg>',
  flask: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6"/><path d="M10 2v6.5L5 18a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9.5V2"/><line x1="7.5" y1="14" x2="16.5" y2="14"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><circle cx="12" cy="15" r="3"/><line x1="12" y1="13.5" x2="12" y2="15"/><line x1="12" y1="15" x2="13.2" y2="15.8"/></svg>'
};

const SLIDES = [
  {
    icon: ICONS.compass,
    heading: "You already know how to find technology.",
    body: "In the last task you broke your focus area into categories and hunted down the proven technologies. You are not starting over. You keep the same categories and point the same search at what is new."
  },
  {
    icon: ICONS.signpost,
    heading: "New technology hides in different places.",
    body: "The catch: brand-new technology usually is not in the databases yet. It shows up first in a few specific spots. Here are the three that matter, plus one setting that changes everything."
  },
  {
    icon: ICONS.newspaper,
    heading: "Read the trade press and news.",
    body: "New technology almost always appears in an article before it lands in any database or list. The news is your earliest signal.",
    example: "AI data centers: two-phase immersion cooling was written up in trade outlets like Data Center Dynamics long before it showed up in any formal database."
  },
  {
    icon: ICONS.flask,
    heading: "Watch research labs, universities, and patents.",
    body: "A technology often lives as a paper, a patent, or a university project before it is ever a company. That is the earliest sign of all.",
    example: "AI data centers: small modular reactors to power a data center began as lab designs and patent filings, years before any were built."
  },
  {
    icon: ICONS.chart,
    heading: "Follow the recent funding.",
    body: "A fresh funding round is often the first public proof a new technology exists. Skim the portfolios of the venture-capital firms active in your area.",
    example: "AI data centers: a startup raising a new round to cool AI chips more efficiently is usually the first public sign that approach is real and moving."
  },
  {
    icon: ICONS.calendar,
    heading: "Scope Perplexity to the last 2-3 years.",
    body: "One setting changes everything. When you run Perplexity Deep Research, tell it to focus on the last two to three years, or it hands you back the mature technologies you already mapped.",
    example: "Add a line like: “only technologies from the last 2-3 years.”"
  }
];

/* ============================================================
   ENGINE — no need to edit below this line.
   ============================================================ */
const elIcon    = document.getElementById('panelIcon');
const elHeading = document.getElementById('panelHeading');
const elBody    = document.getElementById('panelBody');
const elExWrap  = document.getElementById('panelExampleWrap');
const elExample = document.getElementById('panelExample');
const elStepper = document.getElementById('stepper');
const elBack    = document.getElementById('backBtn');
const elNext    = document.getElementById('nextBtn');

let index = 0;
const LAST = SLIDES.length - 1;

function render() {
  const s = SLIDES[index];
  elIcon.innerHTML = s.icon;
  elHeading.textContent = s.heading;
  elBody.textContent = s.body;
  if (s.example) {
    elExample.textContent = s.example;
    elExWrap.hidden = false;
  } else {
    elExWrap.hidden = true;
  }
  elStepper.textContent = `${index + 1} of ${SLIDES.length}`;

  // Back hidden on first slide; Next becomes "Start over" on last slide.
  elBack.hidden = (index === 0);
  if (index === LAST) {
    elNext.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/></svg> Start over';
  } else {
    elNext.innerHTML = 'Next <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
  }
}

elNext.addEventListener('click', () => {
  if (index === LAST) { index = 0; } else { index++; }
  render();
});
elBack.addEventListener('click', () => {
  if (index > 0) { index--; render(); }
});

/* ---- MANDATORY viewport scale-to-fit (Notion embeds are 700-900px wide) ---- */
function scaleDeck() {
  const wrapper = document.getElementById('deck-wrapper');
  const scaleX = window.innerWidth / 960;
  const scaleY = window.innerHeight / 540;
  const scale = Math.min(scaleX, scaleY, 1);   // scale DOWN only
  const tx = Math.max(0, (window.innerWidth - 960 * scale) / 2);  // center the scaled deck
  wrapper.style.transformOrigin = 'top left';
  wrapper.style.transform = `translateX(${tx}px) scale(${scale})`;
}
window.addEventListener('resize', scaleDeck);
scaleDeck();

render();
</script>
</body>
</html>
