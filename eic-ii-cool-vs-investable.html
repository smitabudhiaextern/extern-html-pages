<!DOCTYPE html>
<!--
  EIC Heritage — Cool Technology vs. Investable Technology
  A click-through stepper (left-rail, one screen active at a time) covering the concept,
  the two questions to run any technology through, and a real worked example (KiOR vs. shale).

  Screens:  0) Q1: Built at Scale?   1) Q2: Who Would Buy It?
            2) Case: KiOR (the cool one)   3) Case: Shale (the investable one)

  SELF-CONTAINED: inline CSS + vanilla JS + inline SVG. ZERO external requests.
  Fixed 960x540 deck; nothing scrolls (page or inner). System font stack. Brand palette only.
  The worked example is split across two single-column screens so each fits in 540px without scroll.

  Hosted embed URL:
  https://smitabudhiaextern.github.io/extern-html-pages/eic-ii-cool-vs-investable.html

  TO EDIT CONTENT: everything lives in the SCREENS data block below marked "EDIT ONLY THIS BLOCK".
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cool vs. Investable Technology</title>
<style>
  :root{
    --bg:#FDF8F8; --ink:#1C1B1B; --body:#484646; --accent:#001D69;
    --hl:#DCE1FF; --white:#FFFFFF; --line:#ECE6EE; --muted:#8A8693;
    /* contrast tints for the case screen */
    --cool-bg:#FDF1EE; --cool-bd:#F1C9BE; --cool-ink:#9A3B23;
    --inv-bg:#EDF7F0;  --inv-bd:#BFE3CB;  --inv-ink:#1F6B3B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
  }
  #stage{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;}
  #wrapper{width:960px;height:540px;position:relative;overflow:hidden;background:var(--bg);transform-origin:top center;}

  /* ---- title bar ---- */
  .titlebar{height:50px;display:flex;align-items:center;gap:11px;padding:0 24px;border-bottom:1px solid var(--line);}
  .tb-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tb-mark svg{width:17px;height:17px;}
  .tb-title{font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:.1px;}
  .tb-title span{font-weight:500;color:var(--muted);}

  /* ---- body: left rail + content ---- */
  .body{position:absolute;top:50px;left:0;right:0;bottom:0;display:flex;}

  /* left rail */
  .rail{width:212px;flex-shrink:0;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;background:var(--white);}
  .rail-lbl{font-size:9.5px;font-weight:800;letter-spacing:1px;color:var(--muted);padding:0 8px 6px;}
  .r-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left;width:100%;transition:all .15s ease;}
  .r-item .r-n{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s ease;}
  .r-item .r-tx{font-size:12px;font-weight:700;color:var(--muted);line-height:1.2;}
  .r-item:hover{background:var(--bg);}
  .r-item:hover .r-tx{color:var(--ink);}
  .r-item.on{background:var(--accent);}
  .r-item.on .r-tx{color:#fff;}
  .r-item.on .r-n{background:#fff;color:var(--accent);}

  /* content column */
  .content{flex:1;display:flex;flex-direction:column;min-width:0;}
  .cbody{flex:1;overflow:hidden;padding:20px 30px 12px;min-height:0;}
  .kicker{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
  .zpill{font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--accent);background:var(--hl);padding:4px 11px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
  .zpill svg{width:13px;height:13px;}
  .s-title{font-size:19px;font-weight:800;color:var(--ink);line-height:1.15;margin-bottom:10px;}
  /* tighter title on the compact case screens */
  .cbody.case .s-title{font-size:17px;margin-bottom:7px;}
  .cbody.case .kicker{margin-bottom:6px;}
  .p{font-size:13px;color:var(--body);line-height:1.55;margin-bottom:12px;}
  .p b{color:var(--ink);font-weight:700;}

  /* term box (screen 0) */
  .termbox{background:var(--hl);border-radius:12px;padding:13px 16px;margin-top:2px;}
  .term-lbl{font-size:9.5px;font-weight:800;letter-spacing:.9px;color:var(--accent);margin-bottom:7px;}
  .term{font-size:12.5px;line-height:1.5;color:var(--ink);}
  .term + .term{margin-top:6px;}
  .term b{font-weight:800;color:var(--accent);}

  /* footer nav */
  .foot{height:52px;flex-shrink:0;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:var(--white);}
  .nav-btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:9px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:#fff;transition:background-color .15s ease,color .15s ease,opacity .15s ease;}
  .nav-btn.ghost{background:transparent;color:var(--accent);}
  .nav-btn svg{width:15px;height:15px;}
  .nav-btn:hover{opacity:.88;}
  .nav-btn[hidden]{visibility:hidden;}
  .counter{font-size:12px;font-weight:700;color:var(--muted);}
  .counter b{color:var(--accent);font-weight:800;}

  /* ================= CASE SCREEN (compact, must fit 960x540) ================= */
  .case-intro{font-size:12px;color:var(--body);line-height:1.3;margin-bottom:8px;}
  .case-intro b{color:var(--ink);font-weight:700;}
  .col{min-width:0;border-radius:11px;padding:10px 12px;border:1.5px solid;display:flex;flex-direction:column;}
  .col.cool{background:var(--cool-bg);border-color:var(--cool-bd);}
  .col.inv{background:var(--inv-bg);border-color:var(--inv-bd);}
  .col-h{font-size:12.5px;font-weight:800;line-height:1.2;margin-bottom:6px;display:flex;align-items:center;gap:7px;}
  .col.cool .col-h{color:var(--cool-ink);}
  .col.inv .col-h{color:var(--inv-ink);}
  .col-body{font-size:12px;line-height:1.3;color:var(--body);margin-bottom:6px;}
  .qa{margin-top:auto;}
  .qrow{font-size:12px;line-height:1.3;color:var(--body);margin-bottom:5px;}
  .qrow:last-child{margin-bottom:0;}
  .qrow .qlab{font-weight:800;}
  .col.cool .qrow .qlab{color:var(--cool-ink);}
  .col.inv .qrow .qlab{color:var(--inv-ink);}
  .lesson{display:flex;align-items:flex-start;gap:8px;margin-top:8px;background:var(--hl);border-radius:10px;padding:8px 12px;}
  .lesson .ic{width:16px;height:16px;color:var(--accent);flex-shrink:0;margin-top:1px;}
  .lesson .ic svg{width:16px;height:16px;}
  .lesson .lt{font-size:12px;line-height:1.3;color:var(--ink);font-weight:600;}
  .sources{margin-top:8px;font-size:10.5px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sources .slab{font-weight:800;letter-spacing:.6px;color:var(--muted);margin-right:6px;}
  .sources a{color:var(--accent);text-decoration:none;font-weight:600;}
  .sources a:hover{text-decoration:underline;}
  .sources .sep{margin:0 6px;color:var(--muted);}
</style>
</head>
<body>
<div id="stage">
  <div id="wrapper">

    <!-- TITLE BAR -->
    <div class="titlebar">
      <div class="tb-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
      </div>
      <div class="tb-title">Cool Technology vs. Investable Technology <span>&middot; two questions and a real case</span></div>
    </div>

    <div class="body">
      <!-- LEFT RAIL -->
      <nav class="rail">
        <div class="rail-lbl">SCREENS</div>
        <div id="rail"></div>
      </nav>

      <!-- CONTENT -->
      <div class="content">
        <div class="cbody" id="cbody"></div>
        <div class="foot">
          <button class="nav-btn ghost" id="backBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Back
          </button>
          <div class="counter"><b id="cnum">1</b> / 4</div>
          <button class="nav-btn" id="nextBtn">
            Next
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/* ===================== ICONS ===================== */
const IC = {
  spark:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>`,
  scale:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 21V9l6-4 6 4v12"/><path d="M10 21v-5h4v5"/></svg>`,
  cart:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h3l2.2 12.2a1.5 1.5 0 0 0 1.5 1.3h8.5a1.5 1.5 0 0 0 1.5-1.2L21.5 7H6"/></svg>`,
  scope:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="2.2"/></svg>`,
  bulb:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.3 1 2.5h6c0-1.2.3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>`
};

/* ============================================================
   ================= EDIT ONLY THIS BLOCK =====================
   All learner-facing copy lives here.
   ============================================================ */
const SCREENS = [
  /* ---------- 0 — QUESTION 1 ---------- */
  {
    id:"q1",
    railTitle:"Q1: Built at Scale?",
    kicker:"QUESTION 1",
    kickerIcon:"scale",
    title:"Can It Actually Be Built at Scale?",
    render(){
      return `
        <p class="p">Working in a lab is not the same as working on thousands of real sites. Lab conditions are clean and controlled; a real well, pipeline, or facility is messy, old, and different every time. Ask whether the technology has run anywhere outside a controlled demo, and whether anything about the real world (cost, materials, physics, permitting) breaks it when you try to do it a thousand times instead of once.</p>`;
    }
  },

  /* ---------- 1 — QUESTION 2 ---------- */
  {
    id:"q2",
    railTitle:"Q2: Who Would Buy It?",
    kicker:"QUESTION 2",
    kickerIcon:"cart",
    title:"Who Would Buy It?",
    render(){
      return `
        <p class="p">A technology with no buyer is a science project, however clever it is. Look for a real customer, an offtaker who has signed on to pay for what it produces. In upstream and midstream oil and gas, that buyer is an operator: the company that runs the wells, pipelines, or facilities. A fund like this one often lines its corporate partners up as a startup's first customers, so the strongest signal is an operator already piloting the technology on its own assets. The weakest is &ldquo;every energy company will eventually need this,&rdquo; which names no one.</p>`;
    }
  },

  /* ---------- 2 — REAL CASE (KiOR) ---------- */
  {
    id:"case-kior",
    railTitle:"Case: KiOR",
    kicker:"A REAL CASE &middot; 1 OF 2",
    kickerIcon:"scope",
    title:"The Cool One: KiOR",
    render(){
      return `
        <p class="case-intro">Both KiOR and shale drilling tried to solve the same problem: produce cheap liquid hydrocarbons at a price the market would pay. One never left the lab. The other reset the cost curve of an entire industry.</p>
        <div class="col cool">
          <div class="col-h"><span>&#10052;&#65039;</span> Cool, not investable: KiOR</div>
          <div class="col-body">Backed by star investors (Khosla Ventures, Bill Gates) and taken public at a $1.5B+ valuation on a promise to turn wood chips into cheap &ldquo;renewable crude.&rdquo; But it never hit the yields the economics required. It spent more than $600M and earned only about $2.3M in revenue before going bankrupt in 2014. A dazzling pitch with no working economics and no buyer at a viable price.</div>
          <div class="qa">
            <div class="qrow"><span class="qlab">Q1 (built at scale?):</span> No. It never got past one troubled plant, and yields stayed far below target.</div>
            <div class="qrow"><span class="qlab">Q2 (who would buy it?):</span> No one at a workable price. About $2.3M in lifetime revenue against a $1.5B+ valuation.</div>
          </div>
        </div>`;
    }
  },

  /* ---------- 3 — REAL CASE (Shale) ---------- */
  {
    id:"case-shale",
    railTitle:"Case: Shale",
    kicker:"A REAL CASE &middot; 2 OF 2",
    kickerIcon:"scope",
    title:"The Investable One: Shale",
    render(){
      return `
        <div class="col inv">
          <div class="col-h"><span>&#9989;</span> Investable: Shale (horizontal drilling + slickwater fracking)</div>
          <div class="col-body">George Mitchell's fracking breakthrough made gas trapped in shale rock cheap enough to produce at scale. U.S. shale gas rose from under 5 to over 50 billion cubic feet per day between 2000 and 2015, helping make the U.S. the world's top oil and gas producer. The output had real, paying buyers: refiners, utilities, and exporters. Devon Energy acquired Mitchell's company outright.</div>
          <div class="qa">
            <div class="qrow"><span class="qlab">Q1 (built at scale?):</span> Yes. It grew from one operator's experiments to about two-thirds of U.S. gas output.</div>
            <div class="qrow"><span class="qlab">Q2 (who would buy it?):</span> Real, paying buyers, plus a strategic acquirer for the pioneer.</div>
          </div>
        </div>
        <div class="lesson">
          <span class="ic">${IC.bulb}</span>
          <span class="lt">Cool lives in the pitch deck. Investable runs at scale, and someone actually pays for the output. KiOR had the story; shale had the barrels and the buyers.</span>
        </div>
        <div class="sources">
          <span class="slab">SOURCES</span>
          <a href="https://fortune.com/longform/kior-vinod-khosla-clean-tech/" target="_blank" rel="noopener">Fortune</a>
          <span class="sep">&middot;</span>
          <a href="https://jpt.spe.org/george-p-mitchell-and-barnett-shale" target="_blank" rel="noopener">SPE/JPT</a>
          <span class="sep">&middot;</span>
          <a href="https://clearpath.org/tech-101/hydraulic-fracturing-a-public-private-rd-success-story/" target="_blank" rel="noopener">ClearPath</a>
        </div>`;
    }
  }
];
/* ================= END EDIT BLOCK ================= */

/* ===================== ENGINE ===================== */
const railEl  = document.getElementById("rail");
const cbodyEl = document.getElementById("cbody");
const backBtn = document.getElementById("backBtn");
const nextBtn = document.getElementById("nextBtn");
const cnumEl  = document.getElementById("cnum");
let active = 0;

/* build rail */
railEl.innerHTML = SCREENS.map((s,i)=>`
  <button class="r-item" data-i="${i}">
    <span class="r-n">${i+1}</span>
    <span class="r-tx">${s.railTitle}</span>
  </button>`).join("");

function render(i){
  active = i;
  const s = SCREENS[i];
  cbodyEl.classList.toggle("case", s.id.indexOf("case")===0);
  cbodyEl.innerHTML =
      `<div class="kicker"><span class="zpill">${IC[s.kickerIcon]} ${s.kicker}</span></div>`
    + `<h2 class="s-title">${s.title}</h2>`
    + s.render();
  cbodyEl.scrollTop = 0;
  // rail active states
  railEl.querySelectorAll(".r-item").forEach((el,k)=>el.classList.toggle("on", k===i));
  // nav buttons
  backBtn.hidden = (i===0);
  nextBtn.hidden = (i===SCREENS.length-1);
  backBtn.style.visibility = (i===0) ? "hidden" : "visible";
  nextBtn.style.visibility = (i===SCREENS.length-1) ? "hidden" : "visible";
  cnumEl.textContent = (i+1);
}

railEl.querySelectorAll(".r-item").forEach(el=>{
  el.addEventListener("click", ()=>render(+el.getAttribute("data-i")));
});
backBtn.addEventListener("click", ()=>{ if(active>0) render(active-1); });
nextBtn.addEventListener("click", ()=>{ if(active<SCREENS.length-1) render(active+1); });

/* optional deep-link for QA: #q1 #q2 #case-kior #case-shale */
(function(){
  const h=(location.hash||"").replace("#","");
  const k=SCREENS.findIndex(s=>s.id===h);
  if(k>-1) active=k;
})();

/* scale-to-fit for Notion embeds */
function scaleDeck(){
  const w = document.getElementById("wrapper");
  const s = Math.min(window.innerWidth/960, window.innerHeight/540, 1);
  w.style.transform = `scale(${s})`;
  w.style.transformOrigin = "top center";
}
window.addEventListener("resize", scaleDeck);
scaleDeck();
render(active);
</script>
</body>
</html>
