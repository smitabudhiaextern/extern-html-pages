<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet Duolingo</title>
<style>
  /* ===============================================================
     Extern design system. These five values are the entire palette.
     Every tint below is an rgba() of #001D69, not a new hue.
     The ONE exception in this file is the embedded screenshot, which
     is quoted third party material and carries its own colours. No
     colour is ever sampled out of it into this interface.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- the 960x540 canvas, scaled down only, never up ----
     flex:0 0 auto is load bearing: the canvas always holds 960 in
     layout and the transform does all of the fitting. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:7px}
  .prog{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{
    display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out);
  }
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{
    margin-left:auto;flex:0 0 auto;background:var(--highlight);border-radius:20px;
    padding:3px 10px;font-size:11.5px;font-weight:600;color:var(--on-highlight);white-space:nowrap;
  }

  h1{font-size:21px;line-height:1.22;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:7px}

  /* ---- the board ---- */
  .board{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr;gap:20px}
  .board.shot{grid-template-columns:482px 1fr;align-items:start}
  .col{min-width:0;min-height:0;display:flex;flex-direction:column}

  /* ---- the quoted screenshot. A visible frame, a label above it and a
         source caption under it, so the foreign colours inside the image
         read as somebody else's brand and not as our own design. The img
         is sized by its container and never by its own pixels. ---- */
  .shotbox{
    flex:0 0 auto;background:var(--highlight);border:1.5px solid var(--on-highlight);
    border-radius:11px;padding:9px 9px 8px;max-width:100%;
  }
  .shotlab{
    display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--on-highlight);
  }
  .shotlab svg{width:13px;height:13px;flex:0 0 auto;display:block}
  .shotbox img{
    display:block;width:100%;max-width:100%;height:auto;
    border-radius:6px;border:1px solid var(--line);
  }
  .cap{margin-top:7px;font-size:11px;line-height:1.4;color:var(--body)}
  .cap b{color:var(--on-highlight);font-weight:600}

  /* ---- prose ---- */
  .prose{flex:0 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;max-width:76ch}
  .prose p{font-size:15.5px;line-height:1.52}
  .prose p b{color:var(--title);font-weight:600}
  .prose.tight p{font-size:14.5px;line-height:1.48}

  /* ---- the closing question ---- */
  .ask{
    flex:0 0 auto;margin-top:4px;background:var(--tint);border:1.5px solid var(--line);
    border-radius:11px;padding:11px 14px;
  }
  .ask .al{
    font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--on-highlight);margin-bottom:4px;
  }
  .ask .aq{font-size:16px;line-height:1.4;font-weight:600;color:var(--title)}

  /* ---- the playable lesson, screen 2. No new colour: every value is
         one of the five palette tokens or an rgba() of #001D69 already
         declared above. Right and wrong are carried by an icon, a word
         and a border style, never by hue. ---- */
  /* the two column board: the path on the left, the exercise on the right */
  .board.lesson{grid-template-columns:172px 1fr;gap:22px;align-items:stretch}

  /* ---- the path card ---- */
  .lspath{
    flex:0 0 auto;background:var(--highlight);border-radius:11px;padding:13px 13px 12px;
    display:flex;flex-direction:column;
  }
  .lsph{
    font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--on-highlight);margin-bottom:11px;
  }
  .lsnode{
    position:relative;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;
    min-height:28px;
  }
  .lsnode + .lsnode{margin-top:22px}
  .lsnode.ln::after{
    content:"";position:absolute;left:13px;top:30px;width:2px;height:20px;
    background:var(--tint2);border-radius:1px;
  }
  .lsnode.done::after{background:var(--on-highlight)}
  .lsdot{
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--tint2);background:transparent;
    font-size:12.5px;font-weight:600;color:var(--body);
  }
  .lsdot svg{width:15px;height:15px;display:block}
  .lsnode.now .lsdot{background:var(--on-highlight);border-color:var(--on-highlight);color:var(--bg);box-shadow:0 0 0 3px var(--tint2)}
  .lsnode.done .lsdot{background:var(--on-highlight);border-color:var(--on-highlight);color:var(--bg)}
  .lslab{font-size:12.5px;line-height:1.28;color:var(--body)}
  .lsnode.now .lslab,.lsnode.done .lslab{color:var(--title);font-weight:600}
  .lsflag{
    margin-top:auto;padding-top:11px;font-size:11.5px;line-height:1.35;color:var(--on-highlight);font-weight:600;
  }
  button.lsreset{
    margin-top:9px;font-family:inherit;font-size:11.5px;font-weight:600;padding:6px 10px;
    border-radius:7px;cursor:pointer;align-self:flex-start;
    border:1.5px solid var(--on-highlight);background:transparent;color:var(--on-highlight);
  }
  button.lsreset:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  /* ---- the exercise column ---- */
  .lsex{display:flex;flex-direction:column;min-height:0;height:100%}
  .lslead{font-size:13px;line-height:1.45;color:var(--body);margin-bottom:10px}
  .lslead b{color:var(--title);font-weight:600}
  .lsqh{
    font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--on-highlight);margin-bottom:5px;
  }
  .lsask{font-size:16px;line-height:1.38;font-weight:600;color:var(--title);margin-bottom:11px}
  .lsask:focus{outline:none}
  .lsask b{color:var(--on-highlight)}

  /* the sentence with the gap in it */
  .lssent{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin-bottom:12px;
    font-size:20px;line-height:1.3;font-weight:600;color:var(--title);
  }
  .lsblank{
    display:inline-flex;align-items:center;justify-content:center;min-width:118px;
    border-bottom:2.5px solid var(--line);padding:0 8px 2px;color:var(--body);
  }
  .lsblank.filled{border-bottom-color:var(--on-highlight);color:var(--on-highlight)}
  .lsblank.wrongfill{border-bottom-style:dashed}
  .lsstop{margin-left:-7px}

  /* the answer options */
  .lsopts{display:grid;gap:11px}
  .lsopts.pics{grid-template-columns:repeat(3,1fr)}
  .lsopts.words{grid-template-columns:repeat(3,1fr)}
  .lsopts.lines{grid-template-columns:1fr}

  button.lsopt{
    position:relative;font-family:inherit;cursor:pointer;text-align:left;
    background:var(--highlight);border:2px solid transparent;border-radius:11px;
    color:var(--title);
    transition:background var(--t-fast) var(--ease-out);
  }
  button.lsopt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  .lsopts.pics button.lsopt{padding:15px 8px 13px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .lsopts.words button.lsopt{padding:17px 10px;text-align:center;font-size:17px;font-weight:600}
  .lsopts.lines button.lsopt{padding:12px 14px;font-size:15px;line-height:1.35;font-weight:600}
  .lsopt svg.pic{width:72px;height:72px;display:block;color:var(--on-highlight)}
  .lsopt .w{font-size:17px;font-weight:600;color:var(--title)}

  /* chosen and correct: filled, with a check badge and the word Correct */
  button.lsopt.pick{background:var(--on-highlight);border-color:var(--on-highlight);color:var(--bg)}
  button.lsopt.pick .w{color:var(--bg)}
  button.lsopt.pick svg.pic{color:var(--bg)}
  /* chosen and wrong: emptied out and dashed, the same convention the
     disabled nav button already uses in this build. Still tappable. */
  button.lsopt.miss{background:transparent;border:2px dashed var(--line);color:var(--body)}
  button.lsopt.miss .w{color:var(--body)}
  button.lsopt.miss svg.pic{color:var(--body)}
  .lsmark{
    position:absolute;top:6px;right:7px;width:17px;height:17px;display:block;
  }
  .lsopts.words .lsmark,.lsopts.lines .lsmark{top:50%;margin-top:-8.5px;right:10px}
  button.lsopt.pick .lsmark{color:var(--bg)}
  button.lsopt.miss .lsmark{color:var(--on-highlight)}

  /* the feedback strip. margin-top:auto pins it to the bottom of the
     board so the layout never jumps between questions. */
  .lsfb{
    margin-top:auto;flex:0 0 auto;display:grid;grid-template-columns:21px 1fr auto;gap:11px;
    align-items:center;min-height:48px;border-radius:9px;padding:9px 12px;
    background:var(--tint);border:1.5px solid var(--line);
  }
  .lsfb.ok{background:var(--highlight);border-color:var(--on-highlight)}
  .lsfb > svg{width:21px;height:21px;display:block;color:var(--on-highlight)}
  .lsfb p{font-size:13.5px;line-height:1.4;color:var(--body)}
  .lsfb p b{color:var(--title);font-weight:600}
  button.lsnext{
    font-family:inherit;font-size:13px;font-weight:600;padding:8px 15px;border-radius:8px;cursor:pointer;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);white-space:nowrap;
  }
  button.lsnext:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  /* ---- the closing panel, once all three are answered ---- */
  .lsdone{display:flex;flex-direction:column;height:100%}
  .lsdh{font-size:16.5px;line-height:1.32;font-weight:600;color:var(--title);margin-bottom:10px}
  .lsdh:focus{outline:none}
  .lsbeats{display:flex;flex-direction:column;gap:9px}
  .lsbeat{
    display:grid;grid-template-columns:19px 1fr;gap:10px;align-items:start;
    background:var(--highlight);border-radius:8px;padding:8px 12px;
  }
  .lsbeat svg{width:17px;height:17px;display:block;color:var(--on-highlight);margin-top:1px}
  .lsbeat .bt{font-size:13px;line-height:1.42;color:var(--body)}
  .lsbeat .bt b{color:var(--title);font-weight:600}
  .lstail{
    margin-top:auto;padding-top:9px;border-top:1.5px solid var(--highlight);
    font-size:13.5px;line-height:1.45;color:var(--body);
  }
  .lstail b{color:var(--title);font-weight:600}
  /* ---- the bar. margin-top:auto plus flex:0 0 auto keeps it on canvas ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:9px}
  button.nav{
    font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;
    border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);
    transition:opacity var(--t-fast) var(--ease-out);
  }
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  /* disabled keeps full contrast type. It reads as disabled by the dashed
     border and the label, not by being faded, so the text still clears
     4.5:1 with the opacity composited. */
  button.nav:disabled{
    opacity:1;cursor:not-allowed;
    background:transparent;color:var(--on-highlight);border-style:dashed;
  }
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{
    flex:1 1 auto;min-width:0;height:56px;overflow-y:auto;
    font-size:11.5px;line-height:1.36;color:var(--body);
    display:flex;flex-direction:column;justify-content:center;
  }
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken canvas ---- */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{
      width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important;
    }
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    .board,.board.shot,.board.lesson{grid-template-columns:1fr;gap:16px;align-items:start;align-content:start}
    .shotbox{max-width:100%}
    .cap{font-size:12.5px}
    .prose{overflow:visible}
    .prose p,.prose.tight p{font-size:16px;line-height:1.52}
    .ask .aq{font-size:17px}
    .bar{margin-top:20px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:13.5px;flex:1 1 100%;margin-top:4px}
    /* the lesson's own small screen rules */
    .lspath{flex-direction:row;flex-wrap:wrap;gap:14px 20px;align-items:center}
    .lsph{flex:1 1 100%;margin-bottom:0}
    .lsnode + .lsnode{margin-top:0}
    .lsnode:not(:last-child)::after{display:none}
    .lsflag{margin-top:0;padding-top:0;flex:1 1 100%}
    .lslead{font-size:15px}
    .lsask{font-size:18px}
    .lssent{font-size:21px}
    .lsopts.pics,.lsopts.words{grid-template-columns:1fr 1fr}
    .lsfb{margin-top:14px}
    .lsbeat .bt{font-size:15px}
    .lstail{margin-top:14px;font-size:15px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Meet Duolingo">

    <div class="top">
      <span class="prog" id="prog">1 of 3</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
      <span class="chip">Orientation</span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Continue</button>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h1{font-size:26px;line-height:1.2;color:#1C1B1B;margin-bottom:10px}
    .nsf h2{font-size:19px;line-height:1.25;color:#1C1B1B;margin:22px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:8px}
    .nsf strong{color:#1C1B1B}
    .nsf a{color:#001D69}
    .nsf em{color:#001D69;font-style:normal;font-weight:600}
    .nsf .shotbox{background:#DCE1FF;border:1.5px solid #001D69;border-radius:11px;padding:12px;margin:0 0 14px;max-width:100%}
    .nsf .shotbox img{display:block;width:100%;max-width:100%;height:auto;border-radius:6px;border:1px solid rgba(0,29,105,.26)}
    .nsf .shotlab{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#001D69;margin-bottom:7px}
    .nsf .cap{margin-top:8px;font-size:14px;line-height:1.45;color:#484646}
    .nsf .cap strong{color:#001D69}
    .nsf .ask{background:rgba(0,29,105,.055);border:1.5px solid rgba(0,29,105,.26);border-radius:11px;padding:12px 15px;margin:0 0 12px}
    .nsf .ask strong{color:#1C1B1B}
    /* the one screenshot node, revealed in place and sized for a page
       rather than for the 960 canvas */
    #shotsrc[hidden]{display:block!important}
    #shotsrc{max-width:760px;margin:0 auto;padding:0 22px 6px}
    #shotsrc .shotbox{background:#DCE1FF;border:1.5px solid #001D69;border-radius:11px;padding:12px;max-width:100%}
    #shotsrc .shotbox img{display:block;width:100%;max-width:100%;height:auto;border-radius:6px;border:1px solid rgba(0,29,105,.26)}
    #shotsrc .shotlab{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#001D69;margin-bottom:7px;display:flex;align-items:center;gap:7px}
    #shotsrc .shotlab svg{width:15px;height:15px;flex:0 0 auto;display:block}
    #shotsrc .cap{margin-top:8px;font-size:14px;line-height:1.45;color:#484646}
    #shotsrc .cap b{color:#001D69;font-weight:600}
    .nsf.top{padding-bottom:6px}
    .nsf.rest{padding-top:14px}
  </style>
  <div class="nsf top">
    <h1>Meet Duolingo</h1>
  </div>
</noscript>

<!-- The screenshot lives here, once, in the static document. The scripted
     build moves this node into the first screen; with scripting off the
     noscript style block below reveals it in place, between the fallback
     heading and the fallback prose. One copy either way: embedding the data
     URI twice would have doubled the weight of the file for no gain. -->
<div id="shotsrc" hidden>

  <div class="nsf rest">
    <h2>The app you probably already know</h2>
    <p>A green owl. A line about learning languages, chess and more. If you have ever tried to pick up a language on your phone, you have almost certainly met this screen, or seen the owl somewhere else.</p>
    <p>Look at it for a moment before you read on. This is the company you are about to research.</p>

    <h2>What Duolingo does</h2>
    <p>With scripting turned on, this screen is a small working copy of a real Duolingo lesson that you play yourself. Scripting is off, so here is the same lesson written out.</p>
    <p>Duolingo is a language learning app. You open it, and instead of a chapter or a lecture you get a short exercise: a few minutes of work, and then you are done for the day. The teaching is cut into small pieces laid out as a path, and you work down that path one piece at a time. Each piece drills you, which means it asks you to do the same small thing over and over in slightly different forms.</p>
    <p>The lesson on this screen teaches Norwegian, the language spoken in Norway, and it is three questions long. You are not expected to know any Norwegian. The pictures and the English words the Norwegian words resemble are enough to get every answer.</p>
    <ul>
      <li><strong>Question 1, match a word to a picture.</strong> Three pictures, each with a Norwegian word under it: a fish labeled <em>fisk</em>, a cat labeled <em>katt</em>, an apple labeled <em>eple</em>. The question is: which one of these is the cat? The answer is <em>katt</em>. Tap a wrong one and the app tells you what that word does mean and lets you try again, so a wrong answer teaches you something too.</li>
      <li><strong>Question 2, tap the missing word.</strong> The Norwegian sentence has a gap in it: <em>Katten drikker ______</em>. It has to mean "the cat drinks milk". You choose from three words: <em>eple</em>, <em>melk</em>, <em>fisk</em>. The answer is <em>melk</em>, milk.</li>
      <li><strong>Question 3, choose the translation.</strong> The Norwegian is <em>Katten spiser fisk</em>. The three choices are "the cat drinks milk", "the cat eats fish" and "the fish eats the cat". The answer is "the cat eats fish". You can work it out from <em>katt</em> and <em>fisk</em>, the two words the first two questions had just given you.</li>
    </ul>
    <p>Finishing all three takes well under a minute, and that is the point of it. Playing that lesson shows you four things about the product:</p>
    <ul>
      <li><strong>It is short.</strong> Three questions and you are done. A real lesson is a few minutes, and then that is your session finished.</li>
      <li><strong>It comes in small pieces on a path.</strong> One question, then the next, then the next. A whole course is that same path, made long.</li>
      <li><strong>It teaches by drilling.</strong> Match a picture, fill a gap, translate a line. Question 3 reuses two words that questions 1 and 2 had just taught you.</li>
      <li><strong>Nobody asks you for anything.</strong> You open it and you start. That is how the real app opens too: you download it, you begin, nobody asks you for a card.</li>
    </ul>
    <p>Hold that last one. It is the reason this company is worth looking at rather than obvious.</p>

    <h2>Now go and find out how it makes money</h2>
    <p>You know what the product is. You know it opens without payment. You know the company has to publish its own figures. The part you do not have yet is the part that matters, which is where the money actually comes from.</p>
    <div class="ask">
      <p><strong>A product anyone can open without paying, run by a company that answers to public shareholders. So who is paying, and what exactly are they paying for?</strong></p>
    </div>
    <p>Do not take the answer from this page. There isn&rsquo;t one here. Go and find it.</p>
  </div>

    door:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3.5H6.5A1.5 1.5 0 0 0 5 5v14a1.5 1.5 0 0 0 1.5 1.5H14"/><path d="M11 12h9m0 0-3.2-3.2M20 12l-3.2 3.2"/></svg>',
    ask:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.3"/><path d="M12 17h.01"/></svg>',
    cat:'<svg class="pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.6" r="6.4"/><path d="M6.7 8.9 5.5 4.1l4.3 2.2"/><path d="M17.3 8.9l1.2-4.8-4.3 2.2"/><path d="M9.8 12.7h.01M14.2 12.7h.01"/><path d="M12 15.1v1.3m0 0-1.7 1m1.7-1 1.7 1"/><path d="M2.9 14.2h2.6M18.5 14.2h2.6"/></svg>',
    fish:'<svg class="pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.6 12c0 0-2.7 4.6-6.9 4.6S2.4 12 2.4 12 4.5 7.4 8.7 7.4 15.6 12 15.6 12Z"/><path d="M15.6 12 21.4 8.3v7.4Z"/><path d="M6.4 11h.01"/><path d="M11.4 9.6c.7.8 1 1.6 1 2.4s-.3 1.6-1 2.4"/></svg>',
    apple:'<svg class="pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8.6c-1-1.1-2.3-1.6-3.5-1.4C6.4 7.5 5 9.4 5 11.9c0 3.6 2.6 7.5 4.6 7.5.9 0 1.5-.5 2.4-.5s1.5.5 2.4.5c2 0 4.6-3.9 4.6-7.5 0-2.5-1.4-4.4-3.5-4.7-1.2-.2-2.5.3-3.5 1.4Z"/><path d="M12 8.6V5.9"/><path d="M12.2 6.1c.5-1.6 1.9-2.4 3.2-2.3.1 1.3-.7 2.6-2 2.9-.5.1-.9 0-1.2-.6Z"/></svg>',

    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.6 9.5 17.6 19.5 6.6"/></svg>',
    cross:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    checkc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M8.2 12.3 11 15.1l4.8-5.6"/></svg>',
    crossc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M9.4 9.4 14.6 14.6M14.6 9.4 9.4 14.6"/></svg>',
    hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v9"/><path d="M8.6 7.1 12 3.5l3.4 3.6"/><path d="M5 14.5v2.2c0 2.1 1.7 3.8 3.8 3.8h6.4c2.1 0 3.8-1.7 3.8-3.8v-2.2"/></svg>'
  };

  /* the screenshot node, lifted out of the static document once and kept
     detached between screens. render() replaces board.innerHTML, which would
     destroy an inlined copy, so the node is re-appended rather than rebuilt. */
  var SHOTNODE = document.querySelector("#shotsrc .shotbox");
  if(SHOTNODE) SHOTNODE.parentNode.removeChild(SHOTNODE);

  var SLIDE2 = {
    label:"What it does",
    title:"What Duolingo does: play one lesson",
    kind:"lesson",

    lead:"This is a small working copy of a real Duolingo lesson. It teaches Norwegian, the language spoken in Norway, and you are <b>not</b> expected to know any of it. The pictures will carry you, and the Norwegian words look a lot like their English ones.",

    steps:["Match a picture","Fill the gap","Translate a line"],

    q:[
      {
        head:"Question 1 of 3 &middot; Match a word to a picture",
        ask:"Which one of these is the cat?",
        idle:"Tap a picture to answer.",
        layout:"pics",
        opts:[
          {ic:I.fish, w:"fisk", alt:"a fish", ok:false,
           fb:"Not that one. <b>fisk</b> is fish. Try another."},
          {ic:I.cat, w:"katt", alt:"a cat", ok:true,
           fb:"Correct. <b>katt</b> is cat. The other two came along with it: <b>fisk</b> is fish, <b>eple</b> is apple."},
          {ic:I.apple, w:"eple", alt:"an apple", ok:false,
           fb:"Not that one. <b>eple</b> is apple. Try another."}
        ]
      },
      {
        head:"Question 2 of 3 &middot; Tap the missing word",
        ask:"Fill the gap so the sentence means: The cat drinks milk.",
        idle:"Tap a word to drop it into the gap.",
        layout:"words",
        sent:["Katten","drikker"],
        opts:[
          {w:"eple", ok:false, fb:"Not quite. <b>eple</b> is apple, from question 1. Tap a different word."},
          {w:"melk", ok:true, fb:"Correct. <b>melk</b> is milk, so <b>Katten drikker melk</b> means the cat drinks milk."},
          {w:"fisk", ok:false, fb:"Not quite. <b>fisk</b> is fish, from question 1. Tap a different word."}
        ]
      },
      {
        head:"Question 3 of 3 &middot; Choose the translation",
        ask:"What does this mean? <b>Katten spiser fisk.</b>",
        idle:"Tap the English sentence that matches.",
        layout:"lines",
        opts:[
          {w:"The cat drinks milk.", ok:false,
           fb:"Not this one. That would be <b>Katten drikker melk</b>, the sentence from question 2. Try again."},
          {w:"The cat eats fish.", ok:true,
           fb:"Correct. You worked that out from <b>katt</b> and <b>fisk</b>, two words this lesson handed you a minute ago. <b>spiser</b> means eats."},
          {w:"The fish eats the cat.", ok:false,
           fb:"Not this one. <b>Katten</b> is at the front of the sentence, so the cat is the one doing the eating. Try again."}
        ]
      }
    ],

    doneHead:"Lesson complete. That, in miniature, is the product.",
    beats:[
      [I.tap,"<b>It was short.</b> Three questions and you were finished. A real lesson is a few minutes of work, and then that is your session done for the day."],
      [I.path,"<b>It came in small pieces on a path.</b> One question, then the next, then the next. A whole course is that same path, made long."],
      [I.drill,"<b>It taught by drilling,</b> which means doing the same small thing over and over in different forms. Question 3 reused two words that questions 1 and 2 had just given you."],
      [I.door,"<b>Nobody asked you for anything.</b> You opened it and started. The real app opens the same way: you download it, you begin, nobody asks you for a card."]
    ],
    tail:"Hold that last one. It is the reason this company is worth looking at rather than obvious.",

    /* hint is a function here, so the bar can speak to the state of the
       lesson. See the one line header() needs in the integration notes. */
    hint:function(){
      if(LS.step >= 3) return '<span>You played the lesson. <b>Continue</b> for what you do with what it showed you.</span>';
      return '<span>Answer the three questions, then <b>Continue</b>. Tab moves, Enter picks. A wrong answer tells you why and lets you try again.</span>';
    }
  };

  var LS = {step:0, marks:[{},{},{}], focus:null};

  function lsReset(){
    LS.step = 0; LS.marks = [{},{},{}]; LS.focus = "#lsask";
  }

  function lsPath(){
    var out = '<div class="lspath"><div class="lsph">Your path</div>';
    for(var n=0;n<3;n++){
      var solvedHere = LS.step === n && LS.marks[n] && LS.marks[n].solved;
      var cls = (LS.step > n || solvedHere) ? "done" : (LS.step === n ? "now" : "");
      var inner = (LS.step > n || solvedHere) ? I.check : String(n+1);
      if(n < 2) cls += " ln";
      out += '<div class="lsnode ' + cls + '">' +
               '<span class="lsdot">' + inner + '</span>' +
               '<span class="lslab">' + SLIDE2.steps[n] + '</span>' +
             '</div>';
    }
    if(LS.step >= 3){
      out += '<div class="lsflag">Path finished. That was one lesson.</div>' +
             '<button class="lsreset" type="button" data-ls="reset">Play it again</button>';
    } else {
      out += '<div class="lsflag">Three small pieces. Together they are one lesson.</div>';
    }
    return out + '</div>';
  }

  function lsQuestion(){
    var q = SLIDE2.q[LS.step];
    var m = LS.marks[LS.step];
    var solved = m.solved === true;

    /* the sentence with the gap, question 2 only */
    var sent = "";
    if(q.sent){
      var fill = "______", bcls = "lsblank";
      if(m.last != null){
        fill = q.opts[m.last].w;
        bcls += solved ? " filled" : " filled wrongfill";
      }
      sent = '<p class="lssent">' + q.sent.map(function(w){ return '<span>'+w+'</span>'; }).join("") +
             '<span class="' + bcls + '">' + fill + '</span><span class="lsstop">.</span></p>';
    }

    /* the options */
    var opts = q.opts.map(function(o,k){
      var state = "", badge = "", say = "";
      if(m[k] === "pick"){ state = " pick"; badge = '<span class="lsmark">'+I.check+'</span>'; say = '<span class="sr">. Correct.</span>'; }
      else if(m[k] === "miss"){ state = " miss"; badge = '<span class="lsmark">'+I.cross+'</span>'; say = '<span class="sr">. Marked not correct.</span>'; }
      var face = q.layout === "pics"
        ? o.ic + '<span class="w">'+o.w+'</span><span class="sr">, picture of '+o.alt+'</span>'
        : '<span class="w">'+o.w+'</span>';
      return '<button class="lsopt'+state+'" type="button" data-ls="opt" data-k="'+k+'"'+
             (solved ? ' aria-disabled="true"' : '')+'>'+face+badge+say+'</button>';
    }).join("");

    /* the feedback strip */
    var fb;
    if(m.msg){
      fb = '<div class="lsfb'+(solved ? " ok" : "")+'">' +
             (solved ? I.checkc : I.crossc) +
             '<p>'+m.msg+'</p>' +
             (solved ? '<button class="lsnext" type="button" data-ls="next" id="lsnext">'+
                        (LS.step === 2 ? "See what you just did" : "Next question")+'</button>' : '<span></span>') +
           '</div>';
    } else {
      fb = '<div class="lsfb">' + I.hand + '<p>'+q.idle+'</p><span></span></div>';
    }

    return '<div class="lsex">' +
             '<p class="lslead">'+SLIDE2.lead+'</p>' +
             '<p class="lsqh">'+q.head+'</p>' +
             '<p class="lsask" id="lsask" tabindex="-1">'+q.ask+'</p>' +
             sent +
             '<div class="lsopts '+q.layout+'">'+opts+'</div>' +
             fb +
           '</div>';
  }

  function lsDone(){
    return '<div class="lsdone">' +
             '<p class="lsdh" id="lsdh" tabindex="-1">'+SLIDE2.doneHead+'</p>' +
             '<div class="lsbeats">' + SLIDE2.beats.map(function(b){
               return '<div class="lsbeat">'+b[0]+'<div class="bt">'+b[1]+'</div></div>';
             }).join("") + '</div>' +
             '<p class="lstail">'+SLIDE2.tail+'</p>' +
           '</div>';
  }

  function renderLesson(){
    el.board.innerHTML = lsPath() + '<div class="col">' + (LS.step >= 3 ? lsDone() : lsQuestion()) + '</div>';
    if(LS.focus){
      var t = el.board.querySelector(LS.focus);
      if(t) t.focus();
      LS.focus = null;
    }
  }

  /* one delegated handler, bound once. render() replaces board.innerHTML
     on every draw, so per element listeners would leak. */
  function lsClick(e){
    var b = e.target.closest ? e.target.closest("[data-ls]") : null;
    if(!b || !el.board.contains(b)) return;
    var act = b.getAttribute("data-ls");

    if(act === "reset"){
      lsReset(); renderLesson(); header();
      say("Lesson restarted. Question 1 of 3.");
      return;
    }
    if(act === "next"){
      LS.step += 1;
      LS.focus = LS.step >= 3 ? "#lsdh" : "#lsask";
      renderLesson(); header();
      say(LS.step >= 3 ? "Lesson complete." : "Question " + (LS.step+1) + " of 3.");
      return;
    }
    if(act === "opt"){
      var m = LS.marks[LS.step];
      if(m.solved) return;                       /* already answered, no double scoring */
      var k = parseInt(b.getAttribute("data-k"),10);
      var o = SLIDE2.q[LS.step].opts[k];
      m[k] = o.ok ? "pick" : "miss";
      m.last = k;
      m.msg = o.fb;
      m.solved = !!o.ok;
      /* right: focus moves on to the button that advances. wrong: focus
         stays where the student left it, and every other option is
         still live, so there is no dead end. */
      LS.focus = o.ok ? "#lsnext" : '[data-k="'+k+'"]';
      renderLesson(); header();
      say(o.fb);
    }
  }

  function say(html){
    el.live.textContent = String(html).replace(/<[^>]+>/g,"").replace(/&middot;/g,",").replace(/&nbsp;/g," ");
  }

  /* ===============================================================
     THE THREE FRAMES. Orientation only. Nothing on this screen tells
     the student what Duolingo earns, how many people use it, what
     share of them pay, or how the money splits. Those are exactly the
     things the module sends them away to find, so printing any of
     them here would hand over the task. Do not add a figure to this
     file, in the copy, in the fallback, or in a comment.
     =============================================================== */
  var F = [

  /* ---------- 1. the screenshot ---------- */
  {
    label:"The screen you know",
    title:"The app you probably already know",
    kind:"shot",
    body:[
      "A green owl. A line about learning languages, chess and more.",
      "If you have ever tried to pick up a language on your phone, you have almost certainly met this screen, or met the owl somewhere it was not invited."
    ],
    hint:'<span>This screenshot is Duolingo&rsquo;s own page, quoted here. Everything outside the framed image is ours.</span>'
  },

  /* ---------- 2. what it does, the playable lesson defined above ---------- */
  SLIDE2,

  /* ---------- 3. the handoff ---------- */
  {
    label:"Your turn",
    title:"Now go and find out how it makes money",
    kind:"hand",
    body:[
      "You know what the product is. You know it opens without payment. You know the company has to publish its own figures on a schedule.",
      "The part you do not have yet is the part that matters, which is <b>where the money actually comes from</b>."
    ],
    ask:"A product anyone can open without paying, run by a company that answers to public shareholders. So who is paying, and what exactly are they paying for?",
    hint:'<span>End of the orientation. The next thing you do is the research.</span>'
  }
  ];

  var HINT_DEFAULT = '<span>Tab moves, Enter picks. <b>Continue</b> to move on, <b>Back</b> to return.</span>';

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var i = 0;
  var el = {};
  ["frame","prog","segs","h1","board","back","next","hint","live"]
    .forEach(function(k){ el[k] = document.getElementById(k); });

  function header(){
    var f = F[i];
    el.prog.textContent = (i+1) + " of " + F.length + " · " + f.label;
    var out = "";
    for(var k=0;k<F.length;k++){
      out += '<i class="' + (k === i ? "here" : (k < i ? "on" : "")) + '"></i>';
    }
    el.segs.innerHTML = out;
    el.back.disabled = (i === 0);
    el.next.disabled = (i === F.length - 1);
    el.next.textContent = (i === F.length - 1) ? "You are at the end" : "Continue";
    /* hint may be a function, so the bar can track state inside a screen. */
    el.hint.innerHTML = (typeof f.hint === "function" ? f.hint() : f.hint) || HINT_DEFAULT;
  }

  function render(){
    var f = F[i];
    el.h1.textContent = f.title;
    el.board.className = "board" + (f.kind === "shot" ? " shot" : "") + (f.kind === "lesson" ? " lesson" : "");

    if(f.kind === "shot"){
      el.board.innerHTML =
        '<div class="col" id="shotslot"></div>' +
        '<div class="col"><div class="prose">' +
          f.body.map(function(p){ return '<p>'+p+'</p>'; }).join("") +
        '</div></div>';
      if(SHOTNODE) document.getElementById("shotslot").appendChild(SHOTNODE);
    }
    else if(f.kind === "lesson"){
      renderLesson();
    }
    else {
      el.board.innerHTML =
        '<div class="col">' +
          '<div class="prose">' + f.body.map(function(p){ return '<p>'+p+'</p>'; }).join("") + '</div>' +
          '<div class="ask">' +
            '<div class="al">The question you are carrying out of here</div>' +
            '<p class="aq">'+f.ask+'</p>' +
          '</div>' +
        '</div>';
    }

    header();
    el.live.textContent = "Screen " + (i+1) + " of " + F.length + ". " + f.label + ".";
  }

  /* navigation. Plain buttons, Tab and Enter. After every move focus
     lands on the frame, which is a real element with tabindex -1, so a
     screen reader announces the new screen and focus is never on BODY. */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= F.length) return;
    i = n; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });
  el.board.addEventListener("click", lsClick);

  /* scale the fixed canvas down to fit, never up */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* exposed for render QA only */
  window.__ex = {
    goto:function(n){ i = n; render(); },
    frames:F.length,
    state:function(){ return {i:i}; }
  };
})();
</script>
</body>
</html>
