<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyMuPDF Tables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Card player, "Click me" pulse, switches, pictures with boxes, the
   flying values and the spacing code: copied from pfizer3-p3-m7-learn.html (the module 7 model Smita approved, 17 November 2026).
   P3 module 9 Learn cards: "Learn How to Extract Structured Tables Using PyMuPDF". Rebuilt 17 November 2026 (Smita):
   ideas only, NO code. All code is in the steps deck (pfizer3-p3-m9-steps.html). The 10 November deck (5 cards with code)
   is kept in the session scratchpad as m9-learn-before.html.
   1 See a Table the Way Python Does: a switch, "Your eyes" (the table with its grid) and "What Python reads" (the grid fades,
   and any clicked row splits into its 3 real text lines, each ending in a line break). 2 Find Where the Table Sits: the 4
   things the table finder gives you, as 4 tiles that light the test results table, its outline, its rows and columns, its
   21 cells. Only the test results table is shown (Smita, 17 November 2026). The second table Colab finds on page 3, the
   product details box, is not explained anywhere in module 9 now: its one line in Try was cut on 18 November 2026, when
   Try It Yourself moved to foo.pdf (1 page, 1 table). 3 Read One Cell at a Time: each cell box lights on page 3 and
   its text flies into an empty 7 x 3 grid. 4 When Python Finds No Table: page 2's small Description and Limits table,
   "0 tables found" vs its 3 text blocks.
   18 November 2026 (Smita): the old card 4, "Check Every Row Before You Trust It" (eyebrow "Debug like a pro": the 7 rows
   with his 3 "Watch for" checks as clickable tiles that only gave definitions), was removed because it confused students.
   His "Watch for:" and its 3 bullets, with the two short definitions (empty string, uneven row), are now in the steps deck,
   Step 4 Parts 2 and 3 (See It on slide 8, Check It on slide 9), where students check their own 7 rows. The old card 5 is now card 4. Backup of the
   5-card deck: scratchpad m9-card4-move/before/.
   Text: SME (Chaitanya) lines kept here, word for word (fact fixes from step2-coverage-m9.md rows 10 and 11 kept):
   card 1 "Now you're staring at something that looks like a table. Neat rows, crisp columns... It should be simple.",
   "To you, that's a single row: the test, how it was checked and its result. But to the parser (the code that reads the
   file)? Three separate lines of text, one under the other." and "Why does that happen? Because most PDFs weren't built for
   machines. They were built for printing."; card 2 his 4 bullets (the tile names); card 4 his 3 "Why?" bullets. His eyebrow headings stay as card eyebrows. Everything else of his (the
   "here's the catch" and "chaotic" paragraphs, the Medium callout, "Meet your new best friend", the function, "What this
   does", "So Far, So Good", the Tip, the options, the closing line and Key Takeaway) is in the steps deck or Optional
   Reading, not here. Ours: titles, one bold why line per card, hints, result lines and short definitions.
   QA pass 17 November 2026 (backup: scratchpad qa2-m9/): card 1's line-break key ("↵ = a line break ...") cut and card 2's
   bounding box definition cut (modules 7 and 5 teach them; the ↵ symbol stays); the old card 4's answer lines cut, so the
   student finds the answers in Try Step 4. Stage size unchanged that day.
   Every number, box and text line is real, from a local run on sample-sdf-document.pdf with PyMuPDF 2.1 (pymupdf 2.1,
   pymupdf-layout 2.1, pymupdf4llm 2.1, Python 3.12 venv; the same packages Colab installs), 17 November 2026:
   page 3 find_tables() table 0 bbox (50.0, 343.0, 530.0, 497.0), 7 rows, 3 columns, 21 cell boxes (table.rows[n].cells);
   cell text from get_text("text", clip=cell).strip(); the 3 text lines of each row and their boxes from get_text("dict")
   (card 1), the same lines get_text("text") gives (each cell is its own line); page 2 find_tables() gives 0 tables; page 2
   blocks 11 to 13 from get_text("blocks"). Earlier decks checked the same numbers on 1.26.5 (no difference for table 0).
   The dashed box on card 4 (148, 338.8, 424, 419.4) is ours: where a border would be.
   Pictures (rendered with PyMuPDF 2.1, source script in the scratchpad m9-learn/scripts/render.py):
   pfizer3-p3-m9-l1-table.png (page 3, x 36 to 544, y 328 to 508, zoom 4), pfizer3-p3-m9-l1-text.png (same crop with the
   table's lines and grey header fill removed by a line-art-only redaction; text unchanged, checked), pfizer3-p3-m9-l5-p2.png
   (page 2, x 120 to 450, y 330 to 428, zoom 5).
   Fixed stage: laid out on a 760 x 820 design stage (card 3, Read One Cell at a Time, the tallest, needs 819 px at its
   picture's base width; it was 760 x 848 while the old card 4 was in the deck), then scaled as one piece to fit the embed
   frame and centred (Notion embed height 764 px at the 708 px wide column; it was 790 px). Nothing scrolls. Spare height on a card first widens the gaps
   between blocks (up to 2x), then enlarges the card's main picture. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --space-2:8px; --space-3:14px; --space-4:18px; --space-5:26px;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage-w:760px; --stage-h:820px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
[hidden]{display:none !important}

.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}
.pg-label{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-muted);white-space:nowrap}
.pg-label::after{content:attr(data-text);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:600}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:20px 28px;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.inner{display:flex;flex-direction:column;gap:12px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:2px}
.hl{color:var(--highlight)}
.why{margin:-6px 0 0;font-size:17px;line-height:1.45;font-weight:600;color:var(--ink)}
.p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty}
.p b{font-weight:600;color:var(--ink)}
.hint{margin:0;font-size:14px;line-height:1.4;font-weight:600;color:var(--step-label)}
.row{display:flex;align-items:center;gap:var(--space-4)}
.center{display:flex;justify-content:center}

/* Switch */
.sw{display:inline-flex;flex:none;border:1.5px solid var(--ink);border-radius:var(--radius-xs);overflow:hidden}
.sw button{border:0;background:var(--surface);color:var(--ink);padding:9px 15px;cursor:pointer;font-size:14.5px;line-height:1.2;font-weight:600;white-space:nowrap}
.sw button + button{border-left:1.5px solid var(--ink)}
.sw button[aria-pressed="true"]{background:var(--action);color:var(--on-action)}

/* Click-me nudge: a soft pulsing outline and a small tag, both gone after the first click */
.nwrap{position:relative;display:inline-flex;flex:none}
.nudge{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(0,51,160,.55)}50%{box-shadow:0 0 0 7px rgba(0,51,160,.12)}}
.tap.static{position:static;transform:none;align-self:flex-start;margin-top:4px}
.tap.inline{position:static;transform:none;display:inline-block;margin-left:10px;vertical-align:1px}
.tap{position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--surface-card);color:var(--pfizer-blue);border:1px solid var(--blue-200);border-radius:999px;padding:4px 11px;font-size:13px;line-height:1.2;font-weight:600;pointer-events:none;animation:tapx 1.6s ease-in-out infinite}
@keyframes tapx{0%,100%{margin-left:0}50%{margin-left:4px}}
@media (prefers-reduced-motion:reduce){ .nudge{animation:none;box-shadow:0 0 0 3px rgba(0,51,160,.5)} .tap{animation:none} }

/* Pictures with boxes drawn over them (an SVG in PDF points, viewBox = the picture's crop) */
.pic{position:relative;margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);line-height:0;flex:none}
.pic img{display:block;width:100%;height:auto;transition:opacity .45s ease}
.pic img.over{position:absolute;left:0;top:0;opacity:0}
.pic.plain img.over{opacity:1}
.pic.plain img.base{opacity:0}
.pic svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pic rect{fill:none;stroke-width:2.5px;vector-effect:non-scaling-stroke}
.pic rect.g{stroke:var(--highlight);fill:var(--highlight);fill-opacity:.16}
.pic rect.gl{stroke:var(--highlight);fill:var(--highlight);fill-opacity:.07;stroke-width:1.5px}
.pic rect.go{stroke:var(--highlight);fill:none;stroke-width:3px}
.pic rect.b{stroke:var(--pfizer-blue);fill:var(--pfizer-blue);fill-opacity:.10}
.pic rect.bl{stroke:var(--blue-200);fill:none;stroke-width:1.5px}
.pic rect.dash{stroke:var(--pfizer-blue);stroke-width:2px;stroke-dasharray:6 5;fill:none}
.pic rect.pop{animation:pop .3s ease both}
@keyframes pop{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){ .pic rect.pop{animation:none} }
.pic text{font-family:var(--font-text);font-weight:700;fill:var(--pfizer-blue)}
.pic text.g{fill:var(--highlight)}
.pic circle{fill:var(--pfizer-blue);stroke:var(--surface);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.cap{margin:6px 0 0;font-size:12.5px;line-height:1.3;font-weight:600;color:var(--gray-600);text-align:center}
.res{margin:0;font-size:16px;line-height:1.5;color:var(--ink-muted);text-wrap:pretty}
.res b{font-weight:700;color:var(--ink)}

/* Card 1: clickable rows over the picture, and the lines Python pulls out */
.hits{position:absolute;inset:0}
.hit{position:absolute;margin:0;padding:0;border:0;background:transparent;border-radius:3px;cursor:pointer}
.hit:hover{background:rgba(0,51,160,.06)}
.reads{display:flex;gap:var(--space-4);align-items:flex-start}
.side-h{margin:0 0 6px;font-size:12.5px;line-height:1.3;font-weight:600;color:var(--pfizer-blue);letter-spacing:.02em}
.ex{margin:0;border:1px solid var(--blue-200);border-radius:var(--radius-sm);background:var(--surface-card);padding:9px 14px;display:flex;flex-direction:column;gap:3px}
.ex .ln{display:flex;align-items:center;gap:7px;font-size:15px;line-height:24px;color:var(--ink);white-space:nowrap}
.ex .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--highlight);color:var(--on-action);font-size:12px;font-weight:700;flex:none}
.ex .t{border-radius:4px;padding:0 4px;background:rgba(7,166,87,.14);box-shadow:0 0 0 1.5px var(--highlight)}
.ex .nl{color:var(--pfizer-blue);font-weight:700}
.ex .key{margin-top:3px;font-size:12.5px;line-height:1.3;font-weight:600;color:var(--gray-600)}
.ln.pop{animation:drop .35s ease both}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .ln.pop{animation:none} }

/* Card 2: the four tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;justify-content:flex-start;gap:4px;text-align:left;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--radius-xs);padding:8px 10px;cursor:pointer;min-height:64px}
.tile .t{font-size:14px;line-height:1.3;font-weight:600;color:inherit}
.tile[aria-pressed="true"]{background:var(--action);color:var(--on-action);border-color:var(--action)}
.tiles.nudge{border-radius:var(--radius-xs)}

/* Card 3: the grid the cells drop into */
.ctrl{display:flex;align-items:center;gap:var(--space-3)}
.again{background:none;border:0;padding:4px 2px;font-size:14px;font-weight:600;color:var(--pfizer-blue);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.again:disabled{visibility:hidden}
.status{margin:0;font-size:15px;line-height:1.4;color:var(--ink-muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status b{color:var(--ink)}
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-icon)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.35;table-layout:fixed}
.tbl th{text-align:left;font-size:12.5px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:6px 10px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.tbl td{height:26px;padding:var(--rowpad,3px) 10px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:clip;transition:background-color .25s ease,box-shadow .25s ease}
.tbl tr:last-child td{border-bottom:0}
.tbl td.rn{font-size:12.5px;font-weight:600;color:var(--gray-600)}
.tbl td.v:empty::before{content:"";display:block;height:18px;border:1.5px dashed var(--blue-200);border-radius:6px}
.tbl td.v.in{background:var(--surface-card)}
.fly{position:absolute;z-index:5;margin:0;padding:1px 7px;border-radius:6px;background:var(--surface);border:2px solid var(--highlight);font-size:14px;line-height:20px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:left .45s cubic-bezier(.4,0,.2,1),top .45s cubic-bezier(.4,0,.2,1),opacity .2s ease}

/* Card 4: his why bullets */
.whyl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.whyl li{font-size:16px;line-height:1.5;color:var(--ink-muted)}
.whyh{margin:0;font-size:16px;line-height:1.5;font-weight:600;color:var(--ink)}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.btn-sm{padding:10px 16px;font-size:15px}
.btn-sm:disabled{opacity:.5;cursor:default}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="How PyMuPDF finds a table and reads it cell by cell: four cards">
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where"><span id="where-count">Card 1 of 4</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Card"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-next" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  var each = function (list, fn) { Array.prototype.forEach.call(list, fn); };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Page 3 of sample-sdf-document.pdf, PyMuPDF 2.1. The picture is the crop x 36 to 544, y 328 to 508 (PDF points), so
     the SVG over it uses that crop as its viewBox. TABLE is find_tables() table 0's bbox; COLS and TOPS rebuild its 21 real
     cell boxes (table.rows[r].cells[c]); DATA is the real text of each cell (get_text("text", clip=cell).strip()).
     LINES are the real boxes of each cell's text line (get_text("dict")): get_text("text") gives one line per cell. */
  var CROP = [36, 328, 508, 180];
  var TABLE = [50.0, 343.0, 530.0, 497.0];
  var COLS = [[50, 250], [250, 430], [430, 530]];
  var TOPS = [343, 365, 387, 409, 431, 453, 475, 497];
  var DATA = [
    ["Description", "Test Method", "Result"],
    ["Autoclave - Pump tubing", "121C > 15 min", "Conforms"],
    ["Gamma Irradiation - Inlets", "25.0 - 40.0 kGy", "Conforms"],
    ["Flow Rate Test", "Per SOP-QC-042", "Pass"],
    ["Pressure Integrity", "Max 0.5 bar, 5 min hold", "Pass"],
    ["Visual Inspection", "No defects visible", "Pass"],
    ["Package Integrity", "Sealed, no damage", "Pass"]
  ];
  var X1 = [[100.0, 305.0, 460.5], [153.0, 313.8, 474.0], [159.0, 316.5, 474.0], [115.5, 325.0, 455.0], [125.5, 349.0, 455.0], [123.0, 325.5, 455.0], [124.5, 333.0, 455.0]];
  function lineBox(r, c) { return [[55.0, 255.0, 435.0][c], 348.3 + 22 * r, X1[r][c], 360.7 + 22 * r]; }
  function cellBox(r, c) { return [COLS[c][0], TOPS[r], COLS[c][1], TOPS[r + 1]]; }
  function rowBox(r) { return [TABLE[0], TOPS[r], TABLE[2], TOPS[r + 1]]; }
  var P3ALT = "The test results table on page 3 of the supplier file: a header row, Description, Test Method and Result, then 6 tests from Autoclave - Pump tubing to Package Integrity, each with its test method and its result, Conforms or Pass.";

  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  /* A picture of part of a page, with an empty SVG over it in PDF points (crop = x, y, width, height) */
  function pic(id, src, w, h, crop, alt, extra) {
    return '<figure class="pic" id="' + id + '"><img class="base" src="' + src + '" width="' + w + '" height="' + h + '" alt="' + alt + '">' + (extra || '') +
      '<svg aria-hidden="true" preserveAspectRatio="none" viewBox="' + crop.join(" ") + '"></svg></figure>';
  }
  function p3pic(id, extra) { return pic(id, "pfizer3-p3-m9-l1-table.png", 2032, 720, CROP, P3ALT, extra); }
  function clear(svg) { while (svg.firstChild) svg.removeChild(svg.firstChild); }
  /* boxes: [x0, y0, x1, y1, class, pad] */
  function draw(svg, boxes, pop) {
    clear(svg);
    boxes.forEach(function (b, n) {
      var pad = b[5] != null ? b[5] : 0;
      var r = document.createElementNS(NS, "rect");
      r.setAttribute("x", b[0] - pad); r.setAttribute("y", b[1] - pad);
      r.setAttribute("width", b[2] - b[0] + 2 * pad); r.setAttribute("height", b[3] - b[1] + 2 * pad);
      r.setAttribute("rx", 1.5);
      r.setAttribute("class", (b[4] || "g") + (pop ? " pop" : ""));
      if (pop) r.style.animationDelay = (n * 0.06) + "s";
      svg.appendChild(r);
    });
  }
  function text(svg, x, y, s, size, anchor, cls) {
    var t = document.createElementNS(NS, "text");
    t.setAttribute("x", x); t.setAttribute("y", y); t.setAttribute("font-size", size);
    if (anchor) t.setAttribute("text-anchor", anchor);
    if (cls) t.setAttribute("class", cls);
    t.textContent = s; svg.appendChild(t); return t;
  }
  function dot(svg, x, y) {
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 3); svg.appendChild(c);
  }

  /* Click-me nudges: a pulsing outline on the element and a "Click me" tag beside it, until it is first clicked */
  var tapped = {};
  function nudge(root, key, target, tagHost, stat) {
    if (tapped[key] || target.classList.contains("nudge")) return;
    target.classList.add("nudge");
    var tag = document.createElement("span");
    tag.className = "tap" + (stat ? " " + stat : ""); tag.setAttribute("aria-hidden", "true"); tag.textContent = "👆 Click me";
    (tagHost || target.parentNode).appendChild(tag);
    target.addEventListener("click", function () {
      tapped[key] = true;
      target.classList.remove("nudge");
      if (tag.parentNode) tag.parentNode.removeChild(tag);
    }, true);
  }

  /* An empty 7 x 3 grid for the cells (card 3 fills it) */
  function grid(id) {
    var h = '<div class="tbl" id="' + id + '"><table><colgroup><col style="width:60px"><col style="width:39%"><col><col style="width:16%"></colgroup>' +
      '<thead><tr><th scope="col"></th><th scope="col">Column 1</th><th scope="col">Column 2</th><th scope="col">Column 3</th></tr></thead><tbody>';
    DATA.forEach(function (d, r) {
      h += '<tr><td class="rn">Row ' + (r + 1) + '</td>' + d.map(function () { return '<td class="v"></td>'; }).join("") + '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  /* Card 1: your eyes vs what Python reads */
  function initSee(root) {
    var fig = root.querySelector("#c1-pic"), svg = fig.querySelector("svg"), hits = fig.querySelector(".hits");
    var btns = root.querySelectorAll(".sw button"), eyes = root.querySelector("#c1-eyes"), py = root.querySelector("#c1-py"), ex = root.querySelector("#c1-ex");
    var cur = 3;
    function pickRow(r, pop) {
      cur = r;
      var boxes = [rowBox(r).concat(["bl", 0])];
      [0, 1, 2].forEach(function (c) { boxes.push(lineBox(r, c).concat(["g", 1.2])); });
      draw(svg, boxes, pop);
      [0, 1, 2].forEach(function (c) { var b = lineBox(r, c); text(svg, b[0] - 2.5, b[1] + 9.2, String(c + 1), 8.5, "end", "g"); });
      ex.innerHTML = '<p class="side-h">ROW ' + (r + 1) + ' IN THE TEXT PYTHON PULLS OUT</p>' +
        DATA[r].map(function (v, c) { return '<span class="ln' + (pop ? ' pop' : '') + '" style="animation-delay:' + (c * 0.12) + 's"><span class="n">' + (c + 1) + '</span><span class="t">' + esc(v) + '</span><span class="nl">↵</span></span>'; }).join("") ;
      each(hits.children, function (h, n) { h.setAttribute("aria-pressed", n === r ? "true" : "false"); });
    }
    function show(v, pop) {
      each(btns, function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-view") === v ? "true" : "false"); });
      var p = v === "py";
      fig.classList.toggle("plain", p);
      hits.hidden = !p; eyes.hidden = p; py.hidden = !p;
      if (p) pickRow(cur, pop); else clear(svg);
      space();
    }
    DATA.forEach(function (d, r) {
      var b = rowBox(r), h = document.createElement("button");
      h.type = "button"; h.className = "hit";
      h.setAttribute("aria-label", "Row " + (r + 1) + ": " + d.join(", "));
      h.style.left = ((b[0] - CROP[0]) / CROP[2] * 100) + "%"; h.style.width = ((b[2] - b[0]) / CROP[2] * 100) + "%";
      h.style.top = ((b[1] - CROP[1]) / CROP[3] * 100) + "%"; h.style.height = ((b[3] - b[1]) / CROP[3] * 100) + "%";
      h.addEventListener("click", function () { pickRow(r, true); });
      hits.appendChild(h);
    });
    each(btns, function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-view"), true); }); });
    show("eyes", false);
    nudge(root, "c1", root.querySelector(".sw"), root.querySelector(".sw").parentNode);
  }

  /* Card 2: the 4 things the table finder gives you, drawn on the test results table */
  var TILE_RES = {
    list: '<b>The test results table</b> is on the list of tables the finder found on page 3.',
    bbox: 'The table\'s bounding box is <b>(50, 343, 530, 497)</b>.',
    counts: '<b>7 rows and 3 columns:</b> a header row, then one row for each of the 6 tests.',
    cells: '<b>21 cell boxes</b>, 7 rows of 3. A <b>cell</b> is one box in the grid. The first cell\'s box is (50, 343, 250, 365).'
  };
  function initTiles(root) {
    var svg = root.querySelector("#c2-pic svg"), tiles = root.querySelectorAll(".tile"), res = root.querySelector("#c2-res");
    function pick(k) {
      each(tiles, function (t) { t.setAttribute("aria-pressed", t.getAttribute("data-k") === k ? "true" : "false"); });
      var T = TABLE;
      if (k === "list") {
        draw(svg, [T.concat(["g", 1.5])], true);
      } else if (k === "bbox") {
        draw(svg, [T.concat(["go", 0])], true);
        dot(svg, T[0], T[1]); dot(svg, T[2], T[3]);
        text(svg, T[0] + 3, T[1] - 4, "(50, 343)", 8.5, null, null);
        text(svg, T[2] - 3, T[3] + 9.5, "(530, 497)", 8.5, "end", null);
      } else if (k === "counts") {
        var bx = [];
        for (var r = 0; r < 7; r++) bx.push(rowBox(r).concat([r % 2 ? "gl" : "g", 0]));
        draw(svg, bx, true);
        for (var q = 0; q < 7; q++) text(svg, 46, TOPS[q] + 14.5, String(q + 1), 9, "end", null);
        COLS.forEach(function (c, n) { text(svg, (c[0] + c[1]) / 2, 339.5, "column " + (n + 1), 8.5, "middle", null); });
      } else {
        var cb = [];
        for (var rr = 0; rr < 7; rr++) for (var cc = 0; cc < 3; cc++) cb.push(cellBox(rr, cc).concat([rr === 0 && cc === 0 ? "g" : "gl", 0]));
        draw(svg, cb, true);
        text(svg, 52, 339.5, "first cell: (50, 343, 250, 365)", 8.5, null, null);
      }
      res.innerHTML = TILE_RES[k];
      space();
    }
    each(tiles, function (t) { t.addEventListener("click", function () { pick(t.getAttribute("data-k")); }); });
    nudge(root, "c2", root.querySelector(".tiles"), root.querySelector("#c2-intro"), "inline");
  }

  /* Card 3: each cell box lights on page 3 and its text flies into the grid, across each row, then down */
  var runToken = 0;
  function initRead(root) {
    var btn = root.querySelector("#c3-btn"), again = root.querySelector("#c3-again"), svg = root.querySelector("#c3-pic svg");
    var cells = root.querySelectorAll("#c3-grid td.v"), status = root.querySelector("#c3-status"), app = $("app");
    function rel(el) {
      var a = app.getBoundingClientRect(), r = el.getBoundingClientRect(), s = a.width / app.offsetWidth;
      return { x: (r.left - a.left) / s, y: (r.top - a.top) / s, w: r.width / s, h: r.height / s };
    }
    function paint(n) {
      var bx = [];
      for (var k = 0; k < 21; k++) bx.push(cellBox(Math.floor(k / 3), k % 3).concat([k === n ? "g" : (k < n ? "gl" : "bl"), 0]));
      draw(svg, bx, false);
    }
    function reset() {
      runToken++;
      each(app.querySelectorAll(".fly"), function (f) { f.parentNode.removeChild(f); });
      each(cells, function (c) { c.textContent = ""; c.classList.remove("in"); });
      paint(-1);
      btn.disabled = false; btn.textContent = "Read the cells"; again.disabled = true;
      status.innerHTML = 'The grid is empty for now.';
    }
    var STEP = reduce ? 120 : 420;
    btn.addEventListener("click", function () {
      reset();
      var token = runToken;
      btn.disabled = true; again.disabled = false;
      for (var n = 0; n < 21; n++) (function (n) {
        setTimeout(function () {
          if (token !== runToken || !btn.isConnected) return;
          var r = Math.floor(n / 3), c = n % 3, val = DATA[r][c];
          paint(n);
          status.innerHTML = '<b>Row ' + (r + 1) + ', cell ' + (c + 1) + ':</b> ' + esc(val);
          if (reduce) { cells[n].textContent = val; cells[n].classList.add("in"); return; }
          var from = rel(svg.childNodes[n]), to = rel(cells[n]);
          var f = document.createElement("span");
          f.className = "fly"; f.textContent = val; f.style.opacity = "0";
          app.appendChild(f);
          var fw = f.offsetWidth, fh = f.offsetHeight;
          f.style.left = (from.x + 4) + "px"; f.style.top = (from.y + from.h / 2 - fh / 2) + "px";
          f.getBoundingClientRect();
          f.style.opacity = "1";
          f.style.left = (to.x + 4) + "px"; f.style.top = (to.y + to.h / 2 - fh / 2) + "px";
          setTimeout(function () {
            if (f.parentNode) f.parentNode.removeChild(f);
            if (token !== runToken || !btn.isConnected) return;
            cells[n].textContent = val; cells[n].classList.add("in");
          }, 470);
        }, n * STEP);
      })(n);
      setTimeout(function () {
        if (token !== runToken || !btn.isConnected) return;
        var bx = [];
        for (var k = 0; k < 21; k++) bx.push(cellBox(Math.floor(k / 3), k % 3).concat(["gl", 0]));
        draw(svg, bx, false);
        status.innerHTML = '<b>Done:</b> 21 cells, 7 rows of 3.';
        btn.disabled = false; btn.textContent = "Read them again";
      }, 21 * STEP + (reduce ? 0 : 500));
    });
    again.addEventListener("click", reset);
    reset();
    nudge(root, "c3", btn);
  }

  /* Card 4: page 2's small table (crop x 120 to 450, y 330 to 428). find_tables() finds 0 tables on page 2 (PyMuPDF 2.1).
     BLOCKS are its real get_text("blocks") blocks 11 to 13, one per row. The dashed box is ours: where a border would be. */
  var P2CROP = [120, 330, 330, 98];
  var TBOX = [148, 338.8, 424, 419.4];
  var BLOCKS = [[154.44, 341.37, 383.83, 356.01], [154.44, 362.16, 415.05, 386.54], [154.44, 392.51, 416.34, 416.9]];
  function initFail(root) {
    var svg = root.querySelector("#c5-pic svg"), btns = root.querySelectorAll(".sw button"), res = root.querySelector("#c5-res");
    function show(v, pop) {
      each(btns, function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-view") === v ? "true" : "false"); });
      if (v === "ft") {
        draw(svg, [TBOX.concat(["dash", 0])], pop);
        res.innerHTML = '<b>0 tables found</b> on page 2. The dashed box shows where a border would be, but there are no lines for the table finder to follow.';
      } else {
        draw(svg, BLOCKS.map(function (b) { return b.concat(["g", 1.5]); }), pop);
        BLOCKS.forEach(function (b, n) { text(svg, 446, b[3] - 3, "block " + (n + 1), 7.5, "end", "g"); });
        res.innerHTML = 'PyMuPDF can still read the words in <b>blocks</b> (chunks of text it keeps together). Here each row of the table comes out as one block: <b>3 blocks</b>.';
      }
      space();
    }
    each(btns, function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-view"), true); }); });
    show("ft", false);
    nudge(root, "c5", root.querySelector(".sw"), root.querySelector(".sw").parentNode);
  }

  var CARDS = [
    { label: "Eyes vs. Python", eyebrow: "What a table looks like to Python",
      html: '<h2 class="title">See a Table the Way Python <span class="hl">Does</span></h2>' +
        '<p class="why">In the last reading, you found one date by its label. Page 3\'s test results sit in a table, so first see what Python actually gets from one.</p>' +
        '<div class="row"><div class="nwrap"><div class="sw" role="group" aria-label="Choose how to see the table">' +
          '<button type="button" data-view="eyes" aria-pressed="true">Your eyes</button>' +
          '<button type="button" data-view="py" aria-pressed="false">What Python reads</button></div></div></div>' +
        '<div data-grow data-max="704" style="width:600px;align-self:center">' +
          p3pic("c1-pic", '<img class="over" src="pfizer3-p3-m9-l1-text.png" width="2032" height="720" alt=""><div class="hits" hidden></div>') +
          '<p class="cap">Page 3 of the supplier file</p></div>' +
        '<div id="c1-eyes" style="min-height:210px"><p class="res">Now you\'re staring at something that <i>looks</i> like a table. Neat rows, crisp columns… It <i>should</i> be simple.</p><p class="hint" style="margin-top:10px">Now click What Python reads to see the same table the way Python gets it.</p></div>' +
        '<div id="c1-py" hidden style="min-height:210px"><div class="reads"><div class="ex" id="c1-ex" style="flex:none;width:300px"></div>' +
          '<div style="display:flex;flex-direction:column;gap:10px;min-width:0"><p class="hint">Click any row on the page.</p>' +
          '<p class="res">To you, that\'s a single row: the test, how it was checked and its result. But to the <b>parser</b> (the code that reads the file)? Three separate lines of text, one under the other.</p>' +
          '<p class="p">Why does that happen? Because most PDFs weren\'t built for machines. They were built for printing.</p></div></div></div>',
      init: initSee },

    { label: "Find the Table", eyebrow: "From bounding boxes to usable tables",
      html: '<h2 class="title">Find Where the Table <span class="hl">Sits</span></h2>' +
        '<p class="why">Before Python can read a single result, it has to find where the table is on page 3.</p>' +
        '<p class="p" id="c2-intro">PyMuPDF has a <b>table finder</b>. When it finds a table on a page, it gives you 4 things. Click each one to see it on page 3.</p>' +
        '<div class="tilehost" style="display:flex;flex-direction:column;gap:6px"><div class="tiles" role="group" aria-label="What the table finder gives you">' +
          '<button type="button" class="tile" data-k="list" aria-pressed="false"><span class="t">A list of detected tables</span></button>' +
          '<button type="button" class="tile" data-k="bbox" aria-pressed="false"><span class="t">Bounding boxes for each one</span></button>' +
          '<button type="button" class="tile" data-k="counts" aria-pressed="false"><span class="t">Row and column counts</span></button>' +
          '<button type="button" class="tile" data-k="cells" aria-pressed="false"><span class="t">Bounding boxes for each <b>individual</b> cell</span></button>' +
        '</div></div>' +
        '<div data-grow data-max="704" style="width:600px;align-self:center">' + p3pic("c2-pic") + '<p class="cap">Page 3 of the supplier file</p></div>' +
        '<p class="res" id="c2-res" aria-live="polite" style="min-height:72px"></p>',
      init: initTiles },

    { label: "Cell by Cell", eyebrow: "Go cell by cell",
      html: '<h2 class="title">Read One <span class="hl">Cell</span> at a Time</h2>' +
        '<p class="why">Now Python knows where every cell is. Reading one cell at a time keeps each result next to its own test.</p>' +
        '<p class="p">Python cuts out only the text inside one cell\'s box and saves it. Then it moves to the next cell: left to right along a row, then down to the next row.</p>' +
        '<div data-grow data-max="704" style="width:520px;align-self:center">' + p3pic("c3-pic") + '</div>' +
        '<div class="ctrl"><div class="nwrap"><button type="button" class="btn btn-next btn-sm" id="c3-btn">Read the cells</button></div>' +
          '<button type="button" class="again" id="c3-again">Start over</button>' +
          '<p class="status" id="c3-status" aria-live="polite"></p></div>' +
        grid("c3-grid"),
      init: initRead },

    { label: "No Table Found", eyebrow: "When the table finder fails you",
      html: '<h2 class="title">When Python Finds <span class="hl">No</span> Table</h2>' +
        '<p class="why">Page 2 has a small table too, and PyMuPDF misses it.</p>' +
        '<div class="row"><div class="nwrap"><div class="sw" role="group" aria-label="Choose a view of page 2\'s table">' +
          '<button type="button" data-view="ft" aria-pressed="true">What the table finder sees</button>' +
          '<button type="button" data-view="bl" aria-pressed="false">Text blocks</button></div></div></div>' +
        '<div data-grow data-max="704" style="width:520px;align-self:center">' +
          pic("c5-pic", "pfizer3-p3-m9-l5-p2.png", 1650, 490, P2CROP, "The small table on page 2 of the supplier file: the headings Description and Limits, then Autoclave, Pump tubing, 121°C > 15 min, and Gamma Irradiation, Inlets, 25.0 – 40.0 kGy. It has no lines at all.") +
          '<p class="cap">Page 2 of the supplier file</p></div>' +
        '<p class="res" id="c5-res" aria-live="polite" style="min-height:48px"></p>' +
        '<div><p class="whyh">Why does the table finder miss it?</p>' +
          '<ul class="whyl"><li>No visible borders</li><li>Weird spacing</li><li>Layout relies on alignment, not lines</li></ul></div>',
      init: initFail }
  ];
  var END_LABEL = "Done";

  var i = 0;
  var app = $("app"), rail = $("rail"), stage = $("stage"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the cards. Scroll down to the next part of this reading.";

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a card. Spare height first widens the gaps
     between blocks, up to 2x; what is left enlarges the card's main picture. */
  var GAP = 12;
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = GAP + "px";
    var grow = null;
    each(inner.querySelectorAll("[data-grow]"), function (g) {
      if (!g.hasAttribute("data-base")) g.setAttribute("data-base", g.style.width || "");
      g.style.width = g.getAttribute("data-base");
      if (!grow && g.offsetHeight) grow = g;
    });
    var cs = getComputedStyle(stage);
    var avail = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) {
      var add = Math.min(GAP, spare / gaps);
      inner.style.gap = (GAP + add) + "px";
      spare = avail - inner.offsetHeight;
    }
    for (var j = 0; j < 4 && grow && spare < 0; j++) {
      var gw = grow.offsetWidth, gh = grow.offsetHeight;
      grow.style.width = Math.max(160, gw + spare * (gw / gh) - 1) + "px";
      spare = avail - inner.offsetHeight;
    }
    if (!grow || spare < 2) return;
    var max = +grow.getAttribute("data-max") || 704;
    for (var k = 0; k < 3 && spare >= 2; k++) {
      var w = grow.offsetWidth, h = grow.offsetHeight;
      if (!h || w >= max) break;
      grow.style.width = Math.min(max, w + spare * (w / h)) + "px";
      spare = avail - inner.offsetHeight;
      if (spare < 0) { grow.style.width = Math.max(0, grow.offsetWidth + spare * (w / h) - 1) + "px"; spare = avail - inner.offsetHeight; }
    }
  }

  CARDS.forEach(function (c, n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + c.label);
    b.innerHTML = '<span class="seg"></span><span class="pg-label" data-text="' + c.label + '">' + c.label + '</span>';
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function titleOf(n) { var m = CARDS[n].html.match(/<h2[^>]*>(.*?)<\/h2>/); return m ? m[1].replace(/<[^>]+>/g, "") : ""; }

  function render(anim) {
    var c = CARDS[i];
    runToken++;
    each(app.querySelectorAll(".fly"), function (f) { f.parentNode.removeChild(f); });
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.eyebrow + '</p>' + c.html + '</div>';
    each(rail.children, function (b, n) {
      b.classList.toggle("is-cur", n === i);
      b.classList.toggle("is-done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("where-count").textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + titleOf(i + 1) + "</b>";
    donemsg.textContent = "";
    if (c.init) c.init(card);
    space();
    each(card.querySelectorAll("img"), function (im) { if (!im.complete) im.addEventListener("load", space); });
  }

  function go(n) { if (n < 0 || n >= CARDS.length || n === i) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i === CARDS.length - 1) {
      donemsg.textContent = DONE_MSG;
      space();
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "extern-deck-done" }, "*");
      return;
    }
    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.closest && e.target.closest(".sw, .tiles, .hits, .tbl")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #card=N opens a card directly */
  var m = location.hash.match(/card=(\d)/);
  if (m) { i = Math.min(CARDS.length - 1, Math.max(0, +m[1] - 1)); }
  window.addEventListener("resize", function () { fit(); });
  fit();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
