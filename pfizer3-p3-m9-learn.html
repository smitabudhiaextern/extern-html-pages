<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyMuPDF Tables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core design system, Light format. Card player, code blocks and Copy buttons copied from
   pfizer3-p3-m5-learn.html (the model Learn deck): a rail with "Card X of N" on top, one card at a time, Back and Next below.
   P3 module 9 Learn cards: "Learn How to Extract Structured Tables Using PyMuPDF" (5 cards, built 10 November 2026).
   1 See a Table the Way Python Does: a three-button switch shows page 3's real table as your eyes see it, as the loose lines
   of get_text("text"), and as find_tables() sees it (21 real cell boxes). 2 Find the Table with find_tables(): his 4 bullets
   are 4 clickable tiles, each lighting the real table, its box, its rows and columns, or its cells.
   3 Go Cell by Cell: his function (cell-number lines replaced by table.rows and row.cells, see step2-coverage-m9.md note A)
   and a button that reads the 21 real cells one by one and builds each row. 4 Check Every Row: his debug print, with one
   added if line that keeps only the first table on page 3, and its real 7 rows, each clickable to light its row on the page. 5 When find_tables()
   Fails You: page 2's small Description and Limits table (no lines at all) finds 0 tables; a switch shows its real
   get_text("blocks") boxes instead.
   Text: the SME's (Chaitanya's) module 9 page, verbatim, except the facts listed in step2-coverage-m9.md.
   Fixed stage: laid out once on a 760 x 1240 design stage (set the Notion embed height to 1156 px at the 708 px wide
   Notion column), then scaled as one piece to fit the embed frame and centred.
   Nothing scrolls, and Back and Next never move.
   Every output, box and count is the real output of the code, run on sample-sdf-document.pdf with PyMuPDF 2.1 (what
   !pip install pymupdf gives in Colab on 10 November 2026, with pymupdf-layout 2.1). On 2.1, find_tables() also uses the
   layout model: page 1 gives 1 table, page 2 gives 0, page 3 gives 2 (the test results table, then the product details
   box). The function reads all 3 tables; card 4's print loop keeps only page 3's first table, the test results table
   (Smita, 11 November 2026), so it prints the same 7 rows on 2.1 and 1.26.5. See pymupdf21-output-diffs.md.
   Pictures: pfizer3-p3-m9-page3-table.png (page 3 clipped to x 40 to 540, y 333 to 507) and pfizer3-p3-m9-page2-table.png
   (page 2 clipped to x 35 to 535, y 338 to 420), both rendered with PyMuPDF from the supplier file at 3x. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0; --blue-50:#e6ecf7; --blue-200:#b9c8e8;
  --extern-black:#000000; --extern-white:#ffffff; --green-600:#07a657;
  --gray-50:#f2f2f2; --gray-200:#e4e4e4; --gray-600:#666666; --gray-800:#333333;
  --surface:var(--extern-white); --surface-card:var(--blue-50); --surface-icon:var(--extern-white);
  --ink:var(--extern-black); --ink-muted:var(--gray-800); --card-title:var(--extern-black); --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue); --highlight:var(--green-600); --icon:var(--extern-black); --connector:var(--extern-black);
  --action:var(--extern-black); --on-action:var(--extern-white); --line:var(--gray-200); --focus-ring:var(--pfizer-blue);
  --space-1:4px; --space-2:8px; --space-3:14px; --space-4:18px; --space-5:26px; --space-6:40px; --space-7:56px;
  --radius-xs:8px; --radius-sm:12px; --radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage-w:760px; --stage-h:1240px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
[hidden]{display:none !important}

/* The design stage. JavaScript sets the scale and position; until it runs, the stage sits at full size. */
.app{position:absolute;top:0;left:0;width:var(--stage-w);height:var(--stage-h);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;font-size:13px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.seg{display:block;height:4px;border-radius:2px;background:var(--blue-200)}
.pg.is-done .seg{background:var(--pfizer-blue)}
.pg.is-cur .seg{background:var(--pfizer-blue);height:6px;margin-top:-1px;border-radius:3px}
.pg-label{font-size:11px;font-weight:500;line-height:1.2;color:var(--ink-muted);white-space:nowrap}
.pg-label::after{content:attr(data-text);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:600}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Card */
.stage{flex:1 1 auto;min-height:0;padding:20px 28px;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.inner{display:flex;flex-direction:column;gap:12px;width:100%}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;padding-bottom:2px}
.hl{color:var(--highlight)}
.why{margin:-6px 0 0;font-size:17px;line-height:1.45;font-weight:600;color:var(--ink)}
.p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-muted);text-wrap:pretty}
.p b{font-weight:600;color:var(--ink)}
.p code,.tbl code,.bul code,.note code,.sw code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink);white-space:nowrap}
.hint{margin:0;font-size:14px;line-height:1.4;font-weight:600;color:var(--step-label)}

/* Bullets */
.bul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.bul li{font-size:16px;line-height:1.55;color:var(--ink-muted)}
.bul b{font-weight:600;color:var(--ink)}
.bul li > .cols{margin-top:8px}

/* Two columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-3);align-items:start}
.cols > *{min-width:0}

/* Table */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-icon)}
.tbl table{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.45}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:7px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--card-text);transition:background-color .2s ease}
.tbl tr:last-child td{border-bottom:0}
.tbl td.w,.tbl td.n{font-family:var(--font-mono);font-size:13.5px;color:var(--ink);white-space:nowrap}
.tbl td b{font-weight:600;color:var(--ink)}
.tbl tr.grp td{background:var(--surface-card);font-size:13px;line-height:16px;font-weight:600;color:var(--step-label);padding:6px 12px}
.tbl tr.on td{background:var(--surface-card)}
.tbl tr.on td:first-child{box-shadow:inset 4px 0 0 var(--highlight)}
.fmt{margin:0;font-family:var(--font-mono);font-size:14px;line-height:1.5;color:var(--ink);background:var(--gray-50);border-radius:var(--radius-xs);padding:7px 12px}

/* Code block with a Copy button; output blocks have no Copy button */
.run{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-icon)}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:4px 8px 4px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:7px 14px;font-family:var(--font-mono);font-size:13px;line-height:1.45;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit;white-space:inherit;background:none;padding:0;border-radius:0}
.run.out{border-color:var(--blue-200)}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;line-height:1.42}
/* Each output line is its own block: a long row that wraps is indented under its first line, so rows stay easy to tell apart */
.run.out pre .ln{display:block;padding-left:2ch;text-indent:-2ch}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:3px 10px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}

/* Pictures: a page clip with an SVG drawn over it in PDF points (the viewBox is the clip) */
.pic{position:relative;margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);line-height:0}
.pic img{display:block;width:100%;height:auto;transition:opacity .2s ease}
.pic svg{position:absolute;inset:0;width:100%;height:100%}
.pic .cell{fill:none;stroke:var(--highlight);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.pic .cell.on{fill:var(--highlight);fill-opacity:.18;stroke-width:2.5px}
.pic .cell.done{fill:var(--highlight);fill-opacity:.07}
.pic .tbox{fill:none;stroke:var(--highlight);stroke-width:3px;vector-effect:non-scaling-stroke}
.pic .band{fill:var(--highlight);fill-opacity:.16;stroke:var(--highlight);stroke-width:2px;vector-effect:non-scaling-stroke}
.pic .rule{stroke:var(--highlight);stroke-width:3px;vector-effect:non-scaling-stroke}
.pic .gd{stroke:var(--pfizer-blue);stroke-width:1.5px;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;fill:none}
.pic .dot{fill:var(--pfizer-blue);stroke:var(--surface);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.pic .tag{font-family:var(--font-text);font-weight:600;fill:var(--pfizer-blue)}
.pic .tag.g{fill:var(--highlight)}
.pic.as-text img{opacity:.1}
.pic .txt{position:absolute;top:8px;bottom:8px;left:12px;margin:0;padding:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:12px;line-height:14.6px;color:var(--ink);white-space:pre}
.pic .txt-note{position:absolute;top:8px;left:250px;right:12px;margin:0;font-family:var(--font-text);font-size:14px;line-height:1.45;color:var(--ink);font-weight:600;white-space:normal}

/* Switches (copied from the module 5 deck) */
.sw-bar{display:flex;align-items:center;gap:var(--space-4)}
.sw{display:inline-flex;flex:none;border:1.5px solid var(--ink);border-radius:var(--radius-xs);overflow:hidden}
.sw button{border:0;background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;font-family:var(--font-mono);font-size:14px;line-height:1.2;font-weight:600;white-space:nowrap}
.sw button.plain{font-family:var(--font-text)}
.sw button + button{border-left:1.5px solid var(--ink)}
.sw button[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.pane{display:flex;flex-direction:column;gap:10px}
.note{border:1.5px solid var(--ink);border-radius:var(--radius-sm);padding:8px 14px}
.note .num{display:block;margin-bottom:3px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.note p{margin:0;font-size:14px;line-height:1.45;color:var(--ink-muted)}
.note p + p{margin-top:3px}
.note b{font-weight:600;color:var(--ink)}
.note a{color:var(--pfizer-blue);font-weight:600}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px}
.tip-icon{flex:none;width:30px;height:30px;border-radius:8px;background:var(--surface-icon);display:grid;place-items:center;color:var(--pfizer-blue)}
.tip-icon svg{width:18px;height:18px}
.tip p{margin:0;font-size:15px;line-height:1.5;color:var(--card-text)}
.tip b{font-weight:600;color:var(--card-title)}

/* Card 2: the four tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--radius-xs);padding:8px 10px;cursor:pointer}
.tile .t{font-size:14px;line-height:1.3;font-weight:600;color:inherit}
.tile .v{font-family:var(--font-mono);font-size:12px;line-height:1.35;color:var(--ink-muted)}
.tile[aria-pressed="true"]{background:var(--action);color:var(--on-action);border-color:var(--action)}
.tile[aria-pressed="true"] .v{color:var(--on-action)}

/* Card 3: the cell-by-cell run */
.run.tight pre{font-size:12px;line-height:1.4;padding:6px 14px}
.walk-side{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-3);align-items:start;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 12px}
.walk-side .p{font-size:14px;line-height:1.45}
.state{margin:0;font-family:var(--font-mono);font-size:12.5px;line-height:1.45;color:var(--ink);background:var(--surface);border:1px solid var(--blue-200);border-radius:var(--radius-xs);padding:6px 10px;min-height:66px;white-space:pre-wrap;overflow-wrap:anywhere}
.state b{font-family:var(--font-text);font-weight:600;color:var(--step-label)}

/* Card 4: output rows you can click */
.orow-wrap{display:flex;flex-direction:column;gap:6px}
.orows{display:flex;flex-direction:column;padding:6px 8px;background:var(--surface-card)}
.orow{display:block;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:1px 6px;font-family:var(--font-mono);font-size:12.5px;line-height:1.5;color:var(--ink);cursor:pointer;white-space:pre}
.orow:hover{background:var(--surface)}
.orow[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.checks{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.checks li{font-size:16px;line-height:1.5;color:var(--ink-muted)}
.checks .ok{display:inline-block;margin-left:6px;font-size:13px;font-weight:600;color:var(--step-label)}
.concl{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:12px 18px;font-size:16px;line-height:1.55;color:var(--card-text)}
.concl b{font-weight:600;color:var(--card-title)}
.concl code,.tip code,.checks code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink);white-space:nowrap}
/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:12px 18px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-align:center;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-back{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-back:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--action);color:var(--on-action)}
.btn-sm{padding:9px 14px;font-size:14px}
.btn-sm:disabled{opacity:.5;cursor:default}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app" role="region" aria-label="How to read a table with PyMuPDF: five cards">
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where"><span id="where-count">Card 1 of 5</span></div>
  </header>
  <main class="stage" id="stage" aria-label="Card"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-back" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-next" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var IC_COPY = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5V3.3c0-.7-.6-1.3-1.3-1.3H3.8c-.7 0-1.3.6-1.3 1.3v5.4c0 .7.6 1.3 1.3 1.3H4" stroke="currentColor" stroke-width="1.4"/></svg>';
  var NS = "http://www.w3.org/2000/svg";

  function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  /* lang "plain" is an output block, with no Copy button */
  function code(lang, label, lines) {
    var out = lang === "plain";
    return '<figure class="run' + (out ? ' out' : '') + '"><div class="code-head"><span class="code-lang">' + label + '</span>' +
      (out ? '' : '<button type="button" class="copy" data-copy aria-label="Copy ' + label + ' code">' + IC_COPY + '<span>Copy</span></button>') + '</div>' +
      '<pre tabindex="0"><code>' + (out ? lines.map(function (l) { return '<span class="ln">' + (l ? esc(l) : ' ') + '</span>'; }).join("") : esc(lines.join("\n"))) + '</code></pre></figure>';
  }
  function svgEl(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }

  /* Page 3 of sample-sdf-document.pdf (PyMuPDF 2.1; the same boxes as 1.26.5). The picture is the page clipped to P3CLIP (x, y, width, height
     in PDF points), so the SVG uses it as its viewBox. TABLE_BOX is the real table.bbox; ROWS holds each real row's
     cell boxes from table.rows[n].cells, and DATA the real text in each cell, from get_text("text", clip=cell).strip(). */
  var P3CLIP = [40, 333, 500, 174];
  var TABLE_BOX = [50.0, 343.0, 530.0, 497.0];
  var COLS = [[50, 250], [250, 430], [430, 530]];
  var TOPS = [343, 365, 387, 409, 431, 453, 475, 497];
  var DATA = [
    ["Description", "Test Method", "Result"],
    ["Autoclave - Pump tubing", "121C > 15 min", "Conforms"],
    ["Gamma Irradiation - Inlets", "25.0 - 40.0 kGy", "Conforms"],
    ["Flow Rate Test", "Per SOP-QC-042", "Pass"],
    ["Pressure Integrity", "Max 0.5 bar, 5 min hold", "Pass"],
    ["Visual Inspection", "No defects visible", "Pass"],
    ["Package Integrity", "Sealed, no damage", "Pass"]
  ];
  function cellBox(r, c) { return { x: COLS[c][0], y: TOPS[r], width: COLS[c][1] - COLS[c][0], height: TOPS[r + 1] - TOPS[r] }; }
  function rowBox(r) { return { x: TABLE_BOX[0], y: TOPS[r], width: TABLE_BOX[2] - TABLE_BOX[0], height: TOPS[r + 1] - TOPS[r] }; }
  function cls(o, c) { o["class"] = c; return o; }
  function clear(svg) { while (svg.firstChild) svg.removeChild(svg.firstChild); }
  function add(svg, tag, a, t) { var e = svgEl(tag, a, t); svg.appendChild(e); return e; }
  function p3Fig(id, alt) {
    return '<figure class="pic" id="' + id + '"><img src="pfizer3-p3-m9-page3-table.png" width="1500" height="522" alt="' + alt + '">' +
      '<svg aria-hidden="true" preserveAspectRatio="none" viewBox="' + P3CLIP.join(" ") + '"></svg></figure>';
  }
  var P3ALT = "The test results table on page 3 of the supplier file: a header row, Description, Test Method and Result, then 6 tests from Autoclave - Pump tubing to Package Integrity, each with its method and its result, Conforms or Pass.";
  function allCells(svg) {
    for (var r = 0; r < 7; r++) for (var c = 0; c < 3; c++) add(svg, "rect", cls(cellBox(r, c), "cell"));
  }

  /* Card 1: three ways to see the table. The text view lays the real get_text("text") lines for the table over the

          '<p class="p">On this page, each row of the table comes out of <code>get_text("blocks")</code> as one block. Run your notebook\'s blocks cell on page 2 (<code>page = doc[1]</code>), and these are the table\'s blocks:</p>' +
          code("plain", "Output (trimmed)", [
            "Block: (154.4409942626953, 341.3739013671875, 383.8323669433594, 356.0138854980469, 'Description \\nLimits \\n', 11, 0)",
            "Block: (154.4370574951172, 362.1578674316406, 415.0481872558594, 386.54302978515625, 'Autoclave\\nPump tubing\\n121°C > 15 min \\n', 12, 0)",
            "Block: (154.4370574951172, 392.5135803222656, 416.3428955078125, 416.90484619140625, 'Gamma Irradiation \\nInlets \\n25.0 – 40.0 kGy \\n', 13, 0)"]) +
        '</div>' +
        '<p class="p">In those cases, you have options:</p>' +
        '<ul class="bul">' +
          '<li>Use <code>page.get_text("blocks")</code> and group text into rows/columns manually.</li>' +
          '<li>Train a model to identify table regions (for advanced users).</li>' +
          '<li>Or… try another tool altogether (like Tabula or Camelot).</li>' +
        '</ul>' +
        '<p class="p">For now, stick with <code>find_tables()</code>, but keep these in your back pocket.</p>' +
        '<p class="p">And just like that, you\'re now equipped to extract structured table data using PyMuPDF. Whether it\'s test results or compliance values, you now have the power to convert those into usable rows and columns.</p>' +
        '<p class="concl"><b>Key Takeaway:</b> Table extraction from PDFs is messy, but with <code>find_tables()</code>, bounding boxes, and smart debugging, you can turn even chaotic layouts into clean, structured data.</p>',
      init: initFail }
  ];

  var END_LABEL = "Done";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the cards. Scroll down to the next part of the page.";

  /* Scale the fixed stage as one piece so it fits the frame, and centre it. Nothing inside ever scrolls. */
  function fit() {
    var cs = getComputedStyle(document.documentElement);
    var W = parseFloat(cs.getPropertyValue("--stage-w")), H = parseFloat(cs.getPropertyValue("--stage-h"));
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    app.style.transform = "scale(" + s + ")";
    app.style.left = Math.max(0, (vw - W * s) / 2) + "px";
    app.style.top = Math.max(0, (vh - H * s) / 2) + "px";
  }

  CARDS.forEach(function (c, n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + c.label);
    b.innerHTML = '<span class="seg"></span><span class="pg-label" data-text="' + c.label + '">' + c.label + '</span>';
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function titleOf(n) { var m = CARDS[n].html.match(/<h2[^>]*>(.*?)<\/h2>/); return m ? m[1].replace(/<[^>]+>/g, "") : ""; }

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function render(anim) {
    var c = CARDS[i];
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.eyebrow + '</p>' + c.html + '</div>';
    if (c.init) c.init(card);
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });
    Array.prototype.forEach.call(rail.children, function (b, n) {
      b.classList.toggle("is-cur", n === i);
      b.classList.toggle("is-done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("where-count").textContent = "Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + titleOf(i + 1) + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n < 0 || n >= CARDS.length || n === i) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i === CARDS.length - 1) {
      donemsg.textContent = DONE_MSG;
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "extern-deck-done" }, "*");
      return;
    }
    go(i + 1);
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.closest && e.target.closest(".sw, .tiles, .orows")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < CARDS.length - 1) go(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", fit);
  fit();
  render(false);
})();
</script>
