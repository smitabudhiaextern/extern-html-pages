<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Letters — Yinan Externship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1230;
    --paper:#FBF4E9;
    --paper-edge:#E8DCC2;
    --ink:#1C1B1B;
    --ink-soft:#484646;
    --rule:#C9BFA8;
    --amber:#7A4E1F;
    --cream:#FDF8F8;
    --serif:'Fraunces', Georgia, serif;
    --sans:'Inter', system-ui, -apple-system, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --hand:'Caveat', cursive;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:var(--cream);overflow:hidden;font-family:var(--sans);}
  body{
    position:fixed;inset:0;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- BACKDROP ---------- */
  .backdrop{
    position:absolute;inset:0;
    background:var(--bg);
    overflow:hidden;
  }
  .glow{
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:1100px;height:1100px;
    background:radial-gradient(circle at center,
      rgba(251,244,233,0.30) 0%,
      rgba(251,244,233,0.18) 25%,
      rgba(251,244,233,0.08) 45%,
      rgba(251,244,233,0) 70%);
    pointer-events:none;
    z-index:1;
  }

  /* ---------- LETTERBOX ---------- */
  .letterbox{
    position:fixed;left:0;right:0;
    pointer-events:none;
    z-index:30;
  }
  .letterbox.top{
    top:0;height:6%;
    background:linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
  }
  .letterbox.bottom{
    bottom:0;height:6%;
    background:linear-gradient(0deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
  }

  /* ---------- FILM GRAIN ---------- */
  .grain{
    position:fixed;inset:0;
    pointer-events:none;
    z-index:31;
    opacity:0.06;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.92  0 0 0 0 0.88  0 0 0 0.9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size:240px 240px;
  }

  /* ---------- STAGE ---------- */
  .stage{
    position:absolute;inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* ---------- INTRO ---------- */
  .intro{
    position:absolute;
    inset:0;
    z-index:25;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    transition:opacity 0.9s ease;
  }
  .intro.gone{opacity:0;pointer-events:none;}
  .intro .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:rgba(253,248,248,0.55);
    margin-bottom:24px;
  }
  .intro h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(36px, 6vw, 64px);
    line-height:1.15;
    color:var(--cream);
    margin-bottom:32px;
    max-width:720px;
  }
  .intro .sub{
    font-family:var(--sans);
    font-size:14px;
    color:rgba(253,248,248,0.65);
    margin-bottom:40px;
    letter-spacing:0.02em;
  }
  .btn-begin{
    appearance:none;
    border:1px solid rgba(253,248,248,0.4);
    background:transparent;
    color:var(--cream);
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.25em;
    text-transform:uppercase;
    padding:16px 32px;
    cursor:pointer;
    border-radius:2px;
    transition:all 0.3s ease;
  }
  .btn-begin:hover{
    background:rgba(253,248,248,0.08);
    border-color:rgba(253,248,248,0.7);
  }

  /* ---------- PAPER CARD ---------- */
  .paper-wrap{
    position:relative;
    z-index:10;
    width:100%;
    max-width:720px;
    height:min(80vh, 820px);
    opacity:0;
    transform:translateY(12px);
    transition:opacity 0.9s ease, transform 0.9s ease;
    pointer-events:none;
  }
  .paper-wrap.live{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .paper{
    position:relative;
    width:100%;
    height:100%;
    background:var(--paper);
    border:1px solid var(--paper-edge);
    border-radius:3px;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.45),
      0 12px 24px rgba(0,0,0,0.35),
      0 0 0 1px rgba(0,0,0,0.04);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .paper::before{
    content:'';
    position:absolute;inset:0;
    pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6  0 0 0 0 0.5  0 0 0 0 0.35  0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
    background-size:320px 320px;
    mix-blend-mode:multiply;
    opacity:0.18;
    border-radius:3px;
  }

  .paper-scroll{
    flex:1 1 auto;
    overflow-y:auto;
    overflow-x:hidden;
    padding:64px 72px 32px;
    position:relative;
    z-index:1;
    scrollbar-width:thin;
    scrollbar-color: rgba(122,78,31,0.3) transparent;
  }
  .paper-scroll::-webkit-scrollbar{width:8px;}
  .paper-scroll::-webkit-scrollbar-track{background:transparent;}
  .paper-scroll::-webkit-scrollbar-thumb{
    background:rgba(122,78,31,0.25);
    border-radius:4px;
  }

  /* ---------- LETTER HEADER ---------- */
  .letter-head{
    margin-bottom:36px;
    padding-bottom:24px;
    border-bottom:1px solid rgba(201,191,168,0.5);
  }
  .letter-head .line{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:rgba(28,27,27,0.55);
    margin-bottom:6px;
  }
  .letter-head .line:last-child{margin-bottom:0;}
  .letter-head .line .label{
    display:inline-block;
    width:42px;
    color:rgba(28,27,27,0.4);
  }

  /* ---------- LETTER BODY ---------- */
  .letter-body{
    font-family:var(--serif);
    font-weight:400;
    font-size:17px;
    line-height:1.65;
    color:var(--ink);
  }
  .letter-body p{margin-bottom:18px;}
  .letter-body p:last-child{margin-bottom:0;}
  .letter-body .lead{
    font-family:var(--serif);
    font-weight:600;
    color:var(--ink);
  }
  .letter-body em, .letter-body i{font-style:italic;}
  .letter-body strong{font-weight:600;}
  .letter-body hr{
    border:none;
    border-top:1px solid var(--rule);
    opacity:0.7;
    margin:28px 0;
    width:60%;
  }
  .letter-body .num-point{
    margin-bottom:20px;
  }
  .letter-body .num-point .lead{
    display:block;
    margin-bottom:4px;
  }
  .letter-body .section-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:rgba(28,27,27,0.55);
    margin-top:24px;
    margin-bottom:14px;
  }

  /* ---------- SIGNATURE ---------- */
  .signature{
    font-family:var(--hand);
    font-weight:500;
    font-style:italic;
    font-size:32px;
    color:var(--amber);
    margin-top:28px;
    display:inline-block;
    transform:rotate(-3deg);
    transform-origin:left center;
  }

  /* ---------- CONTINUE BAR ---------- */
  .continue-bar{
    flex-shrink:0;
    padding:18px 72px 24px;
    background:linear-gradient(0deg, var(--paper) 0%, var(--paper) 60%, rgba(251,244,233,0) 100%);
    position:relative;
    z-index:2;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    min-height:64px;
  }
  .btn-continue{
    appearance:none;
    border:1px solid rgba(28,27,27,0.25);
    background:transparent;
    color:var(--ink);
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    padding:12px 22px;
    cursor:pointer;
    border-radius:2px;
    transition:all 0.3s ease;
    opacity:0;
    pointer-events:none;
  }
  .btn-continue.ready{
    opacity:1;
    pointer-events:auto;
  }
  .btn-continue:hover{
    background:rgba(28,27,27,0.06);
    border-color:rgba(28,27,27,0.5);
  }

  /* ---------- FOOTER HINT ---------- */
  .foot-hint{
    position:fixed;
    bottom:18px;
    left:0;right:0;
    text-align:center;
    z-index:25;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:rgba(253,248,248,0.4);
    transition:opacity 0.8s ease;
    pointer-events:none;
  }
  .foot-hint.gone{opacity:0;}

  /* ---------- FINAL REVEAL ---------- */
  .finale{
    position:absolute;inset:0;
    z-index:40;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.2s ease;
  }
  .finale.live{
    opacity:1;
    pointer-events:auto;
  }
  .finale .line{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(32px, 5.5vw, 56px);
    color:var(--cream);
    line-height:1.2;
    opacity:0;
    transition:opacity 1.4s ease;
    max-width:820px;
  }
  .finale .line.show{opacity:1;}
  .finale .memo-svg{
    margin-top:36px;
    opacity:0;
    transition:opacity 1.4s ease;
  }
  .finale .memo-svg.show{opacity:0.85;}
  .btn-restart{
    margin-top:48px;
    appearance:none;
    border:1px solid rgba(253,248,248,0.3);
    background:transparent;
    color:rgba(253,248,248,0.7);
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.25em;
    text-transform:uppercase;
    padding:14px 26px;
    cursor:pointer;
    border-radius:2px;
    transition:all 0.3s ease;
    opacity:0;
    pointer-events:none;
  }
  .btn-restart.show{opacity:1;pointer-events:auto;}
  .btn-restart:hover{
    background:rgba(253,248,248,0.08);
    color:var(--cream);
    border-color:rgba(253,248,248,0.5);
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 640px){
    .paper-wrap{height:min(86vh, 740px);}
    .paper-scroll{padding:40px 28px 24px;}
    .continue-bar{padding:14px 28px 18px;}
    .letter-body{font-size:16px;}
    .signature{font-size:28px;}
    .letter-head{margin-bottom:28px;padding-bottom:18px;}
    .intro h1{font-size:32px;}
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="glow"></div>
</div>

<div class="letterbox top"></div>
<div class="letterbox bottom"></div>
<div class="grain"></div>

<!-- INTRO -->
<div class="intro" id="intro">
  <div class="eyebrow">Yinan Externship</div>
  <h1>Three letters.<br/>For the road ahead.</h1>
  <div class="sub">Best with sound on.</div>
  <button class="btn-begin" id="btnBegin">Begin Reading</button>
</div>

<!-- STAGE -->
<div class="stage">
  <div class="paper-wrap" id="paperWrap" aria-hidden="true">
    <div class="paper">
      <div class="paper-scroll" id="paperScroll">
        <div id="letterContent"></div>
      </div>
      <div class="continue-bar">
        <button class="btn-continue" id="btnContinue">Continue →</button>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER HINT -->
<div class="foot-hint" id="footHint">Click anywhere on the letter to continue</div>

<!-- FINAL REVEAL -->
<div class="finale" id="finale">
  <div class="line" id="finaleLine">Your first analyst artifact.</div>
  <div class="memo-svg" id="memoSvg">
    <svg width="80" height="96" viewBox="0 0 80 96" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 4 H58 L72 18 V90 a2 2 0 0 1 -2 2 H8 a2 2 0 0 1 -2 -2 V6 a2 2 0 0 1 2 -2 z" stroke="#FDF8F8" stroke-width="1.4" fill="none"/>
      <path d="M58 4 V18 H72" stroke="#FDF8F8" stroke-width="1.4" fill="none"/>
      <line x1="18" y1="36" x2="60" y2="36" stroke="#FDF8F8" stroke-width="1" opacity="0.7"/>
      <line x1="18" y1="46" x2="60" y2="46" stroke="#FDF8F8" stroke-width="1" opacity="0.7"/>
      <line x1="18" y1="56" x2="52" y2="56" stroke="#FDF8F8" stroke-width="1" opacity="0.7"/>
      <line x1="18" y1="66" x2="60" y2="66" stroke="#FDF8F8" stroke-width="1" opacity="0.7"/>
      <line x1="18" y1="76" x2="44" y2="76" stroke="#FDF8F8" stroke-width="1" opacity="0.7"/>
    </svg>
  </div>
  <button class="btn-restart" id="btnRestart">↻ Start Over</button>
</div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="https://archive.org/download/sad-cinematic-piano-ashamaluevmusic/03.%20Sad%20Cinematic%20Piano%20-%20AShamaluevMusic.mp3" type="audio/mpeg">
</audio>

<script>
  // ============ LETTER CONTENT ============
  const letters = [
    {
      from: 'Mike Chen',
      re: 'Where you go from here',
      body: `
        <p>I had to think about how to write this. You finished. Not many people get this far, and you should sit with that for a minute before reading on.</p>
        <p>Here are four things I wish someone had written down for me on my first day. Take them with you.</p>

        <div class="num-point">
          <span class="lead">1. The thesis matters more than the model.</span>
          The model is the easy part. What takes years is learning to write a thesis you'd actually bet on — one sentence that says why the market is wrong, and what has to be true for you to be right.
        </div>

        <div class="num-point">
          <span class="lead">2. Read the 10-K before you touch the model.</span>
          The story is in the footnotes — leases, off-balance-sheet items, how they define adjusted EBITDA. The headline numbers are what they want you to see. The footnotes are what they have to tell you.
        </div>

        <div class="num-point">
          <span class="lead">3. When the thesis breaks, say so out loud. Fast.</span>
          Defending a bad call costs you twice — once on the position, and again on every call after, because people stop trusting you.
        </div>

        <div class="num-point">
          <span class="lead">4. Write down every call. Read it back six months later.</span>
          Thesis, catalyst, what would prove you wrong, target. That notebook is the best teacher you'll ever have. And it's free.
        </div>

        <hr/>

        <p>Now — career stuff. Here's what comes next.</p>

        <div class="section-label">In the next 30 days:</div>

        <div class="num-point">
          <span class="lead">1. Apply.</span>
          Sell-side research associate, buy-side analyst, family office, hedge fund junior — pick three roles and apply this week. Don't wait for the "perfect" role. The perfect role finds you after two years in any role.
        </div>

        <div class="num-point">
          <span class="lead">2. Cold email 5 senior analysts a week.</span>
          People whose research you respect on LinkedIn. Short, specific, no ask in the first message. "I read your call on X — curious how you got there." That's how careers actually get built.
        </div>

        <div class="num-point">
          <span class="lead">3. Post your memo to LinkedIn.</span>
          Recruiters search names — give them something to find.
        </div>

        <div class="section-label">In the next 18 months:</div>

        <div class="num-point">
          <span class="lead">1. Start a Substack — one pitch a month.</span>
          Builds a public record of your thinking. After a year you have a portfolio recruiters can scan in five minutes.
        </div>

        <div class="num-point">
          <span class="lead">2. Read Damodaran's blog and <em>Net Interest</em> weekly.</span>
          Not optional. The compounding starts now.
        </div>

        <p>Year 2 onward: If you're sell-side, move to buy-side. Smaller fund with bigger responsibility beats bigger fund with smaller role. Your name starts mattering by year three.</p>

        <hr/>

        <p>When you started, you didn't know what a 10-K was. Now you've written a memo I'd hand to a PM. That's the work. I'm proud of you. Go.</p>

        <div class="signature">— Mike</div>
      `
    },
    {
      from: 'Naomi',
      re: 'I cried after my first pitch',
      body: `
        <p>Hey,</p>
        <p>I'm going to tell you something I haven't told anyone here.</p>
        <p>My first real pitch — like the one you walked into — I bombed it. The PM asked me a question I didn't know how to answer. My voice shook. I went back to my desk and sat there for ten minutes, just staring at my screen, thinking I was going to be the person who got fired in week three.</p>
        <p>I went to the bathroom and cried. Not the elegant single-tear kind. The full ugly kind.</p>
        <p>Then I came back, opened the model, and started writing down every question I couldn't answer. I worked through them one by one. The next week the PM asked me the same kind of question. I had the answer.</p>
        <p>I'm telling you this because: you will have that moment. The bombed pitch. The question you couldn't answer. The cry in the bathroom. And I want you to know it's normal. It doesn't mean you're not cut out for this. It means you care.</p>
        <p>The fact that you got here means you've got it. Your work is real. Your name is going to mean something in this field.</p>
        <p>Don't let anyone tell you otherwise. And on the hard days, remember some of us cried first too.</p>
        <p>Rooting for you. Always.</p>
        <div class="signature">— Naomi</div>
      `
    },
    {
      from: 'Dev',
      re: 'We’re in this together',
      body: `
        <p>Hey,</p>
        <p>Two weeks ahead doesn't mean two weeks better. You're already doing what I'm still figuring out.</p>
        <p>The PM grilled me last week on an exit multiple I picked. I had no good answer. Walked back to my desk feeling like an idiot. You'll get that one too. The trick isn't to never get it — it's to write down why, and have the answer next time.</p>
        <p>So here's the thing: when you bomb one (and you will), DM me. We'll workshop it. That's the deal.</p>
        <p>Proud of you. Genuinely.</p>
        <div class="signature">— Dev</div>
      `
    }
  ];

  // ============ STATE ============
  let currentIdx = 0;
  let advanceReady = false;
  let inTransition = false;

  // ============ ELEMENTS ============
  const introEl = document.getElementById('intro');
  const paperWrap = document.getElementById('paperWrap');
  const paperScroll = document.getElementById('paperScroll');
  const letterContent = document.getElementById('letterContent');
  const btnBegin = document.getElementById('btnBegin');
  const btnContinue = document.getElementById('btnContinue');
  const btnRestart = document.getElementById('btnRestart');
  const footHint = document.getElementById('footHint');
  const music = document.getElementById('bgMusic');
  const finale = document.getElementById('finale');
  const finaleLine = document.getElementById('finaleLine');
  const memoSvg = document.getElementById('memoSvg');

  // ============ RENDER ============
  function escapeHtml(s){
    return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function renderLetter(idx){
    const L = letters[idx];
    const isLast = idx === letters.length - 1;
    btnContinue.textContent = isLast ? 'Finish →' : 'Continue →';
    btnContinue.classList.remove('ready');

    const html =
      '<div class="letter-head">' +
        '<div class="line"><span class="label">From:</span>' + escapeHtml(L.from) + '</div>' +
        '<div class="line"><span class="label">Re:</span>' + escapeHtml(L.re) + '</div>' +
      '</div>' +
      '<div class="letter-body">' + L.body + '</div>';
    letterContent.innerHTML = html;
    paperScroll.scrollTop = 0;
  }

  // ============ FLOW ============
  function showLetter(idx){
    inTransition = true;
    advanceReady = false;
    renderLetter(idx);
    paperWrap.classList.add('live');
    paperWrap.setAttribute('aria-hidden','false');

    // Wait for fade-in (~0.9s), then 2s settle, then enable advance
    setTimeout(() => {
      btnContinue.classList.add('ready');
      advanceReady = true;
      inTransition = false;
      if (idx === 0){
        setTimeout(() => footHint.classList.add('gone'), 100);
      }
    }, 900 + 2000);
  }

  function advance(){
    if (!advanceReady || inTransition) return;
    inTransition = true;
    advanceReady = false;

    paperWrap.classList.remove('live');
    paperWrap.setAttribute('aria-hidden','true');

    setTimeout(() => {
      currentIdx++;
      if (currentIdx >= letters.length){
        showFinale();
      } else {
        showLetter(currentIdx);
      }
    }, 950);
  }

  function showFinale(){
    finale.classList.add('live');
    setTimeout(() => finaleLine.classList.add('show'), 1500);
    setTimeout(() => memoSvg.classList.add('show'), 1500 + 3000);
    setTimeout(() => btnRestart.classList.add('show'), 1500 + 3000 + 2000);
  }

  function restart(){
    currentIdx = 0;
    finale.classList.remove('live');
    finaleLine.classList.remove('show');
    memoSvg.classList.remove('show');
    btnRestart.classList.remove('show');
    footHint.classList.remove('gone');
    showLetter(0);
  }

  // ============ MUSIC ============
  function startMusic(){
    try {
      music.volume = 0.35;
      const p = music.play();
      if (p && typeof p.catch === 'function'){
        p.catch(() => { /* silent fail — page works without audio */ });
      }
    } catch (e){ /* no-op */ }
  }

  // ============ EVENTS ============
  btnBegin.addEventListener('click', () => {
    introEl.classList.add('gone');
    startMusic();
    setTimeout(() => showLetter(0), 600);
  });

  btnContinue.addEventListener('click', (e) => {
    e.stopPropagation();
    advance();
  });

  btnRestart.addEventListener('click', restart);

  paperWrap.addEventListener('click', (e) => {
    if (e.target.closest('.btn-continue')) return;
    const sel = window.getSelection();
    if (sel && sel.toString().length > 0) return;
    advance();
  });

  document.addEventListener('keydown', (e) => {
    if (!introEl.classList.contains('gone')) return;
    if (finale.classList.contains('live')) return;
    if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      advance();
    }
  });
</script>

</body>
</html>
