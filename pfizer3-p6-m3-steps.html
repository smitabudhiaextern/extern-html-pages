<style>
/* P6 Step 1 module 3, "Try It Yourself": run the student copy "Retriever Tuning Playground" (Drive
   1HxYAJ4llsfgnfwgCH_oOc0HZd5X2vPGj; his notebook 11uOMjeC with the A1 swaps: pinned installs, pymupdf, upload cell,
   thresholds 0.20/0.25/0.30), STEP 1 to STEP 11, on his question "What test methods were used for quality control?".
   Built by m3-steps-build.py (scratchpad p6s1/m3steps/). Shell copied unchanged from the P5 Try decks.
   Code blocks equal the copy's cells exactly; text is his Notion page (4a31) or notebook markdown for each step.
   Ours: titles, labels, "What this code does" bullets, "now holds" notes, click lines, notes on the output.
   Outputs: real Colab run of the student copy, a1/shots-m3/outputs.json. Colab shots pending: none.
   Fixed stage 760 x 1140 (frames under 560 px wide: 450 x 1256), scaled as one piece so nothing scrolls.
   Look: Pfizer x Extern Core, Light format; every color, size, radius and font comes from design-system/tokens.json. */
:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* The design stage, scaled and centred by the script at the end */
.app{position:absolute;left:50%;top:50%;width:760px;height:1140px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: step rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:13px;font-weight:500;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}
.narrow .top{grid-template-columns:minmax(0,1fr);row-gap:8px}
.narrow .where{order:0}
.narrow .pg-word{display:none}
.narrow .pg.pg-fit{flex:none}

/* Slide area and slide */
.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}
.narrow .stage{padding:10px 0}
.narrow .card{padding:18px 16px;border-left:0;border-right:0;border-radius:0}
.inner{flex:none;display:flex;flex-direction:column;gap:var(--space-3);width:100%}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding-bottom:3px;color:var(--ink);text-wrap:balance}
.narrow .title{font-size:28px;line-height:34px}
.hl{color:var(--highlight)}
.p{margin:0;font-size:15px;line-height:22px;color:var(--ink);text-wrap:pretty}
.p b{font-weight:600}
.p code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.p code.nw,.list code.nw{white-space:nowrap}
.list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:22px;text-wrap:pretty}
.list b{font-weight:600}
.list code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.list li::marker{color:var(--step-label);font-weight:600}
.see{margin-top:4px}

/* Buttons (design system Button, Light) */
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* Run card: a notebook cell (no Copy button: the cells are already in the notebook), or the one cell students add (Copy button) */
.run{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin:0}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:6px 8px 6px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:12px 14px;font-family:var(--font-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out{border-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:6px 12px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}
.narrow .run pre{font-size:13px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.narrow .run.out pre{font-size:12px}

/* The Colab screenshot: the full width of the card (edge to edge), opens full size in a new tab.
   Under 560 px the card itself runs edge to edge, so the picture is as wide as the frame. */
.shot{margin:0 calc(-1 * var(--space-5));border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;line-height:0;background:var(--surface)}
.narrow .shot{margin:0 -16px}
.shot a{display:block}
.shot img{display:block;width:100%;height:auto}
.shot-cap{margin:-6px 0 0;font-size:13px;line-height:18px;color:var(--gray-600)}

/* A picture of the page (slide 14: the table in foo.pdf): framed like the output blocks, as wide as the text */
.pagepic{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;line-height:0;background:var(--surface)}
.pagepic a{display:block}
.pagepic img{display:block;width:100%;height:auto}

/* Table and analysis box (from the Learn deck) */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.4}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:6px 12px;border-bottom:1px solid var(--line);background:var(--gray-50)}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--card-text)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.m{font-family:var(--font-mono);font-size:13px;color:var(--ink);white-space:nowrap}
.tbl td code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .tbl table{font-size:13px}
.narrow .tbl td,.narrow .tbl th{padding:5px 8px}
.concl{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px;font-size:15px;line-height:22px;color:var(--card-text)}
.concl b{font-weight:600;color:var(--card-title)}
.concl p{margin:0}
.concl p + p{margin-top:6px}
.concl code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}


/* A smaller code font for the long function in Step 3 (from the 11 November module 9 steps deck) */
.run.small pre{font-size:12px;line-height:1.32;padding:8px 14px}
.narrow .run.small pre{font-size:10.5px;line-height:1.35}

/* Tip box (from the 11 November module 9 Learn deck): pale-blue card, Pfizer blue bulb in a white square */
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--surface-card);border-radius:var(--radius-md);padding:10px 16px}
.tip-icon{flex:none;width:30px;height:30px;border-radius:var(--radius-xs);background:var(--surface);display:grid;place-items:center;color:var(--pfizer-blue)}
.tip-icon svg{width:18px;height:18px}
.tip p{margin:0;font-size:15px;line-height:22px;color:var(--card-text);text-wrap:pretty}
.tip b{font-weight:600;color:var(--card-title)}

/* Last slide: his closing line and Key Takeaway (takeaway box copied from the module 7 cheat sheet slide) */
.inner.end-slide{gap:var(--space-4)}
.end-slide .p{font-size:17px;line-height:1.55}
.take{margin:0;background:var(--surface-card);border-radius:var(--radius-md);padding:14px 18px;font-size:17px;line-height:1.55;color:var(--card-text)}
.take b{font-weight:700;color:var(--card-title)}
.take code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px;color:var(--ink)}
.narrow .take{font-size:15px;padding:12px 16px}
.narrow .end-slide .p{font-size:16px}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:22px;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.foot .btn{padding:10px 16px;font-size:15px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
.narrow .upnext{visibility:hidden}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }

/* Added for P4 module 2 (copied from the P3 module 8 Try deck): "now holds" note, the SME's callout box, the Quick Recap size */
.holds{margin:0;display:flex;align-items:center;gap:8px;background:var(--surface-card);border-left:4px solid var(--pfizer-blue);border-radius:var(--radius-xs);padding:7px 12px;font-size:14px;line-height:20px;font-weight:600;color:var(--card-title)}
.holds code{font-family:var(--font-mono);font-size:.92em;background:var(--surface);border-radius:4px;padding:1px 5px}
.holds svg{width:16px;height:16px;flex:none;color:var(--pfizer-blue)}
.note{border:1.5px solid var(--ink);border-radius:var(--radius-sm);padding:9px 14px}
.note .num{display:block;margin-bottom:3px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.note p{margin:0;font-size:15px;line-height:1.48;color:var(--ink-muted)}
.note b{font-weight:600;color:var(--ink)}
.recap-slide .list{font-size:17px;line-height:1.55;gap:14px}
.recap-slide .list ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.recap-slide .list ul li::marker{color:var(--ink-muted)}
.narrow .recap-slide .list{font-size:15.5px;gap:10px}
/* Many steps in the rail: numbers only */
.pg-word{display:none}
.pg-label{text-align:center}
.pg.pg-fit{flex:none}
.pg.pg-fit .pg-label{text-align:left}
/* Under 560 px there is no room for the 7 group labels: the rail shows only the progress bars, and "Step N" sits beside the count */
.narrow .pg-label{display:none}
.narrow .pg.pg-fit{flex:1 1 0}
/* Code and output: Project 3's size (fix pass, 22 November 2026: 14 px on the 760 stage, 13 px at the 708 px column; 13 px on
   the narrow stage). Long lines wrap, so nothing scrolls; long cells and outputs are cut over more slides instead */
.run pre{white-space:pre-wrap;overflow-wrap:anywhere}
.run.out pre{font-size:14px;line-height:1.5}
.narrow .run pre,.narrow .run.out pre{font-size:13px}
/* F02: zoomed crops of one strip of the page, before and after a step */
.zoom{margin:0;display:flex;flex-direction:column;gap:6px}
.zoom a{display:block;line-height:0}
.zoom img{display:block;height:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--radius-xs)}
/* The STEP 15 JSON: the 3 heading lines across the top, the JSON in two columns (same text, same order) */
.run.out.json pre.head{padding-bottom:0}
.run.out.json pre.cols{column-count:2;column-gap:24px;padding-top:4px}
.narrow .run.out.json pre.cols{column-gap:12px;font-size:10.5px}
/* A page picture from Colab (tall): shown smaller and centred, so the slide stays short; opens full size */
.shot.tall{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.shot.tall img{width:auto;max-width:100%;height:var(--pic-h,480px);margin:0 auto}
.narrow .shot.tall{margin:0}
.narrow .shot.tall img{height:var(--pic-hn,520px)}
/* q3 Proposal A: two Colab page pictures side by side (STEP 6 + 7, STEP 8 + 9), each with its own notes under it */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.half{display:flex;flex-direction:column;gap:8px;min-width:0}
.half-head{margin:0;font-size:13px;line-height:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--step-label)}
.half .p{margin:0}
.half .list{font-size:14.5px;line-height:1.45;gap:4px}
.half code{overflow-wrap:anywhere}
.pair-slide .shot.tall img{width:auto;height:auto;max-width:100%;max-height:330px}
.narrow .pair{gap:10px}
.narrow .pair-slide .shot.tall img{height:auto;max-height:300px}
.narrow .half .list{font-size:13.5px}
.pic-sm .shot.tall img{height:435px}

/* Code lines wrap at every width, each with a hanging indent */
.run pre{white-space:pre-wrap;overflow-wrap:anywhere}
.run pre code{display:block}
.run pre .ln{display:block;padding-left:calc(var(--i) + 2ch);text-indent:calc(-1 * (var(--i) + 2ch))}
.run pre .ln:empty::before{content:"\200b"}
/* Colab shots: drawn no taller than the slot reserved for them, centred, open full size in a new tab */
.shot.fit{margin:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;line-height:0;background:var(--surface)}
.shot.fit img{width:auto;max-width:100%;max-height:var(--mh);margin:0 auto}
.shot.pending{margin:0;height:var(--mh);border:2px dashed var(--ink-muted);border-radius:var(--radius-sm);background:var(--gray-50);
  display:flex;align-items:center;justify-content:center;line-height:20px}
.pend{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:8px 16px;font-size:13px;color:var(--ink-muted)}
.pend b{font-size:15px;letter-spacing:.06em;color:var(--ink)}
.tbl td{height:22px}
.p a{color:var(--pfizer-blue);text-underline-offset:2px}
.list a{color:var(--pfizer-blue);text-underline-offset:2px}
</style>
</head>

<template id="t1">
<p class="p">This notebook helps you experiment with Top-K retrieval and Similarity Thresholds using LlamaIndex and HuggingFace Embeddings.</p><p class="p">You'll learn how to tune retrieval parameters to get better results from your RAG system.</p><div class="links"><a class="btn btn-secondary" href="https://colab.research.google.com/drive/1HxYAJ4llsfgnfwgCH_oOc0HZd5X2vPGj" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="12" height="14.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Retriever Tuning Playground (Colab notebook)</span><span class="sr-only"> (opens in a new tab)</span></a><a class="btn btn-secondary" href="https://drive.google.com/file/d/1oOR50D8F3Deask7aT2HbXQZhw0u1hvcg/view" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 2.75h6.5L15.5 7v10.25H5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M11.25 2.75V7h4.25" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>The supplier file (PDF)</span><span class="sr-only"> (opens in a new tab)</span></a></div><ol class="list"><li>Open the notebook and click <b>File &rarr; Save a copy in Drive</b>. Work in the copy that opens.</li><li>Open the supplier file. It opens in a Google Drive preview: click the <b>Download</b> button (the arrow at the top right) to save it to your computer. You'll upload it before STEP 3.</li><li>Run the cells in order, from top to bottom, until <code class="nw"># STEP 11</code>. Each cell has a heading near its top, such as <code class="nw"># STEP 1</code>.</li><li>Every code block on these slides is already in your notebook, so you don't copy or type any code. Just press <b>Run</b> on each cell when a slide asks you to.</li></ol><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p>This notebook doesn't use Gemini, so you don't need your API key. It only finds chunks; it never writes an answer.</p></div>

t.&quot;)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>pymupdf.open(pdf_path)</code> opens the PDF, and <code>page.get_text()</code> reads each page's text. The pages are joined into one string, <code>text</code>.</li><li><code>len(text.split())</code> counts the words.</li></ul>

<template id="t9">
<p class="p">Press <b>Run</b> on the cell with the heading <code class="nw"># STEP 4</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 4: Configure the Embedding Model</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Setting up the model that converts text into numerical vectors.</span><span class="ln" style="--i:0ch"># We&#x27;re using MiniLM-L6-v2, a fast and efficient embedding model.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Embeddings are the foundation of semantic search. They allow</span><span class="ln" style="--i:0ch"># us to find text chunks that are semantically similar to our</span><span class="ln" style="--i:0ch"># query, even if they don&#x27;t share exact keywords.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># Model download progress on first run, then silence on success.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">embed_model = HuggingFaceEmbedding(model_name=&quot;sentence-transformers/all-MiniLM-L6-v2&quot;)</span><span class="ln" style="--i:0ch">Settings.embed_model = embed_model</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>HuggingFaceEmbedding(...)</code> loads MiniLM, the embedding model you met in the last reading. It turns text into a list of numbers.</li><li><code>Settings.embed_model = embed_model</code> tells LlamaIndex to use it for every chunk and question.</li></ul>
</template>

<template id="t11">
<p class="p">Press <b>Run</b> on the cell with the heading <code class="nw"># STEP 5</code>: Here is the top of it:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 5: Split Document into Chunks and Build Index</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># 1. Breaking the document into small, overlapping chunks</span><span class="ln" style="--i:0ch"># 2. Converting each chunk into a vector embedding</span><span class="ln" style="--i:0ch"># 3. Storing all vectors in a searchable index</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># - Small chunks (50 tokens) allow precise retrieval</span><span class="ln" style="--i:0ch"># - Overlap (50 tokens) prevents information loss at boundaries</span><span class="ln" style="--i:0ch"># - The index enables fast similarity search</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># Progress messages as chunks are processed and indexed.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Define a sentence splitter (chunk_size and chunk_overlap in tokens)</span><span class="ln" style="--i:0ch">text_splitter = SentenceSplitter(chunk_size=50, chunk_overlap=50)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>SentenceSplitter(chunk_size=50, chunk_overlap=50)</code> makes a splitter that cuts text into chunks of up to 50 tokens (a token is a word or part of a word).</li></ul>
</template>

<template id="t12">
<p class="p">Here's the rest of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># Turn raw text into a list of Document objects</span><span class="ln" style="--i:0ch">documents = [Document(text=text)]</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Convert into nodes (smaller chunks)</span><span class="ln" style="--i:0ch">nodes = text_splitter.get_nodes_from_documents(documents)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">print(f&quot;Created {len(nodes)} chunks from the document.&quot;)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch"># Build the vector index from these nodes</span><span class="ln" style="--i:0ch">index = VectorStoreIndex(nodes)</span><span class="ln" style="--i:0ch">print(&quot;Vector index built successfully!&quot;)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>get_nodes_from_documents</code> cuts the text into chunks. LlamaIndex calls them nodes.</li><li><code>VectorStoreIndex(nodes)</code> embeds every chunk with MiniLM and keeps the embeddings, so it can search them.</li></ul>
</template>

<template id="t14">
<p class="p"><b>Experiment 1: Top-K Retrieval.</b> Top-K controls how many chunks are returned.</p><ul class="list"><li>Low K (2-3): More focused, may miss relevant info</li><li>High K (10+): More comprehensive, may include noise</li></ul><p class="p">Try running the same query with a different <code>top_k</code> value: like 2, 5, and 10, and <b>observe what changes</b>. Press <b>Run</b> on the cell with the heading <code class="nw"># STEP 6</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 6: Define Query and Top-K Values to Test</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Setting up a pharmaceutical query and different top_k values</span><span class="ln" style="--i:0ch"># to see how many results affect retrieval quality.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># The right top_k value balances comprehensiveness vs. noise.</span><span class="ln" style="--i:0ch"># Too few results may miss important info; too many dilute relevance.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># We&#x27;ll compare results for top_k = 2, 5, and 10.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">query = &quot;What test methods were used for quality control?&quot;</span><span class="ln" style="--i:0ch">top_k_values = [2, 5, 10]</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>query</code> holds the question, and <code>top_k_values</code> the three values to try.</li></ul><p class="p see"><b>What you'll see in Colab:</b></p><p class="p">No output, just a green tick.</p>
</template>

<template id="t15">
<p class="p">In your code, look for where you define the retriever: the line <code>retriever = index.as_retriever(similarity_top_k=top_k)</code>. Press <b>Run</b> on the cell with the heading <code class="nw"># STEP 7</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 7: Run Top-K Experiment</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Retrieving chunks for each top_k value and displaying results.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># This shows you exactly how top_k affects what information</span><span class="ln" style="--i:0ch"># your RAG system will use to generate answers.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># For each top_k value, you&#x27;ll see the retrieved chunks.</span><span class="ln" style="--i:0ch"># Notice how higher K values bring in more (but less relevant) results.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">for top_k in top_k_values:</span><span class="ln" style="--i:4ch">    print(f&quot;\n{&#x27;=&#x27;*60}&quot;)</span><span class="ln" style="--i:4ch">    print(f&quot;Results for top_k = {top_k}&quot;)</span><span class="ln" style="--i:4ch">    print(f&quot;{&#x27;=&#x27;*60}&quot;)</span><span class="ln" style="--i:4ch">    retriever = index.as_retriever(similarity_top_k=top_k)</span><span class="ln" style="--i:4ch"> <template id="t21">
<p class="p"><b>Experiment 2: Similarity Thresholds.</b> Thresholds filter out low-quality matches.</p><ul class="list"><li>Higher threshold: Only very relevant chunks pass</li><li>Lower threshold: More chunks pass, including marginal matches</li></ul><p class="p">Let's say you've already retrieved the top 10 chunks. Press <b>Run</b> on the cell with the heading <code class="nw"># STEP 8</code>:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 8: Retrieve Chunks for Threshold Filtering</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Getting the top 10 chunks so we have a pool to filter from.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># We need to retrieve chunks first, then we can apply score</span><span class="ln" style="--i:0ch"># thresholds to filter out low-relevance results.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># 10 chunks retrieved, each with a similarity score.</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">retriever = index.as_retriever(similarity_top_k=10)</span><span class="ln" style="--i:0ch">retrieved_nodes = retriever.retrieve(query)</span><span class="ln" style="--i:0ch"></span><span class="ln" style="--i:0ch">print(f&quot;Retrieved {len(retrieved_nodes)} chunks. Score range: {retrieved_nodes[-1].score:.3f} - {retrieved_nodes[0].score:.3f}&quot;)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li><code>retrieved_nodes</code> keeps the top 10 chunks, so the next cell can filter them.</li><li>The print shows the lowest score (the last chunk) and the highest (the first).</li></ul><p class="p see"><b>What you'll see in Colab:</b></p><figure class="shot fit" style="--mh:60px"><a href="pfizer3-p6-m3-run-09.png" target="_blank" rel="noopener noreferrer"><img src="pfizer3-p6-m3-run-09.png" width="1000" height="54" alt="The output under the STEP 8 cell in Colab: Retrieved 10 chunks. Score range: 0.227 - 0.332"><span class="sr-only"> (opens the picture full size in a new tab)</span></a></figure>
</template>

<template id="t22">
<p class="p">Your scores run from <b>0.227</b> to <b>0.332</b>. That's the range to pick a threshold from.</p><p class="p">Your notebook's note says MiniLM scores typically range 0.1 to 0.4. On the supplier file, for this question, all 10 scores sit between 0.227 and 0.332, so a threshold of 0.20 or lower keeps every chunk. That's why your notebook tries 0.20, 0.25 and 0.30.</p><div class="tip"><span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p>A threshold (or cut-off) is the lowest score a chunk needs to be kept.</p></div>

<template id="t23">
<p class="p">This experiment shows you how to <b>manually apply a similarity threshold</b> to <b>filter out weak matches</b>.</p><p class="p">Now, add a <b>manual filtering step</b> to remove chunks with a score lower than a threshold. Your notebook tries three: 0.20, 0.25 and 0.30. Press <b>Run</b> on the cell with the heading <code class="nw"># STEP 9</code>: Here is the top of it:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; top of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch"># STEP 9: Apply Different Similarity Thresholds</span><span class="ln" style="--i:0ch"># ============================================</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT WE&#x27;RE DOING:</span><span class="ln" style="--i:0ch"># Filtering chunks based on their similarity scores.</span><span class="ln" style="--i:0ch"># We test thresholds of 0.20, 0.25, and 0.30.</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHY THIS MATTERS:</span><span class="ln" style="--i:0ch"># Thresholds help you control quality vs. quantity tradeoff.</span><span class="ln" style="--i:0ch"># - 0.20: Permissive - includes marginally relevant chunks</span><span class="ln" style="--i:0ch"># - 0.25: Moderate - good balance for most use cases</span><span class="ln" style="--i:0ch"># - 0.30: Strict - only highly relevant chunks pass</span><span class="ln" style="--i:0ch">#</span><span class="ln" style="--i:0ch"># WHAT YOU&#x27;LL SEE:</span><span class="ln" style="--i:0ch"># Different numbers of chunks passing each threshold.</span><span class="ln" style="--i:0ch"># Higher thresholds = fewer but more relevant results.</span><span class="ln" style="--i:0ch"># ============================================</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>The comments name the three thresholds, from the most permissive to the strictest.</li></ul>
</template>

<template id="t24">
<p class="p">Here's the rest of the same cell:</p><figure class="run"><div class="code-head"><span class="code-lang">Python &middot; in your notebook &middot; rest of the cell</span></div><pre tabindex="0"><code><span class="ln" style="--i:0ch">for threshold in [0.20, 0.25, 0.30]:</span><span class="ln" style="--i:4ch">    filtered_nodes = [node for node in retrieved_nodes if node.score and node.score &gt; threshold]</span><span class="ln" style="--i:4ch">    print(f&quot;\n{&#x27;=&#x27;*60}&quot;)</span><span class="ln" style="--i:4ch">    print(f&quot;Threshold = {threshold}&quot;)</span><span class="ln" style="--i:4ch">    print(f&quot;{&#x27;=&#x27;*60}&quot;)</span><span class="ln" style="--i:4ch">    print(f&quot;Filtered {len(filtered_nodes)} out of {len(retrieved_nodes)} total chunks.&quot;)</span><span class="ln" style="--i:4ch">    for i, node in enumerate(filtered_nodes):</span><span class="ln" style="--i:8ch">        print(f&quot;\nChunk {i+1} (Score: {node.score:.3f}):&quot;)</span><span class="ln" style="--i:8ch">        print(node.get_text())</span><span class="ln" style="--i:8ch">        print(&quot;-&quot; * 50)</span></code></pre></figure><p class="p"><b>What this code does:</b></p><ul class="list"><li>The loop runs once for each threshold.</li><li><code>[node for node in retrieved_nodes if ...]</code> keeps only the chunks whose score is above the threshold.</li><li>It prints how many chunks are left, then each one with its score.</li></ul>
</template>

==========================\n# STEP 9: Apply Different Similarity Thresholds\n# ============================================\n#\n# WHAT WE'RE DOING:\n# Filtering chunks based on their similarity scores.\n# We test thresholds of 0.20, 0.25, and 0.30.\n#\n# WHY THIS MATTERS:\n# Thresholds help you control quality vs. quantity tradeoff.\n# - 0.20: Permissive - includes marginally relevant chunks\n# - 0.25: Moderate - good balance for most use cases\n# - 0.30: Strict - only highly relevant chunks pass\n#\n# WHAT YOU'LL SEE:\n# Different numbers of chunks passing each threshold.\n# Higher thresholds = fewer but more relevant results.\n# ============================================\n\nfor threshold in [0.20, 0.25, 0.30]:\n    filtered_nodes = [node for node in retrieved_nodes if node.score and node.score > threshold]\n    print(f\"\\n{'='*60}\")\n    print(f\"Threshold = {threshold}\")\n    print(f\"{'='*60}\")\n    print(f\"Filtered {len(filtered_nodes)} out of {len(retrieved_nodes)} total chunks.\")\n    for i, node in enumerate(filtered_nodes):\n        print(f\"\\nChunk {i+1} (Score: {node.score:.3f}):\")\n        print(node.get_text())\n        print(\"-\" * 50)", "step10": "# ============================================\n# STEP 10: Define Experiment Configurations\n# ============================================\n#\n# WHAT WE'RE DOING:\n# Setting up three different retrieval configurations to compare.\n#\n# WHY THIS MATTERS:\n# Real-world RAG systems need tuned parameters. These experiments\n# help you understand the tradeoffs.\n#\n# Configurations:\n# 1. top_k=5, no threshold - Get 5 best chunks regardless of score\n# 2. top_k=8, threshold=0.25 - Get up to 8, but filter weak matches\n# 3. top_k=5, threshold=0.30 - Conservative: few chunks, high quality\n# ============================================\n\nexperiments = [\n    {\"top_k\": 5, \"threshold\": None},\n    {\"top_k\": 8, \"threshold\": 0.25},\n    {\"top_k\": 5, \"threshold\": 0.30},\n]", "step11": "# =======   }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a slide. Spare height widens the gaps
     between blocks, up to 2x. */
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = ""; inner.style.marginTop = "";
    var cs = getComputedStyle(card);
    var avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var base = parseFloat(getComputedStyle(inner).rowGap) || 14;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (base + Math.min(base, spare / gaps)) + "px";
    /* P5 m2 fix round 1: what is still spare after the gaps widen is split above and below, so a short slide sits in
       the middle of the card instead of leaving one big empty area at the bottom */
    var left = avail - inner.offsetHeight;
    if (left > 1) inner.style.marginTop = Math.floor(left / 2) + "px";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    space();
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  /* Test hook: #slide=N opens slide N directly */
  var hm = location.hash.match(/slide=(\d+)/);
  if (hm) i = Math.min(SLIDES.length - 1, Math.max(0, +hm[1] - 1));
  window.addEventListener("resize", function () { scaleStage(); space(); });
  scaleStage();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(space);
})();
</script>
</body>
</html>
