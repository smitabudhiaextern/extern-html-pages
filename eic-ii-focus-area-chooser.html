<!DOCTYPE html>
<!--
  EIC Heritage — Focus-Area Chooser (5-question quiz)
  Answer 5 quick questions and get your top 3 best-fit focus areas out of the 13.
  Sibling of eic-ii-focus-area-explorer.html — same 13 focus areas, same brand, same feel.

  SELF-CONTAINED: inline CSS + vanilla JS + inline SVG. ZERO external requests (no CDN, no web
  fonts, no external images). System font stack. Fixed 960x540, never scrolls in any state.

  TO EDIT CONTENT: everything lives in the FOCUS and QUESTIONS data objects below.
  Each answer option adds +1 to the focus-area ids listed in its "add" array.
  Ties are broken by each focus area's natural order (F1 first ... B13 last).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EIC Heritage Focus-Area Chooser</title>
<style>
  :root{
    --bg:#FDF8F8; --ink:#1C1B1B; --body:#484646; --accent:#001D69;
    --hl:#DCE1FF; --white:#FFFFFF; --line:#ECE6EE; --muted:#8A8693;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
  }
  #stage{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;}
  #wrapper{
    width:960px;height:540px;position:relative;overflow:hidden;
    background:var(--bg);transform-origin:top center;
  }

  /* ---- title bar ---- */
  .titlebar{height:50px;display:flex;align-items:center;gap:11px;padding:0 24px;border-bottom:1px solid var(--line);}
  .tb-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tb-mark svg{width:17px;height:17px;}
  .tb-title{font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:.1px;}
  .tb-title span{font-weight:500;color:var(--muted);}

  /* ---- screen holder ---- */
  #screen{height:490px;position:relative;}

  /* ---- shared buttons ---- */
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:13px 26px;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:filter .12s ease,transform .06s ease;}
  .btn:hover{filter:brightness(1.15);}
  .btn:active{transform:translateY(1px);}
  .btn svg{width:18px;height:18px;}
  .btn-ghost{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1.5px solid #D9D3E1;color:var(--accent);border-radius:11px;padding:10px 18px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:border-color .12s ease,background .12s ease;}
  .btn-ghost:hover{border-color:var(--accent);background:#F7F5FF;}
  .btn-ghost svg{width:16px;height:16px;}
  .backbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--accent);padding:2px 0;}
  .backbtn svg{width:16px;height:16px;}
  .backbtn:hover{text-decoration:underline;}

  /* ---- INTRO ---- */
  .intro{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 96px;}
  .intro-ico{width:56px;height:56px;border-radius:15px;background:var(--hl);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
  .intro-ico svg{width:28px;height:28px;}
  .intro-h{font-size:28px;font-weight:800;color:var(--ink);line-height:1.15;margin-bottom:13px;}
  .intro-p{font-size:15px;color:var(--body);line-height:1.6;max-width:600px;margin-bottom:28px;}
  .intro-p b{color:var(--ink);font-weight:700;}

  /* ---- QUIZ ---- */
  .quiz{height:100%;display:flex;flex-direction:column;padding:20px 40px 18px;}
  .progress{display:flex;align-items:center;gap:14px;margin-bottom:15px;}
  .q-count{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.4px;white-space:nowrap;}
  .q-bar{display:flex;gap:6px;flex:1;}
  .seg{height:5px;border-radius:99px;background:var(--line);flex:1;transition:background .18s ease;}
  .seg.on{background:var(--accent);}
  .q-title{font-size:22px;font-weight:800;color:var(--ink);line-height:1.22;margin-bottom:16px;}
  .opts{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:13px;}
  .opt{display:flex;align-items:center;gap:14px;background:var(--white);border:1.5px solid #EAE4EE;border-radius:13px;padding:0 18px;cursor:pointer;font-family:inherit;text-align:left;transition:border-color .12s ease,background .12s ease,transform .06s ease;}
  .opt:hover{border-color:var(--accent);background:#F7F5FF;transform:translateY(-1px);}
  .opt.is-selected{border-color:var(--accent);background:var(--hl);}
  .opt-badge{width:29px;height:29px;border-radius:8px;background:var(--hl);color:var(--accent);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s ease,color .12s ease;}
  .opt.is-selected .opt-badge{background:var(--accent);color:#fff;}
  .opt-txt{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.3;}
  .q-foot{margin-top:15px;}

  /* ---- RESULTS ---- */
  .res{height:100%;display:flex;flex-direction:column;padding:19px 34px 17px;}
  .res-head{margin-bottom:13px;}
  .res-h{font-size:23px;font-weight:800;color:var(--ink);line-height:1.15;margin-bottom:2px;}
  .res-hsub{font-size:12.5px;color:var(--muted);}
  .res-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1;min-height:0;}
  .rcard{background:var(--white);border:1.5px solid #EAE4EE;border-radius:14px;padding:15px 16px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .rcard.top{border-color:var(--accent);background:#FBFAFF;box-shadow:0 4px 14px rgba(0,29,105,.10);}
  .rrank{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:7px;background:var(--hl);color:var(--accent);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .rcard.top .rrank{background:var(--accent);color:#fff;}
  .rzone{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--accent);background:var(--hl);padding:4px 9px 4px 8px;border-radius:99px;margin-bottom:11px;max-width:calc(100% - 30px);}
  .rzone svg{width:13px;height:13px;flex-shrink:0;}
  .rname{font-size:16px;font-weight:800;color:var(--ink);line-height:1.2;margin-bottom:9px;}
  .rhook{font-size:12.5px;color:#6A6672;line-height:1.42;}
  .res-note{font-size:12.5px;color:var(--body);line-height:1.5;margin:13px 0 12px;}
  .res-note b{color:var(--ink);font-weight:700;}
  .res-foot{display:flex;justify-content:flex-start;}
</style>
</head>
<body>
<div id="stage">
  <div id="wrapper">

    <!-- TITLE BAR -->
    <div class="titlebar">
      <div class="tb-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 7 6 10.5A6 6 0 0 1 6 13.5C6 10 9 7 12 3z"/></svg>
      </div>
      <div class="tb-title">EIC Heritage's focus areas <span>&middot; find your fit</span></div>
    </div>

    <!-- SCREEN (swapped by JS) -->
    <div id="screen"></div>

  </div>
</div>

<script>
/* =====================================================================
   ICONS — inline line-icons (Phosphor-style). Edit-safe.
   ===================================================================== */
const ICONS = {
  search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>`,
  drill:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="13"/><path d="M8 9l4 4 4-4"/><line x1="5" y1="20" x2="19" y2="20"/></svg>`,
  drop:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 7 6 10.5A6 6 0 0 1 6 13.5C6 10 9 7 12 3z"/></svg>`,
  chip:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><line x1="10" y1="7" x2="10" y2="4"/><line x1="14" y1="7" x2="14" y2="4"/><line x1="10" y1="20" x2="10" y2="17"/><line x1="14" y1="20" x2="14" y2="17"/><line x1="7" y1="10" x2="4" y2="10"/><line x1="7" y1="14" x2="4" y2="14"/><line x1="20" y1="10" x2="17" y2="10"/><line x1="20" y1="14" x2="17" y2="14"/></svg>`,
  chevR:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`,
  chevL:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>`,
  target:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="0.6" fill="currentColor" stroke="none"/></svg>`,
  refresh:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v4.5h-4.5"/></svg>`
};

/* =====================================================================
   DATA 1 — the 13 focus areas (exact names + zone + hook from the explorer).
   "order" gives the natural order used to break score ties (F1 first ... B13 last).
   ===================================================================== */
const FOCUS = {
  F1:{order:0,  zone:"FIND IT",  icon:"search", name:"Geology, geophysics & advanced imaging",                              hook:"See the oil hidden deep in the rock, without drilling everywhere."},
  F2:{order:1,  zone:"FIND IT",  icon:"search", name:"Reservoir characterization, geochemistry & improved predictions",     hook:"Work out how much oil is really down there, and if it will flow."},
  F3:{order:2,  zone:"FIND IT",  icon:"search", name:"Subsurface digital twin & economic evaluation",                       hook:"Test your drilling plan on a computer before spending a cent."},
  F4:{order:3,  zone:"FIND IT",  icon:"search", name:"Land, mineral & royalty rights",                                      hook:"Find out who legally owns the oil, in seconds not weeks."},
  D5:{order:4,  zone:"DRILL IT", icon:"drill",  name:"Drilling",                                                            hook:"Drill miles down, then steer the hole sideways through rock."},
  D6:{order:5,  zone:"DRILL IT", icon:"drill",  name:"Completion",                                                          hook:"Crack the rock and prop it open so the oil can flow in."},
  M7:{order:6,  zone:"MILK IT",  icon:"drop",   name:"Production",                                                          hook:"Keep a tired well pumping, and reach the oil left behind."},
  M8:{order:7,  zone:"MILK IT",  icon:"drop",   name:"Produced-water treatment, re-use & handling",                        hook:"Clean and re-use the flood of salty water that comes up too."},
  M9:{order:8,  zone:"MILK IT",  icon:"drop",   name:"Field gas to value",                                                  hook:"Catch the gas that used to be burned off, and turn it into power or fuel."},
  B10:{order:9, zone:"THE BRAIN",icon:"chip",   name:"AI/ML analytics & predictive modeling",                              hook:"Predict which machine is about to fail before it does."},
  B11:{order:10,zone:"THE BRAIN",icon:"chip",   name:"Autonomous systems & robotics",                                       hook:"Send robot dogs to patrol the dangerous spots, so people don't have to."},
  B12:{order:11,zone:"THE BRAIN",icon:"chip",   name:"Computer vision, advanced sensing & imaging",                        hook:"Catch a hairline crack or leak a human eye would miss."},
  B13:{order:12,zone:"THE BRAIN",icon:"chip",   name:"Operations software & digital twins",                                hook:"Watch and run hundreds of wells from a single screen."}
};

/* =====================================================================
   DATA 2 — the 5 questions. Each option's "add" list = +1 to those focus ids.
   ===================================================================== */
const QUESTIONS = [
  {
    q:"What kind of problem pulls you in most?",
    options:[
      {text:"Uncovering what's hidden underground",        add:["F1","F2","F3","B12"]},
      {text:"Building machines and making them work",       add:["D5","D6","B11"]},
      {text:"Squeezing more out of what already exists",    add:["M7","D6","B10"]},
      {text:"Turning things into software and automation",  add:["B10","B13","F3","B11"]}
    ]
  },
  {
    q:"You'd rather spend your day with…",
    options:[
      {text:"Data, maps, and predictions",                 add:["F2","F3","B10","B13"]},
      {text:"Physical equipment out in the field",          add:["D5","D6","M7"]},
      {text:"AI, robots, and cameras",                      add:["B10","B11","B12"]},
      {text:"Ownership, deals, and the big picture",        add:["F4","B13"]}
    ]
  },
  {
    q:"Which win would feel best?",
    options:[
      {text:"Spotting the thing everyone else missed",      add:["F1","F2","B12"]},
      {text:"Getting a tough build to finally work",        add:["D5","D6","M9"]},
      {text:"Cutting waste and cleaning up a mess",         add:["M8","M9","M7"]},
      {text:"A dashboard that runs the whole operation",    add:["B13","B10"]}
    ]
  },
  {
    q:"How into cutting-edge tech are you?",
    options:[
      {text:"Give me the newest AI and robots",             add:["B10","B11","B12"]},
      {text:"I love proven, hands-on engineering",          add:["D5","D6","M7"]},
      {text:"I care most about the analysis and the numbers",add:["F2","F4","B10"]},
      {text:"I like sustainability and doing more with less",add:["M8","M9"]}
    ]
  },
  {
    q:"At the end, you'd be proudest of…",
    options:[
      {text:"Finding a problem worth millions",             add:["F1","F2","F4"]},
      {text:"Making an operation cleaner and greener",       add:["M8","M9"]},
      {text:"Building a tool people actually use",           add:["B11","B13","D5"]},
      {text:"Making a tired well or field far more efficient",add:["M7","D6","B10"]}
    ]
  }
];

/* =====================================================================
   ENGINE
   ===================================================================== */
const screen = document.getElementById("screen");
const LETTERS = ["A","B","C","D"];
let qi = 0;                                  // current question index
let answers = [null,null,null,null,null];    // chosen option index per question

/* ---- INTRO ---- */
function renderIntro(){
  screen.innerHTML = `
    <div class="intro">
      <div class="intro-ico">${ICONS.target}</div>
      <h1 class="intro-h">Which focus area fits you?</h1>
      <p class="intro-p">Answer <b>5 quick questions</b> and we'll point you to the focus areas that fit how you think. There's no wrong answer, and you can pick any of the 13.</p>
      <button class="btn" data-action="start">Start ${ICONS.chevR}</button>
    </div>`;
}

/* ---- QUIZ ---- */
function renderQuiz(){
  const item = QUESTIONS[qi];
  const segs = QUESTIONS.map((_,i)=>`<div class="seg ${i<=qi?"on":""}"></div>`).join("");
  const opts = item.options.map((o,i)=>`
    <button class="opt ${answers[qi]===i?"is-selected":""}" data-opt="${i}">
      <span class="opt-badge">${LETTERS[i]}</span>
      <span class="opt-txt">${o.text}</span>
    </button>`).join("");
  screen.innerHTML = `
    <div class="quiz">
      <div class="progress">
        <span class="q-count">Question ${qi+1} of ${QUESTIONS.length}</span>
        <span class="q-bar">${segs}</span>
      </div>
      <h2 class="q-title">${item.q}</h2>
      <div class="opts">${opts}</div>
      <div class="q-foot">
        <button class="backbtn" data-action="back">${ICONS.chevL} ${qi===0?"Back to start":"Previous question"}</button>
      </div>
    </div>`;
}

/* ---- SCORING ---- */
function computeTop3(){
  const score = {};
  Object.keys(FOCUS).forEach(id=>score[id]=0);
  answers.forEach((optIdx,q)=>{
    if(optIdx==null) return;
    QUESTIONS[q].options[optIdx].add.forEach(id=>{ if(id in score) score[id]++; });
  });
  const ranked = Object.keys(FOCUS).sort((a,b)=>{
    if(score[b]!==score[a]) return score[b]-score[a];   // higher score first
    return FOCUS[a].order - FOCUS[b].order;             // tie -> natural order F1..B13
  });
  return ranked.slice(0,3).map(id=>({id, ...FOCUS[id], score:score[id]}));
}

/* ---- RESULTS ---- */
function renderResults(){
  const top = computeTop3();
  const cards = top.map((f,i)=>`
    <div class="rcard ${i===0?"top":""}">
      <span class="rrank">${i+1}</span>
      <span class="rzone">${ICONS[f.icon]} ${f.zone}</span>
      <div class="rname">${f.name}</div>
      <div class="rhook">${f.hook}</div>
    </div>`).join("");
  screen.innerHTML = `
    <div class="res">
      <div class="res-head">
        <h2 class="res-h">Your top matches</h2>
        <div class="res-hsub">Ranked by how you answered the 5 questions.</div>
      </div>
      <div class="res-cards">${cards}</div>
      <p class="res-note"><b>Pick the one you're most interested in</b> for the rest of the program. Not feeling these three? You can choose any of the 13. The explorer has them all.</p>
      <div class="res-foot">
        <button class="btn-ghost" data-action="restart">${ICONS.refresh} Start over</button>
      </div>
    </div>`;
}

/* ---- CLICK HANDLING (event delegation) ---- */
screen.addEventListener("click", e=>{
  // answer option
  const opt = e.target.closest("[data-opt]");
  if(opt){
    const idx = +opt.getAttribute("data-opt");
    answers[qi] = idx;
    screen.querySelectorAll(".opt").forEach(o=>o.classList.remove("is-selected"));
    opt.classList.add("is-selected");   // brief accent flash before advancing
    setTimeout(()=>{
      if(qi < QUESTIONS.length-1){ qi++; renderQuiz(); }
      else { renderResults(); }
    },210);
    return;
  }
  // action buttons
  const act = e.target.closest("[data-action]");
  if(!act) return;
  const a = act.getAttribute("data-action");
  if(a==="start"){ qi=0; renderQuiz(); }
  else if(a==="back"){ if(qi>0){ qi--; renderQuiz(); } else { renderIntro(); } }
  else if(a==="restart"){ answers=[null,null,null,null,null]; qi=0; renderIntro(); }
});

/* ---- scale-to-fit (Notion embeds are ~700-900px wide) ---- */
function scaleDeck(){
  const w = document.getElementById("wrapper");
  const s = Math.min(window.innerWidth/960, window.innerHeight/540, 1);
  w.style.transform = `scale(${s})`;
  w.style.transformOrigin = "top center";
}
window.addEventListener("resize", scaleDeck);
scaleDeck();
renderIntro();
</script>
</body>
</html>
