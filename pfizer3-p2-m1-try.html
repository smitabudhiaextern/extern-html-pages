<!-- Real Python in the browser: Pyodide 0.26.4 (CPython 3.12), the same pinned version and CDN as the SME's lesson
     templates (chaitanyabaweja/pfizer-lesson-templates, shared/py-worker.js). It runs in a Web Worker, so a loop that
     never ends can't freeze the page. -->
<style>
/* Pfizer x Extern Core, Light format, for the frame (buttons, done messages, footer). Tokens from design-system/tokens.json.
   The notebook area is a Google Colab look-alike (light theme): its syntax and traceback colours are Colab's own,
   kept under --colab-* so they never leak into the frame.
   Fixed design stage, 760 x STAGE_H px, scaled to fit the embed frame (same approach as the P1 decks). Nothing scrolls. */
:root{
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --extern-black:#000000;
  --extern-white:#ffffff;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:var(--extern-white);
  --surface-card:var(--blue-50);
  --surface-icon:var(--extern-white);
  --ink:var(--extern-black);
  --ink-muted:var(--gray-800);
  --card-title:var(--extern-black);
  --card-text:var(--gray-800);
  --highlight:var(--green-600);
  --action:var(--extern-black);
  --on-action:var(--extern-white);
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;

  /* Colab look-alike (light theme) */
  --colab-cell:#f7f7f7;
  --colab-cell-line:#e0e0e0;
  --colab-gutter-ink:#616161;
  --colab-kw:#0000ff;
  --colab-ctrl:#af00db;
  --colab-str:#a31515;
  --colab-num:#098658;
  --colab-com:#008000;
  --colab-fn:#795e26;
  --colab-red:#c5221f;
  --colab-green:#188038;
  --colab-cyan:#007b83;
  --colab-stderr:#fdeded;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* The fixed stage. JavaScript sets one uniform scale and centres it in the frame. */
.app{position:absolute;left:0;top:0;width:760px;height:780px;display:flex;flex-direction:column;transform-origin:0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}

/* Colab chrome: notebook name, menu, toolbar */
.chrome{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px 6px 12px}
.nbicon{width:34px;height:34px;flex:none;border-radius:var(--radius-xs);background:var(--surface-card);display:grid;place-items:center;color:var(--ink)}
.nbicon svg{width:18px;height:18px}
.fnwrap{min-width:0;flex:1 1 auto}
.fname{display:flex;align-items:center;gap:8px;font-size:17px;line-height:22px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden}
.fname span{overflow:hidden;text-overflow:ellipsis}
.fname svg{width:16px;height:16px;flex:none;color:var(--gray-600)}
.menu{display:flex;gap:14px;margin-top:2px;font-size:13px;line-height:18px;color:var(--gray-800)}
.where{flex:none;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}

.toolbar{flex:none;display:flex;align-items:center;gap:6px;padding:4px 16px 6px 12px;border-bottom:1px solid var(--line)}
.fake{display:inline-flex;align-items:center;gap:4px;font-size:13px;line-height:18px;font-weight:500;color:var(--gray-800);padding:4px 8px;border-radius:6px}
.fake svg{width:12px;height:12px}
.grow{flex:1 1 auto}
.tbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:16px;font-weight:600;padding:6px 11px;border-radius:var(--radius-xs);border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.tbtn svg{width:13px;height:13px;flex:none}
.tbtn:hover:not(:disabled){background:var(--gray-50)}
.tbtn:disabled{opacity:.4;cursor:default}
.conn{display:inline-flex;align-items:center;gap:6px;margin-left:6px;font-size:12.5px;line-height:16px;color:var(--ink-muted);white-space:nowrap}
.conn i{width:9px;height:9px;border-radius:50%;background:var(--blue-200);flex:none}
.conn.ready i{background:var(--green-600)}
.conn.failed i{background:var(--colab-red)}
.conn.loading i{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* Body: thin Colab side rail plus the notebook */
.body{flex:1 1 auto;min-height:0;display:flex}
.rail{flex:none;width:40px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px;color:var(--gray-600)}
.rail svg{width:18px;height:18px}
.nb{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden;padding:12px 16px 8px 6px}
.nb.overflow{overflow-y:auto}
.screen{display:flex;flex-direction:column;gap:10px}

/* Text cells */
.tcell{padding:2px 6px 2px 50px;font-size:14.5px;line-height:1.55;color:var(--ink)}
.tcell p{margin:0}
.tcell p+p,.tcell p+ul,.tcell ul+p,.tcell p+ol,.tcell ol+p{margin-top:6px}
.tcell h2{margin:0 0 2px;font-size:19px;line-height:1.3;font-weight:600}
.tcell h3{margin:0 0 2px;font-size:16.5px;line-height:1.3;font-weight:600}
.tcell ul,.tcell ol{margin:0;padding-left:22px}
.tcell code{font-family:var(--font-mono);font-size:.9em;background:var(--colab-cell);border:1px solid var(--colab-cell-line);border-radius:4px;padding:0 4px}
.tcell b,.tcell strong{font-weight:600}
.tcell a{color:var(--pfizer-blue)}

/* Code cells */
.ccell{display:flex;gap:6px;align-items:flex-start}
.cgut{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:3px}
.run{position:relative;width:30px;height:30px;border-radius:50%;border:0;background:var(--action);color:var(--on-action);display:grid;place-items:center;cursor:pointer;padding:0}
.run svg{width:11px;height:11px;margin-left:2px}
.run:hover{background:var(--gray-800)}
.run.busy{background:var(--gray-600)}
.run.busy svg{display:none}
.run.busy::before{content:"";width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cnt{font:11.5px/1 var(--font-mono);color:var(--colab-gutter-ink);white-space:nowrap}
.cmain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}

.ed{position:relative;background:var(--colab-cell);border:1px solid var(--colab-cell-line);border-radius:6px}
.ed:focus-within{border-color:var(--pfizer-blue);box-shadow:0 0 0 1px var(--pfizer-blue)}
.ed.ro{background:#fafafa}
.mirror,.ta{margin:0;border:0;padding:8px 12px;font-family:var(--font-mono);font-size:13px;line-height:20px;font-weight:400;letter-spacing:0;word-spacing:0;tab-size:4;-moz-tab-size:4;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;text-indent:0;text-transform:none}
.mirror{position:relative;color:#000;pointer-events:none;min-height:36px}
.ta{position:absolute;inset:0;width:100%;height:100%;display:block;resize:none;outline:none;overflow:hidden;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#000}
.ta::selection{background:rgba(0,51,160,.18);color:transparent;-webkit-text-fill-color:transparent}
.ta:focus-visible{outline:none}
.mirror .k{color:var(--colab-kw)} .mirror .x{color:var(--colab-ctrl)} .mirror .s{color:var(--colab-str)}
.mirror .n{color:var(--colab-num)} .mirror .c{color:var(--colab-com)} .mirror .f{color:var(--colab-fn)}
.mirror .l.err{background:rgba(197,34,31,.08)}

/* Hint and answer row */
.tools{display:flex;gap:8px;justify-content:flex-end}
.lbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;line-height:15px;font-weight:600;padding:4px 10px;border-radius:var(--radius-xs);border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.lbtn svg{width:12px;height:12px;flex:none}
.lbtn[aria-expanded="true"]{background:var(--action);color:var(--on-action)}
.panel{background:var(--surface-card);border-radius:var(--radius-xs);padding:10px 12px;font-size:14px;line-height:1.5;color:var(--card-text);display:flex;flex-direction:column;gap:8px}
.panel .ptitle{font-weight:600;color:var(--card-title)}
.panel p{margin:0}
.panel code{font-family:var(--font-mono);font-size:.92em}
.panel pre{margin:0;background:var(--surface-icon);border-radius:6px;padding:8px 10px;font:13px/20px var(--font-mono);color:#000;white-space:pre-wrap;overflow-wrap:anywhere}
.pbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:16px;font-weight:600;padding:7px 12px;border-radius:var(--radius-xs);border:1.5px solid var(--action);background:var(--action);color:var(--on-action);cursor:pointer}

/* Output, Colab style */
.out{padding:2px 4px 0 2px}
.out pre{margin:0;font:13px/19px var(--font-mono);color:#000;white-space:pre-wrap;overflow-wrap:anywhere;font-variant-ligatures:none}
.out .stderr{background:var(--colab-stderr)}
.out .note{display:block;margin-top:4px;font-family:var(--font-text);font-size:13px;line-height:1.45;color:var(--gray-600);white-space:normal}
.out .muted{color:var(--gray-600)}
.out .note.wait{margin-top:0}
.tb-red{color:var(--colab-red)} .tb-green{color:var(--colab-green)} .tb-cyan{color:var(--colab-cyan)}
.tb-last{font-weight:700}
.tb-last .tb-red{font-weight:700}
.out.flash{animation:flash .3s ease}
@keyframes flash{from{opacity:.25}to{opacity:1}}

/* Check messages */
.chk{display:flex;gap:8px;align-items:flex-start;border-radius:var(--radius-xs);padding:7px 10px;font-size:13.5px;line-height:1.45}
.chk svg{width:16px;height:16px;flex:none;margin-top:1px}
.chk pre{margin:4px 0 0;font:12.5px/18px var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.chk.pass{background:var(--surface);border:1.5px solid var(--green-600);color:var(--ink);font-weight:600}
.chk.pass svg{color:var(--green-600)}
.chk.notyet{background:var(--gray-50);border-left:3px solid var(--gray-600);color:var(--gray-800)}
.chk.notyet b{font-weight:600;color:var(--ink)}

/* Final done message, then Back and Next */
.donemsg{flex:none;margin:0;display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--green-600)}
.donemsg .retry{margin-left:auto}
.foot{flex:none;padding:10px 16px 14px;display:flex;align-items:center;gap:14px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:19px;font-weight:600;padding:11px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-primary{background:var(--action);color:var(--on-action)}
.btn:disabled{opacity:.35;cursor:default}
.mid{flex:1;min-width:0;text-align:center;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.out.flash,.conn.loading i,.run.busy::before{animation:none}}
</style>
</head>

import ast
import builtins
import codeop
import dis
import errno
import inspect
import io
import json
import linecache
import os
import re
import sys
import time
import tokenize
import traceback

from try_pretty import pretty as _pretty

_MAX_OUT = 20000
_PREFIX = "/tmp/ipython-input-"
_HOME = "/content"
_KERNEL_FILE = __file__

# IPython compiles cells like codeop.Compile: these flags make an unclosed ( or string at the end of a cell
# "SyntaxError: incomplete input", as Colab shows it.
_FLAGS = codeop.Compile().flags
# Pyodide's file system uses Emscripten's error numbers (ENOENT is 44). Colab runs on Linux (ENOENT is 2).
_LINUX_ERRNO = {"EPERM": 1, "ENOENT": 2, "EIO": 5, "EBADF": 9, "EAGAIN": 11, "EACCES": 13, "EBUSY": 16, "EEXIST": 17,
                "EXDEV": 18, "ENOTDIR": 20, "EISDIR": 21, "EINVAL": 22, "EMFILE": 24, "EFBIG": 27, "ENOSPC": 28,
                "ESPIPE": 29, "EROFS": 30, "ENAMETOOLONG": 36, "ENOTEMPTY": 39, "ELOOP": 40}


def _linux_errno(n):
    name = errno.errorcode.get(n) if isinstance(n, int) else None
    return _LINUX_ERRNO.get(name, n)


def _linux_oserror(e):
    """The same error with Linux's error number, so its message reads like Colab's."""
    n = _linux_errno(e.errno)
    if n == e.errno or not isinstance(e.strerror, str):
        return None
    args = (n, e.strerror) + ((e.filename,) if e.filename is not None else ())
    if e.filename2 is not None:
        args += (None, e.filename2)
    return type(e)(*args)


_real_open = io.open


def _try_open(file, mode="r", buffering=-1, encoding=None, errors=None, newline=None, closefd=True, opener=None):
    try:
        return _real_open(file, mode, buffering, encoding, errors, newline, closefd, opener)
    except OSError as e:
        fixed = _linux_oserror(e)
        if fixed is None:
            raise
        fixed._try_linux = True
        raise fixed from None


def _murmur2(text, seed=0xC70F6907):
    """ipykernel's murmur2_x86. Colab names a cell's file /tmp/ipython-input-<this hash of the cell's code>.py"""
    m = 0x5BD1E995
    data = text.encode("utf8")
    length = len(data)
    h = seed ^ length
    end = length & 0xFFFFFFFC
    for i in range(0, end, 4):
        k = data[i] | (data[i + 1] << 8) | (data[i + 2] << 16) | (data[i + 3] << 24)
        k = (k * m) & 0xFFFFFFFF
        k ^= k >> 24
        k = (k * m) & 0xFFFFFFFF
        h = (h * m) & 0xFFFFFFFF
        h ^= k
    rest = length & 3
    k = 0
    if rest == 3:
        k = data[end + 2] << 16
    if rest in (2, 3):
        k |= data[end + 1] << 8
    if rest:
        k |= data[end]
        h ^= k
        h = (h * m) & 0xFFFFFFFF
    h ^= h >> 13
    h = (h * m) & 0xFFFFFFFF
    h ^= h >> 15
    return h


def _emit(kind, text):
    st = _state
    if st["trunc"] or not text:
        return
    if st["size"] + len(text) > _MAX_OUT:
        text = text[: _MAX_OUT - st["size"]]
        st["trunc"] = True
    st["size"] += len(text)
    chunks = st["chunks"]
    if chunks and chunks[-1][0] == kind:
        chunks[-1][1] += text
    else:
        chunks.append([kind, text])


class _Stream(io.TextIOBase):
    def __init__(self, kind):
        self.kind = kind

    @property
    def encoding(self):
        return "utf-8"

    def writable(self):
        return True

    def isatty(self):
        return False

    def write(self, s):
        if not isinstance(s, str):
            raise TypeError("write() argument must be str, not " + type(s).__name__)
        _emit(self.kind, s)
        return len(s)

    def flush(self):
        pass


def _try_input(prompt=""):
    # This notebook can't take typed answers: show the prompt, give back '' and let the page explain.
    sys.stdout.write(str(prompt) + "\n")
    _state["input"] = True
    return ""


_STOP = "the cell ran for {} seconds, so it was stopped. Check for a loop that never ends."


def _trace(frame, event, arg):
    # A loop that never ends: stop the cell after the time limit, like pressing Colab's stop button.
    if frame.f_code.co_filename.startswith(_PREFIX):
        if time.monotonic() > _state["deadline"]:
            raise KeyboardInterrupt(_STOP.format(int(_state["limit"])))
        return _trace_line
    return None


def _trace_line(frame, event, arg):
    if time.monotonic() > _state["deadline"]:
        raise KeyboardInterrupt(_STOP.format(int(_state["limit"])))
    return _trace_line


def _display(value):
    # IPython's displayhook: show the value of a last-line expression with IPython's pretty printer.
    if value is None:
        return
    _ns["_"] = value
    sys.stdout.write(_pretty(value, max_width=79) + "\n")


# ---------- the session ----------
_ns = {}
_builtins_snapshot = None


def _clear_home():
    for root, dirs, files in os.walk(_HOME, topdown=False):
        for f in files:
            try:
                os.remove(os.path.join(root, f))
            except OSError:
                pass
        for d in dirs:
            try:
                os.rmdir(os.path.join(root, d))
            except OSError:
                pass


def reset():
    """Restart: every variable, file and cell source is gone."""
    global _ns
    if _builtins_snapshot is not None:
        b = builtins.__dict__
        b.clear()
        b.update(_builtins_snapshot)
    _ns = {"__name__": "__main__", "__doc__": None, "__package__": None, "__loader__": None,
           "__spec__": None, "__builtins__": builtins}
    for name in [n for n in linecache.cache if n.startswith(_PREFIX)]:
        del linecache.cache[name]
    os.makedirs(_HOME, exist_ok=True)
    _clear_home()
    os.chdir(_HOME)


def _setup():
    global _builtins_snapshot
    builtins.input = _try_input
    builtins.open = io.open = _try_open
    _builtins_snapshot = builtins.__dict__.copy()
    reset()


# ---------- tracebacks, as IPython 7.34 VerboseTB / ListTB print them in Colab ----------
_STDLIB = None


def _display_path(path):
    """Pyodide keeps the standard library at /lib/python3.12 (or inside python312.zip). Colab's is /usr/lib/python3.12."""
    global _STDLIB
    if _STDLIB is None:
        v = "python%d.%d" % sys.version_info[:2]
        z = "python%d%d.zip" % sys.version_info[:2]
        _STDLIB = [("/lib/" + v + "/site-packages/", "/usr/local/lib/" + v + "/dist-packages/"),
                   ("/lib/" + z + "/", "/usr/lib/" + v + "/"),
                   ("/lib/" + v + "/", "/usr/lib/" + v + "/")]
    for a, b in _STDLIB:
        if path.startswith(a):
            return b + path[len(a):]
    return path


def _nullrepr(value, repr=repr):
    return ""


def _frame_entry(tb, context):
    frame = tb.tb_frame
    code = frame.f_code
    file = code.co_filename or "?"
    lnum = tb.tb_lineno or 0
    func = code.co_name
    try:
        args, varargs, varkw, locals_ = inspect.getargvalues(frame)
        call = inspect.formatargvalues(args, varargs, varkw, locals_, formatvalue=_nullrepr)
    except KeyError:
        call = "(***failed resolving arguments***)"
    segs = [["g", _display_path(file)], ["", " in "], ["c", func + call], ["", "\n"]]
    try:
        all_lines = linecache.getlines(file, frame.f_globals)
    except Exception:
        all_lines = []
    start = max(lnum - 1 - context // 2, 0)
    for i, line in enumerate(all_lines[start:start + context], start + 1):
        if not line.endswith("\n"):
            line += "\n"
        if i == lnum:
            pad = 7 - len(str(i))
            arrow = ("-" * (pad - 2) + "> ") if pad >= 2 else (">" if pad == 1 else "")
            segs += [["g", arrow + str(i)], ["", " " + line]]
        else:
            segs += [["g", "%7d" % i], ["", " " + line]]
    return segs, (code.co_filename, lnum, func)


def _records(tb):
    """The frames IPython shows: from the first cell frame down, without this kernel's own frames."""
    out = []
    started = False
    while tb is not None:
        fn = tb.tb_frame.f_code.co_filename
        if fn.startswith(_PREFIX):
            started = True
        if started and fn != _KERNEL_FILE:
            out.append(tb)
        tb = tb.tb_next
    return out


def _exception_block(exc, context):
    name = type(exc).__name__
    try:
        msg = str(exc)
    except Exception:
        msg = "<unprintable %s object>" % name

        msg = "[Errno %s]" % _linux_errno(exc.errno) + msg[len("[Errno %s]" % exc.errno):]
    entries = [[["r", name], ["", "Traceback (most recent call last)".rjust(75 - len(name))]]]
    tbs = _records(exc.__traceback__)
    frames = [_frame_entry(t, context) for t in tbs]
    keys = [f[1] for f in frames]
    last_unique, repeat = len(frames), 0
    if isinstance(exc, RecursionError) and "recursion" in msg.lower() and len(frames) > 500:
        inner = set(keys[-(len(keys) // 4):])
        seen = {}
        last_unique = 0
        for i in range(len(keys) - 1, -1, -1):
            k = keys[i]
            if k not in inner:
                last_unique = i
                break
            if k in seen:
                repeat = max(repeat, seen[k] - i)
            seen[k] = i
    for f in frames[: last_unique + repeat + 1]:
        entries.append(f[0])
    if repeat:
        entries.append([["", "... last %d frames repeated, from the frame below ...\n" % repeat]])
        entries.append(frames[last_unique + repeat + 1][0])
    entries.append({"last": [["r", name], ["", ": " + msg]]})
    return entries


def _chained(exc):
    cause = getattr(exc, "__cause__", None)
    if cause:
        return cause, True
    if getattr(exc, "__suppress_context__", False):
        return None, False
    return getattr(exc, "__context__", None), False


def _verbose_tb(exc):
    blocks = [_exception_block(exc, 5)]
    seen = {id(exc)}
    cur = exc
    while True:
        nxt, is_cause = _chained(cur)
        if nxt is None or id(nxt) in seen:
            break
        seen.add(id(nxt))
        text = ("\nThe above exception was the direct cause of the following exception:\n" if is_cause
                else "\nDuring handling of the above exception, another exception occurred:\n")
        blocks.append([[["", text]]])
        blocks.append(_exception_block(nxt, 3))
        cur = nxt
    entries = [[["r", "-" * 75]]]
    for b in reversed(blocks):
        entries += b
    return entries


def _syntax_entries(exc):
    """IPython's SyntaxTB: File "...", line N, the line, a ^ under the place, then the error."""
    entries = []
    name = type(exc).__name__
    filename = exc.filename or "<string>"
    if exc.lineno:
        lineno = exc.lineno
        textline = linecache.getline(filename, exc.lineno)
    else:
        lineno = "unknown"
        textline = ""
    entries.append([["", '  File '], ["g", '"%s"' % filename], ["", ", line "], ["g", str(lineno)]])
    if textline == "":
        textline = exc.text
    if textline is not None:
        i = 0
        while i < len(textline) and textline[i].isspace():
            i += 1
        entries.append([["", "    " + textline.strip()]])
        if exc.offset is not None:
            s = "    "
            for c in textline[i:exc.offset - 1]:
                s += c if c.isspace() else " "
            entries.append([["", s], ["r", "^"]])
    msg = exc.msg if getattr(exc, "msg", None) is not None else str(exc)
    entries.append({"last": [["r", name]] + ([["", ": " + msg]] if msg else [])})
    return entries


def _syntax_with_frames(exc):
    """A SyntaxError raised while the code runs (for example by eval): Python's own list format."""
    entries = [[["", "Traceback (most recent call last):"]]]
    for t in _records(exc.__traceback__):
        fs = traceback.extract_tb(t, limit=1)[0]
        entries.append([["", '  File "%s", line %s, in %s\n    %s' % (_display_path(fs.filename), fs.lineno, fs.name, (fs.line or "").strip())]])

# ---------- running a cell ----------
# IPython 7.34's cleanup transforms run on every cell before it is compiled.
_INDENT_RE = re.compile(r"^[ \t]+")
_CLASSIC_RE = re.compile(r"^(>>>|\.\.\.)( |$)")
_CLASSIC_FIRST_RE = re.compile(r"^>>>( |$)")
_IPY_PROMPT_RE = re.compile(r"^(In \[\d+\]: |\s*\.{3,}: ?)")


def _strip_prompts(lines, prompt_re, initial_re):
    if lines and (initial_re.match(lines[0]) or (len(lines) > 1 and prompt_re.match(lines[1]))):
        return [prompt_re.sub("", line, count=1) for line in lines]
    return lines


def _transform(src):
    """Return (the code IPython compiles, how many blank lines it dropped from the top)."""
    cell = src if src.endswith("\n") else src + "\n"
    lines = cell.splitlines(keepends=True)
    dropped = 0
    for line in lines:
        if line and not line.isspace():
            break
        dropped += 1
    if dropped < len(lines):
        lines = lines[dropped:]
    else:
        dropped = 0
    m = _INDENT_RE.match(lines[0]) if lines else None
    if m:
        space = m.group(0)
        lines = [line[len(space):] if line.startswith(space) else line for line in lines]
    lines = _strip_prompts(lines, _CLASSIC_RE, _CLASSIC_FIRST_RE)
    lines = _strip_prompts(lines, _IPY_PROMPT_RE, _IPY_PROMPT_RE)
    # IPython tokenizes the cell next. Python 3.12's tokenizer raises IndentationError for an unindent that matches
    # no outer level, and IPython shows it as it comes (File "<string>").
    try:
        for _ in tokenize.generate_tokens(iter(lines).__next__):
            pass
    except tokenize.TokenError:
        pass
    return "".join(lines), dropped


def _quiet(code):

    try:
        tokens = list(tokenize.generate_tokens(io.StringIO(code).readline))
    except (tokenize.TokenError, SyntaxError):
        return False
    for tok in reversed(tokens):
        if tok[0] in (tokenize.ENDMARKER, tokenize.NL, tokenize.NEWLINE, tokenize.COMMENT):
            continue
        return tok[0] == tokenize.OP and tok[1] == ";"
    return False


def _cell_name(code):
    try:
        first = next(dis.findlinestarts(code))[1]
    except StopIteration:
        return code
    return code.replace(co_name="<cell line: %s>" % (first,))


def run(src, limit=5.0):
    """Run one cell. Returns JSON: the output chunks and, on an error, the traceback as styled entries."""
    st = _state
    st.update(chunks=[], size=0, trunc=False, input=False, limit=float(limit))
    fname = _PREFIX + str(_murmur2(src)) + ".py"
    saved = sys.stdout, sys.stderr, sys.displayhook
    sys.stdout, sys.stderr, sys.displayhook = _Stream("out"), _Stream("err"), _display
    error = None
    dropped = 0

        tree = None

            code_text, dropped = _transform(src)
            linecache.cache[fname] = (len(code_text), None, [line + "\n" for line in code_text.splitlines()], fname)
            try:

                compile(code_text, "<>", "exec", getattr(ast, "PyCF_ALLOW_TOP_LEVEL_AWAIT", 0))
            except Exception:
                pass
            tree = compile(code_text, fname, "exec", _FLAGS | ast.PyCF_ONLY_AST, 1)
        except (OverflowError, SyntaxError, ValueError, TypeError, MemoryError) as exc:
            error = _error(exc, fname, compiled=False)
        if tree is not None:
            nodes = tree.body
            interactive = nodes[-1:] if nodes and isinstance(nodes[-1], ast.Expr) and not _quiet(code_text) else []
            plain = nodes[:-1] if interactive else nodes
            st["deadline"] = time.monotonic() + st["limit"]
            for node, mode in [(n, "exec") for n in plain] + [(n, "single") for n in interactive]:
                try:
                    mod = ast.Module([node], []) if mode == "exec" else ast.Interactive([node])
                    code = _cell_name(compile(mod, fname, mode, _FLAGS, 1))
                except BaseException as exc:
                    error = _error(exc, fname, compiled=False)
                    break

                    sys.settrace(_trace)
                    exec(code, _ns)
                except BaseException as exc:
                    sys.settrace(None)
                    error = _error(exc, fname, compiled=True)
                    break
                finally:
                    sys.settrace(None)
    finally:
        sys.stdout, sys.stderr, sys.displayhook = saved
    if error and error.get("line"):
        error["line"] += dropped   # the line in the cell as the student sees it
    return json.dumps({"out": st["chunks"], "truncated": st["trunc"], "input": st["input"], "error": error})


def _error(exc, fname, compiled):
    name = type(exc).__name__
    try:
        msg = exc.msg if isinstance(exc, SyntaxError) and exc.msg is not None else str(exc)
    except Exception:
        msg = ""
    info = {"type": name, "msg": msg, "line": 0}
    if isinstance(exc, SyntaxError) and not (compiled and type(exc) is not SyntaxError):
        if compiled:
            info["entries"] = _syntax_with_frames(exc)
            info["line"] = _first_cell_line(exc, fname)
        else:
            info["entries"] = _syntax_entries(exc)
            info["line"] = (exc.lineno or 0) if exc.filename in (fname, "<string>") else 0
        info["syntax"] = True
    elif isinstance(exc, SystemExit):
        info["entries"] = [[["", "An exception has occurred, use %tb to see the full traceback.\n"]],
                           {"last": [["r", name]] + ([["", ": " + msg]] if msg else [])}]
    elif not compiled:
        info["entries"] = [{"last": [["r", name], ["", ": " + msg]]}]

    py.worker = w;
    w.onmessage = function (ev) { onWorker(w, ev.data); };
    w.onerror = function () { if (py.worker === w) { if (py.state === "loading") { killWorker(); loadFailed(); } else crashed("The Python worker stopped."); } };
    w.postMessage({ type: "init", url: PYODIDE_URL, kernel: KERNEL_PY, pretty: PRETTY_PY });
    clearTimeout(py.loadTimer);
    clearTimeout(py.slowTimer);
    py.loadTimer = setTimeout(function () { if (py.worker === w && py.state === "loading") { killWorker(); loadFailed(); } }, LOAD_TIMEOUT_MS);
    py.slowTimer = setTimeout(function () { if (py.worker === w && py.state === "loading") setConn("loading", "Still starting Python"); }, SLOW_LOAD_MS);
  }
  function killWorker() {
    var w = py.worker;
    py.worker = null;
    if (w) { try { w.terminate(); } catch (e) { /* already gone */ } }
    if (py.call) { var c = py.call; py.call = null; clearTimeout(c.timer); c.resolve({ killed: true }); }
  }
  function onWorker(w, m) {
    if (w !== py.worker) return;
    if (m.type === "ready") {
      clearTimeout(py.loadTimer);
      py.state = "ready";
      py.version = m.version;
      py.loadMs = Math.round(performance.now() - py.t0);
      window.__tryLoadMs = py.loadMs;   /* read by verify_try.py */
      conn.title = "Python " + m.version + " (Pyodide " + PYODIDE_VERSION + ") started in " + (py.loadMs / 1000).toFixed(1) + " s";
      setConn("ready", "Connected · Python " + m.version.split(".").slice(0, 2).join("."));
      var q = py.waiters; py.waiters = [];
      q.forEach(function (r) { r(true); });
      if (donemsg.dataset.failed) { donemsg.hidden = true; delete donemsg.dataset.failed; }
      updateProgress();
      refit();
      return;
    }
    if (m.type === "load-error") { killWorker(); loadFailed(); return; }
    var c = py.call;
    if (!c || m.id !== c.id) return;
    if (m.type === "started") {
      /* Last resort: a loop the time limit can't stop (one long step inside Python itself). Restart the worker. */
      clearTimeout(c.timer);
      c.timer = setTimeout(function () { if (py.call === c) { killWorker(); startKernel(true); } }, TIME_LIMIT_MS + HARD_STOP_EXTRA_MS);
    } else if (m.type === "done" || m.type === "crash") {
      py.call = null;
      clearTimeout(c.timer);
      if (m.type === "crash") { killWorker(); startKernel(true); c.resolve({ crashed: m.message }); }
      else c.resolve(JSON.parse(m.result));
    }
  }
  function crashed(message) {
    var c = py.call;
    killWorker();
    startKernel(true);
    if (c) c.resolve({ crashed: message });
  }
  function whenReady() {
    if (py.state === "ready") return Promise.resolve(true);
    if (py.state === "failed") return Promise.resolve(false);
    return new Promise(function (r) { py.waiters.push(r); });
  }
  function kernelCall(msg) {
    return whenReady().then(function (ok) {
      if (!ok || !py.worker) return { failed: true };
      return new Promise(function (resolve) {
        msg.id = ++py.ids;
        py.call = { id: msg.id, resolve: resolve, timer: null };
        py.worker.postMessage(msg);
      });
    });
  }

  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function runCell(cell, opts) {
    opts = opts || {};
    if (cell.busy) return Promise.resolve(cell.state !== "error" && cell.state !== "notyet");
    if (py.state === "failed") { announce("Python could not load, so the cell can't run."); return Promise.resolve(false); }
    cell.busy = true;
    cell.runBtn.classList.add("busy");
    cell.runBtn.setAttribute("aria-label", "Running cell " + cell.n);
    var waitNote = false;
    if (py.state !== "ready") {
      waitNote = true;
      cell.pre.innerHTML = '<span class="note wait">Python is starting. The first start takes a few seconds, then this cell runs.</span>';
      cell.out.hidden = false;
      refit();
    }
    var gen = generation;
    function done(ok) {
      if (waitNote && cell.pre.querySelector(".wait")) { cell.pre.innerHTML = ""; cell.out.hidden = true; refit(); }
      cell.busy = false;
      cell.runBtn.classList.remove("busy");
      cell.runBtn.setAttribute("aria-label", "Run cell " + cell.n);
      return ok;
    }
    return enqueue(function () {
      return whenReady().then(function (ready) {
        if (!ready || gen !== generation) return false;
        return delay(opts.fast ? 90 : RUN_DELAY_MS).then(function () {
          if (gen !== generation) return false;
          return execute(cell, gen);
        });
      });
    }).then(done, function () { return done(false); });
  }

  function execute(cell, gen) {
    var src = cell.editor.value;
    return kernelCall({ type: "run", src: src, limit: TIME_LIMIT_MS }).then(function (res) {
      if (gen !== generation) return false;   /* Restart was clicked while it ran */
      if (res.failed) return false;
      var count = ++execCount;
      if (res.killed || res.crashed) {
        res = {
          out: [], truncated: false, input: false, restarted: true,
          error: { type: "KeyboardInterrupt", msg: res.killed ? "the cell ran for " + (TIME_LIMIT_MS / 1000) + " seconds, so it was stopped. Check for a loop that never ends." : "Python stopped unexpectedly.", line: 0,
                   entries: [{ last: [["r", "KeyboardInterrupt"], ["", ": " + (res.killed ? "the cell ran for " + (TIME_LIMIT_MS / 1000) + " seconds, so it was stopped. Check for a loop that never ends." : "Python stopped unexpectedly.")]] }] }
        };
      }
      cell.count = count;
      cell.hadError = !!res.error;
      cell.cnt.textContent = "[" + count + "]";
      var outText = (res.out || []).filter(function (c) { return c[0] === "out"; }).map(function (c) { return c[1]; }).join("");
      renderOutput(cell, res);
      var ok = check(cell, outText, res.error);
      updateProgress();
      refit();
      return ok;
    });
  }

  /* ---------- Output and Colab-style tracebacks ---------- */
  /* The kernel sends the traceback as IPython 7.34 builds it (the version Colab runs): a list of entries, each a list of
     [style, text] parts, joined by new lines. Styles: "r" red, "g" green, "c" cyan, "" plain. The last entry is bold. */
  var TB_CLASS = { r: "tb-red", g: "tb-green", c: "tb-cyan" };
  function span(cls, text) { return '<span class="' + cls + '">' + esc(text) + "</span>"; }
  function parts(list) {
    return list.map(function (p) { return TB_CLASS[p[0]] ? span(TB_CLASS[p[0]], p[1]) : esc(p[1]); }).join("");
  }
  function traceback(err) {
    var out = (err.entries || []).map(function (e) {
      return e.last ? '<span class="tb-last">' + parts(e.last) + "</span>" : parts(e);
    }).join("\n");
    return out.replace(/\s+$/, "");
  }
  function renderOutput(cell, res) {
    var html = "", err = res.error;
    (res.out || []).forEach(function (c) { html += c[0] === "err" ? span("stderr", c[1]) : esc(c[1]); });
    if (res.truncated) html += span("muted", "\n(Output shortened)\n");
    if (res.input) html += (html && !/\n$/.test(html) ? "\n" : "") + '<span class="note">input() asks you to type an answer, but this practice notebook can\'t take typed answers. So input() gave back an empty answer (\'\'). In real Colab, a box appears here for you to type in.</span>';
    if (err) {
      if (html && !/\n$/.test(html.replace(/<[^>]+>/g, ""))) html += "\n";
      html += traceback(err);
      if (res.restarted) html += '<span class="note">Python had to restart to stop this cell, so every variable is gone. Click <b>Restart and run all</b>, or run the cells again from the top.</span>';
      cell.editor.markError(err.line || 0);
      announce("Error: " + err.type + (err.msg ? ": " + err.msg : ""));
    } else {
      cell.editor.markError(0);
      announce("Cell " + cell.n + " ran" + ((res.out || []).length ? "" : " and printed nothing"));
    }
    cell.pre.innerHTML = html;
    cell.out.hidden = html === "";
    cell.out.classList.remove("flash");
    void cell.out.offsetWidth;
    cell.out.classList.add("flash");
  }

  /* ---------- Checks ---------- */
  function norm(s) { return String(s).replace(/\r/g, "").split("\n").map(function (l) { return l.replace(/[ \t]+$/, ""); }).join("\n").replace(/^\n+|\n+$/g, ""); }
  function check(cell, outText, err) {
    var c = cell.cfg, kind = cell.kind, value = c.check && c.check.value != null ? String(c.check.value) : "";
    var pass;
    if (err) pass = false;
    else if (kind === "output_equals") pass = norm(outText) === norm(value);
    else if (kind === "output_contains") pass = outText.indexOf(value) >= 0 || norm(outText).indexOf(norm(value)) >= 0;
    else pass = true;   /* no_error and none: a clean run passes */
    var hintTail = c.hint ? " If you're stuck, click <b>Show a hint</b>." : "";
    var box = cell.chk;
    box.className = "chk";
    if (kind === "none") {
      cell.state = err ? "error" : "ran";
      box.hidden = true;
      return !err;
    }
    if (pass) {
      cell.state = "pass";
      box.classList.add("pass");
      box.innerHTML = ICON_OK + "<div>" + inline(c.done_msg || "Done. That's right.") + "</div>";
    } else {
      cell.state = "notyet";
      box.classList.add("notyet");
      var msg;
      if (err) msg = "<b>Not yet.</b> Read the last line of the error first. It names the problem. Fix the code, then run the cell again." + hintTail;
      else if (kind === "output_equals") msg = "<b>Not yet.</b> Your output should be exactly:<pre>" + esc(value) + "</pre>";
      else if (kind === "output_contains") msg = "<b>Not yet.</b> Your output should include:<pre>" + esc(value) + "</pre>";
      else msg = "<b>Not yet.</b> Fix the error, then run the cell again." + hintTail;
      if (!err && (kind === "output_equals" || kind === "output_contains") && c.hint) msg += "<span>If you're stuck, click <b>Show a hint</b>.</span>";
      box.innerHTML = ICON_INFO + "<div>" + msg + "</div>";
    }
    box.hidden = false;
    return pass;
  }

  var finished = false;
  function updateProgress() {
    var checked = codeCells.filter(function (c) { return c.kind !== "none"; });
    var allDone;
    if (checked.length) {
      var passed = checked.filter(function (c) { return c.state === "pass"; }).length;
      mid.innerHTML = "<b>" + passed + " of " + checked.length + "</b> checks done";
      allDone = passed === checked.length;
    } else {
      var ran = codeCells.filter(function (c) { return c.state === "ran"; }).length;
      mid.innerHTML = "<b>" + ran + " of " + codeCells.length + "</b> cells run";
      allDone = codeCells.length > 0 && ran === codeCells.length;
    }
    if (allDone) {
      if (py.state === "ready") { donemsg.innerHTML = ICON_OK + "<div>" + inline(CFG.final_done_msg || "You've finished the Try.") + "</div>"; donemsg.hidden = false; }
      if (!finished) { finished = true; announce(CFG.final_done_msg || "You've finished the Try."); tellParent({ type: "extern-try-done" }); }
    } else if (py.state !== "failed") {
      donemsg.hidden = true;
      finished = false;
    }
  }
  function tellParent(msg) { if (embedded) { try { window.parent.postMessage(msg, "*"); } catch (e) { /* ignore */ } } }

  /* ---------- Restart, and Restart and run all ---------- */
  function restart(quiet) {
    generation++;
    if (py.call) { killWorker(); startKernel(true); }   /* a cell is running: stop it, like Colab's restart */
    else if (py.state !== "failed") enqueue(function () { return kernelCall({ type: "reset" }); });
    execCount = 0;
    codeCells.forEach(function (c) {
      c.state = "idle"; c.count = 0; c.hadError = false;
      c.cnt.textContent = "[ ]";
      c.pre.innerHTML = ""; c.out.hidden = true;
      c.chk.hidden = true; c.chk.innerHTML = "";
      c.editor.markError(0);
    });
    finished = false;
    donemsg.hidden = true;
    updateProgress();
    refit();
    if (!quiet) announce("Restarted. Every variable is gone, so run the cells again from the top.");
  }
  var runningAll = false;
  function runAll() {
    if (runningAll || py.state === "failed") return;
    runningAll = true;
    $("runall").disabled = true; $("restart").disabled = true;
    restart(true);
    var i = 0;
    function step() {
      if (i >= codeCells.length) return Promise.resolve(true);
      var cell = codeCells[i++];
      return runCell(cell, { fast: true }).then(function () {
        if (cell.hadError) {
          if (cell.screen !== cur) show(cell.screen);
          announce("Stopped at cell " + cell.n + " because it has an error.");
          return false;
        }
        return step();
      });
    }
    step().then(function () {
      runningAll = false;
      $("runall").disabled = false; $("restart").disabled = false;
    });
  }
  $("restart").addEventListener("click", function () { restart(false); });
  $("runall").addEventListener("click", runAll);

  /* ---------- Keyboard: Shift+Enter anywhere in a cell runs it; arrows change screens outside the code ---------- */
  document.addEventListener("keydown", function (e) {
    var t = e.target;
    if (t && t.tagName === "TEXTAREA") return;
    if (e.key === "Enter" && e.shiftKey) {
      var host = t && t.closest ? t.closest(".ccell") : null;
      var cell = host ? codeCells.filter(function (c) { return c.el === host; })[0] : null;
      if (cell) { e.preventDefault(); runCell(cell); }
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey || (t && t.tagName === "INPUT")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); show(cur + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); show(cur - 1); }
  });

  /* ---------- Loading Python ---------- */
  function loadFailed() {
    clearTimeout(py.loadTimer);
    py.state = "failed";
    setConn("failed", "Not connected");
    donemsg.innerHTML = ICON_INFO + '<div>Python could not load, so the cells can\'t run right now. Check your internet connection, then try again.</div><button type="button" class="tbtn retry" id="retry">Try Again</button>';
    donemsg.dataset.failed = "1";
    donemsg.hidden = false;
    $("retry").addEventListener("click", retryLoad);
    var q = py.waiters; py.waiters = [];
    q.forEach(function (r) { r(false); });
    refit();
  }
  function retryLoad() {
    donemsg.hidden = true;
    delete donemsg.dataset.failed;
    killWorker();
    startKernel(false);
  }

  /* ---------- Fit: the stage scales to the frame; the notebook area zooms down a little before it would ever scroll ---------- */
  app.style.height = STAGE_H + "px";
  function fitStage() {
    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.min(w / STAGE_W, h / STAGE_H);
    app.style.transform = "translate(" + ((w - STAGE_W * s) / 2) + "px," + ((h - STAGE_H * s) / 2) + "px) scale(" + s + ")";
  }
  function fitNotebook() {
    var s = screens[cur];
    if (!s) return;
    var z = 1;
    s.el.style.zoom = "1";
    nb.classList.remove("overflow");
    while (nb.scrollHeight > nb.clientHeight + 1 && z > ZOOM_MIN) {
      z = Math.max(ZOOM_MIN, Math.round((z - 0.025) * 1000) / 1000);
      s.el.style.zoom = String(z);
    }
    if (nb.scrollHeight > nb.clientHeight + 1) nb.classList.add("overflow");   /* last resort only */
  }
  var raf = 0;
  function refit() { cancelAnimationFrame(raf); raf = requestAnimationFrame(function () { fitStage(); fitNotebook(); }); }
  window.addEventListener("resize", refit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { codeCells.forEach(function (c) { c.editor.paint(); }); refit(); });

  fitStage();
  show(0);
  updateProgress();
  startKernel(false);
})();
</script>
</body>
</html>
