<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real protection or only on paper?</title>
<!--
  vCISO P3 Step 1, Module 2, interactive 1: Real protection or only on paper.
  Built from the Extern deck shell (.claude/skills/build-html-slides/assets/deck-shell.html).
  Governing authority: output/programs/vciso/VCISO-STYLE-GUIDE.md section 6, which
  sets the larger type scale and the per-slide tint ramp used here.
  House look follows 09-assets/final/vciso-p2-m3-sort-six-actions.html.

  Owner decision: the key term this module defines is never named on screen.
  The module prose names it and teaches the test right after this deck.

  Verify before shipping, both gates, every time:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs   this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  /* ===============================================================
     The palette. The Extern five, plus the vCISO per-slide tint ramp
     (VCISO-STYLE-GUIDE.md 6b, listed in 09-assets/deck-palette.json).
     Tint carries no meaning. Every tint of navy is an rgba() of
     #001D69. No state is ever signalled by colour alone: every
     coloured state also carries a glyph or a label.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, borders, fills      */
    --bg:#FDF8F8;           /* canvas background, and text on navy */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;    /* UI feedback: hover, press, focus, select */
    --t-frame:300ms;   /* movement between slides                  */
    --t-reveal:560ms;  /* a value or an answer resolving           */
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);  /* the slight overshoot */
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    /* System stack, no webfont. A font that blocks first paint is worse
       than any font choice, and a deck makes no network request. */
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. Shared with every
     vCISO deck, so slide 2 here is the same colour as slide 2 elsewhere. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}

  /* ---- the 960x540 canvas, scaled down only, never up ----
     flex:0 0 auto is load bearing. As a shrinkable flex item the canvas
     lays out at the viewport width between 600 and 899px, and the JS
     transform then scales it a second time, double shrinking the design.
     The canvas must always hold 960 in layout and let the transform do
     all of the fitting. getComputedStyle(stage).width must read 960px. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  /* The frame takes programmatic focus so a screen reader announces a new
     slide. It is not a button, so it draws no ring of its own. */
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header. Progress is visible from first paint. ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  /* vCISO 6a: heading 28px at 600. */
  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  /* ---- the board ---- */
  .board{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr;gap:20px}
  .col{min-width:0;min-height:0;display:flex;flex-direction:column}

  .intro{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px;max-width:74ch}
  .intro p{font-size:17px;line-height:1.5}
  .intro p b{color:var(--title);font-weight:600}

  /* ---- slide 1: the two-bin sort ----
     Cards never move. Placing one writes its bin into the card's tag and
     adds its number to that bin, so nothing on the slide reflows mid sort. */
  .board.srt{grid-template-columns:1fr 300px;grid-template-rows:auto minmax(0,1fr);row-gap:10px}
  .how{grid-column:1/-1;background:var(--highlight);color:var(--title);border-left:4px solid var(--on-highlight);
    border-radius:0 6px 6px 0;padding:6px 12px;font-size:15px;line-height:1.35}
  .how b{font-weight:600}
  .cards{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
  .scard{display:grid;grid-template-columns:24px 1fr 122px;gap:10px;align-items:center;
    background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:3px 8px 3px 10px;
    cursor:pointer;user-select:none;-webkit-user-select:none;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  .scard:hover:not(.locked){border-color:var(--on-highlight)}
  .scard:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  .scard.sel{background:var(--highlight);border-color:var(--on-highlight);box-shadow:inset 0 0 0 1.5px var(--on-highlight)}
  .scard.drag{opacity:.55}
  .scard.locked{cursor:default}
  .scard.bad{border-style:dashed;border-color:var(--on-highlight)}
  .scard .cn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums}
  .scard.sel .cn{background:var(--on-highlight);color:var(--bg)}
  .scard .ct{font-size:15px;line-height:1.32;color:var(--title)}
  /* The tag: a dashed empty box until placed, then the bin's name, then a
     tick or a cross once checked. Shape, glyph and words, never colour alone. */
  .scard .tg{height:24px;border-radius:6px;border:1.5px dashed var(--line);
    display:flex;align-items:center;justify-content:center;gap:5px;padding:0 6px;
    font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}
  .scard .tg.on{border:1.5px solid var(--on-highlight);background:var(--highlight)}
  .scard .tg.x{border:1.5px dashed var(--on-highlight);background:transparent}
  .scard .tg.x .tl{text-decoration:line-through;text-decoration-thickness:1px;font-weight:400;color:var(--body)}

  .side{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  button.bin{flex:1 1 auto;font-family:inherit;text-align:left;cursor:pointer;background:var(--tint);
    border:1.5px dashed var(--on-highlight);border-radius:10px;padding:10px 14px;
    display:flex;flex-direction:column;justify-content:flex-start;gap:6px;color:var(--title);
    transition:background var(--t-fast) var(--ease-out)}
  button.bin:hover,button.bin.over{background:var(--highlight);border-style:solid}
  button.bin.ready{border-style:solid;border-width:2px}
  button.bin:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.bin .bl{font-size:17px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:8px}
  button.bin .bk{flex:0 0 auto;width:24px;height:22px;border-radius:5px;border:1.5px solid var(--on-highlight);
    background:var(--highlight);font-size:13px;font-weight:600;color:var(--on-highlight);
    display:flex;align-items:center;justify-content:center}
  button.bin .bh{font-size:14px;line-height:1.4;color:var(--body)}
  .chk{flex:0 0 auto;display:flex;flex-direction:column;gap:5px}
  .chk .cc{font-size:13px;line-height:1.3;color:var(--body)}
  .chk .cc b{color:var(--title);font-weight:600}
  button.nav.full{width:100%}
  .res{flex:0 0 auto;min-height:0;background:var(--highlight);border-left:4px solid var(--on-highlight);
    border-radius:0 10px 10px 0;padding:14px 16px;font-size:15px;line-height:1.45;color:var(--body);
    display:flex;flex-direction:column;gap:10px}
  .res:focus{outline:3px solid var(--on-highlight);outline-offset:2px}
  .res b{color:var(--title);font-weight:600}
  .res .sc{color:var(--title);font-weight:600;font-size:22px;line-height:1.2}

  /* ---- slide 2: every card, right or wrong, with its reason ---- */
  .board.rs{grid-template-columns:1fr 1fr;gap:16px}
  .rs .col{gap:6px}
  .gh{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--title);line-height:1.25;margin-bottom:1px}
  .gh .bk{flex:0 0 auto;width:24px;height:22px;border-radius:5px;border:1.5px solid var(--on-highlight);
    background:var(--highlight);font-size:13px;font-weight:600;color:var(--on-highlight);
    display:flex;align-items:center;justify-content:center}
  .ri{flex:0 0 auto;background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:9px;padding:5px 10px;
    display:grid;grid-template-columns:24px 1fr;column-gap:9px;row-gap:3px;align-items:start}
  .ri.bad{border-style:dashed}
  .ri .cn{grid-row:1/3;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .ri .rx{font-size:14px;line-height:1.32;color:var(--title);font-weight:600}
  .ri .rw{font-size:13.5px;line-height:1.36;color:var(--body)}
  .ri .mk{font-weight:600;color:var(--on-highlight);margin-right:3px}
  .res.in,.board.rs.in{animation:rin var(--t-reveal) var(--ease-over) both}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  button.jump{font-family:inherit;font-size:14px;font-weight:600;color:var(--on-highlight);align-self:flex-start;
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:7px;padding:7px 14px;cursor:pointer}
  button.jump:hover{background:var(--tint2)}
  button.jump:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  /* ---- the bar. margin-top:auto plus flex:0 0 auto means overflow above
         scrolls inside its own region and can never displace this row.
         This is the rule that keeps a Continue button on the canvas. ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:56px;overflow-y:auto;font-size:13px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    .board,.board.srt,.board.rs{grid-template-columns:1fr;gap:18px;align-items:start;align-content:start}
    .intro p{font-size:16px}
    .how{font-size:16px;padding:10px 12px}
    .scard{grid-template-columns:24px 1fr;padding:10px 12px;row-gap:8px}
    .scard .ct{font-size:16px}
    .scard .tg{grid-column:2;justify-self:start;font-size:13px;min-width:132px;height:28px}
    /* The bins ride along at the bottom of the screen while the student
       works down the cards, so a tap on card 1 does not mean a long scroll
       to the bins and back. display:contents makes the whole board the
       sticky element's containing block. */
    .board.srt:not(.done) > .col:last-child{display:contents}
    /* Keeps a focused or scrolled-to card clear of the tray. */
    html{scroll-padding-bottom:190px}
    .board.srt:not(.done) .side{position:sticky;bottom:0;z-index:2;flex-direction:row;flex-wrap:wrap;gap:8px;
      margin:0 -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
      background:var(--bg);border-top:1.5px solid var(--line)}
    .board.srt:not(.done) .side button.bin{flex:1 1 0;min-width:0;min-height:0;padding:9px 11px;gap:3px}
    .board.srt:not(.done) .side button.bin .bl{font-size:16px}
    .board.srt:not(.done) .side button.bin .bh{font-size:14px}
    .board.srt:not(.done) .side .chk{flex:1 1 100%}
    .side{flex:0 0 auto}
    button.bin{padding:12px 14px;min-height:84px}
    button.bin .bh{font-size:15px}
    .chk .cc{font-size:14px}
    .res{flex:0 0 auto;font-size:16px}
    .gh{font-size:17px}
    .ri .rx{font-size:16px}
    .ri .rw{font-size:16px;line-height:1.45}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    button.jump{font-size:15px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Real protection or only on paper?">

    <div class="top">
      <span class="prog" id="prog">1 of 2</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
      <span class="chip" id="chip" hidden></span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">Back</button>
      <button class="nav" id="next" type="button">Continue</button>
      <button class="nav ghost" id="again" type="button" hidden>Start again</button>
      <div id="hint" role="status" aria-live="polite"></div>
    </div>

    <div class="sr" id="live" role="status" aria-live="polite"></div>
  </div>
</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:17px;color:#1C1B1B;margin:20px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ol,.nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:6px}
    .nsf strong{color:#1C1B1B}
    .nsf a{color:#001D69}
  </style>
  <div class="nsf">
    <h2>Real protection or only on paper?</h2>
    <p>Here are eight things Cumberland has. Put each one into one of two groups: <strong>Really protects</strong> or <strong>Only on paper</strong>. Some words may be new. That's fine: you can still decide.</p>
    <ol>
      <li>The locked server room, access limited to Nate</li>
      <li>The policy clause saying "access shall be reviewed quarterly"</li>
      <li>Admin accounts require a second factor</li>
      <li>The policy clause "MFA shall be required for all Restricted access"</li>
      <li>Nightly backups that run and replicate offsite</li>
      <li>The classification scheme in policy §4</li>
      <li>The firewall blocking inbound traffic</li>
      <li>The line "software versions shall not be exposed"</li>
    </ol>
    <p>Decide all eight before you read on.</p>

    <h3>Really protects: 1, 3, 5 and 7</h3>
    <ul>
      <li><strong>1. The locked server room.</strong> An action that reduces risk.</li>
      <li><strong>3. Admin accounts require a second factor.</strong> It operates. Admins really do need a second check, on top of a password, to sign in.</li>
      <li><strong>5. Nightly backups.</strong> It operates: the backups run every night and a copy is kept somewhere else. Nobody has tested a restore, though, which means getting the data back.</li>
      <li><strong>7. The firewall.</strong> It operates. The firewall really blocks traffic coming in from outside.</li>
    </ul>

    <h3>Only on paper: 2, 4, 6 and 8</h3>
    <ul>
      <li><strong>2. The quarterly review clause.</strong> A sentence. It says someone checks who has access every three months, but no review has happened.</li>
      <li><strong>4. The MFA clause.</strong> Staff don't have MFA, a second check on top of a password. The sentence isn't true.</li>
      <li><strong>6. The classification scheme.</strong> A rule for how to label information. Not a label on anything yet.</li>
      <li><strong>8. The software versions line.</strong> A requirement on paper. It doesn't protect anything until the systems really hide their versions.</li>
    </ul>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ---------------- content ----------------
     Card text is verbatim from P3-2 (module-02-internal.md, Interactive 1).
     `ok` is the reason shown when the student placed the card right, and
     `no` is the fuller reason shown when they placed it wrong. Same facts
     in both, nothing added. */
  var BINS = [
    { id:"real",  key:"1", label:"Really protects" },
    { id:"paper", key:"2", label:"Only on paper" }
  ];
  var CARDS = [
    { id:"c1", n:1, bin:"real",  txt:"The locked server room, access limited to Nate",
      ok:"An action that reduces risk.",
      no:"It isn't only written down. The locked room is an action that reduces risk." },
    { id:"c2", n:2, bin:"paper", txt:"The policy clause saying \"access shall be reviewed quarterly\"",
      ok:"A sentence. It says someone checks who has access every three months, but no review has happened.",
      no:"It's only a sentence. The check on who has access, every three months, has not happened." },
    { id:"c3", n:3, bin:"real",  txt:"Admin accounts require a second factor",
      ok:"It operates. Admins really do need a second check, on top of a password, to sign in.",
      no:"It sounds like a rule, but it operates. Admins really do need a second check, on top of a password, to sign in." },
    { id:"c4", n:4, bin:"paper", txt:"The policy clause \"MFA shall be required for all Restricted access\"",
      ok:"Staff don't have MFA, a second check on top of a password. The sentence isn't true.",
      no:"Staff don't have MFA, a second check on top of a password. So the sentence isn't true." },
    { id:"c5", n:5, bin:"real",  txt:"Nightly backups that run and replicate offsite",
      ok:"It operates: the backups run every night and a copy is kept somewhere else. Nobody has tested a restore, though, which means getting the data back.",
      no:"The backups really run every night, and a copy is kept somewhere else. But nobody has tested a restore, which means getting the data back." },
    { id:"c6", n:6, bin:"paper", txt:"The classification scheme in policy §4",
      ok:"A rule for how to label information. Not a label on anything yet.",
      no:"It's only a rule for how to label information. It isn't a label on anything yet." },
    { id:"c7", n:7, bin:"real",  txt:"The firewall blocking inbound traffic",
      ok:"It operates. The firewall really blocks traffic coming in from outside.",
      no:"It isn't only written down. The firewall really blocks traffic coming in from outside." },
    { id:"c8", n:8, bin:"paper", txt:"The line \"software versions shall not be exposed\"",
      ok:"A requirement on paper. It doesn't protect anything until the systems really hide their versions.",
      no:"It's only a requirement. It protects nothing until the systems really hide their versions." }
  ];

  var S = [
    { id:"sort", kind:"sort", label:"Sort eight things",
      h1:"Real protection or only on paper?" },
    { id:"why", kind:"results", label:"Answers",
      h1:"Here's why" }
  ];

  /* ---------------- state ----------------
     localStorage is wrapped: a blocked storage API must degrade silently. */
  var KEY = "vciso-p3-m2-control-or-written-rule-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { answers:{}, place:{} }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var place = {};
      if(isPlain(raw.place)){
        CARDS.forEach(function(c){
          var b = raw.place[c.id];
          if(b === "real" || b === "paper") place[c.id] = b;
        });
      }
      var answers = isPlain(raw.answers) ? raw.answers : {};
      /* A saved check with a card missing is not a real check. */
      if(answers.sort && Object.keys(place).length < CARDS.length) answers = {};
      return { answers:answers, place:place };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var GLYPH = { out:"✕", ok:"✓" };

  /* Data validation, at load, loud. */
  (function validate(){
     var problems = [], ids = {}, cids = {};
     S.forEach(function(s, n){
       if(!s.id) problems.push("slide " + (n+1) + " has no id");
       if(ids[s.id]) problems.push('duplicate slide id "' + s.id + '"');
       ids[s.id] = 1;
     });
     CARDS.forEach(function(c){
       if(cids[c.id]) problems.push('duplicate card id "' + c.id + '"');
       cids[c.id] = 1;
       if(!c.ok || !c.no) problems.push('card "' + c.id + '" is missing a reason');
       if(!binOf(c.bin)) problems.push('card "' + c.id + '" has no valid bin');
     });
     if(problems.length){
       document.getElementById("board").innerHTML =
         '<div class="intro"><p><b>This deck has authoring errors and will not '
         + 'behave correctly:</b></p><ul style="font-size:13px;line-height:1.6;padding-left:18px">'
         + problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul></div>";
       throw new Error("deck data invalid: " + problems.join("; "));
     }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    again:document.getElementById("again"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;
  var sel = null;   /* the card picked up by a tap, waiting for a bin */

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function say(m){ el.live.textContent = m; }
  /* A new slide starts at its top. On a phone the page scrolls, and focusing
     the tall frame alone left the student halfway down the answers. */
  function topFocus(){
    try{ el.frame.focus({preventScroll:true}); }catch(e){ el.frame.focus(); }
    window.scrollTo(0, 0);
  }
  function binOf(id){ for(var k=0;k<BINS.length;k++) if(BINS[k].id === id) return BINS[k]; return null; }
  function cardOf(id){ for(var k=0;k<CARDS.length;k++) if(CARDS[k].id === id) return CARDS[k]; return null; }
  function placedCount(){ return CARDS.filter(function(c){ return st.place[c.id]; }).length; }
  function score(){ return CARDS.filter(function(c){ return st.place[c.id] === c.bin; }).length; }
  function checked(){ return !!st.answers.sort; }
  function names(ns){
    if(ns.length === 1) return String(ns[0]);
    return ns.slice(0, -1).join(", ") + " and " + ns[ns.length-1];
  }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    el.back.disabled = (i === 0);
    if(i === S.length-1){ el.next.disabled = true; el.next.textContent = "You are at the end"; }
    else if(s.kind === "sort" && !checked()){
      el.next.disabled = true;
      el.next.textContent = "Continue";
    }
    else { el.next.disabled = false; el.next.textContent = "Continue"; }
    el.again.hidden = !(checked() || placedCount() > 0);
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.h1.textContent = s.kind === "results" && checked()
      ? "You got " + score() + " of " + CARDS.length + " right. Here's why."
      : s.kind === "results" ? "Sort the eight cards first" : s.h1;
    el.frame.setAttribute("aria-label", el.h1.textContent);
    el.board.className = "board";
    el.hint.textContent = "";

    if(s.kind === "sort") renderSort();
    else if(s.kind === "results") renderResults();
    else {
      el.board.innerHTML = '<div class="intro"><p><b>Unhandled slide kind "'
        + esc(String(s.kind)) + '".</b></p></div>';
    }

    header();
    say("Slide " + (i+1) + " of " + S.length + ". " + el.h1.textContent);
  }

  /* ---------------- slide 1: sort ----------------
     Three ways in, all equal: drag a card onto a bin; tap a card then tap a
     bin; or, on a keyboard, press 1 or 2 on a focused card. A placed card can
     be moved any number of times until Check. */
  function tagHTML(c){
    var p = st.place[c.id];
    if(!p) return '<span class="tg" aria-hidden="true"></span>';
    var lab = esc(binOf(p).label);
    if(!checked()) return '<span class="tg on" aria-hidden="true"><span class="tl">' + lab + "</span></span>";
    if(p === c.bin) return '<span class="tg on" aria-hidden="true">' + GLYPH.ok + ' <span class="tl">' + lab + "</span></span>";
    /* Never a tick on a wrong pick: a cross, a struck label, a dashed edge. */
    return '<span class="tg x" aria-hidden="true">' + GLYPH.out + ' <span class="tl">' + lab + "</span></span>";
  }

  function cardState(c){
    var p = st.place[c.id];
    if(checked()){
      if(p === c.bin) return "You put it in " + binOf(p).label + ". Right.";
      return "You put it in " + binOf(p).label + ". Not right. It goes in " + binOf(c.bin).label + ".";
    }
    if(sel === c.id) return "Picked up. Now choose a bin, or press 1 or 2.";
    if(p) return "In " + binOf(p).label + ". Press 1 or 2 to move it.";
    return "Not placed yet. Press 1 for Really protects or 2 for Only on paper.";
  }

  function renderSort(focusSel){
    var done = checked();
    el.board.className = "board srt" + (done ? " done" : "");

    var cards = CARDS.map(function(c){
      var isWrong = done && st.place[c.id] !== c.bin;
      return '<div class="scard' + (sel === c.id ? " sel" : "") + (done ? " locked" : "") + (isWrong ? " bad" : "") + '"' +
        ' role="button" data-c="' + c.id + '"' +
        (done ? ' tabindex="-1" aria-disabled="true"' : ' tabindex="0" draggable="true" aria-pressed="' + (sel === c.id ? "true" : "false") + '"') + ">" +
        '<span class="cn" aria-hidden="true">' + c.n + "</span>" +
        '<span class="ct">' + esc(c.txt) + '<span class="sr"> ' + esc(cardState(c)) + "</span></span>" +
        tagHTML(c) + "</div>";
    }).join("");

    var side;
    if(!done){
      var n = placedCount();
      side = '<div class="side">' + BINS.map(function(b){
          var inBin = CARDS.filter(function(c){ return st.place[c.id] === b.id; }).map(function(c){ return c.n; });
          return '<button class="bin' + (sel ? " ready" : "") + '" type="button" data-bin="' + b.id + '">' +
            '<span class="bl"><span class="bk" aria-hidden="true">' + b.key + "</span>" + esc(b.label) + "</span>" +
            '<span class="bh">' + (inBin.length ? (inBin.length === 1 ? "Card " : "Cards ") + names(inBin) : "Nothing here yet") + "</span></button>";
        }).join("") +
        '<div class="chk"><button class="nav full" id="chk" type="button"' + (n < CARDS.length ? " disabled" : "") + '>Check my answers</button>' +
        '<div class="cc">' + (n < CARDS.length ? n + " of " + CARDS.length + " placed. Place all eight to check." : "All eight placed. You can still move any card.") + "</div></div></div>";
    } else {
      side = '<div class="side"><div class="res" id="res" tabindex="-1">' +
        '<div class="sc">' + score() + " of " + CARDS.length + " right</div>" +
        "<div>The reason for every card is on the next slide.</div></div></div>";
    }

    var how = done ? "" : '<div class="how"><b>What to do:</b> tap a card, then tap a bin. Or drag the card there. On a keyboard, press 1 or 2 on a card.</div>';
    el.board.innerHTML = how + '<div class="col"><div class="cards">' + cards + '</div></div><div class="col">' + side + "</div>";
    if(!done) wireSort();
    if(!done && !el.hint.textContent) el.hint.textContent = "Some words here may be new. That's fine: you can still decide.";
    if(focusSel){ var f = el.board.querySelector(focusSel); if(f) f.focus(); }
  }

  function pick(id){
    if(checked()) return;
    sel = (sel === id) ? null : id;
    renderSort('.scard[data-c="' + id + '"]');
    var c = cardOf(id);
    say(sel ? "Card " + c.n + " picked up. Now choose a bin." : "Card " + c.n + " put down.");
  }

  function place(id, bin){
    if(checked() || !cardOf(id) || !binOf(bin)) return;
    st.place[id] = bin;
    save(st);
    sel = null;
    /* Land focus on the next card still to place, so a keyboard student can
       keep going without hunting. When all are placed, land on Check. */
    var c = cardOf(id), nextId = null;
    for(var k=1;k<=CARDS.length;k++){
      var cand = CARDS[(c.n - 1 + k) % CARDS.length];
      if(!st.place[cand.id]){ nextId = cand.id; break; }
    }
    el.hint.textContent = "";
    renderSort(nextId ? '.scard[data-c="' + nextId + '"]' : "#chk");
    header();
    say("Card " + c.n + " is in " + binOf(bin).label + ". " + placedCount() + " of " + CARDS.length + " placed.");
  }

  function wireSort(){
    var cards = el.board.querySelectorAll(".scard");
    Array.prototype.forEach.call(cards, function(card, idx){
      var id = card.dataset.c;
      card.addEventListener("click", function(){ pick(id); });
      card.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(id); }
        else if(e.key === "1" || e.key === "2"){ e.preventDefault(); place(id, e.key === "1" ? "real" : "paper"); }
        else if(e.key === "ArrowDown" || e.key === "ArrowUp"){
          e.preventDefault();
          var to = cards[(idx + (e.key === "ArrowDown" ? 1 : cards.length - 1)) % cards.length];
          if(to) to.focus();
        }
      });
      card.addEventListener("dragstart", function(e){
        try{ e.dataTransfer.setData("text/plain", id); e.dataTransfer.effectAllowed = "move"; }catch(err){}
        card.classList.add("drag");
      });
      card.addEventListener("dragend", function(){ card.classList.remove("drag"); });
    });
    Array.prototype.forEach.call(el.board.querySelectorAll("button.bin"), function(b){
      var bin = b.dataset.bin;
      b.addEventListener("click", function(){
        if(sel){ place(sel, bin); return; }
        /* Said beside the bins, not in the bottom bar: on a phone the bar
           is off screen while the bin tray is in view. */
        var cc = el.board.querySelector(".chk .cc");
        if(cc) cc.innerHTML = "<b>Pick a card first.</b> Tap a card, then tap this bin.";
        say("Pick a card first, then choose a bin.");
      });
      b.addEventListener("dragover", function(e){ e.preventDefault(); b.classList.add("over"); });
      b.addEventListener("dragleave", function(){ b.classList.remove("over"); });
      b.addEventListener("drop", function(e){
        e.preventDefault(); b.classList.remove("over");
        var id = "";
        try{ id = e.dataTransfer.getData("text/plain"); }catch(err){}
        if(cardOf(id)) place(id, bin);
      });
    });
    var chk = el.board.querySelector("#chk");
    if(chk) chk.addEventListener("click", check);
  }

  function check(){
    if(placedCount() < CARDS.length || checked()) return;
    st.answers.sort = score() === CARDS.length ? "right" : "shown";
    save(st);
    sel = null;
    i = 1;
    render();
    if(!reduce){ el.board.classList.remove("in"); void el.board.offsetWidth; el.board.classList.add("in"); }
    topFocus();
    say("You got " + score() + " of " + CARDS.length + " right. " + el.board.textContent.replace(/\s+/g, " ").trim());
  }

  /* ---------------- slide 2: results ----------------
     Grouped by where each card belongs. A right card shows a tick and its
     reason. A wrong card shows a cross, says where the student put it, and
     gives the fuller reason, so the correction is louder than the pick. */
  function renderResults(){
    if(!checked()){
      el.board.innerHTML = '<div class="intro"><p>Place all eight cards on the first slide and press <b>Check my answers</b>. Your results and the reason for every card appear here.</p>' +
        '<button class="jump" type="button" id="tosort">Go to the sort</button></div>';
      el.board.querySelector("#tosort").addEventListener("click", function(){ i = 0; render(); topFocus(); });
      return;
    }
    el.board.className = "board rs";
    el.board.innerHTML = BINS.map(function(b){
      var items = CARDS.filter(function(c){ return c.bin === b.id; }).map(function(c){
        var p = st.place[c.id], right = p === c.bin;
        var mark = right
          ? '<span class="mk">' + GLYPH.ok + " Right.</span>"
          : '<span class="mk">' + GLYPH.out + " You said " + esc(binOf(p).label) + ".</span>";
        return '<div class="ri' + (right ? "" : " bad") + '">' +
          '<span class="cn" aria-hidden="true">' + c.n + "</span>" +
          '<div class="rx"><span class="sr">Card ' + c.n + ". </span>" + esc(c.txt) + "</div>" +
          '<div class="rw">' + mark + esc(right ? c.ok : c.no) + "</div></div>";
      }).join("");
      return '<div class="col"><div class="gh"><span class="bk" aria-hidden="true">' + b.key + "</span>" + esc(b.label) + "</div>" + items + "</div>";
    }).join("");
  }

  /* ---------------- start again ---------------- */
  function resetAll(){ st = fresh(); save(st); sel = null; i = 0; render(); }
  el.again.addEventListener("click", function(){
    resetAll();
    var f = el.board.querySelector(".scard");
    if(f) f.focus();
    say("Cleared. All eight cards are back to unplaced.");
  });

  /* ---------------- navigation ----------------
     Three input methods on every multi-slide deck: visible buttons, keyboard
     arrows, and swipe. */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    if(n === 1 && !checked()) return;
    i = n; sel = null; render(); topFocus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    /* A card picked up by a tap can be placed from anywhere with 1 or 2.
       Keys pressed on a focused card are handled on the card itself. */
    if(S[i].kind === "sort" && sel && !checked() && (e.key === "1" || e.key === "2")){
      if(e.target && e.target.classList && e.target.classList.contains("scard")) return;
      e.preventDefault(); place(sel, e.key === "1" ? "real" : "paper");
    }
    if(e.key === "Escape" && sel){ var was = sel; sel = null; renderSort('.scard[data-c="' + was + '"]'); say("Card put down."); }
  });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return true;
    var r = node.getAttribute && node.getAttribute("role");
    return r === "slider" || r === "textbox" || r === "spinbutton" || r === "listbox";
  }

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    if(ownsKeys(e.target)){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ----------------
     measure-fit.mjs steps through the deck with this. Keep it on every deck.
     place and check let a QA run reach the answered states by script. */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; sel = null; render(); return true;
    },
    slides:S.length,
    place:function(id, bin){ i = 0; render(); place(id, bin); return st.place[id] === bin; },
    check:function(){ check(); return checked(); },
    reset:function(){ resetAll(); },
    state:function(){ return { i:i, answers:st.answers, place:st.place, sel:sel }; }
  };
})();
</script>
</body>
</html>
