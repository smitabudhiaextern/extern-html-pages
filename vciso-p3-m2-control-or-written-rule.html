<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real protection or only on paper?</title>
<!--
  vCISO P3 Step 1, Module 2, interactive 1: Real protection or only on paper.
  Built from the Extern deck shell (.claude/skills/build-html-slides/assets/deck-shell.html).
  Governing authority: output/programs/vciso/VCISO-STYLE-GUIDE.md section 6, which
  sets the larger type scale and the per-slide tint ramp used here.
  House look follows 09-assets/final/vciso-p2-m3-sort-six-actions.html.

  Owner decision: the key term this module defines is never named on screen.
  The module prose names it and teaches the test right after this deck.

  Owner decision, 29 Sep 2026: question by question, not a sort. One card per
  slide in Chaitanya's order (1 to 8, not shuffled), two answer buttons, the
  answer and its reason shown at once, then a score slide listing all eight.

  Verify before shipping, both gates, every time:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs   this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  /* ===============================================================
     The palette. The Extern five, plus the vCISO per-slide tint ramp
     (VCISO-STYLE-GUIDE.md 6b, listed in 09-assets/deck-palette.json).
     Tint carries no meaning. Every tint of navy is an rgba() of
     #001D69. No state is ever signalled by colour alone: every
     coloured state also carries a glyph or a label.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, icons, borders, fills      */
    --bg:#FDF8F8;           /* canvas background, and text on navy */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;    /* UI feedback: hover, press, focus, select */
    --t-frame:300ms;   /* movement between slides                  */
    --t-reveal:560ms;  /* a value or an answer resolving           */
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);  /* the slight overshoot */
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    /* System stack, no webfont. A font that blocks first paint is worse
       than any font choice, and a deck makes no network request. */
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. Shared with every
     vCISO deck, so slide 2 here is the same colour as slide 2 elsewhere. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t3{background:#F2E3D2}
  body.t4{background:#DEEBDA}
  body.t5{background:#F0E4EF}
  body.t6{background:#D0EEF1}
  body.t7{background:#EEDAD6}
  body.t8{background:#E6EADC}
  body.t9{background:#D1E2F1}

  /* ---- the 960x540 canvas, scaled down only, never up ----
     flex:0 0 auto is load bearing. As a shrinkable flex item the canvas
     lays out at the viewport width between 600 and 899px, and the JS
     transform then scales it a second time, double shrinking the design.
     The canvas must always hold 960 in layout and let the transform do
     all of the fitting. getComputedStyle(stage).width must read 960px. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }
  /* The frame takes programmatic focus so a screen reader announces a new
     slide. It is not a button, so it draws no ring of its own. */
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header. Progress is visible from first paint. ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:12px;font-weight:600;color:var(--on-highlight);white-space:nowrap}

  /* vCISO 6a: heading 28px at 600. */
  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:12px}

  /* ---- the board ---- */
  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px}
  .intro{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px;max-width:74ch}
  .intro p{font-size:17px;line-height:1.5}
  .intro p b{color:var(--title);font-weight:600}

  /* ---- slides 1 to 8: one card, two answers, one reason ----
     The card takes whatever height is left, so the answer buttons and the
     reason panel sit in the same place on every card slide. The reason
     panel is a fixed height, reserved from first paint: answering fills it
     rather than growing it, so nothing on the slide moves. */
  .qcard{flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:20px;
    background:var(--bg);border:1.5px solid var(--on-highlight);border-left-width:6px;border-radius:12px;
    padding:18px 26px}
  .qcard .cn{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:2px solid var(--on-highlight);
    background:var(--highlight);color:var(--on-highlight);font-size:24px;font-weight:600;
    display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .qcard .ct{font-size:28px;line-height:1.3;font-weight:600;color:var(--title)}

  .ans-row{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  button.ans{font-family:inherit;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 16px;
    background:var(--bg);color:var(--title);border:2px solid var(--on-highlight);border-radius:10px;
    transition:background var(--t-fast) var(--ease-out),color var(--t-fast) var(--ease-out),opacity var(--t-fast) var(--ease-out)}
  button.ans:hover:not(:disabled){background:var(--highlight)}
  button.ans:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  button.ans:disabled{cursor:default}
  button.ans .bk{flex:0 0 auto;width:28px;height:26px;border-radius:6px;border:1.5px solid var(--on-highlight);
    background:var(--highlight);font-size:14px;font-weight:600;color:var(--on-highlight);
    display:flex;align-items:center;justify-content:center}
  button.ans .al{flex:1 1 auto;font-size:20px;font-weight:600;line-height:1.25}
  button.ans .tg{flex:0 0 auto;font-size:13px;font-weight:600;white-space:nowrap}
  /* After answering. The correct answer is always the filled one, with a
     tick. A wrong pick gets a cross, a struck label and a dashed edge. The
     other button fades. Glyph and words every time, never colour alone. */
  button.ans.is-right{background:var(--on-highlight);color:var(--bg)}
  button.ans.is-right .bk{background:var(--bg);border-color:var(--bg)}
  button.ans.is-wrong{border-style:dashed;background:transparent}
  button.ans.is-wrong .al{text-decoration:line-through;text-decoration-thickness:1.5px;font-weight:400;color:var(--body)}
  button.ans.is-wrong .tg{color:var(--body)}
  button.ans.is-other{opacity:.45}

  .fb{flex:0 0 auto;height:122px;overflow:hidden;border-radius:0 10px 10px 0;
    border-left:4px solid var(--on-highlight);background:var(--highlight);padding:12px 18px;
    display:flex;flex-direction:column;gap:6px}
  .fb.wait{background:var(--tint);border:1.5px dashed var(--line);border-radius:10px;justify-content:center}
  .fb.wait{gap:4px}
  .fb.wait p{font-size:16px;line-height:1.45;color:var(--body)}
  .fb.wait p:first-child{color:var(--title);font-weight:600}
  .fb:focus{outline:3px solid var(--on-highlight);outline-offset:2px}
  .fb .fh{font-size:20px;font-weight:600;line-height:1.25;color:var(--title)}
  .fb .fh .gl{display:inline-block;width:1.1em;color:var(--on-highlight)}
  .fb .fr{font-size:17px;line-height:1.45;color:var(--body)}
  .fb.in{animation:rin var(--t-reveal) var(--ease-over) both}
  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* ---- slide 9: the score, and all eight with the right answer ---- */
  .sum{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,minmax(0,1fr));
    grid-auto-flow:column;gap:8px 16px}
  .si{min-height:0;background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:9px;padding:6px 12px;
    display:grid;grid-template-columns:28px 1fr;column-gap:10px;row-gap:3px;align-content:center}
  .si.bad{border-style:dashed}
  .si .cn{grid-row:1/3;align-self:start;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .si .sx{font-size:15px;line-height:1.3;color:var(--title)}
  .si .sa{font-size:14px;line-height:1.35;color:var(--body);display:flex;flex-wrap:wrap;gap:4px 12px}
  .si .sa b{color:var(--on-highlight);font-weight:600}
  .si .mk{font-weight:600;color:var(--title)}
  .sum.in{animation:rin var(--t-reveal) var(--ease-over) both}
  button.jump{font-family:inherit;font-size:15px;font-weight:600;color:var(--on-highlight);align-self:flex-start;
    background:transparent;border:1.5px solid var(--on-highlight);border-radius:7px;padding:8px 15px;cursor:pointer}
  button.jump:hover{background:var(--tint2)}
  button.jump:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  /* ---- the bar. margin-top:auto plus flex:0 0 auto means overflow above
         scrolls inside its own region and can never displace this row.
         This is the rule that keeps a Continue button on the canvas. ---- */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:12px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:44px;overflow-y:auto;font-size:13px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- under 600px: a portrait restack, not a shrunken slide ---- */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px}
    h1{font-size:22px}
    .board{gap:14px}
    .intro p{font-size:16px}
    .qcard{flex:0 0 auto;gap:14px;padding:20px 16px}
    .qcard .cn{width:40px;height:40px;font-size:19px}
    .qcard .ct{font-size:22px}
    .ans-row{grid-template-columns:1fr;gap:10px}
    button.ans{min-height:58px}
    button.ans .al{font-size:18px}
    button.ans .tg{font-size:14px}
    .fb{height:auto;min-height:96px;overflow:visible}
    .fb .fh{font-size:18px}
    .fb .fr{font-size:16px}
    .sum{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row;gap:10px}
    .si{padding:10px 12px}
    .si .sx{font-size:16px}
    .si .sa{font-size:15px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    button.jump{font-size:16px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
    #hint .kb{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="Real protection or only on paper?">

    <div class="top">
      <span class="prog" id="prog">1 of 9</span>
      <span class="segs" id="segs" aria-hidden="true"></span>
      <span class="chip" id="chip" hidden></span>
    </div>

    <div class="bar">

</div>

<noscript>
  <style>
    #stage{display:none!important}
    html,body{height:auto}
    body{display:block!important;align-items:initial!important;justify-content:initial!important;overflow-x:hidden}
    .nsf{max-width:760px;margin:0 auto;padding:28px 22px 48px;font-size:17px;line-height:1.55;color:#484646}
    .nsf h2{font-size:22px;color:#1C1B1B;margin-bottom:12px}
    .nsf h3{font-size:17px;color:#1C1B1B;margin:20px 0 6px}
    .nsf p{margin-bottom:12px}
    .nsf ol,.nsf ul{margin:0 0 12px 22px}
    .nsf li{margin-bottom:6px}
    .nsf strong{color:#1C1B1B}
    .nsf a{color:#001D69}
  </style>
  <div class="nsf">
    <h2>Real protection or only on paper?</h2>
    <p>Here are eight things Cumberland has. For each one, decide: <strong>Really protects</strong> or <strong>Only on paper</strong>. Some words may be new. That's fine: you can still decide.</p>
    <ol>
      <li>The locked server room, access limited to Nate</li>
      <li>The policy clause saying "access shall be reviewed quarterly"</li>
      <li>Admin accounts require a second factor</li>
      <li>The policy clause "MFA shall be required for all Restricted access"</li>
      <li>Nightly backups that run and replicate offsite</li>
      <li>The classification scheme in policy §4</li>
      <li>The firewall blocking inbound traffic</li>
      <li>The line "software versions shall not be exposed"</li>
    </ol>
    <p>Decide all eight before you read on.</p>

    <h3>Really protects: 1, 3, 5 and 7</h3>
    <ul>
      <li><strong>1. The locked server room.</strong> The door really is locked, and only Nate can get in. That's an action that reduces risk.</li>
      <li><strong>3. Admin accounts require a second factor.</strong> It operates. Admin accounts, the powerful ones that can change the systems, really do need a second check on top of a password to sign in.</li>
      <li><strong>5. Nightly backups.</strong> It operates: the backups run every night, and a copy is kept somewhere else. One catch: nobody has tested getting the data back.</li>
      <li><strong>7. The firewall.</strong> It operates. A firewall is a filter between Cumberland's network and the internet, and this one really blocks traffic coming in from outside.</li>
    </ul>

    <h3>Only on paper: 2, 4, 6 and 8</h3>
    <ul>
      <li><strong>2. The quarterly review clause.</strong> It's only a sentence. It says someone checks who has access every three months, but no check has happened.</li>
      <li><strong>4. The MFA clause.</strong> Restricted is the policy's label for the most private data, like patient health information. Only admin accounts have MFA, a second check on top of a password. Other staff don't, so the sentence isn't true.</li>
      <li><strong>6. The classification scheme.</strong> It's only a rule for how to label information by how private it is. It isn't a label on anything yet.</li>
      <li><strong>8. The software versions line.</strong> It's only a requirement on paper. It protects nothing until the systems really do hide their software versions from outsiders.</li>
    </ul>
  </div>
</noscript>

<script>
(function(){
  "use strict";

  /* ---------------- content ----------------
     Card text is verbatim from P3-2 (module-02-internal.md, Interactive 1).
     Order is Chaitanya's, 1 to 8. Do not shuffle without an owner call.
     `ok` is the reason shown when the student answered right, and `no` is
     the fuller reason shown when they answered wrong. Same facts in both,
     nothing added. */
  var BINS = [
    { id:"real",  key:"1", label:"Really protects" },
    { id:"paper", key:"2", label:"Only on paper" }
  ];
  var CARDS = [
    { id:"c1", n:1, bin:"real",  txt:"The locked server room, access limited to Nate",
      ok:"The door really is locked, and only Nate can get in. That's an action that reduces risk.",
      no:"It isn't only words. The door really is locked, and only Nate can get in. That's an action that reduces risk." },
    { id:"c2", n:2, bin:"paper", txt:"The policy clause saying \"access shall be reviewed quarterly\"",
      ok:"It's only a sentence. It says someone checks who has access every three months, but no check has happened.",
      no:"It sounds like something that happens, but it's only a sentence. It says someone checks who has access every three months, and no check has happened." },
    { id:"c3", n:3, bin:"real",  txt:"Admin accounts require a second factor",
      ok:"It operates. Admin accounts, the powerful ones that can change the systems, really do need a second check on top of a password to sign in.",
      no:"It sounds like a rule, but it operates. Admin accounts, the powerful ones that can change the systems, really do need a second check on top of a password to sign in." },
    { id:"c4", n:4, bin:"paper", txt:"The policy clause \"MFA shall be required for all Restricted access\"",
      ok:"Restricted is the policy's label for the most private data, like patient health information. Only admin accounts have MFA, a second check on top of a password. Other staff don't, so the sentence isn't true.",
      no:"Restricted is the policy's label for the most private data, like patient health information. Only admin accounts have MFA, a second check on top of a password. Other staff don't, so the sentence isn't true." },
    { id:"c5", n:5, bin:"real",  txt:"Nightly backups that run and replicate offsite",
      ok:"It operates: the backups run every night, and a copy is kept somewhere else. One catch: nobody has tested getting the data back.",
      no:"The backups really run every night, and a copy is kept somewhere else, so this isn't only on paper. One catch: nobody has tested getting the data back." },
    { id:"c6", n:6, bin:"paper", txt:"The classification scheme in policy §4",
      ok:"It's only a rule for how to label information by how private it is. It isn't a label on anything yet.",
      no:"It sounds official, but it's only a rule for how to label information by how private it is. It isn't a label on anything yet." },
    { id:"c7", n:7, bin:"real",  txt:"The firewall blocking inbound traffic",
      ok:"It operates. A firewall is a filter between Cumberland's network and the internet, and this one really blocks traffic coming in from outside.",
      no:"It isn't only words. A firewall is a filter between Cumberland's network and the internet, and this one really blocks traffic coming in from outside." },
    { id:"c8", n:8, bin:"paper", txt:"The line \"software versions shall not be exposed\"",
      ok:"It's only a requirement on paper. It protects nothing until the systems really do hide their software versions from outsiders.",
      no:"It sounds like protection, but it's only a requirement. It protects nothing until the systems really do hide their software versions from outsiders." }
  ];

  /* One slide per card, in card order, then the score. */
  var S = CARDS.map(function(c){
    return { id:c.id, kind:"card", card:c, label:"Card " + c.n, h1:"Real protection or only on paper?" };
  });
  S.push({ id:"score", kind:"score", label:"Your score", h1:"Your score" });

  /* ---------------- state ----------------
     localStorage is wrapped: a blocked storage API must degrade silently.
     v2: the data shape changed from the sort (place) to one answer per card. */
  var KEY = "vciso-p3-m2-control-or-written-rule-v2";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function fresh(){ return { ans:{} }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw) || !isPlain(raw.ans)) return fresh();
      var ans = {};
      CARDS.forEach(function(c){
        var b = raw.ans[c.id];
        if(b === "real" || b === "paper") ans[c.id] = b;
      });
      return { ans:ans };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var GLYPH = { out:"✕", ok:"✓" };
  /* Said after "Not right." so the right answer reads as a sentence. */
  var WRONG_HEAD = { real:"This one really protects.", paper:"This one is only on paper." };

  /* Data validation, at load, loud. */
  (function validate(){
     var problems = [], ids = {};
     S.forEach(function(s, n){
       if(!s.id) problems.push("slide " + (n+1) + " has no id");
       if(ids[s.id]) problems.push('duplicate slide id "' + s.id + '"');
       ids[s.id] = 1;
     });
     CARDS.forEach(function(c){
       if(!c.ok || !c.no) problems.push('card "' + c.id + '" is missing a reason');
       if(!binOf(c.bin)) problems.push('card "' + c.id + '" has no valid answer');
     });
     if(problems.length){
       document.getElementById("board").innerHTML =
         '<div class="intro"><p><b>This deck has authoring errors and will not '
         + 'behave correctly:</b></p><ul style="font-size:13px;line-height:1.6;padding-left:18px">'
         + problems.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul></div>";
       throw new Error("deck data invalid: " + problems.join("; "));
     }
  })();

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    again:document.getElementById("again"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function say(m){ el.live.textContent = m; }
  /* A new slide starts at its top. On a phone the page scrolls. */
  function topFocus(){
    try{ el.frame.focus({preventScroll:true}); }catch(e){ el.frame.focus(); }
    window.scrollTo(0, 0);
  }
  function binOf(id){ for(var k=0;k<BINS.length;k++) if(BINS[k].id === id) return BINS[k]; return null; }
  function answered(c){ return !!st.ans[c.id]; }
  function answeredCount(){ return CARDS.filter(answered).length; }
  function score(){ return CARDS.filter(function(c){ return st.ans[c.id] === c.bin; }).length; }
  function firstOpen(){ for(var k=0;k<CARDS.length;k++) if(!answered(CARDS[k])) return k; return -1; }

  /* Resume where the student left off: the first card still to answer, or
     the score if all eight are done. */
  var i = answeredCount() === 0 ? 0 : (firstOpen() < 0 ? S.length - 1 : firstOpen());

  /* ---------------- chrome ---------------- */
  function canGo(n){
    if(n < 0 || n >= S.length) return false;
    /* Forward only past a card that has been answered. */
    for(var k=0;k<n && k<CARDS.length;k++) if(!answered(CARDS[k])) return false;
    return true;
  }

  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    el.back.disabled = (i === 0);
    el.again.hidden = s.kind !== "score";
    if(i === S.length-1){ el.next.disabled = true; el.next.textContent = "You are at the end"; }
    else {
      el.next.textContent = (i === CARDS.length-1) ? "See my score" : "Next card";
      el.next.disabled = !canGo(i+1);
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.board.className = "board";
    el.hint.textContent = "";

    if(s.kind === "card") renderCard(s.card);
    else if(s.kind === "score") renderScore();
    else {
      el.h1.textContent = s.h1;
      el.board.innerHTML = '<div class="intro"><p><b>Unhandled slide kind "'
        + esc(String(s.kind)) + '".</b></p></div>';
    }

    el.frame.setAttribute("aria-label", el.h1.textContent);
    header();
  }

  /* ---------------- slides 1 to 8: one card ----------------
     Pick one of two buttons, or press 1 or 2. The answer and its reason
     show at once, in the reserved panel, and both buttons lock. */
  function buttonHTML(c, b){
    var pick = st.ans[c.id], done = !!pick;
    var cls = "ans", tag = "", sr = "";
    if(done){
      if(b.id === c.bin){
        cls += " is-right";
        tag = GLYPH.ok + (pick === b.id ? " Your answer" : " Right answer");
        sr = pick === b.id ? " Your answer. Right." : " The right answer.";
      } else if(pick === b.id){
        /* Never a tick on a wrong pick: a cross, a struck label, a dashed edge. */
        cls += " is-wrong";
        tag = GLYPH.out + " Your answer";
        sr = " Your answer. Not right.";
      } else {
        cls += " is-other";
      }
    }
    return '<button class="' + cls + '" type="button" data-bin="' + b.id + '"' + (done ? " disabled" : "") + ">" +
      '<span class="bk" aria-hidden="true">' + b.key + "</span>" +
      '<span class="al">' + esc(b.label) + "</span>" +
      (tag ? '<span class="tg" aria-hidden="true">' + tag + "</span>" : "") +
      (sr ? '<span class="sr">' + sr + "</span>" : "") + "</button>";
  }

  function feedbackHTML(c){
    var pick = st.ans[c.id];
    if(!pick) return '<div class="fb wait" id="fb"><p>Pick one to see the answer.</p>' +
      "<p>Some words here may be new. That's fine: you can still decide.</p></div>";
    var right = pick === c.bin;
    var head = right
      ? '<span class="gl" aria-hidden="true">' + GLYPH.ok + "</span>Right."
      : '<span class="gl" aria-hidden="true">' + GLYPH.out + "</span>Not right. " + WRONG_HEAD[c.bin];
    return '<div class="fb" id="fb" tabindex="-1"><div class="fh">' + head + '</div><div class="fr">' +
      esc(right ? c.ok : c.no) + "</div></div>";
  }

  function renderCard(c){
    el.h1.textContent = S[i].h1;
    el.board.innerHTML =
      '<div class="qcard"><span class="cn" aria-hidden="true">' + c.n + "</span>" +
      '<p class="ct"><span class="sr">Card ' + c.n + " of " + CARDS.length + ". </span>" + esc(c.txt) + "</p></div>" +
      '<div class="ans-row" role="group" aria-label="Your answer">' +
      BINS.map(function(b){ return buttonHTML(c, b); }).join("") + "</div>" +
      feedbackHTML(c);
    Array.prototype.forEach.call(el.board.querySelectorAll("button.ans"), function(btn){
      btn.addEventListener("click", function(){ answer(c, btn.dataset.bin); });
    });
    if(!answered(c)) el.hint.innerHTML = '<span class="kb">On a keyboard, press 1 or 2.</span>';
  }

  function answer(c, bin){
    if(answered(c) || !binOf(bin)) return;
    st.ans[c.id] = bin;
    save(st);
    render();
    var fb = el.board.querySelector("#fb");
    if(fb && !reduce){ fb.classList.remove("in"); void fb.offsetWidth; fb.classList.add("in"); }
    /* Focus was on a button that is now disabled. Land on Next, so Enter
       moves on. On a phone, keep the reason in view rather than jumping. */
    try{ el.next.focus({preventScroll:true}); }catch(e){ el.next.focus(); }
    if(fb && fb.scrollIntoView && window.matchMedia("(max-width:599px)").matches){
      try{ fb.scrollIntoView({block:"nearest"}); }catch(e){}
    }
    say((st.ans[c.id] === c.bin ? "Right. " : "Not right. " + WRONG_HEAD[c.bin] + " ") +
      (st.ans[c.id] === c.bin ? c.ok : c.no));
  }

  /* ---------------- slide 9: the score ----------------
     All eight in card order, each with its right answer and whether the
     student got it. A wrong row is dashed and says what they picked. */
  function renderScore(){
    if(firstOpen() >= 0){
      var open = CARDS.filter(function(c){ return !answered(c); }).map(function(c){ return c.n; });
      el.h1.textContent = "Answer all eight cards first";
      el.board.innerHTML = '<div class="intro"><p>' + (open.length === 1 ? "Card " : "Cards ") + open.join(", ") +
        (open.length === 1 ? " is" : " are") + " still to answer. Your score and every right answer appear here.</p>" +
        '<button class="jump" type="button" id="toopen">Go to card ' + open[0] + "</button></div>";
      el.board.querySelector("#toopen").addEventListener("click", function(){ i = firstOpen(); render(); topFocus(); });
      return;
    }
    el.h1.textContent = "You got " + score() + " of " + CARDS.length + ".";
    el.board.innerHTML = '<div class="sum" id="sum">' + CARDS.map(function(c){
      var p = st.ans[c.id], right = p === c.bin;
      var mark = right
        ? '<span class="mk">' + GLYPH.ok + " You got it</span>"
        : '<span class="mk">' + GLYPH.out + " You said " + esc(binOf(p).label) + "</span>";
      return '<div class="si' + (right ? "" : " bad") + '">' +
        '<span class="cn" aria-hidden="true">' + c.n + "</span>" +
        '<div class="sx"><span class="sr">Card ' + c.n + ". </span>" + esc(c.txt) + "</div>" +
        '<div class="sa"><span>Answer: <b>' + esc(binOf(c.bin).label) + "</b></span>" + mark + "</div></div>";
    }).join("") + "</div>";
  }

  /* ---------------- start again ---------------- */
  function resetAll(){ st = fresh(); save(st); i = 0; render(); }
  el.again.addEventListener("click", function(){
    resetAll();
    topFocus();
    say("Cleared. Back to card 1.");
  });

  /* ---------------- navigation ----------------
     Three input methods on every multi-slide deck: visible buttons, keyboard
     arrows, and swipe. */
  function go(d){
    var n = i + d;
    if(!canGo(n)){
      if(d > 0 && S[i].kind === "card" && !answered(S[i].card)){
        el.hint.innerHTML = "<b>Pick one first.</b> Then the next card opens.";
      }
      return;
    }
    i = n; render(); topFocus();
    var s = S[i];
    say("Slide " + (i+1) + " of " + S.length + ". " +
      (s.kind === "card" ? "Card " + s.card.n + ". " + s.card.txt : el.h1.textContent));
    if(s.kind === "score" && firstOpen() < 0 && !reduce){
      var sum = el.board.querySelector("#sum");
      if(sum){ sum.classList.remove("in"); void sum.offsetWidth; sum.classList.add("in"); }
    }
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });

  document.addEventListener("keydown", function(e){
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var s = S[i];
    if(s.kind === "card" && !answered(s.card) && (e.key === "1" || e.key === "2")){
      e.preventDefault(); answer(s.card, e.key === "1" ? "real" : "paper");
    }
  });

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return true;
    var r = node.getAttribute && node.getAttribute("role");
    return r === "slider" || r === "textbox" || r === "spinbutton" || r === "listbox";
  }

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    if(ownsKeys(e.target)){ tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ----------------
     measure-fit.mjs steps through the deck with this. Keep it on every deck.
     answer lets a QA run reach the answered states by script. goto ignores
     the answer-first lock, on purpose, so every slide can be measured. */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    answer:function(n, bin){
      var c = CARDS[n];
      if(!c) return false;
      i = n; render(); answer(c, bin); return st.ans[c.id] === bin;
    },
    reset:function(){ resetAll(); },
    state:function(){ return { i:i, ans:st.ans, score:score() }; }
  };
})();
</script>
</body>
</html>
