<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What goes on each of the twelve slides</title>
<style>
  /* ===============================================================
     WHAT THIS FILE IS. The lesson for Project 4 substep 4.2.2. It
     walks a student through what goes on each of the twelve slides
     of the final deck. It is NOT the template. The template is a
     separate Google Slides file the program owner shares, and the
     student types into that. Nothing here can be edited by a reader
     and nothing here calls itself a template.

     ZERO HTML COMMENTS, on purpose. An HTML comment opener and
     closer each contain two hyphens and this program bans that
     sequence in a file that ships as raw HTML. Every note in this
     build therefore sits inside a CSS block comment or a script
     line comment. CSS custom property names are the one permitted
     doubled hyphen, because they are tokens and not sentences.
     Grep the file for an em dash: it must return zero.

     PALETTE, the program lock. Five values and nothing else. Every
     tint is an rgba() of #001D69, never a sixth hue. No Khan Academy
     green, no Khan Academy logo, no Khan Academy brand asset: this
     is Extern's design system.

     MEASURED CONTRAST RATIOS, computed for this build, not recalled:
       #484646 on #FDF8F8   8.91:1     body copy on the canvas
       #1C1B1B on #FDF8F8  16.33:1     headings on the canvas
       #001D69 on #FDF8F8  14.47:1     labels and accents
       #484646 on #DCE1FF   7.26:1     body copy in a highlight card
       #1C1B1B on #DCE1FF  13.30:1     headings in a highlight card
       #001D69 on #DCE1FF  11.78:1     labels in a highlight card
       #FDF8F8 on #001D69  14.47:1     text on a filled chip
       #DCE1FF on #001D69  11.78:1     secondary text on a filled chip
     Structural borders, which have to clear the 3:1 non text floor
     because they are what identifies a control or a slide region:
       rgba(0,29,105,.6) over #FDF8F8   4.32:1
       rgba(0,29,105,.6) over #DCE1FF   4.00:1
     Decorative rules only, exempt from the floor and never carrying
     meaning on their own:
       rgba(0,29,105,.26) over #FDF8F8  1.73:1
     Surface tint, with body copy measured on it:
       rgba(0,29,105,.05) over #FDF8F8 gives #F0EDF1, and
       #484646 on that surface measures 8.08:1
     No state in this build is signalled by colour alone. Every one
     also carries a word, a border style, or a glyph.
     =============================================================== */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, the pass condition  */
    --on-highlight:#001D69; /* accents, labels, chips, focus ring */
    --bg:#FDF8F8;           /* canvas background                  */
    --body:#484646;         /* body copy and captions             */
    --title:#1C1B1B;        /* headings and hard labels           */

    --edge:rgba(0,29,105,.6);    /* structural borders, 4.32:1    */
    --rule:rgba(0,29,105,.26);   /* decorative rules only         */
    --wash:rgba(0,29,105,.05);   /* surface tint                  */
    --dim:rgba(0,29,105,.34);    /* pip that has not been reached */

    --t-fast:160ms;
    --t-frame:300ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  html{background:#FDF8F8}
  body{
    background:var(--bg);
    color:var(--body);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* =====  the 960 by 540 canvas, scaled DOWN only and never up  =====
     flex:0 0 auto is load bearing. As a shrinkable flex item the
     canvas would lay out at the viewport width between 600 and 899px
     and the script's transform would then scale it a second time,
     shrinking the design twice. The canvas holds 960 in layout and
     lets the transform do all the fitting, so a computed width read
     off #stage must always report 960px. */
  #stage{
    width:960px;height:540px;position:relative;transform-origin:center center;
    flex:0 0 auto;
  }

  /* =====  HEIGHT BUDGET. Nothing in this file may reflow.  =====
     Every region has a fixed height and every panel is built to the
     same skeleton, so no box can grow and push another one down.

       540  canvas
       -24  frame padding, 14 top and 10 bottom
       -22  top row, 16 tall plus 6 margin
       -35  h1, 26 tall on one line plus 9 margin
       -42  bottom bar, 34 tall plus 8 padding top
       ===
       417  the board, fixed

     On a slide panel that 417 splits two ways:
       left column   470 wide: wireframe 260, gap 12, what box 145
       right column  392 wide: three stacked blocks, 417 tall
     Both columns scroll inside themselves if their copy ever grows,
     and each one announces that in words. The check is measured
     SYNCHRONOUSLY: an earlier build in this program deferred it to
     requestAnimationFrame, which never fired under headless
     rendering, so the notice stayed hidden on a panel that had
     content below the fold.
     =============================================================== */

  .frame{
    position:absolute;inset:0;padding:14px 40px 10px;display:flex;flex-direction:column;
    animation:fadein var(--t-frame) var(--ease-io) both;
  }
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  /* The frame is the programmatic focus target after every move, so a
     screen reader announces the new panel. It draws no ring of its
     own: the ring would outline the whole canvas and say nothing. */
  .frame:focus{outline:none}
  .frame:focus-visible{outline:none}

  /* ========== top row: where you are, and the shape of the whole ========== */
  .top{flex:0 0 auto;height:16px;margin-bottom:6px;display:flex;align-items:center;gap:12px}
  .prog{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--on-highlight);white-space:nowrap}
  /* THE RAIL. One tick per frame and nothing else inside it, because
     the fit gate counts every child of this element as a second
     opinion on the frame count. A spacer element of any tag would
     make the count disagree. The two runs of five WIDE ticks are the
     two matched blocks, deal 1 and deal 2, so the rail itself shows
     that the deck is built as two identical halves. */
  .rail{display:flex;align-items:center;gap:2px}
  .rail i{display:block;width:9px;height:4px;border-radius:2px;background:var(--on-highlight);
    opacity:.3;transition:opacity var(--t-fast) var(--ease-out),height var(--t-fast) var(--ease-out)}
  .rail i.blk{width:15px}
  .rail i.gap{margin-left:9px}
  .rail i.on{opacity:1}
  .rail i.here{opacity:1;height:7px;margin-top:-1px}
  .railkey{font-size:10.5px;letter-spacing:.06em;color:var(--body);white-space:nowrap;margin-left:auto}

  h1{flex:0 0 auto;height:26px;margin-bottom:9px;font-size:19px;line-height:26px;
    font-weight:600;color:var(--title);letter-spacing:-.004em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .board{flex:0 0 auto;height:417px;position:relative}

  /* ========== bottom bar ========== */
  .bar{flex:0 0 auto;height:34px;padding-top:8px;box-sizing:content-box;
    display:flex;align-items:center;gap:9px}
  button{font-family:inherit}
  button.nav{font-size:13.5px;font-weight:600;height:34px;padding:0 15px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);background:transparent;
    color:var(--on-highlight);display:flex;align-items:center;gap:7px;
    transition:opacity var(--t-fast) var(--ease-out),background var(--t-fast) var(--ease-out)}
  button.nav svg{width:13px;height:13px;flex:0 0 auto;display:block}
  button.nav.ghost{border-width:1.5px;border-color:var(--edge);color:var(--body)}
  button.nav:hover:not(:disabled){background:var(--wash)}
  button.nav:disabled{opacity:.4;cursor:not-allowed}
  .barnote{font-size:12px;line-height:1.35;color:var(--body);margin-left:auto;text-align:right}

  :focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ================= shared pieces ================= */
  .lab{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
    color:var(--on-highlight);line-height:1.3}
  .card{background:var(--highlight);border:1px solid var(--on-highlight);border-radius:8px}
  .plain{background:transparent;border:1.5px solid var(--edge);border-radius:8px}
  .washed{background:var(--wash);border:1.5px solid var(--edge);border-radius:8px}
  .dash{background:transparent;border:2px dashed var(--edge);border-radius:8px}
  b,strong{color:var(--title);font-weight:600}
  .card b,.card strong{color:var(--title)}

  /* ================= a slide panel ================= */
  .panel{position:absolute;inset:0;display:flex;gap:18px}
  .colL{width:470px;flex:0 0 auto;position:relative}
  .colR{width:392px;flex:0 0 auto;position:relative;height:417px;
    display:flex;flex-direction:column;gap:10px;overflow-y:auto}
  .more{position:absolute;right:0;bottom:0;z-index:2;font-size:11px;line-height:1.3;
    background:var(--highlight);color:var(--on-highlight);border:1px solid var(--on-highlight);
    border-radius:6px;padding:4px 7px;font-weight:600}

  /* ==== the wireframe: a thumbnail of the slide, 470 by 260 ====
     Every label inside it is repeated at full size in the What goes
     on it list beside it, so nothing in this build is available only
     at thumbnail size. role="img" with a written label gives a screen
     reader one description of the layout instead of a dozen
     fragments. */
  .wf{width:470px;height:260px;background:var(--bg);border:1.5px solid var(--edge);
    border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
  .wf.dashed{border-style:dashed}
  .at{background:var(--highlight);border-radius:5px;padding:0 8px;display:flex;
    align-items:center;gap:8px;font-size:11px;line-height:1.25;color:var(--title);font-weight:600}
  .at .atl{font-weight:700;color:var(--on-highlight);letter-spacing:.06em;
    text-transform:uppercase;font-size:9.5px;flex:0 0 auto}
  .at .wdeal{margin-left:auto;flex:0 0 auto;font-size:9.5px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;color:var(--bg);background:var(--on-highlight);
    border-radius:4px;padding:2px 6px}
  .wb{border:1px solid var(--edge);border-radius:5px;padding:5px 7px;display:flex;
    flex-direction:column;gap:3px;min-width:0;overflow:hidden}
  .wb.fill{background:var(--highlight);border-color:var(--on-highlight)}
  .wh{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--on-highlight);line-height:1.25}
  .wt{font-size:11px;line-height:1.25;color:var(--title)}
  .wsrc{font-size:9.5px;line-height:1.25;color:var(--body)}
  .wl{font-size:10px;line-height:1.3;color:var(--body)}
  .wrow2{display:flex;gap:6px}
  .wrow2>*{flex:1 1 0;min-width:0}
  .wstrip{border-top:1px solid var(--rule);display:flex;align-items:center;
    font-size:10px;line-height:1.25;color:var(--body)}
  .wfoot{background:var(--wash);border-radius:5px;display:flex;align-items:center;
    padding:0 7px;font-size:9.5px;line-height:1.25;color:var(--body)}
  .wop{display:flex;align-items:center;justify-content:center;font-size:9.5px;
    font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-highlight)}
  .warow{flex-direction:row;align-items:flex-start;gap:7px}
  .wc{flex:0 0 auto;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--on-highlight);background:var(--highlight);border:1px solid var(--on-highlight);
    border-radius:3px;padding:2px 5px;line-height:1.2}
  .warow>div{min-width:0;display:flex;flex-direction:column;gap:2px}
  .wu{align-self:flex-start;font-size:9px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--on-highlight);border:1px solid var(--edge);
    border-radius:3px;padding:1px 4px;line-height:1.25}
  .whead{display:flex;gap:6px}
  .whead>span{flex:1 1 0;min-width:0}
  .wbeats{gap:4px}

  /* ==== the what box, under the wireframe ==== */
  .whatbox{position:absolute;left:0;bottom:0;width:470px;height:145px;
    background:var(--wash);border:1.5px solid var(--edge);border-radius:8px;
    padding:9px 11px;overflow-y:auto}
  .whatbox ul{list-style:none;margin-top:6px}
  .whatbox li{position:relative;padding-left:13px;font-size:12px;line-height:1.45;color:var(--body)}
  .whatbox li+li{margin-top:4px}
  .whatbox li:before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;
    border-radius:50%;background:var(--on-highlight)}

  /* ==== the right column blocks ==== */
  .rb{flex:0 0 auto;padding:9px 12px}
  .rb p{font-size:12px;line-height:1.5;margin-top:5px}
  .fchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .fchip{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--bg);background:var(--on-highlight);border-radius:4px;padding:3px 7px;line-height:1.25}
  .fchip.none{color:var(--on-highlight);background:transparent;border:1px dashed var(--edge)}
  .ftext{font-size:12px;line-height:1.45;color:var(--title);margin-top:6px}
  .ftext span{display:block}
  .ftext span+span{margin-top:4px}
  .lands{font-size:11px;line-height:1.4;color:var(--body);margin-top:6px}
  .twin{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11.5px;
    line-height:1.35;color:var(--on-highlight);font-weight:600}
  .twin svg{width:13px;height:13px;flex:0 0 auto}

  /* ================= the overview frame ================= */
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center}
  .ovlead{font-size:13px;line-height:1.45;color:var(--body);flex:0 0 auto}
  .ovlead b{color:var(--title)}
  .strip{display:flex;align-items:center;gap:10px;padding:0 12px;text-align:left;
    width:100%;border-radius:8px;cursor:pointer;font-family:inherit;
    transition:border-color var(--t-fast) var(--ease-out),background var(--t-fast) var(--ease-out)}
  .strip .n{flex:0 0 auto;font-size:14px;font-weight:700;color:var(--on-highlight);
    font-variant-numeric:tabular-nums}
  .strip .s{font-size:12.5px;line-height:1.3;color:var(--title)}
  .strip:hover{background:var(--wash)}
  .ovrow{display:flex;gap:12px;flex:0 0 auto}
  .tile{flex:1 1 0;min-width:0;border-radius:8px;cursor:pointer;font-family:inherit;
    text-align:left;padding:7px 9px;display:flex;flex-direction:column;gap:4px;
    transition:border-color var(--t-fast) var(--ease-out),background var(--t-fast) var(--ease-out)}
  .tile .n{font-size:12.5px;font-weight:700;color:var(--on-highlight);font-variant-numeric:tabular-nums}
  .tile .s{font-size:11px;line-height:1.28;color:var(--title)}
  .tile:hover{background:var(--wash)}
  .ovlab{flex:0 0 auto;display:flex;align-items:baseline;gap:8px}
  .ovlab .sub{font-size:11px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--body)}
  .conn{flex:0 0 auto;display:flex;gap:12px;height:16px}
  .conn span{flex:1 1 0;display:block;position:relative}
  .conn span:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:0;
    border-left:1.5px dashed var(--edge)}
  .ovfoot{font-size:12px;line-height:1.4;color:var(--body);flex:0 0 auto}

  /* ================= plain teaching frames ================= */
  .two{position:absolute;inset:0;display:flex;gap:20px;align-items:center}
  .txt p{font-size:15px;line-height:1.5}
  .txt p+p{margin-top:10px}
  .stack{display:flex;flex-direction:column}
  .rows{display:flex;flex-direction:column;gap:4px}
  .frow{display:flex;align-items:flex-start;gap:10px;padding:4px 12px;border-radius:6px;
    border:1px solid var(--rule)}
  .frow .fn{flex:0 0 auto;width:22px;height:22px;border-radius:5px;background:var(--on-highlight);
    color:var(--bg);font-size:11px;font-weight:700;display:flex;align-items:center;
    justify-content:center;line-height:1}
  .frow .ft{flex:1 1 auto;min-width:0;font-size:12.5px;line-height:1.45;color:var(--title)}
  .frow .fl{flex:0 0 auto;width:112px;text-align:right;font-size:11px;line-height:1.45;color:var(--body)}
  .frow.seventh{border:1.5px solid var(--edge);background:var(--wash)}

  .attrib{padding:10px 13px}
  .attrib .who{font-size:12.5px;font-weight:700;color:var(--title);margin-top:5px}
  .attrib .q{font-size:13.5px;line-height:1.45;color:var(--title);margin-top:5px}
  .attrib .why{font-size:11.5px;line-height:1.4;color:var(--body);margin-top:6px}

  .exrow{display:flex;align-items:flex-start;gap:12px;padding:10px 12px}
  .exrow .exl{flex:0 0 auto;width:150px}
  .exrow .exl .tagw{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--on-highlight);line-height:1.3}
  .exrow .exl .note{font-size:11px;line-height:1.35;color:var(--body);margin-top:4px}
  .exrow .exh{flex:1 1 auto;min-width:0;font-size:14.5px;line-height:1.35;color:var(--title);
    font-weight:600}
  .exrow .exh .glyph{display:inline-flex;width:13px;height:13px;margin-right:6px;vertical-align:-1px}

  .diagrow{display:flex;align-items:flex-start;gap:12px;padding:8px 12px}
  .diagrow .dl{flex:0 0 auto;width:212px;font-size:12.5px;line-height:1.4;color:var(--title);
    font-weight:600}
  .diagrow .dr{flex:1 1 auto;min-width:0;font-size:12.5px;line-height:1.45;color:var(--body)}

  .mergerow{display:flex;align-items:center;gap:9px}
  .mtile{flex:0 0 auto;width:196px;border-radius:7px;padding:6px 9px}
  .mtile .n{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--on-highlight)}
  .mtile .s{display:block;margin-top:2px;font-size:11.5px;line-height:1.25;color:var(--title)}
  .mop{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--on-highlight)}
  .mop svg{width:16px;height:12px;display:block}

  .recap{display:flex;gap:10px}
  .recap div{flex:1 1 0;min-width:0;border-radius:7px;padding:7px 9px;font-size:11.5px;
    line-height:1.3;color:var(--title)}

  /* ================= portrait restack, under 600px ================= */
  @media (max-width:599px){
    html,body{height:auto}
    body{display:block;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 34px;min-height:100vh;animation:none}
    .top{height:auto;flex-wrap:wrap;gap:8px}
    .prog{font-size:13px;white-space:normal}
    .rail,.railkey{display:none}
    h1{height:auto;white-space:normal;overflow:visible;text-overflow:clip;font-size:21px;
      line-height:1.22;margin-bottom:12px}
    .board{height:auto}
    .panel,.ov,.two{position:relative;inset:auto;flex-direction:column;gap:14px}
    .colL,.colR{width:100%;height:auto;overflow:visible}
    .wf{width:100%;height:auto;min-height:0;gap:8px}
    .wf>*{height:auto!important;min-height:26px}
    .at{padding:7px 9px;font-size:13px;flex-wrap:wrap}
    .at .atl,.at .wdeal{font-size:11px}
    .wh,.wsrc,.wc,.wu,.wop,.wfoot{font-size:11.5px}
    .wt,.wl,.wstrip{font-size:13px}
    .wb{padding:8px 9px}
    .whatbox{position:relative;left:auto;bottom:auto;width:100%;height:auto;overflow:visible;
      padding:12px 14px}
    .whatbox li{font-size:15px}
    .rb p,.ftext,.diagrow .dl,.diagrow .dr{font-size:15px}
    .lands,.twin,.ovfoot,.ovlead,.strip .s,.tile .s,.recap div{font-size:14.5px}
    .txt p{font-size:16px}
    .frow{flex-wrap:wrap;padding:8px 12px}
    .frow .ft{font-size:14.5px}
    .frow .fl{width:auto;text-align:left;font-size:13px}
    .ovrow{flex-direction:column}
    .conn{display:none}
    .strip,.tile{height:auto!important;padding:11px 12px}
    .mergerow{flex-wrap:wrap}
    .mtile{width:100%}
    .recap{flex-direction:column}
    .exrow{flex-direction:column;gap:6px}
    .exrow .exl{width:100%}
    .exrow .exh{font-size:16px}
    .more{position:relative;right:auto;bottom:auto;display:none}
    .bar{height:auto;flex-wrap:wrap;margin-top:20px}
    button.nav{font-size:15px;height:42px;padding:0 18px}
    .barnote{margin-left:0;text-align:left;font-size:13.5px;width:100%}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="frame" id="frame" tabindex="-1" role="group" aria-label="What goes on each of the twelve slides">

    <div class="top">
      <span class="prog" id="prog"></span>
      <span class="rail" id="segs" aria-hidden="true"></span>
      <span class="railkey">the two wide runs are deal 1 and deal 2</span>
    </div>

    <h1 id="h1"></h1>

    <div class="board" id="board"></div>

    <div class="bar">
      <button class="nav ghost" id="back" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.2 5.2 8l4.8 4.8"/></svg>
        <span>Back</span></button>
      <button class="nav" id="next" type="button">
        <span>Continue</span>
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.2 10.8 8 6 12.8"/></svg>
      </button>

  <div class="nsf">
    <h2>What goes on each of the twelve slides</h2>
    <p><b>This page is the lesson. It is not the template.</b> It sets out what goes on each of the twelve
       slides of your final deck. The template is a separate Google Slides file, and your program owner
       shares the link. It fixes the order and the headings. It writes nothing.</p>
    <p>Your deck is 10 to 12 slides. It presents two deals, and it says which one to pursue first.
       The deck is not new work. It is the same work in a fixed order, and every slide has a field
       you have already written for it. For each slide below you get three things: what goes on it,
       which of the seven fields it answers, and the one thing that makes it pass.</p>

    <h3>THE TWELVE, COUNTED</h3>
    <p>One slide for the recommendation. Five for deal 1: fit, model, both sides, reach, risks.
       Five for deal 2, the same five slides again. One for the first conversation and the ask.
       That is twelve with nothing spare, which is why there is no agenda slide: slide 1 naming both
       deals does the agenda's job. There is also an optional thirteenth, only if you did
       Project 3 Step 3, and it sits outside the 10 to 12 band, so it replaces nothing.</p>

    <h3>ACTION TITLE</h3>
    <p><b>A slide heading that states what you found, not what the slide is about.</b> Every one of the twelve slides gets one. It is the first thing a
       reader reads and often the only thing they remember.</p>
    <p>Names the topic, so the reader still has to work out what you think: &ldquo;Partnership model&rdquo;.
       States the finding, so the reader has your point in one line: &ldquo;Ask the device manufacturer
       for hardware, not cash, because hardware is the cost we cannot cover&rdquo;. That example names no
       real company on purpose. It shows the shape of the sentence. Yours name your two real deals.</p>
    <p>Write all twelve as action titles. Then read only the twelve headings, top to bottom. They should
       tell your whole argument in order. If they do not, a slide is carrying a topic instead of a finding.</p>

    <h3>THE SEVEN FIELDS, AND WHERE EACH ONE LANDS</h3>
    <p>You wrote all seven in Step 1, once for each of your two deals. Six of them appear twice in the
       deck, once per deal, on slides that match. Field 5 appears once, on slide 12, for the deal you
       put first.</p>
    <ul>
      <li><b>1.</b> Why this company is a strategic fit for Khan Academy <span class="s">(slides 2 and 7)</span></li>
      <li><b>2.</b> The specific partnership model they'd recommend (revenue share, product integration, co-selling, etc.) <span class="s">(slides 3 and 8)</span></li>
      <li><b>3.</b> The value proposition for both sides: what Khan Academy gets and what the partner gets <span class="s">(slides 4 and 9)</span></li>
      <li><b>4.</b> Estimated reach or revenue impact <span class="s">(slides 5 and 10)</span></li>
      <li><b>5.</b> A rough outline of what the first conversation or pitch to that company could look like <span class="s">(slide 12 only)</span></li>
      <li><b>6.</b> Any risks or reasons it might not work out or competitors who might fill the space if we don't <span class="s">(slides 6 and 11)</span></li>
      <li><b>7.</b> whether there are competing models already being done or if this would be a first of its kind <span class="s">(slides 3 and 8)</span></li>
    </ul>
    <div class="a">
      <p><b>Field 7 is the one with a name on it.</b> Fields 1 to 6 are the team's own checklist.
         The seventh is Sarah's, and she asked for it in her own sentence.</p>
      <p><b>Sarah Thaler, Ed.D., Senior Strategic Partnerships Manager</b></p>
      <p>&ldquo;I would also be interested in whether there are competing models already being done or if this would be a first of its kind.&rdquo;</p>
    </div>

    <h3>THE TWELVE SLIDES, ONE AT A TIME</h3>

      <h4>Slide 1. The recommendation</h4>
      <p class="k">What goes on it</p>
      <ul><li>Both deals named, and which one you would do first. One sentence, inside a highlight card.</li><li>Nothing else on the slide. No agenda, no list of options, no logos.</li><li>Your name and the date, small, along the bottom.</li></ul>
      <p class="k">Which of the seven fields it answers</p>
      <p>No field answers this slide. It is your answer, and the eleven slides after it are the evidence for it.</p>
      <p class="k">The one thing that makes it pass</p>
      <div class="a"><p>The sentence says which way you would go. A slide 1 that lists two options of equal weight has failed before the deck starts.</p></div>

      <h4>Slide 2. Deal 1: strategic fit</h4>
      <p class="k">What goes on it</p>
      <ul><li>Two columns, one per organization: what Khan Academy is trying to do, and what your partner is trying to do.</li><li>One sourced line in each column, with the period that source covers.</li><li>Where the partner's side is your reading rather than their own statement, say so on the slide.</li></ul>
      <p class="k">Which of the seven fields it answers</p>
      <p><b>Field 1.</b> Why this company is a strategic fit for Khan Academy</p>
      <p class="k">The one thing that makes it pass</p>
      <div class="a"><p>Two sourced lines about what each organization is trying to do. Khan Academy is not the only side on the slide.</p></div>

      <h4>Slide 3. Deal 1: the model, and who has done it</h4>
      <p class="k">What goes on it</p>
      <ul><li>The model you would recommend, named in one line: revenue share, product integration, co-selling.</li><li>Underneath it, a precedent strip: has anyone run this shape before?</li><li>If you found none, the strip says so plainly and names where you looked. That is a complete answer.</li></ul>
      <p class="k">Which of the seven fields it answers</p>
      <p><b>Field 2.</b> The specific partnership model they'd recommend (revenue share, product integration, co-selling, etc.)<br><b>Field 7.</b> whether there are competing models already being done or if this would be a first of its kind</p>
      <p class="k">The one thing that makes it pass</p>
      <div class="a"><p>The model is named, and the precedent strip underneath says whether anyone has run this shape, with a number and a date, or says plainly that no precedent was found. First of its kind is never the claim.</p></div>

      <h4>Slide 4. Deal 1: what each side gets</h4>
      <p class="k">What goes on it</p>
      <ul><li>Two columns, and rows that pair: each thing given faces the thing received.</li><li>The partner's column is written from the partner's chair, in the partner's own units.</li><li>Every benefit carries its unit: how many, per what, and for how long.</li></ul>
      <p class="k">Which of the seven fields it answers</p>
      <p><b>Field 3.</b> The value proposition for both sides: what Khan Academy gets and what the partner gets</p>
      <p class="k">The one thing that makes it pass</p>
      <div class="a"><p>The partner's column is written from the partner's chair. The rows pair, so each thing given faces the thing received, and each benefit carries its unit.</p></div>

      <h4>Slide 5. Deal 1: reach or revenue</h4>
      <p class="k">What goes on it</p>
      <ul><li>The arithmetic, on the slide, in rows a reader can follow down the page.</li><li>Every input row carries its source and the period that source covers.</li><li>Every row you worked out yourself is labelled derived, and a footer says what the number does not claim.</li></ul>
      <p class="k">Which of the seven fields it answers</p>
      <p><b>Field 4.</b> Estimated reach or revenue impact</p>
      <p class="k">The one thing that makes it pass</p>
      <div class="a"><p>The arithmetic is on the slide. Every input carries its source and its period, every worked figure is labelled derived, and a footer line says what the number does not claim.</p></div>

      <h4>Slide 6. Deal 1: risks and alternatives</h4>
      <p class="k">What goes on it</p>
      <ul><li>Two or three risks, no more. Each one paired with what you would say back.</li><li>A strip along the bottom for the organizations that could take this seat instead.</li><li>Call them alternatives, not competitors. They are the other places this deal could go.</li></ul>
      <p class="k">Which of the seven fields it answers</p>
      <p><b>Field 6.</b> Any risks or reasons it might not work out or competitors who might fill the space if we don't</p>
      <p class="k">The one thing that makes it pass</p>
      <div class="a"><p>Two or three risks, each with what you would say back. The people who could take the seat instead are on this slide, and they are called alternatives, not competitors.</p></div>

      <h4>Slide 7. Deal 2: strategic fit</h4>
      <p class="k">What goes on it</p>
      <ul><li>Identical to slide 2. Same headings, same two columns, same order.</li><li>Deal 2's content in deal 1's shape: one sourced line per organization, with its period.</li><li>If deal 2 has less to say here, the slide still exists. A thin slide is a finding. A missing slide is a hole.</li></ul>
      <p class="k">Which of the seven fields it answers</p>
      <p><b>Field 1.</b> Why this company is a strategic fit for Khan Academy</p>
      <p class="k">The one thing that makes it pass</p>
      <div class="a"><p>Identical slide to 2. Same headings, same shape.</p></div>

      <h4>Slide 8. Deal 2: the model, and who has done it</h4>
      <p class="k">What goes on it</p>
      <ul><li>Identical to slide 3. The model named in one line, and the precedent strip underneath.</li><li>Each precedent still carries a number and a date.</li><li>Deal 2 may take a different model from deal 1. That is normal.</li></ul>
      <p class="k">Which of the seven fields it answers</p>
      <p><b>Field 2.</b> The specific partnership model they'd recommend (revenue share, product integration, co-selling, etc.)<br><b>Field 7.</b> whether there are competing models already being done or if this would be a first of its kind</p>
      <p class="k">The one thing that makes it pass</p>
      <div class="a"><p>Identical slide to 3.</p></div>

      <h4>Slide 9. Deal 2: what each side gets</h4>
      <p class="k">What goes on it</p>
      <ul><li>Identical to slide 4. Paired rows, and the partner's column written from the partner's chair.</li><li>Every benefit still carries its unit.</li><li>Same number of rows as slide 4 where you can manage it, because a reader compares row against row.</li></ul>
      <p class="k">Which of the seven fields it answers</p>
      <p><b>Field 3.</b> The value proposition for both sides: what Khan Academy gets and what the partner gets</p>
      <p class="k">The one thing that makes it pass</p>
      <div class="a"><p>Identical slide to 4.</p></div>

      <h4>Slide 10. Deal 2: reach or revenue</h4>
      <p class="k">What goes on it</p>
      <ul><li>Identical to slide 5. The arithmetic on the slide, in rows.</li><li>A source and a period on every input, and a derived label on everything you worked out.</li><li>A footer line saying what the number does not claim.</li></ul>
      <p class="k">Which of the seven fields it answers</p>
      <p><b>Field 4.</b> Estimated reach or revenue impact</p>
      <p class="k">The one thing that makes it pass</p>
      <div class="a"><p>Identical slide to 5.</p></div>

      <h4>Slide 11. Deal 2: risks and alternatives</h4>
      <p class="k">What goes on it</p>
      <ul><li>Identical to slide 6. Two or three risks, each with what you would say back.</li><li>The alternatives strip along the bottom.</li><li>Alternatives, not competitors, in both blocks.</li></ul>
      <p class="k">Which of the seven fields it answers</p>
      <p><b>Field 6.</b> Any risks or reasons it might not work out or competitors who might fill the space if we don't</p>
      <p class="k">The one thing that makes it pass</p>
      <div class="a"><p>Identical slide to 6.</p></div>

      <h4>Slide 12. The first conversation, and the ask</h4>
      <p class="k">What goes on it</p>
      <ul><li>Slide 1's sentence again, word for word, across the top.</li><li>Five one-line beats for the deal you put first, in the order you would say them.</li><li>No new evidence, and no number the deck has not already shown.</li><li>It ends on an ask: the one thing you want the room to agree to.</li></ul>
      <p class="k">Which of the seven fields it answers</p>
      <p><b>Field 5.</b> A rough outline of what the first conversation or pitch to that company could look like</p>
      <p class="k">The one thing that makes it pass</p>
      <div class="a"><p>It is about the recommended deal only, and it ends on an ask rather than on a risk.</p></div>

      <h4>Slide 13. Optional: the school you know</h4>
      <p class="k">What goes on it</p>
      <ul><li>Only if you did Project 3 Step 3. The school you know, and what you found there.</li><li>It sits outside the 10 to 12 band, so it does not replace any of the twelve.</li><li>It is additive, it is yours, and it is not one of your two deals.</li></ul>
      <p class="k">Which of the seven fields it answers</p>
      <p>No field answers this slide, and no other slide depends on it. Take it out and the deck still stands.</p>
      <p class="k">The one thing that makes it pass</p>
      <div class="a"><p>Only if you did Project 3 Step 3. It is yours, it is additive, and it is not one of the two deals. Nothing else in the deck depends on it.</p></div>

    <h3>WHY SLIDES 2 TO 6 AND 7 TO 11 ARE THE SAME SHAPE</h3>
    <p>The two deals get identical treatment so a reader can compare them. Matched blocks are what makes
       that true on a deck somebody clicks through one slide at a time: the reader learns the order once
       on deal 1 and reads deal 2 in half the time, and the two value slides can be read straight across.
       It also means a missing slide shows up by counting. If deal 2 has less to say on a slide, the slide
       still exists. A thin slide is a finding. A missing slide is a hole.</p>

    <h3>A SLIDE WITH NOTHING TO PUT ON IT IS NOT A SLIDE PROBLEM</h3>
    <p>Every one of the twelve slides has a field already written for it. So if you reach a slide and have
       nothing to put on it, the slide is not the problem. A field was not finished in Step 1.</p>
    <ul>
      <li>Nothing for slide 5 or slide 10? Field 4 has no arithmetic in it yet. Go back and do the sum,
          with a source and a period on each input.</li>
      <li>Nothing for slide 3's precedent strip? Field 7 was left open. Either you find a precedent with
          a number and a date on it, or you write down that you found none and where you looked.</li>
      <li>Nothing for slide 6's alternatives strip? Field 6 stopped at the risks. The other organizations
          that could take this seat are the second half of that field.</li>
    </ul>
    <p>Go back to the field, finish it, and come back. Do not invent a line to fill the slide, because an
       invented line is the first thing a reader tests. <b>A thin slide is fine. An empty one is a message.</b></p>

    <h3>THE ONE WAY DOWN TO TEN SLIDES, AND WHAT IT COSTS</h3>
    <p>The band is 10 to 12 slides. Twelve is the shape above. If you genuinely have less to say, there is
       one permitted way down to ten: put fit and model on one slide per deal. Slides 2 and 3 become one
       slide, slides 7 and 8 become one slide, and the deck is ten.</p>
    <p><b>What it costs, and it costs the same thing twice.</b> One idea per slide, twice, in the two places
       where the deal's whole logic sits. Slide 2's job is to prove the fit is real for both organizations.
       Slide 3's job is to name the model and show whether anyone has run it. Merge them and one of the two
       gets the smaller half of the slide. That is the trade, and now you choose. Nothing else in the twelve
       may be merged, dropped or reordered.</p>

    <h3>BEFORE YOU START BUILDING</h3>
    <p>One worked example already exists, and it is worth reading again before you build: the sample deal
       case. It answers all seven fields for one deal. You run the same treatment twice, once per deal, so
       do not count its sections and think the ask has changed.</p>
    <p><b>One line on imagery.</b> A screenshot of a real, current Khan Academy page is allowed on a slide
       as evidence, with a visible caption saying where it came from. Khan Academy's logo, colours or brand
       assets as the deck's own look are not allowed, on either route.</p>
    <p>Every number on your deck carries its source and the period it covers, on the same slide as the
       number. Every acronym is expanded on the slide where it first appears. Those two are checked on your
       own deck at the end of this step.</p>
