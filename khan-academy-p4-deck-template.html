aces nothing.</p>\n</div>\n</div>\n</div>","gap":false,"blk":false,"panel":false},{"slug":"seven-fields","prog":"Before the twelve","title":"The seven fields you have already written","html":"<div style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center\">\n<p style=\"font-size:13.5px;line-height:1.45;flex:0 0 auto\">You wrote all seven in Step 1, once for each of your two deals. Six of them appear twice in the deck, once per deal, on slides that match. Field 5 appears once, on slide 12, for the deal you put first.</p>\n<div class=\"rows\" style=\"margin-top:11px;flex:0 0 auto\"><div class=\"frow\"><span class=\"fn\">1</span><span class=\"ft\">Why this company is a strategic fit for Khan Academy</span><span class=\"fl\">slides 2 and 7</span></div><div class=\"frow\"><span class=\"fn\">2</span><span class=\"ft\">The specific partnership model they'd recommend (revenue share, product integration, co-selling, etc.)</span><span class=\"fl\">slides 3 and 8</span></div><div class=\"frow\"><span class=\"fn\">3</span><span class=\"ft\">The value proposition for both sides: what Khan Academy gets and what the partner gets</span><span class=\"fl\">slides 4 and 9</span></div><div class=\"frow\"><span class=\"fn\">4</span><span class=\"ft\">Estimated reach or revenue impact</span><span class=\"fl\">slides 5 and 10</span></div><div class=\"frow\"><span class=\"fn\">5</span><span class=\"ft\">A rough outline of what the first conversation or pitch to that company could look like</span><span class=\"fl\">slide 12 only</span></div><div class=\"frow\"><span class=\"fn\">6</span><span class=\"ft\">Any risks or reasons it might not work out or competitors who might fill the space if we don't</span><span class=\"fl\">slides 6 and 11</span></div><div class=\"frow seventh\"><span class=\"fn\">7</span><span class=\"ft\">whether there are competing models already being done or if this would be a first of its kind</span><span class=\"fl\">slides 3 and 8</span></div></div>\n<div class=\"attrib card\" style=\"margin-top:12px;flex:0 0 auto\">\n<p class=\"lab\">Field 7 is the one with a name on it</p>\n<p style=\"font-size:12px;line-height:1.4;margin-top:5px\">Fields 1 to 6 are the team's own checklist. The seventh is Sarah's, and she asked for it in her own sentence.</p>\n<p class=\"who\">Sarah Thaler, Ed.D., Senior Strategic Partnerships Manager</p>\n<p class=\"q\">&ldquo;I would also be interested in whether there are competing models already being done or if this would be a first of its kind.&rdquo;</p>\n</div>\n</div>","gap":false,"blk":false,"panel":false},{"slug":"action-title","prog":"Before the twelve","title":"Action title: the heading rule all twelve slides need","html":"<div style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center\">\n<div class=\"card\" style=\"padding:12px 14px;flex:0 0 auto\">\n<p class=\"lab\">Action title</p>\n<p style=\"font-size:16px;line-height:1.4;margin-top:6px\"><b>A slide heading that states what you found, not what the slide is about.</b></p>\n<p style=\"font-size:12.5px;line-height:1.45;margin-top:7px\">Every one of the twelve slides gets one. It is the first thing a reader reads and often the only thing they remember.</p>\n</div>\n<div class=\"exrow plain\" style=\"margin-top:13px;flex:0 0 auto\">\n<div class=\"exl\"><p class=\"tagw\">Names the topic</p><p class=\"note\">The reader still has to work out what you think.</p></div>\n<div class=\"exh\"><span class=\"glyph\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M4 4l8 8M12 4l-8 8\"/></svg></span>Partnership model</div>\n</div>\n<div class=\"exrow card\" style=\"margin-top:9px;flex:0 0 auto\">\n<div class=\"exl\"><p class=\"tagw\">States the finding</p><p class=\"note\">The reader has your point in one line.</p></div>\n<div class=\"exh\"><span class=\"glyph\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 8.6l3.1 3.1L13 4.8\"/></svg></span>Ask the device manufacturer for hardware, not cash, because hardware is the cost we cannot cover</div>\n</div>\n<p style=\"font-size:13px;line-height:1.45;margin-top:13px;flex:0 0 auto\">Write all twelve as action titles. Then read only the twelve headings, top to bottom. They should tell your whole argument in order. If they do not, a slide is carrying a topic instead of a finding.</p>\n<p style=\"font-size:11.5px;line-height:1.4;margin-top:7px;flex:0 0 auto\">The example above names no real company on purpose. It shows the shape of the sentence. Yours name your two real deals.</p>\n<div class=\"plain\" style=\"padding:10px 13px;margin-top:12px;flex:0 0 auto\">\n<p class=\"lab\">Where it goes, and when you write it</p>\n<p style=\"font-size:12.5px;line-height:1.45;margin-top:6px\">On every thumbnail from here on, the bar across the top of the slide is the action title. It is the widest thing on the slide, and it is the last thing you write, once you know what that slide found.</p>\n</div>\n</div>","gap":false,"blk":false,"panel":false},{"slug":"all-twelve","prog":"The shape","title":"The twelve slides at a glance","html":"<div class=\"ov\">\n<p class=\"ovlead\"><b>Slides 2 to 6 and slides 7 to 11 are the same five slides, in the same order.</b> That is what lets a reader compare your two deals. Click any slide to read what goes on it.</p>\n<button class=\"strip card\" type=\"button\" data-go=\"slide-01-recommendation\" style=\"height:42px;margin-top:11px;flex:0 0 auto\"><span class=\"n\">1</span><span class=\"s\">The recommendation. Both deals named, and which one goes first.</span></button>\n<p class=\"lab ovlab\" style=\"margin-top:11px\"><span>Deal 1</span></p>\n<div class=\"ovrow\" style=\"height:70px;margin-top:4px\"><button class=\"tile plain\" type=\"button\" data-go=\"slide-02-fit-deal-1\"><span class=\"n\">2</span><span class=\"s\">Strategic fit</span></button><button class=\"tile plain\" type=\"button\" data-go=\"slide-03-model-deal-1\"><span class=\"n\">3</span><span class=\"s\">The model, and who has done it</span></button><button class=\"tile plain\" type=\"button\" data-go=\"slide-04-both-sides-deal-1\"><span class=\"n\">4</span><span class=\"s\">What each side gets</span></button><button class=\"tile plain\" type=\"button\" data-go=\"slide-05-reach-deal-1\"><span class=\"n\">5</span><span class=\"s\">Reach or revenue</span></button><button class=\"tile plain\" type=\"button\" data-go=\"slide-06-risks-deal-1\"><span class=\"n\">6</span><span class=\"s\">Risks and alternatives</span></button></div>\n<div class=\"conn\" aria-hidden=\"true\"><span></span><span></span><span></span><span></span><span></span></div>\n<p class=\"lab ovlab\"><span>Deal 2</span><span class=\"sub\">the same five slides, in the same order</span></p>\n<div class=\"ovrow\" style=\"height:70px;margin-top:4px\"><button class=\"tile plain\" type=\"button\" data-go=\"slide-07-fit-deal-2\"><span class=\"n\">7</span><span class=\"s\">Strategic fit</span></button><button class=\"tile plain\" type=\"button\" data-go=\"slide-08-model-deal-2\"><span class=\"n\">8</span><span class=\"s\">The model, and who has done it</span></button><button class=\"tile plain\" type=\"button\" data-go=\"slide-09-both-sides-deal-2\"><span class=\"n\">9</span><span class=\"s\">What each side gets</span></button><button class=\"tile plain\" type=\"button\" data-go=\"slide-10-reach-deal-2\"><span class=\"n\">10</span><span class=\"s\">Reach or revenue</span></button><button class=\"tile plain\" type=\"button\" data-go=\"slide-11-risks-deal-2\"><span class=\"n\">11</span><span class=\"s\">Risks and alternatives</span></button></div>\n<div style=\"display:flex;gap:12px;margin-top:11px;flex:0 0 auto\">\n<button class=\"strip card\" type=\"button\" data-go=\"slide-12-first-conversation\" style=\"height:42px;flex:1 1 0\"><span class=\"n\">12</span><span class=\"s\">The first conversation, and the ask.</span></button>\n<button class=\"strip dash\" type=\"button\" data-go=\"slide-13-school-optional\" style=\"height:42px;flex:1 1 0\"><span class=\"n\">13</span><span class=\"s\">Optional: the school you know. Outside the band.</span></button>\n</div>\n<p class=\"ovfoot\" style=\"margin-top:10px\">A reader learns the order once on deal 1 and reads deal 2 in half the time. It also means a missing slide shows up by counting.</p>\n</div>","gap":true,"blk":false,"panel":false},{"slug":"slide-01-recommendation","prog":"Slide 1 of 12","title":"Slide 1. The recommendation","html":"<div class=\"panel\">\n<div class=\"colL\">\n<div class=\"wf\" role=\"img\" aria-label=\"Thumbnail of slide 1: an action title bar across the top, one large highlight card holding a single sentence, a strip reading nothing else, and a small footer line for your name and the date.\">\n<div class=\"at\" style=\"height:28px\"><span class=\"atl\">Action title</span>the recommendation, in one sentence</div>\n<div class=\"wb fill\" style=\"height:138px;justify-content:center\"><span class=\"wh\">One sentence, in a highlight card</span><span class=\"wt\">Both deals named, and which one you would do first</span></div>\n<div class=\"wstrip\" style=\"height:26px\">Nothing else: no agenda, no list of options, no logos</div>\n<div class=\"wfoot\" style=\"height:22px\">your name, and the date</div>\n</div>\n<div class=\"whatbox\" id=\"wbox\">\n<p class=\"lab\">What goes on it</p>\n<ul><li>Both deals named, and which one you would do first. One sentence, inside a highlight card.</li><li>Nothing else on the slide. No agenda, no list of options, no logos.</li><li>Your name and the date, small, along the bottom.</li></ul>\n</div>\n<p class=\"more\" id=\"lmore\" hidden>More copy below in this box. Scroll it.</p>\n</div>\n<div class=\"colR\" id=\"colR\">\n<div class=\"rb washed\">\n<p class=\"lab\">Which of the seven fields it answers</p>\n<div class=\"fchips\"><span class=\"fchip none\">No field</span></div>\n<p class=\"ftext\"><span>No field answers this slide. It is your answer, and the eleven slides after it are the evidence for it.</span></p>\n</div>\n<div class=\"rb card\">\n<p class=\"lab\">The one thing that makes it pass</p>\n<p>The sentence says which way you would go. A slide 1 that lists two options of equal weight has failed before the deck starts.</p>\n\n</div>\n<div class=\"rb plain\">\n<p class=\"lab\">Worth knowing</p>\n<p>Write this sentence before you build anything else. If you cannot write it, you have not made the decision yet, and every slide after it will hedge.</p>\n</div>\n</div>\n<p class=\"more\" id=\"rmore\" hidden>More copy below in this column. Scroll it.</p>\n</div>","gap":true,"blk":false,"panel":true},{"slug":"slide-02-fit-deal-1","prog":"Slide 2 of 12","title":"Slide 2. Deal 1: strategic fit","html":"<div class=\"panel\">\n<div class=\"colL\">\n<div class=\"wf\" role=\"img\" aria-label=\"Thumbnail of a strategic fit slide: an action title bar, then two side by side boxes, one per organization, each with a heading, a line, and a source and period line, then a filled card stating the fit in one line, then a strip along the bottom.\">\n<div class=\"at\" style=\"height:28px\"><span class=\"atl\">Action title</span>what the fit is, in one line<span class=\"wdeal\">Deal 1</span></div>\n<div class=\"wrow2\" style=\"height:120px\">\n<div class=\"wb\"><span class=\"wh\">Khan Academy</span><span class=\"wt\">what we are trying to do</span><span class=\"wsrc\">Source, and the period it covers</span></div>\n<div class=\"wb\"><span class=\"wh\">The partner</span><span class=\"wt\">what they are trying to do</span><span class=\"wsrc\">Source, and the period it covers</span></div>\n</div>\n<div class=\"wb fill\" style=\"height:52px;justify-content:center\"><span class=\"wh\">The fit, in one line</span><span class=\"wt\">why those two columns add up to a reason to ask this partner</span></div>\n<div class=\"wstrip\" style=\"height:26px\">Your reading, labelled as your reading, wherever the partner has not said it themselves</div>\n</div>\n<div class=\"whatbox\" id=\"wbox\">\n<p class=\"lab\">What goes on it</p>\n<ul><li>Two columns, one per organization: what Khan Academy is trying to do, and what your partner is trying to do.</li><li>One sourced line in each column, with the period that source covers.</li><li>Where the partner's side is your reading rather than their own statement, say so on the slide.</li></ul>\n</div>\n<p class=\"more\" id=\"lmore\" hidden>More copy below in this box. Scroll it.</p>\n</div>\n<div class=\"colR\" id=\"colR\">\n<div class=\"rb washed\">\n<p class=\"lab\">Which of the seven fields it answers</p>\n<div class=\"fchips\"><span class=\"fchip\">Field 1</span></div>\n<p class=\"ftext\"><span>1. Why this company is a strategic fit for Khan Academy</span></p><p class=\"lands\">Field 1 lands on slides 2 and 7.</p>\n</div>\n<div class=\"rb card\">\n<p class=\"lab\">The one thing that makes it pass</p>\n<p>Two sourced lines about what each organization is trying to do. Khan Academy is not the only side on the slide.</p>\n\n</div>\n<div class=\"rb plain\">\n<p class=\"lab\">Worth knowing</p>\n<p>A fit is two organizations, not one. A slide that only says what Khan Academy wants has not said why this partner is the one to ask.</p>\n</div>\n</div>\n<p class=\"more\" id=\"rmore\" hidden>More copy below in this column. Scroll it.</p>\n</div>","gap":true,"blk":true,"panel":true},{"slug":"slide-03-model-deal-1","prog":"Slide 3 of 12","title":"Slide 3. Deal 1: the model, and who has done it","html":"<div class=\"panel\">\n<div class=\"colL\">\n<div class=\"wf\" role=\"img\" aria-label=\"Thumbnail of a model slide: an action title bar, one filled box naming the model, a box holding a precedent strip of three lines, and a strip along the bottom.\">\n<div class=\"at\" style=\"height:28px\"><span class=\"atl\">Action title</span>the model you would recommend<span class=\"wdeal\">Deal 1</span></div>\n<div class=\"wb fill\" style=\"height:70px;justify-content:center\"><span class=\"wh\">The model</span><span class=\"wt\">revenue share, product integration, co-selling: name the one you recommend</span></div>\n<div class=\"wb\" style=\"height:104px;justify-content:center\"><span class=\"wh\">Precedent strip</span><span class=\"wl\">who has run this shape, with a number and a date</span><span class=\"wl\">who has run this shape, with a number and a date</span><span class=\"wl\">or, in one line: no precedent found, and where you looked</span></div>\n<div class=\"wstrip\" style=\"height:24px\">Two fields on one slide: the model, and whether anybody has run it before</div>\n</div>\n<div class=\"whatbox\" id=\"wbox\">\n<p class=\"lab\">What goes on it</p>\n<ul><li>The model you would recommend, named in one line: revenue share, product integration, co-selling.</li><li>Underneath it, a precedent strip: has anyone run this shape before?</li><li>If you found none, the strip says so plainly and names where you looked. That is a complete answer.</li></ul>\n</div>\n<p class=\"more\" id=\"lmore\" hidden>More copy below in this box. Scroll it.</p>\n</div>\n<div class=\"colR\" id=\"colR\">\n<div class=\"rb washed\">\n<p class=\"lab\">Which of the seven fields it answers</p>\n<div class=\"fchips\"><span class=\"fchip\">Field 2</span><span class=\"fchip\">Field 7</span></div>\n<p class=\"ftext\"><span>2. The specific partnership model they'd recommend (revenue share, product integration, co-selling, etc.)</span><span>7. whether there are competing models already being done or if this would be a first of its kind</span></p><p class=\"lands\">Fields 2 and 7 land on slides 3 and 8.</p>\n</div>\n<div class=\"rb card\">\n<p class=\"lab\">The one thing that makes it pass</p>\n<p>The model is named, and the precedent strip underneath says whether anyone has run this shape, with a number and a date, or says plainly that no precedent was found. First of its kind is never the claim.</p>\n\n</div>\n<div class=\"rb plain\">\n<p class=\"lab\">Worth knowing</p>\n<p>Two fields share this slide because the second qualifies the first: the precedent sits under the thing it is about.</p>\n</div>\n</div>\n<p class=\"more\" id=\"rmore\" hidden>More copy below in this column. Scroll it.</p>\n</div>","gap":false,"blk":true,"panel":true},{"slug":"slide-04-both-sides-deal-1","prog":"Slide 4 of 12","title":"Slide 4. Deal 1: what each side gets","html":"<div class=\"panel\">\n<div class=\"colL\">\n<div class=\"wf\" role=\"img\" aria-label=\"Thumbnail of a value slide: an action title bar, two column headings, three rows of paired boxes each carrying a unit chip, then a strip along the bottom.\">\n<div class=\"at\" style=\"height:28px\"><span class=\"atl\">Action title</span>what the exchange actually is<span class=\"wdeal\">Deal 1</span></div>\n<div class=\"whead\" style=\"height:16px\"><span class=\"wh\">Khan Academy gets</span><span class=\"wh\">The partner gets</span></div>\n<div class=\"wrow2\" style=\"height:48px\"><div class=\"wb\"><span class=\"wt\">a thing given</span><span class=\"wu\">its unit</span></div><div class=\"wb\"><span class=\"wt\">the thing received</span><span class=\"wu\">its unit</span></div></div>\n<div class=\"wrow2\" style=\"height:48px\"><div class=\"wb\"><span class=\"wt\">a thing given</span><span class=\"wu\">its unit</span></div><div class=\"wb\"><span class=\"wt\">the thing received</span><span class=\"wu\">its unit</span></div></div>\n<div class=\"wrow2\" style=\"height:48px\"><div class=\"wb\"><span class=\"wt\">a thing given</span><span class=\"wu\">its unit</span></div><div class=\"wb\"><span class=\"wt\">the thing received</span><span class=\"wu\">its unit</span></div></div>\n<div class=\"wstrip\" style=\"height:26px\">The partner's column, written from the partner's chair and in the partner's own units</div>\n</div>\n<div class=\"whatbox\" id=\"wbox\">\n<p class=\"lab\">What goes on it</p>\n<ul><li>Two columns, and rows that pair: each thing given faces the thing received.</li><li>The partner's column is written from the partner's chair, in the partner's own units.</li><li>Every benefit carries its unit: how many, per what, and for how long.</li></ul>\n</div>\n<p class=\"more\" id=\"lmore\" hidden>More copy below in this box. Scroll it.</p>\n</div>\n<div class=\"colR\" id=\"colR\">\n<div class=\"rb washed\">\n<p class=\"lab\">Which of the seven fields it answers</p>\n<div class=\"fchips\"><span class=\"fchip\">Field 3</span></div>\n<p class=\"ftext\"><span>3. The value proposition for both sides: what Khan Academy gets and what the partner gets</span></p><p class=\"lands\">Field 3 lands on slides 4 and 9.</p>\n</div>\n<div class=\"rb card\">\n<p class=\"lab\">The one thing that makes it pass</p>\n<p>The partner's column is written from the partner's chair. The rows pair, so each thing given faces the thing received, and each benefit carries its unit.</p>\n\n</div>\n<div class=\"rb plain\">\n<p class=\"lab\">Worth knowing</p>\n<p>A benefit with no unit on it is a wish. Access to teachers is a wish. Access to teachers in a stated number of districts, for a stated school year, is a benefit.</p>\n</div>\n</div>\n<p class=\"more\" id=\"rmore\" hidden>More copy below in this column. Scroll it.</p>\n</div>","gap":false,"blk":true,"panel":true},{"slug":"slide-05-reach-deal-1","prog":"Slide 5 of 12","title":"Slide 5. Deal 1: reach or revenue","html":"<div class=\"panel\">\n<div class=\"colL\">\n<div class=\"wf\" role=\"img\" aria-label=\"Thumbnail of a number slide: an action title bar, an input row with a source and period line, an operator line, a second input row, another operator line, a derived row, and a footer strip.\">\n<div class=\"at\" style=\"height:28px\"><span class=\"atl\">Action title</span>the number, and what it is<span class=\"wdeal\">Deal 1</span></div>\n<div class=\"wb warow\" style=\"height:42px\"><span class=\"wc\">Input</span><div><span class=\"wt\">the figure, and what it counts</span><span class=\"wsrc\">Source, and the period it covers</span></div></div>\n<div class=\"wop\" style=\"height:14px\">times</div>\n<div class=\"wb warow\" style=\"height:42px\"><span class=\"wc\">Input</span><div><span class=\"wt\">the figure, and what it counts</span><span class=\"wsrc\">Source, and the period it covers</span></div></div>\n<div class=\"wop\" style=\"height:14px\">equals</div>\n<div class=\"wb warow fill\" style=\"height:44px\"><span class=\"wc\">Derived</span><div><span class=\"wt\">the figure you worked out yourself</span></div></div>\n<div class=\"wfoot\" style=\"height:24px\">What this number does not claim</div>\n</div>\n<div class=\"whatbox\" id=\"wbox\">\n<p class=\"lab\">What goes on it</p>\n<ul><li>The arithmetic, on the slide, in rows a reader can follow down the page.</li><li>Every input row carries its source and the period that source covers.</li><li>Every row you worked out yourself is labelled derived, and a footer says what the number does not claim.</li></ul>\n</div>\n<p class=\"more\" id=\"lmore\" hidden>More copy below in this box. Scroll it.</p>\n</div>\n<div class=\"colR\" id=\"colR\">\n<div class=\"rb washed\">\n<p class=\"lab\">Which of the seven fields it answers</p>\n<div class=\"fchips\"><span class=\"fchip\">Field 4</span></div>\n<p class=\"ftext\"><span>4. Estimated reach or revenue impact</span></p><p class=\"lands\">Field 4 lands on slides 5 and 10.</p>\n</div>\n<div class=\"rb card\">\n<p class=\"lab\">The one thing that makes it pass</p>\n<p>The arithmetic is on the slide. Every input carries its source and its period, every worked figure is labelled derived, and a footer line says what the number does not claim.</p>\n\n</div>\n<div class=\"rb plain\">\n<p class=\"lab\">Worth knowing</p>\n<p>The rows on the left hold the shape of a sourced figure, not a figure. Yours hold your real numbers, and each keeps its source and its period beside it on this slide.</p>\n</div>\n</div>\n<p class=\"more\" id=\"rmore\" hidden>More copy below in this column. Scroll it.</p>\n</div>","gap":false,"blk":true,"panel":true},{"slug":"slide-06-risks-deal-1","prog":"Slide 6 of 12","title":"Slide 6. Deal 1: risks and alternatives","html":"<div class=\"panel\">\n<div class=\"colL\">\n<div class=\"wf\" role=\"img\" aria-label=\"Thumbnail of a risks slide: an action title bar, two column headings reading risk and what you would say back, two paired rows, a dashed third row, then an alternatives strip along the bottom.\">\n<div class=\"at\" style=\"height:28px\"><span class=\"atl\">Action title</span>the risk that matters, and your answer to it<span class=\"wdeal\">Deal 1</span></div>\n<div class=\"whead\" style=\"height:16px\"><span class=\"wh\">Risk</span><span class=\"wh\">What you would say back</span></div>\n<div class=\"wrow2\" style=\"height:56px\"><div class=\"wb\"><span class=\"wt\">the risk, in one line</span></div><div class=\"wb\"><span class=\"wt\">your answer, in one line</span></div></div>\n<div class=\"wrow2\" style=\"height:56px\"><div class=\"wb\"><span class=\"wt\">the risk, in one line</span></div><div class=\"wb\"><span class=\"wt\">your answer, in one line</span></div></div>\n<div class=\"wb dash\" style=\"height:32px;border:1.5px dashed rgba(0,29,105,.6);justify-content:center\"><span class=\"wl\">a third pair, only if you have a third risk worth the room</span></div>\n<div class=\"wstrip\" style=\"height:26px\">Alternatives: who could take this seat instead, if this deal does not happen</div>\n</div>\n<div class=\"whatbox\" id=\"wbox\">\n<p class=\"lab\">What goes on it</p>\n<ul><li>Two or three risks, no more. Each one paired with what you would say back.</li><li>A strip along the bottom for the organizations that could take this seat instead.</li><li>Call them alternatives, not competitors. They are the other places this deal could go.</li></ul>\n</div>\n<p class=\"more\" id=\"lmore\" hidden>More copy below in this box. Scroll it.</p>\n</div>\n<div class=\"colR\" id=\"colR\">\n<div class=\"rb washed\">\n<p class=\"lab\">Which of the seven fields it answers</p>\n<div class=\"fchips\"><span class=\"fchip\">Field 6</span></div>\n<p class=\"ftext\"><span>6. Any risks or reasons it might not work out or competitors who might fill the space if we don't</span></p><p class=\"lands\">Field 6 lands on slides 6 and 11.</p>\n</div>\n<div class=\"rb card\">\n<p class=\"lab\">The one thing that makes it pass</p>\n<p>Two or three risks, each with what you would say back. The people who could take the seat instead are on this slide, and they are called alternatives, not competitors.</p>\n\n</div>\n<div class=\"rb plain\">\n<p class=\"lab\">Worth knowing</p>\n<p>A risk with no answer under it reads as a warning about your own recommendation. A risk with an answer under it reads as somebody who has already thought about it.</p>\n</div>\n</div>\n<p class=\"more\" id=\"rmore\" hidden>More copy below in this column. Scroll it.</p>\n</div>","gap":false,"blk":true,"panel":true},{"slug":"slide-07-fit-deal-2","prog":"Slide 7 of 12","title":"Slide 7. Deal 2: strategic fit","html":"<div class=\"panel\">\n<div class=\"colL\">\n<div class=\"wf\" role=\"img\" aria-label=\"Thumbnail of a strategic fit slide: an action title bar, then two side by side boxes, one per organization, each with a heading, a line, and a source and period line, then a filled card stating the fit in one line, then a strip along the bottom.\">\n<div class=\"at\" style=\"height:28px\"><span class=\"atl\">Action title</span>what the fit is, in one line<span class=\"wdeal\">Deal 2</span></div>\n<div class=\"wrow2\" style=\"height:120px\">\n<div class=\"wb\"><span class=\"wh\">Khan Academy</span><span class=\"wt\">what we are trying to do</span><span class=\"wsrc\">Source, and the period it covers</span></div>\n<div class=\"wb\"><span class=\"wh\">The partner</span><span class=\"wt\">what they are trying to do</span><span class=\"wsrc\">Source, and the period it covers</span></div>\n</div>\n<div class=\"wb fill\" style=\"height:52px;justify-content:center\"><span class=\"wh\">The fit, in one line</span><span class=\"wt\">why those two columns add up to a reason to ask this partner</span></div>\n<div class=\"wstrip\" style=\"height:26px\">Your reading, labelled as your reading, wherever the partner has not said it themselves</div>\n</div>\n<div class=\"whatbox\" id=\"wbox\">\n<p class=\"lab\">What goes on it</p>\n<ul><li>Identical to slide 2. Same headings, same two columns, same order.</li><li>Deal 2's content in deal 1's shape: one sourced line per organization, with its period.</li><li>If deal 2 has less to say here, the slide still exists. A thin slide is a finding. A missing slide is a hole.</li></ul>\n</div>\n<p class=\"more\" id=\"lmore\" hidden>More copy below in this box. Scroll it.</p>\n</div>\n<div class=\"colR\" id=\"colR\">\n<div class=\"rb washed\">\n<p class=\"lab\">Which of the seven fields it answers</p>\n<div class=\"fchips\"><span class=\"fchip\">Field 1</span></div>\n<p class=\"ftext\"><span>1. Why this company is a strategic fit for Khan Academy</span></p><p class=\"lands\">Field 1 lands on slides 2 and 7.</p>\n</div>\n<div class=\"rb card\">\n<p class=\"lab\">The one thing that makes it pass</p>\n<p>Identical slide to 2. Same headings, same shape.</p>\n<p class=\"twin\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M6.4 9.6 9.6 6.4\"/><path d=\"M4.9 8.1 3.6 9.4a2.4 2.4 0 0 0 3.4 3.4l1.3-1.3\"/><path d=\"M11.1 7.9l1.3-1.3a2.4 2.4 0 0 0-3.4-3.4L7.7 4.5\"/></svg><span>The thumbnail on the left is slide 2's thumbnail. Nothing about the layout changes.</span></p>\n</div>\n<div class=\"rb plain\">\n<p class=\"lab\">Worth knowing</p>\n<p>This is where the matched blocks start paying. Your reader learned this layout on slide 2, so they read deal 2 in half the time and can compare the columns straight across.</p>\n</div>\n</div>\n<p class=\"more\" id=\"rmore\" hidden>More copy below in this column. Scroll it.</p>\n</div>","gap":true,"blk":true,"panel":true},{"slug":"slide-08-model-deal-2","prog":"Slide 8 of 12","title":"Slide 8. Deal 2: the model, and who has done it","html":"<div class=\"panel\">\n<div class=\"colL\">\n<div class=\"wf\" role=\"img\" aria-label=\"Thumbnail of a model slide: an action title bar, one filled box naming the model, a box holding a precedent strip of three lines, and a strip along the bottom.\">\n<div class=\"at\" style=\"height:28px\"><span class=\"atl\">Action title</span>the model you would recommend<span class=\"wdeal\">Deal 2</span></div>\n<div class=\"wb fill\" style=\"height:70px;justify-content:center\"><span class=\"wh\">The model</span><span class=\"wt\">revenue share, product integration, co-selling: name the one you recommend</span></div>\n<div class=\"wb\" style=\"height:104px;justify-content:center\"><span class=\"wh\">Precedent strip</span><span class=\"wl\">who has run this shape, with a number and a date</span><span class=\"wl\">who has run this shape, with a number and a date</span><span class=\"wl\">or, in one line: no precedent found, and where you looked</span></div>\n<div class=\"wstrip\" style=\"height:24px\">Two fields on one slide: the model, and whether anybody has run it before</div>\n</div>\n<div class=\"whatbox\" id=\"wbox\">\n<p class=\"lab\">What goes on it</p>\n<ul><li>Identical to slide 3. The model named in one line, and the precedent strip underneath.</li><li>Each precedent still carries a number and a date.</li><li>Deal 2 may take a different model from deal 1. That is normal.</li></ul>\n</div>\n<p class=\"more\" id=\"lmore\" hidden>More copy below in this box. Scroll it.</p>\n</div>\n<div class=\"colR\" id=\"colR\">\n<div class=\"rb washed\">\n<p class=\"lab\">Which of the seven fields it answers</p>\n<div class=\"fchips\"><span class=\"fchip\">Field 2</span><span class=\"fchip\">Field 7</span></div>\n<p class=\"ftext\"><span>2. The specific partnership model they'd recommend (revenue share, product integration, co-selling, etc.)</span><span>7. whether there are competing models already being done or if this would be a first of its kind</span></p><p class=\"lands\">Fields 2 and 7 land on slides 3 and 8.</p>\n</div>\n<div class=\"rb card\">\n<p class=\"lab\">The one thing that makes it pass</p>\n<p>Identical slide to 3.</p>\n<p class=\"twin\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M6.4 9.6 9.6 6.4\"/><path d=\"M4.9 8.1 3.6 9.4a2.4 2.4 0 0 0 3.4 3.4l1.3-1.3\"/><path d=\"M11.1 7.9l1.3-1.3a2.4 2.4 0 0 0-3.4-3.4L7.7 4.5\"/></svg><span>The thumbnail on the left is slide 3's thumbnail. Nothing about the layout changes.</span></p>\n</div>\n<div class=\"rb plain\">\n<p class=\"lab\">Worth knowing</p>\n<p>Two deals can be defensible on different models: matching the slide does not mean matching the answer. And no precedent found is still a complete answer.</p>\n</div>\n</div>\n<p class=\"more\" id=\"rmore\" hidden>More copy below in this column. Scroll it.</p>\n</div>","gap":false,"blk":true,"panel":true},{"slug":"slide-09-both-sides-deal-2","prog":"Slide 9 of 12","title":"Slide 9. Deal 2: what each side gets","html":"<div class=\"panel\">\n<div class=\"colL\">\n<div class=\"wf\" role=\"img\" aria-label=\"Thumbnail of a value slide: an action title bar, two column headings, three rows of paired boxes each carrying a unit chip, then a strip along the bottom.\">\n<div class=\"at\" style=\"height:28px\"><span class=\"atl\">Action title</span>what the exchange actually is<span class=\"wdeal\">Deal 2</span></div>\n<div class=\"whead\" style=\"height:16px\"><span class=\"wh\">Khan Academy gets</span><span class=\"wh\">The partner gets</span></div>\n<div class=\"wrow2\" style=\"height:48px\"><div class=\"wb\"><span class=\"wt\">a thing given</span><span class=\"wu\">its unit</span></div><div class=\"wb\"><span class=\"wt\">the thing received</span><span class=\"wu\">its unit</span></div></div>\n<div class=\"wrow2\" style=\"height:48px\"><div class=\"wb\"><span class=\"wt\">a thing given</span><span class=\"wu\">its unit</span></div><div class=\"wb\"><span class=\"wt\">the thing received</span><span class=\"wu\">its unit</span></div></div>\n<div class=\"wrow2\" style=\"height:48px\"><div class=\"wb\"><span class=\"wt\">a thing given</span><span class=\"wu\">its unit</span></div><div class=\"wb\"><span class=\"wt\">the thing received</span><span class=\"wu\">its unit</span></div></div>\n<div class=\"wstrip\" style=\"height:26px\">The partner's column, written from the partner's chair and in the partner's own units</div>\n</div>\n<div class=\"whatbox\" id=\"wbox\">\n<p class=\"lab\">What goes on it</p>\n<ul><li>Identical to slide 4. Paired rows, and the partner's column written from the partner's chair.</li><li>Every benefit still carries its unit.</li><li>Same number of rows as slide 4 where you can manage it, because a reader compares row against row.</li></ul>\n</div>\n<p class=\"more\" id=\"lmore\" hidden>More copy below in this box. Scroll it.</p>\n</div>\n<div class=\"colR\" id=\"colR\">\n<div class=\"rb washed\">\n<p class=\"lab\">Which of the seven fields it answers</p>\n<div class=\"fchips\"><span class=\"fchip\">Field 3</span></div>\n<p class=\"ftext\"><span>3. The value proposition for both sides: what Khan Academy gets and what the partner gets</span></p><p class=\"lands\">Field 3 lands on slides 4 and 9.</p>\n</div>\n<div class=\"rb card\">\n<p class=\"lab\">The one thing that makes it pass</p>\n<p>Identical slide to 4.</p>\n<p class=\"twin\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M6.4 9.6 9.6 6.4\"/><path d=\"M4.9 8.1 3.6 9.4a2.4 2.4 0 0 0 3.4 3.4l1.3-1.3\"/><path d=\"M11.1 7.9l1.3-1.3a2.4 2.4 0 0 0-3.4-3.4L7.7 4.5\"/></svg><span>The thumbnail on the left is slide 4's thumbnail. Nothing about the layout changes.</span></p>\n</div>\n<div class=\"rb plain\">\n<p class=\"lab\">Worth knowing</p>\n<p>This pair is the one a partnerships lead reads hardest, because it is where your two deals are most directly comparable.</p>\n</div>\n</div>\n<p class=\"more\" id=\"rmore\" hidden>More copy below in this column. Scroll it.</p>\n</div>","gap":false,"blk":true,"panel":true},{"slug":"slide-10-reach-deal-2","prog":"Slide 10 of 12","title":"Slide 10. Deal 2: reach or revenue","html":"<div class=\"panel\">\n<div class=\"colL\">\n<div class=\"wf\" role=\"img\" aria-label=\"Thumbnail of a number slide: an action title bar, an input row with a source and period line, an operator line, a second input row, another operator line, a derived row, and a footer strip.\">\n<div class=\"at\" style=\"height:28px\"><span class=\"atl\">Action title</span>the number, and what it is<span class=\"wdeal\">Deal 2</span></div>\n<div class=\"wb warow\" style=\"height:42px\"><span class=\"wc\">Input</span><div><span class=\"wt\">the figure, and what it counts</span><span class=\"wsrc\">Source, and the period it covers</span></div></div>\n<div class=\"wop\" style=\"height:14px\">times</div>\n<div class=\"wb warow\" style=\"height:42px\"><span class=\"wc\">Input</span><div><span class=\"wt\">the figure, and what it counts</span><span class=\"wsrc\">Source, and the period it covers</span></div></div>\n<div class=\"wop\" style=\"height:14px\">equals</div>\n<div class=\"wb warow fill\" style=\"height:44px\"><span class=\"wc\">Derived</span><div><span class=\"wt\">the figure you worked out yourself</span></div></div>\n<div class=\"wfoot\" style=\"height:24px\">What this number does not claim</div>\n</div>\n<div class=\"whatbox\" id=\"wbox\">\n<p class=\"lab\">What goes on it</p>\n<ul><li>Identical to slide 5. The arithmetic on the slide, in rows.</li><li>A source and a period on every input, and a derived label on everything you worked out.</li><li>A footer line saying what the number does not claim.</li></ul>\n</div>\n<p class=\"more\" id=\"lmore\" hidden>More copy below in this box. Scroll it.</p>\n</div>\n<div class=\"colR\" id=\"colR\">\n<div class=\"rb washed\">\n<p class=\"lab\">Which of the seven fields it answers</p>\n<div class=\"fchips\"><span class=\"fchip\">Field 4</span></div>\n<p class=\"ftext\"><span>4. Estimated reach or revenue impact</span></p><p class=\"lands\">Field 4 lands on slides 5 and 10.</p>\n</div>\n<div class=\"rb card\">\n<p class=\"lab\">The one thing that makes it pass</p>\n<p>Identical slide to 5.</p>\n<p class=\"twin\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M6.4 9.6 9.6 6.4\"/><path d=\"M4.9 8.1 3.6 9.4a2.4 2.4 0 0 0 3.4 3.4l1.3-1.3\"/><path d=\"M11.1 7.9l1.3-1.3a2.4 2.4 0 0 0-3.4-3.4L7.7 4.5\"/></svg><span>The thumbnail on the left is slide 5's thumbnail. Nothing about the layout changes.</span></p>\n</div>\n<div class=\"rb plain\">\n<p class=\"lab\">Worth knowing</p>\n<p>If one deal's number is a reach figure and the other's is a revenue figure, say which is which in the heading. Two numbers in different units are not a comparison until they are labelled.</p>\n</div>\n</div>\n<p class=\"more\" id=\"rmore\" hidden>More copy below in this column. Scroll it.</p>\n</div>","gap":false,"blk":true,"panel":true},{"slug":"slide-11-risks-deal-2","prog":"Slide 11 of 12","title":"Slide 11. Deal 2: risks and alternatives","html":"<div class=\"panel\">\n<div class=\"colL\">\n<div class=\"wf\" role=\"img\" aria-label=\"Thumbnail of a risks slide: an action title bar, two column headings reading risk and what you would say back, two paired rows, a dashed third row, then an alternatives strip along the bottom.\">\n<div class=\"at\" style=\"height:28px\"><span class=\"atl\">Action title</span>the risk that matters, and your answer to it<span class=\"wdeal\">Deal 2</span></div>\n<div class=\"whead\" style=\"height:16px\"><span class=\"wh\">Risk</span><span class=\"wh\">What you would say back</span></div>\n<div class=\"wrow2\" style=\"height:56px\"><div class=\"wb\"><span class=\"wt\">the risk, in one line</span></div><div class=\"wb\"><span class=\"wt\">your answer, in one line</span></div></div>\n<div class=\"wrow2\" style=\"height:56px\"><div class=\"wb\"><span class=\"wt\">the risk, in one line</span></div><div class=\"wb\"><span class=\"wt\">your answer, in one line</span></div></div>\n<div class=\"wb dash\" style=\"height:32px;border:1.5px dashed rgba(0,29,105,.6);justify-content:center\"><span class=\"wl\">a third pair, only if you have a third risk worth the room</span></div>\n<div class=\"wstrip\" style=\"height:26px\">Alternatives: who could take this seat instead, if this deal does not happen</div>\n</div>\n<div class=\"whatbox\" id=\"wbox\">\n<p class=\"lab\">What goes on it</p>\n<ul><li>Identical to slide 6. Two or three risks, each with what you would say back.</li><li>The alternatives strip along the bottom.</li><li>Alternatives, not competitors, in both blocks.</li></ul>\n</div>\n<p class=\"more\" id=\"lmore\" hidden>More copy below in this box. Scroll it.</p>\n</div>\n<div class=\"colR\" id=\"colR\">\n<div class=\"rb washed\">\n<p class=\"lab\">Which of the seven fields it answers</p>\n<div class=\"fchips\"><span class=\"fchip\">Field 6</span></div>\n<p class=\"ftext\"><span>6. Any risks or reasons it might not work out or competitors who might fill the space if we don't</span></p><p class=\"lands\">Field 6 lands on slides 6 and 11.</p>\n</div>\n<div class=\"rb card\">\n<p class=\"lab\">The one thing that makes it pass</p>\n<p>Identical slide to 6.</p>\n<p class=\"twin\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M6.4 9.6 9.6 6.4\"/><path d=\"M4.9 8.1 3.6 9.4a2.4 2.4 0 0 0 3.4 3.4l1.3-1.3\"/><path d=\"M11.1 7.9l1.3-1.3a2.4 2.4 0 0 0-3.4-3.4L7.7 4.5\"/></svg><span>The thumbnail on the left is slide 6's thumbnail. Nothing about the layout changes.</span></p>\n</div>\n<div class=\"rb plain\">\n<p class=\"lab\">Worth knowing</p>\n<p>Slide 11 ends the matched pair, so it is where a reader stops comparing and starts deciding. What they carry into slide 12 is whichever deal had the answerable risks.</p>\n</div>\n</div>\n<p class=\"more\" id=\"rmore\" hidden>More copy below in this column. Scroll it.</p>\n</div>","gap":false,"blk":true,"panel":true},{"slug":"slide-12-first-conversation","prog":"Slide 12 of 12","title":"Slide 12. The first conversation, and the ask","html":"<div class=\"panel\">\n<div class=\"colL\">\n<div class=\"wf\" role=\"img\" aria-label=\"Thumbnail of the closing slide: an action title bar, a highlight card repeating slide 1's sentence, a box holding five numbered one line beats, and a footer strip carrying the ask.\">\n<div class=\"at\" style=\"height:28px\"><span class=\"atl\">Action title</span>the ask, in one line</div>\n<div class=\"wb fill\" style=\"height:34px;justify-content:center\"><span class=\"wt\">Slide 1's sentence again, word for word</span></div>\n<div class=\"wb wbeats\" style=\"height:140px\"><span class=\"wh\">Five one line beats, for the deal you put first</span><span class=\"wl\">1. one line</span><span class=\"wl\">2. one line</span><span class=\"wl\">3. one line</span><span class=\"wl\">4. one line</span><span class=\"wl\">5. one line</span></div>\n<div class=\"wfoot\" style=\"height:24px\">The ask: the one thing you want the room to agree to</div>\n</div>\n<div class=\"whatbox\" id=\"wbox\">\n<p class=\"lab\">What goes on it</p>\n<ul><li>Slide 1's sentence again, word for word, across the top.</li><li>Five one-line beats for the deal you put first, in the order you would say them.</li><li>No new evidence, and no number the deck has not already shown.</li><li>It ends on an ask: the one thing you want the room to agree to.</li></ul>\n</div>\n<p class=\"more\" id=\"lmore\" hidden>More copy below in this box. Scroll it.</p>\n</div>\n<div class=\"colR\" id=\"colR\">\n<div class=\"rb washed\">\n<p class=\"lab\">Which of the seven fields it answers</p>\n<div class=\"fchips\"><span class=\"fchip\">Field 5</span></div>\n<p class=\"ftext\"><span>5. A rough outline of what the first conversation or pitch to that company could look like</span></p><p class=\"lands\">Field 5 lands on slide 12 only.</p>\n</div>\n<div class=\"rb card\">\n<p class=\"lab\">The one thing that makes it pass</p>\n<p>It is about the recommended deal only, and it ends on an ask rather than on a risk.</p>\n\n</div>\n<div class=\"rb plain\">\n<p class=\"lab\">Worth knowing</p>\n<p>This is the lightest slide in the deck to build. Five short lines, and you already have every fact in them. Deal 2 does not appear here, and that is the point.</p>\n</div>\n</div>\n<p class=\"more\" id=\"rmore\" hidden>More copy below in this column. Scroll it.</p>\n</div>","gap":true,"blk":false,"panel":true},{"slug":"slide-13-school-optional","prog":"Optional slide 13","title":"Slide 13. Optional: the school you know","html":"<div class=\"panel\">\n<div class=\"colL\">\n<div class=\"wf dashed\" role=\"img\" aria-label=\"Thumbnail of the optional thirteenth slide, drawn with a dashed border: an action title bar, a filled box showing that slide 12 ends on the ask, and beneath it a dashed box for the school you know, labelled as sitting outside the ten to twelve band.\">\n<div class=\"at\" style=\"height:28px\"><span class=\"atl\">Action title</span>what you found at the school you know</div>\n<div class=\"wb fill\" style=\"height:74px;justify-content:center\"><span class=\"wh\">Slide 12</span><span class=\"wt\">ends on the ask, and the twelve slides are finished here</span></div>\n<div class=\"wop\" style=\"height:14px\">then, and only if you have it</div>\n<div class=\"wb\" style=\"height:110px;border-style:dashed;justify-content:center\"><span class=\"wh\">Slide 13, outside the 10 to 12 band</span><span class=\"wt\">The school you know, and what you found there.</span><span class=\"wl\">Additive. Not one of your two deals. Nothing else depends on it.</span></div>\n</div>\n<div class=\"whatbox\" id=\"wbox\">\n<p class=\"lab\">What goes on it</p>\n<ul><li>Only if you did Project 3 Step 3. The school you know, and what you found there.</li><li>It sits outside the 10 to 12 band, so it does not replace any of the twelve.</li><li>It is additive, it is yours, and it is not one of your two deals.</li></ul>\n</div>\n<p class=\"more\" id=\"lmore\" hidden>More copy below in this box. Scroll it.</p>\n</div>\n<div class=\"colR\" id=\"colR\">\n<div class=\"rb washed\">\n<p class=\"lab\">Which of the seven fields it answers</p>\n<div class=\"fchips\"><span class=\"fchip none\">No field</span></div>\n<p class=\"ftext\"><span>No field answers this slide, and no other slide depends on it. Take it out and the deck still stands.</span></p>\n</div>\n<div class=\"rb card\">\n<p class=\"lab\">The one thing that makes it pass</p>\n<p>Only if you did Project 3 Step 3. It is yours, it is additive, and it is not one of the two deals. Nothing else in the deck depends on it.</p>\n\n</div>\n<div class=\"rb plain\">\n<p class=\"lab\">Worth knowing</p>\n<p>Put it last, after the ask. A reader who has already agreed to something reads it as a bonus. A reader who meets it in the middle reads it as a detour.</p>\n</div>\n</div>\n<p class=\"more\" id=\"rmore\" hidden>More copy below in this column. Scroll it.</p>\n</div>","gap":true,"blk":false,"panel":true},{"slug":"empty-slide-diagnostic","prog":"After the twelve","title":"A slide with nothing to put on it is not a slide problem","html":"<div style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center\">\n<p style=\"font-size:15px;line-height:1.5;flex:0 0 auto\">Every one of the twelve slides has a field already written for it. So if you reach a slide and have nothing to put on it, the slide is not the problem. A field was not finished in Step 1.</p>\n<div style=\"display:flex;flex-direction:column;gap:7px;margin-top:12px;flex:0 0 auto\">\n<div class=\"diagrow plain\"><span class=\"dl\">Nothing for slide 5 or slide 10?</span><span class=\"dr\">Field 4 has no arithmetic in it yet. Go back and do the sum, with a source and a period on each input.</span></div>\n<div class=\"diagrow plain\"><span class=\"dl\">Nothing for slide 3's precedent strip?</span><span class=\"dr\">Field 7 was left open. Either you find a precedent with a number and a date on it, or you write down that you found none and where you looked.</span></div>\n<div class=\"diagrow plain\"><span class=\"dl\">Nothing for slide 6's alternatives strip?</span><span class=\"dr\">Field 6 stopped at the risks. The other organizations that could take this seat are the second half of that field.</span></div>\n</div>\n<div class=\"card\" style=\"padding:11px 14px;margin-top:12px;flex:0 0 auto\">\n<p class=\"lab\">The point of a fixed shape</p>\n<p style=\"font-size:13.5px;line-height:1.45;margin-top:6px\">Go back to the field, finish it, and come back. Do not invent a line to fill the slide, because an invented line is the first thing a reader tests. <b>A thin slide is fine. An empty one is a message.</b></p>\n</div>\n</div>","gap":true,"blk":false,"panel":false},{"slug":"ten-slide-compression","prog":"After the twelve","title":"The one way down to ten slides, and what it costs","html":"<div style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center\">\n<p style=\"font-size:14.5px;line-height:1.45;flex:0 0 auto\">The band is 10 to 12 slides. Twelve is the shape you have just read. If you genuinely have less to say, there is <b>one</b> permitted way down to ten: put fit and model on one slide per deal.</p>\n<div class=\"mergerow\" style=\"margin-top:8px\"><span class=\"mtile plain\"><span class=\"n\">Slide 2</span><span class=\"s\">Strategic fit</span></span><span class=\"mop\">plus</span><span class=\"mtile plain\"><span class=\"n\">Slide 3</span><span class=\"s\">The model, and who has done it</span></span><span class=\"mop\"><svg viewBox=\"0 0 20 12\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 6h16M13 2l4 4-4 4\"/></svg></span><span class=\"mtile card\"><span class=\"n\">Slide 2</span><span class=\"s\">Fit and model, together</span></span></div>\n<div class=\"mergerow\" style=\"margin-top:8px\"><span class=\"mtile plain\"><span class=\"n\">Slide 7</span><span class=\"s\">Strategic fit</span></span><span class=\"mop\">plus</span><span class=\"mtile plain\"><span class=\"n\">Slide 8</span><span class=\"s\">The model, and who has done it</span></span><span class=\"mop\"><svg viewBox=\"0 0 20 12\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 6h16M13 2l4 4-4 4\"/></svg></span><span class=\"mtile card\"><span class=\"n\">Slide 7</span><span class=\"s\">Fit and model, together</span></span></div>\n<div class=\"card\" style=\"padding:11px 14px;margin-top:11px;flex:0 0 auto\">\n<p class=\"lab\">What it costs, and it costs the same thing twice</p>\n<p style=\"font-size:13px;line-height:1.45;margin-top:6px\">It costs you one idea per slide, twice, in the two places where the deal's whole logic sits. Slide 2's job is to prove the fit is real for both organizations. Slide 3's job is to name the model and show whether anyone has run it. Merge them and one of the two gets the smaller half of the slide.</p>\n</div>\n<p style=\"font-size:13px;line-height:1.45;margin-top:10px;flex:0 0 auto\">Slides 2 and 3 become one slide, slides 7 and 8 become one slide, and the deck is ten. <b>That is the trade, and now you choose.</b> Nothing else in the twelve may be merged, dropped or reordered.</p>\n</div>","gap":false,"blk":false,"panel":false},{"slug":"before-you-build","prog":"After the twelve","title":"Before you start building","html":"<div style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center\">\n<div class=\"two\" style=\"position:relative;inset:auto;flex:0 0 auto\">\n<div class=\"txt\" style=\"width:530px;flex:0 0 auto\">\n<p>One worked example already exists, and it is worth reading again before you build: the sample deal case. It answers all seven fields for <b>one</b> deal. You run the same treatment twice, once per deal, so do not count its sections and think the ask has changed.</p>\n<p>The template fixes the order and the headings. It writes nothing. Every word on your twelve slides is a field you have already written.</p>\n</div>\n<div class=\"card\" style=\"width:332px;flex:0 0 auto;padding:11px 13px\">\n<p class=\"lab\">One line on imagery</p>\n<p style=\"font-size:12.5px;line-height:1.45;margin-top:6px\">A screenshot of a real, current Khan Academy page is allowed on a slide as evidence, with a visible caption saying where it came from. Khan Academy's logo, colours or brand assets as the deck's own look are not allowed, on either route.</p>\n</div>\n</div>\n<div class=\"recap\" style=\"margin-top:14px;flex:0 0 auto\">\n<div class=\"plain\">Twelve headings, every one an action title</div>\n<div class=\"plain\">Two matched blocks: slides 2 to 6, and slides 7 to 11</div>\n<div class=\"plain\">Slide 1 says which way you would go</div>\n<div class=\"plain\">Slide 12 ends on an ask, not on a risk</div>\n</div>\n<p style=\"font-size:13px;line-height:1.45;margin-top:14px;flex:0 0 auto\">Every number on your deck carries its source and the period it covers, on the same slide as the number. Every acronym is expanded on the slide where it first appears. Those two are checked on your own deck at the end of this step.</p>\n</div>","gap":false,"blk":false,"panel":false}];
  var N = F.length;

  var el = {};
  ["frame","prog","segs","h1","board","back","next","overview","live","barnote"]
    .forEach(function(k){ el[k] = document.getElementById(k); });

  // A small, failure tolerant record of where the student got to, so
  // "read half of it and come back" is a true statement. Keyed by
  // panel SLUG and never by index: if the frames are ever reordered
  // or one is added, a saved position cannot land on a different
  // panel. Every read and every write is wrapped, so a browser with
  // storage switched off loses the record and not the lesson.
  var KEY = "ka-p4-deck-template-v1";
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!raw || typeof raw !== "object") return {};
      return raw;
    }catch(e){ return {}; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify({ at:F[i].slug })); }catch(e){}
  }

  var i = 0;
  (function(){
    var s = load().at;
    if(typeof s !== "string") return;
    for(var k=0;k<N;k++){ if(F[k].slug === s){ i = k; return; } }
  })();

  function announce(m){ el.live.textContent = m; }

  // Every scrolling region says so in words. Measured SYNCHRONOUSLY:
  // reading scrollHeight forces layout, and an earlier build in this
  // program deferred this to requestAnimationFrame, which never fired
  // under headless rendering, so the notice stayed hidden on a panel
  // that had copy below the fold. The notice is hidden before the read
  // so its own height is never counted as part of what it reports on.
  function flag(scrollerId, flagId){
    var s = document.getElementById(scrollerId), f = document.getElementById(flagId);
    if(!s || !f) return;
    f.hidden = true;
    f.hidden = !(s.scrollHeight - s.clientHeight > 4);
  }

  function rail(){
    var out = "";
    for(var k=0;k<N;k++){
      var c = [];
      if(F[k].blk) c.push("blk");
      if(F[k].gap) c.push("gap");
      if(k === i) c.push("here");
      else if(k < i) c.push("on");
      out += '<i class="' + c.join(" ") + '"></i>';
    }
    el.segs.innerHTML = out;
  }

  function render(move){
    var f = F[i];
    el.prog.textContent = f.prog;
    el.h1.textContent = f.title;
    el.h1.title = f.title;
    el.board.innerHTML = f.html;
    rail();
    el.back.disabled = (i === 0);
    el.next.disabled = (i === N - 1);
    el.overview.disabled = (f.slug === "all-twelve");
    el.barnote.textContent = f.panel
      ? "Left and right arrow keys move between slides."
      : "Left and right arrow keys move through the walkthrough.";
    // The frame is restarted so the fade plays again on every move,
    // and it takes focus so a screen reader reads the new panel.
    el.frame.style.animation = "none";
    void el.frame.offsetWidth;
    el.frame.style.animation = "";
    if(move) el.frame.focus();
    flag("wbox", "lmore");
    flag("colR", "rmore");
    announce(f.prog + ". " + f.title + ". Item " + (i + 1) + " of " + N + ".");
    save();
  }

  function go(n, quiet){
    if(n < 0 || n > N - 1) return;
    i = n;
    render(!quiet);
  }
  function step(d){ go(i + d); }
  function gotoSlug(s){
    for(var k=0;k<N;k++){ if(F[k].slug === s){ go(k); return; } }
  }

  el.back.addEventListener("click", function(){ step(-1); });
  el.next.addEventListener("click", function(){ step(1); });
  el.overview.addEventListener("click", function(){ gotoSlug("all-twelve"); });

  // One delegated listener, so the twelve tiles on the overview frame
  // need no wiring of their own and cannot be left unwired when a
  // frame is rebuilt.
  el.board.addEventListener("click", function(e){
    var t = e.target;
    while(t && t !== el.board){
      if(t.getAttribute && t.getAttribute("data-go")){ gotoSlug(t.getAttribute("data-go")); return; }
      t = t.parentNode;
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
    if(tag === "input" || tag === "textarea") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); step(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
    else if(e.key === "Home"){ e.preventDefault(); go(0); }
    else if(e.key === "End"){ e.preventDefault(); go(N - 1); }
  });

  // ===== the 960 by 540 canvas, scaled DOWN only and never up =====
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){
      stage.style.transform = "";
      return;
    }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render(false);
  fit();

  // The QA hook the fit gate steps the build with. Without it only the
  // first painted frame can be measured, which is exactly how an
  // overflowing panel ships.
  window.__ex = {
    slides:F.length,
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= F.length) return false;
      go(n, true); return true;
    },
    reset:function(){ go(0, true); return true; },
    state:function(){ return { i:i, slug:F[i].slug, title:F[i].title }; }
  };
})();
</script>
</body>
</html>
