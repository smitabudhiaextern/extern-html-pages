  <div class="nsf">
    <h1>How Coursera started, and who pays now</h1>
    <p>Five points, in order. The last one is a question, and it is left open on purpose.</p>

    <h2>1. The origin, 2012</h2>
    <p>Andrew Ng and Daphne Koller, two Stanford professors, founded Coursera in 2012 and put real university courses online for free. Anyone could sign up and take a course without paying for it.</p>
    <p class="keep"><strong>Hold onto this.</strong> The learner paid nothing. That was the offer from the very first day.</p>

    <h2>2. The scale</h2>
    <p>Real university courses, free to take, turned out to be a very popular combination. Coursera grew from that first set of Stanford courses into a global catalogue, and into a company that now reports its financial results publicly every quarter.</p>
    <p class="keep"><strong>No growth figure appears here.</strong> No number is quoted anywhere on this page, and no early growth number was verified in any case. So the growth is described rather than counted.</p>

    <h2>3. The problem</h2>
    <p>Servers, engineers, support, course production, and the arrangements with universities all cost money every month. None of those costs stop because the person taking the course is not paying. Free at that scale is expensive to run, so the money has to arrive from somewhere other than the learner.</p>
    <p class="keep"><strong>The shape of it.</strong> If the learner is not paying and the costs are real, somebody else has to be paying.</p>

    <h2>4. Who pays now</h2>
    <p>Organisations buy access for their people. Coursera&rsquo;s Enterprise segment is the part of the business that sells to them.</p>
    <p><strong>The Enterprise segment is one part of Coursera&rsquo;s total revenue, not the whole of it.</strong> It is a segment, and the company total is a larger number. Reading a segment figure as the company total understates the company by a wide margin, and that is the single most common error made with this business.</p>
    <p>Source: <a href="https://www.sec.gov/Archives/edgar/data/1651562/000165156226000015/cour-20251231.htm">Coursera, Form 10-K for the year ended 31 December 2025</a>, filed with the SEC. The amounts themselves are in the reading, not on this screen.</p>

    <h2>5. The question</h2>
    <p>Most Coursera courses can still be audited or previewed free, by anyone. Nothing above changes that. Organisations are paying anyway.</p>
    <p class="ask"><strong>So what is an organisation buying that a free learner is not?</strong></p>
    <p>That question is not answered here. Work it out yourself first, then take your answer into the rest of the module.</p>

    <p class="foot">No amount, customer count or derived average appears on this page, on purpose. They are all in the reading, each with the period it belongs to. Coursera says you have the option to audit or preview most courses, and no catalogue share figure is published, so none is claimed here.</p>

      lab2:"Hold onto this",
      note:"The learner paid nothing. That was the offer from the very first day, and it is where the rest of this screen comes from.",
      src:{t:"Coursera was founded in 2012 by Andrew Ng and Daphne Koller, out of Stanford."},
      say:"Two Stanford professors put real university courses online free in 2012."
    },
    {
      rail:"The scale", step:"Point 2",
      head:"It grew fast",
      dia:{kind:"flow", items:[
        {t:"2012", c:"A first set of courses, out of one university"},
        {a:"more universities, more learners"},
        {t:"The years after", c:"Courses from institutions around the world"},
        {a:"and now"},
        {t:"Today", c:"A global catalogue, and results reported publicly every quarter"}
      ]},
      lab1:"What happened",
      body:"Real university courses, free to take, turned out to be a very popular combination. Coursera grew from that first set of Stanford courses into a <b>global catalogue</b>, and into a company that now reports its financial results publicly every quarter.",
      lab2:"No number here, on purpose",
      note:"This screen quotes no figure at all, and no early growth figure was verified in any case. So the growth is <b>described, not counted</b>. A number you cannot source is not better than a sentence you can.",
      src:null,
      say:"Coursera grew fast. No growth figure is shown, because none was verified for this build."
    },
    {
      rail:"The problem", step:"Point 3",
      head:"Free at that scale costs real money to run",
      dia:{kind:"flow", items:[
        {t:"The learner", c:"Takes the course, pays nothing", out:true},
        {a:"so no money arrives from here"},
        {t:"Running free courses at scale", c:"Servers, engineers, support, course production, arrangements with universities"},
        {a:"so the money has to come from"},
        {t:"Somebody else", c:"Who?", ask:true}
      ]},
      lab1:"What happened",
      body:"Servers, engineers, support, course production, and the arrangements with universities all cost money every month. <b>None of those costs stop because the person taking the course is not paying.</b>",
      lab2:"The shape of it",
      note:"If the learner is not paying and the costs are real, somebody else has to be paying. That is not a business trick. It is arithmetic.",
      src:null,
      say:"Free courses at that scale cost real money to run, and the learner is not paying, so somebody else has to."
    },
    {
      rail:"Who pays", step:"Point 4, financial year 2025",
      head:"Organisations buy access for their people",
      dia:{kind:"bars"},
      lab1:"What the filing says",
      body:"Organisations buy access for their people, and Coursera’s <b>Enterprise segment</b> is the part of the business that sells to them. Enterprise is <b>one part of the company’s total revenue</b>, not the whole of it, and the bars are drawn to the real proportion.",
      lab2:"Two habits, from this frame",
      note:"<b>Name the segment when you quote a segment figure.</b> Reading a segment as the company total understates the company badly. <b>Carry the period.</b> Every amount and every count belongs to a stated year.",
      src:{t:"Coursera, Form 10-K for the year ended 31 December 2025",
           n:"The amounts are in the reading, not on this screen.",
           u:"https://www.sec.gov/Archives/edgar/data/1651562/000165156226000015/cour-20251231.htm"},
      say:"Organisations buy access for their people. Coursera’s Enterprise segment is one part of the company’s total revenue and not the total itself. The bars show that proportion. The amounts are in the reading."
    },
    {
      rail:"The question", step:"Point 5",
      head:"So what is an organisation buying?",
      dia:{kind:"ask"},
      lab1:"Where that leaves you",
      body:"Nothing on the last four points takes the free option away. So the gap between a learner who pays nothing and an organisation that pays is the thing worth explaining, and <b>this screen does not explain it</b>. That is deliberate.",
      lab2:"This one stays open",
      note:"No answer appears on this screen. Write down what you think it is before you go on, so you can check your own guess against what you find later.",
      src:{t:"Coursera, 13 August 2026",
           n:"Coursera says you have the option to audit or preview most courses. No catalogue share figure is published, so none is claimed here.",
           u:"https://www.coursera.org/articles/what-is-coursera"},
      say:"Most Coursera courses can still be audited or previewed free. So what is an organisation buying that a free learner is not? This question is left open."
    }
  ];

  var CLOSER = "That is the end of this screen. The question stays open.";

  var el = {};
  ["frame","count","rail","head","dia","lab1","body","lab2","note","src","prev","next","hint","live"]
    .forEach(function(k){ el[k] = document.getElementById(k); });

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cur = 0;
  var wasPortrait = window.matchMedia("(max-width:599px)").matches;

  /* ---------------- diagram builders ---------------- */

  function flowHTML(items){
    var out = '', i, it;
    for(i = 0; i < items.length; i++){
      it = items[i];
      if(it.a){
        out += '<div class="fa' + (it.rev ? ' rev' : '') + '">' + ARROW +
               '<span class="fal">' + it.a + '</span></div>';
      } else {
        out += '<div class="fb' + (it.out ? ' out' : '') + (it.ask ? ' ask' : '') + '">' +
               '<div class="fbt">' + it.t + '</div>' +
               '<div class="fbc">' + it.c + '</div></div>';
      }
    }
    return '<div class="flow">' + out + '</div>';
  }

  /* The bars share one scale, so the Enterprise segment is visibly a part
     of the total rather than a second total sitting next to it. That is the
     whole reason this frame is a bar pair and not two big numbers. */
  function barsHTML(){
    return '<div class="bars">' +
      '<div class="barcol">' +
        '<div class="brow">' +
          '<div class="bhead"><span class="bname">Total revenue, financial year 2025</span>' +
          '<span class="btag">the whole company</span></div>' +
          '<div class="btrack"><div class="bfill whole" id="fTotal"></div></div>' +
        '</div>' +
        '<div class="brow">' +
          '<div class="bhead"><span class="bname">Enterprise segment</span>' +
          '<span class="btag">part of that total</span></div>' +
          '<div class="btrack"><div class="bfill" id="fEnt"></div></div>' +
        '</div>' +
        '<p class="bnote"><b>Enterprise is a segment, not the company.</b> ' +
          'The lower bar is the Enterprise segment drawn to its real share of total ' +
          'revenue for the financial year 2025. No amount is shown here: the ' +
          'figures are in the reading.</p>' +
      '</div>' +
      '<div class="statcol">' +
        '<div class="statk">Who the payers are</div>' +
        '<div class="statlab">Employers and institutions, buying seats for people they are answerable for.</div>' +
        '<div class="statstamp">How many there are, and what each one pays in a year, is in the reading.</div>' +
      '</div>' +
    '</div>';
  }

  function askHTML(){
    return '<div class="qbox">' +
      '<span class="qm" aria-hidden="true">?</span>' +
      '<div><div class="qtext">So what is an organisation buying that a free learner is not?</div>' +
      '<div class="qsub">Anyone can still audit or preview most Coursera courses free. ' +
      'Organisations are paying anyway. Both of those are true at once.</div></div>' +
    '</div>';
  }

  /* The count-up animator that used to paint the figures on the Enterprise
     frame was deleted on 24 August 2026 along with the figures themselves.
     Nothing on this build prints a number, so nothing counts up to one. If a
     figure is ever wanted here again, the module's guess has to be removed
     first, and the old rule still applies: never paint a value that was never
     true on the way to one that was. */

  function drawDia(b, animate){
    var d = b.dia;
    if(d.kind === "flow")      el.dia.innerHTML = flowHTML(d.items);
    else if(d.kind === "bars") el.dia.innerHTML = barsHTML();
    else                       el.dia.innerHTML = askHTML();

    var host = el.dia.firstChild;
    if(host){
      host.classList.remove("dfade");
      if(animate && !reduce){ void host.offsetWidth; host.classList.add("dfade"); }
    }

    if(d.kind === "bars"){
      var fT = document.getElementById("fTotal");
      var fE = document.getElementById("fEnt");
      /* Enterprise segment as a share of total revenue for financial year
         2025, worked out from the two figures reported in the Form 10-K and
         stored here as the share alone. The amounts are deliberately not in
         this file, so the bar can be drawn to the true proportion without
         either figure being recoverable from it. */
      var pct = 33.7;
      if(reduce || !animate){
        if(fT) fT.style.width = "100%";
        if(fE) fE.style.width = pct.toFixed(1) + "%";
      } else {
        requestAnimationFrame(function(){
          if(fT) fT.style.width = "100%";
          if(fE) fE.style.width = pct.toFixed(1) + "%";
        });
      }
    }
  }

  /* ---------------- rail ---------------- */

  function renderRail(){
    var out = "", i;
    for(i = 0; i < BEATS.length; i++){
      var state = i < cur ? "past" : (i === cur ? "now" : "ahead");
      out += '<button class="rbtn" type="button" data-i="' + i + '" data-state="' + state + '"' +
             (i === cur ? ' aria-current="step"' : '') +
             ' aria-label="Point ' + (i + 1) + ' of ' + BEATS.length + ', ' + BEATS[i].head + '">' +
             '<span class="dot" aria-hidden="true"></span>' +
             '<span class="rlab">' + BEATS[i].rail + '</span></button>';
    }
    /* The rail is rebuilt wholesale, which destroys the focused button.
       If focus was inside it, put focus back on the button for the point
       we just moved to, so a state change never drops focus to BODY. */
    var hadFocus = el.rail.contains(document.activeElement);
    el.rail.innerHTML = out;
    if(hadFocus){
      var b = el.rail.querySelector('.rbtn[data-i="' + cur + '"]');
      if(b) b.focus();
    }
  }

  /* src.n is a plain sentence that must sit OUTSIDE the anchor, so a link
     never carries prose that is not part of the citation. */
  function srcHTML(src){
    if(!src) return '';
    var tail = src.n ? ' ' + src.n : '';
    if(src.u) return 'Source: <a href="' + src.u + '" target="_blank" rel="noopener">' + src.t + '</a>.' + tail;
    return 'Source: ' + src.t + tail;
  }

  /* ---------------- render one beat ---------------- */

  function show(i, animate){
    if(i < 0 || i >= BEATS.length) return;
    cur = i;
    var b = BEATS[i];

    el.count.textContent = (i + 1) + " of " + BEATS.length;
    el.head.innerHTML = '<span class="hstep">' + b.step + '</span>' + b.head;
    el.lab1.textContent = b.lab1;
    el.lab2.textContent = b.lab2;
    el.body.innerHTML = b.body;
    el.note.innerHTML = b.note;
    el.src.innerHTML = srcHTML(b.src);

    drawDia(b, animate);
    renderRail();

    if(animate && !reduce){
      ["head","body","note","src"].forEach(function(k){
        el[k].classList.remove("tfade");
        void el[k].offsetWidth;
        el[k].classList.add("tfade");
      });
    }

    /* A dead end button is hidden, not faded. Two reasons: a disabled
       button that still holds focus drops activeElement to BODY, and a
       faded label cannot hold 4.5:1 against the background. */
    var last = (i === BEATS.length - 1);
    var first = (i === 0);
    if(last && document.activeElement === el.next){ try{ el.prev.focus(); }catch(e){} }
    if(first && document.activeElement === el.prev){ try{ el.next.focus(); }catch(e){} }
    el.prev.disabled = first;
    el.prev.hidden = first;
    el.next.disabled = last;
    el.next.hidden = last;
    el.hint.innerHTML = last
      ? "<b>" + CLOSER + "</b>"
      : "Arrow keys move through the five points, or pick any point on the rail above.";

    el.live.textContent = "Point " + (i + 1) + " of " + BEATS.length + ". " + b.head + ". " + b.say;
    settleFocus();
  }

  /* No state change may end with focus on BODY. If nothing sensible holds
     it, the frame does. */
  function settleFocus(){
    var a = document.activeElement;
    if(!a || a === document.body || a === document.documentElement ||
       !document.contains(a) || a.disabled || a.hidden){
      try{ el.frame.focus(); }catch(e){}
    }
  }

  /* ---------------- navigation ---------------- */

  el.prev.addEventListener("click", function(){ if(cur > 0) show(cur - 1, true); });
  el.next.addEventListener("click", function(){ if(cur < BEATS.length - 1) show(cur + 1, true); });

  el.rail.addEventListener("click", function(e){
    var t = e.target && e.target.closest ? e.target.closest(".rbtn") : null;
    if(!t) return;
    var n = parseInt(t.getAttribute("data-i"), 10);
    /* focus the rail button for the point we land on, not the one clicked */
    show(n, true);
    var b = el.rail.querySelector('.rbtn[data-i="' + n + '"]');
    if(b) b.focus();
  });

  document.addEventListener("keydown", function(e){
    var tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
    if(tag === "input" || tag === "textarea") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === "ArrowRight" || e.key === "ArrowDown"){
      e.preventDefault(); if(cur < BEATS.length - 1) show(cur + 1, true); else settleFocus();
    } else if(e.key === "ArrowLeft" || e.key === "ArrowUp"){
      e.preventDefault(); if(cur > 0) show(cur - 1, true); else settleFocus();
    } else if(e.key === "Home"){
      e.preventDefault(); show(0, true);
    } else if(e.key === "End"){
      e.preventDefault(); show(BEATS.length - 1, true);
    }
  });

  var tx = 0, ty = 0, tracking = false;
  document.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1){ tracking = false; return; }
    tracking = true; tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(!tracking || !e.changedTouches.length) return;
    tracking = false;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    if(dx < 0 && cur < BEATS.length - 1) show(cur + 1, true);
    if(dx > 0 && cur > 0) show(cur - 1, true);
  }, {passive:true});

  /* ---------------- scale the canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    var portrait = window.matchMedia("(max-width:599px)").matches;
    if(portrait){ stage.style.transform = ""; }
    else {
      var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
      stage.style.transform = "scale(" + s + ")";
    }
    /* a layout flip is not a beat change, so it must not replay motion */
    if(portrait !== wasPortrait){ wasPortrait = portrait; show(cur, false); }
  }
  window.addEventListener("resize", fit);

  show(0, false);
  fit();

  /* exposed for render QA only: lets a headless run force a state */
  window.__cs = {
    go:function(i){ show(i, true); },
    jump:function(i){ show(i, false); },
    count:BEATS.length,
    state:function(){ return {i:cur}; }
  };
})();
</script>
</body>
</html>
