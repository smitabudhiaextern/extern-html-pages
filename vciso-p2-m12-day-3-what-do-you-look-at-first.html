<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. Tint carries no meaning. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;

  .lead{flex:0 0 auto;font-size:17px;line-height:1.5;color:var(--body);max-width:78ch}
  .lead b{color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- slide 1: the choice ---- */
  /* State colours. Navy = the student's own first pick. Green = a reply they have opened.
     Plain = not opened yet. Each state also carries a word tag and an icon, never colour alone.
     Green is the one colour outside the section 6 palette, added at the owner's request
     (1 October 2026) for "read" state only. It never means right. #1B7F3B on #EEF7F1 is 4.63:1. */
  :root{ --read:#1B7F3B; --read-tint:#EEF7F1; }
  .lead{max-width:none}
  .status{flex:0 0 auto;display:flex;align-items:center;gap:12px;background:var(--bg);border:1.5px solid var(--on-highlight);
    border-radius:10px;padding:8px 14px;font-size:16px;line-height:1.4;color:var(--title)}
  .status b{font-weight:600}
  .status .dots{display:flex;gap:5px;flex:0 0 auto}
  .status .dots i{display:block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--read);background:var(--bg)}
  .status .dots i.on{background:var(--read)}
  .status.done{border-color:var(--read);background:var(--read-tint)}
  .pick{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1.16fr 1fr;gap:16px;margin-bottom:4px}
  .opts{display:flex;flex-direction:column;gap:12px;min-height:0;padding:0 5px 5px 0}
  button.opt{font-family:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--title);
    border:1.5px dashed var(--on-highlight);border-radius:10px;padding:8px 12px;flex:1 1 auto;min-height:0;
    display:grid;grid-template-columns:38px 1fr;gap:11px;align-items:center;position:relative;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  @media (hover:hover){ button.opt:not(.mine):not(.read):hover{background:linear-gradient(var(--tint2),var(--tint2)),var(--bg)} }
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt .oi{width:38px;height:38px;border-radius:10px;background:var(--highlight);color:var(--on-highlight);
    border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center}
  button.opt .oi svg.ic{width:23px;height:23px}
  button.opt .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
  button.opt .on{font-size:16px;font-weight:600;line-height:1.25;color:var(--title)}
  button.opt .od{font-size:13.5px;line-height:1.33;color:var(--body)}
  /* The state tag sits on the card's top edge: a word and an icon. None until the reply is opened. */
  button.opt .st{position:absolute;top:-11px;right:10px;display:flex;align-items:center;gap:6px}
  button.opt .tg{font-size:12.5px;font-weight:600;border-radius:14px;padding:2px 9px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:5px}
  button.opt .tg svg.ic{width:13px;height:13px;stroke-width:2.2}
  button.opt .shw{font-size:12px;font-weight:600;color:var(--on-highlight);background:var(--bg);border:1px solid var(--on-highlight);
    border-radius:14px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  button.opt .shw svg.ic{width:13px;height:13px}
  /* Read: soft green tint, solid green border, tick and "Read". */
  button.opt.read{background:var(--read-tint);border:1.5px solid var(--read)}
  button.opt.read .oi{background:var(--bg);border-color:var(--read);color:var(--read)}
  button.opt.read .tg{color:var(--read);background:var(--bg);border:1px solid var(--read)}
  /* Your pick: navy. */
  button.opt.mine{background:var(--highlight);border:2px solid var(--on-highlight)}
  button.opt.mine .oi{background:var(--on-highlight);color:var(--bg)}
  button.opt.mine .tg{color:var(--bg);background:var(--on-highlight);border:1px solid var(--on-highlight)}

  button.opt.cur{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--on-highlight)}
  button.opt.read.cur{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--read)}

  .panel{min-height:0;background:var(--highlight);border-radius:12px;padding:12px 18px;

  .panel .pt{font-size:17px;font-weight:600;color:var(--title);line-height:1.25}
  .panel .tag{align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--bg);background:var(--on-highlight);

  .panel .tag svg.ic{width:13px;height:13px;stroke-width:2.2}
  .panel p.rp{font-size:15.5px;line-height:1.45;color:var(--title)}
  .panel .more{margin-top:auto;flex:0 0 auto;display:flex;flex-direction:column;gap:7px;border-top:1.5px solid var(--line);padding-top:8px}

  .panel.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .panel:focus{outline:none}

  .closewrap{flex:1 1 auto;display:flex;flex-direction:column;gap:14px;min-height:0}

  .beats{flex:0 0 auto;display:flex;flex-direction:column;gap:10px}
  .beat{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;background:var(--bg);

  .beat .bi svg.ic{width:24px;height:24px}
  .beat p{font-size:18px;line-height:1.4;color:var(--title)}
  .beat p b{font-weight:600}
  .statement{flex:0 0 auto;background:var(--highlight);border-left:5px solid var(--on-highlight);
    border-radius:0 12px 12px 0;padding:14px 20px}
  .statement p{font-size:18px;line-height:1.45;font-weight:600;color:var(--title)}
  button.go{font-family:inherit;font-size:15px;font-weight:600;padding:9px 17px;border-radius:8px;cursor:pointer;

  button.go svg.ic{width:18px;height:18px}
  button.go:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:44px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;

  #hint{flex:1 1 auto;min-width:0;height:44px;overflow-y:auto;font-size:13.5px;line-height:1.36;

  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .board{flex:0 0 auto}
    .status{font-size:15px;align-items:flex-start}
    .status .dots{margin-top:5px}

    .pick{grid-template-columns:1fr}
    button.opt{flex:0 0 auto;padding:12px}
    .opts{gap:16px}
    button.opt .od{font-size:15px}
    .panel p.rp{font-size:16px}
    button.nx{font-size:16px;padding:11px 15px}
    .panel{flex:0 0 auto}
    .beat p{font-size:16px}
    .statement p{font-size:17px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

  <div class="nsf">
    <h2>Day 3: What Do You Look At First?</h2>
    <p>There is no right or wrong answer here, because each of these four places could tell the team something useful. <strong>Pick the one place that you think the team should look at first, then read the other three replies too.</strong> Each reply says what that place would tell the team.</p>
    <ul>
      <li><strong>The three machines' own logs.</strong> A log is the record a machine keeps of what happened on it.</li>
      <li><strong>What changed on the network recently.</strong> The network is all of Cumberland's computers, linked together. A change is any update, fix or new setting.</li>
      <li><strong>The antivirus vendor's status page.</strong> The vendor is the company that makes the antivirus. Its status page lists problems it knows about.</li>
      <li><strong>The users of those three machines.</strong> The staff who sit at those three machines every day.</li>
    </ul>
        <h3>What each one would tell the team</h3>
    <p><strong>The three machines' own logs.</strong> A sensible first look. The logs can show when each antivirus stopped working and what happened on that machine just before. The catch: you are reading three separate records, with no pattern yet, and you have to know what you are looking for.</p>
    <p><strong>What changed on the network recently.</strong> A sensible first look. When something breaks, a recent change is often behind it. The catch: how far back do you look, and which change do you suspect? A change that looked like it had worked may not stand out on day 3.</p>
    <p><strong>The antivirus vendor's status page.</strong> A sensible first look, and a quick one. If the antivirus itself had a fault, many companies would see it at once, and the vendor would say so. The catch: it can rule the vendor in or out. It cannot tell you what is different about these three machines.</p>
    <p><strong>The users of those three machines.</strong> A sensible first look. The people at those machines may have seen a warning or noticed something odd that no record shows. The catch: what people remember is often vague, and three people can give you three different stories.</p>
    <h3>Day 3, as the team saw it</h3>
    <div class="box">
      <p>Every one of the four is a sensible first look. On day 3, none of them pointed clearly at the cause. There is no score here.</p>
      <p>On day 3 the team had three machines and no pattern. The change they would need to suspect happened two days earlier, and it looked like it had worked.</p>
      <p>The team settled on one idea about what caused it and chased that idea for days. That idea turned out to be wrong.</p>
    </div>
  </div>

        "The catch: how far back do you look, and which change do you suspect? A change that looked like it had worked may not stand out on day 3."
      ] },
    { id:"vendor", ic:"status",
      name:"The antivirus vendor's status page",
      def:"The vendor is the company that makes the antivirus. Its status page lists problems it knows about.",
      pre:"A sensible first look, and a quick one.",
      reply:[
        "If the antivirus itself had a fault, many companies would see it at once, and the vendor would say so.",
        "The catch: it can rule the vendor in or out. It cannot tell you what is different about these three machines."
      ] },
    { id:"users", ic:"users",
      name:"The users of those three machines",
      def:"The staff who sit at those three machines every day.",
      pre:"A sensible first look.",
      reply:[
        "The people at those machines may have seen a warning or noticed something odd that no record shows.",
        "The catch: what people remember is often vague, and three people can give you three different stories."
      ] }
  ];

  var S = [
    { id:"pick", kind:"pick", label:"Your call",
      h1:"What Do You Look At First?",
      chip:"Day 3, 5 February" },
    { id:"team", kind:"close", label:"The team's view",
      h1:"Day 3, as the Team Saw It",
      chip:"Day 3, 5 February" }
  ];

  /* ---------------- state ---------------- */
  var KEY = "vciso-p2-m12-day-3-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function validId(v){ return OPTS.some(function(o){ return o.id === v; }); }
  function fresh(){ return { pick:null, read:{}, cur:null }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var read = {};
      if(isPlain(raw.read)) Object.keys(raw.read).forEach(function(k){ if(validId(k)) read[k] = 1; });
      var pick = validId(raw.pick) ? raw.pick : null;
      if(!pick) return fresh();
      read[pick] = 1;
      return { pick:pick, read:read, cur: validId(raw.cur) ? raw.cur : pick };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = m; }
  function opt(id){ var r = null; OPTS.forEach(function(o){ if(o.id === id) r = o; }); return r; }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    if(s.chip){ el.chip.hidden = false; el.chip.innerHTML = icon("calendar") + esc(s.chip); }
    else el.chip.hidden = true;

    el.back.disabled = (i === 0);
    document.getElementById("again").hidden = (i !== S.length-1);
    el.next.textContent = "Continue";
    el.next.disabled = false;
    el.next.classList.remove("ghost");
    el.hint.textContent = "";
    if(i === S.length-1){ el.next.disabled = true; el.next.textContent = "You are at the end"; el.hint.textContent = "Go back to the page and read on to day 5."; }
    else if(s.kind === "pick" && !st.pick){
      el.next.disabled = true;
      el.hint.innerHTML = "<span>Pick one place to start. It stays marked as <b>Your pick</b>.</span>";
    }
    else if(s.kind === "pick"){
      el.next.classList.toggle("ghost", readCount() < OPTS.length);
      el.hint.innerHTML = readCount() < OPTS.length
        ? "<span>Open the other replies before you continue. Each one you open is marked <b>Read</b>.</span>"
        : "<span>You have read all four replies. Continue when you are ready.</span>";
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);

    if(s.kind === "pick") renderPick(s);
    else renderClose(s);

    header();
    say("Slide " + (i+1) + " of " + S.length + ". " + s.h1 + (/[.?!]$/.test(s.h1) ? "" : "."));
  }

  /* Slide 1: four options, none chosen on arrival. No option is ever marked right or wrong. */
  function readCount(){ return Object.keys(st.read).length; }
  function nextUnread(){
    var start = 0, r = null;
    OPTS.forEach(function(o, k){ if(o.id === st.cur) start = k; });
    for(var k=1;k<=OPTS.length;k++){
      var o = OPTS[(start + k) % OPTS.length];
      if(!st.read[o.id]){ r = o; break; }
    }
    return r;
  }
  function renderPick(){
    el.board.innerHTML =
        '<div id="top"></div>'
      + '<div class="pick">'
      +   '<div class="opts" role="group" aria-label="Where you would look first">'
      +     OPTS.map(function(o){ return optHTML(o); }).join("")
      +   "</div>"
      +   '<div class="panel" id="panel" tabindex="-1"></div>'
      + "</div>";
    paintTop();
    paintPanel(false);
    Array.prototype.forEach.call(el.board.querySelectorAll("button.opt"), function(b){
      b.addEventListener("click", function(){ choose(b.dataset.o); });
    });
  }
  /* Before the pick: the plain "no right or wrong answer" line. After it: the read counter. */
  function paintTop(){
    var t = el.board.querySelector("#top");
    if(!t) return;
    if(!st.pick){
      t.className = "lead";
      t.innerHTML = "There is no right or wrong answer here, because each of these four places could tell the team something useful. <b>Pick the one place that you think the team should look at first, then open the other three too.</b>";
      return;
    }
    var n = readCount(), d = "";
    OPTS.forEach(function(o, k){ d += "<i class='" + (k < n ? "on" : "") + "'></i>"; });
    t.className = "status" + (n === OPTS.length ? " done" : "");
    t.innerHTML = '<span class="dots" aria-hidden="true">' + d + "</span><span>"
      + "<b>You have read " + n + " of " + OPTS.length + " replies.</b> "
      + (n < OPTS.length
          ? "There is no right or wrong answer, so open the other " + (OPTS.length - n === 1 ? "one" : words(OPTS.length - n)) + " too."
          : "There is no right or wrong answer, and now you have seen all four.")
      + "</span>";
  }
  function words(n){ return ["zero","one","two","three","four"][n] || String(n); }
  function optHTML(o){
    var mine = st.pick === o.id, read = !!st.read[o.id], cur = !!st.pick && st.cur === o.id;
    var cls = "opt" + (mine ? " mine" : read ? " read" : "") + (cur ? " cur" : "");
    var tag = mine ? '<span class="tg">' + icon("target") + "Your pick</span>"
            : read ? '<span class="tg">' + icon("check") + "Read</span>"
            : "";
    var shw = cur ? '<span class="shw">' + icon("down") + "Showing</span>" : "";
    var state = mine ? "Your pick." : read ? "Read." : (st.pick ? "Not opened yet." : "");
    if(cur) state += " Its reply is showing.";
    return '<button class="' + cls + '" type="button" data-o="' + o.id + '"'
      + ' aria-pressed="' + mine + '">'
      + '<span class="oi">' + icon(o.ic) + "</span>"
      + '<span class="ot"><span class="on">' + esc(o.name) + '</span><span class="od">' + esc(o.def) + "</span></span>"
      + '<span class="st" aria-hidden="true">' + tag + shw + "</span>"
      + (state ? '<span class="sr">' + state + "</span>" : "")
      + "</button>";
  }
  function paintPanel(animate){
    var p = el.board.querySelector("#panel");
    if(!p) return;
    if(!st.pick){
      p.className = "panel empty";
      p.innerHTML = '<p class="pe">When you pick one, its reply opens here. The reply says what that place would tell the team.</p>'
        + '<p class="pe"><b>Then open the other three as well.</b></p>';
      return;
    }
    var o = opt(st.cur || st.pick);
    var mine = o.id === st.pick;
    var nx = nextUnread();
    p.className = "panel" + (mine ? "" : " isread");
    p.innerHTML = '<div class="ph">' + icon(o.ic) + '<span class="pt">' + esc(o.name) + "</span>"
      + '<span class="tag">' + icon(mine ? "target" : "check") + (mine ? "Your pick" : "Read") + "</span></div>"
      + replyOf(o).map(function(t){ return '<p class="rp">' + esc(t) + "</p>"; }).join("")
      + '<div class="more">'
      + (nx
          ? "<p>Now read the other " + words(OPTS.length - readCount()) + " too. Open any card that has no tag yet.</p>"
            + '<button class="nx" type="button" data-o="' + nx.id + '" aria-label="Read the next reply: ' + esc(nx.name) + '">' + icon("down") + "Read the next reply</button>"
          : "<p><b>You have read all four replies.</b> Your first pick was: <b>" + esc(opt(st.pick).name) + "</b>. Continue when you are ready.</p>")
      + "</div>";
    var nb = p.querySelector("button.nx");
    if(nb) nb.addEventListener("click", function(){ choose(nb.dataset.o, true); });
    if(animate && !reduce){ p.classList.remove("in"); void p.offsetWidth; p.classList.add("in"); }
    if(animate && window.matchMedia("(max-width:599px)").matches){
      try{ p.scrollIntoView({block:"nearest", behavior: reduce ? "auto" : "smooth"}); }catch(e){}
    }
  }
  /* Every reply opens the same way, whichever card was picked first. */
  function replyOf(o){
    var r = o.reply.slice();
    r[0] = o.pre + " " + r[0];
    return r;
  }
  function choose(id, fromNext){
    var o = opt(id);
    if(!o) return;
    var first = !st.pick;
    if(first) st.pick = id;
    st.read[id] = 1;
    st.cur = id;
    save(st);
    Array.prototype.forEach.call(el.board.querySelectorAll("button.opt"), function(b){
      var x = opt(b.dataset.o);
      var tmp = document.createElement("div");
      tmp.innerHTML = optHTML(x);
      var nb = tmp.firstChild;
      b.className = nb.className;
      b.setAttribute("aria-pressed", nb.getAttribute("aria-pressed"));
      b.innerHTML = nb.innerHTML;
    });
    paintTop();
    paintPanel(true);
    header();
    var n = readCount();
    say((id === st.pick ? "Your pick: " : "Read: ") + o.name + ". " + replyOf(o).join(" ")
      + " You have read " + n + " of " + OPTS.length + " replies."
      + (n < OPTS.length ? " There is no right or wrong answer, so open the others too." : ""));
    if(fromNext){
      var nb2 = el.board.querySelector("#panel button.nx");
      if(nb2) nb2.focus(); else { var pn = el.board.querySelector("#panel"); if(pn) pn.focus(); }
    }
  }

  /* Slide 2: the team's day 3. No score, nothing past day 3. */
  function renderClose(){
    var mine = st.pick ? opt(st.pick) : null;
    el.board.innerHTML = '<div class="closewrap">'
      + '<p class="yours">' + icon(mine ? "target" : "question")
      + "<span>" + (mine ? "Your pick: <b>" + esc(mine.name) + "</b>. There is no score here."
              : "You did not pick one. There is no score here.")
      + "</span></p>"
      + '<div class="statement"><p>Every one of the four is a sensible first look. On day 3, none of them pointed clearly at the cause.</p></div>'
      + '<div class="beats">'
      +   '<div class="beat"><span class="bi">' + icon("scatter") + "</span>"
      +     "<p><b>Three machines and no pattern.</b> That is all a reasonable team had on day 3.</p></div>"
      +   '<div class="beat"><span class="bi">' + icon("script") + "</span>"
      +     "<p>The change they would need to suspect happened <b>two days earlier</b>, and it looked like it had worked.</p></div>"
      +   '<div class="beat"><span class="bi">' + icon("route") + "</span>"
      +     "<p>The team settled on one idea about what caused it and chased that idea for days. <b>That idea turned out to be wrong.</b></p></div>"
      + "</div>"
      + "</div>";
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });
  document.getElementById("again").addEventListener("click", function(){
    st = fresh(); save(st); i = 0; render(); el.frame.focus();
  });

  document.addEventListener("keydown", function(e){
    document.documentElement.classList.remove("ptr");
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });
  document.addEventListener("pointerdown", function(){ document.documentElement.classList.add("ptr"); }, true);

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    state:function(){ return { i:i, pick:st.pick, read:st.read, cur:st.cur }; }
  };
})();
</script>
</body>
</html>
