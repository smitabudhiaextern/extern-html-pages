<title>Day 3: What Do You Look At First?</title>
<!--
  vCISO P2 Step 3, Module 12: The Patch That Broke Antivirus for Six Days.
  Build spec P2-10a in 06-content/project-02/step-03/module-12-internal.md.
  Facts: P2 Sample Pack/Shared/Incident report - antivirus outage.md, LOCKED CANONICAL FACTS,
  and P2 Sample Pack/Interactive content sets - P2.md, P2-10.
  Scope neutral, per the outline. No right answer is scored (P2-10).
  Nothing after day 3 is shown. The causal chain is left to the day 8 build.
  Governing authority: output/programs/vciso/CLAUDE.md section 6 and VCISO-STYLE-GUIDE.md section 6.
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-frame:300ms;
    --t-reveal:560ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t-frame) var(--ease-io);
  }
  /* The vCISO tint ramp, one per slide, in slide order. Tint carries no meaning. */
  body.t1{background:#F2DAE0}
  body.t2{background:#DAEAE2}
  body.t3{background:#F2E3D2}

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .segs{display:flex;gap:4px}
  .segs i{display:block;width:22px;height:4px;border-radius:2px;background:var(--tint2);
    transition:background var(--t-fast) var(--ease-out)}
  .segs i.on{background:var(--on-highlight)}
  .segs i.here{background:var(--on-highlight);height:6px;margin-top:-1px}
  .chip{margin-left:auto;flex:0 0 auto;background:var(--highlight);border:1px solid var(--on-highlight);border-radius:20px;
    padding:3px 10px;font-size:13px;font-weight:600;color:var(--on-highlight);white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px}
  .chip svg.ic{width:14px;height:14px}

  h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:10px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px}
  .lead{flex:0 0 auto;font-size:17px;line-height:1.5;color:var(--body);max-width:78ch}
  .lead b{color:var(--title);font-weight:600}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- slide 1: the scene ---- */
  .scene{flex:0 0 auto;display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:stretch}
  .tl{display:flex;flex-direction:column;gap:12px}
  .day{display:grid;grid-template-columns:86px 1fr;gap:14px;background:var(--bg);border:1.5px solid var(--on-highlight);
    border-radius:12px;padding:14px 16px;align-items:start}
  .day .dn{display:flex;flex-direction:column;gap:2px}
  .day .dn b{font-size:20px;font-weight:600;color:var(--title);line-height:1.1}
  .day .dn span{font-size:13px;font-weight:600;color:var(--on-highlight)}
  .day p{font-size:17px;line-height:1.45;color:var(--title)}
  .day.now{background:var(--highlight);border-width:2px}
  .gap{display:flex;align-items:center;gap:10px;padding-left:18px;font-size:14px;color:var(--body)}
  .gap svg.ic{width:18px;height:18px;color:var(--on-highlight);transform:rotate(90deg)}
  .machines{background:var(--highlight);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  .machines .mh{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--on-highlight)}
  .mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mc{background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;padding:12px 8px 10px;
    display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--on-highlight)}
  .mc .mi{position:relative;width:52px;height:46px}
  .mc .mi svg.ic{width:52px;height:46px}
  .mc .badge{position:absolute;right:-8px;bottom:-6px;width:26px;height:26px;border-radius:50%;background:var(--bg);
    border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center}
  .mc .badge svg.ic{width:16px;height:16px}
  .mc .ml{font-size:13px;font-weight:600;text-align:center;line-height:1.3;color:var(--title)}
  .unk{font-size:17px;line-height:1.45;color:var(--title);font-weight:600;display:flex;align-items:center;gap:8px}
  .unk svg.ic{width:22px;height:22px;color:var(--on-highlight);flex:0 0 auto}
  .defs{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .def{background:var(--bg);border-left:4px solid var(--on-highlight);border-radius:0 8px 8px 0;padding:8px 12px;
    font-size:15px;line-height:1.4;color:var(--body)}
  .def b{color:var(--title);font-weight:600}

  /* ---- slide 2: the choice ---- */
  .pick{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:6px}
  .opts{display:flex;flex-direction:column;gap:7px;min-height:0;padding:0 5px 5px 0}
  button.opt{font-family:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--title);
    border:1.5px dashed var(--on-highlight);border-radius:10px;padding:9px 12px;flex:1 1 0;min-height:0;
    display:grid;grid-template-columns:40px 1fr 24px;gap:11px;align-items:center;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  button.opt:not(.mine):not(.cur):hover{background:linear-gradient(var(--tint2),var(--tint2)),var(--bg)}
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt .oi{width:40px;height:40px;border-radius:10px;background:var(--highlight);color:var(--on-highlight);
    border:1.5px solid var(--on-highlight);display:flex;align-items:center;justify-content:center}
  button.opt .oi svg.ic{width:24px;height:24px}
  button.opt .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
  button.opt .on{font-size:16.5px;font-weight:600;line-height:1.25;color:var(--title)}
  button.opt .od{font-size:14px;line-height:1.35;color:var(--body)}
  /* The state marker. Empty ring when not chosen. Never filled until clicked. */
  button.opt .g{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;align-self:center;background:transparent}
  button.opt .g svg.ic{width:14px;height:14px}
  button.opt.read{border-style:solid;border-color:var(--line)}
  button.opt.mine{background:var(--highlight);border:2px solid var(--on-highlight);
    box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--on-highlight)}
  button.opt.mine .g{background:var(--on-highlight);color:var(--bg)}
  button.opt.cur:not(.mine){background:var(--highlight);border-style:solid;border-color:var(--on-highlight)}

  .panel{min-height:0;background:var(--highlight);border-radius:12px;padding:16px 20px;
    display:flex;flex-direction:column;gap:10px}
  .panel.empty{background:var(--tint);border:1.5px dashed var(--line);justify-content:center;align-items:flex-start}
  .panel .pe{font-size:17px;line-height:1.45;color:var(--body)}
  .panel .ph{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .panel .ph svg.ic{width:26px;height:26px;color:var(--on-highlight);flex:0 0 auto}
  .panel .pt{font-size:18px;font-weight:600;color:var(--title);line-height:1.25}
  .panel .tag{align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--on-highlight);background:var(--bg);
    border:1px solid var(--on-highlight);border-radius:14px;padding:3px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .panel .tag svg.ic{width:13px;height:13px}
  .panel p.rp{font-size:16.5px;line-height:1.48;color:var(--title)}
  .panel p.rp + p.rp{margin-top:0}
  .panel .more{margin-top:auto;font-size:14px;line-height:1.4;color:var(--body);border-top:1.5px solid var(--line);padding-top:8px}
  .panel.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .panel:focus{outline:none}

  /* ---- slide 3: the team's view ---- */
  .closewrap{flex:1 1 auto;display:flex;flex-direction:column;gap:14px;min-height:0}
  .yours{flex:0 0 auto;display:flex;align-items:center;gap:10px;font-size:16px;color:var(--body)}
  .yours b{color:var(--title);font-weight:600}
  .yours svg.ic{width:20px;height:20px;color:var(--on-highlight);flex:0 0 auto}
  .beats{flex:0 0 auto;display:flex;flex-direction:column;gap:10px}
  .beat{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;background:var(--bg);
    border:1.5px solid var(--on-highlight);border-radius:12px;padding:12px 16px}
  .beat .bi{width:44px;height:44px;border-radius:10px;background:var(--highlight);border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center}
  .beat .bi svg.ic{width:24px;height:24px}
  .beat p{font-size:18px;line-height:1.4;color:var(--title)}
  .beat p b{font-weight:600}
  .statement{flex:0 0 auto;background:var(--highlight);border-left:5px solid var(--on-highlight);
    border-radius:0 12px 12px 0;padding:14px 20px}
  .statement p{font-size:18px;line-height:1.45;font-weight:600;color:var(--title)}
  button.go{font-family:inherit;font-size:15px;font-weight:600;padding:9px 17px;border-radius:8px;cursor:pointer;
    border:2px solid var(--on-highlight);background:transparent;color:var(--on-highlight);align-self:flex-start;
    display:inline-flex;align-items:center;gap:8px}
  button.go svg.ic{width:18px;height:18px}
  button.go:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;height:56px;overflow-y:auto;font-size:13.5px;line-height:1.36;
    color:var(--body);display:flex;flex-direction:column;justify-content:center}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .chip{margin-left:0;font-size:13px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .board{flex:0 0 auto}
    .scene{grid-template-columns:1fr}
    .day{grid-template-columns:1fr;gap:6px}
    .day p{font-size:16px}
    .defs{grid-template-columns:1fr}
    .def{font-size:16px}
    .pick{grid-template-columns:1fr}
    button.opt{flex:0 0 auto;padding:12px}
    button.opt .od{font-size:15px}
    .panel{flex:0 0 auto}
    .beat p{font-size:16px}
    .statement p{font-size:17px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{height:auto;overflow:visible;font-size:14px;flex:1 1 100%;margin-top:4px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

  /* ---------------- state ---------------- */
  var KEY = "vciso-p2-m12-day-3-v1";
  function isPlain(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function validId(v){ return OPTS.some(function(o){ return o.id === v; }); }
  function fresh(){ return { pick:null, read:{}, cur:null }; }
  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY));
      if(!isPlain(raw)) return fresh();
      var read = {};
      if(isPlain(raw.read)) Object.keys(raw.read).forEach(function(k){ if(validId(k)) read[k] = 1; });
      var pick = validId(raw.pick) ? raw.pick : null;
      if(!pick) return fresh();
      return { pick:pick, read:read, cur: validId(raw.cur) ? raw.cur : pick };
    }catch(e){ return fresh(); }
  }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var st = load();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var el = {
    frame:document.getElementById("frame"), prog:document.getElementById("prog"),
    segs:document.getElementById("segs"), chip:document.getElementById("chip"),
    h1:document.getElementById("h1"), board:document.getElementById("board"),
    back:document.getElementById("back"), next:document.getElementById("next"),
    hint:document.getElementById("hint"), live:document.getElementById("live")
  };
  var i = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function say(m){ el.live.textContent = m; }
  function opt(id){ var r = null; OPTS.forEach(function(o){ if(o.id === id) r = o; }); return r; }

  /* ---------------- chrome ---------------- */
  function header(){
    var s = S[i];
    el.prog.textContent = (i+1) + " of " + S.length + (s.label ? " · " + s.label : "");
    var h = "";
    for(var k=0;k<S.length;k++) h += "<i class='" + (k<i?"on":k===i?"here":"") + "'></i>";
    el.segs.innerHTML = h;

    if(s.chip){ el.chip.hidden = false; el.chip.innerHTML = icon("calendar") + esc(s.chip); }
    else el.chip.hidden = true;

    el.back.disabled = (i === 0);
    document.getElementById("again").hidden = (i !== S.length-1);
    el.next.textContent = "Continue";
    el.next.disabled = false;
    el.hint.textContent = "";
    if(i === S.length-1){ el.next.disabled = true; el.next.textContent = "You are at the end"; el.hint.textContent = "Go back to the page and read on to day 5."; }
    else if(s.kind === "pick" && !st.pick){
      el.next.disabled = true;
      el.hint.innerHTML = "Pick one place to carry on. Your first pick is final. You can read the other three afterwards.";
    }
    else if(s.kind === "pick"){
      var n = Object.keys(st.read).length;
      el.hint.innerHTML = n < OPTS.length
        ? "You can open the other three to read their replies too. Your pick stays marked."
        : "You have read all four replies.";
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    var s = S[i];
    document.body.className = "t" + (i+1);
    el.h1.textContent = s.h1;
    el.frame.setAttribute("aria-label", s.h1);

    if(s.kind === "scene") renderScene(s);
    else if(s.kind === "pick") renderPick(s);
    else renderClose(s);

    header();
    say("Slide " + (i+1) + " of " + S.length + ". " + s.h1 + ".");
  }

  /* Slide 1: what is known on day 3, and nothing after it. */
  function renderScene(){
    var m = "";
    for(var k=1;k<=3;k++){
      m += '<div class="mc"><span class="mi">' + icon("monitor")
        + '<span class="badge">' + icon("shieldx") + "</span></span>"
        + '<span class="ml">Machine ' + k + "<br>No working antivirus</span></div>";
    }
    el.board.innerHTML =
        '<div class="scene">'
      +   '<div class="tl">'
      +     '<div class="day"><div class="dn"><b>Day 1</b><span>3 Feb 2025</span></div>'
      +       "<p>A routine script was run to fix a Windows Update problem. It appears to work.</p></div>"
      +     '<div class="gap">' + icon("down") + "Two days pass.</div>"
      +     '<div class="day now"><div class="dn"><b>Day 3</b><span>5 Feb 2025</span></div>'
      +       "<p><b>Three machines have no working antivirus.</b></p></div>"
      +   "</div>"
      +   '<div class="machines">'
      +     '<span class="mh">What the team can see today</span>'
      +     '<div class="mrow">' + m + "</div>"
      +     '<p class="unk">' + icon("question") + "Nothing else is known.</p>"
      +   "</div>"
      + "</div>"
      + '<div class="defs">'
      +   '<p class="def"><b>A script.</b> A short list of commands a computer runs in one go, so the same change can be made on many machines at once.</p>'
      +   '<p class="def"><b>Antivirus.</b> Software on each machine that watches for harmful programs and stops them.</p>'
      +   '<p class="def"><b>Windows Update.</b> The tool that installs Microsoft\'s fixes on Windows computers.</p>'
      + "</div>";
  }

  /* Slide 2: four options, none chosen on arrival. */
  function renderPick(){
    el.board.innerHTML =
        '<p class="lead">You are on the team. Pick the one place you would look first.</p>'
      + '<div class="pick">'
      +   '<div class="opts" role="group" aria-label="Where you would look first">'
      +     OPTS.map(function(o){ return optHTML(o); }).join("")
      +   "</div>"
      +   '<div class="panel" id="panel" tabindex="-1" aria-live="polite"></div>'
      + "</div>";
    paintPanel(false);
    Array.prototype.forEach.call(el.board.querySelectorAll("button.opt"), function(b){
      b.addEventListener("click", function(){ choose(b.dataset.o); });
    });
  }
  function optHTML(o){
    var mine = st.pick === o.id, read = !!st.read[o.id], cur = st.cur === o.id;
    var cls = "opt" + (mine ? " mine" : read ? " read" : "") + (cur ? " cur" : "");
    var g = mine ? icon("check") : (read ? icon("eye") : "");
    var state = mine ? "Your pick." : read ? "Reply read." : "Not chosen.";
    return '<button class="' + cls + '" type="button" data-o="' + o.id + '"'
      + (st.pick ? ' aria-pressed="' + mine + '"' : ' aria-pressed="false"') + ">"
      + '<span class="oi">' + icon(o.ic) + "</span>"
      + '<span class="ot"><span class="on">' + esc(o.name) + '</span><span class="od">' + esc(o.def) + "</span></span>"
      + '<span class="g" aria-hidden="true">' + g + "</span>"
      + '<span class="sr">' + state + "</span>"
      + "</button>";
  }
  function paintPanel(animate){
    var p = el.board.querySelector("#panel");
    if(!p) return;
    if(!st.pick){
      p.className = "panel empty";
      p.innerHTML = '<p class="pe">Nothing is chosen yet. Pick one of the four on the left to see what it would tell the team on day 3.</p>';
      return;
    }
    var o = opt(st.cur || st.pick);
    var mine = o.id === st.pick;
    p.className = "panel";
    p.innerHTML = '<div class="ph">' + icon(o.ic) + '<span class="pt">' + esc(o.name) + "</span></div>"
      + '<span class="tag">' + (mine ? icon("check") + "Your pick" : icon("eye") + "Another option") + "</span>"
      + replyOf(o, mine).map(function(t){ return '<p class="rp">' + esc(t) + "</p>"; }).join("")
      + (mine ? "" : '<p class="more">Your pick is still: <b>' + esc(opt(st.pick).name) + "</b>.</p>");
    if(animate && !reduce){ p.classList.remove("in"); void p.offsetWidth; p.classList.add("in"); }
    if(animate && window.matchMedia("(max-width:599px)").matches){
      try{ p.scrollIntoView({block:"nearest", behavior: reduce ? "auto" : "smooth"}); }catch(e){}
    }
  }
  /* "A sensible first look" opens only the reply to the student's own pick. */
  function replyOf(o, mine){
    var lead = mine ? o.pre : o.preOther;
    var r = o.reply.slice();
    if(lead) r[0] = lead + " " + r[0];
    return r;
  }
  function choose(id){
    var o = opt(id);
    if(!o) return;
    var first = !st.pick;
    if(first) st.pick = id;
    st.read[id] = 1;
    st.cur = id;
    save(st);
    Array.prototype.forEach.call(el.board.querySelectorAll("button.opt"), function(b){
      var x = opt(b.dataset.o);
      var tmp = document.createElement("div");
      tmp.innerHTML = optHTML(x);
      var nb = tmp.firstChild;
      b.className = nb.className;
      b.setAttribute("aria-pressed", nb.getAttribute("aria-pressed"));
      b.innerHTML = nb.innerHTML;
    });
    paintPanel(true);
    header();
    say((first ? "Your pick: " : "Another option: ") + o.name + ". " + replyOf(o, first || id === st.pick).join(" "));
  }

  /* Slide 3: the team's day 3. No score, nothing past day 3. */
  function renderClose(){
    var mine = st.pick ? opt(st.pick) : null;
    el.board.innerHTML = '<div class="closewrap">'
      + '<p class="yours">' + icon(mine ? "check" : "question")
      + "<span>" + (mine ? "Your pick: <b>" + esc(mine.name) + "</b>. There is no score here."
              : "You did not pick one. There is no score here.")
      + "</span></p>"
      + '<div class="beats">'
      +   '<div class="beat"><span class="bi">' + icon("scatter") + "</span>"
      +     "<p><b>Three machines and no pattern.</b> That is all a reasonable team had on day 3.</p></div>"
      +   '<div class="beat"><span class="bi">' + icon("script") + "</span>"
      +     "<p>The change they would need to suspect happened <b>two days earlier</b>, and it looked like it had worked.</p></div>"
      +   '<div class="beat"><span class="bi">' + icon("route") + "</span>"
      +     "<p>The team picked one idea about the cause and chased it for days. <b>It was the wrong one.</b></p></div>"
      + "</div>"
      + '<div class="statement"><p>Every one of the four is a sensible first look. On day 3, none of them pointed clearly at the cause.</p></div>'
      + "</div>";
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ go(1); });
  document.getElementById("again").addEventListener("click", function(){
    st = fresh(); save(st); i = 0; render(); el.frame.focus();
  });

  document.addEventListener("keydown", function(e){
    document.documentElement.classList.remove("ptr");
    if(ownsKeys(e.target)) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });
  document.addEventListener("pointerdown", function(){ document.documentElement.classList.add("ptr"); }, true);

  function ownsKeys(node){
    if(!node) return false;
    if(node.isContentEditable) return true;
    var t = node.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    state:function(){ return { i:i, pick:st.pick, read:st.read, cur:st.cur }; }
  };
})();
</script>
</body>
</html>
