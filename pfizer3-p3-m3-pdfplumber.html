<style>
/* Structure, code blocks and Copy buttons: copied from the approved P3 module 2 steps deck (pfizer3-p3-m2-steps.html).
   Reveal button: copied from the P3 module 2 challenge deck (pfizer3-p3-m2-build.html).

:root{
  color-scheme:light;
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:#ffffff;
  --surface-card:var(--blue-50);
  --ink:#000000;
  --ink-muted:var(--gray-800);
  --card-title:#000000;
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --action:#000000;
  --on-action:#ffffff;
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;--radius-full:9999px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* The design stage: 760 x 720, scaled and centred by the script at the end */
.app{position:absolute;left:50%;top:50%;width:760px;height:720px;transform:translate(-50%,-50%);transform-origin:50% 50%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* Header: step rail and "Slide X of N" */
.top{flex:none;border-bottom:1px solid var(--line);padding:10px 16px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
.where{order:2;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:4px 2px 2px;margin:0;cursor:pointer;border-radius:6px;text-align:left}
.segs{display:flex;gap:3px;height:6px;align-items:center}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--blue-200)}
.segs i.done{background:var(--pfizer-blue)}
.segs i.cur{background:var(--pfizer-blue);height:6px;border-radius:3px}
.pg-label{font-size:13px;font-weight:500;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.is-done .pg-label{color:var(--pfizer-blue)}
.pg.is-cur .pg-label{color:var(--ink);font-weight:600}

/* Slide area and slide */
.stage{flex:1 1 auto;min-height:0;background:var(--gray-50);padding:12px 16px;display:flex;overflow:hidden}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px var(--space-5);display:flex;flex-direction:column;overflow:hidden}
.inner{display:flex;flex-direction:column;gap:var(--space-3);width:100%}
.step{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:0.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding-bottom:3px;color:var(--ink);text-wrap:balance}
.hl{color:var(--highlight)}
.p{margin:0;font-size:15px;line-height:22px;color:var(--ink);text-wrap:pretty}
.p b{font-weight:600}
.p code{font-family:var(--font-mono);font-size:.92em;white-space:nowrap;background:var(--gray-50);border-radius:4px;padding:1px 5px;color:var(--ink)}

/* Video: the Loom player, 16:9 */
.video{margin:0;width:520px;max-width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--gray-50)}
.video iframe{display:block;width:100%;height:100%;border:0}

/* Buttons (design system Button, Light) */
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);max-width:100%;font-family:var(--font-text);font-size:15px;line-height:1.2;font-weight:600;padding:13px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action);border-color:var(--action)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* Hidden answer: the button, then the content once it is shown */
.reveal{display:flex;flex-direction:column;gap:var(--space-3)}
.reveal > .btn{align-self:flex-start}
.reveal-box{display:flex;flex-direction:column;gap:var(--space-3);border-top:1px solid var(--line);padding-top:var(--space-3)}

/* Run card: the code to paste, with a Copy button, and the real output under it (no Copy button) */
.run{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:6px 8px 6px 14px;background:var(--gray-50);border-bottom:1px solid var(--line)}
.code-lang{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.run pre{margin:0;padding:12px 14px;font-family:var(--font-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre;background:var(--surface)}
.run pre code{font:inherit}
.run.out .code-head{background:var(--surface-card);border-bottom-color:var(--blue-200)}
.run.out{border-color:var(--blue-200)}
.run.out pre{background:var(--surface-card);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:6px 12px;font-size:13px;line-height:1.2;font-weight:600;cursor:pointer;white-space:nowrap}
.copy svg{width:14px;height:14px;flex:none}
.copy.ok{background:var(--action);color:var(--on-action);border-color:var(--action)}

.hide{background:var(--gray-200);color:transparent;border-radius:3px;user-select:none}

/* Done message and foot */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:22px;font-weight:600;text-wrap:pretty}
.donemsg:empty{display:none}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.foot .btn{padding:10px 16px;font-size:15px}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>

<template id="s1">
  <p class="p">pdfplumber is the second library in your notebook. In the notebook's words, pdfplumber excels at extracting tables and provides more control over text extraction. In this video (about 3.5 minutes), you'll watch it read a PDF.</p>

<template id="s2">
  <p class="p">In your copy of the notebook, find the cell under <b>Open a PDF:</b>, or paste this into a new code cell, and press <b>Run</b>:</p>
  {{CODE:python:Python:import pdfplumber

# Load the PDF
with pdfplumber.open("sample-sdf-document.pdf") as pdf:
    # Get the total number of pages
    print(f"The PDF has {len(pdf.pages)} pages.")}}
  <p class="p"><code>pdfplumber.open()</code> opens the supplier file. The word <code>with</code> closes the file again once the indented lines have run. <code>pdf.pages</code> is the list of the file's pages, and <code>len()</code> counts them.</p>

  {{CODE:plain:Output:The PDF has 3 pages.}}

<template id="s3">
  <p class="p">Next, find the cell under <b>Extract Text from a Page</b>, or paste this into a new code cell, and press <b>Run</b>:</p>
  {{CODE:python:Python:# Extract text from the first page
with pdfplumber.open("sample-sdf-document.pdf") as pdf:
    page = pdf.pages[0]
    print(page.extract_text())}}
  <p class="p"><code>pdf.pages[0]</code> picks page 1, because Python starts counting at 0. <code>extract_text()</code> pulls the words off that page as plain text.</p>
</template>

<template id="s5">
  <p class="p">Now find the tables. Find the cell under <b>Extract Tables</b>, or paste this into a new code cell, and press <b>Run</b>:</p>
  {{CODE:python:Python:# Extract tables from different pages
# Try different pages to find tables in your SDF
with pdfplumber.open("sample-sdf-document.pdf") as pdf:
    for page_num, page in enumerate(pdf.pages):
        tables = page.extract_tables()
        if tables:
            print(f"\n--- Tables found on Page {page_num + 1} ---")
            for table in tables:
                for row in table:
                    print(row)}}
  <p class="p"><code>extract_tables()</code> looks for tables on a page. The <code>for</code> loop runs it on every page. <code>enumerate</code> numbers the pages from 0, so <code>page_num + 1</code> prints the page number you'd use. Each table row prints as a list, inside square brackets.</p>
</template>

<script>
(function () {
  "use strict";
  var IC_COPY = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5V3.3c0-.7-.6-1.3-1.3-1.3H3.8c-.7 0-1.3.6-1.3 1.3v5.4c0 .7.6 1.3 1.3 1.3H4" stroke="currentColor" stroke-width="1.4"/></svg>';

  function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function unesc(t) { return t.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&"); }
  /* Output blocks have no Copy button. In them, @@N@@ becomes a grey bar N characters long, added after the text is escaped. */
  function codeBlock(lang, label, text) {
    var out = lang === "plain";
    var html = esc(text), hidden = '';
    if (out) {
      html = html.replace(/@@(\d+)@@/g, function (m, n) {
        return '<span class="hide" aria-hidden="true">' + new Array(+n + 1).join("x") + '</span>';
      });
      hidden = /@@\d+@@/.test(text) ? '<span class="sr-only"> Some words are hidden behind grey bars.</span>' : '';
    }
    return '<figure class="run' + (out ? ' out' : '') + '" style="margin:0"><div class="code-head"><span class="code-lang">' + label + hidden + '</span>' +
      (out ? '' : '<button type="button" class="copy" data-copy aria-label="Copy ' + label + ' code">' + IC_COPY + '<span>Copy</span></button>') + '</div>' +
      '<pre tabindex="0"><code>' + html + '</code></pre></figure>';
  }

  var shown = {};
  /* Fill the {{...}} markers in a slide template with code blocks and the hidden answer */
  function body(id) {
    return document.getElementById(id).innerHTML
      .replace(/\{\{CODE:(\w+):([^:]*):([\s\S]*?)\}\}(?!\})/g, function (m, lang, label, text) { return codeBlock(lang, label, unesc(text)); })
      .replace(/\{\{REVEAL:(\w+):([^}]*)\}\}([\s\S]*?)\{\{\/REVEAL\}\}/g, function (m, key, label, inner) {
        var open = !!shown[key];
        return '<div class="reveal">' +
          '<button type="button" class="btn btn-primary" data-reveal="' + key + '" aria-expanded="' + open + '" aria-controls="rv-' + key + '"' + (open ? ' hidden' : '') + '>' + label + '</button>' +
          '<div class="reveal-box" id="rv-' + key + '"' + (open ? '' : ' hidden') + '>' + inner + '</div></div>';
      });
  }

  var GROUPS = ["Video", "Step 1", "Step 2", "Step 3", "Step 4", "Task"];
  var SLIDES = [
    { group: "Video", label: "PART 2 &middot; PDFPLUMBER", title: 'Watch pdfplumber Read a <span class="hl">PDF</span>', plain: "Watch pdfplumber Read a PDF", tpl: "s1" },
    { group: "Step 1", label: "STEP 1", title: 'Open the File and Count Its <span class="hl">Pages</span>', plain: "Step 1. Open the File and Count Its Pages", tpl: "s2" },
    { group: "Step 2", label: "STEP 2 &middot; PART 1 OF 2", title: 'Read <span class="hl">Page</span> 1', plain: "Step 2. Read Page 1", tpl: "s3" },
    { group: "Step 2", label: "STEP 2 &middot; PART 2 OF 2", title: 'Read <span class="hl">Page</span> 1', plain: "Step 2. Read Page 1 (Part 2 of 2)", tpl: "s3b" },
    { group: "Step 3", label: "STEP 3", title: 'Read <span class="hl">Page</span> 2', plain: "Step 3. Read Page 2", tpl: "s4" },
    { group: "Step 4", label: "STEP 4 &middot; PART 1 OF 2", title: 'Find the <span class="hl">Tables</span>', plain: "Step 4. Find the Tables", tpl: "s5" },
    { group: "Step 4", label: "STEP 4 &middot; PART 2 OF 2", title: 'Find the <span class="hl">Tables</span>', plain: "Step 4. Find the Tables (Part 2 of 2)", tpl: "s6" },
    { group: "Task", label: "YOUR TASK", title: 'Find the Expiration <span class="hl">Date</span>', plain: "Your Task. Find the Expiration Date", tpl: "s7" }
  ];
  var END_LABEL = "Done";
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of this reading.";
  var standalone = !(window.parent && window.parent !== window);
  var DONE_MSG_TAB = "You're done with the slides. Go back to the tab with this reading.";

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  /* The fixed stage: lay out at 760 x 720, then scale the whole deck to fit the frame and centre it. */
  var STAGE_W = 760, STAGE_H = 720;
  function scaleStage() {
    var k = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", g.name + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + g.name + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + body(s.tpl) + '</div>';
  }

  function wire() {
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });
    Array.prototype.forEach.call(card.querySelectorAll("[data-reveal]"), function (b) {
      b.addEventListener("click", function () {
        var key = b.getAttribute("data-reveal"), box = $("rv-" + key);
        shown[key] = true;
        b.setAttribute("aria-expanded", "true"); b.hidden = true; box.hidden = false;
        var first = box.querySelector("pre"); if (first) first.focus({ preventScroll: true });
      });
    });
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    wire();

    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() {
    donemsg.textContent = standalone ? DONE_MSG_TAB : DONE_MSG;
    if (!standalone) window.parent.postMessage({ type: "extern-deck-done" }, "*");
  }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  /* Left and Right arrow keys move between slides */
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", scaleStage);
  scaleStage();
  render(false);
})();
</script>
</body>
</html>
