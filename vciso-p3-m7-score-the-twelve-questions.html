  Step 2: Score the twelve questions. Built 8 October 2026 to the owner's behaviour:
  guess first, one question per slide, right answer shown with its reason, wrong
  answer gets a direction and another try. Picking the same wrong answer again keeps it,
  and the answer most people pick is shown. A different wrong pick gets its own direction
  and another try. The student's own final pick counts in the total.

  Governing authority: output/programs/vciso/CLAUDE.md section 6 and
  HANDOVER-2026-10-02-P2.md section 2 ("Interactives"). Chrome, options, right and
  wrong states, navigation, scale-to-fit and phone layout match
  vciso-p3-m6-six-words-three-problems.html and vciso-p3-m6-three-standards.html.
  The right and wrong colours are used only for right and wrong, always with an icon and a word.

  Source of truth (SME drop 2026-09-25, P3 Sample Pack):
    Questions and options: Shared/Inherent risk instrument.md, verbatim, options scored 1 to 4 in order.
    Bands: the same file's Scoring table (Low 12 to 19, Moderate 20 to 29, Elevated 30 to 39, High 40 to 48).
    Right answers and reasons: P3 Instruments, Answer Key.md, Inherent risk section.
      Every question is 4. Q7 also accepts 3 (no file states how large the remote share is).
      Q6 also accepts 3 when the audit half of option 4 is read as unmet (never formally audited,
      Meridian sends a questionnaire). Q5, Q9 and Q12 stay at 4: score the company, not the scope.
    Expected range 46 to 48, High: the same key.
    Hints and the wording of each reason: ours, plain words, no new facts.
    10 Oct 2026 (owner's requests): the Words to know box removed from every question slide; Q6 and Q7
    show a note that both 3 and 4 are right; the module is now a Training with no submission, so the
    copy box on the final slide and every line about submitting the total or band are removed.

  Layout: every grid and card sits in normal flow (CSS grid, auto rows),
  so nothing can be drawn over anything else. No absolute positioning on the board.

  Verify before shipping:
    node .claude/skills/build-html-slides/scripts/lint-deck.mjs --allow '#146C2E,#E6F4EA,#B3261E,#FCE8E6' this-deck.html
    node .claude/skills/build-html-slides/scripts/measure-fit.mjs this-deck.html
-->
<style>
  :root{
    --highlight:#DCE1FF;
    --on-highlight:#001D69;
    --bg:#FDF8F8;
    --body:#484646;
    --title:#1C1B1B;

    /* right and wrong states only, always paired with an icon and a word */
    --ok:#146C2E;
    --ok-tint:#E6F4EA;
    --no:#B3261E;
    --no-tint:#FCE8E6;

    --line:rgba(0,29,105,.26);
    --tint:rgba(0,29,105,.055);
    --tint2:rgba(0,29,105,.13);

    --t-fast:160ms;
    --t-reveal:460ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-over:cubic-bezier(.2,.9,.25,1.06);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--body);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto;background:var(--bg)}
  .frame{position:absolute;inset:0;padding:18px 44px 14px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* header */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin-bottom:6px;min-height:28px}
  .prog{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--on-highlight);white-space:nowrap}
  .dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .dots i{display:block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--on-highlight);background:transparent}
  .dots i.on{background:var(--on-highlight)}
  .dots i.here{background:var(--on-highlight);width:12px;height:12px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--on-highlight)}

  h1{font-size:23px;line-height:1.24;font-weight:600;color:var(--title);flex:0 0 auto;margin-bottom:9px}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
  .lead{font-size:16.5px;line-height:1.48;color:var(--body);max-width:84ch}
  .lead b{color:var(--title);font-weight:600}
  .small{font-size:14px;line-height:1.42;color:var(--body)}

  svg.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- slide 1: the guess ---------- */
  .gopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
  button.gopt{font-family:inherit;text-align:left;color:var(--title);min-width:0;width:100%;
    background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:12px;
    padding:14px 16px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;
    transition:background var(--t-fast) var(--ease-out)}
  button.gopt .g{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;background:var(--highlight)}
  button.gopt .g svg.ic{width:24px;height:24px}
  button.gopt .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
  button.gopt .lr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
  button.gopt .ol{font-size:21px;font-weight:700;line-height:1.2;color:var(--title)}
  button.gopt .om{font-size:15px;line-height:1.4;color:var(--body)}
  button.gopt .tg{flex:0 0 auto;font-size:13px;font-weight:700;white-space:nowrap;color:var(--on-highlight)}
  button.gopt:hover:not(:disabled){background:var(--highlight)}
  button.gopt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.gopt:disabled{cursor:default}
  button.gopt.mine{background:var(--highlight);box-shadow:0 0 0 1.5px var(--on-highlight)}
  button.gopt.mine .g{background:var(--on-highlight);color:var(--bg)}
  button.gopt.idle:disabled{border-style:dashed;border-color:var(--line)}
  button.gopt.idle:disabled .g{border-color:var(--line);color:var(--body);background:transparent}
  button.gopt.idle:disabled .ol{color:var(--body)}
  .gnote{display:flex;gap:9px;align-items:flex-start;background:var(--tint);border-radius:10px;padding:10px 14px}
  .gnote svg.ic{width:20px;height:20px;color:var(--on-highlight);flex:0 0 auto;margin-top:1px}

  /* ---------- slides 2 to 13: one question each ---------- */
  .q{display:flex;flex-direction:column;gap:12px;min-height:0;padding-top:3px}
  .oside{min-width:0;display:flex;flex-direction:column;gap:10px}
  .ocap{font-size:15.5px;line-height:1.4;color:var(--body)}
  .ocap b{color:var(--title);font-weight:600}
  .opts{min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto;gap:11px 16px}
  button.opt{font-family:inherit;text-align:left;color:var(--title);min-width:0;width:100%;
    background:var(--bg);border:1.5px solid var(--on-highlight);border-radius:10px;
    padding:10px 14px;cursor:pointer;display:flex;gap:13px;align-items:center;min-height:68px;
    transition:background var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  button.opt .g{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--on-highlight);
    color:var(--on-highlight);display:flex;align-items:center;justify-content:center;background:var(--highlight);
    font-size:18px;font-weight:700;line-height:1}
  button.opt .ol{flex:1 1 auto;min-width:0;font-size:17px;font-weight:600;line-height:1.32;color:var(--title)}
  button.opt .tg{flex:0 0 auto;display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;white-space:nowrap}
  button.opt .tg svg.ic{width:16px;height:16px;stroke-width:2.4}
  button.gopt .kn,button.opt .kn{flex:0 0 auto;min-width:22px;height:22px;padding:0 5px;border-radius:5px;border:1.5px solid var(--line);
    font-size:12.5px;font-weight:600;line-height:19px;text-align:center;color:var(--on-highlight);background:var(--bg)}
  button.opt:hover:not(:disabled){background:var(--highlight)}
  button.opt:focus-visible{outline:3px solid var(--on-highlight);outline-offset:2px}
  button.opt:disabled{cursor:default}
  button.opt.idle:disabled{border-style:dashed;border-color:var(--line)}
  button.opt.idle:disabled .g{border-color:var(--line);color:var(--body);background:transparent}
  button.opt.idle:disabled .ol{color:var(--body);font-weight:500}
  button.opt.ok{background:var(--ok-tint);border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
  button.opt.ok .g{background:var(--ok);border-color:var(--ok);color:var(--bg)}
  button.opt.ok .tg{color:var(--ok)}
  button.opt.no{background:var(--no-tint);border-color:var(--no);box-shadow:0 0 0 1px var(--no)}
  button.opt.no .g{background:var(--no);border-color:var(--no);color:var(--bg)}
  button.opt.no .tg{color:var(--no)}
  button.opt.no:hover:not(:disabled){background:var(--no-tint)}
  button.opt.mine{background:var(--highlight);border-color:var(--on-highlight);box-shadow:0 0 0 1px var(--on-highlight)}
  button.opt.mine .g{background:var(--on-highlight);color:var(--bg)}
  button.opt.mine .tg{color:var(--on-highlight)}

  .fbwrap{grid-area:fb;min-width:0;display:flex;flex-direction:column;gap:6px}
  .fb{border-radius:10px;padding:8px 16px 10px;border-left:6px solid;display:flex;flex-direction:column;gap:3px}
  .fb.ok{background:var(--ok-tint);border-color:var(--ok)}
  .fb.no{background:var(--no-tint);border-color:var(--no)}
  .fb .fh{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:700}
  .fb.ok .fh{color:var(--ok)}
  .fb.no .fh{color:var(--no)}
  .fb .fh svg.ic{width:20px;height:20px;stroke-width:2}
  .fb .ft{font-size:15px;line-height:1.42;color:var(--title)}
  .fb .ft b{font-weight:700}
  .fb.in{animation:rin var(--t-reveal) var(--ease-over) both}
  .fb:focus{outline:none}
  .both{display:flex;gap:9px;align-items:flex-start;background:var(--highlight);border-radius:10px;padding:6px 14px;font-size:14.5px;line-height:1.4;color:var(--title)}
  .both svg.ic{width:19px;height:19px;color:var(--on-highlight);flex:0 0 auto;margin-top:1px}
  .both b{font-weight:700;color:var(--on-highlight)}

  /* ---------- slide 14: the total ---------- */
  .res{display:grid;grid-template-columns:330px minmax(0,1fr);column-gap:22px;row-gap:12px;align-items:start}
  .tot{background:var(--highlight);border-radius:12px;padding:12px 16px 13px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tk{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--on-highlight)}
  .tv{font-size:34px;line-height:1.1;font-weight:700;color:var(--title)}
  .tv small{font-size:14px;font-weight:600;color:var(--body);margin-left:4px}
  .cmp{grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
  .cmp p{font-size:14.5px;line-height:1.42;color:var(--title)}
  .cmp p.most{font-weight:600}
  .bside{min-width:0;display:flex;flex-direction:column;gap:7px}
  .bands{display:flex;flex-direction:column;gap:6px;min-width:0}
  .bgl{font-size:13px;line-height:1.38;color:var(--body)}
  .bgl b{color:var(--title);font-weight:600}
  .band{display:grid;grid-template-columns:96px 78px minmax(0,1fr) auto;align-items:center;gap:10px;
    border:1.5px solid var(--line);border-radius:9px;padding:7px 11px;background:var(--bg)}
  .band .bn{font-size:15px;font-weight:700;color:var(--title)}
  .band .br{font-size:14px;font-weight:600;color:var(--on-highlight)}
  .band .bm{font-size:13.5px;line-height:1.35;color:var(--body);min-width:0}
  .band .bt{font-size:12.5px;font-weight:700;color:var(--on-highlight);white-space:nowrap;display:flex;align-items:center;gap:4px}
  .band .bt svg.ic{width:15px;height:15px}
  .band.me{background:var(--highlight);border-color:var(--on-highlight);box-shadow:0 0 0 1px var(--on-highlight)}
  /* the bar */
  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:50px;padding-top:8px}
  button.nav{font-family:inherit;font-size:15px;font-weight:600;padding:9px 20px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--on-highlight);
    background:var(--on-highlight);color:var(--bg);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.36;color:var(--body)}
  #hint b{color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* under 600px: a portrait restack, not a shrunken slide */
  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .board{flex:0 0 auto}
    .gopts{grid-template-columns:1fr;gap:12px}
    .q{gap:12px}
    .opts{grid-template-columns:1fr}
    .ocap{font-size:15px}
    button.opt{min-height:56px;padding:9px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:11px;row-gap:3px}
    button.opt .tg{grid-column:2}
    button.opt .ol{font-size:16px}
    .fb .ft{font-size:15.5px}
    .fb{scroll-margin:16px}
    .both{font-size:15px}
    button.opt .kn,button.gopt .kn{display:none}
    .res{display:flex;flex-direction:column;gap:12px;align-items:stretch}
    .bgl{font-size:14.5px}
    .band{grid-template-columns:auto auto;row-gap:2px}
    .band .bm{grid-column:1 / -1}
    .band .bt{grid-column:1 / -1}
    .cmp p{font-size:15.5px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
    #hint{font-size:15px;flex:1 1 100%;margin-top:4px}
    #hint .kb{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

  <style>
    #stage{display:none!important}

  <div class="nsf">
    <h2>Score the twelve questions</h2>
    <p>Before you see a single question, what is your guess: is Cumberland a high-risk business or a low-risk one, purely because of what it does for a living? Write down <strong>High</strong> or <strong>Low</strong>.</p>
    <p>Then answer each question below. The first answer scores 1, the second 2, the third 3 and the fourth 4. Pick the one that you think best describes Cumberland, and add up your twelve scores. Score Cumberland as a whole company, not only your own service area.</p>
    <h3>1. What is the most sensitive kind of information the business holds?</h3>
    <ol><li>Public or general business information only</li><li>Some personal information (names, contact details)</li><li>Sensitive personal information (financial or identity data)</li><li>Protected health information, and financial/account data</li></ol>
    <h3>2. How many individuals' records does it hold?</h3>
    <ol><li>Fewer than 10,000</li><li>10,000 – 100,000</li><li>100,000 – 1 million</li><li>More than 1 million</li></ol>
    <h3>3. Does the business move money on behalf of others?</h3>
    <ol><li>No</li><li>Occasionally, small amounts</li><li>Regularly, moderate volumes</li><li>Routinely, on behalf of many clients</li></ol>
    <h3>4. How many outside organizations connect to or exchange data with the business?</h3>
    <ol><li>None</li><li>One or two</li><li>A handful</li><li>Many: clearinghouses, payers, banks, an outsourced IT provider</li></ol>
    <h3>5. How much of the business is reachable from the public internet?</h3>
    <ol><li>Nothing</li><li>A basic website only</li><li>Some services (a portal or webmail)</li><li>Services that accept and hold sensitive data from outside</li></ol>
    <h3>6. What regulation applies, and is the business audited against it?</h3>
    <ol><li>None</li><li>Light regulation, no external audit</li><li>One regime with periodic review</li><li>HIPAA plus contractual security audits from a major customer</li></ol>
    <h3>7. How is the workforce distributed?</h3>
    <ol><li>A few people, one location</li><li>One location, tens of staff</li><li>Multiple locations or significant remote work</li><li>~180 staff with a large remote/home-working share</li></ol>
    <h3>8. How dependent is the business on third parties for critical functions?</h3>
    <ol><li>Everything is in-house</li><li>Minor outsourcing</li><li>Some critical functions outsourced</li><li>Core IT, backups and a key application depend on outside providers</li></ol>
    <h3>9. What is the transaction volume?</h3>
    <ol><li>Low</li><li>Moderate</li><li>High</li><li>High and time-critical, with monthly peaks</li></ol>
    <h3>10. How attractive is the data to an attacker?</h3>
    <ol><li>Low value</li><li>Some value</li><li>Valuable</li><li>Health and payment data, among the highest-value there is</li></ol>
    <h3>11. How many people outside the company depend on it operating?</h3>
    <ol><li>Few</li><li>Some</li><li>Many</li><li>41 clinics and two hospital systems, plus 2.1M patients</li></ol>
    <h3>12. What is the impact if the business is unavailable for a day?</h3>
    <ol><li>Minor inconvenience</li><li>Noticeable disruption</li><li>Significant, recoverable</li><li>Clinics can't submit, payments stall, statutory clocks keep running</li></ol>
    <h3>Find your band</h3>
    <table>
      <tr><th>Band</th><th>Total</th><th>Meaning</th></tr>
      <tr><td>Low</td><td>12 to 19</td><td>Little would be lost if security were weak</td></tr>
      <tr><td>Moderate</td><td>20 to 29</td><td>Ordinary business risk</td></tr>
      <tr><td>Elevated</td><td>30 to 39</td><td>High-stakes; strong controls expected</td></tr>
      <tr><td>High</td><td>40 to 48</td><td>Among the riskiest profiles at this size</td></tr>
    </table>
    <p><strong>High-stakes</strong> means a lot could go wrong. <strong>Controls</strong> means the protections a business puts in place. <strong>Riskiest profiles at this size</strong> means the riskiest kinds of business with this many staff.</p>
    <p>Most people land between 46 and 48, which is High.</p>

    if(e.key === "ArrowRight"){ e.preventDefault(); go(1); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); return; }
    if(S[i].guess && (e.key === "1" || e.key === "2")){ e.preventDefault(); pickGuess(GUESS[+e.key - 1].id); return; }
    if(S[i].q !== undefined && /^[1-4]$/.test(e.key)){ e.preventDefault(); pick(+e.key); }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    tx = null; ty = null;
  }, {passive:true});

  /* scale the fixed canvas down to fit, never up */
  var stage = document.getElementById("stage");
  function fit(){
    if(phone()) stage.style.transform = "";
    else {
      var sc = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
      stage.style.transform = "scale(" + sc + ")";
    }
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* the QA hook: goto ignores the locks on purpose, so every slide can be measured */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    guess:function(id){ pickGuess(id); return G.guess; },
    pick:function(s){ pick(s); return G.A[S[i].q]; },
    total:total,
    reset:function(){ resetAll(); },
    state:function(){ return { i:i, G:G }; }
  };
})();
</script>
</body>
</html>
