<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Deck Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Text&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the mockup B lesson player. Slim rail on top, one slide card on a tinted stage, Back and Next below. */
:root{
  --bg:#FFFFFF;
  --stage:#FAFAFA;
  --surface:#FFFFFF;
  --text:#000000;
  --text-2:#666666;
  --purple:#3D1FBC;
  --action:#2550D0;
  --action-hover:#14369C;
  --on-action:#FFFFFF;
  --tint:#E5E0FA;
  --tint-2:#D2CAF5;
  --peri:#DCE1FF;
  --line:#DDDDDD;
  --line-soft:#EEEEEE;
  --line-strong:#C9C6C5;
  --note-bg:#F3F0FD;
  --note-line:#D2CAF5;
  --icode-bg:#EFEBFC;
  --icode-text:#2A1590;
  --focus:#2550D0;
  --end-bg:#EEF0FF;
  --end-text:#4D5380;
  --f-display:"DM Serif Text", Georgia, "Times New Roman", serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-card:16px;
  --r-panel:12px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

/* Rail */
.top{flex:none;border-bottom:1px solid var(--line-soft);padding:9px 16px 7px}
.rail{display:flex;gap:6px;min-width:0}
.pg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:5px;background:none;border:0;padding:3px 2px 1px;margin:0;cursor:pointer;border-radius:6px;text-align:center}
.pg i{display:block;height:4px;border-radius:2px;background:var(--line);transition:background-color .2s ease}
.pg.is-done i{background:var(--purple)}
.pg.is-cur i{background:var(--purple);height:6px;border-radius:3px;margin:-1px 0}
.pg-label{font-size:12px;font-weight:500;line-height:1.2;color:var(--text-2);font-variant-numeric:tabular-nums}
.pg.is-done .pg-label{color:var(--purple)}
.pg.is-cur .pg-label{color:var(--text);font-weight:600}

/* Stage and card */
.stage{flex:1 1 auto;min-height:0;background:var(--stage);padding:12px 16px;display:flex}
.card{flex:1;min-width:0;min-height:0;overflow-y:auto;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:22px 26px}
.inner{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:1000px;margin:0 auto}
.inner.anim{animation:in .28s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@media (min-width:640px){ .inner{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:start} }

.kicker{margin:0 0 4px;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--purple)}
.title{margin:0 0 12px;font-family:var(--f-display);font-weight:400;font-size:clamp(22px, 1.4vw + 15px, 28px);line-height:1.15}
.h3{margin:0 0 8px;font-size:14px;font-weight:600}
.bl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.bl li{position:relative;padding-left:20px;font-size:15px;line-height:1.5}
.bl li::before{content:"";position:absolute;left:3px;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--purple)}
.bl b{font-weight:600}
code{font-family:var(--f-mono);font-size:.86em;background:var(--icode-bg);color:var(--icode-text);padding:0 .3em;border-radius:5px}
.words{margin-top:14px;background:var(--note-bg);border:1px solid var(--note-line);border-radius:10px;padding:11px 14px}
.words p{margin:0;font-size:14px;line-height:1.5}
.words p + p{margin-top:6px}
.words b{color:var(--purple);font-weight:600}

/* Slide thumbnail: a sketch of the template slide */
.thumb{aspect-ratio:16/9;width:100%;background:#FFFFFF;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 0 var(--line-soft),0 8px 20px -14px rgba(61,31,188,.35);padding:5% 5.5%;display:flex;flex-direction:column;gap:5px;overflow:hidden;font-size:10px;line-height:1.25}
.thumb-cap{margin:8px 0 0;font-size:12.5px;color:var(--text-2);text-align:center}
.t-h{font-family:var(--f-display);font-size:13px;color:var(--purple);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-row{display:flex;gap:5px;min-height:0;flex:1}
.t-col{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.tb{flex:1;min-width:0;background:var(--note-bg);border:1px solid var(--tint);border-radius:5px;padding:4px 6px;color:#3A3550;overflow:hidden}
.tb b{display:block;font-weight:600;color:var(--text);font-size:10px}
.tb.ph{background:#FFFFFF;border-style:dashed;border-color:var(--tint-2);color:var(--text-2)}
.flow{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.flow span{background:var(--tint);border-radius:4px;padding:2px 4px;font-size:8.5px;white-space:nowrap}
.flow em{font-style:normal;color:var(--purple);font-size:9px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;font-size:8.5px}
.mini span{background:#FFFFFF;border:1px solid var(--tint);border-radius:2px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini span.hd{background:var(--tint);font-weight:600}
.mini.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.big{font-family:var(--f-display);font-size:16px;color:var(--text);line-height:1.15}
.center{justify-content:center;align-items:flex-start}

/* Footer */
.foot{flex:none;border-top:1px solid var(--line-soft);padding:8px 16px;display:flex;align-items:center;gap:12px}
.btn-back{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:8px 16px 8px 12px;font-size:14px;font-weight:500;cursor:pointer}
.btn-back:hover:not(:disabled){background:var(--stage);border-color:var(--text-2)}
.btn-back:disabled{opacity:.4;cursor:default}
.btn-back svg,.btn-next svg{width:15px;height:15px;flex:none}
.where{flex:1;min-width:0;text-align:center;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.btn-next{display:inline-flex;align-items:center;gap:8px;background:var(--action);color:var(--on-action);border:1px solid var(--action);border-radius:999px;padding:8px 16px 8px 20px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-next:hover:not(.end){background:var(--action-hover);border-color:var(--action-hover)}
.btn-next.end{background:var(--end-bg);border-color:var(--end-bg);color:var(--end-text);cursor:default;padding-inline:18px}

@media (max-width:639px){ .thumb-wrap{max-width:300px;margin:0 auto;width:100%} }
@media (max-width:479px){
  .card{padding:16px}
  .title{font-size:21px}
  .bl li{font-size:14.5px}
  .rail{gap:4px}
  .btn-next.end{white-space:normal;text-align:center;flex:1 1 auto;min-width:0;padding-inline:14px}
  .btn-next.end ~ .where{display:none}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none !important;transition:none !important} }
</style>
</head>
<body>
<div class="app">
  <h1 class="sr-only">What Goes on Each of the 9 Slides</h1>
  <header class="top">
    <nav class="rail" id="rail" aria-label="Slides"></nav>
  </header>
  <main class="stage">
    <section class="card" id="card" aria-live="polite"></section>
  </main>
  <footer class="foot">
    <button type="button" class="btn-back" id="btn-back">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </button>
    <div class="where" id="where">Slide 1 of 9</div>
    <button type="button" class="btn-next" id="btn-next">
      <span id="next-label">Next</span>
      <svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </footer>
</div>

<script>
(function () {
  "use strict";

  /* Slide content comes from the Project 9 task "Share Your Final Pipeline Presentation"
     and the "Pfizer Final Presentation Template [Make a Copy]" Google Slides file. */
  var SLIDES = [
    {
      title: "Title Slide",
      thumb:
        '<div class="t-col center" style="gap:8px">' +
          '<div class="big">AI-Powered Document Insights and Data Extraction</div>' +
          '<div class="tb ph" style="flex:none">Name: [Add name]<br>Email: [Add email]</div>' +
        '</div>',
      fill: [
        "The title is already written for you, so leave it as it is.",
        "Replace <b>[Add name]</b> and <b>[Add email]</b> with your own name and email address."
      ],
      words: []
    },
    {
      title: "Problem Statement",
      thumb:
        '<div class="t-h">Problem Statement | Pharmaceutical Document Intelligence</div>' +
        '<div class="tb ph" style="flex:none">[One-line description of the problem]</div>' +
        '<div class="t-row">' +
          '<div class="t-col"><div class="tb"><b>Challenge</b>[2 to 3 sentences]</div><div class="tb"><b>Solution</b>[1 to 2 sentences]</div></div>' +
          '<div class="t-col"><div class="mini two"><span class="hd">Pain Point</span><span class="hd">How You Solve It</span><span>[Problem 1]</span><span>[Solution 1]</span><span>[Problem 2]</span><span>[Solution 2]</span><span>[Problem 3]</span><span>[Solution 3]</span><span>[Problem 4]</span><span>[Solution 4]</span></div></div>' +
        '</div>',
      fill: [
        "<b>One line</b> on the real problem your pipeline solves, like “Extracting compliance data from unstructured pharmaceutical documents.”",
        "<b>Challenge:</b> what makes it hard, like many document types, blurry scans and no clear structure.",
        "<b>Solution:</b> how your RAG pipeline solves it, naming OCR, chunking and retrieval.",
        "<b>Pain Point table:</b> 3 or 4 problems, each with how your pipeline fixes it."
      ],
      words: [
        "<b>RAG</b> (retrieval-augmented generation): the chatbot finds the parts of the document that match the question, then answers from them.",
        "<b>OCR</b> (optical character recognition): turning a picture of text, like a scan, into real text."
      ]
    },
    {
      title: "System Architecture",
      thumb:
        '<div class="t-h">System Architecture | [Your Architecture Name]</div>' +
        '<div class="flow"><span>Document Input</span><em>→</em><span>OCR</span><em>→</em><span>Chunking</span><em>→</em><span>Embeddings</span><em>→</em><span>Vector Storage</span><em>→</em><span>Retrieval</span><em>→</em><span>LLM Response</span></div>' +
        '<div class="mini"><span class="hd">Component</span><span class="hd">Technology</span><span class="hd">Settings</span><span>OCR Engine</span><span>[ ]</span><span>[ ]</span><span>Text Chunking</span><span>[ ]</span><span>[ ]</span><span>Embeddings</span><span>[ ]</span><span>[ ]</span><span>Vector Database</span><span>[ ]</span><span>[ ]</span><span>Retriever</span><span>[ ]</span><span>[ ]</span><span>LLM</span><span>[ ]</span><span>[ ]</span><span>Prompt Strategy</span><span>[ ]</span><span>[ ]</span></div>',
      fill: [
        "<b>Draw your pipeline</b> as a simple left-to-right flow, from Document Input to LLM Response.",
        "<b>Component Specifications table:</b> the tool you actually used in each row, and its settings.",
        "Be exact: model names, chunk size and the top-K value from your notebook."
      ],
      words: [
        "<b>Chunk:</b> a small piece of the document’s text. <b>Top-K:</b> how many chunks the retriever hands to the LLM (top-K = 5 means the 5 closest)."
      ]
    },
    {
      title: "Pipeline Performance Metrics",
      thumb:
        '<div class="t-h">Pipeline Performance Metrics | [Evaluation Period]</div>' +
        '<div class="t-row">' +
          '<div class="tb"><b>Retrieval</b>Recall@K<br>MRR<br>Precision@K<br>Hit Rate</div>' +
          '<div class="tb"><b>Accuracy</b>Answers<br>Citations<br>Facts</div>' +
          '<div class="tb"><b>Speed</b>Response<br>Retrieval<br>LLM</div>' +
        '</div>',
      fill: [
        "<b>Test first.</b> Run your pipeline on your test set and copy in only the numbers it gave you.",
        "<b>Retrieval:</b> Recall@K, MRR, Precision@K and Hit Rate.",
        "<b>Accuracy:</b> the share of right answers and correct sources, and how many test questions you used.",
        "<b>Speed:</b> OCR time, retrieval time and the LLM’s answer time."
      ],
      words: [
        "<b>Recall@K:</b> of the right chunks, how many made the top K. <b>Precision@K:</b> of the top K, how many were right.",
        "<b>MRR</b> (mean reciprocal rank): how near the top the first right chunk sits (1.0 = always first). <b>Hit Rate:</b> the share of questions with at least one right chunk."
      ]
    },
    {
      title: "Pipeline in Action: Query 1",
      thumb:
        '<div class="t-h">Pipeline in Action | Example Query 1</div>' +
        '<div class="t-row">' +
          '<div class="t-col">' +
            '<div class="tb" style="flex:none"><b>Query</b>“[Your real test question]”</div>' +
            '<div class="tb"><b>Retrieved Chunks</b>“[Chunk 1]” 0.XX<br>“[Chunk 2]” 0.XX<br>“[Chunk 3]” 0.XX</div>' +
            '<div class="tb" style="flex:none"><b>Final Answer</b>“[LLM answer]”</div>' +
          '</div>' +
          '<div class="tb ph" style="flex:.8;display:flex;align-items:center;justify-content:center;text-align:center">Screenshot of your Gradio chatbot</div>' +
        '</div>',
      fill: [
        "Pick <b>one real question</b> you asked your chatbot in testing, like a simple fact lookup.",
        "Show the question, the <b>3 chunks</b> it found with their similarity scores, and the <b>final answer</b>.",
        "Add a <b>screenshot of your Gradio chatbot</b> showing that question and its answer."
      ],
      words: [
        "<b>Similarity score:</b> a number for how closely a chunk matches the question. The higher it is, the closer the match."
      ]
    },
    {
      title: "Pipeline in Action: Query 2",
      thumb:
        '<div class="t-h">Pipeline in Action | Example Query 2</div>' +
        '<div class="t-row">' +
          '<div class="t-col">' +
            '<div class="tb" style="flex:none"><b>Query</b>“[A different kind of question]”</div>' +
            '<div class="tb"><b>Retrieved Context</b>[How many chunks, which sources, how relevant]</div>' +
            '<div class="tb"><b>Response Quality</b>[Accurate? Complete? Cited?]</div>' +
          '</div>' +
          '<div class="tb ph" style="flex:.8;display:flex;align-items:center;justify-content:center;text-align:center">Screenshot of your Gradio chatbot</div>' +
        '</div>',
      fill: [
        "Pick a <b>different kind of question</b>, like one that needs facts from two places.",
        "<b>Retrieved context:</b> how many chunks came back, from which documents, and how useful they were.",
        "<b>Response quality:</b> was the answer accurate, complete and properly cited?",
        "Choose an example that shows <b>a strength and a limitation</b>, and add a Gradio screenshot."
      ],
      words: []
    },
    {
      title: "Design Decision Analysis",
      thumb:
        '<div class="t-h">Design Decision Analysis | [Your Design Philosophy]</div>' +
        '<div class="t-row">' +
          '<div class="t-col"><div class="tb"><b>Speed vs. Accuracy</b>[Your choices]</div><div class="tb"><b>Complexity vs. Maintainability</b>[Your choices]</div></div>' +
          '<div class="t-col"><div class="mini"><span class="hd">Decision</span><span class="hd">Rationale</span><span class="hd">Trade-offs</span><span>Embedding</span><span>[ ]</span><span>[ ]</span><span>Chunking</span><span>[ ]</span><span>[ ]</span><span>LLM</span><span>[ ]</span><span>[ ]</span><span>Vector DB</span><span>[ ]</span><span>[ ]</span></div></div>' +
        '</div>',
      fill: [
        "<b>Speed vs. accuracy:</b> what you chose, and what you could do differently for better accuracy.",
        "<b>Complexity vs. maintainability:</b> where you kept things simple, and where extra complexity was worth it.",
        "<b>Trade-offs table:</b> for your embedding model, chunking, LLM and vector database, why you chose it and what you gave up. For example: “Chose MiniLM embeddings for speed on limited hardware.”"
      ],
      words: [
        "<b>Trade-off:</b> giving up a bit of one thing to get more of another, like a faster answer that is slightly less accurate."
      ]
    },
    {
      title: "Current Limitations and Next Steps",
      thumb:
        '<div class="t-h">Current Limitations &amp; Next Steps | [Your Roadmap]</div>' +
        '<div class="t-row">' +
          '<div class="t-col"><div class="tb"><b>Limitation 1</b>[What fails]</div><div class="tb"><b>Limitation 2</b>[What fails]</div><div class="tb"><b>Limitation 3</b>[What fails]</div></div>' +
          '<div class="t-col"><div class="tb"><b>Short-term</b>[Next fix]</div><div class="tb"><b>Medium-term</b>[Bigger upgrade]</div><div class="tb"><b>Long-term</b>[Your vision]</div></div>' +
        '</div>',
      fill: [
        "Name <b>2 or 3 things</b> your pipeline struggles with, such as handwritten text, low-DPI scans or tables.",
        "For each one, say <b>why</b> it happens.",
        "<b>Proposed enhancements:</b> a short-term fix, a medium-term upgrade and your long-term vision."
      ],
      words: [
        "<b>DPI</b> (dots per inch): how much detail a scan has. A low-DPI scan looks blurry, so OCR misreads more letters."
      ]
    },
    {
      title: "Project Impact and Learning Outcomes",
      thumb:
        '<div class="t-h">Project Impact &amp; Learning Outcomes</div>' +
        '<div class="t-row">' +
          '<div class="tb"><b>What I Learned</b>[New tools, methods, ideas]</div>' +
          '<div class="tb"><b>Business Impact</b>[Time or effort saved]</div>' +
          '<div class="tb"><b>Skills</b>[Technical and soft skills]</div>' +
        '</div>',
      fill: [
        "<b>What you learned:</b> the new tools, methods or ideas you picked up.",
        "<b>Business impact:</b> how much time or effort could this pipeline save?",
        "<b>Skills:</b> technical ones (Python, RAG, OCR) and soft skills (problem-solving, documentation).",
        "In the template, slide 9 only says “Thank you”. Add these three parts to it."
      ],
      words: []
    }
  ];

  var rail = document.getElementById("rail");
  var card = document.getElementById("card");
  var where = document.getElementById("where");
  var back = document.getElementById("btn-back");
  var next = document.getElementById("btn-next");
  var nextLabel = document.getElementById("next-label");
  var nextIcon = document.getElementById("next-icon");
  var cur = 0;
  var seen = 0;

  SLIDES.forEach(function (s, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "pg";
    b.setAttribute("aria-label", "Slide " + (i + 1) + ": " + s.title);
    b.innerHTML = "<i></i><span class=\"pg-label\">" + (i + 1) + "</span>";
    b.addEventListener("click", function () { go(i); });
    rail.appendChild(b);
  });

  function render(anim) {
    var s = SLIDES[cur];
    var words = s.words.length
      ? '<div class="words">' + s.words.map(function (w) { return "<p>" + w + "</p>"; }).join("") + "</div>"
      : "";
    card.innerHTML =
      '<div class="inner' + (anim ? " anim" : "") + '">' +
        '<div class="thumb-wrap"><div class="thumb" aria-hidden="true">' + s.thumb + '</div>' +
        '<p class="thumb-cap">What slide ' + (cur + 1) + ' looks like in the template</p></div>' +
        '<div>' +
          '<p class="kicker">Slide ' + (cur + 1) + '</p>' +
          '<h2 class="title">' + s.title + '</h2>' +
          '<h3 class="h3">What goes on it</h3>' +
          '<ul class="bl">' + s.fill.map(function (f) { return "<li>" + f + "</li>"; }).join("") + '</ul>' +
          words +
        '</div>' +
      '</div>';
    card.scrollTop = 0;
    where.textContent = "Slide " + (cur + 1) + " of " + SLIDES.length;
    back.disabled = cur === 0;
    var last = cur === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextLabel.textContent = last ? "That’s all 9 slides" : "Next";
    nextIcon.style.display = last ? "none" : "";
    if (cur > seen) seen = cur;
    Array.prototype.forEach.call(rail.children, function (b, i) {
      b.classList.toggle("is-cur", i === cur);
      b.classList.toggle("is-done", i < cur || (i <= seen && i !== cur));
      if (i === cur) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
  }

  function go(i) {
    if (i < 0 || i >= SLIDES.length || i === cur) return;
    cur = i;
    render(true);
  }

  back.addEventListener("click", function () { go(cur - 1); });
  next.addEventListener("click", function () { go(cur + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(cur + 1);
    if (e.key === "ArrowLeft") go(cur - 1);
  });

  render(false);
})();
</script>
</body></html>
