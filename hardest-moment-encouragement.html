<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where you are in this Step</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FDF8F8;
      --paper: #FBF6F0;
      --title: #1C1B1B;
      --body: #484646;
      --muted: rgba(72,70,70,0.55);
      --line: rgba(72,70,70,0.18);
      --line-soft: rgba(72,70,70,0.10);
      --accent: #001D69;
      --highlight: #DCE1FF;
      --amber: #D97706;
      --amber-soft: #F5B547;
      --amber-glow: rgba(217,119,6,0.45);
      --amber-aura: rgba(245,181,71,0.28);
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--body);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 720px;
      height: 260px;
      background: var(--paper);
      border: 1px solid var(--line-soft);
      border-radius: 4px;
      box-shadow:
        0 1px 0 rgba(0,0,0,0.02),
        0 8px 28px rgba(28,27,27,0.06),
        0 2px 6px rgba(28,27,27,0.04);
      position: relative;
      padding: 20px 36px 24px;
      display: flex;
      flex-direction: column;
    }

    /* Eyebrow */
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
    }

    /* Curve area */
    .curve-wrap {
      position: relative;
      width: 100%;
      flex: 1;
      margin-top: 6px;
    }

    .curve-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* The pulse on the peak dot */
    .peak-halo-outer {
      transform-origin: 324px 32px;
      transform-box: fill-box;
      animation: haloOuter 3s ease-in-out infinite;
    }
    .peak-halo-inner {
      transform-origin: 324px 32px;
      transform-box: fill-box;
      animation: haloInner 3s ease-in-out infinite;
    }

    @keyframes haloOuter {
      0%   { opacity: 0.0; r: 16px; }
      50%  { opacity: 0.55; r: 28px; }
      100% { opacity: 0.0; r: 16px; }
    }
    @keyframes haloInner {
      0%   { opacity: 0.35; r: 10px; }
      50%  { opacity: 0.85; r: 16px; }
      100% { opacity: 0.35; r: 10px; }
    }

    /* "YOU ARE HERE" tag */
    .you-are-here {
      position: absolute;
      left: 50%;
      top: -2px;
      transform: translateX(-50%) rotate(-3deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .yah-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--amber);
      background: var(--paper);
      padding: 2px 7px;
      border: 1px solid rgba(217,119,6,0.35);
      border-radius: 2px;
      white-space: nowrap;
    }
    .yah-arrow {
      width: 1px;
      height: 18px;
      background: var(--amber);
      margin-top: 2px;
      position: relative;
    }
    .yah-arrow::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 5px;
      height: 5px;
      border-right: 1px solid var(--amber);
      border-bottom: 1px solid var(--amber);
    }

    /* Checkpoint labels under curve */
    .labels {
      position: absolute;
      left: 0; right: 0;
      bottom: -4px;
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
    }
    .lbl {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 33%;
    }
    .lbl-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .lbl-text {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--body);
      letter-spacing: 0.1px;
    }
    .lbl.center .lbl-text {
      color: var(--accent);
      font-weight: 600;
    }
    .lbl.center .lbl-tag {
      color: var(--amber);
    }

    /* Caption block */
    .caption {
      margin-top: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .caption .line-1 {
      font-size: 13.5px;
      font-style: italic;
      color: var(--body);
      letter-spacing: 0.1px;
    }
    .caption .line-2 {
      font-size: 15px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.1px;
    }
  </style>
</head>
<body>
  <div class="card" role="img" aria-label="Difficulty curve showing three checkpoints. You are at the peak: Predict yourself. The curve eases down after this.">

    <div class="eyebrow">Where you are in this Step</div>

    <div class="curve-wrap">
      <!-- viewBox: 648 wide x 130 tall. Peak at x=324, y=32 -->
      <svg class="curve-svg" viewBox="0 0 648 130" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Faint baseline -->
        <line x1="0" y1="108" x2="648" y2="108"
              stroke="rgba(72,70,70,0.12)" stroke-width="0.6"
              stroke-dasharray="2 4" />

        <!-- Subtle area fill under curve -->
        <path
          d="M 24 108
             C 120 108, 200 95, 324 32
             C 448 95, 528 108, 624 108
             L 624 108 L 24 108 Z"
          fill="rgba(0,29,105,0.05)"
        />

        <!-- The journey curve itself -->
        <path
          d="M 24 108
             C 120 108, 200 95, 324 32
             C 448 95, 528 108, 624 108"
          fill="none"
          stroke="#1C1B1B"
          stroke-width="1.4"
          stroke-linecap="round"
        />

        <!-- Pulsing halos behind peak dot (animated via CSS) -->
        <circle class="peak-halo-outer" cx="324" cy="32" r="20"
                fill="rgba(245,181,71,0.30)" />
        <circle class="peak-halo-inner" cx="324" cy="32" r="12"
                fill="rgba(217,119,6,0.50)" />

        <!-- LEFT checkpoint dot -->
        <circle cx="24" cy="108" r="4.5"
                fill="#FBF6F0" stroke="#484646" stroke-width="1.4" />
        <circle cx="24" cy="108" r="1.8" fill="#484646" />

        <!-- PEAK checkpoint dot -->
        <circle cx="324" cy="32" r="6.5"
                fill="#001D69" stroke="#FBF6F0" stroke-width="1.6" />
        <circle cx="324" cy="32" r="2.2" fill="#F5B547" />

        <!-- RIGHT checkpoint dot -->
        <circle cx="624" cy="108" r="4.5"
                fill="#FBF6F0" stroke="#484646" stroke-width="1.4" />
        <circle cx="624" cy="108" r="1.8" fill="#484646" />
      </svg>

      <!-- "YOU ARE HERE" tag pointing at peak -->
      <div class="you-are-here" aria-hidden="true">
        <div class="yah-label">You are here</div>
        <div class="yah-arrow"></div>
      </div>

      <!-- Checkpoint labels -->
      <div class="labels">
        <div class="lbl">
          <span class="lbl-tag">Done</span>
          <span class="lbl-text">Learn the drivers</span>
        </div>
        <div class="lbl center">
          <span class="lbl-tag">Now</span>
          <span class="lbl-text">Predict yourself</span>
        </div>
        <div class="lbl">
          <span class="lbl-tag">Next</span>
          <span class="lbl-text">Check &amp; submit</span>
        </div>
      </div>
    </div>

    <div class="caption">
      <div class="line-1">You're climbing the steepest part of this Step.</div>
      <div class="line-2">It gets easier after this.</div>
    </div>
  </div>
</body>
</html>
