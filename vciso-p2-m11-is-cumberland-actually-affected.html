  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;min-height:56px;padding-top:9px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:9px 17px;border-radius:8px;

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}

  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

        a.out[o] = 1; save(st);
        if(Object.keys(a.out).length >= d.opts.length - 1){ finishQ(s, q, "shown"); return; }
        b.classList.add("out"); b.disabled = true; b.setAttribute("aria-disabled","true");
        b.querySelector(".g").textContent = "✕";
        var note = box.querySelector(".note");
        note.innerHTML = "<b>Not this one.</b> " + esc(d.why[o]);
        say("Not this one. " + d.why[o]);
        var first = box.querySelector("button.opt:not(:disabled)");
        if(first) first.focus();
      });
    });
  }

  function finishQ(s, q, how){
    var a = ans(s.rec);
    a[q].done = how; save(st);
    var r = cur().recs[s.rec], c = CODES[r.cve], d = c[q], meta = QN[q];
    var lastWhy = "";
    if(how === "shown"){ var ks = Object.keys(a[q].out); lastWhy = "Not that one. " + d.why[ks[ks.length-1]] + " "; }
    render();
    var nxt = null;
    if(q === "q1" && !a.q2.done) nxt = el.board.querySelector("#q2");
    else nxt = el.board.querySelector("#" + q);
    if(nxt && !reduce){ nxt.classList.remove("in"); void nxt.offsetWidth; nxt.classList.add("in"); }
    if(q === "q1" && !a.q2.done){ var p = el.board.querySelector("#q2"); if(p) p.focus(); }
    else el.next.focus();
    say((how === "right" ? "Correct. " : lastWhy + "Here is the answer. ") + meta.dq + ": " + meta.pool[d.ok].txt);
  }

  /* ---- slides 3 and 5: question 3, the version check and the verdict ---- */
  function renderVer(s){
    var sc = cur(), r = sc.recs[s.rec], c = CODES[r.cve], a = ans(s.rec);
    if(!readDone(s.rec)){ gate("<b>Answer questions 1 and 2 for this record first.</b>", "Back to the questions", i-1); return; }
    var ok = r.src;
    var h = stripHTML(r, s.rec);
    h += '<div class="cmp">'
      + '<div class="card"><span class="cl">' + icon("file") + "What NVD says it affects</span>"
      + '<span class="cb">' + esc(c.nvd) + '</span><span class="cs">' + esc(c.nvdS) + "</span></div>";
    if(a.wh.done){
      h += '<div class="card" id="runcard"><span class="cl">' + icon("server") + 'What the <span class="hc">' + esc(r.host) + "</span> machine runs</span>"
        + '<span class="cb">' + esc(r.run) + '</span><span class="cs">' + r.note + "</span>"
        + '<span class="cs"><b>Where you checked:</b> ' + rowHTML(r) + (a.wh.done === "shown" ? " (shown to you)" : "") + "</span>"
        + (a.wh.done === "shown" ? '<span class="cs"><b>Not that one.</b> ' + esc(whyWhere(r, Object.keys(a.wh.out).slice(-1)[0])) + "</span>" : "")
        + "</div>";
    } else {
      h += '<div class="card wait"><span class="cl">' + icon("server") + 'What the <span class="hc">' + esc(r.host) + "</span> machine runs</span>"
        + '<span class="cb">Say where you check first.</span></div>';
    }
    h += "</div>";

    if(!a.wh.done){
      var outs = Object.keys(a.wh.out), last = outs.length ? outs[outs.length-1] : null;
      h += '<div class="panel" id="wh" tabindex="-1"><div class="ph">' + icon("search")
        + '<span class="qn">Question 3 of 3, part 1</span><span class="pt">Where do you check the version the ' + esc(r.host) + " machine runs?</span></div>"
        + '<div class="opts row" role="group" aria-label="Where do you check the version">' + WHERE_ORDER.map(function(o){
            var x = !!a.wh.out[o];
            return '<button class="opt' + (x ? " out" : "") + '" type="button" data-o="' + o + '"' + (x ? ' disabled aria-disabled="true"' : "") + ">"
              + '<span class="g" aria-hidden="true">' + (x ? "✕" : "") + '</span><span class="txt">' + esc(WHERE[o]) + "</span></button>";
          }).join("") + "</div>"
        + '<div class="note" id="whnote" role="status" aria-live="polite">' + (last ? "<b>Not this one.</b> " + esc(whyWhere(r, last)) : "") + "</div></div>";
      el.board.innerHTML = h;
      wireWhere(s, r, a);
      el.hint.innerHTML = "<span>" + "Open the sheet you pick and find the " + esc(r.host) + " row." + "</span>";
      return;
    }

    if(!a.v){
      h += '<div class="panel" id="vq" tabindex="-1"><div class="ph">' + icon("scale")
        + '<span class="qn">Question 3 of 3, part 2</span><span class="pt">Does Cumberland run a version this record affects?</span></div>'
        + '<div class="vbtns">'
        + '<button class="vb" type="button" data-v="yes"><span class="g" aria-hidden="true"></span>Yes, it applies</button>'
        + '<button class="vb" type="button" data-v="no"><span class="g" aria-hidden="true"></span>No, it does not apply</button>'
        + "</div></div>";
      el.board.innerHTML = h;
      Array.prototype.forEach.call(el.board.querySelectorAll("button.vb"), function(b){
        b.addEventListener("click", function(){
          a.v = b.dataset.v; save(st);
          render();
          var rv = el.board.querySelector("#rv");
          if(rv){ if(!reduce){ rv.classList.remove("in"); void rv.offsetWidth; rv.classList.add("in"); } rv.focus(); }
          say(strip(rv ? rv.textContent : ""));
        });
      });
      el.hint.innerHTML = "<span>" + "Compare the two cards, then make the call." + "</span>";
      return;
    }

    var yes = applies(r), right = (a.v === "yes") === yes;
    h += '<div class="panel" id="rv" tabindex="-1"><div class="ph">' + icon("scale")
      + '<span class="verdict">' + (yes ? "It applies." : "It does not apply.") + "</span>"
      + '<span class="tag"><span aria-hidden="true">' + (right ? "✓" : "!") + "</span>You said: " + (a.v === "yes" ? "Yes, it applies" : "No, it does not apply")
      + (right ? ". Right." : ". Not this time.") + "</span></div>"
      + '<p class="why">' + esc(r.reveal) + (yes ? "" : " " + esc(SMB_TRAP)) + "</p></div>";
    el.board.innerHTML = h;
    el.hint.innerHTML = "<span>" + (s.rec === 0 ? "Continue to your second record." : "Continue to see both rows together.") + "</span>";
  }

  function whyWhere(r, o){
    if(o === "nvd") return NVD_WHY;
    return r.src === "svc" ? SVC_WHY_NATE : DANA_WHY_SVC;
  }

  function wireWhere(s, r, a){
    var box = el.board.querySelector("#wh");
    Array.prototype.forEach.call(box.querySelectorAll("button.opt"), function(b){
      b.addEventListener("click", function(){
        var o = b.dataset.o;
        if(o === r.src){ doneWhere(s, r, a, "right"); return; }
        a.wh.out[o] = 1; save(st);
        if(Object.keys(a.wh.out).length >= WHERE_ORDER.length - 1){ doneWhere(s, r, a, "shown"); return; }
        b.classList.add("out"); b.disabled = true; b.setAttribute("aria-disabled","true");
        b.querySelector(".g").textContent = "✕";
        box.querySelector(".note").innerHTML = "<b>Not this one.</b> " + esc(whyWhere(r, o));
        say("Not this one. " + whyWhere(r, o));
        var first = box.querySelector("button.opt:not(:disabled)");
        if(first) first.focus();
      });
    });
  }

  function doneWhere(s, r, a, how){
    a.wh.done = how; save(st);
    render();
    var rc = el.board.querySelector("#runcard");
    if(rc && !reduce){ rc.classList.remove("in"); void rc.offsetWidth; rc.classList.add("in"); }
    var vq = el.board.querySelector("#vq"); if(vq) vq.focus();
    say((how === "right" ? "Correct. " : "Here is where to check. ") + r.row + ". The " + r.host + " machine runs " + r.run + ". " + strip(r.note) + " Does Cumberland run a version this record affects?");
  }

  /* ---- slide 6: the two rows ---- */
  function renderRows(){
    var sc = cur();
    if(!(recDone(0) && recDone(1))){
      var to = !recDone(0) ? (readDone(0) ? 2 : 1) : (readDone(1) ? 4 : 3);
      gate("<b>Finish both records first.</b> This table shows your two rows, so it waits until then.", "Go to the next step", to);
      return;
    }
    function cell(l, v, cls){ return '<td data-l="' + l + '"' + (cls ? ' class="' + cls + '"' : "") + ">" + v + "</td>"; }
    var rows = sc.recs.map(function(r){
      var c = CODES[r.cve];
      return "<tr>" + cell("CVE", esc(r.cve))
        + cell("What It Affects", esc(AFFECTS[c.q1.ok].short))
        + cell("What an Attacker Gets", esc(GETS[c.q2.ok].short))
        + cell("Does Cumberland Run It", (applies(r) ? "Yes. " : "No. ") + 'The <span class="nw">' + esc(r.host) + "</span> machine runs " + esc(r.run))
        + cell("Where I Checked", rowHTML(r))
        + cell("Applies", applies(r) ? "applies" : "does not apply", "ap") + "</tr>";
    }).join("");
    el.board.innerHTML = '<p class="lead">These are your two rows for the <b>Flaw Records</b> tab, one per code.</p>'
      + '<table class="ctab"><thead><tr><th scope="col">CVE</th><th scope="col">What It Affects</th><th scope="col">What an Attacker Gets</th>'
      + '<th scope="col">Does Cumberland Run It</th><th scope="col">Where I Checked</th><th scope="col">Applies</th></tr></thead><tbody>'
      + rows + "</tbody></table>";
  }

  function renderClose(){
    el.board.innerHTML = '<div class="closewrap"><div class="statement"><p>A flaw in the catalog is not a flaw you have.</p>'
      + '<p class="sub">NVD is the catalog: a list of every known flaw. A flaw is yours only when Cumberland runs a version it lists. In your scope, one of your two codes applies and one does not.</p></div></div>';
  }

  /* ---------------- navigation ---------------- */
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; render(); el.frame.focus();
  }
  function startOver(){
    if(st.scope) delete st.a[st.scope];
    st.scope = null; save(st); i = 0; render(); el.frame.focus();
  }
  el.back.addEventListener("click", function(){ go(-1); });
  el.next.addEventListener("click", function(){ if(i === S.length-1) startOver(); else go(1); });

  document.addEventListener("pointerdown", function(){ document.documentElement.classList.add("ptr"); }, true);
  var lastPt = null;
  document.addEventListener("pointermove", function(e){
    var p = e.clientX + "," + e.clientY;
    if(lastPt !== null && p !== lastPt) document.documentElement.classList.remove("fresh");
    lastPt = p;
  }, true);
  document.addEventListener("keydown", function(e){
    document.documentElement.classList.remove("ptr");
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled && i < S.length-1) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled && i < S.length-1) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; i = n; render(); return true; },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    scope:function(k){ if(ORDER.indexOf(k) < 0) return false; st.scope = k; save(st); render(); return true; },
    state:function(){ return { i:i, scope:st.scope, a:st.a }; }
  };
})();
</script>
</body>
</html>
