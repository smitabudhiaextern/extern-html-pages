<style>
  :root{

    --on-highlight:#001D69;
    --bg:#FDF8F8;

  button.sc:hover{background:var(--highlight)}
  html.fresh button.sc:not(.on):hover{background:var(--bg)}
  button.sc:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}

  button.opt:disabled{cursor:default}
  button.opt.idle:disabled{border-style:dashed;border-color:var(--line);color:var(--body)}

  button.opt.ok .g{background:var(--ok);border-color:var(--ok);color:var(--bg)}

  button.opt.no .g{background:var(--no);border-color:var(--no);color:var(--bg)}
  button.opt.no .tg{color:var(--no)}
  button.opt.big{font-size:17px;font-weight:600;padding:9px 16px}

  /* ---- feedback ---- */
  .fb{flex:0 0 auto;border-radius:10px;padding:8px 16px 10px;border-left:6px solid;display:flex;flex-direction:column;gap:5px}
  .fb.ok{background:var(--ok-tint);border-color:var(--ok)}
  .fb.no{background:var(--no-tint);border-color:var(--no)}
  .fb .fh{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
  .fb.ok .fh{color:var(--ok)}
  .fb.no .fh{color:var(--no)}
  .fb .fh svg.ic{width:22px;height:22px;stroke-width:2}
  .fb .ft{font-size:14.5px;line-height:1.4;color:var(--title)}

  /* ---- question 3 cards ---- */

  /* ---- the last screen: the two rows ---- */

  .ctab th{background:var(--on-highlight);color:var(--bg);text-align:left;font-size:11px;font-weight:600;

  .ctab th:nth-child(4){width:15.5%} .ctab th:nth-child(5){width:15%} .ctab th:nth-child(6){width:10%}
  .ctab td{padding:6px 8px;border-bottom:1.5px solid var(--line);vertical-align:top}
  .ctab td:first-child{font-weight:600;white-space:nowrap}
  .ctab td.ap{font-weight:700}
  .mk{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:12px;font-weight:700;white-space:nowrap}

  /* Added by render() only when a screen's content would not fit the 540px
     canvas (desktop only): slightly tighter spacing, nothing hidden. */

  .frame.tight .opts{gap:4px}
  .frame.tight .sub{margin-top:-2px}
  .frame.tight .lead{line-height:1.38}
  .frame.tight .fb{padding:6px 16px 7px;gap:3px}
  .frame.tight .fb .ft{line-height:1.34}
  .frame.tight .ctab td{padding-top:4px;padding-bottom:4px}
  .frame.tight .mk{margin-top:1px}
  .frame.tight .statement{padding:6px 16px}

  @keyframes rin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .bar{margin-top:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:52px;padding-top:9px}
  button.nav{font-family:inherit;font-size:15px;font-weight:600;padding:9px 20px;border-radius:8px;

  button.nav.ghost{background:transparent;color:var(--on-highlight)}
  button.nav:disabled{opacity:.34;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--on-highlight);outline-offset:3px}
  #hint{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.36;color:var(--body)}
  #hint b{color:var(--title);font-weight:600}
  .bar.ask #hint{order:-1;color:var(--title);font-weight:600}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;
      height:auto!important;transform:none!important}
    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .segs i{width:22px}
    .chip{margin-left:0;font-size:13px;white-space:normal}
    h1{font-size:22px}
    .lead{font-size:16px}
    .sub{font-size:15px}
    .scopes{grid-template-columns:1fr 1fr;gap:10px}
    button.sc{padding:14px 12px}
    button.sc .si{width:48px;height:48px}
    button.sc .sn{font-size:17px}
    .note2{font-size:16px}
    .board{flex:0 0 auto;overflow:visible}
    .codes{grid-template-columns:1fr}
    .strip{flex-wrap:wrap}
    .strip .fr{flex:1 1 100%}
    .opts.row{flex-direction:column}
    .opts.row button.opt{flex:0 0 auto}
    button.opt{font-size:16px;padding:12px 13px}

    button.opt .txt{flex:1 1 calc(100% - 40px)}
    button.opt .tg{flex:1 1 100%;padding-left:33px}
    .fb .ft{font-size:15.5px}

    .card .cs{font-size:15px}
    .ctab,.ctab tbody,.ctab tr,.ctab td{display:block;width:100%}
    .ctab thead{display:none}
    .ctab{font-size:15px;background:transparent}
    .ctab tr{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 0}
    .ctab td{border:0;padding:4px 12px;white-space:normal!important}
    .ctab td::before{content:attr(data-l);display:block;font-size:12.5px;font-weight:600;letter-spacing:.04em;
      text-transform:uppercase;color:var(--on-highlight)}
    .mk{font-size:14px}
    .statement p{font-size:19px}

  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

    <p>For each of your two records, answer three questions: what it affects, what an attacker gets, and whether Cumberland runs the affected version. Then check your answers against your scope below.</p>

    <ul>

            + '<span class="si">' + icon(SC[k].ic) + "</span>"
            + '<span class="sl">Scope ' + k + "</span>"
            + '<span class="sn">' + esc(SC[k].name) + "</span>"
            + '<span class="ss">' + (on ? '<span class="gl" aria-hidden="true">✓</span>Your scope'
                                        : '<span class="gl" aria-hidden="true">+</span>Pick this one') + "</span>"
            + "</button>";
        }).join("") + "</div>"
      + '<p class="note2">You can switch later. <b>Each scope keeps its own answers</b>, so switching loses nothing.</p>';
    Array.prototype.forEach.call(el.board.querySelectorAll("button.sc"), function(b){
      b.addEventListener("click", function(){
        st.scope = b.dataset.k; save(st); render();
        var nb = el.board.querySelector('button.sc[data-k="' + st.scope + '"]');
        if(nb) nb.focus();
        say("Scope " + st.scope + ", " + SC[st.scope].name + ", picked. Press Next to carry on.");
      });
    });
    return "Pick Your Scope";
  }

  var gated = false;
  function gate(msg, btn, to){
    gated = true;
    el.board.innerHTML = '<div class="gate"><p class="done">' + msg + '</p><button class="go" type="button" id="gobtn">' + btn + "</button></div>";
    el.board.querySelector("#gobtn").addEventListener("click", function(){ i = to; render(); focusTop(); });
    return "One Step Back";
  }
  function needScope(){ return gate("<b>Pick your scope first.</b> Your two codes depend on it.", "Go to the scope picker", 0); }

  function fromHTML(r){
    return (r.src === "svc" ? "From <b>your Services tab</b>, on " : "From <b>Dana</b>, on ") + '<span class="hc">' + esc(r.host) + "</span>";
  }
  function nvdLink(r){
    return '<a class="nvd" href="' + url(r.cve) + '" target="_blank" rel="noopener">Open its NVD record' + icon("out") + '<span class="sr"> (opens in a new tab)</span></a>';
  }
  function stripHTML(r){
    return '<div class="strip">' + icon("bug") + '<span class="cv">' + r.cve + "</span>"
      + '<span class="fr">' + fromHTML(r) + "</span>" + nvdLink(r) + "</div>";
  }

  /* ---- the intro: the scope's two codes ---- */
  function renderIntro(){
    var sc = cur();
    el.board.innerHTML = '<p class="lead">There are two flaw codes in your scope that we are going to check, one at a time. Each code has its own page on the NVD, and we call that page its record. For each one, we will ask you three questions: <b>what it affects</b>, <b>what an attacker gets</b>, and <b>whether Cumberland runs the affected version</b>. At the end of each record, you will decide whether that flaw <b>applies</b>, meaning Cumberland really runs a version that it affects.</p>'
      + '<p class="sub"><span class="hc">' + esc(sc.recs[0].host) + '</span> and <span class="hc">' + esc(sc.recs[1].host) + '</span> are the names of the two Cumberland machines these flaws sit on. The third question comes in two parts: first where to check the version, then whether the flaw applies. If you pick a wrong answer, you can try again. After two wrong tries, or one wrong try on a yes or no question, we show you the right one.</p>'
      + '<div class="codes">' + sc.recs.map(function(r, n){
          return '<div class="code"><span class="rl">' + icon("bug") + "Record " + (n+1) + " of 2</span>"
            + '<span class="cv">' + r.cve + "</span>"
            + '<span class="fr">' + fromHTML(r) + "</span>" + nvdLink(r) + "</div>";
        }).join("") + "</div>"
      + '<p class="note2">Open both NVD records now and keep them in another tab. On each one, you only need two parts: the <b>Description</b>, near the top, and the <b>Known Affected Software Configurations</b> list, further down.</p>';
    return "Your Two Flaw Codes";
  }

  /* ---- shared pieces for a pick ---- */
  function optHTML(o, label, cls, ico, tag, disabled, big){
    return '<button class="opt' + (cls ? " " + cls : "") + (big ? " big" : "") + '" type="button" data-o="' + o + '"'
      + (disabled ? ' disabled aria-disabled="true"' : "") + ">"
      + '<span class="g" aria-hidden="true">' + (ico ? icon(ico) : "") + "</span>"
      + '<span class="txt">' + label + "</span>"
      + (tag ? '<span class="tg">' + tag + "</span>" : "") + "</button>";
  }
  /* A three-option pick: wrong picks turn red; the right one turns green.
     After two wrong picks the right one is shown in green. */
  function pickOpts(list, labelOf, ok, st3, row){
    return '<div class="opts' + (row ? " row" : "") + '" role="group" aria-label="Answers">' + list.map(function(o){
      if(st3.done && o === ok) return optHTML(o, labelOf(o), "ok", "check", st3.done === "right" ? "Right" : "Right answer", true);
      if(st3.out[o]) return optHTML(o, labelOf(o), "no", "x", "Not quite", true);
      if(st3.done) return optHTML(o, labelOf(o), "idle", "", "", true);
      return optHTML(o, labelOf(o), "", "", "", false);
    }).join("") + "</div>";
  }
  function fbHTML(good, lines){
    return '<div class="fb ' + (good ? "ok" : "no") + '" id="fb" tabindex="-1">'
      + '<span class="fh">' + icon(good ? "okc" : "noc") + (good ? "Right" : "Not quite") + "</span>"
      + lines.map(function(t){ return '<p class="ft">' + t + "</p>"; }).join("") + "</div>";
  }
  function pickFb(st3, rightLine, whyOf){
    var outs = Object.keys(st3.out), last = outs.length ? outs[outs.length-1] : null;
    if(st3.done === "right") return fbHTML(true, [esc(rightLine)]);
    if(st3.done === "shown") return fbHTML(false, [esc(SHOWN) + " " + esc(rightLine)]);
    if(last){ var w = whyOf(last); return fbHTML(false, [esc(w) + (/\bPick\b/.test(w) ? "" : " " + esc(AGAIN))]); }
    return "";
  }
  function wirePick(list, ok, st3, onDone){
    Array.prototype.forEach.call(el.board.querySelectorAll(".opts button.opt:not(:disabled)"), function(b){
      b.addEventListener("click", function(){
        var o = b.dataset.o;
        if(o === ok) st3.done = "right";
        else {
          st3.out[o] = 1;
          if(Object.keys(st3.out).length >= list.length - 1) st3.done = "shown";
        }
        save(st);
        render();
        afterPick(!!st3.done);
      });
    });
  }
  function afterPick(done){
    var fb = el.board.querySelector("#fb");
    if(fb && !reduce){ fb.classList.remove("in"); void fb.offsetWidth; fb.classList.add("in"); }
    if(fb) say(strip(fb.innerHTML.replace(/<\/p>/g, " ").replace(/<\/span>/g, ". ")));
    var phone = window.matchMedia("(max-width:599px)").matches;
    var opt = phone ? { preventScroll:true } : undefined;
    if(done) el.next.focus(opt);
    else { var f = el.board.querySelector(".opts button.opt:not(:disabled)"); if(f) f.focus(opt); }
    if(fb && phone) (done ? document.querySelector(".bar") : fb).scrollIntoView({ block:"end", behavior: reduce ? "auto" : "smooth" });
  }

  /* ---- questions 1 and 2 of each record ---- */
  var FW_GLOSS = "A firewall is the device that decides which internet traffic can get in. Fortinet is the company that makes Cumberland’s firewall, called a FortiGate, and FortiOS is the software that runs it.";
  var QN = {
    q1:{ pool:AFFECTS, title:function(r){ return "What does " + r.cve + " affect?"; } },
    q2:{ pool:GETS, title:function(r){ return "What does an attacker get from " + r.cve + "?"; },
         sub:"Running code means making the machine carry out your own instructions. From across the network means from another computer, without sitting at this one." }
  };

  function renderQ(s){
    var r = cur().recs[s.rec], c = CODES[r.cve], d = c[s.q], a = ans(s.rec)[s.q], meta = QN[s.q];
    var lead;
    if(s.q === "q1" && r.cve === "CVE-2017-0144")
      lead = "Open the record with the link above and read its <b>Description</b>, near the top. Its affected list further down is long and also names many medical devices, so go by the Description. Then pick the one that you think the record supports.";
    else if(s.q === "q1")
      lead = "Open the record with the link above. Read its <b>Description</b>, near the top, and its <b>Known Affected Software Configurations</b> list, further down. Then pick the one that you think the record supports.";
    else
      lead = "Read the record’s <b>Description</b> again. It says what an attacker can do with this flaw. Pick the one that you think the Description supports.";
    el.board.innerHTML = stripHTML(r)
      + (a.done ? "" : '<p class="lead">' + lead + "</p>")
      + (meta.sub && !a.done ? '<p class="sub">' + esc(meta.sub) + "</p>" : "")
      + (s.q === "q1" && r.cve === "CVE-2022-40684" && !a.done ? '<p class="sub">' + esc(FW_GLOSS) + "</p>" : "")
      + pickOpts(d.opts, function(o){ return esc(meta.pool[o].txt); }, d.ok, a, false)
      + pickFb(a, RIGHT_LINE[r.cve][s.q], function(o){ return d.why[o] || ""; });
    if(!a.done) wirePick(d.opts, d.ok, a);
    return esc(meta.title(r));
  }

  /* ---- question 3, part 1: where you check the version ---- */
  function whyWhere(r, o){
    if(o === "nvd") return NVD_WHY;
    return r.src === "svc" ? SVC_WHY_NATE : DANA_WHY_SVC;
  }
  function runCard(r, a){
    return '<div class="card" id="runcard"><span class="cl">' + icon("server") + 'What the <span class="hc">' + esc(r.host) + "</span> machine runs</span>"
      + '<span class="cb">' + esc(r.run) + '</span><span class="cs">' + r.note + "</span>"
      + '<span class="cs"><b>Where you checked:</b> ' + rowHTML(r) + (a.wh.done === "shown" ? " (shown to you)" : "") + "</span></div>";
  }
  var WH_GLOSS = "Your Services tab got its software and version from the lookup of your scope’s address that you read in module 6. Nate’s system list is SYSTEM LIST - CCS (Nate’s copy), the list of Cumberland’s machines that you used in Project 1.";
  var WH_GLOSS_SHORT = "When we say the lookup, we mean the lookup of your scope’s address that you read in module 6.";
  function renderWh(s){
    var r = cur().recs[s.rec], a = ans(s.rec);
    el.board.innerHTML = stripHTML(r)
      + (a.wh.done ? "" : '<p class="lead">Step 2 of this module told you where to look for each of your two codes. Look at where this code came from, in the box above. Then pick the place that you think tells you which version the <span class="hc">' + esc(r.host) + "</span> machine runs.</p>")
      + (a.wh.done ? (r.src === "svc" ? '<p class="sub">' + esc(WH_GLOSS_SHORT) + "</p>" : "") : '<p class="sub">' + esc(WH_GLOSS) + "</p>")
      + pickOpts(WHERE_ORDER, function(o){ return esc(WHERE[o]); }, r.src, a.wh, true)
      + pickFb(a.wh, RIGHT_WHERE[r.src], function(o){ return whyWhere(r, o); })
      + (a.wh.done ? runCard(r, a) : "");
    if(!a.wh.done) wirePick(WHERE_ORDER, r.src, a.wh);
    return 'Where do you check the version the <span class="hc">' + esc(r.host) + "</span> machine runs?";
  }

  /* ---- question 3, part 2: the verdict ---- */
  function renderV(s){
    var r = cur().recs[s.rec], c = CODES[r.cve], a = ans(s.rec), ok = vOk(r), yes = applies(r);
    var picked = (a.v === "yes" || a.v === "no") ? a.v : null;
    var LBL = { yes:"Yes, it applies", no:"No, it does not apply" };
    var h = "";
    if(!picked) h += '<p class="lead">A flaw <b>applies</b> only when the machine runs a version that the record lists. The first box shows what the NVD record says this flaw affects. The second box shows what the <span class="hc">' + esc(r.host) + "</span> machine runs. Compare the two, then pick the answer that you think is right.</p>"
      + '<p class="sub">There are only two answers here, so if your pick is not right, we show you the right one straight away.</p>';
    h += '<div class="cmp">'
      + '<div class="card"><span class="cl">' + icon("file") + "What NVD says it affects</span>"
      + '<span class="cb">' + esc(c.nvd) + '</span><span class="cs">' + esc(c.nvdS) + "</span></div>"
      + runCard(r, a) + "</div>";
    h += '<div class="opts row" role="group" aria-label="Answers">' + ["yes","no"].map(function(o){
        if(!picked) return optHTML(o, LBL[o], "", "", "", false, true);
        if(o === ok) return optHTML(o, LBL[o], "ok", "check", picked === ok ? "Right" : "Right answer", true, true);
        if(o === picked) return optHTML(o, LBL[o], "no", "x", "Not quite", true, true);
        return optHTML(o, LBL[o], "idle", "", "", true, true);
      }).join("") + "</div>";
    if(picked){
      var lines = ["<b>" + (yes ? "It applies." : "It does not apply.") + "</b> " + esc(r.reveal)];
      if(!yes) lines.push(esc(SMB_TRAP));
      if(picked !== ok) lines.unshift(esc(SHOWN));
      h += fbHTML(picked === ok, lines);
    }
    el.board.innerHTML = h;
    if(!picked){
      Array.prototype.forEach.call(el.board.querySelectorAll(".opts button.opt"), function(b){
        b.addEventListener("click", function(){
          a.v = b.dataset.v || b.dataset.o; save(st);
          render();
          afterPick(true);
        });
      });
    }
    return "Does " + r.cve + " apply to Cumberland?";
  }

  /* ---- the last screen: the two rows ---- */
  function mark(good){
    return '<span class="mk ' + (good ? "ok" : "sh") + '">' + icon(good ? "check" : "info") + (good ? "Right" : "Shown to you") + "</span>";
  }
  function renderRows(){
    var sc = cur();
    function cell(l, v, cls){ return '<td data-l="' + l + '"' + (cls ? ' class="' + cls + '"' : "") + ">" + v + "</td>"; }
    var rows = sc.recs.map(function(r, n){
      var c = CODES[r.cve], a = ans(n);
      return "<tr>" + cell("CVE", esc(r.cve))
        + cell("What It Affects", esc(AFFECTS[c.q1.ok].short) + mark(a.q1.done === "right"))
        + cell("What an Attacker Gets", esc(GETS[c.q2.ok].short) + mark(a.q2.done === "right"))
        + cell("Does Cumberland Run It", (applies(r) ? "Yes. " : "No. ") + 'The <span class="hc">' + esc(r.host) + "</span> machine runs " + esc(r.run))
        + cell("Where I Checked", rowHTML(r) + mark(a.wh.done === "right"))
        + cell("Applies", (applies(r) ? "applies" : "does not apply") + mark(a.v === vOk(r)), "ap") + "</tr>";
    }).join("");
    el.board.innerHTML = '<p class="lead">Here are your two rows for the <b>Flaw Records</b> tab, one for each code. <b>Every cell is correct</b>, so copy them all into your sheet. '
      + mark(true) + " means you found that answer yourself. " + mark(false) + " means we helped you get there. When you have copied both rows into your Flaw Records tab, go back to the module and carry on.</p>"
      + '<table class="ctab"><thead><tr><th scope="col">CVE</th><th scope="col">What It Affects</th><th scope="col">What an Attacker Gets</th>'
      + '<th scope="col">Does Cumberland Run It</th><th scope="col">Where I Checked</th><th scope="col">Applies</th></tr></thead><tbody>'
      + rows + "</tbody></table>"
      + '<div class="statement"><p>A flaw in the catalog is not a flaw you have.</p>'
      + '<p class="sm">NVD is the catalog: a list of every known flaw. A flaw is yours only when Cumberland runs a version it lists. In your scope, one of your two codes applies and one does not.</p></div>';
    return "Your Two Flaw Records";
  }

  /* ---------------- navigation ---------------- */
  /* A new screen starts at its top. On a phone the page scrolls, so without
     this a long screen could open halfway down, with its title out of view. */
  function focusTop(){
    var phone = window.matchMedia("(max-width:599px)").matches;
    el.frame.focus(phone ? { preventScroll:true } : undefined);
    if(phone) window.scrollTo(0, 0);
  }
  function go(d){
    var n = i + d;
    if(n < 0 || n >= S.length) return;
    i = n; var t = render(); focusTop();
    say(strip(el.prog.textContent) + ". " + strip(t));
  }
  /* Clears only this scope's answers. The scope stays picked, so Next on
     the picker starts it again; another scope can be picked instead. */
  function startOver(){
    var k = st.scope;
    if(k) delete st.a[k];
    save(st); i = 0; render(); focusTop();
    say(k ? "Your answers for Scope " + k + " are cleared. Press Next to start again, or pick another scope." : "Pick your scope.");
  }
  el.back.addEventListener("click", function(){
    if(confirming){ confirming = false; header(); el.next.focus(); say("Your answers are kept."); return; }
    go(-1);
  });
  el.next.addEventListener("click", function(){
    if(i !== S.length-1){ go(1); return; }
    if(!confirming){ confirming = true; header(); el.next.focus(); say(askText()); return; }
    startOver();
  });

  var lastPt = null;
  document.addEventListener("pointermove", function(e){
    var p = e.clientX + "," + e.clientY;
    if(lastPt !== null && p !== lastPt) document.documentElement.classList.remove("fresh");
    lastPt = p;
  }, true);
  document.addEventListener("keydown", function(e){
    var t = e.target && e.target.tagName;
    if(t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); if(!el.next.disabled && i < S.length-1) go(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
  });

  var tx = null, ty = null;
  document.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ if(!el.next.disabled && i < S.length-1) go(1); } else go(-1);
    }
    tx = null; ty = null;
  }, {passive:true});

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){ stage.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ---------------- */
  window.__ex = {
    goto:function(n){ if(!Number.isInteger(n) || n < 0 || n >= S.length) return false; i = n; render(); return true; },
    slides:S.length,
    reset:function(){ st = fresh(); save(st); i = 0; render(); },
    scope:function(k){ if(ORDER.indexOf(k) < 0) return false; st.scope = k; save(st); render(); return true; },
    state:function(){ return { i:i, scope:st.scope, a:st.a }; }
  };
})();
</script>
</body>
</html>
