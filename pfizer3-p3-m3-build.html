:root{

<template id="s1">
  <p class="p">This challenge is optional. It's for you if you want to write the code yourself, instead of running the team's notebook.</p>
  <p class="p"><b>Your goal:</b> "Starting from a blank cell, I can open the supplier file and print page 1 with pypdf, pdfplumber and PyMuPDF."</p>
  <ol class="list">
    <li>Open your copy of the team notebook. The supplier file is already uploaded there. If Colab disconnected, run the setup cells again.</li>
    <li>Add a blank code cell at the bottom with <b>+ Code</b>.</li>
    <li>Write three short blocks of code, one for each library. Each one opens the file and prints the text of page 1.</li>
  </ol>
  <p class="p">Do it without copying from the team's cells. You already ran them, so you know what the output should look like.</p>
  <p class="p">Stuck? Each of the next three slides holds one hint. Open one hint at a time, and only open the next one if you're still stuck.</p>
</template>

<template id="s2">
  <p class="p">Open this hint if you don't know where to start. It names the tools you need from each library.</p>
  {{REVEAL:h1:Show Hint 1}}
  <p class="p">All three libraries work the same way: open the file, pick one page, then ask that page for its text. Only the names change. A function is an action with a name, and you run it by writing its name followed by round brackets.</p>
  <ul class="list">
    <li><b>pypdf:</b> <code>PdfReader</code> opens the file. Each page has an <code>extract_text()</code> function.</li>
    <li><b>pdfplumber:</b> <code>pdfplumber.open()</code> opens the file. Each page has an <code>extract_text()</code> function.</li>
    <li><b>PyMuPDF:</b> <code>pymupdf.open()</code> opens the file. Each page has a <code>get_text()</code> function.</li>
  </ul>
  {{/REVEAL}}
</template>

<template id="s3">
  <p class="p">Open this hint if you know which tools to use, but not how to write them.</p>
  {{REVEAL:h2:Show Hint 2}}
  <p class="p">Each page below is the official guide to one library, written by the people who made it. Find the short example that opens a file and reads a page.</p>
  <div class="links stack">
    {{OPEN:PYPDF:pypdf: Extract Text from a PDF}}
    {{OPEN:PLUMBER:pdfplumber: Extracting text}}
    {{OPEN:PYMUPDF:PyMuPDF: Extract text from a PDF}}
  </div>
  <p class="p">The PyMuPDF example reads every page and saves the text to a file. You only need one page, printed on screen.</p>
  {{/REVEAL}}
</template>

<template id="s6">
  <p class="p">This is the solution for pdfplumber.</p>
  {{REVEAL:sol:Show the Solution}}
  {{CODE:python:Python · pdfplumber:import pdfplumber
with pdfplumber.open("sample-sdf-document.pdf") as pdf:
    print(pdf.pages[0].extract_text())}}
  {{CODE:plain:Output (trimmed):...

...

...}}
  <p class="p">Look at the date. pdfplumber printed <code>3 June,2022</code>, with no space after the comma.</p>
  <p class="p"><code>with</code> opens the file and closes it again when the indented lines are done.</p>
  {{/REVEAL}}
</template>

<template id="s7">
  <p class="p">This is the solution for PyMuPDF.</p>
  {{REVEAL:sol:Show the Solution}}
  {{CODE:python:Python · PyMuPDF:import pymupdf

print(doc[0].get_text())}}
  {{CODE:plain:Output (trimmed):...
3 June, 2022
...
damage to the kit during setup and handling.

Operating Temperature

  <p class="p">Look at the table headings. PyMuPDF put each one on its own line.</p>
  {{/REVEAL}}

<template id="s8">
  <div class="why">
    <p class="p"><b>Why each library reads the page in its own way:</b> a PDF doesn't store sentences or lines. It stores small pieces of text, each with its own spot on the page. Each library has its own rules for joining those pieces back into words and lines. That's why pdfplumber lost a space in the date, and PyMuPDF split the table headings.</p>
    <p class="p"><b>Why the names differ:</b> different teams wrote the three libraries, so each one picked its own names. pypdf and pdfplumber say <code>extract_text()</code>, and PyMuPDF says <code>get_text()</code>.</p>
    <p class="p"><b>Why page 1 is <code>pages[0]</code> and <code>doc[0]</code>:</b> Python counts from 0, not from 1. The first item in a list is item 0. So <code>[0]</code> is page 1, and <code>[1]</code> is page 2.</p>
  </div>
</template>

<template id="s9">
  <p class="p">You might try to ask the whole file for its text, without picking a page first, like this:</p>
  {{CODE:python:Python:from pypdf import PdfReader
reader = PdfReader("sample-sdf-document.pdf")
print(reader.extract_text())}}
  <p class="p">This fails with an error, which is Python's message that it couldn't do what a line asked. The last line of the error says:</p>
  {{CODE:plain:Output:AttributeError: 'PdfReader' object has no attribute 'extract_text'}}
  <p class="p">An attribute is something an object has, such as a function. <code>reader</code> stands for the whole file, and the whole file has no <code>extract_text()</code>. Only a page has it. pdfplumber and PyMuPDF give the same kind of error, so always pick a page first.</p>
</template>

    <li>Check the date. pypdf and PyMuPDF print <code>3 June, 2022</code>, and pdfplumber prints <code>3 June,2022</code>, in your output and in the notebook's.</li>
  </ol>
  <p class="p">If all three match, you wrote the code that reads page 1 with three libraries, by yourself.</p>
</template>

  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), donemsg = $("donemsg");

  /* The fixed stage: pick the wide or narrow design size, then scale the whole deck to fit the window and centre it. */
  function scaleStage() {
    var narrow = window.innerWidth < 560;
    app.classList.toggle("narrow", narrow);
    var W = narrow ? 420 : 760, H = narrow ? 940 : 760;
    var k = Math.min(window.innerWidth / W, window.innerHeight / H);
    app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }

  var groupInfo = GROUPS.map(function (name) {
    var ids = []; SLIDES.forEach(function (s, n) { if (s.group === name) ids.push(n); });
    return { name: name, ids: ids };
  });
  groupInfo.forEach(function (g) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "pg";
    b.setAttribute("aria-label", g.name + ", " + g.ids.length + (g.ids.length === 1 ? " slide" : " slides"));
    b.innerHTML = '<span class="segs">' + g.ids.map(function () { return "<i></i>"; }).join("") + '</span><span class="pg-label">' + g.name + "</span>";
    b.addEventListener("click", function () { go(g.ids[0]); });
    rail.appendChild(b);
  });

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function slideHTML(n) {
    var s = SLIDES[n];
    return '<div class="inner"><p class="step">' + s.label + '</p><h2 class="title">' + s.title + '</h2>' + body(s.tpl) + '</div>';
  }

  function wire() {
    Array.prototype.forEach.call(card.querySelectorAll("[data-copy]"), function (b) {
      var pre = b.closest(".run").querySelector("pre");
      b.addEventListener("click", function () { copyText(pre.textContent, b, pre); });
    });
    Array.prototype.forEach.call(card.querySelectorAll("[data-reveal]"), function (b) {
      b.addEventListener("click", function () {
        var key = b.getAttribute("data-reveal"), box = $("rv-" + key);
        shown[key] = true;
        b.setAttribute("aria-expanded", "true"); b.hidden = true; box.hidden = false;
        var first = box.querySelector("a,button,pre"); if (first) first.focus({ preventScroll: true });
      });
    });
  }

  function render(anim) {
    var s = SLIDES[i];
    card.innerHTML = slideHTML(i);
    if (anim) card.firstChild.classList.add("anim");
    wire();

    var g = GROUPS.indexOf(s.group);
    Array.prototype.forEach.call(rail.children, function (b, gi) {
      var ids = groupInfo[gi].ids;
      b.classList.toggle("is-cur", gi === g);
      b.classList.toggle("is-done", gi < g);
      if (gi === g) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      Array.prototype.forEach.call(b.querySelectorAll(".segs i"), function (seg, si) {
        seg.classList.toggle("done", ids[si] < i);
        seg.classList.toggle("cur", ids[si] === i);
      });
    });
    $("where-section").textContent = s.group;
    $("where-count").textContent = "Slide " + (i + 1) + " of " + SLIDES.length;
    back.disabled = i === 0;
    var last = i === SLIDES.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + SLIDES[i + 1].plain + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n === i || n < 0 || n >= SLIDES.length) return; i = n; render(true); }
  function finish() { donemsg.textContent = DONE_MSG; }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () { if (i === SLIDES.length - 1) finish(); else go(i + 1); });
  /* Left and Right arrow keys move between slides */
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (i < SLIDES.length - 1) go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  window.addEventListener("resize", scaleStage);
  scaleStage();
  render(false);
})();
</script>
</body>
</html>
