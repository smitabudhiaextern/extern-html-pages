<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How AI Reads: Key Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core, Light format. Colors, type, spacing and radius come only from design-system/tokens.json.
   Card player: rail and "Card X of N" on top, one card at a time, Back and Next below.
   Built for a fixed-height Notion embed (see the end of this style block). */
:root{
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --extern-black:#000000;
  --extern-white:#ffffff;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:var(--extern-white);
  --surface-card:var(--blue-50);
  --surface-icon:var(--extern-white);
  --ink:var(--extern-black);
  --ink-muted:var(--gray-800);
  --card-title:var(--extern-black);
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --icon:var(--extern-black);
  --connector:var(--extern-black);
  --action:var(--extern-black);
  --on-action:var(--extern-white);
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--surface);overflow-x:hidden}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{display:flex;flex-direction:column}

/* Header: rail and where-you-are line */
.top{padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr);row-gap:10px;border-bottom:1px solid var(--line)}
.where{font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.seg{flex:1 1 0;min-width:0;height:24px;display:flex;align-items:center;background:none;border:0;padding:0;margin:0;cursor:pointer;border-radius:4px}
.seg i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line)}
.seg.done i{background:var(--blue-200)}
.seg.cur i{background:var(--pfizer-blue);height:6px;border-radius:3px}
@media (min-width:640px){ .top{grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center} .where{order:2} }

/* Stage and card */
.stage{padding:14px 16px}
.card{background:var(--surface-card);border-radius:var(--radius-md);padding:clamp(18px, 3vw, 26px)}
.inner{display:flex;flex-direction:column;gap:var(--space-3);max-width:880px;margin:0 auto}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:clamp(24px, 1.6vw + 18px, 32px);line-height:1.18;color:var(--card-title);text-wrap:balance}
.hl{color:var(--highlight)}
.p{margin:0;font-size:clamp(15px, .3vw + 14px, 16.5px);line-height:1.6;color:var(--card-text)}
.p b,.panel b{font-weight:600;color:var(--card-title)}
.key{margin:0;padding:12px 16px;background:var(--surface-icon);border-radius:var(--radius-sm);font-size:16px;line-height:1.5;font-weight:600;color:var(--card-title)}
.key span{display:block;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label);margin-bottom:4px}

/* Panels inside a card (white on pale blue) */
.pair{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:620px){ .pair{grid-template-columns:repeat(2,minmax(0,1fr))} }
.panel{background:var(--surface-icon);border-radius:var(--radius-sm);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel h3{margin:0;font-size:17px;line-height:1.3;font-weight:600;color:var(--card-title)}
.panel p{margin:0;font-size:14.5px;line-height:1.55;color:var(--card-text)}
.panel .tag{align-self:flex-start;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:var(--radius-xs);border:1px solid var(--ink);color:var(--ink)}
.panel svg{display:block;width:100%;height:auto;max-height:84px}
.sample{font-family:var(--font-mono);font-size:13.5px;line-height:1.5;color:var(--ink);background:var(--gray-50);border-radius:var(--radius-xs);padding:8px 10px;overflow-wrap:anywhere}
.sample.sel span{background:var(--blue-200)}

/* Chat sketch */
.chat{background:var(--surface-icon);border-radius:var(--radius-sm);padding:16px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:85%;padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.45}
.bub.you{align-self:flex-end;background:var(--ink);color:var(--on-action);border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:var(--gray-50);color:var(--ink);border-bottom-left-radius:4px;display:flex;flex-direction:column;gap:6px;min-width:58%}
.bub.bot .bar{height:8px;border-radius:4px;background:var(--gray-200)}
.bub small{font-size:12px;line-height:16px;color:var(--gray-600)}
.look{align-self:center;display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--ink-muted)}
.look svg{width:18px;height:18px;flex:none}

/* Table */
.tbl{background:var(--surface-icon);border-radius:var(--radius-sm);overflow-x:auto}
.tbl table{width:100%;min-width:0;border-collapse:collapse;font-size:14.5px;line-height:1.45}
.tbl th{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-muted);padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--card-text)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-family:var(--font-mono);color:var(--ink);white-space:nowrap}

/* Guess */
.guess{background:var(--surface-icon);border-radius:var(--radius-sm);padding:16px;display:flex;flex-direction:column;gap:12px}
.guess-q{margin:0;font-size:15.5px;line-height:1.5;font-weight:600;color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:10px 16px;font-size:15px;line-height:1.2;font-weight:600;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.reveal{margin:0;padding:12px 14px;border-left:3px solid var(--pfizer-blue);background:var(--gray-50);border-radius:0 var(--radius-xs) var(--radius-xs) 0;font-size:15px;line-height:1.55;color:var(--ink)}
.reveal b{font-weight:600}

/* Foot */
.foot{padding:4px 16px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:1;font-weight:600;padding:14px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer}
.btn svg{width:15px;height:15px;flex:none}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-secondary:disabled{opacity:.35;cursor:default}
.btn-primary{background:var(--action);color:var(--on-action)}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext b{font-weight:600;color:var(--ink)}
@media (max-width:560px){ .upnext{display:none} .foot{justify-content:space-between} .btn-primary.end{white-space:normal;text-align:left;line-height:1.25} }
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
/* Fixed-height embed. Notion sets the frame height by hand and ignores postMessage, so the deck fills
   whatever height it gets: the rail and Back and Next stay in view, and only the slide body scrolls when it is taller. */
html,body{height:100%;overflow:hidden}
.app{height:100%}
.top,.foot,.donemsg{flex:none}
.stage{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column}
.stage > .card{flex:1 0 auto}
.stage:focus-visible{outline-offset:-3px}
.donemsg{margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:14.5px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{padding:0;border:0}
/* A soft fade at the bottom of the slide area while there is more to scroll */
.stage.more::after{content:"";position:sticky;bottom:0;flex:none;display:block;height:36px;margin-top:-36px;background:linear-gradient(to top, var(--surface), transparent);pointer-events:none}
</style>
</head>
<body>
<div class="app" id="app">
  <h1 class="sr-only">Key Ideas: How AI Reads a Document</h1>
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where" id="where">Card 1 of 5</div>
  </header>
  <main class="stage" id="stage" aria-label="Slide"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-secondary" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-primary" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var SEARCH = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="2"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  var CARDS = [
    { label: "01", short: "OCR",
      title: 'How Computers Read a Picture of Words',
      body:
        '<p class="p">Sometimes a document is only a picture of a page, like a photo or a scan. A computer sees that picture as colored dots, not words. <b>OCR (optical character recognition)</b> is a tool that looks at those dots and turns them into letters and numbers the computer can use.</p>' +
        '<div class="pair">' +
          '<div class="panel"><span class="tag">Reads well</span><h3>Printed Text</h3><div class="sample">Expiration Date: 20230126</div><p>Neat, typed letters look the same every time, so OCR gets them right most of the time.</p></div>' +
          '<div class="panel"><span class="tag">Reads poorly</span><h3>Handwriting</h3>' +
            '<svg viewBox="0 0 240 60" role="img" aria-label="A handwritten signature, drawn as a loopy line"><path d="M10 42c10-24 18-30 22-22s-8 26-2 24 14-30 22-28-6 24 2 24 12-18 20-18 2 16 10 14 10-14 18-14 4 12 12 10 14-20 22-20-8 22 0 22 18-12 26-12 6 8 14 6 20-8 28-10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '<p>Every person writes differently, so OCR often guesses the wrong letters.</p></div>' +
        '</div>' +
        '<p class="key"><span>REMEMBER</span>OCR reads printed text well and handwriting poorly.</p>' },

    { label: "02", short: "PDFs",
      title: 'Text PDF or Scanned PDF?',
      body:
        '<p class="p">A <b>PDF (portable document format)</b> is a file that looks the same on every screen. Supplier files usually arrive as PDFs. Two kinds of PDF can look exactly alike, but they are very different inside.</p>' +
        '<div class="pair">' +
          '<div class="panel"><h3>Text PDF</h3><div class="sample sel"><span>Lot Number: 17242818</span></div><p>The words are stored as real text. You can <b>click and drag to select a word, then copy it</b>. A computer program, like a tool written in <b>Python</b> (a programming language, a way of writing instructions for a computer), can read the words straight away, with no OCR.</p></div>' +
          '<div class="panel"><h3>Scanned PDF</h3><div class="sample">Lot Number: 17242818</div><p>It\'s a photo of a paper page. When you try to select a word, nothing highlights, or the whole page highlights as one picture. A computer needs <b>OCR</b> first.</p></div>' +
        '</div>' +
        '<p class="p"><b>How to tell them apart:</b> open the PDF and click and drag across a word. If the word highlights and you can copy it, it\'s a text PDF. If not, it\'s scanned.</p><p class="p">This test isn\'t perfect. Some scanned PDFs have already been run through OCR, so you can highlight their words too, even though the page underneath is still a picture.</p>' +
        '<div class="guess" data-guess="pdf">' +
          '<p class="guess-q">Your guess: which kind is the Cytiva supplier file you opened in the Task?</p>' +
          '<div class="opts"><button type="button" class="opt" data-opt="text" aria-pressed="false">Text PDF</button><button type="button" class="opt" data-opt="scan" aria-pressed="false">Scanned PDF</button></div>' +
          '<p class="reveal" data-reveal hidden></p>' +
        '</div>',
      reveal: {
        text: '<b>You guessed right. It\'s a text PDF.</b> You can select and copy its words. When we ran a Python tool on it, all 3 pages came out as text, except the sideways <b>Approved On</b> stamps on pages 1 and 2. Those are drawn as shapes, so a tool can\'t read those 2 dates without OCR. The output looked complete, but 2 dates were missing, and that\'s exactly why you fact-check.',
        scan: '<b>Good guess, but it\'s a text PDF.</b> Open the file and try selecting a word: it highlights. When we ran a Python tool on it, all 3 pages came out as text, except the sideways <b>Approved On</b> stamps on pages 1 and 2. Those are drawn as shapes, so a tool can\'t read those 2 dates without OCR. The output looked complete, but 2 dates were missing, and that\'s exactly why you fact-check.'
      } },

    { label: "03", short: "NLP",
      title: 'How Computers Understand Language',
      body:
        '<p class="key"><span>ONE LINE</span>NLP is how computers read and understand human language.</p>' +
        '<p class="p"><b>NLP</b> stands for <b>natural language processing</b>. "Natural language" means the everyday words people write and speak. Once the words are out of the PDF, NLP is what works out what they mean.</p>' +
        '<div class="pair">' +
          '<div class="panel"><h3>What the Computer Has</h3><div class="sample">Expiration Date: 20230126</div><p>Just a line of letters and numbers.</p></div>' +
          '<div class="panel"><h3>What NLP Works Out</h3><p>"20230126" is a <b>date</b>. It\'s the <b>expiration date</b>, the last day the product should be used. It means <b>26 January 2023</b>.</p></div>' +
        '</div>' },

    { label: "04", short: "Chatbots",
      title: 'What a Chatbot Does',
      body:
        '<p class="p">A <b>chatbot</b> is a computer program you talk to by typing, and it types back. <b>Gemini</b>, made by Google, is one.</p>' +
        '<p class="p">Most chatbots today run on an <b>LLM (large language model)</b>. That\'s an AI that has learned from a huge amount of text, so it can write sentences that sound like a person wrote them.</p>' +
        '<p class="p">The chatbot you\'ll build in this externship does one more thing: it answers from a document you give it. For example, you could ask whether a <b>lot</b> (a batch of products made together) is still <b>in date</b> (not past its expiration date).</p>' +
        '<div class="chat" role="img" aria-label="A sketch of a chat: you ask whether lot 17242818 is still in date, the chatbot looks in the Cytiva file, then writes a reply.">' +
          '<div class="bub you">Is lot 17242818 still in date?</div>' +
          '<div class="look">' + SEARCH + 'Looks in the Cytiva file</div>' +
          '<div class="bub bot"><span class="bar" style="width:92%"></span><span class="bar" style="width:70%"></span><small>Writes a reply from what it found</small></div>' +
        '</div>' },

    { label: "05", short: "Fact-check",
      title: 'Always Fact-Check What AI Tells You',
      body:
        '<p class="p">AI can sound sure of itself and still be wrong. It doesn\'t know when it has made a mistake, so checking is your job.</p>' +
        '<p class="p">Here\'s a real example. We gave a free NLP tool called <b>spaCy</b> three lines from page 2 of the Cytiva file, typed on one line: <b>Lot Number: 17242818 Date of Manufacture: 20210126 Expiration Date: 20230126</b>. This is what it decided:</p>' +
        '<div class="tbl" role="region" aria-label="What spaCy decided" tabindex="0"><table>' +
          '<thead><tr><th scope="col">Number</th><th scope="col">What spaCy said</th><th scope="col">What it really is</th></tr></thead>' +
          '<tbody>' +
            '<tr><td>17242818</td><td>A date</td><td>The lot number</td></tr>' +
            '<tr><td>20210126</td><td>Nothing (it missed it)</td><td>The manufacture date</td></tr>' +
            '<tr><td>20230126</td><td>A plain number</td><td>The expiration date</td></tr>' +
          '</tbody></table></div>' +
        '<p class="p">The fix is simple: go back to the document and check the answer yourself. You\'ll do exactly that with Gemini at the end of this page.</p>' }
  ];
  var END_LABEL = "Done. Now learn the 3 steps";
  var END_TARGET = "learn";

  var i = 0, picks = {}, lastH = 0;
  var $ = function (id) { return document.getElementById(id); };
  var rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), where = $("where");

  /* Fixed-height embed helpers. Notion ignores postMessage, so nothing below depends on the page around the deck. */
  var stage = $("stage"), donemsg = $("donemsg");
  var DONE_MSG = "You're done with the slides. Scroll down to the next part of the page.";
  /* Scrolls only the slide area, never the page around the embed, so a reveal or message comes into view. */
  function keepInView(el) {
    var s = stage.getBoundingClientRect(), b = el.getBoundingClientRect();
    if (b.bottom > s.bottom) stage.scrollTop += Math.max(0, Math.min(b.bottom - s.bottom + 44, b.top - s.top - 12));
    else if (b.top < s.top) stage.scrollTop -= s.top - b.top + 12;
  }
  /* The slide area takes keyboard focus only when it has something to scroll. */
  function scrollCheck() {
    if (stage.scrollHeight > stage.clientHeight + 1) stage.setAttribute("tabindex", "0"); else stage.removeAttribute("tabindex");
    moreCheck();
  }
  function moreCheck() { stage.classList.toggle("more", stage.scrollTop + stage.clientHeight < stage.scrollHeight - 4); }
  stage.addEventListener("scroll", moreCheck, { passive: true });
  /* The full height the current slide needs, so a page that does listen to postMessage can still fit it. */
  function natural() {
    var inner = card.firstElementChild, cs = getComputedStyle(stage), cc = getComputedStyle(card), f = parseFloat;
    return Math.ceil($("app").offsetHeight - stage.offsetHeight + f(cs.paddingTop) + f(cs.paddingBottom) +
      f(cc.paddingTop) + f(cc.paddingBottom) + f(cc.borderTopWidth) + f(cc.borderBottomWidth) + (inner ? inner.offsetHeight : 0));
  }
  var embedded = window.parent && window.parent !== window;

  CARDS.forEach(function (c, n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "seg";
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + c.short);
    b.innerHTML = "<i></i>";
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function render(anim, nav) {
    var c = CARDS[i];
    card.innerHTML = '<div class="inner' + (anim ? ' anim' : '') + '"><p class="label">' + c.label + '</p><h2 class="title">' + c.title + '</h2>' + c.body + '</div>';
    var g = card.querySelector("[data-guess]");
    if (g) {
      var rev = g.querySelector("[data-reveal]");
      var show = function (k) {
        picks[i] = k;
        Array.prototype.forEach.call(g.querySelectorAll(".opt"), function (o) { o.setAttribute("aria-pressed", o.getAttribute("data-opt") === k ? "true" : "false"); });
        rev.innerHTML = c.reveal[k]; rev.hidden = false; postHeight(false);
      };
      Array.prototype.forEach.call(g.querySelectorAll(".opt"), function (o) {
        o.addEventListener("click", function () { show(o.getAttribute("data-opt")); scrollCheck(); keepInView(rev); });
      });
      if (picks[i]) show(picks[i]);
    }
    Array.prototype.forEach.call(rail.children, function (b, n) {
      b.classList.toggle("cur", n === i);
      b.classList.toggle("done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    where.innerHTML = "<b>" + c.short + "</b> · Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + CARDS[i + 1].short + "</b>";
    donemsg.textContent = "";
    if (nav) stage.scrollTop = 0;
    scrollCheck();
    postHeight(nav);
  }

  function go(n) { if (n === i || n < 0 || n >= CARDS.length) return; i = n; render(true, true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i < CARDS.length - 1) { go(i + 1); return; }
    /* Works on its own: the message shows in the deck. The postMessage is kept for pages that listen, but nothing needs it. */
    donemsg.textContent = DONE_MSG;
    scrollCheck();
    tellParent({ type: "extern-deck-done", target: END_TARGET });
    postHeight(false);
  });
  document.addEventListener("keydown", function (e) {
    var t = e.target && e.target.tagName;
