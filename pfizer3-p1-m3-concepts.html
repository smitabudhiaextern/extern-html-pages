<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How AI Reads: Key Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Pfizer x Extern Core, Light format. Colors, type, spacing and radius come only from design-system/tokens.json.
   Card player: rail and "Card X of N" on top, one card at a time, Back and Next below.
   Fixed design stage, 760 x 740 px. The whole stage scales to fit the Notion embed frame, so nothing ever scrolls. */
:root{
  --pfizer-blue:#0033a0;
  --blue-50:#e6ecf7;
  --blue-200:#b9c8e8;
  --extern-black:#000000;
  --extern-white:#ffffff;
  --green-600:#07a657;
  --gray-50:#f2f2f2;
  --gray-200:#e4e4e4;
  --gray-600:#666666;
  --gray-800:#333333;
  --surface:var(--extern-white);
  --surface-card:var(--blue-50);
  --surface-icon:var(--extern-white);
  --ink:var(--extern-black);
  --ink-muted:var(--gray-800);
  --card-title:var(--extern-black);
  --card-text:var(--gray-800);
  --step-label:var(--pfizer-blue);
  --highlight:var(--green-600);
  --icon:var(--extern-black);
  --connector:var(--extern-black);
  --action:var(--extern-black);
  --on-action:var(--extern-white);
  --line:var(--gray-200);
  --focus-ring:var(--pfizer-blue);
  --space-1:4px;--space-2:8px;--space-3:14px;--space-4:18px;--space-5:26px;--space-6:40px;
  --radius-xs:8px;--radius-sm:12px;--radius-md:14px;
  --font-serif:"DM Serif Display", Georgia, serif;
  --font-text:Inter, system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface)}
body{color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* The fixed stage. JavaScript sets one uniform scale and centres it in the frame. */
.app{position:absolute;left:0;top:0;width:760px;height:740px;display:flex;flex-direction:column;transform-origin:0 0;background:var(--surface)}

/* Header: rail and where-you-are line */
.top{flex:none;padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center;border-bottom:1px solid var(--line)}
.where{min-width:160px;text-align:right;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{font-weight:600;color:var(--ink)}
.rail{display:flex;gap:6px;min-width:0}
.seg{flex:1 1 0;min-width:0;height:24px;display:flex;align-items:center;background:none;border:0;padding:0;margin:0;cursor:pointer;border-radius:4px}
.seg i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line)}
.seg.done i{background:var(--blue-200)}
.seg.cur i{background:var(--pfizer-blue);height:6px;border-radius:3px}

/* Slide area and card. The card fills the space between the header and the buttons. */
.stage{flex:1 1 auto;min-height:0;padding:14px 16px;display:flex;flex-direction:column}
.card{flex:1 1 auto;min-height:0;background:var(--surface-card);border-radius:var(--radius-md);padding:22px 24px}
.inner{display:flex;flex-direction:column;gap:14px}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.title{margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:38px;padding:2px 0;color:var(--card-title);text-wrap:balance}
.hl{color:var(--highlight)}
.p{margin:0;font-size:16px;line-height:1.55;color:var(--card-text)}
.p b,.panel b{font-weight:600;color:var(--card-title)}
.key{margin:0;padding:12px 16px;background:var(--surface-icon);border-radius:var(--radius-sm);font-size:16px;line-height:1.5;font-weight:600;color:var(--card-title)}
.key span{display:block;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label);margin-bottom:4px}

/* Panels inside a card (white on pale blue), always two side by side on the stage */
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.panel{background:var(--surface-icon);border-radius:var(--radius-sm);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel h3{margin:0;font-size:17px;line-height:1.3;font-weight:600;color:var(--card-title)}
.panel p{margin:0;font-size:15px;line-height:1.5;color:var(--card-text)}
.panel .tag{align-self:flex-start;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:var(--radius-xs);border:1px solid var(--ink);color:var(--ink)}
.panel svg{display:block;width:100%;height:auto;max-height:84px}
.sample{font-family:var(--font-mono);font-size:15px;line-height:1.45;color:var(--ink);background:var(--gray-50);border-radius:var(--radius-xs);padding:8px 10px;overflow-wrap:anywhere}
.sample.sel span{background:var(--blue-200)}

/* Chat sketch */
.chat{background:var(--surface-icon);border-radius:var(--radius-sm);padding:16px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:85%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.45}
.bub.you{align-self:flex-end;background:var(--ink);color:var(--on-action);border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:var(--gray-50);color:var(--ink);border-bottom-left-radius:4px;display:flex;flex-direction:column;gap:6px;min-width:58%}
.bub.bot .bar{height:8px;border-radius:4px;background:var(--gray-200)}
.bub small{font-size:15px;line-height:20px;color:var(--gray-800)}
.look{align-self:center;display:flex;align-items:center;gap:8px;font-size:15px;line-height:20px;color:var(--ink-muted)}
.look svg{width:18px;height:18px;flex:none}

/* Table */
.tbl{background:var(--surface-icon);border-radius:var(--radius-sm)}
.tbl table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.45}
.tbl th{text-align:left;font-size:13px;line-height:16px;font-weight:600;color:var(--ink-muted);padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--card-text)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-family:var(--font-mono);color:var(--ink);white-space:nowrap}
.tbl.wrap td{font-family:var(--font-mono);color:var(--ink);white-space:normal;width:50%}

/* Guess */
.guess{background:var(--surface-icon);border-radius:var(--radius-sm);padding:16px;display:flex;flex-direction:column;gap:12px}
.guess-q{margin:0;font-size:15.5px;line-height:1.45;font-weight:600;color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:var(--radius-xs);padding:10px 16px;font-size:15px;line-height:1.2;font-weight:600;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--action);color:var(--on-action)}
.reveal{margin:0;padding:12px 14px;border-left:3px solid var(--pfizer-blue);background:var(--gray-50);border-radius:0 var(--radius-xs) var(--radius-xs) 0;font-size:15px;line-height:1.5;color:var(--ink)}
.reveal b{font-weight:600}

/* The chatbot's 3 jobs (opening card) */
.jobs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.jobs li{background:var(--surface-icon);border-radius:var(--radius-sm);padding:14px 16px;display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:14px;align-items:center}
.jobs .n{white-space:nowrap;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;color:var(--step-label)}
.jobs h3{margin:0;font-size:17px;line-height:1.3;font-weight:600;color:var(--card-title)}
.jobs p{margin:2px 0 0;font-size:15px;line-height:1.45;color:var(--card-text)}

/* Bridge line: why we need the next idea */
.bridge{margin:0;font-size:16px;line-height:1.5;font-weight:600;color:var(--card-title)}

/* Link to the Cytiva file */
.filelink{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:15px;line-height:19px;font-weight:600;padding:10px 16px;border-radius:var(--radius-xs);background:var(--action);color:var(--on-action);text-decoration:none}
.filelink svg{width:15px;height:15px;flex:none}
.panel .filelink{margin-top:auto;font-size:14px;line-height:18px;padding:8px 14px}

/* Inline link inside card text */
.inlink{font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* Tokens */
.toks{display:flex;flex-wrap:wrap;gap:6px}
.toks span{font-family:var(--font-mono);font-size:14px;line-height:20px;padding:3px 8px;border-radius:6px;background:var(--gray-50);border:1px solid var(--line);color:var(--ink)}
.ent{font-family:var(--font-mono);font-size:14px;line-height:20px;padding:3px 8px;border-radius:6px;background:var(--blue-200);color:var(--ink)}

/* List in the exercise */
.todo{margin:0;padding-left:22px;font-size:15.5px;line-height:1.5;color:var(--card-text)}
.todo li+li{margin-top:2px}

/* Card 7 holds the most, so it uses tighter spacing, and the demo button sits beside the "Look closely" line */
.inner.tight{gap:9px}
.card:has(.inner.tight){padding:16px 24px}
.inner.tight .p{line-height:1.45}
.inner.tight .todo{line-height:1.4}
.tryrow{display:flex;align-items:center;gap:16px}
.tryrow .filelink{flex:none}

/* Done message, then Back and Next. Both sit at the bottom of the stage on every card. */
.donemsg{flex:none;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-card);color:var(--card-title);font-size:15px;line-height:1.45;font-weight:600;text-wrap:pretty}
.donemsg:empty{padding:0;border:0}
.foot{flex:none;padding:4px 16px 16px;display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-text);font-size:15px;line-height:19px;font-weight:600;padding:12px 20px;border-radius:var(--radius-xs);border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-secondary:disabled{opacity:.35;cursor:default}
.btn-primary{background:var(--action);color:var(--on-action)}
.upnext{flex:1;min-width:0;text-align:right;font-size:13px;line-height:16px;color:var(--ink-muted);white-space:nowrap}
.upnext b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .inner.anim{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app">
  <h1 class="sr-only">Key Ideas: How AI Reads a Document</h1>
  <header class="top">
    <nav class="rail" id="rail" aria-label="Cards"></nav>
    <div class="where" id="where">Card 1 of 9</div>
  </header>
  <main class="stage" id="stage" aria-label="Slide"><section class="card" id="card" aria-live="polite"></section></main>
  <p class="donemsg" id="donemsg" role="status"></p>
  <footer class="foot">
    <button type="button" class="btn btn-secondary" id="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <div class="upnext" id="upnext"></div>
    <button type="button" class="btn btn-primary" id="next"><span id="next-label">Next</span><svg id="next-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var CYTIVA = "https://drive.google.com/file/d/1oOR50D8F3Deask7aT2HbXQZhw0u1hvcg/view";
  var TEXT_PDF = "https://www.fda.gov/media/71518/download";
  var SCAN_PDF = "https://drive.google.com/file/d/1sNQoYJ9oN6yQOXuCIdI6cRq9HLqnyT0g/view";
  var DEMO = "https://demos.explosion.ai/displacy-ent?text=West%20Pharmaceutical%20Services%20issued%20Compliance%20Bulletin%20Rev.11%20for%20product%204432%2F50%20Grey%2C%20effective%20from%20June%203%2C%202025.&model=en_core_web_sm&ents=person%2Corg%2Cgpe%2Cloc%2Cproduct%2Cnorp%2Cdate%2Ccardinal%2Cwork_of_art";
  var EXT = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M9 3h4v4M13 3 7.5 8.5M11.5 9.5V13h-8.5V4.5H6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var CARDS = [
    { label: "START", short: "3 jobs",
      title: 'What a Chatbot Has to Do Before It <span class="hl">Answers</span>',
      body:
        '<p class="p">Soon you\'ll see a <b>chatbot</b>, a program you ask questions in plain words, answer questions about the Cytiva file. Before it can answer, the computer behind it has 3 jobs to do, one after the other. Each job needs a new idea or two, and these cards take them in order.</p>' +
        '<ol class="jobs">' +
          '<li><span class="n">JOB 1</span><div><h3>Get the Text</h3><p>Pull the words out of the PDF. The ideas: text and scanned PDFs, and OCR.</p></div></li>' +
          '<li><span class="n">JOB 2</span><div><h3>Find the Answer</h3><p>Understand what the words mean, so it can find the answer. The idea: NLP.</p></div></li>' +
          '<li><span class="n">JOB 3</span><div><h3>Reply</h3><p>Write the answer in plain words. The idea: an LLM, the AI inside a chatbot.</p></div></li>' +
        '</ol>' },

    { label: "JOB 1 · GET THE TEXT", short: "PDFs",
      title: 'Two Kinds of <span class="hl">PDF</span>: Text and Scanned',
      body:
        '<p class="p">The first job is to get the words out of the file. Supplier files usually come as <b>PDFs</b>, files that look like printed pages. PDFs generally come in two kinds, but they\'ll look exactly the same to you: a <b>text PDF</b> and a <b>scanned PDF</b>. Open both examples below and click and drag across a word in each.</p>' +
        '<div class="pair">' +
          '<div class="panel"><h3>A Text PDF</h3><div class="sample sel"><span>Lot Number: 17242818</span></div><p>It was made on a computer, so the words are stored as real text. You can <b>click and drag to select a word, then copy it</b>. A computer program can read the words straight away.</p>' +
            '<a class="filelink" href="' + TEXT_PDF + '" target="_blank" rel="noopener">Open a Text PDF (FDA Guide)' + EXT + '<span class="sr-only"> (opens in a new tab)</span></a></div>' +
          '<div class="panel"><h3>A Scanned PDF</h3><div class="sample">Lot Number: 17242818</div><p>It\'s a photo of a paper page, taken with a scanner or a phone. The words are only part of the picture. When you try to select a word, nothing highlights, or the whole page highlights as one picture.</p>' +
            '<a class="filelink" href="' + SCAN_PDF + '" target="_blank" rel="noopener">Open a Scanned PDF (West File)' + EXT + '<span class="sr-only"> (opens in a new tab)</span></a></div>' +
        '</div>' +
        '<p class="p">A computer can read a text PDF right away. A scanned PDF needs one more tool first. That tool is on the next card.</p>' },

    { label: "JOB 1 · GET THE TEXT", short: "OCR",
      title: 'How Computers Read a Scanned <span class="hl">Page</span>',
      body:
        '<p class="p">To a computer, a scanned page is only a picture made of colored dots, not words. <b>OCR (optical character recognition)</b> lets computers read and pull out text from pictures, scanned documents and even handwritten notes. It turns those dots into letters and numbers the computer can use.</p>' +
        '<div class="pair">' +
          '<div class="panel"><span class="tag">Reads well</span><h3>Printed Text</h3><div class="sample">Certificate of Quality</div><p>Neat, typed letters look the same every time, so OCR gets them right most of the time.</p></div>' +
          '<div class="panel"><span class="tag">Reads less reliably</span><h3>Handwriting</h3>' +
            '<svg viewBox="0 0 240 60" role="img" aria-label="A handwritten signature, drawn as a loopy line"><path d="M10 42c10-24 18-30 22-22s-8 26-2 24 14-30 22-28-6 24 2 24 12-18 20-18 2 16 10 14 10-14 18-14 4 12 12 10 14-20 22-20-8 22 0 22 18-12 26-12 6 8 14 6 20-8 28-10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '<p>Every person writes differently, so OCR often guesses the wrong letters.</p></div>' +
        '</div>' +
        '<p class="key"><span>REMEMBER</span>OCR reads printed text well and handwriting less reliably.</p>' },

    { label: "JOB 1 · THE TEST", short: "Which PDF?",
      title: 'Which Kind of PDF Is the Cytiva <span class="hl">File</span>?',
      body:
        '<p class="p">Now let\'s check the PDF you\'ll work with: the Cytiva supplier file, the one Gemini reads in the video. It\'s also the optional practice file in the Task. <b>Here\'s the test:</b> open the PDF and click and drag across a word. If the word highlights and you can copy it, it\'s a text PDF. If not, it\'s scanned.</p>' +
        '<a class="filelink" href="' + CYTIVA + '" target="_blank" rel="noopener">Open the Cytiva File' + EXT + '<span class="sr-only"> (opens in a new tab)</span></a>' +
        '<p class="p">This test isn\'t perfect. Some scanned PDFs have already been run through OCR, so you can highlight their words too, even though the page underneath is still a picture.</p>' +
        '<div class="guess" data-guess="pdf">' +
          '<p class="guess-q">Your guess: which kind is the Cytiva file?</p>' +
          '<div class="opts"><button type="button" class="opt" data-opt="text" aria-pressed="false">Text PDF</button><button type="button" class="opt" data-opt="scan" aria-pressed="false">Scanned PDF</button></div>' +
          '<p class="reveal" data-reveal hidden></p>' +
        '</div>',
      reveal: {
        text: '<b>You guessed right. It\'s a text PDF.</b> Click and drag across a word in the file, and it highlights. So a computer can pull its words out with no OCR.',
        scan: '<b>Good guess, but it\'s a text PDF.</b> Open the file and click and drag across a word: it highlights. So a computer can pull its words out with no OCR.'
      } },

    { label: "JOB 2 · FIND THE ANSWER", short: "NLP",
      title: 'How Computers Understand <span class="hl">Language</span>',
      body:
        '<p class="bridge">Once the computer has the text, it has to find the answer. To do that, it first has to understand what the words mean. That\'s NLP.</p>' +
        '<p class="p"><b>NLP</b> stands for <b>natural language processing</b>. Natural language means the everyday words people write and speak. NLP is like teaching a computer to understand our words, just like we do.</p>' +
        '<p class="p">Human language is messy. We speak in different ways, use slang, and even make mistakes. But computers like things <b>structured</b>, which means sorted into neat, labeled boxes. NLP acts like a translator between the two:</p>' +
        '<div class="tbl wrap" role="region" aria-label="Messy words and neat data"><table>' +
          '<thead><tr><th scope="col">Messy: the way we write</th><th scope="col">Neat: how a computer stores it</th></tr></thead>' +
          '<tbody>' +
            '<tr><td>Hey, add milk to my shopping list!</td><td>Shopping List: [Milk]</td></tr>' +
            '<tr><td>Lot Number: 18356721 Date of Manufacture: 20240315</td><td>Lot number: 18356721<br>Date made: 15 March 2024</td></tr>' +
          '</tbody></table></div>' +
        '<p class="p">Without NLP, 20240315 is just 8 digits in a row. With NLP, a computer can learn to spot that it\'s a date.</p>' },

    { label: "JOB 2 · FIND THE ANSWER", short: "How NLP works",
      title: 'How NLP Breaks a Line Into <span class="hl">Pieces</span>',
      body:
        '<p class="p">NLP uses smart techniques to break down language into pieces computers can understand. Here are 2 of them. The example is real output from <b>spaCy</b>. spaCy is a free tool that programmers use to do NLP. You give it text, and it splits the text into pieces and labels them.</p>' +
        '<div class="panel"><h3>1. Tokenization: Splitting Text Into Pieces</h3><p>The pieces are called <b>tokens</b>, and they\'re usually words. Here are 2 lines from page 3 of the Cytiva file, typed on one line and split into 9 tokens:</p>' +
          '<div class="toks" aria-label="9 tokens"><span>Lot</span><span>Number</span><span>:</span><span>18356721</span><span>Date</span><span>of</span><span>Manufacture</span><span>:</span><span>20240315</span></div></div>' +
        '<div class="panel"><h3>2. Named Entity Recognition (NER): Labeling the Important Pieces</h3><p>An <b>entity</b> is an important thing in the text, like a name, a place or a date. NER finds each one and gives it a label.</p></div>' },

    { label: "TRY IT YOURSELF", short: "Try NLP", cls: "tight",
      title: 'Try It Yourself: See How NLP <span class="hl">Works</span>',
      body:
        '<p class="p">Let\'s explore how <b>Natural Language Processing (NLP)</b> helps extract important details from text.</p>' +
        '<p class="p">Take this sentence from a pharmaceutical compliance document:</p>' +
        '<div class="sample">"West Pharmaceutical Services issued Compliance Bulletin Rev.11 for product 4432/50 Grey, effective from June 3, 2025."</div>' +
        '<p class="p">Using <b>Named Entity Recognition (NER)</b>, an NLP model can extract:</p>' +
        '<ul class="todo"><li><b>Organization:</b> West Pharmaceutical Services</li><li><b>Effective Date:</b> June 3, 2025</li></ul>' +
        '<p class="p"><b>Your Turn:</b></p>' +
        '<p class="p">Try this out yourself! Use <a class="inlink" href="' + DEMO + '" target="_blank" rel="noopener">spaCy\'s NER Demo<span class="sr-only"> (opens in a new tab)</span></a> to paste a snippet of text and see what entities the AI extracts.</p>' +
        '<ol class="todo"><li>Click <b>Open spaCy\'s NER Demo</b>. It opens in a new tab with the West sentence already in the box.</li><li>Look at the colored highlights. Each one is an entity spaCy found.</li><li>Now delete the text in the box, paste any line from the Cytiva file, and click the magnifying glass.</li></ol>' +
        '<div class="tryrow"><a class="filelink" href="' + DEMO + '" target="_blank" rel="noopener">Open spaCy\'s NER Demo' + EXT + '<span class="sr-only"> (opens in a new tab)</span></a>' +
        '<p class="p"><b>Look closely:</b> spaCy labels 4432/50 Grey as a PERSON, but it\'s a product. AI tools make mistakes like this.</p></div>' },

    { label: "JOB 3 · REPLY", short: "LLMs",
      title: 'Chatbots Like Gemini Run on an <span class="hl">LLM</span>',
      body:
        '<p class="bridge">Once the computer has found the answer, there\'s one job left: replying to you in plain words. That\'s what a chatbot does.</p>' +
        '<p class="p"><b>Gemini</b>, made by Google, is a chatbot. Chatbots use NLP to understand what you type, and then they reply.</p>' +
        '<p class="p">Most chatbots today run on an <b>LLM (large language model)</b>. It\'s a powerful kind of AI. An LLM has learned from a huge amount of text, such as books, articles and websites, so it can write sentences that sound like a person wrote them.</p>' +
        '<p class="p">The chatbot you\'ll build does one more thing: it answers from a document you give it, like the Cytiva file.</p>' },

    { label: "ALWAYS", short: "Fact-check",
      title: 'Always <span class="hl">Fact-Check</span> What AI Tells You',
      body:
        '<p class="p">You just saw spaCy call a product a person. Chatbots slip too. AI can sound sure of itself and still be wrong. It doesn\'t know when it has made a mistake, so checking is your job.</p>' +
        '<p class="key"><span>REMEMBER</span>Always fact-check and verify what an AI tool tells you. Its answers are not always accurate or reliable.</p>' +
        '<p class="p">The fix is simple: go back to the document and check the answer yourself. You\'ll see exactly that with Gemini in the video next.</p>' }
  ];
  var END_LABEL = "Done. Now watch the video";
  var END_TARGET = "watch";

  var i = 0, picks = {};
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), rail = $("rail"), card = $("card"), back = $("back"), next = $("next");
  var nextLabel = $("next-label"), nextIcon = $("next-icon"), upnext = $("upnext"), where = $("where");
  var donemsg = $("donemsg");
  var DONE_MSG = "You're done with the cards. Scroll down to the next part of this reading.";
  var embedded = window.parent && window.parent !== window;

  /* Fixed stage: 760 x STAGE_H px, scaled uniformly to fit the frame and centred. Nothing scrolls. */
  var STAGE_W = 760, STAGE_H = 740;
  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.min(w / STAGE_W, h / STAGE_H);
    app.style.transform = "translate(" + ((w - STAGE_W * s) / 2) + "px," + ((h - STAGE_H * s) / 2) + "px) scale(" + s + ")";
  }

  CARDS.forEach(function (c, n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "seg";
    b.setAttribute("aria-label", "Card " + (n + 1) + ": " + c.short);
    b.innerHTML = "<i></i>";
    b.addEventListener("click", function () { go(n); });
    rail.appendChild(b);
  });

  function render(anim) {
    var c = CARDS[i];
    card.innerHTML = '<div class="inner' + (c.cls ? ' ' + c.cls : '') + (anim ? ' anim' : '') + '"><p class="label">' + c.label + '</p><h2 class="title">' + c.title + '</h2>' + c.body + '</div>';
    var g = card.querySelector("[data-guess]");
    if (g) {
      var rev = g.querySelector("[data-reveal]");
      var show = function (k) {
        picks[i] = k;
        Array.prototype.forEach.call(g.querySelectorAll(".opt"), function (o) { o.setAttribute("aria-pressed", o.getAttribute("data-opt") === k ? "true" : "false"); });
        rev.innerHTML = c.reveal[k]; rev.hidden = false;
      };
      Array.prototype.forEach.call(g.querySelectorAll(".opt"), function (o) {
        o.addEventListener("click", function () { show(o.getAttribute("data-opt")); });
      });
      if (picks[i]) show(picks[i]);
    }
    Array.prototype.forEach.call(rail.children, function (b, n) {
      b.classList.toggle("cur", n === i);
      b.classList.toggle("done", n < i);
      if (n === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    where.innerHTML = "<b>" + c.short + "</b> · Card " + (i + 1) + " of " + CARDS.length;
    back.disabled = i === 0;
    var last = i === CARDS.length - 1;
    next.classList.toggle("end", last);
    nextIcon.style.display = last ? "none" : "";
    nextLabel.textContent = last ? END_LABEL : "Next";
    upnext.innerHTML = last ? "" : "Next: <b>" + CARDS[i + 1].short + "</b>";
    donemsg.textContent = "";
  }

  function go(n) { if (n === i || n < 0 || n >= CARDS.length) return; i = n; render(true); }
  back.addEventListener("click", function () { go(i - 1); });
  next.addEventListener("click", function () {
    if (i < CARDS.length - 1) { go(i + 1); return; }
    /* The message shows in the deck. The postMessage is only for a page that listens for it. */
    donemsg.textContent = DONE_MSG;
    tellParent({ type: "extern-deck-done", target: END_TARGET });
  });
  document.addEventListener("keydown", function (e) {
    var t = e.target && e.target.tagName;
    if (e.altKey || e.ctrlKey || e.metaKey || t === "INPUT" || t === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); go(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(i - 1); }
  });

  function tellParent(msg) { if (embedded) window.parent.postMessage(msg, "*"); }
  window.addEventListener("resize", fit);
  fit();
  render(false);
})();
</script>
</body>
</html>
