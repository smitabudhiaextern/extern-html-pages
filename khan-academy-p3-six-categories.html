<!--
  Khan Academy, Project 3, Step 1. The six partner categories.

  WHAT THIS DECK IS. Six categories of organization a partner could come from,
  five slides each, then a close. 31 slides. Each category runs:
    1  define   what this category is, in the owner's own explaining style
    2  shape    what kind of deal could happen here, reasoned from how the
                category makes its money
    3  deal     a real Khan Academy deal that already exists in the category,
                described WITHOUT saying which way value moved
    4  ask      the question, four options, commits before it will advance
    5  reveal   the answer, with a whole slide to explain itself

  THE SLIDES PER CATEGORY EXIST BECAUSE OF AN OWNER INSTRUCTION, 8 September
  2026. An earlier plan stacked the definition, the deal shape and the real
  deal onto one slide. Her words: "feels like you are rushing without exlaining
  properly". So each idea got its own slide and its own room. The ask then
  split again into a question slide and an answer slide, because the combined
  one overflowed 960x540 on four of the six categories and scrolled its answer
  panel on all six: scripts/measure-fit.mjs caught it, and its instruction is
  to split rather than shrink. DO NOT recompress any of this to save length.
  Slide count is not a constraint in this program; a rushed explanation is a
  defect.

  ONE GROUND PER CATEGORY, owner instruction, same date: "for each new category
  change the background colour". All four slides of a category share that
  category's ground, and the ground changes when the category changes. This
  REPLACES the no-two-neighbours-alike rule the five-directions deck used, so
  the validator below checks the category boundaries instead of every pair.
  Order: paper, deep, wash, slate, paper, ink, then wash for the close. No two
  adjacent categories share a ground.

  THE ANSWER MUST NOT LEAK BACKWARDS. Slide 3 names the real deal and explains
  what it does, and it never says who paid whom or whether anyone did. Neither
  does the restatement above the buttons on slide 4. That is the single most
  breakable thing in this build: a writer tidying slide 3 will reach for
  "Microsoft covers the cost" style phrasing and destroy the question. The
  validator cannot catch it. Read slides 3, 4 and 5 of a category together
  before shipping any edit to any of them.
    THREE LEAKS WERE FOUND AND FIXED THIS WAY, 8 September 2026, two before
    first build and one by content QA after it. In order: the employers slide 3
    stated the absence outright, which is the answer; the money slide 3 used
    the word "sponsor" one slide after sponsorship had been defined as paying;
    and the media slide 3 described the course as taught "through how Pixar
    actually makes its films", which is Pixar's IP in the course, said in
    different words, one slide after IP had been defined. All three now hold
    that material for the answer slide. A fourth near-miss: the employers slide
    3 replacement sentence told the student to look for what a page leaves out,
    and exactly one of four fixed options is about something missing, so it was
    cut rather than reworded.

  THE FOUR BUTTONS ARE IDENTICAL ON ALL SIX ASK SLIDES and their order never
  changes, so a student cannot learn a position instead of an answer. The
  correct answers are spread deliberately: nothing moved, money, nobody
  published, already owned, already owned, money. All four buttons are used.

  FACTUAL LOCKS, all binding. Every real deal in this deck is a row that
  already ships in khan-academy-p3-starter-pool.html, verified there, so this
  build introduces NO new factual claim to the program. Do not add a figure,
  a date or a deal that is not already in that file.
    - AAMC: the verb is CREATION-SCOPED. "paid for the free official practice
      collection to be built". Never "funds and maintains", never "no published
      end date", never a bare "until 2026". Style guide section 8.
    - Microsoft: never the word "credits".
    - College Board appears ONLY as a famous name on the exams slide, with no
      claim attached. Money direction in the College Board relationship is on
      the never-publish list, so it can never be an ask slide.
    - The learning-management system named on the never-publish list is not in
      this file, comments included.
    - THE FAMOUS NAMES CARRY NO CLAIM. They make a category concrete and
      nothing more. Do not attach a program, a figure or a Khan Academy
      relationship to any of them.

  THREE OWNER CHANGES LANDED AFTER THE FIRST QA PASS, 8 September 2026, each
  recorded on the record it touches as well as here:
    1. EVERY CATEGORY'S FIRST SLIDE OPENS WITH ITS NUMBER, the .eyebrow element
       reading "CATEGORY 1" through "CATEGORY 6". Define slides only: the other
       25 hide it, because the progress row already carries the number and
       repeating it five times a category is noise.
    2. THE EDUCATION TECHNOLOGY ANSWER WAS REWRITTEN to argue that a no-money
       arrangement is NOT a find. See the note on that record. Its old close
       must not come back.
    3. THE CLOSE LOST ITS QUESTION AND ITS DEFERRAL LINE. See the note on the
       CLOSE record. The validator no longer requires a closing question, and
       neither line may be reinstated.
    CONSEQUENCE OF 3, STILL OPEN AND NOT THIS FILE'S TO FIX: the removed line
    was the only place the student was ever asked to pick two categories, and
    substep 3.1.2's What's Next still reads "search inside the two you picked".
    That reference now has no antecedent anywhere on the student path. Flagged
    to the owner. Do not solve it by putting the question back in the deck.

  ALL SIX REAL DEALS ARE SEATS KHAN ACADEMY ALREADY HOLDS, which is why naming
  them cannot hand a student a candidate. The lesson is the opposite: there is
  already a deal in every one of these six, so the job is finding a name inside
  a category rather than inventing a category.
    KNOWN COST, flagged to the owner 8 September 2026: the substep that carries
    the starter pool opens by asking the student to guess how many of its 27
    organizations are already Khan Academy partners. After this deck they know
    six of them are. The owner's call, still open.

  NO ANIMATION. Grounds crossfade as a transition, not an animation, so a
  throttled Notion embed cannot strand one part way. Reduced motion is honoured.
-->
<style>
  /* ===============================================================
     THE EXTERN FIVE, AND NOTHING ELSE.
       paper #FDF8F8   deep #001D69   wash #DCE1FF
       slate #484646   ink  #1C1B1B
     A theme decides which of the five plays ground, which plays ink and
     which plays the panel. No theme invents a sixth value.
     =============================================================== */
  :root{
    --panel-mark:#001D69;
    --panel-strong:#1C1B1B;
    --t-fast:160ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    --ease-io:cubic-bezier(.4,0,.2,1);
  }
  body{
    --ground:#FDF8F8; --ink:#1C1B1B; --ink2:#484646;
    --panel:#DCE1FF; --panel-ink:#484646;
    /* .6 not .26: at .26 the option border measured 1.73:1 on this ground
       against WCAG's 3:1 non-text minimum, and that border is the only thing
       identifying the four options as buttons. Technical QA, 8 Sept 2026. */
    --mark:#001D69; --line:rgba(0,29,105,.6);
  }
  body[data-t="deep"]{
    --ground:#001D69; --ink:#FDF8F8; --ink2:#DCE1FF;
    --panel:#DCE1FF; --panel-ink:#484646;
    --mark:#DCE1FF; --line:#DCE1FF;
  }
  body[data-t="wash"]{
    --ground:#DCE1FF; --ink:#1C1B1B; --ink2:#484646;
    --panel:#FDF8F8; --panel-ink:#484646;
    /* .6 not .26, same reason as paper: 1.69:1 measured on this ground. */
    --mark:#001D69; --line:rgba(0,29,105,.6);
  }
  body[data-t="slate"]{
    --ground:#484646; --ink:#FDF8F8; --ink2:#DCE1FF;
    --panel:#DCE1FF; --panel-ink:#484646;
    --mark:#DCE1FF; --line:#DCE1FF;
  }
  body[data-t="ink"]{
    --ground:#1C1B1B; --ink:#FDF8F8; --ink2:#DCE1FF;
    --panel:#DCE1FF; --panel-ink:#484646;
    --mark:#DCE1FF; --line:#DCE1FF;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  [hidden]{display:none!important}
  html{background:#FDF8F8}
  body{
    background:var(--ground);
    /* NO TRANSITION ON THE GROUND. An earlier 300ms crossfade left the text at
       1.15:1 against a half-changed background for the first ~130ms of every
       category boundary, and held there under CPU throttling, because the
       custom properties carrying the text colour swap in a single frame and
       cannot be interpolated. Measured by technical QA, 8 September 2026.
       Ground and type now change together. DO NOT reintroduce a background
       transition without transitioning every text colour in lockstep, and
       re-measuring the midpoint, which is itself a low contrast state. */
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink2);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  #stage{width:960px;height:540px;position:relative;transform-origin:center center;flex:0 0 auto}
  .frame{position:absolute;inset:0;padding:14px 40px 10px;display:flex;flex-direction:column}
  .frame:focus{outline:none}

  /* ---- header ---- */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:11px;margin-bottom:4px}
  .prog{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--mark);white-space:nowrap}
  .segs{display:flex;gap:2px}
  .segs i{display:block;width:9px;height:4px;border-radius:2px;background:var(--mark);opacity:.28;
    transition:opacity var(--t-fast) var(--ease-out),height var(--t-fast) var(--ease-out)}
  .segs i.on{opacity:1}
  .segs i.here{opacity:1;height:6px;margin-top:-1px}
  /* A category's four segments are grouped, so the progress row shows the
     shape of the deck: six groups of four and a close. */
  /* THE GROUPING IS A MARGIN, NEVER AN ELEMENT. scripts/measure-fit.mjs counts
     every child of #segs to get a second opinion on the slide count, so a
     spacer element of any tag makes a 31 slide deck report 37 and fails the
     gate. One tick per slide, and the first tick of a category carries the gap. */
  .segs i.grp{margin-left:7px}

  .stack{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center}
  h1,.board,.eyebrow{width:100%;max-width:620px;margin-left:auto;margin-right:auto}
  h1{font-size:21px;line-height:1.22;font-weight:600;color:var(--ink);flex:0 0 auto;margin-bottom:11px}
  /* The landing target after every slide change. Navigation used to focus
     #frame, which is tabindex="-1" with outline:none, so a student arrowing
     through the deck had no indication of where focus had gone. The heading is
     a better target: a screen reader reads it, and it shows a ring when the
     move came from the keyboard, which is the case where that matters. */
  h1:focus{outline:none}
  h1:focus-visible{outline:3px solid var(--mark);outline-offset:5px}
  .frame.wide h1,.frame.wide .board{max-width:720px}
  /* The category name on a define slide is the one all-caps line in the deck.
     It labels the category rather than making a statement, so it is set as a
     label and not as a sentence. It is larger than the eyebrow above it so the
     two read as a hierarchy rather than as two competing labels. */
  h1.cat{font-size:20px;letter-spacing:.07em;color:var(--mark);margin-bottom:14px}
  /* "CATEGORY 1", on the first slide of each category only. Owner
     instruction, 8 September 2026. */
  .eyebrow{flex:0 0 auto;font-size:12.5px;font-weight:700;letter-spacing:.1em;
    color:var(--ink2);margin-bottom:6px}

  .board{flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
  .intro{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
  .intro p{font-size:18.5px;line-height:1.56;color:var(--ink2)}
  .intro p b{color:var(--ink);font-weight:600}

  /* ---- the famous-names line on a define slide. Set apart from the body
         because it is a list of examples and not part of the argument. ---- */
  .names{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
    font-size:17px;line-height:1.5;color:var(--ink2);flex:0 0 auto}
  .names b{color:var(--ink);font-weight:600}

  /* ---- the source line on a deal slide ---- */
  .cap{margin-top:13px;font-size:13.5px;line-height:1.45;color:var(--ink2);flex:0 0 auto;opacity:.92}
  .cap a{color:var(--mark);text-decoration:underline;text-underline-offset:2px}
  .cap a:focus-visible{outline:2px solid var(--mark);outline-offset:2px}

  /* ---- the ask slide ---- */
  .restate{font-size:15.5px;line-height:1.5;color:var(--ink2);margin-bottom:13px;flex:0 0 auto;
    padding-left:12px;border-left:3px solid var(--line)}
  .opts{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
  button.opt{font-family:inherit;font-size:16px;line-height:1.35;text-align:left;
    padding:11px 14px;border-radius:8px;cursor:pointer;
    border:1.5px solid var(--line);background:transparent;color:var(--ink);
    display:flex;align-items:center;gap:11px;
    transition:border-color var(--t-fast) var(--ease-out),background var(--t-fast) var(--ease-out)}
  button.opt:hover:not(:disabled){border-color:var(--mark)}
  button.opt:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
  button.opt:disabled{cursor:default}
  /* After the commit. The mark is a word as well as a colour, because colour
     alone is not an accessible signal and this palette has no red or green in
     it to reach for anyway. */
  button.opt .tag{flex:0 0 auto;font-size:11.5px;font-weight:700;letter-spacing:.05em;
    padding:3px 7px;border-radius:4px;margin-left:auto;white-space:nowrap}
  button.opt.right{border-color:var(--mark);border-width:2.5px}
  button.opt.right .tag{background:var(--mark);color:var(--ground)}
  button.opt.chosen.wrong{border-color:var(--line);border-width:2.5px}
  button.opt.chosen.wrong .tag{border:1.5px solid var(--line);color:var(--ink2)}
  /* .62 not .45. Dimmed options are exempt from the text minimum as disabled
     controls, but they are three lines of real copy a student may want to read
     back against the answer, and .45 measured 2.72:1 on wash. .62 got wash to
     only 4.39, so .66. Re-measure on wash, the tightest ground, if you touch
     this. The border of a dimmed option stays below the 3:1 non-text minimum
     on the two light grounds and that is accepted: the option is disabled and
     out of play at that point, so its border is no longer identifying a
     control the student can use. */
  button.opt.dim{opacity:.66}

  /* ---- the answer slide's verdict strip. It reports what the student
         committed to, one slide back. The signal is a word as well as a
         treatment, because colour alone is not accessible and this palette
         carries no red or green to reach for anyway. ---- */
  .verdict{flex:0 0 auto;margin-bottom:14px;padding:9px 13px;border-radius:8px;
    background:var(--panel);color:var(--panel-ink);font-size:15px;line-height:1.4;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .verdict .vl{font-size:11.5px;font-weight:700;letter-spacing:.07em;color:var(--panel-mark);
    flex:0 0 auto}
  .verdict.good{box-shadow:inset 0 0 0 2.5px var(--panel-mark)}

  /* ---- the close ---- */
  .recap{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .recap li{display:flex;gap:13px;align-items:baseline;font-size:17px;line-height:1.4;color:var(--ink)}
  .recap .n{flex:0 0 auto;width:25px;font-size:14px;font-weight:600;color:var(--mark);
    font-variant-numeric:tabular-nums}
  .leadout{font-size:16px;line-height:1.55;color:var(--ink2);margin-bottom:16px}

  /* ---- the bar ---- */
  .bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:48px;padding-top:8px}
  button.nav{font-family:inherit;font-size:14px;font-weight:600;padding:10px 17px;border-radius:8px;
    cursor:pointer;flex:0 0 auto;border:2px solid var(--mark);display:flex;align-items:center;gap:7px;
    background:transparent;color:var(--mark);transition:opacity var(--t-fast) var(--ease-out)}
  button.nav svg{width:14px;height:14px;flex:0 0 auto;display:block}
  button.nav.ghost{border-width:1.5px;color:var(--ink2);border-color:var(--line)}
  button.nav:disabled{opacity:.42;cursor:not-allowed}
  button.nav:focus-visible{outline:3px solid var(--mark);outline-offset:3px}
  /* The one gate in this deck. An ask slide will not advance until the student
     has committed, and the button says why rather than sitting dead. */
  .hint{font-size:13px;line-height:1.4;color:var(--ink2);opacity:.9}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:599px){
    body{display:block;align-items:initial;justify-content:initial;overflow-x:hidden}
    #stage{width:100%!important;max-width:100%!important;min-width:0!important;

    .frame{position:relative;inset:auto;padding:18px 16px 30px;min-height:100vh}
    .top{flex-wrap:wrap;gap:8px}
    .prog{font-size:14px;white-space:normal}
    .segs{display:none}
    h1{font-size:22px}
    h1.cat{font-size:19px}
    .eyebrow{font-size:14px}
    h1,.board,.eyebrow{max-width:none}
    .intro{overflow:visible}
    .intro p{font-size:16.5px;line-height:1.55}
    .names{font-size:16.5px}
    .restate{font-size:16px}
    button.opt{font-size:16.5px;padding:13px 15px}
    /* The chip and the verdict label carry the correct/incorrect signal in
       words, so they are content, not decoration, and they take the same 16px
       floor as the prose. They were 12px and 11.5px here until technical QA
       measured them, 8 September 2026. */
    button.opt .tag{font-size:14px}
    .verdict{font-size:16px}
    .verdict .vl{font-size:14px}
    /* The hint is the only thing explaining why Continue will not move. */
    .hint{font-size:15px}
    .cap{font-size:14px}
    .stack{justify-content:flex-start}
    .recap li{font-size:17px}
    .leadout{font-size:16.5px}
    .bar{margin-top:18px;flex-wrap:wrap;min-height:0}
    button.nav{font-size:16px;padding:13px 20px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

  <div class="nsf" id="nsf">
    <h2>Six kinds of partner</h2>
    <p>Kian's six categories. For each one: what it is, what kind of deal could happen there,
       a real Khan Academy deal that already exists in it, and which way the value moved.
       In the interactive version you answer that last one yourself before you are told.</p>
    <!-- EVERYTHING BETWEEN THE MARKERS BELOW IS GENERATED, never hand edited.
         It comes out of the CATS and CLOSE records in the script above, so the
         fallback cannot drift from the deck. After ANY copy change, regenerate
         it rather than editing here. -->
    <!-- NSF:START -->
      <h3>1 of 6 &middot; EDUCATION TECHNOLOGY</h3>
      <p>Ever used an app to learn a language, or watched a YouTube video to understand a tricky concept? That's education technology: using digital tools like apps, websites, and software to help people learn better. It makes education more flexible, accessible, and tailored to how you personally learn best.</p>
      <p class="s">You have probably used one of these: <b>Duolingo</b>, <b>Quizlet</b>, <b>Kahoot</b>.</p>
      <h4>So what kind of deal could Khan Academy do here?</h4>
      <p>Start with how these companies make their money. Most of them sell software. A school pays a <b>subscription</b>, meaning a fee every year for as long as it keeps using the software, or a family pays for the version without ads.</p>
      <p>That one fact tells you what they have, and what they do not have. They do not usually keep a big pot of money set aside to give away.</p>
      <p>What they do have is the software itself, and the students already using it.</p>
      <p>So the shape you would expect here is <b>in-kind</b>, one of the four kinds of deal from Project 1: a partner hands over something it already owns instead of writing a check. In this category, the thing it already owns is software.</p>
      <h4>And one already exists: Clever</h4>
      <p>When a school starts using Khan Academy, somebody has to tell Khan Academy which students sit in which class. For one teacher that is a few minutes of typing. For a whole <b>district</b>, meaning all the schools in one area run together, it is weeks of it.</p>
      <p>Clever does that job automatically. It copies the school's class lists straight across, so every class is already set up when the teacher logs in.</p>
      <p>Khan Academy Districts is the version a district signs up for across all its schools. It needs Clever, or a tool that does the same job, to work at all.</p>
      <p class="s">Source: <a href="https://clever.com/">Clever, company home page</a></p>
      <div class="a">
        <p><b>So which way did the value move?</b> Clever copies school class lists into Khan Academy, and Khan Academy Districts needs it.</p>
        <p><b>Nothing moved either way.</b></p>
        <p class="s"></p>
        <p>No money moves in either direction. Clever plugs in, Khan Academy Districts requires it to work, and no one pays anyone.</p>
      <p>Which is exactly why this one is not what you are hunting for. A partnership trades something, and that trade is a <b>value exchange</b>: each side hands over something it can name, and each side walks away with something it can name.</p>
      <p>Here there is nothing to point at. Nothing is given and nothing is got, so there is nothing to go and pitch.</p>
      <p>It is a real relationship. It is not a deal. Knowing the difference is what stops you spending a week on the wrong one.</p>
      </div>
      <hr>
      <h3>2 of 6 &middot; EXAMS AND QUALIFICATIONS</h3>
      <p>Ever taken a test that decided something for you, like which class you ended up in? Somebody owns that test. This category is organizations that own a test or a certificate and get to decide who passes. They write the questions, they set the passing score, and they hand out the certificate at the end. When a school or an employer trusts one of those certificates, it can open a door for you.</p>
      <p class="s">You have probably run into one of these: <b>College Board</b>, <b>Pearson</b>.</p>
      <h4>So what kind of deal could Khan Academy do here?</h4>
      <p>Start with where the money comes from. People pay to take the test, and every entry fee is money coming in.</p>
      <p>Now think about what makes a test worth paying for. It is only worth taking if schools and employers trust it. And it only counts for something if a lot of people take it. So getting more people ready is in the test owner's own interest, not just in yours.</p>
      <p>That points at <b>licensing</b>, another of the four kinds from Project 1: a partner pays to keep a piece of content built and current, year after year. Practice material is exactly the sort of content a test owner would want kept current.</p>
      <h4>And one already exists: AAMC</h4>
      <p>Almost everyone applying to medical school in the United States has to take an exam called the MCAT. It is long, it is hard, and the whole point of it is that not everyone passes. So anyone taking it wants practice, and a lot of it.</p>
      <p>AAMC is the organization that owns the MCAT. It writes the exam and decides what is on it.</p>
      <p>And on Khan Academy there is a free <b>official</b> MCAT practice collection, official meaning the exam's own owner stands behind it: 1,100 videos and 3,000 review questions, open to anyone, with nothing to pay at the door.</p>
      <p class="s">Source: <a href="https://www.khanacademy.org/test-prep/mcat">Khan Academy MCAT collection</a></p>
      <div class="a">
        <p><b>So which way did the value move?</b> A free official MCAT practice collection sits on Khan Academy, 1,100 videos and 3,000 review questions, and AAMC owns the exam it prepares you for.</p>
        <p><b>The partner gave money.</b></p>
        <p class="s"></p>
        <p>The exam's owner paid for the free official practice collection to be built. That is licensing, the first of the four kinds.</p>
      <p>Worth sitting with for a second: a test owner paid to help people pass its own test. A test is only worth anything while people trust it and keep turning up to sit it.</p>
      </div>
      <hr>
      <h3>3 of 6 &middot; EMPLOYERS AND JOBS</h3>
      <p>Somebody built the plane you would fly in, and the car parked outside. Not one person: thousands of them, and every single one had to learn the job somewhere. This category is the large employers, the companies that hire lots of people and want them coming out of school already able to do the work. They are not in the education business at all. But what a new hire can do on day one is very much their problem.</p>
      <p class="s">Two names in this category: <b>Boeing</b>, <b>Ford</b>.</p>
      <h4>So what kind of deal could Khan Academy do here?</h4>
      <p>These companies do not make their money from teaching. They make it building and selling something else entirely, and to do that they need people who already have the skills.</p>
      <p>Here is the part worth noticing. A shortage of skilled people is their problem years before it is anyone else's. If nobody is learning the work now, they are the ones short-staffed later.</p>
      <p>So the shape you would expect here is <b>sponsorship</b>, a third of the four kinds: a partner funds a course and gets its name on it. They pay for the teaching, and their name sits on top of it.</p>
      <h4>And one already exists: Salesforce Foundation</h4>
      <p>Khan Academy keeps a public page naming the organizations that support its work. The Salesforce Foundation is on it.</p>
      <p>That page is a list of names, and a name on it tells you a relationship exists: somebody inside that organization once said yes to Khan Academy. That is already more than you know about most organizations.</p>
      <p class="s">Source: <a href="https://www.khanacademy.org/about/our-supporters">Khan Academy supporters</a></p>
      <div class="a">
        <p><b>So which way did the value move?</b> The Salesforce Foundation is named on Khan Academy's public supporters page.</p>
        <p><b>Nobody published which.</b></p>
        <p class="s"></p>
        <p>The foundation is named as a supporter with no amount and no course attached, so nothing public says what moved.</p>
      <p>Sponsorship is still the shape you would expect here, so if that is what you picked, your reasoning was not the problem. Expecting a shape and finding it published are two different jobs, and this is the one where the second job comes up empty.</p>
      <p>Not published is a real finding, and you write it down as one instead of filling the gap with a guess. A thin record is still a lead. It just means the details are not yours yet.</p>
      </div>
      <hr>
      <h3>4 of 6 &middot; AI AND CLOUD COMPUTING</h3>
      <p>Ever saved a photo on your phone and found it waiting for you on a different screen? It was not really living on either one. It sat on somebody else's computer, in a building somewhere, and you were renting a slice of it. That is <b>cloud computing</b>: renting somebody else's computers over the internet instead of owning your own. This category is the companies that rent out that computing power, and build the AI models running on top of it, for everybody else.</p>
      <p class="s">You have probably heard of these: <b>Microsoft</b>, <b>Google</b>, <b>NVIDIA</b>.</p>
      <h4>So what kind of deal could Khan Academy do here?</h4>
      <p>Start with what these companies sell. Computing time and access to AI models, charged by how much of it you use.</p>
      <p>Now think about what that means when one of them wants to help. Everyone else has to buy computing at the price these companies set. These companies do not. They already own the machines, so handing some of that over costs them far less than it would cost anyone else to go and buy it.</p>
      <p>So the shape you would expect here is <b>in-kind</b> again, the one you met in the first category: a partner hands over something it already owns instead of writing a check. In this category, the thing it already owns is computing power.</p>
      <h4>And one already exists: Microsoft</h4>
      <p>Khanmigo for Teachers is an AI assistant built into Khan Academy for teachers. A teacher can ask it for help the way you would ask a chatbot a question, except it sits inside the tool they already use with their class.</p>
      <p>Here is the fact that makes this deal make sense. An AI tool is not like a normal website. Every single time somebody types a question into it, a computer somewhere has to do real work to produce the answer, and that work costs money. The more it gets used, the more it costs to run.</p>
      <p>Running it costs $44 a year for every teacher who uses it, checked September 2026. No teacher is asked for that money, and Microsoft is the partner standing behind it.</p>
      <p class="s">Source: <a href="https://www.khanmigo.ai/teachers">Khanmigo for Teachers</a></p>
      <div class="a">
        <p><b>So which way did the value move?</b> Khanmigo for Teachers is an AI assistant for teachers, running it costs $44 a year for every teacher who uses it, and Microsoft is the partner behind it.</p>
        <p><b>The partner gave something it already owned.</b></p>
        <p class="s"></p>
        <p>Microsoft hands over cloud computing and AI it already owns rather than writing a check, and that is how the $44 a year gets covered. That is in-kind.</p>
      <p>And an in-kind deal can be worth more than a check, because the partner gives at its own cost instead of at the price everyone else has to pay.</p>
      </div>
      <hr>
      <h3>5 of 6 &middot; MEDIA AND PUBLISHERS</h3>
      <p>Think of a documentary you still remember years later, or a magazine that made a hard subject feel easy. That is media and publishing: organizations whose whole business is making things for people to read or watch. Films, books, magazines, television. All day, every day, they work on one problem you care about too: how do you explain something so well that a stranger keeps watching? Get that right and people learn without noticing they are learning.</p>
      <p class="s">You have probably come across one of these: <b>National Geographic</b>, <b>PBS</b>, <b>Scholastic</b>.</p>
      <h4>So what kind of deal could Khan Academy do here?</h4>
      <p>Follow the money here and it goes one way. They get paid for what they make: a ticket, a subscription, a book on a shelf. The money comes out of the thing itself.</p>
      <p>So what they have lying around is not spare cash. It is the made thing, and the people who know how to make it.</p>
      <p>That points at <b>co-creation</b>, the fourth of the four kinds: a partner sends its own people and its own IP to help build the thing. <b>IP</b> means the characters, stories, film footage and artwork a company owns and nobody else is allowed to use. In this category, the IP is the whole business.</p>
      <h4>And one already exists: Disney and Pixar</h4>
      <p>Sit someone down for a lesson on ratios and you will lose them fast. Ask them instead how an animator times a character's bounce, or how a wave is made to look like water, and they will keep listening.</p>
      <p>Pixar in a Box is a course on Khan Academy that teaches real school subjects, math and animation among them. It is free and it is live. You can open it after this and work through the whole thing.</p>
      <p>And Pixar's name is on it.</p>
      <p class="s">Source: <a href="https://www.khanacademy.org/computing/pixar">Pixar in a Box</a></p>
      <div class="a">
        <p><b>So which way did the value move?</b> Pixar in a Box is a free Khan Academy course teaching math and animation, and Pixar's name is on it.</p>
        <p><b>Both of the first two are right.</b></p>
        <p class="s">Correct: The partner gave money / The partner gave something it already owned</p>
        <p>Pixar's name is on the course, which is sponsorship, and a company paying for a course it puts its name on is money. Pixar's own people and its own material also went into building it, which is co-creation, and that is something Pixar already had. This deal is doing two things at once.</p>
      <p>Co-creation is in-kind's close cousin: what moves is something the partner already owns, and what makes it co-creation is that the partner's own people come with it.</p>
      <p>No money figure has ever been published for this one, in either direction. Not knowing the money is normal. It is not a hole in your research.</p>
      </div>
      <hr>
      <h3>6 of 6 &middot; MONEY AND CONSUMER BRANDS</h3>
      <p>Ever tapped a card at a checkout, or walked past a store with more branches than you could count? Those are money and consumer brands: banks, card companies and big stores. What they share is who their customers are. Not governments, not other businesses. Ordinary people, handling their own money, one decision at a time. Which makes you the customer, and means you will be dealing with a company like this for the rest of your life.</p>
      <p class="s">You have probably seen one of these: <b>Visa</b>, <b>Bank of America</b>.</p>
      <h4>So what kind of deal could Khan Academy do here?</h4>
      <p>Start with who these companies serve. Ordinary people, handling money they have to make real decisions about: borrowing, saving, interest. <b>Interest</b> is the extra you pay for borrowing, or the extra you get paid for saving.</p>
      <p>Someone who understands borrowing, saving and interest is a better customer for a bank: more likely to pay back what they borrow, and more likely to stay.</p>
      <p>These companies also carry real marketing budgets, meaning money set aside to get their name in front of people. So there is cash here, and a reason to spend it on teaching.</p>
      <p>Which points at <b>sponsorship</b> again, the same shape as the employers category: a partner funds a course and gets its name on it.</p>
      <h4>And one already exists: Walmart</h4>
      <p>Nobody sits you down and explains what happens to a credit card bill when you only pay part of it. Or what the interest on a loan adds up to over years. Then one day you are the one signing.</p>
      <p>That is what a financial literacy course is for: the money decisions you will really have to make, like budgeting, saving, borrowing, and reading what you are agreeing to before you agree to it.</p>
      <p>Khan Academy has one, and Walmart's name has been on it since July 2023.</p>
      <p class="s">Source: <a href="https://www.khanacademy.org/college-careers-more/financial-literacy">Khan Academy financial literacy</a></p>
      <div class="a">
        <p><b>So which way did the value move?</b> Khan Academy has a financial literacy course, and Walmart's name has been on it since July 2023.</p>
        <p><b>The partner gave money.</b></p>
        <p class="s"></p>
        <p>Walmart is a founding sponsor of the course, which is the label for a partner that was in from the beginning rather than one that joined later. A company pays for a free course and gets its name on it, and that is sponsorship, one of the four kinds.</p>
      <p>The amount has never been published, so you know the direction without knowing the size. Direction is the useful half anyway: it tells you what this partner was willing to do, which is what you need before you go asking anyone for anything.</p>
      </div>
      <hr>
      <h3>Kian's six categories, in one place.</h3>
      <ol><li>Education technology</li><li>Exams and qualifications</li><li>Employers and jobs</li><li>AI and cloud computing</li><li>Media and publishers</li><li>Money and consumer brands</li></ol>
      <p>These are Kian's six, and they are not the only six. He picked the places he could see. Somebody else on this team would have drawn a different list, and so will you, once you start looking properly.</p>

  /* ---------------- scale the fixed canvas down to fit, never up ---------------- */
  var stage = document.getElementById("stage");
  /* MIN_SCALE IS A READABILITY FLOOR, NOT A STYLE CHOICE. fit() takes the
     window height into account, and a Notion embed's height is dragged by
     whoever placed it. Left short, the old unbounded scale rendered the
     smallest type at 6.7px in a 300px tall frame and 4.4px in a 200px one:
     measured by technical QA, 8 September 2026. Below the floor the deck stops
     shrinking and the embed scrolls, which is recoverable. Unreadable is not.
     0.72 keeps 18.5px body copy at 13.3px, which is the smallest this deck is
     allowed to get. */
  var MIN_SCALE = 0.72;
  function fit(){
    if(window.matchMedia("(max-width:599px)").matches){
      stage.style.transform = "";
      document.body.style.overflowY = "";
      return;
    }
    var s = Math.min(window.innerWidth / 960, window.innerHeight / 540, 1);
    if(s < MIN_SCALE) s = MIN_SCALE;
    stage.style.transform = "scale(" + s + ")";
    /* Only when the floor bites does the frame need to scroll. */
    document.body.style.overflowY = (540 * s > window.innerHeight) ? "auto" : "";
  }
  window.addEventListener("resize", fit);

  render();
  fit();

  /* ---------------- the QA hook ----------------
     measure-fit.mjs steps the deck with this. Without it only slide 1 can be
     measured, which is exactly how an overflowing slide ships. commit() exists
     so the measurer can see a revealed ask slide, which is the tallest state
     any slide in this deck reaches. */
  window.__ex = {
    goto:function(n){
      if(!Number.isInteger(n) || n < 0 || n >= S.length) return false;
      i = n; render(); return true;
    },
    slides:S.length,
    commit:function(n){
      var s = S[i];
      if(s.kind !== "ask") return false;
      /* Range-checked: an out-of-range index used to paint the verdict strip
         with the literal word "undefined". n is an OPTION index, not a slide
         index, which is the mistake it invites. */
      if(typeof n === "number" && !(n >= 0 && n < OPTS.length)) return false;
      picked[s.id] = (typeof n === "number") ? n : s.answers[0];
      render(); return true;
    },
    commitAll:function(){
      S.forEach(function(s){ if(s.kind === "ask") picked[s.id] = s.answers[0]; });
      render(); return true;
    },
    reset:function(){ picked = {}; i = 0; render(); },
    state:function(){ return { i:i, theme:S[i].theme, kind:S[i].kind,
                               picked:picked[S[i].id] }; }
  };
})();
</script>
</body>
</html>
