<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Pizza Ad Scorecard — CTR, CPC, ROI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FDF8F8; --highlight: #DCE1FF; --accent: #001D69;
    --title: #1C1B1B; --body: #484646; --white: #FFFFFF;
    --grey-text: #6E6E73; --grey-surface: #F1F1F4; --grey-border: #E2E2E6;
    --ok: #1B7A5A; --ok-bg: #E9F5EF; --ok-border: #BFE3D3;
    --red: #B42318; --red-bg: #FBEDED; --red-border: #F3C9C9;
  }
  * { box-sizing: border-box; }
  html, body {
    background: transparent; margin: 0; padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--body); -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 14px; }
  .card { position: relative; background: var(--white); border: 1px solid #E8E8EC;
    border-radius: 18px; padding: 22px 26px; box-shadow: 0 6px 20px rgba(0,0,0,.06); }
  .eyebrow { display: inline-block; font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);
    background: var(--highlight); padding: 5px 12px; border-radius: 999px; margin: 0 0 10px; }
  h1 { font-size: 1.24rem; font-weight: 800; color: var(--title); margin: 0 0 6px; line-height: 1.3; }
  .lead { font-size: 0.9rem; line-height: 1.55; color: var(--body); margin: 0 0 16px; }
  .lead b { color: var(--title); font-weight: 700; }

  .trackbar { display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin: 0 0 16px; padding-bottom: 14px; border-bottom: 1px solid var(--grey-border); }
  .dots { display: flex; gap: 8px; }
  .dot { width: 11px; height: 11px; border-radius: 999px; background: var(--grey-surface);
    border: 1.5px solid var(--grey-border); transition: background .15s, border-color .15s, transform .15s; }
  .dot.done { background: var(--ok); border-color: var(--ok); }
  .dot.current { border-color: var(--accent); transform: scale(1.25); }
  .progress { font-size: 0.78rem; font-weight: 700; color: var(--grey-text); }
  .progress b { color: var(--accent); }

  /* scenario facts */
  .facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 0 0 6px; }
  .fact { display: flex; align-items: center; gap: 11px; background: var(--bg);
    border: 1px solid var(--grey-border); border-radius: 12px; padding: 12px 14px; }
  .fact .fe { font-size: 1.6rem; line-height: 1; }
  .fact .fv { font-size: 1.15rem; font-weight: 800; color: var(--accent); }
  .fact .fl { font-size: 0.74rem; color: var(--grey-text); }

  .qbox { font-size: 1.02rem; font-weight: 700; color: var(--title); margin: 2px 0 12px; }
  .metric-name { display: inline-block; font-size: 0.72rem; font-weight: 800;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent);
    background: var(--highlight); padding: 4px 11px; border-radius: 999px; margin: 0 0 8px; }

  .result { margin: 4px 0 0; padding: 16px; border-radius: 14px; text-align: center;
    background: var(--ok-bg); border: 1px solid var(--ok-border); }
  .result.bad { background: var(--red-bg); border-color: var(--red-border); }
  .result .rform { font-size: 0.95rem; font-weight: 600; color: var(--body); }
  .result .rbig { font-size: 1.9rem; font-weight: 800; color: var(--ok); margin-top: 4px; }
  .result.bad .rbig { color: var(--red); }
  .result .rcap { font-size: 0.84rem; color: var(--body); margin-top: 8px; line-height: 1.5; }

  /* recap table */
  .recap { width: 100%; border-collapse: collapse; margin: 6px 0 0; font-size: 0.84rem; }
  .recap th, .recap td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--grey-border); vertical-align: top; }
  .recap th { color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: .02em; font-size: 0.68rem; }
  .recap td:first-child { font-weight: 800; color: var(--title); white-space: nowrap; }
  .recap tr:last-child td { border-bottom: none; }
  .takeaway { margin: 16px 0 0; padding: 14px 16px; border-radius: 12px;
    background: var(--highlight); color: var(--accent); font-size: 0.88rem; line-height: 1.6; }
  .takeaway b { font-weight: 800; }

  .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
  .nav .hint { font-size: 0.78rem; color: var(--grey-text); }
  .btn { font-family: inherit; font-size: 0.86rem; font-weight: 700; padding: 9px 18px;
    border-radius: 10px; cursor: pointer; border: 1.5px solid var(--grey-border);
    background: var(--white); color: var(--title); transition: transform .12s, box-shadow .12s, opacity .12s; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.08); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.ghost { visibility: hidden; }
  .center { text-align: center; }

  @media (max-width: 520px) { .facts { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .btn:hover, .dot { transition: none !important; transform: none !important; } }
</style>
</head>
<body>
  <div class="wrap"><div class="card" id="stage"></div></div>
  <script>
    // Tony's Pizza flyer ad
    var FACTS = [
      { e: '👀', v: '1,000', l: 'people saw the flyer (views)' },
      { e: '🚶', v: '20',    l: 'walked in (clicks)' },
      { e: '🍕', v: '5',     l: 'bought a $30 pizza ($150 back)' },
      { e: '💵', v: '$200',  l: 'spent on flyers' }
    ];

    // The three metrics, each answers one question
    var METRICS = [
      { name: 'CTR · Click-Through Rate',
        q: 'Question 1: was the flyer good at getting attention?',
        form: 'CTR = walk-ins ÷ views = 20 ÷ 1,000',
        big: '2%',
        cap: 'Two out of every hundred people who saw the flyer walked in. CTR measures how well the ad grabs attention. Higher is better.',
        bad: false },
      { name: 'CPC · Cost Per Click',
        q: 'Question 2: what did each visitor cost?',
        form: 'CPC = spend ÷ walk-ins = $200 ÷ 20',
        big: '$10',
        cap: 'Every person who walked in cost $10 in flyer money. CPC measures how expensive each visitor is. Lower is better.',
        bad: false },
      { name: 'ROI · Return on Investment',
        q: 'Question 3: did the whole thing pay off?',
        form: 'ROI = (money back − money spent) ÷ spent = ($150 − $200) ÷ $200',
        big: '−25%',
        cap: '5 people bought a $30 pizza, so $150 came back on $200 spent. You lost $50. ROI measures whether the ad actually made money. This one did not.',
        bad: true }
    ];

    var idx = 0;                 // 0 intro, 1-3 metrics, 4 recap
    var revealed = [false, false, false];

    (function () {
      var q = new URLSearchParams(location.search);
      if (q.has('idx')) {
        idx = parseInt(q.get('idx'), 10) || 0;
        for (var k = 1; k < idx; k++) if (k <= 3) revealed[k - 1] = true;
        if (q.get('rev') === '1' && idx >= 1 && idx <= 3) revealed[idx - 1] = true;
      }
    })();

    var stage = document.getElementById('stage');

    function dots() {
      var h = '<div class="dots">';
      for (var i = 0; i < 4; i++) {
        var c = 'dot';
        if (i < idx) c += ' done';
        if (i === idx) c += ' current';
        h += '<span class="' + c + '"></span>';
      }
      return h + '</div>';
    }
    function nav(enabled, label, showBack, hint) {
      var back = showBack ? '<button class="btn" data-nav="back">&larr; Back</button>'
                          : '<button class="btn ghost">&larr; Back</button>';
      var hn = enabled ? '' : '<span class="hint">' + (hint || '') + '</span>';
      var next = label
        ? (enabled ? '<button class="btn primary" data-nav="next">' + label + '</button>'
                   : '<button class="btn primary" disabled>' + label + '</button>')
        : '<button class="btn ghost">x</button>';
      return '<div class="nav">' + back + hn + next + '</div>';
    }
    function factsHTML() {
      var h = '<div class="facts">';
      for (var i = 0; i < FACTS.length; i++)
        h += '<div class="fact"><span class="fe">' + FACTS[i].e + '</span><div><div class="fv">' + FACTS[i].v + '</div><div class="fl">' + FACTS[i].l + '</div></div></div>';
      return h + '</div>';
    }

    function renderIntro() {
      var h = '';
      h += '<span class="eyebrow">🍕 The pizza ad scorecard</span>';
      h += '<h1>Did this ad actually work?</h1>';
      h += '<p class="lead">Tony ran a <b>pizza flyer</b> last week. Here is what happened. Three little numbers tell you whether it worked — and they tell three different stories.</p>';
      h += factsHTML();
      h += nav(true, 'Number 1 &rarr;', false, '');
      stage.innerHTML = h;
    }

    function renderMetric() {
      var m = METRICS[idx - 1];
      var rev = revealed[idx - 1];
      var h = '';
      h += '<span class="eyebrow">🍕 The pizza ad scorecard</span>';
      h += '<div class="trackbar">' + dots() + '<span class="progress">Number <b>' + idx + '</b> / 3</span></div>';
      h += '<span class="metric-name">' + m.name + '</span>';
      h += '<p class="qbox">' + m.q + '</p>';
      if (!rev) {
        h += '<p class="lead">' + m.form.split(' = ')[0] + ' — tap to work it out on Tony\'s numbers.</p>';
        h += '<div class="nav"><button class="btn" data-nav="back">&larr; Back</button><button class="btn primary" data-reveal="1">Work it out 🧮</button></div>';
      } else {
        h += '<div class="result' + (m.bad ? ' bad' : '') + '"><div class="rform">' + m.form + '</div><div class="rbig">' + m.big + '</div><div class="rcap">' + m.cap + '</div></div>';
        var label = (idx === 3) ? 'See all three &rarr;' : 'Next number &rarr;';
        h += nav(true, label, true, '');
      }
      stage.innerHTML = h;
    }

    function renderRecap() {
      var h = '';
      h += '<span class="eyebrow">🍕 The pizza ad scorecard</span>';
      h += '<h1>Three numbers, three stories</h1>';
      h += '<p class="lead">Each one answers a different question about the same ad:</p>';
      h += '<table class="recap"><thead><tr><th>Metric</th><th>Answers</th><th>Tony\'s ad</th></tr></thead><tbody>';
      h += '<tr><td>CTR</td><td>Was it good at getting attention?</td><td>2%</td></tr>';
      h += '<tr><td>CPC</td><td>What did each visitor cost?</td><td>$10</td></tr>';
      h += '<tr><td>ROI</td><td>Did it make money?</td><td>−25% (lost $50)</td></tr>';
      h += '</tbody></table>';
      h += '<div class="takeaway">A high CTR can still lose money — Tony\'s flyer grabbed attention but didn\'t pay off. That\'s why you read all three. <b>For Breaking Games, CTR and CPC are already computed in <code>meta_campaigns</code>. ROI is the hard one</b>, because you can\'t see which sale came from which ad.</div>';
      h += nav(false, null, true, '');
      stage.innerHTML = h;
    }

    function render() {
      if (idx === 0) renderIntro();
      else if (idx === 4) renderRecap();
      else renderMetric();
    }

    stage.addEventListener('click', function (e) {
      var rev = e.target.closest ? e.target.closest('[data-reveal]') : null;
      var n   = e.target.closest ? e.target.closest('[data-nav]') : null;
      if (rev) { revealed[idx - 1] = true; render(); }
      else if (n) {
        var dir = n.getAttribute('data-nav');
        if (dir === 'next' && idx < 4) idx++;
        else if (dir === 'back' && idx > 0) idx--;
        render();
      }
    });

    render();
  </script>
</body>
</html>
