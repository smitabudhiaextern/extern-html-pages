<template id="s2">
  <p class="p">But here's the catch: PDFs and tables don't really speak the same language. What looks beautifully structured to a human can fall apart in code. Rows split in weird places, columns collapse, and some cell values vanish completely. So when PyMuPDF scans a table, it often just sees a bunch of scattered text blocks with no connection between them. That's why table extraction can feel so chaotic.</p>
  <p class="p">Multiply that confusion across dozens of rows, and things get messy fast. But don't worry, we've got the tools to decode this.</p>
  <div class="note"><span class="num">BEFORE YOU START: READ THIS</span>
    <p>Before we get into the code, take a few minutes to review this <a href="https://medium.com/@pymupdf/solving-common-issues-with-table-detection-and-extraction-4df5de2b8d88" target="_blank" rel="noopener noreferrer">guide from PyMuPDF</a> (it opens in a new tab). It walks through common issues and good practices. Bookmark it: it'll come in handy when your tables aren't behaving.</p></div>
  <p class="p">Meet your new best friend: <code>page.find_tables()</code>. This method does exactly what it says. It scans the page for table-shaped structures and, if it finds any, gives you the 4 things you saw in Learn card 2.</p>
  <p class="p">Add a new code cell at the bottom of your notebook, paste this in and press <b>Run</b>:</p>
  {{CODE:python:page = doc[2]
tables = page.find_tables()
print(f"Tables found: {len(tables.tables)}")}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>doc[2]</code> is page 3.</li>
    <li><code>tables.tables</code> is the list of tables that <code>find_tables()</code> found, and <code>len()</code> counts the items in a list, so the last line prints how many tables are on page 3.</li>
  </ul>
</template>

<template id="s2b">
  {{SHOT:2}}
  <p class="p">The 2 tables are the test results table and the product details box at the top of page 3, which Colab's PyMuPDF counts as a table too, because a small AI inside it spots tables from how the words line up.</p>
  <p class="p">If you're lucky, PyMuPDF gives you an entire table ready to explore. Nice. But just knowing how many tables exist isn't enough. We want the content, cell by cell.</p>
  <p class="p">So, how do you turn that chaos into clean, structured data? This is where bounding boxes meet strategy. You'll go <b>cell by cell</b>, using <b>table metadata</b> (facts about the table, such as how many rows it has) and <b>spatial logic</b> (rules about where things sit on the page) to rebuild the grid and extract exactly what you need, whether it's test names, test methods or results. Let's break it down.</p>
</template>

<template id="s3">
  <p class="p">Let's write a function that grabs each table, digs into its cells, and captures the text inside, based on each cell's bounding box. Add a new code cell, paste this in, and press <b>Run</b>. Here's the full code for a clean, cell-level extraction:</p>
  {{CODE:pysmall:def extract_tables_with_bbox(pdf_path):
    doc = pymupdf.open(pdf_path)
    results = []
    for page_num in range(len(doc)):
        page = doc[page_num]
        tables = page.find_tables()
        for i, table in enumerate(tables.tables):
            # Get table bounding box
            table_bbox = table.bbox  # (x0, y0, x1, y1)
            # Extract table content with cell bounding boxes
            table_data = []
            cell_bboxes = []
            for row in table.rows:
                row_data = []
                row_bboxes = []
                for cell_bbox in row.cells:
                    # Get cell bounding box (if cell exists)
                    if cell_bbox is not None:
                        # Get text from this cell by cropping the page to cell area
                        cell_text = page.get_text("text", clip=cell_bbox).strip()
                        row_data.append(cell_text)
                        row_bboxes.append(cell_bbox)
                    else:
                        row_data.append("")
                        row_bboxes.append(None)
                table_data.append(row_data)
                cell_bboxes.append(row_bboxes)
            results.append({
                'page': page_num,
                'table_index': i,
                'bbox': table_bbox,
                'data': table_data,
                'cell_bboxes': cell_bboxes
            })
    doc.close()
    return results}}
</template>

<template id="s3b">
  <p class="p"><b>What this does:</b></p>
  <ul class="list">
    <li>Walks through every page and table</li>
    <li>Grabs the text from each cell area using <code>get_text("text", clip=cell_bbox)</code></li>
    <li>Stores the content and layout so you can reconstruct or analyze the table later</li>
    <li><code>for row in table.rows:</code> and <code>for cell_bbox in row.cells:</code> are the two loops that go along each row, cell by cell, then down to the next row. <code>.strip()</code> removes the line break at the end of each cell's text.</li>
  </ul>
</template>

<template id="s4">
  <p class="p">You've got your loop running. You're extracting cells. The table structure is coming together. But before you celebrate, pause.</p>
  <p class="p">Just because your code didn't crash doesn't mean it did what you expected. Sometimes your output <i>looks</i> like a table, but it's secretly full of holes, misaligned rows, or missing text. This is where debugging becomes your best friend.</p>
  <p class="p">Once you start extracting tables, make a habit of printing your results. Just because the function runs doesn't mean the data makes sense. Add a new code cell, paste this in, and press <b>Run</b>:</p>
  {{CODE:python:results = extract_tables_with_bbox("sample-sdf-document.pdf")
for table in results:
    if table['page'] == 2 and table['table_index'] == 0:
        for row in table['data']:
            print(row)}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li>The first line runs your function on the supplier file. <code>results</code> holds one <b>dictionary</b> (a set of labels, each with a value) for every table it found: 1 on page 1 and 2 on page 3.</li>
    <li>The <code>if</code> line keeps only the table you want. <code>table['page'] == 2</code> means page 3, and <code>table['table_index'] == 0</code> means the first table found there: the test results table. <code>==</code> checks if two values are equal, and <code>and</code> means both must be true.</li>
    <li><code>table['data']</code> holds that table's rows, and <code>print(row)</code> prints them one by one.</li>
  </ul>

  function scaleStage() {

  /* Copy: the clipboard first, then the older copy command, then select the code so Ctrl+C works */
  function copyText(text, btn, pre) {
    var label = btn.querySelector("span");
    function done(msg, ok) { label.textContent = msg; btn.classList.toggle("ok", ok); setTimeout(function () { label.textContent = "Copy"; btn.classList.remove("ok"); }, 1800); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done("Copied", true); return; }
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      done("Press Ctrl+C", false);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done("Copied", true); }).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }

  /* Spacing (Smita, 17 November 2026): no big empty area at the bottom of a slide. Spare height widens the gaps
     between blocks, up to 2x. The Colab screenshots already run the full width of the card, so they don't grow. */
  function space() {
    var inner = card.querySelector(".inner");
    if (!inner) return;
    inner.style.gap = "";
    var cs = getComputedStyle(card);
    var avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spare = avail - inner.offsetHeight;
    var base = parseFloat(getComputedStyle(inner).rowGap) || 14;
    var gaps = Array.prototype.filter.call(inner.children, function (c) { return c.offsetHeight > 0; }).length - 1;
    if (spare > 0 && gaps > 0) inner.style.gap = (base + Math.min(base, spare / gaps)) + "px";
  }
