<template id="st3a">
  <p class="p">But here's the catch: PDFs and tables don't really speak the same language. What looks beautifully structured to a human can fall apart in code. Rows split in weird places, columns collapse, and some cell values vanish completely. So when PyMuPDF scans a table, it often just sees a bunch of scattered text blocks with no connection between them. That's why table extraction can feel so chaotic.</p>
  <p class="p">Multiply that confusion across dozens of rows, and things get messy fast. But don't worry, we've got the tools to decode this.</p>
  <p class="p">Press <b>Run</b> on the cell that starts with <code class="nw"># STEP 3</code>:</p>
  {{CELL:# STEP 3: Import PyMuPDF and extract tables
import pymupdf  # PyMuPDF}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li><code>import pymupdf</code> loads PyMuPDF, so the cells below it can use it.</li>
  </ul>
  {{SHOT:3}}
  <p class="p">This cell prints nothing. A green tick next to it means it ran.</p>
</template>

<template id="st3b">
  <p class="p">Meet your new best friend: <code>page.find_tables()</code>. This method does exactly what it says. It scans the page for table-shaped structures and, if it finds any, gives you the 4 things you saw in Learn card 2.</p>
  <p class="p">Here's a peek under the hood. Click the <code class="nw"># STEP 3</code> cell, then click <b>+ Code</b> at the top of the notebook. A new code cell appears under it. Paste this in and press <b>Run</b>:</p>
  {{NEWCELL:doc = pymupdf.open("foo.pdf")
page = doc[0]
tables = page.find_tables()
print(f"Tables found: {len(tables.tables)}")}}
  <p class="p"><b>What this code does:</b></p>
  <ul class="list">
    <li>The first line opens <code>foo.pdf</code> and keeps it as <code>doc</code>.</li>
    <li><code>doc[0]</code> is the first page, the only one in <code>foo.pdf</code>.</li>
    <li><code>tables.tables</code> is the list of tables that <code>find_tables()</code> found, and <code>len()</code> counts the items in a list, so the last line prints how many tables are on that page.</li>
  </ul>
</template>

<template id="st3bb">
  {{SHOT:3b}}
  <p class="p">If you're lucky, PyMuPDF gives you an entire table ready to explore. Nice. But just knowing how many tables exist isn't enough. We want the content, cell by cell.</p>
  <p class="p">So, how do you turn that chaos into clean, structured data? This is where bounding boxes meet strategy. You'll go <b>cell by cell</b>, using <b>table metadata</b> (facts about the table, such as how many rows it has) and <b>spatial logic</b> (rules about where things sit on the page) to rebuild the grid and extract exactly what you need, whether it's <b>lot numbers, dosage values, or expiration dates.</b> Let's break it down.</p>
</template>

<template id="st3c">
  <p class="p">Let's write a function that grabs each table, digs into its cells, and captures the text inside, based on each cell's bounding box. Here's the full code for a clean, cell-level extraction. Press <b>Run</b> on the cell that starts with <code>def extract_tables_with_bbox</code>:</p>
  {{CELLSMALL:def extract_tables_with_bbox(pdf_path):
    doc = pymupdf.open(pdf_path)
    results = []

    for page_num in range(len(doc)):
        page = doc[page_num]
        tables = page.find_tables()

        for i, table in enumerate(tables.tables):
            table_bbox = table.bbox
            table_data = []
            cell_bboxes = []

            for row in table.rows:
                row_data = []
                row_bboxes = []

                for cell_bbox in row.cells:
                    if cell_bbox is not None:
                        cell_text = page.get_text("text", clip=cell_bbox).strip()
                        row_data.append(cell_text)
                        row_bboxes.append(cell_bbox)
                    else:
                        row_data.append("")
                        row_bboxes.append(None)

                table_data.append(row_data)
                cell_bboxes.append(row_bboxes)

            results.append({
                'page': page_num,
                'table_index': i,
                'bbox': table_bbox,
                'data': table_data,
                'cell_bboxes': cell_bboxes
            })

    doc.close()
    return results}}
</template>
